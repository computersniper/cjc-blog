<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{
      --bg:#0e0e0e; --bg2:#161616; --card:#1a1a1a; --ink:#f5f5f5; --muted:#9b9b9b; --dim:#6a6a6a;
      --lime:#c8ff00; --lime-d:#a6d600; --gold:#e0b64a; --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.18);
      --maxw:1200px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      -webkit-font-smoothing:antialiased;line-height:1.55;overflow-x:hidden}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    .wrap{max-width:var(--maxw);margin:0 auto;padding:0 26px}
    .display{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.005em;text-transform:uppercase;line-height:.9}
    .sig{font-family:'Caveat',cursive}

    /* nav */
    .nav{position:fixed;top:0;left:0;right:0;z-index:900;backdrop-filter:blur(12px);
      background:rgba(14,14,14,.72);border-bottom:1px solid var(--line);transition:background .2s}
    .nav .row{display:flex;align-items:center;justify-content:space-between;height:58px;padding-right:214px}
    .logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:15px;letter-spacing:.02em}
    .logo .mark{width:30px;height:30px;border-radius:7px;background:var(--lime);color:#0e0e0e;display:grid;place-items:center;
      font-family:'Anton';font-size:15px;transform:skewX(-8deg)}
    .navlinks{display:flex;gap:24px}
    .navlinks a{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);transition:color .15s}
    .navlinks a:hover{color:var(--lime)}
    @media(max-width:900px){.nav .row{padding-right:150px}.navlinks{display:none}}
    @media(max-width:520px){.nav .row{padding-right:120px}}

    section{padding:96px 0;position:relative}
    .kicker{display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--lime);margin-bottom:16px}
    .kicker::before{content:"";width:26px;height:2px;background:var(--lime)}
    .stitle{font-size:clamp(30px,6vw,66px)}
    .num{font-family:'Anton';color:var(--dim);font-size:15px;letter-spacing:.1em}
    .reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}
    .reveal.in{opacity:1;transform:none}

    /* hero */
    .hero{min-height:100vh;display:flex;align-items:flex-end;padding:120px 0 60px;position:relative;overflow:hidden}
    .hero .grid{display:grid;grid-template-columns:1.25fr .75fr;gap:30px;align-items:end;width:100%}
    .hero .num66{position:absolute;top:8%;right:2%;font-family:'Anton';font-size:min(46vh,420px);line-height:.8;
      color:transparent;-webkit-text-stroke:2px rgba(200,255,0,.16);z-index:0;pointer-events:none;user-select:none}
    .hero .inner{position:relative;z-index:2}
    .hero .hi{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
    .hero .signame{font-family:'Caveat';color:var(--lime);font-size:clamp(26px,4vw,40px);font-weight:700;margin:4px 0 -6px;transform:rotate(-3deg);display:inline-block}
    .hero h1{font-family:'Anton';text-transform:uppercase;font-size:clamp(58px,13.5vw,168px);line-height:.82;letter-spacing:.004em;margin:6px 0 0}
    .hero h1 .stroke{color:transparent;-webkit-text-stroke:2px var(--ink)}
    .hero .tag{font-size:clamp(16px,2vw,20px);color:var(--muted);margin-top:20px;max-width:40ch}
    .hero .tag b{color:var(--ink)}
    .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
    .btn{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;border-radius:999px;font-weight:700;font-size:14px;letter-spacing:.02em;
      border:2px solid transparent;transition:transform .15s,background .15s,color .15s,border-color .15s}
    .btn.lime{background:var(--lime);color:#0e0e0e}
    .btn.lime:hover{transform:translateY(-2px)}
    .btn.ghost{border-color:var(--line2);color:var(--ink)}
    .btn.ghost:hover{border-color:var(--lime);color:var(--lime);transform:translateY(-2px)}
    .hero .portrait{position:relative;justify-self:end;width:min(360px,80vw);aspect-ratio:4/5;border-radius:16px;overflow:hidden;
      border:1px solid var(--line2);box-shadow:0 30px 70px rgba(0,0,0,.5)}
    .hero .portrait img{width:100%;height:100%;object-fit:cover;filter:grayscale(.15) contrast(1.03)}
    .hero .portrait .tape{position:absolute;left:-8px;top:18px;background:var(--lime);color:#0e0e0e;font-family:'Anton';
      font-size:13px;letter-spacing:.1em;padding:6px 14px;transform:rotate(-4deg)}
    .hero .portrait .flag{position:absolute;right:10px;bottom:10px;width:34px;height:22px;
      background:conic-gradient(#000 90deg,#fff 0 180deg,#000 0 270deg,#fff 0)0/11px 11px;border:2px solid #fff;border-radius:3px}
    @media(max-width:860px){.hero .grid{grid-template-columns:1fr}.hero .portrait{justify-self:start;order:-1;width:min(240px,60vw)}}

    /* marquee */
    .marquee{background:var(--lime);color:#0e0e0e;overflow:hidden;white-space:nowrap;border-top:2px solid #0e0e0e;border-bottom:2px solid #0e0e0e}
    .marquee .track{display:inline-block;padding:12px 0;font-family:'Anton';font-size:20px;letter-spacing:.04em;text-transform:uppercase;animation:mq 26s linear infinite}
    .marquee .track span{padding:0 20px}
    .marquee .track span i{opacity:.5}
    @keyframes mq{to{transform:translateX(-50%)}}

    /* about */
    .about{display:grid;grid-template-columns:1fr 300px;gap:40px;align-items:center}
    .about p{margin:0 0 16px;font-size:16.5px;color:#d6d6d6;max-width:60ch}
    .about .pic{border-radius:14px;overflow:hidden;border:1px solid var(--line2);aspect-ratio:4/5}
    .about .pic img{width:100%;height:100%;object-fit:cover;filter:grayscale(.1)}
    @media(max-width:760px){.about{grid-template-columns:1fr}}

    /* skills chips */
    .kit{display:flex;flex-wrap:wrap;gap:12px}
    .kit .chip{display:inline-flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;
      padding:14px 18px;font-weight:700;font-size:15px;transition:.15s}
    .kit .chip i{color:var(--lime)}
    .kit .chip:hover{border-color:var(--lime);transform:translateY(-3px)}
    .kitlines{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:22px;color:var(--muted);font-size:14px}
    .kitlines span::before{content:"—";color:var(--lime);margin-right:8px}

    /* timeline */
    .tl{border-left:2px solid var(--line);margin-left:6px}
    .tl .item{position:relative;padding:0 0 26px 30px}
    .tl .item::before{content:"";position:absolute;left:-8px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px var(--bg)}
    .tl .when{font-family:'Anton';color:var(--lime);font-size:14px;letter-spacing:.06em}
    .tl h4{margin:4px 0 4px;font-size:19px;font-weight:800}
    .tl .sub{color:var(--muted);font-size:14.5px}
    .tl ul{margin:10px 0 0;padding-left:18px;color:#c8c8c8;font-size:14px}
    .tl ul li{margin-bottom:6px}

    /* gallery / cards */
    .gallery{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 0 16px;scrollbar-width:thin}
    .gallery::-webkit-scrollbar{height:8px}.gallery::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
    .gcard{flex:0 0 340px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
      display:flex;flex-direction:column;transition:transform .18s,border-color .18s}
    .gcard:hover{transform:translateY(-5px);border-color:var(--lime)}
    .gcard .cover{height:180px;background:#111;overflow:hidden;position:relative}
    .gcard .cover img{width:100%;height:100%;object-fit:cover}
    .gcard .n{position:absolute;top:10px;left:12px;font-family:'Anton';font-size:34px;color:var(--lime);-webkit-text-stroke:1px #0e0e0e;line-height:1}
    .gcard .cb{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
    .gcard .tech{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--lime)}
    .gcard h4{margin:0;font-size:18px;font-weight:800;line-height:1.2}
    .gcard p{margin:0;color:var(--muted);font-size:13.5px;flex:1}
    .gcard .go{font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
    .gcard .go i{color:var(--lime)}
    .hint{color:var(--dim);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-top:6px}

    .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
    .filters button{background:transparent;border:1.5px solid var(--line2);color:var(--muted);font-family:inherit;font-weight:600;font-size:12.5px;
      padding:8px 16px;border-radius:999px;cursor:pointer;transition:.15s}
    .filters button.active,.filters button:hover{background:var(--lime);border-color:var(--lime);color:#0e0e0e}
    .jgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .jcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:.18s}
    .jcard:hover{border-color:var(--lime);transform:translateY(-4px)}
    .jcard .cover{height:150px;overflow:hidden;background:#111}
    .jcard .cover img{width:100%;height:100%;object-fit:cover}
    .jcard .cb{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
    .jcard .meta{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--lime)}
    .jcard .meta .d{color:var(--dim)}
    .jcard h4{margin:0;font-size:16px;font-weight:700;line-height:1.25}
    .jcard p{margin:0;color:var(--muted);font-size:13px;flex:1}
    @media(max-width:860px){.jgrid{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.jgrid{grid-template-columns:1fr}}

    /* achievements gold */
    .achv{background:linear-gradient(180deg,rgba(224,182,74,.09),transparent);border:1px solid rgba(224,182,74,.28);border-radius:18px;padding:34px}
    .achv .a-head{color:var(--gold)}
    .achv .a-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px}
    .ach{display:grid;grid-template-columns:56px 1fr;gap:16px;align-items:center;padding:16px;border:1px solid rgba(224,182,74,.22);border-radius:12px;background:rgba(224,182,74,.04)}
    .ach .tr{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;background:rgba(224,182,74,.14);color:var(--gold);font-size:22px}
    .ach .m{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
    .ach h4{margin:5px 0 4px;font-size:16px;font-weight:800}
    .ach p{margin:0;color:var(--muted);font-size:13px}
    @media(max-width:620px){.achv .a-grid{grid-template-columns:1fr}}

    /* contact */
    .contact{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
    .contact .big{font-family:'Anton';text-transform:uppercase;font-size:clamp(34px,6vw,72px);line-height:.85;margin:0 0 20px}
    .contact .big em{font-style:normal;color:var(--lime)}
    .comm a{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-top:1px solid var(--line);font-weight:600}
    .comm a:first-child{border-top:0}
    .comm a .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
    .comm a .v{color:var(--lime)}
    form label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
    form input,form textarea{width:100%;background:#131313;border:1.5px solid var(--line2);border-radius:10px;color:var(--ink);
      font-family:inherit;font-size:14.5px;padding:13px 15px}
    form input:focus,form textarea:focus{outline:none;border-color:var(--lime)}
    form textarea{min-height:120px;resize:vertical}
    form .btn{margin-top:16px;cursor:pointer}
    #cf-status{margin-top:12px;font-size:13.5px;min-height:1em}
    @media(max-width:760px){.contact{grid-template-columns:1fr}}

    footer{position:relative;overflow:hidden;border-top:1px solid var(--line);padding:70px 0 50px}
    footer .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none}
    footer .b1{width:340px;height:340px;background:rgba(200,255,0,.22);left:-80px;bottom:-120px}
    footer .b2{width:280px;height:280px;background:rgba(224,182,74,.18);right:-60px;top:-100px}
    footer .fname{font-family:'Anton';text-transform:uppercase;font-size:clamp(48px,14vw,150px);line-height:.85;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.12);margin:0 0 26px}
    footer .frow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center;position:relative;z-index:2}
    .fsoc{display:flex;gap:18px;font-size:13px}
    .fsoc a:hover{color:var(--lime)}
    .fmeta{margin-top:16px;color:var(--dim);font-size:12px;display:flex;gap:8px 18px;flex-wrap:wrap;position:relative;z-index:2}
    .fmeta a:hover{color:var(--lime)}
    .load-note{color:var(--muted);font-size:14px;padding:16px 0}

    a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}html{scroll-behavior:auto}}
  </style>
</head>
<body>
  <div class="nav"><div class="wrap row">
    <a class="logo" href="#top"><span class="mark" id="mark">CJ</span><span id="brand"></span></a>
    <div class="navlinks" id="navlinks" role="navigation" aria-label="Sections"></div>
  </div></div>

  <div id="top"></div>
  <main id="app"></main>

  <footer><span class="blob b1"></span><span class="blob b2"></span><div class="wrap">
    <div class="fname" id="fname">CAI JIECHAO</div>
    <div class="frow">
      <div class="logo" style="font-size:16px"><span class="mark">CJ</span><span id="fbrand"></span></div>
      <div class="fsoc" id="fsoc"></div>
    </div>
    <div class="fmeta"><span id="fdesc"></span><a id="ficp" target="_blank" rel="noopener"></a></div>
  </div></footer>

  <script>window.THEME_ID = "66-racer";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let articles=[], projects=[], filterKey='all', night=false;

    const S = {
      story:{en:['01 · Off the grid','The Story'],zh:['01 · 关于','我的故事']},
      kit:{en:['02 · Loadout','The Kit'],zh:['02 · 装备','技术装备']},
      grid:{en:['03 · Career','The Grid'],zh:['03 · 履历','职业赛道']},
      track:{en:['04 · On Track','The Work'],zh:['04 · 赛道之上','作品项目']},
      journal:{en:['05 · Off Track','The Journal'],zh:['05 · 赛道之外','手记文章']},
      wins:{en:['06 · Podium','Achievements'],zh:['06 · 领奖台','荣誉成就']},
      contact:{en:['07 · Pit Wall','Get In Touch'],zh:['07 · 维修墙','联系我']},
      nStory:{en:'Story',zh:'故事'},nWork:{en:'Work',zh:'作品'},nJournal:{en:'Journal',zh:'手记'},nWins:{en:'Podium',zh:'荣誉'},nContact:{en:'Contact',zh:'联系'},
      marq:{en:['Software Developer','Agent & LLM Engineer','Full-Stack','Vibe-Coding','Guangzhou'],zh:['软件开发者','Agent 与大模型工程','全栈开发','Vibe-Coding','广州']},
    };
    const tr=o=>o[CJCData.lang()]||o.en;
    function head(key,tone){const l=tr(S[key]);return `<div class="reveal"><div class="kicker" ${tone?`style="color:${tone}"`:''}>${esc(l[0])}</div><h2 class="stitle display" ${tone?`style="color:${tone}"`:''}>${esc(l[1])}</h2></div>`;}

    function heroHTML(){
      const nm=t(P.name).toUpperCase();
      return `<section class="hero"><div class="wrap"><div class="num66">66</div><div class="grid">
        <div class="inner">
          <div class="hi">${esc(t(P.greeting))}</div>
          <div class="signame">${esc(t(P.name))}</div>
          <h1>${esc(nm)}</h1>
          <p class="tag"><b>${esc(t(P.headline))}.</b> ${esc(t(P.title))} · ${esc(t(P.location))}.</p>
          <div class="cta">
            <a class="btn lime" href="${esc(t(P.cv))}" download><i class="fa fa-download"></i>${esc(t(P.ui.download_cv))}</a>
            <a class="btn ghost" href="${esc(P.contact.github)}" target="_blank" rel="noopener"><i class="fa fa-github"></i>GitHub</a>
          </div>
        </div>
        <div class="portrait" id="portrait">
          <img src="${esc(P.avatar)}" alt="${esc(t(P.name))}">
          <span class="tape display">No. 66</span><span class="flag"></span>
        </div>
      </div></div></section>
      <div class="marquee" aria-hidden="true"><div class="track" id="marq"></div></div>`;
    }
    function marqText(){const items=tr(S.marq);const one=items.map(x=>`<span>${esc(x)}<i> ✦ </i></span>`).join('');document.getElementById('marq').innerHTML=one+one;}

    function storyHTML(){
      return `<section id="about"><div class="wrap">${head('story')}
        <div class="about reveal"><div>${P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('')}
          <div class="sig" style="color:var(--lime);font-size:30px;transform:rotate(-3deg);display:inline-block">${esc(t(P.name))}</div></div>
          <div class="pic"><img src="${esc(P.avatarAlt||P.avatar)}" alt="${esc(t(P.name))}"></div></div></div></section>`;
    }
    function kitHTML(){
      return `<section id="skills"><div class="wrap">${head('kit')}
        <div class="reveal"><div class="kit">${(P.skillTags||[]).map(s=>`<span class="chip"><i class="fa fa-bolt"></i>${esc(s)}</span>`).join('')}</div>
        <div class="kitlines">${P.skills.map(s=>`<span>${esc(s)}</span>`).join('')}</div></div></div></section>`;
    }
    function gridHTML(){
      const items=[...P.experience.map(x=>({when:x.period,h:t(x.role)+' · '+t(x.company),sub:t(x.summary),bul:x.bullets.map(b=>t(b))})),
                   ...P.education.map(e=>({when:e.period,h:t(e.school),sub:t(e.degree)+' — '+t(e.note),bul:[]}))];
      return `<section id="grid"><div class="wrap">${head('grid')}
        <div class="tl reveal">${items.map(it=>`<div class="item"><div class="when">${esc(it.when)}</div><h4>${esc(it.h)}</h4><div class="sub">${esc(it.sub)}</div>
          ${it.bul.length?`<ul>${it.bul.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:''}</div>`).join('')}</div></div></section>`;
    }
    function trackHTML(){
      let body;
      if(!projects.length) body=`<div class="load-note">${esc(t(P.ui.loading_projects))}</div>`;
      else body=`<div class="gallery">${projects.map((p,i)=>`
        <a class="gcard" href="${esc(p.href)}"><div class="cover"><span class="n display">${String(i+1).padStart(2,'0')}</span></div>
        <div class="cb"><div class="tech">${esc((p.tech_stack||'').split(',').slice(0,2).join(' · ')||t(P.ui.tech_stack))}</div>
        <h4>${esc(p.localTitle())}</h4><p>${esc(p.localSummary()||'')}</p><span class="go">${esc(t(P.ui.view_project))} <i class="fa fa-arrow-right"></i></span></div></a>`).join('')}</div>
        <div class="hint">← ${esc(CJCData.lang()==='zh'?'拖动查看更多':'drag to explore')} →</div>`;
      return `<section id="projects"><div class="wrap">${head('track')}<div class="reveal">${body}</div></div></section>`;
    }
    function journalHTML(){
      const list=CJCData.filterArticles(articles,filterKey);
      const chips=`<div class="filters">${P.articleFilters.map(f=>`<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('')}</div>`;
      let body;
      if(!articles.length) body=`<div class="load-note">${esc(t(P.ui.loading_articles))}</div>`;
      else if(!list.length) body=`<div class="load-note">${esc(t(P.ui.no_articles))}</div>`;
      else body=`<div class="jgrid">${list.map(a=>`<a class="jcard" href="${esc(a.href)}"><div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
        <div class="cb"><div class="meta"><span>${esc(a.category||'')}</span><span class="d">${esc(a.dateText())}</span></div>
        <h4>${esc(a.localTitle())}</h4><p>${esc(a.localSummary()||'')}</p><span class="go" style="font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">${esc(t(P.ui.read_more))} →</span></div></a>`).join('')}</div>`;
      return `<section id="articles"><div class="wrap">${head('journal')}<div class="reveal">${chips}${body}</div></div></section>`;
    }
    function winsHTML(){
      return `<section id="certificates"><div class="wrap">
        <div class="reveal"><div class="kicker a-head" style="color:var(--gold)">${esc(tr(S.wins)[0])}</div><h2 class="stitle display" style="color:var(--gold)">${esc(tr(S.wins)[1])}</h2></div>
        <div class="achv reveal" style="margin-top:24px"><div class="a-grid">${P.certificates.map(c=>`
          <div class="ach"><div class="tr"><i class="fa fa-trophy"></i></div><div><div class="m">${esc(t(c.tag))} · ${esc(t(c.date))}</div><h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('')}</div></div></div></section>`;
    }
    function contactHTML(){
      const gi=t(P.ui.get_in_touch).toUpperCase();
      return `<section id="contact"><div class="wrap">${head('contact')}
        <div class="contact reveal">
          <div><div class="big">${esc(CJCData.lang()==='zh'?'一起':"LET'S")} <em>${esc(CJCData.lang()==='zh'?'搞点酷的':'BUILD')}</em></div>
            <div class="comm">
              <a href="mailto:${esc(P.contact.email)}"><span class="k">Email</span><span class="v">${esc(P.contact.email)}</span></a>
              <a href="${esc(P.contact.phoneHref)}"><span class="k">Phone</span><span class="v">${esc(P.contact.phone)}</span></a>
              <a href="${esc(P.contact.github)}" target="_blank" rel="noopener"><span class="k">GitHub</span><span class="v">@${esc(P.contact.githubUser)}</span></a>
              <a href="${esc(P.contact.wechatQrPage)}"><span class="k">WeChat</span><span class="v">QR →</span></a>
            </div></div>
          <form id="cf"><input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none">
            <label>${esc(t(P.ui.name_placeholder))}</label><input name="name" required>
            <label>${esc(t(P.ui.email_placeholder))}</label><input type="email" name="email" required>
            <label>${esc(t(P.ui.msg_placeholder))}</label><textarea name="message" required></textarea>
            <button type="submit" class="btn lime">${esc(gi)} <i class="fa fa-arrow-right"></i></button>
            <p id="cf-status"></p></form>
        </div></div></section>`;
    }

    function render(){
      document.getElementById('brand').textContent=P.brand;
      document.getElementById('fbrand').textContent=P.brand;
      document.getElementById('fname').textContent=t(P.name).toUpperCase();
      document.getElementById('navlinks').innerHTML=[['about',S.nStory],['projects',S.nWork],['articles',S.nJournal],['certificates',S.nWins],['contact',S.nContact]]
        .map(([id,l])=>`<a href="#${id}">${esc(tr(l))}</a>`).join('');
      document.getElementById('app').innerHTML=heroHTML()+storyHTML()+kitHTML()+gridHTML()+trackHTML()+journalHTML()+winsHTML()+contactHTML();
      document.getElementById('fsoc').innerHTML=`<a href="${P.contact.github}" target="_blank" rel="noopener">GitHub</a><a href="mailto:${P.contact.email}">Email</a><a href="${P.contact.wechatQrPage}">WeChat</a><a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('fdesc').textContent=t(P.ui.footer_desc);
      const icp=document.getElementById('ficp');icp.textContent=P.icp;icp.href=P.icpUrl;
      marqText(); wire();
    }
    function wire(){
      document.querySelectorAll('#articles .filters button').forEach(b=>b.addEventListener('click',()=>{filterKey=b.dataset.k;render();}));
      const cf=document.getElementById('cf'); if(cf) cf.addEventListener('submit',onSubmit);
      // easter egg: click the 66 tape -> checkered confetti; 3 clicks -> night mode
      const port=document.getElementById('portrait');
      if(port){const tape=port.querySelector('.tape'); if(tape) tape.addEventListener('click',(e)=>{e.preventDefault();confetti();eggClicks++;if(eggClicks%3===0)toggleNight();});}
      observe();
    }
    async function onSubmit(e){e.preventDefault();const f=e.target,s=f.querySelector('#cf-status');s.style.color='var(--muted)';s.textContent=t(P.ui.sending);
      try{const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});s.style.color='var(--lime)';s.textContent='✓ '+(r.message||'Sent.');f.reset();}
      catch(err){s.style.color='#ff5a5a';s.textContent='✗ '+err.message;}}
    let io;function observe(){if(io)io.disconnect();if(reduce){document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in'));return;}
      io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}}),{threshold:.1});
      document.querySelectorAll('.reveal').forEach(el=>io.observe(el));}
    let eggClicks=0;
    function toggleNight(){night=!night;document.documentElement.style.setProperty('--bg',night?'#050505':'#0e0e0e');document.documentElement.style.setProperty('--bg2',night?'#0d0d0d':'#161616');}
    function confetti(){if(reduce)return;for(let i=0;i<26;i++){const c=document.createElement('div');const lime=i%2===0;
      c.style.cssText=`position:fixed;left:${40+Math.random()*20}%;top:30%;width:12px;height:12px;z-index:9999;pointer-events:none;background:${lime?'#c8ff00':'#0e0e0e'};border:1px solid #0e0e0e;transform:rotate(${Math.random()*360}deg);animation:cf ${1+Math.random()}s ease-out forwards`;
      c.style.setProperty('--dx',(Math.random()*400-200)+'px');document.body.appendChild(c);setTimeout(()=>c.remove(),2000);}}
    const kf=document.createElement('style');kf.textContent='@keyframes cf{to{transform:translate(var(--dx),70vh) rotate(720deg);opacity:0}}';document.head.appendChild(kf);
    // nav bg on scroll
    window.addEventListener('scroll',()=>{document.querySelector('.nav').style.background=window.scrollY>40?'rgba(14,14,14,.92)':'rgba(14,14,14,.72)';},{passive:true});

    document.addEventListener('DOMContentLoaded',()=>{
      CJCData.setTheme(window.THEME_ID);
      render();
      CJCData.mountSwitcher({accent:'#c8ff00'});
      CJCData.onLang(()=>render());
      (async()=>{try{projects=await CJCData.fetchProjects();}catch(e){}try{articles=await CJCData.fetchArticles();}catch(e){}render();})();
    });
  })();
  </script>
</body>
</html>

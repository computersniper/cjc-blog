  (()=>{'use strict';const P=CJCData.profile,t=CJCData.t.bind(CJCData),e=CJCData.escapeHtml;let projects=[],articles=[],filter='all';const L={en:{nav:[['about','Profile'],['education','Grid'],['work','Garage'],['journal','Journal'],['contact','Pit wall']],intro:'Build with intent. Ship under pressure.',driver:'Driver file / 66',driverAlt:'Cai Jiechao portrait with an original helmet reveal',helmet:'Replay visor',about:'Profile',aboutLead:'A developer with a driver’s mindset: read the track, choose a line, keep moving.',skills:'Loadout',skillsLead:'The stack, tools, and working habits that keep the engine running.',education:'The Grid',educationLead:'Foundations and credentials that keep the line honest.',courses:'Garage',coursesLead:'Core disciplines tuned for the long distance.',experience:'Racecraft',experienceLead:'A season of production work at Xnew.',projects:'The Garage',projectsLead:'Selected builds with the lights on.',journal:'Off Track',journalLead:'Notes from practice, engineering, and learning.',cert:'Podium',certLead:'Proof points from the record.',contact:'Pit Wall',contactLead:'Bring a brief, a hard problem, or a good question.',loc:'Based in',project:'Open build',read:'Read note',failed:'The timing board is offline. Please try again shortly.',send:'Send to pit wall',sending:'Transmitting…',sent:'Message received by the pit wall.',name:'Your name',email:'Your email',message:'Your message',cv:'Download CV',github:'Github'},zh:{nav:[['about','车手档案'],['education','发车格'],['work','车库'],['journal','场外手记'],['contact','维修墙']],intro:'带着意图构建，在压力之下交付。',driver:'车手档案 / 66',driverAlt:'蔡杰超肖像与原创头盔揭示动效',helmet:'重播面罩',about:'车手档案',aboutLead:'以车手的心态写代码：读懂赛道、选择路线、持续前进。',skills:'装备库',skillsLead:'让引擎持续运转的技术栈、工具与工作习惯。',education:'发车格',educationLead:'让路线可靠的基础与资历。',courses:'车库',coursesLead:'为长距离赛程调校的核心学科。',experience:'赛道技艺',experienceLead:'在 Xnew 的一段生产实践。',projects:'车库',projectsLead:'亮灯展示的精选构建。',journal:'场外手记',journalLead:'来自练习、工程与学习的笔记。',cert:'领奖台',certLead:'记录上的重要凭证。',conta   function skills(){const x=l();return `<section id="skills" class="dark"><div class="wrap">${head('skills',x.skills)}<div class="skills-row reveal"><div class="skills-panel"><div class="eyebrow">${e(t(P.ui.core_tech))}</div><h3>Powered<br>by <em>craft.</em></h3><div class="chip-grid">${P.skillTags.map(s=>`<span>${e(s)}</span>`).join('')}</div></div><figure class="skills-image"><img loading="lazy" src="${e(P.avatarAlt||P.avatar)}" alt="Monochrome technical portrait of ${e(t(P.name))}"></figure></div></div></section>`}
  function education(){const x=l();return `<section id="education"><div class="wrap">${head('education',x.education)}<div class="edu-grid reveal">${P.education.map(s=>`<article class="edu-card"><time>${e(s.period)}</time><h3>${e(t(s.school))}</h3><p>${e(t(s.degree))}<br>${e(t(s.note))}</p></article>`).join('')}</div></div></section>`}
  function courses(){const x=l();return `<section id="courses" class="dark"><div class="wrap">${head('courses',x.courses)}<div class="courses reveal">${P.courses.map(c=>`<article class="course"><i class="fa ${e(c.icon)}" aria-hidden="true"></i><h3>${e(t(c.title))}</h3><p>${e(t(c.desc))}</p></article>`).join('')}</div></div></section>`}
  function experience(){const x=l(),v=P.experience[0];return `<section id="experience" class="dark"><div class="wrap">${head('experience',x.experience)}<div class="experience-grid reveal"><div class="experience-meta">${e(v.period)}<br><br>${e(t(v.company))}</div><div class="experience"><h3>${e(t(v.role))}</h3><p>${e(t(v.summary))}</p><ul class="bullets">${v.bullets.map(b=>`<li>${e(t(b))}</li>`).join('')}</ul></div></div></div></section>`}
  function projectsView(){const x=l();let body=projects.length?`<div class="project-grid reveal">${projects.map((p,i)=>`<a class="project" href="${e(p.href)}"><div class="project-index">${String(i+1).padStart(2,'0')} / ${e(x.project)}</div><time>${e(p.dateText())}</time><h3>${e(p.localTitle())}</h3><p>${e(p.localSummary()||'')}</p><div class="stack">${e(p.tech_stack||t(P.ui.tech_stack))}</div></a>`).join('')}</div>`:`<p class="loading">${e(t(P.ui.loading_projects))}</p>`;return `<section id="work"><div class="wrap">${head('projects',x.projects)}<div id="project-body">${body}</div></div></section>`}
  function articlesView(){const x=l(),list=CJCData.filterArticles(articles,filter);let body=!articles.length?`<p class="loading">${e(t(P.ui.loading_articles))}</p>`:!list.length?`<p class="loading">${e(t(P.ui.no_articles))}</p>`:`<div class="article-grid reveal">${list.map(a=>`<article class="article"><time>${e(a.category||'')} · ${e(a.dateText())}</time><img loading="lazy" src="${e(a.cover_image||'/index_page/img/blogs/1.jpg')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""><h3>${e(a.localTitle())}</h3><p>${e(a.localSummary()||'')}</p><a class="more" href="${e(a.href)}">${e(x.read)} →</a></article>`).join('')}</div>`;return `<section id="journal"><div class="wrap">${head('journal',x.journal)}<div class="filters" aria-label="Article categories">${P.articleFilters.map(f=>`<button type="button" data-filter="${e(f.key)}" class="${filter===f.key?'active':''}">${e(t(f.label))}</button>`).join('')}</div><div id="article-body">${body}</div></div></section>`}
  function certificates(){const x=l();return `<section id="certificates" class="dark"><div class="wrap">${head('cert',x.cert)}<div class="cert-grid reveal">${P.certificates.map(c=>`<article class="certificate"><img loading="lazy" src="${e(c.image)}" alt="${e(t(c.title))}"><div><div class="eyebrow">${e(t(c.tag))} · ${e(t(c.date))}</div><h3>${e(t(c.title))}</h3><p>${e(t(c.desc))}</p></div></article>`).join('')}</div></div></section>`}
  function contact(){const x=l();return `<section id="contact" class="contact"><div class="wrap">${head('contact',x.contact)}<div class="contact-grid"><div class="contact-copy reveal"><h2>${e(x.contact)}<br><em>Ready.</em></h2><p>${e(t(P.ui.inbox_open))}</p><div class="contact-links"><a href="mailto:${e(P.contact.email)}"><span>Email</span><span>${e(P.contact.email)}</span></a><a href="${e(P.contact.phoneHref)}"><span>Phone</span><span>${e(P.contact.phone)}</span></a><a href="${e(P.contact.github)}" target="_blank" rel="noopener"><span>Github</span><span>@${e(P.contact.githubUser)}</span></a><a href="${e(P.contact.wechatQrPage)}"><span>WeChat</span><span>QR →</span></a></div></div><form class="reveal" id="contact-form"><input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true"><label for="contact-name">${e(x.name)}</label><input id="contact-name" name="name" autocomplete="name" required><label for="contact-email">${e(x.email)}</label><input id="contact-email" type="email" name="email" autocomplete="email" required><label for="contact-message">${e(x.message)}</label><textarea id="contact-message" name="message" required></textarea><button class="button ghost" type="submit">${e(x.send)} <i class="fa fa-arrow-right" aria-hidden="true"></i></button><p id="status" role="status" aria-live="polite"></p></form></div></div></section>`}
  function render(){const x=l();document.title=`${t(P.name)} — CJC/66`;document.getElementById('nav').innerHTML=x.nav.map(v=>`<a href="#${e(v[0])}">${e(v[1])}</a>`).join('');document.getElementById('content').innerHTML=hero()+about()+skills()+education()+courses()+experience()+projectsView()+articlesView()+certificates()+contact();document.getElementById('footer-note').textContent=t(P.ui.footer_desc);document.getElementById('footer-links').innerHTML=`${link(P.contact.github,'Github')}${link('mailto:'+P.contact.email,'Email')}${link(P.contact.wechatQrPage,'WeChat')}${link('/admin.html',t(P.ui.admin_panel))}${link(P.icpUrl,P.icp)}`;wire();observe()}
  function restartVisor(){const d=document.getElementById('driver');if(!d||matchMedia('(prefers-reduced-motion: reduce)').matches)return;d.classList.remove('run');void d.offsetWidth;d.classList.add('run')}
  function wire(){document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;render()}));const toggle=document.getElementById('visor-toggle');if(toggle)toggle.addEventListener('click',restartVisor);const driver=document.getElementById('driver');if(driver)driver.addEventListener('mouseenter',restartVisor);const f=document.getElementById('contact-form');if(f)f.addEventListener('submit',async ev=>{ev.preventDefault();const s=document.getElementById('status'),x=l(),btn=f.querySelector('button');btn.disabled=true;s.textContent=x.sending;try{const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});s.textContent=r.message||x.sent;f.reset()}catch(err){s.textContent=err.message||x.failed}finally{btn.disabled=false}})}
  let observer;function observe(){if(matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('.reveal').forEach(n=>n.classList.add('in'));return}if(observer)observer.disconnect();observer=new IntersectionObserver(es=>es.forEach(v=>{if(v.isIntersecting){v.target.classList.add('in');observer.unobserve(v.target)}}),{threshold:.11});document.querySelectorAll('.reveal').forEach(n=>observer.observe(n))}
  document.addEventListener('DOMContentLoaded',async()=>{CJCData.setTheme(window.THEME_ID);render();CJCData.mountSwitcher({accent:'#819700'});CJCData.onLang(render);try{[projects,articles]=await Promise.all([CJCData.fetchProjects(),CJCData.fetchArticles()]);render()}catch(err){const x=l();document.querySelectorAll('.loading').forEach(n=>{n.className='failure';n.textContent=x.failed})}});
  })();
  </script>
</body></html>

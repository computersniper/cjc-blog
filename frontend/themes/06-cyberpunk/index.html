<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Cyberpunk</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg-1:#0d0221; --bg-2:#241734; --panel:rgba(13,4,28,.72);
      --magenta:#ff2bd6; --cyan:#00eaff; --ink:#e8e6ff; --dim:#9a90c9;
      --line:rgba(255,43,214,.4); --line-cy:rgba(0,234,255,.35);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;color:var(--ink);
      font-family:"Share Tech Mono","Rajdhani",monospace;
      background:linear-gradient(160deg,var(--bg-1) 0%,var(--bg-2) 55%,#160a2b 100%);
      background-attachment:fixed;min-height:100vh;line-height:1.6;
      -webkit-font-smoothing:antialiased;overflow-x:hidden;
    }
    /* scanline overlay */
    body::before{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:9998;
      background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.14) 3px,rgba(0,0,0,0) 4px);
      mix-blend-mode:overlay;opacity:.5;animation:scan 8s linear infinite;
    }
    @keyframes scan{0%{background-position-y:0}100%{background-position-y:400px}}
    /* subtle grid glow */
    body::after{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
      background:
        radial-gradient(circle at 12% 18%,rgba(255,43,214,.16),transparent 42%),
        radial-gradient(circle at 88% 82%,rgba(0,234,255,.14),transparent 45%);
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    .wrap{max-width:1180px;margin:0 auto;padding:0 26px;position:relative;z-index:1}

    h1,h2,h3,h4,.orb{font-family:"Orbitron","Rajdhani",sans-serif}

    /* neon helpers */
    .neon-m{color:var(--magenta);text-shadow:0 0 6px rgba(255,43,214,.8),0 0 18px rgba(255,43,214,.5)}
    .neon-c{color:var(--cyan);text-shadow:0 0 6px rgba(0,234,255,.8),0 0 18px rgba(0,234,255,.5)}
    .label{font-family:"Rajdhani",sans-serif;text-transform:uppercase;letter-spacing:.34em;
      font-size:12px;font-weight:700;color:var(--cyan)}

    /* corner-cut HUD panel */
    .panel{position:relative;background:var(--panel);backdrop-filter:blur(6px);
      border:1px solid var(--line);padding:26px;
      clip-path:polygon(0 14px,14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px));
      box-shadow:0 0 22px rgba(255,43,214,.12),inset 0 0 22px rgba(0,234,255,.05);}
    .panel.cy{border-color:var(--line-cy);box-shadow:0 0 22px rgba(0,234,255,.14),inset 0 0 20px rgba(255,43,214,.05)}

    /* Topbar HUD */
    .topbar{position:sticky;top:0;z-index:900;
      background:linear-gradient(180deg,rgba(13,4,28,.92),rgba(13,4,28,.55));
      border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
    .topbar .row{display:flex;align-items:center;justify-content:space-between;height:58px}
    .brand{font-family:"Orbitron",sans-serif;font-weight:900;font-size:19px;letter-spacing:.06em;
      color:var(--ink);text-shadow:0 0 10px rgba(0,234,255,.5)}
    .brand b{color:var(--magenta);text-shadow:0 0 10px rgba(255,43,214,.7)}
    .topbar nav{display:flex;gap:22px}
    .topbar nav a{font-family:"Rajdhani",sans-serif;font-weight:600;text-transform:uppercase;
      letter-spacing:.14em;font-size:13px;color:var(--dim);transition:.2s}
    .topbar nav a:hover{color:var(--cyan);text-shadow:0 0 10px rgba(0,234,255,.7)}
    @media(max-width:860px){.topbar nav{display:none}}

    /* Hero */
    .hero{padding:70px 0 46px}
    .hero .greet{font-family:"Rajdhani",sans-serif;letter-spacing:.3em;text-transform:uppercase;
      font-size:14px;color:var(--cyan);margin-bottom:16px}
    .glitch{font-family:"Orbitron",sans-serif;font-weight:900;font-size:clamp(44px,10vw,116px);
      line-height:.94;letter-spacing:.01em;position:relative;color:#fff;
      text-shadow:0 0 14px rgba(255,43,214,.55),0 0 30px rgba(0,234,255,.3);margin:0;
      display:inline-block}
    .glitch::before,.glitch::after{content:attr(data-text);position:absolute;left:0;top:0;
      width:100%;overflow:hidden;pointer-events:none}
    .glitch::before{color:var(--cyan);clip-path:inset(0 0 55% 0);
      animation:glx 2.6s infinite linear alternate-reverse;mix-blend-mode:screen}
    .glitch::after{color:var(--magenta);clip-path:inset(55% 0 0 0);
      animation:glx 3.4s infinite linear alternate-reverse;mix-blend-mode:screen}
    @keyframes glx{
      0%{transform:translate(0,0)}20%{transform:translate(-3px,1px)}
      40%{transform:translate(3px,-1px)}60%{transform:translate(-2px,0)}
      80%{transform:translate(2px,1px)}100%{transform:translate(0,0)}}
    .flicker{animation:flick 4s infinite}
    @keyframes flick{0%,19%,21%,23%,80%,100%{opacity:1}20%,22%,82%{opacity:.4}}
    .hero .head{font-family:"Rajdhani",sans-serif;font-weight:600;font-size:clamp(18px,3vw,28px);
      margin:24px 0 0;color:var(--ink);max-width:26ch}
    .hero .head b{color:var(--magenta)}
    .hero .meta{display:flex;flex-wrap:wrap;gap:12px 26px;margin-top:22px;color:var(--dim);font-size:14px}
    .hero .meta b{color:var(--cyan)}
    .cta-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px}
    .btn{position:relative;font-family:"Rajdhani",sans-serif;font-weight:700;text-transform:uppercase;
      letter-spacing:.12em;font-size:14px;padding:14px 26px;cursor:pointer;
      clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
      transition:.2s;border:1px solid var(--magenta);background:rgba(255,43,214,.1);color:#fff;
      text-shadow:0 0 8px rgba(255,43,214,.6)}
    .btn:hover{background:var(--magenta);box-shadow:0 0 22px rgba(255,43,214,.7);color:#0d0221;text-shadow:none}
    .btn.cy{border-color:var(--cyan);background:rgba(0,234,255,.08);text-shadow:0 0 8px rgba(0,234,255,.6)}
    .btn.cy:hover{background:var(--cyan);box-shadow:0 0 22px rgba(0,234,255,.7);color:#0d0221;text-shadow:none}

    /* Sections */
    section{padding:60px 0}
    .sec-head{display:flex;align-items:center;gap:16px;margin-bottom:32px}
    .sec-head .idx{font-family:"Share Tech Mono",monospace;color:var(--magenta);font-size:14px;
      border:1px solid var(--line);padding:4px 10px;
      clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
    .sec-head h2{font-size:clamp(24px,4vw,40px);margin:0;color:#fff;letter-spacing:.02em;
      text-shadow:0 0 14px rgba(0,234,255,.4)}
    .sec-head .flt{flex:1;height:1px;background:linear-gradient(90deg,var(--magenta),transparent)}

    /* About */
    .about{display:grid;grid-template-columns:280px 1fr;gap:34px;align-items:start}
    .about .frame{position:relative}
    .about img{width:100%;aspect-ratio:1/1;object-fit:cover;
      clip-path:polygon(0 18px,18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%);
      filter:contrast(1.1) saturate(1.15)}
    .about .frame::after{content:"";position:absolute;inset:0;pointer-events:none;
      border:1px solid var(--cyan);box-shadow:0 0 20px rgba(0,234,255,.4);
      clip-path:polygon(0 18px,18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%)}
    .about p{margin:0 0 16px;color:var(--ink);font-size:16px;line-height:1.7}
    .about .loc{color:var(--magenta);font-weight:700;font-family:"Rajdhani",sans-serif;
      letter-spacing:.1em;text-transform:uppercase}
    @media(max-width:760px){.about{grid-template-columns:1fr}.about .frame{max-width:280px}}

    /* Rows (edu/exp) as HUD readouts */
    .stack{display:grid;gap:18px}
    .readout{display:grid;grid-template-columns:170px 1fr;gap:22px;padding:22px 24px}
    .readout .when{color:var(--cyan);font-weight:700;font-size:14px;letter-spacing:.06em;
      text-shadow:0 0 8px rgba(0,234,255,.5)}
    .readout h3{margin:0 0 6px;font-size:19px;color:#fff}
    .readout .sub{color:var(--magenta);font-family:"Rajdhani",sans-serif;font-weight:600;letter-spacing:.05em}
    .readout .body{color:var(--dim);margin-top:8px;font-size:15px}
    .readout ul{margin:10px 0 0;padding-left:18px;color:var(--dim);font-size:14.5px;line-height:1.7}
    .readout ul li::marker{color:var(--cyan)}
    @media(max-width:600px){.readout{grid-template-columns:1fr;gap:8px}}

    /* Skills tag cloud */
    .tags{display:flex;flex-wrap:wrap;gap:12px}
    .tag{font-family:"Share Tech Mono",monospace;font-size:14px;padding:9px 16px;
      border:1px solid var(--line-cy);color:var(--cyan);background:rgba(0,234,255,.05);
      clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px));
      transition:.2s}
    .tag:hover{color:#0d0221;background:var(--cyan);box-shadow:0 0 16px rgba(0,234,255,.6)}
    .tag.m{border-color:var(--line);color:var(--magenta);background:rgba(255,43,214,.06)}
    .tag.m:hover{background:var(--magenta);color:#0d0221;box-shadow:0 0 16px rgba(255,43,214,.6)}

    /* Courses */
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .course .ci{color:var(--magenta);font-size:26px;margin-bottom:14px;
      text-shadow:0 0 12px rgba(255,43,214,.6)}
    .course h4{margin:0 0 10px;font-size:17px;color:#fff}
    .course p{margin:0;color:var(--dim);font-size:14px;line-height:1.6}
    @media(max-width:860px){.grid3{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.grid3{grid-template-columns:1fr}}

    /* Cards */
    .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
    .filters button{font-family:"Rajdhani",sans-serif;font-weight:700;text-transform:uppercase;
      letter-spacing:.1em;font-size:12px;padding:9px 15px;cursor:pointer;color:var(--dim);
      background:transparent;border:1px solid var(--line-cy);transition:.2s;
      clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
    .filters button:hover,.filters button.active{color:#0d0221;background:var(--cyan);
      border-color:var(--cyan);box-shadow:0 0 16px rgba(0,234,255,.5)}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
    .card{display:flex;flex-direction:column;color:inherit;transition:.2s;padding:0;overflow:hidden}
    .card:hover{transform:translateY(-4px);box-shadow:0 0 26px rgba(255,43,214,.3)}
    .card .cover{aspect-ratio:16/10;overflow:hidden;border-bottom:1px solid var(--line)}
    .card .cover img{width:100%;height:100%;object-fit:cover;filter:contrast(1.1) saturate(1.2) hue-rotate(-6deg)}
    .card .cbody{padding:18px 20px;display:flex;flex-direction:column;gap:9px;flex:1}
    .card .ctag{display:flex;justify-content:space-between;font-family:"Share Tech Mono",monospace;
      font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
    .card h4{margin:0;font-size:17px;color:#fff;line-height:1.25}
    .card .tech{color:var(--magenta);font-size:13px;font-family:"Share Tech Mono",monospace}
    .card p{margin:0;color:var(--dim);font-size:14px;line-height:1.55;flex:1}
    .card .more{font-family:"Rajdhani",sans-serif;font-weight:700;text-transform:uppercase;
      letter-spacing:.1em;font-size:12px;color:var(--cyan)}
    @media(max-width:860px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.cards{grid-template-columns:1fr}}

    /* Certificates */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    .cert{display:grid;grid-template-columns:110px 1fr;gap:18px;padding:20px}
    .cert img{width:100%;aspect-ratio:3/4;object-fit:cover;
      clip-path:polygon(0 10px,10px 0,100% 0,100% 100%,10px 100%,0 calc(100% - 10px));
      filter:contrast(1.05) saturate(1.1)}
    .cert .meta{display:flex;justify-content:space-between;font-family:"Share Tech Mono",monospace;
      font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--cyan)}
    .cert h4{margin:8px 0 8px;font-size:16px;color:#fff;line-height:1.3}
    .cert p{margin:0;color:var(--dim);font-size:13.5px;line-height:1.5}
    @media(max-width:820px){.certs{grid-template-columns:1fr}}
    @media(max-width:420px){.cert{grid-template-columns:80px 1fr}}

    /* Contact */
    .contact-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:34px}
    .contact-info a{display:flex;justify-content:space-between;padding:14px 0;
      border-bottom:1px solid rgba(0,234,255,.15)}
    .contact-info a span:first-child{font-family:"Rajdhani",sans-serif;text-transform:uppercase;
      letter-spacing:.12em;font-size:12px;color:var(--dim)}
    .contact-info a span:last-child{color:var(--cyan)}
    .contact-info a:hover span:last-child{text-shadow:0 0 10px rgba(0,234,255,.7)}
    form label{display:block;font-family:"Rajdhani",sans-serif;text-transform:uppercase;
      letter-spacing:.12em;font-size:11px;color:var(--cyan);margin:0 0 6px}
    form input,form textarea{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line-cy);
      font-family:"Share Tech Mono",monospace;font-size:15px;padding:12px;margin-bottom:18px;
      color:var(--ink)}
    form input:focus,form textarea:focus{outline:none;border-color:var(--magenta);
      box-shadow:0 0 14px rgba(255,43,214,.35)}
    form textarea{min-height:120px;resize:vertical}
    #cf-status{margin-top:12px;font-size:14px}
    @media(max-width:760px){.contact-grid{grid-template-columns:1fr}}

    footer{border-top:1px solid var(--line);padding:36px 0 54px;margin-top:24px;
      background:linear-gradient(180deg,transparent,rgba(13,4,28,.6))}
    footer .frow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center}
    footer .flinks{display:flex;gap:20px;flex-wrap:wrap}
    footer a{color:var(--dim);font-family:"Rajdhani",sans-serif;font-weight:600;
      text-transform:uppercase;letter-spacing:.08em;font-size:13px;transition:.2s}
    footer a:hover{color:var(--cyan)}
    .muted{color:var(--dim);font-size:12.5px}
    .load-note{color:var(--dim);grid-column:1/-1;padding:20px;font-family:"Share Tech Mono",monospace}

    :focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
    @media(prefers-reduced-motion:reduce){
      *{animation:none!important;transition:none!important}
      body::before{display:none}
      .glitch::before,.glitch::after{display:none}
      .flicker{opacity:1!important}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="wrap row">
      <a class="brand" href="#top">Cai<b>Jiechao</b></a>
      <nav id="nav"></nav>
    </div>
  </div>

  <div id="top"></div>
  <div class="wrap">
    <header class="hero">
      <div class="greet" id="greet"></div>
      <h1 class="glitch flicker" id="name" data-text=""></h1>
      <p class="head" id="headline"></p>
      <div class="meta" id="meta"></div>
      <div class="cta-row">
        <a class="btn" id="cvBtn" href="#" download></a>
        <a class="btn cy" id="ghBtn" target="_blank" rel="noopener"></a>
      </div>
    </header>

    <section id="about">
      <div class="sec-head"><span class="idx">01</span><h2 id="l-about"></h2><span class="flt"></span></div>
      <div class="about">
        <div class="frame"><img id="portrait" alt="" /></div>
        <div class="panel cy" id="about-text"></div>
      </div>
    </section>

    <section id="education">
      <div class="sec-head"><span class="idx">02</span><h2 id="l-edu"></h2><span class="flt"></span></div>
      <div class="stack" id="edu-list"></div>
    </section>

    <section id="skills">
      <div class="sec-head"><span class="idx">03</span><h2 id="l-skills"></h2><span class="flt"></span></div>
      <div class="tags" id="skills-list"></div>
    </section>

    <section id="courses">
      <div class="sec-head"><span class="idx">04</span><h2 id="l-courses"></h2><span class="flt"></span></div>
      <div class="grid3" id="courses-list"></div>
    </section>

    <section id="experience">
      <div class="sec-head"><span class="idx">05</span><h2 id="l-exp"></h2><span class="flt"></span></div>
      <div class="stack" id="exp-list"></div>
    </section>

    <section id="projects">
      <div class="sec-head"><span class="idx">06</span><h2 id="l-projects"></h2><span class="flt"></span></div>
      <div class="cards" id="projects-list"><div class="load-note" id="proj-load"></div></div>
    </section>

    <section id="articles">
      <div class="sec-head"><span class="idx">07</span><h2 id="l-articles"></h2><span class="flt"></span></div>
      <div class="filters" id="filters"></div>
      <div class="cards" id="articles-list"><div class="load-note" id="art-load"></div></div>
    </section>

    <section id="certificates">
      <div class="sec-head"><span class="idx">08</span><h2 id="l-certs"></h2><span class="flt"></span></div>
      <div class="certs" id="certs-list"></div>
    </section>

    <section id="contact">
      <div class="sec-head"><span class="idx">09</span><h2 id="l-contact"></h2><span class="flt"></span></div>
      <div class="contact-grid">
        <div class="contact-info panel" id="contact-info"></div>
        <form class="panel cy" id="cf">
          <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none">
          <label for="cf-name" id="lb-name"></label>
          <input type="text" name="name" id="cf-name" required>
          <label for="cf-email" id="lb-email"></label>
          <input type="email" name="email" id="cf-email" required>
          <label for="cf-msg" id="lb-msg"></label>
          <textarea name="message" id="cf-msg" required></textarea>
          <button class="btn" type="submit" id="cf-send"></button>
          <p id="cf-status"></p>
        </form>
      </div>
    </section>
  </div>

  <footer>
    <div class="wrap">
      <div class="frow">
        <a class="brand" href="#top" style="font-size:17px">Cai<b>Jiechao</b></a>
        <div class="flinks" id="foot-social"></div>
      </div>
      <div class="frow" style="margin-top:18px">
        <span class="muted" id="foot-desc"></span>
        <a class="muted" id="foot-icp" target="_blank"></a>
      </div>
    </div>
  </footer>

  <script>window.THEME_ID = "06-cyberpunk";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";

    function renderStatic(){
      const lang = CJCData.lang();
      document.title = (lang==="zh"?"蔡杰超":"Cai Jiechao") + " — Cyberpunk";
      document.getElementById('nav').innerHTML = [
        ['about','nav_about'],['courses','nav_courses'],['experience','nav_internship'],
        ['projects','nav_portfolio'],['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');
      document.getElementById('greet').textContent = "// " + t(P.greeting);
      const nm = document.getElementById('name');
      nm.textContent = t(P.name); nm.setAttribute('data-text', t(P.name));
      document.getElementById('headline').innerHTML = "<b>&gt;</b> " + esc(t(P.headline));
      document.getElementById('meta').innerHTML =
        `<span>${esc(t(P.role))}</span><span>◈ <b>${esc(t(P.location))}</b></span>`;
      const cv = document.getElementById('cvBtn');
      cv.textContent = t(P.ui.download_cv); cv.href = t(P.cv);
      const gh = document.getElementById('ghBtn');
      gh.textContent = "GitHub ↗"; gh.href = P.contact.github;
      // labels
      document.getElementById('l-about').textContent = t(P.ui.about_me);
      document.getElementById('l-edu').textContent = t(P.ui.education_bg);
      document.getElementById('l-skills').textContent = t(P.ui.core_tech);
      document.getElementById('l-courses').textContent = t(P.ui.core_courses);
      document.getElementById('l-exp').textContent = t(P.ui.internship_exp);
      document.getElementById('l-projects').textContent = t(P.ui.latest_projects);
      document.getElementById('l-articles').textContent = t(P.ui.latest_articles);
      document.getElementById('l-certs').textContent = t(P.ui.certificates);
      document.getElementById('l-contact').textContent = t(P.ui.get_in_touch);
      // about
      document.getElementById('portrait').src = P.avatar;
      document.getElementById('portrait').alt = t(P.name);
      document.getElementById('about-text').innerHTML =
        P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('') +
        `<p class="loc">◈ ${esc(t(P.location))}</p>`;
      // education
      document.getElementById('edu-list').innerHTML = P.education.map(e=>`
        <div class="readout panel"><div class="when">${esc(e.period)}</div>
          <div><h3>${esc(t(e.school))}</h3>
          <div class="sub">${esc(t(e.degree))}</div>
          <div class="body">${esc(t(e.note))}</div></div></div>`).join('');
      // skills — alternate magenta/cyan tags
      document.getElementById('skills-list').innerHTML = P.skillTags.map((s,i)=>
        `<span class="tag ${i%2?'m':''}">${esc(s)}</span>`).join('');
      // courses
      document.getElementById('courses-list').innerHTML = P.courses.map(c=>`
        <div class="course panel"><div class="ci"><i class="fa ${esc(c.icon)}"></i></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');
      // experience
      document.getElementById('exp-list').innerHTML = P.experience.map(x=>`
        <div class="readout panel cy"><div class="when">${esc(x.period)}</div>
          <div><h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3>
          <div class="body">${esc(t(x.summary))}</div>
          <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div></div>`).join('');
      // certificates
      document.getElementById('certs-list').innerHTML = P.certificates.map(c=>`
        <div class="cert panel"><img src="${esc(c.image)}" alt="${esc(t(c.title))}">
        <div><div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');
      // contact
      document.getElementById('contact-info').innerHTML = [
        ['Email', P.contact.email, 'mailto:'+P.contact.email],
        ['Phone', P.contact.phone, P.contact.phoneHref],
        ['GitHub', '@'+P.contact.githubUser, P.contact.github],
        ['WeChat', 'QR ↗', P.contact.wechatQrPage]
      ].map(([k,v,h])=>`<a href="${esc(h)}"><span>${esc(k)}</span><span>${esc(v)}</span></a>`).join('');
      document.getElementById('lb-name').textContent = "> " + t(P.ui.name_placeholder);
      document.getElementById('lb-email').textContent = "> " + t(P.ui.email_placeholder);
      document.getElementById('lb-msg').textContent = "> " + t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent = t(P.ui.send);
      // footer
      document.getElementById('foot-social').innerHTML =
        `<a href="${P.contact.github}" target="_blank" rel="noopener">GitHub</a>
         <a href="mailto:${P.contact.email}">Email</a>
         <a href="${P.contact.wechatQrPage}">WeChat</a>
         <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent = t(P.ui.footer_desc);
      const icp = document.getElementById('foot-icp'); icp.textContent = P.icp; icp.href = P.icpUrl;
      // filters
      document.getElementById('filters').innerHTML = P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box = document.getElementById('projects-list');
      if(!projects.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML = projects.map(p=>`
        <a class="card panel" href="${esc(p.href)}">
          <div class="cbody">
            <div class="ctag"><span>${esc(t(P.ui.view_project))}</span><span>${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <div class="tech">[ ${esc(p.tech_stack||'')} ]</div>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div></a>`).join('');
    }

    function renderArticles(){
      const box = document.getElementById('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML = list.map(a=>`
        <a class="card panel" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
          <div class="cbody">
            <div class="ctag"><span>${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div></a>`).join('');
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML = `<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-list').innerHTML = `<div class="load-note">⚠ CONNECTION LOST // Failed to load articles.</div>`; }
    }

    document.getElementById('cf').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      const payload = { name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color='var(--dim)'; s.textContent = t(P.ui.sending);
      try{ const r = await CJCData.sendContact(payload); s.style.color='var(--cyan)'; s.textContent = r.message||'Sent.'; f.reset(); }
      catch(err){ s.style.color='var(--magenta)'; s.textContent = err.message; }
    });

    const fa = document.createElement('link');
    fa.rel='stylesheet'; fa.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css';
    document.head.appendChild(fa);

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:'#ff2bd6' });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

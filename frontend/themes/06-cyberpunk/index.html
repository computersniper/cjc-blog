  <style>

    :root{--void:#050607;--black:#090b0d;--panel:#0e1114;--panel2:#12161a;--ink:#eef3f5;--muted:#8f9aa0;--line:rgba(206,230,238,.16);--cyan:#54e8e1;--magenta:#e952a8;--display:Orbitron,'Arial Black',sans-serif;--mono:'JetBrains Mono','Cascadia Mono',Consolas,monospace}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--void);color:var(--ink);font:400 14px/1.65 var(--mono);overflow-x:hidden}body:before{content:'';position:fixed;z-index:1000;inset:0;pointer-events:none;opacity:.1;background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(160,240,240,.055) 4px)}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}button{cursor:pointer}img{display:block;max-width:100%}.skip{position:fixed;z-index:10000;top:-70px;left:12px;padding:11px 15px;background:var(--cyan);color:#001010}.skip:focus{top:12px}.shell{width:min(1380px,calc(100% - 48px));margin:auto}.tagline{font-size:10px;line-height:1.4;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.tagline strong{color:var(--cyan);font-weight:400}.topbar{height:74px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:22px;border-bottom:1px solid var(--line)}.brand{font:700 16px/1 var(--display);letter-spacing:.05em}.brand span{color:var(--cyan)}.nav{display:flex;gap:4px}.nav a{min-height:44px;display:flex;align-items:center;padding:0 10px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#c5ced2;border-bottom:1px solid transparent}.nav a:hover{color:var(--cyan);border-color:var(--cyan)}.system{text-align:right}
    .hero{position:relative;min-height:780px;padding:64px 0 36px;display:flex;align-items:center;border-bottom:1px solid var(--line);background:radial-gradient(circle at 74% 35%,rgba(84,232,225,.055),transparent 26%),linear-gradient(145deg,#050607,#090c0e 62%,#070809)}.hero:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 49.9%,rgba(84,232,225,.06) 50%,transparent 50.1%)}.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.08fr .92fr;gap:16px;align-items:stretch;width:100%}.hero-copy{min-width:0;padding:clamp(32px,6vw,86px) clamp(22px,5vw,70px) 42px;border:1px solid var(--line);background:rgba(7,9,11,.76);clip-path:polygon(0 0,96% 0,100% 8%,100% 100%,0 100%)}.hero h1{font:700 clamp(54px,8.7vw,132px)/.78 var(--display);letter-spacing:-.065em;text-transform:uppercase;margin:22px 0 30px;overflow-wrap:anywhere}.hero h1 span{display:block;color:var(--cyan)}.hero-lead{max-width:650px;margin:0;color:#b7c2c6;font-size:15px}.hero-lead b{font-weight:400;color:var(--magenta)}.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}.button{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:11px 16px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:10px;letter-spacing:.1em;text-transform:uppercase}.button.primary{background:var(--cyan);border-color:var(--cyan);color:#02100f}.button:hover{border-color:var(--magenta);background:var(--magenta);color:#10020b}.hero-media{min-width:0;display:grid;grid-template-rows:1fr auto;gap:12px}.portrait-frame{position:relative;min-height:550px;overflow:hidden;border:1px solid var(--line);background:#11171a;clip-path:polygon(7% 0,100% 0,100% 93%,93% 100%,0 100%,0 7%)}.portrait-frame img{width:100%;height:100%;object-fit:cover;object-position:center 24%;filter:grayscale(.7) contrast(1.1) brightness(.72)}.portrait-frame:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(4,6,7,.88),transparent 42%),linear-gradient(90deg,rgba(84,232,225,.08),transparent 45%)}.portrait-data{position:absolute;z-index:1;left:22px;right:22px;bottom:20px;display:flex;justify-content:space-between;gap:18px}.signal{height:9px;border:1px solid var(--line);position:relative;overflow:hidden}.signal:after{content:'';position:absolute;inset:2px;width:38%;background:var(--cyan);animation:signal 3.2s steps(8) infinite alternate}.hero-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{min-height:82px;padding:14px;border:1px solid var(--line);background:var(--panel)}.metric b{display:block;font:700 22px/1 var(--display);color:var(--ink);margin-top:11px}.metric:nth-child(2) b{color:var(--cyan)}.metric:nth-child(3) b{color:var(--magenta)}
    section{padding:108px 0;border-bottom:1px solid var(--line)}.section-head{display:grid;grid-template-columns:150px 1fr 260px;gap:26px;align-items:start;margin-bottom:50px}.section-head h2{font:700 clamp(39px,5.8vw,82px)/.82 var(--display);letter-spacing:-.05em;text-transform:uppercase;margin:0}.section-head h2 span{color:var(--cyan)}.section-head p{margin:5px 0 0;color:var(--muted)}.section-index{color:var(--magenta)}.about-grid{display:grid;grid-template-columns:.76fr 1.24fr;gap:14px}.bio-module,.location-module,.edu-card,.course,.experience-card,.project,.article,.certificate{border:1px solid var(--line);background:var(--panel)}.bio-module{min-height:360px;padding:clamp(26px,5vw,66px);display:flex;flex-direction:column;justify-content:space-between}.bio-module blockquote{font:700 clamp(27px,3.7vw,52px)/1.04 var(--display);letter-spacing:-.04em;margin:0}.bio-module blockquote span{color:var(--cyan)}.bio-module p{max-width:700px;color:var(--muted);margin:28px 0 0}.about-side{display:grid;grid-template-rows:1fr auto;gap:14px}.location-module{padding:25px;background:linear-gradient(135deg,var(--panel),rgba(84,232,225,.05));display:flex;align-items:end;justify-content:space-between;gap:20px}.location-module b{font:700 clamp(25px,3vw,42px)/1 var(--display);text-transform:uppercase}.data-line{display:flex;gap:6px;flex-wrap:wrap}.data-line span{padding:7px 9px;border:1px solid var(--line);font-size:10px;color:#b3bec2}.education{background:#080a0c}.edu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.edu-card{min-height:255px;padding:25px;display:flex;flex-direction:column;justify-content:space-between}.edu-card time{color:var(--magenta)}.edu-card h3{font:700 clamp(24px,3vw,39px)/1 var(--display);letter-spacing:-.035em;text-transform:uppercase;margin:0 0 13px}.edu-card p{color:var(--muted);margin:0}.skills-layout{display:grid;grid-template-columns:.72fr 1.28fr;gap:14px}.skill-panel{padding:24px;border:1px solid var(--line);background:var(--panel2)}.skills{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}.skills span{padding:8px 10px;border:1px solid var(--line);color:#c4cdd1;font-size:10px}.skills span:nth-child(5n+1){border-color:rgba(84,232,225,.65);color:var(--cyan)}.course-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.course{min-height:176px;padding:20px}.course .section-index{display:block}.course h3{font:700 18px/1.1 var(--display);text-transform:uppercase;margin:32px 0 8px}.course p{font-size:12px;color:var(--muted);margin:0}.experience{background:linear-gradient(135deg,#0c0f12,#07090a)}.experience-card{display:grid;grid-template-columns:160px 1fr 1fr;gap:28px;padding:30px;border-top:2px solid var(--cyan)}.experience-card h3{font:700 clamp(30px,4vw,56px)/.9 var(--display);letter-spacing:-.045em;text-transform:uppercase;margin:0}.experience-card p{color:var(--muted);margin-top:0}.experience-card ul{list-style:none;padding:0;margin:24px 0 0}.experience-card li{padding:10px 0;border-top:1px solid var(--line);font-size:12px}.experience-card li:before{content:'//';color:var(--magenta);margin-right:8px}
    .project-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.project{grid-column:span 4;min-width:0;transition:.24s}.project:nth-child(1),.project:nth-child(5){grid-column:span 8;display:grid;grid-template-columns:1.05fr .95fr}.project:hover{border-color:rgba(84,232,225,.72);transform:translateY(-4px)}.project-image{height:210px;margin:0;overflow:hidden;background:#161a1d}.project:nth-child(1) .project-image,.project:nth-child(5) .project-image{height:100%;min-height:300px}.project-image img{width:100%;height:100%;object-fit:cover;filter:grayscale(.35) saturate(.65) contrast(1.06);transition:.4s}.project:hover img{transform:scale(1.035);filter:grayscale(0) saturate(.85)}.project-copy{padding:20px;min-width:0}.project h3,.article h3{font:700 21px/1.05 var(--display);letter-spacing:-.02em;text-transform:uppercase;margin:16px 0 10px;overflow-wrap:anywhere}.project p,.article p{font-size:12px;color:var(--muted);margin:0}.tags{margin-top:18px;color:var(--cyan);overflow-wrap:anywhere}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:-18px 0 28px}.filters button{min-height:44px;padding:9px 13px;border:1px solid var(--line);background:transparent;color:#b8c2c6;font-size:10px;text-transform:uppercase}.filters button.active,.filters button:hover{border-color:var(--magenta);color:#fff;background:rgba(233,82,168,.14)}.article-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.article{min-width:0;padding:14px;border-top:2px solid var(--line)}.article:nth-child(3n+2){border-top-color:var(--cyan)}.article:nth-child(3n+3){border-top-color:var(--magenta)}.article img{width:100%;height:180px;object-fit:cover;margin:13px 0 16px;filter:grayscale(.25) saturate(.65)}.more{min-height:44px;display:inline-flex;align-items:center;margin-top:12px;color:var(--cyan);font-size:10px;text-transform:uppercase}.cert-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.certificate{display:grid;grid-template-columns:155px 1fr;gap:18px;padding:14px;min-width:0}.certificate img{width:100%;height:140px;object-fit:cover;filter:grayscale(.35)}.certificate h3{font:700 18px/1.1 var(--display);text-transform:uppercase;margin:12px 0 8px}.certificate p{font-size:12px;color:var(--muted);margin:0}
    .contact{background:var(--panel2)}.contact-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:7vw}.contact-claim{font:700 clamp(32px,4.8vw,64px)/.95 var(--display);letter-spacing:-.045em;text-transform:uppercase;margin:0}.contact-claim span{color:var(--magenta)}.contact-links{margin-top:30px;border-top:1px solid var(--line)}.contact-links a{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);font-size:10px;text-transform:uppercase}.contact-links a span:last-child{color:var(--cyan);overflow-wrap:anywhere;text-align:right}label{display:block;margin:0 0 7px;color:#adb7bb;font-size:10px;text-transform:uppercase}input,textarea{width:100%;min-height:44px;margin-bottom:14px;padding:12px 13px;border:1px solid var(--line);border-radius:0;background:#080a0c;color:#fff}textarea{min-height:140px;resize:vertical}input:focus,textarea:focus{outline:2px solid var(--cyan);outline-offset:2px}#status{min-height:23px}.footer{padding:28px 0;background:#020303}.footer-row{display:flex;align-items:center;justify-content:space-between;gap:20px}.footer-links{display:flex;gap:6px;flex-wrap:wrap}.footer-links a{min-height:44px;display:flex;align-items:center;padding:0 7px;font-size:9px;text-transform:uppercase}.loading,.failure{padding:24px 0;color:var(--muted)}.reveal{opacity:0;transform:translateY(16px);transition:.62s ease}.reveal.in{opacity:1;transform:none}:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}@keyframes signal{from{transform:translateX(-10%)}to{transform:translateX(170%)}}
    @media(max-width:980px){.nav{display:none}.topbar{grid-template-columns:1fr 1fr}.system{display:none}.hero-grid{grid-template-columns:1fr}.portrait-frame{min-height:480px}.section-head{grid-template-columns:110px 1fr}.section-head>p{grid-column:2}.about-grid,.skills-layout,.contact-grid{grid-template-columns:1fr}.experience-card{grid-template-columns:120px 1fr}.experience-card>div:last-child{grid-column:2}.project{grid-column:span 6}.project:nth-child(1),.project:nth-child(5){grid-column:span 12}.article-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:600px){.shell{width:calc(100% - 28px)}.topbar{height:64px}.hero{min-height:auto;padding-top:28px}.hero-copy{padding:52px 20px 34px;clip-path:none}.hero h1{font-size:51px}.portrait-frame{min-height:410px;clip-path:none}.hero-metrics{grid-template-columns:1fr}.metric{min-height:65px}.section-head{grid-template-columns:1fr;gap:9px}.section-head>p{grid-column:auto}.section-head h2{font-size:42px}.edu-grid,.course-grid,.article-grid,.cert-grid{grid-template-columns:1fr}.experience-card{grid-template-columns:1fr;padding:21px}.experience-card>div:last-child{grid-column:auto}.project,.project:nth-child(1),.project:nth-child(5){grid-column:span 12;display:block}.project:nth-child(1) .project-image,.project:nth-child(5) .project-image{height:210px;min-height:0}.certificate{grid-template-columns:110px 1fr}.footer-row{align-items:flex-start;flex-direction:column}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}

<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="shell topbar"><a class="brand" href="#top">CJC<span>//</span>06</a><nav class="nav" id="nav" aria-label="Primary navigation"></nav><div class="system tagline">SYS <strong>ONLINE</strong> / 2026</div></header>
  <main id="content"></main>
  <footer class="footer"><div class="shell footer-row"><div><div class="brand">CJC<span>//</span>SIGNAL</div><small class="tagline" id="footer-note"></small></div><div class="footer-links" id="footer-links"></div></div></footer>
  <script>window.THEME_ID='06-cyberpunk';</script>
  <script src="/shared/profile.js"></script><script src="/shared/site-data.js"></script>
  <script>
  (()=>{'use strict';
    const P=CJCData.profile,t=CJCData.t.bind(CJCData),e=CJCData.escapeHtml;let projects=[],articles=[],filter='all';
    const L={en:{nav:[['about','Profile'],['education','Education'],['skills','Stack'],['work','Projects'],['journal','Archive'],['contact','Contact']],heroA:'Signal',heroB:'Architect',heroLead:'Designing reliable systems at the intersection of software, research, and human context.',about:'Human layer',aboutLead:'Identity, intent, and the thinking behind the interface',education:'Training data',educationLead:'Formal study translated into a durable foundation',skills:'System stack',skillsLead:'Tools and active areas of practice',courses:'Active modules',experience:'Field record',experienceLead:'Work under real constraints, measured by real outcomes',projects:'Built systems',projectsLead:'Selected projects with working context and live destinations',journal:'Signal archive',journalLead:'Notes on technology, systems, and the craft of building',cert:'Verified records',certLead:'Certificates and milestones from continued practice',contact:'Open channel',contactLead:'For collaboration, considered questions, and new systems',view:'Inspect project',read:'Access entry',failed:'Signal unavailable. Please retry shortly.',send:'Transmit message',sending:'Transmitting…',sent:'Transmission received.',name:'Identity / name',email:'Return address / email',message:'Message payload',loc:'Node location',cv:'Download CV',github:'GitHub'},zh:{nav:[['about','简介'],['education','教育'],['skills','技术栈'],['work','项目'],['journal','文章'],['contact','联系']],heroA:'信号',heroB:'架构者',heroLead:'在软件、研究与人的真实语境交汇处，设计可靠系统。',about:'人的一层',aboutLead:'身份、意图与界面背后的思考',education:'训练数据',educationLead:'把正式学习转译成持久的基础',skills:'系统栈',skillsLead:'工具与正在持续实践的领域',courses:'活跃模块',experience:'现场记录',experienceLead:'在真实约束下工作，以真实结果衡量',projects:'已构建系统',projectsLead:'具有实际语境和有效入口的精选项目',journal:'信号档案',journalLead:'关于技术、系统与创造手艺的记录',cert:'验证记录',certLead:'持续实践中的证书与里程碑',contact:'开放频道',contactLead:'为了合作、认真问题与新的系统',view:'检查项目',read:'访问条目',failed:'信号暂时不可用，请稍后重试。',send:'传输消息',sending:'传输中…',sent:'消息已接收。',name:'身份 / 姓名',email:'返回地址 / 邮箱',message:'消息内容',loc:'节点位置',cv:'下载简历',github:'GitHub'}};
    const l=()=>L[CJCData.lang()];const head=(n,title,note)=>`<div class="section-head reveal"><div class="section-index tagline">SEC_${String(n).padStart(2,'0')}</div><h2>${e(title)}</h2><p>${e(note)}</p></div>`;const link=(href,label)=>`<a href="${e(href)}">${e(label)}</a>`;
function hero(){const x=l(),photo=P.photos&&P.photos.graduation||P.avatar;return `<section class="hero" id="top"><div class="shell hero-grid"><div class="hero-copy"><div class="tagline">${e(t(P.greeting))} / <strong>${e(t(P.role))}</strong></div><h1>${e(x.heroA)}<span>${e(x.heroB)}</span></h1><p class="hero-lead">${e(x.heroLead)} <b>${e(t(P.headline))}</b></p><div class="hero-actions"><a class="button primary" href="${e(t(P.cv))}" download>${e(x.cv)}</a><a class="button" href="${e(P.contact.github)}" target="_blank" rel="noopener">${e(x.github)}</a></div></div><div class="hero-media"><figure class="portrait-frame"><img src="${e(photo)}" onerror="this.onerror=null;this.src='${e(P.avatar)}'" alt="Portrait of ${e(t(P.name))}"><figcaption class="portrait-data tagline"><span>${e(t(P.name))}</span><span>${e(t(P.location))}</span></figcaption></figure><div class="signal" aria-hidden="true"></div><div class="hero-metrics"><div class="metric tagline">Mode<b>Build</b></div><div class="metric tagline">Status<b>Live</b></div><div class="metric tagline">Node<b>06</b></div></div></div></div></section>`}
    function about(){const x=l();return `<section id="about"><div class="shell">${head(1,x.about,x.aboutLead)}<div class="about-grid"><article class="bio-module reveal"><div><blockquote>${e(t(P.bio[0]))} <span>${e(t(P.role))}</span></blockquote><p>${e(t(P.bio[1]))}</p></div><div class="data-line">${P.skillTags.slice(0,5).map(s=>`<span>${e(s)}</span>`).join('')}</div></article><div class="about-side"><div class="location-module reveal"><div><div class="tagline">${e(x.loc)}</div><b>${e(t(P.location))}</b></div><span class="section-index tagline">31.23 N<br>121.47 E</span></div><div class="signal" aria-hidden="true"></div></div></div></div></section>`}
    function education(){const x=l();return `<section id="education" class="education"><div class="shell">${head(2,x.education,x.educationLead)}<div class="edu-grid reveal">${P.education.map(s=>`<article class="edu-card"><time class="tagline">${e(s.period)}</time><div><h3>${e(t(s.school))}</h3><p>${e(t(s.degree))}<br>${e(t(s.note))}</p></div></article>`).join('')}</div></div></section>`}
    function skills(){const x=l();return `<section id="skills"><div class="shell">${head(3,x.skills,x.skillsLead)}<div class="skills-layout"><div class="skill-panel reveal"><div class="tagline">CORE_CAPABILITIES</div><div class="skills">${P.skillTags.map(s=>`<span>${e(s)}</span>`).join('')}</div></div><div><div class="tagline" style="margin-bottom:12px">${e(x.courses)}</div><div class="course-grid reveal">${P.courses.map((c,i)=>`<article class="course"><span class="section-index tagline">MOD_${String(i+1).padStart(2,'0')}</span><h3>${e(t(c.title))}</h3><p>${e(t(c.desc))}</p></article>`).join('')}</div></div></div></div></section>`}
    function experience(){const x=l(),v=P.experience[0];return `<section id="experience" class="experience"><div class="shell">${head(4,x.experience,x.experienceLead)}<article class="experience-card reveal"><time class="section-index tagline">${e(v.period)}<br>${e(t(v.company))}</time><h3>${e(t(v.role))}</h3><div><p>${e(t(v.summary))}</p><ul>${v.bullets.map(b=>`<li>${e(t(b))}</li>`).join('')}</ul></div></article></div></section>`}
    function projectView(){const x=l(),body=projects.length?`<div class="project-grid reveal">${projects.map((p,i)=>`<a class="project" href="${e(p.href)}"><figure class="project-image"><img loading="lazy" src="${e(p.cover_image||'/index_page/img/blogs/1.jpg')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(p.localTitle())}"></figure><div class="project-copy"><div class="section-index tagline">SYS_${String(i+1).padStart(2,'0')} / ${e(x.view)}</div><h3>${e(p.localTitle())}</h3><p>${e(p.localSummary()||'')}</p><div class="tags tagline">${e(p.tech_stack||t(P.ui.tech_stack))}</div></div></a>`).join('')}</div>`:`<p class="loading">${e(t(P.ui.loading_projects))}</p>`;return `<section id="work"><div class="shell">${head(5,x.projects,x.projectsLead)}${body}</div></section>`}
    function articleView(){const x=l(),list=CJCData.filterArticles(articles,filter),body=!articles.length?`<p class="loading">${e(t(P.ui.loading_articles))}</p>`:!list.length?`<p class="loading">${e(t(P.ui.no_articles))}</p>`:`<div class="article-grid reveal">${list.map(a=>`<article class="article"><time class="section-index tagline">${e(a.category||'')} / ${e(a.dateText())}</time><img loading="lazy" src="${e(a.cover_image||'/index_page/img/blogs/1.jpg')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(a.localTitle())}"><h3>${e(a.localTitle())}</h3><p>${e(a.localSummary()||'')}</p><a class="more" href="${e(a.href)}">${e(x.read)} →</a></article>`).join('')}</div>`;return `<section id="journal"><div class="shell">${head(6,x.journal,x.journalLead)}<div class="filters" aria-label="Article categories">${P.articleFilters.map(f=>`<button type="button" data-filter="${e(f.key)}" class="${filter===f.key?'active':''}">${e(t(f.label))}</button>`).join('')}</div>${body}</div></section>`}
    function certificates(){const x=l();return `<section id="certificates"><div class="shell">${head(7,x.cert,x.certLead)}<div class="cert-grid reveal">${P.certificates.map(c=>`<article class="certificate"><img loading="lazy" src="${e(c.image)}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(t(c.title))}"><div><div class="section-index tagline">${e(t(c.tag))} / ${e(t(c.date))}</div><h3>${e(t(c.title))}</h3><p>${e(t(c.desc))}</p></div></article>`).join('')}</div></div></section>`}
    function contact(){const x=l();return `<section id="contact" class="contact"><div class="shell">${head(8,x.contact,x.contactLead)}<div class="contact-grid"><div class="reveal"><p class="contact-claim">${e(t(P.ui.inbox_open))} <span>//</span></p><div class="contact-links"><a href="mailto:${e(P.contact.email)}"><span>Email</span><span>${e(P.contact.email)}</span></a><a href="${e(P.contact.phoneHref)}"><span>Phone</span><span>${e(P.contact.phone)}</span></a><a href="${e(P.contact.github)}" target="_blank" rel="noopener"><span>GitHub</span><span>@${e(P.contact.githubUser)}</span></a><a href="${e(P.contact.wechatQrPage)}"><span>WeChat</span><span>QR_CHANNEL</span></a></div></div><form class="reveal" id="contact-form"><input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true"><label for="contact-name">${e(x.name)}</label><input id="contact-name" name="name" autocomplete="name" required><label for="contact-email">${e(x.email)}</label><input id="contact-email" type="email" name="email" autocomplete="email" required><label for="contact-message">${e(x.message)}</label><textarea id="contact-message" name="message" required></textarea><button class="button primary" type="submit">${e(x.send)}</button><p id="status" role="status" aria-live="polite"></p></form></div></div></section>`}
    function render(){const x=l();document.documentElement.lang=CJCData.lang();document.title=`${t(P.name)} — Signal Archive`;document.getElementById('nav').innerHTML=x.nav.map(v=>`<a href="#${e(v[0])}">${e(v[1])}</a>`).join('');document.getElementById('content').innerHTML=hero()+about()+education()+skills()+experience()+projectView()+articleView()+certificates()+contact();document.getElementById('footer-note').textContent=t(P.ui.footer_desc);document.getElementById('footer-links').innerHTML=link(P.contact.github,'GitHub')+link('mailto:'+P.contact.email,'Email')+link(P.contact.wechatQrPage,'WeChat')+link('/admin.html',t(P.ui.admin_panel))+link(P.icpUrl,P.icp);wire();observe()}
    function wire(){document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;render()}));const f=document.getElementById('contact-form');if(f)f.addEventListener('submit',async ev=>{ev.preventDefault();const s=document.getElementById('status'),x=l(),btn=f.querySelector('button');btn.disabled=true;s.textContent=x.sending;try{const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});s.textContent=r.message||x.sent;f.reset()}catch(err){s.textContent=err.message||x.failed}finally{btn.disabled=false}})}
    let observer;function observe(){if(matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('.reveal').forEach(n=>n.classList.add('in'));return}if(observer)observer.disconnect();observer=new IntersectionObserver(entries=>entries.forEach(v=>{if(v.isIntersecting){v.target.classList.add('in');observer.unobserve(v.target)}}),{threshold:.08});document.querySelectorAll('.reveal').forEach(n=>observer.observe(n))}
    document.addEventListener('DOMContentLoaded',async()=>{CJCData.setTheme(window.THEME_ID);render();CJCData.mountSwitcher({accent:'#54e8e1'});CJCData.onLang(render);try{[projects,articles]=await Promise.all([CJCData.fetchProjects(),CJCData.fetchArticles()]);render()}catch(err){document.querySelectorAll('.loading').forEach(n=>{n.className='failure';n.textContent=l().failed})}});
  })();
  </script>
</body>
</html>

    .project-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.project{background:var(--panel);border:1px solid var(--line);transition:.25s}.project:hover{transform:translateY(-6px);border-color:var(--red)}.project-image{height:215px;margin:0;overflow:hidden;background:#202224}.project-image img{width:100%;height:100%;object-fit:cover;filter:saturate(.62) contrast(1.04);transition:.45s}.project:hover img{transform:scale(1.035);filter:saturate(.9)}.project-copy{padding:20px}.project h3,.article h3{font:400 29px/1 var(--serif);letter-spacing:-.035em;margin:13px 0 9px}.project p,.article p{font-size:12px;color:var(--silver);margin:0}.tags{color:#ef8b84;margin-top:17px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:-20px 0 30px}.filters button{padding:8px 12px;border:1px solid var(--line);background:transparent;color:var(--white);font:700 9px var(--mono);letter-spacing:.07em;text-transform:uppercase}.filters button.active,.filters button:hover{background:var(--red);border-color:var(--red)}.article-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.article{border-top:2px solid var(--white);padding-top:13px}.article img{width:100%;height:180px;object-fit:cover;margin:14px 0;filter:grayscale(.3) saturate(.65)}.more{display:inline-block;margin-top:16px;color:#ef8b84;font:700 9px var(--mono);letter-spacing:.08em;text-transform:uppercase}.certificates{background:var(--white);color:#18191a}.certificates .section-head p{color:#676a6c}.cert-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.certificate{display:grid;grid-template-columns:145px 1fr;gap:18px;padding:14px;border:1px solid rgba(0,0,0,.22)}.certificate img{width:100%;height:135px;object-fit:cover}.certificate h3{font:400 25px/1 var(--serif);margin:12px 0 7px}.certificate p{font-size:12px;color:#626567;margin:0}
    .contact{background:#161719}.contact-grid{display:grid;grid-template-columns:.82fr 1.18fr;gap:8vw}.contact-claim{font:400 clamp(35px,5vw,68px)/.95 var(--serif);letter-spacing:-.045em;margin:0}.contact-links{border-top:1px solid var(--line);margin-top:30px}.contact-links a{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid var(--line);font:700 9px var(--mono);letter-spacing:.08em;text-transform:uppercase}.contact-links a span:last-child{color:#ef8b84}label{display:block;margin-bottom:6px;color:#bbbdbd;font:700 9px var(--mono);letter-spacing:.1em;text-transform:uppercase}input,textarea{width:100%;padding:12px 13px;margin-bottom:15px;border:1px solid var(--line);border-radius:0;background:#0e0f10;color:#fff}textarea{min-height:135px;resize:vertical}input:focus,textarea:focus{outline:2px solid var(--red);outline-offset:2px}#status{min-height:23px}.footer{padding:30px 0;background:#050606;color:var(--white)}.footer-row{display:flex;align-items:center;justify-content:space-between;gap:20px}.footer-links{display:flex;gap:16px;flex-wrap:wrap}.footer a,.footer small{font:700 9px var(--mono);letter-spacing:.08em;text-transform:uppercase}.footer small{display:block;margin-top:6px;color:var(--silver)}.footer small a{color:#ddd9d2}.loading,.failure{padding:24px 0;color:var(--silver)}.reveal{opacity:0;transform:translateY(18px);transition:.68s ease}.reveal.in{opacity:1;transform:none}:focus-visible{outline:2px solid var(--red);outline-offset:3px}
    .filters button{min-height:44px}.contact-links a{align-items:center;min-height:44px}
    @media(max-width:900px){.nav{display:none}.section-head{grid-template-columns:110px 1fr}.section-head>p{grid-column:2}.about-grid,.practice-grid,.contact-grid{grid-template-columns:1fr}.edu,.experience-card{grid-template-columns:110px 1fr}.edu p,.experience-card>div:last-child{grid-column:2}.project-grid,.article-grid{grid-template-columns:repeat(2,1fr)}.cert-grid{grid-template-columns:1fr}}

  <script>
  (()=>{'use strict';
    const P=CJCData.profile,t=CJCData.t.bind(CJCData),e=CJCData.escapeHtml;let projects=[],articles=[],filter='all',videoTime=0,userPaused=false;
    const L={en:{nav:[['about','Profile'],['education','Education'],['work','Projects'],['journal','Journal'],['contact','Contact']],heroA:'The road',heroB:'ahead',heroLead:'Building useful systems with clarity, control, and a long view.',about:'Behind the wheel',aboutLead:'The person, point of view, and working philosophy',education:'Origins',educationLead:'The formal route behind a practical discipline',practice:'Working setup',practiceLead:'Tools and studies that keep the practice moving',courses:'Current studies',experience:'Road tested',experienceLead:'Applied work, real constraints, measurable outcomes',projects:'Selected machines',projectsLead:'Projects built to work beyond the presentation',journal:'Field notes',journalLead:'Writing from the intersection of technology and craft',cert:'Credentials',certLead:'Proof of continued practice and professional growth',contact:'Take the next road',contactLead:'For a new build, a considered question, or a clear hello',view:'View project',read:'Read article',failed:'Content could not be loaded. Please try again shortly.',send:'Send message',sending:'Sending…',sent:'Message sent.',name:'Your name',email:'Email address',message:'Your message',loc:'Based in',cv:'Download CV',github:'GitHub',pause:'Pause motion',play:'Play motion'},zh:{nav:[['about','简介'],['education','教育'],['work','项目'],['journal','文章'],['contact','联系']],heroA:'驶向',heroB:'前方',heroLead:'以清晰、掌控与长远视角，构建真正有用的系统。',about:'驾驶者',aboutLead:'关于人、判断与工作方法',education:'起点',educationLead:'构成实践能力的正式学习路径',practice:'工作配置',practiceLead:'让实践持续前进的工具与研究',courses:'近期研习',experience:'道路验证',experienceLead:'真实约束下，以结果检验工作',projects:'精选作品',projectsLead:'不止用于展示，而是能够真正工作的项目',journal:'路上札记',journalLead:'写在技术与手艺的交汇处',cert:'专业凭证',certLead:'持续实践与专业成长的记录',contact:'走下一段路',contactLead:'为了新的项目、认真问题，或清晰的一声问候',view:'查看项目',read:'阅读文章',failed:'内容暂时无法加载，请稍后重试。',send:'发送消息',sending:'发送中…',sent:'消息已发送。',name:'你的姓名',email:'邮箱地址',message:'想说的话',loc:'常驻',cv:'下载简历',github:'GitHub',pause:'暂停动态',play:'播放动态'}};
    const l=()=>L[CJCData.lang()];const head=(n,title,note)=>`<div class="section-head reveal"><div class="section-num label">${String(n).padStart(2,'0')} / 08</div><h2>${e(title)}</h2><p>${e(note)}</p></div>`;const link=(href,label)=>`<a href="${e(href)}">${e(label)}</a>`;
function hero(){const x=l();return `<section class="hero" id="top"><img class="hero-photo" src="/themes/73-cardrive-motion/assets/driver-road.jpg" alt="First-person view from a real car interior onto an open road" fetchpriority="high" decoding="async"><video class="hero-video" id="hero-video" autoplay muted loop playsinline preload="metadata" poster="/themes/73-cardrive-motion/assets/driver-road.jpg" aria-hidden="true" tabindex="-1" disablepictureinpicture><source data-src="/themes/73-cardrive-motion/assets/drive-loop.mp4" type="video/mp4"></video><button class="video-toggle" id="hero-video-toggle" type="button" aria-controls="hero-video" aria-pressed="false" hidden>${e(x.pause)}</button><div class="shell hero-inner"><div class="hero-copy"><div class="label">${e(t(P.greeting))} / ${e(t(P.role))}</div><h1>${e(x.heroA)}<em>${e(x.heroB)}</em></h1><p class="hero-lead">${e(x.heroLead)} ${e(t(P.headline))}</p><div class="hero-actions"><a class="btn primary" href="${e(t(P.cv))}" download>${e(x.cv)}</a><a class="btn" href="${e(P.contact.github)}" target="_blank" rel="noopener">${e(x.github)}</a></div></div><div class="hero-meta label"><div>${e(t(P.name))}<br>${e(t(P.title))}</div><div>Perspective<br>Driver / creator</div><div>${e(t(P.location))}<br>31.23 N / 121.47 E</div></div></div></section>`}
function about(){const x=l(),photo=P.photos&&P.photos.graduation||P.avatar;return `<section id="about"><div class="shell">${head(1,x.about,x.aboutLead)}<div class="about-grid"><figure class="portrait reveal"><img src="${e(photo)}" onerror="this.onerror=null;this.src='${e(P.avatar)}'" alt="${e(t(P.name))}"><figcaption class="label">${e(x.loc)} / ${e(t(P.location))}</figcaption></figure><div class="about-copy reveal"><p class="statement">${e(t(P.bio[0]))} <em>${e(t(P.role))}.</em></p><p class="body">${e(t(P.bio[1]))}</p></div></div></div></section>`}
    function education(){const x=l();return `<section id="education" class="education"><div class="shell">${head(2,x.education,x.educationLead)}<div class="edu-list reveal">${P.education.map(s=>`<article class="edu"><time class="label">${e(s.period)}</time><h3>${e(t(s.school))}</h3><p>${e(t(s.degree))}<br>${e(t(s.note))}</p></article>`).join('')}</div></div></section>`}
    function practice(){const x=l();return `<section id="skills"><div class="shell">${head(3,x.practice,x.practiceLead)}<div class="practice-grid"><div class="skill-cloud reveal">${P.skillTags.map(s=>`<span>${e(s)}</span>`).join('')}</div><div><div class="label" style="margin-bottom:15px">${e(x.courses)}</div><div class="courses reveal">${P.courses.map((c,i)=>`<article class="course"><span class="course-num label">0${i+1}</span><h3>${e(t(c.title))}</h3><p>${e(t(c.desc))}</p></article>`).join('')}</div></div></div></div></section>`}
    function experience(){const x=l(),v=P.experience[0];return `<section id="experience" class="experience"><div class="shell">${head(4,x.experience,x.experienceLead)}<article class="experience-card reveal"><time class="label section-num">${e(v.period)}<br>${e(t(v.company))}</time><h3>${e(t(v.role))}</h3><div><p>${e(t(v.summary))}</p><ul>${v.bullets.map(b=>`<li>${e(t(b))}</li>`).join('')}</ul></div></article></div></section>`}
    function projectView(){const x=l(),body=projects.length?`<div class="project-grid reveal">${projects.map((p,i)=>`<a class="project" href="${e(p.detailHref)}"><figure class="project-image"><img loading="lazy" src="${e(p.cover_image||'/index_page/img/blogs/1.jpg')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(p.localTitle())}"></figure><div class="project-copy"><div class="label section-num">Machine ${String(i+1).padStart(2,'0')} / ${e(x.view)}</div><h3>${e(p.localTitle())}</h3><p>${e(p.localSummary()||'')}</p><div class="tags label">${e(p.tech_stack||t(P.ui.tech_stack))}</div></div></a>`).join('')}</div>`:`<p class="loading">${e(t(P.ui.loading_projects))}</p>`;return `<section id="work"><div class="shell">${head(5,x.projects,x.projectsLead)}${body}</div></section>`}
    function articleView(){const x=l(),list=CJCData.filterArticles(articles,filter),body=!articles.length?`<p class="loading">${e(t(P.ui.loading_articles))}</p>`:!list.length?`<p class="loading">${e(t(P.ui.no_articles))}</p>`:`<div class="article-grid reveal">${list.map(a=>`<article class="article"><time class="label section-num">${e(a.category||'')} / ${e(a.dateText())}</time><img loading="lazy" src="${e(a.cover_image||'/index_page/img/blogs/1.jpg')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(a.localTitle())}"><h3>${e(a.localTitle())}</h3><p>${e(a.localSummary()||'')}</p><a class="more" href="${e(a.detailHref)}">${e(x.read)} →</a></article>`).join('')}</div>`;return `<section id="journal"><div class="shell">${head(6,x.journal,x.journalLead)}<div class="filters" aria-label="Article categories">${P.articleFilters.map(f=>`<button type="button" data-filter="${e(f.key)}" class="${filter===f.key?'active':''}">${e(t(f.label))}</button>`).join('')}</div>${body}</div></section>`}
    function certificates(){const x=l();return `<section id="certificates" class="certificates"><div class="shell">${head(7,x.cert,x.certLead)}<div class="cert-grid reveal">${P.certificates.map(c=>`<article class="certificate"><img loading="lazy" src="${e(c.image)}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(t(c.title))}"><div><div class="label section-num">${e(t(c.tag))} / ${e(t(c.date))}</div><h3>${e(t(c.title))}</h3><p>${e(t(c.desc))}</p></div></article>`).join('')}</div></div></section>`}
    function contact(){const x=l();return `<section id="contact" class="contact"><div class="shell">${head(8,x.contact,x.contactLead)}<div class="contact-grid"><div class="reveal"><p class="contact-claim">${e(t(P.ui.inbox_open))}</p><div class="contact-links"><a href="mailto:${e(P.contact.email)}"><span>Email</span><span>${e(P.contact.email)}</span></a><a href="${e(P.contact.phoneHref)}"><span>Phone</span><span>${e(P.contact.phone)}</span></a><a href="${e(P.contact.github)}" target="_blank" rel="noopener"><span>GitHub</span><span>@${e(P.contact.githubUser)}</span></a><a href="${e(P.contact.wechatQrPage)}"><span>WeChat</span><span>QR</span></a></div></div><form class="reveal" id="contact-form"><input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true"><label for="name">${e(x.name)}</label><input id="name" name="name" autocomplete="name" required><label for="email">${e(x.email)}</label><input id="email" type="email" name="email" autocomplete="email" required><label for="message">${e(x.message)}</label><textarea id="message" name="message" required></textarea><button class="btn" type="submit">${e(x.send)}</button><p id="status" role="status" aria-live="polite"></p></form></div></div></section>`}
function render(){const oldVideo=document.getElementById('hero-video');if(oldVideo&&Number.isFinite(oldVideo.currentTime))videoTime=oldVideo.currentTime;const x=l();document.documentElement.lang=CJCData.lang();document.title=`${t(P.name)} — Road in Motion`;document.getElementById('nav').innerHTML=x.nav.map(v=>`<a href="#${e(v[0])}">${e(v[1])}</a>`).join('');document.getElementById('content').innerHTML=hero()+about()+education()+practice()+experience()+projectView()+articleView()+certificates()+contact();document.getElementById('footer-note').textContent=t(P.ui.footer_desc);document.getElementById('footer-links').innerHTML=link(P.contact.github,'GitHub')+link('mailto:'+P.contact.email,'Email')+link(P.contact.wechatQrPage,'WeChat')+link('/admin.html',t(P.ui.admin_panel))+link(P.icpUrl,P.icp);wire();setupHeroVideo();observe();if(window.CJCReactBits)CJCReactBits.applyThemePreset(window.THEME_ID,document.getElementById('content'))}
    function wire(){document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;render()}));const f=document.getElementById('contact-form');if(f)f.addEventListener('submit',async ev=>{ev.preventDefault();const s=document.getElementById('status'),x=l(),btn=f.querySelector('button');btn.disabled=true;s.textContent=x.sending;try{const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});s.textContent=r.message||x.sent;f.reset()}catch(err){s.textContent=err.message||x.failed}finally{btn.disabled=false}})}
    function setupHeroVideo(){const video=document.getElementById('hero-video'),button=document.getElementById('hero-video-toggle'),source=video&&video.querySelector('source'),motion=matchMedia('(prefers-reduced-motion: reduce)'),connection=navigator.connection||navigator.mozConnection||navigator.webkitConnection,slow=connection&&(connection.saveData||/^(slow-)?2g$/.test(connection.effectiveType||''));if(!video||!button||!source||motion.matches||slow)return;video.muted=true;video.defaultMuted=true;source.src=source.dataset.src;const syncButton=()=>{const paused=video.paused;button.textContent=paused?l().play:l().pause;button.setAttribute('aria-pressed',String(paused))};video.addEventListener('canplay',()=>{if(video.duration&&videoTime)video.currentTime=Math.min(videoTime,Math.max(0,video.duration-.05));video.classList.add('is-ready');button.hidden=false;if(!userPaused)video.play().catch(()=>{userPaused=true;syncButton()});syncButton()},{once:true});video.addEventListener('timeupdate',()=>{videoTime=video.currentTime});video.addEventListener('error',()=>{button.hidden=true;video.classList.remove('is-ready')},{once:true});button.addEventListener('click',()=>{if(video.paused){userPaused=false;video.play().then(syncButton).catch(syncButton)}else{userPaused=true;video.pause();syncButton()}});video.load()}
    let observer;function observe(){if(matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('.reveal').forEach(n=>n.classList.add('in'));return}if(observer)observer.disconnect();observer=new IntersectionObserver(es=>es.forEach(v=>{if(v.isIntersecting){v.target.classList.add('in');observer.unobserve(v.target)}}),{threshold:.08});document.querySelectorAll('.reveal').forEach(n=>observer.observe(n))}
    document.addEventListener('DOMContentLoaded',async()=>{CJCData.setTheme(window.THEME_ID);render();CJCData.mountSwitcher({accent:'#d53b32'});CJCData.onLang(render);try{[projects,articles]=await Promise.all([CJCData.fetchProjects(),CJCData.fetchArticles()]);render()}catch(err){document.querySelectorAll('.loading').forEach(n=>{n.className='failure';n.textContent=l().failed})}});
  })();
  </script>
<script>
  new MutationObserver(function(){document.querySelectorAll('img').forEach(function(img){if(!img.hasAttribute('loading'))img.loading='lazy';img.decoding='async';});}).observe(document.body,{childList:true,subtree:true});
</script></body>

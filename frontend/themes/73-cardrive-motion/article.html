<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journal / Road in Motion</title><style>
:root{--bg:#080b10;--panel:#111923;--ink:#f4f7fb;--muted:#9aa9b8;--cyan:#36d8ff;--orange:#ff7a45;--line:rgba(255,255,255,.2);--serif:Georgia,serif;--mono:'Courier New',monospace}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 70% 0,#142b3b 0,#080b10 45%);color:var(--ink);font:16px/1.65 Arial,sans-serif;overflow-x:hidden}.shell{width:min(1100px,calc(100% - 40px));margin:auto}a{color:inherit}.top{position:sticky;top:0;z-index:5;background:rgba(8,11,16,.95);border-bottom:1px solid var(--line)}.bar{min-height:74px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}.mark{font-weight:700;font-size:18px}.mark i{font:italic 20px var(--serif);color:var(--cyan)}.nav{display:flex;gap:16px;flex-wrap:wrap;margin-left:auto}.nav a,.lang{min-height:44px;display:inline-flex;align-items:center;padding:8px 10px;text-transform:uppercase;text-decoration:none;font:700 10px var(--mono);letter-spacing:.1em;border:1px solid transparent;background:none;color:var(--ink);cursor:pointer}.nav a:hover,.lang:hover{border-color:var(--cyan);color:var(--cyan)}.motion-strip{height:4px;background:linear-gradient(90deg,transparent,var(--cyan),var(--orange),transparent);background-size:220% 100%;animation:drive 4s linear infinite}@keyframes drive{to{background-position:-220% 0}}.crumb{display:inline-block;color:var(--cyan);font:700 10px var(--mono);letter-spacing:.13em;text-transform:uppercase;margin-top:66px}.cjc-d-meta{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0 12px;font:700 10px var(--mono);text-transform:uppercase}.cjc-d-meta span{border:1px solid var(--line);padding:5px 9px}.cjc-d-meta .cjc-d-cat,.cjc-d-meta .cjc-d-tech{border-color:var(--cyan);color:var(--cyan)}.cjc-d-title{font:400 clamp(42px,8vw,92px)/.88 var(--serif);letter-spacing:-.06em;max-width:14ch;margin:0 0 30px}.cjc-d-cover{border:1px solid var(--line);background:var(--panel);margin-bottom:30px;box-shadow:0 12px 40px rgba(0,0,0,.28)}.cjc-d-cover img{display:block;width:100%;max-height:480px;object-fit:cover}.cjc-d-body{background:#f4f7fb;color:#111923;padding:34px 40px;line-height:1.8;overflow-wrap:anywhere}.cjc-d-body img{max-width:100%;height:auto}.cjc-d-body pre{overflow:auto;background:#0b1219;color:#fff;padding:12px}.cjc-d-body a{color:#0a8db2}.cjc-d-summary{color:var(--muted);font-size:19px;max-width:65ch;margin-bottom:20px}.cjc-d-readfull{display:inline-flex;min-height:44px;align-items:center;padding:10px 16px;border:1px solid var(--cyan);color:var(--cyan);text-decoration:none;font:700 10px var(--mono);text-transform:uppercase}.cjc-d-nav{border-top:1px solid var(--line);margin-top:44px;padding:20px 0 90px}.cjc-d-back{display:inline-flex;min-height:44px;align-items:center;color:var(--cyan);text-decoration:none;font:700 10px var(--mono);text-transform:uppercase}.foot{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font:700 10px var(--mono)}@media(max-width:720px){.nav{display:none}.shell{width:calc(100% - 28px)}.cjc-d-body{padding:22px 18px}.cjc-d-title{font-size:clamp(42px,14vw,68px)}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.motion-strip{animation:none}*{transition:none!important}}
</style></head><body><header class="top"><div class="shell bar"><a class="mark" href="./">CJC <i>Road in Motion</i></a><nav class="nav"><a href="./#about">Profile</a><a href="./#education">Education</a><a href="./#work">Projects</a><a href="./#journal">Journal</a><a href="./#certificates">Credentials</a><a href="./#experience">Experience</a><a href="./#contact">Contact</a></nav><button class="lang" id="langBtn">中文</button></div><div class="motion-strip"></div></header><main class="shell"><span class="crumb">Field notes / journal / motion</span><div id="detail"></div></main><footer class="foot"><div class="shell"><a href="./">Back to road</a> · <a href="/themes.html">Theme gallery</a></div></footer><script>window.THEME_ID='73-cardrive-motion';</script><script src="/shared/profile.js"></script><script src="/shared/site-data.js"></script><script src="/shared/detail.js"></script><script>document.addEventListener('DOMContentLoaded',function(){CJCData.setTheme(window.THEME_ID);var b=document.getElementById('langBtn');b.textContent=CJCData.lang()==='en'?'中文':'EN';b.addEventListener('click',CJCData.toggleLang);CJCData.onLang(function(l){b.textContent=l==='en'?'中文':'EN'});CJCData.mountDetail({kind:'article',mount:'#detail',accent:'#36d8ff',backHref:'./#journal'});});</script></body></html>

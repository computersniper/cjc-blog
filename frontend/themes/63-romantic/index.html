<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Love Letter</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{ --blush:#fbeef0; --blush2:#f6e3ec; --rose:#e5698e; --rose2:#d9527a; --gold:#c9a86a; --gold2:#e6cf9e;
      --ink:#5b4149; --mut:#9c8189; --line:rgba(217,82,122,.2); --paper:#fffafc; }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;color:var(--ink);font-family:'Nunito Sans',system-ui,sans-serif;line-height:1.7;overflow-x:hidden;
      background:linear-gradient(180deg,var(--blush) 0%,var(--blush2) 55%,#f4dce6 100%);background-attachment:fixed}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    .script{font-family:'Parisienne',cursive}
    .serif{font-family:'Cormorant Garamond',Georgia,serif}
    h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600}
    .wrap{max-width:960px;margin:0 auto;padding:0 22px;position:relative;z-index:2}

    #petals{position:fixed;inset:0;z-index:1;pointer-events:none}

    .topbar{position:sticky;top:0;z-index:30;background:rgba(255,250,252,.72);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
    .topbar .row{display:flex;align-items:center;justify-content:space-between;height:60px}
    .brand{font-family:'Parisienne';font-size:26px;color:var(--rose)}
    .nav{display:flex;gap:18px}
    .nav a{font-size:14px;color:var(--mut);font-weight:600}
    .nav a:hover{color:var(--rose)}
    @media(max-width:880px){.nav{display:none}}

    section{padding:52px 0}
    /* letter page */
    .letter{background:var(--paper);border-radius:6px;padding:40px 44px;position:relative;
      box-shadow:0 20px 50px rgba(197,113,138,.22);border:1px solid rgba(217,82,122,.12)}
    .letter::before{content:"";position:absolute;inset:10px;border:1px solid rgba(201,168,106,.4);border-radius:4px;pointer-events:none}
    .letter::after{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:60px;height:14px;
      background:linear-gradient(90deg,var(--rose2),var(--rose));border-radius:0 0 8px 8px;box-shadow:0 3px 8px rgba(217,82,122,.4)}
    @media(max-width:560px){.letter{padding:30px 22px}}
    .sec-head{text-align:center;margin-bottom:26px}
    .sec-head .k{font-family:'Parisienne';color:var(--rose);font-size:24px}
    .sec-head h2{font-size:clamp(26px,4.4vw,42px);margin:2px 0 0;letter-spacing:.01em}
    .divider{text-align:center;color:var(--gold);font-size:18px;margin:14px 0 24px;letter-spacing:.5em}

    /* HERO */
    .hero{padding:64px 0 30px;text-align:center}
    .env{max-width:560px;margin:0 auto;background:var(--paper);border-radius:8px;padding:44px 34px;position:relative;
      box-shadow:0 26px 60px rgba(197,113,138,.28);border:1px solid rgba(217,82,122,.14)}
    .env .flap{position:absolute;top:0;left:0;right:0;height:70px;
      background:linear-gradient(180deg,#fff3f7,#f7dfe9);clip-path:polygon(0 0,100% 0,50% 100%);
      border-bottom:1px solid rgba(217,82,122,.14)}
    .seal{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--rose),var(--rose2));
      display:grid;place-items:center;color:#ffe;font-size:22px;margin:8px auto 16px;position:relative;z-index:2;
      box-shadow:inset 0 0 12px rgba(0,0,0,.25),0 6px 14px rgba(217,82,122,.4)}
    .greet{font-family:'Parisienne';color:var(--rose);font-size:26px;position:relative;z-index:2}
    .hero h1{font-size:clamp(46px,10vw,96px);line-height:1;margin:6px 0 6px;color:var(--ink)}
    .hero .role{font-family:'Parisienne';font-size:clamp(22px,3.4vw,32px);color:var(--rose2)}
    .hero .tag{color:var(--mut);max-width:40ch;margin:14px auto 22px;font-size:17px}
    .btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
    .btn{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:15px;padding:12px 24px;border-radius:999px;
      cursor:pointer;transition:.16s;border:1px solid transparent}
    .btn.pri{background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;box-shadow:0 8px 20px rgba(217,82,122,.35)}
    .btn.pri:hover{transform:translateY(-2px)}
    .btn.gho{border-color:var(--gold);color:#8a6d2e;background:#fffaf2}
    .btn.gho:hover{background:#fff4e0}

    .ribbon{display:inline-block;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));color:#6a5320;
      padding:5px 22px;font-family:'Cormorant Garamond';font-weight:600;letter-spacing:.14em;font-size:13px;margin-bottom:8px;
      clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%)}

    /* about */
    .about{display:grid;grid-template-columns:200px 1fr;gap:26px;align-items:start}
    @media(max-width:680px){.about{grid-template-columns:1fr;text-align:center}}
    .about .pic{border-radius:50% 50% 50% 50%/60% 60% 40% 40%;overflow:hidden;border:4px solid #fff;box-shadow:0 14px 30px rgba(217,82,122,.28)}
    .about .pic img{width:100%;aspect-ratio:.85;object-fit:cover}
    .about p{margin:0 0 12px;font-size:17px;max-width:60ch}
    @media(min-width:681px){.about p{text-align:left}}
    .loc{display:inline-flex;gap:8px;align-items:center;color:var(--rose);font-family:'Cormorant Garamond';font-weight:600;font-size:17px}

    /* rows */
    .rows{display:flex;flex-direction:column;gap:20px}
    .rowi{padding-left:26px;position:relative}
    .rowi::before{content:"❦";position:absolute;left:0;top:2px;color:var(--rose)}
    .rowi .p{font-family:'Cormorant Garamond';color:var(--rose2);font-weight:600;font-size:16px}
    .rowi h3{margin:2px 0 3px;font-size:22px}
    .rowi .s{color:var(--mut)}
    .rowi ul{margin:8px 0 0;padding-left:18px;line-height:1.8}

    /* skills */
    .skills{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    @media(max-width:640px){.skills{grid-template-columns:1fr 1fr}}
    @media(max-width:420px){.skills{grid-template-columns:1fr}}
    .sk{text-align:center;padding:18px 14px;border:1px solid var(--line);border-radius:10px;background:#fff6f9}
    .sk .h{color:var(--rose);font-size:18px}
    .sk .v{margin-top:6px;font-family:'Cormorant Garamond';font-size:17px;font-weight:600}
    .tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
    .tags span{font-family:'Cormorant Garamond';font-weight:600;font-size:15px;padding:6px 16px;border-radius:999px;
      border:1px solid var(--rose);color:var(--rose2);background:#fff6f9}

    /* courses */
    .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    @media(max-width:760px){.courses{grid-template-columns:1fr 1fr}}
    @media(max-width:480px){.courses{grid-template-columns:1fr}}
    .course{padding:22px;border:1px solid var(--line);border-radius:12px;background:#fff8fb;text-align:center;transition:.16s}
    .course:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(217,82,122,.18)}
    .course i.fa{color:var(--rose);font-size:24px}
    .course h4{margin:12px 0 8px;font-size:20px}
    .course p{margin:0;color:var(--mut);font-size:15px}

    /* cards */
    .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
    @media(max-width:640px){.cards{grid-template-columns:1fr}}
    .card{border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;background:#fff;
      transition:.16s;box-shadow:0 10px 26px rgba(217,82,122,.12)}
    .card:hover{transform:translateY(-5px);box-shadow:0 20px 40px rgba(217,82,122,.22)}
    .card .cover{height:180px;overflow:hidden;background:#f6dfe8}
    .card .cover img{width:100%;height:100%;object-fit:cover;transition:.4s}
    .card:hover .cover img{transform:scale(1.05)}
    .cbody{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
    .ctag{display:flex;justify-content:space-between;font-family:'Cormorant Garamond';font-size:13px;color:var(--rose2);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
    .card h4{margin:0;font-size:21px;line-height:1.25}
    .card p{margin:0;color:var(--mut);font-size:15px;flex:1}
    .tech{color:var(--gold);font-family:'Cormorant Garamond';font-weight:600;font-size:14px}
    .more{color:var(--rose);font-weight:700;font-size:14px}

    .filters{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-bottom:24px}
    .filters button{font-family:'Cormorant Garamond';font-weight:600;font-size:15px;background:#fff6f9;border:1px solid var(--line);
      color:var(--mut);padding:6px 18px;border-radius:999px;cursor:pointer;transition:.15s}
    .filters button.active,.filters button:hover{background:var(--rose);border-color:var(--rose);color:#fff}

    /* certs */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    @media(max-width:600px){.certs{grid-template-columns:1fr}}
    .cert{display:grid;grid-template-columns:120px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
    .cert img{width:100%;height:100%;object-fit:cover;min-height:140px}
    .cert .ct{padding:16px}
    .cert .meta{display:flex;justify-content:space-between;font-family:'Cormorant Garamond';font-size:13px;color:var(--rose2);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
    .cert h4{margin:8px 0 6px;font-size:19px}
    .cert p{margin:0;color:var(--mut);font-size:14.5px}
    @media(max-width:400px){.cert{grid-template-columns:88px 1fr}}

    /* contact */
    .contact{display:grid;grid-template-columns:1fr 1.2fr;gap:26px}
    @media(max-width:760px){.contact{grid-template-columns:1fr}}
    .cinfo a{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-weight:600}
    .cinfo a span:last-child{color:var(--rose)}
    form input,form textarea{width:100%;background:#fff6f9;border:1px solid var(--line);border-radius:10px;color:var(--ink);
      font-family:inherit;font-size:15px;padding:14px;margin-bottom:13px}
    form input:focus,form textarea:focus{outline:none;border-color:var(--rose)}
    form textarea{min-height:120px;resize:vertical}
    #cf-status{font-weight:700;margin-top:4px;font-size:14px}

    footer{padding:40px 0 60px;text-align:center}
    .fsoc{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
    .fsoc a{color:var(--mut);font-weight:600;font-size:13px}
    .fsoc a:hover{color:var(--rose)}
    .muted{color:#b09aa1;font-size:13px;margin-top:12px}
    .load-note{grid-column:1/-1;color:var(--mut);text-align:center;padding:18px;border:1px dashed var(--line);border-radius:10px}

    @media(prefers-reduced-motion:reduce){ *{scroll-behavior:auto} }
  </style>
</head>
<body>
  <canvas id="petals" aria-hidden="true"></canvas>

  <div class="topbar"><div class="wrap row">
    <a class="brand" href="#top">Cai Jiechao</a>
    <nav class="nav" id="nav"></nav>
  </div></div>

  <div id="top"></div>
  <header class="hero"><div class="wrap">
    <div class="env">
      <div class="flap"></div>
      <div class="seal">♥</div>
      <div class="greet" id="greet"></div>
      <h1 id="name"></h1>
      <div class="role" id="role"></div>
      <p class="tag" id="tag"></p>
      <div class="btns">
        <a class="btn pri" id="cvBtn" download><i class="fa fa-heart"></i><span></span></a>
        <a class="btn gho" id="ghBtn" target="_blank" rel="noopener"><i class="fa fa-github"></i>GitHub</a>
      </div>
    </div>
  </div></header>

  <section id="about"><div class="wrap"><div class="letter">
    <div class="sec-head"><div class="k">page one</div><h2 id="l-about"></h2></div>
    <div class="divider">♥ ❦ ♥</div>
    <div class="about"><div class="pic"><img id="portrait" alt="Cai Jiechao portrait" /></div>
      <div><div id="bio"></div><span class="loc" id="loc"></span></div></div>
  </div></div></section>

  <section id="education"><div class="wrap"><div class="letter">
    <div class="sec-head"><div class="k">page two</div><h2 id="l-edu"></h2></div>
    <div class="divider">♥ ❦ ♥</div>
    <div class="rows" id="edu"></div>
  </div></div></section>

  <section id="skills"><div class="wrap"><div class="letter">
    <div class="sec-head"><div class="k">page three</div><h2 id="l-skills"></h2></div>
    <div class="divider">♥ ❦ ♥</div>
    <div class="skills" id="skills-box"></div>
    <div class="tags" id="tags"></div>
  </div></div></section>

  <section id="courses"><div class="wrap"><div class="letter">
    <div class="sec-head"><div class="k">page four</div><h2 id="l-courses"></h2></div>
    <div class="divider">♥ ❦ ♥</div>
    <div class="courses" id="courses-box"></div>
  </div></div></section>

  <section id="experience"><div class="wrap"><div class="letter">
    <div class="sec-head"><div class="k">page five</div><h2 id="l-exp"></h2></div>
    <div class="divider">♥ ❦ ♥</div>
    <div class="rows" id="exp"></div>
  </div></div></section>

  <section id="projects"><div class="wrap"><div class="letter">
    <div class="sec-head"><div class="k">page six</div><h2 id="l-projects"></h2></div>
    <div class="divider">♥ ❦ ♥</div>
    <div class="cards" id="projects-box"><div class="load-note" id="proj-load"></div></div>
  </div></div></section>

  <section id="articles"><div class="wrap"><div class="letter">
    <div class="sec-head"><div class="k">page seven</div><h2 id="l-articles"></h2></div>
    <div class="divider">♥ ❦ ♥</div>
    <div class="filters" id="filters"></div>
    <div class="cards" id="articles-box"><div class="load-note" id="art-load"></div></div>
  </div></div></section>

  <section id="certificates"><div class="wrap"><div class="letter">
    <div class="sec-head"><div class="k">page eight</div><h2 id="l-certs"></h2></div>
    <div class="divider">♥ ❦ ♥</div>
    <div class="certs" id="certs"></div>
  </div></div></section>

  <section id="contact"><div class="wrap"><div class="letter">
    <div class="sec-head"><div class="k">with love</div><h2 id="l-contact"></h2></div>
    <div class="divider">♥ ❦ ♥</div>
    <div class="contact">
      <div class="cinfo" id="cinfo"></div>
      <form id="cf">
        <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
        <input type="text" name="name" id="cf-name" required>
        <input type="email" name="email" id="cf-email" required>
        <textarea name="message" id="cf-msg" required></textarea>
        <button type="submit" class="btn pri" id="cf-send"></button>
        <p id="cf-status"></p>
      </form>
    </div>
  </div></div></section>

  <footer><div class="wrap">
    <div class="fsoc" id="fsoc"></div>
    <div class="muted" id="foot-desc"></div>
    <a class="muted" id="foot-icp" target="_blank" rel="noopener" style="display:inline-block"></a>
  </div></footer>

  <script>window.THEME_ID = "63-romantic";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P=CJCData.profile,t=CJCData.t.bind(CJCData),esc=CJCData.escapeHtml;
    let articles=[],projects=[],filterKey="all";
    const hearts=['♥','❀','❦','✿','❤','✾'];

    function renderStatic(){
      document.getElementById('nav').innerHTML=[
        ['about','nav_about'],['skills','nav_courses'],['projects','nav_portfolio'],
        ['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');
      document.getElementById('greet').textContent=t(P.greeting);
      document.getElementById('name').textContent=t(P.name);
      document.getElementById('role').textContent=t(P.role);
      document.getElementById('tag').textContent=t(P.title);
      const cv=document.getElementById('cvBtn'); cv.href=t(P.cv); cv.querySelector('span').textContent=t(P.ui.download_cv);
      document.getElementById('ghBtn').href=P.contact.github;
      document.getElementById('portrait').src=P.avatar;

      document.getElementById('l-about').textContent=t(P.ui.about_me);
      document.getElementById('l-edu').textContent=t(P.ui.education_bg);
      document.getElementById('l-skills').textContent=t(P.ui.core_tech);
      document.getElementById('l-courses').textContent=t(P.ui.core_courses);
      document.getElementById('l-exp').textContent=t(P.ui.internship_exp);
      document.getElementById('l-projects').textContent=t(P.ui.latest_projects);
      document.getElementById('l-articles').textContent=t(P.ui.latest_articles);
      document.getElementById('l-certs').textContent=t(P.ui.certificates);
      document.getElementById('l-contact').textContent=t(P.ui.get_in_touch);

      document.getElementById('bio').innerHTML=P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('');
      document.getElementById('loc').innerHTML=`<i class="fa fa-map-marker"></i> ${esc(t(P.location))}`;

      document.getElementById('edu').innerHTML=P.education.map(e=>`
        <div class="rowi"><div class="p">${esc(e.period)}</div>
        <h3>${esc(t(e.school))}</h3><div class="s">${esc(t(e.degree))} — ${esc(t(e.note))}</div></div>`).join('');

      document.getElementById('skills-box').innerHTML=P.skills.map((s,i)=>`
        <div class="sk"><div class="h">${hearts[i%hearts.length]}</div><div class="v">${esc(s)}</div></div>`).join('');
      document.getElementById('tags').innerHTML=P.skillTags.map(x=>`<span>${esc(x)}</span>`).join('');

      document.getElementById('courses-box').innerHTML=P.courses.map(c=>`
        <div class="course"><i class="fa ${esc(c.icon)}"></i><h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');

      document.getElementById('exp').innerHTML=P.experience.map(x=>`
        <div class="rowi"><div class="p">${esc(x.period)}</div>
        <h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3>
        <div class="s">${esc(t(x.summary))}</div>
        <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div>`).join('');

      document.getElementById('certs').innerHTML=P.certificates.map(c=>`
        <div class="cert"><img src="${esc(c.image)}" alt="${esc(t(c.title))}" onerror="this.src='/index_page/img/blogs/1.jpg'">
        <div class="ct"><div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');

      document.getElementById('cinfo').innerHTML=[
        ['Email',P.contact.email,'mailto:'+P.contact.email],
        ['Phone',P.contact.phone,P.contact.phoneHref],
        ['GitHub','@'+P.contact.githubUser,P.contact.github],
        ['WeChat','QR ↗',P.contact.wechatQrPage]
      ].map(([k,v,h])=>`<a href="${esc(h)}"><span>${esc(k)}</span><span>${esc(v)}</span></a>`).join('');
      document.getElementById('cf-name').placeholder=t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder=t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder=t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent=t(P.ui.send);

      document.getElementById('fsoc').innerHTML=`
        <a href="${P.contact.github}" target="_blank" rel="noopener">GitHub</a>
        <a href="mailto:${P.contact.email}">Email</a>
        <a href="${P.contact.wechatQrPage}">WeChat</a>
        <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent=t(P.ui.footer_desc);
      const icp=document.getElementById('foot-icp'); icp.textContent=P.icp; icp.href=P.icpUrl;

      document.getElementById('filters').innerHTML=P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box=document.getElementById('projects-box');
      if(!projects.length){ box.innerHTML=`<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML=projects.map(p=>`
        <a class="card" href="${esc(p.href)}">
          <div class="cbody">
            <div class="ctag"><span>${esc(t(P.ui.tech_stack))}</span><span>${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <p class="tech">${esc(p.tech_stack||'')}</p>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div></a>`).join('');
    }
    function renderArticles(){
      const box=document.getElementById('articles-box');
      const list=CJCData.filterArticles(articles,filterKey);
      if(!list.length){ box.innerHTML=`<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML=list.map(a=>`
        <a class="card" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
          <div class="cbody">
            <div class="ctag"><span>${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div></a>`).join('');
    }
    async function loadDynamic(){
      try{ projects=await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-box').innerHTML=`<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles=await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-box').innerHTML=`<div class="load-note">⚠ Failed to load articles.</div>`; }
    }

    document.getElementById('cf').addEventListener('submit',async(e)=>{
      e.preventDefault();
      const f=e.target,s=document.getElementById('cf-status');
      s.style.color='var(--mut)'; s.textContent=t(P.ui.sending);
      try{ const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});
        s.style.color='var(--rose)'; s.textContent=(r.message||'Sent with love.')+' ♥'; f.reset(); }
      catch(err){ s.style.color='var(--rose2)'; s.textContent=err.message; }
    });

    // floating petals
    const RM=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    if(!RM){
      const cv=document.getElementById('petals'), ctx=cv.getContext('2d');
      let W,H,parts=[];
      function resize(){ W=cv.width=window.innerWidth; H=cv.height=window.innerHeight; }
      resize(); window.addEventListener('resize',resize);
      const cols=['#f7b7cd','#f28cae','#e5698e','#ffd0dd','#f9c6d6'];
      function spawn(){ return {x:Math.random()*W,y:Math.random()*-H,vy:.4+Math.random()*1.1,vx:(Math.random()-.5)*.7,
        r:6+Math.random()*8,rot:Math.random()*6,vr:(Math.random()-.5)*.05,sw:Math.random()*3,c:cols[Math.floor(Math.random()*cols.length)]}; }
      for(let i=0;i<50;i++){ const p=spawn(); p.y=Math.random()*H; parts.push(p); }
      function draw(){
        ctx.clearRect(0,0,W,H);
        parts.forEach(p=>{
          p.y+=p.vy; p.x+=p.vx+Math.sin(p.y*.02+p.sw)*.7; p.rot+=p.vr;
          if(p.y>H+20){ Object.assign(p,spawn()); p.y=-10; }
          ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=.8; ctx.fillStyle=p.c;
          ctx.beginPath(); ctx.moveTo(0,-p.r);
          ctx.bezierCurveTo(p.r,-p.r,p.r,p.r*.6,0,p.r);
          ctx.bezierCurveTo(-p.r,p.r*.6,-p.r,-p.r,0,-p.r);
          ctx.fill(); ctx.restore();
        });
        requestAnimationFrame(draw);
      }
      draw();
    }

    document.addEventListener('DOMContentLoaded',()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({accent:'#e5698e'});
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

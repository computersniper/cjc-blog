<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — A Letter For You</title>
  <meta name="description" content="A wax-sealed love letter that opens into a keepsake album — the personal site of Cai Jiechao, reimagined as a romantic letter." />
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{
      --blush:#fbeef1; --blush2:#f6dfe8; --blush3:#f2d3e0;
      --rose:#e5698e; --rose2:#d9527a; --rose-soft:#f7b7cd;
      --gold:#c9a86a; --gold2:#e7d3a3; --wax:#c33a5c; --wax2:#9e2942;
      --ink:#5a3f47; --ink2:#7a5860; --mut:#a98f97; --line:rgba(217,82,122,.20);
      --paper:#fffafc; --paper2:#fff4f8; --cream:#fdf6ec;
      --script:'Parisienne',cursive;
      --serif:'Cormorant Garamond',Georgia,'Songti SC',serif;
      --body:'Nunito Sans','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;color:var(--ink);font-family:var(--body);line-height:1.72;overflow-x:hidden;
      background:
        radial-gradient(1100px 700px at 15% -8%, #fff2f7 0%, transparent 55%),
        radial-gradient(900px 600px at 92% 4%, #f7e6d8 0%, transparent 50%),
        linear-gradient(180deg,var(--blush) 0%,var(--blush2) 48%,var(--blush3) 100%);
      background-attachment:fixed;}
    body.locked{overflow:hidden;height:100vh}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    ::selection{background:var(--rose);color:#fff}
    :focus-visible{outline:2px solid var(--rose2);outline-offset:3px;border-radius:4px}
    .script{font-family:var(--script)}
    .serif{font-family:var(--serif)}
    h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0}
    .wrap{max-width:920px;margin:0 auto;padding:0 22px;position:relative;z-index:3}

    /* ---------- atmosphere layers ---------- */
    #petals{position:fixed;inset:0;z-index:1;pointer-events:none}
    .bokeh{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    .bokeh span{position:absolute;border-radius:50%;filter:blur(6px);opacity:.5;
      background:radial-gradient(circle at 35% 35%, #ffe9b8, rgba(255,210,140,.25) 60%, transparent 72%);
      animation:bokehFloat 14s ease-in-out infinite}
    @keyframes bokehFloat{0%,100%{transform:translateY(0) scale(1);opacity:.35}50%{transform:translateY(-26px) scale(1.12);opacity:.6}}
    .grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.04;
      background-image:radial-gradient(rgba(120,60,80,.9) .5px,transparent .6px);background-size:3px 3px}

    /* ---------- intro: sealed envelope ---------- */
    .seal-scene{position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:26px;padding:24px;text-align:center;
      background:
        radial-gradient(700px 480px at 50% 40%, rgba(255,232,196,.5), transparent 62%),
        radial-gradient(1200px 800px at 50% 120%, rgba(197,58,92,.18), transparent 60%),
        linear-gradient(180deg,#3a2028,#25141b 85%);
      transition:opacity .8s ease,visibility .8s ease}
    .seal-scene.gone{opacity:0;visibility:hidden;pointer-events:none}
    .scene-hint{font-family:var(--script);color:#ffdcae;font-size:clamp(22px,4vw,32px);
      text-shadow:0 2px 12px rgba(0,0,0,.4);letter-spacing:.02em}
    .scene-sub{font-family:var(--serif);color:#f3cdae;font-size:14px;letter-spacing:.32em;text-transform:uppercase;
      opacity:.85;margin-top:-14px}
    .envelope{position:relative;width:min(420px,86vw);aspect-ratio:1.55/1;cursor:pointer;
      filter:drop-shadow(0 26px 46px rgba(0,0,0,.45));transition:transform .5s ease}
    .envelope:hover{transform:translateY(-4px) scale(1.015)}
    .env-body{position:absolute;inset:0;border-radius:10px;
      background:linear-gradient(150deg,#fbeee0,#f3dcc6 60%,#eccfb2);
      box-shadow:inset 0 0 0 1px rgba(160,110,70,.25)}
    .env-pocket{position:absolute;left:0;right:0;bottom:0;top:44%;border-radius:0 0 10px 10px;
      background:linear-gradient(160deg,#f7e6d3,#e9ccae);
      clip-path:polygon(0 100%,0 12%,50% 66%,100% 12%,100% 100%);box-shadow:inset 0 4px 10px rgba(150,100,60,.12)}
    .env-flap{position:absolute;left:0;right:0;top:0;height:66%;transform-origin:top center;z-index:6;
      background:linear-gradient(170deg,#f6e2cd,#ecceac);clip-path:polygon(0 0,100% 0,50% 100%);
      box-shadow:0 4px 10px rgba(150,100,60,.14);transition:transform .8s cubic-bezier(.5,-.3,.3,1.2)}
    .opening .env-flap{transform:rotateX(178deg);z-index:1}
    .wax{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:88px;height:88px;z-index:8;
      border:0;background:transparent;cursor:pointer;padding:0}
    .wax .half{position:absolute;inset:0;display:grid;place-items:center;
      color:#ffdfe6;font-size:30px;
      background:radial-gradient(circle at 40% 34%, #e0466a, var(--wax) 46%, var(--wax2) 100%);
      border-radius:50%;box-shadow:inset 0 0 14px rgba(0,0,0,.35),0 6px 16px rgba(120,20,40,.5);
      -webkit-clip-path:inset(0);clip-path:inset(0);transition:transform .55s ease,opacity .55s ease}
    .wax .half::after{content:"❤";position:absolute}
    .wax .half.left{clip-path:inset(0 50% 0 0)}
    .wax .half.right{clip-path:inset(0 0 0 50%)}
    .opening .wax .half.left{transform:translate(-40px,26px) rotate(-32deg);opacity:0}
    .opening .wax .half.right{transform:translate(40px,26px) rotate(32deg);opacity:0}
    .wax-ring{position:absolute;inset:-8px;border-radius:50%;border:2px dashed rgba(255,220,180,.5);
      animation:ringPulse 2.4s ease-in-out infinite}
    @keyframes ringPulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.12);opacity:.9}}
    .opening .wax-ring{opacity:0;transition:opacity .3s}
    .env-letter{position:absolute;left:6%;right:6%;bottom:10%;top:30%;background:var(--paper);border-radius:6px;z-index:3;
      box-shadow:0 10px 24px rgba(120,60,80,.3);opacity:0;transform:translateY(20px);
      display:grid;place-items:center;color:var(--rose2);font-family:var(--script);font-size:26px;
      transition:transform .9s cubic-bezier(.2,.8,.2,1) .25s,opacity .6s ease .25s}
    .opening .env-letter{opacity:1;transform:translateY(-58%)}
    .skip-seal{background:none;border:1px solid rgba(255,220,180,.4);color:#ffdcae;font-family:var(--serif);
      font-size:13px;letter-spacing:.2em;text-transform:uppercase;padding:8px 18px;border-radius:999px;cursor:pointer;
      transition:.2s}
    .skip-seal:hover{background:rgba(255,220,180,.12);border-color:#ffdcae}

    /* ---------- top ribbon bar ---------- */
    .topbar{position:sticky;top:0;z-index:40;background:rgba(255,250,252,.78);backdrop-filter:blur(9px);
      -webkit-backdrop-filter:blur(9px);border-bottom:1px solid var(--line)}
    .topbar .row{display:flex;align-items:center;justify-content:space-between;height:58px;gap:14px}
    .brand{font-family:var(--script);font-size:27px;color:var(--rose);line-height:1}
    .nav{display:flex;gap:20px}
    .nav a{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink2)}
    .nav a:hover{color:var(--rose)}
    @media(max-width:900px){.nav{display:none}.topbar .row{justify-content:flex-start}}
    /* keep clear of the fixed theme switcher on desktop */
    @media(min-width:901px){.topbar .row{padding-right:200px}}

    /* ---------- shared page (scrapbook sheet) ---------- */
    section{padding:44px 0;position:relative}
    .page{position:relative;background:linear-gradient(180deg,var(--paper),var(--paper2));border-radius:8px;
      padding:40px 42px 44px;box-shadow:0 22px 48px rgba(197,113,138,.20);border:1px solid rgba(217,82,122,.12)}
    .page::before{content:"";position:absolute;inset:9px;border:1px solid rgba(201,168,106,.35);border-radius:5px;pointer-events:none}
    @media(max-width:560px){.page{padding:30px 20px 34px}}
    .tape{position:absolute;width:96px;height:30px;background:rgba(230,196,150,.42);z-index:4;
      box-shadow:0 2px 6px rgba(150,110,60,.14);backdrop-filter:blur(1px)}
    .tape::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.25) 0 6px,transparent 6px 12px)}
    .tape.tl{top:-13px;left:34px;transform:rotate(-6deg)}
    .tape.tr{top:-13px;right:34px;transform:rotate(5deg)}
    .chapter{text-align:center;margin-bottom:8px}
    .chapter .k{font-family:var(--script);color:var(--rose);font-size:26px;line-height:1}
    .chapter h2{font-size:clamp(28px,4.6vw,44px);margin:2px 0 0;letter-spacing:.01em;color:var(--ink)}
    .flower-div{display:flex;justify-content:center;margin:14px 0 26px;color:var(--gold)}
    .flower-div svg{width:200px;max-width:64%;height:auto}

    /* ---------- HERO = the opened letter ---------- */
    .hero{padding:60px 0 26px}
    .letter{position:relative;max-width:720px;margin:0 auto;background:
        linear-gradient(180deg,var(--cream),#fbeee2);
      border-radius:8px;padding:52px 54px 46px;text-align:center;
      box-shadow:0 30px 70px rgba(150,80,100,.28);border:1px solid rgba(201,168,106,.4);
      background-image:repeating-linear-gradient(180deg,transparent 0 33px,rgba(150,100,120,.05) 33px 34px),
        linear-gradient(180deg,var(--cream),#fbeee2)}
    .letter::before{content:"";position:absolute;inset:12px;border:1px solid rgba(201,168,106,.35);border-radius:5px;pointer-events:none}
    @media(max-width:560px){.letter{padding:40px 24px 36px}}
    .opened-seal{width:58px;height:58px;margin:0 auto 6px;border-radius:50%;position:relative;
      background:radial-gradient(circle at 40% 34%, #e0466a, var(--wax) 46%, var(--wax2) 100%);
      display:grid;place-items:center;color:#ffdfe6;font-size:22px;
      box-shadow:inset 0 0 12px rgba(0,0,0,.32),0 6px 14px rgba(120,20,40,.42);
      clip-path:polygon(50% 0,62% 20%,52% 26%,70% 30%,58% 46%,76% 52%,60% 60%,72% 78%,52% 70%,50% 92%,48% 70%,28% 78%,40% 60%,24% 52%,42% 46%,30% 30%,48% 26%,38% 20%)}
    .greet{font-family:var(--script);color:var(--rose);font-size:clamp(26px,4vw,34px);line-height:1.1}
    .hero h1{font-size:clamp(46px,10vw,92px);line-height:.98;margin:2px 0 4px;color:var(--ink);font-weight:700}
    .hero .role{font-family:var(--script);font-size:clamp(22px,3.6vw,30px);color:var(--rose2)}
    .letterbody{margin:22px auto 0;max-width:56ch;text-align:left}
    .salut{font-family:var(--script);color:var(--rose2);font-size:26px;margin-bottom:6px}
    .letterbody p{font-family:var(--serif);font-size:clamp(17px,2.4vw,20px);color:var(--ink);margin:0 0 14px;line-height:1.72}
    .letterbody .tt{font-family:var(--serif);font-style:italic;color:var(--ink2);font-size:19px;margin:0 0 16px;text-align:center}
    .loc{display:inline-flex;gap:8px;align-items:center;color:var(--rose);font-family:var(--serif);font-weight:600;font-size:18px}
    .sign{text-align:right;margin-top:16px}
    .sign .yours{font-family:var(--serif);font-style:italic;color:var(--ink2);font-size:18px}
    .sign .who{font-family:var(--script);color:var(--rose);font-size:clamp(30px,5vw,44px);line-height:1;margin-top:2px}
    .btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:24px}
    .btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--serif);font-weight:600;font-size:16px;
      padding:11px 24px;border-radius:999px;cursor:pointer;transition:.18s;border:1px solid transparent;letter-spacing:.01em}
    .btn.pri{background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;box-shadow:0 10px 22px rgba(217,82,122,.35)}
    .btn.pri:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(217,82,122,.45)}
    .btn.gho{border-color:var(--gold);color:#8a6d2e;background:#fffaf2}
    .btn.gho:hover{background:#fff2df;transform:translateY(-2px)}

    /* heart-stamp easter egg trigger */
    .heart-stamp{margin:26px auto 0;width:70px;height:70px;border:0;background:transparent;cursor:pointer;position:relative;
      color:var(--wax);font-size:52px;line-height:1;display:grid;place-items:center;
      filter:drop-shadow(0 6px 10px rgba(180,40,70,.35));transition:transform .2s}
    .heart-stamp:hover{transform:scale(1.08) rotate(-4deg)}
    .heart-stamp:active{transform:scale(.94)}
    .heart-hint{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--mut);text-align:center;margin-top:4px}

    /* ---------- education / experience rows ---------- */
    .rows{display:flex;flex-direction:column;gap:22px}
    .rowi{padding-left:30px;position:relative}
    .rowi::before{content:"❦";position:absolute;left:0;top:1px;color:var(--rose);font-size:18px}
    .rowi .p{font-family:var(--serif);color:var(--rose2);font-weight:600;font-size:16px;letter-spacing:.02em}
    .rowi h3{margin:2px 0 4px;font-size:23px;color:var(--ink)}
    .rowi .s{color:var(--ink2);font-size:16px}
    .rowi ul{margin:10px 0 0;padding-left:20px;line-height:1.8}
    .rowi ul li{margin-bottom:4px;color:var(--ink2)}

    /* ---------- skills ---------- */
    .skills{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    @media(max-width:640px){.skills{grid-template-columns:1fr 1fr}}
    @media(max-width:420px){.skills{grid-template-columns:1fr}}
    .sk{text-align:center;padding:18px 14px;border:1px solid var(--line);border-radius:12px;
      background:linear-gradient(180deg,#fff7fa,#fff0f5);transition:.18s}
    .sk:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(217,82,122,.16)}
    .sk .h{color:var(--rose);font-size:20px}
    .sk .v{margin-top:6px;font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink)}
    .tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
    .tags span{font-family:var(--serif);font-weight:600;font-size:15px;padding:6px 16px;border-radius:999px;
      border:1px solid var(--rose);color:var(--rose2);background:#fff6f9;transition:.16s}
    .tags span:hover{background:var(--rose);color:#fff;transform:translateY(-2px)}

    /* ---------- courses ---------- */
    .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    @media(max-width:760px){.courses{grid-template-columns:1fr 1fr}}
    @media(max-width:480px){.courses{grid-template-columns:1fr}}
    .course{padding:22px;border:1px solid var(--line);border-radius:14px;background:#fff8fb;text-align:center;transition:.18s}
    .course:hover{transform:translateY(-4px);box-shadow:0 16px 30px rgba(217,82,122,.18)}
    .course i.fa{color:var(--rose);font-size:26px}
    .course h4{margin:12px 0 8px;font-size:20px;color:var(--ink)}
    .course p{margin:0;color:var(--ink2);font-size:15px}

    /* ---------- polaroid cards (projects + articles) ---------- */
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 22px;padding-top:8px}
    @media(max-width:820px){.cards{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:520px){.cards{grid-template-columns:1fr;justify-items:center}}
    .polaroid{position:relative;background:#fff;padding:12px 12px 16px;border-radius:3px;
      box-shadow:0 12px 26px rgba(120,60,80,.22);display:flex;flex-direction:column;
      transition:transform .2s ease,box-shadow .2s ease;width:100%;max-width:320px}
    .polaroid:nth-child(3n+1){transform:rotate(-1.6deg)}
    .polaroid:nth-child(3n+2){transform:rotate(1.1deg)}
    .polaroid:nth-child(3n+3){transform:rotate(-.6deg)}
    .polaroid:hover{transform:rotate(0deg) translateY(-6px) scale(1.02);box-shadow:0 22px 44px rgba(120,60,80,.32);z-index:5}
    .polaroid .washi{position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-3deg);width:104px;height:26px;
      background:linear-gradient(90deg,rgba(229,105,142,.55),rgba(230,196,150,.55));z-index:3;
      box-shadow:0 2px 6px rgba(150,80,90,.2)}
    .polaroid .cover{height:172px;overflow:hidden;background:linear-gradient(135deg,#f6dfe8,#f3d0c6);border-radius:2px}
    .polaroid .cover img{width:100%;height:100%;object-fit:cover;transition:.5s;filter:saturate(.96)}
    .polaroid:hover .cover img{transform:scale(1.06)}
    .polaroid .cap{padding:12px 6px 4px;display:flex;flex-direction:column;gap:6px;flex:1}
    .polaroid .meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--serif);font-size:12.5px;
      color:var(--rose2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
    .polaroid h4{font-family:var(--script);font-size:24px;color:var(--ink);line-height:1.15;font-weight:400}
    .polaroid .tech{font-family:var(--serif);color:var(--gold);font-weight:600;font-size:14px}
    .polaroid p{margin:0;color:var(--ink2);font-size:14px;line-height:1.5}
    .polaroid .more{font-family:var(--serif);color:var(--rose);font-weight:700;font-size:14px;margin-top:2px}
    .ribbon-corner{position:absolute;bottom:-6px;right:14px;width:22px;height:34px;z-index:2;
      background:var(--rose2);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);box-shadow:0 3px 6px rgba(150,40,70,.3)}

    .filters{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-bottom:24px}
    .filters button{font-family:var(--serif);font-weight:600;font-size:15px;background:#fff6f9;border:1px solid var(--line);
      color:var(--ink2);padding:6px 18px;border-radius:999px;cursor:pointer;transition:.15s}
    .filters button.active,.filters button:hover{background:var(--rose);border-color:var(--rose);color:#fff}
    .load-note{grid-column:1/-1;color:var(--mut);text-align:center;padding:20px;border:1px dashed var(--line);border-radius:12px;
      font-family:var(--serif);font-size:17px}

    /* ---------- certificates (pressed keepsakes) ---------- */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    @media(max-width:600px){.certs{grid-template-columns:1fr}}
    .cert{display:grid;grid-template-columns:118px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;
      background:#fff;box-shadow:0 10px 22px rgba(217,82,122,.12)}
    .cert img{width:100%;height:100%;object-fit:cover;min-height:150px;background:#f6dfe8}
    .cert .ct{padding:16px}
    .cert .meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--serif);font-size:13px;color:var(--rose2);
      text-transform:uppercase;letter-spacing:.04em;font-weight:600}
    .cert h4{margin:8px 0 6px;font-size:20px;color:var(--ink)}
    .cert p{margin:0;color:var(--ink2);font-size:14.5px}
    @media(max-width:400px){.cert{grid-template-columns:92px 1fr}}

    /* ---------- contact ---------- */
    .contact{display:grid;grid-template-columns:1fr 1.2fr;gap:28px}
    @media(max-width:760px){.contact{grid-template-columns:1fr}}
    .cinfo a{display:flex;justify-content:space-between;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);
      font-family:var(--serif);font-weight:600;font-size:17px}
    .cinfo a span:last-child{color:var(--rose)}
    .cinfo a:hover span:last-child{color:var(--rose2)}
    form label{display:block;font-family:var(--serif);font-size:14px;letter-spacing:.04em;color:var(--rose2);margin:0 0 5px;font-weight:600}
    form input,form textarea{width:100%;background:#fff6f9;border:1px solid var(--line);border-radius:10px;color:var(--ink);
      font-family:var(--body);font-size:15px;padding:13px;margin-bottom:14px}
    form input:focus,form textarea:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 3px rgba(229,105,142,.15)}
    form textarea{min-height:120px;resize:vertical}
    #cf-status{font-family:var(--serif);font-weight:700;margin-top:2px;font-size:16px;min-height:1.4em}

    /* ---------- footer with hidden P.S. ---------- */
    footer{padding:44px 0 70px;text-align:center;position:relative}
    .fsoc{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
    .fsoc a{color:var(--ink2);font-family:var(--serif);font-weight:600;font-size:15px}
    .fsoc a:hover{color:var(--rose)}
    .muted{color:var(--mut);font-size:13px;margin-top:6px}
    .muted a{color:var(--mut)}.muted a:hover{color:var(--rose)}
    .ps-note{margin:22px auto 0;max-width:340px;cursor:pointer;user-select:none}
    .ps-fold{background:linear-gradient(180deg,#fff8ef,#f7e7d3);border:1px solid rgba(201,168,106,.5);border-radius:8px;
      padding:10px 16px;font-family:var(--script);color:var(--rose2);font-size:22px;display:inline-flex;align-items:center;gap:8px;
      box-shadow:0 6px 14px rgba(150,110,70,.16);transition:.2s}
    .ps-fold:hover{transform:translateY(-2px)}
    .ps-body{max-height:0;overflow:hidden;transition:max-height .5s ease,opacity .4s ease,margin .4s ease;opacity:0;margin-top:0}
    .ps-note.open .ps-body{max-height:200px;opacity:1;margin-top:12px}
    .ps-body p{font-family:var(--serif);font-style:italic;color:var(--ink2);font-size:16px;margin:0;line-height:1.6}

    /* ---------- music box toggle (bottom-left, clear of switcher) ---------- */
    .musicbox{position:fixed;left:16px;bottom:16px;z-index:50;display:inline-flex;align-items:center;gap:8px;
      background:rgba(255,250,252,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      border:1px solid var(--line);border-radius:999px;padding:9px 15px;cursor:pointer;
      font-family:var(--serif);font-weight:600;font-size:14px;color:var(--rose2);box-shadow:0 8px 20px rgba(180,90,120,.18);transition:.18s}
    .musicbox:hover{transform:translateY(-2px)}
    .musicbox i{font-size:15px}
    .musicbox.on{background:var(--rose);color:#fff;border-color:var(--rose)}

    /* ---------- confession popup ---------- */
    .confession{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.7);z-index:8000;
      background:linear-gradient(180deg,var(--paper),#fff0f5);border:1px solid rgba(201,168,106,.5);border-radius:14px;
      padding:26px 30px;max-width:min(420px,88vw);text-align:center;box-shadow:0 30px 70px rgba(150,60,90,.4);
      opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s cubic-bezier(.2,1.3,.4,1)}
    .confession.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
    .confession .big{font-family:var(--script);color:var(--rose);font-size:40px;line-height:1;margin-bottom:8px}
    .confession p{font-family:var(--serif);font-size:19px;color:var(--ink);margin:0}
    #burst{position:fixed;inset:0;z-index:7999;pointer-events:none}

    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *{animation:none!important;transition:none!important}
      .bokeh{display:none}
    }
  </style>
</head>

  <script>window.THEME_ID = "63-romantic";</script>

  <script>
  (function(){
    "use strict";
    var CJC=window.CJCData, P=CJC.profile, esc=CJC.escapeHtml;
    function t(f){ return CJC.t(f); }
    var reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    var articles=[], projects=[], filterKey="all";
    var hearts=['♥','❀','❦','✿','❤','✾'];

    var STR={
      salut:{en:"My dear friend,",zh:"亲爱的朋友："},
      yours:{en:"Forever yours,",zh:"永远属于你的，"},
      psTap:{en:"(tap to unfold)",zh:"（点击展开）"},
      psText:{en:"Thank you for reading all the way to the end of my letter. If it made you smile even once — that alone made writing it worthwhile. Write back anytime. — CJC",
              zh:"谢谢你把我的信读到了最后。如果它哪怕让你微笑了一次，写下它就已值得。随时给我回信。— 蔡杰超"},
      heartHint:{en:"there is a little secret in this heart ♥",zh:"这颗心里藏着一个小秘密 ♥"},
      music:{en:"Music box",zh:"八音盒"},
      kicker:{
        edu:{en:"where I learned",zh:"求学之路"},
        skills:{en:"things I adore",zh:"心之所向"},
        courses:{en:"lessons of the heart",zh:"用心之课"},
        exp:{en:"a season of work",zh:"一段旅程"},
        projects:{en:"our little album",zh:"珍藏相册"},
        articles:{en:"pressed pages",zh:"字里行间"},
        certs:{en:"keepsakes",zh:"珍藏纪念"},
        contact:{en:"write back to me",zh:"给我回信"}
      },
      confessions:[
        {en:"You found the secret. Code is my love language. ♥",zh:"你发现了秘密。代码是我的情话。♥"},
        {en:"Roses are red, my themes are too — thanks for clicking through. ♥",zh:"玫瑰是红的，主题也是——谢谢你一路点进来。♥"},
        {en:"Every commit is a little love letter to the future. ♥",zh:"每一次提交，都是写给未来的情书。♥"},
        {en:"May your builds pass and your heart stay full. ♥",zh:"愿你构建常绿，心中长满温柔。♥"}
      ]
    };

    function scene(){ // localized intro copy
      var zh=CJC.lang()==='zh';
      document.getElementById('scene-hint').textContent = zh?'一封写给你的信…':'A letter for you…';
      document.getElementById('scene-sub').textContent = zh?'破开火漆，展信即启':'break the seal to open';
      document.getElementById('skip-seal').textContent = zh?'跳过 · 直接进入':'Skip · Enter';
    }

    function renderStatic(){
      var zh=CJC.lang()==='zh';
      document.title = (zh?'蔡杰超':'Cai Jiechao') + ' — ' + (zh?'一封信':'A Letter For You');
      scene();
      // nav
      document.getElementById('nav').innerHTML=[
        ['about','about_me'],['courses','core_courses'],['projects','nav_portfolio'],
        ['articles','nav_article'],['contact','nav_contact']
      ].map(function(x){return '<a href="#'+(x[0]==='about'?'top':x[0])+'">'+esc(t(P.ui[x[1]]))+'</a>';}).join('');
      // hero letter
      document.getElementById('greet').textContent=t(P.greeting);
      document.getElementById('name').textContent=t(P.name);
      document.getElementById('role').textContent=t(P.role);
      document.getElementById('salut').textContent=t(STR.salut);
      document.getElementById('tag').textContent=t(P.title);
      document.getElementById('bio').innerHTML=P.bio.map(function(b){return '<p>'+esc(t(b))+'</p>';}).join('');
      document.getElementById('loc').innerHTML='<i class="fa fa-map-marker" aria-hidden="true"></i> '+esc(t(P.location));
      document.getElementById('yours').textContent=t(STR.yours);
      document.getElementById('sign-who').textContent=t(P.name);
      var cv=document.getElementById('cvBtn'); cv.href=t(P.cv); cv.querySelector('span').textContent=t(P.ui.download_cv);
      document.getElementById('ghBtn').href=P.contact.github;
      document.getElementById('heart-hint').textContent=t(STR.heartHint);
      // section kickers + titles
      var K=STR.kicker;
      document.getElementById('k-edu').textContent=t(K.edu);       document.getElementById('l-edu').textContent=t(P.ui.education_bg);
      document.getElementById('k-skills').textContent=t(K.skills); document.getElementById('l-skills').textContent=t(P.ui.core_tech);
      document.getElementById('k-courses').textContent=t(K.courses);document.getElementById('l-courses').textContent=t(P.ui.core_courses);
      document.getElementById('k-exp').textContent=t(K.exp);       document.getElementById('l-exp').textContent=t(P.ui.internship_exp);
      document.getElementById('k-projects').textContent=t(K.projects);document.getElementById('l-projects').textContent=t(P.ui.latest_projects);
      document.getElementById('k-articles').textContent=t(K.articles);document.getElementById('l-articles').textContent=t(P.ui.latest_articles);
      document.getElementById('k-certs').textContent=t(K.certs);   document.getElementById('l-certs').textContent=t(P.ui.certificates);
      document.getElementById('k-contact').textContent=t(K.contact);document.getElementById('l-contact').textContent=t(P.ui.get_in_touch);
      // education
      document.getElementById('edu').innerHTML=P.education.map(function(e){return '<div class="rowi"><div class="p">'+esc(e.period)+'</div><h3>'+esc(t(e.school))+'</h3><div class="s">'+esc(t(e.degree))+' — '+esc(t(e.note))+'</div></div>';}).join('');
      // skills
      document.getElementById('skills-box').innerHTML=P.skills.map(function(s,i){return '<div class="sk"><div class="h">'+hearts[i%hearts.length]+'</div><div class="v">'+esc(s)+'</div></div>';}).join('');
      document.getElementById('tags').innerHTML=P.skillTags.map(function(x){return '<span>'+esc(x)+'</span>';}).join('');
      // courses
      document.getElementById('courses-box').innerHTML=P.courses.map(function(c){return '<div class="course"><i class="fa '+esc(c.icon)+'" aria-hidden="true"></i><h4>'+esc(t(c.title))+'</h4><p>'+esc(t(c.desc))+'</p></div>';}).join('');
      // experience
      document.getElementById('exp').innerHTML=P.experience.map(function(x){return '<div class="rowi"><div class="p">'+esc(x.period)+'</div><h3>'+esc(t(x.role))+' · '+esc(t(x.company))+'</h3><div class="s">'+esc(t(x.summary))+'</div><ul>'+x.bullets.map(function(b){return '<li>'+esc(t(b))+'</li>';}).join('')+'</ul></div>';}).join('');
      // certificates
      document.getElementById('certs').innerHTML=P.certificates.map(function(c){return '<div class="cert"><img src="'+esc(c.image)+'" alt="'+esc(t(c.title))+'" onerror="this.src=\'/index_page/img/blogs/1.jpg\'"><div class="ct"><div class="meta"><span>'+esc(t(c.tag))+'</span><span>'+esc(t(c.date))+'</span></div><h4>'+esc(t(c.title))+'</h4><p>'+esc(t(c.desc))+'</p></div></div>';}).join('');
      // contact
      document.getElementById('cinfo').innerHTML=[
        ['Email',P.contact.email,'mailto:'+P.contact.email],
        ['Phone',P.contact.phone,P.contact.phoneHref],
        ['GitHub','@'+P.contact.githubUser,P.contact.github],
        ['WeChat','QR ↗',P.contact.wechatQrPage]
      ].map(function(x){return '<a href="'+esc(x[2])+'"><span>'+esc(x[0])+'</span><span>'+esc(x[1])+'</span></a>';}).join('');
      document.getElementById('lb-name').textContent=t(P.ui.name_placeholder);
      document.getElementById('lb-email').textContent=t(P.ui.email_placeholder);
      document.getElementById('lb-msg').textContent=t(P.ui.msg_placeholder);
      document.getElementById('cf-name').placeholder=t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder=t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder=t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent=t(P.ui.send)+' ♥';
      // footer
      document.getElementById('fsoc').innerHTML=
        '<a href="'+P.contact.github+'" target="_blank" rel="noopener">GitHub</a>'+
        '<a href="mailto:'+P.contact.email+'">Email</a>'+
        '<a href="'+P.contact.wechatQrPage+'">WeChat</a>'+
        '<a href="/admin.html">'+esc(t(P.ui.admin_panel))+'</a>';
      document.getElementById('foot-desc').textContent=t(P.ui.footer_desc);
      var icp=document.getElementById('foot-icp'); icp.textContent=P.icp; icp.href=P.icpUrl;
      document.getElementById('ps-tap').textContent=t(STR.psTap);
      document.getElementById('ps-text').textContent=t(STR.psText);
      document.getElementById('mb-label').textContent=t(STR.music);
      // filters
      document.getElementById('filters').innerHTML=P.articleFilters.map(function(f){return '<button data-k="'+esc(f.key)+'" class="'+(f.key===filterKey?'active':'')+'">'+esc(t(f.label))+'</button>';}).join('');
      Array.prototype.forEach.call(document.querySelectorAll('#filters button'),function(b){b.addEventListener('click',function(){filterKey=b.dataset.k;renderStatic();renderArticles();});});
      // pressed-flower dividers
      var FL='<svg viewBox="0 0 200 26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
        +'<path d="M6 13 H78 M122 13 H194" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>'
        +'<path d="M70 13 q6 -7 14 -4 M130 13 q-6 -7 -14 -4 M70 13 q6 7 14 4 M130 13 q-6 7 -14 4" stroke="currentColor" stroke-width="1.2" fill="none"/>'
        +'<g fill="#e5698e"><circle cx="100" cy="13" r="3.4"/>'
        +'<ellipse cx="100" cy="5.5" rx="2.6" ry="4"/><ellipse cx="100" cy="20.5" rx="2.6" ry="4"/>'
        +'<ellipse cx="92.5" cy="13" rx="4" ry="2.6"/><ellipse cx="107.5" cy="13" rx="4" ry="2.6"/>'
        +'<ellipse cx="94.6" cy="7.6" rx="3.4" ry="2.2" transform="rotate(-45 94.6 7.6)"/>'
        +'<ellipse cx="105.4" cy="7.6" rx="3.4" ry="2.2" transform="rotate(45 105.4 7.6)"/>'
        +'<ellipse cx="94.6" cy="18.4" rx="3.4" ry="2.2" transform="rotate(45 94.6 18.4)"/>'
        +'<ellipse cx="105.4" cy="18.4" rx="3.4" ry="2.2" transform="rotate(-45 105.4 18.4)"/></g>'
        +'<circle cx="100" cy="13" r="1.8" fill="#c9a86a"/></svg>';
      Array.prototype.forEach.call(document.querySelectorAll('.flower-div'),function(d){d.innerHTML=FL;});
    }

    function polaroidCover(src){ return '<div class="cover"><img src="'+esc(src||'/index_page/img/blogs/1.jpg')+'" onerror="this.src=\'/index_page/img/blogs/1.jpg\'" alt=""></div>'; }

    function renderProjects(){
      var box=document.getElementById('projects-box');
      if(!projects.length){ box.innerHTML='<div class="load-note">'+esc(t(P.ui.no_projects))+'</div>'; return; }
      box.innerHTML=projects.map(function(p){return '<a class="polaroid" href="'+esc(p.href)+'"><span class="washi" aria-hidden="true"></span>'
        +polaroidCover(p.cover_image)+'<div class="cap"><div class="meta"><span>'+esc(t(P.ui.tech_stack))+'</span><span>'+esc(p.dateText())+'</span></div>'
        +'<h4>'+esc(p.localTitle())+'</h4><div class="tech">'+esc(p.tech_stack||'')+'</div><p>'+esc(p.localSummary()||'')+'</p>'
        +'<span class="more">'+esc(t(P.ui.view_project))+' →</span></div><span class="ribbon-corner" aria-hidden="true"></span></a>';}).join('');
    }
    function renderArticles(){
      var box=document.getElementById('articles-box');
      var list=CJC.filterArticles(articles,filterKey);
      if(!list.length){ box.innerHTML='<div class="load-note">'+esc(t(P.ui.no_articles))+'</div>'; return; }
      box.innerHTML=list.map(function(a){return '<a class="polaroid" href="'+esc(a.href)+'"><span class="washi" aria-hidden="true"></span>'
        +polaroidCover(a.cover_image)+'<div class="cap"><div class="meta"><span>'+esc(a.category||'')+'</span><span>'+esc(a.dateText())+'</span></div>'
        +'<h4>'+esc(a.localTitle())+'</h4><p>'+esc(a.localSummary()||'')+'</p>'
        +'<span class="more">'+esc(t(P.ui.read_more))+' →</span></div><span class="ribbon-corner" aria-hidden="true"></span></a>';}).join('');
    }
    function loadDynamic(){
      CJC.fetchProjects().then(function(d){projects=d;renderProjects();}).catch(function(){document.getElementById('projects-box').innerHTML='<div class="load-note">⚠ '+esc(t(P.ui.no_projects))+'</div>';});
      CJC.fetchArticles().then(function(d){articles=d;renderArticles();}).catch(function(){document.getElementById('articles-box').innerHTML='<div class="load-note">⚠ Failed to load / 内容加载失败</div>';});
    }

    // contact form
    document.getElementById('cf').addEventListener('submit',function(e){
      e.preventDefault();
      var f=e.target,s=document.getElementById('cf-status');
      s.style.color='var(--mut)'; s.textContent=t(P.ui.sending);
      CJC.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value})
        .then(function(r){s.style.color='var(--rose)';s.textContent=(r.message||'Sent with love.')+' ♥';f.reset();})
        .catch(function(err){s.style.color='var(--rose2)';s.textContent='✗ '+err.message;});
    });

    /* ---------- envelope open ---------- */
    function openLetter(instant){
      var scn=document.getElementById('seal-scene'), env=document.getElementById('envelope');
      document.body.classList.remove('locked');
      if(instant){ scn.classList.add('gone'); return; }
      env.classList.add('opening');
      spawnHearts(window.innerWidth/2, window.innerHeight*0.42, 16);
      setTimeout(function(){ scn.classList.add('gone'); },1150);
    }
    document.getElementById('wax').addEventListener('click',function(e){e.stopPropagation();openLetter(false);});
    document.getElementById('envelope').addEventListener('click',function(){openLetter(false);});
    document.getElementById('skip-seal').addEventListener('click',function(){openLetter(true);});

    /* ---------- P.S. fold ---------- */
    document.getElementById('ps-note').addEventListener('click',function(){this.classList.toggle('open');});

    /* ---------- petals + hearts-toward-cursor canvas ---------- */
    var cv=document.getElementById('petals'), ctx=cv.getContext('2d'), W,H;
    function resize(){ W=cv.width=window.innerWidth; H=cv.height=window.innerHeight; }
    resize(); window.addEventListener('resize',resize);
    var petalCols=['#f7b7cd','#f28cae','#e5698e','#ffd0dd','#f9c6d6','#f6c9a8'];
    function heartPath(x,y,r){ ctx.beginPath(); ctx.moveTo(x,y+r*0.3);
      ctx.bezierCurveTo(x,y-r*0.3,x-r,y-r*0.5,x-r,y+r*0.15);
      ctx.bezierCurveTo(x-r,y+r*0.6,x,y+r*0.9,x,y+r*1.15);
      ctx.bezierCurveTo(x,y+r*0.9,x+r,y+r*0.6,x+r,y+r*0.15);
      ctx.bezierCurveTo(x+r,y-r*0.5,x,y-r*0.3,x,y+r*0.3); ctx.closePath(); }
    var petals=[], cursorHearts=[], mouse={x:W/2,y:H/2,active:false};
    function newPetal(){ return {x:Math.random()*W,y:Math.random()*-H,vy:.4+Math.random()*1.1,vx:(Math.random()-.5)*.7,
      r:6+Math.random()*8,rot:Math.random()*6,vr:(Math.random()-.5)*.05,sw:Math.random()*3,c:petalCols[(Math.random()*petalCols.length)|0]}; }
    for(var i=0;i<46;i++){ var p=newPetal(); p.y=Math.random()*H; petals.push(p); }
    // hearts that drift toward the cursor
    for(var h=0;h<9;h++){ cursorHearts.push({x:Math.random()*W,y:Math.random()*H,r:5+Math.random()*7,
      ph:Math.random()*6.28,a:.28+Math.random()*.3,sp:.012+Math.random()*.02}); }
    window.addEventListener('pointermove',function(e){ mouse.x=e.clientX; mouse.y=e.clientY; mouse.active=true; },{passive:true});
    window.addEventListener('pointerleave',function(){ mouse.active=false; });
    function draw(){
      ctx.clearRect(0,0,W,H);
      // petals
      for(var k=0;k<petals.length;k++){ var q=petals[k];
        q.y+=q.vy; q.x+=q.vx+Math.sin(q.y*.02+q.sw)*.7; q.rot+=q.vr;
        if(q.y>H+20){ Object.assign(q,newPetal()); q.y=-10; }
        ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(q.rot); ctx.globalAlpha=.82; ctx.fillStyle=q.c;
        ctx.beginPath(); ctx.moveTo(0,-q.r); ctx.bezierCurveTo(q.r,-q.r,q.r,q.r*.6,0,q.r);
        ctx.bezierCurveTo(-q.r,q.r*.6,-q.r,-q.r,0,-q.r); ctx.fill(); ctx.restore();
      }
      // hearts toward cursor
      var tx=mouse.active?mouse.x:W/2, ty=mouse.active?mouse.y:H*0.5;
      for(var m=0;m<cursorHearts.length;m++){ var c=cursorHearts[m];
        c.ph+=0.03; var wob=Math.sin(c.ph)*24;
        c.x+=(tx+wob-c.x)*c.sp; c.y+=(ty-Math.cos(c.ph)*20-c.y)*c.sp;
        ctx.save(); ctx.globalAlpha=c.a; ctx.fillStyle='#e5698e';
        heartPath(c.x,c.y,c.r); ctx.fill(); ctx.restore();
      }
      raf=requestAnimationFrame(draw);
    }
    var raf;
    if(!reduce){ draw(); }

    // spawn a burst of DOM-free canvas hearts on the burst canvas
    var bcv=document.getElementById('burst'), bctx=bcv.getContext('2d'), bParts=[], bRaf=null;
    function bResize(){ bcv.width=window.innerWidth; bcv.height=window.innerHeight; }
    bResize(); window.addEventListener('resize',bResize);
    function spawnHearts(x,y,n){
      if(reduce) return;
      for(var i=0;i<n;i++){ var ang=Math.random()*6.28, sp=2+Math.random()*6;
        bParts.push({x:x,y:y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-2,r:6+Math.random()*10,
          life:1,dec:.008+Math.random()*.012,c:petalCols[(Math.random()*petalCols.length)|0],
          spark:Math.random()<.3}); }
      if(!bRaf) bDraw();
    }
    function bDraw(){
      bctx.clearRect(0,0,bcv.width,bcv.height);
      for(var i=bParts.length-1;i>=0;i--){ var q=bParts[i];
        q.vy+=0.12; q.x+=q.vx; q.y+=q.vy; q.vx*=.99; q.life-=q.dec;
        if(q.life<=0){ bParts.splice(i,1); continue; }
        bctx.save(); bctx.globalAlpha=Math.max(0,q.life); bctx.fillStyle=q.c;
        if(q.spark){ bctx.beginPath(); bctx.arc(q.x,q.y,q.r*.35,0,6.28); bctx.fill(); }
        else{ // heart
          var r=q.r; bctx.beginPath(); bctx.moveTo(q.x,q.y+r*0.3);
          bctx.bezierCurveTo(q.x,q.y-r*0.3,q.x-r,q.y-r*0.5,q.x-r,q.y+r*0.15);
          bctx.bezierCurveTo(q.x-r,q.y+r*0.6,q.x,q.y+r*0.9,q.x,q.y+r*1.15);
          bctx.bezierCurveTo(q.x,q.y+r*0.9,q.x+r,q.y+r*0.6,q.x+r,q.y+r*0.15);
          bctx.bezierCurveTo(q.x+r,q.y-r*0.5,q.x,q.y-r*0.3,q.x,q.y+r*0.3); bctx.fill();
        }
        bctx.restore();
      }
      if(bParts.length){ bRaf=requestAnimationFrame(bDraw); } else { bRaf=null; bctx.clearRect(0,0,bcv.width,bcv.height); }
    }

    /* ---------- big heart easter egg ---------- */
    var confCount=0;
    document.getElementById('heart-stamp').addEventListener('click',function(e){
      var rect=this.getBoundingClientRect();
      spawnHearts(rect.left+rect.width/2, rect.top+rect.height/2, 34);
      var c=STR.confessions[confCount%STR.confessions.length]; confCount++;
      var box=document.getElementById('confession');
      document.getElementById('conf-text').textContent=t(c);
      box.classList.add('show');
      clearTimeout(box._tm); box._tm=setTimeout(function(){box.classList.remove('show');},3200);
      // little chime if music box already running
      chime([880,1174,1568]);
    });

    /* ---------- music box (WebAudio, off by default) ---------- */
    var actx=null, mbOn=false, mbTimer=null;
    var melody=[523.25,587.33,659.25,783.99,659.25,587.33,523.25,392.00, 440.00,523.25,659.25,587.33]; // gentle
    function ensureCtx(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }
    function note(freq,when,dur){
      if(!actx) return; var o=actx.createOscillator(), g=actx.createGain();
      o.type='triangle'; o.frequency.value=freq;
      g.gain.setValueAtTime(0,when); g.gain.linearRampToValueAtTime(0.14,when+0.02);
      g.gain.exponentialRampToValueAtTime(0.0008,when+dur);
      o.connect(g); g.connect(actx.destination); o.start(when); o.stop(when+dur+0.05);
    }
    function chime(freqs){ if(!actx||!mbOn) return; var now=actx.currentTime; freqs.forEach(function(f,i){note(f,now+i*0.08,0.5);}); }
    function playPhrase(){
      if(!actx) return; var now=actx.currentTime;
      for(var i=0;i<melody.length;i++){ note(melody[i],now+i*0.34,0.6); note(melody[i]*2,now+i*0.34,0.35); }
    }
    var mbBtn=document.getElementById('musicbox');
    mbBtn.addEventListener('click',function(){
      ensureCtx(); if(!actx) return;
      mbOn=!mbOn; mbBtn.classList.toggle('on',mbOn); mbBtn.setAttribute('aria-pressed',mbOn?'true':'false');
      if(mbOn){ if(actx.state==='suspended') actx.resume(); playPhrase();
        mbTimer=setInterval(function(){ if(mbOn) playPhrase(); }, melody.length*340+700); }
      else { clearInterval(mbTimer); }
    });

    /* ---------- boot ---------- */
    document.addEventListener('DOMContentLoaded',function(){
      CJC.setTheme(window.THEME_ID);
      renderStatic();
      CJC.mountSwitcher({accent:'#e5698e'});
      CJC.onLang(function(){ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
      // bokeh candlelight dots
      var bk=document.getElementById('bokeh'), frag='';
      for(var i=0;i<12;i++){ var s=30+Math.random()*90; frag+='<span style="width:'+s+'px;height:'+s+'px;left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;animation-delay:'+(-Math.random()*14)+'s"></span>'; }
      bk.innerHTML=frag;
      // reduced motion → letter already open
      if(reduce){ openLetter(true); }
    });
  })();
  </script>
</body>
</html>

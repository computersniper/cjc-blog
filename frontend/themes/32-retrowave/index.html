<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — 70s Retro</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --cream:#f0d9a7;         /* cream base */
      --cream-2:#f6e6c2;
      --mustard:#e0a35e;
      --rust:#e07a3f;          /* accent */
      --rust-dk:#c95f28;
      --avocado:#7f8b3c;
      --avocado-dk:#5f6a2b;
      --choco:#3a2417;         /* text */
      --choco-2:#6a4a30;
      --teal:#3f8a7d;
      --line:rgba(58,36,23,.16);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;color:var(--choco);
      background:
        radial-gradient(1000px 500px at 85% -6%, rgba(224,122,63,.22), transparent 60%),
        radial-gradient(800px 500px at 8% 20%, rgba(127,139,60,.14), transparent 55%),
        var(--cream);
      font-family:'Poppins','Noto Sans SC',sans-serif;
      font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    ::selection{background:rgba(224,122,63,.28)}
    .wrap{max-width:1140px;margin:0 auto;padding:0 26px}
    .disp{font-family:'Shrikhand','ZCOOL KuaiLe',cursive;font-weight:400}
    .round{font-family:'Fredoka','ZCOOL KuaiLe',sans-serif}

    /* film grain overlay */
    body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9998;opacity:.06;mix-blend-mode:multiply;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23g)'/></svg>")}

    /* --- Section scaffold --- */
    section{padding:74px 0;position:relative}
    .sec-head{display:flex;align-items:center;gap:16px;margin-bottom:38px;flex-wrap:wrap}
    .badge{display:inline-flex;align-items:center;gap:10px;font-family:'Fredoka',sans-serif;font-weight:700;
      font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream);
      background:var(--rust);padding:8px 20px;border-radius:999px;box-shadow:0 4px 0 var(--rust-dk)}
    .sec-title{margin:0;font-family:'Shrikhand','ZCOOL KuaiLe',cursive;font-weight:400;
      font-size:clamp(28px,5vw,50px);line-height:1;color:var(--choco);letter-spacing:.01em}

    /* retro stripe divider */
    .stripes{display:flex;height:14px;border-radius:999px;overflow:hidden;margin:6px 0;box-shadow:0 3px 10px rgba(58,36,23,.15)}
    .stripes span{flex:1}
    .stripes .s1{background:var(--rust)}.stripes .s2{background:var(--mustard)}
    .stripes .s3{background:var(--avocado)}.stripes .s4{background:var(--teal)}
    .stripes .s5{background:var(--choco-2)}

    /* --- Top bar --- */
    .topbar{position:sticky;top:0;z-index:900;background:rgba(240,217,167,.9);backdrop-filter:blur(8px);
      border-bottom:3px solid var(--choco)}
    .topbar .inner{display:flex;align-items:center;gap:18px;height:64px;padding-right:210px}
    .brand{font-family:'Shrikhand',cursive;font-size:24px;color:var(--rust);display:flex;align-items:center;gap:10px}
    .brand .b{width:20px;height:20px;border-radius:50%;background:var(--avocado);box-shadow:0 0 0 4px var(--mustard)}
    .nav{display:flex;gap:20px;margin-left:6px}
    .nav a{font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;color:var(--choco-2);padding:4px 0;border-radius:6px}
    .nav a:hover{color:var(--rust)}
    @media(max-width:900px){.nav{display:none}.topbar .inner{padding-right:150px}}

    /* --- Hero --- */
    .hero{padding:80px 0 44px;position:relative;overflow:hidden}
    .hero-grid{display:grid;grid-template-columns:1fr auto;gap:44px;align-items:center}
    .sunburst{position:absolute;top:-120px;right:-120px;width:520px;height:520px;pointer-events:none;opacity:.9;z-index:0}
    .sunburst svg{width:100%;height:100%}
    .hero-grid>*{position:relative;z-index:1}
    .greet{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--rust);font-size:19px;letter-spacing:.04em}
    .hero h1{margin:6px 0 0;font-family:'Shrikhand','ZCOOL KuaiLe',cursive;font-weight:400;
      font-size:clamp(52px,12vw,132px);line-height:.94;color:var(--choco);
      text-shadow:4px 4px 0 var(--mustard), 8px 8px 0 var(--rust)}
    .hero .role{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(20px,3vw,30px);color:var(--avocado-dk);margin-top:16px}
    .hero .head{font-size:clamp(17px,2vw,20px);color:var(--choco-2);margin-top:16px;max-width:30ch}
    .hero .loc{margin-top:14px;color:var(--choco-2);display:flex;align-items:center;gap:8px;font-weight:500}
    .hero .loc i{color:var(--rust)}
    .cta-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px}
    .btn{display:inline-flex;align-items:center;gap:10px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:16px;
      padding:14px 28px;border-radius:999px;cursor:pointer;transition:transform .15s, box-shadow .15s;border:none}
    .btn-fill{background:var(--rust);color:var(--cream);box-shadow:0 5px 0 var(--rust-dk)}
    .btn-fill:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--rust-dk)}
    .btn-fill:active{transform:translateY(2px);box-shadow:0 2px 0 var(--rust-dk)}
    .btn-line{background:var(--choco);color:var(--cream);box-shadow:0 5px 0 #21140b}
    .btn-line:hover{transform:translateY(-2px);box-shadow:0 7px 0 #21140b}
    .hero-badge{width:210px;height:210px;flex:none;border-radius:50%;display:grid;place-items:center;text-align:center;
      background:var(--choco);color:var(--cream);box-shadow:0 10px 0 var(--rust-dk), inset 0 0 0 8px var(--mustard);position:relative}
    .hero-badge .cn{font-family:'Shrikhand','ZCOOL KuaiLe',cursive;font-size:52px;line-height:1;color:var(--mustard)}
    .hero-badge small{display:block;font-family:'Fredoka',sans-serif;font-weight:600;letter-spacing:.18em;font-size:13px;margin-top:8px;color:var(--cream)}
    @media(max-width:760px){.hero-grid{grid-template-columns:1fr}.hero-badge{width:160px;height:160px}.hero-badge .cn{font-size:42px}}

    /* --- Bubble panels --- */
    .bubble{background:var(--cream-2);border:3px solid var(--choco);border-radius:26px;
      box-shadow:0 8px 0 rgba(58,36,23,.14)}

    /* --- About --- */
    .about-grid{display:grid;grid-template-columns:300px 1fr;gap:44px;align-items:start}
    .portrait{padding:12px;border-radius:30px}
    .portrait img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:20px;filter:sepia(.28) saturate(1.1) contrast(1.02)}
    .about-text{font-size:18px}
    .about-text p{margin:0 0 18px}
    .about-text p:first-child::first-letter{font-family:'Shrikhand',cursive;font-size:2.8em;float:left;line-height:.7;
      margin:10px 12px 0 0;color:var(--rust)}
    @media(max-width:760px){.about-grid{grid-template-columns:1fr}.portrait{max-width:280px}}

    /* --- Rows (education/experience) --- */
    .rows .item{padding:24px 26px;margin-bottom:22px;border-radius:22px}
    .rows .item .when{display:inline-block;font-family:'Fredoka',sans-serif;font-weight:700;font-size:14px;
      color:var(--cream);background:var(--avocado);padding:5px 16px;border-radius:999px}
    .rows .item h3{margin:12px 0 4px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:21px;color:var(--choco)}
    .rows .item .sub{color:var(--choco-2)}
    .rows .item ul{margin:12px 0 0;padding-left:20px}
    .rows .item ul li{margin:7px 0}
    .rows .item ul li::marker{color:var(--rust)}

    /* --- Skills --- */
    .skills-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 30px}
    .skill{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:18px;background:var(--cream-2);
      border:2px solid var(--line)}
    .skill .n{font-family:'Shrikhand',cursive;font-size:22px;color:var(--rust);min-width:1.6em}
    .skill span:last-child{font-weight:500}
    .tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
    .tag{font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;padding:8px 18px;border-radius:999px;color:var(--cream)}
    .tag:nth-child(5n){background:var(--rust)}.tag:nth-child(5n+1){background:var(--avocado)}
    .tag:nth-child(5n+2){background:var(--mustard);color:var(--choco)}.tag:nth-child(5n+3){background:var(--teal)}
    .tag:nth-child(5n+4){background:var(--choco)}
    @media(max-width:640px){.skills-grid{grid-template-columns:1fr}}

    /* --- Courses --- */
    .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
    .course{padding:26px 22px;border-radius:24px;transition:transform .2s}
    .course:hover{transform:translateY(-5px)}
    .course .ci{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px;margin-bottom:16px;
      color:var(--cream);background:var(--rust)}
    .course:nth-child(3n+1) .ci{background:var(--avocado)}
    .course:nth-child(3n+2) .ci{background:var(--teal)}
    .course h4{margin:0 0 10px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:18px;color:var(--choco);line-height:1.3}
    .course p{margin:0;color:var(--choco-2);font-size:15px;line-height:1.6}
    @media(max-width:860px){.courses{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.courses{grid-template-columns:1fr}}

    /* --- Cards --- */
    .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px}
    .filters button{font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;background:var(--cream-2);color:var(--choco-2);
      border:2px solid var(--choco);border-radius:999px;padding:8px 18px;cursor:pointer;transition:.18s}
    .filters button:hover{background:var(--mustard)}
    .filters button.active{background:var(--rust);color:var(--cream);border-color:var(--rust)}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
    .card{border-radius:24px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s, box-shadow .2s}
    .card:hover{transform:translateY(-6px);box-shadow:0 14px 0 rgba(58,36,23,.14)}
    .card .cover{height:170px;overflow:hidden;background:var(--mustard);border-bottom:3px solid var(--choco)}
    .card .cover img{width:100%;height:100%;object-fit:cover;filter:sepia(.22) saturate(1.08);transition:transform .5s}
    .card:hover .cover img{transform:scale(1.06)}
    .card .cbody{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
    .card .ctag{display:flex;justify-content:space-between;font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;color:var(--avocado-dk)}
    .card .ctag .cat{color:var(--rust)}
    .card h4{margin:0;font-family:'Fredoka',sans-serif;font-weight:700;font-size:19px;color:var(--choco);line-height:1.32}
    .card p{margin:0;color:var(--choco-2);font-size:15px;line-height:1.6;flex:1}
    .card .tech{color:var(--teal);font-weight:600}
    .card .more{font-family:'Fredoka',sans-serif;font-weight:700;color:var(--rust);font-size:15px}
    @media(max-width:860px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.cards{grid-template-columns:1fr}}
    .load-note{grid-column:1/-1;color:var(--choco-2);padding:18px 0;font-weight:500}

    /* --- Certificates --- */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:26px}
    .cert{display:grid;grid-template-columns:132px 1fr;border-radius:24px;overflow:hidden}
    .cert img{height:100%;width:100%;object-fit:cover;border-right:3px solid var(--choco);filter:sepia(.22)}
    .cert .ct{padding:22px}
    .cert .ct .m{display:flex;justify-content:space-between;font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;color:var(--rust)}
    .cert .ct h4{margin:8px 0 8px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:18px;color:var(--choco);line-height:1.32}
    .cert .ct p{margin:0;color:var(--choco-2);font-size:15px;line-height:1.6}
    @media(max-width:560px){.certs{grid-template-columns:1fr}.cert{grid-template-columns:98px 1fr}}

    /* --- Contact --- */
    .contact-grid{display:grid;grid-template-columns:0.9fr 1.1fr;gap:40px}
    .contact-grid>*{min-width:0}
    .contact-info{padding:26px}
    .contact-info a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:2px solid var(--line)}
    .contact-info a:last-child{border-bottom:none}
    .contact-info a .k{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--choco-2);flex:none}
    .contact-info a .v{color:var(--rust);font-weight:600;text-align:right;overflow-wrap:anywhere;min-width:0}
    .contact-info a:hover .v{text-decoration:underline}
    .cf{padding:26px}
    .cf input,.cf textarea{width:100%;font-family:'Poppins','Noto Sans SC',sans-serif;font-size:16px;color:var(--choco);
      background:var(--cream);border:2px solid var(--choco);border-radius:16px;padding:14px 16px;margin-bottom:16px}
    .cf input::placeholder,.cf textarea::placeholder{color:var(--choco-2);opacity:.7}
    .cf input:focus,.cf textarea:focus{outline:none;border-color:var(--rust);box-shadow:0 0 0 3px rgba(224,122,63,.2)}
    .cf textarea{min-height:150px;resize:vertical}
    #cf-status{margin-top:14px;font-weight:600;font-size:15px}
    @media(max-width:760px){.contact-grid{grid-template-columns:1fr}}

    /* --- Footer --- */
    footer{border-top:3px solid var(--choco);padding:50px 0 60px;margin-top:20px}
    .foot-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:24px}
    .foot-brand{font-family:'Shrikhand',cursive;font-size:26px;color:var(--rust)}
    .foot-links{display:flex;flex-wrap:wrap;gap:20px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px}
    .foot-links a{color:var(--choco-2)}.foot-links a:hover{color:var(--rust)}
    .foot-bot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:24px;color:var(--choco-2);font-size:14px}
    .foot-bot a{color:var(--choco-2)}.foot-bot a:hover{color:var(--rust)}

    @media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important}}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="wrap inner">
      <a class="brand" href="#top"><span class="b"></span>CaiJiechao</a>
      <nav class="nav" id="nav"></nav>
    </div>
  </div>

  <div id="top"></div>

  <!-- HERO -->
  <header class="hero"><div class="wrap">
    <div class="sunburst" aria-hidden="true">
      <svg viewBox="0 0 200 200">
        <g transform="translate(100,100)">
          <circle r="30" fill="#e07a3f"/>
          <circle r="46" fill="none" stroke="#e0a35e" stroke-width="14"/>
          <circle r="66" fill="none" stroke="#7f8b3c" stroke-width="14"/>
          <circle r="86" fill="none" stroke="#3f8a7d" stroke-width="14"/>
          <g stroke="#3a2417" stroke-width="3">
            <line x1="0" y1="-96" x2="0" y2="-120"/><line x1="68" y1="-68" x2="85" y2="-85"/>
            <line x1="96" y1="0" x2="120" y2="0"/><line x1="68" y1="68" x2="85" y2="85"/>
            <line x1="0" y1="96" x2="0" y2="120"/><line x1="-68" y1="68" x2="-85" y2="85"/>
            <line x1="-96" y1="0" x2="-120" y2="0"/><line x1="-68" y1="-68" x2="-85" y2="-85"/>
          </g>
        </g>
      </svg>
    </div>
    <div class="hero-grid">
      <div>
        <div class="greet" id="greet"></div>
        <h1 id="name"></h1>
        <div class="role" id="role"></div>
        <div class="head" id="headline"></div>
        <div class="loc" id="loc"></div>
        <div class="cta-row">
          <a class="btn btn-fill" id="cvBtn" href="#" download></a>
          <a class="btn btn-line" id="ghBtn" target="_blank" rel="noopener"></a>
        </div>
      </div>
      <div class="hero-badge"><div><span class="cn" id="emblem"></span><small id="emblem-sub"></small></div></div>
    </div>
  </div></header>

  <div class="wrap"><div class="stripes" aria-hidden="true"><span class="s1"></span><span class="s2"></span><span class="s3"></span><span class="s4"></span><span class="s5"></span></div></div>

  <!-- ABOUT -->
  <section id="about"><div class="wrap">
    <div class="sec-head"><span class="badge" id="e-about">✦ About</span><h2 class="sec-title" id="l-about"></h2></div>
    <div class="about-grid">
      <div class="portrait bubble"><img id="portrait" alt="" /></div>
      <div class="about-text" id="about-text"></div>
    </div>
  </div></section>

  <!-- EDUCATION -->
  <section id="education"><div class="wrap">
    <div class="sec-head"><span class="badge" id="e-edu">✦ School</span><h2 class="sec-title" id="l-edu"></h2></div>
    <div class="rows" id="edu-list"></div>
  </div></section>

  <!-- SKILLS -->
  <section id="skills"><div class="wrap">
    <div class="sec-head"><span class="badge" id="e-skills">✦ Groovy Skills</span><h2 class="sec-title" id="l-skills"></h2></div>
    <div class="skills-grid" id="skills-list"></div>
    <div class="tags" id="tags"></div>
  </div></section>

  <!-- COURSES -->
  <section id="courses"><div class="wrap">
    <div class="sec-head"><span class="badge" id="e-courses">✦ Classes</span><h2 class="sec-title" id="l-courses"></h2></div>
    <div class="courses" id="courses-list"></div>
  </div></section>

  <!-- EXPERIENCE -->
  <section id="experience"><div class="wrap">
    <div class="sec-head"><span class="badge" id="e-exp">✦ Work</span><h2 class="sec-title" id="l-exp"></h2></div>
    <div class="rows" id="exp-list"></div>
  </div></section>

  <!-- PROJECTS -->
  <section id="projects"><div class="wrap">
    <div class="sec-head"><span class="badge" id="e-proj">✦ Made</span><h2 class="sec-title" id="l-projects"></h2></div>
    <div class="cards" id="projects-list"><div class="load-note" id="proj-load"></div></div>
  </div></section>

  <div class="wrap"><div class="stripes" aria-hidden="true"><span class="s3"></span><span class="s4"></span><span class="s1"></span><span class="s2"></span><span class="s5"></span></div></div>

  <!-- ARTICLES -->
  <section id="articles"><div class="wrap">
    <div class="sec-head"><span class="badge" id="e-art">✦ Reads</span><h2 class="sec-title" id="l-articles"></h2></div>
    <div class="filters" id="filters"></div>
    <div class="cards" id="articles-list"><div class="load-note" id="art-load"></div></div>
  </div></section>

  <!-- CERTIFICATES -->
  <section id="certificates"><div class="wrap">
    <div class="sec-head"><span class="badge" id="e-cert">✦ Honors</span><h2 class="sec-title" id="l-certs"></h2></div>
    <div class="certs" id="certs-list"></div>
  </div></section>

  <!-- CONTACT -->
  <section id="contact"><div class="wrap">
    <div class="sec-head"><span class="badge" id="e-contact">✦ Say Hi</span><h2 class="sec-title" id="l-contact"></h2></div>
    <div class="contact-grid">
      <div class="contact-info bubble" id="contact-info"></div>
      <form class="cf bubble" id="cf">
        <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
        <input type="text" name="name" id="cf-name" required>
        <input type="email" name="email" id="cf-email" required>
        <textarea name="message" id="cf-msg" required></textarea>
        <button type="submit" class="btn btn-fill" id="cf-send"></button>
        <p id="cf-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div></section>

  <!-- FOOTER -->
  <footer><div class="wrap">
    <div class="foot-top">
      <div class="foot-brand">CaiJiechao</div>
      <div class="foot-links" id="foot-social"></div>
    </div>
    <div class="foot-bot">
      <span id="foot-desc"></span>
      <a id="foot-icp" target="_blank" rel="noopener"></a>
    </div>
  </div></footer>

  <script>window.THEME_ID = "32-retrowave";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";

    function renderStatic(){
      const zh = CJCData.lang()==="zh";
      document.title = (zh?"蔡杰超":"Cai Jiechao")+" — "+(zh?"复古港风":"70s Retro");

      document.getElementById('nav').innerHTML = [
        ['about','nav_about'],['courses','nav_courses'],['projects','nav_portfolio'],
        ['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');

      // hero
      document.getElementById('greet').textContent = t(P.greeting);
      document.getElementById('name').textContent = t(P.name);
      document.getElementById('role').textContent = t(P.role);
      document.getElementById('headline').textContent = t(P.headline);
      document.getElementById('loc').innerHTML = `<i class="fa fa-map-marker"></i> ${esc(t(P.location))}`;
      document.getElementById('emblem').textContent = zh ? "蔡" : "CJC";
      document.getElementById('emblem-sub').textContent = zh ? "杰超" : "SINCE '22";
      const cv = document.getElementById('cvBtn');
      cv.innerHTML = `<i class="fa fa-download"></i> ${esc(t(P.ui.download_cv))}`; cv.href = t(P.cv);
      const gh = document.getElementById('ghBtn');
      gh.innerHTML = `<i class="fa fa-github"></i> GitHub`; gh.href = P.contact.github;

      set('l-about', t(P.ui.about_me)); set('l-edu', t(P.ui.education_bg));
      set('l-skills', t(P.ui.core_tech)); set('l-courses', t(P.ui.core_courses));
      set('l-exp', t(P.ui.internship_exp)); set('l-projects', t(P.ui.latest_projects));
      set('l-articles', t(P.ui.latest_articles)); set('l-certs', t(P.ui.certificates));
      set('l-contact', t(P.ui.get_in_touch));

      // about
      document.getElementById('portrait').src = P.avatar;
      document.getElementById('portrait').alt = t(P.name);
      document.getElementById('about-text').innerHTML = P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('');

      // education
      document.getElementById('edu-list').innerHTML = P.education.map(e=>`
        <div class="item bubble"><span class="when">${esc(e.period)}</span>
          <h3>${esc(t(e.school))}</h3><div class="sub">${esc(t(e.degree))} · ${esc(t(e.note))}</div></div>`).join('');

      // skills
      document.getElementById('skills-list').innerHTML = P.skills.map((s,i)=>`
        <div class="skill"><span class="n">${String(i+1).padStart(2,'0')}</span><span>${esc(s)}</span></div>`).join('');
      document.getElementById('tags').innerHTML = P.skillTags.map(x=>`<span class="tag">${esc(x)}</span>`).join('');

      // courses
      document.getElementById('courses-list').innerHTML = P.courses.map(c=>`
        <div class="course bubble"><div class="ci"><i class="fa ${esc(c.icon)}"></i></div>
          <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');

      // experience
      document.getElementById('exp-list').innerHTML = P.experience.map(x=>`
        <div class="item bubble"><span class="when">${esc(x.period)}</span>
          <h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3><div class="sub">${esc(t(x.summary))}</div>
          <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div>`).join('');

      // certificates
      document.getElementById('certs-list').innerHTML = P.certificates.map(c=>`
        <div class="cert bubble"><img src="${esc(c.image)}" alt="${esc(t(c.title))}" onerror="this.src='/index_page/img/blogs/1.jpg'">
          <div class="ct"><div class="m"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
          <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');

      // contact info
      document.getElementById('contact-info').innerHTML = [
        ['Email', P.contact.email, 'mailto:'+P.contact.email],
        [zh?'电话':'Phone', P.contact.phone, P.contact.phoneHref],
        ['GitHub', '@'+P.contact.githubUser, P.contact.github],
        [zh?'微信':'WeChat', zh?'扫码':'QR', P.contact.wechatQrPage],
      ].map(([k,v,h])=>`<a href="${esc(h)}" target="_blank" rel="noopener"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></a>`).join('');

      // form
      document.getElementById('cf-name').placeholder = t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder = t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder = t(P.ui.msg_placeholder);
      document.getElementById('cf-send').innerHTML = `<i class="fa fa-paper-plane"></i> ${esc(t(P.ui.send))}`;

      // footer
      document.getElementById('foot-social').innerHTML =
        `<a href="${P.contact.github}" target="_blank" rel="noopener">GitHub</a>
         <a href="mailto:${P.contact.email}">Email</a>
         <a href="${P.contact.wechatQrPage}">${zh?'微信':'WeChat'}</a>
         <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent = t(P.ui.footer_desc);
      const icp = document.getElementById('foot-icp'); icp.textContent = P.icp; icp.href = P.icpUrl;

      // filters
      document.getElementById('filters').innerHTML = P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }
    function set(id,val){ const el=document.getElementById(id); if(el) el.textContent=val; }

    function renderProjects(){
      const box = document.getElementById('projects-list');
      if(!projects.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML = projects.map(p=>`
        <a class="card bubble" href="${esc(p.href)}">
          <div class="cbody">
            <div class="ctag"><span class="cat">${esc(t(P.ui.tech_stack))}</span><span>${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <p class="tech">${esc(p.tech_stack||'')}</p>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div></a>`).join('');
    }
    function renderArticles(){
      const box = document.getElementById('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML = list.map(a=>`
        <a class="card bubble" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${esc(a.localTitle())}"></div>
          <div class="cbody">
            <div class="ctag"><span class="cat">${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div></a>`).join('');
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML = `<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-list').innerHTML = `<div class="load-note">⚠ ${esc(CJCData.lang()==='zh'?'内容加载失败':'Failed to load articles.')}</div>`; }
    }

    document.getElementById('cf').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      const payload = { name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color='var(--choco-2)'; s.textContent = t(P.ui.sending);
      try{ const r = await CJCData.sendContact(payload); s.style.color='var(--avocado-dk)'; s.textContent = r.message||'Sent.'; f.reset(); }
      catch(err){ s.style.color='var(--rust-dk)'; s.textContent = err.message; }
    });

    const fa = document.createElement('link');
    fa.rel='stylesheet';
    fa.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css';
    document.head.appendChild(fa);

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:'#e07a3f' });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Mission</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{
      --bg:#05070e; --bg2:#080b15; --panel:#0c1120; --panel2:#0f1626;
      --ink:#eef2fa; --muted:#8a94ab; --dim:#5c6580; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.14);
      --red:#fc3d21; --blue:#4d86ff; --cyan:#57e6ff;
      --maxw:1180px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);
      font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      -webkit-font-smoothing:antialiased;line-height:1.55;overflow-x:hidden;position:relative}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    .mono{font-family:'DM Mono',ui-monospace,monospace}
    .wrap{max-width:var(--maxw);margin:0 auto;padding:0 26px}

    /* ---- cosmic backdrop ---- */
    .sky{position:fixed;inset:0;z-index:-3;background:
      radial-gradient(1200px 800px at 78% -8%, #14203f 0%, transparent 55%),
      radial-gradient(1000px 900px at 12% 8%, #10182e 0%, transparent 50%),
      linear-gradient(180deg,#05070e 0%,#04060c 100%);}
    .stars{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.9;
      background-image:
        radial-gradient(1.4px 1.4px at 20% 30%, #fff, transparent),
        radial-gradient(1.2px 1.2px at 70% 20%, #cfe0ff, transparent),
        radial-gradient(1.5px 1.5px at 40% 70%, #fff, transparent),
        radial-gradient(1px 1px at 85% 55%, #fff, transparent),
        radial-gradient(1.3px 1.3px at 55% 42%, #dfe9ff, transparent),
        radial-gradient(1px 1px at 15% 80%, #fff, transparent),
        radial-gradient(1.2px 1.2px at 92% 82%, #fff, transparent),
        radial-gradient(1px 1px at 33% 12%, #cfe0ff, transparent),
        radial-gradient(1.6px 1.6px at 62% 88%, #fff, transparent);
      background-repeat:repeat;background-size:auto;}
    .earth{position:fixed;left:50%;bottom:-72vw;width:130vw;height:130vw;transform:translateX(-50%);z-index:-1;border-radius:50%;
      background:radial-gradient(circle at 50% 8%, #2a5aa8 0%, #12315f 22%, #0a1a34 40%, #060c18 60%);
      box-shadow:0 -2px 60px 6px rgba(87,150,255,.28), inset 0 40px 120px rgba(120,180,255,.14);
      pointer-events:none;opacity:.85}
    .earth::before{content:"";position:absolute;inset:-2px;border-radius:50%;
      box-shadow:0 -14px 60px 4px rgba(120,190,255,.35);clip-path:inset(0 0 62% 0)}

    /* ---- nav ---- */
    nav{position:fixed;top:0;left:0;right:0;z-index:900;backdrop-filter:blur(12px);
      background:linear-gradient(180deg,rgba(5,7,14,.85),rgba(5,7,14,.35));border-bottom:1px solid var(--line)}
    nav .row{display:flex;align-items:center;justify-content:space-between;height:56px;padding-right:212px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em;font-size:15px}
    .brand .badge{width:26px;height:26px;flex:none}
    .navlinks{display:flex;gap:22px}
    .navlinks a{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);transition:color .15s}
    .navlinks a:hover{color:var(--ink)}
    .met{font-size:11.5px;letter-spacing:.12em;color:var(--muted);display:flex;align-items:center;gap:8px}
    .met .dot{width:7px;height:7px;border-radius:50%;background:#38e08a;box-shadow:0 0 8px #38e08a;animation:pulse 1.6s infinite}
    @keyframes pulse{50%{opacity:.35}}
    @media(max-width:900px){nav .row{padding-right:150px}.navlinks{display:none}}
    @media(max-width:520px){nav .row{padding-right:120px}.met{display:none}}

    /* ---- section scaffolding ---- */
    section{padding:88px 0;position:relative}
    .sec-head{display:flex;align-items:center;gap:16px;margin-bottom:34px}
    .patch{width:52px;height:52px;flex:none}
    .sec-kick{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--red)}
    .sec-title{font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1;margin:5px 0 0}
    .reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
    .reveal.in{opacity:1;transform:none}

    /* ---- hero ---- */
    .hero{min-height:100vh;display:flex;align-items:center;padding-top:56px}
    .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;width:100%}
    .hero .kick{font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--red);margin-bottom:18px}
    .hero h1{font-size:clamp(46px,9vw,104px);font-weight:900;letter-spacing:-.035em;line-height:.92;margin:0}
    .hero .role{font-size:clamp(16px,2.2vw,21px);color:var(--ink);font-weight:600;margin-top:16px}
    .hero .title{color:var(--muted);max-width:44ch;margin-top:8px;font-size:15.5px}
    .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
    .btn{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:6px;font-weight:600;font-size:14px;
      letter-spacing:.02em;border:1px solid transparent;transition:transform .15s,background .15s,border-color .15s}
    .btn.primary{background:var(--red);color:#0a0a0a}
    .btn.primary:hover{transform:translateY(-2px)}
    .btn.ghost{border-color:var(--line2);color:var(--ink)}
    .btn.ghost:hover{border-color:var(--ink);transform:translateY(-2px)}
    .telem{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
    .telem .t{display:flex;flex-direction:column;gap:3px}
    .telem .t .k{font-size:10px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
    .telem .t .v{font-size:15px;color:var(--cyan)}

    /* helmet */
    .helmet-wrap{position:relative;justify-self:center;width:min(430px,84vw);aspect-ratio:1}
    .orbit{position:absolute;inset:-6%;border:1px dashed rgba(120,170,255,.28);border-radius:50%;animation:spin 40s linear infinite}
    .orbit .sat{position:absolute;top:-5px;left:50%;width:10px;height:10px;border-radius:2px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
    @keyframes spin{to{transform:rotate(360deg)}}
    .helmet{position:absolute;inset:8%;border-radius:50%;overflow:hidden;
      box-shadow:0 30px 90px rgba(0,0,0,.6), inset 0 0 0 10px #cfd6e2, inset 0 0 0 12px #7d8798, 0 0 0 2px rgba(255,255,255,.06);
      background:#0b0f1a}
    .helmet img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.96) contrast(1.03)}
    .visor{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none;
      background:
        radial-gradient(120% 90% at 30% 18%, rgba(120,190,255,.5), transparent 42%),
        radial-gradient(90% 80% at 78% 30%, rgba(252,61,33,.32), transparent 46%),
        linear-gradient(150deg, rgba(87,230,255,.22), transparent 46%);}
    .visor .sheen{position:absolute;top:10%;left:12%;width:44%;height:24%;border-radius:50%;transform:rotate(-24deg);
      background:linear-gradient(90deg, rgba(255,255,255,.5), transparent);filter:blur(6px);opacity:.6}
    .hud-ring{position:absolute;inset:2%;border-radius:50%;pointer-events:none}
    .helmet-cap{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);white-space:nowrap;
      font-size:10.5px;letter-spacing:.2em;color:var(--muted)}
    @media(max-width:860px){.hero-grid{grid-template-columns:1fr;gap:22px}.helmet-wrap{order:-1;width:min(300px,72vw)}}

    /* ---- generic panels & cards ---- */
    .panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px}
    .about{display:grid;grid-template-columns:220px 1fr;gap:30px;align-items:start;padding:30px}
    .about .pic{border-radius:12px;overflow:hidden;border:1px solid var(--line2);aspect-ratio:4/5}
    .about .pic img{width:100%;height:100%;object-fit:cover}
    .about p{margin:0 0 14px;color:#cdd5e6;max-width:62ch}
    .about .loc{color:var(--cyan);font-size:13px;letter-spacing:.04em}
    @media(max-width:640px){.about{grid-template-columns:1fr;padding:22px}}

    .rows>.rowi{display:grid;grid-template-columns:160px 1fr;gap:20px;padding:20px 0;border-top:1px solid var(--line)}
    .rows>.rowi:first-child{border-top:0}
    .rowi .when{color:var(--red);font-size:13px}
    .rowi h4{margin:0 0 4px;font-size:18px;font-weight:700}
    .rowi .sub{color:var(--muted);font-size:14px}
    .rowi ul{margin:12px 0 0;padding-left:0;list-style:none}
    .rowi ul li{position:relative;padding-left:20px;margin-bottom:7px;color:#c4cde0;font-size:14px}
    .rowi ul li::before{content:"▸";position:absolute;left:0;color:var(--red)}
    @media(max-width:600px){.rows>.rowi{grid-template-columns:1fr;gap:6px}}

    .sys{display:grid;grid-template-columns:1fr 1fr;gap:26px}
    .sys .bars{display:flex;flex-direction:column;gap:14px}
    .sys .bar .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:#cdd5e6}
    .sys .bar .lab .pct{color:var(--cyan)}
    .sys .bar .track{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
    .sys .bar .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--cyan));width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
    .chips{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
    .chips span{border:1px solid var(--line2);border-radius:999px;padding:7px 14px;font-size:12.5px;color:#d6ddec}
    .chips span::before{content:"›";color:var(--red);margin-right:7px}
    @media(max-width:720px){.sys{grid-template-columns:1fr}}

    .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .course{padding:20px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
    .course .ic{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;background:rgba(77,134,255,.14);color:var(--blue);margin-bottom:12px}
    .course h4{margin:0 0 7px;font-size:15.5px;font-weight:700}
    .course p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
    @media(max-width:860px){.courses{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.courses{grid-template-columns:1fr}}

    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .card{border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;
      transition:transform .18s,border-color .18s,box-shadow .18s}
    .card:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 20px 40px rgba(0,0,0,.4)}
    .card .cover{height:168px;overflow:hidden;background:#0a0f1c;border-bottom:1px solid var(--line)}
    .card .cover img{width:100%;height:100%;object-fit:cover}
    .card .cbody{padding:18px;display:flex;flex-direction:column;gap:9px;flex:1}
    .card .ctag{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
    .card .ctag .date{color:var(--dim)}
    .card h4{margin:0;font-size:17px;font-weight:700;line-height:1.25}
    .card p{margin:0;color:var(--muted);font-size:13.5px;flex:1}
    .card .go{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan)}
    @media(max-width:860px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.cards{grid-template-columns:1fr}}

    .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
    .filters button{background:transparent;border:1px solid var(--line2);color:var(--muted);font-family:inherit;font-size:12px;
      letter-spacing:.04em;padding:8px 15px;border-radius:999px;cursor:pointer;transition:.15s}
    .filters button.active,.filters button:hover{background:var(--red);border-color:var(--red);color:#0a0a0a}

    .certs{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .cert{display:grid;grid-template-columns:110px 1fr;gap:0;border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
    .cert .pi{position:relative;overflow:hidden;border-right:1px solid var(--line)}
    .cert .pi img{width:100%;height:100%;object-fit:cover}
    .cert .pi .ring{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%, transparent 60%, rgba(252,61,33,.18))}
    .cert .ct{padding:16px}
    .cert .ct .m{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);display:flex;justify-content:space-between;gap:10px}
    .cert .ct h4{margin:8px 0 6px;font-size:16px;font-weight:700}
    .cert .ct p{margin:0;color:var(--muted);font-size:13px}
    @media(max-width:620px){.certs{grid-template-columns:1fr}}

    .contact{display:grid;grid-template-columns:.9fr 1.1fr;gap:36px;align-items:start}
    .comm a{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-top:1px solid var(--line);color:#dbe2f0}
    .comm a:first-child{border-top:0}
    .comm a .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
    .comm a .v{color:var(--cyan);font-size:14px}
    form label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
    form input,form textarea{width:100%;background:#070b16;border:1px solid var(--line2);border-radius:8px;color:var(--ink);
      font-family:inherit;font-size:14.5px;padding:12px 14px}
    form input:focus,form textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(77,134,255,.18)}
    form textarea{min-height:120px;resize:vertical}
    form .btn{margin-top:16px;cursor:pointer}
    #cf-status{margin-top:12px;font-size:13.5px;min-height:1em}
    @media(max-width:760px){.contact{grid-template-columns:1fr}}

    footer{border-top:1px solid var(--line);padding:44px 0 56px;position:relative;overflow:hidden}
    footer .frow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center}
    footer a{color:var(--muted)}footer a:hover{color:var(--ink)}
    .fsoc{display:flex;gap:18px;font-size:13px}
    .fmeta{margin-top:18px;color:var(--dim);font-size:12px;display:flex;flex-wrap:wrap;gap:8px 18px}
    .load-note{color:var(--muted);font-size:14px;grid-column:1/-1;padding:20px 0}

    a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}html{scroll-behavior:auto}}
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="earth" aria-hidden="true"></div>

  <nav><div class="wrap row">
    <a class="brand" href="#top">
      <svg class="badge" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="#fc3d21" stroke-width="2"/><path d="M20 8l2.8 8.6H32l-7 5 2.7 8.6L20 25l-7.7 5.2L15 21.6l-7-5h9.2z" fill="#fff"/></svg>
      <span id="brand"></span>
    </a>
    <div class="navlinks" id="navlinks" role="navigation" aria-label="Sections"></div>
    <span class="met"><span class="dot"></span><span class="mono" id="met">MET 00:00:00</span></span>
  </div></nav>

  <div id="top"></div>
  <main id="app"></main>

  <footer><div class="wrap">
    <div class="frow">
      <a class="brand" href="#top" style="font-size:17px">
        <svg class="badge" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="#fc3d21" stroke-width="2"/><path d="M20 8l2.8 8.6H32l-7 5 2.7 8.6L20 25l-7.7 5.2L15 21.6l-7-5h9.2z" fill="#fff"/></svg>
        <span id="fbrand"></span>
      </a>
      <div class="fsoc" id="fsoc"></div>
    </div>
    <div class="fmeta"><span id="fdesc"></span><a id="ficp" target="_blank" rel="noopener"></a></div>
  </div></footer>

  <script>window.THEME_ID = "26-astronaut";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let articles = [], projects = [], filterKey = 'all';

    // bilingual section labels
    const L = {
      about:{en:['SEC 01 · CREW','Crew Bio'],zh:['编号 01 · 机组','机组档案']},
      edu:{en:['SEC 02 · ACADEMY','Flight Academy'],zh:['编号 02 · 学院','飞行学院']},
      skills:{en:['SEC 03 · SUIT','Suit Systems'],zh:['编号 03 · 系统','装备系统']},
      courses:{en:['SEC 04 · TRAINING','Training'],zh:['编号 04 · 训练','核心训练']},
      exp:{en:['SEC 05 · HISTORY','Mission History'],zh:['编号 05 · 履历','任务履历']},
      projects:{en:['SEC 06 · PAYLOAD','Payloads'],zh:['编号 06 · 载荷','任务载荷']},
      articles:{en:['SEC 07 · SIGNAL','Transmissions'],zh:['编号 07 · 信号','通讯传输']},
      certs:{en:['SEC 08 · PATCHES','Mission Patches'],zh:['编号 08 · 徽章','荣誉徽章']},
      contact:{en:['SEC 09 · UPLINK','Uplink'],zh:['编号 09 · 上行','建立通讯']},
      navAbout:{en:'Crew',zh:'机组'},navSkills:{en:'Systems',zh:'系统'},navPay:{en:'Payloads',zh:'载荷'},
      navSig:{en:'Signal',zh:'信号'},navUp:{en:'Uplink',zh:'联络'},
    };
    const tr = o => o[CJCData.lang()] || o.en;

    function patch(icon, tone){ tone = tone||'#fc3d21';
      return `<svg class="patch" viewBox="0 0 52 52" aria-hidden="true">
        <circle cx="26" cy="26" r="24" fill="none" stroke="${tone}" stroke-width="2"/>
        <circle cx="26" cy="26" r="18" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.16)" stroke-width="1"/>
        <text x="26" y="30" text-anchor="middle" font-family="FontAwesome" font-size="16" fill="${tone==='#fc3d21'?'#fff':tone}">${icon}</text></svg>`;
    }
    function head(key, tone){ const l = tr(L[key]);
      return `<div class="sec-head reveal">${patch(FA[key],tone)}<div><div class="sec-kick mono">${esc(l[0])}</div><h2 class="sec-title">${esc(l[1])}</h2></div></div>`;
    }
    const FA = {about:'',edu:'',skills:'',courses:'',exp:'',projects:'',articles:'',certs:'',contact:''};

    function heroHTML(){
      return `<section class="hero"><div class="wrap"><div class="hero-grid">
        <div>
          <div class="kick mono">${esc(t(P.greeting))} · MISSION</div>
          <h1>${esc(t(P.name))}</h1>
          <div class="role">${esc(t(P.headline))}</div>
          <div class="title">${esc(t(P.title))} · ${esc(t(P.location))}</div>
          <div class="cta">
            <a class="btn primary" href="${esc(t(P.cv))}" download><i class="fa fa-download"></i>${esc(t(P.ui.download_cv))}</a>
            <a class="btn ghost" href="${esc(P.contact.github)}" target="_blank" rel="noopener"><i class="fa fa-github"></i>GitHub</a>
          </div>
          <div class="telem mono">
            <div class="t"><span class="k">O₂</span><span class="v">98%</span></div>
            <div class="t"><span class="k">Suit PWR</span><span class="v">NOMINAL</span></div>
            <div class="t"><span class="k">Signal</span><span class="v">LOCKED</span></div>
            <div class="t"><span class="k">Altitude</span><span class="v">408 KM</span></div>
          </div>
        </div>
        <div class="helmet-wrap">
          <div class="orbit"><span class="sat"></span></div>
          <div class="helmet"><img src="${esc(P.avatar)}" alt="${esc(t(P.name))}"><div class="visor"><span class="sheen"></span></div>
            <svg class="hud-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="none" stroke="rgba(120,190,255,.25)" stroke-width=".5" stroke-dasharray="1 4"/></svg></div>
          <div class="helmet-cap mono">EVA · SUIT-01 · ${esc(t(P.role))}</div>
        </div>
      </div></div></section>`;
    }

    function aboutHTML(){
      return `<section id="about"><div class="wrap">${head('about')}
        <div class="panel about reveal">
          <div class="pic"><img src="${esc(P.avatarAlt||P.avatar)}" alt="${esc(t(P.name))}"></div>
          <div>${P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('')}<div class="loc mono">◉ ${esc(t(P.location))}</div></div>
        </div></div></section>`;
    }
    function eduHTML(){
      return `<section id="education"><div class="wrap">${head('edu','#4d86ff')}
        <div class="panel rows reveal" style="padding:8px 26px">${P.education.map(e=>`
          <div class="rowi"><div class="when mono">${esc(e.period)}</div>
          <div><h4>${esc(t(e.school))}</h4><div class="sub">${esc(t(e.degree))} — ${esc(t(e.note))}</div></div></div>`).join('')}</div></div></section>`;
    }
    function skillsHTML(){
      const half=Math.ceil(P.skills.length/2);
      const bars=P.skills.map((s,i)=>{const pct=[94,90,88,86,84,82][i]||85;return `<div class="bar"><div class="lab"><span>${esc(s)}</span><span class="pct mono">${pct}%</span></div><div class="track"><div class="fill" data-pct="${pct}"></div></div></div>`;}).join('');
      return `<section id="skills"><div class="wrap">${head('skills','#4d86ff')}
        <div class="panel reveal" style="padding:28px"><div class="sys">
          <div class="bars">${bars}</div>
          <div class="chips">${(P.skillTags||[]).map(s=>`<span>${esc(s)}</span>`).join('')}</div>
        </div></div></div></section>`;
    }
    function coursesHTML(){
      return `<section id="courses"><div class="wrap">${head('courses','#4d86ff')}
        <div class="courses reveal">${P.courses.map(c=>`
          <div class="course"><div class="ic"><i class="fa ${esc(c.icon)}"></i></div><h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('')}</div></div></section>`;
    }
    function expHTML(){
      return `<section id="experience"><div class="wrap">${head('exp')}
        <div class="panel rows reveal" style="padding:8px 26px">${P.experience.map(x=>`
          <div class="rowi"><div class="when mono">${esc(x.period)}</div>
          <div><h4>${esc(t(x.role))} · ${esc(t(x.company))}</h4><div class="sub">${esc(t(x.summary))}</div>
          <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div></div>`).join('')}</div></div></section>`;
    }
    function projectsHTML(){
      let body;
      if(!projects.length) body=`<div class="load-note mono" id="proj-load">◌ ${esc(t(P.ui.loading_projects))}</div>`;
      else body=`<div class="cards">${projects.map(p=>`
        <a class="card" href="${esc(p.href)}"><div class="cbody">
          <div class="ctag"><span>${esc(p.tech_stack? p.tech_stack.split(',')[0] : t(P.ui.tech_stack))}</span><span class="date mono">${esc(p.dateText())}</span></div>
          <h4>${esc(p.localTitle())}</h4><p>${esc(p.localSummary()||'')}</p>
          <span class="go mono">${esc(t(P.ui.view_project))} →</span></div></a>`).join('')}</div>`;
      return `<section id="projects"><div class="wrap">${head('projects')}<div class="reveal">${body}</div></div></section>`;
    }
    function articlesHTML(){
      const list=CJCData.filterArticles(articles,filterKey);
      const chips=`<div class="filters">${P.articleFilters.map(f=>`<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('')}</div>`;
      let body;
      if(!articles.length) body=`<div class="load-note mono">◌ ${esc(t(P.ui.loading_articles))}</div>`;
      else if(!list.length) body=`<div class="load-note">${esc(t(P.ui.no_articles))}</div>`;
      else body=`<div class="cards">${list.map(a=>`
        <a class="card" href="${esc(a.href)}"><div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
        <div class="cbody"><div class="ctag"><span>${esc(a.category||'')}</span><span class="date mono">${esc(a.dateText())}</span></div>
        <h4>${esc(a.localTitle())}</h4><p>${esc(a.localSummary()||'')}</p><span class="go mono">${esc(t(P.ui.read_more))} →</span></div></a>`).join('')}</div>`;
      return `<section id="articles"><div class="wrap">${head('articles')}<div class="reveal">${chips}${body}</div></div></section>`;
    }
    function certsHTML(){
      return `<section id="certificates"><div class="wrap">${head('certs','#4d86ff')}
        <div class="certs reveal">${P.certificates.map(c=>`
          <div class="cert"><div class="pi"><img src="${esc(c.image)}" alt="${esc(t(c.title))}"><span class="ring"></span></div>
          <div class="ct"><div class="m mono"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
          <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('')}</div></div></section>`;
    }
    function contactHTML(){
      return `<section id="contact"><div class="wrap">${head('contact')}
        <div class="contact reveal">
          <div class="comm">
            <a href="mailto:${esc(P.contact.email)}"><span class="k mono">Email</span><span class="v">${esc(P.contact.email)}</span></a>
            <a href="${esc(P.contact.phoneHref)}"><span class="k mono">Phone</span><span class="v">${esc(P.contact.phone)}</span></a>
            <a href="${esc(P.contact.github)}" target="_blank" rel="noopener"><span class="k mono">GitHub</span><span class="v">@${esc(P.contact.githubUser)}</span></a>
            <a href="${esc(P.contact.wechatQrPage)}"><span class="k mono">WeChat</span><span class="v">QR →</span></a>
          </div>
          <form id="cf">
            <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none">
            <label>${esc(t(P.ui.name_placeholder))}</label><input name="name" required>
            <label>${esc(t(P.ui.email_placeholder))}</label><input type="email" name="email" required>
            <label>${esc(t(P.ui.msg_placeholder))}</label><textarea name="message" required></textarea>
            <button type="submit" class="btn primary"><i class="fa fa-paper-plane"></i>${esc(t(P.ui.get_in_touch))}</button>
            <p id="cf-status"></p>
          </form>
        </div></div></section>`;
    }

    function render(){
      document.getElementById('brand').textContent = P.brand;
      document.getElementById('fbrand').textContent = P.brand;
      document.getElementById('navlinks').innerHTML = [
        ['about',L.navAbout],['skills',L.navSkills],['projects',L.navPay],['articles',L.navSig],['contact',L.navUp]
      ].map(([id,lab])=>`<a href="#${id}">${esc(tr(lab))}</a>`).join('');
      document.getElementById('app').innerHTML =
        heroHTML()+aboutHTML()+eduHTML()+skillsHTML()+coursesHTML()+expHTML()+projectsHTML()+articlesHTML()+certsHTML()+contactHTML();
      document.getElementById('fsoc').innerHTML =
        `<a href="${P.contact.github}" target="_blank" rel="noopener">GitHub</a><a href="mailto:${P.contact.email}">Email</a><a href="${P.contact.wechatQrPage}">WeChat</a><a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('fdesc').textContent = t(P.ui.footer_desc);
      const icp=document.getElementById('ficp'); icp.textContent = P.icp; icp.href = P.icpUrl;
      wire();
    }
    function wire(){
      document.querySelectorAll('#articles .filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; render(); // re-render keeps it simple; re-observe below
      }));
      const cf=document.getElementById('cf');
      if(cf) cf.addEventListener('submit',onSubmit);
      observe();
      // animate skill bars when visible
      requestAnimationFrame(()=>document.querySelectorAll('.fill').forEach(f=>{f.style.width=(f.dataset.pct||'80')+'%';}));
    }
    async function onSubmit(e){
      e.preventDefault(); const f=e.target,s=f.querySelector('#cf-status');
      s.style.color='var(--muted)';s.textContent=t(P.ui.sending);
      try{const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});
        s.style.color='#38e08a';s.textContent='✓ '+(r.message||'Sent.');f.reset();}
      catch(err){s.style.color='var(--red)';s.textContent='✗ '+err.message;}
    }

    let io;
    function observe(){
      if(io) io.disconnect();
      if(reduce){document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in'));return;}
      io=new IntersectionObserver((es)=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}}),{threshold:.12});
      document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
    }

    // MET clock
    function startMET(){
      if(reduce){document.getElementById('met').textContent='MET 12:04:33';return;}
      const base=Date.now();
      setInterval(()=>{const s=Math.floor((Date.now()-base)/1000)+43473;
        const h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s/60)%60).padStart(2,'0'),ss=String(s%60).padStart(2,'0');
        const el=document.getElementById('met'); if(el) el.textContent='MET '+h+':'+m+':'+ss;},1000);
    }
    // easter egg: click sky → twinkle; every 3rd → satellite blip
    let clicks=0;
    document.getElementById('stars').addEventListener('pointerdown',()=>{});
    document.addEventListener('click',(e)=>{
      if(e.target.closest('a,button,input,textarea,form,#cjc-switcher')) return;
      if(reduce) return;
      clicks++;
      const tw=document.createElement('div');
      tw.style.cssText=`position:fixed;left:${e.clientX-6}px;top:${e.clientY-6}px;width:12px;height:12px;z-index:5;pointer-events:none;
        background:radial-gradient(circle,#fff,transparent 65%);border-radius:50%;animation:tk .7s ease forwards`;
      document.body.appendChild(tw); setTimeout(()=>tw.remove(),700);
      if(clicks%3===0){
        const sat=document.createElement('div');
        sat.textContent='🛰️';
        sat.style.cssText=`position:fixed;top:${20+Math.random()*40}%;left:-40px;z-index:6;font-size:20px;pointer-events:none;filter:drop-shadow(0 0 6px #57e6ff);animation:fly 4s linear forwards`;
        document.body.appendChild(sat); setTimeout(()=>sat.remove(),4000);
      }
    });
    const kf=document.createElement('style');
    kf.textContent='@keyframes tk{from{transform:scale(.4);opacity:1}to{transform:scale(2.2);opacity:0}}@keyframes fly{to{left:110%;transform:translateY(-30px)}}';
    document.head.appendChild(kf);

    document.addEventListener('DOMContentLoaded',()=>{
      CJCData.setTheme(window.THEME_ID);
      render();
      CJCData.mountSwitcher({accent:'#fc3d21'});
      CJCData.onLang(()=>{ render(); });
      startMET();
      (async()=>{
        try{ projects=await CJCData.fetchProjects(); }catch(e){}
        try{ articles=await CJCData.fetchArticles(); }catch(e){}
        render();
      })();
    });
  })();
  </script>
</body>
</html>

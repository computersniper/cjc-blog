nt.getElementById('tags').innerHTML=P.skillTags.map(function(x){return '<span>'+e(x)+'</span>'}).join('');document.getElementById('courses-list').innerHTML=P.courses.map(function(x){return '<article class="course"><i class="fa '+e(x.icon)+'" aria-hidden="true"></i><h3>'+e(t(x.title))+'</h3><p>'+e(t(x.desc))+'</p></article>'}).join('');document.getElementById('experience-list').innerHTML=P.experience.map(function(x){return '<article class="record"><time>'+e(x.period)+'</time><div><h3>'+e(t(x.role))+' · '+e(t(x.company))+'</h3><p>'+e(t(x.summary))+'</p><ul>'+x.bullets.map(function(y){return '<li>'+e(t(y))+'</li>'}).join('')+'</ul></div></article>'}).join('');document.getElementById('certs-list').innerHTML=P.certificates.map(function(x){return '<article class="cert"><img loading="lazy" src="'+e(x.image)+'" alt="'+e(t(x.title))+'" onerror="this.src=\'/index_page/img/blogs/1.jpg\'"><div><small>'+e(t(x.tag))+' · '+e(t(x.date))+'</small><h3>'+e(t(x.title))+'</h3><p>'+e(t(x.desc))+'</p></div></article>'}).join('');document.getElementById('direct').innerHTML=[['Email',P.contact.email,'mailto:'+P.contact.email],['Phone',P.contact.phone,P.contact.phoneHref],['GitHub','@'+P.contact.githubUser,P.contact.github],['WeChat','QR',P.contact.wechatQrPage]].map(function(x){return '<a href="'+e(x[2])+'"><span>'+e(x[0])+'</span><span>'+e(x[1])+'</span></a>'}).join('');[['name-label',P.ui.name_placeholder],['email-label',P.ui.email_placeholder],['message-label',P.ui.msg_placeholder],['send',P.ui.send],['footer-desc',P.ui.footer_desc],['admin',P.ui.admin_panel]].forEach(function(x){text(x[0],t(x[1]))});var icp=document.getElementById('icp');icp.textContent=P.icp;icp.href=P.icpUrl;document.getElementById('filters').innerHTML=P.articleFilters.map(function(x){return '<button type="button" data-filter="'+e(x.key)+'" class="'+(filterKey===x.key?'active':'')+'">'+e(t(x.label))+'</button>'}).join('');Array.prototype.forEach.call(document.querySelectorAll('[data-filter]'),function(x){x.addEventListener('click',function(){filterKey=this.getAttribute('data-filter');render();renderArticles()})})}
    function renderProjects(){var box=document.getElementById('projects-list');if(!projects.length){box.innerHTML='<p class="load-note">'+e(t(P.ui.no_projects))+'</p>';return}box.innerHTML=projects.map(function(x){var image=x.cover_image?'<figure><img loading="lazy" src="'+e(x.cover_image)+'" alt="'+e(x.localTitle())+'" onerror="this.src=\'/index_page/img/blogs/1.jpg\'"></figure>':'';return '<a class="card" href="'+e(x.href)+'">'+image+'<div class="card-body"><div class="meta"><span>'+e(t(P.ui.tech_stack))+'</span><span>'+e(x.dateText())+'</span></div><h3>'+e(x.localTitle())+'</h3><p>'+e(x.tech_stack||'')+'</p><p>'+e(x.localSummary()||'')+'</p><span class="go">'+e(t(P.ui.view_project))+' <i class="fa fa-long-arrow-right"></i></span></div></a>'}).join('')}
    function renderArticles(){var box=document.getElementById('articles-list'),list=D.filterArticles(articles,filterKey);if(!list.length){box.innerHTML='<p class="load-note">'+e(t(P.ui.no_articles))+'</p>';return}box.innerHTML=list.map(function(x){return '<a class="card" href="'+e(x.href)+'"><figure><img loading="lazy" src="'+e(x.cover_image||'/index_page/img/blogs/1.jpg')+'" alt="'+e(x.localTitle())+'" onerror="this.src=\'/index_page/img/blogs/1.jpg\'"></figure><div class="card-body"><div class="meta"><span>'+e(x.category||'')+'</span><span>'+e(x.dateText())+'</span></div><h3>'+e(x.localTitle())+'</h3><p>'+e(x.localSummary()||'')+'</p><span class="go">'+e(t(P.ui.read_more))+' <i class="fa fa-long-arrow-right"></i></span></div></a>'}).join('')}
    function bind(){document.getElementById('form').addEventListener('submit',async function(ev){ev.preventDefault();var f=ev.currentTarget,b=document.getElementById('send'),s=document.getElementById('status');b.disabled=true;s.textContent=c('sending');try{var r=await D.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});s.textContent=r.message||c('sent');f.reset()}catch(err){s.textContent=err.message||c('failed')}finally{b.disabled=false}});if(!matchMedia('(prefers-reduced-motion: reduce)').matches){var frame=document.querySelector('.astro-frame'),photo=document.getElementById('astro-photo');frame.addEventListener('pointermove',function(ev){var r=frame.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width-.5,y=(ev.clientY-r.top)/r.height-.5;photo.style.transform='scale(1.07) translate('+(-x*14)+'px,'+(-y*12)+'px)' });frame.addEventListener('pointerleave',function(){photo.style.transform='scale(1.05)'})}}
    document.addEventListener('DOMContentLoaded',function(){D.setTheme(window.THEME_ID);render();D.mountSwitcher({accent:'#dd452e'});D.onLang(function(){render();renderProjects();renderArticles()});bind();Promise.all([D.fetchProjects(),D.fetchArticles()]).then(function(r){projects=r[0];articles=r[1];renderProjects();renderArticles()}).catch(function(){renderProjects();renderArticles()})})

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Blaugrana</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --blue:#004d98;        /* club blue */
      --garnet:#a50044;      /* accent garnet */
      --gold:#ffed02;        /* gold trim */
      --cat-red:#da291c;     /* catalan red */
      --navy:#001b3a;        /* deep panel */
      --navy2:#002a54;       /* raised panel */
      --paper:#f4f5f8;       /* page background */
      --ink:#141821;         /* body text */
      --grey:#5c6472;        /* muted */
      --line:rgba(20,24,33,.14);
      --panel:#ffffff;
      /* signature blue-garnet vertical stripe field */
      --stripes:repeating-linear-gradient(90deg,
        var(--blue) 0, var(--blue) 44px,
        var(--garnet) 44px, var(--garnet) 88px);
      --shield:polygon(0 0, 100% 0, 100% 58%, 50% 100%, 0 58%);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;background:var(--paper);color:var(--ink);
      font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;line-height:1.55;overflow-x:hidden;
    }
    a{color:inherit}
    img{max-width:100%;display:block}
    h1,h2,h3,h4,.oswald{font-family:'Oswald',Impact,'Arial Narrow',sans-serif;font-weight:600;
      text-transform:uppercase;letter-spacing:.02em}
    .container{max-width:1180px;margin:0 auto;padding:0 26px}
    :focus-visible{outline:3px solid var(--gold);outline-offset:2px}

    /* ===== Catalan senyera ribbon divider (yellow + red stripes) ===== */
    .ribbon{height:14px;width:100%;
      background:repeating-linear-gradient(180deg,
        var(--gold) 0, var(--gold) 3px,
        var(--cat-red) 3px, var(--cat-red) 6px);
      border-top:2px solid var(--navy);border-bottom:2px solid var(--navy)}

    /* thin gold hairline */
    .goldline{height:3px;width:64px;background:var(--gold);margin:0 0 18px;border-radius:2px}

    /* ===== Topbar ===== */
    .topbar{position:sticky;top:0;z-index:900;background:var(--navy);
      border-bottom:3px solid var(--gold)}
    .topbar .inner{display:flex;align-items:center;gap:22px;height:58px;
      padding-right:210px}
    .brand{font-family:'Oswald',sans-serif;font-weight:700;font-size:21px;letter-spacing:.03em;
      text-decoration:none;color:#fff;text-transform:uppercase;white-space:nowrap}
    .brand b{color:var(--gold)}
    .navlinks{display:flex;gap:20px;overflow:hidden}
    .navlinks a{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;
      text-decoration:none;color:rgba(255,255,255,.7);white-space:nowrap;padding:4px 0;
      border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
    .navlinks a:hover,.navlinks a:focus-visible{color:var(--gold);border-color:var(--gold)}
    @media(max-width:900px){.navlinks{display:none}.topbar .inner{padding-right:150px}}

    /* ===== Section scaffolding ===== */
    section{padding:70px 0}
    .sec-head{margin-bottom:30px}
    .sec-kick{display:flex;align-items:center;gap:12px;font-family:'Oswald',sans-serif;
      font-weight:600;text-transform:uppercase;letter-spacing:.16em;font-size:13px;color:var(--garnet)}
    .sec-kick .num{background:var(--garnet);color:#fff;font-size:12px;padding:3px 9px;border-radius:3px}
    .sec-title{font-size:clamp(28px,4.4vw,46px);line-height:1;margin:12px 0 0;color:var(--navy)}

    /* ===== HERO ===== */
    .hero{position:relative;background:var(--navy);color:#fff;overflow:hidden;
      padding:0 0 0}
    .hero .stripes{position:absolute;inset:0;background:var(--stripes);opacity:.9}
    .hero .stripes::after{content:"";position:absolute;inset:0;
      background:linear-gradient(180deg,rgba(0,27,58,.25),rgba(0,27,58,.78))}
    .hero .inner{position:relative;z-index:2;padding:96px 0 84px;padding-right:0}
    .hero .greet{font-family:'Oswald',sans-serif;font-weight:500;text-transform:uppercase;
      letter-spacing:.24em;font-size:14px;color:var(--gold);margin:0 0 10px}
    /* crest / shield frame around the headline block */
    .crest-head{position:relative;display:inline-block;max-width:min(760px,92%);
      background:var(--garnet);
      clip-path:var(--shield);
      padding:40px 54px 74px;
      border-top:5px solid var(--gold)}
    .crest-head::before{content:"";position:absolute;inset:5px;clip-path:var(--shield);
      border:2px solid rgba(255,237,2,.55);pointer-events:none}
    .hero h1{font-size:clamp(46px,10vw,104px);line-height:.9;margin:0;color:#fff;
      font-weight:700;letter-spacing:.01em;text-shadow:0 3px 0 rgba(0,0,0,.18)}
    .hero .head{font-family:'Oswald',sans-serif;font-weight:400;text-transform:none;
      font-size:clamp(17px,2.6vw,26px);margin:16px auto 0;max-width:24ch;color:var(--gold)}
    .hero .role{margin-top:18px;font-size:15px;color:rgba(255,255,255,.9);max-width:46ch}
    .hero-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0}
    .cta-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:30px}
    .cta{display:inline-flex;align-items:center;gap:10px;text-decoration:none;
      font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.08em;
      font-size:14px;padding:14px 26px;border-radius:4px;transition:transform .15s,box-shadow .15s,background .15s,color .15s}
    .cta.gold{background:var(--gold);color:var(--navy);border:2px solid var(--gold)}
    .cta.gold:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.3)}
    .cta.ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.75)}
    .cta.ghost:hover{background:#fff;color:var(--navy);transform:translateY(-2px)}
    /* FC Barcelona-style crest */
    .crest{width:clamp(96px,15vw,150px);height:auto;display:block;margin:0 auto 20px;
      filter:drop-shadow(0 12px 22px rgba(0,0,0,.45));transition:transform .3s}
    .crest:hover{transform:translateY(-3px) scale(1.03)}
    .crest-watermark{position:absolute;top:50%;right:-5%;transform:translateY(-50%) rotate(-6deg);
      width:min(560px,60%);opacity:.08;z-index:1;pointer-events:none}
    @media(max-width:760px){.crest-watermark{right:-24%;width:80%;opacity:.06}}

    /* ===== About ===== */
    .about-grid{display:grid;grid-template-columns:300px 1fr;gap:44px;align-items:start}
    /* shield-framed avatar */
    .crest-frame{position:relative;width:100%;aspect-ratio:1/1.16;background:var(--gold);
      clip-path:var(--shield);padding:9px;filter:drop-shadow(0 12px 26px rgba(0,0,0,.22))}
    .crest-frame .inner-shield{width:100%;height:100%;background:var(--garnet);
      clip-path:var(--shield);padding:6px}
    .crest-frame img{width:100%;height:100%;object-fit:cover;clip-path:var(--shield)}
    .about-text p{font-size:clamp(15px,1.8vw,17.5px);margin:0 0 16px;max-width:62ch;color:var(--ink)}
    .loc-badge{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;
      font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:13px;
      padding:9px 16px;border-radius:4px;border-left:4px solid var(--gold)}
    @media(max-width:760px){.about-grid{grid-template-columns:1fr;gap:28px}
      .crest-frame{max-width:260px;margin:0 auto}}

    /* ===== Panel look for content sections ===== */
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;
      box-shadow:0 6px 20px rgba(0,27,58,.06)}

    /* Education / experience rows */
    .row-item{display:grid;grid-template-columns:170px 1fr;gap:22px;padding:22px 24px;
      border-left:5px solid var(--garnet)}
    .row-item + .row-item{border-top:1px solid var(--line)}
    .row-item .when{font-family:'Oswald',sans-serif;font-weight:600;color:var(--blue);
      font-size:15px;letter-spacing:.03em}
    .row-item h3{margin:0 0 6px;font-size:20px;color:var(--navy)}
    .row-item .sub{color:var(--grey);font-size:14.5px}
    .row-item ul{margin:12px 0 0;padding-left:18px;color:var(--ink);font-size:14.5px;line-height:1.7}
    .row-item ul li{margin-bottom:4px}
    .row-item ul li::marker{color:var(--garnet)}
    @media(max-width:620px){.row-item{grid-template-columns:1fr;gap:8px}}

    /* Skills chips */
    .chips{display:flex;flex-wrap:wrap;gap:12px}
    .chip{font-family:'Oswald',sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:.05em;
      font-size:14px;padding:10px 16px;border-radius:999px;background:#fff;color:var(--navy);
      border:2px solid var(--blue);transition:transform .15s,background .15s,color .15s}
    .chip:nth-child(3n+2){border-color:var(--garnet)}
    .chip:nth-child(3n+2):hover{background:var(--garnet);color:#fff}
    .chip:nth-child(3n+1):hover{background:var(--blue);color:#fff}
    .chip:nth-child(3n+3){border-color:var(--navy)}
    .chip:nth-child(3n+3):hover{background:var(--navy);color:var(--gold)}
    .chip:hover{transform:translateY(-2px)}

    /* Courses — on stadium seating texture */
    .stadium{position:relative;background:var(--navy);color:#fff}
    .stadium::before{content:"";position:absolute;inset:0;opacity:.5;
      background-image:
        radial-gradient(circle, rgba(255,237,2,.55) 1.6px, transparent 1.8px),
        radial-gradient(circle, rgba(165,0,68,.6) 1.6px, transparent 1.8px),
        radial-gradient(circle, rgba(0,122,204,.55) 1.6px, transparent 1.8px);
      background-size:20px 20px,20px 20px,20px 20px;
      background-position:0 0,10px 20px,10px 60px;pointer-events:none}
    .stadium .container{position:relative;z-index:2}
    .stadium .sec-kick{color:var(--gold)}
    .stadium .sec-title{color:#fff}
    .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .course{background:var(--navy2);border:1px solid rgba(255,255,255,.12);border-radius:8px;
      padding:24px;border-top:4px solid var(--gold);transition:transform .15s,box-shadow .15s}
    .course:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.4)}
    .course .ci{color:var(--gold);font-size:26px;margin-bottom:14px}
    .course h4{margin:0 0 10px;font-size:17px;color:#fff;line-height:1.2}
    .course p{margin:0;color:rgba(255,255,255,.72);font-size:13.5px;line-height:1.6;
      font-family:'Inter',sans-serif;text-transform:none;letter-spacing:0}
    @media(max-width:820px){.courses{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.courses{grid-template-columns:1fr}}

    /* Cards (projects/articles) */
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
    .card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;
      display:flex;flex-direction:column;text-decoration:none;color:inherit;
      transition:transform .16s,box-shadow .16s;border-top:4px solid var(--garnet)}
    .card:hover{transform:translateY(-5px);box-shadow:0 16px 34px rgba(0,27,58,.18)}
    .card .cover{height:172px;background:#dfe3ea;overflow:hidden;position:relative}
    .card .cover img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
    .card:hover .cover img{transform:scale(1.05)}
    .card .cbody{padding:18px;display:flex;flex-direction:column;gap:9px;flex:1}
    .card .ctag{display:flex;justify-content:space-between;align-items:center;
      font-family:'Oswald',sans-serif;font-size:11.5px;font-weight:600;text-transform:uppercase;
      letter-spacing:.1em;color:var(--garnet)}
    .card .ctag .date{color:var(--grey)}
    .card h4{margin:0;font-size:18px;line-height:1.22;color:var(--navy)}
    .card .tech{font-size:12.5px;font-weight:600;color:var(--blue);font-family:'Inter',sans-serif}
    .card p{margin:0;color:var(--grey);font-size:14px;line-height:1.5;flex:1;
      font-family:'Inter',sans-serif;text-transform:none}
    .card .more{font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;text-transform:uppercase;
      letter-spacing:.1em;color:var(--garnet)}
    @media(max-width:820px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.cards{grid-template-columns:1fr}}

    /* Filters */
    .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
    .filters button{background:#fff;border:2px solid var(--navy);color:var(--navy);
      font-family:'Oswald',sans-serif;font-weight:500;font-size:12.5px;text-transform:uppercase;
      letter-spacing:.06em;padding:9px 16px;cursor:pointer;border-radius:999px;transition:.15s}
    .filters button:hover{border-color:var(--garnet);color:var(--garnet)}
    .filters button.active{background:var(--garnet);border-color:var(--garnet);color:#fff}

    /* Certificates */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    .cert{display:grid;grid-template-columns:130px 1fr;background:#fff;border:1px solid var(--line);
      border-radius:10px;overflow:hidden;border-left:5px solid var(--gold)}
    .cert img{height:100%;width:100%;object-fit:cover;background:#dfe3ea}
    .cert .ct{padding:18px}
    .cert .ct .meta{display:flex;justify-content:space-between;gap:8px;font-family:'Oswald',sans-serif;
      font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--garnet)}
    .cert .ct .meta .date{color:var(--grey)}
    .cert .ct h4{margin:10px 0 7px;font-size:17px;color:var(--navy);line-height:1.2}
    .cert .ct p{margin:0;color:var(--grey);font-size:13.5px;line-height:1.5;
      font-family:'Inter',sans-serif;text-transform:none}
    @media(max-width:620px){.certs{grid-template-columns:1fr}.cert{grid-template-columns:100px 1fr}}

    /* Contact */
    .contact{position:relative;background:var(--navy);color:#fff}
    .contact .stripes-top{height:12px;background:var(--stripes)}
    .contact .sec-kick{color:var(--gold)}
    .contact .sec-title{color:#fff}
    .contact-grid{display:grid;grid-template-columns:5fr 7fr;gap:40px}
    .contact-info a{display:flex;justify-content:space-between;gap:12px;
      border-bottom:1px solid rgba(255,255,255,.16);padding:15px 0;text-decoration:none;
      font-weight:600;color:#fff;transition:color .15s}
    .contact-info a:hover{color:var(--gold)}
    .contact-info a span:first-child{font-family:'Oswald',sans-serif;text-transform:uppercase;
      letter-spacing:.08em;font-size:14px}
    .contact-info a span:last-child{color:var(--gold)}
    .contact-form input,.contact-form textarea{width:100%;background:rgba(255,255,255,.06);
      border:2px solid rgba(255,255,255,.2);border-radius:6px;font-family:inherit;font-size:15px;
      padding:14px;margin-bottom:14px;color:#fff}
    .contact-form input::placeholder,.contact-form textarea::placeholder{color:rgba(255,255,255,.5)}
    .contact-form input:focus,.contact-form textarea:focus{border-color:var(--gold);outline:none}
    .contact-form textarea{min-height:140px;resize:vertical}
    .contact-form button{background:var(--gold);color:var(--navy);border:2px solid var(--gold);
      font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.08em;
      font-size:15px;padding:14px 30px;cursor:pointer;border-radius:6px;transition:transform .15s,background .15s}
    .contact-form button:hover{transform:translateY(-2px);background:#fff}
    #cf-status{margin-top:12px;font-weight:600;font-size:14px;min-height:20px}
    @media(max-width:760px){.contact-grid{grid-template-columns:1fr;gap:24px}}

    /* Footer */
    footer{background:#00122a;color:rgba(255,255,255,.75);padding:44px 0 54px}
    footer .fbrand{font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;color:#fff;
      text-decoration:none;text-transform:uppercase;letter-spacing:.03em}
    footer .fbrand b{color:var(--gold)}
    footer .frow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center}
    footer .fsocial{display:flex;flex-wrap:wrap;gap:20px}
    footer a{text-decoration:none;color:rgba(255,255,255,.72);font-weight:600;font-size:13px;transition:color .15s}
    footer a:hover{color:var(--gold)}
    footer .muted{color:rgba(255,255,255,.5);font-size:12.5px}
    .load-note{grid-column:1/-1;color:var(--grey);font-size:15px;padding:12px 0}
    .stadium .load-note{color:rgba(255,255,255,.7)}

    @media (prefers-reduced-motion: reduce){
      *{scroll-behavior:auto !important;transition:none !important;animation:none !important}
      .card:hover,.course:hover,.chip:hover,.cta:hover{transform:none}
    }
  </style>
</head>
<body>
  <!-- Reusable FC Barcelona-style crest (hand-drawn recreation for this fan page) -->
  <svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true" focusable="false">
    <symbol id="fcb-crest" viewBox="0 0 200 224">
      <defs>
        <clipPath id="crestInner">
          <path d="M 22 13 L 178 13 Q 187 13 187 22 L 187 116 C 187 158 151 186 100 208 C 49 186 13 158 13 116 L 13 22 Q 13 13 22 13 Z"/>
        </clipPath>
      </defs>
      <!-- gold shield border + dark outer edge -->
      <path d="M 16 6 L 184 6 Q 194 6 194 16 L 194 118 C 194 165 154 195 100 218 C 46 195 6 165 6 118 L 6 16 Q 6 6 16 6 Z" fill="#ffcc00"/>
      <path d="M 16 6 L 184 6 Q 194 6 194 16 L 194 118 C 194 165 154 195 100 218 C 46 195 6 165 6 118 L 6 16 Q 6 6 16 6 Z" fill="none" stroke="#0b1f3a" stroke-width="2.5"/>
      <g clip-path="url(#crestInner)">
        <!-- top-left: St George cross (red on white) -->
        <rect x="13" y="13" width="87" height="77" fill="#ffffff"/>
        <rect x="49.5" y="13" width="14" height="77" fill="#da291c"/>
        <rect x="13" y="44.5" width="87" height="14" fill="#da291c"/>
        <!-- top-right: Catalan senyera (red stripes on gold) -->
        <rect x="100" y="13" width="87" height="77" fill="#f9d616"/>
        <rect x="109.7" y="13" width="9.7" height="77" fill="#da291c"/>
        <rect x="129.0" y="13" width="9.7" height="77" fill="#da291c"/>
        <rect x="148.3" y="13" width="9.7" height="77" fill="#da291c"/>
        <rect x="167.7" y="13" width="9.7" height="77" fill="#da291c"/>
        <!-- middle band: blue -->
        <rect x="13" y="90" width="174" height="36" fill="#004d98"/>
        <!-- bottom: blaugrana vertical stripes -->
        <rect x="13" y="126" width="29" height="82" fill="#004d98"/>
        <rect x="42" y="126" width="29" height="82" fill="#a50044"/>
        <rect x="71" y="126" width="29" height="82" fill="#004d98"/>
        <rect x="100" y="126" width="29" height="82" fill="#a50044"/>
        <rect x="129" y="126" width="29" height="82" fill="#004d98"/>
        <rect x="158" y="126" width="29" height="82" fill="#a50044"/>
        <!-- gold hairline dividers -->
        <line x1="13" y1="90" x2="187" y2="90" stroke="#ffcc00" stroke-width="2"/>
        <line x1="13" y1="126" x2="187" y2="126" stroke="#ffcc00" stroke-width="2"/>
        <line x1="100" y1="13" x2="100" y2="90" stroke="#ffcc00" stroke-width="1.5"/>
        <!-- football -->
        <g transform="translate(0,3)">
          <circle cx="100" cy="160" r="19" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
          <polygon points="100,152 107.6,157.5 104.7,166.5 95.3,166.5 92.4,157.5" fill="#111111"/>
          <g stroke="#111111" stroke-width="1.8">
            <line x1="100" y1="152" x2="100" y2="141"/>
            <line x1="107.6" y1="157.5" x2="118.1" y2="154.1"/>
            <line x1="104.7" y1="166.5" x2="111.2" y2="175.4"/>
            <line x1="95.3" y1="166.5" x2="88.8" y2="175.4"/>
            <line x1="92.4" y1="157.5" x2="81.9" y2="154.1"/>
          </g>
        </g>
        <!-- FCB lettering -->
        <text x="100" y="115" text-anchor="middle" font-family="Oswald, Impact, sans-serif" font-weight="700" font-size="27" letter-spacing="1.5" fill="#ffcc00">FCB</text>
      </g>
      <!-- inner gold frame -->
      <path d="M 22 13 L 178 13 Q 187 13 187 22 L 187 116 C 187 158 151 186 100 208 C 49 186 13 158 13 116 L 13 22 Q 13 13 22 13 Z" fill="none" stroke="#ffcc00" stroke-width="2"/>
    </symbol>
  </svg>

  <div class="topbar">
    <div class="container inner">
      <a class="brand" href="#top">Cai<b>Jiechao</b></a>
      <nav class="navlinks" id="nav"></nav>
    </div>
  </div>

  <div id="top"></div>

  <!-- HERO -->
  <header class="hero">
    <div class="stripes" aria-hidden="true"></div>
    <svg class="crest-watermark" viewBox="0 0 200 224" aria-hidden="true" focusable="false"><use href="#fcb-crest" xlink:href="#fcb-crest"/></svg>
    <div class="inner"><div class="container">
      <div class="hero-wrap">
        <svg class="crest" viewBox="0 0 200 224" role="img" aria-label="FC Barcelona-style crest"><use href="#fcb-crest" xlink:href="#fcb-crest"/></svg>
        <p class="greet" id="greet"></p>
        <div class="crest-head">
          <h1 id="name"></h1>
        </div>
        <p class="head" id="headline"></p>
        <p class="role" id="hero-role"></p>
        <div class="cta-row">
          <a class="cta gold" id="cvBtn" href="#" download></a>
          <a class="cta ghost" id="ghBtn" target="_blank" rel="noopener"></a>
        </div>
      </div>
    </div></div>
  </header>
  <div class="ribbon" aria-hidden="true"></div>

  <!-- ABOUT -->
  <section id="about"><div class="container">
    <div class="sec-head">
      <div class="sec-kick"><span class="num">01</span><span id="l-about"></span></div>
      <h2 class="sec-title" id="t-about"></h2>
    </div>
    <div class="about-grid">
      <div class="crest-frame">
        <div class="inner-shield">
          <img id="portrait" alt="Cai Jiechao portrait" />
        </div>
      </div>
      <div class="about-text" id="about-text"></div>
    </div>
  </div></section>

  <!-- EDUCATION -->
  <section id="education"><div class="container">
    <div class="sec-head">
      <div class="sec-kick"><span class="num">02</span><span id="l-edu"></span></div>
      <h2 class="sec-title" id="t-edu"></h2>
    </div>
    <div class="panel" id="edu-list"></div>
  </div></section>

  <!-- SKILLS -->
  <section id="skills"><div class="container">
    <div class="sec-head">
      <div class="sec-kick"><span class="num">03</span><span id="l-skills"></span></div>
      <h2 class="sec-title" id="t-skills"></h2>
    </div>
    <div class="chips" id="skills-list"></div>
  </div></section>

  <!-- COURSES on stadium texture -->
  <section id="courses" class="stadium"><div class="container">
    <div class="sec-head">
      <div class="sec-kick"><span class="num">04</span><span id="l-courses"></span></div>
      <h2 class="sec-title" id="t-courses"></h2>
    </div>
    <div class="courses" id="courses-list"></div>
  </div></section>

  <!-- EXPERIENCE -->
  <section id="experience"><div class="container">
    <div class="sec-head">
      <div class="sec-kick"><span class="num">05</span><span id="l-exp"></span></div>
      <h2 class="sec-title" id="t-exp"></h2>
    </div>
    <div class="panel" id="exp-list"></div>
  </div></section>

  <!-- PROJECTS -->
  <section id="projects"><div class="container">
    <div class="sec-head">
      <div class="sec-kick"><span class="num">06</span><span id="l-projects"></span></div>
      <h2 class="sec-title" id="t-projects"></h2>
    </div>
    <div class="cards" id="projects-list"><div class="load-note" id="proj-load"></div></div>
  </div></section>

  <!-- ARTICLES -->
  <section id="articles"><div class="container">
    <div class="sec-head">
      <div class="sec-kick"><span class="num">07</span><span id="l-articles"></span></div>
      <h2 class="sec-title" id="t-articles"></h2>
    </div>
    <div class="filters" id="filters"></div>
    <div class="cards" id="articles-list"><div class="load-note" id="art-load"></div></div>
  </div></section>

  <!-- CERTIFICATES -->
  <section id="certificates"><div class="container">
    <div class="sec-head">
      <div class="sec-kick"><span class="num">08</span><span id="l-certs"></span></div>
      <h2 class="sec-title" id="t-certs"></h2>
    </div>
    <div class="certs" id="certs-list"></div>
  </div></section>

  <!-- CONTACT -->
  <section id="contact" class="contact">
    <div class="stripes-top" aria-hidden="true"></div>
    <div class="container" style="padding-top:70px;padding-bottom:0">
      <div class="sec-head">
        <div class="sec-kick"><span class="num">09</span><span id="l-contact"></span></div>
        <h2 class="sec-title" id="t-contact"></h2>
      </div>
      <div class="contact-grid">
        <div class="contact-info" id="contact-info"></div>
        <div class="contact-form">
          <form id="cf" novalidate>
            <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="display:none">
            <input type="text" name="name" id="cf-name" autocomplete="name" required>
            <input type="email" name="email" id="cf-email" autocomplete="email" required>
            <textarea name="message" id="cf-msg" required></textarea>
            <button type="submit" id="cf-send"></button>
            <p id="cf-status" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer><div class="container">
    <div class="frow">
      <a class="fbrand" href="#top">Cai<b>Jiechao</b></a>
      <div class="fsocial" id="foot-social"></div>
    </div>
    <div class="frow" style="margin-top:20px">
      <span class="muted" id="foot-desc"></span>
      <a class="muted" id="foot-icp" target="_blank" rel="noopener"></a>
    </div>
  </div></footer>

  <script>window.THEME_ID = "35-barca";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";

    function renderStatic(){
      document.title = (t(P.name)) + " — Blaugrana";
      // nav
      document.getElementById('nav').innerHTML = [
        ['about','nav_about'],['courses','nav_courses'],['experience','nav_internship'],
        ['projects','nav_portfolio'],['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');

      // hero
      document.getElementById('greet').textContent = t(P.greeting);
      document.getElementById('name').textContent = t(P.name);
      document.getElementById('headline').textContent = t(P.headline);
      document.getElementById('hero-role').textContent = t(P.role) + " · " + t(P.title);
      const cv = document.getElementById('cvBtn');
      cv.textContent = t(P.ui.download_cv); cv.href = t(P.cv);
      const gh = document.getElementById('ghBtn');
      gh.innerHTML = '<i class="fa fa-github" aria-hidden="true"></i> GitHub';
      gh.href = P.contact.github;

      // section labels + titles
      document.getElementById('l-about').textContent = t(P.ui.about_desc);
      document.getElementById('t-about').textContent = t(P.ui.about_me);
      document.getElementById('l-edu').textContent = t(P.ui.education_bg);
      document.getElementById('t-edu').textContent = t(P.ui.education_bg);
      document.getElementById('l-skills').textContent = t(P.ui.core_tech);
      document.getElementById('t-skills').textContent = t(P.ui.core_tech);
      document.getElementById('l-courses').textContent = t(P.ui.core_courses);
      document.getElementById('t-courses').textContent = t(P.ui.core_courses);
      document.getElementById('l-exp').textContent = t(P.ui.internship_exp);
      document.getElementById('t-exp').textContent = t(P.ui.internship_exp);
      document.getElementById('l-projects').textContent = t(P.ui.latest_projects);
      document.getElementById('t-projects').textContent = t(P.ui.latest_projects);
      document.getElementById('l-articles').textContent = t(P.ui.latest_articles);
      document.getElementById('t-articles').textContent = t(P.ui.latest_articles);
      document.getElementById('l-certs').textContent = t(P.ui.certificates);
      document.getElementById('t-certs').textContent = t(P.ui.certificates);
      document.getElementById('l-contact').textContent = t(P.ui.drop_msg);
      document.getElementById('t-contact').textContent = t(P.ui.get_in_touch);

      // about
      document.getElementById('portrait').src = P.avatar;
      document.getElementById('portrait').alt = t(P.name);
      document.getElementById('about-text').innerHTML =
        P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('') +
        `<span class="loc-badge"><i class="fa fa-map-marker" aria-hidden="true"></i> ${esc(t(P.location))}</span>`;

      // education
      document.getElementById('edu-list').innerHTML = P.education.map(e=>`
        <div class="row-item">
          <div class="when">${esc(e.period)}</div>
          <div>
            <h3>${esc(t(e.school))}</h3>
            <div class="sub">${esc(t(e.degree))} — ${esc(t(e.note))}</div>
          </div>
        </div>`).join('');

      // skills
      document.getElementById('skills-list').innerHTML =
        (P.skillTags||[]).map(s=>`<span class="chip">${esc(s)}</span>`).join('');

      // courses
      document.getElementById('courses-list').innerHTML = P.courses.map(c=>`
        <div class="course">
          <div class="ci"><i class="fa ${esc(c.icon)}" aria-hidden="true"></i></div>
          <h4>${esc(t(c.title))}</h4>
          <p>${esc(t(c.desc))}</p>
        </div>`).join('');

      // experience
      document.getElementById('exp-list').innerHTML = P.experience.map(x=>`
        <div class="row-item">
          <div class="when">${esc(x.period)}</div>
          <div>
            <h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3>
            <div class="sub">${esc(t(x.summary))}</div>
            <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul>
          </div>
        </div>`).join('');

      // certificates
      document.getElementById('certs-list').innerHTML = P.certificates.map(c=>`
        <div class="cert">
          <img src="${esc(c.image)}" alt="${esc(t(c.title))}" onerror="this.src='/index_page/img/blogs/1.jpg'">
          <div class="ct">
            <div class="meta"><span>${esc(t(c.tag))}</span><span class="date">${esc(t(c.date))}</span></div>
            <h4>${esc(t(c.title))}</h4>
            <p>${esc(t(c.desc))}</p>
          </div>
        </div>`).join('');

      // contact info
      document.getElementById('contact-info').innerHTML = [
        ['Email', P.contact.email, 'mailto:'+P.contact.email],
        ['Phone', P.contact.phone, P.contact.phoneHref],
        ['GitHub', '@'+P.contact.githubUser, P.contact.github],
        ['WeChat', 'QR ↗', P.contact.wechatQrPage],
      ].map(([k,v,h])=>`<a href="${esc(h)}"><span>${esc(k)}</span><span>${esc(v)}</span></a>`).join('');
      document.getElementById('cf-name').placeholder = t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder = t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder = t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent = t(P.ui.send);

      // footer
      document.getElementById('foot-social').innerHTML =
        `<a href="${esc(P.contact.github)}" target="_blank" rel="noopener">GitHub</a>
         <a href="mailto:${esc(P.contact.email)}">Email</a>
         <a href="${esc(P.contact.wechatQrPage)}">WeChat</a>
         <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent = t(P.ui.footer_desc);
      const icp = document.getElementById('foot-icp'); icp.textContent = P.icp; icp.href = P.icpUrl;

      // filters
      document.getElementById('filters').innerHTML = P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box = document.getElementById('projects-list');
      if(!projects.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML = projects.map(p=>`
        <a class="card" href="${esc(p.href)}">
          <div class="cbody">
            <div class="ctag"><span>${esc(t(P.ui.tech_stack))}</span><span class="date">${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <p class="tech">${esc(p.tech_stack||'')}</p>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div>
        </a>`).join('');
    }

    function renderArticles(){
      const box = document.getElementById('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML = list.map(a=>`
        <a class="card" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
          <div class="cbody">
            <div class="ctag"><span>${esc(a.category||'')}</span><span class="date">${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div>
        </a>`).join('');
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML =
        `<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-list').innerHTML =
        `<div class="load-note">⚠ ${esc(t(P.ui.no_articles))}</div>`; }
    }

    // Contact submit
    document.getElementById('cf').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      const payload = { name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color='rgba(255,255,255,.85)'; s.textContent = t(P.ui.sending);
      try{
        const r = await CJCData.sendContact(payload);
        s.style.color='var(--gold)'; s.textContent = r.message||'Sent.'; f.reset();
      }catch(err){ s.style.color='#ff8ba0'; s.textContent = err.message; }
    });

    // Font Awesome 4.7 for icons
    const fa = document.createElement('link');
    fa.rel='stylesheet';
    fa.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css';
    document.head.appendChild(fa);

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent: "#a50044" });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

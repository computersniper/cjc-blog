<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Cai Jiechao — an editorial portfolio in signal orange.">
  <title>Cai Jiechao — Signal / Form</title>
  <style>
    :root{--paper:#f2efe7;--ink:#171714;--orange:#ee4d19;--soft:#d9d4ca;--muted:#67645e;--line:rgba(23,23,20,.23);--serif:Georgia,'Times New Roman',serif;--sans:Arial,'Helvetica Neue',sans-serif;--mono:'Courier New',monospace}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans);overflow-x:hidden}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}button{cursor:pointer}img{display:block;max-width:100%}.skip{position:fixed;z-index:99999;left:12px;top:-60px;padding:10px 14px;background:var(--ink);color:#fff}.skip:focus{top:12px}.shell{width:min(1360px,calc(100% - 56px));margin:auto}.micro{font:700 9px/1.35 var(--mono);letter-spacing:.12em;text-transform:uppercase}.topbar{height:72px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px}.brand{font:italic 700 21px/1 var(--serif)}.brand b{color:var(--orange)}.nav{display:flex;gap:22px}.nav a{font:700 9px var(--mono);letter-spacing:.11em;text-transform:uppercase}.nav a:hover{color:var(--orange)}.edition{text-align:right;color:var(--muted)}
    .hero{min-height:calc(100vh - 72px);position:relative;display:flex;align-items:center;border-bottom:1px solid var(--line);overflow:hidden}.hero-silhouette{position:absolute;z-index:0;width:clamp(250px,35vw,540px);height:92%;left:50%;top:50%;transform:translate(-47%,-50%);overflow:hidden;filter:blur(4px)}.hero-silhouette img{width:100%;height:100%;object-fit:cover;object-position:70% center;filter:saturate(1.6) sepia(.4) hue-rotate(334deg) contrast(1.18);transform:scale(1.08)}.hero-silhouette:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--orange),rgba(238,77,25,.26));mix-blend-mode:color}.hero-grid{position:relative;z-index:1;width:100%;padding:58px 0 42px;display:grid;grid-template-columns:170px 1fr 170px;align-items:center}.hero-side{align-self:stretch;display:flex;flex-direction:column;justify-content:space-between;color:var(--muted)}.hero-side.right{text-align:right}.hero-main{text-align:center}.hero-main h1{font:400 clamp(68px,12.1vw,186px)/.72 var(--serif);letter-spacing:-.095em;margin:0;text-wrap:balance}.hero-main h1 em{display:block;color:var(--orange);font-weight:400}.hero-sub{max-width:500px;margin:32px auto 0;font:700 10px/1.7 var(--mono);letter-spacing:.1em;text-transform:uppercase}.hero-actions{display:flex;justify-content:center;gap:8px;margin-top:24px}.btn{min-height:42px;border:1px solid var(--ink);padding:12px 17px;background:transparent;font:700 9px var(--mono);letter-spacing:.09em;text-transform:uppercase}.btn.primary{background:var(--ink);color:var(--paper)}.btn:hover{background:var(--orange);border-color:var(--orange);color:#fff}.scroll{position:absolute;z-index:2;bottom:13px;left:50%;transform:translateX(-50%);font:700 9px var(--mono);letter-spacing:.1em}
    section{padding:112px 0;border-bottom:1px solid var(--line)}.section-head{display:grid;grid-template-columns:170px 1fr 170px;gap:24px;align-items:start;margin-bottom:54px}.section-head h2{font:400 clamp(55px,8.4vw,126px)/.75 var(--serif);letter-spacing:-.075em;margin:0}.section-head h2 i{font-weight:400;color:var(--orange)}.section-note{color:var(--muted);max-width:170px}.index{color:var(--orange)}.about-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:8vw;align-items:end}.portrait{margin:0;position:relative;overflow:hidden;aspect-ratio:4/5;background:var(--soft)}.portrait img{width:100%;height:100%;object-fit:cover;filter:grayscale(.15) contrast(1.04)}.portrait figcaption{position:absolute;inset:auto 0 0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff}.statement{font:400 clamp(29px,4vw,58px)/1.02 var(--serif);letter-spacing:-.045em;margin:0}.statement i{color:var(--orange)}.bodycopy{max-width:620px;color:var(--muted);margin:28px 0 0}.education{background:var(--ink);color:var(--paper)}.education .section-note{color:#a9a69e}.edu-list{border-top:1px solid rgba(255,255,255,.25)}.edu{display:grid;grid-template-columns:170px 1fr 1fr;gap:24px;padding:28px 0;border-bottom:1px solid rgba(255,255,255,.25)}.edu h3{font:400 clamp(27px,3vw,44px)/1 var(--serif);margin:0}.edu p{margin:0;color:#bdb9b0}.tools-grid{display:grid;grid-template-columns:.78fr 1.22fr;gap:60px}.skill-cloud{display:flex;flex-wrap:wrap;align-content:start;gap:8px}.skill-cloud span{border:1px solid var(--line);padding:10px 12px;font:700 9px var(--mono);letter-spacing:.08em;text-transform:uppercase}.skill-cloud span:nth-child(3n){background:var(--orange);border-color:var(--orange);color:#fff}.courses{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}.course{min-height:190px;padding:22px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.course .course-num{color:var(--orange)}.course h3{font:400 27px/1 var(--serif);margin:40px 0 8px}.course p{font-size:12px;color:var(--muted);margin:0}.experience{background:#ded9ce}.experience-card{display:grid;grid-template-columns:170px 1fr 1fr;gap:24px;padding-top:25px;border-top:2px solid var(--ink)}.experience-card h3{font:400 clamp(39px,5vw,72px)/.86 var(--serif);letter-spacing:-.055em;margin:0}.experience-card p{margin-top:0}.experience-card ul{padding:0;list-style:none;margin:24px 0 0}.experience-card li{padding:10px 0;border-top:1px solid var(--line);font-size:12px}.experience-card li:before{content:'+';color:var(--orange);margin-right:9px;font-weight:bold}
    .project-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.project{border:1px solid var(--line);background:#f8f5ee;transition:.25s}.project:hover{transform:translateY(-6px);box-shadow:9px 9px 0 var(--orange)}.project-image{height:210px;margin:0;overflow:hidden}.project-image img{width:100%;height:100%;object-fit:cover;filter:saturate(.75);transition:.4s}.project:hover img{transform:scale(1.035)}.project-copy{padding:19px}.project h3,.article h3{font:400 29px/1 var(--serif);letter-spacing:-.035em;margin:14px 0 9px}.project p,.article p{font-size:12px;color:var(--muted);margin:0}.tags{margin-top:18px;color:var(--orange)}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:-20px 0 30px}.filters button{border:1px solid var(--line);background:transparent;padding:8px 11px;font:700 9px var(--mono);text-transform:uppercase}.filters button.active,.filters button:hover{background:var(--orange);border-color:var(--orange);color:#fff}.article-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.article{border-top:2px solid var(--ink);padding-top:13px}.article img{width:100%;height:180px;object-fit:cover;margin:14px 0;filter:grayscale(.15)}.more{display:inline-block;margin-top:16px;color:var(--orange);font:700 9px var(--mono);letter-spacing:.08em;text-transform:uppercase}.cert-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.certificate{display:grid;grid-template-columns:145px 1fr;gap:18px;border:1px solid var(--line);padding:14px}.certificate img{width:100%;height:135px;object-fit:cover}.certificate h3{font:400 25px/1 var(--serif);margin:12px 0 7px}.certificate p{margin:0;font-size:12px;color:var(--muted)}
    .contact{background:var(--orange);color:#fff}.contact .section-head i,.contact .index{color:var(--ink)}.contact .section-note{color:#ffe4d8}.contact-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:8vw}.contact-lead{font:400 clamp(34px,5vw,68px)/.95 var(--serif);margin:0}.contact-links{margin-top:32px;border-top:1px solid rgba(255,255,255,.45)}.contact-links a{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.45);font:700 9px var(--mono);letter-spacing:.08em;text-transform:uppercase}label{display:block;font:700 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;margin:0 0 6px}input,textarea{width:100%;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.08);color:#fff;padding:12px;margin-bottom:15px;border-radius:0}textarea{min-height:135px;resize:vertical}input:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:2px}.contact .btn{background:var(--ink);color:#fff;border-color:var(--ink)}#status{min-height:22px}.footer{background:var(--ink);color:var(--paper);padding:28px 0}.footer-row{display:flex;justify-content:space-between;align-items:center;gap:20px}.footer-links{display:flex;gap:16px;flex-wrap:wrap}.footer a,.footer small{font:700 9px var(--mono);letter-spacing:.08em;text-transform:uppercase}.loading,.failure{color:var(--muted);padding:24px 0}.reveal{opacity:0;transform:translateY(20px);transition:.65s ease}.reveal.in{opacity:1;transform:none}:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
    @media(max-width:900px){.nav{display:none}.topbar{grid-template-columns:1fr 1fr}.topbar .edition{display:none}.hero-grid,.section-head{grid-template-columns:120px 1fr}.hero-side.right,.section-head .section-note{display:none}.project-grid,.article-grid{grid-template-columns:repeat(2,1fr)}.about-grid,.tools-grid,.contact-grid{grid-template-columns:1fr}.edu,.experience-card{grid-template-columns:120px 1fr}.edu p,.experience-card>div:last-child{grid-column:2}.cert-grid{grid-template-columns:1fr}}
    @media(max-width:560px){.shell{width:calc(100% - 28px)}.topbar{height:62px}.hero{min-height:720px}.hero-grid{grid-template-columns:1fr}.hero-side{display:none}.hero-silhouette{width:78vw;height:78%}.hero-main h1{font-size:74px}.hero-sub{max-width:310px}.section-head{grid-template-columns:1fr}.section-head .index{margin-bottom:10px}.section-head h2{font-size:59px}.edu,.experience-card{grid-template-columns:1fr}.edu p,.experience-card>div:last-child{grid-column:auto}.project-grid,.article-grid,.courses{grid-template-columns:1fr}.certificate{grid-template-columns:110px 1fr}.footer-row{align-items:flex-start;flex-direction:column}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
  </style>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="shell topbar"><a class="brand" href="#top">Cai<b>Jiechao</b></a><nav class="nav" id="nav" aria-label="Primary navigation"></nav><span class="edition micro">Portfolio / 2026</span></header>
  <main id="content"></main>
  <footer class="footer"><div class="shell footer-row"><div><div class="brand">Cai<b>Jiechao</b></div><small id="footer-note"></small></div><div class="footer-links" id="footer-links"></div></div></footer>
  <script>window.THEME_ID='67-orange-editorial';</script>
  <script src="/shared/profile.js"></script><script src="/shared/site-data.js"></script>
  <script>
  (()=>{'use strict';
    const P=CJCData.profile,t=CJCData.t.bind(CJCData),e=CJCData.escapeHtml;let projects=[],articles=[],filter='all';
    const L={en:{nav:[['about','Profile'],['education','Study'],['work','Selected work'],['journal','Journal'],['contact','Contact']],heroA:'Signal',heroB:'Form',about:'A human system',aboutLead:'Profile / intent / working method',education:'Learning archive',educationLead:'Formal study and continuous curiosity',tools:'Tools of practice',toolsLead:'Technology, craft, and current disciplines',courses:'Current studies',experience:'In the field',experienceLead:'Applied work measured in outcomes',projects:'Selected work',projectsLead:'Projects with real context and working links',journal:'Working notes',journalLead:'Writing on systems, craft, and building',cert:'Proof of practice',certLead:'Certificates and milestones',contact:'Start a signal',contactLead:'A clear line for new work and thoughtful conversations',view:'Open project',read:'Read article',failed:'Content could not be loaded. Please try again shortly.',send:'Send message',sending:'Sending…',sent:'Message sent.',name:'Your name',email:'Email address',message:'Your message',loc:'Based in',cv:'Download CV',github:'GitHub',heroNote:'Developer / researcher / builder'},zh:{nav:[['about','简介'],['education','求学'],['work','项目'],['journal','文章'],['contact','联系']],heroA:'信号',heroB:'成形',about:'一个人的系统',aboutLead:'简介 / 意图 / 工作方法',education:'学习档案',educationLead:'正规教育与持续的好奇心',tools:'实践工具',toolsLead:'技术、手艺与正在研究的方向',courses:'近期课程',experience:'进入现场',experienceLead:'用真实结果衡量实践',projects:'精选项目',projectsLead:'有真实语境与可访问链接的作品',journal:'工作笔记',journalLead:'关于系统、手艺与创造的记录',cert:'实践凭证',certLead:'证书与阶段性里程碑',contact:'发出信号',contactLead:'为新项目与认真交流留出一条清晰通道',view:'打开项目',read:'阅读文章',failed:'内容暂时无法加载，请稍后重试。',send:'发送消息',sending:'发送中…',sent:'消息已发送。',name:'你的姓名',email:'邮箱地址',message:'想说的话',loc:'常驻',cv:'下载简历',github:'GitHub',heroNote:'开发者 / 研究者 / 创作者'}};
    const l=()=>L[CJCData.lang()];const head=(n,title,note)=>`<div class="section-head reveal"><div class="index micro">${String(n).padStart(2,'0')} / 09</div><h2>${e(title)}</h2><p class="section-note micro">${e(note)}</p></div>`;const link=(href,label)=>`<a href="${e(href)}">${e(label)}</a>`;
    function hero(){const x=l();return `<section class="hero" id="top"><div class="hero-silhouette" aria-hidden="true"><img src="/wansi/img/20250403010132.jpg" alt=""></div><div class="shell hero-grid"><div class="hero-side micro"><span>Latitude<br>${e(t(P.location))}</span><span>Index 067<br>Signal study</span></div><div class="hero-main"><div class="micro">${e(t(P.greeting))} / ${e(t(P.role))}</div><h1>${e(x.heroA)}<em>${e(x.heroB)}</em></h1><p class="hero-sub">${e(t(P.headline))} — ${e(x.heroNote)}</p><div class="hero-actions"><a class="btn primary" href="${e(t(P.cv))}" download>${e(x.cv)}</a><a class="btn" href="${e(P.contact.github)}" target="_blank" rel="noopener">${e(x.github)}</a></div></div><div class="hero-side right micro"><span>CJC / 2026<br>Edition 01</span><span>${e(t(P.name))}<br>${e(t(P.title))}</span></div></div><a class="scroll" href="#about" aria-label="Scroll to profile">↓</a></section>`}
    function about(){const x=l(),photo=P.photos&&P.photos.graduation||P.avatar;return `<section id="about"><div class="shell">${head(1,x.about,x.aboutLead)}<div class="about-grid"><figure class="portrait reveal"><img src="${e(photo)}" onerror="this.src='/index_page/img/avatar.jpg'" alt="${e(t(P.name))}"><figcaption class="micro">${e(x.loc)} / ${e(t(P.location))}</figcaption></figure><div class="reveal"><p class="statement">${e(t(P.bio[0]))} <i>(${e(t(P.role))})</i></p><p class="bodycopy">${e(t(P.bio[1]))}</p></div></div></div></section>`}
    function education(){const x=l();return `<section id="education" class="education"><div class="shell">${head(2,x.education,x.educationLead)}<div class="edu-list reveal">${P.education.map(s=>`<article class="edu"><time class="micro">${e(s.period)}</time><h3>${e(t(s.school))}</h3><p>${e(t(s.degree))}<br>${e(t(s.note))}</p></article>`).join('')}</div></div></section>`}
    function skills(){const x=l();return `<section id="skills"><div class="shell">${head(3,x.tools,x.toolsLead)}<div class="tools-grid"><div class="skill-cloud reveal">${P.skillTags.map(s=>`<span>${e(s)}</span>`).join('')}</div><div><div class="micro" style="margin-bottom:16px">${e(x.courses)}</div><div class="courses reveal">${P.courses.map((c,i)=>`<article class="course"><span class="course-num micro">0${i+1}</span><h3>${e(t(c.title))}</h3><p>${e(t(c.desc))}</p></article>`).join('')}</div></div></div></div></section>`}
    function experience(){const x=l(),v=P.experience[0];return `<section class="experience" id="experience"><div class="shell">${head(4,x.experience,x.experienceLead)}<article class="experience-card reveal"><time class="micro">${e(v.period)}<br>${e(t(v.company))}</time><h3>${e(t(v.role))}</h3><div><p>${e(t(v.summary))}</p><ul>${v.bullets.map(b=>`<li>${e(t(b))}</li>`).join('')}</ul></div></article></div></section>`}
    function projectView(){const x=l(),body=projects.length?`<div class="project-grid reveal">${projects.map((p,i)=>`<a class="project" href="${e(p.href)}"><figure class="project-image"><img loading="lazy" src="${e(p.cover_image||'/index_page/img/blogs/1.jpg')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(p.localTitle())}"></figure><div class="project-copy"><div class="micro index">${String(i+1).padStart(2,'0')} / ${e(x.view)}</div><h3>${e(p.localTitle())}</h3><p>${e(p.localSummary()||'')}</p><div class="tags micro">${e(p.tech_stack||t(P.ui.tech_stack))}</div></div></a>`).join('')}</div>`:`<p class="loading">${e(t(P.ui.loading_projects))}</p>`;return `<section id="work"><div class="shell">${head(5,x.projects,x.projectsLead)}${body}</div></section>`}
    function articleView(){const x=l(),list=CJCData.filterArticles(articles,filter),body=!articles.length?`<p class="loading">${e(t(P.ui.loading_articles))}</p>`:!list.length?`<p class="loading">${e(t(P.ui.no_articles))}</p>`:`<div class="article-grid reveal">${list.map(a=>`<article class="article"><time class="micro">${e(a.category||'')} / ${e(a.dateText())}</time><img loading="lazy" src="${e(a.cover_image||'/index_page/img/blogs/1.jpg')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(a.localTitle())}"><h3>${e(a.localTitle())}</h3><p>${e(a.localSummary()||'')}</p><a class="more" href="${e(a.href)}">${e(x.read)} →</a></article>`).join('')}</div>`;return `<section id="journal"><div class="shell">${head(6,x.journal,x.journalLead)}<div class="filters" aria-label="Article categories">${P.articleFilters.map(f=>`<button type="button" data-filter="${e(f.key)}" class="${filter===f.key?'active':''}">${e(t(f.label))}</button>`).join('')}</div>${body}</div></section>`}
    function certificates(){const x=l();return `<section id="certificates"><div class="shell">${head(7,x.cert,x.certLead)}<div class="cert-grid reveal">${P.certificates.map(c=>`<article class="certificate"><img loading="lazy" src="${e(c.image)}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(t(c.title))}"><div><div class="micro index">${e(t(c.tag))} / ${e(t(c.date))}</div><h3>${e(t(c.title))}</h3><p>${e(t(c.desc))}</p></div></article>`).join('')}</div></div></section>`}
    function contact(){const x=l();return `<section id="contact" class="contact"><div class="shell">${head(8,x.contact,x.contactLead)}<div class="contact-grid"><div class="reveal"><p class="contact-lead">${e(t(P.ui.inbox_open))}</p><div class="contact-links"><a href="mailto:${e(P.contact.email)}"><span>Email</span><span>${e(P.contact.email)}</span></a><a href="${e(P.contact.phoneHref)}"><span>Phone</span><span>${e(P.contact.phone)}</span></a><a href="${e(P.contact.github)}" target="_blank" rel="noopener"><span>GitHub</span><span>@${e(P.contact.githubUser)}</span></a></div></div><form class="reveal" id="contact-form"><input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true"><label for="name">${e(x.name)}</label><input id="name" name="name" autocomplete="name" required><label for="email">${e(x.email)}</label><input id="email" type="email" name="email" autocomplete="email" required><label for="message">${e(x.message)}</label><textarea id="message" name="message" required></textarea><button class="btn" type="submit">${e(x.send)}</button><p id="status" role="status" aria-live="polite"></p></form></div></div></section>`}
    function render(){const x=l();document.documentElement.lang=CJCData.lang();document.title=`${t(P.name)} — Signal / Form`;document.getElementById('nav').innerHTML=x.nav.map(v=>`<a href="#${e(v[0])}">${e(v[1])}</a>`).join('');document.getElementById('content').innerHTML=hero()+about()+education()+skills()+experience()+projectView()+articleView()+certificates()+contact();document.getElementById('footer-note').textContent=t(P.ui.footer_desc);document.getElementById('footer-links').innerHTML=link(P.contact.github,'GitHub')+link('mailto:'+P.contact.email,'Email')+link(P.contact.wechatQrPage,'WeChat')+link('/admin.html',t(P.ui.admin_panel))+link(P.icpUrl,P.icp);wire();observe()}
    function wire(){document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;render()}));const f=document.getElementById('contact-form');if(f)f.addEventListener('submit',async ev=>{ev.preventDefault();const s=document.getElementById('status'),x=l(),btn=f.querySelector('button');btn.disabled=true;s.textContent=x.sending;try{const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});s.textContent=r.message||x.sent;f.reset()}catch(err){s.textContent=err.message||x.failed}finally{btn.disabled=false}})}
    let observer;function observe(){if(matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('.reveal').forEach(n=>n.classList.add('in'));return}if(observer)observer.disconnect();observer=new IntersectionObserver(es=>es.forEach(v=>{if(v.isIntersecting){v.target.classList.add('in');observer.unobserve(v.target)}}),{threshold:.08});document.querySelectorAll('.reveal').forEach(n=>observer.observe(n))}
    document.addEventListener('DOMContentLoaded',async()=>{CJCData.setTheme(window.THEME_ID);render();CJCData.mountSwitcher({accent:'#ee4d19'});CJCData.onLang(render);try{[projects,articles]=await Promise.all([CJCData.fetchProjects(),CJCData.fetchArticles()]);render()}catch(err){document.querySelectorAll('.loading').forEach(n=>{n.className='failure';n.textContent=l().failed})}});
  })();
  </script>
</body>
</html>

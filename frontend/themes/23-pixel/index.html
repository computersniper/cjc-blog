<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Pixel Quest</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#1a1c2c; --bg2:#242a52; --panel:#29366f; --panel2:#333c8a;
      --ink:#f4f4f8; --dim:#a9b0e0; --accent:#ffcc00; --accent2:#ff8f00;
      --hp:#ef3f4c; --exp:#41d16b; --mana:#33b0ff; --black:#0b0d1a; --line:#0b0d1a;
      --px: polygon(0 6px,3px 6px,3px 3px,6px 3px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px));
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--bg);
      background-image:
        linear-gradient(rgba(11,13,26,.5) 1px,transparent 1px),
        linear-gradient(90deg,rgba(11,13,26,.5) 1px,transparent 1px);
      background-size:24px 24px;
      color:var(--ink);
      font-family:'VT323','Silkscreen',monospace;
      font-size:21px;line-height:1.35;
      image-rendering:pixelated;
      -webkit-font-smoothing:none;
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block;image-rendering:pixelated}
    .wrap{max-width:1120px;margin:0 auto;padding:0 18px}
    h1,h2,h3,h4,.pix{font-family:'Press Start 2P',monospace;line-height:1.5;letter-spacing:.5px}
    .heading{font-size:clamp(11px,2.4vw,20px);color:var(--accent);text-shadow:3px 3px 0 var(--black)}

    /* ---- pixel panels ---- */
    .frame{background:var(--black);padding:4px;clip-path:var(--px);}
    .frame>.in{background:var(--panel);clip-path:var(--px);padding:20px;}
    .card-shadow{filter:drop-shadow(6px 6px 0 rgba(0,0,0,.55))}

    /* dialog box heading tag ▌ABOUT▐ */
    .dlg{display:inline-block;background:var(--accent);color:var(--black);
      font-family:'Press Start 2P',monospace;font-size:clamp(9px,1.8vw,13px);
      padding:9px 10px 8px;clip-path:var(--px);margin:0 0 20px}
    .dlg .bar{color:var(--accent2)}
    section{padding:44px 0}
    .sec-sub{color:var(--dim);margin:-8px 0 18px;font-size:20px}

    /* ---- buttons ---- */
    .btn{display:inline-flex;align-items:center;gap:8px;cursor:pointer;
      font-family:'Press Start 2P',monospace;font-size:11px;color:var(--black);
      background:var(--accent);border:0;padding:14px 16px;clip-path:var(--px);
      box-shadow:0 4px 0 var(--accent2);transition:transform .08s, box-shadow .08s;
      text-transform:uppercase}
    .btn:hover{transform:translateY(-1px)}
    .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent2)}
    .btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 var(--black)}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}

    /* ---- HUD ---- */
    .hud{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin:22px 0 6px}
    .stat{display:flex;align-items:center;gap:10px;min-width:180px}
    .stat .lbl{font-family:'Press Start 2P',monospace;font-size:10px;width:34px}
    .bar{flex:1;height:18px;background:var(--black);padding:3px;clip-path:var(--px)}
    .bar>i{display:block;height:100%;clip-path:var(--px);width:0;transition:width 1.1s ease}
    .bar.hp>i{background:var(--hp)}
    .bar.ex>i{background:var(--exp)}
    .bar.mp>i{background:var(--mana)}
    .coins{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--accent);display:inline-flex;align-items:center;gap:8px}
    .lvbadge{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--black);
      background:var(--accent);padding:10px 12px;clip-path:var(--px)}

    /* ---- hero ---- */
    .hero{padding-top:70px}
    .greet{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--exp)}
    .hero h1{margin:14px 0 0;font-size:clamp(20px,6vw,52px);color:var(--ink);text-shadow:4px 4px 0 var(--black)}
    .hero .head{color:var(--accent);font-size:clamp(20px,3.4vw,30px);margin-top:16px}
    .hero .role{color:var(--dim);margin-top:4px}
    .cta-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:26px}

    /* ---- about ---- */
    .about{display:grid;grid-template-columns:220px 1fr;gap:22px;align-items:start}
    .portrait{width:100%;border:4px solid var(--black);clip-path:var(--px);image-rendering:pixelated;filter:saturate(1.1) contrast(1.05)}
    .about p{margin:0 0 12px;font-size:21px;color:var(--ink)}
    .loc{color:var(--accent);font-family:'Silkscreen',monospace;font-size:14px}
    @media(max-width:640px){.about{grid-template-columns:1fr}}

    /* ---- education / experience quest ---- */
    .quest{display:flex;gap:14px;padding:16px;margin-bottom:14px;background:var(--bg2);
      border:3px solid var(--black);clip-path:var(--px)}
    .quest .mk{font-size:26px;line-height:1}
    .quest h3{margin:0 0 6px;font-size:12px;color:var(--accent)}
    .quest .when{font-family:'Silkscreen',monospace;font-size:13px;color:var(--exp)}
    .quest .sub{color:var(--dim);font-size:19px;margin-top:6px}
    .quest ul{margin:10px 0 0;padding-left:20px;color:var(--ink)}
    .quest li{margin-bottom:4px}
    .quest li::marker{content:"» ";color:var(--accent)}

    /* ---- inventory grid (skills) ---- */
    .inv{display:flex;flex-wrap:wrap;gap:10px}
    .chip{background:var(--panel2);color:var(--ink);padding:8px 12px 6px;clip-path:var(--px);
      border:2px solid var(--black);font-family:'Silkscreen',monospace;font-size:13px}
    .chip::before{content:"◆ ";color:var(--accent)}

    /* ---- skill tree (courses) ---- */
    .tree{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .node .frame{height:100%}
    .node .in{display:flex;flex-direction:column;gap:8px;height:100%}
    .node .ic{font-size:30px;line-height:1}
    .node h4{margin:0;font-size:11px;color:var(--accent)}
    .node p{margin:0;color:var(--dim);font-size:19px}
    @media(max-width:820px){.tree{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.tree{grid-template-columns:1fr}}

    /* ---- cards (projects/articles) ---- */
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .item{display:flex;flex-direction:column;height:100%;cursor:pointer}
    .item .in{display:flex;flex-direction:column;gap:8px;height:100%;padding:0}
    .item .cover{height:150px;overflow:hidden;border-bottom:4px solid var(--black);background:var(--bg2)}
    .item .cover img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
    .item .pad{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
    .item .tag{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--exp);display:flex;justify-content:space-between;gap:8px}
    .item h4{margin:0;font-size:11px;color:var(--accent);line-height:1.55}
    .item p{margin:0;color:var(--dim);font-size:19px;flex:1}
    .item .tech{color:var(--mana);font-family:'Silkscreen',monospace;font-size:13px}
    .item .more{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--ink)}
    .item:hover h4{color:#fff}
    .item:hover .in{background:var(--panel2)}
    @media(max-width:820px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.cards{grid-template-columns:1fr}}

    /* filters as pixel tabs */
    .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
    .filters button{font-family:'Silkscreen',monospace;font-size:12px;cursor:pointer;
      background:var(--bg2);color:var(--dim);border:2px solid var(--black);padding:8px 12px;clip-path:var(--px)}
    .filters button.active,.filters button:hover{background:var(--accent);color:var(--black)}

    /* certificates (trophies) */
    .trophies{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .trophy .in{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start}
    .trophy img{width:100%;border:3px solid var(--black);clip-path:var(--px);image-rendering:pixelated}
    .trophy .meta{font-family:'Silkscreen',monospace;font-size:12px;color:var(--exp);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
    .trophy h4{margin:8px 0 6px;font-size:11px;color:var(--accent)}
    .trophy p{margin:0;color:var(--dim);font-size:18px}
    @media(max-width:640px){.trophies{grid-template-columns:1fr}}

    /* contact */
    .contact{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
    .cinfo a{display:flex;justify-content:space-between;gap:12px;padding:12px;margin-bottom:10px;
      background:var(--bg2);border:2px solid var(--black);clip-path:var(--px)}
    .cinfo a span:first-child{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--exp)}
    .cinfo a span:last-child{color:var(--accent);font-family:'Silkscreen',monospace;font-size:13px}
    .cinfo a:hover{background:var(--panel2)}
    form input,form textarea{width:100%;background:var(--black);color:var(--ink);border:3px solid var(--panel2);
      font-family:'VT323',monospace;font-size:20px;padding:12px;margin-bottom:12px;clip-path:var(--px)}
    form input:focus,form textarea:focus{outline:none;border-color:var(--accent)}
    form textarea{min-height:120px;resize:vertical}
    #cf-status{font-family:'Silkscreen',monospace;font-size:14px;margin-top:10px}
    @media(max-width:720px){.contact{grid-template-columns:1fr}}

    /* footer */
    footer{border-top:4px solid var(--black);margin-top:30px;padding:28px 0 60px;background:var(--bg2)}
    .foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:center}
    .foot a{color:var(--dim);font-family:'Silkscreen',monospace;font-size:13px}
    .foot a:hover{color:var(--accent)}
    .muted{color:var(--dim);font-family:'Silkscreen',monospace;font-size:12px}
    .load-note{color:var(--dim);font-size:20px;grid-column:1/-1}

    :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important;transition:none!important}
      .bar>i{transition:none!important}
    }
  </style>
</head>
<body>
  <header class="hero"><div class="wrap">
    <div class="greet"><span id="greet"></span><span class="blink" aria-hidden="true">▮</span></div>
    <h1 id="name"></h1>
    <div class="head" id="headline"></div>
    <div class="role" id="role"></div>

    <div class="hud" aria-hidden="true">
      <div class="stat"><span class="lbl" style="color:var(--hp)">HP</span><div class="bar hp"><i data-w="88"></i></div></div>
      <div class="stat"><span class="lbl" style="color:var(--exp)">EXP</span><div class="bar ex"><i data-w="72"></i></div></div>
      <div class="stat"><span class="lbl" style="color:var(--mana)">MP</span><div class="bar mp"><i data-w="95"></i></div></div>
      <span class="coins">🪙 x999</span>
      <span class="lvbadge">★ LV.99</span>
    </div>

    <div class="cta-row">
      <a class="btn" id="cvBtn" href="#" download>▶ <span id="cvTxt"></span></a>
      <a class="btn ghost" id="ghBtn" target="_blank" rel="noopener">🎮 GitHub</a>
    </div>
  </div></header>

  <section id="about"><div class="wrap">
    <div class="dlg"><span class="bar">▌</span><span id="l-about"></span><span class="bar">▐</span></div>
    <div class="frame card-shadow"><div class="in">
      <div class="about">
        <img class="portrait" id="portrait" alt="Pixel portrait of Cai Jiechao" />
        <div id="about-text"></div>
      </div>
    </div></div>
  </div></section>

  <section id="education"><div class="wrap">
    <div class="dlg"><span class="bar">▌</span><span id="l-edu"></span><span class="bar">▐</span></div>
    <div id="edu-list"></div>
  </div></section>

  <section id="skills"><div class="wrap">
    <div class="dlg"><span class="bar">▌</span><span id="l-skills"></span><span class="bar">▐</span></div>
    <div class="sec-sub" id="skills-sub"></div>
    <div class="inv" id="skills-list"></div>
  </div></section>

  <section id="courses"><div class="wrap">
    <div class="dlg"><span class="bar">▌</span><span id="l-courses"></span><span class="bar">▐</span></div>
    <div class="sec-sub">🌳 Skill Tree — LV.99 unlocked</div>
    <div class="tree" id="courses-list"></div>
  </div></section>

  <section id="experience"><div class="wrap">
    <div class="dlg"><span class="bar">▌</span><span id="l-exp"></span><span class="bar">▐</span></div>
    <div id="exp-list"></div>
  </div></section>

  <section id="projects"><div class="wrap">
    <div class="dlg"><span class="bar">▌</span><span id="l-projects"></span><span class="bar">▐</span></div>
    <div class="sec-sub">🎒 Inventory — crafted builds</div>
    <div class="cards" id="projects-list"><div class="load-note" id="proj-load"></div></div>
  </div></section>

  <section id="articles"><div class="wrap">
    <div class="dlg"><span class="bar">▌</span><span id="l-articles"></span><span class="bar">▐</span></div>
    <div class="sec-sub">📜 Quest Log — writings &amp; notes</div>
    <div class="filters" id="filters"></div>
    <div class="cards" id="articles-list"><div class="load-note" id="art-load"></div></div>
  </div></section>

  <section id="certificates"><div class="wrap">
    <div class="dlg"><span class="bar">▌</span><span id="l-certs"></span><span class="bar">▐</span></div>
    <div class="sec-sub">🏆 Trophy Room</div>
    <div class="trophies" id="certs-list"></div>
  </div></section>

  <section id="contact"><div class="wrap">
    <div class="dlg"><span class="bar">▌</span><span id="l-contact"></span><span class="bar">▐</span></div>
    <div class="contact">
      <div class="cinfo" id="contact-info"></div>
      <div class="frame card-shadow"><div class="in">
        <form id="cf">
          <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
          <input type="text" name="name" id="cf-name" required>
          <input type="email" name="email" id="cf-email" required>
          <textarea name="message" id="cf-msg" required></textarea>
          <button type="submit" class="btn" id="cf-send"></button>
          <p id="cf-status"></p>
        </form>
      </div></div>
    </div>
  </div></section>

  <footer><div class="wrap">
    <div class="foot">
      <span class="pix" style="font-size:12px;color:var(--accent)">CaiJiechao</span>
      <div class="foot" id="foot-social" style="gap:18px"></div>
    </div>
    <div class="foot" style="margin-top:16px">
      <span class="muted" id="foot-desc"></span>
      <a class="muted" id="foot-icp" target="_blank" rel="noopener"></a>
    </div>
  </div></footer>

  <script>window.THEME_ID = "23-pixel";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";
    const ICONMAP = {'fa-sitemap':'🧠','fa-language':'💬','fa-cogs':'⚙️','fa-code':'👾','fa-linux':'🐧','fa-wifi':'📡'};

    function fillBars(){
      document.querySelectorAll('.bar>i').forEach(function(el){ el.style.width = (el.dataset.w||'80')+'%'; });
    }

    function renderStatic(){
      document.title = "Cai Jiechao — Pixel Quest";
      document.getElementById('greet').textContent = t(P.greeting)+' ';
      document.getElementById('name').textContent = t(P.name);
      document.getElementById('headline').textContent = t(P.headline);
      document.getElementById('role').textContent = t(P.role)+' · '+t(P.title);
      const cv = document.getElementById('cvBtn'); cv.href = t(P.cv);
      document.getElementById('cvTxt').textContent = t(P.ui.download_cv);
      document.getElementById('ghBtn').href = P.contact.github;

      const L = {'l-about':'about_me','l-edu':'education_bg','l-skills':'core_tech','l-courses':'core_courses',
        'l-exp':'internship_exp','l-projects':'latest_projects','l-articles':'latest_articles',
        'l-certs':'certificates','l-contact':'get_in_touch'};
      Object.keys(L).forEach(function(id){ document.getElementById(id).textContent = t(P.ui[L[id]]).toUpperCase(); });
      document.getElementById('skills-sub').textContent = t(P.ui.tech_stack)+' — equipped items';

      document.getElementById('portrait').src = P.avatar;
      document.getElementById('about-text').innerHTML =
        P.bio.map(function(b){return '<p>'+esc(t(b))+'</p>';}).join('') +
        '<p class="loc">📍 '+esc(t(P.location))+'</p>';

      document.getElementById('edu-list').innerHTML = P.education.map(function(e){
        return '<div class="quest"><div class="mk">🎓</div><div>'
          +'<h3>'+esc(t(e.school))+'</h3>'
          +'<div class="when">⏳ '+esc(e.period)+'</div>'
          +'<div class="sub">'+esc(t(e.degree))+' — '+esc(t(e.note))+'</div></div></div>';
      }).join('');

      document.getElementById('skills-list').innerHTML = P.skillTags.map(function(s){
        return '<span class="chip">'+esc(s)+'</span>'; }).join('');

      document.getElementById('courses-list').innerHTML = P.courses.map(function(c){
        var ic = ICONMAP[c.icon] || '⭐';
        return '<div class="node"><div class="frame card-shadow"><div class="in">'
          +'<div class="ic" aria-hidden="true">'+ic+'</div>'
          +'<h4>'+esc(t(c.title))+'</h4><p>'+esc(t(c.desc))+'</p></div></div></div>';
      }).join('');

      document.getElementById('exp-list').innerHTML = P.experience.map(function(x){
        return '<div class="quest"><div class="mk">⚔️</div><div>'
          +'<h3>'+esc(t(x.role))+' · '+esc(t(x.company))+'</h3>'
          +'<div class="when">⏳ '+esc(x.period)+'</div>'
          +'<div class="sub">'+esc(t(x.summary))+'</div>'
          +'<ul>'+x.bullets.map(function(b){return '<li>'+esc(t(b))+'</li>';}).join('')+'</ul>'
          +'</div></div>';
      }).join('');

      document.getElementById('certs-list').innerHTML = P.certificates.map(function(c){
        return '<div class="trophy"><div class="frame card-shadow"><div class="in">'
          +'<img src="'+esc(c.image)+'" alt="'+esc(t(c.title))+'" onerror="this.src=\'/index_page/img/blogs/1.jpg\'">'
          +'<div><div class="meta"><span>🏅 '+esc(t(c.tag))+'</span><span>'+esc(t(c.date))+'</span></div>'
          +'<h4>'+esc(t(c.title))+'</h4><p>'+esc(t(c.desc))+'</p></div></div></div></div>';
      }).join('');

      document.getElementById('contact-info').innerHTML = [
        ['Email', P.contact.email, 'mailto:'+P.contact.email],
        ['Phone', P.contact.phone, P.contact.phoneHref],
        ['GitHub', '@'+P.contact.githubUser, P.contact.github],
        ['WeChat', 'QR ▸', P.contact.wechatQrPage]
      ].map(function(r){ return '<a href="'+esc(r[2])+'"><span>'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></a>'; }).join('');
      document.getElementById('cf-name').placeholder = t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder = t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder = t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent = '▶ '+t(P.ui.send);

      document.getElementById('foot-social').innerHTML =
        '<a href="'+P.contact.github+'" target="_blank" rel="noopener">GitHub</a>'
        +'<a href="mailto:'+P.contact.email+'">Email</a>'
        +'<a href="'+P.contact.wechatQrPage+'">WeChat</a>'
        +'<a href="/admin.html">'+esc(t(P.ui.admin_panel))+'</a>';
      document.getElementById('foot-desc').textContent = '♥ '+t(P.ui.footer_desc);
      const icp = document.getElementById('foot-icp'); icp.textContent = P.icp; icp.href = P.icpUrl;

      document.getElementById('filters').innerHTML = P.articleFilters.map(function(f){
        return '<button data-k="'+esc(f.key)+'" class="'+(f.key===filterKey?'active':'')+'">'+esc(t(f.label))+'</button>';
      }).join('');
      document.querySelectorAll('#filters button').forEach(function(b){
        b.addEventListener('click', function(){ filterKey=b.dataset.k; renderStatic(); renderArticles(); });
      });
    }

    function renderProjects(){
      const box = document.getElementById('projects-list');
      if(!projects.length){ box.innerHTML = '<div class="load-note">'+esc(t(P.ui.no_projects))+'</div>'; return; }
      box.className='cards';
      box.innerHTML = projects.map(function(p){
        return '<a class="item" href="'+esc(p.href)+'"><div class="frame card-shadow" style="height:100%"><div class="in">'
          +'<div class="pad"><div class="tag"><span>'+esc(t(P.ui.tech_stack))+'</span><span>'+esc(p.dateText())+'</span></div>'
          +'<h4>'+esc(p.localTitle())+'</h4>'
          +'<p class="tech">🧩 '+esc(p.tech_stack||'')+'</p>'
          +'<p>'+esc(p.localSummary()||'')+'</p>'
          +'<span class="more">'+esc(t(P.ui.view_project))+' ▸</span></div></div></div></a>';
      }).join('');
    }

    function renderArticles(){
      const box = document.getElementById('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML = '<div class="load-note">'+esc(t(P.ui.no_articles))+'</div>'; return; }
      box.className='cards';
      box.innerHTML = list.map(function(a){
        return '<a class="item" href="'+esc(a.href)+'"><div class="frame card-shadow" style="height:100%"><div class="in">'
          +'<div class="cover"><img src="'+esc(a.cover_image||'')+'" onerror="this.src=\'/index_page/img/blogs/1.jpg\'" alt=""></div>'
          +'<div class="pad"><div class="tag"><span>'+esc(a.category||'')+'</span><span>'+esc(a.dateText())+'</span></div>'
          +'<h4>'+esc(a.localTitle())+'</h4>'
          +'<p>'+esc(a.localSummary()||'')+'</p>'
          +'<span class="more">'+esc(t(P.ui.read_more))+' ▸</span></div></div></div></a>';
      }).join('');
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML = '<div class="load-note">⚠ '+esc(t(P.ui.no_projects))+'</div>'; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-list').innerHTML = '<div class="load-note">⚠ Failed to load / 加载失败</div>'; }
    }

    document.getElementById('cf').addEventListener('submit', async function(e){
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      const payload = { name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color='var(--accent)'; s.textContent = t(P.ui.sending);
      try{ const r = await CJCData.sendContact(payload); s.style.color='var(--exp)'; s.textContent = '✔ '+(r.message||'Sent!'); f.reset(); }
      catch(err){ s.style.color='var(--hp)'; s.textContent = '✖ '+err.message; }
    });

    document.addEventListener('DOMContentLoaded', function(){
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:'#ffcc00' });
      CJCData.onLang(function(){ renderStatic(); renderProjects(); renderArticles(); });
      if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){ setTimeout(fillBars, 120); }
      else { fillBars(); }
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

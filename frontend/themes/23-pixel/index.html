<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cai Jiechao — Pixel Quest</title>
  <meta name="description" content="Cai Jiechao — a real playable 8-bit quest: walk a pixel hero named CJC, talk to NPCs, open doors and chests to discover the portfolio." />
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#1a1c2c; --bg2:#242a52; --panel:#29366f; --panel2:#333c8a;
      --ink:#f4f4f8; --dim:#a9b0e0; --accent:#ffcc00; --accent2:#ff8f00;
      --hp:#ef3f4c; --exp:#41d16b; --mana:#33b0ff; --black:#0b0d1a; --line:#0b0d1a;
      --px: polygon(0 6px,3px 6px,3px 3px,6px 3px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px));
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{
      background:var(--bg);
      background-image:linear-gradient(rgba(11,13,26,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(11,13,26,.5) 1px,transparent 1px);
      background-size:24px 24px;
      color:var(--ink);font-family:'VT323','Silkscreen',monospace;font-size:21px;line-height:1.35;
      image-rendering:pixelated;-webkit-font-smoothing:none;overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block;image-rendering:pixelated}
    h1,h2,h3,h4,.pix{font-family:'Press Start 2P',monospace;line-height:1.5;letter-spacing:.5px}
    .frame{background:var(--black);padding:4px;clip-path:var(--px)}
    .frame>.in{background:var(--panel);clip-path:var(--px);padding:20px}
    .card-shadow{filter:drop-shadow(6px 6px 0 rgba(0,0,0,.55))}
    .btn{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-family:'Press Start 2P',monospace;font-size:11px;
      color:var(--black);background:var(--accent);border:0;padding:14px 16px;clip-path:var(--px);
      box-shadow:0 4px 0 var(--accent2);transition:transform .08s,box-shadow .08s;text-transform:uppercase}
    .btn:hover{transform:translateY(-1px)}
    .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent2)}
    .btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 var(--black)}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}

    /* ================= GAME STAGE ================= */
    #stage{position:fixed;inset:0;overflow:hidden;background:#0f2a1a}
    #game{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;display:block}

    /* HUD (kept LEFT so switcher stays clear top-right) */
    .hud{position:absolute;top:12px;left:12px;z-index:20;display:flex;flex-direction:column;gap:8px;pointer-events:none}
    .hud .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .hearts{font-size:22px;letter-spacing:2px;filter:drop-shadow(2px 2px 0 var(--black))}
    .lvbadge{font-family:'Press Start 2P',monospace;font-size:10px;color:var(--black);background:var(--accent);padding:8px 9px;clip-path:var(--px)}
    .hud .pill{font-family:'Press Start 2P',monospace;font-size:10px;color:var(--ink);background:rgba(11,13,26,.72);
      padding:8px 10px;clip-path:var(--px);border:2px solid var(--black)}
    .hud .pill.coin{color:var(--accent)} .hud .pill.score{color:var(--mana)}

    /* interaction prompt */
    #prompt{position:absolute;z-index:18;transform:translate(-50%,-100%);pointer-events:none;display:none;
      font-family:'Press Start 2P',monospace;font-size:9px;color:var(--black);background:var(--accent);
      padding:7px 8px;clip-path:var(--px);white-space:nowrap;box-shadow:0 3px 0 var(--accent2)}
    #prompt.show{display:block;animation:bob .6s steps(2) infinite}
    @keyframes bob{50%{transform:translate(-50%,-115%)}}

    /* on-screen controls */
    .pad{position:absolute;bottom:16px;z-index:22;user-select:none;-webkit-user-select:none}
    .pad.dl{left:14px}
    .pad.dr{right:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
    .dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:4px}
    .dbtn{background:rgba(41,54,111,.86);border:3px solid var(--black);clip-path:var(--px);color:var(--ink);
      font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none}
    .dbtn:active,.dbtn.on{background:var(--accent);color:var(--black)}
    .dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}.dpad .c{grid-area:2/2;background:rgba(11,13,26,.5);border-color:transparent;pointer-events:none}
    .abtn{width:66px;height:66px;border-radius:50%;border:4px solid var(--black);background:radial-gradient(circle at 40% 35%,#ffdf5c,var(--accent2));
      color:var(--black);font-family:'Press Start 2P',monospace;font-size:14px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.5);touch-action:none}
    .abtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.5)}
    .bbtn{width:52px;height:52px;border-radius:50%;border:4px solid var(--black);background:radial-gradient(circle at 40% 35%,#7f8be0,#333c8a);
      color:var(--ink);font-family:'Press Start 2P',monospace;font-size:9px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.5);touch-action:none}
    .menu-btn{position:absolute;top:12px;right:12px;z-index:60;display:none}
    @media(max-width:1023px){ .menu-btn{display:inline-flex;top:auto;bottom:92px;right:16px} }
    /* hide touch pads on desktop hover-capable devices */
    @media(hover:hover) and (pointer:fine){ .pad{opacity:.35} .pad:hover{opacity:1} }

    /* ================= overlays (start / dialog / menu / boss) ================= */
    .ov{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:18px;
      background:rgba(6,7,18,.82)}
    .ov.show{display:flex}
    .ovbox{width:min(760px,100%);max-height:calc(100vh - 36px);display:flex;flex-direction:column;
      background:var(--black);padding:5px;clip-path:var(--px);box-shadow:0 10px 0 rgba(0,0,0,.5)}
    .ovbox>.in{background:var(--panel);clip-path:var(--px);padding:0;display:flex;flex-direction:column;min-height:0}
    .ov-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:4px solid var(--black);background:var(--bg2)}
    .ov-head .spk{font-size:26px;line-height:1}
    .ov-head h2{margin:0;font-size:13px;color:var(--accent);flex:1}
    .ov-head .x{cursor:pointer;background:var(--hp);color:#fff;border:0;font-family:'Press Start 2P',monospace;font-size:11px;padding:9px 11px;clip-path:var(--px)}
    .ov-body{padding:20px 20px 24px;overflow:auto;min-height:0}
    .ov-foot{padding:10px 18px;border-top:4px solid var(--black);background:var(--bg2);font-family:'Silkscreen',monospace;font-size:12px;color:var(--dim);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

    /* START screen */
    #start .ovbox>.in{padding:0}
    .title-wrap{text-align:center;padding:40px 22px 20px}
    .title-wrap .logo{font-family:'Press Start 2P',monospace;font-size:clamp(20px,7vw,44px);color:var(--accent);text-shadow:5px 5px 0 var(--black),0 0 0 #fff;line-height:1.4}
    .title-wrap .logo .q{color:var(--exp)}
    .title-wrap .sub{color:var(--dim);margin-top:14px;font-size:20px}
    .title-hero{margin:22px auto 6px;width:80px;height:80px}
    .press{margin:14px 0 4px}
    .press .btn{font-size:14px;padding:16px 22px;animation:pulse 1.1s steps(2) infinite}
    @keyframes pulse{50%{filter:brightness(1.35)}}
    .ctrls{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;margin:16px 0 4px;color:var(--dim);font-family:'Silkscreen',monospace;font-size:14px}
    .ctrls b{color:var(--ink)}
    .startlinks{padding:14px 18px 26px;text-align:center}
    .startlinks a{color:var(--mana);font-family:'Silkscreen',monospace;font-size:15px;cursor:pointer;border-bottom:2px dotted var(--mana)}

    /* MENU (pause) */
    .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:520px){.menu-grid{grid-template-columns:1fr}}
    .menu-grid button{display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;
      background:var(--bg2);border:3px solid var(--black);clip-path:var(--px);color:var(--ink);padding:12px 14px;font-family:'Silkscreen',monospace;font-size:16px}
    .menu-grid button:hover{background:var(--panel2);color:#fff}
    .menu-grid button .e{font-size:24px}
    .menu-grid button small{display:block;color:var(--dim);font-size:12px;font-family:'Press Start 2P',monospace;letter-spacing:0}

    /* ---- content styling (used in dialog + static) ---- */
    .sec-sub{color:var(--dim);margin:-2px 0 16px;font-size:18px}
    .cta-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px}
    .about{display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:start}
    .portrait{width:100%;border:4px solid var(--black);clip-path:var(--px);filter:saturate(1.1) contrast(1.05)}
    .about p{margin:0 0 12px;font-size:20px;color:var(--ink)}
    .loc{color:var(--accent);font-family:'Silkscreen',monospace;font-size:15px}
    @media(max-width:560px){.about{grid-template-columns:1fr}}
    .quest{display:flex;gap:14px;padding:16px;margin-bottom:14px;background:var(--bg2);border:3px solid var(--black);clip-path:var(--px)}
    .quest .mk{font-size:26px;line-height:1}
    .quest h3{margin:0 0 6px;font-size:12px;color:var(--accent)}
    .quest .when{font-family:'Silkscreen',monospace;font-size:13px;color:var(--exp)}
    .quest .sub{color:var(--dim);font-size:18px;margin-top:6px}
    .quest ul{margin:10px 0 0;padding-left:20px;color:var(--ink)}
    .quest li{margin-bottom:4px}.quest li::marker{content:"» ";color:var(--accent)}
    .inv{display:flex;flex-wrap:wrap;gap:10px}
    .chip{background:var(--panel2);color:var(--ink);padding:8px 12px 6px;clip-path:var(--px);border:2px solid var(--black);font-family:'Silkscreen',monospace;font-size:14px}
    .chip::before{content:"◆ ";color:var(--accent)}
    .tree{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    .node .frame{height:100%}.node .in{display:flex;flex-direction:column;gap:8px;height:100%}
    .node .ic{font-size:28px;line-height:1}.node h4{margin:0;font-size:11px;color:var(--accent)}.node p{margin:0;color:var(--dim);font-size:18px}
    @media(max-width:520px){.tree{grid-template-columns:1fr}}
    .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    .item{display:flex;flex-direction:column;height:100%;cursor:pointer}
    .item .in{display:flex;flex-direction:column;gap:8px;height:100%;padding:0}
    .item .cover{height:130px;overflow:hidden;border-bottom:4px solid var(--black);background:var(--bg2)}
    .item .cover img{width:100%;height:100%;object-fit:cover}
    .item .pad2{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
    .item .tag{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--exp);display:flex;justify-content:space-between;gap:8px}
    .item h4{margin:0;font-size:11px;color:var(--accent);line-height:1.55}
    .item p{margin:0;color:var(--dim);font-size:18px;flex:1}
    .item .tech{color:var(--mana);font-family:'Silkscreen',monospace;font-size:13px}
    .item .more{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--ink)}
    .item:hover h4{color:#fff}.item:hover .in{background:var(--panel2)}
    @media(max-width:560px){.cards{grid-template-columns:1fr}}
    .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
    .filters button{font-family:'Silkscreen',monospace;font-size:13px;cursor:pointer;background:var(--bg2);color:var(--dim);border:2px solid var(--black);padding:8px 12px;clip-path:var(--px)}
    .filters button.active,.filters button:hover{background:var(--accent);color:var(--black)}
    .trophies{display:grid;grid-template-columns:1fr;gap:14px}
    .trophy .in{display:grid;grid-template-columns:86px 1fr;gap:14px;align-items:start}
    .trophy img{width:100%;border:3px solid var(--black);clip-path:var(--px)}
    .trophy .meta{font-family:'Silkscreen',monospace;font-size:12px;color:var(--exp);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
    .trophy h4{margin:8px 0 6px;font-size:11px;color:var(--accent)}.trophy p{margin:0;color:var(--dim);font-size:17px}
    .contact{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
    .cinfo a{display:flex;justify-content:space-between;gap:12px;padding:12px;margin-bottom:10px;background:var(--bg2);border:2px solid var(--black);clip-path:var(--px)}
    .cinfo a span:first-child{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--exp)}
    .cinfo a span:last-child{color:var(--accent);font-family:'Silkscreen',monospace;font-size:13px}
    .cinfo a:hover{background:var(--panel2)}
    form label{display:block;font-family:'Silkscreen',monospace;font-size:14px;color:var(--exp);margin:2px 0 6px}
    form input,form textarea{width:100%;background:var(--black);color:var(--ink);border:3px solid var(--panel2);font-family:'VT323',monospace;font-size:20px;padding:11px;margin-bottom:12px;clip-path:var(--px)}
    form input:focus,form textarea:focus{outline:none;border-color:var(--accent)}
    form textarea{min-height:110px;resize:vertical}
    #cf-status{font-family:'Silkscreen',monospace;font-size:15px;margin-top:6px}
    .load-note{color:var(--dim);font-size:19px;grid-column:1/-1}
    .foot-mini{margin-top:20px;padding-top:14px;border-top:4px solid var(--black);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-family:'Silkscreen',monospace;font-size:13px;color:var(--dim)}
    .foot-mini a{color:var(--dim)}.foot-mini a:hover{color:var(--accent)}

    /* toast */
    #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);z-index:120;opacity:0;
      background:var(--black);color:var(--accent);font-family:'Press Start 2P',monospace;font-size:12px;padding:14px 18px;clip-path:var(--px);
      border:3px solid var(--accent);transition:transform .25s,opacity .25s;pointer-events:none;text-align:center;max-width:90vw}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* boss battle */
    .boss-arena{text-align:center}
    .boss-face{font-size:80px;line-height:1;margin:6px 0}
    .boss-face.hit{animation:shake .18s steps(2)}
    @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
    .boss-hpbar{height:22px;background:var(--black);padding:4px;clip-path:var(--px);margin:12px auto;max-width:420px}
    .boss-hpbar>i{display:block;height:100%;background:var(--hp);clip-path:var(--px);width:100%;transition:width .2s}
    .boss-log{font-family:'Silkscreen',monospace;font-size:16px;color:var(--dim);min-height:1.4em;margin:8px 0 16px}

    /* ================= STATIC / reduced-motion fallback ================= */
    #static-page{display:none;padding:80px 0 60px}
    body.static #stage,body.static .pad,body.static .menu-btn{display:none!important}
    body.static #static-page{display:block}
    .wrap{max-width:1080px;margin:0 auto;padding:0 18px}
    .dlg{display:inline-block;background:var(--accent);color:var(--black);font-family:'Press Start 2P',monospace;font-size:clamp(9px,1.8vw,13px);padding:9px 10px 8px;clip-path:var(--px);margin:0 0 18px}
    #static-page section{padding:32px 0;border-bottom:3px solid var(--black)}
    #static-page .tree{grid-template-columns:repeat(3,1fr)}
    #static-page .cards{grid-template-columns:repeat(3,1fr)}
    #static-page .trophies{grid-template-columns:1fr 1fr}
    #static-page .contact{grid-template-columns:1fr 1fr}
    @media(max-width:820px){#static-page .tree,#static-page .cards{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){#static-page .tree,#static-page .cards,#static-page .trophies,#static-page .contact{grid-template-columns:1fr}}
    .static-hint{background:var(--bg2);border:3px solid var(--black);clip-path:var(--px);padding:14px 16px;margin-bottom:8px;font-family:'Silkscreen',monospace;font-size:15px;color:var(--dim)}
    .static-hint a{color:var(--accent);cursor:pointer;border-bottom:2px dotted var(--accent)}

    :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
  </style>
</head>
<body>

  <!-- ============ GAME STAGE ============ -->
  <div id="stage">
    <canvas id="game"></canvas>

    <div class="hud" id="hud">
      <div class="row"><span class="hearts" id="hearts">❤❤❤</span><span class="lvbadge">★ LV.99</span></div>
      <div class="row"><span class="pill coin" id="coinPill">🪙 000</span><span class="pill score" id="scorePill">SCORE 0</span></div>
    </div>

    <div id="prompt"></div>

    <!-- touch controls -->
    <div class="pad dl">
      <div class="dpad">
        <div class="dbtn u" data-dir="up" aria-label="up">▲</div>
        <div class="dbtn l" data-dir="left" aria-label="left">◀</div>
        <div class="dbtn c"></div>
        <div class="dbtn r" data-dir="right" aria-label="right">▶</div>
        <div class="dbtn d" data-dir="down" aria-label="down">▼</div>
      </div>
    </div>
    <div class="pad dr">
      <button class="bbtn" id="btnB" type="button">MENU</button>
      <button class="abtn" id="btnA" type="button">A</button>
    </div>
    <button class="btn ghost menu-btn" id="menuBtn2" type="button">☰</button>
  </div>

  <!-- hidden source container for all section content -->
  <div id="codex" style="position:absolute;left:-99999px;top:0;width:720px" aria-hidden="true"></div>

  <!-- ============ START SCREEN ============ -->
  <div class="ov show" id="start">
    <div class="ovbox card-shadow"><div class="in">
      <div class="title-wrap">
        <div class="logo">CJC <span class="q">QUEST</span></div>
        <canvas class="title-hero" id="titleHero" width="20" height="20"></canvas>
        <div class="sub" id="start-sub"></div>
        <div class="press"><button class="btn" id="startBtn" type="button">▶ PRESS START</button></div>
        <div class="ctrls" id="start-ctrls"></div>
      </div>
      <div class="startlinks"><a id="readList"></a></div>
    </div></div>
  </div>

  <!-- ============ DIALOG (section content) ============ -->
  <div class="ov" id="dialog">
    <div class="ovbox card-shadow"><div class="in">
      <div class="ov-head"><span class="spk" id="dlg-emoji">🙂</span><h2 id="dlg-title"></h2><button class="x" id="dlg-x" type="button">✕</button></div>
      <div class="ov-body" id="dlg-body"></div>
      <div class="ov-foot"><span id="dlg-hint"></span><span id="dlg-menu-link" style="cursor:pointer;color:var(--mana)"></span></div>
    </div></div>
  </div>

  <!-- ============ MENU (pause / jump) ============ -->
  <div class="ov" id="menu">
    <div class="ovbox card-shadow"><div class="in">
      <div class="ov-head"><span class="spk">☰</span><h2 id="menu-title"></h2><button class="x" id="menu-x" type="button">✕</button></div>
      <div class="ov-body">
        <div class="menu-grid" id="menu-grid"></div>
      </div>
      <div class="ov-foot"><span id="menu-hint"></span><a id="menu-static" style="cursor:pointer;color:var(--mana)"></a></div>
    </div></div>
  </div>

  <!-- ============ BOSS ============ -->
  <div class="ov" id="boss">
    <div class="ovbox card-shadow"><div class="in">
      <div class="ov-head"><span class="spk">⚔️</span><h2 id="boss-title"></h2><button class="x" id="boss-x" type="button">✕</button></div>
      <div class="ov-body">
        <div class="boss-arena">
          <div class="boss-face" id="boss-face">👾</div>
          <div class="boss-hpbar"><i id="boss-hp"></i></div>
          <div class="boss-log" id="boss-log"></div>
          <button class="btn" id="boss-attack" type="button">⚔ ATTACK</button>
        </div>
      </div>
    </div></div>
  </div>

  <div id="toast"></div>

  <!-- ============ STATIC / FALLBACK PAGE ============ -->
  <main id="static-page"><div class="wrap">
    <div class="static-hint" id="static-hint"></div>
    <div id="static-slots"></div>
  </div></main>

  <script>window.THEME_ID = "23-pixel";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    "use strict";
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;

      {key:"about",   emoji:"🧙", head:S.h_about,   verb:S.talk},

    /* ===================================================================

          '<a href="'+esc(P.contact.github)+'" target="_blank" rel="noopener">GitHub</a>'+
          '<a href="mailto:'+esc(P.contact.email)+'">Email</a>'+
          '<a href="/admin.html">'+esc(t(P.ui.admin_panel))+'</a>'+
          '<span>♥ '+esc(t(P.ui.footer_desc))+'</span>'+
          '<a href="'+esc(P.icpUrl)+'" target="_blank" rel="noopener">'+esc(P.icp)+'</a></div>';
    }

    function renderContent(){
      nodes.about.innerHTML=bodyAbout();
      nodes.edu.innerHTML=bodyEdu();
      nodes.skills.innerHTML=bodySkills();
      nodes.courses.innerHTML=bodyCourses();
      nodes.exp.innerHTML=bodyExp();
      nodes.certs.innerHTML=bodyCerts();
      nodes.projects.innerHTML=bodyProjects();
      nodes.articles.innerHTML=bodyArticles();
      nodes.contact.innerHTML=bodyContact();
      bindContactForm();
      bindFilters();
      renderProjects(); renderArticles();
    }

    function bindContactForm(){
      const cf=document.getElementById("cf"); if(!cf) return;
      cf.addEventListener("submit",async e=>{
        e.preventDefault();
        const f=e.target, s=document.getElementById("cf-status");
        s.style.color="var(--accent)"; s.textContent=t(P.ui.sending);
        try{ const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});
          s.style.color="var(--exp)"; s.textContent="✔ "+(r.message||(ZH()?"已发送！":"Sent!")); f.reset(); }
        catch(err){ s.style.color="var(--hp)"; s.textContent="✖ "+err.message; }
      });
    }
    function bindFilters(){
      const box=document.getElementById("filters"); if(!box) return;
      box.innerHTML=P.articleFilters.map(f=>'<button type="button" data-k="'+esc(f.key)+'" class="'+(f.key===filterKey?'active':'')+'">'+esc(t(f.label))+'</button>').join('');
      box.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{ filterKey=b.dataset.k;
        box.querySelectorAll("button").forEach(x=>x.classList.toggle("active",x.dataset.k===filterKey)); renderArticles(); }));
    }
    function renderProjects(){
      const box=document.getElementById("projects-list"); if(!box) return;
      if(!projects.length){ box.innerHTML='<div class="load-note">'+esc(t(P.ui.no_projects))+'</div>'; return; }
      box.innerHTML=projects.map(p=>'<a class="item" href="'+esc(p.href)+'"><div class="frame card-shadow" style="height:100%"><div class="in">'+
        '<div class="pad2"><div class="tag"><span>'+esc(t(P.ui.tech_stack))+'</span><span>'+esc(p.dateText())+'</span></div>'+
        '<h4>'+esc(p.localTitle())+'</h4><p class="tech">🧩 '+esc(p.tech_stack||'')+'</p>'+
        '<p>'+esc(p.localSummary()||'')+'</p><span class="more">'+esc(t(P.ui.view_project))+' ▸</span></div></div></div></a>').join('');
    }
    function renderArticles(){
      const box=document.getElementById("articles-list"); if(!box) return;
      const list=CJCData.filterArticles(articles,filterKey);
      if(!list.length){ box.innerHTML='<div class="load-note">'+esc(t(P.ui.no_articles))+'</div>'; return; }
      box.innerHTML=list.map(a=>'<a class="item" href="'+esc(a.href)+'"><div class="frame card-shadow" style="height:100%"><div class="in">'+
        '<div class="cover"><img src="'+esc(a.cover_image||'')+'" onerror="this.src=\'/index_page/img/blogs/1.jpg\'" alt=""></div>'+
        '<div class="pad2"><div class="tag"><span>'+esc(a.category||'')+'</span><span>'+esc(a.dateText())+'</span></div>'+
        '<h4>'+esc(a.localTitle())+'</h4><p>'+esc(a.localSummary()||'')+'</p><span class="more">'+esc(t(P.ui.read_more))+' ▸</span></div></div></div></a>').join('');
    }
    async function loadDynamic(){
      try{ projects=await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ const b=document.getElementById("projects-list"); if(b) b.innerHTML='<div class="load-note">⚠ '+esc(t(P.ui.no_projects))+'</div>'; }
      try{ articles=await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ const b=document.getElementById("articles-list"); if(b) b.innerHTML='<div class="load-note">⚠ Failed to load / 加载失败</div>'; }
    }

    /* ===================================================================
       DIALOG / MENU / STATIC
    =================================================================== */
    let dlgOpen=false, currentSec=null;
    function openSection(key){
      const s=secByKey(key); if(!s) return;
      if(staticMode){ // just scroll to it
        const el=document.getElementById("slot-"+key); if(el) el.scrollIntoView({behavior:reduce?"auto":"smooth"}); return;
      }
      currentSec=key; dlgOpen=true;
      document.getElementById("dlg-emoji").textContent=s.emoji;
      document.getElementById("dlg-title").textContent=tl(s.head);
      const body=document.getElementById("dlg-body");
      body.innerHTML=""; body.appendChild(nodes[key]); // move real node in (keeps listeners)
      body.scrollTop=0;
      document.getElementById("dialog").classList.add("show");
      beep(600,0.05);
      setTimeout(()=>{ const x=document.getElementById("dlg-x"); if(x) x.focus(); },30);
    }
    function closeDialog(){
      if(!dlgOpen) return; dlgOpen=false;
      if(currentSec){ codex.appendChild(nodes[currentSec]); currentSec=null; } // move node back
      document.getElementById("dialog").classList.remove("show");
      beep(300,0.05);
    }
    function openMenu(){
      if(staticMode) return;
      document.getElementById("menu").classList.add("show");
      document.getElementById("menu-grid").querySelectorAll("button").forEach((b,i)=>{ if(i===0) setTimeout(()=>b.focus(),30); });
    }
    function closeMenu(){ document.getElementById("menu").classList.remove("show"); }

    function buildMenu(){
      document.getElementById("menu-title").textContent=tl(S.menu);
      document.getElementById("menu-hint").textContent=tl(S.menu_hint);
      document.getElementById("menu-static").textContent=tl(S.menu_static);
      const g=document.getElementById("menu-grid");
      g.innerHTML='<button data-go="resume" type="button"><span class="e">▶</span><span>'+tl(S.resume)+'</span></button>'+
        SECS.map(s=>'<button data-sec="'+s.key+'" type="button"><span class="e">'+s.emoji+'</span><span>'+esc(tl(s.head))+'<small>'+tl(s.verb)+'</small></span></button>').join('');
      g.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
        if(b.dataset.go==="resume"){ closeMenu(); return; }
        closeMenu(); openSection(b.dataset.sec);
      }));
    }

    function buildStatic(){
      const slots=document.getElementById("static-slots"); slots.innerHTML="";
      SECS.forEach(s=>{
        const sec=document.createElement("section"); sec.id="slot-"+s.key;
        const h=document.createElement("div"); h.className="dlg"; h.textContent="▌ "+s.emoji+" "+tl(s.head)+" ▐";
        sec.appendChild(h);
        sec.appendChild(nodes[s.key]); // move node into static slot
        slots.appendChild(sec);
      });
    }
    function enterStatic(){
      staticMode=true;
      // ensure dialog nodes returned
      if(dlgOpen && currentSec){ codex.appendChild(nodes[currentSec]); }
      dlgOpen=false; currentSec=null;
      document.getElementById("dialog").classList.remove("show");
      document.getElementById("menu").classList.remove("show");
      document.getElementById("start").classList.remove("show");
      document.body.classList.add("static");
      buildStatic();
      window.scrollTo(0,0);
      stopLoop();
    }
    function exitStatic(){
      staticMode=false; document.body.classList.remove("static");
      // move nodes back to codex so dialog can reuse
      SECS.forEach(s=>{ codex.appendChild(nodes[s.key]); });
      if(!started){ document.getElementById("start").classList.add("show"); }
      else startLoop();
    }
    function renderStaticHint(){
      const h=document.getElementById("static-hint");
      h.innerHTML=esc(tl(S.static_hint))+'<a id="static-back">'+esc(tl(S.static_back))+'</a>';
      document.getElementById("static-back").addEventListener("click",exitStatic);
    }

    /* ===================================================================
       GAME ENGINE (top-down canvas)
    =================================================================== */
    const cvs=document.getElementById("game"); const ctx=cvs.getContext("2d");
    const WORLD={w:760,h:560};
    let dpr=1, viewW=0, viewH=0, SCALE=3, camX=0, camY=0;
    const hero={x:380,y:300,dir:"down",frame:0,anim:0,speed:1.5,gold:false};
    const move={up:false,down:false,left:false,right:false};

    // interactables placed in the world
    const OBJ=[
      {sec:"about",   x:150,y:130,emoji:"🧙",kind:"npc"},
      {sec:"edu",     x:330,y:95, emoji:"🏫",kind:"bldg"},
      {sec:"skills",  x:560,y:120,emoji:"⚒️",kind:"bldg"},
      {sec:"courses", x:650,y:250,emoji:"🥋",kind:"bldg"},
      {sec:"exp",     x:620,y:420,emoji:"🗡️",kind:"npc"},
      {sec:"projects",x:430,y:460,emoji:"🚪",kind:"door"},
      {sec:"articles",x:210,y:450,emoji:"📚",kind:"bldg"},
      {sec:"certs",   x:330,y:250,emoji:"🏆",kind:"chest"},
      {sec:"contact", x:120,y:320,emoji:"📬",kind:"box"},
      {sec:"__boss",  x:560,y:300,emoji:"👾",kind:"boss"},
      {sec:"__warp",  x:60, y:60, emoji:"🟢",kind:"pipe"}
    ];
    const trees=[[90,220],[260,180],[480,220],[700,150],[700,430],[500,510],[160,500],[380,180],[300,400],[610,320],[40,420],[720,300]];
    let coinDots=[];
    function seedCoins(){
      coinDots=[];
      const pts=[[240,300],[300,150],[420,180],[480,300],[520,220],[380,320],[210,380],[300,320],[560,400],[640,340],[160,180],[460,400],[540,140],[350,430]];
      pts.forEach(p=>coinDots.push({x:p[0],y:p[1],got:false,bob:Math.random()*6}));
    }

    function resize(){
      const r=cvs.getBoundingClientRect(); dpr=Math.min(window.devicePixelRatio||1,2);
      viewW=r.width; viewH=r.height;
      cvs.width=Math.max(1,Math.round(viewW*dpr)); cvs.height=Math.max(1,Math.round(viewH*dpr));
      SCALE=Math.max(2, Math.min(4, Math.round(viewW/240)));
    }

    /* ---- input ---- */
    const keymap={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",KeyW:"up",KeyS:"down",KeyA:"left",KeyD:"right"};
    document.addEventListener("keydown",e=>{
      // konami
      handleKonami(e.code);
      if(keymap[e.code]){ if(!anyOverlay()){ move[keymap[e.code]]=true; e.preventDefault(); } }
      else if(e.code==="Space"||e.code==="Enter"){ if(dlgOpen||menuOpen()||bossOpen()||startOpen()){ /* let buttons handle */ } else { e.preventDefault(); activate(); } }
      else if(e.code==="KeyM"){ if(!staticMode){ e.preventDefault(); if(menuOpen()) closeMenu(); else if(!startOpen()) openMenu(); } }
      else if(e.code==="Escape"){ if(dlgOpen) closeDialog(); else if(menuOpen()) closeMenu(); else if(bossOpen()) closeBoss(); }
    });
    document.addEventListener("keyup",e=>{ if(keymap[e.code]) move[keymap[e.code]]=false; });
    function anyOverlay(){ return dlgOpen||menuOpen()||bossOpen()||startOpen()||staticMode; }
    const menuOpen=()=>document.getElementById("menu").classList.contains("show");
    const bossOpen=()=>document.getElementById("boss").classList.contains("show");
    const startOpen=()=>document.getElementById("start").classList.contains("show");

    // touch dpad
    document.querySelectorAll(".dbtn[data-dir]").forEach(b=>{
      const dir=b.dataset.dir;
      const on=e=>{ e.preventDefault(); move[dir]=true; b.classList.add("on"); };
      const off=e=>{ e.preventDefault(); move[dir]=false; b.classList.remove("on"); };
      b.addEventListener("touchstart",on,{passive:false}); b.addEventListener("touchend",off);
      b.addEventListener("touchcancel",off); b.addEventListener("mousedown",on); b.addEventListener("mouseup",off); b.addEventListener("mouseleave",off);
    });
    document.getElementById("btnA").addEventListener("click",()=>{ if(startOpen()) startGame(); else activate(); });
    document.getElementById("btnB").addEventListener("click",()=>{ if(menuOpen()) closeMenu(); else if(!startOpen()) openMenu(); });
    document.getElementById("menuBtn2").addEventListener("click",()=>{ if(menuOpen()) closeMenu(); else openMenu(); });

    /* ---- proximity + activate ---- */
    let nearest=null;
    function updateNearest(){
      let best=null,bd=1e9;
      for(const o of OBJ){ const d=Math.hypot(o.x-hero.x,o.y-hero.y); if(d<40 && d<bd){bd=d;best=o;} }
      nearest=best;
    }
    function activate(){
      if(!nearest) return;
      if(nearest.sec==="__boss"){ openBoss(); return; }
      if(nearest.sec==="__warp"){ doWarp(); return; }
      openSection(nearest.sec);
    }

    /* ---- warp / secret ---- */
    let warpUsed=false;
    function doWarp(){
      toast(tl(S.warpMsg)); beep(880,0.12); setTimeout(()=>beep(1100,0.12),120);
      hero.x=700; hero.y=500;
      if(!warpUsed){ warpUsed=true; addCoins(100); score+=200; updateHUD();
        // reveal a burst of coins near landing
        for(let i=0;i<6;i++) coinDots.push({x:660+Math.random()*80,y:460+Math.random()*80,got:false,bob:Math.random()*6}); }
    }

    /* ---- coins / hud ---- */
    function addCoins(n){ coins+=n; }
    function updateHUD(){
      document.getElementById("coinPill").textContent="🪙 "+String(coins).padStart(3,"0");
      document.getElementById("scorePill").textContent="SCORE "+score;
    }

    /* ---- boss battle ---- */
    let bossHP=100;
    function openBoss(){
      bossHP=100; document.getElementById("boss-hp").style.width="100%";
      document.getElementById("boss-title").textContent=tl(S.boss_title);
      document.getElementById("boss-log").textContent="";
      document.getElementById("boss").classList.add("show");
      document.getElementById("boss-attack").focus();
    }
    function closeBoss(){ document.getElementById("boss").classList.remove("show"); }
    document.getElementById("boss-attack").addEventListener("click",()=>{
      if(bossHP<=0) return;
      bossHP=Math.max(0, bossHP-(14+Math.floor(Math.random()*12)));
      document.getElementById("boss-hp").style.width=bossHP+"%";
      const face=document.getElementById("boss-face"); face.classList.remove("hit"); void face.offsetWidth; face.classList.add("hit");
      beep(200+Math.random()*200,0.05);
      const log=document.getElementById("boss-log");
      if(bossHP<=0){ face.textContent="💥"; log.style.color="var(--exp)"; log.textContent=tl(S.boss_win);
        score+=500; addCoins(50); updateHUD();
        setTimeout(()=>{ closeBoss(); face.textContent="👾"; },1800);
      } else { log.style.color="var(--dim)"; log.textContent=tl(S.boss_hits[Math.floor(Math.random()*S.boss_hits.length)]); }
    });

    /* ---- konami easter egg ---- */
    const KON=["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","KeyB","KeyA"];
    let konIdx=0;
    function handleKonami(code){
      konIdx = (code===KON[konIdx]) ? konIdx+1 : (code===KON[0]?1:0);
      if(konIdx===KON.length){ konIdx=0; godMode(); }
    }
    function godMode(){
      hero.gold=true; addCoins(999); score+=999; updateHUD();
      toast(tl(S.konami)); beep(1200,0.1); setTimeout(()=>beep(1500,0.1),110); setTimeout(()=>beep(1800,0.14),220);
      for(let i=0;i<24;i++) coinDots.push({x:hero.x+(Math.random()-.5)*160,y:hero.y+(Math.random()-.5)*120,got:false,bob:Math.random()*6});
    }

    /* ---- toast ---- */
    let toastT=null;
    function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show");
      clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),2600); }

    /* ---- tiny audio ---- */
    let actx=null;
    function beep(f,d){ if(reduce) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==="suspended") actx.resume();
      const o=actx.createOscillator(),g=actx.createGain(); o.type="square"; o.frequency.value=f;
      g.gain.value=0.03; o.connect(g); g.connect(actx.destination); o.start();
      g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d); o.stop(actx.currentTime+d+0.02);}catch(e){} }

    /* ---- update ---- */
    function update(){
      if(!anyOverlay()){
        let dx=(move.right?1:0)-(move.left?1:0), dy=(move.down?1:0)-(move.up?1:0);
        if(dx||dy){
          if(dx&&dy){ const k=0.7071; dx*=k; dy*=k; }
          hero.x=Math.max(14,Math.min(WORLD.w-14,hero.x+dx*hero.speed));
          hero.y=Math.max(18,Math.min(WORLD.h-10,hero.y+dy*hero.speed));
          hero.dir = Math.abs(dx)>Math.abs(dy) ? (dx>0?"right":"left") : (dy>0?"down":"up");
          hero.anim++; if(hero.anim%8===0) hero.frame^=1;
        } else hero.frame=0;
      }
      // coin pickup
      for(const c of coinDots){ if(!c.got && Math.hypot(c.x-hero.x,c.y-hero.y)<14){ c.got=true; addCoins(1); score+=50; updateHUD(); beep(950,0.05); } }
      updateNearest();
      // camera
      camX=Math.max(0,Math.min(WORLD.w-viewW/SCALE, hero.x-viewW/SCALE/2));
      camY=Math.max(0,Math.min(WORLD.h-viewH/SCALE, hero.y-viewH/SCALE/2));
      if(WORLD.w<viewW/SCALE) camX=(WORLD.w-viewW/SCALE)/2;
      if(WORLD.h<viewH/SCALE) camY=(WORLD.h-viewH/SCALE)/2;
    }

    /* ---- draw ---- */
    let tGlobal=0;
    function draw(){
      tGlobal++;
      ctx.setTransform(SCALE*dpr,0,0,SCALE*dpr,-camX*SCALE*dpr,-camY*SCALE*dpr);
      // ground
      drawGround();
      // trees (behind)
      ctx.font="18px serif"; ctx.textAlign="center"; ctx.textBaseline="alphabetic";
      trees.forEach(tp=>{ ctx.fillText("🌲",tp[0],tp[1]); });
      // coins
      coinDots.forEach(c=>{ if(c.got) return; const bob=reduce?0:Math.sin((tGlobal+c.bob*10)/12)*2; drawCoin(c.x,c.y-bob); });
      // objects (sorted by y for depth)
      const drawList=OBJ.slice().sort((a,b)=>a.y-b.y);
      for(const o of drawList){
        // shadow
        ctx.fillStyle="rgba(0,0,0,.28)"; ctx.beginPath(); ctx.ellipse(o.x,o.y+8,10,4,0,0,7); ctx.fill();
        ctx.font=(o.kind==="boss"?"26px":"22px")+" serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText(o.emoji,o.x,o.y);
        // label
        ctx.font="5px 'Press Start 2P',monospace"; ctx.fillStyle="#0b0d1a";
        const s=secByKey(o.sec); const lab = o.sec==="__boss"?"BOSS":o.sec==="__warp"?"?":(s?tl(s.head).split(" · ")[0]:"");
        if(lab && o.sec!=="__warp"){ const w=ctx.measureText(lab).width; ctx.fillStyle="rgba(255,204,0,.92)";
          ctx.fillRect(o.x-w/2-3,o.y-24,w+6,9); ctx.fillStyle="#0b0d1a"; ctx.fillText(lab,o.x,o.y-19); }
        // hero draws in loop below
      }
      // hero (draw with depth vs objects roughly by drawing after)
      drawHero(hero.x,hero.y);
      // prompt over nearest
      positionPrompt();
    }
    function drawGround(){
      // base grass
      const x0=Math.floor(camX/16)*16, y0=Math.floor(camY/16)*16;
      for(let x=Math.max(0,x0-16); x<Math.min(WORLD.w,camX+viewW/SCALE+16); x+=16){
        for(let y=Math.max(0,y0-16); y<Math.min(WORLD.h,camY+viewH/SCALE+16); y+=16){
          const alt=((x/16+y/16)&1); ctx.fillStyle=alt?"#2a5d3a":"#2f6b42"; ctx.fillRect(x,y,16,16);
        }
      }
      // a winding dirt path (simple cross paths)
      ctx.fillStyle="#7a5a3a";
      ctx.fillRect(0,290,WORLD.w,26); ctx.fillRect(360,0,26,WORLD.h);
      ctx.fillStyle="rgba(0,0,0,.10)"; ctx.fillRect(0,290,WORLD.w,4); ctx.fillRect(360,0,4,WORLD.h);
      // water pond corner
      ctx.fillStyle="#2a6db0"; ctx.fillRect(650,470,110,90);
      ctx.fillStyle="#3f88d4"; ctx.fillRect(658,478,94,74);
    }
    function drawCoin(x,y){
      ctx.fillStyle="#8a6d00"; ctx.fillRect(x-4,y-4,8,8);
      ctx.fillStyle="#ffcc00"; ctx.fillRect(x-3,y-4,6,8); ctx.fillRect(x-4,y-3,8,6);
      ctx.fillStyle="#fff3b0"; ctx.fillRect(x-2,y-3,2,5);
    }
    function drawHero(x,y){
      const px=Math.round(x),py=Math.round(y);
      const skin="#ffd7a8", cap=hero.gold?"#ffcc00":"#23c65a", shirt=hero.gold?"#ffe066":"#ffcc00", pants=hero.gold?"#caa100":"#3a4bd0", boot="#20233b";
      const step=hero.frame===1?1:0;
      // shadow
      ctx.fillStyle="rgba(0,0,0,.3)"; ctx.fillRect(px-6,py+9,12,3);
      // legs
      ctx.fillStyle=pants; ctx.fillRect(px-4,py+2,3,6); ctx.fillRect(px+1,py+2,3,6);
      ctx.fillStyle=boot; ctx.fillRect(px-4,py+8-step,3,2); ctx.fillRect(px+1,py+8+step,3,2);
      // body
      ctx.fillStyle=shirt; ctx.fillRect(px-5,py-4,10,7);
      // arms
      ctx.fillStyle=skin; ctx.fillRect(px-6,py-3,2,5); ctx.fillRect(px+4,py-3,2,5);
      // head
      ctx.fillStyle=skin; ctx.fillRect(px-4,py-11,8,7);
      // cap
      ctx.fillStyle=cap; ctx.fillRect(px-5,py-12,10,3); ctx.fillRect(px-5,py-12,3,4);
      // face by direction
      ctx.fillStyle="#20233b";
      if(hero.dir==="down"){ ctx.fillRect(px-3,py-8,2,2); ctx.fillRect(px+1,py-8,2,2); }
      else if(hero.dir==="up"){ /* back of head, no eyes */ ctx.fillStyle=cap; ctx.fillRect(px-4,py-9,8,3); }
      else if(hero.dir==="left"){ ctx.fillRect(px-4,py-8,2,2); }
      else { ctx.fillRect(px+2,py-8,2,2); }
      // name tag
      ctx.font="5px 'Press Start 2P',monospace"; ctx.textAlign="center"; ctx.textBaseline="alphabetic";
      const w=ctx.measureText("CJC").width; ctx.fillStyle=hero.gold?"rgba(255,220,80,.95)":"rgba(11,13,26,.8)";
      ctx.fillRect(px-w/2-2,py-22,w+4,8); ctx.fillStyle=hero.gold?"#0b0d1a":"#ffcc00"; ctx.fillText("CJC",px,py-16);
    }
    function positionPrompt(){
      const el=document.getElementById("prompt");
      if(!nearest || anyOverlay()){ el.classList.remove("show"); return; }
      const s=secByKey(nearest.sec);
      const verb = nearest.sec==="__boss"?tl(S.fight) : nearest.sec==="__warp"?tl(S.warp) : (s?tl(s.verb):"");
      el.textContent="▲ "+verb+" [A]";
      // world -> screen
      const sx=(nearest.x-camX)*SCALE, sy=(nearest.y-24-camY)*SCALE;
      el.style.left=sx+"px"; el.style.top=sy+"px"; el.classList.add("show");
    }

    /* ---- loop ---- */
    let raf=null,running=false;
    function frame(){ if(!running) return; update(); draw(); raf=requestAnimationFrame(frame); }
    function startLoop(){ if(running||staticMode) return; running=true; raf=requestAnimationFrame(frame); }
    function stopLoop(){ running=false; if(raf) cancelAnimationFrame(raf); }

    /* ---- start ---- */
    function startGame(){
      if(started){ document.getElementById("start").classList.remove("show"); startLoop(); return; }
      started=true;
      document.getElementById("start").classList.remove("show");
      beep(660,0.08); setTimeout(()=>beep(880,0.1),90);
      startLoop();
    }

    function drawTitleHero(){
      const c=document.getElementById("titleHero"),x=c.getContext("2d"); x.imageSmoothingEnabled=false;
      x.clearRect(0,0,20,20);
      x.fillStyle="#ffd7a8"; x.fillRect(6,3,8,7);
      x.fillStyle="#23c65a"; x.fillRect(5,2,10,3);
      x.fillStyle="#20233b"; x.fillRect(7,6,2,2); x.fillRect(11,6,2,2);
      x.fillStyle="#ffcc00"; x.fillRect(5,10,10,6);
      x.fillStyle="#3a4bd0"; x.fillRect(6,16,3,3); x.fillRect(11,16,3,3);
    }

    /* ===================================================================
       Text (bilingual) for chrome
    =================================================================== */
    function renderChrome(){
      document.title=(ZH()?"蔡杰超":"Cai Jiechao")+" — Pixel Quest";
      document.getElementById("start-sub").textContent=tl(S.start_sub);
      document.getElementById("startBtn").textContent=tl(S.press);
      document.getElementById("start-ctrls").innerHTML=tl(S.ctrls);
      document.getElementById("readList").textContent=tl(S.readList);
      document.getElementById("dlg-hint").textContent=tl(S.dlg_hint);
      document.getElementById("dlg-menu-link").textContent=tl(S.dlg_menu);
      buildMenu();
      renderStaticHint();
      updateHUD();
    }

    /* ===================================================================
       BOOT
    =================================================================== */
    function bindOverlayButtons(){
      document.getElementById("startBtn").addEventListener("click",startGame);
      document.getElementById("readList").addEventListener("click",enterStatic);
      document.getElementById("dlg-x").addEventListener("click",closeDialog);
      document.getElementById("dlg-menu-link").addEventListener("click",()=>{ closeDialog(); openMenu(); });
      document.getElementById("dialog").addEventListener("click",e=>{ if(e.target.id==="dialog") closeDialog(); });
      document.getElementById("menu-x").addEventListener("click",closeMenu);
      document.getElementById("menu-static").addEventListener("click",enterStatic);
      document.getElementById("menu").addEventListener("click",e=>{ if(e.target.id==="menu") closeMenu(); });
      document.getElementById("boss-x").addEventListener("click",closeBoss);
    }

    document.addEventListener("DOMContentLoaded",()=>{
      CJCData.setTheme(window.THEME_ID);
      makeSectionNodes();
      renderContent();
      renderChrome();
      drawTitleHero();
      resize(); seedCoins(); updateHUD();
      window.addEventListener("resize",()=>{ resize(); });
      bindOverlayButtons();
      CJCData.mountSwitcher({accent:"#ffcc00"});
      CJCData.onLang(()=>{ renderContent(); renderChrome(); if(staticMode) buildStatic(); });
      loadDynamic();

      if(reduce){ enterStatic(); }  // reduced-motion => readable static list, no game
    });
  })();
  </script>
</body>
</html>

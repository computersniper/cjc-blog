<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Cockpit</title>
  <meta name="description" content="Cai Jiechao — an interactive spacecraft flight deck you operate: boot sequence, MFD screens, toggle switches, gauges & a nav scope." />
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{
      --void:#04070a; --panel:#0b0f12; --panel2:#12181f; --panel3:#181f27;
      --steel:#1b232c; --edge:#03060a; --deck:#090d11;
      --accent:#37e0c8; --accent-dim:#1f6f65; --accent-deep:#04120f;
      --amber:#ffb347; --green:#4dff9b; --red:#ff5966; --blue:#5fb0ff; --violet:#b78bff;
      --ink:#cfe0ea; --ink-dim:#7f93a1; --ink-faint:#556673;
      --line:rgba(140,170,190,.14);
      --rivet:#3a4652;
      --glow:0 0 8px rgba(55,224,200,.55);
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{
      color:var(--ink);
      font-family:'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace;
      line-height:1.55;font-size:15px;-webkit-font-smoothing:antialiased;
      background:
        radial-gradient(1200px 700px at 50% -20%, #12222c, transparent 60%),
        repeating-linear-gradient(90deg, rgba(255,255,255,.010) 0 3px, rgba(0,0,0,.03) 3px 6px),
        linear-gradient(165deg,#0a0e12,#04070a);
      overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    h1,h2,h3,h4{font-family:'Chakra Petch',sans-serif;margin:0;letter-spacing:.01em}
    ::selection{background:var(--accent);color:#04120f}
    button{font-family:inherit}

    /* ============ Canopy frame ============ */
    .canopy{position:fixed;inset:0;pointer-events:none;z-index:40;
      box-shadow:inset 0 0 200px rgba(0,0,0,.72), inset 0 0 0 1px rgba(55,224,200,.06);}
    .canopy .c-brk{position:absolute;width:26px;height:26px;border:2px solid rgba(55,224,200,.26)}
    .canopy .tl{top:8px;left:8px;border-right:0;border-bottom:0}
    .canopy .tr{top:8px;right:8px;border-left:0;border-bottom:0}
    .canopy .bl{bottom:8px;left:8px;border-right:0;border-top:0}
    .canopy .br{bottom:8px;right:8px;border-left:0;border-top:0}

    /* ============ LEDs ============ */
    .led{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:inline-block;
      background:var(--red);box-shadow:0 0 7px var(--red), inset 0 0 2px rgba(255,255,255,.7)}
    .led.green{background:var(--green);box-shadow:0 0 7px var(--green),inset 0 0 2px rgba(255,255,255,.7)}
    .led.amber{background:var(--amber);box-shadow:0 0 7px var(--amber),inset 0 0 2px rgba(255,255,255,.7)}
    .led.blue{background:var(--blue);box-shadow:0 0 7px var(--blue),inset 0 0 2px rgba(255,255,255,.7)}
    .led.off{background:#243039;box-shadow:inset 0 0 2px rgba(0,0,0,.6)}
    .led.blink{animation:blink 1.6s steps(1,end) infinite}
    .led.blink.slow{animation-duration:2.6s}
    @keyframes blink{0%,58%{opacity:1}60%,100%{opacity:.25}}

    /* ============ Boot overlay ============ */
    .boot{position:fixed;inset:0;z-index:200;background:radial-gradient(120% 90% at 50% 40%,#04150f,#020606 70%);
      display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .6s ease;}
    .boot.gone{opacity:0;pointer-events:none}
    .boot-inner{width:min(680px,100%);border:1px solid #0c2b26;border-radius:12px;padding:26px 24px 22px;
      background:linear-gradient(160deg,#07110e,#040b09);box-shadow:inset 0 0 60px rgba(55,224,200,.08),0 30px 80px rgba(0,0,0,.7)}
    .boot-inner::selection{background:var(--accent)}
    .boot h1{font-size:clamp(20px,4vw,30px);color:#eafffb;letter-spacing:.04em;text-shadow:0 0 18px rgba(55,224,200,.4)}
    .boot .b-sub{color:var(--accent);font-size:12px;letter-spacing:.22em;text-transform:uppercase;margin-top:6px}
    .boot .b-log{margin:20px 0 16px;font-size:13px;min-height:9.5em;color:var(--ink)}
    .boot .b-log div{opacity:0;animation:bootline .01s forwards}
    .boot .b-log .ok{color:var(--green)}.boot .b-log .amb{color:var(--amber)}
    @keyframes bootline{to{opacity:1}}
    .boot .b-bar{height:8px;border-radius:6px;background:#04120f;border:1px solid #0c2b26;overflow:hidden}
    .boot .b-bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent-dim),var(--accent));box-shadow:0 0 12px rgba(55,224,200,.6);transition:width .3s linear}
    .boot .b-skip{margin-top:16px;font-size:11px;letter-spacing:.16em;color:var(--ink-faint);text-transform:uppercase;cursor:pointer;
      background:none;border:1px solid var(--line);padding:8px 14px;border-radius:6px}
    .boot .b-skip:hover{color:var(--accent);border-color:var(--accent-dim)}

    /* ============ Deck grid ============ */
    .deck{position:relative;z-index:10;min-height:100vh;display:grid;gap:10px;padding:12px;
      grid-template-columns:200px minmax(0,1fr) 220px;
      grid-template-rows:auto minmax(0,1fr) auto;
      grid-template-areas:"top top top" "left mfd right" "bottom bottom bottom";}
    .deck.mode-static{min-height:auto;display:block;padding:14px}

    /* panel surface mixin */
    .surf{border-radius:10px;border:1px solid var(--edge);position:relative;
      background:
        radial-gradient(circle at 13px 13px, var(--rivet) 0 1.5px, #0d1319 1.6px 2.9px, transparent 3.2px),
        radial-gradient(circle at calc(100% - 13px) 13px, var(--rivet) 0 1.5px, #0d1319 1.6px 2.9px, transparent 3.2px),
        radial-gradient(circle at 13px calc(100% - 13px), var(--rivet) 0 1.5px, #0d1319 1.6px 2.9px, transparent 3.2px),
        radial-gradient(circle at calc(100% - 13px) calc(100% - 13px), var(--rivet) 0 1.5px, #0d1319 1.6px 2.9px, transparent 3.2px),
        repeating-linear-gradient(92deg, rgba(255,255,255,.014) 0 2px, rgba(0,0,0,.03) 2px 4px),
        linear-gradient(158deg,#141b23,#0b1015);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 8px 22px rgba(0,0,0,.45);}

    /* ---- Top bar ---- */
    .topbar{grid-area:top;display:flex;align-items:center;gap:14px;padding:9px 16px;padding-right:210px;
      min-height:52px;overflow:hidden}
    .callsign{font-family:'Chakra Petch';font-weight:700;font-size:18px;letter-spacing:.06em;white-space:nowrap}
    .callsign b{color:var(--accent);text-shadow:var(--glow)}
    .master{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.16em;color:var(--ink-dim);white-space:nowrap}
    .tele-strip{margin-left:auto;display:flex;gap:8px 16px;flex-wrap:wrap;font-size:10.5px;letter-spacing:.12em;color:var(--accent);opacity:.85;justify-content:flex-end}
    .tele-strip span{white-space:nowrap}
    @media(max-width:1080px){.tele-strip{display:none}.topbar{padding-right:200px}}

    /* ---- Left rail : switches ---- */
    .rail{grid-area:left;display:flex;flex-direction:column;gap:10px;overflow:auto}
    .rail-r{grid-area:right;display:flex;flex-direction:column;gap:10px;overflow:auto}
    .rail-hd{font-family:'Chakra Petch';font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
      color:var(--accent-dim);padding:10px 12px 8px;border-bottom:1px dashed rgba(140,170,190,.16)}
    .swpanel{padding:8px 10px 12px;flex:0 0 auto}
    .tsw{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid rgba(140,170,190,.07);cursor:pointer;
      -webkit-tap-highlight-color:transparent}
    .tsw:last-child{border-bottom:0}
    .toggle{width:26px;height:40px;border-radius:7px;position:relative;flex:0 0 auto;
      background:linear-gradient(180deg,#080c10,#03060a);border:1px solid #03060a;
      box-shadow:inset 0 2px 5px rgba(0,0,0,.8), inset 0 -1px 0 rgba(255,255,255,.05)}
    .toggle .lever{position:absolute;left:50%;transform:translateX(-50%);top:22px;width:14px;height:18px;border-radius:4px;
      background:linear-gradient(180deg,#c4ced4,#8593a0);transition:top .12s ease, background .12s;
      box-shadow:0 3px 5px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.9), inset 0 -3px 4px rgba(0,0,0,.35)}
    .tsw.on .toggle .lever{top:4px;background:linear-gradient(180deg,#eafffb,#9fe9dd)}
    .tsw .sw-txt{flex:1;min-width:0}
    .tsw .sw-name{font-family:'Chakra Petch';font-size:11.5px;font-weight:600;color:var(--ink);line-height:1.2}
    .tsw .sw-state{font-size:9.5px;letter-spacing:.12em;color:var(--ink-faint);text-transform:uppercase}
    .tsw.on .sw-state{color:var(--green)}
    .tsw.warn.on .sw-state{color:var(--amber)}
    .tsw .led{margin-left:auto}
    /* guarded switch (hyperdrive) */
    .tsw.guarded .guard{position:absolute}
    .swpanel.hyper{position:relative}
    .hyper-guard{position:absolute;inset:0;border-radius:8px;background:repeating-linear-gradient(45deg,#3a2a08 0 10px,#140d02 10px 20px);
      border:1px solid #5a4310;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;z-index:3;
      font-family:'Chakra Petch';font-size:10px;letter-spacing:.14em;color:var(--amber);transition:transform .35s ease, opacity .35s;transform-origin:top}
    .hyper-guard.lifted{transform:rotateX(-115deg);opacity:0;pointer-events:none}

    /* rotary knob */
    .knobrow{display:flex;align-items:center;gap:12px;padding:12px 10px}
    .knob{width:46px;height:46px;border-radius:50%;flex:0 0 auto;position:relative;cursor:pointer;
      background:radial-gradient(circle at 50% 32%,#2f3944,#0b1016 80%);
      box-shadow:inset 0 1px 1px rgba(255,255,255,.14), inset 0 -3px 6px rgba(0,0,0,.7), 0 3px 6px rgba(0,0,0,.5);
      transition:transform .2s cubic-bezier(.2,.8,.2,1)}
    .knob::after{content:"";position:absolute;top:4px;left:50%;width:2px;height:12px;border-radius:2px;background:var(--accent);
      transform:translateX(-50%);box-shadow:var(--glow)}
    .knob-info{font-size:10px;letter-spacing:.1em;color:var(--ink-dim);line-height:1.4}
    .knob-info b{color:var(--accent);font-family:'Chakra Petch'}

    /* ---- Right rail : scope + gauges ---- */
    .scope-wrap{padding:12px}
    .scope{position:relative;width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;
      background:radial-gradient(circle at 50% 50%, #063029, #04150f 60%, #020a08);
      border:1px solid #0c2b26;box-shadow:inset 0 0 40px rgba(55,224,200,.1)}
    .scope svg{position:absolute;inset:0;width:100%;height:100%}
    .scope .ring{fill:none;stroke:rgba(55,224,200,.28);stroke-width:.6}
    .scope .cross{stroke:rgba(55,224,200,.28);stroke-width:.6}
    .scope .sweep{transform-origin:50px 50px;animation:scan 4s linear infinite}
    @keyframes scan{to{transform:rotate(360deg)}}
    .scope .blip{fill:var(--green);filter:drop-shadow(0 0 3px var(--green))}
    .scope .blip.alien{fill:var(--violet);filter:drop-shadow(0 0 4px var(--violet));cursor:pointer}
    .scope-cap{font-size:9.5px;letter-spacing:.14em;color:var(--ink-faint);text-align:center;margin-top:8px;text-transform:uppercase}
    .minigauges{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 12px 14px}
    .mg{border:1px solid var(--line);border-radius:7px;padding:8px 4px 6px;text-align:center;background:radial-gradient(120% 120% at 50% 0,#10171e,#0a0e13)}
    .mg svg{width:100%;height:auto}
    .mg .g-lab{font-size:9px;letter-spacing:.1em;color:var(--ink-dim);margin-top:2px;text-transform:uppercase}
    .scanbtn{margin:0 12px 12px;width:calc(100% - 24px)}

    .g-arc{fill:none;stroke:rgba(140,170,190,.16);stroke-width:5;stroke-linecap:round}
    .g-fill{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;
      filter:drop-shadow(0 0 3px rgba(55,224,200,.6));transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
    .spun .g-fill{stroke-dashoffset:var(--off)}
    .g-tick{stroke:rgba(140,170,190,.32);stroke-width:1.2}
    .g-val{font-family:'Chakra Petch';font-size:14px;font-weight:700;fill:var(--accent)}

    /* ---- MFD (center screen) ---- */
    .mfd{grid-area:mfd;position:relative;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;
      border:1px solid #0c2b26;background:#020a08;min-height:60vh;
      box-shadow:inset 0 0 0 2px rgba(55,224,200,.06), 0 0 0 4px #0a0f14, 0 24px 60px rgba(0,0,0,.6)}
    .mfd canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
    .mfd::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
      background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 2px, transparent 2px 4px);opacity:.4}
    .mfd-top{position:relative;z-index:4;display:flex;align-items:center;gap:12px;padding:10px 16px;
      border-bottom:1px solid #0c2b26;background:linear-gradient(180deg,rgba(6,20,16,.9),rgba(3,12,9,.6))}
    .mfd-code{font-size:10.5px;letter-spacing:.16em;color:var(--accent-dim)}
    .mfd-title{font-family:'Chakra Petch';font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#eafffb;text-shadow:0 0 12px rgba(55,224,200,.35)}
    .mfd-top .rulers{margin-left:auto;display:flex;gap:8px;align-items:center}
    .mfd-scroll{position:relative;z-index:4;flex:1;overflow:auto;padding:22px clamp(16px,3vw,34px) 30px;scrollbar-width:thin}
    .mfd-scroll::-webkit-scrollbar{width:9px}
    .mfd-scroll::-webkit-scrollbar-thumb{background:#12312b;border-radius:6px}
    .screen{display:none;animation:scr .35s ease}
    .screen.active{display:block}
    .deck.mode-static .screen{display:block;margin-bottom:26px;padding-bottom:26px;border-bottom:1px dashed rgba(140,170,190,.14)}
    @keyframes scr{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .mfd.flicker{animation:flick .28s}
    @keyframes flick{0%{filter:brightness(1.6) saturate(.4)}30%{filter:brightness(.5)}60%{filter:brightness(1.3)}100%{filter:none}}

    /* screen internal styling */
    .scr-lead{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);opacity:.85;margin-bottom:6px}
    .greet{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);opacity:.85}
    .hero-name{font-size:clamp(34px,7vw,74px);line-height:.94;font-weight:700;margin:10px 0 0;color:#eafffb;letter-spacing:-.01em;text-shadow:0 0 20px rgba(55,224,200,.4)}
    .hero-head{font-size:clamp(16px,2.6vw,24px);color:var(--accent);margin-top:16px;font-weight:500;max-width:26ch;text-shadow:0 0 10px rgba(55,224,200,.25)}
    .hero-sub{margin-top:12px;color:#a9d8ce;font-size:14px;max-width:52ch}
    .cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
    .hint{margin-top:26px;font-size:11.5px;color:var(--ink-dim);letter-spacing:.04em;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
    .hint b{color:var(--accent)}

    .btn{display:inline-flex;align-items:center;gap:9px;font-family:'Chakra Petch';font-weight:600;text-transform:uppercase;
      letter-spacing:.1em;font-size:12.5px;cursor:pointer;padding:12px 18px;border-radius:6px;transition:.16s;border:1px solid var(--accent-dim);background:rgba(8,16,20,.5);color:var(--ink)}
    .btn.primary{background:linear-gradient(180deg,#0c3a33,#072320);color:var(--accent);border-color:var(--accent);
      box-shadow:0 0 0 1px rgba(55,224,200,.15),0 0 16px rgba(55,224,200,.2),inset 0 1px 0 rgba(255,255,255,.08)}
    .btn.primary:hover{background:var(--accent);color:#04120f;box-shadow:0 0 22px rgba(55,224,200,.5)}
    .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
    .btn .dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}

    .g-about{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}
    @media(max-width:640px){.g-about{grid-template-columns:1fr}}
    .cam{position:relative;border-radius:8px;overflow:hidden;border:1px solid #0c2b26;background:#04120f;box-shadow:inset 0 0 0 3px rgba(0,0,0,.5)}
    .cam img{width:100%;height:100%;min-height:220px;object-fit:cover;filter:contrast(1.05) saturate(1.05)}
    .cam::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px);opacity:.4}
    .cam .cam-tag{position:absolute;top:8px;left:8px;font-size:10px;letter-spacing:.14em;color:var(--accent);background:rgba(4,18,15,.75);padding:3px 7px;border-radius:3px;border:1px solid rgba(55,224,200,.3)}
    .about-txt p{margin:0 0 12px;color:var(--ink);max-width:64ch}
    .coord{display:inline-flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;letter-spacing:.1em;color:var(--accent);
      background:var(--accent-deep);border:1px solid #0c2b26;padding:6px 11px;border-radius:4px;box-shadow:inset 0 0 10px rgba(55,224,200,.12)}

    .block-hd{display:flex;align-items:center;gap:12px;margin:26px 0 14px}
    .block-hd .bar{height:1px;flex:1;background:linear-gradient(90deg,var(--accent-dim),transparent)}
    .block-hd h3{font-family:'Chakra Petch';font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
    .block-hd .code{font-size:10px;letter-spacing:.14em;color:var(--ink-faint)}

    .readout{font-family:'IBM Plex Mono';font-size:12px;letter-spacing:.08em;color:var(--accent);background:var(--accent-deep);
      border:1px solid #0c2b26;padding:4px 9px;border-radius:3px;white-space:nowrap;box-shadow:inset 0 0 8px rgba(55,224,200,.15)}
    .readout.amber{color:var(--amber);border-color:#3a2a08;background:#140d02;box-shadow:inset 0 0 8px rgba(255,179,71,.15)}

    .waypoints{display:flex;flex-direction:column;gap:10px}
    .wp{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:13px;border:1px solid var(--line);border-radius:7px;background:rgba(8,13,18,.5)}
    .wp .wp-node{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:3px}
    .wp .wp-node .tick{width:1px;flex:1;min-height:22px;background:rgba(55,224,200,.3)}
    .wp h4{font-size:15px;font-weight:600;color:var(--ink)}
    .wp .deg{font-size:12.5px;color:var(--accent-dim);margin-top:3px}
    .wp .note{font-size:12.5px;color:var(--ink-dim);margin-top:5px}
    @media(max-width:520px){.wp{grid-template-columns:auto 1fr}.wp .readout{grid-column:2;justify-self:start;margin-top:8px}}

    .gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
    .gauge{border:1px solid var(--line);border-radius:8px;padding:12px 10px 14px;text-align:center;background:radial-gradient(120% 120% at 50% 0,#10171e,#0a0e13)}
    .gauge svg{width:100%;height:auto}
    .gauge .g-label{font-size:11px;color:var(--ink);margin-top:8px;line-height:1.35;min-height:2.5em;display:flex;align-items:center;justify-content:center}
    .gauge .g-code{font-size:9.5px;letter-spacing:.14em;color:var(--ink-faint);margin-top:5px}
    .subsys{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
    .chip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.05em;color:var(--ink);background:rgba(8,14,19,.7);border:1px solid var(--line);padding:6px 10px;border-radius:20px}
    .chip .led{width:7px;height:7px}

    .switches{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
    .cw{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:13px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(160deg,#131a21,#0b1015)}
    .cw-ctrl{display:flex;flex-direction:column;align-items:center;gap:7px}
    .cw-code{font-size:9px;letter-spacing:.12em;color:var(--ink-faint)}
    .cw-ico{color:var(--accent);font-size:16px;margin-bottom:2px}
    .cw h4{font-family:'Chakra Petch';font-size:14px;font-weight:600;color:var(--ink);line-height:1.25}
    .cw p{margin:6px 0 0;font-size:12px;color:var(--ink-dim);line-height:1.5}

    .mlog{border:1px solid var(--line);border-radius:8px;padding:15px 16px;background:rgba(8,13,18,.55)}
    .mlog .m-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px}
    .mlog h4{font-size:16px;font-weight:600;color:var(--ink)}
    .mlog .m-role{color:var(--accent)}
    .mlog .m-sum{font-size:12.5px;color:var(--ink-dim);margin:8px 0 12px}
    .checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
    .checklist li{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start;font-size:12.5px;color:var(--ink)}
    .checklist li .led{margin-top:5px;width:8px;height:8px}

    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
    .card{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:9px;overflow:hidden;
      background:linear-gradient(165deg,#121922,#0a0e13);transition:transform .16s,box-shadow .16s,border-color .16s}
    .card:hover{transform:translateY(-4px);border-color:rgba(55,224,200,.5);box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 0 1px rgba(55,224,200,.25)}
    .card .cover{position:relative;height:140px;background:#04120f;overflow:hidden;border-bottom:1px solid #0c2b26}
    .card .cover img{width:100%;height:100%;object-fit:cover;filter:contrast(1.04) saturate(1.05)}
    .card .cover::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 2px,transparent 2px 4px);opacity:.35}
    .card .cbody{padding:13px 14px 15px;display:flex;flex-direction:column;gap:8px;flex:1}
    .card .ctag{display:flex;justify-content:space-between;gap:8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
    .card .ctag .cat{color:var(--accent)}.card .ctag .date{color:var(--ink-faint)}
    .card h4{font-family:'Chakra Petch';font-size:15px;font-weight:600;color:var(--ink);line-height:1.25}
    .card .stack{font-size:11px;color:var(--accent);letter-spacing:.03em}
    .card p{margin:0;font-size:12px;color:var(--ink-dim);line-height:1.5;flex:1}
    .card .more{font-family:'Chakra Petch';font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:inline-flex;gap:6px}
    .card .brk{position:absolute;top:8px;right:8px;width:13px;height:13px;border:2px solid rgba(55,224,200,.5);border-left:0;border-bottom:0;z-index:2}

    .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
    .filters button{font-family:'Chakra Petch';font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
      color:var(--ink-dim);background:rgba(8,13,18,.6);border:1px solid var(--line);padding:8px 12px;border-radius:5px;display:inline-flex;align-items:center;gap:8px;transition:.15s}
    .filters button::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-faint);transition:.15s}
    .filters button:hover{color:var(--accent);border-color:rgba(55,224,200,.4)}
    .filters button.active{color:var(--accent);border-color:var(--accent);background:rgba(55,224,200,.08)}
    .filters button.active::before{background:var(--green);box-shadow:0 0 7px var(--green)}
    .load-note{grid-column:1/-1;font-size:12.5px;color:var(--ink-dim);padding:16px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;gap:10px}

    .certs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
    .cert{display:grid;grid-template-columns:96px 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:linear-gradient(165deg,#121922,#0a0e13)}
    .cert .cert-frame{position:relative;background:#04120f;border-right:1px solid #0c2b26}
    .cert .cert-frame img{width:100%;height:100%;min-height:110px;object-fit:cover}
    .cert .cert-frame::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 2px,transparent 2px 4px);opacity:.35}
    .cert .cert-info{padding:13px}
    .cert .cert-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;align-items:center}
    .cert .tagchip{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);border:1px solid #3a2a08;background:#140d02;padding:3px 8px;border-radius:3px}
    .cert h4{font-family:'Chakra Petch';font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px;line-height:1.25}
    .cert p{margin:0;font-size:11.5px;color:var(--ink-dim);line-height:1.5}
    @media(max-width:380px){.cert{grid-template-columns:1fr}}

    .comms{display:grid;grid-template-columns:1fr 1.1fr;gap:16px}
    @media(max-width:720px){.comms{grid-template-columns:1fr}}
    .freqs{display:flex;flex-direction:column;gap:10px}
    .freq{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:7px;background:rgba(8,13,18,.55);transition:.15s}
    .freq:hover{border-color:rgba(55,224,200,.4);background:rgba(55,224,200,.05)}
    .freq .f-k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim)}
    .freq .f-v{font-size:12.5px;color:var(--ink);text-align:right;word-break:break-all}
    form .field{margin-bottom:12px}
    form label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-dim);margin-bottom:6px}
    form input,form textarea{width:100%;font-family:'IBM Plex Mono';font-size:14px;color:var(--ink);background:var(--accent-deep);
      border:1px solid #0c2b26;border-radius:5px;padding:12px 13px;box-shadow:inset 0 0 10px rgba(0,0,0,.5)}
    form input::placeholder,form textarea::placeholder{color:var(--ink-faint)}
    form input:focus,form textarea:focus{outline:none;border-color:var(--accent);box-shadow:inset 0 0 10px rgba(55,224,200,.15),0 0 0 1px rgba(55,224,200,.3)}
    form textarea{min-height:120px;resize:vertical}
    .transmit{width:100%;justify-content:center;font-size:14px;padding:14px}
    #cf-status{margin-top:12px;font-size:13px;min-height:1.2em}
    .foot-mini{margin-top:26px;padding-top:16px;border-top:1px dashed rgba(140,170,190,.16);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:11.5px;color:var(--ink-faint)}
    .foot-mini a{color:var(--ink-dim)}.foot-mini a:hover{color:var(--accent)}

    /* ---- Bottom rail : system select + throttle + destruct ---- */
    .bottom{grid-area:bottom;display:flex;align-items:stretch;gap:10px;padding:10px 12px;flex-wrap:wrap}
    .sysbar{display:flex;gap:8px;flex:1;flex-wrap:wrap;min-width:0}
    .sysbtn{position:relative;flex:1 1 120px;min-width:110px;cursor:pointer;border:1px solid #0c2b26;border-radius:8px;padding:11px 12px 10px;
      background:linear-gradient(180deg,#0c151a,#070d11);text-align:left;transition:.15s;color:var(--ink-dim)}
    .sysbtn:hover{border-color:rgba(55,224,200,.4);color:var(--ink)}
    .sysbtn .sb-code{font-size:9px;letter-spacing:.14em;color:var(--ink-faint)}
    .sysbtn .sb-name{font-family:'Chakra Petch';font-size:12px;font-weight:600;letter-spacing:.04em;margin-top:3px;display:flex;align-items:center;gap:7px}
    .sysbtn .sb-name .led{width:8px;height:8px}
    .sysbtn.active{border-color:var(--accent);color:#eafffb;background:linear-gradient(180deg,#0c3a33,#072320);box-shadow:0 0 0 1px rgba(55,224,200,.2),0 0 16px rgba(55,224,200,.18)}
    .throttle-box{display:flex;flex-direction:column;gap:6px;justify-content:center;padding:8px 12px;border:1px solid #0c2b26;border-radius:8px;background:linear-gradient(180deg,#0c151a,#070d11);min-width:160px}
    .throttle-box .t-lab{font-size:9.5px;letter-spacing:.14em;color:var(--accent-dim);text-transform:uppercase;display:flex;justify-content:space-between}
    .throttle-box .t-lab b{color:var(--accent);font-family:'Chakra Petch'}
    input[type=range].throttle{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:6px;background:#04120f;border:1px solid #0c2b26}
    input[type=range].throttle::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:22px;border-radius:4px;background:linear-gradient(180deg,#eafffb,#9fe9dd);box-shadow:0 2px 5px rgba(0,0,0,.6),0 0 8px rgba(55,224,200,.5);cursor:pointer}
    input[type=range].throttle::-moz-range-thumb{width:16px;height:22px;border:0;border-radius:4px;background:#cfeee7;cursor:pointer}
    .destruct{display:flex;flex-direction:column;gap:5px;justify-content:center;align-items:center;padding:6px 12px;border:1px solid #5a1218;border-radius:8px;
      background:repeating-linear-gradient(45deg,#2a0a0d 0 10px,#150507 10px 20px);position:relative}
    .destruct .dcap{font-size:9px;letter-spacing:.12em;color:var(--red);text-transform:uppercase}
    .sd-btn{cursor:pointer;border:2px solid #7a1a22;border-radius:50%;width:44px;height:44px;background:radial-gradient(circle at 50% 35%,#ff6b74,#8f1119);
      box-shadow:0 3px 8px rgba(0,0,0,.6),inset 0 -3px 6px rgba(0,0,0,.5),0 0 10px rgba(255,89,102,.4);color:#fff;font-family:'Chakra Petch';font-size:9px;font-weight:700;letter-spacing:.04em}
    .sd-btn:hover{box-shadow:0 0 16px rgba(255,89,102,.7)}
    @media(max-width:1080px){.throttle-box{min-width:130px}}

    /* self destruct overlay */
    .sd-overlay{position:fixed;inset:0;z-index:180;display:none;align-items:center;justify-content:center;padding:20px;
      background:rgba(20,2,4,.55);backdrop-filter:blur(2px)}
    .sd-overlay.show{display:flex;animation:sdflash 1s steps(2,end) infinite}
    @keyframes sdflash{0%,100%{background:rgba(30,2,4,.4)}50%{background:rgba(70,4,8,.6)}}
    .sd-panel{width:min(460px,100%);text-align:center;border:1px solid #7a1a22;border-radius:12px;padding:30px 26px;background:linear-gradient(160deg,#1a0508,#0c0203);box-shadow:0 30px 80px rgba(0,0,0,.7)}
    .sd-panel h2{font-size:20px;color:var(--red);letter-spacing:.1em;text-transform:uppercase}
    .sd-count{font-family:'Chakra Petch';font-size:72px;font-weight:700;color:#ff6b74;text-shadow:0 0 24px rgba(255,89,102,.7);margin:10px 0}
    .sd-msg{color:var(--ink);font-size:13px;margin:8px 0 20px;min-height:1.2em}
    .abort{background:linear-gradient(180deg,#0c3a33,#072320);color:var(--accent);border:1px solid var(--accent);font-size:15px;padding:14px 26px}

    /* alien transmission overlay strip on MFD */
    .alien-band{position:absolute;left:0;right:0;top:0;z-index:6;display:none;padding:9px 16px;background:linear-gradient(90deg,rgba(70,20,110,.9),rgba(30,8,50,.85));
      border-bottom:1px solid var(--violet);color:#e9d8ff;font-size:12px;letter-spacing:.1em;align-items:center;gap:10px}
    .alien-band.show{display:flex;animation:aband .3s ease}
    @keyframes aband{from{transform:translateY(-100%)}to{transform:none}}
    .alien-band .led{background:var(--violet);box-shadow:0 0 8px var(--violet)}

    a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

    /* ============ Responsive: collapse rails ============ */
    @media(max-width:960px){
      .deck{grid-template-columns:1fr;grid-template-rows:auto auto auto auto auto;
        grid-template-areas:"top" "bottom" "mfd" "left" "right";}
      .mfd{min-height:56vh}
      .rail,.rail-r{flex-direction:row;flex-wrap:wrap;overflow:visible}
      .rail>.surf,.rail-r>.surf{flex:1 1 240px}
      .scope-wrap{max-width:260px}
    }
    @media(max-width:560px){
      .deck{padding:8px;gap:8px}
      .topbar{padding-right:150px;flex-wrap:wrap;min-height:auto}
      .sysbtn{flex:1 1 44%;min-width:44%}
      .throttle-box,.destruct{flex:1 1 100%}
      .hero-name{font-size:clamp(30px,10vw,54px)}
    }

    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{animation:none!important;transition:none!important}
      .led.blink{opacity:1}
      .scope .sweep{transform:rotate(0)}
      .g-fill{stroke-dashoffset:var(--off)}
    }
  </style>
</head>
<body>
  <div class="canopy" aria-hidden="true">
    <span class="c-brk tl"></span><span class="c-brk tr"></span><span class="c-brk bl"></span><span class="c-brk br"></span>
  </div>

  <!-- ===== BOOT SEQUENCE ===== -->
  <div class="boot" id="boot" role="dialog" aria-label="Systems initializing">
    <div class="boot-inner">
      <h1 id="boot-name">CJC-40 · STARFARER</h1>
      <div class="b-sub" id="boot-sub">Flight Deck · Systems Initializing</div>
      <div class="b-log" id="boot-log"></div>
      <div class="b-bar"><span id="boot-fill"></span></div>
      <button class="b-skip" id="boot-skip" type="button">▸ Skip / 跳过</button>
    </div>
  </div>

  <!-- ===== DECK ===== -->
  <main class="deck" id="deck" aria-hidden="false">

    <!-- TOP -->
    <div class="topbar surf">
      <span class="callsign">CJC<b>-40</b></span>
      <span class="master"><span class="led green blink slow"></span><span id="master-txt">ALL SYSTEMS NOMINAL</span></span>
      <div class="tele-strip" id="tele"></div>
    </div>

    <!-- LEFT RAIL -->
    <div class="rail">
      <div class="surf swpanel">
        <div class="rail-hd" id="rail-l-hd">SUBSYSTEMS</div>
        <div id="switch-list"></div>
      </div>
      <div class="surf swpanel hyper">
        <div class="rail-hd" id="hyper-hd">DRIVE</div>
        <div class="tsw guarded" id="hyper-sw">
          <div class="toggle"><span class="lever"></span></div>
          <div class="sw-txt"><div class="sw-name" id="hyper-name">HYPERDRIVE</div><div class="sw-state" id="hyper-state">ARMED · LIFT COVER</div></div>
          <span class="led amber" id="hyper-led"></span>
        </div>
        <div class="hyper-guard" id="hyper-guard">⚠ LIFT SAFETY COVER</div>
      </div>
      <div class="surf">
        <div class="knobrow">
          <div class="knob" id="freq-knob" role="button" tabindex="0" aria-label="Rotate comms frequency dial"></div>
          <div class="knob-info"><b id="freq-val">121.5</b> MHz<br><span id="freq-lab">COMMS FREQ</span></div>
        </div>
      </div>
    </div>

    <!-- CENTER MFD -->
    <div class="mfd" id="mfd">
      <canvas id="stars"></canvas>
      <div class="alien-band" id="alien-band"><span class="led"></span><span id="alien-text"></span></div>
      <div class="mfd-top">
        <span class="mfd-code" id="mfd-code">MFD·00</span>
        <span class="mfd-title" id="mfd-title">FLIGHT DECK</span>
        <div class="rulers"><span class="led green"></span><span class="led amber"></span><span class="led green blink"></span></div>
      </div>
      <div class="mfd-scroll" id="mfd-scroll">
        <section class="screen active" id="screen-deck"></section>
        <section class="screen" id="screen-crew"></section>
        <section class="screen" id="screen-sub"></section>
        <section class="screen" id="screen-mission"></section>
        <section class="screen" id="screen-trans"></section>
        <section class="screen" id="screen-comms">
          <div class="scr-lead" id="comms-lead">▸ OPEN CHANNEL</div>
          <h2 class="mfd-title" style="font-size:22px;margin-bottom:6px" id="comms-h"></h2>
          <p style="color:var(--ink-dim);font-size:13px;margin:0 0 18px;max-width:60ch" id="comms-desc"></p>
          <div class="comms">
            <div class="freqs" id="contact-info"></div>
            <form id="cf" novalidate>
              <input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
              <div class="field"><label id="lb-name" for="cf-name"></label><input type="text" name="name" id="cf-name" required></div>
              <div class="field"><label id="lb-email" for="cf-email"></label><input type="email" name="email" id="cf-email" required></div>
              <div class="field"><label id="lb-msg" for="cf-msg"></label><textarea name="message" id="cf-msg" required></textarea></div>
              <button type="submit" class="btn primary transmit" id="cf-send"><span class="dot"></span><span></span></button>
              <p id="cf-status" role="status" aria-live="polite"></p>
            </form>
          </div>
          <div class="foot-mini" id="foot-mini"></div>
        </section>
      </div>
    </div>

    <!-- RIGHT RAIL -->
    <div class="rail-r">
      <div class="surf">
        <div class="rail-hd" id="rail-r-hd">NAV SCOPE</div>
        <div class="scope-wrap">
          <div class="scope">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <circle class="ring" cx="50" cy="50" r="47"/><circle class="ring" cx="50" cy="50" r="32"/><circle class="ring" cx="50" cy="50" r="17"/>
              <line class="cross" x1="50" y1="3" x2="50" y2="97"/><line class="cross" x1="3" y1="50" x2="97" y2="50"/>
              <g class="sweep"><path d="M50 50 L50 3 A47 47 0 0 1 78 12 Z" fill="rgba(55,224,200,.14)"/></g>
              <circle class="blip" cx="66" cy="34" r="1.8"/><circle class="blip" cx="38" cy="62" r="1.5"/><circle class="blip" cx="58" cy="70" r="1.4"/>
              <circle class="blip alien" id="alien-blip" cx="26" cy="30" r="2.4"><title>Unknown contact</title></circle>
            </svg>
          </div>
          <div class="scope-cap" id="scope-cap">CONTACTS · 4 TRACKED</div>
        </div>
        <div class="minigauges" id="minigauges"></div>
        <button class="btn ghost scanbtn" id="scan-btn" type="button">◎ <span id="scan-lab">SCAN</span></button>
      </div>
    </div>

    <!-- BOTTOM RAIL -->
    <div class="bottom surf">
      <div class="sysbar" id="sysbar"></div>
      <div class="throttle-box">
        <div class="t-lab"><span id="thr-lab">THROTTLE</span><b id="thr-val">42%</b></div>
        <input type="range" min="0" max="100" value="42" class="throttle" id="throttle" aria-label="Throttle">
      </div>
      <div class="destruct">
        <span class="dcap" id="sd-cap">SELF-DESTRUCT</span>
        <button class="sd-btn" id="sd-btn" type="button">ARM</button>
      </div>
    </div>
  </main>

  <!-- self destruct overlay -->
  <div class="sd-overlay" id="sd-overlay" role="alertdialog" aria-label="Self destruct sequence">
    <div class="sd-panel">
      <h2 id="sd-title">⚠ SELF-DESTRUCT ARMED ⚠</h2>
      <div class="sd-count" id="sd-count">10</div>
      <div class="sd-msg" id="sd-msg"></div>
      <button class="btn abort" id="sd-abort" type="button">ABORT · 中止</button>
    </div>
  </div>

  <script>window.THEME_ID = "40-cockpit";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>

    /* ================= starfield / warp ================= */
    let stars=[], warp=0, rafId=null, ctx=null, cvs=null, throttle=0.42;
    function startStars(){
      cvs=document.getElementById("stars"); if(!cvs) return; ctx=cvs.getContext("2d");
      sizeStars();
      window.addEventListener("resize", sizeStars);
      if(reduce){ drawStatic(); return; }
      loop();
    }
    function sizeStars(){
      if(!cvs) return;
      const r=cvs.getBoundingClientRect(); const dpr=Math.min(window.devicePixelRatio||1,2);
      cvs.width=Math.max(1,r.width*dpr); cvs.height=Math.max(1,r.height*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      const n=Math.round((r.width*r.height)/9000);
      stars=[]; for(let i=0;i<Math.max(60,Math.min(180,n));i++) stars.push(mkStar(r.width,r.height));
      if(reduce) drawStatic();
    }
    function mkStar(w,h){ return {x:Math.random()*w,y:Math.random()*h,z:Math.random()*1+.3, px:0,py:0}; }
    function drawStatic(){
      const r=cvs.getBoundingClientRect();
      ctx.fillStyle="#020a08"; ctx.fillRect(0,0,r.width,r.height);
      stars.forEach(s=>{ ctx.fillStyle="rgba(180,230,220,"+(s.z*0.6)+")"; ctx.fillRect(s.x,s.y,s.z*1.6,s.z*1.6); });
    }
    function loop(){
      const r=cvs.getBoundingClientRect(), w=r.width, h=r.height, cx=w/2, cy=h/2;
      ctx.fillStyle="rgba(2,10,8,"+(warp>0?0.28:0.5)+")"; ctx.fillRect(0,0,w,h);
      const spd = 0.25 + throttle*1.2 + warp*10;
      for(const s of stars){
        s.px=s.x; s.py=s.y;
        if(warp>0){
          const dx=s.x-cx, dy=s.y-cy;
          s.x+=dx*0.03*spd*0.14+ dx*0.0; s.y+=dy*0.03*spd*0.14;
          s.x+=dx/Math.max(20,Math.hypot(dx,dy))*spd; s.y+=dy/Math.max(20,Math.hypot(dx,dy))*spd;
        } else {
          s.y+=s.z*spd;
        }
        if(s.x<0||s.x>w||s.y<0||s.y>h){ Object.assign(s, mkStar(w,h)); if(warp>0){s.x=cx+(Math.random()-.5)*40;s.y=cy+(Math.random()-.5)*40;} s.px=s.x;s.py=s.y; }
        const a=Math.min(1,s.z*(warp>0?0.9:0.55));
        if(warp>0){
          ctx.strokeStyle="rgba(150,240,225,"+a+")"; ctx.lineWidth=s.z*1.2;
          ctx.beginPath(); ctx.moveTo(s.px,s.py); ctx.lineTo(s.x,s.y); ctx.stroke();
        } else {
          ctx.fillStyle="rgba(185,235,225,"+a+")"; ctx.fillRect(s.x,s.y,s.z*1.5,s.z*1.5);
        }
      }
      if(warp>0){ warp-=0.012; if(warp<0)warp=0; }
      rafId=requestAnimationFrame(loop);
    }
    function engageWarp(){

    /* ================= gauges ================= */
    function gaugeSVG(val,small){
      const ang=(val/100)*180-90; let ticks="";
      for(let i=0;i<=10;i++){ const a=Math.PI-(i/10)*Math.PI;
        const x1=60+47*Math.cos(a),y1=60-47*Math.sin(a),x2=60+41*Math.cos(a),y2=60-41*Math.sin(a);
        ticks+='<line class="g-tick" x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'"/>'; }
      return '<svg viewBox="0 0 120 '+(small?70:78)+'" role="img" aria-label="'+val+' percent">'+
        '<path class="g-arc" d="M14 60 A46 46 0 0 1 106 60"/>'+
        '<path class="g-fill" pathLength="100" style="--off:'+(100-val)+'" d="M14 60 A46 46 0 0 1 106 60"/>'+ticks+
        '<circle cx="60" cy="60" r="4" fill="#0c1116" stroke="var(--accent)" stroke-width="1.4"/>'+
        '<text class="g-val" x="60" y="'+(small?58:74)+'" text-anchor="middle">'+val+(small?'':'%')+'</text></svg>';
    }
    function spinGauges(){
      const gs=[].slice.call(document.querySelectorAll('.gauge:not(.spun),.mg:not(.spun)'));
      if(!('IntersectionObserver' in window)||reduce){ gs.forEach(g=>g.classList.add('spun')); return; }
      const io=new IntersectionObserver((es,o)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('spun');o.unobserve(e.target);}});},{threshold:.3});
      gs.forEach(g=>io.observe(g));
    }

        };
        el.addEventListener("click",act);
        el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();act();} });
      });
    }

    /* ================= hyperdrive easter egg ================= */
    function bindHyper(){
      const guard=document.getElementById("hyper-guard"), sw=document.getElementById("hyper-sw"), led=document.getElementById("hyper-led");
      guard.addEventListener("click",()=>{ guard.classList.add("lifted"); beep(400,0.06); });
      const fire=()=>{
        if(!guard.classList.contains("lifted")){ guard.classList.add("lifted"); return; }
        sw.classList.toggle("on");
        const on=sw.classList.contains("on");
        document.getElementById("hyper-state").textContent=on?tl(L.hyperEng):tl(L.hyperArm);
        led.className="led "+(on?"blue":"amber");
        if(on){ beep(880,0.12); engageWarp(); }
      };
      sw.addEventListener("click",fire);
      sw.setAttribute("tabindex","0");
      sw.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();fire();} });
    }

    /* ================= alien transmission easter egg ================= */
    let alienIdx=0;
    function alienTransmission(){
      const band=document.getElementById("alien-band"), txt=document.getElementById("alien-text");
      const msg=tl(L.alienMsgs[alienIdx%L.alienMsgs.length]); alienIdx++;
      const garble="⏃⌰⟟⟒⋏ ⌇⟟☌⋏⏃⌰ ⋔⋏⋔⋔"; txt.textContent=(ZH()?"未知信号：":"UNKNOWN SIGNAL: ")+garble;
      band.classList.add("show");
      const blip=document.getElementById("alien-blip"); if(blip) blip.setAttribute("r","3.2");
      beep(220,0.15); setTimeout(()=>beep(180,0.15),160);
      let steps=0; const tick=setInterval(()=>{
        steps++; if(steps>6){ clearInterval(tick); txt.textContent=msg; }
        else { txt.textContent=(ZH()?"解码中… ":"DECODING… ")+garble.split('').sort(()=>Math.random()-.5).join(''); }
      }, reduce?0:180);
      clearTimeout(alienTimer2);
      alienTimer2=setTimeout(()=>{ band.classList.remove("show"); if(blip) blip.setAttribute("r","2.4"); }, 6500);
    }
    let alienTimer2=null;

    /* ================= self-destruct easter egg ================= */
    let sdInt=null;
    function armDestruct(){
      const ov=document.getElementById("sd-overlay"), cnt=document.getElementById("sd-count"), msg=document.getElementById("sd-msg");
      ov.classList.add("show"); msg.textContent="";
      document.getElementById("sd-title").textContent=ZH()?"⚠ 自毁程序已启动 ⚠":"⚠ SELF-DESTRUCT ARMED ⚠";
      let n=10; cnt.textContent=n; beep(200,0.1);
      clearInterval(sdInt);
      sdInt=setInterval(()=>{
        n--; if(n<=0){
          clearInterval(sdInt); cnt.textContent="0"; msg.textContent=tl(L.sdBoom);
          beep(120,0.3);
          setTimeout(()=>ov.classList.remove("show"),2600);
        } else { cnt.textContent=n; beep(300+ (10-n)*20,0.05); }
      }, reduce?400:900);
    }
    function abortDestruct(){
      clearInterval(sdInt);
      const ov=document.getElementById("sd-overlay"), msg=document.getElementById("sd-msg");
      msg.textContent=tl(L.sdCancelled); beep(660,0.08);
      setTimeout(()=>ov.classList.remove("show"),1200);
    }

    /* ================= tiny audio (user-gesture only) ================= */
    let actx=null;
    function beep(freq,dur){
      if(reduce) return;
      try{
        actx=actx||new (window.AudioContext||window.webkitAudioContext)();
        if(actx.state==="suspended") actx.resume();
        const o=actx.createOscillator(), g=actx.createGain();
        o.type="square"; o.frequency.value=freq;
        g.gain.value=0.025; o.connect(g); g.connect(actx.destination);
        o.start(); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
        o.stop(actx.currentTime+dur+0.02);
      }catch(e){}
    }

    /* ================= misc UI ================= */
    function flashMFD(text){ showToast(text,"var(--accent)"); }
    let toastTimer=null;
    function showToast(text,color){
      const band=document.getElementById("alien-band"), txt=document.getElementById("alien-text");
      band.style.background="linear-gradient(90deg,rgba(6,58,51,.95),rgba(4,25,20,.9))";
      band.querySelector(".led").style.background="var(--accent)";
      txt.textContent=text; band.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer=setTimeout(()=>{ band.classList.remove("show");
        band.style.background=""; band.querySelector(".led").style.background=""; }, 3200);
    }

    function bindControls(){
      // throttle
      const thr=document.getElementById("throttle");
      thr.addEventListener("input",()=>{ throttle=thr.value/100; document.getElementById("thr-val").textContent=thr.value+"%"; });
      // scan -> alien
      document.getElementById("scan-btn").addEventListener("click",alienTransmission);
      const ab=document.getElementById("alien-blip"); if(ab) ab.addEventListener("click",alienTransmission);
      // freq knob
      let deg=0;
      const knob=document.getElementById("freq-knob");
      const spin=()=>{ deg+=30; knob.style.transform="rotate("+deg+"deg)";
        const f=(118+ (deg/30)%40*0.5).toFixed(1); document.getElementById("freq-val").textContent=f; beep(500,0.03);
        // secret: 3 full turns opens alien channel
        if(deg%360===0 && deg>0) alienTransmission();
      };
      knob.addEventListener("click",spin);
      knob.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();spin();} });
      // self destruct
      document.getElementById("sd-btn").addEventListener("click",armDestruct);
      document.getElementById("sd-abort").addEventListener("click",abortDestruct);
      // esc closes destruct
      document.addEventListener("keydown",e=>{ if(e.key==="Escape") abortDestruct(); });
      bindHyper();
    }

    // FontAwesome 4 for course icons
    const fa=document.createElement("link"); fa.rel="stylesheet";
    fa.href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css";
    document.head.appendChild(fa);

    // contact submit
    function bindForm(){
      document.getElementById("cf").addEventListener("submit",async e=>{
        e.preventDefault();
        const f=e.target, s=document.getElementById("cf-status");
        s.style.color="var(--amber)"; s.textContent="◉ "+t(P.ui.sending);
        try{
          const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});
          s.style.color="var(--green)"; s.textContent="✓ "+(r.message||(ZH()?"信号已发送。":"Signal transmitted."));
          f.reset(); beep(720,0.08);
        }catch(err){ s.style.color="var(--red)"; s.textContent="✕ "+err.message; }
      });
    }

    function fullRender(){ renderChrome(); renderScreens(); renderProjects(); renderArticles(); }

    document.addEventListener("DOMContentLoaded",()=>{
      CJCData.setTheme(window.THEME_ID);
      current="deck";
      fullRender();
      bindControls();
      bindForm();
      CJCData.mountSwitcher({accent:"#37e0c8"});
      CJCData.onLang(()=>{ fullRender(); });
      document.getElementById("boot-skip").addEventListener("click",endBoot);
      document.getElementById("boot").addEventListener("click",e=>{ if(e.target.id==="boot") endBoot(); });
      runBoot();
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

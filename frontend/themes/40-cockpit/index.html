<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Cai Jiechao — performance cockpit portfolio"
    />
    <title>Cai Jiechao — Performance Cockpit</title>
    <link rel="icon" href="/index_page/img/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <style>
      :root {
        --night: #080b0d;
        --carbon: #12171a;
        --panel: #171d20;
        --panel2: #20272b;
        --line: rgba(226, 235, 237, 0.16);
        --ink: #edf3f3;
        --muted: #a3b0b5;
        --lime: #d7ff31;
        --orange: #ff6a3d;
        --blue: #76caff;
        --cond: "Barlow Condensed", Arial, sans-serif;
        --mono: "IBM Plex Mono", monospace;
        --sans: Inter, Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        min-width: 320px;
        overflow-x: hidden;
        background: var(--night);
        color: var(--ink);
        font: 15px/1.6 var(--sans);
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      img {
        display: block;
        max-width: 100%;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid var(--lime);
        outline-offset: 4px;
      }
      .skip {
        position: absolute;
        top: -75px;
        left: 12px;
        z-index: 9999;
        background: var(--lime);
        color: #111;
        padding: 11px 15px;
        font-weight: 800;
      }
      .skip:focus {
        top: 12px;
      }
      .shell {
        width: min(1320px, calc(100% - 36px));
        margin: auto;
      }
      .mono {
        font: 11px/1.35 var(--mono);
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .status-dot {
        color: var(--lime);
      }
      .head {
        position: relative;
        z-index: 4;
        background: #080b0d;
        border-bottom: 1px solid var(--line);
      }
      .head .shell {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 16px 205px 16px 0;
      }
      .brand {
        font: 700 28px/0.85 var(--cond);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .brand i {
        font-style: normal;
        color: var(--lime);
      }
      .nav {
        display: flex;
        gap: 22px;
        font: 11px var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .nav a:hover {
        color: var(--lime);
      }
      .session {
        display: flex;
        gap: 7px;
        align-items: center;
        color: var(--muted);
      }
      .session:before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--lime);
        box-shadow: 0 0 12px rgba(215, 255, 49, 0.7);
      }
      .hero {
        position: relative;
        min-height: 735px;
        border-bottom: 1px solid var(--line);
        isolation: isolate;
        overflow: hidden;
      }
      .hero-photo {
        position: absolute;
        inset: 0;
        z-index: -2;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.76) contrast(1.1) brightness(0.75);
      }
      .hero-shade {
        position: absolute;
        inset: 0;
        z-index: -1;
        background: rgba(3, 5, 6, 0.4);
      }
      .hero .shell {
        min-height: 735px;
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 40px;
        padding: 52px 0 38px;
      }
      .hero-main {
        align-self: end;
      }
      .race-id {
        display: inline-flex;
        gap: 10px;
        align-items: center;
        border: 1px solid rgba(237, 243, 243, 0.4);
        padding: 8px 10px;
        color: #f5f7f1;
        background: rgba(6, 8, 9, 0.35);
        backdrop-filter: blur(7px);
      }
      .race-id b {
        color: var(--lime);
        font-weight: 500;
      }
      .hero h1 {
        max-width: 830px;
        margin: 18px 0 0;
        font: 700 clamp(68px, 11vw, 166px) / 0.75 var(--cond);
        letter-spacing: -0.04em;
        text-transform: uppercase;
      }
      .hero h1 span {
        color: var(--lime);
        font-style: italic;
      }
      .hero p.lead {
        max-width: 47ch;
        margin: 25px 0 0;
        color: #e3e8e6;
        font-size: 18px;
      }
      .actions {
        display: flex;
        gap: 11px;
        flex-wrap: wrap;
        margin-top: 28px;
      }
      .button {
        min-height: 45px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 0 17px;
        border: 1px solid rgba(237, 243, 243, 0.55);
        background: rgba(8, 11, 13, 0.48);
        backdrop-filter: blur(7px);
        color: #fff;
        font: 600 14px var(--cond);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transition:
          background 0.18s,
          transform 0.18s;
      }
      .button:hover {
        background: #f1f5ed;
        color: #111;
        transform: translateY(-2px);
      }
      .button.lime {
        border-color: var(--lime);
        color: #101208;
        background: var(--lime);
      }
      .button.lime:hover {
        background: #fff;
      }
      .helmet-panel {
        align-self: end;
        border: 1px solid rgba(237, 243, 243, 0.3);
        background: rgba(9, 12, 13, 0.7);
        backdrop-filter: blur(16px);
        padding: 18px;
      }
      .helmet-panel figure {
        margin: 0;
      }
      .helmet-panel img {
        width: 100%;
        aspect-ratio: 4/3;
        object-fit: cover;
        filter: contrast(1.05) saturate(0.75);
      }
      .helmet-panel figcaption {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 13px;
        color: var(--muted);
      }
      .telemetry-line {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: center;
        margin-top: 11px;
      }
      .telemetry-line meter {
        width: 100%;
        height: 8px;
        accent-color: var(--lime);
      }
      meter::-webkit-meter-bar {
        background: #3a4347;
        border-radius: 0;
      }
      meter::-webkit-meter-optimum-value {
        background: var(--lime);
      }
      main {
        padding-bottom: 75px;
      }
      .section {
        padding-top: 108px;
      }
      .section-head {
        display: grid;
        grid-template-columns: 90px 1fr auto;
        align-items: end;
        gap: 20px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }
      .index {
        color: var(--lime);
        font: 600 17px var(--cond);
        letter-spacing: 0.12em;
      }
      .section-head h2 {
        margin: 0;
        font: 700 clamp(39px, 6vw, 76px) / 0.8 var(--cond);
        letter-spacing: -0.02em;
        text-transform: uppercase;
      }
      .section-head p {
        margin: 0;
        color: var(--muted);
        text-align: right;
      }
      .profile {
        display: grid;
        grid-template-columns: 0.65fr 1.35fr;
        gap: 0;
        margin-top: 22px;
        border: 1px solid var(--line);
      }
      .driver-photo {
        position: relative;
        min-height: 480px;
      }
      .driver-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: grayscale(0.3) contrast(1.05);
      }
      .driver-photo figcaption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 15px;
        background: rgba(5, 8, 9, 0.78);
        font: 11px var(--mono);
        letter-spacing: 0.08em;
      }
      .driver-copy {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-content: space-between;
        padding: clamp(24px, 5vw, 60px);
        gap: 35px;
        background: var(--panel);
      }
      .driver-copy .bio {
        grid-column: span 2;
        max-width: 50ch;
        font-size: clamp(20px, 2.6vw, 30px);
        line-height: 1.35;
      }
      .driver-copy .bio p {
        margin: 0 0 18px;
      }
      .driver-copy .data {
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }
      .driver-copy .data span {
        display: block;
        color: var(--muted);
        font: 10px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .driver-copy .data strong {
        display: block;
        margin-top: 6px;
        font: 600 24px/1 var(--cond);
        letter-spacing: 0.03em;
      }
      .split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        margin-top: 22px;
      }
      .panel {
        border: 1px solid var(--line);
        background: var(--carbon);
        padding: 26px;
      }
      .panel h3 {
        margin: 0;
        font: 600 20px var(--cond);
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .formation {
        margin-top: 20px;
        border-top: 1px solid var(--line);
      }
      .formation article {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 14px;
        padding: 19px 0;
        border-bottom: 1px solid var(--line);
      }
      .formation time,
      .session-label {
        color: var(--lime);
        font: 10px var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .formation h4 {
        margin: 0;
        font-size: 18px;
      }
      .formation p {
        margin: 5px 0 0;
        color: var(--muted);
      }
      .stack-groups {
        display: grid;
        gap: 18px;
        margin-top: 21px;
      }
      .stack-groups article {
        border-left: 3px solid var(--orange);
        padding-left: 13px;
      }
      .stack-groups article:nth-child(2n) {
        border-color: var(--blue);
      }
      .stack-groups h4 {
        margin: 0;
        color: #eef3f1;
        font: 600 14px var(--cond);
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 9px;
      }
      .tag {
        border: 1px solid var(--line);
        padding: 6px 8px;
        color: #c9d2d2;
        font: 10px var(--mono);
      }
      .course-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0;
        margin-top: 22px;
        border-top: 1px solid var(--line);
        border-left: 1px solid var(--line);
      }
      .course {
        min-height: 183px;
        padding: 21px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: #111619;
      }
      .course i {
        color: var(--lime);
        font-size: 20px;
      }
      .course h3 {
        margin: 22px 0 5px;
        font: 600 22px/1 var(--cond);
        letter-spacing: 0.04em;
      }
      .course p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      .experience {
        display: grid;
        grid-template-columns: 230px 1fr;
        gap: 30px;
        margin-top: 22px;
        padding: 30px;
        border: 1px solid var(--line);
        background: var(--panel);
      }
      .experience .when {
        color: var(--lime);
        font: 11px var(--mono);
        letter-spacing: 0.08em;
      }
      .experience h3 {
        margin: 0;
        font: 600 38px/0.9 var(--cond);
        text-transform: uppercase;
      }
      .experience h3 small {
        color: var(--orange);
        font-size: 20px;
      }
      .experience p,
      .experience li {
        color: var(--muted);
      }
      .experience ul {
        padding-left: 18px;
        margin-bottom: 0;
      }
      .experience li + li {
        margin-top: 6px;
      }
      .projects {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 22px;
      }
      .project {
        display: flex;
        flex-direction: column;
        min-height: 285px;
        border: 1px solid var(--line);
        padding: 21px;
        background: var(--carbon);
        transition:
          background 0.2s,
          transform 0.2s;
      }
      .project:hover {
        transform: translateY(-5px);
        background: #273237;
      }
      .project-cover {
        width: calc(100% + 42px);
        height: 136px;
        margin: -21px -21px 18px;
        border-bottom: 1px solid var(--line);
        object-fit: cover;
        background: #0d1215;
        filter: saturate(0.7) contrast(1.1);
      }
      .project .meta,
      .article .meta {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        color: var(--blue);
        font: 10px var(--mono);
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .project h3,
      .article h3 {
        margin: 26px 0 9px;
        font: 600 32px/0.9 var(--cond);
        letter-spacing: 0.01em;
        text-transform: uppercase;
      }
      .project p,
      .article p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }
      .open {
        margin-top: auto;
        padding-top: 20px;
        color: var(--lime);
        font: 11px var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 22px 0 12px;
      }
      .filter {
        padding: 8px 10px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        font: 10px var(--mono);
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .filter.active,
      .filter:hover {
        background: var(--lime);
        border-color: var(--lime);
        color: #0e1112;
      }
      .articles {
        display: grid;
        grid-template-columns: 1.3fr 1fr 1fr;
        gap: 12px;
      }
      .article {
        display: flex;
        flex-direction: column;
        min-height: 220px;
        border: 1px solid var(--line);
        background: var(--carbon);
      }
      .article:first-child {
        grid-row: span 2;
      }
      .article img {
        width: 100%;
        height: 145px;
        object-fit: cover;
        filter: saturate(0.7) contrast(1.07);
      }
      .article:first-child img {
        height: 230px;
      }
      .article-copy {
        display: flex;
        flex: 1;
        flex-direction: column;
        padding: 18px;
      }
      .certs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 22px;
      }
      .cert {
        display: grid;
        grid-template-columns: 115px 1fr;
        gap: 18px;
        border: 1px solid var(--line);
        padding: 16px;
        background: var(--carbon);
      }
      .cert img {
        width: 115px;
        height: 85px;
        object-fit: cover;
      }
      .cert small {
        color: var(--blue);
        font: 10px var(--mono);
        letter-spacing: 0.08em;
      }
      .cert h3 {
        margin: 7px 0;
        font: 600 22px/1 var(--cond);
        text-transform: uppercase;
      }
      .cert p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      .contact {
        display: grid;
        grid-template-columns: 0.8fr 1.2fr;
        gap: 18px;
        margin-top: 22px;
      }
      .contact-intro {
        padding: 35px;
        background: var(--lime);
        color: #0f1415;
      }
      .contact-intro h2 {
        margin: 9px 0 18px;
        font: 700 clamp(50px, 7vw, 90px) / 0.78 var(--cond);
        letter-spacing: -0.03em;
        text-transform: uppercase;
      }
      .contact-intro a {
        display: block;
        margin-top: 11px;
        font: 600 20px var(--cond);
        letter-spacing: 0.04em;
      }
      .form {
        padding: 30px;
        border: 1px solid var(--line);
        background: var(--panel);
        display: grid;
        gap: 13px;
      }
      .field {
        display: grid;
        gap: 6px;
      }
      .field label {
        color: var(--muted);
        font: 10px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .field input,
      .field textarea {
        width: 100%;
        border: 1px solid var(--line);
        background: #0e1315;
        color: var(--ink);
        padding: 12px;
      }
      .field textarea {
        min-height: 128px;
        resize: vertical;
      }
      .form .button {
        align-self: start;
      }
      .status {
        min-height: 22px;
        margin: 0;
        color: var(--lime);
        font: 12px var(--mono);
      }
      .foot {
        margin-top: 100px;
        padding: 28px 0 45px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font: 11px var(--mono);
      }
      .foot .shell {
        display: flex;
        justify-content: space-between;
        gap: 18px;
      }
      .foot a {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      @media (max-width: 900px) {
        .head .shell {
          padding-right: 180px;
        }
        .nav {
          display: none;
        }
        .hero .shell {
          grid-template-columns: 1fr;
          min-height: 670px;
        }
        .helmet-panel {
          display: none;
        }
        .profile {
          grid-template-columns: 1fr;
        }
        .driver-photo {
          min-height: 370px;
        }
        .split,
        .contact {
          grid-template-columns: 1fr;
        }
        .course-grid {
          grid-template-columns: 1fr 1fr;
        }
        .projects {
          grid-template-columns: 1fr 1fr;
        }
        .articles {
          grid-template-columns: 1fr 1fr;
        }
        .article:first-child {
          grid-column: span 2;
          grid-row: auto;
        }
        .article:first-child img {
          height: 210px;
        }
      }
      @media (max-width: 600px) {
        .shell {
          width: min(100% - 24px, 1320px);
        }
        .head .shell {
          padding: 15px 0;
        }
        .session {
          display: none;
        }
        .hero {
          min-height: 560px;
        }
        .hero .shell {
          min-height: 560px;
          padding: 30px 0;
        }
        .hero h1 {
          font-size: 70px;
        }
        .hero p.lead {
          font-size: 16px;
        }
        .button {
          width: 100%;
        }
        .section {
          padding-top: 72px;
        }
        .section-head {
          grid-template-columns: 1fr;
          gap: 8px;
        }
        .section-head p {
          text-align: left;
        }
        .profile {
          margin-top: 14px;
        }
        .driver-photo {
          min-height: 280px;
        }
        .driver-copy {
          grid-template-columns: 1fr;
          padding: 24px;
        }
        .driver-copy .bio {
          grid-column: auto;
        }
        .formation article,
        .experience {
          grid-template-columns: 1fr;
          gap: 8px;
        }
        .course-grid,
        .projects,
        .certs,
        .articles {
          grid-template-columns: 1fr;
        }
        .article:first-child {
          grid-column: auto;
        }
        .article:first-child img {
          height: 175px;
        }
        .cert {
          grid-template-columns: 85px 1fr;
        }
        .cert img {
          width: 85px;
          height: 68px;
        }
        .foot {
          margin-top: 70px;
        }
        .foot .shell {
          flex-direction: column;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        .project,
        .button {
          transition: none;
        }
        .project:hover,
        .button:hover {
          transform: none;
        }
      }
    </style>
    <script>
      window.THEME_ID = "40-cockpit";
    </script>
    <script src="/shared/profile.js"></script>
    <script src="/shared/site-data.js"></script>
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <header class="head">
      <div class="shell">
        <a class="brand" href="#top">CJC <i>/</i> 26</a>
        <nav class="nav" aria-label="Primary">
          <a href="#driver">Driver</a><a href="#work">Garage</a
          ><a href="#notes">Radio</a><a href="#contact">Pit lane</a>
        </nav>
        <span class="session mono">Live session</span>
      </div>
    </header>
    <section class="hero" id="top">
      <img
        class="hero-photo"
        src="/themes/40-cockpit/assets/track-car.jpg"
        alt="A performance car on a mountain road"
        fetchpriority="high"
        onerror="this.src='/index_page/img/hero.png'"
      />
      <div class="hero-shade"></div>
      <div class="shell">
        <div class="hero-main">
          <span class="race-id mono"
            ><b>●</b> Portfolio telemetry / 2026.08</span
          >
          <h1 id="hero-name"></h1>
          <p class="lead" id="hero-head"></p>
          <div class="actions">
            <a id="cv" class="button lime" target="_blank" rel="noopener"
              ><i class="fa fa-download" aria-hidden="true"></i
              ><span data-l="cv"></span></a
            ><a id="git" class="button" target="_blank" rel="noopener"
              ><i class="fa fa-github" aria-hidden="true"></i>GitHub</a
            >
          </div>
        </div>
        <aside class="helmet-panel">
          <figure>
            <img
              src="/index_page/img/cjc/city.jpg"
              alt="A racing motorcycle cockpit and handlebars"
              loading="eager"
              onerror="this.src='/index_page/img/portfolio/ui1.jpg'"
            />
            <figcaption class="mono">
              <span>DRIVER CHANNEL</span
              ><span class="status-dot">● LINKED</span>
            </figcaption>
          </figure>
          <div class="telemetry-line">
            <span class="mono">Focus</span
            ><meter min="0" max="100" value="87">87%</meter
            ><span class="mono">87</span>
          </div>
          <div class="telemetry-line">
            <span class="mono">Velocity</span
            ><meter min="0" max="100" value="72">72%</meter
            ><span class="mono">72</span>
          </div>
        </aside>
      </div>
    </section>
    <main id="content"><div class="shell" id="app"></div></main>
    <script>
      (() => {
        "use strict";
        const L = {
          driver: { en: "Driver profile", zh: "驾驶者档案" },
          training: { en: "Formation & systems", zh: "训练与系统" },
          courses: { en: "Engineering curriculum", zh: "工程课程" },
          experience: { en: "Race craft", zh: "实战经验" },
          projects: { en: "Garage / selected work", zh: "车库 / 精选作品" },
          articles: { en: "Radio log", zh: "无线电日志" },
          certs: { en: "Licences & credentials", zh: "许可证与证书" },
          contact: { en: "Enter the pit lane.", zh: "进入维修区。" },
          cv: { en: "Download CV", zh: "下载简历" },
          name: { en: "Name", zh: "姓名" },
          email: { en: "Email", zh: "邮箱" },
          message: { en: "Message", zh: "信息" },
          send: { en: "Send to pit wall", zh: "发送至维修墙" },
          sending: { en: "Transmitting…", zh: "传输中…" },
          sent: {
            en: "Pit wall received your message.",
            zh: "维修墙已收到你的消息。",
          },
          offline: {
            en: "Telemetry is unavailable. Please return shortly.",
            zh: "遥测不可用，请稍后再试。",
          },
          view: { en: "Open telemetry", zh: "打开遥测" },
        };
        let articles = [],
          projects = [],
          filter = "all";
        const t = (x) => CJCData.t(x),
          e = (x) => CJCData.escapeHtml(x || ""),
          q = (s) => document.querySelector(s),
          P = () => CJCData.profile;
        function section(title, id, no, body) {
          return `<section class="section" id="${id}"><div class="section-head"><span class="index">${no}</span><h2>${e(t(title))}</h2><p class="mono">CJC / live systems</p></div>${body}</section>`;
        }
        function render() {
          const p = P();
          q("#hero-name").innerHTML =
            `${e(t(p.name))}<span> / ${e(t(p.role))}</span>`;
          q("#hero-head").textContent = t(p.headline);
          q("#cv").href = t(p.cv);
          q("#cv span").textContent = t(L.cv);
          q("#git").href = p.contact.github;
          q("#app").innerHTML =
            `${section(L.driver, "driver", "01", `<div class="profile"><figure class="driver-photo"><img src="${e(p.avatar)}" alt="${e(p.avatarAlt || t(p.name))}"><figcaption>DRIVER IDENTIFICATION / ${e(t(p.location))}</figcaption></figure><article class="driver-copy"><div class="bio"><p>${e(t(p.bio[0]))}</p><p>${e(t(p.bio[1]))}</p></div><div class="data"><span>Primary role</span><strong>${e(t(p.role))}</strong></div><div class="data"><span>Base of operations</span><strong>${e(t(p.location))}</strong></div></article></div>`)}${section(
              L.training,
              "training",
              "02",
              `<div class="split"><article class="panel"><h3>Formation</h3><div class="formation">${p.education.map((x) => `<article><time>${e(x.period)}</time><div><h4>${e(t(x.school))}</h4><p>${e(t(x.degree))}</p><p>${e(t(x.note))}</p></div></article>`).join("")}</div></article><article class="panel"><h3>System loadout</h3><div class="stack-groups">${p.skills
                .map(
                  (x, i) =>
                    `<article><h4>Module ${String(i + 1).padStart(2, "0")}</h4><div class="tags">${e(
                      x,
                    )
                      .split(" / ")
                      .map((y) => `<span class="tag">${y}</span>`)
                      .join("")}</div></article>`,
                )
                .join("")}</div></article></div>`,
            )}${section(L.courses, "courses", "03", `<div class="course-grid">${p.courses.map((x) => `<article class="course"><i class="fa ${e(x.icon)}" aria-hidden="true"></i><h3>${e(t(x.title))}</h3><p>${e(t(x.desc))}</p></article>`).join("")}</div>`)}${section(L.experience, "experience", "04", p.experience.map((x) => `<article class="experience"><div><span class="when">${e(x.period)}</span></div><div><h3>${e(t(x.company))}<br><small>${e(t(x.role))}</small></h3><p>${e(t(x.summary))}</p><ul>${x.bullets.map((b) => `<li>${e(t(b))}</li>`).join("")}</ul></div></article>`).join(""))}${section(L.projects, "work", "05", `<div class="projects">${projects.length ? projects.map((x) => `<a class="project" href="${e(x.href)}"><div class="meta"><span>${e(x.dateText())}</span><span>${e(x.tech_stack || "PROJECT")}</span></div><h3>${e(x.localTitle())}</h3><p>${e(x.localSummary())}</p><span class="open">${e(t(L.view))} <i class="fa fa-arrow-right" aria-hidden="true"></i></span></a>`).join("") : `<p>${e(t(L.offline))}</p>`}</div>`)}${section(
              L.articles,
              "notes",
              "06",
              `<div class="filters" aria-label="Article filters">${p.articleFilters.map((x) => `<button type="button" class="filter ${filter === x.key ? "active" : ""}" data-filter="${e(x.key)}" onclick="window.CJCThemeFilter(this.dataset.filter)">${e(t(x.label))}</button>`).join("")}</div><div class="articles">${
                articles.length
                  ? CJCData.filterArticles(articles, filter)
                      .map(
                        (x) =>
                          `<a class="article" href="${e(x.href)}"><img src="${e(x.cover_image || "/index_page/img/blogs/1.jpg")}" alt="" loading="lazy" onerror="this.src='/index_page/img/blogs/1.jpg'"><div class="article-copy"><div class="meta"><span>${e(x.category || "NOTE")}</span><span>${e(x.dateText())}</span></div><h3>${e(x.localTitle())}</h3><p>${e(x.localSummary())}</p><span class="open">${e(t(L.view))}</span></div></a>`,
                      )
                      .join("")
                  : `<p>${e(t(L.offline))}</p>`
              }</div>`,
            )}${section(L.certs, "certs", "07", `<div class="certs">${p.certificates.map((x) => `<article class="cert"><img src="${e(x.image)}" alt="${e(t(x.title))}" loading="lazy"><div><small>${e(t(x.date))} / ${e(t(x.tag))}</small><h3>${e(t(x.title))}</h3><p>${e(t(x.desc))}</p></div></article>`).join("")}</div>`)}${section(L.contact, "contact", "08", `<div class="contact"><article class="contact-intro"><span class="mono">OPEN RADIO</span><h2>${e(t(L.contact))}</h2><a href="${e(p.contact.emailTo)}">${e(p.contact.email)}</a><a href="${e(p.contact.phoneHref)}">${e(p.contact.phone)}</a><a href="${e(p.contact.github)}" target="_blank" rel="noopener">${e(p.contact.githubUser)}</a></article><form class="form" id="contact-form"><div class="field"><label for="name">${e(t(L.name))}</label><input id="name" name="name" autocomplete="name" required></div><div class="field"><label for="email">${e(t(L.email))}</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="message">${e(t(L.message))}</label><textarea id="message" name="message" required></textarea></div><input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px"><button class="button lime" type="submit">${e(t(L.send))}<i class="fa fa-arrow-right" aria-hidden="true"></i></button><p class="status" id="status" aria-live="polite"></p></form></div>`)}<footer class="foot"><div class="shell"><span>${e(p.brand)} / ${e(t(p.ui.footer_desc))}</span><span><a href="${e(p.icpUrl)}" target="_blank" rel="noopener">${e(p.icp)}</a> · <a href="/admin.html">Admin Panel</a></span></div></footer>`;
          bind();
          mountProjectCovers();
          mountProfilePhoto(p);
        }
        function mountProjectCovers() {
          document.querySelectorAll(".project").forEach((card, index) => {
            const project = projects[index];
            if (!project) return;
            const cover = document.createElement("img");
            cover.className = "project-cover";
            cover.src = project.cover_image || "/index_page/img/blogs/1.jpg";
            cover.alt = "";
            cover.loading = "lazy";
            cover.addEventListener("error", () => {
              cover.src = "/index_page/img/blogs/1.jpg";
            });
            card.prepend(cover);
          });
        }
        function mountProfilePhoto(profile) {
          const photo = document.querySelector(".driver-photo img");
          if (!photo) return;
          photo.src =
            (profile.photos && profile.photos.city) ||
            profile.avatarAlt ||
            profile.avatar;
          photo.alt = t(profile.name);
        }
        function bind() {
          q("#contact-form").addEventListener("submit", async (ev) => {
            ev.preventDefault();
            const f = ev.currentTarget,
              s = q("#status"),
              b = f.querySelector("button");
            b.disabled = true;
            s.textContent = t(L.sending);
            try {
              await CJCData.sendContact({
                name: f.name.value,
                email: f.email.value,
                message: f.message.value,
                website: f.website.value,
              });
              f.reset();
              s.textContent = t(L.sent);
            } catch (err) {
              s.textContent = err.message || t(L.offline);
            } finally {
              b.disabled = false;
            }
          });
        }
        window.CJCThemeFilter = (key) => {
          filter = key || "all";
          render();
        };
        document.addEventListener("DOMContentLoaded", async () => {
          CJCData.setTheme(window.THEME_ID);
          render();
          CJCData.mountSwitcher({ accent: "#d7ff31" });
          CJCData.onLang(render);
          try {
            [articles, projects] = await Promise.all([
              CJCData.fetchArticles(),
              CJCData.fetchProjects(),
            ]);
            render();
          } catch (err) {
            render();
          }
        });
      })();
    </script>
  </body>
</html>

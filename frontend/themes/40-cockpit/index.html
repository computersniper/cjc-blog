<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Cockpit</title>
  <meta name="description" content="Cai Jiechao — flight-deck cockpit portfolio: instrument panels, gauges & MFD readouts." />
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{
      --void:#05080a; --panel:#0b0f12; --panel2:#12181f; --panel3:#181f27;
      --steel:#1b232c; --edge:#04070a;
      --accent:#37e0c8; --accent-dim:#1f6f65; --accent-deep:#04120f;
      --amber:#ffb347; --green:#4dff9b; --red:#ff5966;
      --ink:#cfe0ea; --ink-dim:#7f93a1; --ink-faint:#556673;
      --line:rgba(140,170,190,.14);
      --rivet:#3a4652;
      --glow:0 0 8px rgba(55,224,200,.55);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;color:var(--ink);
      font-family:'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace;
      line-height:1.55;font-size:15px;
      -webkit-font-smoothing:antialiased;
      background:
        radial-gradient(1100px 560px at 50% -12%, #14232e, transparent 62%),
        repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 3px, rgba(0,0,0,.03) 3px 6px),
        linear-gradient(165deg,#0b0f12,#05080a);
      background-attachment:fixed;
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    h1,h2,h3,h4{font-family:'Chakra Petch',sans-serif;margin:0;letter-spacing:.01em}
    ::selection{background:var(--accent);color:#04120f}

    /* ---- Canopy frame (decorative cockpit surround) ---- */
    .canopy{position:fixed;inset:0;pointer-events:none;z-index:50;
      box-shadow:inset 0 0 160px rgba(0,0,0,.7), inset 0 0 0 1px rgba(55,224,200,.06);}
    .canopy .c-brk{position:absolute;width:26px;height:26px;border:2px solid rgba(55,224,200,.28)}
    .canopy .tl{top:9px;left:9px;border-right:0;border-bottom:0}
    .canopy .tr{top:9px;right:9px;border-left:0;border-bottom:0}
    .canopy .bl{bottom:9px;left:9px;border-right:0;border-top:0}
    .canopy .br{bottom:9px;right:9px;border-left:0;border-top:0}

    .wrap{max-width:1220px;margin:0 auto;padding:0 20px}

    /* ---- Top HUD bar ---- */
    .hudbar{position:sticky;top:0;z-index:60;
      background:linear-gradient(180deg,#0d141b,#080c11);
      border-bottom:1px solid var(--edge);
      box-shadow:0 2px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.5);}
    .hud-inner{max-width:1220px;margin:0 auto;height:54px;display:flex;align-items:center;gap:22px;
      padding:0 20px;padding-right:200px;}
    .callsign{font-family:'Chakra Petch';font-weight:700;font-size:19px;letter-spacing:.06em;color:var(--ink);white-space:nowrap}
    .callsign b{color:var(--accent);text-shadow:var(--glow)}
    .hud-status{display:flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.16em;color:var(--ink-dim);white-space:nowrap}
    .hud-nav{display:flex;gap:4px;margin-left:auto}
    .hud-nav a{font-family:'Chakra Petch';font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;
      color:var(--ink-dim);padding:6px 10px;border:1px solid transparent;border-radius:4px;transition:.15s}
    .hud-nav a:hover{color:var(--accent);border-color:rgba(55,224,200,.3);background:rgba(55,224,200,.06)}
    @media(max-width:900px){.hud-inner{padding-right:150px}.hud-nav,.hud-status{display:none}}

    /* ---- LEDs ---- */
    .led{width:9px;height:9px;border-radius:50%;flex:0 0 auto;
      background:var(--red);box-shadow:0 0 7px var(--red), inset 0 0 2px rgba(255,255,255,.7)}
    .led.green{background:var(--green);box-shadow:0 0 7px var(--green),inset 0 0 2px rgba(255,255,255,.7)}
    .led.amber{background:var(--amber);box-shadow:0 0 7px var(--amber),inset 0 0 2px rgba(255,255,255,.7)}
    .led.blink{animation:blink 1.6s steps(1,end) infinite}
    .led.blink.slow{animation-duration:2.6s}
    @keyframes blink{0%,58%{opacity:1}60%,100%{opacity:.28}}

    /* ---- Panels (riveted metal sub-panels) ---- */
    section{padding:26px 0}
    .panel{position:relative;border-radius:9px;border:1px solid var(--edge);
      padding:20px 22px 24px;
      background:
        radial-gradient(circle at 15px 15px, var(--rivet) 0 1.6px, #0d1319 1.7px 3px, transparent 3.4px),
        radial-gradient(circle at calc(100% - 15px) 15px, var(--rivet) 0 1.6px, #0d1319 1.7px 3px, transparent 3.4px),
        radial-gradient(circle at 15px calc(100% - 15px), var(--rivet) 0 1.6px, #0d1319 1.7px 3px, transparent 3.4px),
        radial-gradient(circle at calc(100% - 15px) calc(100% - 15px), var(--rivet) 0 1.6px, #0d1319 1.7px 3px, transparent 3.4px),
        repeating-linear-gradient(92deg, rgba(255,255,255,.015) 0 2px, rgba(0,0,0,.03) 2px 4px),
        linear-gradient(158deg,#151c24,#0c1117);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05), inset 0 0 0 1px rgba(255,255,255,.015), 0 8px 22px rgba(0,0,0,.45);}
    .panel + .panel{margin-top:4px}

    /* Panel header = engraved label plate */
    .plate{display:flex;align-items:center;gap:14px;margin:0 0 18px;padding:0 4px 14px;
      border-bottom:1px dashed rgba(140,170,190,.16)}
    .plate .knob{width:26px;height:26px;border-radius:50%;flex:0 0 auto;position:relative;
      background:radial-gradient(circle at 50% 34%,#2c353f,#0c1116 78%);
      box-shadow:inset 0 1px 1px rgba(255,255,255,.14), inset 0 -2px 4px rgba(0,0,0,.7), 0 2px 4px rgba(0,0,0,.5)}
    .plate .knob::after{content:"";position:absolute;top:3px;left:50%;width:2px;height:8px;border-radius:2px;
      background:var(--accent);transform:translateX(-50%);box-shadow:var(--glow)}
    .plate .p-code{font-size:11px;letter-spacing:.18em;color:var(--accent-dim);white-space:nowrap}
    .plate h2{font-size:clamp(17px,2.4vw,23px);font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink)}
    .plate .p-leds{margin-left:auto;display:flex;gap:7px;align-items:center}
    @media(max-width:520px){.plate .p-leds{display:none}}

    /* ---- MFD hero ---- */
    .mfd{position:relative;overflow:hidden;border-radius:16px;margin-top:26px;
      border:1px solid #0c2b26;
      background:radial-gradient(120% 90% at 50% 18%, #063029, #04150f 58%, #020a08);
      box-shadow:inset 0 0 70px rgba(55,224,200,.09), inset 0 0 0 2px rgba(55,224,200,.06),
        0 0 0 4px #0a0f14, 0 24px 60px rgba(0,0,0,.6);}
    .mfd::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
      background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 2px, transparent 2px 4px);opacity:.5}
    .mfd .sweep{position:absolute;left:0;right:0;top:-40%;height:40%;pointer-events:none;z-index:2;
      background:linear-gradient(180deg, transparent, rgba(55,224,200,.12), transparent);
      animation:sweep 6.5s linear infinite}
    @keyframes sweep{0%{transform:translateY(0)}100%{transform:translateY(340%)}}
    .mfd .ruler{position:absolute;left:0;right:0;height:16px;z-index:3;pointer-events:none;
      background:repeating-linear-gradient(90deg, rgba(55,224,200,.35) 0 1px, transparent 1px 16px)}
    .mfd .ruler.top{top:0}.mfd .ruler.bot{bottom:0;transform:scaleY(-1)}
    .mfd .reticle{position:absolute;right:-40px;top:50%;transform:translateY(-50%);width:min(360px,52vw);height:min(360px,52vw);
      z-index:1;opacity:.5;color:var(--accent)}
    .mfd .reticle .spin{transform-box:view-box;transform-origin:100px 100px;animation:reti 26s linear infinite}
    @keyframes reti{to{transform:rotate(360deg)}}
    .mfd-body{position:relative;z-index:4;padding:clamp(26px,5vw,54px);max-width:760px}
    .mfd .tele{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:11px;letter-spacing:.12em;color:var(--accent);margin-bottom:20px}
    .mfd .tele span{opacity:.85}
    .greet{font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);opacity:.85}
    .mfd h1{font-size:clamp(38px,8.5vw,84px);line-height:.94;font-weight:700;margin:12px 0 0;color:#eafffb;
      letter-spacing:-.01em;text-shadow:0 0 18px rgba(55,224,200,.4)}
    .mfd .headline{font-size:clamp(16px,2.6vw,24px);color:var(--accent);margin-top:18px;font-weight:500;max-width:26ch;text-shadow:0 0 10px rgba(55,224,200,.25)}
    .mfd .subrole{margin-top:14px;color:#a9d8ce;font-size:14px;max-width:52ch}
    .mfd .cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
    .btn{display:inline-flex;align-items:center;gap:9px;font-family:'Chakra Petch';font-weight:600;
      text-transform:uppercase;letter-spacing:.1em;font-size:13px;cursor:pointer;
      padding:13px 20px;border-radius:6px;transition:.16s;border:1px solid var(--accent-dim)}
    .btn.primary{background:linear-gradient(180deg,#0c3a33,#072320);color:var(--accent);
      border-color:var(--accent);box-shadow:0 0 0 1px rgba(55,224,200,.15), 0 0 16px rgba(55,224,200,.22), inset 0 1px 0 rgba(255,255,255,.08)}
    .btn.primary:hover{background:var(--accent);color:#04120f;box-shadow:0 0 22px rgba(55,224,200,.5)}
    .btn.ghost{background:rgba(8,16,20,.5);color:var(--ink)}
    .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
    .btn .dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}

    /* ---- Grids ---- */
    .grid{display:grid;gap:14px}
    .g-about{grid-template-columns:260px 1fr;align-items:stretch}
    @media(max-width:720px){.g-about{grid-template-columns:1fr}}

    /* Portrait as instrument camera feed */
    .cam{position:relative;border-radius:8px;overflow:hidden;border:1px solid #0c2b26;background:#04120f;
      box-shadow:inset 0 0 0 3px rgba(0,0,0,.5), 0 8px 20px rgba(0,0,0,.5)}
    .cam img{width:100%;height:100%;min-height:240px;object-fit:cover;filter:contrast(1.05) saturate(1.05)}
    .cam::after{content:"";position:absolute;inset:0;pointer-events:none;
      background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 2px, transparent 2px 4px);opacity:.4}
    .cam .cam-tag{position:absolute;top:8px;left:8px;z-index:2;font-size:10px;letter-spacing:.16em;color:var(--accent);
      background:rgba(4,18,15,.75);padding:3px 7px;border-radius:3px;border:1px solid rgba(55,224,200,.3)}
    .cam .cam-brk{position:absolute;width:16px;height:16px;border:2px solid rgba(55,224,200,.6);z-index:2}
    .cam .cam-brk.a{top:6px;right:6px;border-left:0;border-bottom:0}
    .cam .cam-brk.b{bottom:6px;left:6px;border-right:0;border-top:0}

    .about-txt p{margin:0 0 13px;color:var(--ink);max-width:66ch}
    .coord{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;letter-spacing:.1em;
      color:var(--accent);background:var(--accent-deep);border:1px solid #0c2b26;padding:6px 11px;border-radius:4px;box-shadow:inset 0 0 10px rgba(55,224,200,.12)}

    /* ---- Readout (LCD style) ---- */
    .readout{font-family:'IBM Plex Mono';font-size:12px;letter-spacing:.08em;color:var(--accent);
      background:var(--accent-deep);border:1px solid #0c2b26;padding:4px 9px;border-radius:3px;white-space:nowrap;
      box-shadow:inset 0 0 8px rgba(55,224,200,.15)}
    .readout.amber{color:var(--amber);border-color:#3a2a08;background:#140d02;box-shadow:inset 0 0 8px rgba(255,179,71,.15)}

    /* ---- Education / waypoints ---- */
    .waypoints{display:flex;flex-direction:column;gap:12px}
    .wp{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:start;padding:14px;
      border:1px solid var(--line);border-radius:7px;background:rgba(8,13,18,.5)}
    .wp .wp-node{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:3px}
    .wp .wp-node .led{width:11px;height:11px}
    .wp .wp-node .tick{width:1px;flex:1;min-height:26px;background:rgba(55,224,200,.3)}
    .wp h3{font-size:16px;font-weight:600;color:var(--ink)}
    .wp .deg{font-size:13px;color:var(--accent-dim);margin-top:3px}
    .wp .note{font-size:13px;color:var(--ink-dim);margin-top:6px}
    @media(max-width:560px){.wp{grid-template-columns:auto 1fr}.wp .readout{grid-column:2;justify-self:start;margin-top:8px}}

    /* ---- Skills: gauges ---- */
    .gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
    .gauge{border:1px solid var(--line);border-radius:8px;padding:12px 10px 14px;text-align:center;
      background:radial-gradient(120% 120% at 50% 0%, #10171e, #0a0e13)}
    .gauge svg{width:100%;height:auto;display:block}
    .g-arc{fill:none;stroke:rgba(140,170,190,.16);stroke-width:5;stroke-linecap:round}
    .g-fill{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;
      stroke-dasharray:100;stroke-dashoffset:100;filter:drop-shadow(0 0 3px rgba(55,224,200,.6));
      transition:stroke-dashoffset 1.5s cubic-bezier(.2,.8,.2,1)}
    .gauge.spun .g-fill{stroke-dashoffset:var(--off)}
    .g-tick{stroke:rgba(140,170,190,.35);stroke-width:1.4}
    .g-needle{transform-box:view-box;transform-origin:60px 60px;transform:rotate(-90deg);
      transition:transform 1.5s cubic-bezier(.25,.9,.2,1)}
    .gauge.spun .g-needle{transform:rotate(var(--deg))}
    .g-needle line{stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;filter:drop-shadow(0 0 3px rgba(55,224,200,.7))}
    .g-hub{fill:#0c1116;stroke:var(--accent);stroke-width:1.6}
    .g-val{font-family:'Chakra Petch';font-size:15px;font-weight:700;fill:var(--accent)}
    .g-label{font-size:11.5px;color:var(--ink);margin-top:8px;line-height:1.35;min-height:2.6em;display:flex;align-items:center;justify-content:center}
    .g-code{font-size:10px;letter-spacing:.14em;color:var(--ink-faint);margin-top:5px}
    /* subsystem chips */
    .subsys{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:16px;border-top:1px dashed rgba(140,170,190,.16)}
    .chip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.06em;color:var(--ink);
      background:rgba(8,14,19,.7);border:1px solid var(--line);padding:6px 10px;border-radius:20px}
    .chip .led{width:7px;height:7px}

    /* ---- Courses: switch panels ---- */
    .switches{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:12px}
    .sw{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px;border:1px solid var(--line);border-radius:8px;
      background:linear-gradient(160deg,#131a21,#0b1015)}
    .sw-ctrl{display:flex;flex-direction:column;align-items:center;gap:8px}
    .toggle{width:32px;height:50px;border-radius:8px;position:relative;
      background:linear-gradient(180deg,#090d11,#04070a);border:1px solid #04070a;
      box-shadow:inset 0 2px 5px rgba(0,0,0,.8), inset 0 -1px 0 rgba(255,255,255,.05)}
    .toggle .lever{position:absolute;left:50%;top:5px;transform:translateX(-50%);width:16px;height:24px;border-radius:5px;
      background:linear-gradient(180deg,#eef3f6,#9aa7b0);
      box-shadow:0 3px 5px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.9), inset 0 -3px 4px rgba(0,0,0,.35)}
    .sw-code{font-size:9.5px;letter-spacing:.12em;color:var(--ink-faint)}
    .sw-ico{color:var(--accent);font-size:17px;margin-bottom:2px}
    .sw h4{font-family:'Chakra Petch';font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.25}
    .sw p{margin:7px 0 0;font-size:12.5px;color:var(--ink-dim);line-height:1.5}

    /* ---- Experience: mission log ---- */
    .mlog{border:1px solid var(--line);border-radius:8px;padding:16px 18px;background:rgba(8,13,18,.55)}
    .mlog + .mlog{margin-top:12px}
    .mlog .m-head{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:8px}
    .mlog h3{font-size:17px;font-weight:600;color:var(--ink)}
    .mlog .m-role{color:var(--accent)}
    .mlog .m-sum{font-size:13px;color:var(--ink-dim);margin:8px 0 14px}
    .checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
    .checklist li{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start;font-size:13px;color:var(--ink)}
    .checklist li .led{margin-top:5px;width:8px;height:8px}

    /* ---- Cards (projects / articles) ---- */
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
    .card{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:9px;overflow:hidden;
      background:linear-gradient(165deg,#121922,#0a0e13);transition:transform .16s, box-shadow .16s, border-color .16s}
    .card:hover{transform:translateY(-4px);border-color:rgba(55,224,200,.5);box-shadow:0 12px 30px rgba(0,0,0,.5), 0 0 0 1px rgba(55,224,200,.25)}
    .card .cover{position:relative;height:150px;background:#04120f;overflow:hidden;border-bottom:1px solid #0c2b26}
    .card .cover img{width:100%;height:100%;object-fit:cover;filter:contrast(1.04) saturate(1.05)}
    .card .cover::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 2px,transparent 2px 4px);opacity:.35}
    .card .cbody{padding:14px 15px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
    .card .ctag{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
    .card .ctag .cat{color:var(--accent)}
    .card .ctag .date{color:var(--ink-faint)}
    .card h4{font-family:'Chakra Petch';font-size:16px;font-weight:600;color:var(--ink);line-height:1.25}
    .card .stack{font-size:11.5px;color:var(--accent);letter-spacing:.03em}
    .card p{margin:0;font-size:12.5px;color:var(--ink-dim);line-height:1.55;flex:1}
    .card .more{font-family:'Chakra Petch';font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);
      display:inline-flex;align-items:center;gap:6px}

    /* Annunciator-style project row: reuse card, add corner bracket */
    .card .brk{position:absolute;top:8px;right:8px;width:14px;height:14px;border:2px solid rgba(55,224,200,.5);border-left:0;border-bottom:0;z-index:2}

    .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
    .filters button{font-family:'Chakra Petch';font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
      cursor:pointer;color:var(--ink-dim);background:rgba(8,13,18,.6);border:1px solid var(--line);
      padding:8px 13px;border-radius:5px;display:inline-flex;align-items:center;gap:8px;transition:.15s}
    .filters button::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-faint);box-shadow:none;transition:.15s}
    .filters button:hover{color:var(--accent);border-color:rgba(55,224,200,.4)}
    .filters button.active{color:var(--accent);border-color:var(--accent);background:rgba(55,224,200,.08)}
    .filters button.active::before{background:var(--green);box-shadow:0 0 7px var(--green)}

    .load-note{grid-column:1/-1;font-size:13px;color:var(--ink-dim);padding:16px;border:1px dashed var(--line);border-radius:8px;
      display:flex;align-items:center;gap:10px}

    /* ---- Certificates ---- */
    .certs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
    .cert{display:grid;grid-template-columns:110px 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden;
      background:linear-gradient(165deg,#121922,#0a0e13)}
    .cert .cert-frame{position:relative;background:#04120f;border-right:1px solid #0c2b26}
    .cert .cert-frame img{width:100%;height:100%;min-height:120px;object-fit:cover}
    .cert .cert-frame::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 2px,transparent 2px 4px);opacity:.35}
    .cert .cert-info{padding:14px}
    .cert .cert-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:9px;align-items:center}
    .cert .tagchip{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);
      border:1px solid #3a2a08;background:#140d02;padding:3px 8px;border-radius:3px}
    .cert h4{font-family:'Chakra Petch';font-size:15px;font-weight:600;color:var(--ink);margin-bottom:7px;line-height:1.25}
    .cert p{margin:0;font-size:12px;color:var(--ink-dim);line-height:1.5}
    @media(max-width:400px){.cert{grid-template-columns:1fr}.cert .cert-frame{min-height:120px}}

    /* ---- Contact: COMMS ---- */
    .comms{display:grid;grid-template-columns:1fr 1.15fr;gap:16px}
    @media(max-width:820px){.comms{grid-template-columns:1fr}}
    .freqs{display:flex;flex-direction:column;gap:10px}
    .freq{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;
      border:1px solid var(--line);border-radius:7px;background:rgba(8,13,18,.55);transition:.15s}
    .freq:hover{border-color:rgba(55,224,200,.4);background:rgba(55,224,200,.05)}
    .freq .f-k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim)}
    .freq .f-v{font-size:13px;color:var(--ink);text-align:right;word-break:break-all}
    .freq .led{width:9px;height:9px}
    form .field{margin-bottom:13px}
    form label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-dim);margin-bottom:6px}
    form input,form textarea{width:100%;font-family:'IBM Plex Mono';font-size:14px;color:var(--ink);
      background:var(--accent-deep);border:1px solid #0c2b26;border-radius:5px;padding:12px 13px;
      box-shadow:inset 0 0 10px rgba(0,0,0,.5)}
    form input::placeholder,form textarea::placeholder{color:var(--ink-faint)}
    form input:focus,form textarea:focus{outline:none;border-color:var(--accent);box-shadow:inset 0 0 10px rgba(55,224,200,.15),0 0 0 1px rgba(55,224,200,.3)}
    form textarea{min-height:130px;resize:vertical}
    .transmit{width:100%;justify-content:center;font-size:14px;padding:15px}
    #cf-status{margin-top:12px;font-size:13px;letter-spacing:.04em;min-height:1.2em}

    /* ---- Footer console ---- */
    footer{margin-top:8px;border-top:1px solid var(--edge);
      background:linear-gradient(180deg,#0a0f14,#06090c);padding:26px 0 40px}
    .f-strip{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
    .f-leds{display:flex;gap:8px;align-items:center}
    .f-links{display:flex;flex-wrap:wrap;gap:16px}
    .f-links a{font-size:12px;letter-spacing:.06em;color:var(--ink-dim);transition:.15s}
    .f-links a:hover{color:var(--accent)}
    .f-meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:16px;font-size:11.5px;color:var(--ink-faint)}
    .f-meta a{color:var(--ink-faint)}
    .f-meta a:hover{color:var(--accent)}

    /* ---- Focus ---- */
    a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

    /* ---- Reduced motion ---- */
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      .led.blink{animation:none;opacity:1}
      .mfd .sweep{display:none}
      .mfd .reticle .spin{animation:none}
      .g-fill{transition:none;stroke-dashoffset:var(--off)}
      .g-needle{transition:none;transform:rotate(var(--deg))}
      .card{transition:none}
    }
  </style>
</head>
<body>
  <div class="canopy" aria-hidden="true">
    <span class="c-brk tl"></span><span class="c-brk tr"></span>
    <span class="c-brk bl"></span><span class="c-brk br"></span>
  </div>

  <div class="hudbar">
    <div class="hud-inner">
      <a class="callsign" href="#top">CJC<b>-40</b></a>
      <div class="hud-status">
        <span class="led green blink slow"></span><span id="hud-sys">ALL SYSTEMS NOMINAL</span>
      </div>
      <nav class="hud-nav" id="nav" aria-label="Sections"></nav>
    </div>
  </div>

  <div id="top"></div>
  <main class="wrap">

    <!-- HERO / MFD -->
    <header class="mfd" role="banner">
      <div class="ruler top"></div>
      <div class="sweep" aria-hidden="true"></div>
      <svg class="reticle" viewBox="0 0 200 200" aria-hidden="true" fill="none" stroke="currentColor">
        <g class="spin" stroke-width="1">
          <circle cx="100" cy="100" r="72"/>
          <circle cx="100" cy="100" r="46" stroke-dasharray="4 6"/>
          <path d="M100 22 v16 M100 162 v16 M22 100 h16 M162 100 h16"/>
          <path d="M40 40 l10 0 M40 40 l0 10 M160 40 l-10 0 M160 40 l0 10 M40 160 l10 0 M40 160 l0 -10 M160 160 l-10 0 M160 160 l0 -10" stroke-width="1.4"/>
        </g>
        <circle cx="100" cy="100" r="3" fill="currentColor" stroke="none"/>
      </svg>
      <div class="mfd-body">
        <div class="tele" id="hero-tele"></div>
        <div class="greet" id="greet"></div>
        <h1 id="name"></h1>
        <div class="headline" id="headline"></div>
        <div class="subrole" id="subrole"></div>
        <div class="cta-row">
          <a class="btn primary" id="cvBtn" href="#" download><span class="dot"></span><span></span></a>
          <a class="btn ghost" id="ghBtn" target="_blank" rel="noopener"></a>
        </div>
      </div>
      <div class="ruler bot"></div>
    </header>

    <!-- ABOUT -->
    <section id="about"><div class="panel">
      <div class="plate"><span class="knob"></span><span class="p-code" id="c-about">PNL·01</span><h2 id="l-about"></h2>
        <span class="p-leds"><span class="led green"></span><span class="led amber"></span></span></div>
      <div class="grid g-about">
        <div class="cam">
          <span class="cam-tag">CAM-01 · PILOT</span>
          <span class="cam-brk a"></span><span class="cam-brk b"></span>
          <img id="portrait" alt="" />
        </div>
        <div class="about-txt" id="about-txt"></div>
      </div>
    </div></section>

    <!-- EDUCATION -->
    <section id="education"><div class="panel">
      <div class="plate"><span class="knob"></span><span class="p-code">PNL·02</span><h2 id="l-edu"></h2>
        <span class="p-leds"><span class="led green"></span></span></div>
      <div class="waypoints" id="edu-list"></div>
    </div></section>

    <!-- SKILLS -->
    <section id="skills"><div class="panel">
      <div class="plate"><span class="knob"></span><span class="p-code">PNL·03</span><h2 id="l-skills"></h2>
        <span class="p-leds"><span class="led green blink"></span><span class="led green"></span><span class="led amber"></span></span></div>
      <div class="gauges" id="gauges"></div>
      <div class="subsys" id="subsys"></div>
    </div></section>

    <!-- COURSES -->
    <section id="courses"><div class="panel">
      <div class="plate"><span class="knob"></span><span class="p-code">PNL·04</span><h2 id="l-courses"></h2>
        <span class="p-leds"><span class="led green"></span><span class="led green"></span></span></div>
      <div class="switches" id="courses-list"></div>
    </div></section>

    <!-- EXPERIENCE -->
    <section id="experience"><div class="panel">
      <div class="plate"><span class="knob"></span><span class="p-code">PNL·05</span><h2 id="l-exp"></h2>
        <span class="p-leds"><span class="led amber blink"></span><span class="led green"></span></span></div>
      <div id="exp-list"></div>
    </div></section>

    <!-- PROJECTS -->
    <section id="projects"><div class="panel">
      <div class="plate"><span class="knob"></span><span class="p-code">PNL·06</span><h2 id="l-projects"></h2>
        <span class="p-leds"><span class="led green"></span></span></div>
      <div class="cards" id="projects-list"><div class="load-note"><span class="led amber blink"></span><span id="proj-load"></span></div></div>
    </div></section>

    <!-- ARTICLES -->
    <section id="articles"><div class="panel">
      <div class="plate"><span class="knob"></span><span class="p-code">PNL·07</span><h2 id="l-articles"></h2>
        <span class="p-leds"><span class="led green blink"></span></span></div>
      <div class="filters" id="filters"></div>
      <div class="cards" id="articles-list"><div class="load-note"><span class="led amber blink"></span><span id="art-load"></span></div></div>
    </div></section>

    <!-- CERTIFICATES -->
    <section id="certificates"><div class="panel">
      <div class="plate"><span class="knob"></span><span class="p-code">PNL·08</span><h2 id="l-certs"></h2>
        <span class="p-leds"><span class="led green"></span><span class="led green"></span></span></div>
      <div class="certs" id="certs-list"></div>
    </div></section>

    <!-- CONTACT -->
    <section id="contact"><div class="panel">
      <div class="plate"><span class="knob"></span><span class="p-code">PNL·09</span><h2 id="l-contact"></h2>
        <span class="p-leds"><span class="led green blink"></span><span id="comms-lbl" style="font-size:10px;letter-spacing:.16em;color:var(--ink-faint)">COMMS</span></span></div>
      <div class="comms">
        <div class="freqs" id="contact-info"></div>
        <form id="cf" novalidate>
          <input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
          <div class="field"><label id="lb-name" for="cf-name"></label><input type="text" name="name" id="cf-name" required></div>
          <div class="field"><label id="lb-email" for="cf-email"></label><input type="email" name="email" id="cf-email" required></div>
          <div class="field"><label id="lb-msg" for="cf-msg"></label><textarea name="message" id="cf-msg" required></textarea></div>
          <button type="submit" class="btn primary transmit" id="cf-send"><span class="dot"></span><span></span></button>
          <p id="cf-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div></section>
  </main>

  <footer><div class="wrap">
    <div class="f-strip">
      <a class="callsign" href="#top" style="font-size:16px">CJC<b>-40</b></a>
      <div class="f-leds" id="f-leds"></div>
      <div class="f-links" id="foot-social"></div>
    </div>
    <div class="f-meta">
      <span id="foot-desc"></span>
      <a id="foot-icp" target="_blank" rel="noopener"></a>
    </div>
  </div></footer>

  <script>window.THEME_ID = "40-cockpit";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";
    const GVALS = [88, 74, 93, 81, 69, 96]; // decorative instrument readouts for the 6 skill systems

    // --- Gauge SVG builder -------------------------------------------------
    function gaugeSVG(val){
      const ang = (val/100)*180 - 90;
      // ticks along the arc (11 marks)
      let ticks = "";
      for(let i=0;i<=10;i++){
        const a = Math.PI - (i/10)*Math.PI;           // 180deg -> 0deg
        const x1 = 60 + 47*Math.cos(a), y1 = 60 - 47*Math.sin(a);
        const x2 = 60 + 41*Math.cos(a), y2 = 60 - 41*Math.sin(a);
        ticks += `<line class="g-tick" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
      }
      return `<svg viewBox="0 0 120 78" role="img" aria-label="${val} percent">
        <path class="g-arc" d="M14 60 A46 46 0 0 1 106 60"/>
        <path class="g-fill" pathLength="100" style="--off:${100-val}" d="M14 60 A46 46 0 0 1 106 60"/>
        ${ticks}
        <g class="g-needle" style="--deg:${ang}deg"><line x1="60" y1="60" x2="60" y2="20"/></g>
        <circle class="g-hub" cx="60" cy="60" r="4.5"/>
        <text class="g-val" x="60" y="74" text-anchor="middle">${val}%</text>
      </svg>`;
    }

    function spinGauges(){
      const gs = Array.prototype.slice.call(document.querySelectorAll('.gauge:not(.spun)'));
      if(!('IntersectionObserver' in window)){ requestAnimationFrame(()=>gs.forEach(g=>g.classList.add('spun'))); return; }
      const io = new IntersectionObserver((ents,o)=>{
        ents.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('spun'); o.unobserve(e.target); } });
      },{threshold:.35});
      gs.forEach(g=>io.observe(g));
    }

    function renderStatic(){
      const lang = CJCData.lang();
      document.title = (lang==="zh" ? "蔡杰超" : "Cai Jiechao") + " — Cockpit";

      // nav
      document.getElementById('nav').innerHTML = [
        ['about','nav_about'],['skills','core_tech'],['courses','nav_courses'],
        ['projects','nav_portfolio'],['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');
      document.getElementById('hud-sys').textContent = (lang==="zh" ? "系统全部正常" : "ALL SYSTEMS NOMINAL");

      // hero
      document.getElementById('hero-tele').innerHTML =
        `<span>◈ ${esc(t(P.role))}</span><span>HDG 037</span><span>ALT 24800</span><span>◉ ${esc(t(P.location))}</span>`;
      document.getElementById('greet').textContent = t(P.greeting);
      document.getElementById('name').textContent = t(P.name);
      document.getElementById('headline').textContent = t(P.headline);
      document.getElementById('subrole').textContent = t(P.title);
      const cv = document.getElementById('cvBtn');
      cv.querySelector('span:last-child').textContent = t(P.ui.download_cv); cv.href = t(P.cv);
      const gh = document.getElementById('ghBtn');
      gh.textContent = "GitHub ↗"; gh.href = P.contact.github;

      // section labels
      document.getElementById('l-about').textContent = t(P.ui.about_me);
      document.getElementById('l-edu').textContent = t(P.ui.education_bg);
      document.getElementById('l-skills').textContent = t(P.ui.core_tech);
      document.getElementById('l-courses').textContent = t(P.ui.core_courses);
      document.getElementById('l-exp').textContent = t(P.ui.internship_exp);
      document.getElementById('l-projects').textContent = t(P.ui.latest_projects);
      document.getElementById('l-articles').textContent = t(P.ui.latest_articles);
      document.getElementById('l-certs').textContent = t(P.ui.certificates);
      document.getElementById('l-contact').textContent = t(P.ui.get_in_touch);

      // about
      const pic = document.getElementById('portrait');
      pic.src = P.avatar; pic.alt = t(P.name);
      document.getElementById('about-txt').innerHTML =
        P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('') +
        `<span class="coord"><span class="led green"></span>${esc(t(P.location))} · 23.13°N 113.26°E</span>`;

      // education -> waypoints
      document.getElementById('edu-list').innerHTML = P.education.map((e,i)=>`
        <div class="wp">
          <div class="wp-node"><span class="led ${i===0?'green':'amber'}"></span>${i<P.education.length-1?'<span class="tick"></span>':''}</div>
          <div>
            <h3>${esc(t(e.school))}</h3>
            <div class="deg">${esc(t(e.degree))}</div>
            <div class="note">${esc(t(e.note))}</div>
          </div>
          <span class="readout">${esc(e.period)}</span>
        </div>`).join('');

      // skills -> gauges + subsystem chips
      document.getElementById('gauges').innerHTML = P.skills.map((s,i)=>{
        const v = GVALS[i % GVALS.length];
        return `<div class="gauge">${gaugeSVG(v)}<div class="g-label">${esc(s)}</div>
          <div class="g-code">SYS-${String(i+1).padStart(2,'0')}</div></div>`;
      }).join('');
      document.getElementById('subsys').innerHTML = P.skillTags.map(tag=>
        `<span class="chip"><span class="led green"></span>${esc(tag)}</span>`).join('');
      spinGauges();

      // courses -> switch panels
      document.getElementById('courses-list').innerHTML = P.courses.map((c,i)=>`
        <div class="sw">
          <div class="sw-ctrl">
            <div class="toggle"><span class="lever"></span></div>
            <span class="led green"></span>
            <span class="sw-code">SW-${String(i+1).padStart(2,'0')}</span>
          </div>
          <div>
            <div class="sw-ico"><i class="fa ${esc(c.icon)}" aria-hidden="true"></i></div>
            <h4>${esc(t(c.title))}</h4>
            <p>${esc(t(c.desc))}</p>
          </div>
        </div>`).join('');

      // experience -> mission log
      document.getElementById('exp-list').innerHTML = P.experience.map(x=>`
        <div class="mlog">
          <div class="m-head">
            <span class="led green blink"></span>
            <h3><span class="m-role">${esc(t(x.role))}</span> · ${esc(t(x.company))}</h3>
            <span class="readout amber" style="margin-left:auto">${esc(x.period)}</span>
          </div>
          <div class="m-sum">${esc(t(x.summary))}</div>
          <ul class="checklist">
            ${x.bullets.map(b=>`<li><span class="led green"></span><span>${esc(t(b))}</span></li>`).join('')}
          </ul>
        </div>`).join('');

      // certificates
      document.getElementById('certs-list').innerHTML = P.certificates.map(c=>`
        <div class="cert">
          <div class="cert-frame"><img src="${esc(c.image)}" alt="${esc(t(c.title))}" onerror="this.src='/index_page/img/blogs/1.jpg'"></div>
          <div class="cert-info">
            <div class="cert-meta"><span class="tagchip">${esc(t(c.tag))}</span><span class="readout">${esc(t(c.date))}</span></div>
            <h4>${esc(t(c.title))}</h4>
            <p>${esc(t(c.desc))}</p>
          </div>
        </div>`).join('');

      // contact freqs
      document.getElementById('contact-info').innerHTML = [
        ['Email', P.contact.email, 'mailto:'+P.contact.email, 'green'],
        ['Phone', P.contact.phone, P.contact.phoneHref, 'green'],
        ['GitHub', '@'+P.contact.githubUser, P.contact.github, 'green'],
        ['WeChat', 'QR ↗', P.contact.wechatQrPage, 'amber'],
      ].map(([k,v,h,c])=>`<a class="freq" href="${esc(h)}" target="_blank" rel="noopener">
        <span class="led ${c}"></span><span class="f-k">${esc(k)}</span><span class="f-v">${esc(v)}</span></a>`).join('');
      document.getElementById('lb-name').textContent = t(P.ui.name_placeholder);
      document.getElementById('lb-email').textContent = t(P.ui.email_placeholder);
      document.getElementById('lb-msg').textContent = t(P.ui.msg_placeholder);
      document.getElementById('cf-name').placeholder = t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder = t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder = t(P.ui.msg_placeholder);
      document.getElementById('cf-send').querySelector('span:last-child').textContent =
        (CJCData.lang()==="zh" ? "发送信号" : "TRANSMIT");

      // footer
      document.getElementById('f-leds').innerHTML =
        '<span class="led green"></span><span class="led green blink slow"></span><span class="led amber"></span>';
      document.getElementById('foot-social').innerHTML =
        `<a href="${esc(P.contact.github)}" target="_blank" rel="noopener">GitHub</a>
         <a href="mailto:${esc(P.contact.email)}">Email</a>
         <a href="${esc(P.contact.wechatQrPage)}" target="_blank" rel="noopener">WeChat</a>
         <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent = t(P.ui.footer_desc);
      const icp = document.getElementById('foot-icp'); icp.textContent = P.icp; icp.href = P.icpUrl;

      // filters (channel select)
      document.getElementById('filters').innerHTML = P.articleFilters.map(f=>
        `<button type="button" data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey = b.dataset.k;
        document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active', x.dataset.k===filterKey));
        renderArticles();
      }));
    }

    function renderProjects(){
      const box = document.getElementById('projects-list');
      if(!projects.length){ box.innerHTML = `<div class="load-note"><span class="led amber"></span>${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML = projects.map(p=>`
        <a class="card" href="${esc(p.href)}">
          <span class="brk"></span>
          <div class="cbody">
            <div class="ctag"><span class="cat">${esc(t(P.ui.tech_stack))}</span><span class="date">${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <div class="stack">${esc(p.tech_stack||'')}</div>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div></a>`).join('');
    }

    function renderArticles(){
      const box = document.getElementById('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML = `<div class="load-note"><span class="led amber"></span>${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML = list.map(a=>`
        <a class="card" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${esc(a.localTitle())}"></div>
          <div class="cbody">
            <div class="ctag"><span class="cat">${esc(a.category||'')}</span><span class="date">${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div></a>`).join('');
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML =
        `<div class="load-note"><span class="led red"></span>${esc(t(P.ui.no_projects))} · 内容加载失败</div>`; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-list').innerHTML =
        `<div class="load-note"><span class="led red"></span>Failed to load · 内容加载失败</div>`; }
    }

    // Contact submit
    document.getElementById('cf').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      const payload = { name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color = 'var(--amber)'; s.textContent = '◉ ' + t(P.ui.sending);
      try{
        const r = await CJCData.sendContact(payload);
        s.style.color = 'var(--green)'; s.textContent = '✓ ' + (r.message || 'Signal transmitted.'); f.reset();
      }catch(err){ s.style.color = 'var(--red)'; s.textContent = '✕ ' + err.message; }
    });

    // Font Awesome 4 for course icons
    const fa = document.createElement('link');
    fa.rel = 'stylesheet';
    fa.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css';
    document.head.appendChild(fa);

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:'#37e0c8' });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>

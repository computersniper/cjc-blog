<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — The Keep</title>
  <meta name="description" content="Enter a torch-lit castle and explore its rooms — Great Hall, Library, Armory, Throne Room and more. The personal site of Cai Jiechao, as a keep." />
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Cinzel+Decorative:wght@700;900&family=MedievalSharp&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{
      --stone0:#211d18; --stone1:#2b2620; --stone2:#37312a; --stone-hi:#463f34; --mortar:#141110;
      --gold:#c9a24a; --gold2:#e6c877; --gold-dim:#8a6f30;
      --red:#8f2d2d; --red2:#b24141; --blue:#2e4a7a; --green:#2f5a3a; --flame:#ff9d3c; --flame2:#ffd27a;
      --parch:#e9d9b2; --parch2:#ddc99a; --parch-edge:#c9b078; --ink:#3a2c14; --ink2:#5a4626;
      --cream:#ede2c9; --mut:#a99c82; --line:rgba(201,162,74,.30);
      --disp:'Cinzel',Georgia,serif; --deco:'Cinzel Decorative',Georgia,serif;
      --med:'MedievalSharp',cursive; --body:'EB Garamond',Georgia,'Songti SC',serif;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;color:var(--cream);font-family:var(--body);font-size:19px;line-height:1.7;overflow-x:hidden;
      background:var(--stone0);}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    h1,h2,h3,h4{font-family:var(--disp);font-weight:600;margin:0;letter-spacing:.02em}
    ::selection{background:var(--gold);color:#241a06}
    :focus-visible{outline:2px solid var(--gold2);outline-offset:3px;border-radius:2px}

    /* ---------- stone wall background (fixed) ---------- */
    .wall{position:fixed;inset:0;z-index:0;pointer-events:none;
      background-color:var(--stone1);
      background-image:
        radial-gradient(120% 80% at 50% -10%, rgba(201,162,74,.06), transparent 55%),
        radial-gradient(100% 100% at 50% 120%, rgba(0,0,0,.55), transparent 60%),
        repeating-linear-gradient(0deg, var(--mortar) 0 3px, transparent 3px 76px),
        repeating-linear-gradient(90deg, var(--mortar) 0 3px, transparent 3px 128px),
        linear-gradient(180deg,var(--stone2),var(--stone1) 40%,var(--stone0));
    }
    /* offset every other row of blocks with a second mortar layer */
    .wall::before{content:"";position:absolute;inset:0;
      background-image:repeating-linear-gradient(90deg, var(--mortar) 0 3px, transparent 3px 128px);
      background-position:64px 38px;background-size:128px 152px;opacity:.6}
    .wall-tex{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.06;mix-blend-mode:overlay}

    /* torch light following the cursor (dungeon vignette) */
    .torchlight{position:fixed;inset:0;z-index:6;pointer-events:none;
      background:radial-gradient(circle 460px at var(--mx,50%) var(--my,42%),
        rgba(255,180,90,.10) 0%, transparent 30%, rgba(12,8,4,.42) 100%);transition:background .1s linear}
    body.calm .torchlight{background:radial-gradient(circle 620px at 50% 40%, transparent 0%, rgba(12,8,4,.3) 100%)}

    /* ---------- wall torches ---------- */
    .torch{position:fixed;z-index:7;width:26px;height:78px;pointer-events:none}
    .torch.l{left:14px;top:44%}.torch.r{right:14px;top:44%}
    @media(max-width:1040px){.torch{display:none}}
    .torch .stick{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:8px;height:44px;border-radius:3px;
      background:linear-gradient(180deg,#5a3d21,#3a2713)}
    .torch .bowl{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:22px;height:12px;border-radius:0 0 12px 12px;
      background:linear-gradient(180deg,#6a4a24,#3a2713)}
    .torch .flame{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:20px;height:34px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
      background:radial-gradient(circle at 50% 70%,var(--flame2),var(--flame) 45%,#e2531d 80%,transparent 100%);
      filter:blur(.4px);transform-origin:50% 100%;animation:flicker 1.6s ease-in-out infinite;
      box-shadow:0 0 26px 10px rgba(255,140,50,.4)}
    .torch .flame::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:9px;height:18px;border-radius:50%;
      background:radial-gradient(circle at 50% 70%,#fff2c8,#ffce6b 60%,transparent);animation:flicker 1.1s ease-in-out infinite reverse}
    @keyframes flicker{0%,100%{transform:translateX(-50%) scale(1) rotate(-1deg)}25%{transform:translateX(-52%) scale(1.06,.96)}50%{transform:translateX(-50%) scale(.95,1.08) rotate(1deg)}75%{transform:translateX(-48%) scale(1.03,.98)}}

    /* arched window with a passing dragon shadow */
    .window{position:fixed;right:5%;top:78px;z-index:2;width:96px;height:150px;pointer-events:none;
      border:6px solid #1a1510;border-radius:48px 48px 6px 6px;overflow:hidden;
      background:linear-gradient(180deg,#4a6a8f,#7b93ac 60%,#9fb0c0);box-shadow:inset 0 0 24px rgba(0,0,0,.5),0 0 0 3px #322a20}
    .window::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%);background:#1a1510}
    .window::after{content:"";position:absolute;left:0;right:0;top:52%;height:4px;background:#1a1510}
    .window .moon{position:absolute;left:22px;top:20px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#dfe6ee);opacity:.85}
    .dragon{position:absolute;top:34px;left:-70px;width:60px;height:30px;opacity:.9;color:#0d0b09;
      animation:dragonFly 22s linear infinite}
    @keyframes dragonFly{0%,72%{transform:translateX(-40px) scaleX(1)}80%{transform:translateX(150px) scaleX(1)}80.01%,100%{transform:translateX(150px)}}
    @media(max-width:900px){.window{width:64px;height:104px;right:4%;top:64px}}
    @media(max-width:560px){.window{display:none}}

    /* ---------- entrance gate overlay ---------- */
    .gate{position:fixed;inset:0;z-index:9000;background:linear-gradient(180deg,#0c0906,#160f09);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:24px;
      transition:opacity .9s ease,visibility .9s ease}
    .gate.open{opacity:0;visibility:hidden;pointer-events:none}
    .gate-arch{position:relative;width:min(360px,80vw);height:min(300px,54vh)}
    .portcullis{position:absolute;inset:0;z-index:3;border-radius:180px 180px 0 0;overflow:hidden;
      transition:transform 1.15s cubic-bezier(.5,0,.2,1)}
    .gate.raising .portcullis{transform:translateY(-104%)}
    .portcullis .bars{position:absolute;inset:0;
      background:
        repeating-linear-gradient(90deg,#3a3128 0 6px,transparent 6px 34px),
        repeating-linear-gradient(0deg,#3a3128 0 6px,transparent 6px 34px);
      filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
    .portcullis .frame{position:absolute;inset:0;border:8px solid #2a2018;border-radius:180px 180px 0 0}
    .gate .stone-arch{position:absolute;inset:-14px;border-radius:190px 190px 0 0;border:14px solid var(--stone2);z-index:1;
      box-shadow:inset 0 0 0 3px var(--mortar)}
    .gate-title{font-family:var(--deco);color:var(--gold2);font-size:clamp(26px,5vw,44px);letter-spacing:.04em;
      text-shadow:0 2px 14px rgba(255,160,60,.4)}
    .gate-sub{font-family:var(--med);color:var(--cream);font-size:15px;letter-spacing:.24em;text-transform:uppercase;opacity:.85;margin-top:-10px}
    .enter-btn{font-family:var(--disp);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:15px;
      color:#241a06;background:linear-gradient(180deg,var(--gold2),var(--gold));border:1px solid var(--gold-dim);
      border-radius:6px;padding:13px 30px;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.5);transition:.18s}
    .enter-btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(201,162,74,.4)}
    .gate-torch{position:absolute;bottom:-6px;width:24px;height:60px}
    .gate-torch.gl{left:8%}.gate-torch.gr{right:8%}

    /* ---------- top: banners + coat of arms + brand ---------- */
    .keep-top{position:relative;z-index:8;padding:0 22px}
    .keep-top-inner{max-width:1180px;margin:0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-top:14px}
    @media(min-width:1041px){.keep-top-inner{padding-right:200px}}
    .crest{display:flex;align-items:center;gap:14px}
    .shield{width:52px;height:60px;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
    .crest .bt b{font-family:var(--deco);color:var(--gold2);font-size:22px;letter-spacing:.06em;line-height:1;display:block}
    .crest .bt small{font-family:var(--med);color:var(--mut);font-size:12px;letter-spacing:.2em}
    .banners{display:flex;gap:10px}
    .banner{width:44px;padding:8px 0 0;text-align:center;color:var(--gold2);font-size:18px;position:relative;
      background:linear-gradient(180deg,var(--red),#6e2020);clip-path:polygon(0 0,100% 0,100% 84%,50% 100%,0 84%);
      box-shadow:0 6px 14px rgba(0,0,0,.4);height:64px}
    .banner:nth-child(2){background:linear-gradient(180deg,var(--blue),#1e3357)}
    .banner:nth-child(3){background:linear-gradient(180deg,var(--green),#1f3d28)}
    .banner i{opacity:.9}
    @media(max-width:640px){.banners{display:none}}
    @media(max-width:560px){.crest .bt{display:none}}

    /* ---------- room navigation (torches/tabs) ---------- */
    .roomnav{position:relative;z-index:8;max-width:1180px;margin:14px auto 0;padding:0 22px}
    .roomnav-inner{display:flex;gap:8px;overflow-x:auto;padding:10px 4px;scrollbar-width:thin;scrollbar-color:var(--gold-dim) transparent}
    .roomnav-inner::-webkit-scrollbar{height:6px}
    .roomnav-inner::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:3px}
    .rtab{flex:none;display:inline-flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;
      background:linear-gradient(180deg,var(--stone2),var(--stone1));border:1px solid var(--line);border-radius:8px;
      padding:9px 14px;min-width:88px;color:var(--cream);transition:.16s;font-family:var(--disp);position:relative}
    .rtab .ti{font-size:17px;color:var(--gold);transition:.16s}
    .rtab .tn{font-size:12px;letter-spacing:.04em;font-weight:600;white-space:nowrap}
    .rtab:hover{border-color:var(--gold);transform:translateY(-2px)}
    .rtab.active{background:linear-gradient(180deg,#4a3f28,#3a3019);border-color:var(--gold);box-shadow:0 0 18px rgba(201,162,74,.3)}
    .rtab.active .ti{color:var(--gold2);text-shadow:0 0 12px rgba(255,170,70,.6)}
    .rtab.active::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--gold2);border-radius:2px}
    .mapbtn{flex:none;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1px solid var(--gold-dim);
      background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--ink);border-radius:8px;padding:9px 16px;
      font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-left:auto}
    .mapbtn:hover{filter:brightness(1.05)}

    /* castle map panel */
    .map-panel{position:relative;z-index:8;max-width:1180px;margin:8px auto 0;padding:0 22px;
      max-height:0;overflow:hidden;transition:max-height .4s ease}
    .map-panel.open{max-height:360px}
    .map-inner{background:linear-gradient(180deg,var(--parch),var(--parch2));border:2px solid var(--parch-edge);border-radius:10px;
      padding:16px 18px;box-shadow:0 14px 34px rgba(0,0,0,.5)}
    .map-inner .maph{font-family:var(--med);color:var(--ink);text-align:center;font-size:16px;letter-spacing:.12em;margin-bottom:12px}
    .map-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    @media(max-width:620px){.map-grid{grid-template-columns:repeat(2,1fr)}}
    .mroom{cursor:pointer;border:1.5px dashed var(--ink2);border-radius:7px;padding:12px 8px;text-align:center;color:var(--ink);
      background:rgba(255,255,255,.25);transition:.15s;font-family:var(--disp)}
    .mroom .mi{font-size:16px;color:var(--gold-dim);display:block;margin-bottom:4px}
    .mroom .mnm{font-size:12.5px;font-weight:600;line-height:1.2}
    .mroom:hover{background:rgba(201,162,74,.22);border-style:solid}
    .mroom.active{background:var(--ink);color:var(--parch);border-color:var(--ink)}
    .mroom.active .mi{color:var(--gold2)}

    /* ---------- chamber (rooms) ---------- */
    .chamber{position:relative;z-index:4;max-width:960px;margin:22px auto 60px;padding:0 22px;min-height:60vh}
    .room{display:none}
    .room.active{display:block}
    body.calm .room{display:block!important;margin-bottom:34px}

    /* proclamation scroll (parchment) */
    .scroll{position:relative;background:
        radial-gradient(120% 100% at 50% 0%, #f2e5c4, var(--parch) 60%, var(--parch2)) ;
      color:var(--ink);border-radius:6px;padding:40px 46px 44px;margin:18px 0;
      box-shadow:0 22px 54px rgba(0,0,0,.55), inset 0 0 60px rgba(150,110,50,.18);
      border-left:2px solid var(--parch-edge);border-right:2px solid var(--parch-edge)}
    .scroll::before,.scroll::after{content:"";position:absolute;left:-8px;right:-8px;height:22px;
      background:linear-gradient(180deg,#6a4a24,#3a2713);border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.5)}
    .scroll::before{top:-12px}.scroll::after{bottom:-12px}
    .room.active .scroll{animation:unfurl .55s cubic-bezier(.2,.8,.2,1)}
    @keyframes unfurl{from{opacity:0;transform:scaleY(.7) translateY(-12px);transform-origin:top}to{opacity:1;transform:scaleY(1)}}
    body.calm .room .scroll{animation:none}
    @media(max-width:560px){.scroll{padding:30px 22px 34px}}

    .room-head{text-align:center;margin-bottom:6px}
    .room-head .rk{font-family:var(--med);color:var(--gold-dim);font-size:14px;letter-spacing:.22em;text-transform:uppercase}
    .room-head h2{font-family:var(--deco);font-size:clamp(28px,4.6vw,46px);color:var(--ink);margin:2px 0 0}
    .rule{height:14px;margin:12px auto 26px;max-width:280px;color:var(--gold-dim);
      background:linear-gradient(90deg,transparent,currentColor 45%,currentColor 55%,transparent);
      -webkit-mask:radial-gradient(circle at center,#000 2px,transparent 2.5px) center/14px 14px;height:2px}
    .rule-orn{text-align:center;color:var(--gold-dim);font-size:18px;letter-spacing:.6em;margin:8px 0 24px}

    /* great hall / hero */
    .hall{text-align:center}
    .hall .coat{width:120px;height:140px;margin:0 auto 10px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4))}
    .hall .greet{font-family:var(--med);color:var(--gold-dim);font-size:20px}
    .hall h1{font-family:var(--deco);font-size:clamp(38px,7vw,74px);color:var(--ink);line-height:1;margin:4px 0 6px}
    .hall .role{font-family:var(--disp);font-weight:600;font-size:20px;color:var(--red)}
    .hall .tag{color:var(--ink2);font-size:19px;max-width:46ch;margin:14px auto 22px}
    .btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
    .btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--disp);font-weight:700;letter-spacing:.06em;
      font-size:15px;padding:12px 26px;border-radius:6px;cursor:pointer;transition:.18s;border:1px solid transparent;text-transform:uppercase}
    .btn.pri{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#241a06;border-color:var(--gold-dim);
      box-shadow:0 8px 20px rgba(0,0,0,.35)}
    .btn.pri:hover{transform:translateY(-2px)}
    .btn.gho{border-color:var(--ink2);color:var(--ink);background:rgba(255,255,255,.2)}
    .btn.gho:hover{background:rgba(201,162,74,.2);transform:translateY(-2px)}

    /* about (library) */
    .about{display:grid;grid-template-columns:220px 1fr;gap:30px;align-items:start}
    @media(max-width:660px){.about{grid-template-columns:1fr;justify-items:center;text-align:center}}
    .portrait-frame{position:relative;padding:12px;background:linear-gradient(135deg,#7a5a2a,#4a3717);border-radius:6px;
      box-shadow:0 14px 30px rgba(0,0,0,.4)}
    .portrait-frame::after{content:"";position:absolute;inset:6px;border:2px solid var(--gold);border-radius:3px;pointer-events:none;opacity:.6}
    .portrait-frame img{width:100%;aspect-ratio:.85;object-fit:cover;border-radius:2px;filter:sepia(.15) contrast(1.03)}
    .about p{margin:0 0 14px;font-size:19px;color:var(--ink)}
    @media(min-width:661px){.about p{text-align:left}}
    .loc{display:inline-flex;gap:8px;align-items:center;color:var(--red);font-family:var(--disp);font-weight:600;font-size:17px}
    .subhead{font-family:var(--med);color:var(--gold-dim);font-size:16px;letter-spacing:.14em;text-transform:uppercase;
      margin:26px 0 12px;text-align:center;border-top:1px solid var(--parch-edge);padding-top:18px}

    /* rows (education / experience) */
    .rows{display:flex;flex-direction:column;gap:20px}
    .rowi{padding-left:30px;position:relative}
    .rowi::before{content:"\2694";position:absolute;left:0;top:0;color:var(--gold-dim);font-size:19px}
    .rowi .p{font-family:var(--disp);color:var(--red);font-weight:600;font-size:15px;letter-spacing:.04em}
    .rowi h3{margin:2px 0 4px;font-size:22px;color:var(--ink);font-family:var(--disp)}
    .rowi .s{color:var(--ink2);font-size:17px}
    .rowi ul{margin:10px 0 0;padding-left:20px;line-height:1.8}
    .rowi ul li{margin-bottom:4px;color:var(--ink2)}

    /* skills (armory) */
    .arsenal{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    @media(max-width:640px){.arsenal{grid-template-columns:1fr 1fr}}
    @media(max-width:420px){.arsenal{grid-template-columns:1fr}}
    .weapon{text-align:center;padding:16px 12px;border:1px solid var(--parch-edge);border-radius:8px;
      background:rgba(255,255,255,.28);transition:.16s}
    .weapon:hover{transform:translateY(-3px);border-color:var(--gold-dim);box-shadow:0 10px 22px rgba(80,50,10,.2)}
    .weapon .wi{font-size:20px;color:var(--gold-dim)}
    .weapon .wv{margin-top:6px;font-family:var(--disp);font-size:16px;font-weight:600;color:var(--ink)}
    .tags{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:20px}
    .tags span{font-family:var(--disp);font-weight:600;font-size:14px;padding:6px 14px;border-radius:5px;
      border:1px solid var(--gold-dim);color:var(--ink);background:rgba(201,162,74,.14);transition:.15s}
    .tags span:hover{background:var(--gold);color:#241a06;transform:translateY(-2px)}

    /* courses (training) */
    .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:6px}
    @media(max-width:760px){.courses{grid-template-columns:1fr 1fr}}
    @media(max-width:480px){.courses{grid-template-columns:1fr}}
    .course{padding:20px;border:1px solid var(--parch-edge);border-radius:8px;text-align:center;transition:.16s;background:rgba(255,255,255,.24)}
    .course:hover{transform:translateY(-4px);box-shadow:0 14px 26px rgba(80,50,10,.22)}
    .course i.fa{color:var(--red);font-size:24px}
    .course h4{margin:12px 0 8px;font-size:18px;color:var(--ink);font-family:var(--disp)}
    .course p{margin:0;color:var(--ink2);font-size:16px}

    /* tapestry cards (projects + articles) */
    .gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
    @media(max-width:640px){.gallery{grid-template-columns:1fr}}
    .tapestry{position:relative;background:linear-gradient(135deg,#7a5a2a,#4a3717);padding:10px 10px 0;border-radius:6px;
      box-shadow:0 14px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;overflow:hidden}
    .tapestry:hover{transform:translateY(-5px);box-shadow:0 22px 42px rgba(0,0,0,.5)}
    .tapestry .art{height:172px;overflow:hidden;background:#2b2620;border-radius:3px}
    .tapestry .art img{width:100%;height:100%;object-fit:cover;transition:.5s;filter:sepia(.12) contrast(1.04)}
    .tapestry:hover .art img{transform:scale(1.06)}
    .tapestry .plate{background:linear-gradient(180deg,var(--parch),var(--parch2));padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
    .tapestry .meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--disp);font-weight:600;font-size:12px;
      color:var(--red);text-transform:uppercase;letter-spacing:.05em}
    .tapestry h4{font-family:var(--disp);font-size:19px;color:var(--ink);line-height:1.22}
    .tapestry .tech{font-family:var(--body);font-style:italic;color:var(--gold-dim);font-weight:600;font-size:15px}
    .tapestry p{margin:0;color:var(--ink2);font-size:15px;line-height:1.5}
    .tapestry .more{font-family:var(--disp);color:var(--red);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin-top:2px}

    .filters{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-bottom:22px}
    .filters button{font-family:var(--disp);font-weight:600;font-size:14px;background:rgba(255,255,255,.24);border:1px solid var(--parch-edge);
      color:var(--ink2);padding:6px 16px;border-radius:5px;cursor:pointer;transition:.15s;letter-spacing:.03em}
    .filters button.active,.filters button:hover{background:var(--ink);border-color:var(--ink);color:var(--parch)}
    .load-note{grid-column:1/-1;color:var(--ink2);text-align:center;padding:20px;border:1px dashed var(--parch-edge);border-radius:10px;
      font-family:var(--body);font-style:italic;font-size:17px}

    /* treasury (certificates) */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    @media(max-width:600px){.certs{grid-template-columns:1fr}}
    .cert{display:grid;grid-template-columns:120px 1fr;border-radius:6px;overflow:hidden;
      background:linear-gradient(135deg,#7a5a2a,#4a3717);padding:8px;gap:0}
    .cert img{width:100%;height:100%;object-fit:cover;min-height:150px;border-radius:3px 0 0 3px;background:#2b2620}
    .cert .ct{padding:14px 16px;background:linear-gradient(180deg,var(--parch),var(--parch2));border-radius:0 3px 3px 0}
    .cert .meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--disp);font-size:12px;color:var(--red);
      text-transform:uppercase;letter-spacing:.05em;font-weight:600}
    .cert h4{margin:8px 0 6px;font-size:18px;color:var(--ink);font-family:var(--disp)}
    .cert p{margin:0;color:var(--ink2);font-size:15px}
    @media(max-width:400px){.cert{grid-template-columns:92px 1fr}}

    /* gatehouse (contact) */
    .contact{display:grid;grid-template-columns:1fr 1.2fr;gap:28px}
    @media(max-width:760px){.contact{grid-template-columns:1fr}}
    .cinfo a{display:flex;justify-content:space-between;gap:12px;padding:13px 2px;border-bottom:1px solid var(--parch-edge);
      font-family:var(--disp);font-weight:600;font-size:16px;color:var(--ink)}
    .cinfo a span:last-child{color:var(--red)}
    form label{display:block;font-family:var(--disp);font-size:14px;color:var(--red);margin:0 0 5px;font-weight:600;letter-spacing:.03em}
    form input,form textarea{width:100%;background:rgba(255,255,255,.5);border:1px solid var(--parch-edge);border-radius:6px;color:var(--ink);
      font-family:var(--body);font-size:17px;padding:12px 13px;margin-bottom:14px}
    form input:focus,form textarea:focus{outline:none;border-color:var(--gold-dim);box-shadow:0 0 0 3px rgba(201,162,74,.2)}
    form textarea{min-height:120px;resize:vertical}
    #cf-status{font-family:var(--disp);font-weight:700;margin-top:2px;font-size:16px;min-height:1.4em}

    footer{position:relative;z-index:4;padding:30px 22px 46px;text-align:center;border-top:1px solid var(--line);max-width:1180px;margin:0 auto}
    .fsoc{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
    .fsoc a{color:var(--cream);font-family:var(--disp);font-weight:600;font-size:15px}
    .fsoc a:hover{color:var(--gold2)}
    .muted{color:var(--mut);font-size:14px;margin-top:4px;font-family:var(--body)}
    .muted a{color:var(--mut)}.muted a:hover{color:var(--gold2)}

    /* ---------- loose stone easter egg ---------- */
    .loose-stone{position:fixed;left:22px;bottom:22px;z-index:8;width:70px;height:44px;cursor:pointer;border:0;padding:0;
      background:linear-gradient(160deg,var(--stone-hi),var(--stone2));border-radius:4px;
      box-shadow:inset 0 0 0 2px var(--mortar),0 4px 10px rgba(0,0,0,.5);transition:transform .5s ease,opacity .5s ease}
    .loose-stone::after{content:"";position:absolute;inset:6px;border:1px dashed rgba(201,162,74,.35);border-radius:3px}
    .loose-stone .rune{position:absolute;inset:0;display:grid;place-items:center;color:var(--gold-dim);font-size:15px;opacity:.5;font-family:var(--med)}
    .loose-stone:hover{box-shadow:inset 0 0 0 2px var(--mortar),0 0 16px rgba(201,162,74,.4)}
    .loose-stone.pushed{transform:translateX(-90px) rotate(-8deg);opacity:0}
    @media(max-width:560px){.loose-stone{width:56px;height:38px;left:12px;bottom:12px}}

    .passage{position:fixed;inset:0;z-index:9500;display:flex;align-items:center;justify-content:center;padding:24px;
      background:rgba(8,5,3,.72);opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s ease}
    .passage.open{opacity:1;visibility:visible}
    .passage .chamber-note{position:relative;max-width:440px;background:radial-gradient(120% 100% at 50% 0%,#f2e5c4,var(--parch));
      color:var(--ink);border-radius:6px;padding:32px 34px;box-shadow:0 26px 60px rgba(0,0,0,.7);
      border:2px solid var(--parch-edge);transform:scale(.9);transition:transform .4s cubic-bezier(.2,1.3,.4,1)}
    .passage.open .chamber-note{transform:scale(1)}
    .passage .chamber-note h3{font-family:var(--deco);color:var(--ink);font-size:24px;margin-bottom:10px;text-align:center}
    .passage .chamber-note .runes{font-family:var(--med);color:var(--gold-dim);text-align:center;letter-spacing:.3em;margin-bottom:14px}
    .passage .chamber-note p{margin:0;font-size:17px;line-height:1.7}
    .passage .close-note{margin-top:18px;width:100%;justify-content:center}

    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *{animation:none!important}
      .torch .flame,.dragon{animation:none!important}
      .gate{display:none}
      .torchlight{transition:none}
    }
  </style>
</head>
<body>
  <div class="wall" aria-hidden="true"></div>
  <svg class="wall-tex" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <filter id="stone"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#stone)"/>
  </svg>
  <div class="torchlight" id="torchlight" aria-hidden="true"></div>

  <!-- wall torches -->
  <div class="torch l" aria-hidden="true"><div class="flame"></div><div class="bowl"></div><div class="stick"></div></div>
  <div class="torch r" aria-hidden="true"><div class="flame"></div><div class="bowl"></div><div class="stick"></div></div>

  <!-- arched window + dragon -->
  <div class="window" aria-hidden="true">
    <div class="moon"></div>
    <div class="dragon" id="dragon">
      <svg viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
        <path d="M2 16 q10 -4 16 -2 q3 -8 10 -9 q-3 5 -1 9 q8 -1 15 3 q6 3 16 1 q-7 6 -15 5 q-6 4 -14 3 q-8 -1 -14 -6 q-9 3 -13 -1 q6 0 8 -3 q-6 0 -8 -3z"/>
      </svg>
    </div>
  </div>

  <!-- ============ entrance gate ============ -->
  <div class="gate" id="gate" role="dialog" aria-label="The castle gate">
    <div class="gate-title" id="gate-title">The Keep</div>
    <div class="gate-sub" id="gate-sub">stand before the gate</div>
    <div class="gate-arch">
      <div class="stone-arch"></div>
      <div class="portcullis"><div class="bars"></div><div class="frame"></div></div>
      <div class="gate-torch gl"><div class="torch" style="position:static"><div class="flame"></div><div class="bowl"></div><div class="stick"></div></div></div>
    </div>
    <button class="enter-btn" id="enter-btn" type="button">Raise the Portcullis</button>
  </div>

  <!-- ============ keep ============ -->
  <div class="keep-top">
    <div class="keep-top-inner">
      <div class="crest">
        <svg class="shield" viewBox="0 0 100 116" aria-hidden="true">
          <path d="M50 4 L94 18 V60 Q94 96 50 112 Q6 96 6 60 V18 Z" fill="#2b2620" stroke="#c9a24a" stroke-width="4"/>
          <path d="M50 12 L86 23 V60 Q86 90 50 104 Q14 90 14 60 V23 Z" fill="#8f2d2d"/>
          <path d="M50 12 L50 104 M14 42 L86 42" stroke="#c9a24a" stroke-width="3" opacity=".85"/>
          <text x="50" y="38" text-anchor="middle" font-family="Cinzel Decorative,serif" font-weight="900" font-size="20" fill="#e6c877">C</text>
          <text x="32" y="72" text-anchor="middle" font-family="Cinzel Decorative,serif" font-weight="900" font-size="18" fill="#e6c877">J</text>
          <text x="68" y="72" text-anchor="middle" font-family="Cinzel Decorative,serif" font-weight="900" font-size="18" fill="#e6c877">C</text>
        </svg>
        <div class="bt"><b>CaiJiechao</b><small id="crest-sub">THE KEEP</small></div>
      </div>
      <div class="banners" aria-hidden="true">
        <div class="banner"><i class="fa fa-shield"></i></div>
        <div class="banner"><i class="fa fa-book"></i></div>
        <div class="banner"><i class="fa fa-diamond"></i></div>
      </div>
    </div>
  </div>

  <!-- room navigation -->
  <nav class="roomnav" aria-label="Castle rooms">
    <div class="roomnav-inner" id="roomnav"></div>
  </nav>
  <div class="map-panel" id="map-panel">
    <div class="map-inner">
      <div class="maph" id="map-h"></div>
      <div class="map-grid" id="map-grid"></div>
    </div>
  </div>

  <!-- chamber: rooms -->
  <main class="chamber" id="chamber">
    <!-- GREAT HALL (hero) -->
    <section class="room" id="room-great-hall" aria-label="Great Hall">
      <div class="scroll">
        <div class="hall">
          <svg class="coat" viewBox="0 0 100 116" aria-hidden="true">
            <path d="M50 4 L94 18 V60 Q94 96 50 112 Q6 96 6 60 V18 Z" fill="#2b2620" stroke="#c9a24a" stroke-width="4"/>
            <path d="M50 12 L86 23 V60 Q86 90 50 104 Q14 90 14 60 V23 Z" fill="#2e4a7a"/>
            <path d="M50 30 l6 12 l13 1 l-10 9 l3 13 l-12 -7 l-12 7 l3 -13 l-10 -9 l13 -1 z" fill="#e6c877"/>
          </svg>
          <div class="greet" id="greet"></div>
          <h1 id="name"></h1>
          <div class="role" id="role"></div>
          <p class="tag" id="tag"></p>
          <div class="btns">
            <a class="btn pri" id="cvBtn" download><i class="fa fa-scroll" aria-hidden="true"></i><span></span></a>
            <a class="btn gho" id="ghBtn" target="_blank" rel="noopener"><i class="fa fa-github" aria-hidden="true"></i>GitHub</a>
          </div>
        </div>
      </div>
    </section>

    <!-- LIBRARY (about + education) -->
    <section class="room" id="room-library" aria-label="Library">
      <div class="scroll">
        <div class="room-head"><div class="rk" id="rk-library"></div><h2 id="l-about"></h2></div>
        <div class="rule-orn">❦ ⚜ ❦</div>
        <div class="about">
          <div class="portrait-frame"><img id="portrait" alt="Cai Jiechao portrait"></div>
          <div><div id="bio"></div><span class="loc" id="loc"></span></div>
        </div>
        <div class="subhead" id="sub-edu"></div>
        <div class="rows" id="edu"></div>
      </div>
    </section>

    <!-- ARMORY (skills + courses) -->
    <section class="room" id="room-armory" aria-label="Armory">
      <div class="scroll">
        <div class="room-head"><div class="rk" id="rk-armory"></div><h2 id="l-skills"></h2></div>
        <div class="rule-orn">⚔ ⚜ ⚔</div>
        <div class="arsenal" id="arsenal"></div>
        <div class="tags" id="tags"></div>
        <div class="subhead" id="sub-courses"></div>
        <div class="courses" id="courses-box"></div>
      </div>
    </section>

    <!-- THRONE ROOM (experience) -->
    <section class="room" id="room-throne" aria-label="Throne Room">
      <div class="scroll">
        <div class="room-head"><div class="rk" id="rk-throne"></div><h2 id="l-exp"></h2></div>
        <div class="rule-orn">♛ ⚜ ♛</div>
        <div class="rows" id="exp"></div>
      </div>
    </section>

    <!-- GALLERY (projects) -->
    <section class="room" id="room-gallery" aria-label="Gallery">
      <div class="scroll">
        <div class="room-head"><div class="rk" id="rk-gallery"></div><h2 id="l-projects"></h2></div>
        <div class="rule-orn">⚜ ⚜ ⚜</div>
        <div class="gallery" id="projects-box"><div class="load-note" id="proj-load"></div></div>
      </div>
    </section>

    <!-- CHRONICLE (articles) -->
    <section class="room" id="room-chronicle" aria-label="Chronicle">
      <div class="scroll">
        <div class="room-head"><div class="rk" id="rk-chronicle"></div><h2 id="l-articles"></h2></div>
        <div class="rule-orn">✒ ⚜ ✒</div>
        <div class="filters" id="filters"></div>
        <div class="gallery" id="articles-box"><div class="load-note" id="art-load"></div></div>
      </div>
    </section>

    <!-- TREASURY (certificates) -->
    <section class="room" id="room-treasury" aria-label="Treasury">
      <div class="scroll">
        <div class="room-head"><div class="rk" id="rk-treasury"></div><h2 id="l-certs"></h2></div>
        <div class="rule-orn">♦ ⚜ ♦</div>
        <div class="certs" id="certs"></div>
      </div>
    </section>

    <!-- GATEHOUSE (contact) -->
    <section class="room" id="room-gatehouse" aria-label="Gatehouse">
      <div class="scroll">
        <div class="room-head"><div class="rk" id="rk-gatehouse"></div><h2 id="l-contact"></h2></div>
        <div class="rule-orn">✦ ⚜ ✦</div>
        <div class="contact">
          <div class="cinfo" id="cinfo"></div>
          <form id="cf" novalidate>
            <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
            <label for="cf-name" id="lb-name"></label>
            <input type="text" name="name" id="cf-name" required autocomplete="name">
            <label for="cf-email" id="lb-email"></label>
            <input type="email" name="email" id="cf-email" required autocomplete="email">
            <label for="cf-msg" id="lb-msg"></label>
            <textarea name="message" id="cf-msg" required></textarea>
            <button type="submit" class="btn pri" id="cf-send"></button>
            <p id="cf-status" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="fsoc" id="fsoc"></div>
    <div class="muted" id="foot-desc"></div>
    <div class="muted"><a id="foot-icp" target="_blank" rel="noopener"></a></div>
  </footer>

  <!-- loose stone easter egg -->
  <button class="loose-stone" id="loose-stone" type="button" aria-label="A loose stone in the wall — push it">
    <span class="rune" aria-hidden="true">⚜</span>
  </button>
  <div class="passage" id="passage" role="dialog" aria-label="A hidden chamber">
    <div class="chamber-note">
      <h3 id="secret-h"></h3>
      <div class="runes" aria-hidden="true">⚜ ✦ ⚜ ✦ ⚜</div>
      <p id="secret-p"></p>
      <button class="btn pri close-note" id="close-note" type="button"></button>
    </div>
  </div>

  <script>window.THEME_ID = "65-castle";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    "use strict";
    var CJC=window.CJCData, P=CJC.profile, esc=CJC.escapeHtml;
    function t(f){ return CJC.t(f); }
    var reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    var articles=[], projects=[], filterKey="all", current="great-hall";

    var ROOMS=[
      {id:'great-hall',icon:'fa-institution',name:{en:'Great Hall',zh:'大殿'}},
      {id:'library',icon:'fa-book',name:{en:'Library',zh:'书斋'}},
      {id:'armory',icon:'fa-shield',name:{en:'Armory',zh:'兵械库'}},
      {id:'throne',icon:'fa-diamond',name:{en:'Throne Room',zh:'王座厅'}},
      {id:'gallery',icon:'fa-picture-o',name:{en:'Gallery',zh:'画廊'}},
      {id:'chronicle',icon:'fa-newspaper-o',name:{en:'Chronicle',zh:'编年史'}},
      {id:'treasury',icon:'fa-trophy',name:{en:'Treasury',zh:'宝库'}},
      {id:'gatehouse',icon:'fa-envelope',name:{en:'Gatehouse',zh:'门楼'}}
    ];
    var STR={
      keep:{en:'The Keep',zh:'城堡'},
      gateSub:{en:'stand before the gate',zh:'伫立于城门之前'},
      enter:{en:'Raise the Portcullis',zh:'升起闸门'},
      crestSub:{en:'THE KEEP',zh:'城 堡'},
      mapBtn:{en:'Castle Map',zh:'城堡地图'},
      mapH:{en:'~ Floor Plan of the Keep ~',zh:'~ 城堡平面图 ~'},
      subEdu:{en:'Chronicles of Learning',zh:'求学编年'},
      subCourses:{en:'Training Regimens',zh:'训练课业'},
      secretH:{en:'A Hidden Chamber',zh:'密室'},
      secretP:{en:"You pushed the loose stone and found a secret passage. Beyond it, carved in the wall: “The best code, like the best keeps, is built to outlast its builder. Thank you for exploring every room.” — CJC",
               zh:"你推开了松动的石块，寻得一条暗道。道尽处，墙上刻着：“最好的代码，如同最坚固的城堡，注定比建造者更长久。谢谢你走遍了每一个房间。” — 蔡杰超"},
      close:{en:'Seal the Passage',zh:'封闭暗道'}
    };

    function buildNav(){
      var zh=CJC.lang()==='zh';
      document.getElementById('roomnav').innerHTML=ROOMS.map(function(r){
        return '<button class="rtab'+(r.id===current?' active':'')+'" data-room="'+r.id+'" type="button">'
          +'<span class="ti"><i class="fa '+r.icon+'" aria-hidden="true"></i></span>'
          +'<span class="tn">'+esc(t(r.name))+'</span></button>';
      }).join('')+'<button class="mapbtn" id="mapbtn" type="button"><i class="fa fa-map-o" aria-hidden="true"></i> '+esc(t(STR.mapBtn))+'</button>';
      Array.prototype.forEach.call(document.querySelectorAll('.rtab'),function(b){ b.addEventListener('click',function(){ go(b.dataset.room); }); });
      document.getElementById('mapbtn').addEventListener('click',function(){ document.getElementById('map-panel').classList.toggle('open'); });
      // map grid
      document.getElementById('map-h').textContent=t(STR.mapH);
      document.getElementById('map-grid').innerHTML=ROOMS.map(function(r){
        return '<button class="mroom'+(r.id===current?' active':'')+'" data-room="'+r.id+'" type="button">'
          +'<span class="mi"><i class="fa '+r.icon+'" aria-hidden="true"></i></span><span class="mnm">'+esc(t(r.name))+'</span></button>';
      }).join('');
      Array.prototype.forEach.call(document.querySelectorAll('.mroom'),function(b){ b.addEventListener('click',function(){ go(b.dataset.room); document.getElementById('map-panel').classList.remove('open'); }); });
    }

    function go(id,noScroll){
      current=id;
      if(document.body.classList.contains('calm')){
        if(!noScroll){ var el=document.getElementById('room-'+id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }
      } else {
        Array.prototype.forEach.call(document.querySelectorAll('.room'),function(s){ s.classList.toggle('active', s.id==='room-'+id); });
        if(!noScroll){
          var ch=document.getElementById('chamber');
          window.scrollTo({top:Math.max(0, ch.getBoundingClientRect().top+window.pageYOffset-90), behavior:'smooth'});
        }
      }
      Array.prototype.forEach.call(document.querySelectorAll('.rtab'),function(b){ b.classList.toggle('active', b.dataset.room===id); });
      Array.prototype.forEach.call(document.querySelectorAll('.mroom'),function(b){ b.classList.toggle('active', b.dataset.room===id); });
    }

    function renderStatic(){
      var zh=CJC.lang()==='zh';
      document.title=(zh?'蔡杰超':'Cai Jiechao')+' — '+(zh?'城堡':'The Keep');
      document.getElementById('gate-title').textContent=t(STR.keep);
      document.getElementById('gate-sub').textContent=t(STR.gateSub);
      document.getElementById('enter-btn').textContent=t(STR.enter);
      document.getElementById('crest-sub').textContent=t(STR.crestSub);
      buildNav();
      // room kickers
      ROOMS.forEach(function(r){ var k=document.getElementById('rk-'+r.id); if(k) k.textContent=t(r.name); });
      document.getElementById('sub-edu').textContent=t(STR.subEdu);
      document.getElementById('sub-courses').textContent=t(STR.subCourses);
      document.getElementById('secret-h').textContent=t(STR.secretH);
      document.getElementById('secret-p').textContent=t(STR.secretP);
      document.getElementById('close-note').textContent=t(STR.close);
      // great hall
      document.getElementById('greet').textContent=t(P.greeting);
      document.getElementById('name').textContent=t(P.name);
      document.getElementById('role').textContent=t(P.role);
      document.getElementById('tag').textContent=t(P.title);
      var cv=document.getElementById('cvBtn'); cv.href=t(P.cv); cv.querySelector('span').textContent=t(P.ui.download_cv);
      document.getElementById('ghBtn').href=P.contact.github;
      // titles
      document.getElementById('l-about').textContent=t(P.ui.about_me);
      document.getElementById('l-skills').textContent=t(P.ui.core_tech);
      document.getElementById('l-exp').textContent=t(P.ui.internship_exp);
      document.getElementById('l-projects').textContent=t(P.ui.latest_projects);
      document.getElementById('l-articles').textContent=t(P.ui.latest_articles);
      document.getElementById('l-certs').textContent=t(P.ui.certificates);
      document.getElementById('l-contact').textContent=t(P.ui.get_in_touch);
      // about
      document.getElementById('portrait').src=P.avatar;
      document.getElementById('bio').innerHTML=P.bio.map(function(b){return '<p>'+esc(t(b))+'</p>';}).join('');
      document.getElementById('loc').innerHTML='<i class="fa fa-map-marker" aria-hidden="true"></i> '+esc(t(P.location));
      // education
      document.getElementById('edu').innerHTML=P.education.map(function(e){return '<div class="rowi"><div class="p">'+esc(e.period)+'</div><h3>'+esc(t(e.school))+'</h3><div class="s">'+esc(t(e.degree))+' — '+esc(t(e.note))+'</div></div>';}).join('');
      // skills
      document.getElementById('arsenal').innerHTML=P.skills.map(function(s,i){var ic=['fa-code','fa-server','fa-magic','fa-cubes','fa-sitemap','fa-terminal'][i%6];return '<div class="weapon"><div class="wi"><i class="fa '+ic+'"></i></div><div class="wv">'+esc(s)+'</div></div>';}).join('');
      document.getElementById('tags').innerHTML=P.skillTags.map(function(x){return '<span>'+esc(x)+'</span>';}).join('');
      // courses
      document.getElementById('courses-box').innerHTML=P.courses.map(function(c){return '<div class="course"><i class="fa '+esc(c.icon)+'" aria-hidden="true"></i><h4>'+esc(t(c.title))+'</h4><p>'+esc(t(c.desc))+'</p></div>';}).join('');
      // experience
      document.getElementById('exp').innerHTML=P.experience.map(function(x){return '<div class="rowi"><div class="p">'+esc(x.period)+'</div><h3>'+esc(t(x.role))+' · '+esc(t(x.company))+'</h3><div class="s">'+esc(t(x.summary))+'</div><ul>'+x.bullets.map(function(b){return '<li>'+esc(t(b))+'</li>';}).join('')+'</ul></div>';}).join('');
      // certificates
      document.getElementById('certs').innerHTML=P.certificates.map(function(c){return '<div class="cert"><img src="'+esc(c.image)+'" alt="'+esc(t(c.title))+'" onerror="this.src=\'/index_page/img/blogs/1.jpg\'"><div class="ct"><div class="meta"><span>'+esc(t(c.tag))+'</span><span>'+esc(t(c.date))+'</span></div><h4>'+esc(t(c.title))+'</h4><p>'+esc(t(c.desc))+'</p></div></div>';}).join('');
      // contact
      document.getElementById('cinfo').innerHTML=[
        ['Email',P.contact.email,'mailto:'+P.contact.email],['Phone',P.contact.phone,P.contact.phoneHref],
        ['GitHub','@'+P.contact.githubUser,P.contact.github],['WeChat','QR ↗',P.contact.wechatQrPage]
      ].map(function(x){return '<a href="'+esc(x[2])+'"><span>'+esc(x[0])+'</span><span>'+esc(x[1])+'</span></a>';}).join('');
      document.getElementById('lb-name').textContent=t(P.ui.name_placeholder);
      document.getElementById('lb-email').textContent=t(P.ui.email_placeholder);
      document.getElementById('lb-msg').textContent=t(P.ui.msg_placeholder);
      document.getElementById('cf-name').placeholder=t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder=t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder=t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent=t(P.ui.send);
      // footer
      document.getElementById('fsoc').innerHTML=
        '<a href="'+P.contact.github+'" target="_blank" rel="noopener">GitHub</a>'+
        '<a href="mailto:'+P.contact.email+'">Email</a>'+
        '<a href="'+P.contact.wechatQrPage+'">WeChat</a>'+
        '<a href="/admin.html">'+esc(t(P.ui.admin_panel))+'</a>';
      document.getElementById('foot-desc').textContent=t(P.ui.footer_desc);
      var icp=document.getElementById('foot-icp'); icp.textContent=P.icp; icp.href=P.icpUrl;
      // filters
      document.getElementById('filters').innerHTML=P.articleFilters.map(function(f){return '<button data-k="'+esc(f.key)+'" class="'+(f.key===filterKey?'active':'')+'">'+esc(t(f.label))+'</button>';}).join('');
      Array.prototype.forEach.call(document.querySelectorAll('#filters button'),function(b){b.addEventListener('click',function(){filterKey=b.dataset.k;renderStatic();renderArticles();});});
    }

    function cover(src){ return '<div class="art"><img src="'+esc(src||'/index_page/img/blogs/1.jpg')+'" onerror="this.src=\'/index_page/img/blogs/1.jpg\'" alt=""></div>'; }
    function renderProjects(){
      var box=document.getElementById('projects-box');
      if(!projects.length){ box.innerHTML='<div class="load-note">'+esc(t(P.ui.no_projects))+'</div>'; return; }
      box.innerHTML=projects.map(function(p){return '<a class="tapestry" href="'+esc(p.href)+'">'+cover(p.cover_image)
        +'<div class="plate"><div class="meta"><span>'+esc(t(P.ui.tech_stack))+'</span><span>'+esc(p.dateText())+'</span></div>'
        +'<h4>'+esc(p.localTitle())+'</h4><div class="tech">'+esc(p.tech_stack||'')+'</div><p>'+esc(p.localSummary()||'')+'</p>'
        +'<span class="more">'+esc(t(P.ui.view_project))+' →</span></div></a>';}).join('');
    }
    function renderArticles(){
      var box=document.getElementById('articles-box');
      var list=CJC.filterArticles(articles,filterKey);
      if(!list.length){ box.innerHTML='<div class="load-note">'+esc(t(P.ui.no_articles))+'</div>'; return; }
      box.innerHTML=list.map(function(a){return '<a class="tapestry" href="'+esc(a.href)+'">'+cover(a.cover_image)
        +'<div class="plate"><div class="meta"><span>'+esc(a.category||'')+'</span><span>'+esc(a.dateText())+'</span></div>'
        +'<h4>'+esc(a.localTitle())+'</h4><p>'+esc(a.localSummary()||'')+'</p>'
        +'<span class="more">'+esc(t(P.ui.read_more))+' →</span></div></a>';}).join('');
    }
    function loadDynamic(){
      CJC.fetchProjects().then(function(d){projects=d;renderProjects();}).catch(function(){document.getElementById('projects-box').innerHTML='<div class="load-note">⚠ '+esc(t(P.ui.no_projects))+'</div>';});
      CJC.fetchArticles().then(function(d){articles=d;renderArticles();}).catch(function(){document.getElementById('articles-box').innerHTML='<div class="load-note">⚠ Failed to load / 内容加载失败</div>';});
    }

    document.getElementById('cf').addEventListener('submit',function(e){
      e.preventDefault();
      var f=e.target,s=document.getElementById('cf-status');
      s.style.color='var(--ink2)'; s.textContent=t(P.ui.sending);
      CJC.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value})
        .then(function(r){s.style.color='var(--green)';s.textContent='✓ '+(r.message||'Sent.');f.reset();})
        .catch(function(err){s.style.color='var(--red)';s.textContent='✗ '+err.message;});
    });

    /* ---------- entrance gate ---------- */
    function enter(){
      var g=document.getElementById('gate');
      g.classList.add('raising');
      setTimeout(function(){ g.classList.add('open'); }, 900);
    }
    document.getElementById('enter-btn').addEventListener('click',enter);

    /* ---------- torchlight follows cursor ---------- */
    if(!reduce){
      window.addEventListener('pointermove',function(e){
        document.documentElement.style.setProperty('--mx', e.clientX+'px');
        document.documentElement.style.setProperty('--my', e.clientY+'px');
      },{passive:true});
    }

    /* ---------- loose-stone secret passage ---------- */
    var stone=document.getElementById('loose-stone'), passage=document.getElementById('passage');
    stone.addEventListener('click',function(){
      stone.classList.add('pushed');
      passage.classList.add('open');
      // send the dragon across as a flourish
      flyDragon();
      setTimeout(function(){ stone.classList.remove('pushed'); }, 4000);
    });
    document.getElementById('close-note').addEventListener('click',function(){ passage.classList.remove('open'); });
    passage.addEventListener('click',function(e){ if(e.target===passage) passage.classList.remove('open'); });

    /* ---------- dragon flyby (retrigger) ---------- */
    function flyDragon(){
      if(reduce) return; var d=document.getElementById('dragon'); if(!d) return;
      d.style.animation='none'; void d.offsetWidth;
      d.style.animation='dragonFly 3.4s linear 1';
      setTimeout(function(){ d.style.animation=''; }, 3600);
    }

    /* ---------- boot ---------- */
    document.addEventListener('DOMContentLoaded',function(){
      CJC.setTheme(window.THEME_ID);
      if(reduce){ document.body.classList.add('calm'); }
      renderStatic();
      CJC.mountSwitcher({accent:'#c9a24a'});
      CJC.onLang(function(){ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
      if(!reduce){ go('great-hall', true); }
    });
  })();
  </script>
</body>
</html>

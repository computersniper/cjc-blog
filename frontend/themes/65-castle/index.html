<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — The Castle</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=MedievalSharp&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{ --stone0:#211d18; --stone1:#2c2721; --stone2:#38322a; --mortar:#161310; --gold:#c9a24a; --gold2:#e6c877;
      --red:#8f2d2d; --blue:#2e4a7a; --green:#2f5a3a; --ink:#e9e0cf; --mut:#a99c82; --line:rgba(201,162,74,.28); }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;color:var(--ink);font-family:'EB Garamond',Georgia,serif;font-size:18px;line-height:1.7;overflow-x:hidden;
      background-color:var(--stone1);
      background-image:
        linear-gradient(var(--mortar) 3px,transparent 3px),
        linear-gradient(90deg,var(--mortar) 3px,transparent 3px),
        radial-gradient(circle at 30% 40%,rgba(255,255,255,.02),transparent 60%);
      background-size:150px 66px,150px 66px,150px 66px;
      background-position:0 0,0 0,0 0}
    /* offset second course of stone via body::before */
    body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
      background-image:linear-gradient(90deg,var(--mortar) 3px,transparent 3px);
      background-size:150px 66px;background-position:75px 33px}
    body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.06;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    h1,h2,h3,.disp{font-family:'Cinzel',serif;letter-spacing:.02em}
    .medieval{font-family:'MedievalSharp',cursive}
    .wrap{max-width:1080px;margin:0 auto;padding:0 22px;position:relative;z-index:3}

    /* torches (fixed) */
    .torch{position:fixed;z-index:5;pointer-events:none;width:20px}
    .torch .flame{width:20px;height:30px;margin:0 auto -6px;border-radius:50% 50% 50% 50%/62% 62% 40% 40%;
      background:radial-gradient(circle at 50% 72%,#fff2c0,#ffb347 42%,#ff6a1f 76%,transparent);
      box-shadow:0 0 34px 10px rgba(255,140,40,.55);transform-origin:50% 100%;animation:flick 1.5s ease-in-out infinite alternate}
    .torch .handle{width:8px;height:46px;margin:0 auto;background:linear-gradient(#5a4326,#2c2013);border-radius:3px}
    @keyframes flick{0%{transform:scaleY(1) rotate(-3deg)}50%{transform:scaleY(1.15) rotate(3deg)}100%{transform:scaleY(.92) rotate(-1deg)}}
    .torch.l{left:14px;top:130px}.torch.r{right:14px;top:130px}
    @media(max-width:700px){.torch{display:none}}

    .topbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,rgba(20,17,13,.94),rgba(20,17,13,.8));
      border-bottom:2px solid var(--gold)}
    .topbar .row{display:flex;align-items:center;justify-content:space-between;height:60px}
    .brand{font-family:'Cinzel';font-weight:800;font-size:21px;color:var(--gold2)}
    .brand b{color:var(--red)}
    .nav{display:flex;gap:18px}
    .nav a{font-family:'Cinzel';font-size:12px;letter-spacing:.12em;color:var(--mut)}
    .nav a:hover{color:var(--gold2)}
    @media(max-width:900px){.nav{display:none}}

    section{padding:60px 0;position:relative}
    .stonehead{text-align:center;margin-bottom:30px}
    .stonehead .k{font-family:'MedievalSharp';color:var(--red);letter-spacing:.06em;font-size:20px}
    .stonehead h2{font-family:'Cinzel';font-weight:700;font-size:clamp(26px,4.6vw,44px);margin:6px 0 0;color:var(--gold2);
      text-shadow:0 2px 0 #000}
    .banner-rule{display:flex;justify-content:center;gap:10px;margin-top:12px;color:var(--gold);font-size:18px}

    .panel{background:linear-gradient(180deg,rgba(44,39,33,.9),rgba(25,22,18,.9));border:2px solid var(--gold);
      border-radius:6px;padding:30px;box-shadow:0 0 0 4px var(--stone0),0 20px 44px rgba(0,0,0,.5)}

    /* HERO */
    .hero{padding:40px 0 30px;text-align:center}
    /* portcullis */
    .portcullis{max-width:520px;margin:0 auto 8px;height:34px;position:relative;opacity:.8}
    .portcullis::before{content:"";position:absolute;inset:0;
      background-image:linear-gradient(90deg,var(--gold) 3px,transparent 3px),linear-gradient(var(--gold) 3px,transparent 3px);
      background-size:34px 17px,34px 17px;mask-image:linear-gradient(180deg,#000,transparent);-webkit-mask-image:linear-gradient(180deg,#000,transparent)}
    /* banners */
    .banners{display:flex;justify-content:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
    .banner{width:56px}
    .greet{font-family:'MedievalSharp';color:var(--red);font-size:22px}
    .hero h1{font-family:'Cinzel';font-weight:800;font-size:clamp(44px,10vw,104px);line-height:1;margin:8px 0 6px;
      color:var(--gold2);text-shadow:0 2px 0 #000,0 4px 26px rgba(201,162,74,.4)}
    .hero .role{font-family:'Cinzel';font-size:clamp(18px,2.6vw,26px);color:var(--ink);letter-spacing:.04em}
    .hero .tag{color:var(--mut);max-width:44ch;margin:14px auto 22px;font-size:18px;font-style:italic}
    .btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
    .btn{display:inline-flex;align-items:center;gap:9px;font-family:'Cinzel';font-size:14px;letter-spacing:.06em;
      padding:12px 24px;border-radius:4px;cursor:pointer;transition:.16s;border:2px solid var(--gold)}
    .btn.pri{background:var(--gold);color:#211809}
    .btn.pri:hover{background:var(--gold2)}
    .btn.gho{background:transparent;color:var(--gold2)}
    .btn.gho:hover{background:rgba(201,162,74,.14)}
    .crest-wrap{max-width:170px;margin:28px auto 0}

    /* about */
    .about{display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:start}
    @media(max-width:740px){.about{grid-template-columns:1fr}}
    .about .pic{border:3px solid var(--gold);border-radius:4px;overflow:hidden;box-shadow:0 0 0 4px var(--stone0),0 16px 30px rgba(0,0,0,.5)}
    .about .pic img{width:100%;aspect-ratio:.9;object-fit:cover;filter:sepia(.15) contrast(1.02)}
    .about p{margin:0 0 12px;font-size:18px;max-width:60ch}
    .loc{display:inline-flex;gap:8px;align-items:center;color:var(--gold2);border:1px solid var(--gold);border-radius:4px;padding:6px 14px;font-family:'Cinzel';font-size:13px;letter-spacing:.06em}

    /* rows */
    .rows{display:flex;flex-direction:column;gap:20px}
    .rowi{padding:18px 22px;border:1px solid var(--line);border-radius:5px;background:rgba(30,26,21,.5);position:relative}
    .rowi::before{content:"⚜";position:absolute;left:-1px;top:-1px;color:var(--gold);font-size:14px;background:var(--stone1);padding:2px 6px}
    .rowi .p{font-family:'Cinzel';color:var(--red);font-size:13px;letter-spacing:.06em}
    .rowi h3{margin:6px 0 4px;font-size:22px;color:var(--gold2)}
    .rowi .s{color:var(--mut)}
    .rowi ul{margin:8px 0 0;padding-left:20px;line-height:1.8}

    /* skills = armory */
    .skills{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    @media(max-width:760px){.skills{grid-template-columns:1fr 1fr}}
    @media(max-width:460px){.skills{grid-template-columns:1fr}}
    .sk{border:1px solid var(--line);border-radius:5px;padding:16px 18px;background:rgba(30,26,21,.5);text-align:center}
    .sk .h{color:var(--gold);font-size:20px}
    .sk .v{margin-top:6px;font-family:'Cinzel';font-size:15px;color:var(--ink)}
    .tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
    .tags span{font-family:'Cinzel';font-size:12px;letter-spacing:.04em;padding:7px 14px;border-radius:3px;
      border:1px solid var(--gold);color:var(--gold2);background:rgba(201,162,74,.08)}

    /* courses */
    .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    @media(max-width:820px){.courses{grid-template-columns:1fr 1fr}}
    @media(max-width:500px){.courses{grid-template-columns:1fr}}
    .course{padding:22px;border:1px solid var(--line);border-radius:5px;background:linear-gradient(180deg,rgba(44,39,33,.6),rgba(25,22,18,.6));transition:.18s;text-align:center}
    .course:hover{border-color:var(--gold);transform:translateY(-3px)}
    .course i.fa{color:var(--gold);font-size:26px}
    .course h4{font-family:'Cinzel';margin:12px 0 8px;font-size:17px;color:var(--gold2)}
    .course p{margin:0;color:var(--mut);font-size:16px}

    /* cards */
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    @media(max-width:880px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.cards{grid-template-columns:1fr}}
    .card{border:2px solid var(--gold);border-radius:5px;overflow:hidden;display:flex;flex-direction:column;
      background:linear-gradient(180deg,rgba(44,39,33,.7),rgba(25,22,18,.8));box-shadow:0 0 0 3px var(--stone0),0 14px 30px rgba(0,0,0,.4);transition:.18s}
    .card:hover{transform:translateY(-5px);box-shadow:0 0 0 3px var(--stone0),0 0 20px rgba(201,162,74,.3),0 20px 40px rgba(0,0,0,.5)}
    .card .cover{height:154px;overflow:hidden;background:#14100a;border-bottom:2px solid var(--gold)}
    .card .cover img{width:100%;height:100%;object-fit:cover;filter:sepia(.15)}
    .cbody{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
    .ctag{display:flex;justify-content:space-between;font-family:'Cinzel';font-size:11px;letter-spacing:.06em;color:var(--red)}
    .card h4{font-family:'Cinzel';margin:0;font-size:16px;line-height:1.3;color:var(--gold2)}
    .card p{margin:0;color:var(--mut);font-size:16px;flex:1}
    .tech{color:var(--gold);font-style:italic;font-size:15px}
    .more{font-family:'Cinzel';font-size:12px;letter-spacing:.06em;color:var(--gold2)}

    .filters{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-bottom:24px}
    .filters button{font-family:'Cinzel';font-size:12px;letter-spacing:.04em;background:transparent;border:1px solid var(--gold);
      color:var(--mut);padding:8px 16px;border-radius:3px;cursor:pointer;transition:.15s}
    .filters button.active,.filters button:hover{background:var(--gold);color:#211809}

    /* certs */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    @media(max-width:600px){.certs{grid-template-columns:1fr}}
    .cert{display:grid;grid-template-columns:120px 1fr;border:2px solid var(--gold);border-radius:5px;overflow:hidden;
      background:rgba(30,26,21,.6);box-shadow:0 0 0 3px var(--stone0)}
    .cert img{width:100%;height:100%;object-fit:cover;min-height:150px;filter:sepia(.18)}
    .cert .ct{padding:16px}
    .cert .meta{display:flex;justify-content:space-between;font-family:'Cinzel';font-size:11px;color:var(--red);letter-spacing:.04em}
    .cert h4{font-family:'Cinzel';margin:8px 0 6px;font-size:16px;color:var(--gold2)}
    .cert p{margin:0;color:var(--mut);font-size:15px}
    @media(max-width:400px){.cert{grid-template-columns:88px 1fr}}

    /* contact */
    .contact{display:grid;grid-template-columns:1fr 1.2fr;gap:26px}
    @media(max-width:760px){.contact{grid-template-columns:1fr}}
    .cinfo a{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
    .cinfo a span:first-child{font-family:'Cinzel';font-size:13px;color:var(--mut);letter-spacing:.04em}
    .cinfo a span:last-child{color:var(--gold2)}
    form input,form textarea{width:100%;background:rgba(20,17,13,.7);border:1px solid var(--gold);border-radius:4px;color:var(--ink);
      font-family:inherit;font-size:16px;padding:13px;margin-bottom:13px}
    form input:focus,form textarea:focus{outline:none;border-color:var(--gold2);box-shadow:0 0 10px rgba(201,162,74,.3)}
    form textarea{min-height:120px;resize:vertical}
    #cf-status{font-family:'Cinzel';margin-top:4px;font-size:14px;letter-spacing:.02em}

    footer{border-top:2px solid var(--gold);padding:36px 0 70px;text-align:center}
    .fsoc{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
    .fsoc a{font-family:'Cinzel';color:var(--mut);font-size:12px;letter-spacing:.06em}
    .fsoc a:hover{color:var(--gold2)}
    .muted{color:#7f745e;font-size:15px;margin-top:12px;font-style:italic}
    .load-note{grid-column:1/-1;color:var(--mut);text-align:center;padding:18px;border:1px dashed var(--line);border-radius:5px;font-style:italic}

    @media(prefers-reduced-motion:reduce){ .torch .flame{animation:none} *{scroll-behavior:auto} }
  </style>
</head>
<body>
  <div class="torch l" aria-hidden="true"><div class="flame"></div><div class="handle"></div></div>
  <div class="torch r" aria-hidden="true"><div class="flame" style="animation-delay:.5s"></div><div class="handle"></div></div>

  <div class="topbar"><div class="wrap row">
    <a class="brand" href="#top">Cai<b>Jiechao</b></a>
    <nav class="nav" id="nav"></nav>
  </div></div>

  <div id="top"></div>
  <header class="hero"><div class="wrap">
    <div class="portcullis"></div>
    <div class="banners" id="banners"></div>
    <div class="greet" id="greet"></div>
    <h1 id="name"></h1>
    <div class="role" id="role"></div>
    <p class="tag" id="tag"></p>
    <div class="btns">
      <a class="btn pri" id="cvBtn" download><i class="fa fa-scroll"></i><span></span></a>
      <a class="btn gho" id="ghBtn" target="_blank" rel="noopener"><i class="fa fa-github"></i>GitHub</a>
    </div>
    <div class="crest-wrap">
      <svg viewBox="0 0 120 150" role="img" aria-label="coat of arms shield">
        <defs><linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3126"/><stop offset="1" stop-color="#1c1712"/></linearGradient></defs>
        <path d="M60 6 L112 22 V78 Q112 122 60 146 Q8 122 8 78 V22 Z" fill="url(#sh)" stroke="#c9a24a" stroke-width="4"/>
        <path d="M60 6 V146 M8 62 H112" stroke="#c9a24a" stroke-width="2" opacity=".55"/>
        <text x="35" y="52" font-size="24" text-anchor="middle" fill="#e6c877">🦁</text>
        <text x="85" y="52" font-size="22" text-anchor="middle" fill="#e6c877">👑</text>
        <text x="35" y="108" font-size="22" text-anchor="middle" fill="#e6c877">🗡</text>
        <text x="85" y="108" font-size="22" text-anchor="middle" fill="#e6c877">🏰</text>
      </svg>
    </div>
  </div></header>

  <section id="about"><div class="wrap"><div class="panel">
    <div class="stonehead"><div class="k">The Great Hall</div><h2 id="l-about"></h2><div class="banner-rule">⚜ ✦ ⚜</div></div>
    <div class="about"><div class="pic"><img id="portrait" alt="Cai Jiechao portrait" /></div>
      <div><div id="bio"></div><span class="loc" id="loc"></span></div></div>
  </div></div></section>

  <section id="education"><div class="wrap"><div class="panel">
    <div class="stonehead"><div class="k">The Lineage</div><h2 id="l-edu"></h2><div class="banner-rule">⚜ ✦ ⚜</div></div>
    <div class="rows" id="edu"></div>
  </div></div></section>

  <section id="skills"><div class="wrap"><div class="panel">
    <div class="stonehead"><div class="k">The Armory</div><h2 id="l-skills"></h2><div class="banner-rule">⚜ ✦ ⚜</div></div>
    <div class="skills" id="skills-box"></div>
    <div class="tags" id="tags"></div>
  </div></div></section>

  <section id="courses"><div class="wrap"><div class="panel">
    <div class="stonehead"><div class="k">The Scriptorium</div><h2 id="l-courses"></h2><div class="banner-rule">⚜ ✦ ⚜</div></div>
    <div class="courses" id="courses-box"></div>
  </div></div></section>

  <section id="experience"><div class="wrap"><div class="panel">
    <div class="stonehead"><div class="k">The Campaign</div><h2 id="l-exp"></h2><div class="banner-rule">⚜ ✦ ⚜</div></div>
    <div class="rows" id="exp"></div>
  </div></div></section>

  <section id="projects"><div class="wrap"><div class="panel">
    <div class="stonehead"><div class="k">The Treasury</div><h2 id="l-projects"></h2><div class="banner-rule">⚜ ✦ ⚜</div></div>
    <div class="cards" id="projects-box"><div class="load-note" id="proj-load"></div></div>
  </div></div></section>

  <section id="articles"><div class="wrap"><div class="panel">
    <div class="stonehead"><div class="k">The Chronicle</div><h2 id="l-articles"></h2><div class="banner-rule">⚜ ✦ ⚜</div></div>
    <div class="filters" id="filters"></div>
    <div class="cards" id="articles-box"><div class="load-note" id="art-load"></div></div>
  </div></div></section>

  <section id="certificates"><div class="wrap"><div class="panel">
    <div class="stonehead"><div class="k">The Gallery</div><h2 id="l-certs"></h2><div class="banner-rule">⚜ ✦ ⚜</div></div>
    <div class="certs" id="certs"></div>
  </div></div></section>

  <section id="contact"><div class="wrap"><div class="panel">
    <div class="stonehead"><div class="k">The Herald</div><h2 id="l-contact"></h2><div class="banner-rule">⚜ ✦ ⚜</div></div>
    <div class="contact">
      <div class="cinfo" id="cinfo"></div>
      <form id="cf">
        <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
        <input type="text" name="name" id="cf-name" required>
        <input type="email" name="email" id="cf-email" required>
        <textarea name="message" id="cf-msg" required></textarea>
        <button type="submit" class="btn pri" id="cf-send"></button>
        <p id="cf-status"></p>
      </form>
    </div>
  </div></div></section>

  <footer><div class="wrap">
    <div class="fsoc" id="fsoc"></div>
    <div class="muted" id="foot-desc"></div>
    <a class="muted" id="foot-icp" target="_blank" rel="noopener" style="display:inline-block"></a>
  </div></footer>

  <script>window.THEME_ID = "65-castle";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P=CJCData.profile,t=CJCData.t.bind(CJCData),esc=CJCData.escapeHtml;
    let articles=[],projects=[],filterKey="all";
    const charges=['🦁','👑','⚜','🗡','🏰'];

    function banner(col,charge){
      return `<svg class="banner" viewBox="0 0 56 90" role="img" aria-label="heraldic banner">
        <rect x="6" y="0" width="44" height="4" fill="#c9a24a"/>
        <path d="M8 4 H48 V72 L28 86 L8 72 Z" fill="${col}" stroke="#c9a24a" stroke-width="2"/>
        <text x="28" y="44" font-size="20" text-anchor="middle">${charge}</text></svg>`;
    }

    function renderStatic(){
      document.getElementById('nav').innerHTML=[
        ['about','nav_about'],['skills','nav_courses'],['projects','nav_portfolio'],
        ['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');
      document.getElementById('banners').innerHTML=[
        ['#8f2d2d','🦁'],['#2e4a7a','👑'],['#2f5a3a','⚜'],['#6b4a1f','🏰']
      ].map(([c,ch])=>banner(c,ch)).join('');

      document.getElementById('greet').textContent=t(P.greeting);
      document.getElementById('name').textContent=t(P.name);
      document.getElementById('role').textContent=t(P.role);
      document.getElementById('tag').textContent=t(P.title);
      const cv=document.getElementById('cvBtn'); cv.href=t(P.cv); cv.querySelector('span').textContent=t(P.ui.download_cv);
      document.getElementById('ghBtn').href=P.contact.github;
      document.getElementById('portrait').src=P.avatar;

      document.getElementById('l-about').textContent=t(P.ui.about_me);
      document.getElementById('l-edu').textContent=t(P.ui.education_bg);
      document.getElementById('l-skills').textContent=t(P.ui.core_tech);
      document.getElementById('l-courses').textContent=t(P.ui.core_courses);
      document.getElementById('l-exp').textContent=t(P.ui.internship_exp);
      document.getElementById('l-projects').textContent=t(P.ui.latest_projects);
      document.getElementById('l-articles').textContent=t(P.ui.latest_articles);
      document.getElementById('l-certs').textContent=t(P.ui.certificates);
      document.getElementById('l-contact').textContent=t(P.ui.get_in_touch);

      document.getElementById('bio').innerHTML=P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('');
      document.getElementById('loc').innerHTML=`<i class="fa fa-map-marker"></i> ${esc(t(P.location))}`;

      document.getElementById('edu').innerHTML=P.education.map(e=>`
        <div class="rowi"><div class="p">${esc(e.period)}</div>
        <h3>${esc(t(e.school))}</h3><div class="s">${esc(t(e.degree))} — ${esc(t(e.note))}</div></div>`).join('');

      document.getElementById('skills-box').innerHTML=P.skills.map((s,i)=>`
        <div class="sk"><div class="h">${charges[i%charges.length]}</div><div class="v">${esc(s)}</div></div>`).join('');
      document.getElementById('tags').innerHTML=P.skillTags.map(x=>`<span>${esc(x)}</span>`).join('');

      document.getElementById('courses-box').innerHTML=P.courses.map(c=>`
        <div class="course"><i class="fa ${esc(c.icon)}"></i><h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');

      document.getElementById('exp').innerHTML=P.experience.map(x=>`
        <div class="rowi"><div class="p">${esc(x.period)}</div>
        <h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3>
        <div class="s">${esc(t(x.summary))}</div>
        <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div>`).join('');

      document.getElementById('certs').innerHTML=P.certificates.map(c=>`
        <div class="cert"><img src="${esc(c.image)}" alt="${esc(t(c.title))}" onerror="this.src='/index_page/img/blogs/1.jpg'">
        <div class="ct"><div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');

      document.getElementById('cinfo').innerHTML=[
        ['Raven',P.contact.email,'mailto:'+P.contact.email],
        ['Herald',P.contact.phone,P.contact.phoneHref],
        ['GitHub','@'+P.contact.githubUser,P.contact.github],
        ['WeChat','QR ↗',P.contact.wechatQrPage]
      ].map(([k,v,h])=>`<a href="${esc(h)}"><span>${esc(k)}</span><span>${esc(v)}</span></a>`).join('');
      document.getElementById('cf-name').placeholder=t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder=t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder=t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent=t(P.ui.send);

      document.getElementById('fsoc').innerHTML=`
        <a href="${P.contact.github}" target="_blank" rel="noopener">GitHub</a>
        <a href="mailto:${P.contact.email}">Raven</a>
        <a href="${P.contact.wechatQrPage}">WeChat</a>
        <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent=t(P.ui.footer_desc);
      const icp=document.getElementById('foot-icp'); icp.textContent=P.icp; icp.href=P.icpUrl;

      document.getElementById('filters').innerHTML=P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box=document.getElementById('projects-box');
      if(!projects.length){ box.innerHTML=`<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML=projects.map(p=>`
        <a class="card" href="${esc(p.href)}">
          <div class="cbody">
            <div class="ctag"><span>${esc(t(P.ui.tech_stack))}</span><span>${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <p class="tech">${esc(p.tech_stack||'')}</p>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div></a>`).join('');
    }
    function renderArticles(){
      const box=document.getElementById('articles-box');
      const list=CJCData.filterArticles(articles,filterKey);
      if(!list.length){ box.innerHTML=`<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML=list.map(a=>`
        <a class="card" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
          <div class="cbody">
            <div class="ctag"><span>${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div></a>`).join('');
    }
    async function loadDynamic(){
      try{ projects=await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-box').innerHTML=`<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles=await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-box').innerHTML=`<div class="load-note">⚠ Failed to load articles.</div>`; }
    }

    document.getElementById('cf').addEventListener('submit',async(e)=>{
      e.preventDefault();
      const f=e.target,s=document.getElementById('cf-status');
      s.style.color='var(--mut)'; s.textContent=t(P.ui.sending);
      try{ const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});
        s.style.color='var(--gold2)'; s.textContent=r.message||'The raven flies.'; f.reset(); }
      catch(err){ s.style.color='#d06a5a'; s.textContent=err.message; }
    });

    document.addEventListener('DOMContentLoaded',()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({accent:'#c9a24a'});
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cai Jiechao — Windows 97</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <style>
    :root{
      --teal:#008080; --face:#c0c0c0; --face2:#dfdfdf; --shadow:#808080; --dark:#0a0a0a;
      --navy:#000080; --navy2:#1084d0; --ink:#000; --field:#ffffff; --accent:#000080;
      --raise: inset -1px -1px 0 var(--dark), inset 1px 1px 0 var(--face2), inset -2px -2px 0 var(--shadow), inset 2px 2px 0 #fff;
      --sink: inset -1px -1px 0 #fff, inset 1px 1px 0 var(--shadow), inset -2px -2px 0 var(--face2), inset 2px 2px 0 var(--dark);
      --tbh:40px;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;padding:0;overflow:hidden}
    body{
      background:var(--teal);color:var(--ink);
      font-family:'Tahoma','MS Sans Serif','Segoe UI',Geneva,sans-serif;
      font-size:13px;line-height:1.45;-webkit-user-select:none;user-select:none;
    }
    a{color:var(--navy)}
    img{max-width:100%;display:block}
    button{font-family:inherit}

    /* ===== desktop ===== */
    #desktop{position:fixed;left:0;right:0;top:0;bottom:var(--tbh);background:var(--teal);overflow:hidden}

    /* ===== desktop icons ===== */
    #icons{position:absolute;top:8px;left:6px;bottom:8px;width:172px;z-index:1;
      display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:2px}
    .dicon{width:82px;background:none;border:0;cursor:pointer;color:#fff;
      display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 3px;margin:2px 0}
    .dicon .em{font-size:30px;line-height:1;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.45))}
    .dicon .lb{font-size:11px;color:#fff;line-height:1.15;padding:1px 3px;text-align:center;
      text-shadow:0 1px 2px rgba(0,0,0,.6);max-width:80px;word-break:break-word}
    .dicon:focus{outline:none}
    .dicon.sel .em{filter:drop-shadow(1px 1px 0 rgba(0,0,0,.45)) hue-rotate(200deg) saturate(.4) brightness(.9)}
    .dicon.sel .lb{background:var(--navy);text-shadow:none;outline:1px dotted #fff}

    /* ===== window chrome ===== */
    .win{position:absolute;display:none;flex-direction:column;background:var(--face);
      padding:3px;box-shadow:var(--raise);min-width:230px;min-height:130px;overflow:hidden}
    .win.max{border-radius:0}
    .tb{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:3px 3px 3px 6px;
      font-weight:bold;color:#dcdcdc;touch-action:none;cursor:default;
      background:linear-gradient(90deg,#7c7c7c,#b0b0b0)}
    .win.active .tb{color:#fff;background:linear-gradient(90deg,var(--navy),var(--navy2));cursor:grab}
    .win.active .tb:active{cursor:grabbing}
    .win.max .tb{cursor:default}
    .tb .ico{font-size:14px;line-height:1}
    .tb .ttl{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tb .ctrls{display:flex;gap:2px}
    .tb .ctrls button{width:18px;height:16px;background:var(--face);color:#000;border:0;
      box-shadow:var(--raise);font-size:10px;font-weight:bold;line-height:1;cursor:pointer;
      display:flex;align-items:center;justify-content:center;padding:0}
    .tb .ctrls button:active{box-shadow:var(--sink)}
    .menubar{flex:0 0 auto;display:flex;gap:14px;padding:3px 8px;background:var(--face);font-size:12px;color:#000}
    .menubar span u{text-decoration:underline}
    .body{flex:1 1 auto;min-height:0;overflow:auto;padding:14px;background:var(--face);color:#000}

    h1,h2,h3,h4{margin:0;font-weight:bold}
    .sec-desc{color:#404040;margin:0 0 12px;font-size:12px}

    /* ===== buttons / fields ===== */
    .btn{display:inline-flex;align-items:center;gap:7px;background:var(--face);color:#000;border:0;
      box-shadow:var(--raise);padding:7px 16px;font-family:inherit;font-size:13px;cursor:pointer;
      min-height:26px;text-decoration:none}
    .btn:active{box-shadow:var(--sink);padding:8px 15px 6px 17px}
    .btn:focus-visible{outline:1px dotted #000;outline-offset:-4px}
    input,textarea{width:100%;background:var(--field);border:0;box-shadow:var(--sink);
      font-family:inherit;font-size:13px;padding:5px 6px;margin-bottom:12px;color:#000;-webkit-user-select:text;user-select:text}
    input:focus,textarea:focus{outline:none}
    textarea{min-height:96px;resize:vertical}

    /* ===== hero (readme) ===== */
    .hero-in{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
    .hero-in .avatar{width:104px;height:104px;object-fit:cover;box-shadow:var(--sink);padding:3px;background:#fff;flex:0 0 auto}
    .hero{flex:1 1 200px;min-width:180px}
    .greet{font-size:12px;color:#000080;font-weight:bold}
    .hero h1{font-size:clamp(20px,4vw,30px);margin:6px 0 4px}
    .hero .head{font-size:15px;margin:8px 0}
    .hero .role{color:#333;font-size:13px}
    .hero .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
    .readme-note{margin:0 0 14px;padding:10px 12px;background:#ffffe1;box-shadow:var(--sink);color:#333;font-size:12.5px}

    /* ===== generic listing (edu/exp) ===== */
    .rows>div{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:12px;margin-bottom:10px;
      background:#fff;box-shadow:var(--sink)}
    .rows .when{color:#000080;font-weight:bold}
    .rows h3{font-size:14px;margin-bottom:4px}
    .rows .sub{color:#333;font-size:12.5px}
    .rows ul{margin:8px 0 0;padding-left:18px;color:#222}
    .rows ul li{margin-bottom:3px}
    @media(max-width:420px){.rows>div{grid-template-columns:1fr;gap:4px}}

    /* ===== tag list ===== */
    .tags{display:flex;flex-wrap:wrap;gap:8px}
    .tag{background:var(--face);box-shadow:var(--raise);padding:4px 10px;font-size:12px}

    /* ===== courses ===== */
    .grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
    .course{background:#fff;box-shadow:var(--sink);padding:12px}
    .course .ic{font-size:22px}
    .course h4{font-size:13px;margin:6px 0 4px;color:#000080}
    .course p{margin:0;color:#333;font-size:12px}

    /* ===== explorer (projects/articles) ===== */
    .explorer{background:#fff;box-shadow:var(--sink);padding:8px}
    .files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
    .file{display:flex;flex-direction:column;gap:6px;padding:10px;text-decoration:none;color:#000;cursor:pointer}
    .file:hover{background:var(--navy);color:#fff}
    .file:hover .meta,.file:hover p{color:#dfe7ff}
    .file .thumb{height:92px;background:var(--face);box-shadow:var(--raise);overflow:hidden}
    .file .thumb img{width:100%;height:100%;object-fit:cover}
    .file .ic{font-size:26px}
    .file .meta{font-size:11px;color:#000080;display:flex;justify-content:space-between;gap:6px}
    .file h4{font-size:12.5px}
    .file p{margin:0;font-size:11.5px;color:#444}

    .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
    .filters button{background:var(--face);box-shadow:var(--raise);border:0;padding:5px 12px;
      font-family:inherit;font-size:12px;cursor:pointer}
    .filters button.active{box-shadow:var(--sink);font-weight:bold;color:#000080}

    /* ===== certificates ===== */
    .certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
    .cert{display:grid;grid-template-columns:88px 1fr;gap:12px;background:#fff;box-shadow:var(--sink);padding:12px}
    .cert img{width:100%;box-shadow:var(--raise);padding:2px;background:#fff}
    .cert .meta{font-size:11px;color:#000080;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
    .cert h4{font-size:13px;margin:6px 0 4px}
    .cert p{margin:0;font-size:12px;color:#333}

    /* ===== contact ===== */
    .contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;align-items:start}
    .cinfo a{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;margin-bottom:8px;
      background:#fff;box-shadow:var(--sink);text-decoration:none;color:#000}
    .cinfo a span:last-child{color:#000080;font-weight:bold}
    #cf-status{margin-top:6px;font-size:12.5px;font-weight:bold}

    /* ===== system / about-this-computer ===== */
    .sysbox{display:flex;gap:16px;align-items:flex-start}
    .syslogo{font-size:52px;line-height:1;flex:0 0 auto}
    .sysbox h3{font-size:15px;margin-bottom:4px}
    .sysbox p{margin:0 0 8px;color:#333;font-size:12.5px}
    .foot{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:12px}
    .foot a{color:#000080;text-decoration:none}
    .foot a:hover{text-decoration:underline}
    .load-note{padding:14px;color:#333;grid-column:1/-1}

    /* ===== taskbar ===== */
    .taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tbh);z-index:9000;
      background:var(--face);box-shadow:var(--raise);display:flex;align-items:center;gap:6px;padding:4px 6px}
    .start{display:inline-flex;align-items:center;gap:6px;background:var(--face);box-shadow:var(--raise);
      border:0;font-family:inherit;font-weight:bold;font-size:13px;padding:5px 12px 5px 8px;cursor:pointer;height:30px;flex:0 0 auto}
    .start:active,.start.open{box-shadow:var(--sink)}
    .start .flag{font-size:15px}
    .tasks{display:flex;gap:5px;overflow-x:auto;flex:1 1 auto;height:30px}
    .tasks::-webkit-scrollbar{height:0}
    .taskbtn{flex:0 0 auto;max-width:160px;background:var(--face);box-shadow:var(--raise);border:0;
      font-family:inherit;font-size:12px;padding:0 10px;height:30px;cursor:pointer;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;text-align:left;display:inline-flex;align-items:center;gap:6px}
    .taskbtn .tbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .taskbtn.active{box-shadow:var(--sink);font-weight:bold}
    .tray{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--sink);padding:0 10px;height:30px;font-size:12px}

    /* ===== start menu ===== */
    .startmenu{position:fixed;left:6px;bottom:calc(var(--tbh) + 4px);z-index:9500;width:236px;background:var(--face);
      box-shadow:var(--raise);display:none;padding:3px}
    .startmenu.open{display:flex}
    .startmenu .side{width:30px;background:linear-gradient(var(--navy),var(--navy2));
      writing-mode:vertical-rl;transform:rotate(180deg);color:#fff;font-weight:bold;font-size:15px;
      text-align:right;padding:10px 4px;letter-spacing:1px}
    .startmenu .items{flex:1;padding:2px}
    .startmenu .items a,.startmenu .items button{display:flex;align-items:center;gap:10px;width:100%;
      text-align:left;background:none;border:0;font-family:inherit;font-size:13px;padding:7px 8px;cursor:pointer;color:#000;text-decoration:none}
    .startmenu .items a:hover,.startmenu .items button:hover{background:var(--navy);color:#fff}
    .startmenu .sep{border-top:1px solid var(--shadow);border-bottom:1px solid #fff;margin:3px 2px}

    /* keep shared theme-switcher clear of window title bars: park it above the taskbar */
    body #cjc-switcher{top:auto;bottom:calc(var(--tbh) + 8px);right:12px}

    :focus-visible{outline:1px dotted #000;outline-offset:1px}
  </style>
</head>

  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    const ICONMAP = {'fa-sitemap':'🧠','fa-language':'💬','fa-cogs':'⚙️','fa-code':'💾','fa-linux':'🐧','fa-wifi':'📡'};
    let articles = [], projects = [], filterKey = "all";

    /* ---- window registry (single source for icons, taskbar, titles, geometry) ---- */
    const WINS = [
      {id:'readme',      icon:'📖', desktop:true,  label:{en:'Read Me',zh:'自述文件'},        x:118,y:18, w:452,h:392},
      {id:'about',       icon:'📄', desktop:true,  label:P.ui.about_me,                      x:492,y:60, w:460,h:340},
      {id:'education',   icon:'🎓', desktop:true,  label:P.ui.education_bg,                   x:150,y:120,w:470,h:300},
      {id:'skills',      icon:'🧰', desktop:true,  label:P.ui.core_tech,                      x:530,y:150,w:400,h:300},
      {id:'courses',     icon:'📚', desktop:true,  label:P.ui.core_courses,                   x:180,y:52, w:580,h:430},
      {id:'experience',  icon:'💼', desktop:true,  label:P.ui.internship_exp,                 x:230,y:96, w:540,h:400},
      {id:'projects',    icon:'🗂️', desktop:true,  label:P.ui.latest_projects,                x:210,y:44, w:620,h:450},
      {id:'articles',    icon:'📰', desktop:true,  label:P.ui.latest_articles,                x:158,y:30, w:660,h:470},
      {id:'certificates',icon:'🏅', desktop:true,  label:P.ui.certificates,                   x:288,y:82, w:600,h:420},
      {id:'contact',     icon:'✉️', desktop:true,  label:P.ui.get_in_touch,                   x:262,y:92, w:600,h:440},
      {id:'system',      icon:'💻', desktop:false, label:{en:'About This Computer',zh:'关于本机'}, x:340,y:128,w:448,h:322},
    ];
    const DEF = {}; WINS.forEach(function(w){ DEF[w.id]=w; });
    const st = {}; WINS.forEach(function(w){ st[w.id]={open:false,min:false,max:false,x:w.x,y:w.y,w:w.w,h:w.h,z:0}; });
    let z = 100, focused = null, drag = null;

    const desktop = document.getElementById('desktop');
    const tasks = document.getElementById('tasks');
    const icons = document.getElementById('icons');
    function byId(id){ return document.getElementById('win-'+id); }
    function isMobile(){ return window.innerWidth <= 720; }
    function isTouch(){ return window.matchMedia('(pointer:coarse)').matches; }

    /* ---- geometry / render ---- */
    function ensureFit(id){
      const s = st[id], dW = desktop.clientWidth, dH = desktop.clientHeight;
      if(isMobile()){ s.max=false; s.x=5; s.y=5; s.w=dW-10; s.h=dH-10; return; }
      s.w = Math.max(230, Math.min(s.w, dW-16));
      s.h = Math.max(130, Math.min(s.h, dH-16));
      s.x = Math.max(4, Math.min(s.x, dW - s.w - 4));
      s.y = Math.max(0, Math.min(s.y, dH - s.h - 4));
    }
    function applyWin(id){
      const el = byId(id), s = st[id];
      el.style.display = (s.open && !s.min) ? 'flex' : 'none';
      el.style.zIndex = s.z;
      el.classList.toggle('active', id===focused && s.open && !s.min);
      el.classList.toggle('max', s.max);
      if(s.max){ el.style.left='0'; el.style.top='0'; el.style.width='100%'; el.style.height='100%'; }
      else { el.style.left=s.x+'px'; el.style.top=s.y+'px'; el.style.width=s.w+'px'; el.style.height=s.h+'px'; }
    }
    function refresh(){ WINS.forEach(function(w){ applyWin(w.id); }); buildTaskbar(); }
    function topVisible(){
      let best=null, bz=-1;
      WINS.forEach(function(w){ const s=st[w.id]; if(s.open && !s.min && s.z>bz){ bz=s.z; best=w.id; } });
      return best;
    }

    /* ---- window actions ---- */
    function openWin(id){ const s=st[id]; s.open=true; s.min=false; ensureFit(id); focusWin(id); }
    function focusWin(id){ const s=st[id]; if(!s.open) s.open=true; s.min=false; s.z=++z; focused=id; refresh(); }
    function minWin(id){ st[id].min=true; if(focused===id) focused=topVisible(); refresh(); }
    function closeWin(id){ const s=st[id]; s.open=false; s.min=false; s.max=false; if(focused===id) focused=topVisible(); refresh(); }
    function toggleMax(id){ if(isMobile()) return; st[id].max=!st[id].max; focusWin(id); }
    function taskClick(id){ const s=st[id]; if(s.min){ s.min=false; focusWin(id);} else if(focused===id){ minWin(id);} else focusWin(id); }

    /* ---- taskbar ---- */
    function buildTaskbar(){
      const open = WINS.filter(function(w){ return st[w.id].open; });
      tasks.innerHTML = open.map(function(w){
        const active = (w.id===focused && !st[w.id].min) ? ' active' : '';
        return '<button class="taskbtn'+active+'" data-id="'+w.id+'"><span aria-hidden="true">'+w.icon+'</span><span class="tbl">'+esc(t(w.label))+'</span></button>';
      }).join('');
      tasks.querySelectorAll('.taskbtn').forEach(function(b){
        b.addEventListener('click', function(){ taskClick(b.dataset.id); });
      });
    }

    /* ---- desktop icons ---- */
    function selectIcon(el){
      icons.querySelectorAll('.dicon').forEach(function(x){ x.classList.remove('sel'); });
      if(el) el.classList.add('sel');
    }
    function buildIcons(){
      icons.innerHTML = WINS.filter(function(w){ return w.desktop; }).map(function(w){
        return '<button class="dicon" data-id="'+w.id+'"><span class="em" aria-hidden="true">'+w.icon+'</span><span class="lb">'+esc(t(w.label))+'</span></button>';
      }).join('');
      icons.querySelectorAll('.dicon').forEach(function(ic){
        const id = ic.dataset.id;
        ic.addEventListener('click', function(){ selectIcon(ic); if(isTouch() || isMobile()) openWin(id); });
        ic.addEventListener('dblclick', function(){ openWin(id); });
      });
    }
    function relabelIcons(){
      icons.querySelectorAll('.dicon').forEach(function(ic){ ic.querySelector('.lb').textContent = t(DEF[ic.dataset.id].label); });
    }

    /* ---- dragging + titlebar controls + focus ---- */
    function setupWindow(w){
      const id = w.id, el = byId(id), tb = el.querySelector('.tb');
      el.addEventListener('pointerdown', function(){ if(focused!==id) focusWin(id); });
      tb.addEventListener('dblclick', function(e){ if(e.target.closest('.ctrls')) return; toggleMax(id); });
      el.querySelectorAll('.ctrls button').forEach(function(b){
        b.addEventListener('click', function(e){
          e.stopPropagation();
          const a = b.dataset.act;
          if(a==='min') minWin(id); else if(a==='max') toggleMax(id); else if(a==='close') closeWin(id);
        });
      });
      tb.addEventListener('pointerdown', function(e){
        if(e.target.closest('.ctrls')) return;
        const s = st[id]; if(s.max) return;
        drag = { id:id, sx:e.clientX, sy:e.clientY, ox:s.x, oy:s.y };
        tb.setPointerCapture(e.pointerId); e.preventDefault();
      });
      tb.addEventListener('pointermove', function(e){
        if(!drag || drag.id!==id) return;
        const s = st[id], dW = desktop.clientWidth, dH = desktop.clientHeight;
        s.x = Math.max(-(s.w-80), Math.min(drag.ox + (e.clientX-drag.sx), dW-80));
        s.y = Math.max(0, Math.min(drag.oy + (e.clientY-drag.sy), dH-24));
        el.style.left = s.x+'px'; el.style.top = s.y+'px';
      });
      function endDrag(){ drag = null; }
      tb.addEventListener('pointerup', endDrag);
      tb.addEventListener('pointercancel', endDrag);
    }

    /* ================= content rendering ================= */
    function renderChrome(){
      WINS.forEach(function(w){ const el=byId(w.id); el.querySelector('.ttl').textContent = t(w.label); });
      relabelIcons();
      buildTaskbar();
      buildStartMenu();
    }

    function renderContent(){
      document.title = "Cai Jiechao — Windows 97";
      document.getElementById('readme-note').textContent = t({en:"Welcome! Double-click the desktop icons to open a window. Drag windows by their title bar.",
        zh:"欢迎！双击桌面图标可打开窗口，拖动标题栏可移动窗口。"});
      document.getElementById('greet').textContent = t(P.greeting);
      document.getElementById('name').textContent = t(P.name);
      document.getElementById('headline').textContent = t(P.headline);
      document.getElementById('role').textContent = t(P.role)+' — '+t(P.title);
      document.getElementById('cvBtn').href = t(P.cv);
      document.getElementById('cvTxt').textContent = t(P.ui.download_cv);
      document.getElementById('ghBtn').href = P.contact.github;
      document.getElementById('portrait').src = P.avatar;
      document.getElementById('portrait').alt = t(P.name);

      document.getElementById('l-about-desc').textContent = t(P.ui.about_desc);
      document.getElementById('about-text').innerHTML =
        P.bio.map(function(b){ return '<p style="margin:0 0 12px">'+esc(t(b))+'</p>'; }).join('')
        + '<p style="color:#000080;font-weight:bold;margin:0">📍 '+esc(t(P.location))+'</p>';

      document.getElementById('edu-list').innerHTML = P.education.map(function(e){
        return '<div><div class="when">'+esc(e.period)+'</div>'
          +'<div><h3>'+esc(t(e.school))+'</h3><div class="sub">'+esc(t(e.degree))+' — '+esc(t(e.note))+'</div></div></div>';
      }).join('');

      document.getElementById('skills-list').innerHTML = P.skillTags.map(function(s){
        return '<span class="tag">'+esc(s)+'</span>'; }).join('');

      document.getElementById('courses-list').innerHTML = P.courses.map(function(c){
        return '<div class="course"><div class="ic" aria-hidden="true">'+(ICONMAP[c.icon]||'📘')+'</div>'
          +'<h4>'+esc(t(c.title))+'</h4><p>'+esc(t(c.desc))+'</p></div>';
      }).join('');

      document.getElementById('exp-list').innerHTML = P.experience.map(function(x){
        return '<div><div class="when">'+esc(x.period)+'</div>'
          +'<div><h3>'+esc(t(x.role))+' · '+esc(t(x.company))+'</h3>'
          +'<div class="sub">'+esc(t(x.summary))+'</div>'
          +'<ul>'+x.bullets.map(function(b){ return '<li>'+esc(t(b))+'</li>'; }).join('')+'</ul></div></div>';
      }).join('');

      document.getElementById('certs-list').innerHTML = P.certificates.map(function(c){
        return '<div class="cert"><img src="'+esc(c.image)+'" alt="'+esc(t(c.title))+'" onerror="this.src=\'/index_page/img/blogs/1.jpg\'">'
          +'<div><div class="meta"><span>'+esc(t(c.tag))+'</span><span>'+esc(t(c.date))+'</span></div>'
          +'<h4>'+esc(t(c.title))+'</h4><p>'+esc(t(c.desc))+'</p></div></div>';
      }).join('');

      document.getElementById('contact-info').innerHTML = [
        ['Email', P.contact.email, 'mailto:'+P.contact.email],
        ['Phone', P.contact.phone, P.contact.phoneHref],
        ['GitHub', '@'+P.contact.githubUser, P.contact.github],
        ['WeChat', 'QR ›', P.contact.wechatQrPage]
      ].map(function(r){ return '<a href="'+esc(r[2])+'"><span>'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></a>'; }).join('');
      document.getElementById('cf-name').placeholder = t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder = t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder = t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent = '📨 '+t(P.ui.send);

      document.getElementById('sys-name').textContent = t(P.name);
      document.getElementById('sys-desc').textContent = t(P.ui.footer_desc);
      document.getElementById('sys-social').innerHTML =
        '<a href="'+P.contact.github+'" target="_blank" rel="noopener">GitHub</a>'
        +'<a href="mailto:'+P.contact.email+'">Email</a>'
        +'<a href="'+P.contact.wechatQrPage+'">WeChat</a>'
        +'<a href="/admin.html">'+esc(t(P.ui.admin_panel))+'</a>';
      const icp = document.getElementById('sys-icp'); icp.textContent = P.icp; icp.href = P.icpUrl;

      document.getElementById('filters').innerHTML = P.articleFilters.map(function(f){
        return '<button data-k="'+esc(f.key)+'" class="'+(f.key===filterKey?'active':'')+'">'+esc(t(f.label))+'</button>';
      }).join('');
      document.querySelectorAll('#filters button').forEach(function(b){
        b.addEventListener('click', function(){ filterKey=b.dataset.k;
          document.querySelectorAll('#filters button').forEach(function(x){ x.classList.toggle('active', x.dataset.k===filterKey); });
          renderArticles();
        });
      });
    }

    function renderProjects(){
      const box = document.getElementById('projects-list');
      if(!projects.length){ box.innerHTML = '<div class="load-note">'+esc(t(P.ui.no_projects))+'</div>'; return; }
      box.innerHTML = projects.map(function(p){
        return '<a class="file" href="'+esc(p.href)+'"><div class="ic" aria-hidden="true">📁</div>'
          +'<div class="meta"><span>'+esc(t(P.ui.tech_stack))+'</span><span>'+esc(p.dateText())+'</span></div>'
          +'<h4>'+esc(p.localTitle())+'</h4>'
          +'<p style="color:#000080">'+esc(p.tech_stack||'')+'</p>'
          +'<p>'+esc(p.localSummary()||'')+'</p></a>';
      }).join('');
    }

    function renderArticles(){
      const box = document.getElementById('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML = '<div class="load-note">'+esc(t(P.ui.no_articles))+'</div>'; return; }
      box.innerHTML = list.map(function(a){
        return '<a class="file" href="'+esc(a.href)+'">'
          +'<div class="thumb"><img src="'+esc(a.cover_image||'')+'" onerror="this.src=\'/index_page/img/blogs/1.jpg\'" alt=""></div>'
          +'<div class="meta"><span>'+esc(a.category||'')+'</span><span>'+esc(a.dateText())+'</span></div>'
          +'<h4>'+esc(a.localTitle())+'</h4>'
          +'<p>'+esc(a.localSummary()||'')+'</p></a>';
      }).join('');
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML = '<div class="load-note">⚠ '+esc(t(P.ui.no_projects))+'</div>'; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-list').innerHTML = '<div class="load-note">⚠ Failed to load / 加载失败</div>'; }
    }

    /* ---- start menu ---- */
    function buildStartMenu(){
      const items = document.getElementById('startitems');
      function item(id){ return '<button data-open="'+id+'">'+DEF[id].icon+' '+esc(t(DEF[id].label))+'</button>'; }
      items.innerHTML =
        item('readme') + item('about') + item('projects') + item('articles') + item('contact')
        + '<div class="sep"></div>'
        + item('system')
        + '<a href="'+P.contact.github+'" target="_blank" rel="noopener">🌐 GitHub</a>'
        + '<a href="/admin.html">🛠️ '+esc(t(P.ui.admin_panel))+'</a>'
        + '<a href="/themes.html">🎨 '+esc(t(P.ui.switch_theme))+'</a>'
        + '<div class="sep"></div>'
        + '<button id="sm-lang">🌏 '+(CJCData.lang()==='en'?'中文':'English')+'</button>';
      items.querySelectorAll('[data-open]').forEach(function(b){
        b.addEventListener('click', function(){ openWin(b.dataset.open); closeStart(); });
      });
      items.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', closeStart); });
      const lb = document.getElementById('sm-lang');
      if(lb) lb.addEventListener('click', function(){ CJCData.toggleLang(); closeStart(); });
    }
    function closeStart(){
      document.getElementById('startmenu').classList.remove('open');
      const sb = document.getElementById('startbtn'); sb.classList.remove('open'); sb.setAttribute('aria-expanded','false');
    }
    document.getElementById('startbtn').addEventListener('click', function(e){
      e.stopPropagation();
      const m = document.getElementById('startmenu'), open = m.classList.toggle('open');
      this.classList.toggle('open', open); this.setAttribute('aria-expanded', String(open));
    });
    document.addEventListener('click', function(e){
      if(!e.target.closest('#startmenu') && !e.target.closest('#startbtn')) closeStart();
    });
    desktop.addEventListener('pointerdown', function(e){ if(e.target===desktop || e.target===icons) selectIcon(null); });

    /* ---- contact form ---- */
    document.getElementById('cf').addEventListener('submit', async function(e){
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      const payload = { name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color='#000080'; s.textContent = t(P.ui.sending);
      try{ const r = await CJCData.sendContact(payload); s.style.color='#008000'; s.textContent = '✔ '+(r.message||'Sent.'); f.reset(); }
      catch(err){ s.style.color='#a00000'; s.textContent = '✖ '+err.message; }
    });

    /* ---- clock ---- */
    function tickClock(){
      try{
        document.getElementById('clock').textContent =
          new Date().toLocaleTimeString(CJCData.lang()==='zh'?'zh-CN':'en-US',{hour:'numeric',minute:'2-digit'});
      }catch(e){}
    }

    /* ---- keep windows inside the desktop on resize ---- */
    let rt;
    window.addEventListener('resize', function(){
      clearTimeout(rt);
      rt = setTimeout(function(){
        WINS.forEach(function(w){ if(st[w.id].open && !st[w.id].max) ensureFit(w.id); });
        refresh();
      }, 120);
    });

    /* ---- boot ---- */
    document.addEventListener('DOMContentLoaded', function(){
      CJCData.setTheme(window.THEME_ID);
      WINS.forEach(setupWindow);
      buildIcons();
      renderContent();
      renderChrome();
      CJCData.mountSwitcher({ accent:'#000080' });
      CJCData.onLang(function(){ renderContent(); renderChrome(); renderProjects(); renderArticles(); tickClock(); });
      tickClock(); setInterval(tickClock, 15000);
      loadDynamic();
      // open a couple of windows by default
      openWin('about');
      openWin('readme');
    });
  })();
  </script>
</body>

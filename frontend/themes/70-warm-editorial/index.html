  <script>window.THEME_ID='70-warm-editorial';</script><script src="/shared/profile.js"></script><script src="/shared/site-data.js"></script>
  <script>
  (()=>{'use strict';const P=CJCData.profile,t=CJCData.t.bind(CJCData),e=CJCData.escapeHtml;let projects=[],articles=[],filter='all';
  const L={en:{nav:[['about','About'],['education','Learning'],['work','Selected work'],['journal','Journal'],['contact','Contact']],intro:'Software, language models and small observations — collected with care.',hand:'make useful things',about:'A short portrait',aboutLead:'A closer look at the person, habits and ideas behind the work.',skills:'Things I use',skillsLead:'A practical shelf of languages, systems, tools and current curiosities.',education:'Where I learned',educationLead:'The institutions and ideas that continue to shape the practice.',courses:'Shelf of studies',coursesLead:'Subjects revisited often while building dependable intelligent systems.',experience:'Notes from practice',experienceLead:'What production work taught me about code, data and collaboration.',projects:'Selected work',projectsLead:'A living collection of projects, experiments and useful things.',journal:'Recent field notes',journalLead:'Essays and fragments about engineering, research and learning in public.',cert:'Keepsakes & records',certLead:'A small cabinet of milestones worth remembering.',contact:'Write a note',contactLead:'For thoughtful projects, collaborations and conversations.',location:'Written from',project:'View the work',read:'Continue reading',failed:'The archive is taking a short break. Please try again soon.',send:'Send the note',sending:'Sending…',sent:'Your note arrived safely.',name:'Your name',email:'Your email',message:'What is on your mind?',cv:'Read my CV',github:'Github'},zh:{nav:[['about','关于我'],['education','学习经历'],['work','精选作品'],['journal','近期文章'],['contact','写封信']],intro:'软件、大语言模型与一些细小观察——认真收集，也认真完成。',hand:'做真正有用的事',about:'一幅简短肖像',aboutLead:'更近一点看看作品背后的人、习惯与想法。',skills:'常用工具',skillsLead:'一排实用的语言、系统、工具与最近的兴趣。',education:'学习之处',educationLead:'持续塑造我的实践方式的学校与思想。',courses:'学习书架',coursesLead:'构建可靠智能系统时，经常重新翻阅的学科。',experience:'实践手记',experienceLead:'生产工作教会我的代码、数据与协作方法。',projects:'精选作品',projectsLead:'持续生长的项目、实验与实用作品集。',journal:'近期田野笔记',journalLead:'关于工程、研究和公开学习的文章与片段。',cert:'纪念与记录',certLead:'一个收藏值得记住的里程碑的小柜子。',contact:'写张便笺',contactLead:'欢迎认真、有趣的项目、合作与对话。',location:'写于',project:'查看作品',read:'继续阅读',failed:'档案正在短暂休息，请稍后再试。',send:'寄出便笺',sending:'正在寄出…',sent:'你的便笺已安全送达。',name:'你的姓名',email:'你的邮箱',message:'你想聊些什么？',cv:'阅读简历',github:'Github'}};
  const l=()=>L[CJCData.lang()];const link=(u,s)=>`<a href="${e(u)}">${e(s)}</a>`;const head=(i,key,title)=>`<div class="section-head reveal"><div class="section-no">No. ${String(i).padStart(2,'0')} / ${e(title)}</div><h2>${e(title)} <em>${i%2?'notes':'collection'}</em></h2><p class="section-lead">${e(l()[key+'Lead'])}</p></div>`;
  function hero(){const x=l();return `<section class="hero" id="top"><div class="wrap hero-grid"><div class="hero-copy"><div class="issue">Personal journal · issue 70</div><h1>${e(t(P.name).split(' ')[0]||t(P.name))}<span>${e(t(P.name).split(' ').slice(1).join(' ')||P.brand)}</span></h1><p class="hero-intro">${e(x.intro)} <em>${e(x.hand)}</em>.</p><div class="actions"><a class="button primary" href="${e(t(P.cv))}" download><i class="fa fa-file-text-o" aria-hidden="true"></i>${e(x.cv)}</a><a class="button" href="${e(P.contact.github)}" target="_blank" rel="noopener"><i class="fa fa-github" aria-hidden="true"></i>${e(x.github)}</a></div></div><div class="hero-collage"><figure class="hero-photo"><img src="${e(P.avatar)}" alt="${e(t(P.name))}"><figcaption>${e(t(P.role))} · ${e(t(P.location))}</figcaption></figure><aside class="note top"><b>${e(t(P.headline))}</b><span>Current intention / 2026</span></aside><aside class="note bottom"><b>${e(x.location)}</b><span>${e(t(P.location))}</span></aside></div></div></section><div class="ticker" aria-hidden="true"><div class="ticker-track">${Array(2).fill([t(P.role),'Agent & LLM Engineering',t(P.location),'Build with care','Field Notes No. 70']).flat().map(v=>`<span>${e(v)}</span>`).join('')}</div></div>`}
  function about(){const x=l(),photo=P.photos?.campus||P.avatarAlt||P.avatar;return `<section id="about" class="section paper"><div class="wrap">${head(1,'about',x.about)}<div class="about-grid"><figure class="about-photo reveal"><img loading="lazy" src="${e(photo)}" alt="${e(t(P.name))} on campus"><figcaption>${e(x.location)} · ${e(t(P.location))}</figcaption></figure><article class="bio reveal"><div class="hand">A note on the maker</div><p>${e(t(P.bio[0]))}</p><p>${e(t(P.bio[1]))}</p></article></div></div></section>`}
  function skills(){const x=l();return `<section id="skills" class="section green"><div class="wrap">${head(2,'skills',x.skills)}<div class="skill-layout reveal"><div class="skill-title"><div class="section-no">Current toolkit</div><h3>Tools for<br><em>making</em></h3><p>${e(t(P.ui.core_tech))}</p></div><div class="skill-tags">${P.skillTags.map((s,i)=>`<span>${String(i+1).padStart(2,'0')} / ${e(s)}</span>`).join('')}</div></div></div></section>`}
  function education(){const x=l();return `<section id="education" class="section"><div class="wrap">${head(3,'education',x.education)}<div class="edu-list reveal">${P.education.map((s,i)=>`<article class="edu-card" data-index="${i+1}"><div class="meta">${e(s.period)} / Record ${i+1}</div><h3>${e(t(s.school))}</h3><p>${e(t(s.degree))}<br>${e(t(s.note))}</p></article>`).join('')}</div></div></section>`}
  function courses(){const x=l();return `<section id="courses" class="section green"><div class="wrap">${head(4,'courses',x.courses)}<div class="course-list reveal">${P.courses.map(c=>`<article class="course"><i class="fa ${e(c.icon)}" aria-hidden="true"></i><h3>${e(t(c.title))}</h3><p>${e(t(c.desc))}</p></article>`).join('')}</div></div></section>`}
  function experience(){const x=l(),v=P.experience[0];return `<section id="experience" class="section paper"><div class="wrap">${head(5,'experience',x.experience)}<article class="experience-card reveal"><div class="meta">${e(v.period)}<br>${e(t(v.company))}<br>Field record 01</div><div><h3>${e(t(v.role))}</h3><p>${e(t(v.summary))}</p><ul>${v.bullets.map(b=>`<li>${e(t(b))}</li>`).join('')}</ul></div></article></div></section>`}
  function projectsView(){const x=l(),body=projects.length?`<div class="project-grid reveal">${projects.map((p,i)=>`<a class="project" href="${e(p.href)}"><div class="project-media"><img loading="lazy" src="${e(p.cover_image||'/index_page/img/blogs/1.jpg')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(p.localTitle())}"></div><div class="project-copy"><div class="meta">Work ${String(i+1).padStart(2,'0')} · ${e(p.dateText())}</div><h3>${e(p.localTitle())}</h3><p>${e(p.localSummary()||'')}</p><div class="stack">${e(p.tech_stack||t(P.ui.tech_stack))} · ${e(x.project)}</div></div></a>`).join('')}</div>`:`<p class="loading">${e(t(P.ui.loading_projects))}</p>`;return `<section id="work" class="section rust"><div class="wrap">${head(6,'projects',x.projects)}${body}</div></section>`}
  function articlesView(){const x=l(),list=CJCData.filterArticles(articles,filter),body=!articles.length?`<p class="loading">${e(t(P.ui.loading_articles))}</p>`:!list.length?`<p class="loading">${e(t(P.ui.no_articles))}</p>`:`<div class="article-grid reveal">${list.map(a=>`<article class="article"><div class="article-media"><img loading="lazy" src="${e(a.cover_image||'/index_page/img/blogs/1.jpg')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(a.localTitle())}"></div><div class="article-copy"><div class="meta">${e(a.category||'Notes')} · ${e(a.dateText())}</div><h3>${e(a.localTitle())}</h3><p>${e(a.localSummary()||'')}</p><a class="more" href="${e(a.href)}">${e(x.read)} →</a></div></article>`).join('')}</div>`;return `<section id="journal" class="section paper"><div class="wrap">${head(7,'journal',x.journal)}<div class="filters" aria-label="Article categories">${P.articleFilters.map(f=>`<button type="button" data-filter="${e(f.key)}" class="${filter===f.key?'active':''}">${e(t(f.label))}</button>`).join('')}</div>${body}</div></section>`}
  function certificates(){const x=l();return `<section id="certificates" class="section green"><div class="wrap">${head(8,'cert',x.cert)}<div class="cert-grid reveal">${P.certificates.map(c=>`<article class="certificate"><img loading="lazy" src="${e(c.image)}" alt="${e(t(c.title))}"><div><div class="meta">${e(t(c.tag))} · ${e(t(c.date))}</div><h3>${e(t(c.title))}</h3><p>${e(t(c.desc))}</p></div></article>`).join('')}</div></div></section>`}
  function contact(){const x=l();return `<section id="contact" class="section rust"><div class="wrap">${head(9,'contact',x.contact)}<div class="contact-layout"><div class="contact-copy reveal"><div class="section-no">Postscript / inbox open</div><h3>Leave a<br><em>little note.</em></h3><p>${e(t(P.ui.inbox_open))}</p><div class="contact-links"><a href="mailto:${e(P.contact.email)}"><span>Email</span><span>${e(P.contact.email)}</span></a><a href="${e(P.contact.phoneHref)}"><span>Phone</span><span>${e(P.contact.phone)}</span></a><a href="${e(P.contact.github)}" target="_blank" rel="noopener"><span>Github</span><span>@${e(P.contact.githubUser)}</span></a><a href="${e(P.contact.wechatQrPage)}"><span>WeChat</span><span>Open QR</span></a></div></div><form class="contact-form reveal" id="contact-form"><div class="hand">Write here, I read every note.</div><input name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true"><label for="contact-name">${e(x.name)}</label><input id="contact-name" name="name" autocomplete="name" required><label for="contact-email">${e(x.email)}</label><input id="contact-email" type="email" name="email" autocomplete="email" required><label for="contact-message">${e(x.message)}</label><textarea id="contact-message" name="message" required></textarea><button class="button primary" type="submit">${e(x.send)} <i class="fa fa-arrow-right" aria-hidden="true"></i></button><p id="status" role="status" aria-live="polite"></p></form></div></div></section>`}
  function render(){const x=l();document.title=`${t(P.name)} — Field Notes`;document.getElementById('nav').innerHTML=x.nav.map(v=>`<a href="#${e(v[0])}">${e(v[1])}</a>`).join('');document.getElementById('content').innerHTML=hero()+about()+skills()+education()+courses()+experience()+projectsView()+articlesView()+certificates()+contact();document.getElementById('footer-note').textContent=t(P.ui.footer_desc);document.getElementById('footer-links').innerHTML=`${link(P.contact.github,'Github')}${link('mailto:'+P.contact.email,'Email')}${link(P.contact.wechatQrPage,'WeChat')}${link('/admin.html',t(P.ui.admin_panel))}${link(P.icpUrl,P.icp)}`;wire();observe()}
  function wire(){document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;render()}));const f=document.getElementById('contact-form');if(f)f.addEventListener('submit',async ev=>{ev.preventDefault();const s=document.getElementById('status'),x=l(),btn=f.querySelector('button');btn.disabled=true;s.textContent=x.sending;try{const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});s.textContent=r.message||x.sent;f.reset()}catch(err){s.textContent=err.message||x.failed}finally{btn.disabled=false}})}
  let observer;function observe(){if(matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('.reveal').forEach(n=>n.classList.add('in'));return}if(observer)observer.disconnect();observer=new IntersectionObserver(es=>es.forEach(v=>{if(v.isIntersecting){v.target.classList.add('in');observer.unobserve(v.target)}}),{threshold:.09});document.querySelectorAll('.reveal').forEach(n=>observer.observe(n))}
  document.addEventListener('DOMContentLoaded',async()=>{CJCData.setTheme(window.THEME_ID);render();CJCData.mountSwitcher({accent:'#c9552d'});CJCData.onLang(render);try{[projects,articles]=await Promise.all([CJCData.fetchProjects(),CJCData.fetchArticles()]);render()}catch(err){document.querySelectorAll('.loading').forEach(n=>{n.className='failure';n.textContent=l().failed})}});
  })();
  </script>
</body></html>

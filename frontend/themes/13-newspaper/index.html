<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Jiechao Times</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --paper:#f5f2e9; --ink:#1a1a1a; --accent:#111111; --grey:#5a564d;
      --hair:#c9c3b2; --rule:#1a1a1a; --tint:#ebe6d8;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);
      font-family:'Old Standard TT',Georgia,'Times New Roman',serif;line-height:1.55;
      -webkit-font-smoothing:antialiased;
      background-image:radial-gradient(rgba(0,0,0,.018) 1px,transparent 1px);background-size:3px 3px}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    .container{max-width:1160px;margin:0 auto;padding:0 26px}

    .kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.18em;
      font-size:11px;font-weight:600;color:var(--ink);font-variant:small-caps}
    .rule{border:0;border-top:2px solid var(--rule)}
    .rule-thin{border:0;border-top:1px solid var(--hair)}
    .rule-double{border:0;border-top:3px double var(--rule)}

    /* ---- Masthead ---- */
    .masthead{padding-top:20px}
    .mast-top{display:flex;justify-content:space-between;align-items:flex-end;
      font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);padding-bottom:8px}
    .mast-title{font-family:'UnifrakturCook',cursive;font-weight:700;text-align:center;
      font-size:clamp(46px,10vw,104px);line-height:1;margin:6px 0 4px;letter-spacing:.01em}
    .dateline{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
      font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:12px;padding:8px 0;color:var(--ink)}
    .dateline .center{font-family:'Old Standard TT',serif;font-style:italic;text-transform:none;letter-spacing:.02em;font-size:14px;color:var(--grey)}

    /* nav strip */
    .navstrip{display:flex;justify-content:center;flex-wrap:wrap;gap:26px;padding:9px 0;
      font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:500}
    .navstrip a{color:var(--ink);opacity:.8}
    .navstrip a:hover{opacity:1;text-decoration:underline;text-underline-offset:3px}

    section{padding:34px 0}
    .sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;border-bottom:2px solid var(--rule);padding-bottom:8px}
    .sec-title{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
      font-size:clamp(20px,3vw,30px);margin:0}
    .sec-head .kicker{margin-left:auto}

    /* ---- Lead / hero ---- */
    .lead{padding:30px 0 8px}
    .lead-kicker{text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.3em;font-size:13px;color:var(--accent);margin-bottom:10px}
    .headline{font-family:'Old Standard TT',serif;font-weight:700;text-align:center;
      font-size:clamp(34px,7vw,74px);line-height:1.02;margin:0 0 6px;letter-spacing:-.01em}
    .subhead{text-align:center;font-style:italic;font-size:clamp(17px,2.4vw,23px);color:var(--grey);margin:0 auto 4px;max-width:34ch}
    .byline{text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--ink);margin:14px 0}
    .lead-body{columns:3;column-gap:30px;column-rule:1px solid var(--hair);margin-top:20px;font-size:15.5px;text-align:justify;hyphens:auto}
    .lead-body p{margin:0 0 12px}
    .lead-body .portrait{width:100%;margin:0 0 12px;border:1px solid var(--ink);
      filter:grayscale(1) contrast(1.15);break-inside:avoid}
    .lead-body p:first-of-type::first-letter{font-family:'UnifrakturCook',cursive;
      float:left;font-size:76px;line-height:.7;padding:8px 10px 0 0;color:var(--accent)}
    .lead-cta{text-align:center;margin-top:18px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
    .btn{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:13px;font-weight:600;
      border:2px solid var(--ink);padding:11px 22px;background:var(--ink);color:var(--paper);transition:.15s}
    .btn:hover{background:transparent;color:var(--ink)}
    .btn.ghost{background:transparent;color:var(--ink)}
    .btn.ghost:hover{background:var(--ink);color:var(--paper)}
    @media(max-width:820px){.lead-body{columns:2}}
    @media(max-width:560px){.lead-body{columns:1}.lead-body .portrait{max-width:260px}}

    /* ---- Education / experience as stacked briefs ---- */
    .briefs{columns:2;column-gap:34px;column-rule:1px solid var(--hair)}
    .brief{break-inside:avoid;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--hair)}
    .brief .when{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--grey)}
    .brief h3{margin:3px 0 4px;font-size:20px;font-weight:700;line-height:1.15}
    .brief .sub{color:var(--grey);font-style:italic;font-size:15px}
    .brief ul{margin:10px 0 0;padding-left:18px;font-size:14.5px}
    .brief li{margin:5px 0}
    @media(max-width:680px){.briefs{columns:1}}

    /* ---- Skills ---- */
    .skills-line{font-size:17px;line-height:2;text-align:center;max-width:80ch;margin:0 auto}
    .skills-line .sk{display:inline-block;padding:0 4px;font-family:'Oswald',sans-serif;font-weight:500;letter-spacing:.02em}
    .skills-line .sep{color:var(--hair)}

    /* ---- Courses (column briefs) ---- */
    .courses{columns:3;column-gap:30px;column-rule:1px solid var(--hair)}
    .course{break-inside:avoid;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--hair)}
    .course .ci{font-size:18px;margin-right:8px}
    .course h4{margin:0 0 5px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:6px}
    .course p{margin:0;font-size:14px;color:var(--grey);text-align:justify;hyphens:auto}
    @media(max-width:820px){.courses{columns:2}}
    @media(max-width:520px){.courses{columns:1}}

    /* ---- Article / project briefs grid ---- */
    .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;justify-content:center}
    .filters button{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:12px;
      border:1px solid var(--ink);background:transparent;color:var(--ink);padding:7px 14px;cursor:pointer;transition:.12s}
    .filters button.active,.filters button:hover{background:var(--ink);color:var(--paper)}
    .clip{columns:3;column-gap:28px;column-rule:1px solid var(--hair)}
    .clip-item{break-inside:avoid;margin-bottom:22px;padding-bottom:20px;border-bottom:2px solid var(--rule)}
    .clip-item .cover{width:100%;height:150px;object-fit:cover;filter:grayscale(1) contrast(1.15);border:1px solid var(--ink);margin-bottom:10px}
    .clip-item .ctag{display:flex;justify-content:space-between;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;color:var(--grey);margin-bottom:5px}
    .clip-item h4{margin:0 0 6px;font-size:20px;font-weight:700;line-height:1.12}
    .clip-item .tech{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.03em;color:var(--accent);margin-bottom:5px}
    .clip-item p{margin:0;font-size:14px;color:var(--ink);text-align:justify;hyphens:auto}
    .clip-item .more{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:11px;border-bottom:1px solid var(--ink);display:inline-block;margin-top:8px}
    @media(max-width:820px){.clip{columns:2}}
    @media(max-width:520px){.clip{columns:1}}

    /* ---- Certificates ---- */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:26px}
    .cert{display:grid;grid-template-columns:120px 1fr;gap:16px;border:2px solid var(--rule);padding:14px}
    .cert img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.15);border:1px solid var(--ink)}
    .cert .meta{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;color:var(--grey);display:flex;justify-content:space-between}
    .cert h4{margin:6px 0 5px;font-size:18px;font-weight:700;line-height:1.15}
    .cert p{margin:0;font-size:13.5px;color:var(--grey)}
    @media(max-width:620px){.certs{grid-template-columns:1fr}}

    /* ---- Contact ---- */
    .contact{display:grid;grid-template-columns:1fr 1fr;gap:34px}
    .cinfo p{font-style:italic;color:var(--grey);margin:0 0 14px}
    .cinfo a{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--hair)}
    .cinfo a .k{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
    .cinfo a .v{font-weight:700}
    .cform label{display:block;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:11px;margin-bottom:5px;color:var(--grey)}
    .cform input,.cform textarea{width:100%;font-family:'Old Standard TT',serif;font-size:15px;padding:11px;
      margin-bottom:14px;background:var(--tint);border:1px solid var(--ink);color:var(--ink)}
    .cform input:focus,.cform textarea:focus{outline:none;background:#fff;box-shadow:inset 0 0 0 1px var(--ink)}
    .cform textarea{min-height:120px;resize:vertical}
    #cf-status{margin-top:10px;font-weight:700;font-size:14px}
    @media(max-width:720px){.contact{grid-template-columns:1fr}}

    footer{border-top:3px double var(--rule);margin-top:20px;padding:26px 0 60px}
    .frow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px}
    .foot-name{font-family:'UnifrakturCook',cursive;font-size:26px}
    .foot-social{display:flex;gap:20px;flex-wrap:wrap;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
    .foot-social a:hover{text-decoration:underline;text-underline-offset:3px}
    .muted{color:var(--grey);font-size:12.5px;font-style:italic}
    #foot-icp{color:var(--grey)}
    .load-note{color:var(--grey);font-style:italic;padding:10px 0}

    @media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body>
  <div class="container">
    <div class="masthead">
      <div class="mast-top">
        <span id="mt-left"></span>
        <span>Price: Free · 免费</span>
        <span id="mt-right"></span>
      </div>
      <hr class="rule">
      <h1 class="mast-title">The Jiechao Times</h1>
      <hr class="rule">
      <div class="dateline">
        <span id="dl-vol">Vol. I — No. 1</span>
        <span class="center" id="dl-date"></span>
        <span id="dl-city"></span>
      </div>
      <hr class="rule-double">
      <nav class="navstrip" id="nav"></nav>
      <hr class="rule">
    </div>
  </div>

  <div id="top"></div>
  <div class="container">
    <header class="lead">
      <div class="lead-kicker" id="greet"></div>
      <h2 class="headline" id="name"></h2>
      <p class="subhead" id="headline"></p>
      <div class="byline" id="byline"></div>
      <hr class="rule-thin">
      <div class="lead-body" id="lead-body"></div>
      <div class="lead-cta">
        <a class="btn" id="cvBtn" href="#" download></a>
        <a class="btn ghost" id="ghBtn" target="_blank" rel="noopener"></a>
      </div>
    </header>
  </div>

  <div class="container">
    <section id="education">
      <div class="sec-head"><h2 class="sec-title" id="l-edu"></h2><span class="kicker">Academic Record</span></div>
      <div class="briefs" id="edu-list"></div>
    </section>

    <section id="skills">
      <div class="sec-head"><h2 class="sec-title" id="l-skills"></h2><span class="kicker">The Toolbox</span></div>
      <div class="skills-line" id="skills-list"></div>
    </section>

    <section id="courses">
      <div class="sec-head"><h2 class="sec-title" id="l-courses"></h2><span class="kicker">Curriculum</span></div>
      <div class="courses" id="courses-list"></div>
    </section>

    <section id="experience">
      <div class="sec-head"><h2 class="sec-title" id="l-exp"></h2><span class="kicker">Business Desk</span></div>
      <div class="briefs" id="exp-list"></div>
    </section>

    <section id="projects">
      <div class="sec-head"><h2 class="sec-title" id="l-projects"></h2><span class="kicker">Workshop</span></div>
      <div class="clip" id="projects-list"><div class="load-note" id="proj-load"></div></div>
    </section>

    <section id="articles">
      <div class="sec-head"><h2 class="sec-title" id="l-articles"></h2><span class="kicker">Op-Ed &amp; Features</span></div>
      <div class="filters" id="filters"></div>
      <div class="clip" id="articles-list"><div class="load-note" id="art-load"></div></div>
    </section>

    <section id="certificates">
      <div class="sec-head"><h2 class="sec-title" id="l-certs"></h2><span class="kicker">Honours</span></div>
      <div class="certs" id="certs-list"></div>
    </section>

    <section id="contact">
      <div class="sec-head"><h2 class="sec-title" id="l-contact"></h2><span class="kicker">Letters to the Editor</span></div>
      <div class="contact">
        <div class="cinfo" id="contact-info"></div>
        <div class="cform">
          <form id="cf">
            <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none">
            <label id="lb-name"></label><input type="text" name="name" id="cf-name" required>
            <label id="lb-email"></label><input type="email" name="email" id="cf-email" required>
            <label id="lb-msg"></label><textarea name="message" id="cf-msg" required></textarea>
            <button type="submit" class="btn" id="cf-send"></button>
            <p id="cf-status"></p>
          </form>
        </div>
      </div>
    </section>
  </div>

  <footer><div class="container">
    <div class="frow">
      <span class="foot-name">The Jiechao Times</span>
      <div class="foot-social" id="foot-social"></div>
    </div>
    <hr class="rule-thin" style="margin:16px 0">
    <div class="frow">
      <span class="muted" id="foot-desc"></span>
      <a class="muted" id="foot-icp" target="_blank"></a>
    </div>
  </div></footer>

  <script>window.THEME_ID = "13-newspaper";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";

    function renderStatic(){
      const lang = CJCData.lang();
      document.title = "The Jiechao Times — " + t(P.name);
      const today = CJCData.formatDate(new Date().toISOString(), { weekday:'long', year:'numeric', month:'long', day:'numeric' });
      document.getElementById('dl-date').textContent = today;
      document.getElementById('dl-city').textContent = t(P.location);
      document.getElementById('dl-vol').textContent = lang==='zh' ? '第一卷 · 第一期' : 'Vol. I — No. 1';
      document.getElementById('mt-left').textContent = lang==='zh' ? '独立发行' : 'Independent Press';
      document.getElementById('mt-right').textContent = lang==='zh' ? '广州 · 环球版' : 'Guangzhou · Global Edition';

      document.getElementById('nav').innerHTML = [
        ['top','nav_home'],['education','education_bg'],['courses','nav_courses'],
        ['experience','nav_internship'],['projects','nav_portfolio'],['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');

      document.getElementById('greet').textContent = t(P.greeting);
      document.getElementById('name').textContent = t(P.name);
      document.getElementById('headline').textContent = t(P.headline);
      document.getElementById('byline').innerHTML =
        `${lang==='zh'?'本报专访':'By Staff Correspondent'} · ${esc(t(P.role))} — ${esc(t(P.title))}`;

      document.getElementById('lead-body').innerHTML =
        `<img class="portrait" src="${esc(P.avatar)}" alt="${esc(t(P.name))}">` +
        P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('');

      const cv = document.getElementById('cvBtn'); cv.textContent = t(P.ui.download_cv); cv.href = t(P.cv);
      const gh = document.getElementById('ghBtn'); gh.textContent = 'GitHub ↗'; gh.href = P.contact.github;

      document.getElementById('l-edu').textContent = t(P.ui.education_bg);
      document.getElementById('l-skills').textContent = t(P.ui.core_tech);
      document.getElementById('l-courses').textContent = t(P.ui.core_courses);
      document.getElementById('l-exp').textContent = t(P.ui.internship_exp);
      document.getElementById('l-projects').textContent = t(P.ui.latest_projects);
      document.getElementById('l-articles').textContent = t(P.ui.latest_articles);
      document.getElementById('l-certs').textContent = t(P.ui.certificates);
      document.getElementById('l-contact').textContent = t(P.ui.get_in_touch);

      document.getElementById('edu-list').innerHTML = P.education.map(e=>`
        <div class="brief"><div class="when">${esc(e.period)}</div>
        <h3>${esc(t(e.school))}</h3><div class="sub">${esc(t(e.degree))} — ${esc(t(e.note))}</div></div>`).join('');

      document.getElementById('skills-list').innerHTML = P.skillTags.map(s=>
        `<span class="sk">${esc(s)}</span>`).join('<span class="sep"> · </span>');

      document.getElementById('courses-list').innerHTML = P.courses.map(c=>`
        <div class="course"><h4><i class="fa ${esc(c.icon)} ci"></i>${esc(t(c.title))}</h4>
        <p>${esc(t(c.desc))}</p></div>`).join('');

      document.getElementById('exp-list').innerHTML = P.experience.map(x=>`
        <div class="brief"><div class="when">${esc(x.period)}</div>
        <h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3>
        <div class="sub">${esc(t(x.summary))}</div>
        <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div>`).join('');

      document.getElementById('certs-list').innerHTML = P.certificates.map(c=>`
        <div class="cert"><img src="${esc(c.image)}" alt="${esc(t(c.title))}">
        <div><div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');

      document.getElementById('contact-info').innerHTML =
        `<p>${esc(t(P.ui.msg_box_title))}</p>` + [
        ['Email', P.contact.email, 'mailto:'+P.contact.email],
        ['Phone', P.contact.phone, P.contact.phoneHref],
        ['GitHub', '@'+P.contact.githubUser, P.contact.github],
        ['WeChat', 'QR ↗', P.contact.wechatQrPage],
      ].map(([k,v,h])=>`<a href="${esc(h)}"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></a>`).join('');
      document.getElementById('lb-name').textContent = t(P.ui.name_placeholder);
      document.getElementById('lb-email').textContent = t(P.ui.email_placeholder);
      document.getElementById('lb-msg').textContent = t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent = t(P.ui.send);

      document.getElementById('foot-social').innerHTML =
        `<a href="${P.contact.github}" target="_blank">GitHub</a>
         <a href="mailto:${P.contact.email}">Email</a>
         <a href="${P.contact.wechatQrPage}">WeChat</a>
         <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent = t(P.ui.footer_desc);
      const icp = document.getElementById('foot-icp'); icp.textContent = P.icp; icp.href = P.icpUrl;

      document.getElementById('filters').innerHTML = P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box = document.getElementById('projects-list');
      if(!projects.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML = projects.map(p=>`
        <div class="clip-item">
          <div class="ctag"><span>${esc(t(P.ui.tech_stack))}</span><span>${esc(p.dateText())}</span></div>
          <h4><a href="${esc(p.href)}">${esc(p.localTitle())}</a></h4>
          <div class="tech">${esc(p.tech_stack||'')}</div>
          <p>${esc(p.localSummary()||'')}</p>
          <a class="more" href="${esc(p.href)}">${esc(t(P.ui.view_project))} →</a>
        </div>`).join('');
    }

    function renderArticles(){
      const box = document.getElementById('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML = list.map(a=>`
        <div class="clip-item">
          <img class="cover" src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="">
          <div class="ctag"><span>${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
          <h4><a href="${esc(a.href)}">${esc(a.localTitle())}</a></h4>
          <p>${esc(a.localSummary()||'')}</p>
          <a class="more" href="${esc(a.href)}">${esc(t(P.ui.read_more))} →</a>
        </div>`).join('');
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML = `<div class="load-note">⚠ 内容加载失败 / Failed to load</div>`; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-list').innerHTML = `<div class="load-note">⚠ 内容加载失败 / Failed to load</div>`; }
    }

    document.getElementById('cf').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      const payload = { name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color='var(--grey)'; s.textContent = t(P.ui.sending);
      try{ const r = await CJCData.sendContact(payload); s.style.color='#1a6b3a'; s.textContent = r.message||'Sent.'; f.reset(); }
      catch(err){ s.style.color='#a11'; s.textContent = err.message; }
    });

    const fa = document.createElement('link');
    fa.rel='stylesheet'; fa.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css';
    document.head.appendChild(fa);

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:'#111111' });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

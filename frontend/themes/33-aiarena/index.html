<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — AI Arena</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg0:#0a0f1e; --bg1:#141d3a; --panel:#101733; --panel2:#0c1226;
      --ink:#e6f0ff; --muted:#8496bf; --mint:#22e0a1; --hot:#ff4d6d;
      --line:rgba(120,150,220,.16); --gridline:rgba(80,120,200,.08);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;color:var(--ink);font-family:'Chakra Petch',system-ui,sans-serif;line-height:1.5;
      -webkit-font-smoothing:antialiased;overflow-x:hidden;
      background:
        radial-gradient(80% 60% at 15% -5%, rgba(34,224,161,.10), transparent 55%),
        radial-gradient(70% 55% at 95% 8%, rgba(255,77,109,.10), transparent 55%),
        linear-gradient(160deg,var(--bg0),var(--bg1));
      background-attachment:fixed;
    }
    body::before{ /* HUD grid */
      content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
      background-image:linear-gradient(var(--gridline) 1px,transparent 1px),linear-gradient(90deg,var(--gridline) 1px,transparent 1px);
      background-size:44px 44px;
      -webkit-mask:radial-gradient(120% 90% at 50% 0%,#000,transparent 80%);mask:radial-gradient(120% 90% at 50% 0%,#000,transparent 80%);
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    .wrap{max-width:1200px;margin:0 auto;padding:0 24px;position:relative;z-index:2}
    section{padding:66px 0;position:relative;z-index:2}
    :focus-visible{outline:2px solid var(--mint);outline-offset:3px}
    .mono{font-variant-numeric:tabular-nums;font-family:'Rajdhani',monospace}

    /* angular HUD panel */
    .hud{position:relative;background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);
      clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
      box-shadow:inset 0 0 0 1px rgba(34,224,161,.05),0 18px 40px -22px rgba(0,0,0,.9)}
    .hud-mint{border-color:rgba(34,224,161,.35);box-shadow:inset 0 0 24px -14px var(--mint),0 18px 40px -22px rgba(0,0,0,.9)}

    .tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;
      color:var(--mint);margin:0 0 12px;font-family:'Rajdhani',sans-serif}
    .tag::before{content:"▹";color:var(--hot)}
    .sec-title{font-size:clamp(26px,4.4vw,46px);font-weight:700;letter-spacing:.01em;margin:0 0 6px;line-height:1;text-transform:uppercase;
      font-family:'Rajdhani','Chakra Petch',sans-serif}
    .sec-title .hi{color:var(--mint)}
    .sec-sub{color:var(--muted);margin:0 0 30px;max-width:60ch}

    /* Topbar */
    .topbar{position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);
      background:linear-gradient(180deg,rgba(10,15,30,.92),rgba(10,15,30,.4));border-bottom:1px solid var(--line)}
    .topbar .row{display:flex;align-items:center;justify-content:space-between;height:58px;max-width:1200px;margin:0 auto;padding:0 24px}
    .brand{font-weight:700;font-size:18px;letter-spacing:.05em;display:flex;align-items:center;gap:10px;font-family:'Rajdhani',sans-serif;text-transform:uppercase}
    .brand .lv{background:var(--mint);color:#04231a;font-size:11px;font-weight:700;padding:3px 7px;border-radius:4px;letter-spacing:.05em}
    .brand b{color:var(--mint)}
    .nav{display:flex;gap:20px}
    .nav a{font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600;font-family:'Rajdhani',sans-serif}
    .nav a:hover{color:var(--mint)}
    @media(max-width:860px){.nav{display:none}}

    /* Hero — player card + rank ring */
    .hero{padding:46px 0 30px}
    .hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:stretch}
    .player{padding:32px}
    .player .greet{color:var(--hot);font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:13px;font-family:'Rajdhani',sans-serif}
    .player h1{font-size:clamp(38px,6.6vw,72px);line-height:.95;letter-spacing:.01em;margin:8px 0 0;text-transform:uppercase;
      font-family:'Rajdhani','Chakra Petch',sans-serif;font-weight:700}
    .player h1 .hi{color:var(--mint)}
    .player .head{font-size:clamp(15px,2.2vw,20px);color:var(--muted);margin:16px 0 0;max-width:30ch}
    .statline{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:20px}
    .statline .s{font-family:'Rajdhani',sans-serif}
    .statline .s b{display:block;font-size:22px;color:var(--mint);font-weight:700;line-height:1}
    .statline .s span{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
    .btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
      font-family:'Rajdhani',sans-serif;cursor:pointer;border:none;color:#04231a;background:var(--mint);
      clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
      box-shadow:0 0 22px -6px var(--mint);transition:transform .15s,box-shadow .15s}
    .btn:hover{transform:translateY(-2px);box-shadow:0 0 30px -4px var(--mint)}
    .btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
    .btn.ghost:hover{color:var(--mint);box-shadow:inset 0 0 0 1px var(--mint)}

    .avatar-panel{padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
    .ring{position:relative;width:190px;height:190px;border-radius:50%;display:grid;place-items:center;
      background:conic-gradient(var(--mint) 0 var(--pct,86%),rgba(120,150,220,.14) var(--pct,86%) 100%);
      box-shadow:0 0 34px -8px rgba(34,224,161,.6)}
    .ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}
    .ring .av{position:relative;width:150px;height:150px;border-radius:50%;overflow:hidden;border:2px solid rgba(34,224,161,.5)}
    .ring .av img{width:100%;height:100%;object-fit:cover}
    .ring .badge{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);background:var(--hot);color:#fff;
      font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 12px;border-radius:20px;font-family:'Rajdhani',sans-serif;z-index:3;box-shadow:0 4px 14px -4px var(--hot)}
    .avatar-panel .role{font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mint);font-size:16px}
    .avatar-panel .loc{color:var(--muted);font-size:13px}
    @media(max-width:860px){.hero-grid{grid-template-columns:1fr}}

    /* VS layout for education / experience */
    .vs-wrap{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch}
    .vs-card{padding:24px}
    .vs-card .when{color:var(--hot);font-weight:700;font-size:14px;letter-spacing:.05em;font-family:'Rajdhani',sans-serif}
    .vs-card h3{margin:8px 0 6px;font-size:19px;font-weight:700}
    .vs-card .sub{color:var(--muted);font-size:14px}
    .vs-badge{align-self:center;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:26px;color:var(--ink);
      width:56px;height:56px;display:grid;place-items:center;border-radius:50%;background:var(--panel2);
      box-shadow:inset 0 0 0 2px var(--hot),0 0 24px -6px var(--hot)}
    @media(max-width:760px){.vs-wrap{grid-template-columns:1fr}.vs-badge{margin:0 auto;transform:rotate(0)}}

    /* Skills as power meters */
    .meters{display:grid;grid-template-columns:1fr 1fr;gap:16px 34px}
    .meter{}
    .meter .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:7px;font-weight:600}
    .meter .top .val{color:var(--mint);font-family:'Rajdhani',sans-serif;font-weight:700}
    .meter .bar{height:12px;background:var(--panel2);border:1px solid var(--line);position:relative;overflow:hidden;
      clip-path:polygon(0 0,calc(100% - 6px) 0,100% 100%,6px 100%)}
    .meter .fill{height:100%;width:0;background:linear-gradient(90deg,var(--mint),#7bffce);
      box-shadow:0 0 14px rgba(34,224,161,.7);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
    @media(max-width:640px){.meters{grid-template-columns:1fr}}

    /* Courses as skill tree */
    .tree{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .node{padding:22px;position:relative}
    .node .lvl{font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--hot);text-transform:uppercase}
    .node .ci{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:19px;color:var(--mint);margin:10px 0 12px;
      background:var(--panel2);box-shadow:inset 0 0 0 1px rgba(34,224,161,.3),0 0 18px -8px var(--mint)}
    .node h4{margin:0 0 8px;font-size:16px;font-weight:700;line-height:1.25}
    .node p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
    .node .unlocked{position:absolute;top:16px;right:16px;font-size:11px;color:var(--mint);letter-spacing:.08em;font-family:'Rajdhani',sans-serif}
    @media(max-width:860px){.tree{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.tree{grid-template-columns:1fr}}

    /* Leaderboard rows for projects & articles */
    .board{display:flex;flex-direction:column;gap:12px}
    .lb{display:grid;grid-template-columns:64px 84px 1fr auto;gap:16px;align-items:center;padding:14px 20px;color:inherit;transition:transform .15s,box-shadow .15s}
    .lb:hover{transform:translateX(6px);box-shadow:inset 0 0 0 1px rgba(34,224,161,.4),0 0 30px -12px var(--mint)}
    .lb .rank{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:30px;line-height:1;color:var(--mint);text-align:center}
    .lb .rank small{display:block;font-size:10px;color:var(--muted);letter-spacing:.1em}
    .lb.top1 .rank{color:var(--hot);text-shadow:0 0 18px var(--hot)}
    .lb .thumb{width:84px;height:56px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
    .lb .thumb img{width:100%;height:100%;object-fit:cover}
    .lb .info h4{margin:0 0 3px;font-size:16px;font-weight:700;line-height:1.2}
    .lb .info .m{color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 14px}
    .lb .info .m .cat{color:var(--hot);text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:11.5px}
    .lb .info p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.5;max-width:70ch}
    .lb .score{text-align:right;font-family:'Rajdhani',sans-serif}
    .lb .score b{font-size:24px;font-weight:700;color:var(--mint);line-height:1}
    .lb .score span{display:block;font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
    @media(max-width:680px){.lb{grid-template-columns:48px 1fr;gap:10px}.lb .thumb,.lb .score{display:none}}

    .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
    .filters button{background:var(--panel2);color:var(--muted);border:1px solid var(--line);font-family:'Rajdhani',sans-serif;
      font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:8px 16px;cursor:pointer;transition:.15s;
      clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
    .filters button:hover{color:var(--ink)}
    .filters button.active{background:var(--mint);color:#04231a;border-color:transparent;box-shadow:0 0 18px -6px var(--mint)}

    /* Certificates */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .cert{display:grid;grid-template-columns:128px 1fr;overflow:hidden}
    .cert img{height:100%;width:100%;object-fit:cover}
    .cert .ct{padding:20px}
    .cert .meta{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--hot);font-family:'Rajdhani',sans-serif}
    .cert h4{margin:10px 0 7px;font-size:16px;font-weight:700}
    .cert p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
    @media(max-width:640px){.certs{grid-template-columns:1fr}.cert{grid-template-columns:94px 1fr}}

    /* Contact */
    .contact-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:22px}
    .cinfo{padding:26px}
    .cinfo a{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);color:var(--ink);font-weight:600;font-size:14px}
    .cinfo a span:last-child{color:var(--mint);font-family:'Rajdhani',sans-serif}
    form.cform{padding:26px}
    .cform input,.cform textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
      font-family:inherit;font-size:14.5px;padding:13px;margin-bottom:13px;transition:border-color .15s,box-shadow .15s;
      clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
    .cform input:focus,.cform textarea:focus{outline:none;border-color:var(--mint);box-shadow:0 0 0 3px rgba(34,224,161,.16)}
    .cform textarea{min-height:130px;resize:vertical}
    #cf-status{margin:8px 0 0;font-weight:600;font-size:14px}
    @media(max-width:820px){.contact-grid{grid-template-columns:1fr}}

    footer{border-top:1px solid var(--line);padding:42px 0 60px;position:relative;z-index:2}
    .frow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center}
    footer a{color:var(--muted);font-weight:600;font-size:13px;font-family:'Rajdhani',sans-serif}
    footer a:hover{color:var(--mint)}
    .muted{color:var(--muted);font-size:12.5px}
    .load-note{color:var(--muted);font-size:14px;padding:18px 0}

    @media (prefers-reduced-motion: reduce){
      html{scroll-behavior:auto}
      *{transition:none !important;animation:none !important}
      .meter .fill{transition:none !important}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="row">
      <a class="brand" href="#top"><span class="lv">LV.99</span>Cai<b>Jiechao</b></a>
      <nav class="nav" id="nav" aria-label="Primary"></nav>
    </div>
  </div>

  <div id="top"></div>
  <header class="hero"><div class="wrap">
    <div class="hero-grid">
      <div class="player hud hud-mint">
        <p class="greet" id="greet"></p>
        <h1 id="name"></h1>
        <p class="head" id="headline"></p>
        <div class="statline" id="statline"></div>
        <div class="btns">
          <a class="btn" id="cvBtn" href="#" download></a>
          <a class="btn ghost" id="ghBtn" target="_blank" rel="noopener"></a>
        </div>
      </div>
      <div class="avatar-panel hud">
        <div class="ring" style="--pct:86%">
          <div class="av"><img id="portrait" alt="" /></div>
          <span class="badge" id="rank-badge">RANK S</span>
        </div>
        <div class="role" id="role-lbl"></div>
        <div class="loc" id="loc-lbl"></div>
      </div>
    </div>
  </div></header>

  <section id="about"><div class="wrap">
    <p class="tag" id="k-about"></p>
    <h2 class="sec-title" id="l-about"></h2>
    <div class="hud" style="padding:28px;max-width:920px" id="about-text"></div>
  </div></section>

  <section id="education"><div class="wrap">
    <p class="tag" id="k-edu"></p>
    <h2 class="sec-title" id="l-edu"></h2>
    <div class="vs-wrap" id="edu-list"></div>
  </div></section>

  <section id="skills"><div class="wrap">
    <p class="tag" id="k-skills"></p>
    <h2 class="sec-title" id="l-skills"></h2>
    <div class="hud" style="padding:30px"><div class="meters" id="skills-list"></div></div>
  </div></section>

  <section id="courses"><div class="wrap">
    <p class="tag" id="k-courses"></p>
    <h2 class="sec-title"><span id="l-courses"></span> <span class="hi" id="l-courses-hi"></span></h2>
    <div class="tree" id="courses-list"></div>
  </div></section>

  <section id="experience"><div class="wrap">
    <p class="tag" id="k-exp"></p>
    <h2 class="sec-title" id="l-exp"></h2>
    <div id="exp-list"></div>
  </div></section>

  <section id="projects"><div class="wrap">
    <p class="tag" id="k-proj"></p>
    <h2 class="sec-title" id="l-projects"></h2>
    <div class="board" id="projects-list"><div class="load-note" id="proj-load"></div></div>
  </div></section>

  <section id="articles"><div class="wrap">
    <p class="tag" id="k-art"></p>
    <h2 class="sec-title" id="l-articles"></h2>
    <div class="filters" id="filters"></div>
    <div class="board" id="articles-list"><div class="load-note" id="art-load"></div></div>
  </div></section>

  <section id="certificates"><div class="wrap">
    <p class="tag" id="k-certs"></p>
    <h2 class="sec-title" id="l-certs"></h2>
    <div class="certs" id="certs-list"></div>
  </div></section>

  <section id="contact"><div class="wrap">
    <p class="tag" id="k-contact"></p>
    <h2 class="sec-title" id="l-contact"></h2>
    <p class="sec-sub" id="contact-sub"></p>
    <div class="contact-grid">
      <div class="cinfo hud" id="contact-info"></div>
      <form class="cform hud" id="cf">
        <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
        <input type="text" name="name" id="cf-name" required>
        <input type="email" name="email" id="cf-email" required>
        <textarea name="message" id="cf-msg" required></textarea>
        <button type="submit" class="btn" id="cf-send"></button>
        <p id="cf-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div></section>

  <footer><div class="wrap">
    <div class="frow">
      <a class="brand" href="#top"><span class="lv">LV.99</span>Cai<b>Jiechao</b></a>
      <div class="frow" id="foot-social" style="gap:18px"></div>
    </div>
    <div class="frow" style="margin-top:18px">
      <span class="muted" id="foot-desc"></span>
      <a class="muted" id="foot-icp" target="_blank" rel="noopener"></a>
    </div>
  </div></footer>

  <script>window.THEME_ID = "33-aiarena";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // deterministic "power level" 78..97 from a string
    function power(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return 78 + (h%20); }

    function renderStatic(){
      document.title = (CJCData.lang()==="zh"?"蔡杰超":"Cai Jiechao") + " — AI Arena";
      document.getElementById('nav').innerHTML = [
        ['about','nav_about'],['courses','nav_courses'],['projects','nav_portfolio'],
        ['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');

      document.getElementById('greet').textContent = t(P.greeting);
      document.getElementById('name').innerHTML = `<span class="hi">${esc(t(P.name))}</span>`;
      document.getElementById('headline').textContent = t(P.headline);
      const STATS = CJCData.lang()==="zh"
        ? [['15','课程','排名前 %'],['6.5','雅思','总分'],['3+','语言','精通']]
        : [['15','TOP %','ranking'],['6.5','IELTS','band'],['3+','LANGS','fluent']];
      document.getElementById('statline').innerHTML = STATS.map(s=>`<div class="s"><b>${esc(s[0])}</b><span>${esc(s[1])} · ${esc(s[2])}</span></div>`).join('');
      const cv = document.getElementById('cvBtn'); cv.textContent = t(P.ui.download_cv); cv.href = t(P.cv);
      const gh = document.getElementById('ghBtn'); gh.textContent = "GitHub ↗"; gh.href = P.contact.github;

      document.getElementById('portrait').src = P.avatar;
      document.getElementById('portrait').alt = t(P.name);
      document.getElementById('rank-badge').textContent = CJCData.lang()==="zh" ? "S 段位" : "RANK S";
      document.getElementById('role-lbl').textContent = t(P.role);
      document.getElementById('loc-lbl').textContent = "📍 " + t(P.location);

      const ARENA = { en:"ARENA", zh:"竞技场" };
      ['about','edu','skills','courses','exp','proj','art','certs','contact'].forEach(k=>{
        document.getElementById('k-'+k).textContent = t(ARENA);
      });
      document.getElementById('l-about').textContent = t(P.ui.about_me);
      document.getElementById('l-edu').textContent = t(P.ui.education_bg);
      document.getElementById('l-skills').textContent = t(P.ui.core_tech);
      document.getElementById('l-courses').textContent = t(P.ui.core_courses);
      document.getElementById('l-courses-hi').textContent = CJCData.lang()==="zh" ? "技能树" : "SKILL TREE";
      document.getElementById('l-exp').textContent = t(P.ui.internship_exp);
      document.getElementById('l-projects').textContent = t(P.ui.latest_projects);
      document.getElementById('l-articles').textContent = t(P.ui.latest_articles);
      document.getElementById('l-certs').textContent = t(P.ui.certificates);
      document.getElementById('l-contact').textContent = t(P.ui.get_in_touch);
      document.getElementById('contact-sub').textContent = t(P.ui.msg_box_title);

      document.getElementById('about-text').innerHTML =
        P.bio.map(b=>`<p style="margin:0 0 14px;color:#c6d3ef;font-size:15px;line-height:1.7">${esc(t(b))}</p>`).join('') +
        `<p style="margin:0;color:var(--mint);font-weight:700">📍 ${esc(t(P.location))}</p>`;

      // Education as VS
      const e = P.education;
      document.getElementById('edu-list').innerHTML = `
        <div class="vs-card hud"><div class="when">${esc(e[0].period)}</div>
          <h3>${esc(t(e[0].school))}</h3><div class="sub">${esc(t(e[0].degree))} · ${esc(t(e[0].note))}</div></div>
        <div class="vs-badge">VS</div>
        <div class="vs-card hud"><div class="when">${esc(e[1].period)}</div>
          <h3>${esc(t(e[1].school))}</h3><div class="sub">${esc(t(e[1].degree))} · ${esc(t(e[1].note))}</div></div>`;

      // Skills power meters
      document.getElementById('skills-list').innerHTML = P.skillTags.map(s=>{
        const v = power(s);
        return `<div class="meter"><div class="top"><span>${esc(s)}</span><span class="val">${v}</span></div>
          <div class="bar"><div class="fill" data-v="${v}"></div></div></div>`;
      }).join('');
      // animate meters
      requestAnimationFrame(()=>document.querySelectorAll('.meter .fill').forEach(f=>{ f.style.width = f.dataset.v+'%'; }));

      // Courses skill tree
      const TIER = CJCData.lang()==="zh" ? ["核心 I","核心 II","核心 III","进阶 I","进阶 II","进阶 III"] : ["TIER I","TIER II","TIER III","TIER IV","TIER V","TIER VI"];
      const UNLOCK = CJCData.lang()==="zh" ? "已解锁 ✓" : "UNLOCKED ✓";
      document.getElementById('courses-list').innerHTML = P.courses.map((c,i)=>`
        <div class="node hud"><span class="unlocked">${UNLOCK}</span><div class="lvl">${esc(TIER[i]||'TIER')}</div>
        <div class="ci"><i class="fa ${esc(c.icon)}" aria-hidden="true"></i></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');

      // Experience as a mission panel
      document.getElementById('exp-list').innerHTML = P.experience.map(x=>`
        <div class="hud" style="padding:26px">
          <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:baseline">
            <h3 style="margin:0;font-size:20px;font-weight:700">${esc(t(x.role))} · ${esc(t(x.company))}</h3>
            <span class="mono" style="color:var(--hot);font-weight:700">${esc(x.period)}</span></div>
          <p style="color:var(--muted);margin:12px 0 16px;font-size:14.5px">${esc(t(x.summary))}</p>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          ${x.bullets.map(b=>`<div style="display:flex;gap:10px;color:#c6d3ef;font-size:13.5px;line-height:1.5">
            <span style="color:var(--mint);font-weight:700">▹</span><span>${esc(t(b))}</span></div>`).join('')}
          </div></div>`).join('');

      document.getElementById('certs-list').innerHTML = P.certificates.map(c=>`
        <div class="cert hud"><img src="${esc(c.image)}" alt="${esc(t(c.title))}" onerror="this.src='/index_page/img/blogs/1.jpg'">
        <div class="ct"><div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');

      document.getElementById('contact-info').innerHTML = [
        ['Email', P.contact.email, 'mailto:'+P.contact.email],
        ['Phone', P.contact.phone, P.contact.phoneHref],
        ['GitHub', '@'+P.contact.githubUser, P.contact.github],
        ['WeChat', 'QR ↗', P.contact.wechatQrPage],
      ].map(([k,v,h])=>`<a href="${esc(h)}"><span>${esc(k)}</span><span>${esc(v)}</span></a>`).join('');
      document.getElementById('cf-name').placeholder = t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder = t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder = t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent = t(P.ui.send);

      document.getElementById('foot-social').innerHTML =
        `<a href="${P.contact.github}" target="_blank" rel="noopener">GitHub</a>
         <a href="mailto:${P.contact.email}">Email</a>
         <a href="${P.contact.wechatQrPage}">WeChat</a>
         <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent = t(P.ui.footer_desc);
      const icp = document.getElementById('foot-icp'); icp.textContent = P.icp; icp.href = P.icpUrl;

      document.getElementById('filters').innerHTML = P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box = document.getElementById('projects-list');
      if(!projects.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML = projects.map((p,i)=>{
        const score = 98 - i*3;
        const thumb = p.cover_image ? `<div class="thumb"><img src="${esc(p.cover_image)}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>`
                                    : `<div class="thumb"><img src="/index_page/img/blogs/1.jpg" alt=""></div>`;
        return `<a class="lb hud ${i===0?'top1':''}" href="${esc(p.href)}">
          <div class="rank">#${i+1}<small>${esc(p.dateText())}</small></div>
          ${thumb}
          <div class="info"><h4>${esc(p.localTitle())}</h4>
            <div class="m"><span class="cat">${esc(p.tech_stack||t(P.ui.tech_stack))}</span></div>
            <p>${esc(p.localSummary()||'')}</p></div>
          <div class="score"><b>${score}</b><span>SCORE</span></div></a>`;
      }).join('');
    }

    function renderArticles(){
      const box = document.getElementById('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML = list.map((a,i)=>{
        const score = 97 - i*2;
        return `<a class="lb hud ${i===0?'top1':''}" href="${esc(a.href)}">
          <div class="rank">#${i+1}<small>${esc(a.dateText())}</small></div>
          <div class="thumb"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${esc(a.localTitle())}"></div>
          <div class="info"><h4>${esc(a.localTitle())}</h4>
            <div class="m"><span class="cat">${esc(a.category||'')}</span></div>
            <p>${esc(a.localSummary()||'')}</p></div>
          <div class="score"><b>${score}</b><span>${esc(t(P.ui.read_more))}</span></div></a>`;
      }).join('');
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML = `<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-list').innerHTML = `<div class="load-note">⚠ 内容加载失败 / Failed to load.</div>`; }
    }

    document.getElementById('cf').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      const payload = { name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color='var(--muted)'; s.textContent = t(P.ui.sending);
      try{ const r = await CJCData.sendContact(payload); s.style.color='var(--mint)'; s.textContent = r.message||'Sent.'; f.reset(); }
      catch(err){ s.style.color='var(--hot)'; s.textContent = err.message; }
    });

    const fa = document.createElement('link');
    fa.rel='stylesheet'; fa.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css';
    document.head.appendChild(fa);

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:'#22e0a1' });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

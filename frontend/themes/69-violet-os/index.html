  <script>window.THEME_ID='69-violet-os';</script>
  <script src="/shared/profile.js"></script><script src="/shared/site-data.js"></script>
  <script>
  (()=>{'use strict';const P=CJCData.profile,t=CJCData.t.bind(CJCData),e=CJCData.escapeHtml;let projects=[],articles=[],filter='all';
  const L={en:{nav:[['about','Profile'],['education','Archive'],['work','Projects'],['journal','Log'],['contact','Connect']],intro:'A personal operating system for useful ideas, careful code and ambitious experiments.',about:'User profile',aboutLead:'The person behind the terminal, documented without the usual abstraction.',skills:'System stack',skillsLead:'Languages, tools and practices currently loaded into memory.',education:'Education archive',educationLead:'Academic foundations, current coordinates and the next active process.',courses:'Core modules',coursesLead:'The disciplines that shape how software systems are understood and built.',experience:'Process history',experienceLead:'Production experience across full-stack systems, data pipelines and LLM infrastructure.',projects:'Open windows',projectsLead:'Selected builds retrieved live from the project archive.',journal:'Field log',journalLead:'Working notes from engineering, research and everything between.',cert:'Verified records',certLead:'Certificates and milestones from the archive.',contact:'New connection',contactLead:'Open a channel for a project, an opportunity or an interesting problem.',location:'Current node',project:'Launch process',read:'Read entry',failed:'The data process is unavailable. Try again shortly.',send:'Transmit message',sending:'Transmitting…',sent:'Message received.',name:'Name',email:'Email',message:'Message',cv:'Download CV',github:'Github'},zh:{nav:[['about','个人档案'],['education','教育归档'],['work','项目窗口'],['journal','工作日志'],['contact','建立连接']],intro:'一个用于承载实用创意、严谨代码与大胆实验的个人操作系统。',about:'用户档案',aboutLead:'终端背后的人，不再隐藏在抽象概念之中。',skills:'系统栈',skillsLead:'当前载入内存的语言、工具与工作方法。',education:'教育归档',educationLead:'学术基础、当前坐标与下一项正在运行的进程。',courses:'核心模块',coursesLead:'塑造我理解并构建软件系统方式的核心学科。',experience:'进程历史',experienceLead:'覆盖全栈系统、数据管线与大模型基础设施的生产实践。',projects:'开放窗口',projectsLead:'从项目档案实时读取的精选构建。',journal:'现场日志',journalLead:'来自工程、研究及其间一切探索的工作笔记。',cert:'验证记录',certLead:'档案中的证书与重要里程碑。',contact:'新建连接',contactLead:'为项目、机会或一个有趣的问题打开频道。',location:'当前节点',project:'启动项目',read:'读取条目',failed:'数据进程暂时不可用，请稍后重试。',send:'传输消息',sending:'正在传输…',sent:'消息已收到。',name:'姓名',email:'邮箱',message:'留言',cv:'下载简历',github:'Github'}};
  const l=()=>L[CJCData.lang()];const link=(u,s)=>`<a href="${e(u)}">${e(s)}</a>`;const bar=(title,code='ACTIVE')=>`<div class="window-bar"><span>${e(title)}</span><span>${e(code)}</span><span class="dots"><i></i><i></i><i></i></span></div>`;const head=(key,title)=>`<div class="section-head reveal"><div class="eyebrow">69.OS / ${e(title)}</div><div><h2>${e(title)}</h2><p class="section-lead">${e(l()[key+'Lead'])}</p></div></div>`;
  function hero(){const x=l();return `<section class="hero" id="top"><h2 class="hero-title" aria-hidden="true">CJC</h2><div class="shell hero-grid"><article class="desktop intro-window">${bar('identity.txt','READ ONLY')}<div class="intro-body"><div class="kicker">${e(t(P.greeting))} / ${e(t(P.location))}</div><h1>${e(t(P.name))}</h1><p>${e(x.intro)} ${e(t(P.headline))}.</p><div class="buttons"><a class="button primary" href="${e(t(P.cv))}" download><i class="fa fa-download" aria-hidden="true"></i>${e(x.cv)}</a><a class="button" href="${e(P.contact.github)}" target="_blank" rel="noopener"><i class="fa fa-github" aria-hidden="true"></i>${e(x.github)}</a></div></div></article><article class="desktop portrait-window">${bar('visual.input','69.01')}<figure><img src="${e(P.avatar)}" alt="${e(t(P.name))}"><figcaption class="portrait-data"><span><strong>${e(t(P.role))}</strong><br>${e(t(P.title))}</span><span>NODE 23.129<br>STATUS ONLINE</span></figcaption></figure></article><article class="desktop utility">${bar('runtime.info','78%')}<div class="utility-body"><strong>69</strong><p>${e(t(P.role))}<br>${e(x.location)}: ${e(t(P.location))}</p><div class="meter"><span></span></div></div></article></div><div class="shell scroll-line"><span>Scroll to inspect</span><span>00 — 10</span></div></section>`}
  function about(){const x=l(),photo=P.photos?.campus||P.avatarAlt||P.avatar;return `<section id="about" class="section"><div class="shell">${head('about',x.about)}<div class="about-layout"><article class="bio-window reveal"><div class="eyebrow">PROFILE.DATA / ${e(t(P.name))}</div><p>${e(t(P.bio[0]))}</p><p>${e(t(P.bio[1]))}</p><div class="buttons"><a class="button" href="mailto:${e(P.contact.email)}">${e(P.contact.email)}</a></div></article><figure class="photo-terminal reveal"><img loading="lazy" src="${e(photo)}" alt="${e(t(P.name))} on campus"><figcaption>${e(x.location)} / ${e(t(P.location))} / PROFILE IMAGE 02</figcaption></figure></div></div></section>`}
  function skills(){const x=l();return `<section id="skills" class="section purple"><div class="shell">${head('skills',x.skills)}<div class="skill-console reveal"><div class="skill-aside"><div class="eyebrow">MEMORY MAP</div><h3>Build<br>Mode</h3><p>${e(t(P.ui.core_tech))}</p></div><div class="skill-grid">${P.skillTags.map((s,i)=>`<span>${String(i+1).padStart(2,'0')} / ${e(s)}</span>`).join('')}</div></div></div></section>`}
  function education(){const x=l();return `<section id="education" class="section"><div class="shell">${head('education',x.education)}<div class="edu-grid reveal">${P.education.map((s,i)=>`<article class="edu-card"><time>REC ${String(i+1).padStart(2,'0')} / ${e(s.period)}</time><h3>${e(t(s.school))}</h3><p>${e(t(s.degree))}<br>${e(t(s.note))}</p></article>`).join('')}</div></div></section>`}
  function courses(){const x=l();return `<section id="courses" class="section purple"><div class="shell">${head('courses',x.courses)}<div class="course-grid reveal">${P.courses.map((c,i)=>`<article class="course"><i class="fa ${e(c.icon)}" aria-hidden="true"></i><h3>${String(i+1).padStart(2,'0')}<br>${e(t(c.title))}</h3><p>${e(t(c.desc))}</p></article>`).join('')}</div></div></section>`}
  function experience(){const x=l(),v=P.experience[0];return `<section id="experience" class="section"><div class="shell">${head('experience',x.experience)}<article class="experience-card reveal"><div class="meta">PID 2601<br>${e(v.period)}<br><br>${e(t(v.company))}</div><div><h3>${e(t(v.role))}</h3><p>${e(t(v.summary))}</p><ul>${v.bullets.map(b=>`<li>${e(t(b))}</li>`).join('')}</ul></div></article></div></section>`}
  function projectsView(){const x=l();const body=projects.length?`<div class="project-grid reveal">${projects.map((p,i)=>`<a class="project" href="${e(p.href)}"><div class="project-media"><img loading="lazy" src="${e(p.cover_image||'/index_page/img/blogs/1.jpg')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(p.localTitle())}"></div><div class="project-copy"><div class="meta">WINDOW ${String(i+1).padStart(2,'0')} / ${e(p.dateText())}</div><h3>${e(p.localTitle())}</h3><p>${e(p.localSummary()||'')}</p><div class="stack">${e(p.tech_stack||t(P.ui.tech_stack))} / ${e(x.project)}</div></div></a>`).join('')}</div>`:`<p class="loading">${e(t(P.ui.loading_projects))}</p>`;return `<section id="work" class="section"><div class="shell">${head('projects',x.projects)}${body}</div></section>`}
  function articlesView(){const x=l(),list=CJCData.filterArticles(articles,filter);const body=!articles.length?`<p class="loading">${e(t(P.ui.loading_articles))}</p>`:!list.length?`<p class="loading">${e(t(P.ui.no_articles))}</p>`:`<div class="article-grid reveal">${list.map(a=>`<article class="article"><div class="article-media"><img loading="lazy" src="${e(a.cover_image||'/index_page/img/blogs/1.jpg')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(a.localTitle())}"></div><div class="article-copy"><div class="meta">${e(a.category||'LOG')} / ${e(a.dateText())}</div><h3>${e(a.localTitle())}</h3><p>${e(a.localSummary()||'')}</p><a class="more" href="${e(a.href)}">${e(x.read)} →</a></div></article>`).join('')}</div>`;return `<section id="journal" class="section"><div class="shell">${head('journal',x.journal)}<div class="filters" aria-label="Article categories">${P.articleFilters.map(f=>`<button type="button" data-filter="${e(f.key)}" class="${filter===f.key?'active':''}">${e(t(f.label))}</button>`).join('')}</div>${body}</div></section>`}
  function certificates(){const x=l();return `<section id="certificates" class="section"><div class="shell">${head('cert',x.cert)}<div class="cert-grid reveal">${P.certificates.map(c=>`<article class="certificate"><img loading="lazy" src="${e(c.image)}" alt="${e(t(c.title))}"><div><div class="meta">${e(t(c.tag))} / ${e(t(c.date))}</div><h3>${e(t(c.title))}</h3><p>${e(t(c.desc))}</p></div></article>`).join('')}</div></div></section>`}
  function contact(){const x=l();return `<section id="contact" class="section purple"><div class="shell">${head('contact',x.contact)}<div class="contact-layout"><div class="contact-copy reveal"><div class="eyebrow">CHANNEL OPEN</div><h3>Say<br>Hello.</h3><p>${e(t(P.ui.inbox_open))}</p><div class="contact-links"><a href="mailto:${e(P.contact.email)}"><span>Email</span><span>${e(P.contact.email)}</span></a><a href="${e(P.contact.github)}" target="_blank" rel="noopener"><span>Github</span><span>@${e(P.contact.githubUser)}</span></a><a href="${e(P.contact.wechatQrPage)}"><span>WeChat</span><span>Open QR</span></a></div></div><form class="form-window reveal" id="contact-form"><div class="window-bar"><span>compose.message</span><span>NEW</span></div><br><input name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true"><label for="contact-name">${e(x.name)}</label><input id="contact-name" name="name" autocomplete="name" required><label for="contact-email">${e(x.email)}</label><input id="contact-email" type="email" name="email" autocomplete="email" required><label for="contact-message">${e(x.message)}</label><textarea id="contact-message" name="message" required></textarea><button class="button primary" type="submit">${e(x.send)}</button><p id="status" role="status" aria-live="polite"></p></form></div></div></section>`}
  function render(){const x=l();document.title=`${t(P.name)} — Violet OS`;document.getElementById('nav').innerHTML=x.nav.map(v=>`<a href="#${e(v[0])}">${e(v[1])}</a>`).join('');document.getElementById('content').innerHTML=hero()+about()+skills()+education()+courses()+experience()+projectsView()+articlesView()+certificates()+contact();document.getElementById('footer-note').textContent=t(P.ui.footer_desc);document.getElementById('footer-links').innerHTML=`${link(P.contact.github,'Github')}${link('mailto:'+P.contact.email,'Email')}${link(P.contact.wechatQrPage,'WeChat')}${link('/admin.html',t(P.ui.admin_panel))}${link(P.icpUrl,P.icp)}`;wire();observe()}
  function wire(){document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;render()}));const f=document.getElementById('contact-form');if(f)f.addEventListener('submit',async ev=>{ev.preventDefault();const s=document.getElementById('status'),x=l(),btn=f.querySelector('button');btn.disabled=true;s.textContent=x.sending;try{const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});s.textContent=r.message||x.sent;f.reset()}catch(err){s.textContent=err.message||x.failed}finally{btn.disabled=false}})}
  let observer;function observe(){if(matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('.reveal').forEach(n=>n.classList.add('in'));return}if(observer)observer.disconnect();observer=new IntersectionObserver(es=>es.forEach(v=>{if(v.isIntersecting){v.target.classList.add('in');observer.unobserve(v.target)}}),{threshold:.08});document.querySelectorAll('.reveal').forEach(n=>observer.observe(n))}
  document.addEventListener('DOMContentLoaded',async()=>{CJCData.setTheme(window.THEME_ID);render();CJCData.mountSwitcher({accent:'#5d28ed'});CJCData.onLang(render);try{[projects,articles]=await Promise.all([CJCData.fetchProjects(),CJCData.fetchArticles()]);render()}catch(err){document.querySelectorAll('.loading').forEach(n=>{n.className='failure';n.textContent=l().failed})}});
  })();
  </script>
</body></html>

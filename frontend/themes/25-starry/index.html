<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>Cai Jiechao — Constellation Atlas</title>
  <meta name="description" content="An interactive cosmos. Pan and zoom through a living night sky, light up constellations to reveal Cai Jiechao's story, and catch a shooting star to make a wish." />
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{
      --bg0:#05061a; --bg1:#0b1e4d;
      --accent:#8ab4ff; --accent2:#b79bff; --teal:#57e0d6; --gold:#ffd98a;
      --ink:#eef2ff; --muted:#a9b4d8; --dim:#7f8bb5;
      --glass:rgba(14,20,48,.82); --glass2:rgba(18,26,58,.6);
      --hair:rgba(138,180,255,.18); --edge:rgba(138,180,255,.32);
      --f-disp:'Sora','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
      --f-body:'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{font-family:var(--f-body);color:var(--ink);background:#03041a;-webkit-font-smoothing:antialiased;overflow:hidden}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    button{font-family:inherit}
    ::selection{background:rgba(138,180,255,.35)}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

    .cosmos{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;
      background:
        radial-gradient(1200px 700px at 78% -8%, rgba(139,155,255,.12), transparent 60%),
        radial-gradient(900px 600px at 12% 112%, rgba(87,224,214,.08), transparent 60%),
        linear-gradient(180deg, var(--bg0) 0%, #071233 46%, #05061a 100%)}
    .cosmos.grabbing{cursor:grabbing}
    #sky-c{position:absolute;inset:0;z-index:1;display:block}
    /* Milky Way band */
    .milky{position:absolute;left:-20%;right:-20%;top:38%;height:36vh;z-index:1;pointer-events:none;
      transform:rotate(-18deg);filter:blur(24px);opacity:.5;
      background:linear-gradient(90deg,transparent, rgba(180,190,255,.18) 30%, rgba(200,180,255,.22) 55%, rgba(120,200,255,.14) 75%, transparent)}
    .neb{position:absolute;z-index:1;pointer-events:none;filter:blur(80px);border-radius:50%}
    .neb.n1{width:44vw;height:44vw;top:-8vw;right:-6vw;background:radial-gradient(circle,rgba(120,90,255,.5),transparent 68%);animation:drift1 42s ease-in-out infinite alternate}
    .neb.n2{width:40vw;height:40vw;bottom:-12vw;left:-8vw;background:radial-gradient(circle,rgba(60,140,255,.42),transparent 68%);animation:drift2 50s ease-in-out infinite alternate}
    .neb.n3{width:28vw;height:28vw;top:44%;left:56%;background:radial-gradient(circle,rgba(70,220,210,.26),transparent 70%);animation:drift1 58s ease-in-out infinite alternate}
    @keyframes drift1{from{transform:translate(0,0)}to{transform:translate(4vw,3vw)}}
    @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-3vw,-4vw)}}

    /* World layer */
    .sky{position:absolute;left:0;top:0;width:0;height:0;z-index:3;transform-origin:0 0;will-change:transform}

    .cnode{position:absolute;transform:translate(-50%,-50%);cursor:pointer;background:none;border:0;padding:0;color:inherit}
    .cnode .cwrap{position:relative;width:230px;height:190px}
    .cnode svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
    .cnode .star{fill:#dbe7ff;opacity:.55;transition:opacity .3s, r .3s}
    .cnode .star.big{opacity:.8}
    .cnode:hover .star,.cnode:focus-visible .star,.cnode.lit .star{opacity:1;filter:drop-shadow(0 0 4px var(--accent))}
    .cnode path.link{stroke:var(--accent);stroke-width:1.4;fill:none;opacity:0;stroke-dasharray:1;stroke-dashoffset:1;
      transition:stroke-dashoffset 1.1s ease, opacity .4s}
    .cnode:hover path.link,.cnode:focus-visible path.link,.cnode.lit path.link{opacity:.9;stroke-dashoffset:0}
    .cnode.active path.link{stroke:var(--gold)}
    .cnode .clabel{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);white-space:nowrap;text-align:center}
    .cnode .clabel .cn{font-family:var(--f-disp);font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--ink);
      opacity:.55;transition:opacity .3s;text-shadow:0 0 10px rgba(5,6,26,.9)}
    .cnode:hover .clabel .cn,.cnode:focus-visible .clabel .cn,.cnode.lit .clabel .cn{opacity:1;color:var(--accent)}
    .cnode .clabel .cs{display:block;font-family:var(--f-disp);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:2px}
    .cnode.twinkle .star{animation:tw 3.4s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.5}50%{opacity:.9}}

    /* Hidden CJC constellation */
    .cnode.secret .star{fill:var(--gold);opacity:.32}
    .cnode.secret .star.hit{opacity:1;filter:drop-shadow(0 0 6px var(--gold))}
    .cnode.secret path.link{stroke:var(--gold)}
    .cnode.secret .clabel .cs{color:rgba(255,217,138,.5)}

    /* Planet / Moon (phases) */
    .planet{position:absolute;transform:translate(-50%,-50%);border-radius:50%;cursor:default}
    .planet.saturn{width:120px;height:120px;background:radial-gradient(circle at 34% 30%,#ffe0b8,#e0a862 46%,#7a4a1e 100%);
      box-shadow:0 0 44px rgba(224,168,98,.4), inset -12px -8px 26px rgba(0,0,0,.45)}
    .planet.saturn .ring{position:absolute;inset:-34% -14%;border-radius:50%;border:9px solid rgba(255,224,184,.32);transform:rotate(-22deg);border-left-color:transparent;border-right-color:transparent}
    .moon{position:absolute;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;cursor:pointer;overflow:hidden;
      background:radial-gradient(circle at 38% 34%,#f4f7ff,#c3ccdd 50%,#8a93ad 100%);
      box-shadow:0 0 40px rgba(190,205,235,.4), inset -10px -8px 26px rgba(0,0,0,.4)}
    .moon .shadow{position:absolute;inset:0;border-radius:50%;background:#05061a;
      transition:transform .5s ease;transform:translateX(-100%)}
    .moon .crat{position:absolute;border-radius:50%;background:rgba(0,0,0,.14)}
    .moon .mlbl{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);white-space:nowrap;
      font-family:var(--f-disp);font-size:10px;letter-spacing:.14em;color:var(--muted)}

    /* Shooting stars / comet */
    .shoot{position:fixed;z-index:6;width:120px;height:3px;pointer-events:auto;cursor:pointer;transform-origin:left center}
    .shoot i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,transparent,rgba(200,220,255,.95));
      box-shadow:0 0 8px rgba(200,220,255,.7)}
    .shoot .head{position:absolute;right:-3px;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;
      background:#fff;box-shadow:0 0 12px #cfe0ff}
    .comet{position:fixed;z-index:6;width:180px;height:5px;pointer-events:auto;cursor:pointer;transform-origin:left center}
    .comet i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,transparent,rgba(255,217,138,.9),rgba(183,155,255,.9))}
    .comet .head{position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 18px var(--gold)}

    /* Reticle / telescope */
    .reticle{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:12;pointer-events:none;color:rgba(138,180,255,.4)}
    .reticle svg{width:150px;height:150px}
    .scope-vig{position:fixed;inset:0;z-index:11;pointer-events:none;
      background:radial-gradient(circle at 50% 50%, transparent 46%, rgba(3,4,20,.5) 74%, rgba(3,4,20,.85) 100%)}
    .coords{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:13;pointer-events:none;text-align:center}
    .coords .t{font-family:var(--f-disp);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
    .coords .c{font-family:var(--f-disp);font-size:10px;letter-spacing:.1em;color:var(--dim);margin-top:2px}

    .brand{position:fixed;top:12px;left:16px;z-index:14;display:flex;align-items:center;gap:9px;pointer-events:none}
    .brand .dot{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--accent) 55%,#2a3f8f);box-shadow:0 0 14px var(--accent)}
    .brand b{font-family:var(--f-disp);font-weight:800;font-size:15px;letter-spacing:.02em}
    .brand b span{color:var(--accent)}
    @media(max-width:560px){.brand b{font-size:13px}}

    .hint{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);z-index:13;pointer-events:none;
      font-family:var(--f-disp);font-size:10px;letter-spacing:.05em;color:var(--dim);white-space:nowrap;
      background:rgba(6,10,34,.5);border:1px solid var(--hair);border-radius:99px;padding:6px 14px;backdrop-filter:blur(3px)}
    .hint b{color:var(--accent)}
    @media(max-width:900px){.hint{display:none}}

    .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-12px);z-index:40;pointer-events:none;
      font-family:var(--f-disp);font-weight:600;font-size:13px;letter-spacing:.02em;color:#08122e;
      background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:99px;padding:9px 18px;
      box-shadow:0 12px 30px rgba(138,180,255,.4);opacity:0;transition:.3s;max-width:88vw;text-align:center}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* zoom + pan controls */
    .zoomer{position:fixed;bottom:16px;right:16px;z-index:14;display:flex;flex-direction:column;gap:6px}
    .zoomer button{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:18px;cursor:pointer;
      border:1px solid var(--hair);background:rgba(14,20,48,.82);color:var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.4);transition:.12s}
    .zoomer button:hover{border-color:var(--accent);color:var(--accent)}
    @media(max-width:900px){.zoomer{bottom:70px;right:10px}}
    .pad{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:14;display:grid;
      grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,42px);gap:6px}
    .pad button{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:16px;cursor:pointer;
      border:1px solid var(--hair);background:rgba(14,20,48,.82);color:var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.4);transition:.12s}
    .pad button:active{background:var(--accent);color:#08122e}
    .pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
    @media(min-width:901px){.pad{display:none}}

    /* ===== panel ===== */
    .scrim{position:fixed;inset:0;z-index:30;background:rgba(2,4,20,.55);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s}
    .scrim.open{opacity:1;pointer-events:auto}
    .panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);z-index:31;
      width:min(680px,92vw);max-height:82vh;display:flex;flex-direction:column;opacity:0;pointer-events:none;
      background:var(--glass);border:1px solid var(--edge);border-radius:20px;
      box-shadow:0 40px 90px rgba(2,4,20,.7), inset 0 1px 0 rgba(255,255,255,.06);
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:opacity .28s, transform .28s}
    .panel.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
    .p-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--hair);flex:none}
    .p-head .pstar{color:var(--accent);font-size:16px;filter:drop-shadow(0 0 8px var(--accent))}
    .p-head .ph{flex:1;min-width:0}
    .p-head .ph .k{font-family:var(--f-disp);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
    .p-head .ph h2{margin:2px 0 0;font-family:var(--f-disp);font-size:clamp(19px,3.6vw,27px);font-weight:700;letter-spacing:-.01em;
      background:linear-gradient(90deg,#fff,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
    .p-head .px{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--hair);background:rgba(138,180,255,.06);
      color:var(--ink);cursor:pointer;font-size:16px;display:grid;place-items:center;transition:.14s}
    .p-head .px:hover{border-color:var(--accent);color:var(--accent)}
    .p-body{overflow:auto;padding:22px 22px 26px;scrollbar-width:thin}
    .p-body::-webkit-scrollbar{width:8px}.p-body::-webkit-scrollbar-thumb{background:rgba(138,180,255,.3);border-radius:4px}
    .leaf{display:none}.leaf.on{display:block}

    .hero-id .greet{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-disp);font-size:12px;letter-spacing:.06em;color:var(--accent);
      padding:6px 13px;border:1px solid var(--edge);border-radius:99px;background:rgba(138,180,255,.08)}
    .hero-id .greet::before{content:"✦"}
    .hero-id h1{font-family:var(--f-disp);font-size:clamp(32px,7vw,54px);line-height:1.02;letter-spacing:-.03em;margin:14px 0 0;font-weight:800}
    .hero-id .role{font-family:var(--f-disp);color:var(--accent);font-weight:600;margin-top:10px;font-size:clamp(16px,2.4vw,21px)}
    .hero-id .head{color:var(--muted);margin-top:12px;font-size:15px}
    .hero-id .meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:13px;color:var(--dim)}
    .hero-id .meta b{color:var(--ink)}
    .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
    .btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-disp);font-weight:600;font-size:13px;
      padding:12px 20px;border-radius:99px;border:1px solid transparent;cursor:pointer;transition:transform .15s,box-shadow .2s}
    .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#08122e;box-shadow:0 10px 26px rgba(138,180,255,.35)}
    .btn.primary:hover{transform:translateY(-2px)}
    .btn.ghost{background:rgba(138,180,255,.06);border-color:var(--edge);color:var(--ink)}
    .btn.ghost:hover{background:rgba(138,180,255,.14)}

    .about-grid{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:start}
    @media(max-width:480px){.about-grid{grid-template-columns:1fr}.about-grid .frame{max-width:150px}}
    .frame{border-radius:50%;overflow:hidden;border:1px solid var(--edge);background:#0a1330;box-shadow:0 0 34px rgba(138,180,255,.3)}
    .frame img{width:100%;aspect-ratio:1;object-fit:cover}
    .about p{color:var(--muted);font-size:14.5px;line-height:1.65;margin:0 0 12px}
    .loc{display:inline-flex;gap:8px;align-items:center;color:var(--accent);font-family:var(--f-disp);font-size:13px;font-weight:600}

    .rows{display:flex;flex-direction:column;gap:12px}
    .rowcard{padding:16px 18px;border:1px solid var(--hair);border-radius:14px;background:var(--glass2)}
    .rowcard .when{font-family:var(--f-disp);font-size:12px;color:var(--accent);letter-spacing:.03em;margin-bottom:5px}
    .rowcard h3{margin:0 0 5px;font-size:16px;font-weight:700}
    .rowcard .sub{color:var(--muted);font-size:13.5px;line-height:1.5}
    .rowcard ul{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px;line-height:1.7}
    .rowcard ul li::marker{color:var(--accent)}

    .chips{display:flex;flex-wrap:wrap;gap:9px}
    .chip{padding:8px 14px;border-radius:99px;border:1px solid var(--hair);background:rgba(138,180,255,.06);font-size:13px;font-weight:500;color:var(--ink);transition:.16s}
    .chip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
    .sysrows{display:grid;gap:11px;margin-top:16px}
    .sys .lab{display:flex;justify-content:space-between;font-family:var(--f-disp);font-size:12px;margin-bottom:5px}
    .sys .lab .n{color:var(--ink)}.sys .lab .p{color:var(--teal)}
    .track{height:8px;border-radius:99px;background:rgba(138,180,255,.12);overflow:hidden;border:1px solid var(--hair)}
    .track i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--teal));transition:width 1s cubic-bezier(.2,.8,.2,1)}

    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:520px){.grid2{grid-template-columns:1fr}}
    .course{padding:16px;border:1px solid var(--hair);border-radius:14px;background:var(--glass2)}
    .course .ci{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;color:var(--accent);
      background:rgba(138,180,255,.1);border:1px solid var(--edge);margin-bottom:10px;box-shadow:0 0 18px rgba(138,180,255,.15)}
    .course h4{margin:0 0 6px;font-size:14.5px;font-weight:700}
    .course p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.55}

    .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
    .filters button{background:rgba(138,180,255,.05);border:1px solid var(--hair);color:var(--muted);font-family:var(--f-disp);
      font-weight:600;font-size:12px;padding:8px 14px;border-radius:99px;cursor:pointer;transition:.16s}
    .filters button.active,.filters button:hover{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#08122e;border-color:transparent}
    .flist{display:grid;gap:11px}
    .card{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:11px;border:1px solid var(--hair);
      border-radius:13px;background:var(--glass2);transition:.16s;color:inherit}
    .card:hover{border-color:var(--edge);background:rgba(138,180,255,.08);transform:translateX(3px)}
    .card .thumb{width:64px;height:52px;border-radius:9px;object-fit:cover;background:#0a1436;border:1px solid var(--hair)}
    .card .mid{min-width:0}
    .card .r1{font-family:var(--f-disp);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:3px;display:flex;gap:8px;justify-content:space-between}
    .card .r1 .tech{color:var(--teal)}
    .card h4{margin:0;font-size:14px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .card p{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .card .arr{font-family:var(--f-disp);color:var(--dim);font-size:16px}
    .card:hover .arr{color:var(--accent)}
    .load-note{color:var(--muted);font-family:var(--f-disp);font-size:12.5px;padding:16px;text-align:center;border:1px dashed var(--hair);border-radius:12px}

    .accs{display:grid;gap:12px}
    .acc{display:grid;grid-template-columns:100px 1fr;border:1px solid var(--hair);border-radius:13px;overflow:hidden;background:var(--glass2)}
    @media(max-width:400px){.acc{grid-template-columns:74px 1fr}}
    .acc img{width:100%;height:100%;object-fit:cover;border-right:1px solid var(--hair);background:#0a1436}
    .acc .ac{padding:13px}
    .acc .ac .m{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-disp);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
    .acc .ac h4{margin:7px 0 5px;font-size:14px;font-weight:700}
    .acc .ac p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}

    .ci-list{display:grid;gap:9px;margin-bottom:16px}
    .ci-list a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--hair);border-radius:12px;background:var(--glass2);transition:.14s}
    .ci-list a:hover{transform:translateX(3px);border-color:var(--edge)}
    .ci-key{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-size:12px;color:var(--ink)}
    .ci-key i{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;color:var(--accent);border:1px solid var(--edge);background:rgba(138,180,255,.1)}
    .ci-val{font-family:var(--f-disp);font-size:12px;color:var(--accent);word-break:break-word;text-align:right}
    .cform label{display:block;font-family:var(--f-disp);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0 0 6px}
    .cform input,.cform textarea{width:100%;background:rgba(5,10,30,.55);color:var(--ink);border:1px solid var(--hair);border-radius:11px;
      font-family:inherit;font-size:14px;padding:11px 13px;margin-bottom:14px;transition:.15s}
    .cform input:focus,.cform textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(138,180,255,.18)}
    .cform textarea{min-height:96px;resize:vertical}
    .cform .btn{width:100%;justify-content:center}

    .foot-links a:hover{color:var(--accent)}
    .foot a{color:var(--dim)}.foot a:hover{color:var(--accent)}

    /* ===== reduced / fallback ===== */
    body.reduced{overflow:auto;background:linear-gradient(180deg,var(--bg0),#071233 46%,var(--bg1))}
    body.reduced .cosmos{position:relative;inset:auto;overflow:visible;cursor:default}
    body.reduced #sky-c,body.reduced .reticle,body.reduced .scope-vig,body.reduced .zoomer,body.reduced .pad,
    body.reduced .hint,body.reduced .shoot,body.reduced .comet{display:none!important}
    body.reduced .sky{position:relative;transform:none!important;width:auto;height:auto;display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;padding:88px 18px 10px;z-index:3}
    body.reduced .cnode{position:relative;left:auto!important;top:auto!important;transform:none;justify-self:center}
    body.reduced .cnode .star,body.reduced .cnode path.link,body.reduced .cnode .clabel .cn{opacity:1}
    body.reduced .cnode path.link{stroke-dashoffset:0}
    body.reduced .planet,body.reduced .moon{display:none}
    body.reduced .scrim{display:none}
    body.reduced .panel{position:static;transform:none;opacity:1;pointer-events:auto;width:min(820px,94vw);max-height:none;margin:0 auto 22px;background:var(--glass)}
    body.reduced .panel .px{display:none}
    body.reduced .leaf{display:block!important;border-top:1px solid var(--hair);padding-top:16px;margin-top:16px}
    body.reduced .leaf:first-child{border-top:none;margin-top:0;padding-top:0}
    body.reduced .p-body{overflow:visible;max-height:none}
    @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important;scroll-behavior:auto!important} }
  </style>

  <script>window.THEME_ID = "25-starry";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    "use strict";
    var CJC = window.CJCData, P = CJC.profile, esc = CJC.escapeHtml;
    function t(f){ return CJC.t(f); }
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce) document.body.classList.add('reduced');
    var articles=[], projects=[], filterKey="all";

    // Constellation definitions: local star coords (in 230x190 box), connection order (sequential), world pos.
    var CONST = [
      {id:'hero', sec:'hero', name:{en:'The Navigator',zh:'领航者'}, kicker:{en:'Identity',zh:'身份'}, x:0, y:-30,
        pts:[[115,30],[65,80],[115,92],[165,80],[115,160]]},
      {id:'about', sec:'about', name:{en:'The Scholar',zh:'学者座'}, kicker:{en:'About',zh:'关于我'}, x:-560,y:-250,
        pts:[[24,120],[64,68],[104,90],[146,40],[186,70],[150,124]]},
      {id:'education', sec:'education', name:{en:'The Ascent',zh:'登临座'}, kicker:{en:'Academic',zh:'教育背景'}, x:540,y:-300,
        pts:[[24,152],[64,112],[104,120],[146,72],[190,30]]},
      {id:'skills', sec:'skills', name:{en:'The Forge',zh:'熔炉座'}, kicker:{en:'Tech Stack',zh:'技术栈'}, x:-720,y:180,
        pts:[[34,62],[84,40],[124,82],[92,132],[44,120],[156,52]]},
      {id:'courses', sec:'courses', name:{en:'The Academy',zh:'学院座'}, kicker:{en:'Foundations',zh:'核心课程'}, x:680,y:200,
        pts:[[44,42],[104,30],[168,52],[156,112],[92,132],[44,102]]},
      {id:'experience', sec:'experience', name:{en:'The Voyager',zh:'远航座'}, kicker:{en:'Experience',zh:'实习经历'}, x:-300,y:470,
        pts:[[24,92],[74,52],[114,92],[156,52],[206,92],[114,146]]},
      {id:'projects', sec:'projects', name:{en:'The Builder',zh:'建造座'}, kicker:{en:'Projects',zh:'项目'}, x:360,y:-560,
        pts:[[44,132],[44,62],[104,32],[166,62],[166,132],[104,92]]},
      {id:'articles', sec:'articles', name:{en:'The Chronicle',zh:'编年座'}, kicker:{en:'Field Notes',zh:'文章博客'}, x:860,y:-30,
        pts:[[32,42],[82,72],[132,42],[186,72],[152,124],[72,124]]},
      {id:'certificates', sec:'certificates', name:{en:'The Laurels',zh:'桂冠座'}, kicker:{en:'Milestones',zh:'荣誉证书'}, x:-880,y:-80,
        pts:[[114,22],[62,52],[52,102],[92,146],[156,124],[176,62]]},
      {id:'contact', sec:'contact', name:{en:'The Beacon',zh:'信标座'}, kicker:{en:'Signal',zh:'联系我'}, x:60,y:650,
        pts:[[114,22],[82,82],[114,82],[146,82],[72,146],[156,146]]}
    ];
    // Hidden CJC constellation (spell "CJC" with dot-stars) — click stars 1..N in order.
    var SECRET = {id:'secret', x:-980,y:520,
      // C  J  C  (each letter a few stars); order matters
      pts:[[20,30],[10,60],[20,90],[40,20],[40,100],  [90,20],[110,20],[105,90],[85,105],  [150,30],[140,60],[150,90],[170,20],[170,100]]};

    var sky = document.getElementById('sky');
    function starEls(pts, extra){
      var s='';
      // path linking sequentially
      var d='M'+pts[0][0]+' '+pts[0][1];
      for(var i=1;i<pts.length;i++) d+=' L'+pts[i][0]+' '+pts[i][1];
      s+='<path class="link" d="'+d+'" pathLength="1"/>';
      pts.forEach(function(p,i){
        var big=(i%2===0);
        s+='<circle class="star'+(big?' big':'')+'" cx="'+p[0]+'" cy="'+p[1]+'" r="'+(big?3:2.2)+'" data-i="'+i+'"'+(extra?' '+extra:'')+'/>';
      });
      return s;
    }
    function buildSky(){
      var html='';
      CONST.forEach(function(c){
        html+='<button class="cnode twinkle" data-id="'+c.id+'" style="left:'+c.x+'px;top:'+c.y+'px" aria-label="'+esc(t(c.name))+'">'
          +'<span class="cwrap"><svg viewBox="0 0 230 190" aria-hidden="true">'+starEls(c.pts)+'</svg>'
          +'<span class="clabel"><span class="cn" data-name>'+esc(t(c.name))+'</span><span class="cs" data-kick>'+esc(t(c.kicker))+'</span></span>'
          +'</span></button>';
      });
      // secret CJC
      html+='<div class="cnode secret" data-id="secret" style="left:'+SECRET.x+'px;top:'+SECRET.y+'px">'
        +'<span class="cwrap"><svg viewBox="0 0 190 130" aria-hidden="true">'+starEls(SECRET.pts,'')+'</svg>'
        +'<span class="clabel"><span class="cs" id="secret-lbl">· · ·</span></span></span></div>';
      // planets
      html+='<div class="planet saturn" style="left:1050px;top:-360px"><span class="ring"></span></div>';
      html+='<div class="moon" id="moon" style="left:-460px;top:-420px" role="button" tabindex="0" aria-label="Cycle moon phase">'
        +'<span class="crat" style="width:16px;height:16px;left:26%;top:30%"></span>'
        +'<span class="crat" style="width:10px;height:10px;left:58%;top:56%"></span>'
        +'<span class="shadow" id="moon-shadow"></span>'
        +'<span class="mlbl" id="moon-lbl">'+(CJC.lang()==='zh'?'点击变换月相':'CLICK · PHASE')+'</span></div>';
      sky.innerHTML=html;

      Array.prototype.forEach.call(sky.querySelectorAll('.cnode[data-id]:not(.secret)'), function(n){
        n.addEventListener('click', function(e){ e.stopPropagation(); if(justPanned) return; focusConstellation(n.dataset.id, true); });
      });
      // secret stars in-order
      var sc=sky.querySelector('.cnode.secret');
      Array.prototype.forEach.call(sc.querySelectorAll('.star'), function(st){
        st.addEventListener('click', function(e){ e.stopPropagation(); secretClick(+st.dataset.i, st); });
      });
      var moon=document.getElementById('moon');
      moon.addEventListener('click', function(e){ e.stopPropagation(); cycleMoon(); });
      moon.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); cycleMoon(); } });
    }

    /* ---------- view (pan + zoom) ---------- */
    var view={x:0,y:-30,scale:1}, vel={x:0,y:0};
    var vw=window.innerWidth, vh=window.innerHeight;
    function applyView(){
      sky.style.transform='translate('+(vw/2 - view.x*view.scale)+'px,'+(vh/2 - view.y*view.scale)+'px) scale('+view.scale+')';
      // coords readout
      var ra=((view.x/60+24)%24+24)%24, dec=Math.max(-89,Math.min(89,-view.y/16));
      var rh=Math.floor(ra), rm=Math.floor((ra-rh)*60);
      var ds=dec<0?'-':'+', da=Math.abs(dec), dd=Math.floor(da), dmn=Math.floor((da-dd)*60);
      document.getElementById('atlas-c').textContent='RA '+String(rh).padStart(2,'0')+'h'+String(rm).padStart(2,'0')+'m · DEC '+ds+String(dd).padStart(2,'0')+'°'+String(dmn).padStart(2,'0')+'′';
    }
    function focusConstellation(id, open){
      var c=CONST.filter(function(x){return x.id===id;})[0]; if(!c) return;
      target={x:c.x, y:c.y}; vel.x=vel.y=0;
      Array.prototype.forEach.call(sky.querySelectorAll('.cnode'), function(n){ n.classList.toggle('active', n.dataset.id===id); n.classList.toggle('lit', n.dataset.id===id); });
      if(open) openPanel(id);
    }
    var target=null;

    function frame(){
      if(!reduce){
        if(target){
          view.x+=(target.x-view.x)*0.1; view.y+=(target.y-view.y)*0.1;
          if(Math.abs(target.x-view.x)<0.6&&Math.abs(target.y-view.y)<0.6){ view.x=target.x; view.y=target.y; target=null; }
        } else {
          view.x+=vel.x; view.y+=vel.y; vel.x*=0.9; vel.y*=0.9;
        }
        applyView();
        drawStars();
      }
      requestAnimationFrame(frame);
    }

    /* ---------- starfield backdrop (parallax to pan) ---------- */
    var canvas=document.getElementById('sky-c'), sctx=canvas.getContext('2d');
    var SW,SH,layers=[],DPR=Math.min(2,window.devicePixelRatio||1);
    function sizeStars(){
      SW=canvas.width=Math.floor(innerWidth*DPR); SH=canvas.height=Math.floor(innerHeight*DPR);
      canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px'; vw=innerWidth; vh=innerHeight;
      layers=[];
      var defs=[{n:170,f:0.03,s:0.6,a:.5,h:'255,255,255'},{n:120,f:0.07,s:0.9,a:.7,h:'200,215,255'},{n:70,f:0.13,s:1.3,a:.95,h:'175,225,255'}];
      defs.forEach(function(d){
        var arr=[];
        for(var i=0;i<d.n;i++) arr.push({x:Math.random()*SW*1.6-SW*0.3,y:Math.random()*SH*1.6-SH*0.3,r:d.s*DPR*(0.6+Math.random()*0.7),a:d.a*(0.5+Math.random()*0.5),ph:Math.random()*6.28,tw:0.004+Math.random()*0.01,h:(Math.random()<0.16?'175,225,255':(Math.random()<0.2?'200,180,255':d.h))});
        layers.push({f:d.f,arr:arr});
      });
    }
    function drawStars(){
      sctx.clearRect(0,0,SW,SH);
      layers.forEach(function(L){
        var ox=(-view.x*L.f*DPR)%(SW*1.6), oy=(-view.y*L.f*DPR)%(SH*1.6);
        L.arr.forEach(function(p){
          var x=((p.x+ox)%(SW*1.6)+SW*1.6)%(SW*1.6)-SW*0.3;
          var y=((p.y+oy)%(SH*1.6)+SH*1.6)%(SH*1.6)-SH*0.3;
          var a=reduce?p.a:p.a*(0.6+0.4*Math.sin(p.ph+=p.tw));
          sctx.beginPath(); sctx.arc(x,y,p.r,0,6.283); sctx.fillStyle='rgba('+p.h+','+a.toFixed(3)+')'; sctx.fill();
        });
      });
    }

    /* ---------- input: drag pan + wheel zoom ---------- */
    var cosmos=document.getElementById('cosmos');
    var dragging=false,lastP=null,moved=0,justPanned=false;
    cosmos.addEventListener('pointerdown', function(e){
      if(e.target.closest('.cnode[data-id]:not(.secret)')||e.target.closest('.panel')||e.target.closest('.moon')||e.target.closest('.secret .star')) return;
      dragging=true; moved=0; lastP={x:e.clientX,y:e.clientY}; cosmos.classList.add('grabbing'); target=null;
      cosmos.setPointerCapture&&cosmos.setPointerCapture(e.pointerId);
    });
    cosmos.addEventListener('pointermove', function(e){
      if(!dragging||!lastP) return;
      var dx=e.clientX-lastP.x, dy=e.clientY-lastP.y; moved+=Math.abs(dx)+Math.abs(dy);
      view.x-=dx/view.scale; view.y-=dy/view.scale; vel.x=-dx/view.scale*0.3; vel.y=-dy/view.scale*0.3;
      lastP={x:e.clientX,y:e.clientY};
    });
    function endDrag(){ if(dragging&&moved>6){ justPanned=true; setTimeout(function(){justPanned=false;},60);} dragging=false; lastP=null; cosmos.classList.remove('grabbing'); }
    cosmos.addEventListener('pointerup', endDrag);
    cosmos.addEventListener('pointercancel', endDrag);
    cosmos.addEventListener('wheel', function(e){ e.preventDefault(); zoomBy(e.deltaY<0?1.12:0.89); }, {passive:false});
    function zoomBy(f){ view.scale=Math.max(0.55,Math.min(2.4,view.scale*f)); applyView(); }
    document.getElementById('zin').addEventListener('click', function(){ zoomBy(1.18); });
    document.getElementById('zout').addEventListener('click', function(){ zoomBy(0.85); });
    document.getElementById('zhome').addEventListener('click', function(){ target={x:0,y:-30}; view.scale=1; applyView(); });
    Array.prototype.forEach.call(document.querySelectorAll('#pad button'), function(b){
      var d=b.dataset.dir, iv=null;
      function step(){ var s=26/view.scale; if(d==='up')view.y-=s; if(d==='down')view.y+=s; if(d==='left')view.x-=s; if(d==='right')view.x+=s; applyView(); }
      b.addEventListener('pointerdown', function(e){ e.preventDefault(); target=null; step(); iv=setInterval(step,60); });
      var off=function(){ if(iv){clearInterval(iv);iv=null;} };
      b.addEventListener('pointerup',off); b.addEventListener('pointerleave',off); b.addEventListener('pointercancel',off);
    });
    window.addEventListener('keydown', function(e){
      var tag=(e.target&&e.target.tagName)||''; if(tag==='INPUT'||tag==='TEXTAREA') return;
      if(e.key==='Escape') closePanel();
      var s=30/view.scale;
      if(e.key==='ArrowUp'||e.key==='w'){ target=null; view.y-=s; applyView(); }
      else if(e.key==='ArrowDown'||e.key==='s'){ target=null; view.y+=s; applyView(); }
      else if(e.key==='ArrowLeft'||e.key==='a'){ target=null; view.x-=s; applyView(); }
      else if(e.key==='ArrowRight'||e.key==='d'){ target=null; view.x+=s; applyView(); }
      else if(e.key==='+'||e.key==='='){ zoomBy(1.15); } else if(e.key==='-'){ zoomBy(0.87); }
    });

    /* ---------- panel ---------- */
    var panel=document.getElementById('panel'), scrim=document.getElementById('scrim'), panelOpen=false;
    function openPanel(id){
      var c=CONST.filter(function(x){return x.id===id;})[0]; if(!c) return;
      document.getElementById('p-k').textContent=t(c.kicker);
      document.getElementById('p-title').textContent=t(c.name);
      Array.prototype.forEach.call(panel.querySelectorAll('.leaf'), function(l){ l.classList.toggle('on', l.dataset.sec===c.sec); });
      document.getElementById('p-body').scrollTop=0;
      if(c.sec==='skills') animateBars();
      if(!reduce){ panel.classList.add('open'); scrim.classList.add('open'); }
      panelOpen=true;
    }
    function closePanel(){ if(reduce) return; panel.classList.remove('open'); scrim.classList.remove('open'); panelOpen=false;
      Array.prototype.forEach.call(sky.querySelectorAll('.cnode'), function(n){ n.classList.remove('active','lit'); }); }
    document.getElementById('p-close').addEventListener('click', closePanel);
    scrim.addEventListener('click', closePanel);

    /* ---------- easter eggs ---------- */
    var toastTimer=null;
    function toast(m){ var e=document.getElementById('toast'); if(!e) return; e.textContent=m; e.classList.add('show'); if(toastTimer)clearTimeout(toastTimer); toastTimer=setTimeout(function(){e.classList.remove('show');},2800); }

    // secret CJC
    var secretNext=0;
    function secretClick(i, st){
      if(i===secretNext){ st.classList.add('hit'); secretNext++;
        if(secretNext>=SECRET.pts.length){
          var sc=sky.querySelector('.cnode.secret'); sc.classList.add('lit');
          var l=document.getElementById('secret-lbl'); if(l) l.textContent='蔡杰超 · CJC';
          toast(CJC.lang()==='zh'?'✦ 你找到了隐藏星座 蔡杰超！愿代码常青 ✦':'✦ You traced the hidden 蔡杰超 · CJC — may your code compile forever ✦');
        }
      } else { // reset
        secretNext=0;
        var sc2=sky.querySelector('.cnode.secret');
        Array.prototype.forEach.call(sc2.querySelectorAll('.star'), function(x){ x.classList.remove('hit'); });
        if(i===0){ st.classList.add('hit'); secretNext=1; }
      }
    }

    // moon phases
    var phase=0;
    function cycleMoon(){
      phase=(phase+1)%5;
      var sh=document.getElementById('moon-shadow');
      var tx=['-100%','-60%','-20%','40%','100%'][phase];
      var names={en:['New','Waxing','Half','Gibbous','Full'],zh:['新月','娥眉月','上弦月','盈凸月','满月']};
      sh.style.transform='translateX('+tx+')';
      document.getElementById('moon-lbl').textContent=(CJC.lang()==='zh'?names.zh[phase]:names.en[phase]);
      toast((CJC.lang()==='zh'?'月相 · ':'Moon phase · ')+(CJC.lang()==='zh'?names.zh[phase]:names.en[phase]));
    }

    // shooting stars (clickable → wish) + comet on timer
    var WISHES=[{en:'You made a wish upon a falling star ✦ may it come true',zh:'你向流星许下心愿 ✦ 愿它成真'},
      {en:'A wish streaks across the night — noted by the cosmos',zh:'愿望划过夜空 —— 宇宙已收到'},
      {en:'Starlight caught! One wish granted (terms & conditions apply)',zh:'接住星光！愿望已受理（如有条款以宇宙为准）'}];
    function spawnShoot(comet){
      if(reduce) return;
      var el=document.createElement('div');
      el.className=comet?'comet':'shoot';
      el.innerHTML='<i></i><span class="head"></span>';
      var sx=Math.random()*vw*0.7, sy=Math.random()*vh*0.35;
      var ang=(20+Math.random()*30)*(Math.random()<0.5?1:-1);
      el.style.left=sx+'px'; el.style.top=sy+'px'; el.style.transform='rotate('+ang+'deg)';
      el.style.opacity='0';
      document.body.appendChild(el);
      var wished=false;
      el.addEventListener('click', function(ev){ ev.stopPropagation(); if(wished)return; wished=true;
        toast(comet?(CJC.lang()==='zh'?'☄ 你抓住了彗星！':'☄ You caught the comet!'):t(WISHES[Math.floor(Math.random()*WISHES.length)]));
        el.remove();
      });
      var start=null, dur=comet?2600:1400, dist=Math.max(vw,vh)*0.9;
      var rad=ang*Math.PI/180, dx=Math.cos(rad)*dist, dy=Math.sin(rad)*dist;
      function mv(ts){ if(!start)start=ts; var p=(ts-start)/dur; if(p>=1||!el.parentNode){ el.remove(); return; }
        el.style.opacity=(p<0.15?p/0.15:(p>0.8?(1-p)/0.2:1));
        el.style.left=(sx+dx*p)+'px'; el.style.top=(sy+dy*p)+'px';
        requestAnimationFrame(mv);
      }
      requestAnimationFrame(mv);
    }
    if(!reduce){
      setInterval(function(){ if(!panelOpen && Math.random()<0.55) spawnShoot(false); }, 4200);
      setInterval(function(){ if(!panelOpen) spawnShoot(true); }, 38000);
      setTimeout(function(){ spawnShoot(false); }, 3000);
    }

    /* ================= RENDER ================= */
    function setTxt(id,v){ var e=document.getElementById(id); if(e) e.textContent=v; }
    function setHTML(id,v){ var e=document.getElementById(id); if(e) e.innerHTML=v; }
    function animateBars(){ requestAnimationFrame(function(){ Array.prototype.forEach.call(document.querySelectorAll('#skills-list .track i'), function(i){ i.style.width=(i.dataset.w||0)+'%'; }); }); }

    function renderStatic(){
      document.title=(CJC.lang()==='zh'?'蔡杰超':'Cai Jiechao')+' — Constellation Atlas';
      setTxt('atlas-t', CJC.lang()==='zh'?'星座图鉴':'CONSTELLATION ATLAS');
      // update constellation labels
      Array.prototype.forEach.call(sky.querySelectorAll('.cnode[data-id]:not(.secret)'), function(n){
        var c=CONST.filter(function(x){return x.id===n.dataset.id;})[0]; if(!c) return;
        var nm=n.querySelector('[data-name]'), kk=n.querySelector('[data-kick]');
        if(nm) nm.textContent=t(c.name); if(kk) kk.textContent=t(c.kicker);
      });
      var ml=document.getElementById('moon-lbl');
      if(ml && phase===0) ml.textContent=(CJC.lang()==='zh'?'点击变换月相':'CLICK · PHASE');

      setTxt('hero-greet', t(P.greeting)); setTxt('hero-name', t(P.name)); setTxt('hero-role', t(P.role)); setTxt('hero-head', t(P.headline));
      setHTML('hero-meta', '<span>'+esc(t(P.title))+'</span><span>✦ <b>'+esc(t(P.location))+'</b></span>');
      var cv=document.getElementById('hero-cv'); cv.innerHTML='↓ '+esc(t(P.ui.download_cv)); cv.href=t(P.cv);
      var gh=document.getElementById('hero-gh'); gh.innerHTML='GitHub ↗'; gh.href=P.contact.github;

      var ai=document.getElementById('about-img'); ai.src=P.avatar; ai.alt=t(P.name);
      setHTML('about-text', P.bio.map(function(b){return '<p>'+esc(t(b))+'</p>';}).join(''));
      setHTML('about-loc', '✦ '+esc(t(P.location)));

      setHTML('edu-list', P.education.map(function(e){
        return '<div class="rowcard"><div class="when">'+esc(e.period)+'</div><h3>'+esc(t(e.school))+'</h3><div class="sub">'+esc(t(e.degree))+' — '+esc(t(e.note))+'</div></div>';
      }).join(''));
      setHTML('skill-tags', P.skillTags.map(function(s){return '<span class="chip">'+esc(s)+'</span>';}).join(''));
      setHTML('skills-list', P.skills.map(function(s,i){ var pct=72+((i*7)%26);
        return '<div class="sys"><div class="lab"><span class="n">'+esc(s)+'</span><span class="p">'+pct+'%</span></div><div class="track"><i data-w="'+pct+'"></i></div></div>';
      }).join(''));
      if(panelOpen) animateBars();
      setHTML('courses-list', P.courses.map(function(c){
        return '<div class="course"><div class="ci"><i class="fa '+esc(c.icon)+'"></i></div><h4>'+esc(t(c.title))+'</h4><p>'+esc(t(c.desc))+'</p></div>';
      }).join(''));
      setHTML('exp-list', P.experience.map(function(x){
        return '<div class="rowcard"><div class="when">'+esc(x.period)+'</div><h3>'+esc(t(x.role))+' · '+esc(t(x.company))+'</h3><div class="sub">'+esc(t(x.summary))+'</div><ul>'+x.bullets.map(function(b){return '<li>'+esc(t(b))+'</li>';}).join('')+'</ul></div>';
      }).join(''));
      setHTML('certs-list', P.certificates.map(function(c){
        return '<div class="acc"><img src="'+esc(c.image)+'" alt="'+esc(t(c.title))+'" onerror="this.src=\'/index_page/img/blogs/1.jpg\'"><div class="ac"><div class="m"><span>'+esc(t(c.tag))+'</span><span>'+esc(t(c.date))+'</span></div><h4>'+esc(t(c.title))+'</h4><p>'+esc(t(c.desc))+'</p></div></div>';
      }).join(''));
      setHTML('contact-info', [
        ['fa-envelope','Email',P.contact.email,'mailto:'+P.contact.email],
        ['fa-phone','Phone',P.contact.phone,P.contact.phoneHref],
        ['fa-github','GitHub','@'+P.contact.githubUser,P.contact.github],
        ['fa-wechat','WeChat','QR ↗',P.contact.wechatQrPage]
      ].map(function(r){ return '<a href="'+esc(r[3])+'"><span class="ci-key"><i class="fa '+r[0]+'"></i>'+esc(r[1])+'</span><span class="ci-val">'+esc(r[2])+'</span></a>'; }).join(''));
      setTxt('lb-name', t(P.ui.name_placeholder)); setTxt('lb-email', t(P.ui.email_placeholder)); setTxt('lb-msg', t(P.ui.msg_placeholder));
      document.getElementById('cf-name').placeholder=t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder=t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder=t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent=t(P.ui.send);
      setHTML('foot-social','<a href="'+P.contact.github+'" target="_blank" rel="noopener">GitHub</a><a href="mailto:'+P.contact.email+'">Email</a><a href="'+P.contact.wechatQrPage+'">WeChat</a><a href="/admin.html">'+esc(t(P.ui.admin_panel))+'</a>');
      setTxt('foot-desc', t(P.ui.footer_desc));
      var icp=document.getElementById('foot-icp'); icp.textContent=P.icp; icp.href=P.icpUrl;

      setHTML('filters', P.articleFilters.map(function(f){ return '<button data-k="'+esc(f.key)+'" class="'+(f.key===filterKey?'active':'')+'">'+esc(t(f.label))+'</button>'; }).join(''));
      Array.prototype.forEach.call(document.querySelectorAll('#filters button'), function(b){
        b.addEventListener('click', function(){ filterKey=b.dataset.k;
          Array.prototype.forEach.call(document.querySelectorAll('#filters button'), function(x){ x.classList.toggle('active', x.dataset.k===filterKey); });
          renderArticles();
        });
      });
    }

    function renderProjects(){
      var box=document.getElementById('projects-list');
      if(!projects.length){ box.innerHTML='<div class="load-note">'+esc(t(P.ui.no_projects))+'</div>'; return; }
      box.innerHTML=projects.map(function(p){
        return '<a class="card" href="'+esc(p.href)+'"><div class="thumb" style="display:grid;place-items:center;color:var(--accent);font-size:20px"><i class="fa fa-star-o"></i></div>'
          +'<div class="mid"><div class="r1"><span>'+esc(t(P.ui.tech_stack))+'</span><span class="tech">'+esc(p.tech_stack||'')+'</span></div><h4>'+esc(p.localTitle())+'</h4><p>'+esc(p.localSummary()||'')+'</p></div><span class="arr">→</span></a>';
      }).join('');
    }
    function renderArticles(){
      var box=document.getElementById('articles-list');
      var list=CJC.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML='<div class="load-note">'+esc(t(P.ui.no_articles))+'</div>'; return; }
      box.innerHTML=list.map(function(a){
        return '<a class="card" href="'+esc(a.href)+'"><img class="thumb" src="'+esc(a.cover_image||'')+'" onerror="this.src=\'/index_page/img/blogs/1.jpg\'" alt="'+esc(a.localTitle())+'">'
          +'<div class="mid"><div class="r1"><span>'+esc(a.category||'')+'</span><span>'+esc(a.dateText())+'</span></div><h4>'+esc(a.localTitle())+'</h4><p>'+esc(a.localSummary()||'')+'</p></div><span class="arr">→</span></a>';
      }).join('');
    }
    async function loadDynamic(){
      try{ projects=await CJC.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML='<div class="load-note">⚠ '+esc(t(P.ui.no_projects))+'</div>'; }
      try{ articles=await CJC.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-list').innerHTML='<div class="load-note">⚠ Failed to load.</div>'; }
    }

    document.getElementById('cf').addEventListener('submit', async function(e){
      e.preventDefault();
      var f=e.target, s=document.getElementById('cf-status');
      var payload={name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value};
      s.style.color='var(--muted)'; s.textContent=t(P.ui.sending);
      try{ var r=await CJC.sendContact(payload); s.style.color='var(--teal)'; s.textContent=r.message||'Sent.'; f.reset(); }
      catch(err){ s.style.color='#ff8a8a'; s.textContent=err.message; }
    });

    /* ---------- init ---------- */
    buildSky(); sizeStars();
    var rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(function(){ sizeStars(); applyView(); if(reduce) drawStars(); }, 180); });

    document.addEventListener('DOMContentLoaded', function(){
      CJC.setTheme(window.THEME_ID);
      renderStatic();
      CJC.mountSwitcher({ accent:'#8ab4ff' });
      CJC.onLang(function(){ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
      if(reduce){ drawStars(); animateBars(); }
      else { applyView(); drawStars(); requestAnimationFrame(frame);
        setTimeout(function(){ toast(CJC.lang()==='zh'?'拖动夜空 · 点亮星座探索':'Drag the sky · light a constellation to explore'); }, 900);
      }
    });
  })();
  </script>
</body>
</html>

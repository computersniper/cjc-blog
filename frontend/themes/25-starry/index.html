<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Starry Sky</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg0:#05061a; --bg1:#0b1e4d;
      --accent:#8ab4ff; --accent2:#b79bff; --teal:#57e0d6;
      --ink:#eef2ff; --muted:#a9b4d8; --dim:#7f8bb5;
      --glass:rgba(18,26,58,.52); --glass-strong:rgba(20,30,68,.72);
      --hair:rgba(138,180,255,.18); --edge:rgba(138,180,255,.30);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;color:var(--ink);
      font-family:'Sora','Inter',system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;line-height:1.5;
      background:
        radial-gradient(1200px 700px at 78% -8%, rgba(139,155,255,.10), transparent 60%),
        radial-gradient(900px 600px at 12% 12%, rgba(87,224,214,.07), transparent 60%),
        linear-gradient(180deg, var(--bg0) 0%, #071233 42%, var(--bg1) 100%);
      background-attachment:fixed;
      min-height:100vh;overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    ::selection{background:rgba(138,180,255,.35)}

    /* Cosmic backdrop layers */
    .bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    #sky{position:fixed;inset:0;z-index:0;pointer-events:none}
    .nebula{position:absolute;z-index:0;pointer-events:none;filter:blur(80px);opacity:.55;border-radius:50%}
    .nebula.n1{width:46vw;height:46vw;top:-8vw;right:-6vw;
      background:radial-gradient(circle,rgba(120,90,255,.55),transparent 68%);animation:drift1 34s ease-in-out infinite alternate}
    .nebula.n2{width:40vw;height:40vw;bottom:-10vw;left:-8vw;
      background:radial-gradient(circle,rgba(60,140,255,.45),transparent 68%);animation:drift2 40s ease-in-out infinite alternate}
    .nebula.n3{width:30vw;height:30vw;top:40%;left:55%;
      background:radial-gradient(circle,rgba(70,220,210,.28),transparent 70%);animation:drift1 46s ease-in-out infinite alternate}
    @keyframes drift1{from{transform:translate(0,0)}to{transform:translate(4vw,3vw)}}
    @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-3vw,-4vw)}}

    .wrap{position:relative;z-index:2}
    .container{max-width:1160px;margin:0 auto;padding:0 24px}

    /* Topbar */
    .topbar{position:sticky;top:0;z-index:50;
      background:linear-gradient(180deg,rgba(5,6,26,.82),rgba(5,6,26,.35));
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      border-bottom:1px solid var(--hair)}
    .topbar .inner{display:flex;align-items:center;justify-content:space-between;height:60px}
    .brand{font-weight:800;letter-spacing:.02em;font-size:19px;display:flex;align-items:center;gap:9px}
    .brand .dot{width:11px;height:11px;border-radius:50%;
      background:radial-gradient(circle at 35% 30%,#fff,var(--accent) 55%,#2a3f8f);
      box-shadow:0 0 14px var(--accent)}
    .brand b{color:var(--accent);font-weight:800}
    .navlinks{display:flex;gap:22px}
    .navlinks a{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.02em}
    .navlinks a:hover{color:var(--accent)}
    @media(min-width:861px){.topbar .inner{padding-right:220px}}
    @media(max-width:860px){.navlinks{display:none}}

    /* Section scaffolding */
    section{padding:74px 0;position:relative}
    .sec-head{display:flex;align-items:center;gap:14px;margin-bottom:34px}
    .sec-star{color:var(--accent);font-size:15px;filter:drop-shadow(0 0 6px var(--accent))}
    .sec-kicker{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);font-weight:600}
    .sec-title{font-size:clamp(26px,4vw,42px);font-weight:700;letter-spacing:-.01em;margin:0;
      background:linear-gradient(90deg,#fff,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}

    /* Glass card base */
    .glass{background:var(--glass);border:1px solid var(--hair);border-radius:18px;
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      box-shadow:0 18px 50px rgba(2,4,20,.5), inset 0 1px 0 rgba(255,255,255,.05)}

    /* Hero */
    .hero{padding:88px 0 40px;overflow-x:clip}
    .hero-grid{display:grid;grid-template-columns:1.35fr .9fr;gap:40px;align-items:center}
    @media(max-width:880px){.hero-grid{grid-template-columns:1fr;gap:28px}}
    .greet{display:inline-flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.06em;
      color:var(--accent);font-weight:600;padding:7px 14px;border:1px solid var(--edge);border-radius:999px;
      background:rgba(138,180,255,.08)}
    .greet::before{content:"✦"}
    .hero h1{font-size:clamp(44px,8vw,86px);line-height:1.02;letter-spacing:-.03em;margin:20px 0 0;font-weight:800;
      text-shadow:0 0 40px rgba(138,180,255,.25)}
    .hero .role{font-size:clamp(17px,2.4vw,24px);color:var(--accent);font-weight:600;margin-top:12px}
    .hero .head{font-size:clamp(16px,2vw,20px);color:var(--muted);margin-top:18px;max-width:30ch}
    .hero .meta{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:20px;font-size:14px;color:var(--dim)}
    .hero .meta b{color:var(--ink);font-weight:600}
    .btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
    .btn{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:14px;padding:13px 22px;border-radius:999px;
      border:1px solid transparent;transition:transform .15s,box-shadow .2s,background .2s;cursor:pointer;font-family:inherit}
    .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#08122e;
      box-shadow:0 10px 30px rgba(138,180,255,.35)}
    .btn.primary:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(138,180,255,.5)}
    .btn.ghost{background:rgba(138,180,255,.06);border-color:var(--edge);color:var(--ink)}
    .btn.ghost:hover{background:rgba(138,180,255,.14);transform:translateY(-2px)}

    /* Hero constellation portrait */
    .orb{position:relative;aspect-ratio:1;max-width:380px;margin:0 auto;width:100%}
    .orb .ring{position:absolute;inset:0;border-radius:50%;border:1px dashed var(--edge);
      animation:spin 60s linear infinite}
    .orb .ring.r2{inset:16%;border-style:solid;border-color:rgba(138,180,255,.12);animation-duration:90s;animation-direction:reverse}
    .orb .photo{position:absolute;inset:22%;border-radius:50%;overflow:hidden;border:1px solid var(--edge);
      box-shadow:0 0 60px rgba(138,180,255,.35), inset 0 0 30px rgba(5,6,26,.6)}
    .orb .photo img{width:100%;height:100%;object-fit:cover}
    .orb .sat{position:absolute;width:12px;height:12px;border-radius:50%;top:calc(50% - 6px);left:calc(50% - 6px);
      background:radial-gradient(circle at 35% 30%,#fff,var(--teal));box-shadow:0 0 12px var(--teal)}
    .orb .constellation{position:absolute;inset:-6%;pointer-events:none;opacity:.5}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* About */
    .about{display:grid;grid-template-columns:1fr;gap:20px}
    .about .card{padding:30px}
    .about p{color:var(--muted);font-size:16px;margin:0 0 14px;max-width:74ch}
    .about .loc{display:inline-flex;align-items:center;gap:8px;color:var(--accent);font-weight:600;font-size:14px;margin-top:6px}

    /* two-col rows */
    .rows{display:flex;flex-direction:column;gap:16px}
    .rowcard{display:grid;grid-template-columns:150px 1fr;gap:20px;padding:22px 24px}
    .rowcard .when{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.02em;white-space:nowrap}
    .rowcard h3{margin:0 0 6px;font-size:18px;font-weight:700}
    .rowcard .sub{color:var(--muted);font-size:14.5px}
    .rowcard ul{margin:12px 0 0;padding-left:18px;color:var(--muted);font-size:14px;line-height:1.7}
    .rowcard ul li::marker{color:var(--accent)}
    @media(max-width:640px){.rowcard{grid-template-columns:1fr;gap:8px}}

    /* Skills */
    .chips{display:flex;flex-wrap:wrap;gap:10px}
    .chip{padding:9px 16px;border-radius:999px;border:1px solid var(--hair);background:rgba(138,180,255,.06);
      font-size:14px;font-weight:500;color:var(--ink);transition:.18s}
    .chip:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 0 18px rgba(138,180,255,.25);transform:translateY(-2px)}
    .skill-lines{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
    .skill-lines .sl{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;
      background:rgba(138,180,255,.05);border:1px solid var(--hair);font-size:14.5px;color:var(--muted)}
    .skill-lines .sl i{color:var(--accent)}
    @media(max-width:640px){.skill-lines{grid-template-columns:1fr}}

    /* Courses */
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    @media(max-width:860px){.grid3{grid-template-columns:1fr 1fr}}
    @media(max-width:540px){.grid3{grid-template-columns:1fr}}
    .course{padding:24px}
    .course .ci{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:var(--accent);
      background:rgba(138,180,255,.1);border:1px solid var(--edge);margin-bottom:14px;box-shadow:0 0 20px rgba(138,180,255,.15)}
    .course h4{margin:0 0 8px;font-size:17px;font-weight:700}
    .course p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}

    /* Cards (projects/articles) */
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    @media(max-width:860px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:540px){.cards{grid-template-columns:1fr}}
    .card{display:flex;flex-direction:column;overflow:hidden;transition:transform .2s,box-shadow .25s,border-color .2s}
    .card:hover{transform:translateY(-6px);border-color:var(--edge);
      box-shadow:0 26px 60px rgba(2,4,20,.6),0 0 30px rgba(138,180,255,.25)}
    .card .cover{aspect-ratio:16/10;overflow:hidden;background:#0a1436;border-bottom:1px solid var(--hair)}
    .card .cover img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
    .card:hover .cover img{transform:scale(1.06)}
    .card .cbody{padding:18px;display:flex;flex-direction:column;gap:9px;flex:1}
    .card .ctag{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;letter-spacing:.04em;
      text-transform:uppercase;color:var(--accent)}
    .card h4{margin:0;font-size:16.5px;font-weight:700;line-height:1.3}
    .card p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.55;flex:1}
    .card .tech{color:var(--teal);font-weight:600;font-size:12.5px}
    .card .more{font-weight:600;font-size:12.5px;color:var(--accent)}

    .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
    .filters button{background:rgba(138,180,255,.05);border:1px solid var(--hair);color:var(--muted);font-family:inherit;
      font-weight:600;font-size:13px;padding:9px 16px;border-radius:999px;cursor:pointer;transition:.18s}
    .filters button.active,.filters button:hover{background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#08122e;border-color:transparent;box-shadow:0 6px 20px rgba(138,180,255,.35)}

    /* Certificates */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    @media(max-width:640px){.certs{grid-template-columns:1fr}}
    .cert{display:grid;grid-template-columns:130px 1fr;overflow:hidden}
    .cert img{height:100%;width:100%;object-fit:cover;border-right:1px solid var(--hair)}
    .cert .ct{padding:20px}
    .cert .ct .meta{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;font-weight:600;
      text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
    .cert .ct h4{margin:10px 0 7px;font-size:16px;font-weight:700}
    .cert .ct p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
    @media(max-width:400px){.cert{grid-template-columns:90px 1fr}}

    /* Contact */
    .contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:22px}
    @media(max-width:820px){.contact-grid{grid-template-columns:1fr}}
    .contact-info{padding:26px}
    .contact-info a{display:flex;justify-content:space-between;gap:12px;padding:15px 0;border-top:1px solid var(--hair);font-weight:500}
    .contact-info a:first-of-type{border-top:none}
    .contact-info a span:first-child{color:var(--dim)}
    .contact-info a span:last-child{color:var(--accent);font-weight:600}
    .contact-form{padding:26px}
    .contact-form label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0 0 6px;font-weight:600}
    .contact-form input,.contact-form textarea{width:100%;background:rgba(5,10,30,.55);border:1px solid var(--hair);
      border-radius:12px;font-family:inherit;font-size:15px;padding:13px 15px;margin-bottom:16px;color:var(--ink);transition:border .18s,box-shadow .18s}
    .contact-form input:focus,.contact-form textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(138,180,255,.18)}
    .contact-form textarea{min-height:130px;resize:vertical}
    #cf-status{margin:12px 0 0;font-weight:600;font-size:14px}

    footer{border-top:1px solid var(--hair);padding:44px 0 60px;margin-top:20px;
      background:linear-gradient(180deg,transparent,rgba(11,30,77,.4))}
    .foot-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:18px;align-items:center}
    .foot-social{display:flex;gap:18px;flex-wrap:wrap}
    .foot-social a{color:var(--muted);font-weight:500;font-size:14px}
    .foot-social a:hover{color:var(--accent)}
    .foot-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:20px}
    .muted{color:var(--dim);font-size:13px}
    .muted a{color:var(--dim)}.muted a:hover{color:var(--accent)}
    .load-note{color:var(--muted);font-size:14px;grid-column:1/-1;padding:20px;text-align:center;
      border:1px dashed var(--hair);border-radius:14px}

    :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

    @media (prefers-reduced-motion: reduce){
      *{animation:none !important;transition:none !important;scroll-behavior:auto !important}
    }
  </style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="bg" aria-hidden="true">
    <div class="nebula n1"></div>
    <div class="nebula n2"></div>
    <div class="nebula n3"></div>
  </div>

  <div class="wrap">
    <div class="topbar"><div class="container inner">
      <a class="brand" href="#top"><span class="dot"></span>Cai<b>Jiechao</b></a>
      <nav class="navlinks" id="nav"></nav>
    </div></div>

    <div id="top"></div>
    <header class="hero"><div class="container">
      <div class="hero-grid">
        <div>
          <div class="greet" id="greet"></div>
          <h1 id="name"></h1>
          <div class="role" id="role"></div>
          <div class="head" id="headline"></div>
          <div class="meta" id="meta"></div>
          <div class="btns">
            <a class="btn primary" id="cvBtn" href="#" download></a>
            <a class="btn ghost" id="ghBtn" target="_blank" rel="noopener"></a>
          </div>
        </div>
        <div class="orb">
          <svg class="constellation" viewBox="0 0 100 100" aria-hidden="true">
            <g stroke="#8ab4ff" stroke-width=".5" fill="#cfe0ff" opacity=".8">
              <line x1="12" y1="20" x2="30" y2="34"/><line x1="30" y1="34" x2="20" y2="58"/>
              <line x1="30" y1="34" x2="52" y2="26"/><line x1="80" y1="70" x2="66" y2="52"/>
              <line x1="66" y1="52" x2="84" y2="40"/>
              <circle cx="12" cy="20" r="1.4"/><circle cx="30" cy="34" r="1.6"/><circle cx="20" cy="58" r="1.2"/>
              <circle cx="52" cy="26" r="1.3"/><circle cx="80" cy="70" r="1.5"/><circle cx="66" cy="52" r="1.2"/>
              <circle cx="84" cy="40" r="1.3"/>
            </g>
          </svg>
          <div class="ring"></div><div class="ring r2"></div>
          <div class="photo"><img id="portrait" alt="" /></div>
          <div class="sat"></div>
        </div>
      </div>
    </div></header>

    <div class="container">

      <section id="about">
        <div class="sec-head"><span class="sec-star">✦</span><div><div class="sec-kicker" id="l-about-k"></div><h2 class="sec-title" id="l-about"></h2></div></div>
        <div class="about">
          <div class="glass card" id="about-text"></div>
        </div>
      </section>

      <section id="education">
        <div class="sec-head"><span class="sec-star">✦</span><div><div class="sec-kicker">Academic</div><h2 class="sec-title" id="l-edu"></h2></div></div>
        <div class="rows" id="edu-list"></div>
      </section>

      <section id="skills">
        <div class="sec-head"><span class="sec-star">✦</span><div><div class="sec-kicker">Constellation of Tools</div><h2 class="sec-title" id="l-skills"></h2></div></div>
        <div class="chips" id="skill-tags"></div>
        <div class="skill-lines" id="skills-list"></div>
      </section>

      <section id="courses">
        <div class="sec-head"><span class="sec-star">✦</span><div><div class="sec-kicker">Foundations</div><h2 class="sec-title" id="l-courses"></h2></div></div>
        <div class="grid3" id="courses-list"></div>
      </section>

      <section id="experience">
        <div class="sec-head"><span class="sec-star">✦</span><div><div class="sec-kicker">Mission Log</div><h2 class="sec-title" id="l-exp"></h2></div></div>
        <div class="rows" id="exp-list"></div>
      </section>

      <section id="projects">
        <div class="sec-head"><span class="sec-star">✦</span><div><div class="sec-kicker">Launched</div><h2 class="sec-title" id="l-projects"></h2></div></div>
        <div class="cards" id="projects-list"><div class="load-note" id="proj-load"></div></div>
      </section>

      <section id="articles">
        <div class="sec-head"><span class="sec-star">✦</span><div><div class="sec-kicker">Field Notes</div><h2 class="sec-title" id="l-articles"></h2></div></div>
        <div class="filters" id="filters"></div>
        <div class="cards" id="articles-list"><div class="load-note" id="art-load"></div></div>
      </section>

      <section id="certificates">
        <div class="sec-head"><span class="sec-star">✦</span><div><div class="sec-kicker">Milestones</div><h2 class="sec-title" id="l-certs"></h2></div></div>
        <div class="certs" id="certs-list"></div>
      </section>

      <section id="contact">
        <div class="sec-head"><span class="sec-star">✦</span><div><div class="sec-kicker">Signal</div><h2 class="sec-title" id="l-contact"></h2></div></div>
        <div class="contact-grid">
          <div class="glass contact-info" id="contact-info"></div>
          <div class="glass contact-form">
            <form id="cf">
              <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
              <label for="cf-name" id="lb-name"></label>
              <input type="text" name="name" id="cf-name" required>
              <label for="cf-email" id="lb-email"></label>
              <input type="email" name="email" id="cf-email" required>
              <label for="cf-msg" id="lb-msg"></label>
              <textarea name="message" id="cf-msg" required></textarea>
              <button type="submit" class="btn primary" id="cf-send"></button>
              <p id="cf-status" role="status" aria-live="polite"></p>
            </form>
          </div>
        </div>
      </section>

    </div>

    <footer><div class="container">
      <div class="foot-top">
        <a class="brand" href="#top"><span class="dot"></span>Cai<b>Jiechao</b></a>
        <div class="foot-social" id="foot-social"></div>
      </div>
      <div class="foot-bottom">
        <span class="muted" id="foot-desc"></span>
        <a class="muted" id="foot-icp" target="_blank" rel="noopener"></a>
      </div>
    </div></footer>
  </div>

  <script>window.THEME_ID = "25-starry";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";

    function renderStatic(){
      document.title = (CJCData.lang()==='zh' ? '蔡杰超' : 'Cai Jiechao') + ' — Starry Sky';
      document.getElementById('nav').innerHTML = [
        ['about','nav_about'],['courses','nav_courses'],['projects','nav_portfolio'],
        ['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');

      document.getElementById('greet').textContent = t(P.greeting);
      document.getElementById('name').textContent = t(P.name);
      document.getElementById('role').textContent = t(P.role);
      document.getElementById('headline').textContent = t(P.headline);
      document.getElementById('meta').innerHTML =

    function renderProjects(){

    function renderArticles(){
      const box = document.getElementById('articles-list');

      box.innerHTML = list.map(a=>`

          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${esc(a.localTitle())}"></div>

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML = `<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }

      catch(e){ document.getElementById('articles-list').innerHTML = `<div class="load-note">⚠ Failed to load articles.</div>`; }

    document.getElementById('cf').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      const payload = { name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color='var(--muted)'; s.textContent = t(P.ui.sending);
      try{ const r = await CJCData.sendContact(payload); s.style.color='var(--teal)'; s.textContent = r.message||'Sent.'; f.reset(); }
      catch(err){ s.style.color='#ff8a8a'; s.textContent = err.message; }
    });

    // Font Awesome for course icons

    fa.rel='stylesheet'; fa.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css';
    document.head.appendChild(fa);

    // ---- Starfield canvas (twinkle + shooting stars) ----
    (function starfield(){
      const canvas = document.getElementById('sky');
      const ctx = canvas.getContext('2d');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let W,H,stars=[],shooters=[],raf;
      function size(){
        W = canvas.width = Math.floor(window.innerWidth * devicePixelRatio);
        H = canvas.height = Math.floor(window.innerHeight * devicePixelRatio);
        canvas.style.width = window.innerWidth+'px'; canvas.style.height = window.innerHeight+'px';
        const count = Math.min(320, Math.floor((window.innerWidth*window.innerHeight)/6500));
        stars = [];
        for(let i=0;i<count;i++){
          stars.push({
            x:Math.random()*W, y:Math.random()*H,
            r:(Math.random()*1.3+0.3)*devicePixelRatio,
            a:Math.random()*0.6+0.3, tw:Math.random()*0.02+0.004, ph:Math.random()*Math.PI*2,
            hue: Math.random()<0.15 ? '175,225,255' : (Math.random()<0.2 ? '200,180,255':'255,255,255')
          });
        }
      }
      function drawStatic(){
        ctx.clearRect(0,0,W,H);
        for(const s of stars){
          ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
          ctx.fillStyle='rgba('+s.hue+','+s.a+')'; ctx.fill();
        }
      }
      function spawnShooter(){
        const startX = Math.random()*W*0.8, startY = Math.random()*H*0.4;
        shooters.push({x:startX,y:startY,vx:(6+Math.random()*4)*devicePixelRatio,vy:(3+Math.random()*2)*devicePixelRatio,life:0,max:60+Math.random()*30});
      }
      let last=0;
      function frame(ts){
        ctx.clearRect(0,0,W,H);
        for(const s of stars){
          s.ph += s.tw;
          const a = s.a * (0.55 + 0.45*Math.sin(s.ph));
          ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
          ctx.fillStyle='rgba('+s.hue+','+a.toFixed(3)+')'; ctx.fill();
        }
        for(let i=shooters.length-1;i>=0;i--){
          const sh=shooters[i]; sh.life++;
          sh.x+=sh.vx; sh.y+=sh.vy;
          const tailX=sh.x-sh.vx*8, tailY=sh.y-sh.vy*8;
          const g=ctx.createLinearGradient(tailX,tailY,sh.x,sh.y);
          g.addColorStop(0,'rgba(138,180,255,0)'); g.addColorStop(1,'rgba(200,220,255,0.9)');
          ctx.strokeStyle=g; ctx.lineWidth=2*devicePixelRatio; ctx.lineCap='round';
          ctx.beginPath(); ctx.moveTo(tailX,tailY); ctx.lineTo(sh.x,sh.y); ctx.stroke();
          if(sh.life>sh.max || sh.x>W || sh.y>H) shooters.splice(i,1);
        }
        if(ts-last > 2600 && Math.random()<0.5 && shooters.length<2){ spawnShooter(); last=ts; }
        raf=requestAnimationFrame(frame);
      }
      function start(){ size(); if(reduce){ drawStatic(); } else { cancelAnimationFrame(raf); raf=requestAnimationFrame(frame);} }
      let rt; window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(start,200); });
      start();
    })();

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:'#8ab4ff' });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>

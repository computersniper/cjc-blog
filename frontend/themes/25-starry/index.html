  <style>
    :root{--ink:#f4f1ea;--muted:#a5a8b8;--quiet:#666b7e;--paper:#10131e;--line:rgba(244,241,234,.16);--blue:#8ca7ff;--violet:#b39aff;--night:#070912;--max:1240px}

    .mast{display:flex;justify-content:space-between;align-items:center;padding:28px 210px 20px 0;border-bottom:1px solid var(--line);min-height:86px}.brand{font:700 13px/1 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase}.brand span{display:block;font:italic 35px/.65 'Instrument Serif',serif;letter-spacing:0;text-transform:none;color:var(--blue);margin-top:6px}.nav{display:flex;gap:25px}.nav a{font:500 10px/1 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:8px 0;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}.nav a:hover{color:var(--ink);border-color:var(--blue)}

-bottom:1px solid var(--line)}.telemetry div{padding:16px 20px;border-right:1px solid var(--line)}.telemetry div:last-child{border:0}.telemetry b{display:block;font:400 26px/1 'Instrument Serif',serif;color:var(--ink);margin-top:5px}

 button:hover,.filters button.active{background:var(--blue);border-color:var(--blue);color:#09101d}.cert-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.cert{display:grid;grid-template-columns:145px 1fr;border:1px solid var(--line)}.cert img{width:100%;height:100%;min-height:170px;object-fit:cover;filter:grayscale(.45)}.cert div{padding:20px}.cert small{font:500 10px/1 'DM Mono',monospace;color:var(--blue);letter-spacing:.1em}.cert h3{font-size:17px;line-height:1.25;margin:12px 0 7px}.cert p{font-size:13px;color:var(--muted);margin:0}

    :focus-visible{outline:2px solid var(--blue);outline-offset:4px}@media(max-width:900px){.mast{padding-right:165px}.nav{display:none}.hero{grid-template-columns:1fr}.hero-copy{padding:104px 0 64px}.hero-visual{border-left:0;border-top:1px solid var(--line);height:62vw;min-height:360px}.section-head,.ledger article{grid-template-columns:1fr;gap:13px}.section-head{margin-bottom:35px}.about,.constellation,.contact{grid-template-columns:1fr;gap:40px}.portrait{max-width:300px}.cards{grid-template-columns:repeat(2,1fr)}.course-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.wrap{width:min(100% - 32px,var(--max))}.mast{padding-right:133px;min-height:72px;padding-top:20px;padding-bottom:16px}.brand span{font-size:28px}.hero{min-height:auto}.hero h1{font-size:clamp(66px,21vw,110px);margin-top:25px}.hero-visual{height:112vw;min-height:0}.plate{inset:14px}.telemetry{grid-template-columns:1fr}.telemetry div{border-right:0;border-bottom:1px solid var(--line)}section{padding:82px 0}.course-grid,.cards,.cert-grid{grid-template-columns:1fr}.course{min-height:180px;padding:24px}.course h3{margin-top:34px}.cert{grid-template-columns:115px 1fr}.cert img{min-height:155px}.foot{display:block}.foot p{margin:0 0 11px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body>
  <a class="skip" href="#content">Skip to content</a>
  <canvas class="sky-map" id="skyMap" aria-hidden="true"></canvas>
  <div class="page">
    <header class="wrap mast">
      <a class="brand" href="#top" id="brand">CJC<span>Observatory</span></a>
      <nav class="nav" aria-label="Primary navigation" id="nav"></nav>
    </header>
    <main id="content">
      <section class="wrap hero" id="top">
        <div class="hero-copy">
          <p class="eyebrow" id="hero-kicker"></p>
          <h1 id="hero-name"></h1>
          <p class="role" id="hero-role"></p>
          <p class="title" id="hero-title"></p>
          <div class="actions"><a class="action primary" id="cv" href=""><i class="fa fa-arrow-down"></i><span id="cv-label"></span></a><a class="action" id="github" href="" target="_blank" rel="noopener"><i class="fa fa-github"></i>GitHub</a></div>
        </div>
        <figure class="hero-visual"><img fetchpriority="high" src="/themes/25-starry/assets/starfield.jpg" alt="Long-exposure photograph of a star-filled night sky" onerror="this.src='/index_page/img/hero.png'"><figcaption class="plate"><div id="plate-left"></div><div><b id="plate-right"></b></div></figcaption></figure>
      </section>
      <div class="wrap telemetry" aria-label="Profile coordinates"><div><span class="micro" id="telemetry-a"></span><b>23°08′ N</b></div><div><span class="micro" id="telemetry-b"></span><b>113°16′ E</b></div><div><span class="micro" id="telemetry-c"></span><b>GMT +08</b></div></div>
      <section class="wrap" id="about"><div class="section-head"><span class="micro" id="about-k"></span><div><h2 id="about-h"></h2></div></div><div class="about"><figure class="portrait"><img id="portrait" alt=""></figure><div class="about-copy" id="about-copy"></div></div></section>
      <section class="wrap" id="education"><div class="section-head"><span class="micro" id="education-k"></span><div><h2 id="education-h"></h2></div></div><div class="ledger" id="education-list"></div></section>
      <section class="wrap" id="skills"><div class="section-head"><span class="micro" id="skills-k"></span><div><h2 id="skills-h"></h2><p id="skills-sub"></p></div></div><div class="constellation"><div class="tags" id="tags"></div><div class="skill-lines" id="skill-lines"></div></div></section>
      <section class="wrap" id="courses"><div class="section-head"><span class="micro" id="courses-k"></span><div><h2 id="courses-h"></h2></div></div><div class="course-grid" id="courses-list"></div></section>
      <section class="wrap" id="experience"><div class="section-head"><span class="micro" id="experience-k"></span><div><h2 id="experience-h"></h2></div></div><div class="ledger" id="experience-list"></div></section>
      <section class="wrap" id="projects"><div class="section-head"><span class="micro" id="projects-k"></span><div><h2 id="projects-h"></h2><p id="projects-sub"></p></div></div><div class="cards" id="projects-list" aria-live="polite"></div></section>
      <section class="wrap" id="articles"><div class="section-head"><span class="micro" id="articles-k"></span><div><h2 id="articles-h"></h2><p id="articles-sub"></p></div></div><div class="filters" id="filters" aria-label="Article filters"></div><div class="cards" id="articles-list" aria-live="polite"></div></section>
      <section class="wrap" id="certificates"><div class="section-head"><span class="micro" id="certs-k"></span><div><h2 id="certs-h"></h2></div></div><div class="cert-grid" id="certs-list"></div></section>
      <section class="wrap" id="contact"><div class="contact"><div class="contact-intro"><span class="micro" id="contact-k"></span><h2 id="contact-h"></h2><div class="contact-links" id="contact-links"></div></div><form class="contact-form" id="contact-form"><label><span id="name-label"></span><input required name="name" autocomplete="name"></label><label><span id="email-label"></span><input required name="email" type="email" autocomplete="email"></label><label><span id="message-label"></span><textarea required name="message"></textarea></label><input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="display:none"><button class="action send" type="submit" id="send"></button><p class="form-status" id="form-status" aria-live="polite"></p></form></div></section>
    </main>
    <footer class="wrap foot"><p id="footer-desc"></p><p><a id="icp" href="" target="_blank" rel="noopener"></a> · <a href="/admin.html" id="admin-link"></a></p></footer>
  </div>
  <script>window.THEME_ID="25-starry";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    'use strict';
    var D=window.CJCData,P=D.profile,projects=[],articles=[],filterKey='all';
    var COPY={obs:{en:'Private observatory · 23°08′ N',zh:'私人观测站 · 北纬 23°08′'},plate:{en:'A field guide to building useful systems.',zh:'一份关于构建有用系统的观测手册。'},signal:{en:'signal archive',zh:'信号存档'},coord:{en:'coordinates',zh:'坐标'},time:{en:'local time',zh:'本地时间'},about:{en:'01 / Profile',zh:'01 / 档案'},edu:{en:'02 / Trajectory',zh:'02 / 轨迹'},skills:{en:'03 / Constellation',zh:'03 / 星群'},courses:{en:'04 / Study',zh:'04 / 学习'},exp:{en:'05 / Flight log',zh:'05 / 飞行日志'},projects:{en:'06 / Outputs',zh:'06 / 作品'},articles:{en:'07 / Dispatches',zh:'07 / 文稿'},certs:{en:'08 / Proof',zh:'08 / 认证'},contact:{en:'09 / Transmission',zh:'09 / 联络'},aboutSub:{en:'A human point of reference inside a system-minded practice.',zh:'在系统化实践中，保留一个人的坐标点。'},projectSub:{en:'Selected systems, interfaces and experiments from the live archive.',zh:'从实时档案中选出的系统、界面与实验。'},articleSub:{en:'Notes received from the work in progress.',zh:'来自进行中工作的随笔。'},contactTitle:{en:'Start a transmission.',zh:'发起一段通信。'},sent:{en:'Transmission sent.',zh:'信息已发送。'},failed:{en:'Transmission failed. Please try again.',zh:'发送失败，请重试。'},sending:{en:'Sending…',zh:'发送中…'}};
    function t(v){return D.t(v)} function c(k){return t(COPY[k])} function e(v){return D.escapeHtml(v==null?'':v)}
    function set(id,v,html){var el=document.getElementById(id);if(el)html?el.innerHTML=v:el.textContent=v}
    function cards(kind){return kind==='project'?projects:articles}
    function renderStatic(){
      document.title=t(P.name)+' — Observatory'; set('brand',e(P.brand)+'<span>Observatory</span>',true);
      document.getElementById('nav').innerHTML=[['about',P.ui.about_me],['projects',P.ui.latest_projects],['articles',P.ui.latest_articles],['contact',P.ui.get_in_touch]].map(function(x){return '<a href="#'+x[0]+'">'+e(t(x[1]))+'</a>'}).join('');
      set('hero-kicker',c('obs'));set('hero-name',e(t(P.name)));set('hero-role',t(P.role));set('hero-title',t(P.title));set('cv-label',t(P.ui.download_cv));document.getElementById('cv').href=t(P.cv);document.getElementById('github').href=P.contact.github;set('plate-left',c('plate'));set('plate-right',t(P.headline));
      set('telemetry-a',c('coord'));set('telemetry-b',t(P.location));set('telemetry-c',c('time'));
      [['about','about-k','about-h',P.ui.about_me],['edu','education-k','education-h',P.ui.education_bg],['skills','skills-k','skills-h',P.ui.core_tech],['courses','courses-k','courses-h',P.ui.core_courses],['exp','experience-k','experience-h',P.ui.internship_exp],['projects','projects-k','projects-h',P.ui.latest_projects],['articles','articles-k','articles-h',P.ui.latest_articles],['certs','certs-k','certs-h',P.ui.certificates]].forEach(function(x){set(x[1],c(x[0]));set(x[2],t(x[3]))});
      set('skills-sub',c('aboutSub'));set('projects-sub',c('projectSub'));set('articles-sub',c('articleSub'));set('contact-k',c('contact'));set('contact-h',c('contactTitle'));
      var portrait=document.getElementById('portrait');portrait.src=P.avatar;portrait.alt=t(P.name);
      document.getElementById('about-copy').innerHTML=P.bio.map(function(b){return '<p>'+e(t(b))+'</p>'}).join('')+'<span class="location">'+e(t(P.location))+'</span>';
      document.getElementById('education-list').innerHTML=P.education.map(function(x){return '<article><time>'+e(x.period)+'</time><div><h3>'+e(t(x.school))+'</h3><p>'+e(t(x.degree))+' · '+e(t(x.note))+'</p></div></article>'}).join('');
      document.getElementById('tags').innerHTML=P.skillTags.map(function(x){return '<span>'+e(x)+'</span>'}).join('');
      document.getElementById('skill-lines').innerHTML=P.skills.map(function(x){return '<div>'+e(x)+'</div>'}).join('');
      document.getElementById('courses-list').innerHTML=P.courses.map(function(x){return '<article class="course"><i class="fa '+e(x.icon)+'" aria-hidden="true"></i><h3>'+e(t(x.title))+'</h3><p>'+e(t(x.desc))+'</p></article>'}).join('');
      document.getElementById('experience-list').innerHTML=P.experience.map(function(x){return '<article><time>'+e(x.period)+'</time><div><h3>'+e(t(x.role))+' · '+e(t(x.company))+'</h3><p>'+e(t(x.summary))+'</p><ul>'+x.bullets.map(function(b){return '<li>'+e(t(b))+'</li>'}).join('')+'</ul></div></article>'}).join('');
      document.getElementById('certs-list').innerHTML=P.certificates.map(function(x){return '<article class="cert"><img loading="lazy" src="'+e(x.image)+'" alt="'+e(t(x.title))+'" onerror="this.src=\'/index_page/img/blogs/1.jpg\'"><div><small>'+e(t(x.tag))+' · '+e(t(x.date))+'</small><h3>'+e(t(x.title))+'</h3><p>'+e(t(x.desc))+'</p></div></article>'}).join('');
      document.getElementById('contact-links').innerHTML=[['Email',P.contact.email,'mailto:'+P.contact.email],['Phone',P.contact.phone,P.contact.phoneHref],['GitHub','@'+P.contact.githubUser,P.contact.github],['WeChat','QR',P.contact.wechatQrPage]].map(function(x){return '<a href="'+e(x[2])+'"><span>'+e(x[0])+'</span><span>'+e(x[1])+'</span></a>'}).join('');
      set('name-label',t(P.ui.name_placeholder));set('email-label',t(P.ui.email_placeholder));set('message-label',t(P.ui.msg_placeholder));set('send',t(P.ui.send));set('footer-desc',t(P.ui.footer_desc));var icp=document.getElementById('icp');icp.textContent=P.icp;icp.href=P.icpUrl;set('admin-link',t(P.ui.admin_panel));
      document.getElementById('filters').innerHTML=P.articleFilters.map(function(x){return '<button type="button" class="'+(filterKey===x.key?'active':'')+'" data-filter="'+e(x.key)+'">'+e(t(x.label))+'</button>'}).join('');
      Array.prototype.forEach.call(document.querySelectorAll('[data-filter]'),function(btn){btn.addEventListener('click',function(){filterKey=this.getAttribute('data-filter');renderStatic();renderArticles()})});
    }
    function renderProjects(){var box=document.getElementById('projects-list');if(!projects.length){box.innerHTML='<p class="load-note">'+e(t(P.ui.no_projects))+'</p>';return}box.innerHTML=projects.map(function(x){var cover=x.cover_image?'<figure><img loading="lazy" src="'+e(x.cover_image)+'" alt="'+e(x.localTitle())+'" onerror="this.src=\'/index_page/img/blogs/1.jpg\'"></figure>':'';return '<a class="card" href="'+e(x.href)+'">'+cover+'<div class="card-body"><div class="card-meta"><span>'+e(t(P.ui.tech_stack))+'</span><span>'+e(x.dateText())+'</span></div><h3>'+e(x.localTitle())+'</h3><p>'+e(x.tech_stack||'')+'</p><p>'+e(x.localSummary()||'')+'</p><span class="link">'+e(t(P.ui.view_project))+' <i class="fa fa-long-arrow-right"></i></span></div></a>'}).join('')}
    function renderArticles(){var box=document.getElementById('articles-list'),list=D.filterArticles(articles,filterKey);if(!list.length){box.innerHTML='<p class="load-note">'+e(t(P.ui.no_articles))+'</p>';return}box.innerHTML=list.map(function(x){return '<a class="card" href="'+e(x.href)+'"><figure><img loading="lazy" src="'+e(x.cover_image||'/index_page/img/blogs/1.jpg')+'" alt="'+e(x.localTitle())+'" onerror="this.src=\'/index_page/img/blogs/1.jpg\'"></figure><div class="card-body"><div class="card-meta"><span>'+e(x.category||'')+'</span><span>'+e(x.dateText())+'</span></div><h3>'+e(x.localTitle())+'</h3><p>'+e(x.localSummary()||'')+'</p><span class="link">'+e(t(P.ui.read_more))+' <i class="fa fa-long-arrow-right"></i></span></div></a>'}).join('')}
    function bindForm(){document.getElementById('contact-form').addEventListener('submit',async function(ev){ev.preventDefault();var f=ev.currentTarget,b=document.getElementById('send'),s=document.getElementById('form-status');b.disabled=true;s.textContent=c('sending');try{var r=await D.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});s.textContent=r.message||c('sent');f.reset()}catch(err){s.textContent=err.message||c('failed')}finally{b.disabled=false}})}
    function sky(){var cv=document.getElementById('skyMap'),ctx=cv.getContext('2d'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,nodes=[],dpr=Math.min(devicePixelRatio||1,2),w=0,h=0;function fit(){w=cv.width=innerWidth*dpr;h=cv.height=innerHeight*dpr;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';nodes=Array.from({length:Math.max(22,Math.floor(innerWidth/58))},function(_,i){return{x:(Math.sin(i*1.71)*.46+.5)*w,y:(Math.cos(i*2.39)*.38+.52)*h,r:(i%3+1)*dpr}})}function draw(ms){ctx.clearRect(0,0,w,h);ctx.strokeStyle='rgba(140,167,255,.12)';ctx.lineWidth=dpr;for(var q=0;q<5;q++){ctx.beginPath();for(var x=0;x<=w;x+=14*dpr){var y=h*(.17+q*.18)+Math.sin(x/(105*dpr)+q+ms/4200)*22*dpr;ctx.lineTo(x,y)}ctx.stroke()}ctx.strokeStyle='rgba(179,154,255,.14)';for(var j=0;j<nodes.length-1;j+=3){var a=nodes[j],b=nodes[(j+3)%nodes.length];ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}nodes.forEach(function(n){ctx.fillStyle='rgba(244,241,234,.46)';ctx.fillRect(n.x,n.y,n.r,n.r)});if(!reduced)requestAnimationFrame(draw)}fit();draw(0);addEventListener('resize',fit,{passive:true})}
    document.addEventListener('DOMContentLoaded',function(){D.setTheme(window.THEME_ID);renderStatic();D.mountSwitcher({accent:'#657fd4'});D.onLang(function(){renderStatic();renderProjects();renderArticles()});bindForm();sky();Promise.all([D.fetchProjects(),D.fetchArticles()]).then(function(r){projects=r[0];articles=r[1];renderProjects();renderArticles()}).catch(function(){renderProjects();renderArticles()})});
  })();
  </script>
</body>

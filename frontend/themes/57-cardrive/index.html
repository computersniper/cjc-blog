<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Road Trip Cockpit</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{
      --org:#ff7a00; --org2:#ffab4a; --ink:#eaf1f6; --mut:#9db0bd; --sky1:#2b3a67; --sky2:#7f6aa8;
      --glass:rgba(12,18,26,.62); --line:rgba(255,255,255,.12); --dash:#0a0e12; --cyan:#39d0e6;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;color:var(--ink);font-family:'Rajdhani',system-ui,sans-serif;line-height:1.5;overflow-x:hidden;
      background:#0a0e12}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    h1,h2,h3{font-weight:700;letter-spacing:.01em;margin:0}
    .mono{font-variant-numeric:tabular-nums}

    /* ===== SCENE through the windshield (fixed) ===== */
    .scene{position:fixed;inset:0;z-index:0;overflow:hidden;
      background:linear-gradient(180deg,#1b2547 0%,#3a4c86 30%,#8f6fae 50%,#e19a5c 58%,#caa06a 60%)}
    .sun{position:absolute;top:14%;left:50%;transform:translateX(-50%);width:130px;height:130px;border-radius:50%;
      background:radial-gradient(circle,#fff2c8,#ffcf7a 55%,transparent 72%);filter:blur(2px);opacity:.9}
    .clouds{position:absolute;top:8%;left:0;right:0;height:38%}
    .cloud{position:absolute;background:rgba(255,255,255,.28);border-radius:50%;filter:blur(6px);
      animation:drift 42s linear infinite}
    .cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
    @keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(120vw)}}
    /* ground/road */
    .ground{position:absolute;bottom:0;left:0;right:0;height:42%;background:linear-gradient(180deg,#6f5a3f,#2c2419);perspective:340px;overflow:hidden}
    .road{position:absolute;bottom:0;left:50%;transform:translateX(-50%) rotateX(64deg);transform-origin:bottom center;
      width:220%;height:180%;
      background:linear-gradient(180deg,#3a3f46,#22262b);
      background-image:
        linear-gradient(90deg,transparent 47.6%,#f4c033 47.6%,#f4c033 52.4%,transparent 52.4%),
        linear-gradient(180deg,#3a3f46,#22262b);
      background-size:100% 60px,100% 100%;
      animation:rush 1.1s linear infinite}
    @keyframes rush{from{background-position-y:0px,0}to{background-position-y:60px,0}}
    /* hills */
    .hill{position:absolute;bottom:40%;width:340px;height:180px;border-radius:50% 50% 0 0;
      background:linear-gradient(180deg,#5c7a53,#38502f);opacity:.9;animation:sidefly 6s linear infinite}
    .hill.l{left:-8%}.hill.r{right:-8%;animation-delay:3s}
    @keyframes sidefly{0%{transform:translateY(0) scale(.6);opacity:.3}100%{transform:translateY(120px) scale(1.4);opacity:0}}
    .tree{position:absolute;bottom:40%;width:0;height:0;animation:sidefly 3.4s linear infinite}
    .tree i{display:block;width:14px;height:40px;background:#2f4023;margin:0 auto;border-radius:6px}
    .tree em{display:block;width:44px;height:44px;background:#3f6b30;border-radius:50%;margin:-14px auto 0}
    .tree.l{left:8%}.tree.r{right:8%;animation-delay:1.7s}
    /* windshield vignette + A-pillars */
    .glass-vig{position:absolute;inset:0;box-shadow:inset 0 0 120px 40px rgba(0,0,0,.45);
      background:radial-gradient(120% 90% at 50% 30%,transparent 60%,rgba(0,0,0,.35))}

    /* ===== content ===== */
    .content{position:relative;z-index:2;padding-bottom:150px}
    .wrap{max-width:1080px;margin:0 auto;padding:0 20px}

    .topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(6,10,14,.9),rgba(6,10,14,.4));
      backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
    .topbar .row{display:flex;align-items:center;justify-content:space-between;height:56px}
    .brand{font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
    .brand b{color:var(--org)}
    .nav{display:flex;gap:16px}
    .nav a{font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
    .nav a:hover{color:var(--org)}
    @media(max-width:860px){.nav{display:none}}

    section{padding:52px 0}
    .panel{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;
      padding:26px;box-shadow:0 20px 40px rgba(0,0,0,.4)}
    .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
    .sec-head .hud-dot{width:10px;height:10px;border-radius:50%;background:var(--org);box-shadow:0 0 12px var(--org)}
    .sec-head h2{font-size:clamp(22px,4vw,36px);text-transform:uppercase;letter-spacing:.02em}
    .sec-head .unit{margin-left:auto;font-size:12px;color:var(--mut);letter-spacing:.16em;text-transform:uppercase}

    /* hero */
    .hero{padding:60px 0 30px;text-align:center}
    .hud-frame{border:1px solid var(--org);border-radius:16px;padding:34px 26px;background:rgba(8,12,16,.5);
      backdrop-filter:blur(6px);box-shadow:0 0 40px rgba(255,122,0,.2),inset 0 0 40px rgba(255,122,0,.06)}
    .greet{color:var(--org);letter-spacing:.28em;text-transform:uppercase;font-size:13px;font-weight:600}
    .hero h1{font-size:clamp(46px,11vw,110px);line-height:.92;margin:8px 0 6px;text-transform:uppercase;
      text-shadow:0 0 30px rgba(255,122,0,.35)}
    .hero .role{color:var(--cyan);font-size:clamp(18px,2.6vw,26px);text-transform:uppercase;letter-spacing:.06em}
    .hero .tag{color:var(--mut);max-width:48ch;margin:12px auto 22px;font-size:17px}
    .btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
    .btn{display:inline-flex;align-items:center;gap:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
      font-size:14px;padding:12px 22px;border-radius:10px;cursor:pointer;transition:.16s;border:2px solid transparent}
    .btn.pri{background:var(--org);color:#141414}
    .btn.pri:hover{background:var(--org2);transform:translateY(-2px)}
    .btn.gho{border-color:var(--line);color:var(--ink);background:rgba(255,255,255,.05)}
    .btn.gho:hover{border-color:var(--org);color:var(--org)}

    /* readout tiles hero */
    .readouts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
    @media(max-width:640px){.readouts{grid-template-columns:1fr 1fr}}
    .ro{border:1px solid var(--line);border-radius:10px;padding:12px;background:rgba(8,12,16,.5)}
    .ro .k{font-size:11px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
    .ro .v{font-size:22px;font-weight:700;color:var(--org)}

    /* about */
    .about{display:grid;grid-template-columns:260px 1fr;gap:26px;align-items:start}
    @media(max-width:760px){.about{grid-template-columns:1fr}}
    .about img{width:100%;border-radius:12px;border:1px solid var(--line);aspect-ratio:1;object-fit:cover}
    .about p{color:#cfdae2;margin:0 0 12px;font-size:16.5px;max-width:60ch}
    .loc{display:inline-flex;gap:8px;align-items:center;color:var(--org);border:1px solid var(--org);border-radius:8px;
      padding:7px 13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:13px}

    /* rows */
    .rows{display:flex;flex-direction:column;gap:14px}
    .rowi{border-left:3px solid var(--org);padding:6px 0 6px 16px}
    .rowi .p{color:var(--org);font-weight:700;letter-spacing:.04em}
    .rowi h3{font-size:19px;margin:2px 0 3px}
    .rowi .s{color:var(--mut);font-size:15px}
    .rowi ul{margin:8px 0 0;padding-left:18px;color:#cfdae2;font-size:15px;line-height:1.7}

    /* skills gauges as bars */
    .skills{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media(max-width:640px){.skills{grid-template-columns:1fr}}
    .sk{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:rgba(8,12,16,.4)}
    .sk .top{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
    .sk .v{font-size:15px;font-weight:600;margin-top:2px}
    .sk .bar{height:6px;border-radius:3px;background:#1c2530;margin-top:8px;overflow:hidden}
    .sk .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--org),var(--org2))}
    .tags{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
    .tags span{font-size:13px;font-weight:600;padding:6px 13px;border-radius:8px;background:rgba(255,122,0,.14);
      border:1px solid rgba(255,122,0,.4);color:var(--org2);text-transform:uppercase;letter-spacing:.04em}

    /* courses */
    .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    @media(max-width:820px){.courses{grid-template-columns:1fr 1fr}}
    @media(max-width:500px){.courses{grid-template-columns:1fr}}
    .course{border:1px solid var(--line);border-radius:12px;padding:18px;background:rgba(8,12,16,.4);transition:.16s}
    .course:hover{border-color:var(--org);transform:translateY(-3px)}
    .course i.fa{color:var(--org);font-size:22px}
    .course h4{margin:12px 0 8px;font-size:16px;text-transform:uppercase;letter-spacing:.02em}
    .course p{margin:0;color:var(--mut);font-size:14.5px}

    /* cards */
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    @media(max-width:860px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.cards{grid-template-columns:1fr}}
    .card{border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;
      background:rgba(8,12,16,.55);transition:.16s}
    .card:hover{transform:translateY(-4px);border-color:var(--org)}
    .card .cover{height:150px;overflow:hidden;background:#0e141a}
    .card .cover img{width:100%;height:100%;object-fit:cover;transition:.4s}
    .card:hover .cover img{transform:scale(1.07)}
    .cbody{padding:15px;display:flex;flex-direction:column;gap:8px;flex:1}
    .ctag{display:flex;justify-content:space-between;font-size:11px;color:var(--org);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
    .card h4{font-size:16px;line-height:1.3}
    .card p{margin:0;color:var(--mut);font-size:14px;flex:1}
    .tech{color:var(--cyan);font-size:13px;font-weight:600}
    .more{color:var(--org2);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em}

    .filters{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}
    .filters button{font-family:inherit;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:12px;
      background:rgba(8,12,16,.5);border:1px solid var(--line);color:var(--mut);padding:8px 14px;border-radius:8px;cursor:pointer;transition:.15s}
    .filters button.active,.filters button:hover{background:var(--org);border-color:var(--org);color:#141414}

    /* certs */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:640px){.certs{grid-template-columns:1fr}}
    .cert{display:grid;grid-template-columns:118px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(8,12,16,.5)}
    .cert img{width:100%;height:100%;object-fit:cover;min-height:130px}
    .cert .ct{padding:14px}
    .cert .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--org);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
    .cert h4{margin:8px 0 6px;font-size:16px}
    .cert p{margin:0;color:var(--mut);font-size:13.5px}
    @media(max-width:400px){.cert{grid-template-columns:86px 1fr}}

    /* contact */
    .contact{display:grid;grid-template-columns:1fr 1.2fr;gap:24px}
    @media(max-width:800px){.contact{grid-template-columns:1fr}}
    .cinfo a{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-weight:600}
    .cinfo a span:first-child{color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-size:13px}
    .cinfo a span:last-child{color:var(--org)}
    form input,form textarea{width:100%;background:rgba(6,10,14,.7);border:1px solid var(--line);border-radius:10px;
      color:var(--ink);font-family:inherit;font-size:15px;padding:13px;margin-bottom:12px}
    form input:focus,form textarea:focus{outline:none;border-color:var(--org)}
    form textarea{min-height:120px;resize:vertical}
    #cf-status{font-weight:600;margin-top:4px;font-size:14px}

    footer{padding:30px 0 18px;text-align:center}
    .fsoc{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
    .fsoc a{color:var(--mut);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
    .fsoc a:hover{color:var(--org)}
    .muted{color:#7f909c;font-size:13px;margin-top:10px}
    .load-note{grid-column:1/-1;color:var(--mut);text-align:center;padding:18px;border:1px dashed var(--line);border-radius:10px}

    /* ===== DASHBOARD (fixed bottom) ===== */
    .dashbar{position:fixed;left:0;right:0;bottom:0;z-index:30;height:118px;
      background:linear-gradient(180deg,#161b21,#05080b);border-top:2px solid #2a333c;
      box-shadow:0 -12px 30px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;gap:18px;padding:0 16px}
    .gauge{position:relative;width:100px;height:100px;flex-shrink:0}
    .gauge .lbl{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
    .gauge .val{position:absolute;top:44px;left:0;right:0;text-align:center;font-size:19px;font-weight:700;color:var(--org)}
    .wheel{width:104px;height:104px;flex-shrink:0}
    .minis{display:flex;flex-direction:column;gap:8px;width:150px}
    .mini .top{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
    .mini .bar{height:8px;border-radius:4px;background:#1c2530;overflow:hidden;margin-top:3px}
    .mini .bar i{display:block;height:100%}
    .mini.fuel .bar i{background:linear-gradient(90deg,#f4c033,#ff7a00);width:68%}
    .mini.temp .bar i{background:linear-gradient(90deg,#39d0e6,#ff5a5a);width:52%}
    @media(max-width:720px){.minis{display:none}.gauge{width:78px;height:78px}.gauge .val{top:32px;font-size:15px}.wheel{width:84px;height:84px}.dashbar{height:96px;gap:12px}.content{padding-bottom:120px}}
    @media(max-width:420px){.gauge:nth-child(3){display:none}}

    @media(prefers-reduced-motion:reduce){
      .road,.cloud,.hill,.tree{animation:none!important}
      .wheel .spin{animation:none!important}
      *{scroll-behavior:auto}
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="sun"></div>
    <div class="clouds">
      <div class="cloud" style="top:20%;width:120px;height:34px;animation-delay:0s"></div>
      <div class="cloud" style="top:46%;width:90px;height:26px;animation-delay:-16s"></div>
      <div class="cloud" style="top:12%;width:150px;height:40px;animation-delay:-30s"></div>
    </div>
    <div class="ground">
      <div class="hill l"></div><div class="hill r"></div>
      <div class="tree l"><em></em><i></i></div><div class="tree r"><em></em><i></i></div>
      <div class="road"></div>
    </div>
    <div class="glass-vig"></div>
  </div>

  <div class="content">
    <div class="topbar"><div class="wrap row">
      <a class="brand" href="#top">Cai<b>Jiechao</b></a>
      <nav class="nav" id="nav"></nav>
    </div></div>

    <div id="top"></div>
    <header class="hero"><div class="wrap">
      <div class="hud-frame">
        <div class="greet" id="greet"></div>
        <h1 id="name"></h1>
        <div class="role" id="role"></div>
        <p class="tag" id="tag"></p>
        <div class="btns">
          <a class="btn pri" id="cvBtn" download><i class="fa fa-download"></i><span></span></a>
          <a class="btn gho" id="ghBtn" target="_blank" rel="noopener"><i class="fa fa-github"></i>GitHub</a>
        </div>
        <div class="readouts" id="readouts"></div>
      </div>
    </div></header>

    <section id="about"><div class="wrap"><div class="panel">
      <div class="sec-head"><span class="hud-dot"></span><h2 id="l-about"></h2><span class="unit">nav · info</span></div>
      <div class="about">
        <img id="portrait" alt="Cai Jiechao portrait" />
        <div><div id="bio"></div><span class="loc" id="loc"></span></div>
      </div>
    </div></div></section>

    <section id="education"><div class="wrap"><div class="panel">
      <div class="sec-head"><span class="hud-dot"></span><h2 id="l-edu"></h2><span class="unit">route history</span></div>
      <div class="rows" id="edu"></div>
    </div></div></section>

    <section id="skills"><div class="wrap"><div class="panel">
      <div class="sec-head"><span class="hud-dot"></span><h2 id="l-skills"></h2><span class="unit">engine specs</span></div>
      <div class="skills" id="skills-box"></div>
      <div class="tags" id="tags"></div>
    </div></div></section>

    <section id="courses"><div class="wrap"><div class="panel">
      <div class="sec-head"><span class="hud-dot"></span><h2 id="l-courses"></h2><span class="unit">systems</span></div>
      <div class="courses" id="courses-box"></div>
    </div></div></section>

    <section id="experience"><div class="wrap"><div class="panel">
      <div class="sec-head"><span class="hud-dot"></span><h2 id="l-exp"></h2><span class="unit">mileage log</span></div>
      <div class="rows" id="exp"></div>
    </div></div></section>

    <section id="projects"><div class="wrap"><div class="panel">
      <div class="sec-head"><span class="hud-dot"></span><h2 id="l-projects"></h2><span class="unit">waypoints</span></div>
      <div class="cards" id="projects-box"><div class="load-note" id="proj-load"></div></div>
    </div></div></section>

    <section id="articles"><div class="wrap"><div class="panel">
      <div class="sec-head"><span class="hud-dot"></span><h2 id="l-articles"></h2><span class="unit">travel log</span></div>
      <div class="filters" id="filters"></div>
      <div class="cards" id="articles-box"><div class="load-note" id="art-load"></div></div>
    </div></div></section>

    <section id="certificates"><div class="wrap"><div class="panel">
      <div class="sec-head"><span class="hud-dot"></span><h2 id="l-certs"></h2><span class="unit">badges</span></div>
      <div class="certs" id="certs"></div>
    </div></div></section>

    <section id="contact"><div class="wrap"><div class="panel">
      <div class="sec-head"><span class="hud-dot"></span><h2 id="l-contact"></h2><span class="unit">radio</span></div>
      <div class="contact">
        <div class="cinfo" id="cinfo"></div>
        <form id="cf">
          <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
          <input type="text" name="name" id="cf-name" required>
          <input type="email" name="email" id="cf-email" required>
          <textarea name="message" id="cf-msg" required></textarea>
          <button type="submit" class="btn pri" id="cf-send"></button>
          <p id="cf-status"></p>
        </form>
      </div>
    </div></div></section>

    <footer><div class="wrap">
      <div class="fsoc" id="fsoc"></div>
      <div class="muted" id="foot-desc"></div>
      <a class="muted" id="foot-icp" target="_blank" rel="noopener" style="display:inline-block"></a>
    </div></footer>
  </div>

  <div class="dashbar" aria-hidden="true">
    <div class="gauge" id="speedo"></div>
    <svg class="wheel" viewBox="0 0 100 100" role="img" aria-label="steering wheel">
      <g class="spin" style="transform-origin:50px 50px;animation:wob 5s ease-in-out infinite">
        <circle cx="50" cy="50" r="44" fill="none" stroke="#2a333c" stroke-width="9"/>
        <circle cx="50" cy="50" r="44" fill="none" stroke="#ff7a00" stroke-width="2" opacity=".7"/>
        <circle cx="50" cy="50" r="12" fill="#161b21" stroke="#ff7a00" stroke-width="2"/>
        <rect x="47" y="50" width="6" height="34" fill="#2a333c"/>
        <rect x="16" y="47" width="34" height="6" fill="#2a333c"/>
        <rect x="50" y="47" width="34" height="6" fill="#2a333c"/>
      </g>
    </svg>
    <div class="gauge" id="tacho"></div>
    <div class="minis">
      <div class="mini fuel"><div class="top"><span>Fuel</span><span>3/4</span></div><div class="bar"><i></i></div></div>
      <div class="mini temp"><div class="top"><span>Temp</span><span>92°C</span></div><div class="bar"><i></i></div></div>
    </div>
  </div>

  <style>@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  @media(prefers-reduced-motion:reduce){.spin{animation:none!important;transform:rotate(0)!important}}</style>

  <script>window.THEME_ID = "57-cardrive";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P=CJCData.profile,t=CJCData.t.bind(CJCData),esc=CJCData.escapeHtml;
    let articles=[],projects=[],filterKey="all";

    // build SVG gauge
    function gauge(id,label,value,max,unit){
      const el=document.getElementById(id);
      const frac=Math.min(value/max,1), a0=-220, a1=40, ang=a0+(a1-a0)*frac;
      const rad=(deg)=>deg*Math.PI/180, cx=50,cy=50,r=38;
      let ticks='';
      for(let i=0;i<=10;i++){ const ta=a0+(a1-a0)*(i/10); const x1=cx+Math.cos(rad(ta))*r, y1=cy+Math.sin(rad(ta))*r,
        x2=cx+Math.cos(rad(ta))*(r-6), y2=cy+Math.sin(rad(ta))*(r-6);
        ticks+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#3a444e" stroke-width="1.5"/>`; }
      const nx=cx+Math.cos(rad(ang))*(r-10), ny=cy+Math.sin(rad(ang))*(r-10);
      el.innerHTML=`<svg viewBox="0 0 100 100" style="width:100%;height:100%">
        <circle cx="50" cy="50" r="44" fill="rgba(6,10,14,.7)" stroke="#2a333c" stroke-width="2"/>
        ${ticks}
        <line x1="50" y1="50" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#ff7a00" stroke-width="3" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="4" fill="#ff7a00"/></svg>
        <div class="val">${value}</div><div class="lbl">${label}</div>`;
    }

    function renderStatic(){
      document.getElementById('nav').innerHTML=[
        ['about','nav_about'],['skills','nav_courses'],['projects','nav_portfolio'],
        ['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');
      document.getElementById('greet').textContent=t(P.greeting);
      document.getElementById('name').textContent=t(P.name);
      document.getElementById('role').textContent=t(P.role);
      document.getElementById('tag').textContent=t(P.title);
      const cv=document.getElementById('cvBtn'); cv.href=t(P.cv); cv.querySelector('span').textContent=t(P.ui.download_cv);
      document.getElementById('ghBtn').href=P.contact.github;
      document.getElementById('portrait').src=P.avatar;

      document.getElementById('readouts').innerHTML=[
        ['Speed','188'],['Distance','2026 km'],['Fuel','LLM'],['Gear','D']
      ].map(([k,v])=>`<div class="ro"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('');

      document.getElementById('l-about').textContent=t(P.ui.about_me);
      document.getElementById('l-edu').textContent=t(P.ui.education_bg);
      document.getElementById('l-skills').textContent=t(P.ui.core_tech);
      document.getElementById('l-courses').textContent=t(P.ui.core_courses);
      document.getElementById('l-exp').textContent=t(P.ui.internship_exp);
      document.getElementById('l-projects').textContent=t(P.ui.latest_projects);
      document.getElementById('l-articles').textContent=t(P.ui.latest_articles);
      document.getElementById('l-certs').textContent=t(P.ui.certificates);
      document.getElementById('l-contact').textContent=t(P.ui.get_in_touch);

      document.getElementById('bio').innerHTML=P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('');
      document.getElementById('loc').innerHTML=`<i class="fa fa-map-marker"></i> ${esc(t(P.location))}`;

      document.getElementById('edu').innerHTML=P.education.map(e=>`
        <div class="rowi"><div class="p">${esc(e.period)}</div>
        <h3>${esc(t(e.school))}</h3><div class="s">${esc(t(e.degree))} — ${esc(t(e.note))}</div></div>`).join('');

      const pct=[95,90,84,80,88,82];
      document.getElementById('skills-box').innerHTML=P.skills.map((s,i)=>`
        <div class="sk"><div class="top"><span>Spec ${String(i+1).padStart(2,'0')}</span><span>${pct[i%pct.length]}%</span></div>
        <div class="v">${esc(s)}</div><div class="bar"><i style="width:${pct[i%pct.length]}%"></i></div></div>`).join('');
      document.getElementById('tags').innerHTML=P.skillTags.map(x=>`<span>${esc(x)}</span>`).join('');

      document.getElementById('courses-box').innerHTML=P.courses.map(c=>`
        <div class="course"><i class="fa ${esc(c.icon)}"></i><h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');

      document.getElementById('exp').innerHTML=P.experience.map(x=>`
        <div class="rowi"><div class="p">${esc(x.period)}</div>
        <h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3>
        <div class="s">${esc(t(x.summary))}</div>
        <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div>`).join('');

      document.getElementById('certs').innerHTML=P.certificates.map(c=>`
        <div class="cert"><img src="${esc(c.image)}" alt="${esc(t(c.title))}" onerror="this.src='/index_page/img/blogs/1.jpg'">
        <div class="ct"><div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');

      document.getElementById('cinfo').innerHTML=[
        ['Email',P.contact.email,'mailto:'+P.contact.email],
        ['Phone',P.contact.phone,P.contact.phoneHref],
        ['GitHub','@'+P.contact.githubUser,P.contact.github],
        ['WeChat','QR ↗',P.contact.wechatQrPage]
      ].map(([k,v,h])=>`<a href="${esc(h)}"><span>${esc(k)}</span><span>${esc(v)}</span></a>`).join('');
      document.getElementById('cf-name').placeholder=t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder=t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder=t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent=t(P.ui.send);

      document.getElementById('fsoc').innerHTML=`
        <a href="${P.contact.github}" target="_blank" rel="noopener">GitHub</a>
        <a href="mailto:${P.contact.email}">Email</a>
        <a href="${P.contact.wechatQrPage}">WeChat</a>
        <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent=t(P.ui.footer_desc);
      const icp=document.getElementById('foot-icp'); icp.textContent=P.icp; icp.href=P.icpUrl;

      document.getElementById('filters').innerHTML=P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));

      gauge('speedo','km/h',188,240);
      gauge('tacho','x1000 rpm',6,9);
    }

    function renderProjects(){
      const box=document.getElementById('projects-box');
      if(!projects.length){ box.innerHTML=`<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML=projects.map(p=>`
        <a class="card" href="${esc(p.href)}">
          <div class="cbody">
            <div class="ctag"><span>${esc(t(P.ui.tech_stack))}</span><span>${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <p class="tech">${esc(p.tech_stack||'')}</p>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div></a>`).join('');
    }
    function renderArticles(){
      const box=document.getElementById('articles-box');
      const list=CJCData.filterArticles(articles,filterKey);
      if(!list.length){ box.innerHTML=`<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML=list.map(a=>`
        <a class="card" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
          <div class="cbody">
            <div class="ctag"><span>${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div></a>`).join('');
    }
    async function loadDynamic(){
      try{ projects=await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-box').innerHTML=`<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles=await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-box').innerHTML=`<div class="load-note">⚠ Failed to load articles.</div>`; }
    }

    document.getElementById('cf').addEventListener('submit',async(e)=>{
      e.preventDefault();
      const f=e.target,s=document.getElementById('cf-status');
      s.style.color='var(--mut)'; s.textContent=t(P.ui.sending);
      try{ const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});
        s.style.color='var(--org)'; s.textContent=r.message||'Sent.'; f.reset(); }
      catch(err){ s.style.color='#ff5a5a'; s.textContent=err.message; }
    });

    document.addEventListener('DOMContentLoaded',()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({accent:'#ff7a00'});
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

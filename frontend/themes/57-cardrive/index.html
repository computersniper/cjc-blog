<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Road Trip</title>
  <meta name="description" content="A first-person cockpit road trip. Grip the wheel, hit the gas, and drive past the billboards of Cai Jiechao's work — city to coast to night." />
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{
      --accent:#ff7a00; --accent2:#ffb057; --hot:#ff3b30; --cool:#37c8ff; --green:#37d67a;
      --dash:#14161c; --dash2:#0c0d12; --metal:#2a2e38; --metal2:#3a4050;
      --ink:#eef2f8; --dim:#aab3c4; --mut:#6b7488;
      --screen-ink:#8effc8;
      --edge:rgba(255,255,255,.1); --edge2:rgba(255,255,255,.22);
      --f-disp:'Orbitron','Rajdhani',system-ui,sans-serif;
      --f-hud:'Rajdhani','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
      --f-body:'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{font-family:var(--f-body);color:var(--ink);background:#05060a;overflow:hidden;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    button{font-family:inherit}
    ::selection{background:var(--accent);color:#111}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

    .cockpit{position:fixed;inset:0;overflow:hidden}

    /* ---------- windshield ---------- */
    .windshield{position:absolute;left:0;right:0;top:0;height:60%;overflow:hidden;background:#0a1420}
    #road{position:absolute;inset:0;width:100%;height:100%;display:block}
    .pillar{position:absolute;top:0;bottom:0;width:12%;z-index:6;pointer-events:none}
    .pillar.l{left:0;background:linear-gradient(105deg,#0b0c10 30%,transparent);clip-path:polygon(0 0,100% 0,55% 100%,0 100%)}
    .pillar.r{right:0;background:linear-gradient(255deg,#0b0c10 30%,transparent);clip-path:polygon(0 0,100% 0,100% 100%,45% 100%)}
    .roof{position:absolute;left:0;right:0;top:0;height:24px;z-index:6;pointer-events:none;background:linear-gradient(180deg,#05060a,transparent)}
    .mirror{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:7;width:150px;height:34px;border-radius:18px;
      background:linear-gradient(180deg,#1a1d24,#0a0b0f);border:2px solid #2a2e38;box-shadow:0 6px 14px rgba(0,0,0,.5);overflow:hidden}
    .mirror .refl{position:absolute;inset:2px;border-radius:14px;background:linear-gradient(180deg,#20303f,#0c1620);opacity:.9}
    .mirror .mt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-hud);font-size:10px;letter-spacing:.14em;color:#7fa8c8}

    .ws-hud{position:absolute;top:52px;left:0;right:0;z-index:7;display:flex;justify-content:center;pointer-events:none}
    .nextsign{font-family:var(--f-hud);font-weight:700;letter-spacing:.1em;color:#dfe8f5;background:rgba(6,10,16,.5);
      border:1px solid var(--edge);border-radius:8px;padding:5px 12px;font-size:13px;text-transform:uppercase;backdrop-filter:blur(3px)}

    .turbo{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0;
      background:radial-gradient(120% 100% at 50% 60%, rgba(255,122,0,0) 40%, rgba(255,122,0,.35) 75%, rgba(55,200,255,.4) 100%)}
    .turbo.on{animation:turboFlash .7s ease}
    @keyframes turboFlash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
    .turbo-word{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) scale(.6);z-index:9;pointer-events:none;
      font-family:var(--f-disp);font-weight:800;font-size:clamp(30px,7vw,64px);letter-spacing:.14em;
      color:#fff;text-shadow:0 0 24px var(--accent),0 0 50px var(--hot);opacity:0}
    .turbo-word.on{animation:turboWord .9s ease}
    @keyframes turboWord{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}

    .deer{position:absolute;top:44%;left:-10%;z-index:8;font-size:34px;pointer-events:none;opacity:0}
    .deer.run{animation:deerRun 1.5s linear}
    @keyframes deerRun{0%{left:-10%;opacity:1}100%{left:110%;opacity:1}}

    /* ---------- content MFD ---------- */
    .mfd{position:absolute;left:50%;top:40%;transform:translateX(-50%);z-index:10;width:min(600px,86vw);height:38%;
      background:linear-gradient(180deg,#0f1a17,#081410);border:2px solid #22312b;border-radius:14px;
      box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.5),0 0 0 6px #0b0d12;overflow:hidden;display:flex;flex-direction:column}
    .mfd::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.14) 2px 3px)}
    .mfd-top{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid rgba(120,255,190,.18);background:linear-gradient(180deg,rgba(60,120,90,.16),transparent)}
    .mfd-exit{width:30px;height:28px;border:1px solid rgba(120,255,190,.3);background:rgba(120,255,190,.08);color:var(--screen-ink);border-radius:6px;cursor:pointer;font-size:14px;display:grid;place-items:center;transition:.14s}
    .mfd-exit:hover{background:rgba(120,255,190,.2)}
    .mfd-exit:disabled{opacity:.3;cursor:not-allowed}
    .mfd-title{flex:1;text-align:center;min-width:0}
    .mfd-title .ex{font-family:var(--f-hud);font-size:10px;letter-spacing:.2em;color:#5fbf90;text-transform:uppercase}
    .mfd-title .nm{font-family:var(--f-disp);font-weight:600;font-size:15px;color:var(--screen-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 10px rgba(120,255,190,.4)}
    .mfd-body{flex:1;overflow:auto;padding:14px 16px 16px;position:relative;z-index:2;scrollbar-width:thin;color:#cdeede}
    .mfd-body::-webkit-scrollbar{width:8px}
    .mfd-body::-webkit-scrollbar-thumb{background:rgba(120,255,190,.3);border-radius:4px}
    .leaf{display:none}
    .leaf.on{display:block;animation:flick .4s ease}
    @keyframes flick{0%{opacity:.2}100%{opacity:1}}

    .mfd-body h1{font-family:var(--f-disp);font-weight:600;color:#daffe9;margin:0 0 6px;font-size:clamp(20px,4vw,30px);text-shadow:0 0 14px rgba(120,255,190,.4)}
    .mfd-body .greet{font-family:var(--f-hud);letter-spacing:.16em;color:#5fbf90;font-size:13px;text-transform:uppercase}
    .mfd-body .head{font-size:16px;color:#a9e6c6;margin:2px 0 6px}
    .mfd-body .sub{color:#7fc9a2;font-size:13.5px;margin:0 0 14px}
    .mfd-body p{color:#bfe8d3;font-size:14px;line-height:1.6}
    .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
    .btn{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-family:var(--f-hud);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:9px 15px;border-radius:8px;transition:.15s;border:1px solid var(--accent);background:linear-gradient(180deg,var(--accent2),var(--accent));color:#241000;box-shadow:0 6px 16px rgba(255,122,0,.35)}
    .btn:hover{transform:translateY(-2px)}
    .btn.ghost{background:rgba(120,255,190,.08);border-color:rgba(120,255,190,.4);color:#bfffdd;box-shadow:none}
    .btn.ghost:hover{background:rgba(120,255,190,.18)}

    .about{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:start}
    @media(max-width:520px){.about{grid-template-columns:1fr}.about .frame{max-width:150px}}
    .frame{border:2px solid #2f4d40;border-radius:8px;overflow:hidden;background:#08120e}
    .frame img{width:100%;aspect-ratio:3/4;object-fit:cover;filter:contrast(1.05) hue-rotate(-6deg) saturate(.9)}
    .loc{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-hud);font-size:12px;color:#8effc8;border:1px solid rgba(120,255,190,.3);border-radius:999px;padding:5px 12px;margin-top:8px}

    .rec{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:12px 0;border-bottom:1px dashed rgba(120,255,190,.2)}
    @media(max-width:520px){.rec{grid-template-columns:1fr;gap:3px}}
    .rec .when{font-family:var(--f-hud);color:#8effc8;font-weight:600;font-size:13px}
    .rec h4{margin:0 0 3px;font-family:var(--f-hud);font-size:15px;color:#daffe9}
    .rec .sub{color:#7fc9a2;font-size:13px}

    .gauges-list{display:grid;gap:10px}
    .gl .lab{display:flex;justify-content:space-between;font-family:var(--f-hud);font-size:13px;margin-bottom:5px}
    .gl .lab .n{color:#daffe9}.gl .lab .v{color:#8effc8}
    .track{height:8px;border-radius:999px;background:rgba(120,255,190,.12);overflow:hidden;border:1px solid rgba(120,255,190,.2)}
    .track i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),#8effc8);transition:width 1s cubic-bezier(.2,.8,.2,1)}
    .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
    .tags .t{font-family:var(--f-hud);font-size:12px;color:#bfe8d3;border:1px solid rgba(120,255,190,.25);border-radius:6px;padding:4px 10px;transition:.14s}
    .tags .t:hover{border-color:#8effc8;color:#daffe9}

    .modules{display:grid;grid-template-columns:1fr 1fr;gap:11px}
    @media(max-width:520px){.modules{grid-template-columns:1fr}}
    .mod{border:1px solid rgba(120,255,190,.2);border-radius:10px;padding:13px;background:rgba(120,255,190,.04)}
    .mod .ic{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--accent2);font-size:15px;border:1px solid rgba(255,176,87,.3);background:rgba(255,122,0,.12);margin-bottom:8px}
    .mod h4{margin:0 0 5px;font-family:var(--f-hud);font-size:14px;color:#daffe9}
    .mod p{margin:0;color:#7fc9a2;font-size:12.5px;line-height:1.5}

    .fop .top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 14px;align-items:baseline}
    .fop h4{margin:0;font-family:var(--f-hud);font-size:16px;color:#daffe9}.fop h4 span{color:var(--accent2)}
    .fop .when{font-family:var(--f-hud);color:#8effc8;font-size:13px}
    .fop .summary{color:#7fc9a2;font-size:13.5px;margin:6px 0 10px}
    .fop ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
    .fop li{position:relative;padding-left:20px;color:#bfe8d3;font-size:13.5px}
    .fop li::before{content:"\f018";font-family:FontAwesome;position:absolute;left:0;top:1px;color:var(--accent2);font-size:11px}

    .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
    .filters button{font-family:var(--f-hud);font-size:12px;cursor:pointer;color:#7fc9a2;border:1px solid rgba(120,255,190,.25);border-radius:999px;padding:4px 11px;background:transparent;transition:.14s}
    .filters button:hover{color:#daffe9;border-color:#8effc8}
    .filters button.active{background:var(--accent);border-color:var(--accent);color:#241000}
    .flist{display:grid;gap:9px}
    .card{display:grid;grid-template-columns:54px 1fr auto;gap:11px;align-items:center;padding:9px;border:1px solid rgba(120,255,190,.2);border-radius:9px;background:rgba(120,255,190,.04);transition:.14s;color:inherit}
    .card:hover{border-color:#8effc8;background:rgba(120,255,190,.1);transform:translateX(3px)}
    .card .thumb{width:54px;height:46px;border-radius:7px;object-fit:cover;background:#0d241c;border:1px solid rgba(120,255,190,.2)}
    .card .mid{min-width:0}
    .card .r1{font-family:var(--f-hud);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent2);margin-bottom:2px}
    .card h4{margin:0;font-family:var(--f-hud);font-size:14px;color:#daffe9;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .card .time{font-family:var(--f-hud);font-size:11px;color:#7fc9a2;white-space:nowrap}
    .load-note{color:#7fc9a2;font-family:var(--f-hud);padding:12px;text-align:center;border:1px dashed rgba(120,255,190,.25);border-radius:9px}

    .accs{display:grid;gap:11px}
    .acc{display:grid;grid-template-columns:92px 1fr;border:1px solid rgba(120,255,190,.2);border-radius:9px;overflow:hidden;background:rgba(120,255,190,.04)}
    .acc img{width:100%;height:100%;object-fit:cover;border-right:1px solid rgba(120,255,190,.2);background:#0d241c}
    .acc .ac{padding:11px}
    .acc .ac .m{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-hud);font-size:10px;text-transform:uppercase;color:var(--accent2)}
    .acc .ac h4{margin:5px 0 4px;font-family:var(--f-hud);font-size:14px;color:#daffe9}
    .acc .ac p{margin:0;color:#7fc9a2;font-size:12.5px;line-height:1.5}

    .ci-list{display:grid;gap:8px;margin-bottom:12px}
    .ci-list a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid rgba(120,255,190,.2);border-radius:9px;background:rgba(120,255,190,.04);transition:.14s}
    .ci-list a:hover{transform:translateX(3px);border-color:#8effc8}
    .ci-key{display:flex;align-items:center;gap:10px;font-family:var(--f-hud);font-size:13px;color:#daffe9}
    .ci-key i{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--accent2);border:1px solid rgba(255,176,87,.3);background:rgba(255,122,0,.12)}
    .ci-val{font-family:var(--f-hud);font-size:12px;color:#8effc8;word-break:break-word;text-align:right}
    .cform label{display:block;font-family:var(--f-hud);font-size:12px;color:#8effc8;margin:0 0 5px}
    .cform input,.cform textarea{width:100%;background:rgba(4,14,10,.7);color:#dffbe9;border:1px solid rgba(120,255,190,.25);border-radius:8px;font-family:var(--f-body);font-size:14px;padding:9px 11px;margin-bottom:10px}
    .cform input:focus,.cform textarea:focus{outline:none;border-color:#8effc8;box-shadow:0 0 0 3px rgba(120,255,190,.15)}
    .cform textarea{min-height:80px;resize:vertical}
    .cform .btn{width:100%;justify-content:center}
    #cf-status{margin:10px 0 0;font-family:var(--f-hud);font-size:13px;min-height:1.2em}
    .foot{margin-top:16px;padding-top:12px;border-top:1px solid rgba(120,255,190,.2);display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;font-family:var(--f-hud);font-size:11px;color:#5fbf90}
    .foot-links{display:flex;flex-wrap:wrap;gap:12px}
    .foot-links a:hover{color:#8effc8}

    /* exit tabs */
    .exits{position:absolute;left:50%;top:calc(40% - 30px);transform:translateX(-50%);z-index:11;display:flex;gap:5px;width:min(600px,86vw);overflow-x:auto;scrollbar-width:none;padding:2px}
    .exits::-webkit-scrollbar{display:none}
    .exits button{flex:none;font-family:var(--f-hud);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;color:#bfe8d3;border:1px solid var(--edge);background:rgba(10,14,20,.7);border-radius:6px 6px 0 0;padding:4px 10px;transition:.14s;white-space:nowrap}
    .exits button:hover{color:#fff;border-color:var(--edge2)}
    .exits button.on{background:var(--accent);color:#241000;border-color:var(--accent)}

    /* ---------- dashboard ---------- */
    .dash{position:absolute;left:0;right:0;bottom:0;height:40%;z-index:12;background:linear-gradient(180deg,#191c24 0%,var(--dash) 30%,var(--dash2) 100%);border-top:2px solid #2a2e38;box-shadow:0 -10px 30px rgba(0,0,0,.6)}
    .dash::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background:radial-gradient(140% 120% at 50% -30%, rgba(255,255,255,.06), transparent 60%)}
    .cluster{position:absolute;left:0;right:0;top:8px;display:flex;justify-content:center;align-items:flex-start;gap:min(6vw,80px);pointer-events:none}
    .gauge{width:120px;height:120px;position:relative}
    .gauge svg{width:100%;height:100%;display:block}
    .gauge .needle{transform-box:fill-box;transform-origin:50% 88%;transition:transform .08s linear}
    .gauge .lbl{position:absolute;left:0;right:0;bottom:20px;text-align:center;font-family:var(--f-disp);font-size:11px;letter-spacing:.1em;color:var(--dim)}
    .gauge .rd{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:var(--f-disp);font-weight:800;font-size:15px;color:#fff}
    @media(max-width:760px){.gauge{width:88px;height:88px}.gauge .lbl{font-size:9px;bottom:15px}.gauge .rd{font-size:12px}}
    @media(max-width:500px){.gauge{width:74px;height:74px}.cluster{gap:44vw}}

    .center-stack{position:absolute;left:50%;top:6px;transform:translateX(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none}
    .gear{font-family:var(--f-disp);font-weight:800;font-size:24px;color:#fff;background:#05060a;border:1px solid var(--edge2);border-radius:8px;padding:2px 14px;box-shadow:inset 0 0 12px rgba(255,122,0,.2)}
    .gear span{color:var(--accent)}
    .odo{font-family:var(--f-disp);font-size:12px;letter-spacing:.14em;color:#8effc8;background:#04120c;border:1px solid rgba(120,255,190,.25);border-radius:5px;padding:2px 10px}
    .signals{display:flex;gap:16px}
    .signals i{font-size:16px;color:#2a3140;transition:.1s}
    .signals i.on{color:var(--accent)}

    .wheel-wrap{position:absolute;left:50%;bottom:-30%;transform:translateX(-50%);z-index:3;width:min(360px,80vw);height:min(360px,80vw);touch-action:none;cursor:grab}
    .wheel-wrap:active{cursor:grabbing}
    .wheel-wrap svg{width:100%;height:100%;display:block;filter:drop-shadow(0 -6px 18px rgba(0,0,0,.5))}
    @media(max-width:760px){.wheel-wrap{bottom:-40%;width:min(280px,70vw);height:min(280px,70vw)}}

    .controls{position:absolute;right:14px;bottom:14px;z-index:14;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
    .pedal{font-family:var(--f-hud);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;cursor:pointer;border:1px solid var(--edge2);border-radius:10px;padding:11px 16px;background:rgba(20,24,32,.9);color:var(--ink);transition:.1s;user-select:none}
    .pedal.gas{background:linear-gradient(180deg,var(--accent2),var(--accent));color:#241000;border-color:var(--accent)}
    .pedal.gas:active,.pedal.gas.held{transform:scale(.96);box-shadow:0 0 20px rgba(255,122,0,.6)}
    .btn-round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:17px;cursor:pointer;border:1px solid var(--edge2);background:rgba(20,24,32,.9);color:var(--ink);transition:.12s}
    .btn-round:hover{border-color:var(--accent)}
    .btn-round.horn:active{background:var(--hot);color:#fff}
    .ctl-row{display:flex;gap:8px}

    .steer-btns{position:absolute;left:14px;bottom:14px;z-index:14;display:none;gap:8px}
    .steer-btns button{width:52px;height:52px;border-radius:12px;font-size:20px;border:1px solid var(--edge2);background:rgba(20,24,32,.9);color:var(--ink);cursor:pointer}
    .steer-btns button:active{background:var(--accent);color:#241000}

    .radio{position:absolute;left:14px;bottom:70px;z-index:14;width:190px;background:#04120c;border:1px solid rgba(120,255,190,.3);border-radius:9px;padding:8px 10px;font-family:var(--f-hud);opacity:0;pointer-events:none;transition:.3s;transform:translateY(6px)}
    .radio.on{opacity:1;pointer-events:auto;transform:translateY(0)}
    .radio .st{font-size:11px;color:#5fbf90;letter-spacing:.12em;text-transform:uppercase}
    .radio .now{font-size:13px;color:#8effc8;margin-top:2px}
    .radio .freq{font-family:var(--f-disp);font-weight:800;color:#fff;font-size:18px}
    @media(max-width:760px){.radio{bottom:74px;left:78px}}

    .brand{position:absolute;top:14px;left:16px;z-index:15;display:flex;align-items:center;gap:9px;color:var(--ink);pointer-events:none}
    .brand .lg{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:linear-gradient(180deg,var(--accent2),var(--accent));color:#241000;font-size:16px}
    .brand b{font-family:var(--f-disp);font-weight:800;letter-spacing:.08em;font-size:15px}
    .brand small{display:block;font-family:var(--f-hud);font-size:10px;letter-spacing:.2em;color:var(--mut)}
    @media(max-width:560px){.brand small{display:none}}

    .hint{position:absolute;top:56px;left:16px;z-index:8;font-family:var(--f-hud);font-size:10px;letter-spacing:.05em;color:var(--mut);text-align:left;max-width:210px;line-height:1.5;pointer-events:none}
    .hint b{color:var(--accent2)}
    @media(max-width:1040px){.hint{display:none}}

    .toast{position:absolute;top:96px;left:50%;transform:translateX(-50%) translateY(-10px);z-index:16;font-family:var(--f-hud);font-weight:700;font-size:14px;letter-spacing:.05em;color:#241000;background:linear-gradient(180deg,var(--accent2),var(--accent));border-radius:8px;padding:7px 16px;box-shadow:0 8px 20px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.3s}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media(max-width:760px){
      .steer-btns{display:flex}
      .mfd{width:92vw;top:33%;height:45%}
      .exits{top:calc(33% - 28px);width:92vw}
      .windshield{height:52%}
      .dash{height:48%}
      .mirror{width:110px}
    }
    @media (prefers-reduced-motion: reduce){
      *{animation:none !important}
      .wheel-wrap{cursor:default}
    }
    body.reduced{overflow:auto}
    body.reduced .cockpit{position:relative;inset:auto;min-height:100vh}
    body.reduced .windshield{position:relative;height:180px}
    body.reduced .exits{position:sticky;top:0;left:auto;transform:none;width:100%;background:#0a0f14;padding:8px}
    body.reduced .mfd{position:relative;left:auto;top:auto;transform:none;width:min(760px,94vw);height:auto;margin:14px auto;max-height:none}
    body.reduced .mfd-body{max-height:none}
    body.reduced .leaf{display:block !important;border-bottom:1px solid rgba(120,255,190,.15);padding-bottom:14px;margin-bottom:14px}
    body.reduced .dash{position:relative;height:auto;padding:20px 0 40px}
    body.reduced .wheel-wrap{position:relative;bottom:auto;margin:10px auto;transform:none}
    body.reduced .cluster{position:relative;top:auto}
    body.reduced .center-stack{position:relative;left:auto;top:auto;transform:none;margin:10px auto}
    body.reduced .controls,body.reduced .steer-btns,body.reduced .hint{display:none}
  </style>
</head>
<body>

    <div class="windshield" id="windshield">
      <canvas id="road" aria-hidden="true"></canvas>

      <div class="pillar r" aria-hidden="true"></div>

    <div class="brand"><span class="lg"><i class="fa fa-car"></i></span><span><b id="brand-name">CAI · GT</b><small id="brand-sub">GRAND TOUR</small></span></div>

        <button class="mfd-exit" id="next" type="button" aria-label="Next exit"><i class="fa fa-angle-right"></i></button>
      </div>
      <div class="mfd-body" id="mfd-body">

        <div class="leaf on" data-i="0" id="leaf-hero">

          <p class="head" id="hero-headline"></p>
          <p class="sub" id="hero-title"></p>

        </div>

        <div class="leaf" data-i="1" id="leaf-about">
          <div class="about"><div class="frame"><img id="about-img" alt=""></div><div><div id="about-text"></div><span class="loc" id="about-loc"></span></div></div>
        </div>

        <div class="leaf" data-i="2" id="leaf-education"><div id="edu-list"></div></div>
        <div class="leaf" data-i="3" id="leaf-skills"><div class="gauges-list" id="skills-list"></div><div class="tags" id="tags"></div></div>
        <div class="leaf" data-i="4" id="leaf-courses"><div class="modules" id="courses-list"></div></div>

        <div class="leaf" data-i="7" id="leaf-articles"><div class="filters" id="filters"></div><div class="flist" id="articles-list"><div class="load-note">◌</div></div></div>

            <label id="lb-email" for="cf-email"></label><input type="email" name="email" id="cf-email" required autocomplete="email">
            <label id="lb-msg" for="cf-msg"></label><textarea name="message" id="cf-msg" required></textarea>
            <button class="btn" id="cf-send" type="submit"></button>
            <p id="cf-status" role="status" aria-live="polite"></p>
          </form>
          <div class="foot"><nav class="foot-links" id="foot-social" aria-label="Social"></nav><span id="foot-desc"></span><a id="foot-icp" href="#" target="_blank" rel="noopener"></a></div>
        </div>

      </div>
    </section>

    <div class="dash" id="dash">
      <div class="cluster">
        <div class="gauge" id="g-tach"><div class="lbl">RPM x1000</div><div class="rd"><span id="rd-rpm">0</span></div></div>
        <div class="gauge" id="g-speed"><div class="lbl" id="spd-unit">KM/H</div><div class="rd"><span id="rd-speed">0</span></div></div>
      </div>
      <div class="center-stack">
        <div class="gear">GEAR <span id="gear">N</span></div>
        <div class="odo"><i class="fa fa-road" aria-hidden="true"></i> <span id="odo">000000</span> KM</div>
        <div class="signals"><i class="fa fa-angle-double-left" id="sig-l"></i><i class="fa fa-angle-double-right" id="sig-r"></i></div>
      </div>
      <div class="wheel-wrap" id="wheel-wrap" role="slider" aria-label="Steering wheel" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0" tabindex="0"></div>
    </div>

    <div class="steer-btns" id="steer-btns">
      <button type="button" id="steer-l" aria-label="Steer left"><i class="fa fa-arrow-left"></i></button>
      <button type="button" id="steer-r" aria-label="Steer right"><i class="fa fa-arrow-right"></i></button>
    </div>
    <div class="controls">
      <div class="pedal gas" id="gas" role="button" tabindex="0">▲ GAS</div>
      <div class="ctl-row">
        <button class="btn-round horn" id="horn" type="button" aria-label="Horn"><i class="fa fa-bullhorn"></i></button>
        <button class="btn-round" id="radio-btn" type="button" aria-label="Radio"><i class="fa fa-music"></i></button>
      </div>
    </div>
    <div class="radio" id="radio"><div class="st">STATION <span id="radio-freq" class="freq">88.1</span></div><div class="now" id="radio-now"></div></div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script>window.THEME_ID = "57-cardrive";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    "use strict";
    var CJC = window.CJCData, P = CJC.profile, esc = CJC.escapeHtml;
    function t(f){ return CJC.t(f); }
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var SECTIONS = [
      {id:'hero', ex:{en:'Start Line',zh:'起点'}},
      {id:'about', ex:{en:'Rest Stop',zh:'休息站'}},
      {id:'education', ex:{en:'Milestones',zh:'里程碑'}},
      {id:'skills', ex:{en:'The Garage',zh:'车库'}},
      {id:'courses', ex:{en:'Driving School',zh:'驾校'}},
      {id:'experience', ex:{en:'Service Road',zh:'服务区'}},
      {id:'projects', ex:{en:'Landmarks',zh:'地标'}},
      {id:'articles', ex:{en:'Roadside News',zh:'路边新闻'}},
      {id:'certificates', ex:{en:'Trophies',zh:'奖杯'}},
      {id:'contact', ex:{en:'Destination',zh:'终点站'}}
    ];
    var N = SECTIONS.length;
    var active = 0, articles = [], projects = [], filterKey = 'all';

    function set(id,txt){ var e=document.getElementById(id); if(e) e.textContent=txt; }
    function setHTML(id,h){ var e=document.getElementById(id); if(e) e.innerHTML=h; }

    /* ================= gauges ================= */
    function makeGauge(el, opts){
      var A0=-120, A1=120, cx=60, cy=60, R=48, steps=opts.majorCount, ticks='';
      for(var i=0;i<=steps;i++){
        var frac=i/steps, ang=(A0+(A1-A0)*frac)*Math.PI/180;
        var r2=R-9, x1=cx+Math.cos(ang)*R, y1=cy+Math.sin(ang)*R, x2=cx+Math.cos(ang)*r2, y2=cy+Math.sin(ang)*r2;
        var red = opts.redFrom!=null && frac>=opts.redFrom-0.0001;
        ticks += '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="'+(red?'#ff3b30':'#93a0b5')+'" stroke-width="2"/>';
        var lr=R-17, lx=cx+Math.cos(ang)*lr, ly=cy+Math.sin(ang)*lr+2.5;
        ticks += '<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" fill="'+(red?'#ff6a60':'#9aa6ba')+'" font-size="7" font-family="Orbitron,sans-serif" text-anchor="middle">'+opts.labels[i]+'</text>';
      }
      var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('viewBox','0 0 120 120'); svg.setAttribute('aria-hidden','true');
      svg.innerHTML = '<circle cx="60" cy="60" r="56" fill="#0a0c11" stroke="#2a2e38" stroke-width="2"/>'
        + '<circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="1"/>'
        + ticks
        + '<path class="needle" id="'+opts.needleId+'" d="M60 18 L57 62 L63 62 Z" fill="'+opts.color+'"/>'
        + '<circle cx="60" cy="60" r="7" fill="#1a1d24" stroke="'+opts.color+'" stroke-width="2"/>';
      el.insertBefore(svg, el.firstChild);
    }

    /* ================= steering wheel ================= */
    function buildWheel(){
      var wrap=document.getElementById('wheel-wrap');
      wrap.innerHTML = '<svg viewBox="0 0 200 200"><g id="wheel">'
        + '<circle cx="100" cy="100" r="92" fill="none" stroke="#0a0b0f" stroke-width="20"/>'
        + '<circle cx="100" cy="100" r="92" fill="none" stroke="#22262f" stroke-width="14"/>'
        + '<circle cx="100" cy="100" r="92" fill="none" stroke="#3a4050" stroke-width="4"/>'
        + '<g stroke="#22262f" stroke-width="16" stroke-linecap="round">'
        + '<line x1="100" y1="100" x2="100" y2="185"/><line x1="100" y1="100" x2="24" y2="70"/><line x1="100" y1="100" x2="176" y2="70"/></g>'
        + '<g stroke="#3a4050" stroke-width="5" stroke-linecap="round">'
        + '<line x1="100" y1="100" x2="100" y2="185"/><line x1="100" y1="100" x2="24" y2="70"/><line x1="100" y1="100" x2="176" y2="70"/></g>'
        + '<circle cx="100" cy="100" r="24" fill="#05060a" stroke="#ff7a00" stroke-width="2"/>'
        + '<text x="100" y="105" fill="#ff9a3c" font-size="15" font-family="Orbitron,sans-serif" font-weight="800" text-anchor="middle">CJC</text>'
        + '<rect x="94" y="12" width="12" height="10" rx="2" fill="#ff7a00"/>'
        + '</g></svg>';
    }

    /* ================= state ================= */
    var speed=0, MAX=260, accelHeld=false, steer=0, steerTarget=0, steerKeyDir=0, odo=0, rpm=0, gearN=0;
    var turboReady=true, lastZone=-1;

    var cv=document.getElementById('road'), ctx=cv.getContext('2d'), W=0,H=0, DPR=Math.min(2,window.devicePixelRatio||1), pos=0;
    function resize(){
      var r=document.getElementById('windshield').getBoundingClientRect();
      W=cv.width=Math.max(2,Math.floor(r.width*DPR)); H=cv.height=Math.max(2,Math.floor(r.height*DPR));
      cv.style.width=r.width+'px'; cv.style.height=r.height+'px';
    }
    var ZONES=[
      {name:{en:'City',zh:'城市'}, sky:['#243a5e','#4a5f7a'], ground:'#3a3f46', road:'#2b2e33', stripe:'#e8c24a'},
      {name:{en:'Country',zh:'乡野'}, sky:['#7ec0ee','#bfe3c0'], ground:'#4b7a3a', road:'#3a3d42', stripe:'#f2f2f2'},
      {name:{en:'Coast',zh:'海岸'}, sky:['#5ec8e6','#ffd9a0'], ground:'#2f7c8c', road:'#3a3d42', stripe:'#ffffff'},
      {name:{en:'Night',zh:'夜晚'}, sky:['#0a0f2a','#241a3a'], ground:'#12131a', road:'#1c1f24', stripe:'#ffb057'}
    ];
    function zoneIndex(){ return Math.floor(odo/6)%ZONES.length; }

    function drawRoad(){
      var Z=ZONES[zoneIndex()], hz=H*0.34;
      var sg=ctx.createLinearGradient(0,0,0,hz); sg.addColorStop(0,Z.sky[0]); sg.addColorStop(1,Z.sky[1]);
      ctx.fillStyle=sg; ctx.fillRect(0,0,W,hz);
      if(zoneIndex()===3){ ctx.fillStyle='rgba(255,220,180,.9)'; ctx.beginPath(); ctx.arc(W*0.5+steer*40*DPR,hz*0.5,22*DPR,0,6.283); ctx.fill(); }
      ctx.fillStyle=Z.ground; ctx.fillRect(0,hz,W,H-hz);
      var curve=steer;
      for(var y=Math.floor(hz)+1;y<H;y++){
        var p=(y-hz)/(H-hz); if(p<=0) continue;
        var half=(W*0.06)+p*p*(W*0.62);
        var bend=curve*(1-p)*(1-p)*(W*0.55);
        var cxr=W/2+bend;
        ctx.fillStyle=Z.road; ctx.fillRect(cxr-half, y, half*2, 1);
        ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fillRect(cxr-half, y, 2*DPR, 1); ctx.fillRect(cxr+half-2*DPR, y, 2*DPR, 1);
        var worldZ=1/p, phase=(worldZ*6 + pos*0.35);
        if(Math.floor(phase)%2===0){ ctx.fillStyle=Z.stripe; ctx.fillRect(cxr-2*DPR, y, 4*DPR, 1); }
      }
      drawBillboard(Z);
    }

    var bbZ=2.4;
    function drawBillboard(Z){
      var hz=H*0.34;
      bbZ -= (0.004 + speed/MAX*0.05);
      if(bbZ<0.35){ bbZ=2.6; }
      var p=1/(bbZ*1.6+0.15); if(p>1) p=1;
      var y=hz + p*p*(H-hz)*0.9;
      var side=(active%2===0)?-1:1;
      var bend=steer*(1-p)*(1-p)*(W*0.55);
      var half=(W*0.06)+p*p*(W*0.62);
      var bx=W/2 + bend + side*(half+(30+p*120)*DPR);
      var scale=(0.3+p*1.6), bw=70*DPR*scale, bh=44*DPR*scale;
      if(y<hz+4) return;
      ctx.fillStyle='#20242c'; ctx.fillRect(bx-3*DPR, y, 6*DPR, 28*DPR*scale);
      ctx.fillStyle='#0b1f1a'; ctx.strokeStyle=Z.stripe; ctx.lineWidth=2*DPR;
      ctx.fillRect(bx-bw/2, y-bh, bw, bh); ctx.strokeRect(bx-bw/2, y-bh, bw, bh);
      var nxt=(active+1)%N;
      ctx.fillStyle='#8effc8'; ctx.font='700 '+(9*DPR*scale).toFixed(0)+'px Rajdhani, sans-serif'; ctx.textAlign='center';
      ctx.fillText((CJC.lang()==='zh'?'出口 ':'EXIT ')+nxt, bx, y-bh+13*DPR*scale);
      ctx.fillStyle='#daffe9'; ctx.font='700 '+(8*DPR*scale).toFixed(0)+'px Rajdhani, sans-serif';
      var lbl=t(SECTIONS[nxt].ex); if(lbl.length>12) lbl=lbl.slice(0,12);
      ctx.fillText(lbl, bx, y-bh+26*DPR*scale);
    }

    /* ================= instruments ================= */
    var speedNeedle, tachNeedle;
    function updateInstruments(){
      var gearStep=MAX/6;
      gearN=Math.min(6, Math.floor(speed/gearStep)+(speed>0?1:0));
      rpm = speed>0 ? ((speed%gearStep)/gearStep)*7+0.6 : 0;
      if(gearN===6) rpm=(speed/MAX)*8;
      var spdAng=-120+(Math.min(speed,MAX)/MAX)*240;
      var tachAng=-120+(Math.min(rpm,8)/8)*240;
      if(speedNeedle) speedNeedle.style.transform='rotate('+spdAng+'deg)';
      if(tachNeedle) tachNeedle.style.transform='rotate('+tachAng+'deg)';
      set('rd-speed', Math.round(speed)); set('rd-rpm', rpm.toFixed(1));
      set('gear', gearN===0?'N':gearN);
      set('odo', ('000000'+Math.floor(odo*10)).slice(-6));
      var sl=document.getElementById('sig-l'), sr=document.getElementById('sig-r'), blink=Math.floor(Date.now()/350)%2===0;
      sl.classList.toggle('on', steer<-0.25 && blink);
      sr.classList.toggle('on', steer>0.25 && blink);
      var wheel=document.getElementById('wheel');
      if(wheel) wheel.setAttribute('transform','rotate('+(steer*130)+' 100 100)');
      document.getElementById('wheel-wrap').setAttribute('aria-valuenow', Math.round(steer*100));
      if(rpm>=7.7 && speed>MAX*0.94 && turboReady){ turbo(); turboReady=false; }
      if(speed<MAX*0.7) turboReady=true;
    }

    function step(){
      if(accelHeld) speed += (MAX-speed)*0.012 + 0.4;
      else speed -= speed*0.012 + 0.25;
      speed=Math.max(0,Math.min(MAX,speed));
      if(steerKeyDir!==0) steerTarget=steerKeyDir;
      steer += (steerTarget-steer)*0.12;
      if(steerKeyDir===0 && !dragging) steerTarget += (0-steerTarget)*0.1;
      pos += speed*0.02; odo += speed*0.00009;
      var zi=zoneIndex();
      if(zi!==lastZone){ lastZone=zi; if(speed>4) toast((CJC.lang()==='zh'?'进入 ':'Entering ')+t(ZONES[zi].name)); updateMirror(); }
      drawRoad(); updateInstruments();
      requestAnimationFrame(step);
    }
    function updateMirror(){ set('mirror-txt', (CJC.lang()==='zh'?'后视 · ':'REAR · ')+t(ZONES[zoneIndex()].name).toUpperCase()); }

    var arriveAt=6, nextArrive=6;
    function checkArrival(){ if(odo>=nextArrive){ nextArrive+=arriveAt; if(active<N-1) go(active+1,true); } }
    setInterval(function(){ if(!reduce) checkArrival(); }, 400);

    /* ================= nav ================= */
    function go(i, fromDrive){
      i=Math.max(0,Math.min(N-1,i)); active=i;
      Array.prototype.forEach.call(document.querySelectorAll('.leaf'), function(l){ l.classList.toggle('on', +l.dataset.i===i); });
      var mb=document.getElementById('mfd-body'); if(mb) mb.scrollTop=0;
      Array.prototype.forEach.call(document.querySelectorAll('#exits button'), function(b,idx){ b.classList.toggle('on', idx===i); });
      set('mfd-ex', (CJC.lang()==='zh'?'出口 ':'EXIT ')+i);
      set('mfd-nm', t(SECTIONS[i].ex));
      set('nextsign', (i<N-1)?((CJC.lang()==='zh'?'前方 · ':'AHEAD · ')+t(SECTIONS[i+1].ex)):(CJC.lang()==='zh'?'终点已到':'DESTINATION'));
      document.getElementById('prev').disabled=(i===0);
      document.getElementById('next').disabled=(i===N-1);
      var ac=document.querySelector('#exits button.on'); if(ac&&ac.scrollIntoView) ac.scrollIntoView({inline:'center',block:'nearest'});
      if(fromDrive) toast((CJC.lang()==='zh'?'到达 · ':'Arriving · ')+t(SECTIONS[i].ex));
    }

    /* ================= easter eggs ================= */
    var toastTimer=null;
    function toast(m){ var e=document.getElementById('toast'); if(!e) return; e.textContent=m; e.classList.add('show'); if(toastTimer)clearTimeout(toastTimer); toastTimer=setTimeout(function(){e.classList.remove('show');},1900); }
    function turbo(){
      if(reduce) return;
      var tf=document.getElementById('turbo'), tw=document.getElementById('turbo-word');
      tf.classList.remove('on'); tw.classList.remove('on'); void tf.offsetWidth;
      tf.classList.add('on'); tw.classList.add('on');
      toast(CJC.lang()==='zh'?'涡轮增压！':'TURBO BOOST!');
      setTimeout(function(){ tf.classList.remove('on'); tw.classList.remove('on'); }, 950);
    }
    function deerDart(){
      if(reduce) return;
      var d=document.getElementById('deer'); d.classList.remove('run'); void d.offsetWidth; d.classList.add('run');
      toast(CJC.lang()==='zh'?'小心！有鹿！':'Watch out — deer!');
      setTimeout(function(){ d.classList.remove('run'); }, 1600);
    }
    var radioOn=false, radioIdx=0;
    var STATIONS=[
      {f:'88.1', now:{en:'Synthwave Cruise',zh:'合成波巡航'}},
      {f:'97.3', now:{en:'Late-Night Lo-Fi',zh:'深夜 Lo-Fi'}},
      {f:'104.7',now:{en:'Highway Classics',zh:'公路经典'}},
      {f:'ROG.9',now:{en:'CJC · Coding Beats',zh:'CJC · 编码节拍'}}
    ];
    function toggleRadio(){ radioOn=!radioOn; document.getElementById('radio').classList.toggle('on', radioOn); if(radioOn) tuneRadio(0); else toast(CJC.lang()==='zh'?'收音机关闭':'Radio off'); }
    function tuneRadio(step){ radioIdx=(radioIdx+step+STATIONS.length)%STATIONS.length; var s=STATIONS[radioIdx]; set('radio-freq', s.f); set('radio-now','♪ '+t(s.now)); }

    /* ================= inputs ================= */
    function setGas(on){ accelHeld=on; document.getElementById('gas').classList.toggle('held',on); }
    (function(){
      var gas=document.getElementById('gas');
      gas.addEventListener('pointerdown', function(e){ e.preventDefault(); setGas(true); });
      window.addEventListener('pointerup', function(){ setGas(false); });
      gas.addEventListener('keydown', function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); setGas(true);} });
      gas.addEventListener('keyup', function(e){ if(e.key===' '||e.key==='Enter'){ setGas(false);} });
    })();
    document.getElementById('horn').addEventListener('click', function(){ toast('📢 BEEP!'); if(Math.random()<0.85) deerDart(); });
    document.getElementById('radio-btn').addEventListener('click', toggleRadio);
    document.getElementById('radio').addEventListener('click', function(){ tuneRadio(1); });
    document.getElementById('prev').addEventListener('click', function(){ go(active-1); });
    document.getElementById('next').addEventListener('click', function(){ go(active+1); });

    function bindSteer(btn,dir){
      btn.addEventListener('pointerdown', function(e){ e.preventDefault(); steerKeyDir=dir; });
      window.addEventListener('pointerup', function(){ if(steerKeyDir===dir) steerKeyDir=0; });
    }
    bindSteer(document.getElementById('steer-l'), -1);
    bindSteer(document.getElementById('steer-r'), 1);

    window.addEventListener('keydown', function(e){
      var tag=(e.target&&e.target.tagName)||''; if(tag==='INPUT'||tag==='TEXTAREA') return;
      if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'){ e.preventDefault(); setGas(true); }
      else if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){ steerKeyDir=-1; }
      else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){ steerKeyDir=1; }
      else if(e.key==='h'||e.key==='H'){ document.getElementById('horn').click(); }
      else if(e.key===','){ go(active-1); }
      else if(e.key==='.'){ go(active+1); }
    });
    window.addEventListener('keyup', function(e){
      if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'){ setGas(false); }
      else if((e.key==='ArrowLeft'||e.key==='a'||e.key==='A')&&steerKeyDir===-1){ steerKeyDir=0; }
      else if((e.key==='ArrowRight'||e.key==='d'||e.key==='D')&&steerKeyDir===1){ steerKeyDir=0; }
    });

    var dragging=false, dragStartAng=0, steerStart=0;
    function angFrom(e){ var w=document.getElementById('wheel-wrap').getBoundingClientRect(); return Math.atan2(e.clientY-(w.top+w.height/2), e.clientX-(w.left+w.width/2)); }
    var ww=document.getElementById('wheel-wrap');
    ww.addEventListener('pointerdown', function(e){ dragging=true; dragStartAng=angFrom(e); steerStart=steer; try{ww.setPointerCapture(e.pointerId);}catch(_){}} );
    ww.addEventListener('pointermove', function(e){ if(!dragging) return; var d=angFrom(e)-dragStartAng; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; steerTarget=Math.max(-1,Math.min(1, steerStart+d/1.6)); });
    ww.addEventListener('pointerup', function(){ dragging=false; });
    ww.addEventListener('pointercancel', function(){ dragging=false; });
    ww.addEventListener('keydown', function(e){ if(e.key==='ArrowLeft'){steerKeyDir=-1;} else if(e.key==='ArrowRight'){steerKeyDir=1;} });
    ww.addEventListener('keyup', function(){ steerKeyDir=0; });

    /* ================= content ================= */
    var POWER=[95,90,88,84,80,92];
    function animBars(){ Array.prototype.forEach.call(document.querySelectorAll('.track i'), function(b){ var w=b.getAttribute('data-w')+'%'; if(reduce){b.style.width=w;return;} requestAnimationFrame(function(){requestAnimationFrame(function(){b.style.width=w;});}); }); }

    function renderStatic(){
      var lang=CJC.lang(), zh=lang==='zh';
      document.title=(zh?'蔡杰超':'Cai Jiechao')+' — Road Trip';
      set('brand-name', zh?'蔡杰超 · GT':'CAI · GT'); set('brand-sub', zh?'大巡游':'GRAND TOUR');
      set('spd-unit','KM/H'); updateMirror();

      set('hero-greet', t(P.greeting)); set('hero-name', t(P.name));
      set('hero-headline', t(P.headline)); set('hero-title', t(P.title));
      var cv0=document.getElementById('hero-cv'); cv0.innerHTML='<i class="fa fa-download" aria-hidden="true"></i> '+esc(t(P.ui.download_cv)); cv0.href=t(P.cv);
      var gh=document.getElementById('hero-gh'); gh.innerHTML='<i class="fa fa-github" aria-hidden="true"></i> GitHub'; gh.href=P.contact.github;

      var img=document.getElementById('about-img'); img.src=P.avatar; img.alt=t(P.name); img.onerror=function(){this.onerror=null;this.src='/index_page/img/blogs/1.jpg';};
      setHTML('about-text', P.bio.map(function(b){return '<p>'+esc(t(b))+'</p>';}).join(''));
      setHTML('about-loc', '<i class="fa fa-map-marker" aria-hidden="true"></i> '+esc(t(P.location)));

      setHTML('edu-list', P.education.map(function(e){
        return '<div class="rec"><div class="when">'+esc(e.period)+'</div><div><h4>'+esc(t(e.school))+'</h4><div class="sub">'+esc(t(e.degree))+' — '+esc(t(e.note))+'</div></div></div>';
      }).join(''));

      setHTML('skills-list', P.skills.map(function(sk,i){ var pct=POWER[i%POWER.length];
        return '<div class="gl"><div class="lab"><span class="n">'+esc(sk)+'</span><span class="v">'+pct+'%</span></div><div class="track"><i data-w="'+pct+'"></i></div></div>';
      }).join(''));
      setHTML('tags', P.skillTags.map(function(tg){return '<span class="t">'+esc(tg)+'</span>';}).join(''));
      animBars();

      setHTML('courses-list', P.courses.map(function(c){
        return '<div class="mod"><div class="ic"><i class="fa '+esc(c.icon)+'" aria-hidden="true"></i></div><h4>'+esc(t(c.title))+'</h4><p>'+esc(t(c.desc))+'</p></div>';
      }).join(''));

      setHTML('exp-list', P.experience.map(function(x){
        return '<div class="fop"><div class="top"><h4>'+esc(t(x.role))+' <span>@ '+esc(t(x.company))+'</span></h4><span class="when">'+esc(x.period)+'</span></div>'
          +'<p class="summary">'+esc(t(x.summary))+'</p><ul>'+x.bullets.map(function(b){return '<li>'+esc(t(b))+'</li>';}).join('')+'</ul></div>';
      }).join(''));

      setHTML('certs-list', P.certificates.map(function(c){
        return '<div class="acc"><img src="'+esc(c.image)+'" alt="'+esc(t(c.title))+'" onerror="this.onerror=null;this.src=\'/index_page/img/blogs/1.jpg\'">'
          +'<div class="ac"><div class="m"><span>'+esc(t(c.tag))+'</span><span>'+esc(t(c.date))+'</span></div><h4>'+esc(t(c.title))+'</h4><p>'+esc(t(c.desc))+'</p></div></div>';
      }).join(''));

      setHTML('contact-info', [
        ['fa-envelope','Email',P.contact.email,'mailto:'+P.contact.email,true],
        ['fa-phone','Phone',P.contact.phone,P.contact.phoneHref,true],
        ['fa-github','GitHub','@'+P.contact.githubUser,P.contact.github,false],
        ['fa-weixin','WeChat','QR',P.contact.wechatQrPage,false]
      ].map(function(r){ return '<a href="'+esc(r[3])+'"'+(r[4]?'':' target="_blank" rel="noopener"')+'><span class="ci-key"><i class="fa '+r[0]+'" aria-hidden="true"></i>'+esc(r[1])+'</span><span class="ci-val">'+esc(r[2])+'</span></a>'; }).join(''));
      set('lb-name',t(P.ui.name_placeholder)); set('lb-email',t(P.ui.email_placeholder)); set('lb-msg',t(P.ui.msg_placeholder));
      document.getElementById('cf-name').placeholder=t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder=t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder=t(P.ui.msg_placeholder);
      document.getElementById('cf-send').innerHTML='<i class="fa fa-paper-plane" aria-hidden="true"></i> '+esc(t(P.ui.send));
      setHTML('foot-social',
        '<a href="'+P.contact.github+'" target="_blank" rel="noopener"><i class="fa fa-github"></i> GitHub</a>'
        +'<a href="mailto:'+P.contact.email+'"><i class="fa fa-envelope"></i> Email</a>'
        +'<a href="/admin.html"><i class="fa fa-cog"></i> '+esc(t(P.ui.admin_panel))+'</a>');
      set('foot-desc', t(P.ui.footer_desc));
      var icp=document.getElementById('foot-icp'); icp.textContent=P.icp; icp.href=P.icpUrl;

      setHTML('exits', SECTIONS.map(function(s,i){ return '<button type="button" data-i="'+i+'" class="'+(i===active?'on':'')+'">'+i+' · '+esc(t(s.ex))+'</button>'; }).join(''));
      Array.prototype.forEach.call(document.querySelectorAll('#exits button'), function(b){ b.addEventListener('click', function(){ go(+b.dataset.i); }); });

      setHTML('filters', P.articleFilters.map(function(f){ return '<button type="button" data-k="'+esc(f.key)+'" class="'+(f.key===filterKey?'active':'')+'">'+esc(t(f.label))+'</button>'; }).join(''));
      Array.prototype.forEach.call(document.querySelectorAll('#filters button'), function(b){ b.addEventListener('click', function(){ filterKey=b.dataset.k; renderArticles(); Array.prototype.forEach.call(document.querySelectorAll('#filters button'),function(x){x.classList.toggle('active',x.dataset.k===filterKey);}); }); });

      go(active);
    }

    function renderProjects(){
      var box=document.getElementById('projects-list');
      if(!projects.length){ box.innerHTML='<div class="load-note">'+esc(t(P.ui.no_projects))+'</div>'; return; }
      box.innerHTML=projects.map(function(p){ return '<a class="card" href="'+esc(p.href)+'"><span class="thumb" style="display:grid;place-items:center;color:var(--accent2)"><i class="fa fa-map-signs"></i></span><div class="mid"><div class="r1">'+esc(p.tech_stack||t(P.ui.tech_stack))+'</div><h4>'+esc(p.localTitle())+'</h4></div><span class="time">'+esc(p.dateText())+'</span></a>'; }).join('');
    }
    function renderArticles(){
      var box=document.getElementById('articles-list'), list=CJC.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML='<div class="load-note">'+esc(t(P.ui.no_articles))+'</div>'; return; }
      box.innerHTML=list.map(function(a){ return '<a class="card" href="'+esc(a.href)+'"><img class="thumb" src="'+esc(a.cover_image||'')+'" alt="" onerror="this.onerror=null;this.src=\'/index_page/img/blogs/1.jpg\'"><div class="mid"><div class="r1">'+esc(a.category||'—')+'</div><h4>'+esc(a.localTitle())+'</h4></div><span class="time">'+esc(a.dateText())+'</span></a>'; }).join('');
    }
    function loadDynamic(){
      CJC.fetchProjects().then(function(l){projects=l;renderProjects();}).catch(function(){ document.getElementById('projects-list').innerHTML='<div class="load-note">&#9888; '+esc(t(P.ui.no_projects))+'</div>'; });
      CJC.fetchArticles().then(function(l){articles=l;renderArticles();}).catch(function(){ document.getElementById('articles-list').innerHTML='<div class="load-note">&#9888; '+(CJC.lang()==='zh'?'内容加载失败':'Failed to load.')+'</div>'; });
    }

    document.getElementById('cf').addEventListener('submit', function(e){
      e.preventDefault(); var f=e.target, s=document.getElementById('cf-status');
      s.style.color='#8effc8'; s.textContent=t(P.ui.sending);
      CJC.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value})
        .then(function(r){ s.style.color='#37d67a'; s.textContent=r.message||'Message sent.'; f.reset(); })
        .catch(function(err){ s.style.color='#ff6a60'; s.textContent=err.message; });
    });

    window.addEventListener('resize', function(){ resize(); });

    document.addEventListener('DOMContentLoaded', function(){
      CJC.setTheme(window.THEME_ID);
      buildWheel();
      makeGauge(document.getElementById('g-tach'), {majorCount:8, labels:['0','1','2','3','4','5','6','7','8'], redFrom:7/8, color:'#ff3b30', needleId:'tach-needle'});
      makeGauge(document.getElementById('g-speed'), {majorCount:8, labels:['0','','80','','160','','240','','260'], redFrom:null, color:'#ff9a3c', needleId:'speed-needle'});
      tachNeedle=document.getElementById('tach-needle'); speedNeedle=document.getElementById('speed-needle');
      resize();
      if(reduce){ document.body.classList.add('reduced'); }
      renderStatic();
      CJC.mountSwitcher({ accent:'#ff7a00' });
      CJC.onLang(function(){ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
      if(!reduce){ requestAnimationFrame(step); }
      else { drawRoad(); updateInstruments(); }
    });
  })();
  </script>
</body>
</html>

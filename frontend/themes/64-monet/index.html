    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--sans);overflow-x:hidden}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}button{cursor:pointer}.skip{position:absolute;left:12px;top:-60px;background:var(--moss);color:#fff;padding:10px 14px;z-index:100000}.skip:focus{top:12px}.shell{width:min(1280px,calc(100% - 48px));margin:auto}.eyebrow{font:500 10px/1.2 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--sage)}.rule{height:1px;background:var(--line);border:0;margin:22px 0}.page-nav{height:82px;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line)}.wordmark{font:600 25px/1 var(--serif);letter-spacing:-.03em}.wordmark span{font-style:italic;color:var(--rose)}.links{display:flex;gap:18px;padding-right:194px;white-space:nowrap}.links a{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase}.links a:hover{color:var(--rose)}.hero{padding:20px 0 88px}.hero-grid{display:grid;grid-template-columns:minmax(300px,.88fr) minmax(400px,1.36fr);min-height:650px;border-bottom:1px solid var(--line)}.hero-copy{padding:8vh 5.2vw 56px 0;display:flex;flex-direction:column;justify-content:space-between}.hero-copy h1{font:600 clamp(64px,9.4vw,154px)/.68 var(--serif);letter-spacing:-.08em;margin:12px 0 28px;max-width:650px}.hero-copy h1 em{color:var(--rose);font-weight:400}.hero-intro{max-width:430px;margin:0;color:#405047;font-size:15px}.hero-actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:27px}.button{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:10px 17px;border:1px solid var(--ink);font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;transition:.22s ease}.button.primary{background:var(--moss);color:#fff;border-color:var(--moss)}.button.primary:hover{background:var(--rose);border-color:var(--rose);transform:translateY(-2px)}.button.secondary:hov     section{padding:108px 0;border-bottom:1px solid var(--line)}.section-head{display:grid;grid-template-columns:180px 1fr;gap:22px;margin-bottom:45px}.section-head h2{font:500 clamp(43px,6vw,84px)/.76 var(--serif);letter-spacing:-.06em;margin:0}.section-head h2 em{font-weight:400;color:var(--rose)}.section-lead{max-width:510px;align-self:end;color:var(--muted);font-size:14px}.about-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(28px,6vw,110px);align-items:center}.portrait{position:relative;max-width:430px;aspect-ratio:4/5;margin:auto;background:var(--soft);overflow:hidden}.portrait img{width:100%;height:100%;object-fit:cover;filter:saturate(.62) sepia(.12)}.portrait figcaption{position:absolute;left:0;bottom:0;right:0;padding:18px 20px;color:#fff;background:linear-gradient(transparent,rgba(26,39,30,.68));font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase}.about-copy{max-width:560px}.about-copy p{font:400 clamp(22px,2.4vw,31px)/1.27 var(--serif);letter-spacing:-.025em;margin:0 0 22px}.about-copy p:last-of-type{font-size:17px;line-height:1.65;font-family:var(--sans);letter-spacing:0;color:var(--muted)}.location{display:flex;align-items:center;gap:10px;margin-top:28px;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--sage)}.location i{color:var(--rose);font-size:15px}.education{background:var(--moss);color:#f6f0e7}.education .eyebrow{color:#d8ba92}.education .section-head h2 em{color:#efd4cd}.education .section-lead{color:#c6d0c2}.edu-grid{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid rgba(255,255,255,.24)}.edu-card{min-height:220px;padding:27px 30px 28px;border-right:1px solid rgba(255,255,255,.24);position:relative}.edu-card:last-child{border-right:0}.edu-card time{font:500 10px var(--mono);letter-spacing:.1em;color:#c9d4c5}.edu-card h3{font:500 34px/.92 var(--serif);letter-spacing:-.045em;margin:35px 0 12px}.edu-card p{margin:0;color:#d8e0d4;font-size:13px}.garden-row{disp var(--mono);letter-spacing:.12em;margin-bottom:auto}.project time,.article time{font:500 10px var(--mono);color:var(--sage);letter-spacing:.08em;text-transform:uppercase}.project h3,.article h3{font:600 31px/.91 var(--serif);letter-spacing:-.045em;margin:12px 0 9px}.project p,.article p{margin:0;color:var(--muted);font-size:12px}.project .tags{margin-top:16px;font:500 9px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--rose)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 28px}.filters button{background:transparent;border:1px solid var(--line);padding:8px 12px;color:var(--ink);font:500 10px var(--mono);letter-spacing:.07em;text-transform:uppercase}.filters button.active,.filters button:hover{background:var(--moss);border-color:var(--moss);color:#fff}.article-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.article{border-top:1px solid var(--ink);padding-top:14px}.article img{width:100%;height:174px;object-fit:cover;margin:15px 0;filter:saturate(.72)}.article .more{display:inline-block;margin-top:16px;font:500 10px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--rose)}.cert-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.certificate{display:grid;grid-template-columns:170px 1fr;gap:20px;padding:18px;border:1px solid var(--line);background:var(--cream)}.certificate img{width:100%;height:145px;object-fit:cover}.certificate h3{font:600 29px/.91 var(--serif);letter-spacing:-.04em;margin:13px 0 9px}.certificate p{color:var(--muted);font-size:12px;margin:0}.contact{background:var(--rose-pale)}.contact-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(28px,8vw,150px)}.contact-copy h2{font:500 clamp(57px,8.5vw,125px)/.7 var(--serif);letter-spacing:-.07em;margin:12px 0 27px}.contact-copy h2 em{color:#fffaf3}.contact-copy p{max-width:360px;color:#614841}.contact-links{border-top:1px solid rgba(83,53,44,.32);margin-top:27px}.contact-links a{display:flex;justify-content:space-betwee <body>
  <a class="skip" href="#content">Skip to content</a>

  <script>window.THEME_ID='64-monet';</script>
  <script src="/shared/profile.js"></script><script src="/shared/site-data.js"></script>
  <script>
  (()=>{'use strict';const P=CJCData.profile,t=CJCData.t.bind(CJCData),e=CJCData.escapeHtml;let projects=[],articles=[],filter='all';const L={en:{nav:[['about','The Atelier'],['education','The Terrace'],['work','The Parterre'],['journal','The Journal'],['contact','Correspondence']],heroArt:'Garden axis · A study in order',heroAlt:'A formal French palace garden with clipped hedges and a central axis',about:'The Atelier',aboutLead:'A considered study in code, systems, and quiet ambition.',education:'The Terrace',educationLead:'A formal foundation, cultivated with patient curiosity.',garden:'The Parterre',gardenLead:'A cultivated collection of tools, arranged for craft.',courses:'The Conservatory',coursesLead:'Six disciplines that keep the work in balance.',experience:'The Residency',experienceLead:'One season of work, measured in outcomes.',projects:'The Parterre',projectsLead:'Selected works, planted with intent.',journal:'The Journal',journalLead:'Notes from the studio, field, and workshop.',cert:'The Cabinet',certLead:'Honours and milestones kept in the archive.',contact:'Correspondence',contactLead:'For a new commission, a thoughtful question, or simply a hello.',loc:'Based in',artNote:'Garden study / 01',view:'Visit project',read:'Read journal',failed:'Content could not be loaded. Please return to the garden shortly.',send:'Send correspondence',sending:'Sending…',sent:'Your note has been sent.',name:'Your name',email:'Your email',message:'Your message',cv:'Curriculum vitae',github:'Github'},zh:{nav:[['about','工作室'],['education','露台'],['work','花圃'],['journal','手记'],['contact','来信']],heroArt:'花园中轴 · 一场秩序习作',heroAlt:'修剪绿篱和中轴线构成的法式宫廷花园',about:'工作室',aboutLead:'在代码、系统与安静的野心中反复推敲。',education:'露台',educationLead:'以耐心的好奇心培育的扎实基础。',garden:'花圃',gardenLead:'一组为创作而细心布置的工具。',courses:'温室',coursesLead:'让作品保持平衡的六门学科。',experience:'驻留',experienceLead:'一段以成果衡量的工作季。',projects:'花圃',projectsLead:'有意栽种的精选作品。',journal:'手记',journalLead:'来自工作室、田野与工坊的笔记。',cert:'珍藏室',certLead:'收录在档案中的荣誉与里程碑。',contact:'来信',contactLead:'为了新的合作、真诚的问题，或只是打一声招呼。',loc:'常驻',artNote:'花园习作 / 01',view:'查看项目',read:'阅读手记',failed:'内容暂时无法加载，请稍后再回来看看。',send:'寄出这封信',sending:'发送中…',sent:'来信已寄出。',name:'你的姓名',email:'你的邮箱',message:'想说的话',cv:'下载简历',github:'Github'}};const l=()=>L[CJCData.lang()];const sectionHead=(id,k)=>`<div class="section-head reveal"><div class="eyebrow">${e(k)}</div><div><h2>${e(k)}</h2><p class="section-lead">${e(l()[id+'Lead']||'')}</p></div></div>`;const link=(href,label)=>`<a href="${e(href)}">${e(label)}</a>`;
  function hero(){const x=l();return `<section class="hero" id="top"><div class="shell hero-grid"><div class="hero-copy"><div><div class="eyebrow">${e(t(P.greeting))}</div><h1>${e(t(P.name).split(' ')[0]||t(P.name))}<br><em>${e((t(P.name).split(' ').slice(1).join(' ')||P.brand))}</em></h1><p class="hero-intro">${e(t(P.headline))}. ${e(t(P.title))}</p><div class="hero-actions"><a class="button primary" href="${e(t(P.cv))}" download><i class="fa fa-download" aria-hidden="true"></i>${e(x.cv)}</a><a class="button secondary" href="${e(P.contact.github)}" target="_blank" rel="noopener"><i class="fa fa-github" aria-hidden="true"></i>${e(x.github)}</a></div></div><div class="hero-caption"><span>${e(t(P.role))}</span><span>${e(t(P.location))}</span></div></div><figure class="hero-art"><img src="/themes/64-monet/assets/garden-axis.jpg" alt="${e(x.heroAlt)}"><figcaption class="art-note"><strong>${e(x.artNote)}</strong><small>${e(x.heroArt)}</small></figcaption><span class="seal" aria-hidden="true">CJ</span></figure></div></section>`}
  function about(){const x=l();return `<section id="about"><div class="shell">${sectionHead('about',x.about)}<div class="about-grid"><figure class="portrait reveal"><img src="${e(P.avatar)}" alt="Portrait of ${e(t(P.name))}"><figcaption>${e(x.loc)} · ${e(t(P.location))}</figcaption></figure><div class="about-copy reveal"><p>${e(t(P.bio[0]))}</p><p>${e(t(P.bio[1]))}</p><div class="location"><i class="fa fa-map-marker" aria-hidden="true"></i>${e(x.loc)} · ${e(t(P.location))}</div></div></div></div></section>`}
  function education(){const x=l();return `<section id="education" class="education"><div class="shell">${sectionHead('education',x.education)}<div class="edu-grid reveal">${P.education.map(s=>`<article class="edu-card"><time>${e(s.period)}</time><h3>${e(t(s.school))}</h3><p>${e(t(s.degree))}<br>${e(t(s.note))}</p></article>`).join('')}</div></div></section>`}
  function skillsCourses(){const x=l();return `<section id="skills"><div class="shell">${sectionHead('garden',x.garden)}<div class="garden-row reveal"><figure class="garden-image"><img loading="lazy" src="/themes/64-monet/assets/formal-garden.jpg" alt="A historic palace-garden grotto with sculptural figures"></figure><div class="skill-panel"><div class="eyebrow">${e(t(P.ui.core_tech))}</div><h3>${e(t(P.role))}<br><em>in bloom.</em></h3><div class="skill-list">${P.skillTags.map(s=>`<span>${e(s)}</span>`).join('')}</div></div></div><div class="rule"></div>${sectionHead('courses',x.courses)}<div class="courses reveal">${P.courses.map(c=>`<article class="course"><i class="fa ${e(c.icon)}" aria-hidden="true"></i><h3>${e(t(c.title))}</h3><p>${e(t(c.desc))}</p></article>`).join('')}</div></div></section>`}
  function experience(){const x=l(),v=P.experience[0];return `<section id="experience" class="experience"><div class="shell">${sectionHead('experience',x.experience)}<div class="experience-grid reveal"><div class="experience-role">${e(v.period)}<br><br>${e(t(v.company))}</div><div><h3>${e(t(v.role))}</h3><p>${e(t(v.summary))}</p><ul>${v.bullets.map(b=>`<li>${e(t(b))}</li>`).join('')}</ul></div></div></div></section>`}
  function projectsView(){const x=l();let body=projects.length?`<div class="project-grid reveal">${projects.map((p,i)=>`<a class="project" href="${e(p.href)}"><span class="num">${String(i+1).padStart(2,'0')} / ${e(x.view)}</span><time>${e(p.dateText())}</time><h3>${e(p.localTitle())}</h3><p>${e(p.localSummary()||'')}</p><div class="tags">${e(p.tech_stack||t(P.ui.tech_stack))}</div></a>`).join('')}</div>`:`<p class="loading">${e(t(P.ui.loading_projects))}</p>`;return `<section id="work"><div class="shell">${sectionHead('projects',x.projects)}<div id="project-body">${body}</div></div></section>`}
  function articlesView(){const x=l(),list=CJCData.filterArticles(articles,filter);let body=!articles.length?`<p class="loading">${e(t(P.ui.loading_articles))}</p>`:!list.length?`<p class="loading">${e(t(P.ui.no_articles))}</p>`:`<div class="article-grid reveal">${list.map(a=>`<article class="article"><time>${e(a.category||'')} · ${e(a.dateText())}</time><img loading="lazy" src="${e(a.cover_image||'/index_page/img/blogs/1.jpg')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""><h3>${e(a.localTitle())}</h3><p>${e(a.localSummary()||'')}</p><a class="more" href="${e(a.href)}">${e(x.read)} →</a></article>`).join('')}</div>`;return `<section id="journal"><div class="shell">${sectionHead('journal',x.journal)}<div class="filters" aria-label="Article categories">${P.articleFilters.map(f=>`<button type="button" data-filter="${e(f.key)}" class="${filter===f.key?'active':''}">${e(t(f.label))}</button>`).join('')}</div><div id="article-body">${body}</div></div></section>`}
  function certificates(){const x=l();return `<section id="certificates"><div class="shell">${sectionHead('cert',x.cert)}<div class="cert-grid reveal">${P.certificates.map(c=>`<article class="certificate"><img loading="lazy" src="${e(c.image)}" alt="${e(t(c.title))}"><div><div class="eyebrow">${e(t(c.tag))} · ${e(t(c.date))}</div><h3>${e(t(c.title))}</h3><p>${e(t(c.desc))}</p></div></article>`).join('')}</div></div></section>`}
  function contact(){const x=l();return `<section id="contact" class="contact"><div class="shell">${sectionHead('contact',x.contact)}<div class="contact-grid"><div class="contact-copy reveal"><h2>${e(x.contact)}<br><em>à bientôt.</em></h2><p>${e(t(P.ui.inbox_open))}</p><div class="contact-links"><a href="mailto:${e(P.contact.email)}"><span>Email</span><span>${e(P.contact.email)}</span></a><a href="${e(P.contact.phoneHref)}"><span>Phone</span><span>${e(P.contact.phone)}</span></a><a href="${e(P.contact.github)}" target="_blank" rel="noopener"><span>Github</span><span>@${e(P.contact.githubUser)}</span></a><a href="${e(P.contact.wechatQrPage)}"><span>WeChat</span><span>QR →</span></a></div></div><form class="reveal" id="contact-form"><input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true"><label for="contact-name">${e(x.name)}</label><input id="contact-name" name="name" autocomplete="name" required><label for="contact-email">${e(x.email)}</label><input id="contact-email" type="email" name="email" autocomplete="email" required><label for="contact-message">${e(x.message)}</label><textarea id="contact-message" name="message" required></textarea><button class="button primary" type="submit">${e(x.send)} <i class="fa fa-arrow-right" aria-hidden="true"></i></button><p id="status" role="status" aria-live="polite"></p></form></div></div></section>`}
  function render(){const x=l();document.title=`${t(P.name)} — Jardin d'Études`;document.getElementById('nav').innerHTML=x.nav.map(v=>`<a href="#${e(v[0])}">${e(v[1])}</a>`).join('');document.getElementById('content').innerHTML=hero()+about()+education()+skillsCourses()+experience()+projectsView()+articlesView()+certificates()+contact();document.getElementById('footer-note').textContent=t(P.ui.footer_desc);document.getElementById('footer-links').innerHTML=`${link(P.contact.github,'Github')}${link('mailto:'+P.contact.email,'Email')}${link(P.contact.wechatQrPage,'WeChat')}${link('/admin.html',t(P.ui.admin_panel))}${link(P.icpUrl,P.icp)}`;wire();observe()}
  function wire(){document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;render()}));const f=document.getElementById('contact-form');if(f)f.addEventListener('submit',async ev=>{ev.preventDefault();const s=document.getElementById('status'),x=l(),btn=f.querySelector('button');btn.disabled=true;s.textContent=x.sending;try{const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});s.textContent=r.message||x.sent;f.reset()}catch(err){s.textContent=err.message||x.failed}finally{btn.disabled=false}})}
  let observer;function observe(){if(matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('.reveal').forEach(n=>n.classList.add('in'));return}if(observer)observer.disconnect();observer=new IntersectionObserver(es=>es.forEach(v=>{if(v.isIntersecting){v.target.classList.add('in');observer.unobserve(v.target)}}),{threshold:.11});document.querySelectorAll('.reveal').forEach(n=>observer.observe(n))}
  document.addEventListener('DOMContentLoaded',async()=>{CJCData.setTheme(window.THEME_ID);render();CJCData.mountSwitcher({accent:'#71836d'});CJCData.onLang(render);try{[projects,articles]=await Promise.all([CJCData.fetchProjects(),CJCData.fetchArticles()]);render()}catch(err){const x=l();document.querySelectorAll('.loading').forEach(n=>{n.className='failure';n.textContent=x.failed})}});
  })();
  </script>
</body></html>

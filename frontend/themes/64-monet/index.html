<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Water Lilies</title>
  <meta name="description" content="A living impressionist garden at Giverny — a water-lily pond that ripples and shifts with the light. The personal site of Cai Jiechao, painted." />
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Petit+Formal+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{
      --water:#7aa6c2; --water2:#9fc0d4; --water-deep:#4d7d99;
      --lav:#b7a8d9; --green:#8fbf87; --green2:#6ea672; --green3:#4f7a52;
      --lily:#e79ec0; --lily2:#f2b8d0; --gold:#c8a04a; --frame:#b98f3e;
      --ink:#39474a; --ink2:#546268; --mut:#7c8890; --line:rgba(57,71,74,.16);
      --placard:#f5ecd6; --placard2:#efe3c8;
      --disp:'Fraunces',Georgia,'Songti SC',serif;
      --serif:'Cormorant Garamond',Georgia,serif;
      --sign:'Petit Formal Script',cursive;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;color:var(--ink);font-family:var(--serif);font-size:19px;line-height:1.72;overflow-x:hidden;
      background:#d3e2de}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    h1,h2,h3,h4{font-family:var(--disp);font-weight:500;margin:0}
    ::selection{background:var(--water);color:#fff}
    :focus-visible{outline:2px solid var(--water-deep);outline-offset:3px;border-radius:3px}
    .wrap{max-width:1040px;margin:0 auto;padding:0 22px;position:relative;z-index:3}

    /* painterly canvas texture over whole page background */
    .canvas-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
      background:
        radial-gradient(240px 170px at 10% 16%,rgba(183,168,217,.45),transparent 62%),
        radial-gradient(280px 190px at 84% 10%,rgba(122,166,194,.5),transparent 62%),
        radial-gradient(250px 180px at 70% 46%,rgba(143,191,135,.5),transparent 62%),
        radial-gradient(220px 160px at 22% 66%,rgba(231,158,192,.38),transparent 62%),
        radial-gradient(260px 200px at 92% 78%,rgba(122,166,194,.4),transparent 62%),
        linear-gradient(180deg,#dbe7e1,#cfe0da 55%,#d7e3d4)}
    .canvas-tex{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;mix-blend-mode:soft-light}

    /* ---------- scene "paints itself" reveal ---------- */
    .easel-wipe{position:fixed;inset:0;z-index:8000;background:#efe6cf;pointer-events:none;
      animation:wipeAway 1.9s ease 1.15s forwards}
    @keyframes wipeAway{to{opacity:0;visibility:hidden}}
    .reveal{opacity:0;animation:paintIn 1.5s ease .2s forwards}
    @keyframes paintIn{from{opacity:0;filter:blur(16px);transform:scale(1.04)}to{opacity:1;filter:blur(0);transform:scale(1)}}
    .reveal.d1{animation-delay:.45s}.reveal.d2{animation-delay:.75s}.reveal.d3{animation-delay:1.05s}

    /* ---------- the garden (hero) ---------- */
    .garden{position:relative;width:100%;height:88vh;min-height:560px;overflow:hidden;isolation:isolate;
      box-shadow:inset 0 -40px 80px rgba(40,70,60,.25)}
    .garden .scene{position:absolute;inset:0;width:100%;height:100%}
    .garden svg.scene-svg{position:absolute;inset:0;width:100%;height:100%}
    /* the light-series tint overlays (same scene, different light) */
    .light-layer{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.4s ease;mix-blend-mode:soft-light;z-index:2}
    .light-layer.on{opacity:1}
    .ll-morning{background:linear-gradient(180deg,rgba(255,214,224,.55),rgba(190,205,225,.4) 55%,rgba(150,180,190,.3))}
    .ll-noon{background:radial-gradient(900px 500px at 60% 8%,rgba(255,248,214,.5),transparent 60%),linear-gradient(180deg,rgba(150,205,230,.28),transparent 60%)}
    .ll-golden{background:radial-gradient(800px 520px at 72% 14%,rgba(255,196,120,.6),transparent 62%),linear-gradient(180deg,rgba(255,170,120,.35),rgba(200,120,150,.25))}
    .ll-dusk{background:linear-gradient(180deg,rgba(120,110,190,.5),rgba(90,110,160,.42) 55%,rgba(60,80,120,.5))}
    .garden.rm-static .light-layer{transition:none}

    /* ripple canvas over pond */
    .ripple-cv{position:absolute;inset:0;z-index:3;pointer-events:none}
    .pond-hit{position:absolute;left:0;right:0;bottom:0;top:40%;z-index:4;cursor:crosshair}

    /* frog easter egg */
    .frog{position:absolute;z-index:6;width:46px;height:34px;pointer-events:none;transform:translate(-50%,-50%)}

    /* signature easter egg */
    .signature{position:absolute;right:22px;bottom:16px;z-index:7;cursor:pointer;background:none;border:0;padding:6px 10px;
      font-family:var(--sign);color:#2f4a55;font-size:clamp(22px,3vw,30px);line-height:1;text-shadow:0 1px 2px rgba(255,255,255,.4);
      transition:transform .2s}
    .signature:hover{transform:rotate(-2deg) scale(1.04)}
    .signature .s{display:block;transition:opacity .5s ease}
    .signature .s.hide{opacity:0;position:absolute;inset:0}
    .sign-sub{position:absolute;right:24px;bottom:2px;z-index:7;font-family:var(--serif);font-style:italic;font-size:12px;color:#39474a;opacity:.7}

    /* hero identity placard on the water */
    .id-plac{position:absolute;left:5%;bottom:8%;z-index:5;max-width:min(460px,86%);
      background:linear-gradient(180deg,rgba(245,236,214,.94),rgba(239,227,200,.92));
      border:1px solid rgba(184,143,62,.5);border-radius:8px;padding:26px 30px;
      box-shadow:0 22px 50px rgba(40,60,70,.32);backdrop-filter:blur(3px)}
    .id-plac::before{content:"";position:absolute;inset:7px;border:1px solid rgba(184,143,62,.4);border-radius:5px;pointer-events:none}
    .id-plac .greet{font-family:var(--sign);color:var(--water-deep);font-size:24px;line-height:1}
    .id-plac h1{font-size:clamp(34px,5.4vw,58px);line-height:.98;margin:2px 0 4px;color:var(--ink);font-style:italic}
    .id-plac .role{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--green3)}
    .id-plac .tag{color:var(--ink2);font-size:17px;margin:8px 0 14px;max-width:40ch}
    .id-btns{display:flex;flex-wrap:wrap;gap:12px}
    .btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--serif);font-weight:600;font-size:17px;
      padding:10px 22px;border-radius:999px;cursor:pointer;transition:.18s;border:1px solid transparent}
    .btn.pri{background:linear-gradient(135deg,var(--water),var(--water-deep));color:#fff;box-shadow:0 10px 22px rgba(77,125,153,.35)}
    .btn.pri:hover{transform:translateY(-2px)}
    .btn.gho{border-color:var(--frame);color:#7a5f22;background:rgba(255,252,244,.7)}
    .btn.gho:hover{background:#fff;transform:translateY(-2px)}
    @media(max-width:600px){.id-plac{left:5%;right:5%;bottom:6%;max-width:none;padding:20px 20px}}

    /* light-series control */
    .light-ctrl{position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:12px;
      background:rgba(245,236,214,.82);border:1px solid rgba(184,143,62,.4);border-radius:999px;padding:8px 16px;
      backdrop-filter:blur(6px);box-shadow:0 8px 20px rgba(40,60,70,.2);max-width:92vw}
    .light-ctrl .lbl{font-family:var(--serif);font-weight:600;font-size:14px;color:var(--ink2);white-space:nowrap}
    .light-ctrl input[type=range]{width:150px;accent-color:var(--water-deep)}
    .light-ctrl .now{font-family:var(--disp);font-style:italic;font-size:14px;color:var(--water-deep);min-width:64px;text-align:center}
    .light-ctrl .auto{border:1px solid var(--frame);background:transparent;color:#7a5f22;border-radius:999px;
      font-family:var(--serif);font-weight:600;font-size:13px;padding:4px 12px;cursor:pointer}
    .light-ctrl .auto.on{background:var(--frame);color:#fff}
    @media(min-width:901px){.light-ctrl{left:auto;right:232px;transform:none;top:16px}}
    @media(max-width:900px){.light-ctrl{top:58px}}
    @media(max-width:520px){.light-ctrl input[type=range]{width:96px}.light-ctrl .lbl{display:none}}

    /* scroll hint */
    .scroll-hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;text-align:center;
      font-family:var(--serif);font-style:italic;color:#3a4a45;font-size:14px;opacity:.8;animation:bobHint 2.4s ease-in-out infinite}
    @keyframes bobHint{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(6px)}}

    /* ---------- content: painted placards ---------- */
    main{position:relative;z-index:3}
    section{padding:52px 0;position:relative}
    .placard{position:relative;background:linear-gradient(180deg,var(--placard),var(--placard2));border-radius:10px;
      padding:40px 44px 44px;box-shadow:0 22px 50px rgba(50,70,70,.18);border:1px solid rgba(184,143,62,.35)}
    .placard::before{content:"";position:absolute;inset:9px;border:1px solid rgba(184,143,62,.32);border-radius:6px;pointer-events:none}
    @media(max-width:560px){.placard{padding:30px 20px 34px}}
    .plaque{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(180deg,#d9b25e,#b98f3e);color:#3a2c0e;
      font-family:var(--serif);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px;
      padding:5px 14px;border-radius:4px;box-shadow:0 3px 8px rgba(120,90,30,.3);margin-bottom:14px}
    .sec-head{text-align:center;margin-bottom:8px}
    .sec-head h2{font-size:clamp(28px,4.6vw,44px);color:var(--ink);font-style:italic}
    .brush-div{height:16px;margin:14px auto 26px;max-width:220px;
      background:radial-gradient(closest-side,rgba(122,166,194,.6),transparent) 0 50%/40px 12px no-repeat,
        radial-gradient(closest-side,rgba(143,191,135,.6),transparent) 60px 50%/40px 12px no-repeat,
        radial-gradient(closest-side,rgba(231,158,192,.55),transparent) 120px 50%/40px 12px no-repeat,
        radial-gradient(closest-side,rgba(183,168,217,.55),transparent) 180px 50%/40px 12px no-repeat}

    /* about */
    .about{display:grid;grid-template-columns:230px 1fr;gap:30px;align-items:start}
    @media(max-width:680px){.about{grid-template-columns:1fr;justify-items:center;text-align:center}}
    .about-frame{position:relative;padding:12px;background:linear-gradient(135deg,#d9b25e,#a97f34);border-radius:6px;
      box-shadow:0 16px 34px rgba(60,50,20,.35)}
    .about-frame::after{content:"";position:absolute;inset:6px;border:2px solid rgba(255,240,200,.5);border-radius:3px;pointer-events:none}
    .about-frame img{width:100%;aspect-ratio:.86;object-fit:cover;border-radius:2px;filter:saturate(1.02) contrast(1.02)}
    .about p{margin:0 0 14px;font-size:19px;color:var(--ink)}
    @media(min-width:681px){.about p{text-align:left}}
    .loc{display:inline-flex;gap:8px;align-items:center;color:var(--water-deep);font-weight:600;font-family:var(--serif);font-size:18px}

    /* rows */
    .rows{display:flex;flex-direction:column;gap:22px}
    .rowi{padding-left:28px;position:relative}
    .rowi::before{content:"❧";position:absolute;left:0;top:0;color:var(--green2);font-size:20px}
    .rowi .p{font-family:var(--serif);color:var(--water-deep);font-weight:600;font-size:16px;letter-spacing:.02em}
    .rowi h3{margin:2px 0 4px;font-size:23px;color:var(--ink);font-style:italic}
    .rowi .s{color:var(--ink2);font-size:17px}
    .rowi ul{margin:10px 0 0;padding-left:20px;line-height:1.8}
    .rowi ul li{margin-bottom:4px;color:var(--ink2)}

    /* skills */
    .skills{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    @media(max-width:640px){.skills{grid-template-columns:1fr 1fr}}
    @media(max-width:420px){.skills{grid-template-columns:1fr}}
    .sk{position:relative;text-align:center;padding:18px 14px;border-radius:14px;
      background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.7),rgba(240,232,210,.5));
      border:1px solid var(--line);transition:.18s}
    .sk:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(60,80,80,.16)}
    .sk .dab{font-size:22px}
    .sk .v{margin-top:6px;font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink)}
    .tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
    .tags span{font-family:var(--serif);font-weight:600;font-size:15px;padding:6px 16px;border-radius:999px;
      border:1px solid var(--water);color:var(--water-deep);background:rgba(255,255,255,.5);transition:.16s}
    .tags span:hover{background:var(--water);color:#fff;transform:translateY(-2px)}

    /* courses */
    .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    @media(max-width:760px){.courses{grid-template-columns:1fr 1fr}}
    @media(max-width:480px){.courses{grid-template-columns:1fr}}
    .course{padding:22px;border:1px solid var(--line);border-radius:14px;text-align:center;transition:.18s;
      background:radial-gradient(circle at 50% 20%,rgba(255,255,255,.65),rgba(240,232,210,.45))}
    .course:hover{transform:translateY(-4px);box-shadow:0 16px 30px rgba(60,80,80,.18)}
    .course i.fa{color:var(--green2);font-size:26px}
    .course h4{margin:12px 0 8px;font-size:20px;color:var(--ink);font-style:italic}
    .course p{margin:0;color:var(--ink2);font-size:16px}

    /* framed-painting cards (projects + articles) */
    .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
    @media(max-width:860px){.gallery{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:520px){.gallery{grid-template-columns:1fr}}
    .frame{position:relative;background:linear-gradient(135deg,#d9b25e,#a97f34);padding:12px 12px 0;border-radius:6px;
      box-shadow:0 16px 34px rgba(60,50,20,.32);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;overflow:hidden}
    .frame:hover{transform:translateY(-6px);box-shadow:0 26px 46px rgba(60,50,20,.42)}
    .frame::after{content:"";position:absolute;left:6px;right:6px;top:6px;bottom:60px;border:2px solid rgba(255,240,200,.45);border-radius:3px;pointer-events:none;z-index:2}
    .frame .canvas{height:170px;overflow:hidden;background:linear-gradient(135deg,#cfe0dd,#b7cfd0);border-radius:2px}
    .frame .canvas img{width:100%;height:100%;object-fit:cover;transition:.5s;filter:saturate(.98) contrast(1.03)}
    .frame:hover .canvas img{transform:scale(1.06)}
    .frame .label{background:linear-gradient(180deg,#efe3c8,#e4d4ad);padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
    .frame .meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--serif);font-weight:600;font-size:12.5px;
      color:var(--water-deep);text-transform:uppercase;letter-spacing:.05em}
    .frame h4{font-family:var(--disp);font-style:italic;font-size:20px;color:var(--ink);line-height:1.2}
    .frame .tech{font-family:var(--serif);color:#7a5f22;font-weight:600;font-size:14px}
    .frame p{margin:0;color:var(--ink2);font-size:14.5px;line-height:1.5}
    .frame .more{font-family:var(--serif);color:var(--water-deep);font-weight:700;font-size:14px;margin-top:2px}

    .filters{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-bottom:24px}
    .filters button{font-family:var(--serif);font-weight:600;font-size:15px;background:rgba(255,255,255,.5);border:1px solid var(--line);
      color:var(--ink2);padding:6px 18px;border-radius:999px;cursor:pointer;transition:.15s}
    .filters button.active,.filters button:hover{background:var(--water-deep);border-color:var(--water-deep);color:#fff}
    .load-note{grid-column:1/-1;color:var(--mut);text-align:center;padding:20px;border:1px dashed var(--line);border-radius:12px;
      font-family:var(--serif);font-style:italic;font-size:17px}

    /* certificates */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    @media(max-width:600px){.certs{grid-template-columns:1fr}}
    .cert{display:grid;grid-template-columns:120px 1fr;border-radius:8px;overflow:hidden;
      background:linear-gradient(135deg,#d9b25e,#a97f34);padding:10px;gap:0}
    .cert img{width:100%;height:100%;object-fit:cover;min-height:150px;border-radius:3px 0 0 3px;background:#cfe0dd}
    .cert .ct{padding:14px 16px;background:linear-gradient(180deg,#efe3c8,#e4d4ad);border-radius:0 3px 3px 0}
    .cert .meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--serif);font-size:13px;color:var(--water-deep);
      text-transform:uppercase;letter-spacing:.04em;font-weight:600}
    .cert h4{margin:8px 0 6px;font-size:20px;color:var(--ink);font-style:italic}
    .cert p{margin:0;color:var(--ink2);font-size:14.5px}
    @media(max-width:400px){.cert{grid-template-columns:92px 1fr}}

    /* contact */
    .contact{display:grid;grid-template-columns:1fr 1.2fr;gap:28px}
    @media(max-width:760px){.contact{grid-template-columns:1fr}}
    .cinfo a{display:flex;justify-content:space-between;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);
      font-family:var(--serif);font-weight:600;font-size:17px}
    .cinfo a span:last-child{color:var(--water-deep)}
    form label{display:block;font-family:var(--serif);font-size:14px;color:var(--water-deep);margin:0 0 5px;font-weight:600}
    form input,form textarea{width:100%;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:10px;color:var(--ink);
      font-family:var(--serif);font-size:17px;padding:12px 13px;margin-bottom:14px}
    form input:focus,form textarea:focus{outline:none;border-color:var(--water-deep);box-shadow:0 0 0 3px rgba(122,166,194,.2)}
    form textarea{min-height:120px;resize:vertical}
    #cf-status{font-family:var(--serif);font-weight:700;margin-top:2px;font-size:16px;min-height:1.4em}

    footer{padding:44px 0 60px;text-align:center;position:relative;z-index:3}
    .fsoc{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
    .fsoc a{color:var(--ink2);font-family:var(--serif);font-weight:600;font-size:16px}
    .fsoc a:hover{color:var(--water-deep)}
    .muted{color:var(--mut);font-size:14px;margin-top:4px;font-family:var(--serif)}
    .muted a{color:var(--mut)}.muted a:hover{color:var(--water-deep)}

    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *{animation:none!important}
      .easel-wipe{display:none}
      .reveal{opacity:1!important;filter:none!important;transform:none!important}
      .scroll-hint{display:none}
    }
  </style>
</head>
<body>
  <div class="canvas-bg" aria-hidden="true"></div>
  <svg class="canvas-tex" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#paper)" opacity="0.5"/>
  </svg>
  <div class="easel-wipe" aria-hidden="true"></div>

  <!-- ============ THE GARDEN (hero) ============ -->
  <header class="garden" id="garden">
    <svg class="scene-svg reveal" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid slice" aria-label="An impressionist water-lily pond with a Japanese bridge at Giverny" role="img">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#cfe3d8"/><stop offset="1" stop-color="#b9d4c9"/>
        </linearGradient>
        <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9fc0d4"/><stop offset=".5" stop-color="#7aa6c2"/><stop offset="1" stop-color="#4d7d99"/>
        </linearGradient>
        <filter id="brush"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="2" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/></filter>
        <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
        <filter id="soft2"><feGaussianBlur stdDeviation="12"/></filter>
      </defs>

      <!-- sky + distant foliage -->
      <rect x="0" y="0" width="1200" height="330" fill="url(#sky)"/>
      <g class="reveal d1" filter="url(#soft2)" opacity=".95">
        <ellipse cx="120" cy="250" rx="220" ry="150" fill="#7fae7a"/>
        <ellipse cx="420" cy="210" rx="260" ry="140" fill="#6ea672"/>
        <ellipse cx="760" cy="230" rx="300" ry="160" fill="#8fbf87"/>
        <ellipse cx="1080" cy="220" rx="240" ry="150" fill="#6ea672"/>
        <ellipse cx="980" cy="150" rx="180" ry="110" fill="#a7cf9a"/>
      </g>
      <!-- weeping willow strands -->

  (function(){

    var articles=[], projects=[], filterKey="all";
    var dabs=['🎨','🌿','💧','🌸','🍃','🖌️'];

    var STR={
      lightLbl:{en:"Light",zh:"光"},
      auto:{en:"Auto",zh:"自动"},
      times:[{en:"Morning",zh:"清晨"},{en:"Midday",zh:"正午"},{en:"Golden",zh:"黄昏金"},{en:"Dusk",zh:"暮色"}],
      signSub:{en:"— after Monet",zh:"— 仿莫奈"},
      scroll:{en:"the garden continues below ❧",zh:"庭园在下方延展 ❧"},
      plaque:{
        about:{en:"Salon I",zh:"展厅 一"},edu:{en:"Salon II",zh:"展厅 二"},skills:{en:"Salon III",zh:"展厅 三"},
        courses:{en:"Salon IV",zh:"展厅 四"},exp:{en:"Salon V",zh:"展厅 五"},projects:{en:"Gallery",zh:"画廊"},
        articles:{en:"Reading Room",zh:"阅览室"},certs:{en:"Accolades",zh:"荣誉"},contact:{en:"Atelier",zh:"画室"}
      }
    };
    var lightIds=['ll-morning','ll-noon','ll-golden','ll-dusk'];

    function renderStatic(){
      var zh=CJC.lang()==='zh';
      document.title=(zh?'蔡杰超':'Cai Jiechao')+' — '+(zh?'睡莲':'Water Lilies');
      // hero placard
      document.getElementById('greet').textContent=t(P.greeting);
      document.getElementById('name').textContent=t(P.name);
      document.getElementById('role').textContent=t(P.role);
      document.getElementById('tag').textContent=t(P.title);
      var cv=document.getElementById('cvBtn'); cv.href=t(P.cv); cv.querySelector('span').textContent=t(P.ui.download_cv);
      document.getElementById('ghBtn').href=P.contact.github;
      document.getElementById('light-lbl').textContent=t(STR.lightLbl);
      document.getElementById('light-auto').textContent=t(STR.auto);
      document.getElementById('sig-b').textContent=t(P.name);
      document.getElementById('sign-sub').textContent=t(STR.signSub);
      document.getElementById('scroll-hint').textContent=t(STR.scroll);
      updateLightLabel();
      // plaques + titles
      var PL=STR.plaque;
      function pl(id,k,l){ document.getElementById('p-'+id).textContent=t(PL[k]); document.getElementById('l-'+id).textContent=t(l); }
      pl('about','about',P.ui.about_me); pl('edu','edu',P.ui.education_bg); pl('skills','skills',P.ui.core_tech);
      pl('courses','courses',P.ui.core_courses); pl('exp','exp',P.ui.internship_exp); pl('projects','projects',P.ui.latest_projects);
      pl('articles','articles',P.ui.latest_articles); pl('certs','certs',P.ui.certificates); pl('contact','contact',P.ui.get_in_touch);
      // about
      document.getElementById('portrait').src=P.avatar;
      document.getElementById('bio').innerHTML=P.bio.map(function(b){return '<p>'+esc(t(b))+'</p>';}).join('');
      document.getElementById('loc').innerHTML='<i class="fa fa-map-marker" aria-hidden="true"></i> '+esc(t(P.location));
      // education
      document.getElementById('edu').innerHTML=P.education.map(function(e){return '<div class="rowi"><div class="p">'+esc(e.period)+'</div><h3>'+esc(t(e.school))+'</h3><div class="s">'+esc(t(e.degree))+' — '+esc(t(e.note))+'</div></div>';}).join('');
      // skills
      document.getElementById('skills-box').innerHTML=P.skills.map(function(s,i){return '<div class="sk"><div class="dab">'+dabs[i%dabs.length]+'</div><div class="v">'+esc(s)+'</div></div>';}).join('');
      document.getElementById('tags').innerHTML=P.skillTags.map(function(x){return '<span>'+esc(x)+'</span>';}).join('');
      // courses
      document.getElementById('courses-box').innerHTML=P.courses.map(function(c){return '<div class="course"><i class="fa '+esc(c.icon)+'" aria-hidden="true"></i><h4>'+esc(t(c.title))+'</h4><p>'+esc(t(c.desc))+'</p></div>';}).join('');
      // experience
      document.getElementById('exp').innerHTML=P.experience.map(function(x){return '<div class="rowi"><div class="p">'+esc(x.period)+'</div><h3>'+esc(t(x.role))+' · '+esc(t(x.company))+'</h3><div class="s">'+esc(t(x.summary))+'</div><ul>'+x.bullets.map(function(b){return '<li>'+esc(t(b))+'</li>';}).join('')+'</ul></div>';}).join('');
      // certificates
      document.getElementById('certs').innerHTML=P.certificates.map(function(c){return '<div class="cert"><img src="'+esc(c.image)+'" alt="'+esc(t(c.title))+'" onerror="this.src=\'/index_page/img/blogs/1.jpg\'"><div class="ct"><div class="meta"><span>'+esc(t(c.tag))+'</span><span>'+esc(t(c.date))+'</span></div><h4>'+esc(t(c.title))+'</h4><p>'+esc(t(c.desc))+'</p></div></div>';}).join('');
      // contact
      document.getElementById('cinfo').innerHTML=[
        ['Email',P.contact.email,'mailto:'+P.contact.email],['Phone',P.contact.phone,P.contact.phoneHref],
        ['GitHub','@'+P.contact.githubUser,P.contact.github],['WeChat','QR ↗',P.contact.wechatQrPage]
      ].map(function(x){return '<a href="'+esc(x[2])+'"><span>'+esc(x[0])+'</span><span>'+esc(x[1])+'</span></a>';}).join('');
      document.getElementById('lb-name').textContent=t(P.ui.name_placeholder);
      document.getElementById('lb-email').textContent=t(P.ui.email_placeholder);
      document.getElementById('lb-msg').textContent=t(P.ui.msg_placeholder);
      document.getElementById('cf-name').placeholder=t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder=t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder=t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent=t(P.ui.send);
      // footer
      document.getElementById('fsoc').innerHTML=
        '<a href="'+P.contact.github+'" target="_blank" rel="noopener">GitHub</a>'+
        '<a href="mailto:'+P.contact.email+'">Email</a>'+
        '<a href="'+P.contact.wechatQrPage+'">WeChat</a>'+
        '<a href="/admin.html">'+esc(t(P.ui.admin_panel))+'</a>';
      document.getElementById('foot-desc').textContent=t(P.ui.footer_desc);
      var icp=document.getElementById('foot-icp'); icp.textContent=P.icp; icp.href=P.icpUrl;
      // filters
      document.getElementById('filters').innerHTML=P.articleFilters.map(function(f){return '<button data-k="'+esc(f.key)+'" class="'+(f.key===filterKey?'active':'')+'">'+esc(t(f.label))+'</button>';}).join('');
      Array.prototype.forEach.call(document.querySelectorAll('#filters button'),function(b){b.addEventListener('click',function(){filterKey=b.dataset.k;renderStatic();renderArticles();});});
    }

    function cover(src){ return '<div class="canvas"><img src="'+esc(src||'/index_page/img/blogs/1.jpg')+'" onerror="this.src=\'/index_page/img/blogs/1.jpg\'" alt=""></div>'; }
    function renderProjects(){
      var box=document.getElementById('projects-box');
      if(!projects.length){ box.innerHTML='<div class="load-note">'+esc(t(P.ui.no_projects))+'</div>'; return; }
      box.innerHTML=projects.map(function(p){return '<a class="frame" href="'+esc(p.href)+'">'+cover(p.cover_image)
        +'<div class="label"><div class="meta"><span>'+esc(t(P.ui.tech_stack))+'</span><span>'+esc(p.dateText())+'</span></div>'
        +'<h4>'+esc(p.localTitle())+'</h4><div class="tech">'+esc(p.tech_stack||'')+'</div><p>'+esc(p.localSummary()||'')+'</p>'
        +'<span class="more">'+esc(t(P.ui.view_project))+' →</span></div></a>';}).join('');
    }
    function renderArticles(){
      var box=document.getElementById('articles-box');
      var list=CJC.filterArticles(articles,filterKey);
      if(!list.length){ box.innerHTML='<div class="load-note">'+esc(t(P.ui.no_articles))+'</div>'; return; }
      box.innerHTML=list.map(function(a){return '<a class="frame" href="'+esc(a.href)+'">'+cover(a.cover_image)
        +'<div class="label"><div class="meta"><span>'+esc(a.category||'')+'</span><span>'+esc(a.dateText())+'</span></div>'
        +'<h4>'+esc(a.localTitle())+'</h4><p>'+esc(a.localSummary()||'')+'</p>'
        +'<span class="more">'+esc(t(P.ui.read_more))+' →</span></div></a>';}).join('');
    }
    function loadDynamic(){
      CJC.fetchProjects().then(function(d){projects=d;renderProjects();}).catch(function(){document.getElementById('projects-box').innerHTML='<div class="load-note">⚠ '+esc(t(P.ui.no_projects))+'</div>';});
      CJC.fetchArticles().then(function(d){articles=d;renderArticles();}).catch(function(){document.getElementById('articles-box').innerHTML='<div class="load-note">⚠ Failed to load / 内容加载失败</div>';});
    }

    document.getElementById('cf').addEventListener('submit',function(e){
      e.preventDefault();
      var f=e.target,s=document.getElementById('cf-status');
      s.style.color='var(--mut)'; s.textContent=t(P.ui.sending);
      CJC.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value})
        .then(function(r){s.style.color='var(--water-deep)';s.textContent='✓ '+(r.message||'Sent.');f.reset();})
        .catch(function(err){s.style.color='#b5546f';s.textContent='✗ '+err.message;});
    });

    /* ---------- lily pads + lilies (SVG) ---------- */
    var padData=[
      [180,470,64,26],[360,560,80,34],[560,470,58,24],[720,610,92,38],[930,520,70,30],
      [300,680,86,36],[640,700,74,30],[1000,660,80,34],[120,600,60,26],[840,470,54,22],[480,650,64,26]
    ];
    function buildPads(){
      var g=document.getElementById('pads'); if(!g) return; g.innerHTML='';
      padData.forEach(function(d,i){
        var wrap=document.createElementNS(NS,'g'); wrap.setAttribute('class','padwrap');
        var pad=document.createElementNS(NS,'ellipse');
        pad.setAttribute('cx',d[0]); pad.setAttribute('cy',d[1]); pad.setAttribute('rx',d[2]); pad.setAttribute('ry',d[3]);
        pad.setAttribute('fill', i%2? '#5f9464':'#6ea672'); pad.setAttribute('filter','url(#brush)'); pad.setAttribute('opacity','.92');
        // notch
        var notch=document.createElementNS(NS,'path');
        notch.setAttribute('d','M'+d[0]+' '+d[1]+' L'+(d[0]+d[2]*0.7)+' '+(d[1]-d[3]*0.5)+' L'+(d[0]+d[2]*0.7)+' '+(d[1]+d[3]*0.5)+' Z');
        notch.setAttribute('fill', i%2? '#547f57':'#5f9464');
        wrap.appendChild(pad); wrap.appendChild(notch);
        // a lily on some pads (bloom on hover)
        if(i%2===0){
          var lily=document.createElementNS(NS,'g'); lily.setAttribute('class','lily');
          lily.style.transformBox='fill-box'; lily.style.transformOrigin='center'; lily.style.transition='transform .35s ease';
          var pc=d[0]-d[2]*0.15, py=d[1];
          for(var a=0;a<8;a++){
            var ang=a/8*Math.PI*2, pe=document.createElementNS(NS,'ellipse');
            pe.setAttribute('cx',pc+Math.cos(ang)*8); pe.setAttribute('cy',py+Math.sin(ang)*8);
            pe.setAttribute('rx',9); pe.setAttribute('ry',4.4);
            pe.setAttribute('transform','rotate('+(ang*180/Math.PI)+' '+(pc+Math.cos(ang)*8)+' '+(py+Math.sin(ang)*8)+')');
            pe.setAttribute('fill', i%4===0? '#f2b8d0':'#f6ede0'); lily.appendChild(pe);
          }
          var core=document.createElementNS(NS,'circle'); core.setAttribute('cx',pc); core.setAttribute('cy',py); core.setAttribute('r',6); core.setAttribute('fill','#f2c94c'); lily.appendChild(core);
          wrap.appendChild(lily);
        }
        if(!reduce){ wrap.style.animation='padBob '+(3.4+i*0.3)+'s ease-in-out '+(i*0.2)+'s infinite'; wrap.style.transformBox='fill-box'; wrap.style.transformOrigin='center'; }
        g.appendChild(wrap);
      });
    }
    // inject keyframes for pad bob + lily bloom via a style tag (SVG hover)
    var kf=document.createElement('style');
    kf.textContent='@keyframes padBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}'
      +'.padwrap:hover .lily{transform:scale(1.35)!important}'
      +'@media(prefers-reduced-motion:reduce){.padwrap{animation:none!important}}';
    document.head.appendChild(kf);

    /* ---------- ripple canvas ---------- */
    var rc=document.getElementById('ripple-cv'), rctx=rc.getContext('2d'), garden=document.getElementById('garden');
    var ripples=[], rRaf=null;
    function rcSize(){ var b=garden.getBoundingClientRect(); rc.width=b.width; rc.height=b.height; }
    function addRipple(x,y,big){ if(reduce) return; ripples.push({x:x,y:y,r:big?6:2,max:big?150:70,a:big?.7:.45,w:big?3:1.6});
      if(big){ ripples.push({x:x,y:y,r:2,max:big?95:50,a:.5,w:2}); } if(!rRaf) rDraw(); }
    function rDraw(){
      rctx.clearRect(0,0,rc.width,rc.height);
      for(var i=ripples.length-1;i>=0;i--){ var p=ripples[i];
        p.r+=1.6; p.a-=0.008;
        if(p.a<=0||p.r>p.max){ ripples.splice(i,1); continue; }
        rctx.beginPath(); rctx.ellipse(p.x,p.y,p.r,p.r*0.4,0,0,6.28);
        rctx.strokeStyle='rgba(255,255,255,'+Math.max(0,p.a)+')'; rctx.lineWidth=p.w; rctx.stroke();
      }
      if(ripples.length){ rRaf=requestAnimationFrame(rDraw); } else { rRaf=null; }
    }
    var lastMove=0;
    var hit=document.getElementById('pond-hit');
    hit.addEventListener('pointermove',function(e){ var now=Date.now(); if(now-lastMove<70) return; lastMove=now;
      var b=garden.getBoundingClientRect(); addRipple(e.clientX-b.left,e.clientY-b.top,false); },{passive:true});

    /* ---------- frog easter egg ---------- */
    var frogBusy=false;
    function frogLeap(x,y){
      if(reduce||frogBusy) return; frogBusy=true;
      var b=garden.getBoundingClientRect();
      var frog=document.createElement('div'); frog.className='frog';
      frog.innerHTML='<svg viewBox="0 0 46 34" xmlns="http://www.w3.org/2000/svg"><g fill="#5f9c58" stroke="#3c6b3a" stroke-width="1.5">'
        +'<ellipse cx="23" cy="22" rx="15" ry="9"/><circle cx="14" cy="12" r="5"/><circle cx="32" cy="12" r="5"/>'
        +'<ellipse cx="7" cy="26" rx="7" ry="3.2"/><ellipse cx="39" cy="26" rx="7" ry="3.2"/></g>'
        +'<circle cx="14" cy="11" r="1.8" fill="#20351f"/><circle cx="32" cy="11" r="1.8" fill="#20351f"/></svg>';
      var startX=x, startY=y, endX=x+(Math.random()*200-100), endY=y-40-Math.random()*40;
      frog.style.left=startX+'px'; frog.style.top=startY+'px'; frog.style.opacity='1';
      garden.appendChild(frog);
      var t0=null, dur=700;
      function step(ts){ if(!t0)t0=ts; var k=Math.min(1,(ts-t0)/dur);
        var cx=startX+(endX-startX)*k, arc=Math.sin(k*Math.PI)*120, cy=startY+(endY-startY)*k-arc;
        frog.style.left=cx+'px'; frog.style.top=cy+'px'; frog.style.transform='translate(-50%,-50%) rotate('+(k*20-10)+'deg)';
        if(k<1){ requestAnimationFrame(step); } else {
          addRipple(endX, endY, true); frog.remove(); frogBusy=false;
        }
      }
      requestAnimationFrame(step);
    }
    hit.addEventListener('click',function(e){ var b=garden.getBoundingClientRect(); var x=e.clientX-b.left, y=e.clientY-b.top;
      addRipple(x,y,true); frogLeap(x,y); });

    /* ---------- light-series ---------- */
    var lightIndex=1, autoOn=false, autoTimer=null;
    function setLight(idx){ lightIndex=(idx+4)%4;
      lightIds.forEach(function(id,i){ document.getElementById(id).classList.toggle('on', i===lightIndex); });
      document.getElementById('light-slider').value=lightIndex; updateLightLabel();
    }
    function updateLightLabel(){ document.getElementById('light-now').textContent=t(STR.times[lightIndex]); }
    document.getElementById('light-slider').addEventListener('input',function(){ if(autoOn) toggleAuto(); setLight(parseInt(this.value,10)); });
    function toggleAuto(){ autoOn=!autoOn; var btn=document.getElementById('light-auto'); btn.classList.toggle('on',autoOn);
      if(autoOn && !reduce){ autoTimer=setInterval(function(){ setLight(lightIndex+1); }, 4200); } else { clearInterval(autoTimer); } }
    document.getElementById('light-auto').addEventListener('click',toggleAuto);

    /* ---------- signature morph ---------- */
    document.getElementById('signature').addEventListener('click',function(){
      var a=document.getElementById('sig-a'), b=document.getElementById('sig-b');
      var showB=a.classList.contains('hide')?false:true;
      a.classList.toggle('hide',showB); b.classList.toggle('hide',!showB);
      // a little ripple flourish under the signature
      var r=this.getBoundingClientRect(), gb=garden.getBoundingClientRect();
      addRipple(r.left-gb.left+r.width/2, r.top-gb.top+r.height/2, true);
    });

    /* ---------- boot ---------- */
    document.addEventListener('DOMContentLoaded',function(){
      CJC.setTheme(window.THEME_ID);
      renderStatic();
      CJC.mountSwitcher({accent:'#4d7d99'});
      CJC.onLang(function(){ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
      buildPads();
      rcSize(); window.addEventListener('resize',rcSize);
      if(reduce){ garden.classList.add('rm-static'); }
    });
  })();
  </script>
</body>
</html>

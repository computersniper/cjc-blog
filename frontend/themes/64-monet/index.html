<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Monet Garden</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{ --water:#7aa6c2; --water2:#9fc0d4; --lav:#b7a8d9; --green:#8fbf87; --green2:#6ea672; --lily:#e79ec0;
      --ink:#3c4650; --mut:#6d7a84; --line:rgba(60,70,80,.14); --panel:rgba(255,255,255,.62); }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;line-height:1.7;overflow-x:hidden;
      background:#cfe0dd}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    h1,h2,h3,.disp{font-family:'Fraunces',Georgia,serif;font-weight:500}
    .wrap{max-width:1020px;margin:0 auto;padding:0 22px;position:relative;z-index:2}

    /* painterly brush-dab background (fixed) */
    .canvas-bg{position:fixed;inset:0;z-index:0;
      background:
        radial-gradient(220px 150px at 12% 18%,rgba(183,168,217,.5),transparent 60%),
        radial-gradient(260px 180px at 82% 12%,rgba(122,166,194,.5),transparent 60%),
        radial-gradient(240px 170px at 68% 44%,rgba(143,191,135,.55),transparent 60%),
        radial-gradient(200px 150px at 24% 62%,rgba(231,158,192,.4),transparent 60%),
        radial-gradient(300px 200px at 92% 78%,rgba(159,192,212,.55),transparent 60%),
        radial-gradient(240px 170px at 40% 88%,rgba(110,166,114,.45),transparent 60%),
        linear-gradient(180deg,#dce9e4,#c6dad8 55%,#b9d0d6)}
    .canvas-bg::after{content:"";position:absolute;inset:0;mix-blend-mode:soft-light;opacity:.55;
      filter:url(#brush)}
    .texlayer{position:absolute;inset:0;opacity:.4;
      background:
        radial-gradient(circle 4px at 20% 30%,rgba(255,255,255,.6),transparent),
        radial-gradient(circle 5px at 60% 50%,rgba(143,191,135,.5),transparent),
        radial-gradient(circle 4px at 80% 20%,rgba(183,168,217,.5),transparent),
        radial-gradient(circle 6px at 40% 70%,rgba(122,166,194,.5),transparent),
        radial-gradient(circle 4px at 90% 80%,rgba(231,158,192,.5),transparent);
      background-size:60px 60px;filter:blur(1.4px)}

    .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.5);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
    .topbar .row{display:flex;align-items:center;justify-content:space-between;height:60px}
    .brand{font-family:'Fraunces';font-weight:600;font-size:22px;color:var(--water)}
    .brand b{color:var(--green2)}
    .nav{display:flex;gap:20px}
    .nav a{font-size:16px;color:var(--mut);font-weight:500}
    .nav a:hover{color:var(--water)}
    @media(max-width:880px){.nav{display:none}}

    section{padding:56px 0}
    .panel{background:var(--panel);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.55);border-radius:18px;
      padding:32px;box-shadow:0 20px 44px rgba(60,80,90,.16)}
    .sec-head{margin-bottom:22px}
    .sec-head .k{color:var(--green2);font-style:italic;letter-spacing:.08em;font-size:17px}
    .sec-head h2{font-size:clamp(28px,4.6vw,46px);margin:2px 0 0}

    /* HERO */
    .hero{padding:56px 0 26px;text-align:center}
    .greet{font-style:italic;color:var(--water);font-size:22px}
    .hero h1{font-size:clamp(48px,11vw,116px);line-height:.98;margin:8px 0 6px;color:var(--ink);
      text-shadow:0 2px 20px rgba(255,255,255,.4)}
    .hero .role{font-family:'Fraunces';font-size:clamp(22px,3.2vw,32px);color:var(--green2);font-style:italic}
    .hero .tag{color:var(--mut);max-width:42ch;margin:14px auto 22px;font-size:19px}
    .btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
    .btn{display:inline-flex;align-items:center;gap:9px;font-family:'Fraunces';font-weight:500;font-size:16px;
      padding:12px 26px;border-radius:999px;cursor:pointer;transition:.16s;border:1px solid transparent}
    .btn.pri{background:var(--water);color:#fff;box-shadow:0 8px 20px rgba(122,166,194,.4)}
    .btn.pri:hover{transform:translateY(-2px);background:#6a97b5}
    .btn.gho{border-color:var(--green2);color:var(--green2);background:rgba(255,255,255,.5)}
    .btn.gho:hover{background:rgba(255,255,255,.8)}
    .bridge-wrap{max-width:640px;margin:34px auto 0}

    /* about */
    .about{display:grid;grid-template-columns:230px 1fr;gap:28px;align-items:start}
    @media(max-width:740px){.about{grid-template-columns:1fr}}
    .about .pic{border-radius:14px;overflow:hidden;border:5px solid rgba(255,255,255,.7);box-shadow:0 14px 30px rgba(60,80,90,.2)}
    .about .pic img{width:100%;aspect-ratio:1;object-fit:cover;filter:saturate(1.05) contrast(.98)}
    .about p{margin:0 0 12px;font-size:18px;max-width:60ch}
    .loc{display:inline-flex;gap:8px;align-items:center;color:var(--water);font-family:'Fraunces';font-style:italic;font-size:18px}

    /* rows */
    .rows{display:flex;flex-direction:column;gap:20px}
    .rowi{padding-left:24px;position:relative}
    .rowi::before{content:"❁";position:absolute;left:0;top:4px;color:var(--lily)}
    .rowi .p{color:var(--green2);font-style:italic;font-size:16px}
    .rowi h3{margin:2px 0 3px;font-size:24px}
    .rowi .s{color:var(--mut)}
    .rowi ul{margin:8px 0 0;padding-left:20px;line-height:1.8}

    /* skills */
    .skills{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    @media(max-width:640px){.skills{grid-template-columns:1fr 1fr}}
    @media(max-width:420px){.skills{grid-template-columns:1fr}}
    .sk{border:1px solid rgba(255,255,255,.6);border-radius:50% 50% 50% 50%/62% 62% 38% 38%;padding:20px 14px;text-align:center;
      background:rgba(255,255,255,.42)}
    .sk .h{color:var(--lily);font-size:18px}
    .sk .v{margin-top:5px;font-family:'Fraunces';font-size:16px}
    .tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
    .tags span{font-size:16px;padding:6px 16px;border-radius:999px;border:1px solid var(--water);color:var(--water);background:rgba(255,255,255,.4)}

    /* courses */
    .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    @media(max-width:760px){.courses{grid-template-columns:1fr 1fr}}
    @media(max-width:480px){.courses{grid-template-columns:1fr}}
    .course{padding:22px;border:1px solid rgba(255,255,255,.6);border-radius:16px;background:rgba(255,255,255,.42);transition:.16s;text-align:center}
    .course:hover{transform:translateY(-4px);box-shadow:0 16px 30px rgba(60,80,90,.18)}
    .course i.fa{color:var(--green2);font-size:26px}
    .course h4{margin:12px 0 8px;font-size:20px}
    .course p{margin:0;color:var(--mut);font-size:16px}

    /* cards */
    .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
    @media(max-width:640px){.cards{grid-template-columns:1fr}}
    .card{border:1px solid rgba(255,255,255,.6);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;
      background:rgba(255,255,255,.5);transition:.16s;box-shadow:0 12px 28px rgba(60,80,90,.14)}
    .card:hover{transform:translateY(-5px);box-shadow:0 22px 42px rgba(60,80,90,.24)}
    .card .cover{height:190px;overflow:hidden;background:#cfe0dd}
    .card .cover img{width:100%;height:100%;object-fit:cover;transition:.5s;filter:saturate(1.08) contrast(.97)}
    .card:hover .cover img{transform:scale(1.05)}
    .cbody{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
    .ctag{display:flex;justify-content:space-between;font-style:italic;font-size:15px;color:var(--green2)}
    .card h4{margin:0;font-size:23px;line-height:1.25}
    .card p{margin:0;color:var(--mut);font-size:16px;flex:1}
    .tech{color:var(--water);font-style:italic;font-size:15px}
    .more{color:var(--lily);font-family:'Fraunces';font-size:15px}

    .filters{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:24px}
    .filters button{font-family:'Cormorant Garamond';font-weight:600;font-size:17px;background:rgba(255,255,255,.4);border:1px solid var(--line);
      color:var(--mut);padding:5px 18px;border-radius:999px;cursor:pointer;transition:.15s}
    .filters button.active,.filters button:hover{background:var(--water);border-color:var(--water);color:#fff}

    /* certs */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    @media(max-width:600px){.certs{grid-template-columns:1fr}}
    .cert{display:grid;grid-template-columns:120px 1fr;border:1px solid rgba(255,255,255,.6);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.5)}
    .cert img{width:100%;height:100%;object-fit:cover;min-height:140px}
    .cert .ct{padding:16px}
    .cert .meta{display:flex;justify-content:space-between;font-style:italic;font-size:15px;color:var(--green2)}
    .cert h4{margin:8px 0 6px;font-size:20px}
    .cert p{margin:0;color:var(--mut);font-size:15px}
    @media(max-width:400px){.cert{grid-template-columns:88px 1fr}}

    /* contact */
    .contact{display:grid;grid-template-columns:1fr 1.2fr;gap:26px}
    @media(max-width:760px){.contact{grid-template-columns:1fr}}
    .cinfo a{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:13px 0;border-bottom:1px solid var(--line);font-weight:600}
    .cinfo a span{min-width:0;overflow-wrap:anywhere}
    .cinfo a span:last-child{color:var(--water)}
    form input,form textarea{width:100%;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:12px;color:var(--ink);
      font-family:inherit;font-size:17px;padding:14px;margin-bottom:13px}
    form input:focus,form textarea:focus{outline:none;border-color:var(--water)}
    form textarea{min-height:120px;resize:vertical}
    #cf-status{font-weight:600;margin-top:4px;font-size:15px}

    footer{padding:40px 0 60px;text-align:center}
    .fsoc{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
    .fsoc a{color:var(--mut);font-weight:600;font-size:15px}
    .fsoc a:hover{color:var(--water)}
    .muted{color:#8494a0;font-size:15px;margin-top:12px}
    .load-note{grid-column:1/-1;color:var(--mut);text-align:center;padding:18px;border:1px dashed var(--line);border-radius:12px}

    @media(prefers-reduced-motion:reduce){ *{scroll-behavior:auto} }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="brush"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/></filter>
  </svg>
  <div class="canvas-bg" aria-hidden="true"><div class="texlayer"></div></div>

  <div class="topbar"><div class="wrap row">
    <a class="brand" href="#top">Cai<b>Jiechao</b></a>
    <nav class="nav" id="nav"></nav>
  </div></div>

  <div id="top"></div>
  <header class="hero"><div class="wrap">
    <div class="greet" id="greet"></div>
    <h1 id="name"></h1>
    <div class="role" id="role"></div>
    <p class="tag" id="tag"></p>
    <div class="btns">
      <a class="btn pri" id="cvBtn" download><i class="fa fa-leaf"></i><span></span></a>
      <a class="btn gho" id="ghBtn" target="_blank" rel="noopener"><i class="fa fa-github"></i>GitHub</a>
    </div>
    <div class="bridge-wrap">
      <svg viewBox="0 0 640 220" role="img" aria-label="Japanese garden bridge over a water-lily pond">
        <defs><linearGradient id="pond" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9fc0d4"/><stop offset="1" stop-color="#6b96b0"/></linearGradient></defs>
        <rect x="0" y="140" width="640" height="80" fill="url(#pond)"/>
        <!-- ripples -->
        <path d="M20 168 q40 -8 80 0 t80 0 t80 0 t80 0 t80 0 t80 0" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2"/>
        <path d="M0 190 q50 -8 100 0 t100 0 t100 0 t100 0 t100 0 t100 0" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
        <!-- bridge arch -->
        <path d="M40 150 Q320 20 600 150" fill="none" stroke="#5f8f6a" stroke-width="16" stroke-linecap="round"/>
        <path d="M40 150 Q320 20 600 150" fill="none" stroke="#7fae84" stroke-width="8" stroke-linecap="round"/>
        <!-- railings -->
        <path d="M40 128 Q320 6 600 128" fill="none" stroke="#4e7a58" stroke-width="5"/>
        <g stroke="#4e7a58" stroke-width="4">
          <line x1="120" y1="96" x2="120" y2="140"/><line x1="220" y1="66" x2="220" y2="118"/>
          <line x1="320" y1="56" x2="320" y2="112"/><line x1="420" y1="66" x2="420" y2="118"/>
          <line x1="520" y1="96" x2="520" y2="140"/>
        </g>
        <!-- lily pads -->
        <g>
          <ellipse cx="120" cy="176" rx="26" ry="10" fill="#6ea672" opacity=".9"/>
          <ellipse cx="300" cy="196" rx="30" ry="12" fill="#79b47d" opacity=".9"/>
          <ellipse cx="480" cy="180" rx="26" ry="10" fill="#6ea672" opacity=".9"/>
          <ellipse cx="210" cy="205" rx="22" ry="9" fill="#7fbb84" opacity=".85"/>
          <circle cx="300" cy="194" r="6" fill="#e79ec0"/><circle cx="120" cy="174" r="5" fill="#f2b6d1"/>
          <circle cx="480" cy="178" r="5" fill="#e79ec0"/>
        </g>
      </svg>
    </div>
  </div></header>

  <section id="about"><div class="wrap"><div class="panel">
    <div class="sec-head"><div class="k">Impression I</div><h2 id="l-about"></h2></div>
    <div class="about"><div class="pic"><img id="portrait" alt="Cai Jiechao portrait" /></div>
      <div><div id="bio"></div><span class="loc" id="loc"></span></div></div>
  </div></div></section>

  <section id="education"><div class="wrap"><div class="panel">
    <div class="sec-head"><div class="k">Impression II</div><h2 id="l-edu"></h2></div>
    <div class="rows" id="edu"></div>
  </div></div></section>

  <section id="skills"><div class="wrap"><div class="panel">
    <div class="sec-head"><div class="k">Impression III</div><h2 id="l-skills"></h2></div>
    <div class="skills" id="skills-box"></div>
    <div class="tags" id="tags"></div>
  </div></div></section>

  <section id="courses"><div class="wrap"><div class="panel">
    <div class="sec-head"><div class="k">Impression IV</div><h2 id="l-courses"></h2></div>
    <div class="courses" id="courses-box"></div>
  </div></div></section>

  <section id="experience"><div class="wrap"><div class="panel">
    <div class="sec-head"><div class="k">Impression V</div><h2 id="l-exp"></h2></div>
    <div class="rows" id="exp"></div>
  </div></div></section>

  <section id="projects"><div class="wrap"><div class="panel">
    <div class="sec-head"><div class="k">Impression VI</div><h2 id="l-projects"></h2></div>
    <div class="cards" id="projects-box"><div class="load-note" id="proj-load"></div></div>
  </div></div></section>

  <section id="articles"><div class="wrap"><div class="panel">
    <div class="sec-head"><div class="k">Impression VII</div><h2 id="l-articles"></h2></div>
    <div class="filters" id="filters"></div>
    <div class="cards" id="articles-box"><div class="load-note" id="art-load"></div></div>
  </div></div></section>

  <section id="certificates"><div class="wrap"><div class="panel">
    <div class="sec-head"><div class="k">Impression VIII</div><h2 id="l-certs"></h2></div>
    <div class="certs" id="certs"></div>
  </div></div></section>

  <section id="contact"><div class="wrap"><div class="panel">
    <div class="sec-head"><div class="k">En Plein Air</div><h2 id="l-contact"></h2></div>
    <div class="contact">
      <div class="cinfo" id="cinfo"></div>
      <form id="cf">
        <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
        <input type="text" name="name" id="cf-name" required>
        <input type="email" name="email" id="cf-email" required>
        <textarea name="message" id="cf-msg" required></textarea>
        <button type="submit" class="btn pri" id="cf-send"></button>
        <p id="cf-status"></p>
      </form>
    </div>
  </div></div></section>

  <footer><div class="wrap">
    <div class="fsoc" id="fsoc"></div>
    <div class="muted" id="foot-desc"></div>
    <a class="muted" id="foot-icp" target="_blank" rel="noopener" style="display:inline-block"></a>
  </div></footer>

  <script>window.THEME_ID = "64-monet";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P=CJCData.profile,t=CJCData.t.bind(CJCData),esc=CJCData.escapeHtml;
    let articles=[],projects=[],filterKey="all";
    const dabs=['✿','❁','❀','✾','❃','✽'];

    function renderStatic(){
      document.getElementById('nav').innerHTML=[
        ['about','nav_about'],['skills','nav_courses'],['projects','nav_portfolio'],
        ['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');
      document.getElementById('greet').textContent=t(P.greeting);
      document.getElementById('name').textContent=t(P.name);
      document.getElementById('role').textContent=t(P.role);
      document.getElementById('tag').textContent=t(P.title);
      const cv=document.getElementById('cvBtn'); cv.href=t(P.cv); cv.querySelector('span').textContent=t(P.ui.download_cv);
      document.getElementById('ghBtn').href=P.contact.github;
      document.getElementById('portrait').src=P.avatar;

      document.getElementById('l-about').textContent=t(P.ui.about_me);
      document.getElementById('l-edu').textContent=t(P.ui.education_bg);
      document.getElementById('l-skills').textContent=t(P.ui.core_tech);
      document.getElementById('l-courses').textContent=t(P.ui.core_courses);
      document.getElementById('l-exp').textContent=t(P.ui.internship_exp);
      document.getElementById('l-projects').textContent=t(P.ui.latest_projects);
      document.getElementById('l-articles').textContent=t(P.ui.latest_articles);
      document.getElementById('l-certs').textContent=t(P.ui.certificates);
      document.getElementById('l-contact').textContent=t(P.ui.get_in_touch);

      document.getElementById('bio').innerHTML=P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('');
      document.getElementById('loc').innerHTML=`<i class="fa fa-map-marker"></i> ${esc(t(P.location))}`;

      document.getElementById('edu').innerHTML=P.education.map(e=>`
        <div class="rowi"><div class="p">${esc(e.period)}</div>
        <h3>${esc(t(e.school))}</h3><div class="s">${esc(t(e.degree))} — ${esc(t(e.note))}</div></div>`).join('');

      document.getElementById('skills-box').innerHTML=P.skills.map((s,i)=>`
        <div class="sk"><div class="h">${dabs[i%dabs.length]}</div><div class="v">${esc(s)}</div></div>`).join('');
      document.getElementById('tags').innerHTML=P.skillTags.map(x=>`<span>${esc(x)}</span>`).join('');

      document.getElementById('courses-box').innerHTML=P.courses.map(c=>`
        <div class="course"><i class="fa ${esc(c.icon)}"></i><h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');

      document.getElementById('exp').innerHTML=P.experience.map(x=>`
        <div class="rowi"><div class="p">${esc(x.period)}</div>
        <h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3>
        <div class="s">${esc(t(x.summary))}</div>
        <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div>`).join('');

      document.getElementById('certs').innerHTML=P.certificates.map(c=>`
        <div class="cert"><img src="${esc(c.image)}" alt="${esc(t(c.title))}" onerror="this.src='/index_page/img/blogs/1.jpg'">
        <div class="ct"><div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');

      document.getElementById('cinfo').innerHTML=[
        ['Email',P.contact.email,'mailto:'+P.contact.email],
        ['Phone',P.contact.phone,P.contact.phoneHref],
        ['GitHub','@'+P.contact.githubUser,P.contact.github],
        ['WeChat','QR ↗',P.contact.wechatQrPage]
      ].map(([k,v,h])=>`<a href="${esc(h)}"><span>${esc(k)}</span><span>${esc(v)}</span></a>`).join('');
      document.getElementById('cf-name').placeholder=t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder=t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder=t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent=t(P.ui.send);

      document.getElementById('fsoc').innerHTML=`
        <a href="${P.contact.github}" target="_blank" rel="noopener">GitHub</a>
        <a href="mailto:${P.contact.email}">Email</a>
        <a href="${P.contact.wechatQrPage}">WeChat</a>
        <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent=t(P.ui.footer_desc);
      const icp=document.getElementById('foot-icp'); icp.textContent=P.icp; icp.href=P.icpUrl;

      document.getElementById('filters').innerHTML=P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box=document.getElementById('projects-box');
      if(!projects.length){ box.innerHTML=`<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML=projects.map(p=>`
        <a class="card" href="${esc(p.href)}">
          <div class="cbody">
            <div class="ctag"><span>${esc(t(P.ui.tech_stack))}</span><span>${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <p class="tech">${esc(p.tech_stack||'')}</p>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div></a>`).join('');
    }
    function renderArticles(){
      const box=document.getElementById('articles-box');
      const list=CJCData.filterArticles(articles,filterKey);
      if(!list.length){ box.innerHTML=`<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML=list.map(a=>`
        <a class="card" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
          <div class="cbody">
            <div class="ctag"><span>${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div></a>`).join('');
    }
    async function loadDynamic(){
      try{ projects=await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-box').innerHTML=`<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles=await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-box').innerHTML=`<div class="load-note">⚠ Failed to load articles.</div>`; }
    }

    document.getElementById('cf').addEventListener('submit',async(e)=>{
      e.preventDefault();
      const f=e.target,s=document.getElementById('cf-status');
      s.style.color='var(--mut)'; s.textContent=t(P.ui.sending);
      try{ const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});
        s.style.color='var(--green2)'; s.textContent=r.message||'Sent.'; f.reset(); }
      catch(err){ s.style.color='#c05a7a'; s.textContent=err.message; }
    });

    document.addEventListener('DOMContentLoaded',()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({accent:'#7aa6c2'});
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

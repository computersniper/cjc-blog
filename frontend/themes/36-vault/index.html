<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — The Vault</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Saira:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --steel0:#0e1116; --steel1:#1a222c; --panel:#141b24; --panel2:#0f151d;
      --ink:#e9edf2; --muted:#9aa7b6; --gold:#d4af37; --gold-2:#f0d67e; --gold-d:#a8842a;
      --hair:rgba(212,175,55,.28); --line:rgba(212,175,55,.14);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;color:var(--ink);font-family:'Saira',system-ui,sans-serif;line-height:1.55;
      -webkit-font-smoothing:antialiased;overflow-x:hidden;
      background:
        radial-gradient(90% 60% at 50% -8%, rgba(212,175,55,.08), transparent 55%),
        linear-gradient(160deg,var(--steel0),var(--steel1));
      background-attachment:fixed;
    }
    body::before{ /* brushed-metal texture */
      content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
      background:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),
                 repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 5px);
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    .wrap{max-width:1160px;margin:0 auto;padding:0 26px;position:relative;z-index:2}
    section{padding:72px 0;position:relative;z-index:2}
    :focus-visible{outline:2px solid var(--gold);outline-offset:3px}
    .num{font-family:'Space Mono',monospace}
    .hair{height:1px;background:linear-gradient(90deg,transparent,var(--hair) 12%,var(--hair) 88%,transparent)}

    .eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;
      color:var(--gold);margin:0 0 12px;font-family:'Space Mono',monospace}
    .eyebrow .lock{font-size:13px}
    .sec-title{font-family:'Playfair Display',serif;font-size:clamp(28px,4.4vw,48px);font-weight:700;letter-spacing:-.01em;margin:0 0 8px;line-height:1.05}
    .sec-title em{color:var(--gold);font-style:italic}
    .sec-sub{color:var(--muted);margin:0 0 32px;max-width:60ch}

    /* Steel panel with gold hairline */
    .panel{position:relative;background:linear-gradient(155deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:8px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 20px 44px -26px rgba(0,0,0,.9)}
    .panel-gold{border-color:var(--hair);box-shadow:inset 0 1px 0 rgba(212,175,55,.14),0 20px 44px -26px rgba(0,0,0,.9)}

    /* Topbar */
    .topbar{position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);
      background:linear-gradient(180deg,rgba(14,17,22,.92),rgba(14,17,22,.42));border-bottom:1px solid var(--line)}
    .topbar .row{display:flex;align-items:center;justify-content:space-between;height:60px;max-width:1160px;margin:0 auto;padding:0 26px}
    .brand{font-family:'Playfair Display',serif;font-weight:700;font-size:20px;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
    .brand .seal{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#1a1206;
      background:radial-gradient(circle at 35% 30%,var(--gold-2),var(--gold) 55%,var(--gold-d));box-shadow:0 0 12px rgba(212,175,55,.5)}
    .brand b{color:var(--gold)}
    .nav{display:flex;gap:22px}
    .nav a{font-size:12.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
    .nav a:hover{color:var(--gold)}
    @media(max-width:880px){.nav{display:none}}

    /* Hero + vault dial */
    .hero{padding:62px 0 34px}
    .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}
    .hero .greet{font-family:'Space Mono',monospace;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:13px}
    .hero h1{font-family:'Playfair Display',serif;font-size:clamp(42px,7vw,78px);line-height:1;letter-spacing:-.02em;margin:12px 0 0;font-weight:800}
    .hero h1 em{color:var(--gold);font-style:italic}
    .hero .head{font-size:clamp(16px,2.3vw,21px);color:var(--muted);margin:18px 0 0;max-width:28ch}
    .hero .meta{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:20px;color:var(--muted);font-size:14px;font-family:'Space Mono',monospace}
    .hero .meta b{color:var(--ink);font-weight:400}
    .btns{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px}
    .btn{display:inline-flex;align-items:center;gap:9px;padding:14px 26px;border-radius:6px;font-weight:600;font-size:14px;letter-spacing:.04em;cursor:pointer;
      background:linear-gradient(180deg,var(--gold-2),var(--gold) 55%,var(--gold-d));color:#231803;border:none;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 26px -10px rgba(212,175,55,.7);transition:transform .16s,box-shadow .16s}
    .btn:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 16px 32px -10px rgba(212,175,55,.85)}
    .btn.ghost{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1px var(--hair)}
    .btn.ghost:hover{background:rgba(212,175,55,.08)}

    /* The vault dial */
    .dial-wrap{display:grid;place-items:center}
    .dial{position:relative;width:min(400px,84vw);aspect-ratio:1;border-radius:50%;
      background:
        repeating-conic-gradient(from 0deg,#20272f 0deg 3deg,#2b333d 3deg 6deg);
      box-shadow:0 30px 60px -24px rgba(0,0,0,.9),inset 0 0 0 2px rgba(212,175,55,.25);
      animation:spin 60s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .dial .ring2{position:absolute;inset:10%;border-radius:50%;
      background:conic-gradient(from 0deg,#151c24,#2a333d,#151c24,#2a333d,#151c24);
      box-shadow:inset 0 0 0 1px rgba(212,175,55,.35),inset 0 12px 30px rgba(0,0,0,.6);
      display:grid;place-items:center}
    /* tick marks */
    .dial .ticks{position:absolute;inset:3%;border-radius:50%;
      background:repeating-conic-gradient(from 0deg, var(--gold) 0deg .5deg, transparent .5deg 9deg);
      -webkit-mask:radial-gradient(circle, transparent 43%, #000 44%, #000 47%, transparent 48%);
      mask:radial-gradient(circle, transparent 43%, #000 44%, #000 47%, transparent 48%);opacity:.6}
    .dial .core{position:absolute;inset:26%;border-radius:50%;overflow:hidden;
      border:3px solid rgba(212,175,55,.6);box-shadow:0 0 30px -6px rgba(212,175,55,.6),inset 0 0 24px rgba(0,0,0,.6);
      animation:spin-rev 60s linear infinite}
    @keyframes spin-rev{to{transform:rotate(-360deg)}}
    .dial .core img{width:100%;height:100%;object-fit:cover;filter:saturate(1.02) contrast(1.03)}
    .dial .spokes{position:absolute;inset:20%;border-radius:50%;pointer-events:none}
    .dial .spokes span{position:absolute;top:50%;left:50%;width:50%;height:3px;transform-origin:left center;
      background:linear-gradient(90deg,transparent,var(--gold));opacity:.55}
    .dial .hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;z-index:3;
      background:radial-gradient(circle at 35% 30%,var(--gold-2),var(--gold-d));box-shadow:0 0 16px var(--gold)}
    .dial-cap{margin-top:20px;text-align:center;font-family:'Space Mono',monospace;color:var(--muted);font-size:12.5px;letter-spacing:.1em}
    .dial-cap b{color:var(--gold)}
    @media(max-width:880px){.hero-grid{grid-template-columns:1fr;gap:30px}}

    /* Ledger rows (education / experience) */
    .ledger{border-top:1px solid var(--hair)}
    .ledger .lrow{display:grid;grid-template-columns:52px 150px 1fr auto;gap:20px;align-items:start;padding:22px 6px;border-bottom:1px solid var(--line)}
    .ledger .lidx{font-family:'Space Mono',monospace;color:var(--gold);font-size:15px}
    .ledger .when{font-family:'Space Mono',monospace;color:var(--muted);font-size:13.5px}
    .ledger h3{margin:0 0 5px;font-size:19px;font-weight:600}
    .ledger .sub{color:var(--muted);font-size:14.5px}
    .ledger ul{margin:12px 0 0;padding-left:18px;color:var(--muted);font-size:14px;line-height:1.7}
    .ledger ul li::marker{color:var(--gold)}
    .ledger .seal-badge{color:var(--gold);font-size:14px;font-family:'Space Mono',monospace;white-space:nowrap}
    @media(max-width:680px){.ledger .lrow{grid-template-columns:1fr;gap:8px}.ledger .seal-badge{display:none}}

    /* Skills — gold bars/ingots */
    .bars{display:flex;flex-wrap:wrap;gap:12px}
    .bar-chip{position:relative;padding:11px 20px;border-radius:4px;font-family:'Space Mono',monospace;font-size:13.5px;font-weight:700;color:#231803;
      background:linear-gradient(180deg,var(--gold-2),var(--gold) 55%,var(--gold-d));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 4px rgba(120,80,0,.4),0 8px 16px -8px rgba(212,175,55,.6);
      clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 100%,0 100%);transition:transform .15s}
    .bar-chip:hover{transform:translateY(-3px)}

    /* Courses grid */
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .course{padding:26px}
    .course .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
    .course .ci{width:46px;height:46px;border-radius:8px;display:grid;place-items:center;font-size:19px;color:var(--gold);flex-shrink:0;
      background:var(--panel2);box-shadow:inset 0 0 0 1px var(--hair),0 0 16px -8px var(--gold)}
    .course .cidx{font-family:'Space Mono',monospace;color:var(--muted);font-size:12px;letter-spacing:.1em}
    .course h4{margin:0;font-size:16.5px;font-weight:600;line-height:1.25}
    .course p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.6}
    @media(max-width:860px){.grid3{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.grid3{grid-template-columns:1fr}}

    /* Cards (projects/articles) as safe-deposit boxes */
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
    .card{border-radius:8px;overflow:hidden;display:flex;flex-direction:column;color:inherit;transition:transform .18s,box-shadow .18s;
      background:linear-gradient(155deg,var(--panel),var(--panel2));border:1px solid var(--line)}
    .card:hover{transform:translateY(-5px);border-color:var(--hair);box-shadow:0 26px 46px -22px rgba(0,0,0,.9),0 0 26px -14px rgba(212,175,55,.6)}
    .card .cover{height:168px;overflow:hidden;position:relative;background:#0d131b;border-bottom:1px solid var(--line)}
    .card .cover img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
    .card:hover .cover img{transform:scale(1.05)}
    .card .cbody{padding:18px;display:flex;flex-direction:column;gap:9px;flex:1}
    .card .ctag{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-family:'Space Mono',monospace}
    .card h4{margin:0;font-family:'Playfair Display',serif;font-size:18px;font-weight:700;line-height:1.25}
    .card p{margin:0;color:var(--muted);font-size:13.6px;line-height:1.55;flex:1}
    .card .tech{color:var(--gold);font-size:12.5px;font-family:'Space Mono',monospace}
    .card .more{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:6px}
    @media(max-width:860px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.cards{grid-template-columns:1fr}}

    .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
    .filters button{background:var(--panel2);color:var(--muted);border:1px solid var(--line);font-family:'Space Mono',monospace;
      font-weight:400;font-size:12.5px;letter-spacing:.04em;padding:9px 16px;border-radius:4px;cursor:pointer;transition:.15s}
    .filters button:hover{color:var(--gold);border-color:var(--hair)}
    .filters button.active{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#231803;border-color:transparent;box-shadow:0 8px 18px -8px rgba(212,175,55,.6)}

    /* Certificates */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    .cert{border-radius:8px;overflow:hidden;display:grid;grid-template-columns:130px 1fr}
    .cert img{height:100%;width:100%;object-fit:cover;border-right:1px solid var(--line)}
    .cert .ct{padding:20px}
    .cert .meta{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--gold);font-family:'Space Mono',monospace}
    .cert h4{margin:10px 0 7px;font-family:'Playfair Display',serif;font-size:17px;font-weight:700}
    .cert p{margin:0;color:var(--muted);font-size:13.4px;line-height:1.55}
    @media(max-width:640px){.certs{grid-template-columns:1fr}.cert{grid-template-columns:96px 1fr}}

    /* Contact */
    .contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:26px}
    .cinfo{padding:28px}
    .cinfo a{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);color:var(--ink);font-weight:500;font-size:14.5px}
    .cinfo a span:last-child{color:var(--gold);font-family:'Space Mono',monospace}
    form.cform{padding:28px}
    .cform input,.cform textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:5px;color:var(--ink);
      font-family:'Saira',sans-serif;font-size:14.5px;padding:14px;margin-bottom:14px;transition:border-color .15s,box-shadow .15s}
    .cform input:focus,.cform textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.16)}
    .cform textarea{min-height:130px;resize:vertical}
    #cf-status{margin:8px 0 0;font-weight:600;font-size:14px;font-family:'Space Mono',monospace}
    @media(max-width:820px){.contact-grid{grid-template-columns:1fr}}

    footer{border-top:1px solid var(--hair);padding:44px 0 60px;position:relative;z-index:2}
    .frow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center}
    footer a{color:var(--muted);font-weight:500;font-size:13.5px}
    footer a:hover{color:var(--gold)}
    .muted{color:var(--muted);font-size:12.5px;font-family:'Space Mono',monospace}
    .load-note{color:var(--muted);font-size:14px;grid-column:1/-1;padding:20px 0}

    @media (prefers-reduced-motion: reduce){
      html{scroll-behavior:auto}
      *{transition:none !important;animation:none !important}
      .dial,.dial .core{animation:none !important}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="row">
      <a class="brand" href="#top"><span class="seal" aria-hidden="true">🔒</span>Cai<b>Jiechao</b></a>
      <nav class="nav" id="nav" aria-label="Primary"></nav>
    </div>
  </div>

  <div id="top"></div>
  <header class="hero"><div class="wrap">
    <div class="hero-grid">
      <div>
        <p class="greet" id="greet"></p>
        <h1 id="name"></h1>
        <p class="head" id="headline"></p>
        <div class="meta" id="meta"></div>
        <div class="btns">
          <a class="btn" id="cvBtn" href="#" download></a>
          <a class="btn ghost" id="ghBtn" target="_blank" rel="noopener"></a>
        </div>
      </div>
      <div class="dial-wrap">
        <div class="dial" role="img" aria-label="Vault dial">
          <div class="ticks" aria-hidden="true"></div>
          <div class="ring2" aria-hidden="true">
            <div class="core"><img id="portrait" alt="" /></div>
          </div>
          <div class="spokes" id="spokes" aria-hidden="true"></div>
          <div class="hub" aria-hidden="true"></div>
        </div>
        <div class="dial-cap"><span id="dial-cap-1"></span> · <b>🔒 SECURED</b></div>
      </div>
    </div>
  </div></header>

  <section id="about"><div class="wrap">
    <p class="eyebrow"><span class="lock">🔒</span><span id="k-about"></span></p>
    <h2 class="sec-title" id="l-about"></h2>
    <div class="panel panel-gold" style="padding:30px;max-width:920px" id="about-text"></div>
  </div></section>

  <section id="education"><div class="wrap">
    <p class="eyebrow"><span class="num">02</span><span id="k-edu"></span></p>
    <h2 class="sec-title" id="l-edu"></h2>
    <div class="ledger" id="edu-list"></div>
  </div></section>

  <section id="skills"><div class="wrap">
    <p class="eyebrow"><span class="num">03</span><span id="k-skills"></span></p>
    <h2 class="sec-title" id="l-skills"></h2>
    <div class="bars" id="skills-list"></div>
  </div></section>

  <section id="courses"><div class="wrap">
    <p class="eyebrow"><span class="num">04</span><span id="k-courses"></span></p>
    <h2 class="sec-title" id="l-courses"></h2>
    <div class="grid3" id="courses-list"></div>
  </div></section>

  <section id="experience"><div class="wrap">
    <p class="eyebrow"><span class="num">05</span><span id="k-exp"></span></p>
    <h2 class="sec-title" id="l-exp"></h2>
    <div class="ledger" id="exp-list"></div>
  </div></section>

  <section id="projects"><div class="wrap">
    <p class="eyebrow"><span class="num">06</span><span id="k-proj"></span></p>
    <h2 class="sec-title" id="l-projects"></h2>
    <div class="cards" id="projects-list"><div class="load-note" id="proj-load"></div></div>
  </div></section>

  <section id="articles"><div class="wrap">
    <p class="eyebrow"><span class="num">07</span><span id="k-art"></span></p>
    <h2 class="sec-title" id="l-articles"></h2>
    <div class="filters" id="filters"></div>
    <div class="cards" id="articles-list"><div class="load-note" id="art-load"></div></div>
  </div></section>

  <section id="certificates"><div class="wrap">
    <p class="eyebrow"><span class="num">08</span><span id="k-certs"></span></p>
    <h2 class="sec-title" id="l-certs"></h2>
    <div class="certs" id="certs-list"></div>
  </div></section>

  <section id="contact"><div class="wrap">
    <p class="eyebrow"><span class="lock">🔒</span><span id="k-contact"></span></p>
    <h2 class="sec-title" id="l-contact"></h2>
    <p class="sec-sub" id="contact-sub"></p>
    <div class="contact-grid">
      <div class="cinfo panel" id="contact-info"></div>
      <form class="cform panel" id="cf">
        <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
        <input type="text" name="name" id="cf-name" required>
        <input type="email" name="email" id="cf-email" required>
        <textarea name="message" id="cf-msg" required></textarea>
        <button type="submit" class="btn" id="cf-send"></button>
        <p id="cf-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div></section>

  <footer><div class="wrap">
    <div class="frow">
      <a class="brand" href="#top" style="font-size:17px"><span class="seal" aria-hidden="true">🔒</span>Cai<b>Jiechao</b></a>
      <div class="frow" id="foot-social" style="gap:20px"></div>
    </div>
    <div class="frow" style="margin-top:18px">
      <span class="muted" id="foot-desc"></span>
      <a class="muted" id="foot-icp" target="_blank" rel="noopener"></a>
    </div>
  </div></footer>

  <script>window.THEME_ID = "36-vault";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";

    // decorative spokes on the dial
    (function(){
      const box = document.getElementById('spokes');
      let h = '';
      for(let i=0;i<8;i++){ h += `<span style="transform:translateY(-50%) rotate(${i*45}deg)"></span>`; }
      box.innerHTML = h;
    })();

    function renderStatic(){
      document.title = (CJCData.lang()==="zh"?"蔡杰超":"Cai Jiechao") + " — The Vault";
      document.getElementById('nav').innerHTML = [
        ['about','nav_about'],['courses','nav_courses'],['projects','nav_portfolio'],
        ['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');

      document.getElementById('greet').textContent = t(P.greeting);
      const nm = t(P.name);
      document.getElementById('name').innerHTML = `<em>${esc(nm)}</em>`;
      document.getElementById('headline').textContent = t(P.headline);
      document.getElementById('meta').innerHTML =
        `<span><b>${esc(t(P.role))}</b></span><span>${esc(t(P.title))}</span><span>📍 <b>${esc(t(P.location))}</b></span>`;
      const cv = document.getElementById('cvBtn'); cv.textContent = t(P.ui.download_cv); cv.href = t(P.cv);
      const gh = document.getElementById('ghBtn'); gh.textContent = "GitHub ↗"; gh.href = P.contact.github;

      document.getElementById('portrait').src = P.avatar;
      document.getElementById('portrait').alt = nm;
      document.getElementById('dial-cap-1').textContent = t(P.role).toUpperCase();

      const VAULT = { en:"THE VAULT", zh:"保险库" };
      ['about','edu','skills','courses','exp','proj','art','certs','contact'].forEach(k=>{
        document.getElementById('k-'+k).textContent = t(VAULT);
      });
      document.getElementById('l-about').textContent = t(P.ui.about_me);
      document.getElementById('l-edu').textContent = t(P.ui.education_bg);
      document.getElementById('l-skills').textContent = t(P.ui.core_tech);
      document.getElementById('l-courses').textContent = t(P.ui.core_courses);
      document.getElementById('l-exp').textContent = t(P.ui.internship_exp);
      document.getElementById('l-projects').textContent = t(P.ui.latest_projects);
      document.getElementById('l-articles').textContent = t(P.ui.latest_articles);
      document.getElementById('l-certs').textContent = t(P.ui.certificates);
      document.getElementById('l-contact').textContent = t(P.ui.get_in_touch);
      document.getElementById('contact-sub').textContent = t(P.ui.msg_box_title);

      document.getElementById('about-text').innerHTML =
        P.bio.map(b=>`<p style="margin:0 0 14px;color:#cfd8e2;font-size:15.5px;line-height:1.75">${esc(t(b))}</p>`).join('') +
        `<p style="margin:0;color:var(--gold);font-weight:600;font-family:'Space Mono',monospace">📍 ${esc(t(P.location))}</p>`;

      const SEC = CJCData.lang()==="zh" ? "已认证 🔒" : "VERIFIED 🔒";
      document.getElementById('edu-list').innerHTML = P.education.map((e,i)=>`
        <div class="lrow"><div class="lidx num">0${i+1}</div>
        <div class="when num">${esc(e.period)}</div>
        <div><h3>${esc(t(e.school))}</h3><div class="sub">${esc(t(e.degree))} · ${esc(t(e.note))}</div></div>
        <div class="seal-badge">${SEC}</div></div>`).join('');

      document.getElementById('skills-list').innerHTML =
        P.skillTags.map(s=>`<span class="bar-chip">${esc(s)}</span>`).join('');

      document.getElementById('courses-list').innerHTML = P.courses.map((c,i)=>`
        <div class="course panel"><div class="top"><div class="ci"><i class="fa ${esc(c.icon)}" aria-hidden="true"></i></div>
        <div><div class="cidx num">VAULT · 0${i+1}</div><h4>${esc(t(c.title))}</h4></div></div>
        <p>${esc(t(c.desc))}</p></div>`).join('');

      document.getElementById('exp-list').innerHTML = P.experience.map((x,i)=>`
        <div class="lrow"><div class="lidx num">0${i+1}</div>
        <div class="when num">${esc(x.period)}</div>
        <div><h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3>
        <div class="sub">${esc(t(x.summary))}</div>
        <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div>
        <div class="seal-badge">${SEC}</div></div>`).join('');

      document.getElementById('certs-list').innerHTML = P.certificates.map(c=>`
        <div class="cert panel"><img src="${esc(c.image)}" alt="${esc(t(c.title))}" onerror="this.src='/index_page/img/blogs/1.jpg'">
        <div class="ct"><div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');

      document.getElementById('contact-info').innerHTML = [
        ['Email', P.contact.email, 'mailto:'+P.contact.email],
        ['Phone', P.contact.phone, P.contact.phoneHref],
        ['GitHub', '@'+P.contact.githubUser, P.contact.github],
        ['WeChat', 'QR ↗', P.contact.wechatQrPage],
      ].map(([k,v,h])=>`<a href="${esc(h)}"><span>${esc(k)}</span><span>${esc(v)}</span></a>`).join('');
      document.getElementById('cf-name').placeholder = t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder = t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder = t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent = t(P.ui.send);

      document.getElementById('foot-social').innerHTML =
        `<a href="${P.contact.github}" target="_blank" rel="noopener">GitHub</a>
         <a href="mailto:${P.contact.email}">Email</a>
         <a href="${P.contact.wechatQrPage}">WeChat</a>
         <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent = t(P.ui.footer_desc);
      const icp = document.getElementById('foot-icp'); icp.textContent = P.icp; icp.href = P.icpUrl;

      document.getElementById('filters').innerHTML = P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box = document.getElementById('projects-list');
      if(!projects.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML = projects.map((p,i)=>`
        <a class="card" href="${esc(p.href)}">
          ${p.cover_image ? `<div class="cover"><img src="${esc(p.cover_image)}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>` : ''}
          <div class="cbody">
            <div class="ctag"><span>№ 0${i+1}</span><span>${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <p class="tech">${esc(p.tech_stack||'')}</p>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} <span style="color:var(--gold)">→</span></span>
          </div></a>`).join('');
    }

    function renderArticles(){
      const box = document.getElementById('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML = list.map(a=>`
        <a class="card" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${esc(a.localTitle())}"></div>
          <div class="cbody">
            <div class="ctag"><span>${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} <span style="color:var(--gold)">→</span></span>
          </div></a>`).join('');
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML = `<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-list').innerHTML = `<div class="load-note">⚠ 内容加载失败 / Failed to load.</div>`; }
    }

    document.getElementById('cf').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      const payload = { name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color='var(--muted)'; s.textContent = t(P.ui.sending);
      try{ const r = await CJCData.sendContact(payload); s.style.color='var(--gold)'; s.textContent = r.message||'Sent.'; f.reset(); }
      catch(err){ s.style.color='#e0736f'; s.textContent = err.message; }
    });

    const fa = document.createElement('link');
    fa.rel='stylesheet'; fa.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css';
    document.head.appendChild(fa);

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:'#d4af37' });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

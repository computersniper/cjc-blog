<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Comic</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --paper:#fffef7; --ink:#111111; --red:#e63946; --white:#ffffff;
      --grey:#5a5a5a; --shadow:6px 6px 0 #111; --shadow-sm:4px 4px 0 #111;
      --bd:3px solid #111;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;background:var(--paper);color:var(--ink);
      font-family:'Nunito','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
      font-weight:600;line-height:1.55;
      -webkit-font-smoothing:antialiased;overflow-x:hidden;
      /* faint page halftone */
      background-image:radial-gradient(rgba(17,17,17,.05) 1.4px, transparent 1.5px);
      background-size:16px 16px;
    }
    a{color:inherit}
    img{max-width:100%;display:block}
    .container{max-width:1200px;margin:0 auto;padding:0 22px}
    h1,h2,h3,.disp{
      font-family:'Bangers','PingFang SC','Microsoft YaHei',cursive;
      font-weight:400;letter-spacing:.02em;line-height:.98;
    }
    :focus-visible{outline:4px solid var(--red);outline-offset:3px}

    /* ---- halftone helpers ---- */
    .ht-red{background-image:radial-gradient(var(--red) 22%, transparent 23%);background-size:14px 14px}
    .ht-ink{background-image:radial-gradient(rgba(17,17,17,.85) 20%, transparent 21%);background-size:13px 13px}

    /* ---- panel: the core comic frame ---- */
    .panel{
      background:var(--white);border:var(--bd);box-shadow:var(--shadow);
      border-radius:4px;position:relative;
    }
    .gutter{display:grid;gap:34px}

    /* ---- section scaffolding ---- */
    section{padding:38px 0}
    .sec{padding:26px 24px}
    .sec-head{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
    .sec-kicker{
      display:inline-block;background:var(--ink);color:#fff;font-family:'Bangers',cursive;
      font-size:15px;letter-spacing:.06em;padding:5px 12px;border-radius:3px;transform:rotate(-2deg);
    }
    .sec-title{margin:0;font-size:clamp(30px,5.4vw,52px);text-transform:uppercase;
      color:var(--ink);-webkit-text-stroke:0;}
    .sec-title .k{color:var(--red)}
    @media(max-width:560px){.sec{padding:22px 16px}}

    /* ---- speech bubble ---- */
    .bubble{
      position:relative;background:#fff;border:var(--bd);border-radius:20px;
      padding:16px 20px;box-shadow:var(--shadow-sm);font-weight:700;
    }
    .bubble::after{content:"";position:absolute;left:34px;bottom:-20px;width:0;height:0;
      border-left:16px solid transparent;border-right:0 solid transparent;border-top:22px solid #111}
    .bubble::before{content:"";position:absolute;left:37px;bottom:-13px;width:0;height:0;z-index:1;
      border-left:11px solid transparent;border-right:0 solid transparent;border-top:15px solid #fff}
    .bubble.right::after{left:auto;right:34px;border-left:0 solid transparent;border-right:16px solid transparent}
    .bubble.right::before{left:auto;right:37px;border-left:0 solid transparent;border-right:11px solid transparent}

    /* ---- burst / star sticker ---- */
    .burst{
      display:inline-flex;align-items:center;justify-content:center;text-align:center;
      background:var(--red);color:#fff;font-family:'Bangers',cursive;letter-spacing:.04em;
      width:88px;height:88px;font-size:20px;line-height:1;padding:6px;
      clip-path:polygon(50% 0%,61% 15%,78% 8%,74% 27%,92% 27%,79% 41%,100% 50%,79% 59%,92% 73%,74% 73%,78% 92%,61% 85%,50% 100%,39% 85%,22% 92%,26% 73%,8% 73%,21% 59%,0% 50%,21% 41%,8% 27%,26% 27%,22% 8%,39% 15%);
      -webkit-text-stroke:.6px #111;
    }
    .burst.ink{background:var(--ink)}
    .burst.wobble{animation:wob 3.2s ease-in-out infinite}
    @keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

    /* ---- speed lines background ---- */
    .speed{
      background:
        repeating-conic-gradient(from 0deg at 50% 50%,
          rgba(17,17,17,.09) 0deg 1.5deg, transparent 1.5deg 6deg);
    }

    /* ---- buttons ---- */
    .btn{
      display:inline-flex;align-items:center;gap:9px;cursor:pointer;text-decoration:none;
      font-family:'Bangers',cursive;font-size:19px;letter-spacing:.05em;
      background:var(--red);color:#fff;border:var(--bd);border-radius:6px;
      padding:11px 22px;box-shadow:var(--shadow-sm);transition:transform .12s ease, box-shadow .12s ease;
    }
    .btn:hover,.btn:focus-visible{transform:translate(-2px,-2px);box-shadow:7px 7px 0 #111}
    .btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #111}
    .btn.ink{background:var(--ink)}
    .btn.ghost{background:#fff;color:var(--ink)}

    /* ---- topbar ---- */
    .topbar{position:sticky;top:0;z-index:800;background:var(--red);border-bottom:var(--bd)}
    .topbar .inner{display:flex;align-items:center;gap:20px;height:58px;padding-right:190px}
    .brand{font-family:'Bangers',cursive;font-size:26px;letter-spacing:.03em;color:#fff;text-decoration:none;
      -webkit-text-stroke:1px #111;text-shadow:2px 2px 0 #111;white-space:nowrap}
    .navlinks{display:flex;gap:6px;flex-wrap:wrap}
    .navlinks a{font-family:'Bangers',cursive;font-size:16px;letter-spacing:.04em;color:#fff;text-decoration:none;
      padding:4px 10px;border:2px solid transparent;border-radius:5px}
    .navlinks a:hover,.navlinks a:focus-visible{background:#fff;color:var(--ink);border-color:#111}
    @media(max-width:900px){.topbar .inner{padding-right:150px}.navlinks{display:none}}

    /* ---- hero ---- */
    .hero{padding-top:30px}
    .hero-panel{overflow:hidden;padding:0}
    .hero-inner{position:relative;padding:34px 30px 40px;display:grid;grid-template-columns:1.35fr .9fr;gap:26px;align-items:center}
    .hero-burstbg{position:absolute;inset:0;z-index:0;opacity:.9}
    .hero-col{position:relative;z-index:1}
    .greet-bubble{display:inline-block;background:var(--ink);color:#fff;font-family:'Bangers',cursive;
      font-size:20px;letter-spacing:.05em;padding:7px 16px;border-radius:16px;transform:rotate(-2deg);
      box-shadow:var(--shadow-sm)}
    .hero h1{font-size:clamp(52px,12vw,120px);margin:16px 0 0;color:var(--ink);
      -webkit-text-stroke:2px #111;text-shadow:6px 6px 0 var(--red)}
    .hero .role{display:inline-block;margin-top:10px;background:var(--red);color:#fff;
      font-family:'Bangers',cursive;font-size:clamp(20px,3.4vw,30px);letter-spacing:.05em;padding:4px 14px;
      border:var(--bd);border-radius:6px;box-shadow:var(--shadow-sm)}
    .hero .head-bubble{margin-top:22px;max-width:30ch;font-size:17px}
    .hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
    .chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid #111;border-radius:999px;
      padding:5px 13px;font-weight:800;font-size:13.5px}
    .chip .d{width:9px;height:9px;border-radius:50%;background:var(--red);border:1.5px solid #111}
    .hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
    .hero-portrait{position:relative;z-index:1;justify-self:center}
    .hero-portrait .frame{border:var(--bd);border-radius:8px;box-shadow:var(--shadow);background:#fff;
      padding:8px;transform:rotate(2.5deg);max-width:280px}
    .hero-portrait img{border:2px solid #111;border-radius:4px;filter:grayscale(.15) contrast(1.08)}
    .hero-portrait .pow{position:absolute;top:-26px;left:-26px;z-index:2}
    @media(max-width:820px){.hero-inner{grid-template-columns:1fr}.hero-portrait{order:-1}}

    /* ---- about ---- */
    .about-grid{grid-template-columns:280px 1fr;gap:30px;align-items:start}
    .about-portrait{border:var(--bd);box-shadow:var(--shadow);border-radius:6px;padding:8px;background:#fff}
    .about-portrait img{border:2px solid #111;border-radius:4px;filter:grayscale(.1) contrast(1.05)}
    .about-bubbles{display:flex;flex-direction:column;gap:26px}
    .about-bubbles .bubble{font-size:16px;font-weight:700;max-width:64ch}
    .loc-tag{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;
      font-family:'Bangers',cursive;font-size:18px;letter-spacing:.05em;padding:6px 15px;border-radius:6px;
      align-self:flex-start}
    @media(max-width:720px){.about-grid{grid-template-columns:1fr}}

    /* ---- education ---- */
    .edu-grid{grid-template-columns:1fr 1fr}
    .edu-card{padding:20px 22px;position:relative}
    .edu-card .when{display:inline-block;background:var(--red);color:#fff;font-family:'Bangers',cursive;
      font-size:16px;letter-spacing:.04em;padding:3px 11px;border:2px solid #111;border-radius:5px}
    .edu-card h3{margin:12px 0 6px;font-size:23px}
    .edu-card .deg{font-weight:800;font-size:15.5px}
    .edu-card .note{color:var(--grey);font-size:14.5px;font-weight:700;margin-top:6px}
    @media(max-width:720px){.edu-grid{grid-template-columns:1fr}}

    /* ---- skills ---- */
    .skills-wrap{padding:22px 24px}
    .skill-lines{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;margin-bottom:22px}
    .skill-line{display:flex;gap:12px;align-items:center;font-weight:800;font-size:16px;
      border-bottom:2px dashed rgba(17,17,17,.25);padding-bottom:10px}
    .skill-line .bang{font-family:'Bangers',cursive;color:var(--red);font-size:22px;line-height:1}
    .tagcloud{display:flex;flex-wrap:wrap;gap:9px}
    .tag{background:#fff;border:2px solid #111;border-radius:6px;padding:5px 12px;font-weight:800;font-size:13.5px;
      box-shadow:3px 3px 0 #111;transition:transform .1s ease}
    .tag:nth-child(3n){background:var(--red);color:#fff}
    .tag:nth-child(4n){transform:rotate(-2deg)}
    .tag:hover{transform:translate(-1px,-1px) rotate(0)}
    @media(max-width:600px){.skill-lines{grid-template-columns:1fr}}

    /* ---- courses ---- */
    .courses-grid{grid-template-columns:repeat(3,1fr)}
    .course{padding:20px 20px 22px;position:relative;transition:transform .12s ease, box-shadow .12s ease}
    .course:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--red)}
    .course .ci{width:54px;height:54px;display:flex;align-items:center;justify-content:center;
      background:var(--red);color:#fff;border:var(--bd);border-radius:10px;font-size:24px;margin-bottom:14px;
      box-shadow:var(--shadow-sm)}
    .course h4{margin:0 0 8px;font-family:'Bangers',cursive;font-size:21px;line-height:1.05;letter-spacing:.02em}
    .course p{margin:0;color:var(--grey);font-size:14px;font-weight:700;line-height:1.55}
    @media(max-width:900px){.courses-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.courses-grid{grid-template-columns:1fr}}

    /* ---- experience ---- */
    .exp-card{padding:26px 26px 28px;position:relative;overflow:hidden}
    .exp-top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:12px}
    .exp-top h3{margin:0;font-size:26px}
    .exp-top .when{background:var(--ink);color:#fff;font-family:'Bangers',cursive;font-size:15px;
      padding:4px 12px;border-radius:5px;letter-spacing:.04em}
    .exp-card .summary{font-weight:700;font-size:15px;margin:0 0 16px;max-width:75ch}
    .exp-bullets{list-style:none;margin:0;padding:0;display:grid;gap:12px}
    .exp-bullets li{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:2px solid #111;
      border-radius:8px;padding:11px 14px;font-weight:700;font-size:14.5px}
    .exp-bullets li .k{font-family:'Bangers',cursive;color:var(--red);font-size:20px;line-height:1.1;flex:0 0 auto}

    /* ---- cards (projects/articles) ---- */
    .cards{grid-template-columns:repeat(3,1fr)}
    .card{display:flex;flex-direction:column;text-decoration:none;color:inherit;overflow:hidden;padding:0;
      transition:transform .12s ease, box-shadow .12s ease}
    .card:hover,.card:focus-visible{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--red)}
    .card .cover{height:168px;background:#eee;border-bottom:var(--bd);overflow:hidden;position:relative}
    .card .cover img{width:100%;height:100%;object-fit:cover;filter:grayscale(.12) contrast(1.05)}
    .card .cover .badge{position:absolute;top:-14px;right:-10px;transform:scale(.62);transform-origin:top right}
    .card .cbody{padding:16px;display:flex;flex-direction:column;gap:9px;flex:1}
    .card .ctag{display:flex;justify-content:space-between;gap:8px;font-family:'Bangers',cursive;font-size:14px;
      letter-spacing:.03em;color:var(--red)}
    .card .ctag .date{color:var(--ink)}
    .card h4{margin:0;font-family:'Bangers',cursive;font-size:20px;line-height:1.06;letter-spacing:.02em}
    .card .stack{color:#fff;background:var(--ink);font-weight:800;font-size:12px;padding:3px 9px;border-radius:5px;
      align-self:flex-start;max-width:100%;overflow-x:auto;white-space:nowrap}
    .card p{margin:0;color:var(--grey);font-size:13.5px;font-weight:700;line-height:1.5;flex:1}
    .card .more{font-family:'Bangers',cursive;font-size:16px;letter-spacing:.04em;color:var(--red)}
    @media(max-width:900px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.cards{grid-template-columns:1fr}}

    /* ---- filters ---- */
    .filters{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:24px}
    .filters button{background:#fff;border:var(--bd);color:var(--ink);font-family:'Bangers',cursive;
      font-size:16px;letter-spacing:.03em;padding:6px 15px;cursor:pointer;border-radius:6px;box-shadow:3px 3px 0 #111;
      transition:transform .1s ease}
    .filters button:hover{transform:translate(-1px,-1px)}
    .filters button.active{background:var(--red);color:#fff}

    /* ---- certificates ---- */
    .certs-grid{grid-template-columns:1fr 1fr}
    .cert{display:grid;grid-template-columns:140px 1fr;overflow:hidden;padding:0}
    .cert img{height:100%;width:100%;object-fit:cover;border-right:var(--bd);filter:grayscale(.1) contrast(1.05)}
    .cert .ct{padding:16px 18px}
    .cert .ct .meta{display:flex;justify-content:space-between;gap:8px;font-family:'Bangers',cursive;font-size:13px;
      letter-spacing:.03em;color:var(--red);flex-wrap:wrap}
    .cert .ct h4{margin:9px 0 7px;font-family:'Bangers',cursive;font-size:20px;line-height:1.08}
    .cert .ct p{margin:0;color:var(--grey);font-size:13.5px;font-weight:700;line-height:1.5}
    @media(max-width:720px){.certs-grid{grid-template-columns:1fr}}
    @media(max-width:420px){.cert{grid-template-columns:96px 1fr}}

    /* ---- contact ---- */
    .contact-grid{grid-template-columns:1fr 1.15fr;gap:30px;align-items:start}
    .contact-info{display:flex;flex-direction:column;gap:0}
    .contact-info a{display:flex;justify-content:space-between;gap:12px;padding:14px 4px;text-decoration:none;
      font-weight:800;font-size:15px;border-bottom:2px dashed rgba(17,17,17,.25)}
    .contact-info a:hover span:last-child{color:var(--red)}
    .contact-info a .lbl{font-family:'Bangers',cursive;font-size:18px;letter-spacing:.03em}
    .contact-info a span:last-child{color:var(--red);font-weight:800}
    .contact-form{padding:22px 22px 24px}
    .contact-form label{display:block;font-family:'Bangers',cursive;font-size:15px;letter-spacing:.03em;
      margin:0 0 6px 2px}
    .contact-form input,.contact-form textarea{width:100%;background:var(--paper);border:var(--bd);border-radius:6px;
      font-family:inherit;font-weight:700;font-size:15px;padding:12px 13px;margin-bottom:15px;color:var(--ink)}
    .contact-form input:focus,.contact-form textarea:focus{outline:none;box-shadow:var(--shadow-sm)}
    .contact-form textarea{min-height:128px;resize:vertical}
    #cf-status{margin:12px 0 0;font-weight:800;font-size:14.5px}
    .honey{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
    @media(max-width:820px){.contact-grid{grid-template-columns:1fr}}

    /* ---- footer ---- */
    footer{margin-top:20px;background:var(--ink);color:#fff;border-top:var(--bd);padding:36px 0 44px}
    footer .frow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:18px;align-items:center}
    footer .brand{text-shadow:2px 2px 0 var(--red);-webkit-text-stroke:0}
    footer .fsocial{display:flex;flex-wrap:wrap;gap:10px}
    footer .fsocial a{font-family:'Bangers',cursive;font-size:16px;letter-spacing:.03em;text-decoration:none;
      color:#fff;background:rgba(255,255,255,.1);border:2px solid #fff;border-radius:6px;padding:5px 13px}
    footer .fsocial a:hover{background:var(--red);border-color:var(--red)}
    footer .fbottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:22px;
      padding-top:18px;border-top:2px dashed rgba(255,255,255,.3);font-weight:700;font-size:13px;color:#dcdcdc}
    footer .fbottom a{color:#fff}

    .load-note{grid-column:1/-1;background:#fff;border:var(--bd);border-radius:8px;padding:18px 20px;
      font-family:'Bangers',cursive;font-size:20px;letter-spacing:.03em;box-shadow:var(--shadow-sm)}
    .load-note.err{background:var(--red);color:#fff}

    @media (prefers-reduced-motion: reduce){
      *{scroll-behavior:auto !important}
      .burst.wobble{animation:none}
      .btn,.card,.course{transition:none}
    }
  </style>
</head>
<body>
  <!-- ================= TOPBAR ================= -->
  <div class="topbar">
    <div class="container inner">
      <a class="brand" href="#top" id="brand">CaiJiechao</a>
      <nav class="navlinks" id="nav" aria-label="Primary"></nav>
    </div>
  </div>

  <div id="top"></div>

  <!-- ================= HERO ================= -->
  <header class="hero"><div class="container">
    <div class="panel hero-panel">
      <div class="hero-inner">
        <div class="hero-burstbg speed ht-red" aria-hidden="true" style="mix-blend-mode:multiply"></div>
        <div class="hero-col">
          <span class="greet-bubble" id="greet"></span>
          <h1 id="name"></h1>
          <div><span class="role" id="role"></span></div>
          <div class="bubble head-bubble" id="headline"></div>
          <div class="meta" id="meta"></div>
          <div class="cta">
            <a class="btn" id="cvBtn" href="#" download></a>
            <a class="btn ink" id="ghBtn" target="_blank" rel="noopener"></a>
          </div>
        </div>
        <div class="hero-portrait">
          <div class="burst wobble pow" aria-hidden="true">POW!</div>
          <div class="frame"><img id="hero-img" alt="" /></div>
        </div>
      </div>
    </div>
  </div></header>

  <!-- ================= ABOUT ================= -->
  <section id="about"><div class="container">
    <div class="sec-head"><span class="sec-kicker">#01</span>
      <h2 class="sec-title" id="l-about"></h2></div>
    <div class="panel sec">
      <div class="gutter about-grid">
        <div class="about-portrait"><img id="portrait" alt="" /></div>
        <div class="about-bubbles" id="about-text"></div>
      </div>
    </div>
  </div></section>

  <!-- ================= EDUCATION ================= -->
  <section id="education"><div class="container">
    <div class="sec-head"><span class="sec-kicker">#02</span>
      <h2 class="sec-title" id="l-edu"></h2></div>
    <div class="gutter edu-grid" id="edu-list"></div>
  </div></section>

  <!-- ================= SKILLS ================= -->
  <section id="skills"><div class="container">
    <div class="sec-head"><span class="sec-kicker">#03</span>
      <h2 class="sec-title" id="l-skills"></h2></div>
    <div class="panel skills-wrap">
      <div class="skill-lines" id="skills-list"></div>
      <div class="tagcloud" id="tag-list"></div>
    </div>
  </div></section>

  <!-- ================= COURSES ================= -->
  <section id="courses"><div class="container">
    <div class="sec-head"><span class="sec-kicker">#04</span>
      <h2 class="sec-title" id="l-courses"></h2></div>
    <div class="gutter courses-grid" id="courses-list"></div>
  </div></section>

  <!-- ================= EXPERIENCE ================= -->
  <section id="experience"><div class="container">
    <div class="sec-head"><span class="sec-kicker">#05</span>
      <h2 class="sec-title" id="l-exp"></h2></div>
    <div id="exp-list"></div>
  </div></section>

  <!-- ================= PROJECTS ================= -->
  <section id="projects"><div class="container">
    <div class="sec-head"><span class="sec-kicker">#06</span>
      <h2 class="sec-title" id="l-projects"></h2></div>
    <div class="gutter cards" id="projects-list"><div class="load-note" id="proj-load"></div></div>
  </div></section>

  <!-- ================= ARTICLES ================= -->
  <section id="articles"><div class="container">
    <div class="sec-head"><span class="sec-kicker">#07</span>
      <h2 class="sec-title" id="l-articles"></h2></div>
    <div class="filters" id="filters"></div>
    <div class="gutter cards" id="articles-list"><div class="load-note" id="art-load"></div></div>
  </div></section>

  <!-- ================= CERTIFICATES ================= -->
  <section id="certificates"><div class="container">
    <div class="sec-head"><span class="sec-kicker">#08</span>
      <h2 class="sec-title" id="l-certs"></h2></div>
    <div class="gutter certs-grid" id="certs-list"></div>
  </div></section>

  <!-- ================= CONTACT ================= -->
  <section id="contact"><div class="container">
    <div class="sec-head"><span class="sec-kicker">#09</span>
      <h2 class="sec-title" id="l-contact"></h2></div>
    <div class="contact-grid">
      <div class="panel sec">
        <div class="contact-info" id="contact-info"></div>
      </div>
      <div class="panel contact-form">
        <form id="cf" novalidate>
          <div class="honey" aria-hidden="true">
            <label>Leave this empty<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
          </div>
          <label for="cf-name" id="lbl-name"></label>
          <input type="text" name="name" id="cf-name" required autocomplete="name">
          <label for="cf-email" id="lbl-email"></label>
          <input type="email" name="email" id="cf-email" required autocomplete="email">
          <label for="cf-msg" id="lbl-msg"></label>
          <textarea name="message" id="cf-msg" required></textarea>
          <button type="submit" class="btn" id="cf-send"></button>
          <p id="cf-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </div></section>

  <!-- ================= FOOTER ================= -->
  <footer><div class="container">
    <div class="frow">
      <a class="brand" href="#top" style="font-size:24px" id="foot-brand">CaiJiechao</a>
      <div class="fsocial" id="foot-social"></div>
    </div>
    <div class="fbottom">
      <span id="foot-desc"></span>
      <a id="foot-icp" target="_blank" rel="noopener"></a>
    </div>
  </div></footer>

  <script>window.THEME_ID = "20-comic";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";

    // article-cover burst label switches with language: "読む!" / "READ!" / "读!"
    function readBurst(){
      const l = CJCData.lang();
      return l === "zh" ? "読む!" : "READ!";
    }

    function renderStatic(){
      document.title = CJCData.lang() === "zh" ? "蔡杰超 — 漫画" : "Cai Jiechao — Comic";
      // brand
      document.getElementById('brand').textContent = P.brand;
      document.getElementById('foot-brand').textContent = P.brand;
      // nav
      document.getElementById('nav').innerHTML = [
        ['about','nav_about'],['courses','nav_courses'],['experience','nav_internship'],
        ['projects','nav_portfolio'],['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');

      // hero
      document.getElementById('greet').textContent = t(P.greeting);
      document.getElementById('name').textContent = t(P.name);
      document.getElementById('role').textContent = t(P.role);
      document.getElementById('headline').textContent = t(P.headline);
      document.getElementById('meta').innerHTML =
        `<span class="chip"><span class="d"></span>${esc(t(P.title))}</span>` +
        `<span class="chip"><span class="d"></span>📍 ${esc(t(P.location))}</span>`;
      const cv = document.getElementById('cvBtn');
      cv.textContent = "⬇ " + t(P.ui.download_cv); cv.href = t(P.cv);
      const gh = document.getElementById('ghBtn');
      gh.innerHTML = '<i class="fa fa-github" aria-hidden="true"></i> GitHub';
      gh.href = P.contact.github;
      const hi = document.getElementById('hero-img'); hi.src = P.avatar; hi.alt = t(P.name);

      // section labels
      document.getElementById('l-about').innerHTML = `<span class="k">★</span> ${esc(t(P.ui.about_me))}`;
      document.getElementById('l-edu').innerHTML = `<span class="k">★</span> ${esc(t(P.ui.education_bg))}`;
      document.getElementById('l-skills').innerHTML = `<span class="k">★</span> ${esc(t(P.ui.core_tech))}`;
      document.getElementById('l-courses').innerHTML = `<span class="k">★</span> ${esc(t(P.ui.core_courses))}`;
      document.getElementById('l-exp').innerHTML = `<span class="k">★</span> ${esc(t(P.ui.internship_exp))}`;
      document.getElementById('l-projects').innerHTML = `<span class="k">★</span> ${esc(t(P.ui.latest_projects))}`;
      document.getElementById('l-articles').innerHTML = `<span class="k">★</span> ${esc(t(P.ui.latest_articles))}`;
      document.getElementById('l-certs').innerHTML = `<span class="k">★</span> ${esc(t(P.ui.certificates))}`;
      document.getElementById('l-contact').innerHTML = `<span class="k">★</span> ${esc(t(P.ui.get_in_touch))}`;

      // about
      const port = document.getElementById('portrait'); port.src = P.avatar; port.alt = t(P.name);
      document.getElementById('about-text').innerHTML =
        P.bio.map((b,i)=>`<div class="bubble${i%2?' right':''}">${esc(t(b))}</div>`).join('') +
        `<span class="loc-tag">📍 ${esc(t(P.location))}</span>`;

      // education
      document.getElementById('edu-list').innerHTML = P.education.map(e=>`
        <div class="panel edu-card">
          <span class="when">${esc(e.period)}</span>
          <h3>${esc(t(e.school))}</h3>
          <div class="deg">${esc(t(e.degree))}</div>
          <div class="note">${esc(t(e.note))}</div>
        </div>`).join('');

      // skills (grouped lines + tag chips)
      document.getElementById('skills-list').innerHTML = P.skills.map(s=>`
        <div class="skill-line"><span class="bang">POW</span><span>${esc(s)}</span></div>`).join('');
      document.getElementById('tag-list').innerHTML = P.skillTags.map(tg=>`
        <span class="tag">${esc(tg)}</span>`).join('');

      // courses
      document.getElementById('courses-list').innerHTML = P.courses.map(c=>`
        <div class="panel course">
          <div class="ci"><i class="fa ${esc(c.icon)}" aria-hidden="true"></i></div>
          <h4>${esc(t(c.title))}</h4>
          <p>${esc(t(c.desc))}</p>
        </div>`).join('');

      // experience
      document.getElementById('exp-list').innerHTML = P.experience.map(x=>`
        <div class="panel exp-card">
          <div class="hero-burstbg speed" aria-hidden="true" style="opacity:.5"></div>
          <div style="position:relative;z-index:1">
            <div class="exp-top">
              <h3>${esc(t(x.role))}</h3>
              <span class="when">${esc(t(x.company))} · ${esc(x.period)}</span>
            </div>
            <p class="summary">${esc(t(x.summary))}</p>
            <ul class="exp-bullets">
              ${x.bullets.map(b=>`<li><span class="k">✦</span><span>${esc(t(b))}</span></li>`).join('')}
            </ul>
          </div>
        </div>`).join('');

      // certificates
      document.getElementById('certs-list').innerHTML = P.certificates.map(c=>`
        <div class="panel cert">
          <img src="${esc(c.image)}" alt="${esc(t(c.title))}" onerror="this.src='/index_page/img/blogs/1.jpg'">
          <div class="ct">
            <div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
            <h4>${esc(t(c.title))}</h4>
            <p>${esc(t(c.desc))}</p>
          </div>
        </div>`).join('');

      // contact info
      document.getElementById('contact-info').innerHTML = [
        ['Email', P.contact.email, 'mailto:'+P.contact.email],
        ['Phone', P.contact.phone, P.contact.phoneHref],
        ['GitHub', '@'+P.contact.githubUser, P.contact.github],
        ['WeChat', 'QR ↗', P.contact.wechatQrPage],
      ].map(([k,v,h])=>`<a href="${esc(h)}"><span class="lbl">${esc(k)}</span><span>${esc(v)}</span></a>`).join('');
      document.getElementById('lbl-name').textContent = t(P.ui.name_placeholder);
      document.getElementById('lbl-email').textContent = t(P.ui.email_placeholder);
      document.getElementById('lbl-msg').textContent = t(P.ui.msg_placeholder);
      document.getElementById('cf-name').placeholder = t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder = t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder = t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent = "▶ " + t(P.ui.send);

      // footer
      document.getElementById('foot-social').innerHTML =
        `<a href="${esc(P.contact.github)}" target="_blank" rel="noopener">GitHub</a>
         <a href="mailto:${esc(P.contact.email)}">Email</a>
         <a href="${esc(P.contact.wechatQrPage)}">WeChat</a>
         <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent = t(P.ui.footer_desc);
      const icp = document.getElementById('foot-icp'); icp.textContent = P.icp; icp.href = P.icpUrl;

      // filters
      document.getElementById('filters').innerHTML = P.articleFilters.map(f=>
        `<button type="button" data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box = document.getElementById('projects-list');
      if(!projects.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML = projects.map(p=>`
        <a class="panel card" href="${esc(p.href)}">
          <div class="cbody">
            <div class="ctag"><span>${esc(t(P.ui.tech_stack))}</span><span class="date">${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            ${p.tech_stack ? `<span class="stack">${esc(p.tech_stack)}</span>` : ''}
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div>
        </a>`).join('');
    }

    function renderArticles(){
      const box = document.getElementById('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML = list.map(a=>`
        <a class="panel card" href="${esc(a.href)}">
          <div class="cover">
            <img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${esc(a.localTitle())}">
            <span class="burst badge" aria-hidden="true">${esc(readBurst())}</span>
          </div>
          <div class="cbody">
            <div class="ctag"><span>${esc(a.category||'')}</span><span class="date">${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div>
        </a>`).join('');
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML =
        `<div class="load-note err">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-list').innerHTML =
        `<div class="load-note err">⚠ ${CJCData.lang()==='zh'?'内容加载失败':'Failed to load articles.'}</div>`; }
    }

    // contact submit
    document.getElementById('cf').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      const payload = { name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color='var(--grey)'; s.textContent = t(P.ui.sending);
      try{
        const r = await CJCData.sendContact(payload);
        s.style.color='#0b8a3d'; s.textContent = (r && r.message) || 'Sent! ✔'; f.reset();
      }catch(err){ s.style.color='var(--red)'; s.textContent = (err && err.message) || 'Failed to send.'; }
    });

    // Font Awesome 4.7 for course + github icons
    const fa = document.createElement('link');
    fa.rel='stylesheet';
    fa.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css';
    document.head.appendChild(fa);

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:'#e63946' });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

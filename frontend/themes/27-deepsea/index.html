e('data-filter');render();renderArticles()})})}
    function renderProjects(){var box=document.getElementById('projects-list');if(!projects.length){box.innerHTML='<p class="load-note">'+e(t(P.ui.no_projects))+'</p>';return}box.innerHTML=projects.map(function(x){var image=x.cover_image?'<figure><img loading="lazy" src="'+e(x.cover_image)+'" alt="'+e(x.localTitle())+'" onerror="this.src=\'/index_page/img/blogs/1.jpg\'"></figure>':'';return '<a class="card" href="'+e(x.href)+'">'+image+'<div class="card-body"><div class="meta"><span>'+e(t(P.ui.tech_stack))+'</span><span>'+e(x.dateText())+'</span></div><h3>'+e(x.localTitle())+'</h3><p>'+e(x.tech_stack||'')+'</p><p>'+e(x.localSummary()||'')+'</p><span class="go">'+e(t(P.ui.view_project))+' <i class="fa fa-long-arrow-right"></i></span></div></a>'}).join('')}
    function renderArticles(){var box=document.getElementById('articles-list'),list=D.filterArticles(articles,filterKey);if(!list.length){box.innerHTML='<p class="load-note">'+e(t(P.ui.no_articles))+'</p>';return}box.innerHTML=list.map(function(x){return '<a class="card" href="'+e(x.href)+'"><figure><img loading="lazy" src="'+e(x.cover_image||'/index_page/img/blogs/1.jpg')+'" alt="'+e(x.localTitle())+'" onerror="this.src=\'/index_page/img/blogs/1.jpg\'"></figure><div class="card-body"><div class="meta"><span>'+e(x.category||'')+'</span><span>'+e(x.dateText())+'</span></div><h3>'+e(x.localTitle())+'</h3><p>'+e(x.localSummary()||'')+'</p><span class="go">'+e(t(P.ui.read_more))+' <i class="fa fa-long-arrow-right"></i></span></div></a>'}).join('')}
    function form(){document.getElementById('form').addEventListener('submit',async function(ev){ev.preventDefault();var f=ev.currentTarget,b=document.getElementById('send'),s=document.getElementById('status');b.disabled=true;s.textContent=c('sending');try{var r=await D.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});s.textContent=r.message||c('sent');f.reset()}catch(err){s.textContent=err.message||c('failed')}finally{b.disabled=false}})}
    function light(){var cv=document.getElementById('biolight'),ctx=cv.getContext('2d'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,dpr=Math.min(devicePixelRatio||1,2),w,h,points=[];function fit(){w=cv.width=innerWidth*dpr;h=cv.height=innerHeight*dpr;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';points=Array.from({length:Math.max(12,Math.floor(innerWidth/100))},function(_,i){return{x:Math.random()*w,y:Math.random()*h,l:18+Math.random()*32,a:.09+Math.random()*.16,phase:i*.8}})}function draw(ms){ctx.clearRect(0,0,w,h);points.forEach(function(p){var y=p.y+Math.sin(ms/1800+p.phase)*18*dpr;ctx.strokeStyle='rgba(147,230,216,'+p.a+')';ctx.lineWidth=dpr;ctx.beginPath();ctx.moveTo(p.x-p.l*dpr,y);ctx.lineTo(p.x+p.l*dpr,y+Math.sin(ms/1300+p.phase)*3*dpr);ctx.stroke()});if(!reduced)requestAnimationFrame(draw)}fit();draw(0);addEventListener('resize',fit,{passive:true})}
    document.addEventListener('DOMContentLoaded',function(){D.setTheme(window.THEME_ID);render();D.mountSwitcher({accent:'#59bdb0'});D.onLang(function(){render();renderProjects();renderArticles()});form();light();Promise.all([D.fetchProjects(),D.fetchArticles()]).then(function(r){projects=r[0];articles=r[1];renderProjects();renderArticles()}).catch(function(){renderProjects();renderArticles()})})
  })();
  </script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Swiss</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root{
      --paper:#f4f4f2; --ink:#111111; --red:#e2231a; --grey:#6b6b6b; --line:#111111;
      --hair:rgba(17,17,17,.16);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;background:var(--paper);color:var(--ink);
      font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;line-height:1.4;
    }
    a{color:inherit}
    img{max-width:100%;display:block}
    .container{max-width:1180px;margin:0 auto;padding:0 28px}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:22px}
    .rule{border-top:2px solid var(--line);margin:0}
    .hair{border-top:1px solid var(--hair)}

    /* Section scaffolding */
    section{padding:64px 0}
    .sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:34px}
    .sec-num{font-weight:900;color:var(--red);font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
    .sec-label{font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:13px}
    .sec-title{font-weight:900;font-size:clamp(26px,4vw,44px);line-height:1;letter-spacing:-.02em;margin:0}

    /* Topbar */
    .topbar{position:sticky;top:0;z-index:900;background:var(--paper);border-bottom:2px solid var(--line)}
    .topbar .inner{display:flex;align-items:center;justify-content:space-between;height:56px}
    .brand{font-weight:900;letter-spacing:-.02em;font-size:18px;text-decoration:none}
    .brand b{color:var(--red)}
    .navlinks{display:flex;gap:20px}
    .navlinks a{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;text-decoration:none;color:var(--grey)}
    .navlinks a:hover{color:var(--ink)}
    @media(max-width:820px){.navlinks{display:none}}

    /* Hero */
    .hero{padding:70px 0 40px}
    .hero .greet{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.18em;color:var(--red)}
    .hero h1{font-weight:900;font-size:clamp(52px,13vw,150px);line-height:.86;letter-spacing:-.04em;margin:12px 0 0}
    .hero .head{font-weight:500;font-size:clamp(18px,3vw,30px);margin-top:20px;max-width:22ch}
    .hero .meta{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:26px;font-size:14px;color:var(--grey);font-weight:500}
    .hero .meta b{color:var(--ink)}
    .cta{display:inline-flex;align-items:center;gap:10px;margin-top:30px;background:var(--red);color:#fff;
      text-decoration:none;font-weight:700;padding:14px 22px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;
      border:2px solid var(--red);transition:background .15s,color .15s}
    .cta:hover{background:transparent;color:var(--red)}
    .cta.ghost{background:transparent;color:var(--ink);border-color:var(--ink);margin-left:12px}
    .cta.ghost:hover{background:var(--ink);color:#fff}

    /* About */
    .about-grid{grid-template-columns:repeat(12,1fr)}
    .portrait{grid-column:span 4;border:2px solid var(--line)}
    .about-text{grid-column:span 8}
    .about-text p{font-size:clamp(15px,1.8vw,18px);margin:0 0 16px;max-width:60ch}
    @media(max-width:820px){.portrait,.about-text{grid-column:1/-1}}

    /* Education / experience rows */
    .row-item{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:20px 0;border-top:1px solid var(--hair)}
    .row-item .when{font-weight:700;font-variant-numeric:tabular-nums;color:var(--red);font-size:14px}
    .row-item h3{margin:0 0 4px;font-size:19px;font-weight:800}
    .row-item .sub{color:var(--grey);font-size:14.5px}
    @media(max-width:620px){.row-item{grid-template-columns:1fr;gap:6px}}

    /* Skills */
    .skills-cols{grid-template-columns:repeat(12,1fr)}
    .skills-cols ul{grid-column:span 6;list-style:none;margin:0;padding:0}
    .skills-cols li{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--hair);font-weight:500;font-size:16px}
    .skills-cols li::before{content:"→";color:var(--red);font-weight:800}
    @media(max-width:620px){.skills-cols ul{grid-column:1/-1}}

    /* Courses */
    .courses{grid-template-columns:repeat(3,1fr)}
    .course{grid-column:span 1;border-top:2px solid var(--line);padding-top:16px}
    .course .ci{color:var(--red);font-size:22px;margin-bottom:12px}
    .course h4{margin:0 0 8px;font-size:17px;font-weight:800;line-height:1.2}
    .course p{margin:0;color:var(--grey);font-size:14px;line-height:1.55}
    @media(max-width:820px){.courses{grid-template-columns:1fr 1fr}.course{grid-column:span 1}}
    @media(max-width:520px){.courses{grid-template-columns:1fr}}

    /* Cards (projects/articles) */
    .cards{grid-template-columns:repeat(3,1fr)}
    .card{grid-column:span 1;border:2px solid var(--line);display:flex;flex-direction:column;background:#fff;
      text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
    .card:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--red)}
    .card .cover{height:170px;background:#e9e9e6;overflow:hidden;border-bottom:2px solid var(--line)}
    .card .cover img{width:100%;height:100%;object-fit:cover}
    .card .cbody{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
    .card .ctag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--red);
      display:flex;justify-content:space-between}
    .card h4{margin:0;font-size:17px;font-weight:800;line-height:1.2}
    .card p{margin:0;color:var(--grey);font-size:14px;line-height:1.5;flex:1}
    .card .more{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.1em}
    @media(max-width:820px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.cards{grid-template-columns:1fr}}

    .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
    .filters button{background:transparent;border:2px solid var(--line);color:var(--ink);font-family:inherit;
      font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:8px 14px;cursor:pointer;transition:.15s}
    .filters button.active,.filters button:hover{background:var(--red);border-color:var(--red);color:#fff}

    /* Certificates */
    .certs{grid-template-columns:1fr 1fr}
    .cert{grid-column:span 1;border:2px solid var(--line);display:grid;grid-template-columns:120px 1fr;background:#fff}
    .cert img{height:100%;object-fit:cover;border-right:2px solid var(--line)}
    .cert .ct{padding:16px}
    .cert .ct .meta{display:flex;justify-content:space-between;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--red)}
    .cert .ct h4{margin:8px 0 6px;font-size:17px;font-weight:800}
    .cert .ct p{margin:0;color:var(--grey);font-size:13.5px;line-height:1.5}
    @media(max-width:620px){.certs{grid-template-columns:1fr}.cert{grid-template-columns:90px 1fr}}

    /* Contact */
    .contact-grid{grid-template-columns:repeat(12,1fr)}
    .contact-info{grid-column:span 5}
    .contact-info a{display:flex;justify-content:space-between;border-top:1px solid var(--hair);padding:14px 0;
      text-decoration:none;font-weight:600}
    .contact-info a span:last-child{color:var(--red)}
    .contact-form{grid-column:span 7}
    .contact-form input,.contact-form textarea{width:100%;background:#fff;border:2px solid var(--line);
      font-family:inherit;font-size:15px;padding:14px;margin-bottom:14px;color:var(--ink)}
    .contact-form textarea{min-height:130px;resize:vertical}
    .contact-form button{background:var(--ink);color:#fff;border:2px solid var(--ink);font-family:inherit;
      font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:14px 26px;cursor:pointer;transition:.15s}
    .contact-form button:hover{background:var(--red);border-color:var(--red)}
    #cf-status{margin-top:12px;font-weight:600;font-size:14px}
    @media(max-width:820px){.contact-info,.contact-form{grid-column:1/-1}}

    footer{border-top:2px solid var(--line);padding:40px 0 60px}
    footer .frow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center}
    footer a{text-decoration:none;color:var(--grey);font-weight:600;font-size:13px}
    footer a:hover{color:var(--ink)}
    .muted{color:var(--grey);font-size:12.5px}
    .load-note{color:var(--grey);font-size:14px;grid-column:1/-1}

    /* React Bits inspired: a restrained Swiss target cursor, never replacing the native pointer. */
    .rb-swiss-target{position:fixed;left:0;top:0;z-index:850;width:30px;height:30px;pointer-events:none;
      opacity:0;transform:translate3d(-60px,-60px,0);transition:opacity .18s ease,scale .18s ease;
      border:1px solid rgba(226,35,26,.78);mix-blend-mode:multiply}
    .rb-swiss-target::before,.rb-swiss-target::after{content:"";position:absolute;background:var(--red)}
    .rb-swiss-target::before{left:50%;top:-7px;width:1px;height:42px;transform:translateX(-50%)}
    .rb-swiss-target::after{top:50%;left:-7px;height:1px;width:42px;transform:translateY(-50%)}
    .rb-swiss-target.is-visible{opacity:1}.rb-swiss-target.is-active{scale:1.45}
    :focus-visible{outline:3px solid var(--red);outline-offset:4px}
    .cta,.filters button,.contact-form button{min-height:44px}
    @media(pointer:coarse),(prefers-reduced-motion:reduce){.rb-swiss-target{display:none}html{scroll-behavior:auto}}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="container inner">
      <a class="brand" href="#top">Cai<b>Jiechao</b></a>
      <nav class="navlinks" id="nav"></nav>
    </div>
  </div>

  <div id="top"></div>
  <header class="hero"><div class="container">
    <div class="greet" id="greet"></div>
    <h1 id="name"></h1>
    <div class="head" id="headline"></div>
    <div class="meta" id="meta"></div>
    <div>
      <a class="cta" id="cvBtn" href="#" download></a>
      <a class="cta ghost" id="ghBtn" target="_blank" rel="noopener"></a>
    </div>
  </div></header>

  <div class="container"><hr class="rule"></div>

  <section id="about"><div class="container">
    <div class="sec-head"><span class="sec-num">01</span><span class="sec-label" id="l-about"></span></div>
    <div class="grid about-grid">
      <img class="portrait" id="portrait" alt="Cai Jiechao" loading="lazy" decoding="async" />
      <div class="about-text" id="about-text"></div>
    </div>
  </div></section>

  <section id="education"><div class="container">
    <div class="sec-head"><span class="sec-num">02</span><span class="sec-label" id="l-edu"></span></div>
    <div id="edu-list"></div>
  </div></section>

  <section id="skills"><div class="container">
    <div class="sec-head"><span class="sec-num">03</span><span class="sec-label" id="l-skills"></span></div>
    <div class="grid skills-cols" id="skills-list"></div>
  </div></section>

  <section id="courses"><div class="container">
    <div class="sec-head"><span class="sec-num">04</span><h2 class="sec-title" id="l-courses"></h2></div>
    <div class="grid courses" id="courses-list"></div>
  </div></section>

  <section id="experience"><div class="container">
    <div class="sec-head"><span class="sec-num">05</span><span class="sec-label" id="l-exp"></span></div>
    <div id="exp-list"></div>
  </div></section>

  <section id="projects"><div class="container">
    <div class="sec-head"><span class="sec-num">06</span><h2 class="sec-title" id="l-projects"></h2></div>
    <div class="grid cards" id="projects-list"><div class="load-note" id="proj-load"></div></div>
  </div></section>

  <section id="articles"><div class="container">
    <div class="sec-head"><span class="sec-num">07</span><h2 class="sec-title" id="l-articles"></h2></div>
    <div class="filters" id="filters"></div>
    <div class="grid cards" id="articles-list"><div class="load-note" id="art-load"></div></div>
  </div></section>

  <section id="certificates"><div class="container">
    <div class="sec-head"><span class="sec-num">08</span><span class="sec-label" id="l-certs"></span></div>
    <div class="grid certs" id="certs-list"></div>
  </div></section>

  <section id="contact"><div class="container">
    <div class="sec-head"><span class="sec-num">09</span><h2 class="sec-title" id="l-contact"></h2></div>
    <div class="grid contact-grid">
      <div class="contact-info" id="contact-info"></div>
      <div class="contact-form">
        <form id="cf">
          <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none">
          <input type="text" name="name" id="cf-name" required>
          <input type="email" name="email" id="cf-email" required>
          <textarea name="message" id="cf-msg" required></textarea>
          <button type="submit" id="cf-send"></button>
          <p id="cf-status"></p>
        </form>
      </div>
    </div>
  </div></section>

  <footer><div class="container">
    <div class="frow">
      <a class="brand" href="#top" style="font-size:16px">Cai<b>Jiechao</b></a>
      <div class="frow" id="foot-social" style="gap:20px"></div>
    </div>
    <div class="frow" style="margin-top:18px">
      <span class="muted" id="foot-desc"></span>
      <a class="muted" id="foot-icp" target="_blank"></a>
    </div>
  </div></footer>

  <script>window.THEME_ID = "01-swiss";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";

    function renderStatic(){
      const lang = CJCData.lang();
      document.title = "Cai Jiechao — Swiss";
      // nav
      document.getElementById('nav').innerHTML = [
        ['about','nav_about'],['courses','nav_courses'],['projects','nav_portfolio'],
        ['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');
      // hero
      document.getElementById('greet').textContent = t(P.greeting);
      document.getElementById('name').textContent = t(P.name);
      document.getElementById('headline').textContent = t(P.headline);
      document.getElementById('meta').innerHTML =
        `<span>${esc(t(P.title))}</span><span>📍 <b>${esc(t(P.location))}</b></span>`;
      const cv = document.getElementById('cvBtn');
      cv.textContent = t(P.ui.download_cv); cv.href = t(P.cv);
      const gh = document.getElementById('ghBtn');
      gh.textContent = "GitHub ↗"; gh.href = P.contact.github;
      // labels
      document.getElementById('l-about').textContent = t(P.ui.about_me);
      document.getElementById('l-edu').textContent = t(P.ui.education_bg);
      document.getElementById('l-skills').textContent = t(P.ui.core_tech);
      document.getElementById('l-courses').textContent = t(P.ui.core_courses);
      document.getElementById('l-exp').textContent = t(P.ui.internship_exp);
      document.getElementById('l-projects').textContent = t(P.ui.latest_projects);
      document.getElementById('l-articles').textContent = t(P.ui.latest_articles);
      document.getElementById('l-certs').textContent = t(P.ui.certificates);
      document.getElementById('l-contact').textContent = t(P.ui.get_in_touch);
      // about
      document.getElementById('portrait').src = P.avatar;
      document.getElementById('about-text').innerHTML =
        P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('') +
        `<p style="color:var(--red);font-weight:700">📍 ${esc(t(P.location))}</p>`;
      // education
      document.getElementById('edu-list').innerHTML = P.education.map(e=>`
        <div class="row-item"><div class="when">${esc(e.period)}</div>
        <div><h3>${esc(t(e.school))}</h3><div class="sub">${esc(t(e.degree))} — ${esc(t(e.note))}</div></div></div>`).join('');
      // skills
      const half = Math.ceil(P.skills.length/2);
      const mk = arr => `<ul>${arr.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`;
      document.getElementById('skills-list').innerHTML = mk(P.skills.slice(0,half)) + mk(P.skills.slice(half));
      // courses
      document.getElementById('courses-list').innerHTML = P.courses.map(c=>`
        <div class="course"><div class="ci"><i class="fa ${esc(c.icon)}"></i></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');
      // experience
      document.getElementById('exp-list').innerHTML = P.experience.map(x=>`
        <div class="row-item"><div class="when">${esc(x.period)}</div>
        <div><h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3>
        <div class="sub" style="margin-bottom:10px">${esc(t(x.summary))}</div>
        <ul style="margin:0;padding-left:18px;color:var(--grey);font-size:14.5px;line-height:1.7">
        ${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div></div>`).join('');
      // certificates
      document.getElementById('certs-list').innerHTML = P.certificates.map(c=>`
        <div class="cert"><img src="${esc(c.image)}" alt="${esc(t(c.title))}" loading="lazy" decoding="async">
        <div class="ct"><div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');
      // contact
      document.getElementById('contact-info').innerHTML = [
        ['Email', P.contact.email, 'mailto:'+P.contact.email],
        ['Phone', P.contact.phone, P.contact.phoneHref],
        ['GitHub', '@'+P.contact.githubUser, P.contact.github],
        ['WeChat', 'QR ↗', P.contact.wechatQrPage],
      ].map(([k,v,h])=>`<a href="${esc(h)}"><span>${esc(k)}</span><span>${esc(v)}</span></a>`).join('');
      document.getElementById('cf-name').placeholder = t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder = t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder = t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent = t(P.ui.get_in_touch);
      // footer
      document.getElementById('foot-social').innerHTML =
        `<a href="${P.contact.github}" target="_blank">GitHub</a>
         <a href="mailto:${P.contact.email}">Email</a>
         <a href="${P.contact.wechatQrPage}">WeChat</a>
         <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent = t(P.ui.footer_desc);
      const icp = document.getElementById('foot-icp'); icp.textContent = P.icp; icp.href = P.icpUrl;
      // filters
      document.getElementById('filters').innerHTML = P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box = document.getElementById('projects-list');
      if(!projects.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.className='grid cards';
      box.innerHTML = projects.map(p=>`
        <a class="card" href="${esc(p.detailHref)}">
          <div class="cbody">
            <div class="ctag"><span>${esc(t(P.ui.tech_stack))}</span><span>${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <p style="color:var(--red);font-weight:600;font-size:13px">${esc(p.tech_stack||'')}</p>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div></a>`).join('');
    }

    function renderArticles(){
      const box = document.getElementById('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML = list.map(a=>`
        <a class="card" href="${esc(a.detailHref)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" loading="lazy" decoding="async" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
          <div class="cbody">
            <div class="ctag"><span>${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div></a>`).join('');
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML = `<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-list').innerHTML = `<div class="load-note">⚠ Failed to load articles.</div>`; }
    }

    // Contact submit
    document.getElementById('cf').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      const payload = { name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color='var(--grey)'; s.textContent = t(P.ui.sending);
      try{ const r = await CJCData.sendContact(payload); s.style.color='#148f77'; s.textContent = r.message||'Sent.'; f.reset(); }
      catch(err){ s.style.color='var(--red)'; s.textContent = err.message; }
    });

    // Font Awesome for course icons
    const fa = document.createElement('link');
    fa.rel='stylesheet'; fa.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css';
    document.head.appendChild(fa);

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:'#e2231a' });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
  <script>
  (()=>{
    'use strict';
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const fine=matchMedia('(pointer: fine)').matches;
    if(reduce||!fine)return;
    const target=document.createElement('span');
    target.className='rb-swiss-target';target.setAttribute('aria-hidden','true');document.body.appendChild(target);
    let x=-60,y=-60,raf=0;
    const paint=()=>{target.style.transform=`translate3d(${x-15}px,${y-15}px,0)`;raf=0};
    addEventListener('pointermove',event=>{x=event.clientX;y=event.clientY;target.classList.add('is-visible');if(!raf)raf=requestAnimationFrame(paint)},{passive:true});
    document.addEventListener('pointerover',event=>target.classList.toggle('is-active',!!event.target.closest('a,button,input,textarea')));
    document.addEventListener('pointerout',event=>{if(!event.relatedTarget)target.classList.remove('is-visible')});
  })();
  </script>
</body>
</html>

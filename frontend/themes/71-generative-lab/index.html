(()=>{'use strict';const P=CJCData.profile,t=CJCData.t.bind(CJCData),e=CJCData.escapeHtml,PARAMS=[['density',45,16,90,1],['velocity',24,8,60,1],['radius',80,35,120,1],['decay',85,20,100,1]];let projects=[],articles=[],filter='all',viz=null,labMode='view',immersive=false,statusTimer=null,statusMessage='',statusVisible=false;const query=new URLSearchParams(location.search),labParams=Object.fromEntries(PARAMS.map(([id,fallback,min,max])=>{const value=Number(query.get(id));return [id,Number.isFinite(value)?Math.min(max,Math.max(min,value)):fallback]}));const L={en:{nav:[['about','profile'],['system','system'],['projects','outputs'],['articles','log'],['contact','connect']],ey:'Browser based personal lab',intro:'A live system for building software, agents and ideas.',play:'Run sequence',pause:'Pause',cv:'Export CV',parameters:'Parameters',shape:'Signal form',density:'Density',velocity:'Velocity',radius:'Radius',decay:'Decay',edit:'Edit',code:'Code',view:'View',exitView:'Exit view',share:'Share',codeTitle:'Signal source',copyCode:'Copy code',close:'Close',editReady:'Parameter editor active. Use the sliders to reshape the signal.',viewEntered:'Immersive view enabled.',viewExited:'Immersive view closed.',shared:'Share sheet opened.',linkCopied:'Share link copied.',codeCopied:'Code copied.',shareFailed:'Unable to share this configuration.',about:'Profile input',aboutLead:'Human context for the system.',system:'Capability matrix',systemLead:'Education, tools and courses mapped as live modules.',exp:'Process log',expLead:'Production experience, rendered as an execution trace.',projects:'Generated outputs',projectsLead:'Real projects from the live portfolio API.',articles:'Research log',articlesLead:'Articles and field notes with active filtering.',cert:'Verified records',certLead:'Certificates and milestone artefacts.',contact:'Open channel',contactLead:'Send a message to the system owner.',loc:'Location',open:'Open output',read:'Read log',failed:'DATA_STREAM_UNAVAILABLE. Retr function hero(){const x=l(),running=!matchMedia('(prefers-reduced-motion: reduce)').matches;return `<section class="hero${immersive?' is-immersive':''}" id="top"><div class="intro"><div><div class="eyebrow">${e(x.ey)}</div><h1>${e(t(P.name))}</h1><p>${e(x.intro)} ${e(t(P.headline))}.</p><div class="actions"><button class="btn primary" id="play" type="button"><i class="fa fa-${running?'pause':'play'}" aria-hidden="true"></i><span>${e(running?x.pause:x.play)}</span></button><a class="btn" href="${e(t(P.cv))}" download><i class="fa fa-download" aria-hidden="true"></i>${e(x.cv)}</a></div></div><div><div class="eyebrow">${e(t(P.role))}</div><p>${e(t(P.title))}</p></div></div><div class="viewport"><div class="scope"><canvas id="scope" role="img" aria-label="Animated generative line form controlled by the parameter sliders"></canvas></div><div class="scope-data"><span>DEC: -45° 32′ 16.8″</span><span>FPS: 60 / MEM: 128M</span></div></div><aside class="controls${labMode==='edit'?' is-editing':''}"><div class="control-head">${e(x.parameters)} / ${e(x.shape)}</div>${PARAMS.map(v=>`<div class="control"><label for="${v[0]}">${e(x[v[0]])}<output id="${v[0]}-out">${labParams[v[0]]}</output></label><input id="${v[0]}" type="range" value="${labParams[v[0]]}" min="${v[2]}" max="${v[3]}" step="${v[4]}"></div>`).join('')}</aside></section><div class="toolrow" aria-label="Generative lab tools">${[['edit','pencil'],['code','code'],['view','desktop'],['share','share-alt']].map(v=>{const active=v[0]==='view'?labMode==='view':labMode===v[0],label=v[0]==='view'&&immersive?x.exitView:x[v[0]];return `<button type="button" data-tool="${v[0]}" aria-pressed="${active}" aria-label="${e(label)}"><i class="fa fa-${v[1]}" aria-hidden="true"></i><span>${e(label)}</span></button>`}).join('')}</div><dialog class="code-dialog" id="code-dialog" aria-labelledby="code-title"><div class="dialog-head"><h2 id="code-title">${e(x.codeTitle)}</h2><button class="dialog-close" type="button" data-close-code aria-lab function projectSection(){const x=l(),body=projects.length?`<div class="projects reveal">${projects.map((p,i)=>`<a class="card" href="${e(p.href)}"><figure><img loading="lazy" src="${e(p.cover_image||'/index_page/img/blogs/1.jpg')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(p.localTitle())}"></figure><div class="card-body"><time>OUT_${String(i+1).padStart(2,'0')} / ${e(p.dateText())}</time><h3>${e(p.localTitle())}</h3><p>${e(p.localSummary()||'')}</p><span class="go">${e(x.open)} <i class="fa fa-arrow-right" aria-hidden="true"></i></span></div></a>`).join('')}</div>`:`<p class="loading">${e(t(P.ui.loading_projects))}</p>`;return `<section class="content" id="projects">${head('projects')}${body}</section>`}
function articleSection(){const x=l(),list=CJCData.filterArticles(articles,filter),body=!articles.length?`<p class="loading">${e(t(P.ui.loading_articles))}</p>`:!list.length?`<p class="loading">${e(t(P.ui.no_articles))}</p>`:`<div class="articles reveal">${list.map(a=>`<a class="card" href="${e(a.href)}"><figure><img loading="lazy" src="${e(a.cover_image||'/index_page/img/blogs/1.jpg')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(a.localTitle())}"></figure><div class="card-body"><time>${e(a.category||'LOG')} / ${e(a.dateText())}</time><h3>${e(a.localTitle())}</h3><p>${e(a.localSummary()||'')}</p><span class="go">${e(x.read)} <i class="fa fa-arrow-right" aria-hidden="true"></i></span></div></a>`).join('')}</div>`;return `<section class="content" id="articles">${head('articles')}<div class="filters">${P.articleFilters.map(f=>`<button type="button" data-filter="${e(f.key)}" class="${filter===f.key?'active':''}">${e(t(f.label))}</button>`).join('')}</div>${body}</section>`}
function certs(){return `<section class="content">${head('cert')}<div class="certs reveal">${P.certificates.map(c=>`<article class="cert"><img loading="lazy" src="${e(c.image)}" alt="${e(t(c.title))}"><div><div class="eyebrow">${e(t(c.tag))} / ${e(t(c.date))}</div><h3>${e(t(c.title))}</h3><p>${e(t(c.desc))}</p></div></article>`).join('')}</div></section>`}
function contact(){const x=l();return `<section class="content" id="contact">${head('contact')}<div class="contact reveal"><div><h2>${e(x.contact)}</h2><div class="contact-links"><a href="mailto:${e(P.contact.email)}"><span>Email</span><span>${e(P.contact.email)}</span></a><a href="${e(P.contact.github)}" target="_blank" rel="noopener"><span>GitHub</span><span>@${e(P.contact.githubUser)}</span></a><a href="${e(P.contact.wechatQrPage)}"><span>WeChat</span><span>QR</span></a></div></div><form id="contact-form"><input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true"><label for="name">${e(x.name)}</label><input id="name" name="name" autocomplete="name" required><label for="email">${e(x.email)}</label><input id="email" type="email" name="email" autocomplete="email" required><label for="message">${e(x.message)}</label><textarea id="message" name="message" required></textarea><button class="btn primary" type="submit">${e(x.send)}</button><p id="status" role="status" aria-live="polite"></p></form></div></section>`}
function render(){const x=l();document.title=`GEN_CJC — ${t(P.name)}`;document.getElementById('nav').innerHTML=x.nav.map(v=>`<a href="#${e(v[0])}">${e(v[1])}</a>`).join('');document.getElementById('app').innerHTML=hero()+about()+system()+experience()+projectSection()+articleSection()+certs()+contact();document.getElementById('footnote').textContent=t(P.ui.footer_desc);document.getElementById('footlinks').innerHTML=`<a href="${e(P.contact.github)}">GITHUB</a><a href="mailto:${e(P.contact.email)}">EMAIL</a><a href="/admin.html">${e(t(P.ui.admin_panel))}</a><a href="${e(P.icpUrl)}">${e(P.icp)}</a>`;wire();observe();startViz();if(labMode==='edit')setTimeout(()=>document.getElementById('density')?.focus(),0);if(labMode==='code')requestAnimationFrame(openCode)}
function setActiveTool(tool){labMode=tool;document.querySelectorAll('[data-tool]').forEach(b=>{const active=b.dataset.tool===tool;b.setAttribute('aria-pressed',String(active))});document.querySelector('.controls')?.classList.toggle('is-editing',tool==='edit')}
function announce(message){statusMessage=message;statusVisible=true;const node=document.getElementById('lab-status');if(!node)return;clearTimeout(statusTimer);node.textContent=message;node.classList.add('show');statusTimer=setTimeout(()=>{statusVisible=false;document.getElementById('lab-status')?.classList.remove('show')},2600)}
function signalCode(){return `const params = ${JSON.stringify(labParams,null,2)};\n\nfunction drawSignal(ctx, width, height, time) {\n  const { density, velocity, radius, decay } = params;\n  const centerX = width / 2;\n  const centerY = height / 2;\n  const scale = radius / 100 * Math.min(width, height) * 0.34;\n\n  ctx.globalCompositeOperation = 'lighter';\n  for (let layer = 0; layer < Math.max(12, density); layer += 1) {\n    ctx.beginPath();\n    ctx.strokeStyle = \`rgba(55, 126, 255, \${0.12 + 0.38 * decay / 100})\`;\n    for (let point = 0; point < 260; point += 1) {\n      const angle = point / 260 * Math.PI * 2 * (2 + layer % 5);\n      const wave = scale * (0.45 + 0.5 * Math.sin(angle * (1 + (layer % 7) * 0.07) + time + layer * 0.4));\n      const x = centerX + Math.cos(angle + time * 0.31) * wave;\n      const y = centerY + Math.sin(angle * 1.3 - time * 0.22) * wave * 0.72;\n      point ? ctx.lineTo(x, y) : ctx.moveTo(x, y);\n    }\n    ctx.stroke();\n  }\n\n  return time + velocity / 400;\n}`}
async function copyText(value){if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value);return}const field=document.createElement('textarea');field.value=value;field.setAttribute('readonly','');field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();const copied=document.execCommand('copy');field.remove();if(!copied)throw new Error('copy failed')}
function openCode(){setActiveTool('code');const dialog=document.getElementById('code-dialog');document.getElementById('code-output').textContent=signalCode();if(typeof dialog.showModal==='function')dialog.showModal();else dialog.setAttribute('open','')}
function closeCode(){const dialog=document.getElementById('code-dialog');if(dialog.open&&typeof dialog.close==='function')dialog.close();else dialog.removeAttribute('open');setActiveTool('view');document.querySelector('[data-tool="code"]')?.focus()}
function editSignal(){immersive=false;document.querySelector('.hero')?.classList.remove('is-immersive');setActiveTool('edit');const control=document.getElementById('density');control?.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});setTimeout(()=>control?.focus(),220);announce(l().editReady)}
function toggleView(){immersive=!immersive;setActiveTool('view');document.querySelector('.hero')?.classList.toggle('is-immersive',immersive);const button=document.querySelector('[data-tool="view"]'),label=immersive?l().exitView:l().view;button?.setAttribute('aria-label',label);const span=button?.querySelector('span');if(span)span.textContent=label;document.getElementById('top')?.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});window.dispatchEvent(new Event('resize'));announce(immersive?l().viewEntered:l().viewExited)}
async function shareSignal(button){const url=new URL(location.href);PARAMS.forEach(([id])=>url.searchParams.set(id,String(labParams[id])));button.disabled=true;button.setAttribute('aria-busy','true');try{if(typeof navigator.share==='function'){await navigator.share({title:document.title,text:l().intro,url:url.toString()});announce(l().shared)}else{await copyText(url.toString());announce(l().linkCopied)}}catch(err){if(err?.name!=='AbortError')announce(l().shareFailed)}finally{button.disabled=false;button.removeAttribute('aria-busy')}}
function wire(){document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;render()}));document.querySelectorAll('[data-tool]').forEach(button=>button.addEventListener('click',()=>{const tool=button.dataset.tool;if(tool==='edit')editSignal();if(tool==='code')openCode();if(tool==='view')toggleView();if(tool==='share')shareSignal(button)}));document.querySelectorAll('[data-close-code]').forEach(button=>button.addEventListener('click',closeCode));document.querySelector('[data-copy-code]')?.addEventListener('click',async()=>{try{await copyText(signalCode());announce(l().codeCopied)}catch(err){announce(l().shareFailed)}});const dialog=document.getElementById('code-dialog');dialog?.addEventListener('cancel',ev=>{ev.preventDefault();closeCode()});dialog?.addEventListener('click',ev=>{if(ev.target===dialog)closeCode()});const f=document.getElementById('contact-form');f&&f.addEventListener('submit',async ev=>{ev.preventDefault();const s=document.getElementById('status'),x=l(),btn=f.querySelector('button');btn.disabled=true;s.textContent=x.sending;try{const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});s.textContent=r.message||x.sent;f.reset()}catch(err){s.textContent=err.message||x.failed}finally{btn.disabled=false}})}
function startViz(){if(viz)cancelAnimationFrame(viz);const canvas=document.getElementById('scope');if(!canvas)return;const ctx=canvas.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,state={run:!reduce,t:0};const inputs=PARAMS.map(([id])=>document.getElementById(id));inputs.forEach(inp=>inp.addEventListener('input',()=>{labParams[inp.id]=Number(inp.value);document.getElementById(inp.id+'-out').value=inp.value;if(reduce)draw()}));document.getElementById('play').addEventListener('click',()=>{state.run=!state.run;document.querySelector('#play span').textContent=state.run?l().pause:l().play;document.querySelector('#play i').className='fa fa-'+(state.run?'pause':'play');if(state.run)draw()});function fit(){const dpr=Math.min(devicePixelRatio||1,2),r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}function draw(){fit();const w=canvas.clientWidth,h=canvas.clientHeight,cx=w/2,cy=h/2,D=+inputs[0].value,V=+inputs[1].value/400,R=+inputs[2].value/100*Math.min(w,h)*.34,fade=+inputs[3].value/100;ctx.clearRect(0,0,w,h);ctx.globalCompositeOperation='lighter';ctx.lineWidth=.7;for(let j=0;j<Math.max(12,D);j++){ctx.beginPath();ctx.strokeStyle=`rgba(55,126,255,${.12+.38*fade})`;for(let i=0;i<260;i++){const a=i/260*Math.PI*2*(2+j%5),m=R*(.45+.5*Math.sin(a*(1+(j%7)*.07)+state.t+j*.4)),x=cx+Math.cos(a+state.t*.31)*m,y=cy+Math.sin(a*1.3-state.t*.22)*m*.72;(i?ctx.lineTo(x,y):ctx.moveTo(x,y))}ctx.stroke()}ctx.globalCompositeOperation='source-over';if(state.run){state.t+=V;viz=requestAnimationFrame(draw)}}draw()}
let io;function observe(){if(matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('.reveal').forEach(n=>n.classList.add('in'));return}if(io)io.disconnect();io=new IntersectionObserver(es=>es.forEach(v=>{if(v.isIntersecting){v.target.classList.add('in');io.unobserve(v.target)}}),{threshold:.1});document.querySelectorAll('.reveal').forEach(n=>io.observe(n))}
document.addEventListener('DOMContentLoaded',async()=>{CJCData.setTheme(window.THEME_ID);render();CJCData.mountSwitcher({accent:'#1245c8'});CJCData.onLang(render);try{[projects,articles]=await Promise.all([CJCData.fetchProjects(),CJCData.fetchArticles()]);render()}catch(err){document.querySelectorAll('.loading').forEach(n=>{n.textContent=l().failed})}})})();
</script></body></html>

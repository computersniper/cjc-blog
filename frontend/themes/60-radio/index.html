<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Tune In</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{ --amber:#ffb43a; --amber2:#ffd27a; --grn:#39ff88; --red:#ff5a4a;
      --ink:#e7e4d6; --mut:#8f9782; --line:rgba(255,180,58,.22);
      --chassis:#20241c; --chassis2:#161a12; --panel:#0c0f0a; }
    *{box-sizing:border-box}
    body{margin:0;color:var(--ink);font-family:'Share Tech Mono',ui-monospace,monospace;line-height:1.6;
      height:100vh;height:100dvh;overflow:hidden;
      background:radial-gradient(120% 90% at 50% 6%,#2a2f22,#0a0c08 78%);
      display:flex;align-items:center;justify-content:center;padding:14px}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    h1,h2,h3,.disp{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.04em}
    ::selection{background:var(--amber);color:#191400}

    /* ===== radio chassis ===== */
    .radio{position:relative;width:100%;max-width:1060px;height:100%;max-height:900px;
      display:flex;flex-direction:column;min-height:0;
      background:linear-gradient(165deg,#2b3126,var(--chassis) 24%,var(--chassis2));
      border-radius:26px;padding:16px 18px 14px;
      box-shadow:0 2px 0 rgba(255,255,255,.05) inset,0 -16px 34px rgba(0,0,0,.5) inset,
        0 30px 70px rgba(0,0,0,.6),0 0 0 2px #0a0c08;}
    .screw{position:absolute;width:12px;height:12px;border-radius:50%;
      background:radial-gradient(circle at 35% 35%,#4a4f3e,#1a1d15);box-shadow:inset 0 0 3px #000}
    .screw.tl{top:12px;left:12px}.screw.tr{top:12px;right:12px}.screw.bl{bottom:12px;left:12px}.screw.br{bottom:12px;right:12px}

    /* head bar: brand, power, band, freq LED, signal */
    .head{flex:none;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
      padding:4px 6px 12px;border-bottom:1px solid var(--line)}
    .brand{font-family:'Oswald';font-weight:700;font-size:18px;letter-spacing:.08em;white-space:nowrap}
    .brand b{color:var(--amber)}
    .brand .sub{display:block;font-family:'Share Tech Mono';font-size:10px;color:var(--mut);letter-spacing:.24em}
    .ledwrap{justify-self:center;text-align:center;background:#07090a;border:1px solid var(--line);border-radius:10px;
      padding:6px 20px;box-shadow:inset 0 0 22px rgba(255,180,58,.08);min-width:210px}
    .ledwrap .freq{font-size:clamp(26px,5vw,40px);color:var(--amber);letter-spacing:.05em;line-height:1;
      text-shadow:0 0 14px rgba(255,180,58,.7)}
    .ledwrap .freq.off{color:#3a3a2a;text-shadow:none}
    .ledwrap .u{font-size:11px;color:var(--mut);letter-spacing:.24em;margin-top:3px}
    .ledwrap .u b{color:var(--grn)}
    .headright{display:flex;align-items:center;gap:12px;padding-right:0}
    .powwrap{display:flex;flex-direction:column;align-items:center;gap:3px}
    .pow{width:46px;height:26px;border-radius:14px;background:#0a0d0a;border:1px solid var(--line);position:relative;cursor:pointer}
    .pow .nub{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#555;transition:.18s}
    .pow.on{background:rgba(57,255,136,.18)}.pow.on .nub{left:22px;background:var(--grn);box-shadow:0 0 10px var(--grn)}
    .powwrap .cap{font-size:9px;color:var(--mut);letter-spacing:.16em}
    .sig{display:flex;gap:3px;align-items:flex-end;height:26px}
    .sig i{width:5px;background:#2a3327;border-radius:1px;transition:.12s}
    .sig i.on{background:var(--amber);box-shadow:0 0 6px rgba(255,180,58,.6)}
    @media(max-width:640px){ .head{grid-template-columns:1fr auto}
      .brand .sub{display:none}.ledwrap{grid-column:1/-1;order:3;min-width:0}.headright{justify-self:end} }

    /* display */
    .display{flex:1 1 auto;min-height:0;position:relative;margin:12px 0;border-radius:14px;overflow:hidden;
      background:radial-gradient(120% 100% at 50% 0,#12160f,#080a06);
      border:1px solid var(--line);box-shadow:inset 0 0 40px rgba(0,0,0,.7),0 0 26px rgba(255,180,58,.06)}
    .display::before{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;opacity:.5;
      background:repeating-linear-gradient(180deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
    #screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:22px 24px;z-index:2;
      scrollbar-width:thin;scrollbar-color:var(--amber) transparent}
    #screen::-webkit-scrollbar{width:8px}#screen::-webkit-scrollbar-thumb{background:rgba(255,180,58,.5);border-radius:5px}
    #interstitial{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:14px;background:#070806;text-align:center;padding:20px}
    #interstitial canvas{width:100%;max-width:520px;height:120px;background:#050604;border:1px solid var(--line);border-radius:8px}
    #interstitial .msg{color:var(--amber);letter-spacing:.14em;font-size:15px}
    #interstitial .near{color:var(--mut);font-size:13px;letter-spacing:.1em}
    #interstitial .near b{color:var(--amber2)}
    .powerdown{position:absolute;inset:0;z-index:8;background:#050604;display:flex;align-items:center;justify-content:center;
      color:#2f3326;letter-spacing:.3em;font-size:14px;transition:opacity .3s}

    /* station content */
    .stn-head{display:flex;align-items:center;gap:10px;margin:0 0 18px;flex-wrap:wrap}
    .stn-head .fq{font-family:'Oswald';font-weight:700;color:var(--amber);font-size:15px;border:1px solid var(--line);
      padding:3px 9px;border-radius:5px;text-shadow:0 0 8px rgba(255,180,58,.5)}
    .stn-head h2{font-size:clamp(22px,4vw,34px);margin:0;color:var(--ink)}
    .stn-head .live{margin-left:auto;color:var(--grn);font-size:12px;letter-spacing:.1em;text-shadow:0 0 6px rgba(57,255,136,.5)}
    .stn-head .live::before{content:"● "}
    .lead{color:#cfcbb8;max-width:70ch;margin:0 0 14px}

    .about{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:start}
    @media(max-width:600px){.about{grid-template-columns:1fr}}
    .about img{width:100%;border-radius:10px;border:1px solid var(--line);aspect-ratio:1;object-fit:cover;filter:contrast(1.05) sepia(.12)}
    .about p{color:#cfcbb8;margin:0 0 12px;max-width:60ch}
    .loc{display:inline-flex;gap:8px;align-items:center;color:var(--amber);border:1px solid var(--amber);border-radius:6px;padding:6px 12px;letter-spacing:.06em;font-size:13px}
    .btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
    .btn{display:inline-flex;align-items:center;gap:8px;font-family:'Oswald';text-transform:uppercase;letter-spacing:.06em;
      font-size:13px;padding:11px 18px;border-radius:6px;cursor:pointer;border:2px solid var(--amber);background:transparent;color:var(--amber)}
    .btn.pri{background:var(--amber);color:#191400}
    .btn:hover{background:rgba(255,180,58,.14)}.btn.pri:hover{background:var(--amber2)}

    .logrows{display:flex;flex-direction:column;gap:0}
    .logrow{padding:15px 0;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:128px 1fr;gap:16px}
    .logrow:last-child{border-bottom:none}
    .logrow .ts{color:var(--grn);font-size:13px}
    .logrow h3{margin:0 0 4px;font-size:17px;color:var(--amber)}
    .logrow .s{color:var(--mut);font-size:14px}
    .logrow ul{margin:8px 0 0;padding-left:18px;color:#cfcbb8;font-size:14px;line-height:1.7}
    @media(max-width:560px){.logrow{grid-template-columns:1fr;gap:4px}}

    .subhead{font-family:'Oswald';color:var(--amber2);letter-spacing:.1em;font-size:13px;margin:22px 0 12px;
      border-top:1px dashed var(--line);padding-top:14px}
    .subhead:first-child{border-top:0;padding-top:0;margin-top:0}
    .freqs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    @media(max-width:560px){.freqs{grid-template-columns:1fr}}
    .frow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;padding:11px 13px;background:#0d110d;min-width:0}
    .frow .fq{color:var(--amber);font-size:13px;width:60px;flex-shrink:0}
    .frow .v{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
    .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .tags span{font-size:12px;padding:6px 12px;border-radius:4px;border:1px solid var(--line);color:var(--amber2);background:rgba(255,180,58,.06)}

    .courses{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    @media(max-width:560px){.courses{grid-template-columns:1fr}}
    .course{border:1px solid var(--line);border-radius:10px;padding:16px;background:#0d110d}
    .course i.fa{color:var(--amber);font-size:20px}
    .course h4{margin:10px 0 7px;font-size:15px;color:var(--ink);font-family:'Oswald';text-transform:none}
    .course p{margin:0;color:var(--mut);font-size:13.5px}

    .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
    @media(max-width:620px){.cards{grid-template-columns:1fr}}
    .card{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:#0d110d;transition:.16s}
    .card:hover{border-color:var(--amber);box-shadow:0 0 20px rgba(255,180,58,.16);transform:translateY(-3px)}
    .card .cover{height:140px;overflow:hidden;background:#060806;position:relative}
    .card .cover img{width:100%;height:100%;object-fit:cover;filter:sepia(.22) contrast(1.05)}
    .card .inc{position:absolute;top:8px;left:8px;font-family:'Oswald';font-size:10px;letter-spacing:.1em;color:#191400;background:var(--amber);padding:2px 8px;border-radius:3px}
    .cbody{padding:14px;display:flex;flex-direction:column;gap:7px;flex:1}
    .ctag{display:flex;justify-content:space-between;font-size:11px;color:var(--grn);letter-spacing:.06em}
    .card h4{margin:0;font-family:'Oswald';font-size:16px;line-height:1.3;color:var(--amber);text-transform:none}
    .card p{margin:0;color:var(--mut);font-size:13.5px;flex:1}
    .tech{color:var(--amber2);font-size:12.5px}
    .more{color:var(--amber);font-family:'Oswald';font-size:12px;letter-spacing:.08em}

    .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
    .filters button{font-family:'Oswald';text-transform:uppercase;letter-spacing:.06em;font-size:12px;background:#0d110d;
      border:1px solid var(--line);color:var(--mut);padding:7px 13px;border-radius:5px;cursor:pointer}
    .filters button.active,.filters button:hover{background:var(--amber);border-color:var(--amber);color:#191400}

    .certs{display:grid;grid-template-columns:1fr 1fr;gap:15px}
    @media(max-width:620px){.certs{grid-template-columns:1fr}}
    .cert{display:grid;grid-template-columns:108px 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0d110d}
    .cert img{width:100%;height:100%;object-fit:cover;min-height:120px;filter:sepia(.22)}
    .cert .ct{padding:13px}
    .cert .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--grn);letter-spacing:.06em}
    .cert h4{margin:7px 0 5px;font-family:'Oswald';font-size:15px;color:var(--amber);text-transform:none}
    .cert p{margin:0;color:var(--mut);font-size:13px}
    @media(max-width:400px){.cert{grid-template-columns:78px 1fr}}

    .contact{display:grid;grid-template-columns:1fr 1.2fr;gap:22px}
    @media(max-width:640px){.contact{grid-template-columns:1fr}}
    .cinfo a{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px dashed var(--line)}
    .cinfo a span:first-child{color:var(--mut);letter-spacing:.04em}
    .cinfo a span:last-child{color:var(--amber)}
    form input,form textarea{width:100%;background:#060806;border:1px solid var(--line);border-radius:8px;color:var(--ink);
      font-family:inherit;font-size:15px;padding:12px;margin-bottom:11px}
    form input:focus,form textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 10px rgba(255,180,58,.2)}
    form textarea{min-height:110px;resize:vertical}
    #cf-status{font-family:'Oswald';margin-top:8px;font-size:14px;letter-spacing:.04em;min-height:1.2em}
    .fsoc{display:flex;flex-wrap:wrap;gap:16px;margin-top:6px}
    .fsoc a{color:var(--amber);font-family:'Oswald';font-size:13px;letter-spacing:.06em}
    .fsoc a:hover{color:var(--amber2)}
    .colophon{color:var(--mut);font-size:12px;margin-top:16px;line-height:1.8}
    .colophon a{color:var(--amber)}
    .load-note{color:var(--mut);text-align:center;padding:18px;border:1px dashed var(--line);border-radius:8px}

    /* numbers station easter egg */
    .numbers{text-align:center}
    .numbers .grp{font-size:clamp(24px,6vw,44px);color:var(--grn);letter-spacing:.3em;text-shadow:0 0 14px rgba(57,255,136,.5);margin:14px 0}
    .numbers .morse{font-size:26px;color:var(--amber);letter-spacing:.2em;margin:12px 0}
    .numbers .dec{color:var(--amber2);letter-spacing:.14em;font-size:14px}

    /* ===== console (bottom controls) ===== */
    .console{flex:none;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;padding-top:6px}
    @media(max-width:760px){.console{grid-template-columns:1fr}}
    .tunearea{min-width:0}
    .bandrow{display:flex;gap:8px;margin-bottom:9px;align-items:center;flex-wrap:wrap}
    .bandrow .band{font-family:'Oswald';font-size:12px;letter-spacing:.08em;border:1px solid var(--line);color:var(--mut);
      background:#0d110d;border-radius:5px;padding:5px 12px;cursor:pointer}
    .bandrow .band.active{background:var(--amber);border-color:var(--amber);color:#191400}
    .bandrow .presets{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
    .bandrow .presets button{font-size:11px;font-family:'Oswald';letter-spacing:.04em;background:#0d110d;border:1px solid var(--line);
      color:var(--amber2);border-radius:4px;padding:4px 8px;cursor:pointer}
    .bandrow .presets button:hover,.bandrow .presets button.active{background:rgba(255,180,58,.16);border-color:var(--amber);color:var(--amber)}
    .dial{position:relative;height:64px;background:linear-gradient(180deg,#0a0d0a,#060806);border:1px solid var(--line);border-radius:10px;
      overflow:hidden;cursor:ew-resize;touch-action:none;box-shadow:inset 0 0 20px rgba(0,0,0,.7)}
    .dial .scale{position:absolute;inset:0}
    .dial .tick{position:absolute;bottom:0;width:1px;background:rgba(255,180,58,.4)}
    .dial .tick.maj{background:rgba(255,180,58,.75);height:20px}
    .dial .tick.min{height:11px;opacity:.5}
    .dial .lbl{position:absolute;top:6px;transform:translateX(-50%);font-size:11px;color:var(--mut)}
    .dial .stn{position:absolute;top:24px;transform:translateX(-50%);font-family:'Oswald';font-size:10px;letter-spacing:.04em;
      color:var(--amber2);white-space:nowrap;text-align:center;pointer-events:none}
    .dial .stn i{display:block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin:2px auto 0;box-shadow:0 0 6px var(--amber)}
    .dial .guard{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(255,90,74,.18) 0 6px,transparent 6px 12px)}
    .dial .needle{position:absolute;top:0;bottom:0;width:2px;background:var(--red);box-shadow:0 0 10px var(--red);left:0;z-index:3}
    .dial .needle::after{content:"";position:absolute;top:-1px;left:-4px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:7px solid var(--red)}

    .knobs{display:flex;gap:16px;align-items:flex-end;justify-content:flex-end}
    .knobwrap{display:flex;flex-direction:column;align-items:center;gap:5px}
    .knob{width:58px;height:58px;border-radius:50%;position:relative;cursor:grab;touch-action:none;
      background:radial-gradient(circle at 38% 34%,#4a4f3e,#20241a 66%,#0e110a);
      box-shadow:0 4px 10px rgba(0,0,0,.6),inset 0 2px 3px rgba(255,255,255,.08),inset 0 -3px 6px rgba(0,0,0,.6)}
    .knob::after{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:3px;height:16px;border-radius:2px;
      background:var(--amber);box-shadow:0 0 6px var(--amber)}
    .knob.tuning{width:70px;height:70px}
    .knobwrap .cap{font-family:'Oswald';font-size:10px;letter-spacing:.12em;color:var(--mut)}
    .knobwrap .val{font-size:11px;color:var(--amber2)}
    .ptt{align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
      background:linear-gradient(180deg,#c0392b,#8a271c);color:#fff;border:none;border-radius:12px;font-family:'Oswald';
      font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;padding:10px 18px;cursor:pointer;
      box-shadow:0 6px 0 #5e1a12,0 8px 14px rgba(0,0,0,.5);transition:.08s}
    .ptt:active,.ptt.tx{transform:translateY(4px);box-shadow:0 2px 0 #5e1a12}
    .ptt small{font-size:9px;opacity:.8;letter-spacing:.1em}

    a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

    /* reduced motion / list fallback */
    body.rm{height:auto;overflow:auto;display:block;padding:20px 14px 60px}
    body.rm .radio{height:auto;max-height:none;margin:0 auto}
    body.rm .display{overflow:visible}
    body.rm #screen{position:static;overflow:visible;padding:20px 4px}
    body.rm #interstitial,body.rm .powerdown{display:none!important}
    body.rm .console{display:none}
    body.rm .rm-note{display:block}
    .rm-note{display:none;color:var(--mut);font-size:12px;letter-spacing:.08em;margin:0 0 16px;border:1px dashed var(--line);border-radius:8px;padding:10px}
    .rm-stn{border-top:2px solid var(--line);margin-top:24px;padding-top:18px}
    .rm-stn:first-of-type{border-top:0;margin-top:0}
  </style>
</head>
<body>
  <div class="radio" id="radio">
    <span class="screw tl"></span><span class="screw tr"></span><span class="screw bl"></span><span class="screw br"></span>
    <div class="head">
      <div class="brand">Cai<b>Jiechao</b><span class="sub" id="brandsub">FIELD RADIO · TUNE IN</span></div>
      <div class="ledwrap"><div class="freq" id="freqLed">100.3</div><div class="u"><b id="bandLbl">FM</b> · <span id="unitLbl">MHz</span> · <span id="stnLbl">DISPATCHES</span></div></div>
      <div class="headright">
        <div class="sig" id="sig" aria-label="signal strength"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="powwrap"><div class="pow on" id="pow" role="button" tabindex="0" aria-label="power"><span class="nub"></span></div><span class="cap">POWER</span></div>
      </div>
    </div>

    <div class="display">
      <div id="screen" aria-live="polite"></div>
      <div id="interstitial">
        <canvas id="scope" width="520" height="120"></canvas>
        <div class="msg" id="int-msg">◌ SEARCHING…</div>
        <div class="near" id="int-near"></div>
      </div>
      <div class="powerdown" id="powerdown" style="display:none">— STANDBY —</div>
    </div>

    <div class="console">
      <div class="tunearea">
        <div class="bandrow">
          <button class="band active" id="band-FM" data-band="FM">FM</button>
          <button class="band" id="band-AM" data-band="AM">AM</button>
          <div class="presets" id="presets"></div>
        </div>
        <div class="dial" id="dial"><div class="scale" id="scale"></div><div class="needle" id="needle"></div></div>
      </div>
      <div class="knobs">
        <div class="knobwrap"><div class="knob tuning" id="tuneKnob" aria-label="tuning knob"></div><span class="cap">TUNE</span></div>
        <div class="knobwrap"><div class="knob" id="volKnob" aria-label="volume knob"></div><span class="cap">VOL</span><span class="val" id="volVal">7</span></div>
        <button class="ptt" id="ptt">PTT<small id="ptt-sub">SEND</small></button>
      </div>
    </div>
  </div>

  <script>window.THEME_ID = "60-radio";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P=CJCData.profile,t=CJCData.t.bind(CJCData),esc=CJCData.escapeHtml;
    const RM=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    let articles=[],projects=[],filterKey="all";

    const T={
      brandsub:{en:'FIELD RADIO · TUNE IN',zh:'野外电台 · 调频收听'},
      searching:{en:'◌ SEARCHING…',zh:'◌ 搜索信号…'},
      near:{en:'nearest station',zh:'最近电台'},
      tuneHint:{en:'drag the dial or turn TUNE',zh:'拖动刻度盘或旋转 TUNE 旋钮'},
      acquiring:{en:'▓ SIGNAL ACQUIRING…',zh:'▓ 接收信号中…'},
      live:{en:'ON AIR',zh:'正在广播'},
      ptt:{en:'SEND',zh:'发送'},
      tx:{en:'● TRANSMITTING',zh:'● 正在传输'},
      // station display names
      s_profile:{en:'PROFILE',zh:'个人档案'}, s_career:{en:'CAREER LOG',zh:'履历'},
      s_workshop:{en:'WORKSHOP',zh:'工作台'}, s_projects:{en:'PROJECTS',zh:'项目'},
      s_dispatches:{en:'DISPATCHES',zh:'快讯'}, s_credentials:{en:'CREDENTIALS',zh:'证书'},
      s_contact:{en:'CONTACT',zh:'联系'}, s_callsign:{en:'CALL SIGN',zh:'呼号'},
      s_signoff:{en:'SIGN-OFF',zh:'签退'}, s_test:{en:'TEST TONE',zh:'测试音'}, s_numbers:{en:'NUMBERS STATION',zh:'数字电台'},
      broadcasting:{en:'You are listening to Cai Jiechao — broadcasting from Guangzhou.',zh:'您正在收听蔡杰超 —— 来自广州的广播。'},
      testmsg:{en:'— TEST PATTERN — steady tone, 1 kHz. Rotate VOL to see the waveform respond. Keep it tuned; more stations across the band.',zh:'— 测试图案 — 1kHz 稳定单音。旋转 VOL 旋钮观察波形。请继续调谐，波段上还有更多电台。'},
      secretHint:{en:'…the guard band. An unlisted signal. Decode it.',zh:'…警戒频段。一个未列出的信号。解码它。'},
      ack:{en:'10-4, GOOD BUDDY! COPY THAT.',zh:'收到！10-4，好伙计！'}
    };
    const tr=o=>o[CJCData.lang()]||o.en;

    /* ---------------- station registry ---------------- */
    const STATIONS={
      FM:[
        {f:88.1,key:'profile'},{f:90.9,key:'career'},{f:93.5,key:'workshop'},
        {f:97.1,key:'projects'},{f:100.3,key:'dispatches'},{f:103.7,key:'credentials'},{f:106.7,key:'contact'}
      ],
      AM:[
        {f:540,key:'callsign'},{f:1010,key:'signoff'},{f:1520,key:'test'}
      ]
    };
    const SECRET={f:121.5,key:'numbers'};
    const BAND={FM:{lo:88,hi:122,step:0.1,tol:0.4,unit:'MHz',decimals:1,marks:[88,90,92,94,96,98,100,102,104,106,108],guardFrom:108},
                AM:{lo:530,hi:1710,step:10,tol:22,unit:'kHz',decimals:0,marks:[540,700,900,1100,1300,1500,1700],guardFrom:null}};

    let band='FM', freq=100.3, power=true, vol=7, locked=null;

    /* ---------------- content builders ---------------- */
    function stnName(key){ return tr(T['s_'+key]); }
    function head(freqNum,key){ const B=BAND[band]; return `<div class="stn-head"><span class="fq">${freqNum.toFixed(B.decimals)} ${B.unit}</span><h2>${esc(stnName(key))}</h2><span class="live">${esc(tr(T.live))}</span></div>`; }
    function bAbout(){ return `<div class="about"><img src="${esc(P.avatar)}" alt="${esc(t(P.name))}"><div>
      <p class="lead">${esc(t(P.greeting))} <b style="color:var(--amber)">${esc(t(P.name))}</b> — ${esc(t(P.role))}.</p>
      ${P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('')}
      <span class="loc"><i class="fa fa-map-marker"></i> ${esc(t(P.location))}</span></div></div>`; }
    function bCareer(){ return `<div class="subhead">${esc(t(P.ui.education_bg))}</div><div class="logrows">${P.education.map(e=>`
      <div class="logrow"><div class="ts">[${esc(e.period)}]</div><div><h3>${esc(t(e.school))}</h3><div class="s">${esc(t(e.degree))} — ${esc(t(e.note))}</div></div></div>`).join('')}</div>
      <div class="subhead">${esc(t(P.ui.internship_exp))}</div><div class="logrows">${P.experience.map(x=>`
      <div class="logrow"><div class="ts">[${esc(x.period)}]</div><div><h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3>
      <div class="s">${esc(t(x.summary))}</div><ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div></div>`).join('')}</div>`; }
    function bWorkshop(){ const base=26.9; return `<div class="subhead">${esc(t(P.ui.core_tech))}</div>
      <div class="freqs">${P.skills.map((s,i)=>`<div class="frow"><div class="fq">${(base+i*0.05).toFixed(2)}</div><div class="v">${esc(s)}</div></div>`).join('')}</div>
      <div class="tags">${P.skillTags.map(x=>`<span>${esc(x)}</span>`).join('')}</div>
      <div class="subhead">${esc(t(P.ui.core_courses))}</div>
      <div class="courses">${P.courses.map(c=>`<div class="course"><i class="fa ${esc(c.icon)}"></i><h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('')}</div>`; }
    function bProjects(){ if(!projects.length) return `<div class="load-note">${esc(tr(T.acquiring))}</div>`;
      return `<div class="cards">${projects.map(p=>`<a class="card" href="${esc(p.href)}">
        <div class="cbody"><div class="ctag"><span>${esc(t(P.ui.tech_stack))}</span><span>${esc(p.dateText())}</span></div>
        <h4>${esc(p.localTitle())}</h4><p class="tech">${esc(p.tech_stack||'')}</p><p>${esc(p.localSummary()||'')}</p>
        <span class="more">${esc(t(P.ui.view_project))} »</span></div></a>`).join('')}</div>`; }
    function bDispatches(){
      const chips=`<div class="filters">${P.articleFilters.map(f=>`<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('')}</div>`;
      if(!articles.length) return chips+`<div class="load-note">${esc(tr(T.acquiring))}</div>`;
      const list=CJCData.filterArticles(articles,filterKey);
      if(!list.length) return chips+`<div class="load-note">${esc(t(P.ui.no_articles))}</div>`;
      return chips+`<div class="cards">${list.map(a=>`<a class="card" href="${esc(a.href)}">
        <div class="cover"><span class="inc">INCOMING</span><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
        <div class="cbody"><div class="ctag"><span>${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
        <h4>${esc(a.localTitle())}</h4><p>${esc(a.localSummary()||'')}</p><span class="more">${esc(t(P.ui.read_more))} »</span></div></a>`).join('')}</div>`; }
    function bCredentials(){ return `<div class="certs">${P.certificates.map(c=>`<div class="cert">
      <img src="${esc(c.image)}" alt="${esc(t(c.title))}" onerror="this.src='/index_page/img/blogs/1.jpg'">
      <div class="ct"><div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
      <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('')}</div>`; }
    function bContact(){ return `<p class="lead">${esc(t(P.ui.msg_box_title))}</p><div class="contact">
      <div class="cinfo">${[['EMAIL',P.contact.email,'mailto:'+P.contact.email],['PHONE',P.contact.phone,P.contact.phoneHref],
        ['GITHUB','@'+P.contact.githubUser,P.contact.github],['WECHAT','QR »',P.contact.wechatQrPage]]
        .map(([k,v,h])=>`<a href="${esc(h)}"><span>${esc(k)}</span><span>${esc(v)}</span></a>`).join('')}</div>
      <form id="cf"><input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none">
        <input name="name" id="cf-name" required placeholder="${esc(t(P.ui.name_placeholder))}">
        <input type="email" name="email" id="cf-email" required placeholder="${esc(t(P.ui.email_placeholder))}">
        <textarea name="message" id="cf-msg" required placeholder="${esc(t(P.ui.msg_placeholder))}"></textarea>
        <button type="submit" class="btn pri" id="cf-send">◉ ${esc(t(P.ui.send))}</button><p id="cf-status"></p></form></div>`; }
    function bCallSign(){ return `<div class="about"><img src="${esc(P.avatar)}" alt="${esc(t(P.name))}"><div>
      <p class="lead">${esc(tr(T.broadcasting))}</p>
      <p>${esc(t(P.headline))}</p><p>${esc(t(P.bio[1]))}</p>
      <div class="btns"><a class="btn pri" href="${esc(t(P.cv))}" download><i class="fa fa-download"></i> ${esc(t(P.ui.download_cv))}</a>
      <a class="btn" href="${esc(P.contact.github)}" target="_blank" rel="noopener"><i class="fa fa-github"></i> GitHub</a></div></div></div>`; }
    function bSignOff(){ return `<p class="lead">${esc(t(P.ui.footer_desc))}</p>
      <div class="fsoc"><a href="${esc(P.contact.github)}" target="_blank" rel="noopener">GITHUB</a>
      <a href="mailto:${esc(P.contact.email)}">EMAIL</a><a href="${esc(P.contact.wechatQrPage)}">WECHAT</a>
      <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a></div>
      <div class="colophon">${esc(P.brand)} · ${esc(t(P.location))}<br>
      <a href="${esc(P.icpUrl)}" target="_blank" rel="noopener">${esc(P.icp)}</a><br>10-4, OVER &amp; OUT.</div>`; }
    function bTest(){ return `<p class="lead">${esc(tr(T.testmsg))}</p>
      <div class="tags">${P.skillTags.slice(0,8).map(x=>`<span>${esc(x)}</span>`).join('')}</div>`; }
    function bNumbers(){
      const grp=()=>Array.from({length:5},()=>Math.floor(Math.random()*10)).join(' ');
      return `<div class="numbers"><p class="lead">${esc(tr(T.secretHint))}</p>
        <div class="grp">${grp()}</div><div class="grp">${grp()}</div>
        <div class="morse" id="morseLine">-.-. .--- -.-.</div>
        <div class="dec">DECODE ▸ C J C ▸ ${esc(t(P.name))}</div></div>`; }

    const BUILD={profile:bAbout,career:bCareer,workshop:bWorkshop,projects:bProjects,dispatches:bDispatches,
      credentials:bCredentials,contact:bContact,callsign:bCallSign,signoff:bSignOff,test:bTest,numbers:bNumbers};

    /* ---------------- screen render + wiring ---------------- */
    const screen=document.getElementById('screen');
    function renderStation(st){
      screen.innerHTML=head(st.f,st.key)+ (BUILD[st.key]?BUILD[st.key]():'');
      screen.scrollTop=0; wireScreen(); startMorse();
    }
    function wireScreen(){
      const cf=screen.querySelector('#cf'); if(cf) cf.addEventListener('submit',onContact);
      screen.querySelectorAll('.filters button').forEach(bt=>bt.addEventListener('click',()=>{
        filterKey=bt.dataset.k; if(locked&&locked.key==='dispatches') renderStation(locked); }));
    }
    async function onContact(e){ e.preventDefault(); const f=e.target,s=screen.querySelector('#cf-status');
      s.style.color='var(--mut)'; s.textContent='TRANSMITTING… '+t(P.ui.sending);
      try{ const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});
        s.style.color='var(--grn)'; s.textContent='10-4! '+(r.message||'MESSAGE RECEIVED.'); f.reset(); }
      catch(err){ s.style.color='var(--red)'; s.textContent='BREAKER: '+err.message; } }
    let morseTimer=null;
    function startMorse(){ if(morseTimer){clearInterval(morseTimer);morseTimer=null;}
      const el=screen.querySelector('#morseLine'); if(!el||RM) return; const full=el.textContent; let i=0;
      morseTimer=setInterval(()=>{ i=(i+1)%(full.length+3); el.textContent=full.slice(0,i); },160); }

    /* ---------------- tuning core ---------------- */
    const b=()=>BAND[band];
    const stnList=()=>band==='FM'?STATIONS.FM.concat([SECRET]):STATIONS.AM;
    function nearest(){ let best=null,bd=1e9; for(const st of stnList()){ const d=Math.abs(st.f-freq); if(d<bd){bd=d;best=st;} } return {st:best,d:bd}; }
    function lockStrength(){ const n=nearest(); const tol=n.st===SECRET?0.25:b().tol; return {n,strong:n.d<=tol,frac:Math.max(0,1-n.d/tol)}; }

    const freqLed=document.getElementById('freqLed'),stnLbl=document.getElementById('stnLbl'),
      bandLbl=document.getElementById('bandLbl'),unitLbl=document.getElementById('unitLbl'),
      needle=document.getElementById('needle'),inter=document.getElementById('interstitial'),
      intMsg=document.getElementById('int-msg'),intNear=document.getElementById('int-near'),
      sigEl=document.getElementById('sig'),powerdown=document.getElementById('powerdown');

    function freqToPct(f){ const B=b(); return Math.max(0,Math.min(1,(f-B.lo)/(B.hi-B.lo)))*100; }
    function pctToFreq(p){ const B=b(); return B.lo+(B.hi-B.lo)*Math.max(0,Math.min(1,p)); }

    function update(){
      const B=b();
      freqLed.textContent=freq.toFixed(B.decimals); freqLed.classList.toggle('off',!power);
      bandLbl.textContent=band; unitLbl.textContent=B.unit;
      needle.style.left=freqToPct(freq)+'%';
      const ls=lockStrength();
      // signal bars
      const on=power?Math.round(ls.frac*6):0;
      sigEl.querySelectorAll('i').forEach((el,i)=>el.classList.toggle('on',i<on));
      if(!power){ powerdown.style.display='flex'; inter.style.display='none'; return; }
      powerdown.style.display='none';
      if(ls.strong){
        const st=ls.n.st;
        if(!locked||locked.key!==st.key||locked.f!==st.f){ locked=st; stnLbl.textContent=stnName(st.key); renderStation(st); }
        inter.style.display='none';
      } else {
        locked=null; stnLbl.textContent='— — —'; inter.style.display='flex';
        intMsg.textContent=tr(T.searching);
        intNear.innerHTML=`${esc(tr(T.near))}: <b>${esc(ls.n.st.f.toFixed(B.decimals))} ${B.unit} · ${esc(stnName(ls.n.st.key))}</b>`;
      }
    }
    function setFreq(f){ const B=b(); freq=Math.max(B.lo,Math.min(B.hi,f)); update(); }
    function setBand(nb){ if(band===nb)return; band=nb;
      document.querySelectorAll('.band').forEach(x=>x.classList.toggle('active',x.dataset.band===nb));
      buildScale(); buildPresets(); locked=null;
      // jump to first station of band
      setFreq(STATIONS[nb][0].f);
    }

    /* dial scale + presets */
    const scaleEl=document.getElementById('scale');
    function buildScale(){ const B=b(); let h='';
      // ticks
      const start=B.lo, end=B.guardFrom||B.hi, stepT=band==='FM'?1:20;
      for(let f=Math.ceil(start);f<=end;f+=stepT){ const maj=B.marks.indexOf(f)!==-1;
        h+=`<span class="tick ${maj?'maj':'min'}" style="left:${freqToPct(f)}%"></span>`;
        if(maj) h+=`<span class="lbl" style="left:${freqToPct(f)}%">${f.toFixed(0)}</span>`; }
      // guard band
      if(B.guardFrom){ const l=freqToPct(B.guardFrom); h+=`<span class="guard" style="left:${l}%;right:0"></span>`; }
      // station markers
      const list=band==='FM'?STATIONS.FM:STATIONS.AM;
      list.forEach(st=>{ h+=`<span class="stn" style="left:${freqToPct(st.f)}%">${esc(stnName(st.key).split(' ')[0])}<i></i></span>`; });
      scaleEl.innerHTML=h;
    }
    function buildPresets(){ const list=band==='FM'?STATIONS.FM:STATIONS.AM; const B=b();
      document.getElementById('presets').innerHTML=list.map(st=>
        `<button data-f="${st.f}">${st.f.toFixed(B.decimals)}</button>`).join('');
      document.querySelectorAll('#presets button').forEach(bt=>bt.addEventListener('click',()=>{ if(!power)togglePower(true); setFreq(parseFloat(bt.dataset.f)); }));
    }

    /* dial drag */
    const dial=document.getElementById('dial');
    function dialFromX(cx){ const r=dial.getBoundingClientRect(); setFreq(pctToFreq((cx-r.left)/r.width)); }
    let dragDial=false;
    dial.addEventListener('pointerdown',e=>{ if(!power)togglePower(true); dragDial=true; dialFromX(e.clientX); e.preventDefault(); });
    window.addEventListener('pointermove',e=>{ if(dragDial) dialFromX(e.clientX); });
    window.addEventListener('pointerup',()=>{ if(dragDial){ dragDial=false; softSnap(); } });
    function softSnap(){ const ls=lockStrength(); if(ls.strong){ setFreq(ls.n.st.f); } }

    /* rotary tuning knob (turn to fine-tune) */
    function rotary(el,onDelta){
      let active=false,lastA=0,acc=0;
      const ang=e=>{ const r=el.getBoundingClientRect(); return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2)); };
      el.addEventListener('pointerdown',e=>{ active=true; lastA=ang(e); el.style.cursor='grabbing'; e.preventDefault(); });
      window.addEventListener('pointermove',e=>{ if(!active)return; let a=ang(e),d=a-lastA;
        if(d>Math.PI)d-=2*Math.PI; if(d<-Math.PI)d+=2*Math.PI; lastA=a; acc+=d; el.style.transform=`rotate(${acc*57.3}deg)`; onDelta(d); });
      window.addEventListener('pointerup',()=>{ if(active){active=false;el.style.cursor='grab'; if(el.id==='tuneKnob')softSnap();} });
    }
    rotary(document.getElementById('tuneKnob'),d=>{ if(!power)togglePower(true); setFreq(freq + d*(band==='FM'?1.6:70)/Math.PI); });

    /* volume knob (bounded) */
    const volVal=document.getElementById('volVal'),volKnob=document.getElementById('volKnob');
    function setVol(v){ vol=Math.max(0,Math.min(11,v)); volVal.textContent=Math.round(vol);
      volKnob.style.transform=`rotate(${(-140+(vol/11)*280)}deg)`; }
    (function(){ let active=false,lastA=0;
      const ang=e=>{ const r=volKnob.getBoundingClientRect(); return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2)); };
      volKnob.addEventListener('pointerdown',e=>{active=true;lastA=ang(e);e.preventDefault();});
      window.addEventListener('pointermove',e=>{ if(!active)return; let a=ang(e),d=a-lastA; if(d>Math.PI)d-=2*Math.PI; if(d<-Math.PI)d+=2*Math.PI; lastA=a; setVol(vol + d/Math.PI*6); });
      window.addEventListener('pointerup',()=>active=false);
    })();

    /* power */
    const powEl=document.getElementById('pow');
    function togglePower(force){ power=(force===undefined)?!power:force; powEl.classList.toggle('on',power); update(); }
    powEl.addEventListener('click',()=>togglePower());
    powEl.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();togglePower();} });

    /* PTT */
    const ptt=document.getElementById('ptt');
    function transmit(){ if(!power)togglePower(true); if(band!=='FM')setBand('FM'); setFreq(106.7);
      ptt.classList.add('tx'); document.getElementById('ptt-sub').textContent=tr(T.tx).replace('● ','');
      setTimeout(()=>{ ptt.classList.remove('tx'); document.getElementById('ptt-sub').textContent=tr(T.ptt);
        const n=screen.querySelector('#cf-name'); if(n)n.focus(); },500); }
    ptt.addEventListener('click',transmit);

    /* band buttons */
    document.querySelectorAll('.band').forEach(x=>x.addEventListener('click',()=>{ if(!power)togglePower(true); setBand(x.dataset.band); }));

    /* ---------------- oscilloscope + static ---------------- */
    const scope=document.getElementById('scope'),sctx=scope.getContext('2d');
    let ph=0,raf=null;
    function drawScope(){
      const w=scope.width,h=scope.height; sctx.clearRect(0,0,w,h);
      const ls=lockStrength(); const noise=power?(1-ls.frac):0; const amp=power?(0.10+vol/11*0.26):0;
      // static dots
      if(power && noise>0.05){ sctx.fillStyle='rgba(255,180,58,'+(noise*0.5)+')';
        for(let i=0;i<noise*180;i++){ sctx.fillRect(Math.random()*w,Math.random()*h,1.5,1.5); } }
      // baseline
      sctx.strokeStyle='rgba(255,180,58,.12)'; sctx.lineWidth=1; sctx.beginPath(); sctx.moveTo(0,h/2); sctx.lineTo(w,h/2); sctx.stroke();
      // waveform
      sctx.strokeStyle=power?(noise>0.4?'rgba(255,90,74,.85)':'rgba(57,255,136,.9)'):'rgba(80,90,70,.4)';
      sctx.lineWidth=2; sctx.beginPath();
      for(let x=0;x<w;x++){ const tt=x/w*12+ph;
        let y=h/2 + Math.sin(tt)*h*amp*Math.sin(tt*.3) + Math.sin(tt*3.1)*h*amp*0.5;
        if(power) y+=(Math.random()-.5)*h*noise*0.5;
        x===0?sctx.moveTo(x,y):sctx.lineTo(x,y); }
      sctx.stroke(); ph+=0.16; raf=requestAnimationFrame(drawScope);
    }

    /* ---------------- easter egg: type "10-4" ---------------- */
    let buf='';
    window.addEventListener('keydown',e=>{ if(e.target.matches&&e.target.matches('input,textarea'))return;
      if(/[0-9-]/.test(e.key)){ buf=(buf+e.key).slice(-4); if(buf==='10-4'||buf==='1004'){ ack(); buf=''; } } });
    function ack(){ const el=document.getElementById('int-msg');
      // flash all signal bars + banner
      sigEl.querySelectorAll('i').forEach(i=>i.classList.add('on'));
      const banner=document.createElement('div');
      banner.textContent=tr(T.ack);
      banner.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:99998;'+
        "font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(20px,5vw,40px);color:#191400;background:var(--amber);"+
        'padding:16px 30px;border-radius:12px;letter-spacing:.06em;box-shadow:0 12px 40px rgba(0,0,0,.5);text-transform:uppercase';
      document.body.appendChild(banner);
      setTimeout(()=>{ banner.style.transition='opacity .5s'; banner.style.opacity='0'; setTimeout(()=>banner.remove(),500); update(); },1100);
    }

    /* ---------------- reduced-motion list fallback ---------------- */
    function renderRMList(){
      document.body.classList.add('rm');
      inter.style.display='none'; powerdown.style.display='none';
      const order=['profile','career','workshop','projects','dispatches','credentials','contact','callsign','signoff'];
      const fmap={profile:88.1,career:90.9,workshop:93.5,projects:97.1,dispatches:100.3,credentials:103.7,contact:106.7,callsign:540,signoff:1010};
      let html=`<div class="rm-note">${esc(tr(T.tuneHint))} — ${esc(tr(T.brandsub))}</div>`;
      order.forEach(k=>{ const f=fmap[k]; const bnd=f>200?'kHz':'MHz';
        html+=`<div class="rm-stn"><div class="stn-head"><span class="fq">${f} ${bnd}</span><h2>${esc(stnName(k))}</h2></div>${BUILD[k]?BUILD[k]():''}</div>`; });
      screen.innerHTML=html; wireScreen();
    }

    /* ---------------- dynamic load ---------------- */
    async function loadDynamic(){
      try{ projects=await CJCData.fetchProjects(); }catch(e){}
      try{ articles=await CJCData.fetchArticles(); }catch(e){}
      if(RM){ renderRMList(); return; }
      if(locked&&(locked.key==='projects'||locked.key==='dispatches')) renderStation(locked);
    }

    /* ---------------- lang re-render ---------------- */
    function relabel(){
      document.getElementById('brandsub').textContent=tr(T.brandsub);
      document.getElementById('ptt-sub').textContent=tr(T.ptt);
      buildScale(); buildPresets();
      if(RM){ renderRMList(); } else if(locked){ renderStation(locked); } else { update(); }
    }

    document.addEventListener('DOMContentLoaded',()=>{
      CJCData.setTheme(window.THEME_ID);
      CJCData.mountSwitcher({accent:'#ffb43a'});
      document.getElementById('brandsub').textContent=tr(T.brandsub);
      buildScale(); buildPresets(); setVol(7);
      if(RM){ renderRMList(); }
      else { update(); raf=requestAnimationFrame(drawScope); }
      CJCData.onLang(relabel);
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

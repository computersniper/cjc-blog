<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Aurora</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{
      --navy:#0f172a; --navy-2:#0b1120; --text:#e2e8f0; --muted:#94a3b8;
      --accent:#8b5cf6; --sky:#0ea5e9; --indigo:#6366f1;
      --glass:rgba(30,41,59,.42); --glass-2:rgba(15,23,42,.55);
      --border:rgba(148,163,184,.18); --hi:rgba(255,255,255,.10);
      --glow:rgba(139,92,246,.45);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;background:var(--navy);color:var(--text);
      font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;line-height:1.6;overflow-x:hidden;position:relative;
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0;letter-spacing:-.01em}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

    /* ---------- SIGNATURE 1 : living aurora background ---------- */
    .aurora{position:fixed;inset:-20vmax;z-index:-2;pointer-events:none;overflow:hidden;filter:saturate(1.15)}
    .aurora::after{/* deep vignette to keep text legible */
      content:"";position:absolute;inset:0;
      background:radial-gradient(120% 90% at 50% -10%,transparent 40%,rgba(11,17,32,.55) 100%);
    }
    .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;mix-blend-mode:screen;will-change:transform}
    .b1{width:52vmax;height:52vmax;left:-8vmax;top:-6vmax;
      background:radial-gradient(circle at 30% 30%,var(--accent),transparent 65%);animation:drift1 32s ease-in-out infinite}
    .b2{width:46vmax;height:46vmax;right:-10vmax;top:2vmax;
      background:radial-gradient(circle at 50% 50%,var(--sky),transparent 62%);animation:drift2 40s ease-in-out infinite}
    .b3{width:44vmax;height:44vmax;left:18vmax;bottom:-14vmax;
      background:radial-gradient(circle at 50% 50%,var(--indigo),transparent 60%);animation:drift3 28s ease-in-out infinite}
    .b4{width:34vmax;height:34vmax;right:8vmax;bottom:-6vmax;
      background:radial-gradient(circle at 50% 50%,#a855f7,transparent 60%);animation:drift1 36s ease-in-out infinite reverse}
    @keyframes drift1{0%,100%{transform:translate3d(0,0,0) rotate(0deg) scale(1)}
      50%{transform:translate3d(6vmax,4vmax,0) rotate(40deg) scale(1.15)}}
    @keyframes drift2{0%,100%{transform:translate3d(0,0,0) rotate(0deg) scale(1)}
      50%{transform:translate3d(-7vmax,5vmax,0) rotate(-35deg) scale(1.1)}}
    @keyframes drift3{0%,100%{transform:translate3d(0,0,0) rotate(0deg) scale(1)}
      50%{transform:translate3d(4vmax,-6vmax,0) rotate(30deg) scale(1.2)}}
    /* faint star grain */
    .grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
      background-image:radial-gradient(rgba(226,232,240,.10) 1px,transparent 1.4px);background-size:44px 44px}

    /* ---------- layout ---------- */
    .container{max-width:1160px;margin:0 auto;padding:0 24px}
    section{padding:80px 0;position:relative}
    .kicker{display:inline-flex;align-items:center;gap:9px;font-family:'Space Grotesk',sans-serif;
      font-size:12.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
    .kicker::before{content:"";width:26px;height:1px;background:linear-gradient(90deg,var(--accent),transparent)}
    .sec-title{font-size:clamp(28px,4.4vw,44px);font-weight:700;line-height:1.05;margin-bottom:6px}
    .sec-sub{color:var(--muted);font-size:15px;margin:0 0 38px}

    /* ---------- glass + 3D tilt ---------- */
    .glass{background:linear-gradient(150deg,var(--glass),var(--glass-2));
      border:1px solid var(--border);border-radius:20px;
      backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
      box-shadow:0 20px 40px -24px rgba(2,6,23,.9), inset 0 1px 0 var(--hi);position:relative;overflow:hidden}
    .glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
      background:radial-gradient(140% 90% at 12% -10%,rgba(139,92,246,.14),transparent 55%);opacity:.9}
    .tilt{transition:transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s ease;transform-style:preserve-3d;will-change:transform}
    .tilt:hover{box-shadow:0 34px 60px -28px rgba(2,6,23,1), 0 0 0 1px rgba(139,92,246,.35), 0 0 42px -6px var(--glow)}

    /* ---------- nav ---------- */
    .topbar{position:sticky;top:0;z-index:900;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      background:rgba(11,17,32,.55);border-bottom:1px solid var(--border)}
    .topbar .inner{display:flex;align-items:center;justify-content:flex-start;gap:34px;height:60px;padding-right:190px}
    .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.02em}
    .brand b{color:var(--accent)}
    .navlinks{display:flex;gap:24px;flex-wrap:wrap}
    .navlinks a{font-size:13px;font-weight:500;color:var(--muted);transition:color .2s}
    .navlinks a:hover{color:var(--text)}
    @media(max-width:900px){.topbar .inner{padding-right:150px;gap:20px}.navlinks{display:none}}

    /* ---------- hero ---------- */
    .hero{padding:110px 0 70px;position:relative}
    .hero-grid{display:grid;grid-template-columns:1.35fr .9fr;gap:44px;align-items:center}
    .greet{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
      font-size:14px;color:var(--sky);margin-bottom:12px}
    .hero h1{font-size:clamp(44px,8.5vw,88px);font-weight:700;line-height:.98;letter-spacing:-.03em;
      background:linear-gradient(120deg,#fff 0%,#c4b5fd 45%,#7dd3fc 100%);-webkit-background-clip:text;
      background-clip:text;color:transparent}
    .hero .headline{font-size:clamp(19px,2.4vw,26px);font-weight:500;color:var(--text);margin:18px 0 6px;max-width:24ch}
    .hero .role{display:inline-block;font-size:14px;font-weight:600;color:var(--accent);
      border:1px solid rgba(139,92,246,.4);border-radius:999px;padding:5px 14px;margin-top:10px;background:rgba(139,92,246,.08)}
    .hero .subtitle{color:var(--muted);font-size:16px;margin:20px 0 8px;max-width:46ch}
    .hero .loc{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:14px;margin-top:4px}
    .hero-cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px}
    .btn{display:inline-flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:600;
      font-size:14.5px;padding:13px 24px;border-radius:999px;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s;border:1px solid transparent}
    .btn-primary{background:linear-gradient(120deg,var(--accent),var(--indigo));color:#fff;
      box-shadow:0 10px 30px -8px var(--glow)}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 40px -8px var(--glow)}
    .btn-ghost{background:rgba(226,232,240,.04);color:var(--text);border-color:var(--border)}
    .btn-ghost:hover{transform:translateY(-2px);border-color:rgba(139,92,246,.5);background:rgba(139,92,246,.08)}
    .hero-portrait{padding:14px;border-radius:26px}
    .hero-portrait img{width:100%;border-radius:16px;aspect-ratio:1/1;object-fit:cover}
    @media(max-width:820px){.hero-grid{grid-template-columns:1fr}.hero-portrait{max-width:340px}}

    /* ---------- about ---------- */
    .about-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:34px;align-items:start}
    .about-portrait{padding:12px;border-radius:22px}
    .about-portrait img{width:100%;border-radius:14px;object-fit:cover;aspect-ratio:4/5}
    .about-body{padding:30px 32px}
    .about-body p{margin:0 0 16px;color:#cbd5e1;font-size:16px}
    .about-body .loc{display:inline-flex;gap:8px;align-items:center;color:var(--accent);font-weight:600;font-size:14.5px;margin-top:6px}
    @media(max-width:760px){.about-grid{grid-template-columns:1fr}}

    /* ---------- education ---------- */
    .edu-list{display:grid;gap:18px}
    .edu-item{padding:24px 26px;display:grid;grid-template-columns:1fr auto;gap:8px 20px;align-items:start}
    .edu-item h3{font-size:19px;font-weight:600;margin-bottom:6px}
    .edu-item .degree{color:var(--sky);font-weight:600;font-size:14.5px}
    .edu-item .note{color:var(--muted);font-size:14px;margin-top:6px}
    .edu-item .when{font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--accent);font-size:14px;
      white-space:nowrap;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.28);border-radius:999px;padding:5px 13px;height:fit-content}
    @media(max-width:560px){.edu-item{grid-template-columns:1fr}.edu-item .when{justify-self:start}}

    /* ---------- skills ---------- */
    .skills-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:26px}
    .skill-line{padding:18px 22px;display:flex;align-items:center;gap:14px;font-weight:500;font-size:15.5px}
    .skill-line .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(120deg,var(--accent),var(--sky));
      box-shadow:0 0 12px var(--glow);flex:none}
    @media(max-width:640px){.skills-grid{grid-template-columns:1fr}}
    .chips{display:flex;flex-wrap:wrap;gap:10px}
    .chip{font-size:13px;font-weight:500;color:#c4b5fd;padding:7px 15px;border-radius:999px;
      border:1px solid rgba(139,92,246,.3);background:rgba(139,92,246,.07);transition:.2s}
    .chip:hover{background:rgba(139,92,246,.18);color:#fff;transform:translateY(-2px)}

    /* ---------- courses ---------- */
    .courses-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .course{padding:26px 24px}
    .course .ic{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;
      font-size:22px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--indigo));
      box-shadow:0 10px 24px -8px var(--glow);margin-bottom:16px}
    .course h4{font-size:17.5px;font-weight:600;margin-bottom:9px;line-height:1.25}
    .course p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
    @media(max-width:860px){.courses-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:540px){.courses-grid{grid-template-columns:1fr}}

    /* ---------- experience ---------- */
    .exp-item{padding:32px 34px}
    .exp-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:8px}
    .exp-head h3{font-size:22px;font-weight:600}
    .exp-head .when{font-family:'Space Grotesk',sans-serif;color:var(--accent);font-weight:600;font-size:14px}
    .exp-item .company{color:var(--sky);font-weight:600;font-size:15px;margin-bottom:14px}
    .exp-item .summary{color:var(--muted);font-size:15px;margin-bottom:18px}
    .exp-bullets{list-style:none;margin:0;padding:0;display:grid;gap:12px}
    .exp-bullets li{position:relative;padding-left:26px;color:#cbd5e1;font-size:14.5px;line-height:1.55}
    .exp-bullets li::before{content:"\f105";font-family:FontAwesome;position:absolute;left:6px;top:0;color:var(--accent);font-weight:700}

    /* ---------- cards (projects/articles) ---------- */
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
    .card{display:flex;flex-direction:column}
    .card .cover{height:172px;overflow:hidden;background:#111827}
    .card .cover img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
    .card:hover .cover img{transform:scale(1.06)}
    .card .cbody{padding:20px 22px;display:flex;flex-direction:column;gap:9px;flex:1}
    .card .ctag{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:600;
      letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
    .card .ctag .date{color:var(--muted);letter-spacing:.02em;text-transform:none;font-weight:500}
    .card h4{font-size:18px;font-weight:600;line-height:1.25}
    .card .tech{color:var(--sky);font-weight:500;font-size:12.5px;word-break:break-word}
    .card p.desc{margin:0;color:var(--muted);font-size:14px;line-height:1.55;flex:1}
    .card .more{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;color:#c4b5fd;
      display:inline-flex;align-items:center;gap:6px;margin-top:2px}
    @media(max-width:860px){.cards{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:540px){.cards{grid-template-columns:1fr}}

    .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px}
    .filters button{font-family:'Inter',sans-serif;font-weight:500;font-size:13px;color:var(--muted);cursor:pointer;
      padding:8px 16px;border-radius:999px;border:1px solid var(--border);background:rgba(226,232,240,.03);transition:.2s}
    .filters button:hover{color:var(--text);border-color:rgba(139,92,246,.4)}
    .filters button.active{color:#fff;background:linear-gradient(120deg,var(--accent),var(--indigo));border-color:transparent;
      box-shadow:0 8px 22px -8px var(--glow)}

    /* ---------- certificates ---------- */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    .cert{display:grid;grid-template-columns:130px 1fr;overflow:hidden}
    .cert img{width:100%;height:100%;object-fit:cover;min-height:150px}
    .cert .ct{padding:22px 22px}
    .cert .ct .meta{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;font-weight:600;
      text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
    .cert .ct .meta .date{color:var(--muted);text-transform:none;letter-spacing:0}
    .cert .ct h4{font-size:17px;font-weight:600;margin:10px 0 8px}
    .cert .ct p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.55}
    @media(max-width:760px){.certs{grid-template-columns:1fr}}
    @media(max-width:420px){.cert{grid-template-columns:1fr}.cert img{min-height:150px;max-height:180px}}

    /* ---------- contact ---------- */
    .contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:26px;align-items:start}
    .contact-info{padding:30px 32px;display:grid;gap:4px}
    .contact-info .lead{color:var(--muted);font-size:15px;margin-bottom:14px}
    .contact-info a{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--border);font-weight:500;font-size:15px}
    .contact-info a:first-of-type{border-top:none}
    .contact-info a i{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
      background:rgba(139,92,246,.12);color:var(--accent);flex:none;font-size:16px}
    .contact-info a span.k{color:var(--muted);font-size:12px;display:block}
    .contact-info a .v{font-weight:500}
    .contact-form{padding:30px 32px}
    .contact-form input,.contact-form textarea{width:100%;background:rgba(15,23,42,.6);border:1px solid var(--border);
      border-radius:12px;font-family:inherit;font-size:15px;padding:14px 16px;margin-bottom:14px;color:var(--text);transition:.2s}
    .contact-form input::placeholder,.contact-form textarea::placeholder{color:#64748b}
    .contact-form input:focus,.contact-form textarea:focus{outline:none;border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(139,92,246,.18)}
    .contact-form textarea{min-height:140px;resize:vertical}
    .contact-form button{width:100%;justify-content:center}
    #cf-status{margin:14px 0 0;font-weight:500;font-size:14px;min-height:20px}
    @media(max-width:760px){.contact-grid{grid-template-columns:1fr}}

    /* ---------- footer ---------- */
    footer{border-top:1px solid var(--border);padding:48px 0 60px;position:relative}
    .foot-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px;align-items:center}
    .foot-social{display:flex;gap:14px;flex-wrap:wrap}
    .foot-social a{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
      border:1px solid var(--border);color:var(--muted);font-size:16px;transition:.2s}
    .foot-social a:hover{color:#fff;border-color:rgba(139,92,246,.5);background:rgba(139,92,246,.12);transform:translateY(-2px)}
    .foot-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:26px;
      padding-top:22px;border-top:1px solid var(--border);color:var(--muted);font-size:13px}
    .foot-bottom a{color:var(--muted)}
    .foot-bottom a:hover{color:var(--accent)}

    .load-note{grid-column:1/-1;color:var(--muted);font-size:15px;padding:20px 0;text-align:center}

    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      .blob{animation:none!important}
      .b1{opacity:.4}.b2{opacity:.35}.b3{opacity:.35}.b4{opacity:.3}
      .tilt{transition:box-shadow .3s ease}
      .card .cover img,.tilt:hover{transition:none}
      .card:hover .cover img{transform:none}
    }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span>
    <span class="blob b3"></span><span class="blob b4"></span>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <div class="topbar">
    <div class="container inner">
      <a class="brand" href="#top">Cai<b>Jiechao</b></a>
      <nav class="navlinks" id="nav"></nav>
    </div>
  </div>

  <div id="top"></div>
  <header class="hero"><div class="container">
    <div class="hero-grid">
      <div>
        <div class="greet" id="greet"></div>
        <h1 id="name"></h1>
        <div class="headline" id="headline"></div>
        <div><span class="role" id="role"></span></div>
        <p class="subtitle" id="subtitle"></p>
        <div class="loc"><i class="fa fa-map-marker" aria-hidden="true"></i><span id="hero-loc"></span></div>
        <div class="hero-cta">
          <a class="btn btn-primary" id="cvBtn" href="#" download>
            <i class="fa fa-download" aria-hidden="true"></i><span></span></a>
          <a class="btn btn-ghost" id="ghBtn" target="_blank" rel="noopener">
            <i class="fa fa-github" aria-hidden="true"></i><span>GitHub</span></a>
        </div>
      </div>
      <div class="glass tilt hero-portrait">
        <img id="hero-img" alt="" />
      </div>
    </div>
  </div></header>

  <section id="about"><div class="container">
    <div class="kicker" id="l-about"></div>
    <h2 class="sec-title" id="t-about"></h2>
    <p class="sec-sub" id="s-about"></p>
    <div class="about-grid">
      <div class="glass tilt about-portrait"><img id="about-img" alt="" /></div>
      <div class="glass about-body" id="about-body"></div>
    </div>
  </div></section>

  <section id="education"><div class="container">
    <div class="kicker" id="l-edu"></div>
    <h2 class="sec-title" id="t-edu"></h2>
    <p class="sec-sub" id="s-edu"></p>
    <div class="edu-list" id="edu-list"></div>
  </div></section>

  <section id="skills"><div class="container">
    <div class="kicker" id="l-skills"></div>
    <h2 class="sec-title" id="t-skills"></h2>
    <p class="sec-sub" id="s-skills"></p>
    <div class="skills-grid" id="skills-list"></div>
    <div class="chips" id="chips-list"></div>
  </div></section>

  <section id="courses"><div class="container">
    <div class="kicker" id="l-courses"></div>
    <h2 class="sec-title" id="t-courses"></h2>
    <p class="sec-sub" id="s-courses"></p>
    <div class="courses-grid" id="courses-list"></div>
  </div></section>

  <section id="experience"><div class="container">
    <div class="kicker" id="l-exp"></div>
    <h2 class="sec-title" id="t-exp"></h2>
    <p class="sec-sub" id="s-exp"></p>
    <div id="exp-list"></div>
  </div></section>

  <section id="projects"><div class="container">
    <div class="kicker" id="l-projects"></div>
    <h2 class="sec-title" id="t-projects"></h2>
    <p class="sec-sub" id="s-projects"></p>
    <div class="cards" id="projects-list"><div class="load-note" id="proj-load"></div></div>
  </div></section>

  <section id="articles"><div class="container">
    <div class="kicker" id="l-articles"></div>
    <h2 class="sec-title" id="t-articles"></h2>
    <p class="sec-sub" id="s-articles"></p>
    <div class="filters" id="filters"></div>
    <div class="cards" id="articles-list"><div class="load-note" id="art-load"></div></div>
  </div></section>

  <section id="certificates"><div class="container">
    <div class="kicker" id="l-certs"></div>
    <h2 class="sec-title" id="t-certs"></h2>
    <p class="sec-sub" id="s-certs"></p>
    <div class="certs" id="certs-list"></div>
  </div></section>

  <section id="contact"><div class="container">
    <div class="kicker" id="l-contact"></div>
    <h2 class="sec-title" id="t-contact"></h2>
    <p class="sec-sub" id="s-contact"></p>
    <div class="contact-grid">
      <div class="glass contact-info" id="contact-info"></div>
      <div class="glass contact-form">
        <form id="cf" novalidate>
          <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
          <input type="text" name="name" id="cf-name" required aria-label="Name">
          <input type="email" name="email" id="cf-email" required aria-label="Email">
          <textarea name="message" id="cf-msg" required aria-label="Message"></textarea>
          <button type="submit" class="btn btn-primary" id="cf-send"></button>
          <p id="cf-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </div></section>

  <footer><div class="container">
    <div class="foot-top">
      <div>
        <a class="brand" href="#top">Cai<b>Jiechao</b></a>
        <p class="sec-sub" id="foot-desc" style="margin:10px 0 0;max-width:34ch"></p>
      </div>
      <div class="foot-social" id="foot-social"></div>
    </div>
    <div class="foot-bottom">
      <a id="foot-icp" target="_blank" rel="noopener"></a>
      <a href="/admin.html" id="foot-admin"></a>
    </div>
  </div></footer>

  <script>window.THEME_ID = "19-aurora";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

    function renderStatic(){
      document.title = (CJCData.lang()==='zh' ? '蔡杰超' : 'Cai Jiechao') + ' — Aurora';
      // nav
      document.getElementById('nav').innerHTML = [
        ['about','nav_about'],['courses','nav_courses'],['experience','nav_internship'],
        ['projects','nav_portfolio'],['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');

      // hero
      document.getElementById('greet').textContent = t(P.greeting);
      document.getElementById('name').textContent = t(P.name);
      document.getElementById('headline').textContent = t(P.headline);
      document.getElementById('role').textContent = t(P.role);
      document.getElementById('subtitle').textContent = t(P.title);
      document.getElementById('hero-loc').textContent = t(P.location);
      const hi = document.getElementById('hero-img'); hi.src = P.avatar; hi.alt = t(P.name);
      const cv = document.getElementById('cvBtn');
      cv.querySelector('span').textContent = t(P.ui.download_cv); cv.href = t(P.cv);
      document.getElementById('ghBtn').href = P.contact.github;

      // section headers (kicker / title / subtitle)
      document.getElementById('l-about').textContent = t(P.ui.about_me);
      document.getElementById('t-about').textContent = t(P.ui.about_me);
      document.getElementById('l-edu').textContent = t(P.ui.education_bg);
      document.getElementById('t-edu').textContent = t(P.ui.education_bg);
      document.getElementById('l-skills').textContent = t(P.ui.tech_stack);
      document.getElementById('t-skills').textContent = t(P.ui.core_tech);
      document.getElementById('l-courses').textContent = t(P.ui.core_courses);
      document.getElementById('t-courses').textContent = t(P.ui.core_courses);
      document.getElementById('l-exp').textContent = t(P.ui.internship_exp);
      document.getElementById('t-exp').textContent = t(P.ui.internship_exp);
      document.getElementById('l-projects').textContent = t(P.ui.nav_portfolio);
      document.getElementById('t-projects').textContent = t(P.ui.latest_projects);
      document.getElementById('l-articles').textContent = t(P.ui.nav_article);
      document.getElementById('t-articles').textContent = t(P.ui.latest_articles);
      document.getElementById('l-certs').textContent = t(P.ui.nav_certificate);
      document.getElementById('t-certs').textContent = t(P.ui.certificates);
      document.getElementById('l-contact').textContent = t(P.ui.nav_contact);
      document.getElementById('t-contact').textContent = t(P.ui.get_in_touch);
      // subtitles for a few sections
      document.getElementById('s-contact').textContent = t(P.ui.inbox_open);
      document.getElementById('s-about').textContent = t(P.ui.about_desc);
      ['s-edu','s-skills','s-courses','s-exp','s-projects','s-articles','s-certs'].forEach(id=>{
        const el=document.getElementById(id); if(el) el.textContent='';
      });

      // about
      const ai = document.getElementById('about-img'); ai.src = P.avatarAlt; ai.alt = t(P.name);
      document.getElementById('about-body').innerHTML =
        P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('') +
        `<span class="loc"><i class="fa fa-map-marker" aria-hidden="true"></i>${esc(t(P.location))}</span>`;

      // education
      document.getElementById('edu-list').innerHTML = P.education.map(e=>`
        <div class="glass tilt edu-item">
          <div>
            <h3>${esc(t(e.school))}</h3>
            <div class="degree">${esc(t(e.degree))}</div>
            <div class="note">${esc(t(e.note))}</div>
          </div>
          <div class="when">${esc(e.period)}</div>
        </div>`).join('');

      // skills
      document.getElementById('skills-list').innerHTML = P.skills.map(s=>`
        <div class="glass tilt skill-line"><span class="dot"></span><span>${esc(s)}</span></div>`).join('');
      document.getElementById('chips-list').innerHTML = P.skillTags.map(s=>`<span class="chip">${esc(s)}</span>`).join('');

      // courses
      document.getElementById('courses-list').innerHTML = P.courses.map(c=>`
        <div class="glass tilt course">
          <div class="ic"><i class="fa ${esc(c.icon)}" aria-hidden="true"></i></div>
          <h4>${esc(t(c.title))}</h4>
          <p>${esc(t(c.desc))}</p>
        </div>`).join('');

      // experience
      document.getElementById('exp-list').innerHTML = P.experience.map(x=>`
        <div class="glass tilt exp-item">
          <div class="exp-head"><h3>${esc(t(x.role))}</h3><span class="when">${esc(x.period)}</span></div>
          <div class="company">${esc(t(x.company))}</div>
          <div class="summary">${esc(t(x.summary))}</div>
          <ul class="exp-bullets">${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul>
        </div>`).join('');

      // certificates
      document.getElementById('certs-list').innerHTML = P.certificates.map(c=>`
        <div class="glass tilt cert">
          <img src="${esc(c.image)}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${esc(t(c.title))}">
          <div class="ct">
            <div class="meta"><span>${esc(t(c.tag))}</span><span class="date">${esc(t(c.date))}</span></div>
            <h4>${esc(t(c.title))}</h4>
            <p>${esc(t(c.desc))}</p>
          </div>
        </div>`).join('');

      // contact info
      document.getElementById('contact-info').innerHTML =
        `<p class="lead">${esc(t(P.ui.msg_box_title))}</p>` +
        [
          ['fa-envelope','Email',P.contact.email,'mailto:'+P.contact.email],
          ['fa-phone','Phone',P.contact.phone,P.contact.phoneHref],
          ['fa-github','GitHub','@'+P.contact.githubUser,P.contact.github],
          ['fa-weixin','WeChat','QR Code',P.contact.wechatQrPage],
        ].map(([ic,k,v,h])=>`<a href="${esc(h)}" target="_blank" rel="noopener">
            <i class="fa ${ic}" aria-hidden="true"></i>
            <span><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></span></a>`).join('');
      document.getElementById('cf-name').placeholder = t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder = t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder = t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent = t(P.ui.send);

      // footer
      document.getElementById('foot-desc').textContent = t(P.ui.footer_desc);
      document.getElementById('foot-social').innerHTML = [
        ['fa-github',P.contact.github],['fa-envelope','mailto:'+P.contact.email],
        ['fa-weixin',P.contact.wechatQrPage],['fa-file-text-o',t(P.cv)],
      ].map(([ic,h])=>`<a href="${esc(h)}" target="_blank" rel="noopener" aria-label="${esc(ic)}"><i class="fa ${ic}" aria-hidden="true"></i></a>`).join('');
      const icp = document.getElementById('foot-icp'); icp.textContent = P.icp; icp.href = P.icpUrl;
      document.getElementById('foot-admin').textContent = t(P.ui.admin_panel);

      // filters
      document.getElementById('filters').innerHTML = P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k;
        document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active',x.dataset.k===filterKey));
        renderArticles();
      }));
    }

    function renderProjects(){
      const box = document.getElementById('projects-list');
      if(!projects.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML = projects.map(p=>`
        <a class="glass tilt card" href="${esc(p.href)}">
          <div class="cbody">
            <div class="ctag"><span>${esc(t(P.ui.tech_stack))}</span><span class="date">${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <div class="tech">${esc(p.tech_stack||'')}</div>
            <p class="desc">${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} <i class="fa fa-arrow-right" aria-hidden="true"></i></span>
          </div></a>`).join('');
    }

    function renderArticles(){
      const box = document.getElementById('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML = list.map(a=>`
        <a class="glass tilt card" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${esc(a.localTitle())}"></div>
          <div class="cbody">
            <div class="ctag"><span>${esc(a.category||'')}</span><span class="date">${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p class="desc">${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} <i class="fa fa-arrow-right" aria-hidden="true"></i></span>
          </div></a>`).join('');
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML =
        `<div class="load-note"><i class="fa fa-exclamation-triangle"></i> ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-list').innerHTML =
        `<div class="load-note"><i class="fa fa-exclamation-triangle"></i> ${CJCData.lang()==='zh'?'内容加载失败':'Failed to load articles.'}</div>`; }
    }

    // ---- SIGNATURE 2 : 3D tilt via delegated mousemove (gated on reduced-motion) ----
    let activeTilt = null;
    function resetTilt(el){ if(el) el.style.transform=''; }
    function onMove(e){
      if(reduce.matches) return;
      const card = e.target.closest('.tilt');
      if(!card){ if(activeTilt){ resetTilt(activeTilt); activeTilt=null; } return; }
      if(activeTilt && activeTilt!==card) resetTilt(activeTilt);
      activeTilt = card;
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;
      const py = (e.clientY - r.top) / r.height;
      const rx = (0.5 - py) * 7;
      const ry = (px - 0.5) * 9;
      card.style.transform = `perspective(900px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) translateY(-4px)`;
    }
    function enableTilt(){
      if(reduce.matches) return;
      window.addEventListener('mousemove', onMove, {passive:true});
    }
    function disableTilt(){
      window.removeEventListener('mousemove', onMove);
      if(activeTilt){ resetTilt(activeTilt); activeTilt=null; }
    }
    reduce.addEventListener('change', e=>{ if(e.matches) disableTilt(); else enableTilt(); });

    // contact submit
    document.getElementById('cf').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      const payload = { name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color='var(--muted)'; s.textContent = t(P.ui.sending);
      try{ const r = await CJCData.sendContact(payload); s.style.color='#34d399'; s.textContent = r.message||'Sent.'; f.reset(); }
      catch(err){ s.style.color='#f87171'; s.textContent = err.message; }
    });

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:'#8b5cf6' });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      enableTilt();
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

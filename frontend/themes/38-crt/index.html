<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — CRT Monitor</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --amber:#ffb000; --amber-hi:#ffd166; --amber-dim:#c07f08;
      --screen:#0d0a03; --screen-2:#120d04;
      --ink:#ffb000;
      --glow:rgba(255,176,0,.55);
      --glow-soft:rgba(255,176,0,.22);
      --bezel:#1a160f; --bezel-2:#0a0805; --bezel-hi:#3a3324;
      --bezel-w:26px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;overflow:hidden;
      background:radial-gradient(130% 130% at 50% 42%,#141007 0%,#0a0703 55%,#000 100%);
      color:var(--amber);
      font-family:'IBM Plex Mono',ui-monospace,monospace;
      line-height:1.55;-webkit-font-smoothing:antialiased;
    }
    a{color:inherit}
    img{max-width:100%;display:block}
    ::selection{background:rgba(255,176,0,.28)}

    /* ---------- Monitor frame (fixed) ---------- */
    .crt-viewport{position:fixed;inset:0;z-index:1}

    /* the plastic bezel: a chunky rounded frame drawn as a fixed border overlay */
    .crt-bezel{
      position:fixed;inset:0;z-index:60;pointer-events:none;
      border:var(--bezel-w) solid var(--bezel);
      border-radius:34px;
      background:
        linear-gradient(145deg,var(--bezel-hi),transparent 12%) border-box;
      box-shadow:
        inset 0 0 0 2px #000,
        inset 0 0 0 3px rgba(255,176,0,.05),
        inset 0 0 34px rgba(0,0,0,.9);
      -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;
    }
    /* bevel highlight edges on the plastic */
    .crt-bezel::before{
      content:"";position:absolute;inset:calc(-1 * var(--bezel-w));
      border-radius:34px;pointer-events:none;
      box-shadow:
        inset 0 2px 0 rgba(255,220,150,.10),
        inset 0 -3px 6px rgba(0,0,0,.7),
        0 24px 60px rgba(0,0,0,.6);
    }
    /* power LED + brand label live on the bottom bezel */
    .crt-plate{position:fixed;left:0;right:0;bottom:0;height:var(--bezel-w);z-index:61;
      pointer-events:none;display:flex;align-items:center;justify-content:space-between;
      padding:0 26px;font-family:'VT323',monospace}
    .crt-brand{font-size:16px;letter-spacing:.22em;color:#5a4c2c;text-shadow:0 1px 0 #000}
    .crt-led-wrap{display:flex;align-items:center;gap:9px;color:#5a4c2c;font-size:14px;letter-spacing:.18em}
    .crt-led{width:9px;height:9px;border-radius:50%;background:var(--amber);
      box-shadow:0 0 8px 2px var(--glow),0 0 2px #fff inset;animation:ledpulse 3.6s ease-in-out infinite}
    @keyframes ledpulse{0%,100%{opacity:.8}50%{opacity:1}}

    /* ---------- The screen (scroll region) ---------- */
    .crt-screen{
      position:fixed;inset:var(--bezel-w);z-index:10;
      overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;
      border-radius:16px;
      background:
        radial-gradient(120% 130% at 50% 46%,var(--screen-2) 0%,var(--screen) 58%,#070500 100%);
      box-shadow:inset 0 0 120px 30px rgba(0,0,0,.85);
      -webkit-overflow-scrolling:touch;
    }
    .crt-screen::-webkit-scrollbar{width:10px}
    .crt-screen::-webkit-scrollbar-track{background:#0a0703}
    .crt-screen::-webkit-scrollbar-thumb{background:#3a2f10;border-radius:8px;border:2px solid #0a0703}

    /* ---------- Screen glass FX overlays (fixed, above content) ---------- */
    .crt-fx{position:fixed;inset:var(--bezel-w);z-index:40;pointer-events:none;border-radius:16px;overflow:hidden}
    .crt-fx .scan{position:absolute;inset:0;
      background:repeating-linear-gradient(to bottom,
        rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,.30) 3px,rgba(0,0,0,.30) 3px);
      opacity:.55;mix-blend-mode:multiply}
    .crt-fx .vignette{position:absolute;inset:0;
      background:radial-gradient(120% 120% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%),
        radial-gradient(140% 140% at 50% 50%,transparent 70%,rgba(0,0,0,.7) 100%)}
    .crt-fx .sweep{position:absolute;left:0;right:0;height:22%;top:-30%;
      background:linear-gradient(to bottom,transparent,rgba(255,214,120,.06),transparent);
      animation:sweep 7.5s linear infinite}
    .crt-fx .flick{position:absolute;inset:0;background:rgba(255,176,0,.03);animation:flick 5.5s steps(1) infinite;mix-blend-mode:screen}
    @keyframes sweep{0%{top:-30%}100%{top:120%}}
    @keyframes flick{0%,97%{opacity:0}98%{opacity:.5}99%{opacity:.1}100%{opacity:.4}}

    /* boot flash */
    .crt-boot{position:fixed;inset:var(--bezel-w);z-index:70;pointer-events:none;background:var(--amber);
      border-radius:16px;animation:boot 1.1s ease-out forwards}
    @keyframes boot{0%{opacity:.9;transform:scaleY(.004)}18%{opacity:.85;transform:scaleY(.004)}
      42%{opacity:.35;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1)}}

    /* ---------- Content ---------- */
    .wrap{max-width:1080px;margin:0 auto;padding:0 clamp(16px,4vw,44px)}
    .phos{text-shadow:0 0 1px var(--glow),0 0 8px var(--glow-soft)}
    .aberr{text-shadow:
      0 0 1px var(--glow),0 0 10px var(--glow-soft),
      -1.4px 0 0 rgba(255,60,60,.5),1.4px 0 0 rgba(0,220,255,.4)}

    /* menu bar */
    .menu{position:sticky;top:0;z-index:20;background:linear-gradient(var(--screen),rgba(13,10,3,.78));
      backdrop-filter:blur(1px);border-bottom:1px solid rgba(255,176,0,.25);padding:10px 0}
    .menu .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    .menu .mtag{font-family:'VT323',monospace;font-size:22px;letter-spacing:.06em;color:var(--amber-hi)}
    .menu nav{display:flex;gap:6px 4px;flex-wrap:wrap;margin-left:auto}
    .menu nav a{font-size:12px;text-transform:uppercase;letter-spacing:.12em;text-decoration:none;
      padding:4px 8px;border:1px solid transparent;border-radius:3px;opacity:.8}
    .menu nav a:hover,.menu nav a:focus{opacity:1;border-color:rgba(255,176,0,.45);background:rgba(255,176,0,.08)}
    @media(max-width:720px){.menu nav{display:none}}

    /* section scaffolding */
    section{padding:52px 0;border-bottom:1px dashed rgba(255,176,0,.16)}
    .sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:26px}
    .sec-caret{font-family:'VT323',monospace;font-size:26px;color:var(--amber-hi)}
    .sec-title{font-family:'VT323',monospace;font-size:clamp(30px,6vw,52px);line-height:.9;margin:0;letter-spacing:.02em}
    .sec-num{margin-left:auto;font-size:12px;letter-spacing:.2em;opacity:.55}

    /* hero */
    .hero{padding:56px 0 46px}
    .hero .greet{font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:var(--amber-hi)}
    .hero h1{font-family:'VT323',monospace;font-size:clamp(64px,17vw,168px);line-height:.82;margin:6px 0 0;letter-spacing:.01em}
    .cursor{display:inline-block;width:.5em;height:.86em;background:var(--amber);margin-left:.08em;
      vertical-align:-2px;box-shadow:0 0 10px var(--glow);animation:blink 1.05s steps(1) infinite}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .hero .role{font-family:'VT323',monospace;font-size:clamp(22px,4vw,34px);margin-top:14px;color:var(--amber-hi)}
    .hero .head{font-size:clamp(15px,2.2vw,19px);margin-top:14px;max-width:60ch;opacity:.92}
    .hero .meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:18px;font-size:13.5px;opacity:.8}
    .btnrow{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
    .btn{display:inline-flex;align-items:center;gap:9px;text-decoration:none;font-size:13px;
      text-transform:uppercase;letter-spacing:.12em;padding:12px 18px;border:1px solid var(--amber);
      color:var(--amber);background:rgba(255,176,0,.06);border-radius:4px;
      transition:background .15s,box-shadow .15s,color .15s;cursor:pointer}
    .btn:hover,.btn:focus{background:var(--amber);color:#120d02;box-shadow:0 0 16px var(--glow-soft)}
    .btn.solid{background:var(--amber);color:#120d02}
    .btn.solid:hover{box-shadow:0 0 22px var(--glow)}

    /* about */
    .about{display:grid;grid-template-columns:230px 1fr;gap:30px;align-items:start}
    .frame-img{border:1px solid var(--amber);padding:6px;border-radius:6px;background:#0a0703;
      box-shadow:0 0 18px var(--glow-soft)}
    .frame-img img{border-radius:3px;filter:saturate(.35) sepia(.4) hue-rotate(-18deg) contrast(1.05) brightness(.95)}
    .about p{margin:0 0 14px;max-width:64ch}
    .loc{color:var(--amber-hi);font-family:'VT323',monospace;font-size:22px;margin-top:6px}
    @media(max-width:680px){.about{grid-template-columns:1fr}.frame-img{max-width:220px}}

    /* generic rows (edu / experience) */
    .row{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:16px 0;border-top:1px dashed rgba(255,176,0,.2)}
    .row .when{color:var(--amber-hi);font-size:13px}
    .row h3{margin:0 0 4px;font-size:17px}
    .row .sub{opacity:.82;font-size:14px}
    .row ul{margin:10px 0 0;padding-left:18px;font-size:13.5px;opacity:.85}
    .row ul li{margin-bottom:5px}
    @media(max-width:600px){.row{grid-template-columns:1fr;gap:4px}}

    /* skills */
    .skills{display:grid;grid-template-columns:1fr 1fr;gap:8px 26px}
    .skills li{list-style:none;display:flex;gap:10px;padding:9px 0;border-top:1px dashed rgba(255,176,0,.2);font-size:15px}
    .skills li::before{content:"$>";color:var(--amber-hi);font-family:'VT323',monospace;font-size:18px}
    .skills ul{margin:0;padding:0}
    @media(max-width:600px){.skills{grid-template-columns:1fr}}
    .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
    .tag{font-size:12px;letter-spacing:.06em;padding:5px 10px;border:1px solid rgba(255,176,0,.4);border-radius:3px;
      background:rgba(255,176,0,.05)}

    /* courses grid */
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    @media(max-width:820px){.grid3{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.grid3{grid-template-columns:1fr}}
    .course{border:1px solid rgba(255,176,0,.35);border-radius:5px;padding:18px;background:rgba(255,176,0,.03);
      transition:box-shadow .15s,transform .15s}
    .course:hover{box-shadow:0 0 18px var(--glow-soft);transform:translateY(-2px)}
    .course .ci{font-size:22px;color:var(--amber-hi);margin-bottom:10px;text-shadow:0 0 10px var(--glow-soft)}
    .course h4{margin:0 0 8px;font-size:16px}
    .course p{margin:0;font-size:13.5px;opacity:.82;line-height:1.55}

    /* cards */
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    @media(max-width:820px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.cards{grid-template-columns:1fr}}
    .card{border:1px solid rgba(255,176,0,.4);border-radius:6px;background:rgba(255,176,0,.03);
      display:flex;flex-direction:column;text-decoration:none;color:inherit;overflow:hidden;
      transition:box-shadow .15s,transform .15s}
    .card:hover{box-shadow:0 0 22px var(--glow-soft);transform:translateY(-3px);border-color:var(--amber)}
    .card .cover{height:150px;background:#0a0703;overflow:hidden;border-bottom:1px solid rgba(255,176,0,.3)}
    .card .cover img{width:100%;height:100%;object-fit:cover;
      filter:saturate(.3) sepia(.55) hue-rotate(-15deg) contrast(1.1) brightness(.92)}
    .card .cb{padding:14px;display:flex;flex-direction:column;gap:7px;flex:1}
    .card .ctag{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber-hi)}
    .card h4{margin:0;font-size:16px;line-height:1.25}
    .card .tech{font-size:12px;color:var(--amber-hi);opacity:.9}
    .card p{margin:0;font-size:13px;opacity:.8;flex:1;line-height:1.5}
    .card .more{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber-hi)}

    .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
    .filters button{font-family:inherit;cursor:pointer;background:rgba(255,176,0,.04);color:var(--amber);
      border:1px solid rgba(255,176,0,.4);border-radius:3px;font-size:12px;letter-spacing:.06em;
      text-transform:uppercase;padding:7px 12px;transition:.15s}
    .filters button:hover{border-color:var(--amber)}
    .filters button.active{background:var(--amber);color:#120d02}
    .load-note{opacity:.7;font-size:14px;grid-column:1/-1}

    /* certificates */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    @media(max-width:640px){.certs{grid-template-columns:1fr}}
    .cert{border:1px solid rgba(255,176,0,.4);border-radius:6px;display:grid;grid-template-columns:110px 1fr;
      background:rgba(255,176,0,.03);overflow:hidden}
    .cert img{height:100%;width:100%;object-fit:cover;border-right:1px solid rgba(255,176,0,.3);
      filter:saturate(.3) sepia(.55) hue-rotate(-15deg) contrast(1.05) brightness(.92)}
    .cert .ct{padding:14px}
    .cert .meta{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber-hi)}
    .cert h4{margin:8px 0 6px;font-size:16px}
    .cert p{margin:0;font-size:13px;opacity:.82;line-height:1.5}
    @media(max-width:400px){.cert{grid-template-columns:1fr}.cert img{height:120px}}

    /* contact */
    .contact{display:grid;grid-template-columns:1fr 1.2fr;gap:30px}
    @media(max-width:760px){.contact{grid-template-columns:1fr}}
    .cinfo a{display:flex;justify-content:space-between;gap:12px;text-decoration:none;
      padding:12px 0;border-top:1px dashed rgba(255,176,0,.22);font-size:14px}
    .cinfo a span:last-child{color:var(--amber-hi)}
    .cform label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 6px;color:var(--amber-hi)}
    .cform input,.cform textarea{width:100%;background:#0a0703;border:1px solid rgba(255,176,0,.4);
      color:var(--amber);font-family:inherit;font-size:15px;padding:12px;margin-bottom:14px;border-radius:4px}
    .cform input:focus,.cform textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 12px var(--glow-soft)}
    .cform textarea{min-height:120px;resize:vertical}
    #cf-status{margin-top:10px;font-size:14px;min-height:1em}

    footer{padding:34px 0 46px}
    .frow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:center}
    footer a{text-decoration:none;opacity:.8;font-size:13px}
    footer a:hover{opacity:1}
    .muted{opacity:.6;font-size:12.5px}
    .flogo{font-family:'VT323',monospace;font-size:26px;color:var(--amber-hi)}

    /* focus visibility */
    a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{
      outline:2px solid var(--amber-hi);outline-offset:2px}

    /* ---------- reduced motion: crisp + still ---------- */
    @media (prefers-reduced-motion: reduce){
      .crt-fx .sweep,.crt-fx .flick,.crt-boot{display:none!important}
      .crt-led{animation:none}
      .cursor{animation:none}
      .aberr{text-shadow:0 0 1px var(--glow),0 0 8px var(--glow-soft)}
      .crt-screen{scroll-behavior:auto}
      *{animation-duration:.001s!important;transition-duration:.05s!important}
    }
  </style>
</head>
<body>
  <div class="crt-viewport">
    <div class="crt-screen" id="screen">
      <div class="menu">
        <div class="wrap">
          <span class="mtag phos" id="m-tag"></span>
          <nav id="nav"></nav>
        </div>
      </div>

      <div id="top"></div>
      <header class="hero"><div class="wrap">
        <div class="greet phos" id="greet"></div>
        <h1 class="aberr" id="name"></h1>
        <div class="role phos" id="role"></div>
        <div class="head" id="headline"></div>
        <div class="meta" id="meta"></div>
        <div class="btnrow">
          <a class="btn solid" id="cvBtn" href="#" download></a>
          <a class="btn" id="ghBtn" target="_blank" rel="noopener"></a>
        </div>
      </div></header>

      <section id="about"><div class="wrap">
        <div class="sec-head"><span class="sec-caret">&gt;</span><h2 class="sec-title aberr" id="l-about"></h2><span class="sec-num">01</span></div>
        <div class="about">
          <div class="frame-img"><img id="portrait" alt="" /></div>
          <div id="about-text"></div>
        </div>
      </div></section>

      <section id="education"><div class="wrap">
        <div class="sec-head"><span class="sec-caret">&gt;</span><h2 class="sec-title aberr" id="l-edu"></h2><span class="sec-num">02</span></div>
        <div id="edu-list"></div>
      </div></section>

      <section id="skills"><div class="wrap">
        <div class="sec-head"><span class="sec-caret">&gt;</span><h2 class="sec-title aberr" id="l-skills"></h2><span class="sec-num">03</span></div>
        <div class="skills" id="skills-list"></div>
        <div class="tags" id="tag-list"></div>
      </div></section>

      <section id="courses"><div class="wrap">
        <div class="sec-head"><span class="sec-caret">&gt;</span><h2 class="sec-title aberr" id="l-courses"></h2><span class="sec-num">04</span></div>
        <div class="grid3" id="courses-list"></div>
      </div></section>

      <section id="experience"><div class="wrap">
        <div class="sec-head"><span class="sec-caret">&gt;</span><h2 class="sec-title aberr" id="l-exp"></h2><span class="sec-num">05</span></div>
        <div id="exp-list"></div>
      </div></section>

      <section id="projects"><div class="wrap">
        <div class="sec-head"><span class="sec-caret">&gt;</span><h2 class="sec-title aberr" id="l-projects"></h2><span class="sec-num">06</span></div>
        <div class="cards" id="projects-list"><div class="load-note" id="proj-load"></div></div>
      </div></section>

      <section id="articles"><div class="wrap">
        <div class="sec-head"><span class="sec-caret">&gt;</span><h2 class="sec-title aberr" id="l-articles"></h2><span class="sec-num">07</span></div>
        <div class="filters" id="filters"></div>
        <div class="cards" id="articles-list"><div class="load-note" id="art-load"></div></div>
      </div></section>

      <section id="certificates"><div class="wrap">
        <div class="sec-head"><span class="sec-caret">&gt;</span><h2 class="sec-title aberr" id="l-certs"></h2><span class="sec-num">08</span></div>
        <div class="certs" id="certs-list"></div>
      </div></section>

      <section id="contact"><div class="wrap">
        <div class="sec-head"><span class="sec-caret">&gt;</span><h2 class="sec-title aberr" id="l-contact"></h2><span class="sec-num">09</span></div>
        <div class="contact">
          <div class="cinfo" id="contact-info"></div>
          <form class="cform" id="cf">
            <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none">
            <label id="lb-name" for="cf-name"></label>
            <input type="text" name="name" id="cf-name" required>
            <label id="lb-email" for="cf-email"></label>
            <input type="email" name="email" id="cf-email" required>
            <label id="lb-msg" for="cf-msg"></label>
            <textarea name="message" id="cf-msg" required></textarea>
            <button type="submit" class="btn solid" id="cf-send"></button>
            <p id="cf-status" aria-live="polite"></p>
          </form>
        </div>
      </div></section>

      <footer><div class="wrap">
        <div class="frow">
          <a class="flogo" href="#top" id="flogo"></a>
          <div class="frow" id="foot-social" style="gap:18px"></div>
        </div>
        <div class="frow" style="margin-top:16px">
          <span class="muted" id="foot-desc"></span>
          <a class="muted" id="foot-icp" target="_blank" rel="noopener"></a>
        </div>
      </div></footer>
    </div><!-- /screen -->
  </div><!-- /viewport -->

  <!-- glass FX + bezel overlays (fixed, above content, non-interactive) -->
  <div class="crt-fx" aria-hidden="true">
    <div class="vignette"></div>
    <div class="scan"></div>
    <div class="sweep"></div>
    <div class="flick"></div>
  </div>
  <div class="crt-bezel" aria-hidden="true"></div>
  <div class="crt-plate" aria-hidden="true">
    <span class="crt-brand" id="plate-brand">CJC&nbsp;2600</span>
    <span class="crt-led-wrap"><span>PWR</span><span class="crt-led"></span></span>
  </div>
  <div class="crt-boot" aria-hidden="true"></div>

  <script>window.THEME_ID = "38-crt";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";

    function renderStatic(){
      document.title = (CJCData.lang()==='zh' ? '蔡杰超' : 'Cai Jiechao') + " — CRT Monitor";
      document.getElementById('m-tag').textContent = "CJC://" + (CJCData.lang()==='zh'?'主页':'home');
      // nav
      document.getElementById('nav').innerHTML = [
        ['about','nav_about'],['courses','nav_courses'],['experience','nav_internship'],
        ['projects','nav_portfolio'],['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');
      // hero
      document.getElementById('greet').textContent = t(P.greeting);
      document.getElementById('name').innerHTML = esc(t(P.name)) + '<span class="cursor" aria-hidden="true"></span>';
      document.getElementById('role').textContent = t(P.role);
      document.getElementById('headline').textContent = t(P.headline);
      document.getElementById('meta').innerHTML =
        `<span>${esc(t(P.title))}</span><span>◉ ${esc(t(P.location))}</span>`;
      const cv = document.getElementById('cvBtn');
      cv.textContent = "▼ " + t(P.ui.download_cv); cv.href = t(P.cv);
      const gh = document.getElementById('ghBtn');
      gh.textContent = "GitHub ↗"; gh.href = P.contact.github;
      // section labels
      document.getElementById('l-about').textContent = t(P.ui.about_me);
      document.getElementById('l-edu').textContent = t(P.ui.education_bg);
      document.getElementById('l-skills').textContent = t(P.ui.core_tech);
      document.getElementById('l-courses').textContent = t(P.ui.core_courses);
      document.getElementById('l-exp').textContent = t(P.ui.internship_exp);
      document.getElementById('l-projects').textContent = t(P.ui.latest_projects);
      document.getElementById('l-articles').textContent = t(P.ui.latest_articles);
      document.getElementById('l-certs').textContent = t(P.ui.certificates);
      document.getElementById('l-contact').textContent = t(P.ui.get_in_touch);
      // about
      const por = document.getElementById('portrait'); por.src = P.avatar; por.alt = t(P.name);
      document.getElementById('about-text').innerHTML =
        P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('') +
        `<div class="loc phos">◉ ${esc(t(P.location))}</div>`;
      // education
      document.getElementById('edu-list').innerHTML = P.education.map(e=>`
        <div class="row"><div class="when">${esc(e.period)}</div>
        <div><h3 class="phos">${esc(t(e.school))}</h3>
        <div class="sub">${esc(t(e.degree))} — ${esc(t(e.note))}</div></div></div>`).join('');
      // skills
      const half = Math.ceil(P.skills.length/2);
      const mk = arr => `<ul>${arr.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`;
      document.getElementById('skills-list').innerHTML = mk(P.skills.slice(0,half)) + mk(P.skills.slice(half));
      document.getElementById('tag-list').innerHTML = P.skillTags.map(s=>`<span class="tag">${esc(s)}</span>`).join('');
      // courses
      document.getElementById('courses-list').innerHTML = P.courses.map(c=>`
        <div class="course"><div class="ci"><i class="fa ${esc(c.icon)}"></i></div>
        <h4 class="phos">${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');
      // experience
      document.getElementById('exp-list').innerHTML = P.experience.map(x=>`
        <div class="row"><div class="when">${esc(x.period)}</div>
        <div><h3 class="phos">${esc(t(x.role))} · ${esc(t(x.company))}</h3>
        <div class="sub">${esc(t(x.summary))}</div>
        <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div></div>`).join('');
      // certificates
      document.getElementById('certs-list').innerHTML = P.certificates.map(c=>`
        <div class="cert"><img src="${esc(c.image)}" alt="${esc(t(c.title))}" onerror="this.src='/index_page/img/blogs/1.jpg'">
        <div class="ct"><div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
        <h4 class="phos">${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');
      // contact info
      document.getElementById('contact-info').innerHTML = [
        ['Email', P.contact.email, 'mailto:'+P.contact.email],
        ['Phone', P.contact.phone, P.contact.phoneHref],
        ['GitHub', '@'+P.contact.githubUser, P.contact.github],
        ['WeChat', 'QR ↗', P.contact.wechatQrPage],
      ].map(([k,v,h])=>`<a href="${esc(h)}"><span>${esc(k)}</span><span>${esc(v)}</span></a>`).join('');
      document.getElementById('lb-name').textContent = t(P.ui.name_placeholder);
      document.getElementById('lb-email').textContent = t(P.ui.email_placeholder);
      document.getElementById('lb-msg').textContent = t(P.ui.msg_placeholder);
      document.getElementById('cf-name').placeholder = t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder = t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder = t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent = "▶ " + t(P.ui.send);
      // footer
      document.getElementById('flogo').textContent = P.brand;
      document.getElementById('foot-social').innerHTML =
        `<a href="${P.contact.github}" target="_blank" rel="noopener">GitHub</a>
         <a href="mailto:${P.contact.email}">Email</a>
         <a href="${P.contact.wechatQrPage}">WeChat</a>
         <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent = t(P.ui.footer_desc);
      const icp = document.getElementById('foot-icp'); icp.textContent = P.icp; icp.href = P.icpUrl;
      // filters
      document.getElementById('filters').innerHTML = P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box = document.getElementById('projects-list');
      if(!projects.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML = projects.map(p=>`
        <a class="card" href="${esc(p.href)}">
          <div class="cb">
            <div class="ctag"><span>${esc(t(P.ui.tech_stack))}</span><span>${esc(p.dateText())}</span></div>
            <h4 class="phos">${esc(p.localTitle())}</h4>
            <div class="tech">${esc(p.tech_stack||'')}</div>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div></a>`).join('');
    }

    function renderArticles(){
      const box = document.getElementById('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML = list.map(a=>`
        <a class="card" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
          <div class="cb">
            <div class="ctag"><span>${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
            <h4 class="phos">${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div></a>`).join('');
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML = `<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-list').innerHTML = `<div class="load-note">⚠ Failed to load / 内容加载失败</div>`; }
    }

    document.getElementById('cf').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      const payload = { name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color='var(--amber)'; s.textContent = t(P.ui.sending);
      try{ const r = await CJCData.sendContact(payload); s.style.color='var(--amber-hi)'; s.textContent = "✓ " + (r.message||'Sent.'); f.reset(); }
      catch(err){ s.style.color='#ff6a4d'; s.textContent = "✗ " + err.message; }
    });

    // Font Awesome 4 for course icons
    const fa = document.createElement('link');
    fa.rel='stylesheet'; fa.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css';
    document.head.appendChild(fa);

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:'#ffb000' });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

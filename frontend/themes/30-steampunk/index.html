<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Cai Jiechao — an engine room portfolio" />
    <title>Cai Jiechao — The Engine Room</title>
    <link rel="icon" href="/index_page/img/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display:ital@0;1&family=Oswald:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <style>
      :root {
        --coal: #10100e;
        --iron: #24231e;
        --smoke: #57564d;
        --paper: #f0eadb;
        --paper2: #ded3bc;
        --ink: #1c1a15;
        --red: #b74520;
        --brass: #ba8534;
        --line: rgba(28, 26, 21, 0.22);
        --mono: "DM Mono", monospace;
        --cond: "Oswald", Arial, sans-serif;
        --serif: "DM Serif Display", Georgia, serif;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        min-width: 320px;
        overflow-x: hidden;
        color: var(--ink);
        background: var(--paper);
        font: 16px/1.65 var(--serif);
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      img {
        display: block;
        max-width: 100%;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid var(--red);
        outline-offset: 4px;
      }
      .skip {
        position: absolute;
        top: -70px;
        left: 12px;
        z-index: 2000;
        padding: 10px 14px;
        color: var(--paper);
        background: var(--coal);
      }
      .skip:focus {
        top: 12px;
      }
      .shell {
        width: min(1260px, calc(100% - 40px));
        margin: auto;
      }
      .rule {
        height: 1px;
        background: var(--line);
      }
      .mast {
        background: var(--coal);
        color: var(--paper);
        padding: 20px 0 0;
        isolation: isolate;
      }
      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 205px 18px 0;
        font: 11px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .brand {
        font: 600 23px/1 var(--cond);
        letter-spacing: 0.08em;
      }
      .brand b {
        color: #e2a84e;
        font-weight: 500;
      }
      .nav {
        display: flex;
        gap: 22px;
      }
      .nav a {
        color: #cdc4b2;
      }
      .nav a:hover {
        color: #f3b14b;
      }
      .hero {
        position: relative;
        min-height: 740px;
        display: grid;
        grid-template-columns: 1fr 0.78fr;
        grid-template-rows: auto 1fr;
        align-items: end;
        gap: 0;
        padding: 44px 0 0;
      }
      .hero figure {
        position: absolute;
        inset: 0;
        z-index: -1;
        margin: 0;
        overflow: hidden;
      }
      .hero figure:after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.42);
      }
      .hero figure img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.6) contrast(1.06);
      }
      .stamp {
        grid-column: 1;
        grid-row: 1;
        align-self: start;
        justify-self: start;
        border: 1px solid rgba(240, 234, 219, 0.55);
        margin: 12px 0;
        padding: 9px 12px;
        color: #eee6d7;
        font: 10px var(--mono);
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      .hero-copy {
        grid-column: 1;
        grid-row: 2;
        padding: 40px 0 58px;
        max-width: 780px;
      }
      .hero .issue {
        color: #edb252;
        font: 11px var(--mono);
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .hero h1 {
        margin: 12px 0;
        font: 500 clamp(68px, 10vw, 150px) / 0.78 var(--cond);
        letter-spacing: -0.045em;
        text-transform: uppercase;
      }
      .hero h1 em {
        display: block;
        color: #e7b052;
        font: italic clamp(42px, 7vw, 100px) / 0.85 var(--serif);
        letter-spacing: -0.05em;
        text-transform: none;
      }
      .hero .lead {
        max-width: 42ch;
        margin: 20px 0;
        color: #eee8db;
        font-size: 20px;
      }
      .hero-rail {
        grid-column: 2;
        grid-row: 1 / span 2;
        display: flex;
        justify-content: flex-end;
        align-items: end;
        height: 100%;
        padding-bottom: 60px;
      }
      .hero-id {
        width: min(100%, 355px);
        border-left: 1px solid rgba(240, 234, 219, 0.7);
        padding: 18px 0 0 22px;
        color: #eee8da;
      }
      .hero-id dl {
        margin: 0;
        display: grid;
        gap: 15px;
      }
      .hero-id dt {
        font: 10px var(--mono);
        color: #ddad5c;
        letter-spacing: 0.1em;
      }
      .hero-id dd {
        margin: 3px 0 0;
        font: 600 24px/1 var(--cond);
        letter-spacing: 0.03em;
      }
      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 28px;
      }
      .button {
        min-height: 46px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 0 18px;
        border: 1px solid #e6c58a;
        color: #f6ebd5;
        background: transparent;
        font: 500 14px var(--cond);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition:
          background 0.2s,
          color 0.2s,
          transform 0.2s;
      }
      .button:hover {
        background: #e6c58a;
        color: #1a1610;
        transform: translateY(-2px);
      }
      .button.red {
        border-color: var(--red);
        background: var(--red);
        color: #fff;
      }
      .button.red:hover {
        background: #db6640;
        color: #fff;
      }
      main {
        background: var(--paper);
      }
      .section {
        position: relative;
        padding: 110px 0 0;
      }
      .section-head {
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 22px;
        padding-bottom: 25px;
        border-bottom: 1px solid var(--line);
      }
      .section-no {
        color: var(--red);
        font: 500 15px var(--cond);
        letter-spacing: 0.15em;
      }
      .section-head h2 {
        margin: 0;
        font: 400 clamp(40px, 6vw, 80px) / 0.9 var(--serif);
        letter-spacing: -0.045em;
      }
      .section-head p {
        grid-column: 2;
        max-width: 57ch;
        margin: 11px 0 0;
        color: #625d52;
        font: 11px var(--mono);
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .intro {
        display: grid;
        grid-template-columns: 0.82fr 1.18fr;
        gap: 60px;
        padding: 46px 0;
      }
      .portrait-block {
        position: relative;
        padding-bottom: 42px;
      }
      .portrait-block img {
        width: 100%;
        aspect-ratio: 4/5;
        object-fit: cover;
        filter: grayscale(0.45) sepia(0.15);
      }
      .portrait-block .caption {
        position: absolute;
        right: -12px;
        bottom: 0;
        background: var(--red);
        color: #fff;
        padding: 10px 14px;
        font: 11px var(--mono);
        letter-spacing: 0.07em;
      }
      .bio {
        font-size: clamp(21px, 2.4vw, 31px);
        line-height: 1.35;
      }
      .bio p {
        margin: 0 0 24px;
      }
      .bio .loc {
        display: inline-flex;
        gap: 8px;
        color: var(--red);
        font: 11px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .ledger {
        margin-top: 30px;
        border-top: 1px solid var(--line);
      }
      .ledger-line {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 22px;
        padding: 18px 0;
        border-bottom: 1px solid var(--line);
      }
      .ledger-line span {
        color: #625d52;
        font: 11px var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .ledger-line strong {
        font: 500 22px/1.15 var(--cond);
        letter-spacing: 0.02em;
      }
      .black-section {
        margin-top: 105px;
        background: var(--coal);
        color: var(--paper);
        padding: 0 0 95px;
      }
      .black-section .section-head {
        padding-top: 94px;
        border-color: rgba(240, 234, 219, 0.22);
      }
      .black-section .section-head p {
        color: #bcb4a5;
      }
      .education {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        border-top: 1px solid rgba(240, 234, 219, 0.25);
        margin-top: 38px;
      }
      .school {
        padding: 30px 34px 34px;
        border-bottom: 1px solid rgba(240, 234, 219, 0.25);
      }
      .school:nth-child(odd) {
        border-right: 1px solid rgba(240, 234, 219, 0.25);
      }
      .school time {
        color: #e3a94b;
        font: 11px var(--mono);
        letter-spacing: 0.1em;
      }
      .school h3 {
        margin: 18px 0 5px;
        font: 500 30px/1 var(--cond);
        letter-spacing: 0.02em;
      }
      .school p {
        margin: 0;
        color: #c9c0b1;
      }
      .skill-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-top: 1px solid rgba(240, 234, 219, 0.25);
        margin-top: 38px;
      }
      .skill-grid article {
        padding: 26px;
        border-bottom: 1px solid rgba(240, 234, 219, 0.25);
        border-right: 1px solid rgba(240, 234, 219, 0.25);
      }
      .skill-grid article:nth-child(3n) {
        border-right: 0;
      }
      .skill-grid h3 {
        margin: 0 0 16px;
        color: #e3a94b;
        font: 500 13px var(--cond);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .tag {
        color: #e4ddd1;
        font: 11px var(--mono);
        padding: 6px 7px;
        border: 1px solid rgba(240, 234, 219, 0.24);
      }
      .course-list {
        margin-top: 40px;
        border-top: 1px solid var(--line);
      }
      .course {
        display: grid;
        grid-template-columns: 75px 1fr 1.35fr;
        gap: 22px;
        align-items: start;
        padding: 24px 0;
        border-bottom: 1px solid var(--line);
      }
      .course i {
        font-size: 25px;
        color: var(--red);
      }
      .course h3 {
        margin: 0;
        font: 500 23px/1.1 var(--cond);
        letter-spacing: 0.02em;
      }
      .course p {
        margin: 0;
        color: #625d52;
      }
      .experience {
        display: grid;
        grid-template-columns: 230px 1fr;
        gap: 36px;
        padding: 42px 0;
        border-bottom: 1px solid var(--line);
      }
      .experience .when {
        font: 11px var(--mono);
        letter-spacing: 0.09em;
        color: var(--red);
      }
      .experience h3 {
        margin: 0;
        font: 500 42px/1 var(--cond);
        letter-spacing: 0.01em;
      }
      .experience p,
      .experience ul {
        color: #625d52;
      }
      .experience ul {
        padding-left: 18px;
      }
      .experience li + li {
        margin-top: 5px;
      }
      .projects {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0;
        margin-top: 40px;
        border-top: 1px solid var(--line);
        border-left: 1px solid var(--line);
      }
      .project {
        min-height: 300px;
        padding: 25px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        transition:
          background 0.2s,
          color 0.2s;
      }
      .project:hover {
        background: var(--red);
        color: #fff;
      }
      .project-cover {
        width: calc(100% + 50px);
        height: 146px;
        margin: -25px -25px 20px;
        border-bottom: 1px solid var(--line);
        object-fit: cover;
        background: var(--paper2);
        filter: sepia(0.42) saturate(0.68) contrast(1.08);
      }
      .project .meta,
      .article .meta {
        font: 10px var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #7d4d2d;
      }
      .project:hover .meta {
        color: #f6d6be;
      }
      .project h3,
      .article h3 {
        margin: 35px 0 10px;
        font: 400 35px/0.95 var(--serif);
        letter-spacing: -0.03em;
      }
      .project p,
      .article p {
        color: #625d52;
        margin: 0;
      }
      .project:hover p {
        color: #f9e6d8;
      }
      .read {
        display: block;
        margin-top: 26px;
        font: 12px var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        margin: 38px 0 16px;
      }
      .filter {
        border: 1px solid var(--line);
        padding: 8px 11px;
        background: transparent;
        font: 11px var(--mono);
        letter-spacing: 0.06em;
      }
      .filter.active,
      .filter:hover {
        background: var(--ink);
        color: var(--paper);
      }
      .articles {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr 0.9fr;
        gap: 16px;
      }
      .article {
        border-top: 3px solid var(--red);
        padding-top: 12px;
      }
      .article:first-child {
        grid-row: span 2;
      }
      .article img {
        width: 100%;
        height: 150px;
        object-fit: cover;
        margin-bottom: 18px;
        filter: grayscale(0.25);
      }
      .article:first-child img {
        height: 278px;
      }
      .certs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 40px;
      }
      .cert {
        display: grid;
        grid-template-columns: 115px 1fr;
        gap: 18px;
        padding: 18px;
        border: 1px solid var(--line);
      }
      .cert img {
        width: 115px;
        height: 84px;
        object-fit: cover;
      }
      .cert small {
        color: #7d4d2d;
        font: 10px var(--mono);
        letter-spacing: 0.08em;
      }
      .cert h3 {
        margin: 6px 0;
        font: 500 21px/1.1 var(--cond);
      }
      .cert p {
        margin: 0;
        color: #625d52;
        font-size: 14px;
      }
      .contact-band {
        margin-top: 112px;
        background: var(--red);
        color: #fff;
        padding: 70px 0;
      }
      .contact-grid {
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        gap: 50px;
      }
      .contact-grid h2 {
        margin: 12px 0;
        font: 400 clamp(55px, 7vw, 96px) / 0.82 var(--serif);
        letter-spacing: -0.06em;
      }
      .contact-grid .reach {
        font: 500 20px var(--cond);
        letter-spacing: 0.04em;
      }
      .contact-grid .reach a {
        display: block;
        margin-top: 8px;
      }
      .form {
        display: grid;
        gap: 14px;
      }
      .field {
        display: grid;
        gap: 5px;
      }
      .field label {
        font: 11px var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .field input,
      .field textarea {
        border: 1px solid rgba(255, 255, 255, 0.72);
        background: rgba(0, 0, 0, 0.08);
        color: #fff;
        padding: 12px;
      }
      .field textarea {
        min-height: 120px;
        resize: vertical;
      }
      .form .button {
        align-self: start;
        color: #1c1a15;
        background: var(--paper);
        border-color: var(--paper);
      }
      .status {
        min-height: 24px;
        margin: 0;
        font: 12px var(--mono);
      }
      .footer {
        padding: 35px 0 55px;
        background: var(--coal);
        color: #c8bda9;
        font: 11px var(--mono);
      }
      .footer .shell {
        display: flex;
        justify-content: space-between;
        gap: 18px;
      }
      .footer a {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      @media (max-width: 900px) {
        .topline {
          padding-right: 180px;
        }
        .nav {
          display: none;
        }
        .hero {
          grid-template-columns: 1fr;
          min-height: 670px;
        }
        .hero-rail {
          display: none;
        }
        .intro,
        .contact-grid {
          grid-template-columns: 1fr;
          gap: 28px;
        }
        .portrait-block {
          max-width: 430px;
        }
        .skill-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .skill-grid article:nth-child(3n) {
          border-right: 1px solid rgba(240, 234, 219, 0.25);
        }
        .skill-grid article:nth-child(2n) {
          border-right: 0;
        }
        .projects {
          grid-template-columns: 1fr 1fr;
        }
        .articles {
          grid-template-columns: 1fr 1fr;
        }
        .article:first-child {
          grid-row: auto;
          grid-column: span 2;
        }
        .article:first-child img {
          height: 230px;
        }
      }
      @media (max-width: 600px) {
        .shell {
          width: min(100% - 24px, 1260px);
        }
        .topline {
          padding: 18px 0;
        }
        .hero {
          min-height: 570px;
          padding-top: 20px;
        }
        .hero-copy {
          padding-bottom: 35px;
        }
        .hero h1 {
          font-size: 75px;
        }
        .hero .lead {
          font-size: 17px;
        }
        .section {
          padding-top: 75px;
        }
        .section-head {
          grid-template-columns: 1fr;
          gap: 8px;
        }
        .section-head p {
          grid-column: auto;
        }
        .intro {
          padding: 30px 0;
        }
        .bio {
          font-size: 21px;
        }
        .ledger-line,
        .experience {
          grid-template-columns: 1fr;
          gap: 8px;
        }
        .black-section {
          margin-top: 75px;
        }
        .black-section .section-head {
          padding-top: 68px;
        }
        .education,
        .skill-grid,
        .projects,
        .certs {
          grid-template-columns: 1fr;
        }
        .school:nth-child(odd),
        .skill-grid article {
          border-right: 0;
        }
        .course {
          grid-template-columns: 45px 1fr;
          gap: 12px;
        }
        .course p {
          grid-column: 2;
        }
        .experience h3 {
          font-size: 33px;
        }
        .articles {
          grid-template-columns: 1fr;
        }
        .article:first-child {
          grid-column: auto;
        }
        .article:first-child img {
          height: 180px;
        }
        .contact-band {
          margin-top: 76px;
          padding: 58px 0;
        }
        .footer .shell {
          flex-direction: column;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        .button,
        .project {
          transition: none;
        }
        .button:hover {
          transform: none;
        }
      }
    </style>
    <script>
      window.THEME_ID = "30-steampunk";
    </script>
    <script src="/shared/profile.js"></script>
    <script src="/shared/site-data.js"></script>
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <header class="mast" id="top">
      <div class="shell topline">
        <a href="#top" class="brand">CJC <b>ENGINE</b> ROOM</a>
        <nav class="nav" aria-label="Primary">
          <a href="#profile">Profile</a><a href="#work">Works</a
          ><a href="#notes">Dispatches</a><a href="#contact">Telegram</a>
        </nav>
        <span>Issue No. 26.08</span>
      </div>
      <div class="rule"></div>
      <div class="shell hero">
        <figure>
          <img
            src="/themes/30-steampunk/assets/engine-room.jpg"
            alt="A real engineering workstation and mechanical equipment"
            fetchpriority="high"
            onerror="this.src='/index_page/img/portfolio/web.jpg'"
          />
        </figure>
        <div class="stamp">Authenticated working record</div>
        <div class="hero-copy">
          <p class="issue" id="hero-greet"></p>
          <h1 id="hero-name"></h1>
          <p class="lead" id="hero-head"></p>
          <div class="actions">
            <a id="cv" class="button red" target="_blank" rel="noopener"
              ><i class="fa fa-download" aria-hidden="true"></i
              ><span data-l="cv"></span></a
            ><a id="git" class="button" target="_blank" rel="noopener"
              ><i class="fa fa-github" aria-hidden="true"></i>GitHub</a
            >
          </div>
        </div>
        <aside class="hero-rail">
          <div class="hero-id">
            <dl>
              <div>
                <dt>Function</dt>
                <dd id="hero-role"></dd>
              </div>
              <div>
                <dt>Station</dt>
                <dd id="hero-location"></dd>
              </div>
              <div>
                <dt>System status</dt>
                <dd>PRESSURE STABLE</dd>
              </div>
            </dl>
          </div>
        </aside>
      </div>
    </header>
    <main id="content"><div id="app"></div></main>
    <script>
      (() => {
        "use strict";
        const L = {
          profile: { en: "Profile / operator", zh: "档案 / 操作员" },
          education: { en: "Training log", zh: "训练记录" },
          skills: { en: "Tools under pressure", zh: "高压工具组" },
          courses: { en: "Course work", zh: "课程作业" },
          experience: { en: "Service record", zh: "服务记录" },
          projects: { en: "Built in the workshop", zh: "车间作品" },
          articles: { en: "Dispatches & notes", zh: "调度与笔记" },
          certs: { en: "Accreditation", zh: "资质证明" },
          contact: { en: "Open a channel.", zh: "开启通信。" },
          cv: { en: "Extract CV", zh: "导出简历" },
          name: { en: "Name", zh: "姓名" },
          email: { en: "Email", zh: "邮箱" },
          message: { en: "Message", zh: "信息" },
          send: { en: "Transmit", zh: "传送" },
          sending: { en: "Transmitting…", zh: "传送中…" },
          sent: { en: "Transmission received.", zh: "传送已接收。" },
          offline: {
            en: "The archive is temporarily unavailable.",
            zh: "档案暂时无法使用。",
          },
          view: { en: "Inspect record", zh: "检查记录" },
        };
        let articles = [],
          projects = [],
          filter = "all";
        const t = (x) => CJCData.t(x),
          e = (x) => CJCData.escapeHtml(x || ""),
          q = (s) => document.querySelector(s),
          P = () => CJCData.profile;
        function head(title, id, note) {
          return `<section class="section" id="${id}"><div class="shell section-head"><span class="section-no">${note}</span><div><h2>${e(t(title))}</h2><p>${e(t(title))} / CJC LOGBOOK</p></div></div>`;
        }
        function tail() {
          return "</section>";
        }
        function render() {
          const p = P();
          q("#hero-greet").textContent = t(p.greeting);
          q("#hero-name").innerHTML = `${e(t(p.name))}<em>${e(t(p.role))}</em>`;
          q("#hero-head").textContent = t(p.headline);
          q("#hero-role").textContent = t(p.role);
          q("#hero-location").textContent = t(p.location);
          q("#cv").href = t(p.cv);
          q("#cv span").textContent = t(L.cv);
          q("#git").href = p.contact.github;
          q("#app").innerHTML =
            `${head(L.profile, "profile", "01")}<div class="shell intro"><figure class="portrait-block"><img src="${e(p.avatar)}" alt="${e(p.avatarAlt || t(p.name))}"><figcaption class="caption">${e(t(p.location))}</figcaption></figure><article class="bio"><p>${e(t(p.bio[0]))}</p><p>${e(t(p.bio[1]))}</p><span class="loc"><i class="fa fa-map-marker" aria-hidden="true"></i>${e(t(p.location))}</span><div class="ledger"><div class="ledger-line"><span>Role</span><strong>${e(t(p.role))}</strong></div><div class="ledger-line"><span>Contact</span><strong>${e(p.contact.email)}</strong></div></div></article></div>${tail()}<section class="black-section">${head(L.education, "education", "02")}<div class="shell education">${p.education.map((x) => `<article class="school"><time>${e(x.period)}</time><h3>${e(t(x.school))}</h3><p>${e(t(x.degree))}</p><p>${e(t(x.note))}</p></article>`).join("")}</div>${tail()}${head(L.skills, "skills", "03")}<div class="shell skill-grid">${p.skills
              .map(
                (x, i) =>
                  `<article><h3>Assembly ${String(i + 1).padStart(2, "0")}</h3><div class="tags">${e(
                    x,
                  )
                    .split(" / ")
                    .map((y) => `<span class="tag">${y}</span>`)
                    .join("")}</div></article>`,
              )
              .join(
                "",
              )}</div>${tail()}</section>${head(L.courses, "courses", "04")}<div class="shell course-list">${p.courses.map((x) => `<article class="course"><i class="fa ${e(x.icon)}" aria-hidden="true"></i><h3>${e(t(x.title))}</h3><p>${e(t(x.desc))}</p></article>`).join("")}</div>${tail()}${head(L.experience, "experience", "05")}<div class="shell">${p.experience.map((x) => `<article class="experience"><span class="when">${e(x.period)}</span><div><h3>${e(t(x.company))}<br><small>${e(t(x.role))}</small></h3><p>${e(t(x.summary))}</p><ul>${x.bullets.map((b) => `<li>${e(t(b))}</li>`).join("")}</ul></div></article>`).join("")}</div>${tail()}${head(L.projects, "work", "06")}<div class="shell projects">${projects.length ? projects.map((x) => `<a class="project" href="${e(x.href)}"><span class="meta">${e(x.dateText())} / ${e(x.tech_stack || "PROJECT")}</span><h3>${e(x.localTitle())}</h3><p>${e(x.localSummary())}</p><span class="read">${e(t(L.view))} <i class="fa fa-long-arrow-right" aria-hidden="true"></i></span></a>`).join("") : `<p>${e(t(L.offline))}</p>`}</div>${tail()}${head(L.articles, "notes", "07")}<div class="shell"><div class="filters">${p.articleFilters.map((x) => `<button class="filter ${filter === x.key ? "active" : ""}" type="button" data-filter="${e(x.key)}" onclick="window.CJCThemeFilter(this.dataset.filter)">${e(t(x.label))}</button>`).join("")}</div><div class="articles">${
              articles.length
                ? CJCData.filterArticles(articles, filter)
                    .map(
                      (x) =>
                        `<a class="article" href="${e(x.href)}"><img src="${e(x.cover_image || "/index_page/img/blogs/1.jpg")}" alt="" loading="lazy" onerror="this.src='/index_page/img/blogs/1.jpg'"><span class="meta">${e(x.category || "NOTE")} / ${e(x.dateText())}</span><h3>${e(x.localTitle())}</h3><p>${e(x.localSummary())}</p><span class="read">${e(t(L.view))}</span></a>`,
                    )
                    .join("")
                : `<p>${e(t(L.offline))}</p>`
            }</div></div>${tail()}${head(L.certs, "certs", "08")}<div class="shell certs">${p.certificates.map((x) => `<article class="cert"><img src="${e(x.image)}" alt="${e(t(x.title))}" loading="lazy"><div><small>${e(t(x.date))} / ${e(t(x.tag))}</small><h3>${e(t(x.title))}</h3><p>${e(t(x.desc))}</p></div></article>`).join("")}</div>${tail()}<section class="contact-band" id="contact"><div class="shell contact-grid"><article><span class="section-no">09 / CONTACT</span><h2>${e(t(L.contact))}</h2><p class="reach"><a href="${e(p.contact.emailTo)}">${e(p.contact.email)}</a><a href="${e(p.contact.phoneHref)}">${e(p.contact.phone)}</a><a href="${e(p.contact.github)}" target="_blank" rel="noopener">${e(p.contact.githubUser)}</a></p></article><form class="form" id="contact-form"><div class="field"><label for="name">${e(t(L.name))}</label><input id="name" name="name" autocomplete="name" required></div><div class="field"><label for="email">${e(t(L.email))}</label><input id="email" type="email" name="email" autocomplete="email" required></div><div class="field"><label for="message">${e(t(L.message))}</label><textarea id="message" name="message" required></textarea></div><input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px"><button class="button" type="submit">${e(t(L.send))}<i class="fa fa-long-arrow-right" aria-hidden="true"></i></button><p class="status" id="status" aria-live="polite"></p></form></div></section><footer class="footer"><div class="shell"><span>${e(p.brand)} / ${e(t(p.ui.footer_desc))}</span><span><a href="${e(p.icpUrl)}" target="_blank" rel="noopener">${e(p.icp)}</a> · <a href="/admin.html">Admin Panel</a></span></div></footer>`;
          bind();
          mountProjectCovers();
        }
        function mountProjectCovers() {
          document.querySelectorAll(".project").forEach((card, index) => {
            const project = projects[index];
            if (!project) return;
            const cover = document.createElement("img");
            cover.className = "project-cover";
            cover.src = project.cover_image || "/index_page/img/blogs/1.jpg";
            cover.alt = "";
            cover.loading = "lazy";
            cover.addEventListener("error", () => {
              cover.src = "/index_page/img/blogs/1.jpg";
            });
            card.prepend(cover);
          });
        }
        function bind() {
          q("#contact-form").addEventListener("submit", async (ev) => {
            ev.preventDefault();
            const f = ev.currentTarget,
              s = q("#status"),
              b = f.querySelector("button");
            b.disabled = true;
            s.textContent = t(L.sending);
            try {
              await CJCData.sendContact({
                name: f.name.value,
                email: f.email.value,
                message: f.message.value,
                website: f.website.value,
              });
              f.reset();
              s.textContent = t(L.sent);
            } catch (err) {
              s.textContent = err.message || t(L.offline);
            } finally {
              b.disabled = false;
            }
          });
        }
        window.CJCThemeFilter = (key) => {
          filter = key || "all";
          render();
        };
        document.addEventListener("DOMContentLoaded", async () => {
          CJCData.setTheme(window.THEME_ID);
          render();
          CJCData.mountSwitcher({ accent: "#b74520" });
          CJCData.onLang(render);
          try {
            [articles, projects] = await Promise.all([
              CJCData.fetchArticles(),
              CJCData.fetchProjects(),
            ]);
            render();
          } catch (err) {
            render();
          }
        });
      })();
    </script>
  </body>
</html>

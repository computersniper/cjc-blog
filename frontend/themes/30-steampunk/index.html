<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Steampunk</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=IM+Fell+English:ital@0;1&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg1:#2a1c10; --bg2:#3d2b18; --bg3:#231609;
      --brass:#c98a2b; --brass-lt:#e6b565; --brass-dk:#8a5e1c;
      --copper:#b5713f;
      --parch:#e8d5b0;         /* parchment text */
      --parch-dim:#b89b6e;
      --leather:#4a331c;
      --leather-dk:#3a2717;
      --ink:#241609;
      --line:rgba(201,138,43,.42);
      --hair:rgba(201,138,43,.20);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;color:var(--parch);
      background:
        radial-gradient(1200px 600px at 50% -8%, rgba(201,138,43,.10), transparent 60%),
        linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
      background-attachment:fixed;
      font-family:'IM Fell English','Noto Serif SC',Georgia,serif;
      font-size:19px;line-height:1.7;
      -webkit-font-smoothing:antialiased;overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    ::selection{background:rgba(230,181,101,.3)}
    .wrap{max-width:1160px;margin:0 auto;padding:0 26px}
    h1,h2,h3,h4,.disp{font-family:'Cinzel','Noto Serif SC',serif}

    /* subtle brass grain overlay */
    body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.05;mix-blend-mode:overlay;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
    body>*{position:relative;z-index:2}

    /* --- Rivets & panels --- */
    .panel{position:relative;background:
        linear-gradient(180deg, rgba(74,51,28,.72), rgba(35,22,9,.82));
      border:1px solid var(--line);border-radius:10px;
      box-shadow:inset 0 1px 0 rgba(230,181,101,.14), 0 10px 26px rgba(0,0,0,.4)}
    .rivet{position:absolute;width:9px;height:9px;border-radius:50%;
      background:radial-gradient(circle at 35% 30%, var(--brass-lt), var(--brass-dk) 70%);
      box-shadow:0 1px 2px rgba(0,0,0,.6)}
    .rivet.tl{top:9px;left:9px}.rivet.tr{top:9px;right:9px}.rivet.bl{bottom:9px;left:9px}.rivet.br{bottom:9px;right:9px}

    /* --- Gears --- */
    .gear{color:var(--brass);opacity:.5}
    .gear svg{display:block}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes spinr{to{transform:rotate(-360deg)}}
    .gear.spin{animation:spin 26s linear infinite;transform-origin:50% 50%}
    .gear.spin.rev{animation:spinr 20s linear infinite}
    .gear.fast{animation-duration:14s}
    @media (prefers-reduced-motion: reduce){.gear.spin{animation:none}}
    .cog-deco{position:absolute;pointer-events:none;z-index:0}

    /* --- Section scaffold --- */
    section{padding:76px 0;position:relative}
    .sec-head{display:flex;align-items:center;gap:16px;margin-bottom:38px}
    .sec-head .cog{color:var(--brass);flex:none}
    .sec-title{margin:0;font-size:clamp(24px,4vw,40px);letter-spacing:.06em;color:var(--brass-lt);
      text-shadow:0 2px 0 rgba(0,0,0,.4);font-weight:700}
    .sec-title small{display:block;font-family:'IM Fell English',serif;font-style:italic;font-size:15px;
      letter-spacing:.24em;color:var(--parch-dim);text-transform:uppercase;font-weight:400;margin-top:4px}
    .sec-head .rule{flex:1;height:2px;background:
      linear-gradient(90deg,var(--line),transparent);border-radius:2px}

    /* pipe divider */
    .pipe{height:14px;margin:6px 0;border-radius:8px;position:relative;
      background:linear-gradient(180deg,var(--brass-lt),var(--brass) 40%,var(--brass-dk));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 4px 12px rgba(0,0,0,.5)}
    .pipe::before,.pipe::after{content:"";position:absolute;top:-4px;bottom:-4px;width:22px;border-radius:5px;
      background:linear-gradient(180deg,var(--brass-lt),var(--brass-dk));box-shadow:0 3px 8px rgba(0,0,0,.5)}
    .pipe::before{left:34px}.pipe::after{right:34px}

    /* --- Top bar --- */
    .topbar{position:sticky;top:0;z-index:900;
      background:linear-gradient(180deg,rgba(35,22,9,.95),rgba(35,22,9,.78));
      border-bottom:2px solid var(--brass-dk);backdrop-filter:blur(6px)}
    .topbar .inner{display:flex;align-items:center;gap:18px;height:64px;padding-right:210px}
    .brand{font-family:'Cinzel',serif;font-weight:900;font-size:22px;letter-spacing:.04em;color:var(--brass-lt);
      display:flex;align-items:center;gap:12px}
    .nav{display:flex;gap:24px;margin-left:6px}
    .nav a{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--parch-dim)}
    .nav a:hover{color:var(--brass-lt)}
    @media(max-width:900px){.nav{display:none}.topbar .inner{padding-right:150px}}

    /* --- Hero --- */
    .hero{padding:78px 0 44px;position:relative;overflow:hidden}
    .hero-grid{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center}
    .greet{font-family:'IM Fell English',serif;font-style:italic;color:var(--brass);font-size:20px;letter-spacing:.06em}
    .hero h1{margin:8px 0 0;font-family:'Cinzel',serif;font-weight:900;font-size:clamp(46px,10vw,110px);line-height:.98;
      color:var(--brass-lt);letter-spacing:.02em;text-shadow:0 3px 0 rgba(0,0,0,.45), 0 0 34px rgba(201,138,43,.22)}
    .hero .role{font-family:'IM Fell English',serif;font-style:italic;font-size:clamp(20px,3vw,30px);color:var(--copper);margin-top:14px}
    .hero .head{font-size:clamp(18px,2.2vw,22px);color:var(--parch);margin-top:18px;max-width:30ch}
    .hero .loc{margin-top:14px;color:var(--parch-dim);display:flex;align-items:center;gap:8px}
    .hero .loc i{color:var(--brass)}
    .cta-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px}
    .btn{display:inline-flex;align-items:center;gap:10px;font-family:'Cinzel',serif;font-weight:600;font-size:15px;
      letter-spacing:.05em;padding:14px 26px;border-radius:8px;transition:.2s;cursor:pointer}
    .btn-fill{background:linear-gradient(180deg,var(--brass-lt),var(--brass) 45%,var(--brass-dk));color:var(--ink);
      border:1px solid var(--brass-dk);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 16px rgba(0,0,0,.4)}
    .btn-fill:hover{transform:translateY(-2px);filter:brightness(1.08)}
    .btn-line{background:rgba(74,51,28,.5);color:var(--brass-lt);border:1px solid var(--line)}
    .btn-line:hover{background:rgba(74,51,28,.85);transform:translateY(-2px)}
    .hero-emblem{width:230px;height:230px;position:relative;display:grid;place-items:center;flex:none}
    .hero-emblem .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
    .hero-emblem .center .cn{font-family:'Cinzel','Noto Serif SC',serif;font-weight:900;font-size:44px;color:var(--brass-lt)}
    .hero-emblem .center small{display:block;font-family:'IM Fell English',serif;font-style:italic;color:var(--parch-dim);letter-spacing:.2em;font-size:13px;margin-top:4px}
    @media(max-width:760px){.hero-grid{grid-template-columns:1fr}.hero-emblem{width:180px;height:180px}}

    /* --- About --- */
    .about-grid{display:grid;grid-template-columns:300px 1fr;gap:44px;align-items:start}
    .portrait{padding:14px;border-radius:12px}
    .portrait img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;
      filter:sepia(.42) contrast(1.04) brightness(.96);border:1px solid var(--brass-dk)}
    .about-text{font-size:19.5px;line-height:1.9}
    .about-text p{margin:0 0 20px}
    .about-text p:first-child::first-letter{font-family:'Cinzel',serif;font-weight:900;font-size:3em;float:left;
      line-height:.8;margin:8px 14px 0 0;color:var(--brass)}
    @media(max-width:760px){.about-grid{grid-template-columns:1fr}.portrait{max-width:280px}}

    /* --- Ledger rows (education/experience) --- */
    .ledger .item{padding:24px;margin-bottom:22px}
    .ledger .item .when{font-family:'IM Fell English',serif;font-style:italic;color:var(--brass);font-size:16px;letter-spacing:.05em}
    .ledger .item h3{margin:6px 0 4px;font-size:22px;color:var(--brass-lt);letter-spacing:.02em}
    .ledger .item .sub{color:var(--parch-dim);font-size:17px}
    .ledger .item ul{margin:14px 0 0;padding-left:22px}
    .ledger .item ul li{margin:8px 0;line-height:1.7}
    .ledger .item ul li::marker{color:var(--brass)}

    /* --- Skills as gauges --- */
    .gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
    .gauge{padding:22px 18px 18px;text-align:center;border-radius:12px}
    .gauge svg{width:150px;height:92px;margin:0 auto;display:block}
    .gauge .lab{margin-top:12px;font-family:'Cinzel',serif;font-size:14.5px;color:var(--brass-lt);letter-spacing:.03em;line-height:1.35}
    @media(max-width:820px){.gauges{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.gauges{grid-template-columns:1fr}}
    .tags{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
    .chip{position:relative;font-family:'Cinzel',serif;font-size:13px;letter-spacing:.05em;padding:9px 18px;border-radius:999px;
      color:var(--ink);background:linear-gradient(180deg,var(--brass-lt),var(--brass) 50%,var(--brass-dk));
      border:1px solid var(--brass-dk);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 8px rgba(0,0,0,.4)}

    /* --- Courses --- */
    .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
    .course{padding:26px 22px;border-radius:12px;transition:.25s}
    .course:hover{transform:translateY(-4px)}
    .course .ci{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin-bottom:16px;
      color:var(--ink);font-size:22px;background:radial-gradient(circle at 35% 30%,var(--brass-lt),var(--brass-dk));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 10px rgba(0,0,0,.45)}
    .course h4{margin:0 0 10px;font-size:19px;color:var(--brass-lt);line-height:1.3}
    .course p{margin:0;color:var(--parch-dim);font-size:16px;line-height:1.7}
    @media(max-width:860px){.courses{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.courses{grid-template-columns:1fr}}

    /* --- Cards --- */
    .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px}
    .filters button{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.06em;background:rgba(74,51,28,.5);color:var(--parch-dim);
      border:1px solid var(--line);border-radius:8px;padding:9px 18px;cursor:pointer;transition:.2s}
    .filters button:hover{color:var(--brass-lt);border-color:var(--brass)}
    .filters button.active{color:var(--ink);background:linear-gradient(180deg,var(--brass-lt),var(--brass-dk));border-color:var(--brass-dk)}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
    .card{border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:.25s}
    .card:hover{transform:translateY(-5px);box-shadow:inset 0 1px 0 rgba(230,181,101,.14),0 18px 36px rgba(0,0,0,.55)}
    .card .cover{height:170px;overflow:hidden;background:var(--leather-dk);border-bottom:2px solid var(--brass-dk)}
    .card .cover img{width:100%;height:100%;object-fit:cover;filter:sepia(.4) contrast(1.03);transition:transform .5s}
    .card:hover .cover img{transform:scale(1.06)}
    .card .cbody{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
    .card .ctag{display:flex;justify-content:space-between;font-family:'IM Fell English',serif;font-style:italic;font-size:14px;color:var(--parch-dim)}
    .card .ctag .cat{color:var(--brass)}
    .card h4{margin:0;font-size:19px;color:var(--brass-lt);line-height:1.35}
    .card p{margin:0;color:var(--parch-dim);font-size:15.5px;line-height:1.65;flex:1}
    .card .tech{color:var(--copper);font-family:'IM Fell English',serif;font-style:italic}
    .card .more{font-family:'Cinzel',serif;font-size:14px;color:var(--brass);letter-spacing:.04em}
    @media(max-width:860px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.cards{grid-template-columns:1fr}}
    .load-note{grid-column:1/-1;color:var(--parch-dim);padding:18px 0;font-style:italic}

    /* --- Certificates --- */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:26px}
    .cert{display:grid;grid-template-columns:132px 1fr;border-radius:12px;overflow:hidden}
    .cert img{height:100%;width:100%;object-fit:cover;border-right:2px solid var(--brass-dk);filter:sepia(.4)}
    .cert .ct{padding:22px}
    .cert .ct .m{display:flex;justify-content:space-between;font-family:'IM Fell English',serif;font-style:italic;font-size:14px;color:var(--brass)}
    .cert .ct h4{margin:8px 0 8px;font-size:18px;color:var(--brass-lt);line-height:1.35}
    .cert .ct p{margin:0;color:var(--parch-dim);font-size:15.5px;line-height:1.65}
    @media(max-width:560px){.certs{grid-template-columns:1fr}.cert{grid-template-columns:98px 1fr}}

    /* --- Contact --- */
    .contact-grid{display:grid;grid-template-columns:0.9fr 1.1fr;gap:44px}
    .contact-grid>*{min-width:0}
    .contact-info{padding:26px}
    .contact-info a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--hair)}
    .contact-info a:last-child{border-bottom:none}
    .contact-info a .k{font-family:'Cinzel',serif;font-size:14px;letter-spacing:.06em;color:var(--parch-dim);flex:none}
    .contact-info a .v{color:var(--brass-lt);font-family:'IM Fell English',serif;font-style:italic;font-size:17px;text-align:right;overflow-wrap:anywhere;min-width:0}
    .contact-info a:hover .v{text-decoration:underline}
    .cf{padding:26px}
    .cf input,.cf textarea{width:100%;font-family:'IM Fell English','Noto Serif SC',serif;font-size:17px;color:var(--parch);
      background:rgba(20,12,4,.5);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:16px}
    .cf input::placeholder,.cf textarea::placeholder{color:var(--parch-dim)}
    .cf input:focus,.cf textarea:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px rgba(201,138,43,.18)}
    .cf textarea{min-height:150px;resize:vertical}
    #cf-status{margin-top:14px;font-style:italic;font-size:15px}
    @media(max-width:760px){.contact-grid{grid-template-columns:1fr}}

    /* --- Footer --- */
    footer{border-top:2px solid var(--brass-dk);padding:52px 0 60px;margin-top:20px;
      background:linear-gradient(180deg,transparent,rgba(20,12,4,.5))}
    .foot-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:24px}
    .foot-brand{display:flex;align-items:center;gap:14px;font-family:'Cinzel',serif;font-weight:900;font-size:24px;color:var(--brass-lt)}
    .foot-links{display:flex;flex-wrap:wrap;gap:22px;font-family:'Cinzel',serif;font-size:13px;letter-spacing:.06em}
    .foot-links a{color:var(--parch-dim)}.foot-links a:hover{color:var(--brass-lt)}
    .foot-bot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:26px;color:var(--parch-dim);font-size:14px;font-style:italic}
    .foot-bot a{color:var(--parch-dim)}.foot-bot a:hover{color:var(--brass-lt)}

    @media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important}}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="wrap inner">
      <a class="brand" href="#top">
        <span class="gear spin" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 40 40" id="cogtiny"></svg></span>
        CAIJIECHAO
      </a>
      <nav class="nav" id="nav"></nav>
    </div>
  </div>

  <div id="top"></div>

  <!-- HERO -->
  <header class="hero"><div class="wrap">
    <div class="cog-deco gear spin rev" style="top:-40px;right:-30px" aria-hidden="true"><svg width="180" height="180" viewBox="0 0 40 40" class="cogbig"></svg></div>
    <div class="hero-grid">
      <div>
        <div class="greet" id="greet"></div>
        <h1 id="name"></h1>
        <div class="role" id="role"></div>
        <div class="head" id="headline"></div>
        <div class="loc" id="loc"></div>
        <div class="cta-row">
          <a class="btn btn-fill" id="cvBtn" href="#" download></a>
          <a class="btn btn-line" id="ghBtn" target="_blank" rel="noopener"></a>
        </div>
      </div>
      <div class="hero-emblem">
        <span class="gear spin" aria-hidden="true"><svg width="230" height="230" viewBox="0 0 40 40" class="cogbig"></svg></span>
        <div class="center"><div><span class="cn" id="emblem"></span><small id="emblem-sub"></small></div></div>
      </div>
    </div>
  </div></header>

  <div class="wrap"><div class="pipe" aria-hidden="true"></div></div>

  <!-- ABOUT -->
  <section id="about"><div class="wrap">
    <div class="sec-head"><span class="cog gear" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 40 40" class="cogsm"></svg></span>
      <h2 class="sec-title" id="l-about"><small id="e-about">About the Engineer</small></h2><span class="rule"></span></div>
    <div class="about-grid">
      <div class="portrait panel">
        <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
        <img id="portrait" alt="" />
      </div>
      <div class="about-text" id="about-text"></div>
    </div>
  </div></section>

  <!-- EDUCATION -->
  <section id="education"><div class="wrap">
    <div class="sec-head"><span class="cog gear" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 40 40" class="cogsm"></svg></span>
      <h2 class="sec-title" id="l-edu"><small id="e-edu">Academy</small></h2><span class="rule"></span></div>
    <div class="ledger" id="edu-list"></div>
  </div></section>

  <!-- SKILLS -->
  <section id="skills"><div class="wrap">
    <div class="sec-head"><span class="cog gear" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 40 40" class="cogsm"></svg></span>
      <h2 class="sec-title" id="l-skills"><small id="e-skills">Pressure Gauges</small></h2><span class="rule"></span></div>
    <div class="gauges" id="skills-list"></div>
    <div class="tags" id="tags"></div>
  </div></section>

  <!-- COURSES -->
  <section id="courses"><div class="wrap">
    <div class="sec-head"><span class="cog gear" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 40 40" class="cogsm"></svg></span>
      <h2 class="sec-title" id="l-courses"><small id="e-courses">Curriculum</small></h2><span class="rule"></span></div>
    <div class="courses" id="courses-list"></div>
  </div></section>

  <!-- EXPERIENCE -->
  <section id="experience"><div class="wrap">
    <div class="sec-head"><span class="cog gear" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 40 40" class="cogsm"></svg></span>
      <h2 class="sec-title" id="l-exp"><small id="e-exp">Field Work</small></h2><span class="rule"></span></div>
    <div class="ledger" id="exp-list"></div>
  </div></section>

  <!-- PROJECTS -->
  <section id="projects"><div class="wrap">
    <div class="sec-head"><span class="cog gear" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 40 40" class="cogsm"></svg></span>
      <h2 class="sec-title" id="l-projects"><small id="e-proj">Contraptions</small></h2><span class="rule"></span></div>
    <div class="cards" id="projects-list"><div class="load-note" id="proj-load"></div></div>
  </div></section>

  <div class="wrap"><div class="pipe" aria-hidden="true"></div></div>

  <!-- ARTICLES -->
  <section id="articles"><div class="wrap">
    <div class="sec-head"><span class="cog gear" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 40 40" class="cogsm"></svg></span>
      <h2 class="sec-title" id="l-articles"><small id="e-art">Journals</small></h2><span class="rule"></span></div>
    <div class="filters" id="filters"></div>
    <div class="cards" id="articles-list"><div class="load-note" id="art-load"></div></div>
  </div></section>

  <!-- CERTIFICATES -->
  <section id="certificates"><div class="wrap">
    <div class="sec-head"><span class="cog gear" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 40 40" class="cogsm"></svg></span>
      <h2 class="sec-title" id="l-certs"><small id="e-cert">Commendations</small></h2><span class="rule"></span></div>
    <div class="certs" id="certs-list"></div>
  </div></section>

  <!-- CONTACT -->
  <section id="contact"><div class="wrap">
    <div class="sec-head"><span class="cog gear" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 40 40" class="cogsm"></svg></span>
      <h2 class="sec-title" id="l-contact"><small id="e-contact">Telegraph</small></h2><span class="rule"></span></div>
    <div class="contact-grid">
      <div class="contact-info panel" id="contact-info">
        <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
      </div>
      <form class="cf panel" id="cf">
        <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
        <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
        <input type="text" name="name" id="cf-name" required>
        <input type="email" name="email" id="cf-email" required>
        <textarea name="message" id="cf-msg" required></textarea>
        <button type="submit" class="btn btn-fill" id="cf-send"></button>
        <p id="cf-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div></section>

  <!-- FOOTER -->
  <footer><div class="wrap">
    <div class="foot-top">
      <div class="foot-brand"><span class="gear spin fast" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 40 40" class="cogsm"></svg></span>CAIJIECHAO</div>
      <div class="foot-links" id="foot-social"></div>
    </div>
    <div class="foot-bot">
      <span id="foot-desc"></span>
      <a id="foot-icp" target="_blank" rel="noopener"></a>
    </div>
  </div></footer>

  <script>window.THEME_ID = "30-steampunk";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";

    // --- Build a gear/cog SVG path (drawn once, cloned via <use>) ---
    function cogPath(teeth, rOuter, rInner, rHole){
      let d="";
      const step = Math.PI/teeth;
      for(let i=0;i<teeth*2;i++){
        const r = (i%2===0)? rOuter : rInner;
        const a = i*step - Math.PI/2;
        d += (i===0?"M":"L") + (20+r*Math.cos(a)).toFixed(2) + "," + (20+r*Math.sin(a)).toFixed(2);
      }
      d+="Z";
      return `<path d="${d}" fill="currentColor"/><circle cx="20" cy="20" r="${rHole}" fill="#231609"/><circle cx="20" cy="20" r="${rHole-1.5}" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".7"/>`;
    }
    function paintCogs(){
      const big = cogPath(12,19,15,7.5);
      const sm  = cogPath(10,19,14.5,6.5);
      const tiny= cogPath(8,19,14,6);
      document.querySelectorAll('svg.cogbig').forEach(s=>s.innerHTML=big);
      document.querySelectorAll('svg.cogsm').forEach(s=>s.innerHTML=sm);
      document.querySelectorAll('#cogtiny').forEach(s=>s.innerHTML=tiny);
    }

    // --- Pressure gauge SVG for a skill (decorative needle) ---
    function gaugeSVG(val){ // val 0..1
      const cx=75, cy=78, r=58;
      const a0=Math.PI, a1=0; // 180deg sweep, left to right
      const ang = a0 + (a1-a0)*val;
      const nx = cx + (r-14)*Math.cos(ang), ny = cy + (r-14)*Math.sin(ang);
      // tick marks
      let ticks="";
      for(let i=0;i<=8;i++){
        const ta=a0+(a1-a0)*(i/8);
        const x1=cx+r*Math.cos(ta), y1=cy+r*Math.sin(ta);
        const x2=cx+(r-8)*Math.cos(ta), y2=cy+(r-8)*Math.sin(ta);
        ticks+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#e6b565" stroke-width="${i%2?1:2}" opacity="${i%2?.5:.9}"/>`;
      }
      const arc=`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`;
      return `
        <circle cx="${cx}" cy="${cy}" r="${r+8}" fill="rgba(20,12,4,.5)" stroke="#8a5e1c" stroke-width="2"/>
        <path d="${arc}" fill="none" stroke="#8a5e1c" stroke-width="6" opacity=".55"/>
        <path d="${arc}" fill="none" stroke="#c98a2b" stroke-width="3"/>
        ${ticks}
        <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#e6b565" stroke-width="3" stroke-linecap="round"/>
        <circle cx="${cx}" cy="${cy}" r="6" fill="#c98a2b" stroke="#231609" stroke-width="1.5"/>`;
    }

    function renderStatic(){
      const zh = CJCData.lang()==="zh";
      document.title = (zh?"蔡杰超":"Cai Jiechao")+" — "+(zh?"蒸汽朋克":"Steampunk");

      document.getElementById('nav').innerHTML = [
        ['about','nav_about'],['courses','nav_courses'],['projects','nav_portfolio'],
        ['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');

      // hero
      document.getElementById('greet').textContent = t(P.greeting);
      document.getElementById('name').textContent = t(P.name);
      document.getElementById('role').textContent = t(P.role);
      document.getElementById('headline').textContent = t(P.headline);
      document.getElementById('loc').innerHTML = `<i class="fa fa-map-marker"></i> ${esc(t(P.location))}`;
      document.getElementById('emblem').textContent = zh ? "蔡" : "CJC";
      document.getElementById('emblem-sub').textContent = zh ? "杰超" : "EST. 2022";
      const cv = document.getElementById('cvBtn');
      cv.innerHTML = `<i class="fa fa-download"></i> ${esc(t(P.ui.download_cv))}`; cv.href = t(P.cv);
      const gh = document.getElementById('ghBtn');
      gh.innerHTML = `<i class="fa fa-github"></i> GitHub`; gh.href = P.contact.github;

      set('l-about', t(P.ui.about_me)); set('l-edu', t(P.ui.education_bg));
      set('l-skills', t(P.ui.core_tech)); set('l-courses', t(P.ui.core_courses));
      set('l-exp', t(P.ui.internship_exp)); set('l-projects', t(P.ui.latest_projects));
      set('l-articles', t(P.ui.latest_articles)); set('l-certs', t(P.ui.certificates));
      set('l-contact', t(P.ui.get_in_touch));

      // about
      document.getElementById('portrait').src = P.avatar;
      document.getElementById('portrait').alt = t(P.name);
      document.getElementById('about-text').innerHTML = P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('');

      // education
      document.getElementById('edu-list').innerHTML = P.education.map(e=>`
        <div class="item panel"><span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
          <div class="when">${esc(e.period)}</div><h3>${esc(t(e.school))}</h3>
          <div class="sub">${esc(t(e.degree))} · ${esc(t(e.note))}</div></div>`).join('');

      // skills gauges
      const gv=[0.86,0.78,0.9,0.72,0.68,0.82];
      document.getElementById('skills-list').innerHTML = P.skills.map((s,i)=>`
        <div class="gauge panel"><span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
          <svg viewBox="0 0 150 92" role="img" aria-label="${esc(s)}">${gaugeSVG(gv[i%gv.length])}</svg>
          <div class="lab">${esc(s)}</div></div>`).join('');
      document.getElementById('tags').innerHTML = P.skillTags.map(x=>`<span class="chip">${esc(x)}</span>`).join('');

      // courses
      document.getElementById('courses-list').innerHTML = P.courses.map(c=>`
        <div class="course panel"><span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
          <div class="ci"><i class="fa ${esc(c.icon)}"></i></div>
          <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');

      // experience
      document.getElementById('exp-list').innerHTML = P.experience.map(x=>`
        <div class="item panel"><span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
          <div class="when">${esc(x.period)}</div><h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3>
          <div class="sub">${esc(t(x.summary))}</div>
          <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div>`).join('');

      // certificates
      document.getElementById('certs-list').innerHTML = P.certificates.map(c=>`
        <div class="cert panel"><img src="${esc(c.image)}" alt="${esc(t(c.title))}" onerror="this.src='/index_page/img/blogs/1.jpg'">
          <div class="ct"><div class="m"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
          <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');

      // contact info
      const ci = document.getElementById('contact-info');
      ci.innerHTML = `<span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>` + [
        ['Email', P.contact.email, 'mailto:'+P.contact.email],
        [zh?'电话':'Phone', P.contact.phone, P.contact.phoneHref],
        ['GitHub', '@'+P.contact.githubUser, P.contact.github],
        [zh?'微信':'WeChat', zh?'扫码':'QR', P.contact.wechatQrPage],
      ].map(([k,v,h])=>`<a href="${esc(h)}" target="_blank" rel="noopener"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></a>`).join('');

      // form
      document.getElementById('cf-name').placeholder = t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder = t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder = t(P.ui.msg_placeholder);
      document.getElementById('cf-send').innerHTML = `<i class="fa fa-paper-plane"></i> ${esc(t(P.ui.send))}`;

      // footer
      document.getElementById('foot-social').innerHTML =
        `<a href="${P.contact.github}" target="_blank" rel="noopener">GitHub</a>
         <a href="mailto:${P.contact.email}">Email</a>
         <a href="${P.contact.wechatQrPage}">${zh?'微信':'WeChat'}</a>
         <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent = t(P.ui.footer_desc);
      const icp = document.getElementById('foot-icp'); icp.textContent = P.icp; icp.href = P.icpUrl;

      // filters
      document.getElementById('filters').innerHTML = P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }
    function set(id,val){ const el=document.getElementById(id); if(el) el.textContent=val; }

    function renderProjects(){
      const box = document.getElementById('projects-list');
      if(!projects.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML = projects.map(p=>`
        <a class="card panel" href="${esc(p.href)}">
          <div class="cbody">
            <div class="ctag"><span class="cat">${esc(t(P.ui.tech_stack))}</span><span>${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <p class="tech">${esc(p.tech_stack||'')}</p>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} ⚙</span>
          </div></a>`).join('');
    }
    function renderArticles(){
      const box = document.getElementById('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML = list.map(a=>`
        <a class="card panel" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${esc(a.localTitle())}"></div>
          <div class="cbody">
            <div class="ctag"><span class="cat">${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} ⚙</span>
          </div></a>`).join('');
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML = `<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-list').innerHTML = `<div class="load-note">⚠ ${esc(CJCData.lang()==='zh'?'内容加载失败':'Failed to load articles.')}</div>`; }
    }

    document.getElementById('cf').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      const payload = { name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color='var(--parch-dim)'; s.textContent = t(P.ui.sending);
      try{ const r = await CJCData.sendContact(payload); s.style.color='var(--brass-lt)'; s.textContent = r.message||'Sent.'; f.reset(); }
      catch(err){ s.style.color='var(--copper)'; s.textContent = err.message; }
    });

    const fa = document.createElement('link');
    fa.rel='stylesheet';
    fa.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css';
    document.head.appendChild(fa);

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      paintCogs();
      renderStatic();
      CJCData.mountSwitcher({ accent:'#c98a2b' });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

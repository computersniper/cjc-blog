<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Organic</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --cream:#eef3e2; --sage:#d9e4c3;
      --green:#6a8d4f; --green-deep:#42592c; --green-mid:#5a7a41;
      --clay:#b07d56; --clay-deep:#8f5f3d;
      --ink:#2f3a24; --ink-soft:#556146;
      --paper:#fbfcf5; --paper-2:#f4f7ea;
      --line:rgba(47,58,36,.14);
      --shadow:0 18px 40px -18px rgba(47,58,36,.30);
      --shadow-soft:0 10px 30px -14px rgba(47,58,36,.22);
      --blob-a:60% 40% 55% 45% / 55% 45% 60% 40%;
      --blob-b:45% 55% 60% 40% / 50% 45% 55% 50%;
      --r-soft:26px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;color:var(--ink);
      font-family:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
      line-height:1.6;-webkit-font-smoothing:antialiased;
      background:linear-gradient(160deg,var(--cream) 0%,#e7eecf 46%,var(--sage) 100%);
      background-attachment:fixed;min-height:100vh;overflow-x:hidden;
    }
    a{color:inherit}
    img{max-width:100%;display:block}
    h1,h2,h3,h4{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;line-height:1.1}
    .container{max-width:1140px;margin:0 auto;padding:0 26px;position:relative;z-index:2}

    /* ---- decorative botanical background ---- */
    .backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
    .backdrop .blob{position:absolute;filter:blur(8px);opacity:.28;
      animation:morph 22s ease-in-out infinite,float 16s ease-in-out infinite}
    .backdrop .b1{width:420px;height:420px;top:-120px;right:-100px;
      background:radial-gradient(circle at 35% 35%,#c9dda6,#9dbd76);border-radius:var(--blob-a)}
    .backdrop .b2{width:340px;height:340px;bottom:6%;left:-120px;
      background:radial-gradient(circle at 40% 40%,#e6d3bd,#cfa981);border-radius:var(--blob-b);animation-delay:-6s}
    .backdrop .b3{width:260px;height:260px;top:44%;right:-90px;
      background:radial-gradient(circle at 40% 40%,#d5e6b4,#a9c983);border-radius:var(--blob-a);animation-delay:-11s;opacity:.4}
    .leaf-float{position:absolute;color:var(--green);opacity:.28;animation:sway 9s ease-in-out infinite}
    .leaf-float.lf1{top:16%;left:5%;width:56px;animation-delay:-1s}
    .leaf-float.lf2{top:70%;right:8%;width:70px;animation-delay:-4s}
    .leaf-float.lf3{top:38%;left:46%;width:40px;opacity:.18;animation-delay:-2.5s}

    /* ---- top bar ---- */
    .topbar{position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      background:rgba(247,250,235,.72);border-bottom:1px solid var(--line)}
    .topbar .inner{display:flex;align-items:center;gap:26px;height:66px;padding-right:190px}
    .brand{display:inline-flex;align-items:center;gap:9px;font-family:'Fraunces',serif;font-weight:600;
      font-size:20px;text-decoration:none;color:var(--ink);letter-spacing:.2px}
    .brand .brand-leaf{width:24px;height:24px;color:var(--green);flex:none}
    .navlinks{display:flex;gap:22px}
    .navlinks a{font-size:14px;font-weight:700;text-decoration:none;color:var(--ink-soft);position:relative;padding:4px 2px}
    .navlinks a:hover{color:var(--green-deep)}
    .navlinks a::after{content:"";position:absolute;left:0;bottom:-2px;width:0;height:2px;background:var(--green);
      border-radius:2px;transition:width .22s ease}
    .navlinks a:hover::after{width:100%}
    @media(max-width:900px){.topbar .inner{padding-right:150px}}
    @media(max-width:760px){.navlinks{display:none}.topbar .inner{padding-right:150px}}

    /* ---- section scaffolding ---- */
    section{padding:74px 0;position:relative}
    .sec-head{display:flex;align-items:center;gap:14px;margin-bottom:34px}
    .sec-head .sprig{width:34px;height:34px;color:var(--green);flex:none;
      animation:sway 7s ease-in-out infinite;transform-origin:60% 90%}
    .sec-title{font-size:clamp(28px,4.4vw,44px);margin:0;color:var(--ink);letter-spacing:.2px}
    .kicker{font-weight:800;text-transform:uppercase;letter-spacing:.16em;font-size:12px;
      color:var(--green-deep);margin:0 0 6px}
    .wave{display:block;width:100%;height:40px;color:var(--sage);position:relative;z-index:1}

    /* ---- hero ---- */
    .hero{padding:70px 0 30px;position:relative}
    .hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
    .greet{display:inline-flex;align-items:center;gap:9px;font-weight:800;color:var(--green-deep);
      background:rgba(106,141,79,.14);padding:8px 16px;border-radius:999px;font-size:14px}
    .greet .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
    .hero h1{font-size:clamp(46px,9vw,88px);margin:20px 0 0;color:var(--ink);letter-spacing:-.01em}
    .hero .headline{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(20px,3.4vw,32px);
      color:var(--green-mid);margin:14px 0 0;max-width:20ch;font-style:italic}
    .hero .roleline{margin-top:18px;font-size:17px;color:var(--ink-soft);max-width:44ch}
    .hero .roleline b{color:var(--ink)}
    .hero .metapills{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
    .pill{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);
      padding:8px 15px;border-radius:999px;font-size:14px;font-weight:700;color:var(--ink-soft);box-shadow:var(--shadow-soft)}
    .pill i{color:var(--green)}
    .hero-cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}
    .btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:15px;
      padding:14px 26px;border-radius:999px;cursor:pointer;border:2px solid transparent;transition:transform .18s ease,box-shadow .18s ease,background .18s ease,color .18s ease;font-family:inherit}
    .btn-primary{background:var(--green);color:#fff;box-shadow:0 14px 28px -12px rgba(106,141,79,.7)}
    .btn-primary:hover{transform:translateY(-3px);box-shadow:0 20px 34px -12px rgba(106,141,79,.8)}
    .btn-ghost{background:transparent;color:var(--green-deep);border-color:var(--green)}
    .btn-ghost:hover{background:var(--green);color:#fff;transform:translateY(-3px)}
    .hero-portrait{position:relative;display:grid;place-items:center}
    .hero-blob{width:min(360px,80vw);aspect-ratio:1/1;border-radius:var(--blob-a);
      background:linear-gradient(150deg,#d7e7b5,#b8d18f 60%,#e3cdb2);box-shadow:var(--shadow);
      display:grid;place-items:center;animation:morph 18s ease-in-out infinite;position:relative}
    .hero-blob .hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
      object-position:center 22%;border-radius:inherit;box-shadow:inset 0 0 0 6px rgba(255,255,255,.5)}
    .hero-blob .ring{position:absolute;inset:-14px;border:2px dashed rgba(106,141,79,.4);border-radius:inherit;z-index:2}
    .hero-leaf{position:absolute;color:var(--clay);width:66px;top:-10px;right:6%;animation:sway 8s ease-in-out infinite}
    @media(max-width:820px){.hero-grid{grid-template-columns:1fr;gap:22px}.hero-portrait{order:-1}}

    /* ---- about ---- */
    .about-grid{display:grid;grid-template-columns:320px 1fr;gap:48px;align-items:center}
    .portrait-wrap{position:relative;justify-self:center}
    .portrait{width:clamp(220px,60vw,300px);aspect-ratio:1/1;object-fit:cover;border-radius:var(--blob-a);
      border:6px solid var(--paper);box-shadow:var(--shadow);animation:morph 20s ease-in-out infinite}
    .portrait-wrap .badge{position:absolute;bottom:6px;right:-6px;background:var(--paper);border:1px solid var(--line);
      border-radius:999px;padding:8px 15px;font-weight:800;font-size:13px;color:var(--green-deep);
      box-shadow:var(--shadow-soft);display:inline-flex;gap:7px;align-items:center}
    .about-body p{font-size:17px;margin:0 0 16px;max-width:62ch;color:var(--ink-soft)}
    .about-body p b{color:var(--ink)}
    @media(max-width:760px){.about-grid{grid-template-columns:1fr;gap:26px}}

    /* ---- education ---- */
    .edu-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    .edu-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--blob-a);padding:30px 30px 34px;
      box-shadow:var(--shadow-soft);transition:transform .2s ease,box-shadow .2s ease}
    .edu-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
    .edu-card .when{display:inline-block;background:rgba(176,125,86,.16);color:var(--clay-deep);font-weight:800;
      font-size:13px;padding:5px 13px;border-radius:999px}
    .edu-card h3{font-size:21px;margin:14px 0 6px;color:var(--ink)}
    .edu-card .deg{font-weight:800;color:var(--green-deep);margin-bottom:6px}
    .edu-card .note{color:var(--ink-soft);font-size:15px;margin:0}
    @media(max-width:700px){.edu-grid{grid-template-columns:1fr}}

    /* ---- skills ---- */
    .skills-wrap{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    .skill-line{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);
      border-radius:18px 26px 20px 24px;padding:14px 20px;box-shadow:var(--shadow-soft);font-weight:700;color:var(--ink)}
    .skill-line .lf{width:22px;height:22px;color:var(--green);flex:none}
    .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
    .chip{background:transparent;border:1.5px solid rgba(106,141,79,.45);color:var(--green-deep);
      font-weight:800;font-size:13px;padding:8px 16px;border-radius:999px;transition:.18s}
    .chip:nth-child(3n){border-color:rgba(176,125,86,.5);color:var(--clay-deep)}
    .chip:hover{background:var(--green);color:#fff;border-color:var(--green);transform:translateY(-2px)}
    @media(max-width:700px){.skills-wrap{grid-template-columns:1fr}}

    /* ---- courses ---- */
    .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
    .course{background:var(--paper);border:1px solid var(--line);padding:28px 26px 30px;box-shadow:var(--shadow-soft);
      transition:transform .2s ease,box-shadow .2s ease;border-radius:var(--blob-a)}
    .course:nth-child(even){border-radius:var(--blob-b)}
    .course:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
    .course .ci{width:56px;height:56px;display:grid;place-items:center;border-radius:50% 45% 55% 45%;
      background:linear-gradient(145deg,#d9e8bd,#b7d18f);color:var(--green-deep);font-size:24px;margin-bottom:16px}
    .course h4{margin:0 0 9px;font-size:19px;color:var(--ink)}
    .course p{margin:0;color:var(--ink-soft);font-size:14.5px;line-height:1.6}
    @media(max-width:860px){.courses{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.courses{grid-template-columns:1fr}}

    /* ---- experience ---- */
    .exp-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--blob-a);padding:36px;
      box-shadow:var(--shadow-soft);position:relative;overflow:hidden}
    .exp-card .exp-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:baseline}
    .exp-card h3{margin:0;font-size:24px;color:var(--ink)}
    .exp-card .co{color:var(--green-deep);font-weight:800}
    .exp-card .when{color:var(--clay-deep);font-weight:800;font-size:14px}
    .exp-card .summary{color:var(--ink-soft);margin:14px 0 18px;max-width:70ch}
    .exp-bullets{list-style:none;margin:0;padding:0;display:grid;gap:12px}
    .exp-bullets li{display:flex;gap:12px;color:var(--ink-soft);font-size:15px}
    .exp-bullets li .lf{width:20px;height:20px;color:var(--green);flex:none;margin-top:3px}

    /* ---- cards (projects/articles) ---- */
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:24px;overflow:hidden;text-decoration:none;
      color:inherit;display:flex;flex-direction:column;box-shadow:var(--shadow-soft);
      transition:transform .2s ease,box-shadow .2s ease}
    .card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
    .card .cover{height:172px;background:var(--paper-2);overflow:hidden;position:relative}
    .card .cover img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
    .card:hover .cover img{transform:scale(1.06)}
    .card .cbody{padding:22px;display:flex;flex-direction:column;gap:10px;flex:1}
    .card .ctag{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;font-weight:800}
    .card .ctag .cat{color:var(--green-deep);background:rgba(106,141,79,.13);padding:4px 11px;border-radius:999px;text-transform:capitalize}
    .card .ctag .date{color:var(--ink-soft)}
    .card h4{margin:0;font-size:20px;color:var(--ink);line-height:1.2}
    .card p{margin:0;color:var(--ink-soft);font-size:14.5px;flex:1}
    .card .tech{color:var(--clay-deep);font-weight:700;font-size:13px}
    .card .more{color:var(--green-deep);font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:6px}
    .proj .card{border-radius:26px}
    @media(max-width:860px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.cards{grid-template-columns:1fr}}

    .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
    .filters button{background:var(--paper);border:1.5px solid var(--line);color:var(--ink-soft);font-family:inherit;
      font-weight:800;font-size:13px;padding:9px 18px;border-radius:999px;cursor:pointer;transition:.18s}
    .filters button:hover{border-color:var(--green);color:var(--green-deep)}
    .filters button.active{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 8px 18px -8px rgba(106,141,79,.7)}

    /* ---- certificates ---- */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:24px}
    .cert{display:grid;grid-template-columns:130px 1fr;background:var(--paper);border:1px solid var(--line);
      border-radius:24px;overflow:hidden;box-shadow:var(--shadow-soft)}
    .cert img{width:100%;height:100%;object-fit:cover}
    .cert .ct{padding:22px}
    .cert .ct .meta{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;font-size:12px;font-weight:800}
    .cert .ct .meta .tag{color:var(--clay-deep)}
    .cert .ct .meta .dt{color:var(--ink-soft)}
    .cert .ct h4{margin:10px 0 8px;font-size:18px;color:var(--ink);line-height:1.2}
    .cert .ct p{margin:0;color:var(--ink-soft);font-size:14px}
    @media(max-width:560px){.certs{grid-template-columns:1fr}.cert{grid-template-columns:96px 1fr}}

    /* ---- contact ---- */
    .contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:38px}
    .contact-intro p{color:var(--ink-soft);font-size:16px;max-width:44ch}
    .contact-list{display:grid;gap:12px;margin-top:22px}
    .contact-list a{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);
      border-radius:16px 22px 18px 20px;padding:14px 18px;text-decoration:none;font-weight:700;color:var(--ink);
      box-shadow:var(--shadow-soft);transition:transform .18s ease}
    .contact-list a:hover{transform:translateX(5px)}
    .contact-list a .ico{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:50% 45% 55% 45%;
      background:rgba(106,141,79,.14);color:var(--green-deep);font-size:17px}
    .contact-list a small{display:block;color:var(--ink-soft);font-weight:600;font-size:12px}
    .contact-form{background:var(--paper);border:1px solid var(--line);border-radius:var(--blob-a);padding:30px;box-shadow:var(--shadow-soft)}
    .contact-form label{display:block;font-weight:800;font-size:13px;color:var(--green-deep);margin:0 0 6px}
    .contact-form input,.contact-form textarea{width:100%;background:var(--paper-2);border:1.5px solid var(--line);
      border-radius:14px;font-family:inherit;font-size:15px;padding:13px 16px;margin-bottom:16px;color:var(--ink);transition:border .18s,box-shadow .18s}
    .contact-form input:focus,.contact-form textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px rgba(106,141,79,.18)}
    .contact-form textarea{min-height:130px;resize:vertical}
    .contact-form button{width:100%;justify-content:center}
    #cf-status{margin:14px 0 0;font-weight:800;font-size:14px;min-height:1.2em}
    @media(max-width:760px){.contact-grid{grid-template-columns:1fr;gap:26px}}

    /* ---- footer ---- */
    footer{position:relative;z-index:2;background:linear-gradient(160deg,#3c4d2b,#2f3a24);color:#e9efdc;margin-top:40px}
    footer .fwrap{padding:54px 0 40px}
    footer .frow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:22px;align-items:flex-start}
    footer .brand{color:#fff}
    footer .brand .brand-leaf{color:#a9c983}
    footer .fdesc{color:#c3cfae;font-size:14px;margin:12px 0 0;max-width:34ch}
    footer .fsocial{display:flex;flex-wrap:wrap;gap:10px}
    footer .fsocial a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#e9efdc;
      background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:9px 16px;border-radius:999px;
      font-weight:700;font-size:13px;transition:.18s}
    footer .fsocial a:hover{background:var(--green);border-color:var(--green);color:#fff}
    footer .fbottom{margin-top:34px;padding-top:22px;border-top:1px solid rgba(255,255,255,.14);
      display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;font-size:13px;color:#b7c39f}
    footer .fbottom a{color:#b7c39f;text-decoration:none}
    footer .fbottom a:hover{color:#fff}

    .load-note{grid-column:1/-1;color:var(--ink-soft);font-size:15px;font-weight:600;
      background:var(--paper);border:1px dashed var(--line);border-radius:20px;padding:22px 24px;text-align:center}

    /* ---- focus visibility ---- */
    a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{
      outline:3px solid var(--green);outline-offset:3px;border-radius:8px}

    /* ---- motion keyframes ---- */
    @keyframes morph{0%,100%{border-radius:60% 40% 55% 45% / 55% 45% 60% 40%}
      50%{border-radius:45% 55% 40% 60% / 45% 60% 45% 55%}}
    @keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}

    @media (prefers-reduced-motion: reduce){
      *{animation:none !important;scroll-behavior:auto !important;transition:none !important}
    }
  </style>
</head>
<body>
  <!-- decorative background -->
  <div class="backdrop" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
  </div>

  <div class="topbar">
    <div class="container inner">
      <a class="brand" href="#top">
        <svg class="brand-leaf" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M29 3C13 4 5 12 4 25c-.3 4 5.4 5.3 8.6 3.2C21.6 22.4 26 13.4 29 3z"/><path d="M22 9C15 14 10 20 8 27" stroke="#fbfcf5" stroke-width="1.3" fill="none" opacity=".55"/></svg>
        <span id="brand-txt">CaiJiechao</span>
      </a>
      <nav class="navlinks" id="nav"></nav>
    </div>
  </div>

  <div id="top"></div>

  <!-- HERO -->
  <header class="hero"><div class="container">
    <div class="hero-grid">
      <div>
        <span class="greet"><span class="dot"></span><span id="greet"></span></span>
        <h1 id="name"></h1>
        <p class="headline" id="headline"></p>
        <p class="roleline" id="roleline"></p>
        <div class="metapills">
          <span class="pill"><i class="fa fa-map-marker" aria-hidden="true"></i><span id="loc-pill"></span></span>
          <span class="pill"><i class="fa fa-leaf" aria-hidden="true"></i><span id="role-pill"></span></span>
        </div>
        <div class="hero-cta">
          <a class="btn btn-primary" id="cvBtn" href="#" download>
            <i class="fa fa-download" aria-hidden="true"></i><span id="cv-label"></span>
          </a>
          <a class="btn btn-ghost" id="ghBtn" href="#" target="_blank" rel="noopener">
            <i class="fa fa-github" aria-hidden="true"></i><span>GitHub</span>
          </a>
        </div>
      </div>
      <div class="hero-portrait">
        <div class="hero-blob">
          <span class="ring" aria-hidden="true"></span>
          <img class="hero-photo" id="hero-photo" alt="" />
          <svg class="hero-leaf" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M3 3C19 4 27 12 28 25c.3 4-5.4 5.3-8.6 3.2C10.4 22.4 6 13.4 3 3z"/></svg>
        </div>
      </div>
    </div>
  </div></header>

  <svg class="wave" viewBox="0 0 1440 40" preserveAspectRatio="none" aria-hidden="true"><path fill="currentColor" d="M0 22C240 2 480 2 720 16s480 26 720 8v16H0z" opacity=".55"/></svg>

  <!-- ABOUT -->
  <section id="about"><div class="container">
    <div class="sec-head">
      <svg class="sprig" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M29 3C13 4 5 12 4 25c-.3 4 5.4 5.3 8.6 3.2C21.6 22.4 26 13.4 29 3z"/></svg>
      <div><p class="kicker" id="k-about"></p><h2 class="sec-title" id="l-about"></h2></div>
    </div>
    <div class="about-grid">
      <div class="portrait-wrap">
        <img class="portrait" id="portrait" alt="" />
        <span class="badge"><i class="fa fa-leaf" aria-hidden="true" style="color:var(--green)"></i><span id="loc-badge"></span></span>
      </div>
      <div class="about-body" id="about-text"></div>
    </div>
  </div></section>

  <!-- EDUCATION -->
  <section id="education"><div class="container">
    <div class="sec-head">
      <svg class="sprig" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M29 3C13 4 5 12 4 25c-.3 4 5.4 5.3 8.6 3.2C21.6 22.4 26 13.4 29 3z"/></svg>
      <div><p class="kicker" id="k-edu"></p><h2 class="sec-title" id="l-edu"></h2></div>
    </div>
    <div class="edu-grid" id="edu-list"></div>
  </div></section>

  <!-- SKILLS -->
  <section id="skills"><div class="container">
    <div class="sec-head">
      <svg class="sprig" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M29 3C13 4 5 12 4 25c-.3 4 5.4 5.3 8.6 3.2C21.6 22.4 26 13.4 29 3z"/></svg>
      <div><p class="kicker" id="k-skills"></p><h2 class="sec-title" id="l-skills"></h2></div>
    </div>
    <div class="skills-wrap" id="skills-list"></div>
    <div class="chips" id="chips"></div>
  </div></section>

  <!-- COURSES -->
  <section id="courses"><div class="container">
    <div class="sec-head">
      <svg class="sprig" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M29 3C13 4 5 12 4 25c-.3 4 5.4 5.3 8.6 3.2C21.6 22.4 26 13.4 29 3z"/></svg>
      <div><p class="kicker" id="k-courses"></p><h2 class="sec-title" id="l-courses"></h2></div>
    </div>
    <div class="courses" id="courses-list"></div>
  </div></section>

  <!-- EXPERIENCE -->
  <section id="experience"><div class="container">
    <div class="sec-head">
      <svg class="sprig" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M29 3C13 4 5 12 4 25c-.3 4 5.4 5.3 8.6 3.2C21.6 22.4 26 13.4 29 3z"/></svg>
      <div><p class="kicker" id="k-exp"></p><h2 class="sec-title" id="l-exp"></h2></div>
    </div>
    <div id="exp-list"></div>
  </div></section>

  <!-- PROJECTS -->
  <section id="projects" class="proj"><div class="container">
    <div class="sec-head">
      <svg class="sprig" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M29 3C13 4 5 12 4 25c-.3 4 5.4 5.3 8.6 3.2C21.6 22.4 26 13.4 29 3z"/></svg>
      <div><p class="kicker" id="k-projects"></p><h2 class="sec-title" id="l-projects"></h2></div>
    </div>
    <div class="cards" id="projects-list"><div class="load-note" id="proj-load"></div></div>
  </div></section>

  <!-- ARTICLES -->
  <section id="articles"><div class="container">
    <div class="sec-head">
      <svg class="sprig" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M29 3C13 4 5 12 4 25c-.3 4 5.4 5.3 8.6 3.2C21.6 22.4 26 13.4 29 3z"/></svg>
      <div><p class="kicker" id="k-articles"></p><h2 class="sec-title" id="l-articles"></h2></div>
    </div>
    <div class="filters" id="filters"></div>
    <div class="cards" id="articles-list"><div class="load-note" id="art-load"></div></div>
  </div></section>

  <!-- CERTIFICATES -->
  <section id="certificates"><div class="container">
    <div class="sec-head">
      <svg class="sprig" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M29 3C13 4 5 12 4 25c-.3 4 5.4 5.3 8.6 3.2C21.6 22.4 26 13.4 29 3z"/></svg>
      <div><p class="kicker" id="k-certs"></p><h2 class="sec-title" id="l-certs"></h2></div>
    </div>
    <div class="certs" id="certs-list"></div>
  </div></section>

  <!-- CONTACT -->
  <section id="contact"><div class="container">
    <div class="sec-head">
      <svg class="sprig" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M29 3C13 4 5 12 4 25c-.3 4 5.4 5.3 8.6 3.2C21.6 22.4 26 13.4 29 3z"/></svg>
      <div><p class="kicker" id="k-contact"></p><h2 class="sec-title" id="l-contact"></h2></div>
    </div>
    <div class="contact-grid">
      <div class="contact-intro">
        <p id="contact-blurb"></p>
        <div class="contact-list" id="contact-list"></div>
      </div>
      <form class="contact-form" id="cf">
        <input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true" />
        <label for="cf-name" id="lb-name"></label>
        <input type="text" name="name" id="cf-name" required />
        <label for="cf-email" id="lb-email"></label>
        <input type="email" name="email" id="cf-email" required />
        <label for="cf-msg" id="lb-msg"></label>
        <textarea name="message" id="cf-msg" required></textarea>
        <button type="submit" class="btn btn-primary" id="cf-send"></button>
        <p id="cf-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div></section>

  <!-- FOOTER -->
  <footer><div class="container fwrap">
    <div class="frow">
      <div>
        <a class="brand" href="#top">
          <svg class="brand-leaf" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M29 3C13 4 5 12 4 25c-.3 4 5.4 5.3 8.6 3.2C21.6 22.4 26 13.4 29 3z"/></svg>
          <span id="foot-brand">CaiJiechao</span>
        </a>
        <p class="fdesc" id="foot-desc"></p>
      </div>
      <div class="fsocial" id="foot-social"></div>
    </div>
    <div class="fbottom">
      <a id="foot-icp" target="_blank" rel="noopener"></a>
      <a id="foot-admin" href="/admin.html"></a>
    </div>
  </div></footer>

  <script>window.THEME_ID = "17-organic";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";
    const LEAF = '<svg class="lf" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M29 3C13 4 5 12 4 25c-.3 4 5.4 5.3 8.6 3.2C21.6 22.4 26 13.4 29 3z"/></svg>';

    function renderStatic(){
      document.title = "Cai Jiechao — Organic";
      // nav
      document.getElementById('nav').innerHTML = [
        ['about','nav_about'],['courses','nav_courses'],['projects','nav_portfolio'],
        ['articles','nav_article'],['certificates','nav_certificate'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');

      // hero
      document.getElementById('greet').textContent = t(P.greeting);
      document.getElementById('name').textContent = t(P.name);
      document.getElementById('headline').textContent = t(P.headline);
      document.getElementById('roleline').innerHTML = `<b>${esc(t(P.role))}</b> · ${esc(t(P.title))}`;
      document.getElementById('loc-pill').textContent = t(P.location);
      document.getElementById('role-pill').textContent = t(P.role);
      document.getElementById('cv-label').textContent = t(P.ui.download_cv);
      const cv = document.getElementById('cvBtn'); cv.href = t(P.cv);
      document.getElementById('ghBtn').href = P.contact.github;
      { const hp = document.getElementById('hero-photo'); hp.src = P.avatar; hp.alt = t(P.name); }

      // section kickers + titles
      const setHead = (kId,lId,kicker,title)=>{
        document.getElementById(kId).textContent = kicker;
        document.getElementById(lId).textContent = title;
      };
      setHead('k-about','l-about', t(P.ui.nav_about), t(P.ui.about_me));
      setHead('k-edu','l-edu', t(P.ui.nav_about), t(P.ui.education_bg));
      setHead('k-skills','l-skills', t(P.ui.tech_stack), t(P.ui.core_tech));
      setHead('k-courses','l-courses', t(P.ui.nav_courses), t(P.ui.core_courses));
      setHead('k-exp','l-exp', t(P.ui.nav_internship), t(P.ui.internship_exp));
      setHead('k-projects','l-projects', t(P.ui.nav_portfolio), t(P.ui.latest_projects));
      setHead('k-articles','l-articles', t(P.ui.nav_article), t(P.ui.latest_articles));
      setHead('k-certs','l-certs', t(P.ui.nav_certificate), t(P.ui.certificates));
      setHead('k-contact','l-contact', t(P.ui.nav_contact), t(P.ui.get_in_touch));

      // about
      const portrait = document.getElementById('portrait');
      portrait.src = P.avatar; portrait.alt = t(P.name) + " — " + t(P.role);
      document.getElementById('loc-badge').textContent = t(P.location);
      document.getElementById('about-text').innerHTML =
        P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('');

      // education
      document.getElementById('edu-list').innerHTML = P.education.map(e=>`
        <div class="edu-card">
          <span class="when">${esc(e.period)}</span>
          <h3>${esc(t(e.school))}</h3>
          <div class="deg">${esc(t(e.degree))}</div>
          <p class="note">${esc(t(e.note))}</p>
        </div>`).join('');

      // skills lines + chips
      document.getElementById('skills-list').innerHTML = P.skills.map(s=>`
        <div class="skill-line">${LEAF}<span>${esc(s)}</span></div>`).join('');
      document.getElementById('chips').innerHTML = P.skillTags.map(s=>`
        <span class="chip">${esc(s)}</span>`).join('');

      // courses
      document.getElementById('courses-list').innerHTML = P.courses.map(c=>`
        <div class="course">
          <div class="ci"><i class="fa ${esc(c.icon)}" aria-hidden="true"></i></div>
          <h4>${esc(t(c.title))}</h4>
          <p>${esc(t(c.desc))}</p>
        </div>`).join('');

      // experience
      document.getElementById('exp-list').innerHTML = P.experience.map(x=>`
        <div class="exp-card">
          <div class="exp-head">
            <h3>${esc(t(x.role))} <span class="co">· ${esc(t(x.company))}</span></h3>
            <span class="when">${esc(x.period)}</span>
          </div>
          <p class="summary">${esc(t(x.summary))}</p>
          <ul class="exp-bullets">
            ${x.bullets.map(b=>`<li>${LEAF}<span>${esc(t(b))}</span></li>`).join('')}
          </ul>
        </div>`).join('');

      // certificates
      document.getElementById('certs-list').innerHTML = P.certificates.map(c=>`
        <div class="cert">
          <img src="${esc(c.image)}" alt="${esc(t(c.title))}" onerror="this.src='/index_page/img/blogs/1.jpg'" />
          <div class="ct">
            <div class="meta"><span class="tag">${esc(t(c.tag))}</span><span class="dt">${esc(t(c.date))}</span></div>
            <h4>${esc(t(c.title))}</h4>
            <p>${esc(t(c.desc))}</p>
          </div>
        </div>`).join('');

      // contact
      document.getElementById('contact-blurb').textContent = t(P.ui.msg_box_title);
      document.getElementById('contact-list').innerHTML = [
        ['fa-envelope','Email', P.contact.email, 'mailto:'+P.contact.email],
        ['fa-phone','Phone', P.contact.phone, P.contact.phoneHref],
        ['fa-github','GitHub', '@'+P.contact.githubUser, P.contact.github],
        ['fa-weixin','WeChat', 'QR Code', P.contact.wechatQrPage],
      ].map(([ic,k,v,h])=>`
        <a href="${esc(h)}" target="_blank" rel="noopener">
          <span class="ico"><i class="fa ${ic}" aria-hidden="true"></i></span>
          <span>${esc(v)}<small>${esc(k)}</small></span>
        </a>`).join('');
      document.getElementById('lb-name').textContent = t(P.ui.name_placeholder);
      document.getElementById('lb-email').textContent = t(P.ui.email_placeholder);
      document.getElementById('lb-msg').textContent = t(P.ui.msg_placeholder);
      document.getElementById('cf-name').placeholder = t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder = t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder = t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent = t(P.ui.send);

      // footer
      document.getElementById('foot-desc').textContent = t(P.ui.footer_desc);
      document.getElementById('foot-social').innerHTML =
        `<a href="${P.contact.github}" target="_blank" rel="noopener"><i class="fa fa-github" aria-hidden="true"></i>GitHub</a>
         <a href="mailto:${P.contact.email}"><i class="fa fa-envelope" aria-hidden="true"></i>Email</a>
         <a href="${P.contact.wechatQrPage}" target="_blank" rel="noopener"><i class="fa fa-weixin" aria-hidden="true"></i>WeChat</a>`;
      const icp = document.getElementById('foot-icp'); icp.textContent = P.icp; icp.href = P.icpUrl;
      document.getElementById('foot-admin').textContent = t(P.ui.admin_panel);

      // filters
      document.getElementById('filters').innerHTML = P.articleFilters.map(f=>
        `<button type="button" data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey = b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box = document.getElementById('projects-list');
      if(!projects.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML = projects.map(p=>`
        <a class="card" href="${esc(p.href)}">
          <div class="cbody">
            <div class="ctag"><span class="cat">${esc(t(P.ui.tech_stack))}</span><span class="date">${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <p class="tech">${esc(p.tech_stack||'')}</p>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div>
        </a>`).join('');
    }

    function renderArticles(){
      const box = document.getElementById('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML = list.map(a=>`
        <a class="card" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${esc(a.localTitle())}"></div>
          <div class="cbody">
            <div class="ctag"><span class="cat">${esc(a.category||'')}</span><span class="date">${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div>
        </a>`).join('');
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML =
        `<div class="load-note">🌱 ${esc(t(P.ui.no_projects))} · Failed to load / 内容加载失败</div>`; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-list').innerHTML =
        `<div class="load-note">🌱 Failed to load articles / 文章加载失败</div>`; }
    }

    // contact submit
    document.getElementById('cf').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      const payload = { name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color = 'var(--ink-soft)'; s.textContent = t(P.ui.sending);
      try{
        const r = await CJCData.sendContact(payload);
        s.style.color = 'var(--green-deep)'; s.textContent = r.message || 'Sent. 🌿'; f.reset();
      }catch(err){
        s.style.color = 'var(--clay-deep)'; s.textContent = err.message;
      }
    });

    // Font Awesome 4.7 for icons
    const fa = document.createElement('link');
    fa.rel = 'stylesheet';
    fa.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css';
    document.head.appendChild(fa);

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:'#6a8d4f' });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

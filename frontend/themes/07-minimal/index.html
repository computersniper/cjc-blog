<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Minimal</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#ffffff; --ink:#000000; --grey:#111111;
      --hair:rgba(0,0,0,.12); --hair-2:rgba(0,0,0,.07);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;background:var(--bg);color:var(--ink);
      font-family:"Inter Tight","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;line-height:1.55;font-size:15px;font-weight:400;
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    .wrap{max-width:1080px;margin:0 auto;padding:0 40px}
    @media(max-width:560px){.wrap{padding:0 22px}}

    .hair{border:0;border-top:1px solid var(--hair);margin:0}
    .label{text-transform:uppercase;letter-spacing:.24em;font-size:10.5px;font-weight:600;color:var(--ink)}
    .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

    /* Topbar — whisper-quiet */
    .topbar{position:sticky;top:0;z-index:800;background:rgba(255,255,255,.85);
      backdrop-filter:blur(8px);border-bottom:1px solid var(--hair)}
    .topbar .row{display:flex;align-items:center;justify-content:space-between;height:60px}
    .brand{font-weight:700;letter-spacing:-.02em;font-size:15px}
    .topbar nav{display:flex;gap:28px}
    .topbar nav a{position:relative;text-transform:uppercase;letter-spacing:.16em;font-size:10.5px;
      font-weight:500;color:var(--ink);padding-bottom:3px}
    .topbar nav a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1px;
      background:var(--ink);transition:width .3s ease}
    .topbar nav a:hover::after{width:100%}
    @media(max-width:820px){.topbar nav{display:none}}

    /* Hero — huge name, everything else tiny */
    .hero{padding:110px 0 70px}
    .hero .eyebrow{display:flex;gap:16px;align-items:center;margin-bottom:34px}
    .hero .eyebrow .label{color:var(--ink)}
    .hero .eyebrow .ln{flex:1;height:1px;background:var(--hair)}
    .hero h1{font-weight:700;font-size:clamp(58px,15.5vw,190px);line-height:.9;letter-spacing:-.055em;
      margin:0}
    .hero .deck{max-width:640px;margin:40px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:22px 48px}
    .hero .deck .k{text-transform:uppercase;letter-spacing:.2em;font-size:10px;font-weight:600;
      color:#888;margin-bottom:8px}
    .hero .deck .v{font-size:16px;font-weight:500;letter-spacing:-.01em}
    .hero .actions{display:flex;flex-wrap:wrap;gap:26px;margin-top:44px}
    .link{position:relative;font-size:13px;font-weight:600;text-transform:uppercase;
      letter-spacing:.14em;padding-bottom:4px}
    .link::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:1px;
      background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .3s ease}
    .link:hover::after{transform:scaleX(1)}
    .link.filled{color:var(--bg);background:var(--ink);padding:12px 22px;letter-spacing:.1em}
    .link.filled::after{display:none}
    .link.filled:hover{opacity:.82}
    @media(max-width:560px){.hero .deck{grid-template-columns:1fr}}

    /* Section frame */
    section{padding:70px 0}
    .sec-head{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:baseline;
      padding-bottom:22px;border-bottom:1px solid var(--ink);margin-bottom:8px}
    .sec-head .sn{font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;color:#999}
    .sec-head h2{margin:0;font-size:clamp(18px,2.4vw,24px);font-weight:600;letter-spacing:-.01em}
    .sec-head .meta{margin-left:auto;text-transform:uppercase;letter-spacing:.2em;font-size:10px;
      font-weight:600;color:#999}

    /* Index rows — the signature numbered list */
    .index-row{display:grid;grid-template-columns:56px 200px 1fr auto;gap:24px;align-items:baseline;
      padding:26px 4px;border-bottom:1px solid var(--hair);transition:padding .25s ease}
    .index-row:hover{padding-left:14px}
    .index-row .rn{font-variant-numeric:tabular-nums;font-size:12px;font-weight:500;color:#aaa}
    .index-row .when{font-variant-numeric:tabular-nums;font-size:13px;color:#666;letter-spacing:.02em}
    .index-row h3{margin:0 0 5px;font-size:19px;font-weight:600;letter-spacing:-.01em}
    .index-row .sub{color:#666;font-size:14px}
    .index-row .body{color:#444;font-size:14px;margin-top:8px;max-width:60ch}
    .index-row ul{margin:10px 0 0;padding:0;list-style:none}
    .index-row ul li{padding:5px 0 5px 18px;position:relative;color:#444;font-size:14px;max-width:64ch}
    .index-row ul li::before{content:"—";position:absolute;left:0;color:#aaa}
    .index-row .tail{text-align:right;font-size:12px;color:#999;white-space:nowrap}
    @media(max-width:720px){.index-row{grid-template-columns:40px 1fr;gap:6px 16px}
      .index-row .when{grid-column:2}.index-row .tail{display:none}}

    /* About */
    .about{display:grid;grid-template-columns:1fr 300px;gap:60px;align-items:start}
    .about p{margin:0 0 22px;font-size:17px;line-height:1.75;letter-spacing:-.01em;max-width:56ch;font-weight:400}
    .about .loc{text-transform:uppercase;letter-spacing:.18em;font-size:11px;font-weight:600;color:#888}
    .about figure{margin:0}
    .about img{width:100%;aspect-ratio:4/5;object-fit:cover}
    .about figcaption{margin-top:12px;text-transform:uppercase;letter-spacing:.16em;font-size:10px;
      color:#999}
    @media(max-width:760px){.about{grid-template-columns:1fr}.about figure{max-width:280px;order:-1}}

    /* Skills — quiet inline list */
    .skills{display:grid;grid-template-columns:1fr 1fr;gap:0 60px}
    .skills .sk{display:grid;grid-template-columns:56px 1fr;gap:24px;padding:16px 0;
      border-bottom:1px solid var(--hair);font-size:15px}
    .skills .sk .rn{font-variant-numeric:tabular-nums;font-size:12px;color:#aaa}
    .tagrow{margin-top:30px;display:flex;flex-wrap:wrap;gap:0}
    .tagrow span{font-size:13px;color:#555;letter-spacing:.01em}
    .tagrow span::after{content:"/";margin:0 12px;color:#ccc}
    .tagrow span:last-child::after{content:""}
    @media(max-width:640px){.skills{grid-template-columns:1fr}}

    /* Courses — numbered index */
    .courses{border-top:1px solid var(--ink)}
    .course{display:grid;grid-template-columns:56px 1fr;gap:24px;padding:28px 4px;
      border-bottom:1px solid var(--hair);transition:padding .25s ease}
    .course:hover{padding-left:14px}
    .course .rn{font-variant-numeric:tabular-nums;font-size:12px;color:#aaa}
    .course h4{margin:0 0 8px;font-size:19px;font-weight:600;letter-spacing:-.01em}
    .course p{margin:0;color:#555;font-size:14.5px;line-height:1.65;max-width:70ch}
    .course .ci{display:none}

    /* Filters */
    .filters{display:flex;flex-wrap:wrap;gap:22px;margin:24px 0 6px}
    .filters button{background:none;border:0;font-family:inherit;cursor:pointer;
      text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:600;color:#aaa;
      padding-bottom:4px;position:relative;transition:color .2s}
    .filters button::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:1px;
      background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .3s ease}
    .filters button:hover{color:var(--ink)}
    .filters button:hover::after,.filters button.active::after{transform:scaleX(1)}
    .filters button.active{color:var(--ink)}

    /* Projects / articles as index rows */
    .list.index{border-top:1px solid var(--ink)}
    .item{display:grid;grid-template-columns:56px 1fr auto;gap:24px;align-items:baseline;
      padding:26px 4px;border-bottom:1px solid var(--hair);transition:padding .25s ease}
    .item:hover{padding-left:14px}
    .item .rn{font-variant-numeric:tabular-nums;font-size:12px;color:#aaa}
    .item h4{margin:0 0 6px;font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
    .item .sub{color:#555;font-size:14.5px;max-width:70ch;line-height:1.6}
    .item .kv{text-transform:uppercase;letter-spacing:.14em;font-size:10px;font-weight:600;color:#999;margin-bottom:10px}
    .item .tail{text-align:right;font-size:12px;color:#999;white-space:nowrap}
    .item .tail .cat{display:block;text-transform:uppercase;letter-spacing:.12em;font-weight:600;color:#555}
    .item .tail .arrow{display:inline-block;margin-top:10px;font-size:16px;transition:transform .25s ease}
    .item:hover .tail .arrow{transform:translateX(5px)}
    @media(max-width:640px){.item{grid-template-columns:36px 1fr}.item .tail{grid-column:2;text-align:left}
      .item .tail .arrow{display:none}}

    /* Certificates */
    .certs{border-top:1px solid var(--ink)}
    .cert{display:grid;grid-template-columns:56px 90px 1fr auto;gap:24px;align-items:start;
      padding:28px 4px;border-bottom:1px solid var(--hair);transition:padding .25s ease}
    .cert:hover{padding-left:14px}
    .cert .rn{font-variant-numeric:tabular-nums;font-size:12px;color:#aaa}
    .cert img{width:90px;aspect-ratio:3/4;object-fit:cover}
    .cert h4{margin:0 0 6px;font-size:18px;font-weight:600;letter-spacing:-.01em}
    .cert p{margin:0;color:#555;font-size:14px;line-height:1.6;max-width:60ch}
    .cert .tail{text-align:right;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#999;white-space:nowrap}
    @media(max-width:640px){.cert{grid-template-columns:36px 70px 1fr}.cert img{width:70px}.cert .tail{display:none}}

    /* Contact */
    .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px}
    .contact-info .lead{font-size:19px;font-weight:400;letter-spacing:-.01em;line-height:1.6;
      margin:0 0 28px;max-width:40ch}
    .contact-info a{display:grid;grid-template-columns:auto 1fr;gap:20px;padding:16px 0;
      border-top:1px solid var(--hair);align-items:baseline}
    .contact-info a .k{text-transform:uppercase;letter-spacing:.16em;font-size:10.5px;font-weight:600;color:#999}
    .contact-info a .v{position:relative;justify-self:end;font-size:15px;font-weight:500}
    .contact-info a .v::after{content:"";position:absolute;left:0;bottom:-2px;width:100%;height:1px;
      background:var(--ink);transform:scaleX(0);transform-origin:right;transition:transform .3s ease}
    .contact-info a:hover .v::after{transform:scaleX(1);transform-origin:left}
    form label{display:block;text-transform:uppercase;letter-spacing:.18em;font-size:10px;
      font-weight:600;color:#999;margin:0 0 8px}
    form input,form textarea{width:100%;background:none;border:0;border-bottom:1px solid var(--ink);
      font-family:inherit;font-size:16px;padding:8px 0;margin-bottom:28px;color:var(--ink)}
    form input:focus,form textarea:focus{outline:none;border-bottom-width:2px}
    form input::placeholder,form textarea::placeholder{color:#bbb}
    form textarea{min-height:90px;resize:vertical}
    form button{background:var(--ink);color:var(--bg);border:0;font-family:inherit;font-weight:600;
      text-transform:uppercase;letter-spacing:.14em;font-size:12px;padding:15px 34px;cursor:pointer;
      transition:opacity .2s}
    form button:hover{opacity:.82}
    #cf-status{margin-top:16px;font-size:14px}
    @media(max-width:760px){.contact-grid{grid-template-columns:1fr;gap:40px}}

    footer{border-top:1px solid var(--ink);padding:44px 0 64px;margin-top:30px}
    footer .frow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:baseline}
    footer .flinks{display:flex;gap:26px;flex-wrap:wrap}
    footer a{position:relative;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;
      color:#666;padding-bottom:3px}
    footer a::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:1px;background:var(--ink);
      transform:scaleX(0);transform-origin:left;transition:transform .3s ease}
    footer a:hover{color:var(--ink)}
    footer a:hover::after{transform:scaleX(1)}
    .muted{color:#999;font-size:11.5px;text-transform:uppercase;letter-spacing:.1em}
    .load-note{color:#999;padding:26px 4px;font-size:14px}

    :focus-visible{outline:2px solid var(--ink);outline-offset:3px}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="wrap row">
      <a class="brand" href="#top" id="brand"></a>
      <nav id="nav"></nav>
    </div>
  </div>

  <div id="top"></div>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow"><span class="label" id="greet"></span><span class="ln"></span><span class="label" id="idx-role"></span></div>
      <h1 id="name"></h1>
      <div class="deck" id="deck"></div>
      <div class="actions">
        <a class="link filled" id="cvBtn" href="#" download></a>
        <a class="link" id="ghBtn" target="_blank" rel="noopener"></a>
        <a class="link" id="emailBtn"></a>
      </div>
    </header>

    <section id="about">
      <div class="sec-head"><span class="sn">01</span><h2 id="l-about"></h2><span class="meta" id="k-about"></span></div>
      <div class="about" style="padding-top:34px">
        <div class="about-text" id="about-text"></div>
        <figure><img id="portrait" alt="" /><figcaption id="portrait-cap"></figcaption></figure>
      </div>
    </section>

    <section id="education">
      <div class="sec-head"><span class="sn">02</span><h2 id="l-edu"></h2></div>
      <div id="edu-list"></div>
    </section>

    <section id="skills">
      <div class="sec-head"><span class="sn">03</span><h2 id="l-skills"></h2></div>
      <div class="skills" id="skills-list" style="padding-top:26px"></div>
      <div class="tagrow" id="skill-tags"></div>
    </section>

    <section id="courses">
      <div class="sec-head"><span class="sn">04</span><h2 id="l-courses"></h2></div>
      <div class="courses" id="courses-list" style="margin-top:26px"></div>
    </section>

    <section id="experience">
      <div class="sec-head"><span class="sn">05</span><h2 id="l-exp"></h2></div>
      <div id="exp-list"></div>
    </section>

    <section id="projects">
      <div class="sec-head"><span class="sn">06</span><h2 id="l-projects"></h2><span class="meta" id="m-proj"></span></div>
      <div class="list index" id="projects-list" style="margin-top:26px"><div class="load-note" id="proj-load"></div></div>
    </section>

    <section id="articles">
      <div class="sec-head"><span class="sn">07</span><h2 id="l-articles"></h2></div>
      <div class="filters" id="filters"></div>
      <div class="list index" id="articles-list"><div class="load-note" id="art-load"></div></div>
    </section>

    <section id="certificates">
      <div class="sec-head"><span class="sn">08</span><h2 id="l-certs"></h2></div>
      <div class="certs" id="certs-list" style="margin-top:26px"></div>
    </section>

    <section id="contact">
      <div class="sec-head"><span class="sn">09</span><h2 id="l-contact"></h2></div>
      <div class="contact-grid" style="padding-top:34px">
        <div class="contact-info" id="contact-info"></div>
        <form id="cf">
          <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none">
          <label for="cf-name" id="lb-name"></label>
          <input type="text" name="name" id="cf-name" required>
          <label for="cf-email" id="lb-email"></label>
          <input type="email" name="email" id="cf-email" required>
          <label for="cf-msg" id="lb-msg"></label>
          <textarea name="message" id="cf-msg" required></textarea>
          <button type="submit" id="cf-send"></button>
          <p id="cf-status"></p>
        </form>
      </div>
    </section>
  </div>

  <footer>
    <div class="wrap">
      <div class="frow">
        <span class="brand" id="foot-brand"></span>
        <div class="flinks" id="foot-social"></div>
      </div>
      <div class="frow" style="margin-top:18px">
        <span class="muted" id="foot-desc"></span>
        <a class="muted" id="foot-icp" target="_blank"></a>
      </div>
    </div>
  </footer>

  <script>window.THEME_ID = "07-minimal";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";
    const pad = n => String(n).padStart(2,'0');

    function renderStatic(){
      const lang = CJCData.lang();
      document.title = (lang==="zh"?"蔡杰超":"Cai Jiechao") + " — Minimal";
      document.getElementById('brand').textContent = t(P.name);
      document.getElementById('foot-brand').textContent = t(P.name);
      document.getElementById('nav').innerHTML = [
        ['about','nav_about'],['courses','nav_courses'],['experience','nav_internship'],
        ['projects','nav_portfolio'],['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');
      // hero
      document.getElementById('greet').textContent = t(P.greeting);
      document.getElementById('idx-role').textContent = t(P.role);
      document.getElementById('name').textContent = t(P.name);
      document.getElementById('deck').innerHTML = [
        [t(P.ui.about_me), t(P.title)],
        [t(P.ui.internship_exp), (lang==="zh"?"AI 平台研发实习生 · Xnew":"AI Platform R&D Intern · Xnew")],
        ['Location', t(P.location)],
        ['Focus', 'Agent / LLM / RAG']
      ].map(([k,v])=>`<div><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('');
      const cv = document.getElementById('cvBtn');
      cv.textContent = t(P.ui.download_cv); cv.href = t(P.cv);
      const gh = document.getElementById('ghBtn');
      gh.textContent = "GitHub ↗"; gh.href = P.contact.github;
      const em = document.getElementById('emailBtn');
      em.textContent = "Email ↗"; em.href = 'mailto:'+P.contact.email;
      // labels
      document.getElementById('l-about').textContent = t(P.ui.about_me);
      document.getElementById('k-about').textContent = t(P.location);
      document.getElementById('l-edu').textContent = t(P.ui.education_bg);
      document.getElementById('l-skills').textContent = t(P.ui.core_tech);
      document.getElementById('l-courses').textContent = t(P.ui.core_courses);
      document.getElementById('l-exp').textContent = t(P.ui.internship_exp);
      document.getElementById('l-projects').textContent = t(P.ui.latest_projects);
      document.getElementById('l-articles').textContent = t(P.ui.latest_articles);
      document.getElementById('l-certs').textContent = t(P.ui.certificates);
      document.getElementById('l-contact').textContent = t(P.ui.get_in_touch);
      // about
      document.getElementById('portrait').src = P.avatar;
      document.getElementById('portrait').alt = t(P.name);
      document.getElementById('portrait-cap').textContent = t(P.name) + " — " + t(P.location);
      document.getElementById('about-text').innerHTML =
        P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('') +
        `<p class="loc">${esc(t(P.location))}</p>`;
      // education
      document.getElementById('edu-list').innerHTML = P.education.map((e,i)=>`
        <div class="index-row"><span class="rn num">${pad(i+1)}</span>
          <span class="when num">${esc(e.period)}</span>
          <div><h3>${esc(t(e.school))}</h3><div class="sub">${esc(t(e.degree))}</div>
          <div class="body">${esc(t(e.note))}</div></div>
          <span class="tail"></span></div>`).join('');
      // skills
      document.getElementById('skills-list').innerHTML = P.skills.map((s,i)=>
        `<div class="sk"><span class="rn num">${pad(i+1)}</span><span>${esc(s)}</span></div>`).join('');
      document.getElementById('skill-tags').innerHTML =
        P.skillTags.map(tg=>`<span>${esc(tg)}</span>`).join('');
      // courses
      document.getElementById('courses-list').innerHTML = P.courses.map((c,i)=>`
        <div class="course"><span class="rn num">${pad(i+1)}</span>
          <div><h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');
      // experience
      document.getElementById('exp-list').innerHTML = P.experience.map((x,i)=>`
        <div class="index-row"><span class="rn num">${pad(i+1)}</span>
          <span class="when num">${esc(x.period)}</span>
          <div><h3>${esc(t(x.role))}</h3><div class="sub">${esc(t(x.company))}</div>
          <div class="body">${esc(t(x.summary))}</div>
          <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div>
          <span class="tail"></span></div>`).join('');
      // certificates
      document.getElementById('certs-list').innerHTML = P.certificates.map((c,i)=>`
        <div class="cert"><span class="rn num">${pad(i+1)}</span>
          <img src="${esc(c.image)}" alt="${esc(t(c.title))}">
          <div><h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>
          <div class="tail">${esc(t(c.tag))}<br>${esc(t(c.date))}</div></div>`).join('');
      // contact
      document.getElementById('contact-info').innerHTML =
        `<p class="lead">${esc(t(P.ui.msg_box_title))}</p>` +
        [['Email', P.contact.email, 'mailto:'+P.contact.email],
         ['Phone', P.contact.phone, P.contact.phoneHref],
         ['GitHub', '@'+P.contact.githubUser, P.contact.github],
         ['WeChat', 'QR ↗', P.contact.wechatQrPage]
        ].map(([k,v,h])=>`<a href="${esc(h)}"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></a>`).join('');
      document.getElementById('lb-name').textContent = t(P.ui.name_placeholder);
      document.getElementById('lb-email').textContent = t(P.ui.email_placeholder);
      document.getElementById('lb-msg').textContent = t(P.ui.msg_placeholder);
      document.getElementById('cf-name').placeholder = t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder = t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder = t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent = t(P.ui.send);
      // footer
      document.getElementById('foot-social').innerHTML =
        `<a href="${P.contact.github}" target="_blank" rel="noopener">GitHub</a>
         <a href="mailto:${P.contact.email}">Email</a>
         <a href="${P.contact.wechatQrPage}">WeChat</a>
         <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent = t(P.ui.footer_desc);
      const icp = document.getElementById('foot-icp'); icp.textContent = P.icp; icp.href = P.icpUrl;
      // filters
      document.getElementById('filters').innerHTML = P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box = document.getElementById('projects-list');
      document.getElementById('m-proj').textContent = projects.length ? pad(projects.length)+" total" : "";
      if(!projects.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML = projects.map((p,i)=>`
        <a class="item" href="${esc(p.href)}">
          <span class="rn num">${pad(i+1)}</span>
          <div><div class="kv">${esc(p.tech_stack||t(P.ui.tech_stack))}</div>
            <h4>${esc(p.localTitle())}</h4>
            <div class="sub">${esc(p.localSummary()||'')}</div></div>
          <div class="tail"><span class="cat">${esc(t(P.ui.view_project))}</span>${esc(p.dateText())}
            <span class="arrow">→</span></div></a>`).join('');
    }

    function renderArticles(){
      const box = document.getElementById('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML = list.map((a,i)=>`
        <a class="item" href="${esc(a.href)}">
          <span class="rn num">${pad(i+1)}</span>
          <div><div class="kv">${esc(a.category||'')}</div>
            <h4>${esc(a.localTitle())}</h4>
            <div class="sub">${esc(a.localSummary()||'')}</div></div>
          <div class="tail"><span class="cat">${esc(t(P.ui.read_more))}</span>${esc(a.dateText())}
            <span class="arrow">→</span></div></a>`).join('');
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML = `<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-list').innerHTML = `<div class="load-note">Failed to load articles.</div>`; }
    }

    document.getElementById('cf').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      const payload = { name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color='#999'; s.textContent = t(P.ui.sending);
      try{ const r = await CJCData.sendContact(payload); s.style.color='#000'; s.textContent = r.message||'Sent.'; f.reset(); }
      catch(err){ s.style.color='#000'; s.textContent = err.message; }
    });

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:'#000000' });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

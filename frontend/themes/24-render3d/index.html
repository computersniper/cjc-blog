  <script>
  (()=>{'use strict';const P=CJCData.profile,t=CJCData.t.bind(CJCData),e=CJCData.escapeHtml;let projects=[],articles=[],filter='all';
  const L={en:{nav:[['about','Profile'],['education','Archive'],['skills','Materials'],['work','Objects'],['journal','Notes'],['contact','Contact']],heroA:'Material',heroB:'Space',heroLead:'Software, intelligence and ideas staged with depth, precision and light.',about:'Human specimen',aboutLead:'The maker inside the interface — photographed, documented and present.',skills:'Material index',skillsLead:'Languages, systems and working methods arranged as an active library.',education:'Academic archive',educationLead:'Foundations and future study, recorded as two points on one continuous path.',courses:'Research shelf',coursesLead:'Core disciplines behind reliable software and intelligent systems.',experience:'Production plate',experienceLead:'Hands-on work across applications, data pipelines and model infrastructure.',projects:'Selected objects',projectsLead:'Live project records presented at full scale, with their real imagery and context.',journal:'Field notes',journalLead:'Articles from engineering practice, research and learning in public.',cert:'Proof surfaces',certLead:'Certificates and milestones preserved as translucent records.',contact:'Open channel',contactLead:'For a project, a role or a question worth exploring.',loc:'Current location',view:'Inspect object',read:'Open note',failed:'The material archive is temporarily unavailable.',send:'Send transmission',sending:'Transmitting…',sent:'Transmission received.',name:'Name',email:'Email',message:'Message',cv:'Download CV',github:'GitHub'},zh:{nav:[['about','个人档案'],['education','教育归档'],['skills','材质索引'],['work','精选作品'],['journal','研究笔记'],['contact','联系']],heroA:'材质',heroB:'空间',heroLead:'让软件、智能与想法在真实纵深、精度与光线中陈列。',about:'人物样本',aboutLead:'界面内部的创作者——真实影像、清晰记录、始终在场。',skills:'材质索引',skillsLead:'将语言、系统与工作方法排列成一座持续更新的资料库。',education:'教育归档',educationLead:'基础与未来学习，是同一条连续路径上的两个坐标。',courses:'研究陈列架',coursesLead:'构建可靠软件与智能系统背后的核心学科。',experience:'生产铭牌',experienceLead:'覆盖应用、数据管线与模型基础设施的真实实践。',projects:'精选物件',projectsLead:'以真实影像与语境完整呈现的实时项目记录。',journal:'现场笔记',journalLead:'来自工程实践、研究与公开学习的文章。',cert:'凭证表面',certLead:'以透明记录保存的证书与重要里程碑。',contact:'开放频道',contactLead:'欢迎项目、机会，或一个值得共同探索的问题。',loc:'当前坐标',view:'查看作品',read:'打开笔记',failed:'材质档案暂时无法连接。',send:'发送信息',sending:'正在传输…',sent:'信息已收到。',name:'姓名',email:'邮箱',message:'留言',cv:'下载简历',github:'GitHub'}};
  const l=()=>L[CJCData.lang()];const link=(u,s)=>`<a href="${e(u)}">${e(s)}</a>`;const head=(i,key,title)=>`<div class="section-head reveal"><div class="section-index">MAT ${String(i).padStart(2,'0')} / ${e(title)}</div><h2>${e(title)}</h2><p>${e(l()[key+'Lead'])}</p></div>`;
  function hero(){const x=l(),n=t(P.name).split(' ');return `<section class="hero" id="top"><div class="shell hero-stage"><div class="hero-copy"><div class="serial">CJC OBJECT STUDY / 24</div><h1>${e(x.heroA)}<span>${e(x.heroB)}</span></h1><p class="hero-lead">${e(x.heroLead)} ${e(t(P.headline))}.</p><div class="actions"><a class="button primary" href="${e(t(P.cv))}" download>${e(x.cv)}</a><a class="button" href="${e(P.contact.github)}" target="_blank" rel="noopener">${e(x.github)}</a></div></div><div class="material-object" aria-label="Portrait material composition"><div class="chrome-orbit" aria-hidden="true"></div><figure class="portrait-plane"><img src="${e(P.avatar)}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(t(P.name))}"><figcaption><span>${e(t(P.role))}<br>${e(t(P.location))}</span><span>${e(n[0]||P.brand)} / ${e(n.slice(1).join(' '))}<br>OBJECT 024</span></figcaption></figure><div class="acrylic-sheet" aria-hidden="true"></div><div class="specimen"><strong>${e(t(P.name))}</strong>${e(t(P.title))}</div></div></div></section><div class="material-strip" aria-hidden="true"><div class="strip-track">${Array(2).fill(['Chrome / 01','Acrylic / 02','Frosted glass / 03',t(P.role),t(P.location),'CJC / 24']).flat().map(v=>`<span>${e(v)}</span>`).join('')}</div></div>`}
  function about(){const x=l(),photo=P.photos&&P.photos.city||P.photos&&P.photos.campus||P.avatar;return `<section id="about"><div class="shell">${head(1,'about',x.about)}<div class="about-space"><figure class="about-photo surface reveal"><img loading="lazy" src="${e(photo)}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(t(P.name))}"><figcaption>${e(x.loc)} / ${e(t(P.location))}</figcaption></figure><article class="about-copy surface reveal"><div><div class="eyebrow">PROFILE / HUMAN LAYER</div><p>${e(t(P.bio[0]))}</p><p>${e(t(P.bio[1]))}</p></div><div class="material-caption"><span>${e(t(P.role))}</span><span>${e(P.contact.email)}</span></div></article></div></div></section>`}
  function education(){const x=l();return `<section id="education"><div class="shell">${head(2,'education',x.education)}<div class="edu-rail reveal">${P.education.map((s,i)=>`<article class="edu-record" data-num="${i+1}"><time>${e(s.period)} / RECORD ${String(i+1).padStart(2,'0')}</time><h3>${e(t(s.school))}</h3><p>${e(t(s.degree))}<br>${e(t(s.note))}</p></article>`).join('')}</div></div></section>`}
  function skills(){const x=l();return `<section id="skills"><div class="shell">${head(3,'skills',x.skills)}<div class="skills-console reveal"><div class="skills-intro"><div class="eyebrow">ACTIVE LIBRARY</div><h3>Build<br>Index</h3><p>${e(t(P.ui.core_tech))}</p></div><div class="skill-slats">${P.skillTags.map((s,i)=>`<span>${String(i+1).padStart(2,'0')} / ${e(s)}</span>`).join('')}</div></div></div></section>`}
  function courses(){const x=l();return `<section id="courses"><div class="shell">${head(4,'courses',x.courses)}<div class="course-shelves reveal">${P.courses.map((c,i)=>`<article class="course surface"><div class="course-no">SHELF ${String(i+1).padStart(2,'0')}</div><div><h3>${e(t(c.title))}</h3><p>${e(t(c.desc))}</p></div></article>`).join('')}</div></div></section>`}
  function experience(){const x=l(),v=P.experience[0];return `<section id="experience"><div class="shell">${head(5,'experience',x.experience)}<article class="experience-plate reveal"><div class="exp-meta">PLATE 2601<br>${e(v.period)}<br><br>${e(t(v.company))}</div><div><h3>${e(t(v.role))}</h3><p>${e(t(v.summary))}</p><ul>${v.bullets.map(b=>`<li>${e(t(b))}</li>`).join('')}</ul></div></article></div></section>`}
  function projectView(){const x=l(),body=projects.length?`<div class="gallery reveal">${projects.map((p,i)=>`<a class="project" href="${e(p.href)}"><figure class="project-image"><img loading="lazy" src="${e(p.cover_image||'/index_page/img/blogs/1.jpg')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(p.localTitle())}"></figure><div class="project-copy"><div class="eyebrow">OBJECT ${String(i+1).padStart(2,'0')} / ${e(p.dateText())}</div><h3>${e(p.localTitle())}</h3><p>${e(p.localSummary()||'')}</p><div class="tech">${e(p.tech_stack||t(P.ui.tech_stack))} / ${e(x.view)}</div></div></a>`).join('')}</div>`:`<p class="loading">${e(t(P.ui.loading_projects))}</p>`;return `<section id="work"><div class="shell">${head(6,'projects',x.projects)}${body}</div></section>`}
  function articleView(){const x=l(),list=CJCData.filterArticles(articles,filter),body=!articles.length?`<p class="loading">${e(t(P.ui.loading_articles))}</p>`:!list.length?`<p class="loading">${e(t(P.ui.no_articles))}</p>`:`<div class="article-list reveal">${list.map(a=>`<article class="article"><img loading="lazy" src="${e(a.cover_image||'/index_page/img/blogs/1.jpg')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(a.localTitle())}"><div><h3>${e(a.localTitle())}</h3><p>${e(a.localSummary()||'')}</p></div><div class="article-meta">${e(a.category||'NOTE')}<br>${e(a.dateText())}<br><a href="${e(a.href)}">${e(x.read)} →</a></div></article>`).join('')}</div>`;return `<section id="journal"><div class="shell">${head(7,'journal',x.journal)}<div class="filters" aria-label="Article categories">${P.articleFilters.map(f=>`<button type="button" data-filter="${e(f.key)}" class="${filter===f.key?'active':''}">${e(t(f.label))}</button>`).join('')}</div>${body}</div></section>`}
  function certificates(){const x=l();return `<section id="certificates"><div class="shell">${head(8,'cert',x.cert)}<div class="cert-deck reveal">${P.certificates.map(c=>`<article class="certificate surface"><img loading="lazy" src="${e(c.image)}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(t(c.title))}"><div><div class="eyebrow">${e(t(c.tag))} / ${e(t(c.date))}</div><h3>${e(t(c.title))}</h3><p>${e(t(c.desc))}</p></div></article>`).join('')}</div></div></section>`}
  function contact(){const x=l();return `<section id="contact"><div class="shell">${head(9,'contact',x.contact)}<div class="contact-space"><div class="contact-copy reveal"><div class="eyebrow">CHANNEL / AVAILABLE</div><h3>Start<br>Signal.</h3><p>${e(t(P.ui.inbox_open))}</p><div class="contact-links"><a href="mailto:${e(P.contact.email)}"><span>Email</span><span>${e(P.contact.email)}</span></a><a href="${e(P.contact.phoneHref)}"><span>Phone</span><span>${e(P.contact.phone)}</span></a><a href="${e(P.contact.github)}" target="_blank" rel="noopener"><span>GitHub</span><span>@${e(P.contact.githubUser)}</span></a><a href="${e(P.contact.wechatQrPage)}"><span>WeChat</span><span>Open QR</span></a></div></div><form class="contact-form surface reveal" id="contact-form"><input name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true"><label for="contact-name">${e(x.name)}</label><input id="contact-name" name="name" autocomplete="name" required><label for="contact-email">${e(x.email)}</label><input id="contact-email" type="email" name="email" autocomplete="email" required><label for="contact-message">${e(x.message)}</label><textarea id="contact-message" name="message" required></textarea><button class="button primary" type="submit">${e(x.send)}</button><p id="status" role="status" aria-live="polite"></p></form></div></div></section>`}
  function render(){const x=l();document.documentElement.lang=CJCData.lang()==='zh'?'zh-CN':'en';document.title=`${t(P.name)} — Material Space`;document.getElementById('nav').innerHTML=x.nav.map(v=>`<a href="#${e(v[0])}">${e(v[1])}</a>`).join('');document.getElementById('content').innerHTML=hero()+about()+education()+skills()+courses()+experience()+projectView()+articleView()+certificates()+contact();document.getElementById('footer-note').textContent=t(P.ui.footer_desc);document.getElementById('footer-links').innerHTML=link(P.contact.github,'GitHub')+link('mailto:'+P.contact.email,'Email')+link(P.contact.wechatQrPage,'WeChat')+link('/admin.html',t(P.ui.admin_panel))+link(P.icpUrl,P.icp);wire();observe()}
  function wire(){document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;render()}));const f=document.getElementById('contact-form');if(f)f.addEventListener('submit',async ev=>{ev.preventDefault();const s=document.getElementById('status'),x=l(),btn=f.querySelector('button');btn.disabled=true;s.textContent=x.sending;try{const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});s.textContent=r.message||x.sent;f.reset()}catch(err){s.textContent=err.message||x.failed}finally{btn.disabled=false}})}
  let observer;function observe(){if(matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('.reveal').forEach(n=>n.classList.add('in'));return}if(observer)observer.disconnect();observer=new IntersectionObserver(es=>es.forEach(v=>{if(v.isIntersecting){v.target.classList.add('in');observer.unobserve(v.target)}}),{threshold:.08});document.querySelectorAll('.reveal').forEach(n=>observer.observe(n))}
  function effects(){const connection=navigator.connection||navigator.mozConnection||navigator.webkitConnection,low=(navigator.deviceMemory&&navigator.deviceMemory<=4)||(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4)||(connection&&connection.saveData)||matchMedia('(prefers-reduced-motion: reduce)').matches;if(low){document.documentElement.classList.add('low-fx');return}let frame=0,x=50,y=18;addEventListener('pointermove',ev=>{x=ev.clientX/innerWidth*100;y=ev.clientY/innerHeight*100;if(frame)return;frame=requestAnimationFrame(()=>{document.documentElement.style.setProperty('--lx',x+'%');document.documentElement.style.setProperty('--ly',y+'%');frame=0})},{passive:true})}
  document.addEventListener('DOMContentLoaded',async()=>{CJCData.setTheme(window.THEME_ID);effects();render();CJCData.mountSwitcher({accent:'#516b72'});CJCData.onLang(render);try{[projects,articles]=await Promise.all([CJCData.fetchProjects(),CJCData.fetchArticles()]);render()}catch(err){document.querySelectorAll('.loading').forEach(n=>{n.className='failure';n.textContent=l().failed})}});
  })();
  </script>
</body></html>

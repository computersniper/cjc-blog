<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — 3D Render Studio</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg0:#0e1116; --bg1:#1b2230; --panel:#161c26; --panel2:#1e2836;
      --ink:#eef3f8; --muted:#93a2b5; --teal:#00e0d6; --teal-d:#0aa39c;
      --line:rgba(255,255,255,.08); --chrome1:#2b3646; --chrome2:#131922;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;
      line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;
      background:
        radial-gradient(120% 80% at 50% -10%, #26304180 0%, transparent 55%),
        radial-gradient(90% 60% at 50% 108%, #0b3c3980 0%, transparent 60%),
        linear-gradient(160deg,var(--bg0),var(--bg1));
      background-attachment:fixed;
    }
    /* soft studio floor */
    body::after{
      content:"";position:fixed;left:0;right:0;bottom:0;height:42vh;pointer-events:none;z-index:0;
      background:linear-gradient(180deg,transparent, rgba(0,224,214,.05) 55%, rgba(0,224,214,.10));
      -webkit-mask:linear-gradient(180deg,transparent,#000 60%);mask:linear-gradient(180deg,transparent,#000 60%);
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    .wrap{max-width:1180px;margin:0 auto;padding:0 26px;position:relative;z-index:2}
    section{padding:74px 0;position:relative;z-index:2}
    :focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:4px}

    .kicker{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:600;letter-spacing:.22em;
      text-transform:uppercase;color:var(--teal);margin:0 0 14px}
    .kicker::before{content:"";width:26px;height:1px;background:linear-gradient(90deg,var(--teal),transparent)}
    .sec-title{font-size:clamp(26px,4.2vw,44px);font-weight:700;letter-spacing:-.02em;margin:0 0 8px;line-height:1.05}
    .sec-sub{color:var(--muted);margin:0 0 34px;max-width:60ch}

    /* Extruded / glossy surface — the signature material */
    .obj{
      position:relative;border-radius:18px;
      background:linear-gradient(150deg,var(--panel2),var(--panel) 45%,#121822);
      border:1px solid var(--line);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.10),
        inset 0 -22px 44px rgba(0,0,0,.36),
        0 2px 4px rgba(0,0,0,.5),
        0 26px 48px -18px rgba(0,0,0,.75);
    }
    .obj::before{ /* top gloss highlight */
      content:"";position:absolute;inset:1px 1px auto 1px;height:44%;border-radius:17px 17px 40% 40%;
      background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0));pointer-events:none;
    }

    /* Topbar */
    .topbar{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);
      background:linear-gradient(180deg,rgba(14,17,22,.86),rgba(14,17,22,.35));border-bottom:1px solid var(--line)}
    .topbar .row{display:flex;align-items:center;justify-content:space-between;height:60px;max-width:1180px;margin:0 auto;padding:0 26px}
    .brand{font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
    .brand .cube{width:22px;height:22px;border-radius:6px;
      background:linear-gradient(150deg,var(--teal),#0b7a75);box-shadow:0 0 16px rgba(0,224,214,.6),inset 0 1px 0 rgba(255,255,255,.5)}
    .brand b{color:var(--teal)}
    .nav{display:flex;gap:22px}
    .nav a{font-size:12.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:500}
    .nav a:hover{color:var(--ink)}
    @media(max-width:860px){.nav{display:none}}

    /* Hero */
    .hero{padding:82px 0 40px;position:relative}
    .hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
    .hero h1{font-size:clamp(40px,7vw,78px);line-height:.98;letter-spacing:-.03em;margin:6px 0 0;font-weight:700}
    .hero h1 .em{background:linear-gradient(180deg,#fff,var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
    .hero .head{font-size:clamp(16px,2.4vw,22px);color:var(--muted);margin:20px 0 0;max-width:26ch}
    .hero .meta{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:22px;color:var(--muted);font-size:14px}
    .hero .meta b{color:var(--ink);font-weight:600}
    .btns{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}
    .btn{position:relative;display:inline-flex;align-items:center;gap:9px;padding:14px 24px;border-radius:12px;font-weight:600;font-size:14px;
      background:linear-gradient(180deg,var(--teal),var(--teal-d));color:#04201f;border:none;cursor:pointer;
      box-shadow:0 0 0 1px rgba(0,224,214,.4),0 10px 26px -8px rgba(0,224,214,.7),inset 0 1px 0 rgba(255,255,255,.5);
      transition:transform .18s,box-shadow .18s}
    .btn:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(0,224,214,.5),0 16px 34px -8px rgba(0,224,214,.85),inset 0 1px 0 rgba(255,255,255,.6)}
    .btn.ghost{background:linear-gradient(180deg,var(--panel2),var(--panel));color:var(--ink);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 26px -12px rgba(0,0,0,.8)}
    .btn.ghost:hover{transform:translateY(-2px)}

    /* Hero product plinth (rendered object) */
    .plinth{position:relative;perspective:900px}
    .render-card{padding:26px;border-radius:22px;transform:rotateX(6deg) rotateY(-9deg);transform-style:preserve-3d;
      transition:transform .3s ease}
    .plinth:hover .render-card{transform:rotateX(4deg) rotateY(-5deg)}
    .render-card .avatar-holo{border-radius:16px;overflow:hidden;position:relative;
      box-shadow:0 22px 40px -16px rgba(0,0,0,.85),0 0 0 1px var(--line)}
    .render-card .avatar-holo img{width:100%;height:300px;object-fit:cover;filter:contrast(1.05) saturate(1.05)}
    .render-card .avatar-holo::after{content:"";position:absolute;inset:0;
      background:linear-gradient(120deg,rgba(0,224,214,.16),transparent 40%),linear-gradient(0deg,rgba(14,17,22,.5),transparent 50%);mix-blend-mode:screen}
    .render-card .chip{margin-top:16px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
    .render-card .chip .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal);display:inline-block;margin-right:7px}
    /* reflective floor under plinth */
    .reflect{margin-top:10px;height:70px;border-radius:22px;transform:scaleY(-1);opacity:.28;
      background:linear-gradient(180deg,var(--panel2),transparent);
      -webkit-mask:linear-gradient(180deg,#000,transparent);mask:linear-gradient(180deg,#000,transparent);filter:blur(1px)}
    @media(max-width:860px){.hero-grid{grid-template-columns:1fr;gap:26px}.render-card{transform:none}.reflect{display:none}}

    /* Rows (education / experience) */
    .stack{display:grid;gap:16px}
    .rowcard{padding:22px 24px;display:grid;grid-template-columns:170px 1fr;gap:20px;align-items:start}
    .rowcard .when{color:var(--teal);font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
    .rowcard h3{margin:0 0 5px;font-size:18px;font-weight:600}
    .rowcard .sub{color:var(--muted);font-size:14.5px}
    .rowcard ul{margin:12px 0 0;padding-left:18px;color:var(--muted);font-size:14px;line-height:1.7}
    .rowcard ul li::marker{color:var(--teal)}
    @media(max-width:640px){.rowcard{grid-template-columns:1fr;gap:8px}}

    /* Skills — chrome pills */
    .chips{display:flex;flex-wrap:wrap;gap:12px}
    .chip3d{padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;
      background:linear-gradient(180deg,var(--chrome1),var(--chrome2));border:1px solid var(--line);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 18px -10px rgba(0,0,0,.8);transition:transform .16s,box-shadow .16s}
    .chip3d:hover{transform:translateY(-3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 0 1px rgba(0,224,214,.5),0 14px 26px -12px rgba(0,224,214,.5)}

    /* Courses grid */
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .course{padding:24px;border-radius:16px}
    .course .ci{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:var(--teal);margin-bottom:16px;
      background:linear-gradient(180deg,#12303030,#0b1a1a);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 18px -6px rgba(0,224,214,.6),0 8px 16px -8px rgba(0,0,0,.8)}
    .course h4{margin:0 0 8px;font-size:16.5px;font-weight:600;line-height:1.25}
    .course p{margin:0;color:var(--muted);font-size:13.6px;line-height:1.6}
    @media(max-width:860px){.grid3{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.grid3{grid-template-columns:1fr}}

    /* Cards (projects/articles) */
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;perspective:1400px}
    .card{border-radius:16px;overflow:hidden;display:flex;flex-direction:column;color:inherit;
      transform-style:preserve-3d;transition:transform .22s ease,box-shadow .22s ease}
    .card:hover{transform:translateY(-6px) rotateX(3deg);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),
      0 0 0 1px rgba(0,224,214,.35),0 34px 54px -22px rgba(0,224,214,.4),0 30px 50px -20px rgba(0,0,0,.85)}
    .card .cover{height:172px;overflow:hidden;position:relative;background:#0d131b}
    .card .cover img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
    .card:hover .cover img{transform:scale(1.06)}
    .card .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(14,17,22,.7),transparent 55%)}
    .card .cbody{padding:18px;display:flex;flex-direction:column;gap:9px;flex:1}
    .card .ctag{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
    .card h4{margin:0;font-size:17px;font-weight:600;line-height:1.25}
    .card p{margin:0;color:var(--muted);font-size:13.6px;line-height:1.55;flex:1}
    .card .tech{color:var(--teal);font-size:12.5px;font-weight:500}
    .card .more{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
    @media(max-width:860px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.cards{grid-template-columns:1fr}}

    .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
    .filters button{background:linear-gradient(180deg,var(--panel2),var(--panel));color:var(--muted);border:1px solid var(--line);
      font-family:inherit;font-weight:600;font-size:12.5px;letter-spacing:.04em;padding:9px 16px;border-radius:10px;cursor:pointer;transition:.16s;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
    .filters button:hover{color:var(--ink);transform:translateY(-1px)}
    .filters button.active{background:linear-gradient(180deg,var(--teal),var(--teal-d));color:#04201f;border-color:transparent;
      box-shadow:0 8px 20px -8px rgba(0,224,214,.7)}

    /* Certificates */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    .cert{border-radius:16px;overflow:hidden;display:grid;grid-template-columns:132px 1fr}
    .cert img{height:100%;width:100%;object-fit:cover}
    .cert .ct{padding:20px}
    .cert .meta{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--teal)}
    .cert h4{margin:10px 0 7px;font-size:16.5px;font-weight:600}
    .cert p{margin:0;color:var(--muted);font-size:13.4px;line-height:1.55}
    @media(max-width:640px){.certs{grid-template-columns:1fr}.cert{grid-template-columns:96px 1fr}}

    /* Contact */
    .contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:26px}
    .cinfo{padding:26px}
    .cinfo a{display:flex;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line);color:var(--ink);font-weight:500;font-size:14.5px}
    .cinfo a:first-of-type{border-top:none}
    .cinfo a span:last-child{color:var(--teal)}
    form.cform{padding:26px}
    .cform input,.cform textarea{width:100%;background:#0e141d;border:1px solid var(--line);border-radius:11px;
      font-family:inherit;font-size:14.5px;padding:14px;margin-bottom:14px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
    .cform input:focus,.cform textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,224,214,.18)}
    .cform textarea{min-height:130px;resize:vertical}
    #cf-status{margin:8px 0 0;font-weight:600;font-size:14px}
    @media(max-width:820px){.contact-grid{grid-template-columns:1fr}}

    footer{border-top:1px solid var(--line);padding:44px 0 60px;position:relative;z-index:2}
    .frow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center}
    footer a{color:var(--muted);font-weight:500;font-size:13.5px}
    footer a:hover{color:var(--teal)}
    .muted{color:var(--muted);font-size:12.5px}
    .load-note{color:var(--muted);font-size:14px;grid-column:1/-1;padding:20px 0}

    @media (prefers-reduced-motion: reduce){
      html{scroll-behavior:auto}
      *{transition:none !important;animation:none !important}
      .render-card{transform:none}
      .card:hover{transform:translateY(-4px)}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="row">
      <a class="brand" href="#top"><span class="cube" aria-hidden="true"></span>Cai<b>Jiechao</b></a>
      <nav class="nav" id="nav" aria-label="Primary"></nav>
    </div>
  </div>

  <div id="top"></div>
  <header class="hero"><div class="wrap">
    <div class="hero-grid">
      <div>
        <p class="kicker" id="greet"></p>
        <h1 id="name"></h1>
        <p class="head" id="headline"></p>
        <div class="meta" id="meta"></div>
        <div class="btns">
          <a class="btn" id="cvBtn" href="#" download></a>
          <a class="btn ghost" id="ghBtn" target="_blank" rel="noopener"></a>
        </div>
      </div>
      <div class="plinth">
        <div class="render-card obj">
          <div class="avatar-holo"><img id="portrait" alt="" /></div>
          <div class="chip"><span><span class="dot" aria-hidden="true"></span><span id="role-chip"></span></span><span id="loc-chip"></span></div>
        </div>
        <div class="reflect obj" aria-hidden="true"></div>
      </div>
    </div>
  </div></header>

  <section id="about"><div class="wrap">
    <p class="kicker" id="k-about"></p>
    <h2 class="sec-title" id="l-about"></h2>
    <div class="obj" style="padding:28px;max-width:900px" id="about-text"></div>
  </div></section>

  <section id="education"><div class="wrap">
    <p class="kicker" id="k-edu"></p>
    <h2 class="sec-title" id="l-edu"></h2>
    <div class="stack" id="edu-list"></div>
  </div></section>

  <section id="skills"><div class="wrap">
    <p class="kicker" id="k-skills"></p>
    <h2 class="sec-title" id="l-skills"></h2>
    <div class="chips" id="skills-list"></div>
  </div></section>

  <section id="courses"><div class="wrap">
    <p class="kicker" id="k-courses"></p>
    <h2 class="sec-title" id="l-courses"></h2>
    <div class="grid3" id="courses-list"></div>
  </div></section>

  <section id="experience"><div class="wrap">
    <p class="kicker" id="k-exp"></p>
    <h2 class="sec-title" id="l-exp"></h2>
    <div class="stack" id="exp-list"></div>
  </div></section>

  <section id="projects"><div class="wrap">
    <p class="kicker" id="k-proj"></p>
    <h2 class="sec-title" id="l-projects"></h2>
    <div class="cards" id="projects-list"><div class="load-note" id="proj-load"></div></div>
  </div></section>

  <section id="articles"><div class="wrap">
    <p class="kicker" id="k-art"></p>
    <h2 class="sec-title" id="l-articles"></h2>
    <div class="filters" id="filters"></div>
    <div class="cards" id="articles-list"><div class="load-note" id="art-load"></div></div>
  </div></section>

  <section id="certificates"><div class="wrap">
    <p class="kicker" id="k-certs"></p>
    <h2 class="sec-title" id="l-certs"></h2>
    <div class="certs" id="certs-list"></div>
  </div></section>

  <section id="contact"><div class="wrap">
    <p class="kicker" id="k-contact"></p>
    <h2 class="sec-title" id="l-contact"></h2>
    <p class="sec-sub" id="contact-sub"></p>
    <div class="contact-grid">
      <div class="cinfo obj" id="contact-info"></div>
      <form class="cform obj" id="cf">
        <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
        <input type="text" name="name" id="cf-name" required>
        <input type="email" name="email" id="cf-email" required>
        <textarea name="message" id="cf-msg" required></textarea>
        <button type="submit" class="btn" id="cf-send"></button>
        <p id="cf-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div></section>

  <footer><div class="wrap">
    <div class="frow">
      <a class="brand" href="#top" style="font-size:16px"><span class="cube" aria-hidden="true"></span>Cai<b>Jiechao</b></a>
      <div class="frow" id="foot-social" style="gap:20px"></div>
    </div>
    <div class="frow" style="margin-top:18px">
      <span class="muted" id="foot-desc"></span>
      <a class="muted" id="foot-icp" target="_blank" rel="noopener"></a>
    </div>
  </div></footer>

  <script>window.THEME_ID = "24-render3d";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";

    function renderStatic(){
      document.title = (CJCData.lang()==="zh"?"蔡杰超":"Cai Jiechao") + " — 3D Render Studio";
      document.getElementById('nav').innerHTML = [
        ['about','nav_about'],['courses','nav_courses'],['projects','nav_portfolio'],
        ['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');

      document.getElementById('greet').textContent = t(P.greeting);
      document.getElementById('name').innerHTML = `<span class="em">${esc(t(P.name))}</span>`;
      document.getElementById('headline').textContent = t(P.headline);
      document.getElementById('meta').innerHTML =
        `<span><b>${esc(t(P.role))}</b></span><span>${esc(t(P.title))}</span><span>📍 <b>${esc(t(P.location))}</b></span>`;
      const cv = document.getElementById('cvBtn'); cv.textContent = t(P.ui.download_cv); cv.href = t(P.cv);
      const gh = document.getElementById('ghBtn'); gh.textContent = "GitHub ↗"; gh.href = P.contact.github;

      document.getElementById('portrait').src = P.avatar;
      document.getElementById('portrait').alt = t(P.name);
      document.getElementById('role-chip').textContent = t(P.role);
      document.getElementById('loc-chip').textContent = t(P.location);

      // kickers + titles
      const kick = { about:'about_me', edu:'education_bg', skills:'core_tech', courses:'core_courses',
        exp:'internship_exp', proj:'latest_projects', art:'latest_articles', certs:'certificates', contact:'get_in_touch' };
      const RENDER = { en:"RENDER", zh:"渲染" };
      Object.keys(kick).forEach(k=>{ document.getElementById('k-'+k).textContent = t(RENDER); });
      document.getElementById('l-about').textContent = t(P.ui.about_me);
      document.getElementById('l-edu').textContent = t(P.ui.education_bg);
      document.getElementById('l-skills').textContent = t(P.ui.core_tech);
      document.getElementById('l-courses').textContent = t(P.ui.core_courses);
      document.getElementById('l-exp').textContent = t(P.ui.internship_exp);
      document.getElementById('l-projects').textContent = t(P.ui.latest_projects);
      document.getElementById('l-articles').textContent = t(P.ui.latest_articles);
      document.getElementById('l-certs').textContent = t(P.ui.certificates);
      document.getElementById('l-contact').textContent = t(P.ui.get_in_touch);
      document.getElementById('contact-sub').textContent = t(P.ui.msg_box_title);

      document.getElementById('about-text').innerHTML =
        P.bio.map(b=>`<p style="margin:0 0 14px;color:#cdd9e6;font-size:15.5px;line-height:1.7">${esc(t(b))}</p>`).join('') +
        `<p style="margin:0;color:var(--teal);font-weight:600">📍 ${esc(t(P.location))}</p>`;

      document.getElementById('edu-list').innerHTML = P.education.map(e=>`
        <div class="rowcard obj"><div class="when">${esc(e.period)}</div>
        <div><h3>${esc(t(e.school))}</h3><div class="sub">${esc(t(e.degree))} · ${esc(t(e.note))}</div></div></div>`).join('');

      document.getElementById('skills-list').innerHTML =
        P.skillTags.map(s=>`<span class="chip3d">${esc(s)}</span>`).join('');

      document.getElementById('courses-list').innerHTML = P.courses.map(c=>`
        <div class="course obj"><div class="ci"><i class="fa ${esc(c.icon)}" aria-hidden="true"></i></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');

      document.getElementById('exp-list').innerHTML = P.experience.map(x=>`
        <div class="rowcard obj"><div class="when">${esc(x.period)}</div>
        <div><h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3>
        <div class="sub">${esc(t(x.summary))}</div>
        <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div></div>`).join('');

      document.getElementById('certs-list').innerHTML = P.certificates.map(c=>`
        <div class="cert obj"><img src="${esc(c.image)}" alt="${esc(t(c.title))}" onerror="this.src='/index_page/img/blogs/1.jpg'">
        <div class="ct"><div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');

      document.getElementById('contact-info').innerHTML = [
        ['Email', P.contact.email, 'mailto:'+P.contact.email],
        ['Phone', P.contact.phone, P.contact.phoneHref],
        ['GitHub', '@'+P.contact.githubUser, P.contact.github],
        ['WeChat', 'QR ↗', P.contact.wechatQrPage],
      ].map(([k,v,h])=>`<a href="${esc(h)}"><span>${esc(k)}</span><span>${esc(v)}</span></a>`).join('');
      document.getElementById('cf-name').placeholder = t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder = t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder = t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent = t(P.ui.send);

      document.getElementById('foot-social').innerHTML =
        `<a href="${P.contact.github}" target="_blank" rel="noopener">GitHub</a>
         <a href="mailto:${P.contact.email}">Email</a>
         <a href="${P.contact.wechatQrPage}">WeChat</a>
         <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent = t(P.ui.footer_desc);
      const icp = document.getElementById('foot-icp'); icp.textContent = P.icp; icp.href = P.icpUrl;

      document.getElementById('filters').innerHTML = P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box = document.getElementById('projects-list');
      if(!projects.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML = projects.map(p=>`
        <a class="card obj" href="${esc(p.href)}">
          <div class="cbody">
            <div class="ctag"><span>${esc(t(P.ui.tech_stack))}</span><span>${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <p class="tech">${esc(p.tech_stack||'')}</p>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div></a>`).join('');
    }

    function renderArticles(){
      const box = document.getElementById('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML = list.map(a=>`
        <a class="card obj" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${esc(a.localTitle())}"></div>
          <div class="cbody">
            <div class="ctag"><span>${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div></a>`).join('');
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML = `<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-list').innerHTML = `<div class="load-note">⚠ 内容加载失败 / Failed to load.</div>`; }
    }

    document.getElementById('cf').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      const payload = { name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color='var(--muted)'; s.textContent = t(P.ui.sending);
      try{ const r = await CJCData.sendContact(payload); s.style.color='var(--teal)'; s.textContent = r.message||'Sent.'; f.reset(); }
      catch(err){ s.style.color='#ff6b6b'; s.textContent = err.message; }
    });

    const fa = document.createElement('link');
    fa.rel='stylesheet'; fa.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css';
    document.head.appendChild(fa);

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:'#00e0d6' });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Deco</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{
      --em0:#08302400; --emd:#062a1f; --em1:#0b3d2e; --em2:#125c46; --em3:#0e4a37;
      --gold:#d4af37; --gold-hi:#f0d98a; --gold-dim:#a9862a;
      --cream:#f4ecd6; --paper:#efe6cd; --dim:#bcd0c3;
      --line:rgba(212,175,55,.5); --line-soft:rgba(212,175,55,.22);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;color:var(--cream);
      background:linear-gradient(165deg,#062a1f 0%,#0b3d2e 42%,#125c46 100%);
      background-attachment:fixed;
      font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;line-height:1.65;
      -webkit-font-smoothing:antialiased;overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    ::selection{background:rgba(212,175,55,.35);color:#06231a}
    .wrap{max-width:1120px;margin:0 auto;padding:0 40px}
    @media(max-width:600px){.wrap{padding:0 20px}}

    .deco-font{font-family:'Poiret One',sans-serif}
    .cinzel{font-family:'Cinzel',serif}
    .label{font-family:'Cinzel',serif;text-transform:uppercase;letter-spacing:.34em;font-size:12px;color:var(--gold)}

    /* sunburst / fan divider */
    .sunburst{width:100%;height:70px;margin:8px 0;
      display:flex;align-items:center;justify-content:center}
    .sunburst .fan{width:180px;height:60px;position:relative;
      background:
        repeating-conic-gradient(from 90deg at 50% 100%,
          var(--gold) 0deg 3deg, transparent 3deg 15deg);
      -webkit-mask:radial-gradient(120px 120px at 50% 100%, #000 62%, transparent 63%);
              mask:radial-gradient(120px 120px at 50% 100%, #000 62%, transparent 63%);
      opacity:.85}
    .sunburst::before,.sunburst::after{content:"";height:1px;flex:1;max-width:280px;
      background:linear-gradient(90deg,transparent,var(--line))}
    .sunburst::after{background:linear-gradient(90deg,var(--line),transparent)}

    /* deco stepped frame */
    .frame-deco{position:relative;border:2px solid var(--line);padding:64px 48px}
    .frame-deco::before{content:"";position:absolute;inset:8px;border:1px solid var(--line-soft);pointer-events:none}
    .corner{position:absolute;width:26px;height:26px;border:2px solid var(--gold)}
    .corner.tl{top:-2px;left:-2px;border-right:0;border-bottom:0}
    .corner.tr{top:-2px;right:-2px;border-left:0;border-bottom:0}
    .corner.bl{bottom:-2px;left:-2px;border-right:0;border-top:0}
    .corner.br{bottom:-2px;right:-2px;border-left:0;border-top:0}
    @media(max-width:600px){.frame-deco{padding:44px 22px}}

    /* topbar */
    .topbar{position:sticky;top:0;z-index:900;text-align:center;
      background:linear-gradient(180deg,rgba(6,42,31,.94),rgba(6,42,31,.55));
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      border-bottom:1px solid var(--line-soft)}
    .topbar .in{display:flex;align-items:center;justify-content:space-between;height:74px}
    .brand{font-family:'Poiret One',sans-serif;font-size:26px;letter-spacing:.28em;color:var(--gold)}
    .nav{display:flex;gap:32px}
    .nav a{font-family:'Cinzel',serif;font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:var(--dim);position:relative}
    .nav a::after{content:"";position:absolute;left:50%;right:50%;bottom:-6px;height:1px;background:var(--gold);transition:.4s}
    .nav a:hover{color:var(--cream)}.nav a:hover::after{left:0;right:0}
    @media(max-width:880px){.nav{display:none}}

    /* section */
    section{padding:96px 0;position:relative}
    .sec-head{text-align:center;margin-bottom:56px}
    .sec-head .label{display:block;margin-bottom:14px}
    .sec-title{font-family:'Poiret One',sans-serif;font-weight:400;
      font-size:clamp(34px,6vw,66px);letter-spacing:.06em;margin:0;color:var(--cream)}
    .chevron-rule{display:flex;justify-content:center;gap:8px;margin-top:18px}
    .chevron-rule i{color:var(--gold);font-size:13px;opacity:.85}

    /* hero */
    .hero{min-height:94vh;display:flex;align-items:center;text-align:center;padding:70px 0}
    .hero-inner{position:relative;width:100%;max-width:900px;margin:0 auto}
    .hero .greet{margin-bottom:24px}
    .hero h1{font-family:'Poiret One',sans-serif;font-size:clamp(52px,13vw,140px);letter-spacing:.08em;
      line-height:1;margin:0;color:var(--gold);
      text-shadow:0 2px 0 var(--gold-dim),0 0 40px rgba(212,175,55,.25)}
    .hero .role{font-family:'Cinzel',serif;font-size:clamp(15px,2.6vw,22px);letter-spacing:.3em;text-transform:uppercase;
      color:var(--cream);margin:26px 0}
    .hero .lede{color:var(--dim);font-size:21px;font-style:italic;max-width:48ch;margin:0 auto 40px}
    .actions{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
    .btn{font-family:'Cinzel',serif;text-transform:uppercase;letter-spacing:.2em;font-size:12px;
      padding:16px 38px;border:2px solid var(--gold);color:var(--gold);position:relative;transition:.4s;
      display:inline-flex;align-items:center;gap:10px;background:transparent}
    .btn:hover{background:var(--gold);color:var(--emd)}
    .btn.solid{background:var(--gold);color:var(--emd)}
    .btn.solid:hover{background:var(--gold-hi);border-color:var(--gold-hi)}

    /* about */
    .about{display:grid;grid-template-columns:0.85fr 1.15fr;gap:60px;align-items:center}
    .portrait-deco{position:relative;padding:16px}
    .portrait-deco::before{content:"";position:absolute;inset:0;
      background:repeating-conic-gradient(from 45deg at 50% 50%,var(--gold) 0 1deg,transparent 1deg 12deg);
      opacity:.10}
    .portrait-deco .inner{position:relative;border:2px solid var(--gold);padding:8px}
    .portrait-deco .inner::after{content:"";position:absolute;inset:8px;border:1px solid var(--line-soft)}
    .portrait-deco img{width:100%;filter:sepia(.25) contrast(1.05) saturate(.9)}
    .about p{color:var(--paper);margin:0 0 20px}
    .about .loc{font-family:'Cinzel',serif;text-transform:uppercase;letter-spacing:.2em;font-size:12px;color:var(--gold)}
    .about .loc i{margin-right:8px}
    @media(max-width:880px){.about{grid-template-columns:1fr;gap:40px}.portrait-deco{max-width:340px;margin:0 auto}}

    /* ledger */
    .ledger{max-width:860px;margin:0 auto}
    .lrow{text-align:center;padding:34px 0;border-top:1px solid var(--line-soft)}
    .lrow:last-child{border-bottom:1px solid var(--line-soft)}
    .lrow .yr{font-family:'Cinzel',serif;letter-spacing:.18em;font-size:13px;color:var(--gold);margin-bottom:8px}
    .lrow h3{font-family:'Poiret One',sans-serif;font-size:28px;letter-spacing:.04em;margin:0 0 6px;color:var(--cream)}
    .lrow .sub{color:var(--dim);font-size:18px}
    .lrow ul{list-style:none;margin:18px auto 0;padding:0;max-width:640px;text-align:left}
    .lrow ul li{position:relative;padding-left:28px;margin-bottom:10px;color:var(--paper);font-size:17px}
    .lrow ul li::before{content:"\25C6";position:absolute;left:4px;top:2px;color:var(--gold);font-size:11px}

    /* skills */
    .skills{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:900px;margin:0 auto}
    .chip{font-family:'Cinzel',serif;letter-spacing:.12em;font-size:12px;text-transform:uppercase;
      padding:12px 24px;border:1px solid var(--line);color:var(--cream);position:relative;transition:.35s;background:rgba(212,175,55,.04)}
    .chip:hover{background:var(--gold);color:var(--emd);transform:translateY(-3px)}

    /* courses */
    .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
    .course{text-align:center;border:1px solid var(--line-soft);padding:38px 26px;position:relative;transition:.4s;background:rgba(255,255,255,.02)}
    .course::before{content:"";position:absolute;inset:6px;border:1px solid transparent;transition:.4s;pointer-events:none}
    .course:hover{border-color:var(--line)}.course:hover::before{border-color:var(--line-soft)}
    .course .ci{width:60px;height:60px;margin:0 auto 20px;border:2px solid var(--gold);
      display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:24px;
      transform:rotate(45deg)}
    .course .ci i{transform:rotate(-45deg)}
    .course h4{font-family:'Poiret One',sans-serif;font-size:22px;letter-spacing:.03em;margin:0 0 12px;color:var(--cream)}
    .course p{color:var(--dim);font-size:16px;margin:0}
    @media(max-width:860px){.courses{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.courses{grid-template-columns:1fr}}

    /* cards */
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
    @media(max-width:860px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.cards{grid-template-columns:1fr}}
    .card{border:1px solid var(--line-soft);background:rgba(6,32,24,.5);display:flex;flex-direction:column;
      transition:.45s;position:relative}
    .card::before,.card::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--gold);opacity:0;transition:.45s}
    .card::before{top:6px;left:6px;border-right:0;border-bottom:0}
    .card::after{bottom:6px;right:6px;border-left:0;border-top:0}
    .card:hover{transform:translateY(-6px);border-color:var(--line)}
    .card:hover::before,.card:hover::after{opacity:1}
    .card .cover{aspect-ratio:16/10;overflow:hidden;background:#05231a;border-bottom:1px solid var(--line-soft)}
    .card .cover img{width:100%;height:100%;object-fit:cover;filter:sepia(.35) saturate(.8) brightness(.9);transition:.6s}
    .card:hover .cover img{filter:sepia(0) saturate(1) brightness(1);transform:scale(1.05)}
    .card .body{padding:26px;display:flex;flex-direction:column;gap:12px;flex:1}
    .card .tag{display:flex;justify-content:space-between;font-family:'Cinzel',serif;text-transform:uppercase;letter-spacing:.14em;font-size:10px;color:var(--gold)}
    .card h4{font-family:'Poiret One',sans-serif;font-size:24px;letter-spacing:.03em;margin:0;color:var(--cream);line-height:1.15}
    .card .stack{color:var(--gold-hi);font-size:14px;font-style:italic}
    .card p{color:var(--dim);font-size:16px;margin:0;flex:1}
    .card .more{font-family:'Cinzel',serif;text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--gold)}

    .filters{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:44px}
    .filters button{font-family:'Cinzel',serif;text-transform:uppercase;letter-spacing:.14em;font-size:11px;
      background:transparent;border:1px solid var(--line-soft);color:var(--dim);padding:10px 22px;cursor:pointer;transition:.35s}
    .filters button:hover{color:var(--cream);border-color:var(--line)}
    .filters button.active{background:var(--gold);color:var(--emd);border-color:var(--gold)}

    /* certs */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:28px;max-width:960px;margin:0 auto}
    .cert{display:grid;grid-template-columns:130px 1fr;border:1px solid var(--line-soft);background:rgba(6,32,24,.5)}
    .cert img{height:100%;width:100%;object-fit:cover;filter:sepia(.3);border-right:1px solid var(--line-soft)}
    .cert .ct{padding:26px}
    .cert .meta{display:flex;justify-content:space-between;font-family:'Cinzel',serif;text-transform:uppercase;letter-spacing:.12em;font-size:10px;color:var(--gold)}
    .cert h4{font-family:'Poiret One',sans-serif;font-size:22px;letter-spacing:.03em;margin:12px 0 8px;color:var(--cream)}
    .cert p{color:var(--dim);font-size:15px;margin:0}
    @media(max-width:640px){.certs{grid-template-columns:1fr}.cert{grid-template-columns:100px 1fr}}

    /* contact */
    .contact{display:grid;grid-template-columns:1fr 1fr;gap:56px;max-width:1000px;margin:0 auto}
    .cinfo .lede{color:var(--dim);font-style:italic;font-size:20px;margin:0 0 32px}
    .cinfo a.row{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-top:1px solid var(--line-soft)}
    .cinfo a.row:last-child{border-bottom:1px solid var(--line-soft)}
    .cinfo a.row .k{font-family:'Cinzel',serif;text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--dim)}
    .cinfo a.row .v{color:var(--cream);font-size:18px;transition:.35s}
    .cinfo a.row:hover .v{color:var(--gold)}
    form input,form textarea{width:100%;background:rgba(212,175,55,.04);border:1px solid var(--line-soft);
      color:var(--cream);font-family:'Cormorant Garamond',serif;font-size:18px;padding:15px;margin-bottom:20px;transition:.35s}
    form input::placeholder,form textarea::placeholder{color:var(--dim);opacity:.7}
    form input:focus,form textarea:focus{outline:none;border-color:var(--gold)}
    form textarea{min-height:118px;resize:vertical}
    form button{width:100%;font-family:'Cinzel',serif;text-transform:uppercase;letter-spacing:.2em;font-size:12px;
      padding:17px;border:2px solid var(--gold);background:var(--gold);color:var(--emd);cursor:pointer;transition:.35s}
    form button:hover{background:var(--gold-hi);border-color:var(--gold-hi)}
    #cf-status{margin-top:14px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:.05em}
    @media(max-width:760px){.contact{grid-template-columns:1fr;gap:44px}}

    footer{border-top:1px solid var(--line-soft);padding:64px 0 56px;text-align:center}
    footer .brand{display:inline-block;margin-bottom:22px}
    footer .fsoc{display:flex;gap:28px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}
    footer .fsoc a{font-family:'Cinzel',serif;text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--dim);transition:.35s}
    footer .fsoc a:hover{color:var(--gold)}
    footer .muted{color:var(--dim);font-size:13px;opacity:.7;margin:6px 0}
    footer .muted a{color:var(--gold-dim)}
    .load-note{grid-column:1/-1;text-align:center;color:var(--dim);font-style:italic;padding:20px}

    .reveal{opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.19,1,.22,1)}
    .reveal.in{opacity:1;transform:none}
    @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
  </style>
</head>
<body>
  <div class="topbar"><div class="wrap in">
    <a class="brand" href="#top">CAIJIECHAO</a>
    <nav class="nav" id="nav"></nav>
  </div></div>

  <div id="top"></div>
  <header class="hero"><div class="wrap"><div class="hero-inner">
    <div class="sunburst"><div class="fan"></div></div>
    <div class="label greet" id="greet"></div>
    <h1 id="name"></h1>
    <div class="role" id="role"></div>
    <p class="lede" id="lede"></p>
    <div class="actions">
      <a class="btn solid" id="cvBtn" href="#" download></a>
      <a class="btn" id="ghBtn" target="_blank" rel="noopener"><i class="fa fa-github"></i><span></span></a>
    </div>
    <div class="sunburst" style="margin-top:44px"><div class="fan" style="transform:rotate(180deg)"></div></div>
  </div></div></header>

  <section id="about"><div class="wrap reveal">
    <div class="sec-head"><span class="label" id="l-about"></span>
      <div class="chevron-rule"><i class="fa fa-chevron-up"></i><i class="fa fa-chevron-up"></i><i class="fa fa-chevron-up"></i></div></div>
    <div class="about">
      <div class="portrait-deco"><div class="inner"><img id="portrait" alt="Portrait of Cai Jiechao"></div></div>
      <div>
        <div id="about-text"></div>
        <div class="loc"><i class="fa fa-map-marker"></i><span id="loc"></span></div>
      </div>
    </div>
  </div></section>

  <div class="sunburst"><div class="fan"></div></div>

  <section id="education"><div class="wrap reveal">
    <div class="sec-head"><span class="label">Academia</span><h2 class="sec-title" id="l-edu"></h2></div>
    <div class="ledger" id="edu-list"></div>
  </div></section>

  <section id="skills"><div class="wrap reveal">
    <div class="sec-head"><span class="label">Métier</span><h2 class="sec-title" id="l-skills"></h2></div>
    <div class="skills" id="skills-list"></div>
  </div></section>

  <div class="sunburst"><div class="fan"></div></div>

  <section id="courses"><div class="wrap reveal">
    <div class="sec-head"><span class="label">Curriculum</span><h2 class="sec-title" id="l-courses"></h2></div>
    <div class="courses" id="courses-list"></div>
  </div></section>

  <section id="experience"><div class="wrap reveal">
    <div class="sec-head"><span class="label">Atelier</span><h2 class="sec-title" id="l-exp"></h2></div>
    <div class="ledger" id="exp-list"></div>
  </div></section>

  <div class="sunburst"><div class="fan"></div></div>

  <section id="projects"><div class="wrap reveal">
    <div class="sec-head"><span class="label">Portfolio</span><h2 class="sec-title" id="l-proj"></h2></div>
    <div class="cards" id="projects-list"><div class="load-note" id="proj-load"></div></div>
  </div></section>

  <section id="articles"><div class="wrap reveal">
    <div class="sec-head"><span class="label">Gazette</span><h2 class="sec-title" id="l-art"></h2></div>
    <div class="filters" id="filters"></div>
    <div class="cards" id="articles-list"><div class="load-note" id="art-load"></div></div>
  </div></section>

  <div class="sunburst"><div class="fan"></div></div>

  <section id="certificates"><div class="wrap reveal">
    <div class="sec-head"><span class="label">Distinctions</span><h2 class="sec-title" id="l-certs"></h2></div>
    <div class="certs" id="certs-list"></div>
  </div></section>

  <section id="contact"><div class="wrap reveal">
    <div class="frame-deco">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="sec-head"><span class="label">Correspondence</span><h2 class="sec-title" id="l-contact"></h2></div>
      <div class="contact">
        <div class="cinfo">
          <p class="lede" id="contact-lede"></p>
          <div id="contact-info"></div>
        </div>
        <form id="cf">
          <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none">
          <input type="text" name="name" id="cf-name" required>
          <input type="email" name="email" id="cf-email" required>
          <textarea name="message" id="cf-msg" required></textarea>
          <button type="submit" id="cf-send"></button>
          <p id="cf-status"></p>
        </form>
      </div>
    </div>
  </div></section>

  <footer><div class="wrap">
    <a class="brand" href="#top">CAIJIECHAO</a>
    <div class="fsoc" id="foot-social"></div>
    <p class="muted" id="foot-desc"></p>
    <p class="muted"><a id="foot-icp" target="_blank"></a></p>
  </div></footer>

  <script>window.THEME_ID = "15-artdeco";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";
    const $ = id => document.getElementById(id);

    function renderStatic(){
      document.title = (CJCData.lang()==='zh' ? '蔡杰超' : 'Cai Jiechao') + ' — Deco';
      $('nav').innerHTML = [['about','nav_about'],['courses','nav_courses'],['projects','nav_portfolio'],
        ['articles','nav_article'],['contact','nav_contact']]
        .map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');
      $('greet').textContent = t(P.greeting);
      $('name').textContent = t(P.name);
      $('role').textContent = t(P.role);
      $('lede').textContent = t(P.title);
      const cv=$('cvBtn'); cv.textContent=t(P.ui.download_cv); cv.href=t(P.cv);
      const gh=$('ghBtn'); gh.querySelector('span').textContent='GitHub'; gh.href=P.contact.github;

      $('l-about').textContent = t(P.ui.about_me);
      $('l-edu').textContent = t(P.ui.education_bg);
      $('l-skills').textContent = t(P.ui.core_tech);
      $('l-courses').textContent = t(P.ui.core_courses);
      $('l-exp').textContent = t(P.ui.internship_exp);
      $('l-proj').textContent = t(P.ui.latest_projects);
      $('l-art').textContent = t(P.ui.latest_articles);
      $('l-certs').textContent = t(P.ui.certificates);
      $('l-contact').textContent = t(P.ui.get_in_touch);

      $('portrait').src = P.avatar;
      $('about-text').innerHTML = P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('');
      $('loc').textContent = t(P.location);

      $('edu-list').innerHTML = P.education.map(e=>`
        <div class="lrow"><div class="yr">${esc(e.period)}</div>
        <h3>${esc(t(e.school))}</h3><div class="sub">${esc(t(e.degree))} — ${esc(t(e.note))}</div></div>`).join('');

      $('skills-list').innerHTML = P.skillTags.map(s=>`<span class="chip">${esc(s)}</span>`).join('');

      $('courses-list').innerHTML = P.courses.map(c=>`
        <div class="course"><div class="ci"><i class="fa ${esc(c.icon)}"></i></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');

      $('exp-list').innerHTML = P.experience.map(x=>`
        <div class="lrow"><div class="yr">${esc(x.period)}</div>
        <h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3>
        <div class="sub">${esc(t(x.summary))}</div>
        <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div>`).join('');

      $('certs-list').innerHTML = P.certificates.map(c=>`
        <div class="cert"><img src="${esc(c.image)}" alt="${esc(t(c.title))}">
        <div class="ct"><div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');

      $('contact-lede').textContent = t(P.ui.inbox_open);
      $('contact-info').innerHTML = [
        ['Email',P.contact.email,'mailto:'+P.contact.email],
        ['Phone',P.contact.phone,P.contact.phoneHref],
        ['GitHub','@'+P.contact.githubUser,P.contact.github],
        ['WeChat','QR',P.contact.wechatQrPage],
      ].map(([k,v,h])=>`<a class="row" href="${esc(h)}"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></a>`).join('');
      $('cf-name').placeholder=t(P.ui.name_placeholder);
      $('cf-email').placeholder=t(P.ui.email_placeholder);
      $('cf-msg').placeholder=t(P.ui.msg_placeholder);
      $('cf-send').textContent=t(P.ui.send);

      $('foot-social').innerHTML =
        `<a href="${P.contact.github}" target="_blank">GitHub</a>
         <a href="mailto:${P.contact.email}">Email</a>
         <a href="${P.contact.wechatQrPage}">WeChat</a>
         <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      $('foot-desc').textContent = t(P.ui.footer_desc);
      const icp=$('foot-icp'); icp.textContent=P.icp; icp.href=P.icpUrl;

      $('filters').innerHTML = P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
      observeReveal();
    }

    function renderProjects(){
      const box=$('projects-list');
      if(!projects.length){box.innerHTML=`<div class="load-note">${esc(t(P.ui.no_projects))}</div>`;return;}
      box.innerHTML = projects.map(p=>`
        <a class="card" href="${esc(p.href)}">
          <div class="body">
            <div class="tag"><span>${esc(t(P.ui.tech_stack))}</span><span>${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <div class="stack">${esc(p.tech_stack||'')}</div>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div></a>`).join('');
    }

    function renderArticles(){
      const box=$('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){box.innerHTML=`<div class="load-note">${esc(t(P.ui.no_articles))}</div>`;return;}
      box.innerHTML = list.map(a=>`
        <a class="card" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
          <div class="body">
            <div class="tag"><span>${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div></a>`).join('');
    }

    async function loadDynamic(){
      try{ projects=await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ $('projects-list').innerHTML=`<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles=await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ $('articles-list').innerHTML=`<div class="load-note">⚠ 内容加载失败 / Failed to load</div>`; }
    }

    let io;
    function observeReveal(){
      const els=document.querySelectorAll('.reveal:not(.in)');
      if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return;}
      io=io||new IntersectionObserver((ents)=>{ents.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}});},{threshold:.12});
      els.forEach(e=>io.observe(e));
    }

    $('cf').addEventListener('submit', async e=>{
      e.preventDefault();
      const f=e.target, s=$('cf-status');
      s.style.color='var(--dim)'; s.textContent=t(P.ui.sending);
      try{ const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});
        s.style.color='var(--gold-hi)'; s.textContent=r.message||'Sent.'; f.reset(); }
      catch(err){ s.style.color='#e8a5a5'; s.textContent=err.message; }
    });

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:'#d4af37' });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

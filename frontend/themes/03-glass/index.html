<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Cai Jiechao — liquid glass portfolio"><title>Liquid Glass · Cai Jiechao</title><link rel="icon" href="/index_page/img/favicon.ico"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/themes/03-glass/style.css"><style>
/* React Bits inspired SpotlightCard: each liquid surface catches the pointer independently. */
.glass{--rb-spot-x:50%;--rb-spot-y:0%;isolation:isolate}
.glass::after{content:"";position:absolute;z-index:0;inset:-1px;border-radius:inherit;pointer-events:none;background:radial-gradient(360px circle at var(--rb-spot-x) var(--rb-spot-y),rgba(255,255,255,.25),rgba(112,232,238,.10) 34%,transparent 68%);opacity:0;transition:opacity .22s ease}
.glass:hover::after,.glass:focus-within::after{opacity:1}.glass>*{position:relative;z-index:1}
@media(prefers-reduced-motion:reduce){.glass::after{display:none}}
</style></head><body><a class="skip" href="#main">Skip to content</a><div class="ambient" aria-hidden="true"></div><header class="topbar"><div class="bar glass"><a class="brand" href="#top">Cai<b>Jiechao</b></a><nav class="nav" id="nav" aria-label="Primary navigation"></nav></div></header><main id="main"></main><footer><div class="foot glass"><strong>CaiJiechao</strong><span class="muted" id="foot-note"></span><span id="foot-links"></span></div></footer><script>window.THEME_ID="03-glass";</script><script src="/shared/profile.js"></script><script src="/shared/site-data.js"></script><script src="/themes/03-glass/theme.js" defer></script><script>
(()=>{'use strict';
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!matchMedia('(pointer: fine)').matches)return;
  const wired=new WeakSet();
  const bind=card=>{if(wired.has(card))return;wired.add(card);let raf=0,x='50%',y='0%';card.addEventListener('pointermove',event=>{const r=card.getBoundingClientRect();x=`${((event.clientX-r.left)/r.width)*100}%`;y=`${((event.clientY-r.top)/r.height)*100}%`;if(!raf)raf=requestAnimationFrame(()=>{card.style.setProperty('--rb-spot-x',x);card.style.setProperty('--rb-spot-y',y);raf=0})},{passive:true})};
  const scan=root=>(root.matches?.('.glass')&&bind(root),root.querySelectorAll?.('.glass').forEach(bind));
  addEventListener('DOMContentLoaded',()=>{scan(document);new MutationObserver(records=>records.forEach(record=>record.addedNodes.forEach(node=>node.nodeType===1&&scan(node)))).observe(document.body,{childList:true,subtree:true})});
})();
</script></body></html>

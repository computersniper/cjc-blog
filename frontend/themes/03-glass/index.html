<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Glass</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root{
      --accent:#7c5cff; --glass:rgba(255,255,255,.12); --glass-strong:rgba(255,255,255,.16);
      --stroke:rgba(255,255,255,.25); --ink:#f4f2ff; --dim:rgba(244,242,255,.72);
      --scrim:rgba(20,14,46,.34); --radius:22px; --shadow:0 8px 40px rgba(0,0,0,.2);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.6;
      overflow-x:hidden;min-height:100vh;position:relative;
      background:#241a4d;
    }
    /* Animated drifting gradient background */
    .bg{position:fixed;inset:-20%;z-index:-2;filter:saturate(1.15);
      background:
        radial-gradient(45% 55% at 20% 25%, #7c5cff 0%, transparent 60%),
        radial-gradient(45% 55% at 80% 20%, #22d3ee 0%, transparent 58%),
        radial-gradient(50% 60% at 75% 80%, #ff6ec4 0%, transparent 60%),
        radial-gradient(55% 60% at 25% 85%, #5b8cff 0%, transparent 62%),
        linear-gradient(120deg,#2a1a5e,#141033);
      background-size:180% 180%;animation:drift 26s ease-in-out infinite;}
    @keyframes drift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    /* Mouse-follow glow */
    .glow{position:fixed;top:0;left:0;width:520px;height:520px;margin:-260px 0 0 -260px;z-index:-1;pointer-events:none;
      background:radial-gradient(circle,rgba(255,255,255,.16),rgba(124,92,255,.10) 40%,transparent 70%);
      transform:translate(50vw,30vh);transition:transform .18s ease-out;will-change:transform}

    a{color:inherit}
    img{max-width:100%;display:block}
    .wrap{max-width:1120px;margin:0 auto;padding:0 22px}

    /* Glass primitive */
    .glass{position:relative;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
      border:1px solid var(--stroke);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
    .glass::before{content:"";position:absolute;top:0;left:0;right:0;height:45%;pointer-events:none;
      background:linear-gradient(180deg,rgba(255,255,255,.18),transparent)}
    .scrim{background:var(--scrim);border-radius:14px}

    /* Nav */
    .nav{position:sticky;top:14px;z-index:700;margin:16px auto 0;max-width:1120px;padding:0 22px}
    .nav .bar{display:flex;align-items:center;gap:14px;padding:10px 16px}
    .brand{font-weight:800;font-size:18px;text-decoration:none;letter-spacing:-.01em}
    .brand b{color:#c9baff}
    .navlinks{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;padding-right:168px}
    .navlinks a{font-size:13px;font-weight:600;text-decoration:none;color:var(--dim);padding:6px 11px;border-radius:999px;transition:.2s}
    .navlinks a:hover{color:#fff;background:rgba(255,255,255,.12)}
    @media(max-width:940px){.navlinks{display:none}}

    section{padding:46px 0}
    .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:24px}
    .sec-kicker{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#c9baff;
      background:rgba(124,92,255,.28);border:1px solid var(--stroke);padding:5px 11px;border-radius:999px}
    .sec-title{font-size:clamp(24px,3.6vw,38px);font-weight:800;letter-spacing:-.02em;margin:0;
      text-shadow:0 2px 14px rgba(0,0,0,.28)}

    /* Hero */
    .hero{padding:40px 0 30px}
    .hero .card{padding:40px;display:grid;grid-template-columns:1fr 220px;gap:30px;align-items:center}
    .greet{font-size:15px;font-weight:600;color:#d6cbff;letter-spacing:.02em}
    .hero h1{font-size:clamp(40px,8vw,78px);font-weight:900;line-height:1;letter-spacing:-.03em;margin:12px 0 0;
      text-shadow:0 4px 26px rgba(0,0,0,.3)}
    .hero .role{display:inline-block;margin-top:14px;font-weight:600;color:#fff;background:rgba(124,92,255,.4);
      border:1px solid var(--stroke);padding:6px 14px;border-radius:999px;font-size:14px}
    .hero .head{font-size:clamp(17px,2.4vw,22px);color:var(--ink);margin:18px 0 0;max-width:26ch;font-weight:500}
    .hero .sub{color:var(--dim);margin-top:8px;font-size:15px}
    .hero .avatar{width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.35);
      box-shadow:0 10px 40px rgba(0,0,0,.35)}
    .btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
    .btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:14px;
      padding:12px 20px;border-radius:999px;cursor:pointer;transition:transform .18s,box-shadow .18s;border:1px solid var(--stroke)}
    .btn.primary{background:linear-gradient(120deg,#7c5cff,#a855f7);color:#fff;box-shadow:0 8px 26px rgba(124,92,255,.5)}
    .btn.ghost{background:var(--glass);color:#fff;backdrop-filter:blur(10px)}
    .btn:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(124,92,255,.55)}
    @media(max-width:720px){.hero .card{grid-template-columns:1fr;text-align:center}.hero .avatar{max-width:180px;margin:0 auto}.btns{justify-content:center}}

    /* Floating animation */
    .float{animation:floaty 7s ease-in-out infinite}
    .float:nth-child(2n){animation-delay:-2.4s}
    .float:nth-child(3n){animation-delay:-4.1s}
    @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

    /* About */
    .about .card{padding:34px;display:grid;grid-template-columns:200px 1fr;gap:30px;align-items:start}
    .about img{width:100%;border-radius:18px;object-fit:cover;border:1px solid var(--stroke)}
    .about .txt{padding:18px}
    .about .txt p{margin:0 0 14px}
    .about .loc{display:inline-block;margin-top:4px;font-weight:600;color:#d6cbff}
    @media(max-width:680px){.about .card{grid-template-columns:1fr}}

    /* Generic grids */
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    @media(max-width:860px){.grid3{grid-template-columns:1fr 1fr}}
    @media(max-width:620px){.grid2,.grid3{grid-template-columns:1fr}}

    .item{padding:22px}
    .item .when{font-size:13px;font-weight:700;color:#c9baff;margin-bottom:8px}
    .item h3{margin:0 0 6px;font-size:18px;font-weight:700}
    .item .muted{color:var(--dim);font-size:14.5px}
    .item ul{margin:12px 0 0;padding-left:18px;color:var(--dim);font-size:14px}
    .item ul li{margin-bottom:7px}

    /* Skills chips */
    .chips{display:flex;flex-wrap:wrap;gap:10px}
    .chip{padding:8px 15px;border-radius:999px;font-weight:600;font-size:14px;background:var(--glass-strong);
      border:1px solid var(--stroke);backdrop-filter:blur(10px);transition:.2s}
    .chip:hover{background:rgba(124,92,255,.35);transform:translateY(-2px)}

    /* Courses */
    .course{padding:22px}
    .course .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;
      font-size:22px;color:#fff;background:linear-gradient(135deg,rgba(124,92,255,.5),rgba(34,211,238,.4));
      border:1px solid var(--stroke);margin-bottom:14px}
    .course h4{margin:0 0 8px;font-size:16px;font-weight:700}
    .course p{margin:0;color:var(--dim);font-size:13.5px}

    /* Cards */
    .card-link{padding:0;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
    .card-link:hover{transform:translateY(-5px);box-shadow:0 18px 48px rgba(0,0,0,.34)}
    .card-link .cover{height:160px;overflow:hidden;background:rgba(255,255,255,.08)}
    .card-link .cover img{width:100%;height:100%;object-fit:cover}
    .card-link .cbody{padding:18px;display:flex;flex-direction:column;gap:9px;flex:1}
    .card-link .ctag{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#c9baff}
    .card-link h4{margin:0;font-size:16px;font-weight:700;line-height:1.25}
    .card-link p{margin:0;color:var(--dim);font-size:14px;flex:1}
    .card-link .stack-line{font-size:13px;color:#9be7ff;font-weight:600}
    .card-link .more{font-weight:700;font-size:12.5px;color:#fff}

    /* Filters */
    .filters{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px}
    .filters button{background:var(--glass);border:1px solid var(--stroke);color:var(--dim);font-family:inherit;
      font-weight:600;font-size:13px;padding:8px 15px;border-radius:999px;cursor:pointer;backdrop-filter:blur(10px);transition:.2s}
    .filters button.active,.filters button:hover{background:linear-gradient(120deg,#7c5cff,#a855f7);color:#fff;border-color:transparent}

    /* Certificates */
    .cert{padding:0;display:grid;grid-template-columns:120px 1fr;overflow:hidden}
    .cert img{height:100%;object-fit:cover}
    .cert .ct{padding:18px}
    .cert .ct .meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#c9baff;margin-bottom:8px}
    .cert .ct h4{margin:0 0 6px;font-size:16px;font-weight:700}
    .cert .ct p{margin:0;color:var(--dim);font-size:13.5px}
    @media(max-width:620px){.cert{grid-template-columns:90px 1fr}}

    /* Contact */
    .contact .card{padding:34px;display:grid;grid-template-columns:1fr 1.15fr;gap:30px;align-items:start}
    .cinfo a{display:flex;justify-content:space-between;gap:10px;text-decoration:none;font-weight:600;
      padding:13px 16px;margin-bottom:11px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--stroke);transition:.2s}
    .cinfo a:hover{transform:translateY(-2px);background:rgba(124,92,255,.28)}
    .cinfo a span:last-child{color:#c9baff}
    form input,form textarea{width:100%;background:rgba(255,255,255,.1);border:1px solid var(--stroke);border-radius:14px;
      font-family:inherit;font-size:15px;padding:14px;margin-bottom:14px;color:#fff;backdrop-filter:blur(6px)}
    form input::placeholder,form textarea::placeholder{color:rgba(244,242,255,.55)}
    form input:focus,form textarea:focus{outline:none;border-color:rgba(124,92,255,.8);box-shadow:0 0 0 3px rgba(124,92,255,.3)}
    form textarea{min-height:130px;resize:vertical}
    #cf-status{font-weight:600;margin-top:8px}
    @media(max-width:720px){.contact .card{grid-template-columns:1fr}}

    footer{margin:24px 0;padding:0 22px}
    footer .fcard{padding:28px 30px}
    footer .frow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center}
    footer a{color:#d6cbff;text-decoration:none;font-weight:600;font-size:14px}
    footer a:hover{color:#fff}
    .fbrand{font-weight:800;font-size:18px}
    .muted-s{color:var(--dim);font-size:12.5px}
    .load-note{color:var(--dim);padding:22px;font-size:14px}

    a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:3px}
    @media(prefers-reduced-motion:reduce){
      .bg{animation:none}.float{animation:none}.glow{display:none}
      *{transition:none!important}html{scroll-behavior:auto}
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="glow" id="glow" aria-hidden="true"></div>

  <div class="nav"><div class="bar glass">
    <a class="brand" href="#top">Cai<b>Jiechao</b></a>
    <nav class="navlinks" id="nav"></nav>
  </div></div>

  <div id="top"></div>
  <header class="hero"><div class="wrap">
    <div class="card glass float">
      <div>
        <div class="greet" id="greet"></div>
        <h1 id="name"></h1>
        <div class="role" id="role"></div>
        <div class="head" id="headline"></div>
        <div class="sub" id="subtitle"></div>
        <div class="btns">
          <a class="btn primary" id="cvBtn" href="#" download></a>
          <a class="btn ghost" id="ghBtn" target="_blank" rel="noopener"></a>
        </div>
      </div>
      <img class="avatar" id="hero-avatar" alt="" />
    </div>
  </div></header>

  <section id="about" class="about"><div class="wrap">
    <div class="sec-head"><span class="sec-kicker">01</span><h2 class="sec-title" id="l-about"></h2></div>
    <div class="card glass">
      <img id="portrait" alt="" />
      <div class="txt scrim" id="about-text"></div>
    </div>
  </div></section>

  <section id="education"><div class="wrap">
    <div class="sec-head"><span class="sec-kicker">02</span><h2 class="sec-title" id="l-edu"></h2></div>
    <div class="grid2" id="edu-list"></div>
  </div></section>

  <section id="skills"><div class="wrap">
    <div class="sec-head"><span class="sec-kicker">03</span><h2 class="sec-title" id="l-skills"></h2></div>
    <div class="glass" style="padding:26px"><div class="chips" id="skills-list"></div></div>
  </div></section>

  <section id="courses"><div class="wrap">
    <div class="sec-head"><span class="sec-kicker">04</span><h2 class="sec-title" id="l-courses"></h2></div>
    <div class="grid3" id="courses-list"></div>
  </div></section>

  <section id="experience"><div class="wrap">
    <div class="sec-head"><span class="sec-kicker">05</span><h2 class="sec-title" id="l-exp"></h2></div>
    <div id="exp-list"></div>
  </div></section>

  <section id="projects"><div class="wrap">
    <div class="sec-head"><span class="sec-kicker">06</span><h2 class="sec-title" id="l-projects"></h2></div>
    <div class="grid3" id="projects-list"><div class="load-note" id="proj-load"></div></div>
  </div></section>

  <section id="articles"><div class="wrap">
    <div class="sec-head"><span class="sec-kicker">07</span><h2 class="sec-title" id="l-articles"></h2></div>
    <div class="filters" id="filters"></div>
    <div class="grid3" id="articles-list"><div class="load-note" id="art-load"></div></div>
  </div></section>

  <section id="certificates"><div class="wrap">
    <div class="sec-head"><span class="sec-kicker">08</span><h2 class="sec-title" id="l-certs"></h2></div>
    <div class="grid2" id="certs-list"></div>
  </div></section>

  <section id="contact" class="contact"><div class="wrap">
    <div class="sec-head"><span class="sec-kicker">09</span><h2 class="sec-title" id="l-contact"></h2></div>
    <div class="card glass">
      <div class="cinfo" id="contact-info"></div>
      <form id="cf">
        <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none">
        <input type="text" name="name" id="cf-name" required>
        <input type="email" name="email" id="cf-email" required>
        <textarea name="message" id="cf-msg" required></textarea>
        <button type="submit" class="btn primary" id="cf-send" style="width:100%;justify-content:center"></button>
        <p id="cf-status"></p>
      </form>
    </div>
  </div></section>

  <footer><div class="fcard glass">
    <div class="frow">
      <span class="fbrand">Cai<b style="color:#c9baff">Jiechao</b></span>
      <div class="frow" id="foot-social" style="gap:18px"></div>
    </div>
    <div class="frow" style="margin-top:16px">
      <span class="muted-s" id="foot-desc"></span>
      <a id="foot-icp" class="muted-s" style="color:var(--dim)" target="_blank"></a>
    </div>
  </div></footer>

  <script>window.THEME_ID = "03-glass";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";

    function renderStatic(){
      // nav
      document.getElementById('nav').innerHTML = [
        ['about','nav_about'],['skills','core_tech'],['courses','nav_courses'],
        ['projects','nav_portfolio'],['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');
      // hero
      document.getElementById('greet').textContent = t(P.greeting);
      document.getElementById('name').textContent = t(P.name);
      document.getElementById('role').textContent = t(P.role);
      document.getElementById('headline').textContent = t(P.headline);
      document.getElementById('subtitle').textContent = t(P.title) + ' · ' + t(P.location);
      const hav = document.getElementById('hero-avatar'); hav.src = P.avatar; hav.alt = t(P.name);
      const cv = document.getElementById('cvBtn');
      cv.textContent = t(P.ui.download_cv); cv.href = t(P.cv);
      const gh = document.getElementById('ghBtn');
      gh.textContent = 'GitHub ↗'; gh.href = P.contact.github;
      // labels
      document.getElementById('l-about').textContent = t(P.ui.about_me);
      document.getElementById('l-edu').textContent = t(P.ui.education_bg);
      document.getElementById('l-skills').textContent = t(P.ui.core_tech);
      document.getElementById('l-courses').textContent = t(P.ui.core_courses);
      document.getElementById('l-exp').textContent = t(P.ui.internship_exp);
      document.getElementById('l-projects').textContent = t(P.ui.latest_projects);
      document.getElementById('l-articles').textContent = t(P.ui.latest_articles);
      document.getElementById('l-certs').textContent = t(P.ui.certificates);
      document.getElementById('l-contact').textContent = t(P.ui.get_in_touch);
      // about
      const portrait = document.getElementById('portrait');
      portrait.src = P.avatar; portrait.alt = t(P.name);
      document.getElementById('about-text').innerHTML =
        P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('') +
        `<div class="loc">📍 ${esc(t(P.location))}</div>`;
      // education
      document.getElementById('edu-list').innerHTML = P.education.map(e=>`
        <div class="item glass scrim float"><div class="when">${esc(e.period)}</div>
        <h3>${esc(t(e.school))}</h3>
        <div class="muted">${esc(t(e.degree))} — ${esc(t(e.note))}</div></div>`).join('');
      // skills
      document.getElementById('skills-list').innerHTML = (P.skillTags||[]).map(s=>`<span class="chip">${esc(s)}</span>`).join('');
      // courses
      document.getElementById('courses-list').innerHTML = P.courses.map(c=>`
        <div class="course glass scrim float"><div class="ic"><i class="fa ${esc(c.icon)}"></i></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');
      // experience
      document.getElementById('exp-list').innerHTML = P.experience.map(x=>`
        <div class="item glass scrim"><div class="when">${esc(x.period)}</div>
        <h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3>
        <div class="muted">${esc(t(x.summary))}</div>
        <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div>`).join('');
      // certificates
      document.getElementById('certs-list').innerHTML = P.certificates.map(c=>`
        <div class="cert glass"><img src="${esc(c.image)}" alt="${esc(t(c.title))}">
        <div class="ct scrim"><div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');
      // contact info
      document.getElementById('contact-info').innerHTML = [
        ['Email', P.contact.email, 'mailto:'+P.contact.email],
        ['Phone', P.contact.phone, P.contact.phoneHref],
        ['GitHub', '@'+P.contact.githubUser, P.contact.github],
        ['WeChat', 'QR ↗', P.contact.wechatQrPage],
      ].map(([k,v,h])=>`<a href="${esc(h)}"><span>${esc(k)}</span><span>${esc(v)}</span></a>`).join('');
      document.getElementById('cf-name').placeholder = t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder = t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder = t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent = t(P.ui.send);
      // footer
      document.getElementById('foot-social').innerHTML =
        `<a href="${P.contact.github}" target="_blank" rel="noopener">GitHub</a>
         <a href="mailto:${P.contact.email}">Email</a>
         <a href="${P.contact.wechatQrPage}">WeChat</a>
         <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent = t(P.ui.footer_desc);
      const icp = document.getElementById('foot-icp'); icp.textContent = P.icp; icp.href = P.icpUrl;
      // filters
      document.getElementById('filters').innerHTML = P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box = document.getElementById('projects-list');
      if(!projects.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML = projects.map(p=>`
        <a class="card-link glass" href="${esc(p.href)}">
          <div class="cbody">
            <div class="ctag"><span>${esc(t(P.ui.tech_stack))}</span><span>${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <div class="stack-line">${esc(p.tech_stack||'')}</div>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div></a>`).join('');
    }

    function renderArticles(){
      const box = document.getElementById('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML = list.map(a=>`
        <a class="card-link glass" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
          <div class="cbody">
            <div class="ctag"><span>${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div></a>`).join('');
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML = `<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-list').innerHTML = `<div class="load-note">⚠ Failed to load articles.</div>`; }
    }

    document.getElementById('cf').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      const payload = { name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color='#d6cbff'; s.textContent = t(P.ui.sending);
      try{ const r = await CJCData.sendContact(payload); s.style.color='#8ef5b0'; s.textContent = r.message||'Sent.'; f.reset(); }
      catch(err){ s.style.color='#ff9ecb'; s.textContent = err.message; }
    });

    // Mouse-follow glow (skipped under reduced-motion)
    const glow = document.getElementById('glow');
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      window.addEventListener('pointermove', (e)=>{
        glow.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
      }, { passive:true });
    }

    // Font Awesome for course icons
    const fa = document.createElement('link');
    fa.rel='stylesheet'; fa.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css';
    document.head.appendChild(fa);

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:'#7c5cff' });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

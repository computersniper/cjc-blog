<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Wizardry</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{
      --p0:#160f0a; --p1:#241a12; --p2:#2e2115; --gold:#c9a227; --gold2:#e7c65a; --burg:#6d1f2c; --burg2:#8a2a3a;
      --ink:#f0e2c8; --mut:#b79f79; --line:rgba(201,162,39,.28); --cream:#efe3c6;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;line-height:1.6;
      overflow-x:hidden;
      background:
        radial-gradient(900px 500px at 20% -5%,rgba(201,162,39,.10),transparent 60%),
        radial-gradient(700px 500px at 90% 20%,rgba(109,31,44,.16),transparent 60%),
        linear-gradient(180deg,var(--p0),var(--p1) 40%,var(--p0));
      background-attachment:fixed}
    /* parchment noise via svg */
    body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.05;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    h1,h2,h3,.disp{font-family:'Cinzel',serif;letter-spacing:.02em}
    .wrap{max-width:1140px;margin:0 auto;padding:0 22px;position:relative;z-index:2}

    /* candles */
    .candles{position:fixed;top:0;left:0;right:0;height:0;z-index:5;pointer-events:none}
    .candle{position:fixed;width:12px;z-index:5;pointer-events:none}
    .candle .stick{width:8px;height:34px;margin:0 auto;background:linear-gradient(#efe3c6,#c8b48a);border-radius:2px;
      box-shadow:0 0 8px rgba(0,0,0,.5)}
    .flame{width:12px;height:20px;margin:0 auto -4px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
      background:radial-gradient(circle at 50% 70%,#fff6cf,#ffcf5a 40%,#ff8a2a 75%,transparent);
      box-shadow:0 0 22px 6px rgba(255,170,60,.55);transform-origin:50% 100%;
      animation:flick 1.6s ease-in-out infinite alternate}
    @keyframes flick{0%{transform:scaleY(1) rotate(-2deg)}50%{transform:scaleY(1.12) rotate(2deg)}100%{transform:scaleY(.94) rotate(-1deg)}}

    /* topbar */
    .topbar{position:sticky;top:0;z-index:40;background:rgba(22,15,10,.82);backdrop-filter:blur(6px);
      border-bottom:1px solid var(--line)}
    .topbar .row{display:flex;align-items:center;justify-content:space-between;height:60px}
    .brand{font-family:'Cinzel';font-weight:700;font-size:20px;color:var(--gold2)}
    .brand b{color:var(--burg2)}
    .nav{display:flex;gap:20px}
    .nav a{font-family:'Cinzel';font-size:12px;letter-spacing:.14em;color:var(--mut)}
    .nav a:hover{color:var(--gold2)}
    @media(max-width:900px){.nav{display:none}}

    section{padding:66px 0;position:relative}
    .chapter{font-family:'Cinzel';color:var(--burg2);letter-spacing:.28em;text-transform:uppercase;font-size:12px}
    .sec-title{font-family:'Cinzel';font-weight:700;font-size:clamp(28px,4.6vw,46px);margin:6px 0 0;color:var(--gold2);
      text-shadow:0 2px 10px rgba(201,162,39,.25)}
    .flourish{color:var(--gold);text-align:center;font-size:26px;margin:12px 0 28px;letter-spacing:.4em}
    .incant{font-style:italic;color:var(--mut);text-align:center;margin:2px 0 22px;font-size:18px;letter-spacing:.02em}

    /* gilded frame */
    .frame{border:3px solid var(--gold);border-radius:6px;position:relative;background:linear-gradient(180deg,rgba(46,33,21,.7),rgba(22,15,10,.7));
      box-shadow:0 0 0 5px var(--p0),0 0 0 7px rgba(201,162,39,.5),0 24px 50px rgba(0,0,0,.55);padding:26px}
    .frame::before,.frame::after{content:"❧";position:absolute;color:var(--gold);font-size:22px}
    .frame::before{top:6px;left:10px}.frame::after{bottom:2px;right:10px;transform:rotate(180deg)}

    /* HERO */
    .hero{padding:56px 0 20px}
    .hero .grid{display:grid;grid-template-columns:1fr 340px;gap:34px;align-items:center}
    @media(max-width:860px){.hero .grid{grid-template-columns:1fr}}
    .greet{font-family:'Cinzel';color:var(--burg2);letter-spacing:.2em;text-transform:uppercase;font-size:13px}
    .hero h1{font-family:'Cinzel';font-weight:800;font-size:clamp(46px,10vw,104px);line-height:.98;margin:10px 0 6px;
      color:var(--gold2);text-shadow:0 2px 0 #7a5f13,0 4px 22px rgba(201,162,39,.35)}
    .hero .role{font-size:clamp(20px,3vw,30px);color:var(--ink);font-style:italic}
    .hero .tag{color:var(--mut);max-width:44ch;margin:12px 0 22px}
    .btns{display:flex;flex-wrap:wrap;gap:14px}
    .btn{display:inline-flex;align-items:center;gap:9px;font-family:'Cinzel';font-size:14px;letter-spacing:.06em;
      padding:12px 22px;border-radius:4px;cursor:pointer;transition:.16s;border:2px solid var(--gold)}
    .btn.pri{background:var(--gold);color:#241a0d}
    .btn.pri:hover{background:var(--gold2)}
    .btn.gho{background:transparent;color:var(--gold2)}
    .btn.gho:hover{background:rgba(201,162,39,.12)}
    .portrait-frame{padding:12px;background:linear-gradient(135deg,#e7c65a,#8a6a17 45%,#e7c65a 70%,#6d4f12);
      border-radius:8px;box-shadow:0 24px 50px rgba(0,0,0,.6)}
    .portrait-frame img{border-radius:4px;width:100%;aspect-ratio:.86;object-fit:cover;filter:sepia(.15) contrast(1.02)}

    /* crest shields */
    .crests{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:8px}
    @media(max-width:700px){.crests{grid-template-columns:repeat(2,1fr)}}
    .crest{text-align:center}
    .crest svg{width:100%;max-width:120px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5))}
    .crest .nm{font-family:'Cinzel';font-size:13px;color:var(--gold2);margin-top:8px;letter-spacing:.08em}
    .crest .vl{color:var(--mut);font-size:15px;font-style:italic}

    /* about */
    .about{display:grid;grid-template-columns:300px 1fr;gap:30px;align-items:start}
    @media(max-width:800px){.about{grid-template-columns:1fr}}
    .about p{margin:0 0 14px;color:var(--cream);max-width:62ch}
    .loc{display:inline-block;font-family:'Cinzel';font-size:13px;color:var(--gold2);border:1px solid var(--gold);
      border-radius:4px;padding:7px 14px;letter-spacing:.06em}

    /* scroll rows (edu/exp) */
    .rows{display:flex;flex-direction:column;gap:18px}
    .scroll{padding:22px 26px;border:1px solid var(--line);border-radius:6px;
      background:linear-gradient(180deg,rgba(46,33,21,.55),rgba(22,15,10,.55));position:relative}
    .scroll::before{content:"✦";position:absolute;left:-1px;top:-1px;color:var(--gold);font-size:14px;background:var(--p1);padding:2px 6px;border-radius:6px 0 6px 0}
    .scroll .p{font-family:'Cinzel';color:var(--burg2);font-size:13px;letter-spacing:.06em}
    .scroll h3{margin:6px 0 4px;font-size:24px;color:var(--gold2)}
    .scroll .s{color:var(--mut);font-style:italic}
    .scroll ul{margin:10px 0 0;padding-left:20px;color:var(--cream)}

    /* skills */
    .spells{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    @media(max-width:760px){.spells{grid-template-columns:1fr 1fr}}
    @media(max-width:480px){.spells{grid-template-columns:1fr}}
    .spell{padding:16px 18px;border:1px solid var(--line);border-radius:6px;background:rgba(46,33,21,.4);text-align:center}
    .spell .n{font-family:'Cinzel';color:var(--burg2);font-size:11px;letter-spacing:.14em}
    .spell .v{margin-top:6px;color:var(--ink);font-size:18px}
    .tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
    .tags span{font-family:'Cinzel';font-size:12px;letter-spacing:.04em;padding:7px 14px;border-radius:20px;
      border:1px solid var(--gold);color:var(--gold2);background:rgba(201,162,39,.08)}

    /* courses */
    .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    @media(max-width:820px){.courses{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.courses{grid-template-columns:1fr}}
    .course{padding:22px;border:1px solid var(--line);border-radius:6px;background:linear-gradient(180deg,rgba(46,33,21,.5),rgba(22,15,10,.5));
      transition:.18s}
    .course:hover{border-color:var(--gold);transform:translateY(-3px)}
    .course i.fa{color:var(--gold);font-size:26px}
    .course h4{font-family:'Cinzel';margin:12px 0 8px;font-size:18px;color:var(--gold2)}
    .course p{margin:0;color:var(--mut);font-size:16px}

    /* cards */
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    @media(max-width:880px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.cards{grid-template-columns:1fr}}
    .card{border:2px solid var(--gold);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;
      background:linear-gradient(180deg,rgba(46,33,21,.6),rgba(22,15,10,.7));box-shadow:0 0 0 4px var(--p0),0 16px 34px rgba(0,0,0,.5);
      transition:.18s}
    .card:hover{transform:translateY(-5px);box-shadow:0 0 0 4px var(--p0),0 0 24px rgba(201,162,39,.35),0 22px 44px rgba(0,0,0,.6)}
    .card .cover{height:158px;overflow:hidden;background:#14100a;border-bottom:2px solid var(--gold)}
    .card .cover img{width:100%;height:100%;object-fit:cover;filter:sepia(.18)}
    .cbody{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
    .ctag{display:flex;justify-content:space-between;font-family:'Cinzel';font-size:11px;letter-spacing:.08em;color:var(--burg2)}
    .card h4{font-family:'Cinzel';margin:0;font-size:17px;line-height:1.3;color:var(--gold2)}
    .card p{margin:0;color:var(--cream);font-size:16px;flex:1}
    .tech{color:var(--gold);font-style:italic;font-size:15px}
    .more{font-family:'Cinzel';font-size:12px;letter-spacing:.06em;color:var(--gold2)}

    .filters{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:24px;justify-content:center}
    .filters button{font-family:'Cinzel';font-size:12px;letter-spacing:.04em;background:transparent;border:1px solid var(--gold);
      color:var(--mut);padding:8px 16px;border-radius:20px;cursor:pointer;transition:.15s}
    .filters button.active,.filters button:hover{background:var(--gold);color:#241a0d}

    /* certs */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    @media(max-width:640px){.certs{grid-template-columns:1fr}}
    .cert{display:grid;grid-template-columns:130px 1fr;border:2px solid var(--gold);border-radius:6px;overflow:hidden;
      background:rgba(46,33,21,.5);box-shadow:0 0 0 4px var(--p0)}
    .cert img{width:100%;height:100%;object-fit:cover;min-height:150px;filter:sepia(.2)}
    .cert .ct{padding:16px}
    .cert .meta{display:flex;justify-content:space-between;font-family:'Cinzel';font-size:11px;color:var(--burg2)}
    .cert h4{font-family:'Cinzel';margin:8px 0 6px;font-size:17px;color:var(--gold2)}
    .cert p{margin:0;color:var(--cream);font-size:15px}
    /* wax seal */
    .seal{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#a83346,var(--burg));
      display:inline-grid;place-items:center;color:#efc45a;font-family:'Cinzel';font-size:16px;
      box-shadow:inset 0 0 10px rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.5);margin-top:10px}
    @media(max-width:400px){.cert{grid-template-columns:96px 1fr}}

    /* contact */
    .contact{display:grid;grid-template-columns:1fr 1.2fr;gap:26px}
    @media(max-width:800px){.contact{grid-template-columns:1fr}}
    .cinfo a{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
    .cinfo a span:first-child{font-family:'Cinzel';font-size:13px;color:var(--mut);letter-spacing:.06em}
    .cinfo a span:last-child{color:var(--gold2)}
    form input,form textarea{width:100%;background:rgba(22,15,10,.7);border:1px solid var(--gold);border-radius:4px;
      color:var(--ink);font-family:inherit;font-size:17px;padding:13px;margin-bottom:14px}
    form input:focus,form textarea:focus{outline:none;border-color:var(--gold2);box-shadow:0 0 10px rgba(201,162,39,.3)}
    form textarea{min-height:120px;resize:vertical}
    #cf-status{font-family:'Cinzel';font-size:14px;margin-top:4px}

    footer{border-top:1px solid var(--line);padding:36px 0 70px}
    .frow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:center}
    .fsoc{display:flex;gap:18px}
    .fsoc a{font-family:'Cinzel';color:var(--mut);font-size:12px;letter-spacing:.06em}
    .fsoc a:hover{color:var(--gold2)}
    .muted{color:#7c6a49;font-size:14px;font-style:italic}
    .load-note{grid-column:1/-1;color:var(--mut);text-align:center;padding:20px;border:1px dashed var(--line);border-radius:6px;font-style:italic}

    @media(prefers-reduced-motion:reduce){
      .flame{animation:none}
      *{scroll-behavior:auto}
    }
  </style>
</head>
<body>
  <div class="candles" aria-hidden="true">
    <div class="candle" style="left:6%;top:120px"><div class="flame" style="animation-delay:.2s"></div><div class="stick"></div></div>
    <div class="candle" style="right:5%;top:200px"><div class="flame" style="animation-delay:.7s"></div><div class="stick"></div></div>
    <div class="candle" style="left:3%;top:60vh"><div class="flame" style="animation-delay:1.1s"></div><div class="stick"></div></div>
    <div class="candle" style="right:4%;top:75vh"><div class="flame" style="animation-delay:.4s"></div><div class="stick"></div></div>
  </div>

  <div class="topbar"><div class="wrap row">
    <a class="brand" href="#top">Cai<b>Jiechao</b></a>
    <nav class="nav" id="nav"></nav>
  </div></div>

  <div id="top"></div>
  <header class="hero"><div class="wrap">
    <div class="grid">
      <div>
        <div class="greet" id="greet"></div>
        <h1 id="name"></h1>
        <div class="role" id="role"></div>
        <p class="tag" id="tag"></p>
        <div class="btns">
          <a class="btn pri" id="cvBtn" download><i class="fa fa-book"></i><span></span></a>
          <a class="btn gho" id="ghBtn" target="_blank" rel="noopener"><i class="fa fa-github"></i>GitHub</a>
        </div>
      </div>
      <div class="portrait-frame"><img id="portrait" alt="Cai Jiechao portrait" /></div>
    </div>
    <div class="flourish">✦ ⚜ ✦</div>
    <div class="crests" id="crests"></div>
  </div></header>

  <section id="about"><div class="wrap">
    <div class="chapter" id="c-about">Chapter I</div><h2 class="sec-title" id="l-about"></h2>
    <p class="incant" id="i-about">“Draco dormiens nunquam titillandus”</p>
    <div class="frame"><div class="about">
      <div class="portrait-frame" style="padding:8px"><img id="portrait2" alt="Cai Jiechao" /></div>
      <div><div id="bio"></div><span class="loc" id="loc"></span></div>
    </div></div>
  </div></section>

  <section id="education"><div class="wrap">
    <div class="chapter">Chapter II</div><h2 class="sec-title" id="l-edu"></h2>
    <div class="flourish" style="font-size:20px">❦</div>
    <div class="rows" id="edu"></div>
  </div></section>

  <section id="skills"><div class="wrap">
    <div class="chapter">Chapter III</div><h2 class="sec-title" id="l-skills"></h2>
    <p class="incant">The Book of Spells &amp; Enchantments</p>
    <div class="spells" id="spells"></div>
    <div class="tags" id="tags"></div>
  </div></section>

  <section id="courses"><div class="wrap">
    <div class="chapter">Chapter IV</div><h2 class="sec-title" id="l-courses"></h2>
    <div class="flourish" style="font-size:20px">❦</div>
    <div class="courses" id="courses-box"></div>
  </div></section>

  <section id="experience"><div class="wrap">
    <div class="chapter">Chapter V</div><h2 class="sec-title" id="l-exp"></h2>
    <div class="flourish" style="font-size:20px">❦</div>
    <div class="rows" id="exp"></div>
  </div></section>

  <section id="projects"><div class="wrap">
    <div class="chapter">Chapter VI</div><h2 class="sec-title" id="l-projects"></h2>
    <p class="incant">Artifacts conjured &amp; enchanted</p>
    <div class="cards" id="projects-box"><div class="load-note" id="proj-load"></div></div>
  </div></section>

  <section id="articles"><div class="wrap">
    <div class="chapter">Chapter VII</div><h2 class="sec-title" id="l-articles"></h2>
    <p class="incant">Pages from the grimoire</p>
    <div class="filters" id="filters"></div>
    <div class="cards" id="articles-box"><div class="load-note" id="art-load"></div></div>
  </div></section>

  <section id="certificates"><div class="wrap">
    <div class="chapter">Chapter VIII</div><h2 class="sec-title" id="l-certs"></h2>
    <div class="flourish" style="font-size:20px">❦</div>
    <div class="certs" id="certs"></div>
  </div></section>

  <section id="contact"><div class="wrap">
    <div class="chapter">Chapter IX</div><h2 class="sec-title" id="l-contact"></h2>
    <p class="incant">Send an owl</p>
    <div class="frame"><div class="contact">
      <div class="cinfo" id="cinfo"></div>
      <form id="cf">
        <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
        <input type="text" name="name" id="cf-name" required>
        <input type="email" name="email" id="cf-email" required>
        <textarea name="message" id="cf-msg" required></textarea>
        <button type="submit" class="btn pri" id="cf-send"></button>
        <p id="cf-status"></p>
      </form>
    </div></div>
  </div></section>

  <footer><div class="wrap">
    <div class="frow">
      <a class="brand" href="#top" style="font-size:17px">Cai<b>Jiechao</b></a>
      <div class="fsoc" id="fsoc"></div>
    </div>
    <div class="frow" style="margin-top:16px">
      <span class="muted" id="foot-desc"></span>
      <a class="muted" id="foot-icp" target="_blank" rel="noopener"></a>
    </div>
  </div></footer>

  <script>window.THEME_ID = "56-potter";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P=CJCData.profile,t=CJCData.t.bind(CJCData),esc=CJCData.escapeHtml;
    let articles=[],projects=[],filterKey="all";

    function shield(fill,charge){
      return `<svg viewBox="0 0 100 120" role="img" aria-label="house crest">
        <defs><linearGradient id="g${fill.replace('#','')}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${fill}" stop-opacity=".95"/><stop offset="1" stop-color="#160f0a"/></linearGradient></defs>
        <path d="M50 4 L92 16 V60 Q92 96 50 116 Q8 96 8 60 V16 Z" fill="url(#g${fill.replace('#','')})" stroke="#c9a227" stroke-width="3"/>
        <path d="M50 4 L92 16 V60 Q92 96 50 116 Q8 96 8 60 V16 Z" fill="none" stroke="#e7c65a" stroke-width="1" opacity=".6"/>
        <text x="50" y="70" font-size="40" text-anchor="middle" fill="#e7c65a" font-family="Cinzel,serif">${charge}</text></svg>`;
    }

    function renderStatic(){
      document.getElementById('nav').innerHTML=[
        ['about','nav_about'],['skills','nav_courses'],['projects','nav_portfolio'],
        ['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');
      document.getElementById('greet').textContent=t(P.greeting);
      document.getElementById('name').textContent=t(P.name);
      document.getElementById('role').textContent=t(P.role);
      document.getElementById('tag').textContent=t(P.title);
      const cv=document.getElementById('cvBtn'); cv.href=t(P.cv); cv.querySelector('span').textContent=t(P.ui.download_cv);
      document.getElementById('ghBtn').href=P.contact.github;
      document.getElementById('portrait').src=P.avatar;
      document.getElementById('portrait2').src=P.avatarAlt;

      // crests from education + role
      const crestData=[
        {f:'#6d1f2c',c:'🦁',nm:'Courage',vl:t(P.role)},
        {f:'#1f4d3d',c:'🐍',nm:'Cunning',vl:'Agent · RAG'},
        {f:'#1f3a5c',c:'🦅',nm:'Wisdom',vl:t(P.education[0].degree)},
        {f:'#7a5a12',c:'🦡',nm:'Loyalty',vl:t(P.location)}
      ];
      document.getElementById('crests').innerHTML=crestData.map(d=>`
        <div class="crest">${shield(d.f,d.c)}<div class="nm">${esc(d.nm)}</div><div class="vl">${esc(d.vl)}</div></div>`).join('');

      document.getElementById('l-about').textContent=t(P.ui.about_me);
      document.getElementById('l-edu').textContent=t(P.ui.education_bg);
      document.getElementById('l-skills').textContent=t(P.ui.core_tech);
      document.getElementById('l-courses').textContent=t(P.ui.core_courses);
      document.getElementById('l-exp').textContent=t(P.ui.internship_exp);
      document.getElementById('l-projects').textContent=t(P.ui.latest_projects);
      document.getElementById('l-articles').textContent=t(P.ui.latest_articles);
      document.getElementById('l-certs').textContent=t(P.ui.certificates);
      document.getElementById('l-contact').textContent=t(P.ui.get_in_touch);

      document.getElementById('bio').innerHTML=P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('');
      document.getElementById('loc').innerHTML=`⚜ ${esc(t(P.location))}`;

      document.getElementById('edu').innerHTML=P.education.map(e=>`
        <div class="scroll"><div class="p">${esc(e.period)}</div>
        <h3>${esc(t(e.school))}</h3><div class="s">${esc(t(e.degree))} — ${esc(t(e.note))}</div></div>`).join('');

      document.getElementById('spells').innerHTML=P.skills.map((s,i)=>`
        <div class="spell"><div class="n">Incantation ${['I','II','III','IV','V','VI'][i]||i+1}</div><div class="v">${esc(s)}</div></div>`).join('');
      document.getElementById('tags').innerHTML=P.skillTags.map(x=>`<span>${esc(x)}</span>`).join('');

      document.getElementById('courses-box').innerHTML=P.courses.map(c=>`
        <div class="course"><i class="fa ${esc(c.icon)}"></i><h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');

      document.getElementById('exp').innerHTML=P.experience.map(x=>`
        <div class="scroll"><div class="p">${esc(x.period)}</div>
        <h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3>
        <div class="s">${esc(t(x.summary))}</div>
        <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div>`).join('');

      document.getElementById('certs').innerHTML=P.certificates.map(c=>`
        <div class="cert"><img src="${esc(c.image)}" alt="${esc(t(c.title))}" onerror="this.src='/index_page/img/blogs/1.jpg'">
        <div class="ct"><div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p><div class="seal">✦</div></div></div>`).join('');

      document.getElementById('cinfo').innerHTML=[
        ['Owl Post',P.contact.email,'mailto:'+P.contact.email],
        ['Floo',P.contact.phone,P.contact.phoneHref],
        ['GitHub','@'+P.contact.githubUser,P.contact.github],
        ['WeChat','QR ↗',P.contact.wechatQrPage]
      ].map(([k,v,h])=>`<a href="${esc(h)}"><span>${esc(k)}</span><span>${esc(v)}</span></a>`).join('');
      document.getElementById('cf-name').placeholder=t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder=t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder=t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent=t(P.ui.send);

      document.getElementById('fsoc').innerHTML=`
        <a href="${P.contact.github}" target="_blank" rel="noopener">GitHub</a>
        <a href="mailto:${P.contact.email}">Owl</a>
        <a href="${P.contact.wechatQrPage}">WeChat</a>
        <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent=t(P.ui.footer_desc);
      const icp=document.getElementById('foot-icp'); icp.textContent=P.icp; icp.href=P.icpUrl;

      document.getElementById('filters').innerHTML=P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box=document.getElementById('projects-box');
      if(!projects.length){ box.innerHTML=`<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML=projects.map(p=>`
        <a class="card" href="${esc(p.href)}">
          <div class="cbody">
            <div class="ctag"><span>${esc(t(P.ui.tech_stack))}</span><span>${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <p class="tech">${esc(p.tech_stack||'')}</p>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div></a>`).join('');
    }
    function renderArticles(){
      const box=document.getElementById('articles-box');
      const list=CJCData.filterArticles(articles,filterKey);
      if(!list.length){ box.innerHTML=`<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML=list.map(a=>`
        <a class="card" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
          <div class="cbody">
            <div class="ctag"><span>${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div></a>`).join('');
    }
    async function loadDynamic(){
      try{ projects=await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-box').innerHTML=`<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles=await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-box').innerHTML=`<div class="load-note">⚠ Failed to load articles.</div>`; }
    }

    document.getElementById('cf').addEventListener('submit',async(e)=>{
      e.preventDefault();
      const f=e.target,s=document.getElementById('cf-status');
      s.style.color='var(--mut)'; s.textContent=t(P.ui.sending);
      try{ const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});
        s.style.color='var(--gold2)'; s.textContent=r.message||'The owl has flown.'; f.reset(); }
      catch(err){ s.style.color='var(--burg2)'; s.textContent=err.message; }
    });

    document.addEventListener('DOMContentLoaded',()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({accent:'#c9a227'});
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

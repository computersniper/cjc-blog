<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Notion</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{
      --bg:#ffffff;
      --sidebar:#fbfbfa;
      --text:#37352f;
      --text-2:rgba(55,53,47,.65);
      --text-3:rgba(55,53,47,.45);
      --hover:rgba(55,53,47,.06);
      --hover-2:rgba(55,53,47,.08);
      --line:rgba(55,53,47,.12);
      --line-2:rgba(55,53,47,.16);
      --callout:#f7f6f3;
      --accent:#2f6fed;
      --accent-soft:rgba(47,111,237,.10);
      --accent-line:rgba(47,111,237,.30);
      --sidebar-w:264px;
      --doc:820px;
      --radius:8px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;line-height:1.6;font-size:16px;
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
    ::selection{background:var(--accent-soft)}

    /* ======================= SIDEBAR ======================= */
    .sidebar{
      position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--sidebar);
      border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:1000;
      overflow-y:auto;padding:10px 8px 16px;transition:transform .22s ease;
    }
    .ws-head{display:flex;align-items:center;gap:9px;padding:8px 8px 8px;border-radius:6px;margin-bottom:6px}
    .ws-head:hover{background:var(--hover)}
    .ws-avatar{width:24px;height:24px;border-radius:6px;object-fit:cover;flex:none;box-shadow:0 0 0 1px var(--line-2)}
    .ws-name{font-weight:600;font-size:15px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ws-chev{margin-left:auto;color:var(--text-3);font-size:11px}
    .side-search{display:flex;align-items:center;gap:8px;padding:6px 8px;margin:2px 0 12px;border-radius:6px;
      color:var(--text-2);font-size:13.5px;cursor:default}
    .side-search:hover{background:var(--hover)}
    .nav-group-label{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--text-3);
      text-transform:uppercase;padding:6px 8px 4px}
    .nav-list{list-style:none;margin:0 0 6px;padding:0}
    .nav-item{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:6px;
      font-size:14px;color:var(--text-2);cursor:pointer;line-height:1.3}
    .nav-item .emo{width:20px;text-align:center;font-size:15px;flex:none}
    .nav-item:hover{background:var(--hover);color:var(--text)}
    .nav-item.active{background:var(--hover-2);color:var(--text);font-weight:500}
    .side-foot{margin-top:auto;padding:10px 8px 2px;border-top:1px solid var(--line)}
    .side-foot a{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:6px;
      font-size:13.5px;color:var(--text-2)}
    .side-foot a:hover{background:var(--hover);color:var(--text)}

    /* ======================= MOBILE TOPBAR ======================= */
    .topbar{display:none;position:sticky;top:0;z-index:900;background:rgba(255,255,255,.9);
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
      height:48px;align-items:center;gap:10px;padding:0 12px}
    .hamb{width:34px;height:34px;border:none;background:transparent;border-radius:6px;cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;font-size:17px;color:var(--text)}
    .hamb:hover{background:var(--hover)}
    .topbar .tb-brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
    .topbar .tb-brand img{width:22px;height:22px;border-radius:5px;object-fit:cover}
    .scrim{display:none;position:fixed;inset:0;background:rgba(15,15,15,.35);z-index:999}

    /* ======================= DOCUMENT ======================= */
    .main{margin-left:var(--sidebar-w)}
    .doc{max-width:var(--doc);margin:0 auto;padding:0 clamp(20px,5vw,60px) 90px}

    .cover{height:170px;margin:0 calc(-1 * clamp(20px,5vw,60px));
      background:linear-gradient(120deg,#eef2fb 0%,#e7ecf9 40%,#f3eef7 100%)}
    .page-icon{font-size:66px;line-height:1;margin-top:-46px;margin-bottom:4px;
      filter:drop-shadow(0 2px 3px rgba(0,0,0,.08))}

    .crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--text-2);
      font-size:13.5px;padding:14px 0 0}
    .crumbs .sep{color:var(--text-3)}
    .crumbs .here{color:var(--text)}
    .crumbs a:hover{text-decoration:underline}

    .kicker{color:var(--text-2);font-size:15px;font-weight:500;margin:2px 0 6px}
    h1.title{font-size:clamp(30px,5.4vw,42px);font-weight:700;letter-spacing:-.02em;
      line-height:1.12;margin:0 0 10px}
    .lede{font-size:clamp(17px,2.2vw,20px);color:var(--text);font-weight:500;margin:0 0 18px;max-width:60ch}

    /* Notion "properties" rows */
    .props{margin:6px 0 18px;max-width:560px}
    .prop{display:grid;grid-template-columns:26px 130px 1fr;align-items:start;gap:6px;
      padding:5px 6px;border-radius:5px;font-size:14.5px}
    .prop:hover{background:var(--hover)}
    .prop .pe{text-align:center}
    .prop .pn{color:var(--text-2);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .prop .pv{color:var(--text);font-weight:500}

    .cta-row{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 8px}
    .btn{display:inline-flex;align-items:center;gap:8px;border-radius:6px;font-size:14px;font-weight:500;
      padding:8px 14px;cursor:pointer;border:1px solid var(--line-2);background:#fff;color:var(--text);
      transition:background .15s,border-color .15s,box-shadow .15s}
    .btn:hover{background:var(--hover)}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn.primary:hover{background:#255fd6;box-shadow:0 3px 10px rgba(47,111,237,.28)}

    hr.div{border:none;border-top:1px solid var(--line);margin:34px 0}

    /* Section headers with emoji */
    section{scroll-margin-top:64px}
    .h2{display:flex;align-items:center;gap:10px;font-size:clamp(21px,3vw,27px);font-weight:600;
      letter-spacing:-.01em;margin:38px 0 14px}
    .h2 .emo{font-size:.95em}
    .h3{font-size:16px;font-weight:600;margin:22px 0 8px}

    p.block{margin:0 0 14px;max-width:70ch}

    /* Callout */
    .callout{display:flex;gap:12px;background:var(--callout);border-radius:6px;padding:16px 16px;
      margin:14px 0;border:1px solid rgba(55,53,47,.06)}
    .callout.accent{background:var(--accent-soft);border-color:var(--accent-line)}
    .callout .ce{font-size:20px;line-height:1.5;flex:none}
    .callout .ct{min-width:0}
    .callout .ct p{margin:0 0 10px}
    .callout .ct p:last-child{margin:0}

    /* About media */
    .about-media{display:flex;gap:22px;align-items:flex-start;margin:16px 0;flex-wrap:wrap}
    .about-media figure{margin:0;flex:none;width:200px}
    .about-media img{width:200px;height:200px;object-fit:cover;border-radius:10px;box-shadow:0 1px 0 var(--line-2),0 8px 24px rgba(15,15,15,.10)}
    .about-media figcaption{color:var(--text-3);font-size:12.5px;margin-top:8px;text-align:center}
    .about-media .about-copy{flex:1;min-width:240px}

    /* List rows (education / experience) */
    .rows{margin:6px 0}
    .lrow{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:12px 10px;border-radius:6px;
      border-bottom:1px solid var(--line)}
    .lrow:hover{background:var(--hover)}
    .lrow .lt{font-weight:600;font-size:15.5px}
    .lrow .ls{color:var(--text-2);font-size:14px;margin-top:2px}
    .lrow .when{color:var(--accent);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
    @media(max-width:520px){.lrow{grid-template-columns:1fr}.lrow .when{justify-self:start}}

    /* Bullets */
    ul.nlist{list-style:none;margin:8px 0;padding:0}
    ul.nlist li{position:relative;padding:5px 0 5px 24px;font-size:15px;max-width:70ch}
    ul.nlist li::before{content:"•";position:absolute;left:6px;top:4px;color:var(--text);font-size:18px;line-height:1}

    /* Tags / chips */
    .chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 4px}
    .chip{font-size:13px;padding:2px 9px;border-radius:5px;background:var(--hover-2);color:var(--text);line-height:1.7}
    .chip.blue{background:var(--accent-soft);color:#1f4fb0}

    /* Courses grid */
    .courses{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
    .course{background:#fff;border:1px solid var(--line-2);border-radius:var(--radius);padding:15px 16px;
      transition:box-shadow .15s,border-color .15s}
    .course:hover{box-shadow:0 4px 14px rgba(15,15,15,.07);border-color:var(--line)}
    .course .ci{color:var(--accent);font-size:18px;margin-bottom:8px}
    .course h4{margin:0 0 6px;font-size:15.5px;font-weight:600;line-height:1.3}
    .course p{margin:0;color:var(--text-2);font-size:13.5px;line-height:1.55}
    @media(max-width:600px){.courses{grid-template-columns:1fr}}

    /* ======================= DATABASE ======================= */
    .db-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);
      margin:10px 0 4px}
    .views{display:flex;gap:2px}
    .view-tab{display:inline-flex;align-items:center;gap:6px;padding:7px 8px;font-size:14px;color:var(--text-2);
      background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;margin-bottom:-1px}
    .view-tab:hover{color:var(--text)}
    .view-tab.active{color:var(--text);font-weight:500;border-bottom-color:var(--text)}
    .db-count{margin-left:auto;color:var(--text-3);font-size:13px}

    .db-toolbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:10px 0 4px}
    .filter-btn{font-size:13px;padding:4px 11px;border-radius:6px;border:1px solid var(--line-2);
      background:#fff;color:var(--text-2);cursor:pointer;font-family:inherit;transition:.15s}
    .filter-btn:hover{background:var(--hover);color:var(--text)}
    .filter-btn.active{background:var(--accent-soft);border-color:var(--accent-line);color:#1f4fb0;font-weight:500}

    /* Gallery */
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:14px 0}
    .g-card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line-2);border-radius:10px;
      overflow:hidden;transition:box-shadow .15s,transform .15s,border-color .15s}
    .g-card:hover{box-shadow:0 8px 22px rgba(15,15,15,.10);transform:translateY(-2px);border-color:var(--line)}
    .g-cover{height:130px;background:var(--callout);overflow:hidden;border-bottom:1px solid var(--line)}
    .g-cover img{width:100%;height:100%;object-fit:cover}
    .g-body{padding:12px 13px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
    .g-body .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--text-3)}
    .g-body h4{margin:0;font-size:15px;font-weight:600;line-height:1.3}
    .g-body p{margin:0;color:var(--text-2);font-size:13.5px;line-height:1.5;flex:1}
    .g-more{color:var(--accent);font-size:13px;font-weight:500}

    /* Table */
    .table-wrap{overflow-x:auto;margin:14px 0;border:1px solid var(--line-2);border-radius:8px}
    table.db{width:100%;border-collapse:collapse;min-width:520px;font-size:14px}
    table.db th{text-align:left;font-weight:500;color:var(--text-2);font-size:12.5px;padding:9px 14px;
      border-bottom:1px solid var(--line-2);background:var(--callout);white-space:nowrap}
    table.db td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
    table.db tr:last-child td{border-bottom:none}
    table.db tbody tr:hover{background:var(--hover)}
    table.db td.name a{font-weight:600}
    table.db td.name a:hover{text-decoration:underline}
    table.db .t-date{color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}

    /* Certificates */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
    .cert{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;
      transition:box-shadow .15s}
    .cert:hover{box-shadow:0 6px 18px rgba(15,15,15,.08)}
    .cert img{width:100%;height:150px;object-fit:cover;border-bottom:1px solid var(--line)}
    .cert .cbody{padding:13px 14px}
    .cert .cmeta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--accent);font-weight:500}
    .cert h4{margin:6px 0 5px;font-size:15px;font-weight:600;line-height:1.3}
    .cert p{margin:0;color:var(--text-2);font-size:13px;line-height:1.5}
    @media(max-width:600px){.certs{grid-template-columns:1fr}}

    /* Contact */
    .contact-props{margin:12px 0}
    .contact-props a{display:grid;grid-template-columns:26px 120px 1fr;gap:6px;align-items:center;
      padding:8px 8px;border-radius:6px;border-bottom:1px solid var(--line);font-size:14.5px}
    .contact-props a:hover{background:var(--hover)}
    .contact-props .pe{text-align:center}
    .contact-props .pn{color:var(--text-2);font-size:13.5px}
    .contact-props .pv{color:var(--accent);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    form.cf{margin:16px 0 0;max-width:560px}
    form.cf label{display:block;font-size:13px;color:var(--text-2);margin:12px 0 5px;font-weight:500}
    form.cf input,form.cf textarea{width:100%;background:#fff;border:1px solid var(--line-2);border-radius:6px;
      font-family:inherit;font-size:15px;padding:10px 12px;color:var(--text);transition:border-color .15s,box-shadow .15s}
    form.cf input:focus,form.cf textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    form.cf textarea{min-height:120px;resize:vertical}
    form.cf .submit{margin-top:16px}
    #cf-status{margin:12px 0 0;font-size:14px;font-weight:500}
    .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

    /* Footer */
    footer{border-top:1px solid var(--line);margin-top:40px;padding:26px 0 8px;color:var(--text-2);font-size:13.5px}
    .foot-row{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-bottom:12px}
    .foot-row a:hover{color:var(--text);text-decoration:underline}
    .foot-brand{font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px}
    .foot-brand img{width:20px;height:20px;border-radius:5px;object-fit:cover}
    .foot-meta{color:var(--text-3);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
    .foot-meta a:hover{color:var(--text);text-decoration:underline}

    .load-note{color:var(--text-2);font-size:14px;padding:16px;background:var(--callout);border-radius:8px;margin:14px 0}

    /* ======================= RESPONSIVE ======================= */
    @media(max-width:900px){
      .sidebar{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.18)}
      body.nav-open .sidebar{transform:translateX(0)}
      body.nav-open .scrim{display:block}
      .main{margin-left:0}
      .topbar{display:flex}
    }
    @media(prefers-reduced-motion:reduce){
      *{scroll-behavior:auto !important;transition:none !important;animation:none !important}
      .g-card:hover{transform:none}
    }
  </style>
</head>
<body>
  <!-- ===== Mobile topbar ===== -->
  <div class="topbar">
    <button class="hamb" id="hamb" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
    <a class="tb-brand" href="#top"><img id="tb-avatar" alt="" /><span id="tb-brand"></span></a>
  </div>
  <div class="scrim" id="scrim"></div>

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar" id="sidebar" aria-label="Workspace navigation">
    <div class="ws-head">
      <img class="ws-avatar" id="ws-avatar" alt="" />
      <span class="ws-name" id="ws-name"></span>
      <span class="ws-chev" aria-hidden="true">⌄</span>
    </div>
    <div class="side-search"><span aria-hidden="true">🔍</span><span id="side-search-label"></span></div>
    <div class="nav-group-label" id="nav-group-label"></div>
    <ul class="nav-list" id="nav-list"></ul>
    <div class="side-foot">
      <a href="/admin.html" id="side-admin"><span aria-hidden="true">⚙️</span><span id="side-admin-label"></span></a>
    </div>
  </aside>

  <!-- ===== Main document ===== -->
  <main class="main">
    <div id="top"></div>
    <div class="doc">
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <div class="cover" aria-hidden="true"></div>
      <div class="page-icon" aria-hidden="true">👋</div>

      <!-- Hero -->
      <header>
        <div class="kicker" id="greet"></div>
        <h1 class="title" id="name"></h1>
        <p class="lede" id="headline"></p>
        <div class="props" id="hero-props"></div>
        <div class="cta-row" id="hero-cta"></div>
      </header>

      <hr class="div" />

      <!-- About -->
      <section id="about">
        <h2 class="h2"><span class="emo" aria-hidden="true">👋</span><span id="l-about"></span></h2>
        <div id="about-body"></div>
      </section>

      <!-- Education -->
      <section id="education">
        <h2 class="h2"><span class="emo" aria-hidden="true">🎓</span><span id="l-edu"></span></h2>
        <div class="rows" id="edu-list"></div>
      </section>

      <!-- Skills -->
      <section id="skills">
        <h2 class="h2"><span class="emo" aria-hidden="true">🛠️</span><span id="l-skills"></span></h2>
        <ul class="nlist" id="skills-list"></ul>
        <div class="chips" id="skill-tags"></div>
      </section>

      <!-- Courses -->
      <section id="courses">
        <h2 class="h2"><span class="emo" aria-hidden="true">📚</span><span id="l-courses"></span></h2>
        <div class="courses" id="courses-list"></div>
      </section>

      <!-- Experience -->
      <section id="experience">
        <h2 class="h2"><span class="emo" aria-hidden="true">💼</span><span id="l-exp"></span></h2>
        <div id="exp-list"></div>
      </section>

      <!-- Projects (database) -->
      <section id="projects">
        <h2 class="h2"><span class="emo" aria-hidden="true">🚀</span><span id="l-projects"></span></h2>
        <div class="db-head">
          <div class="views" id="proj-views"></div>
          <span class="db-count" id="proj-count"></span>
        </div>
        <div id="projects-list"><div class="load-note" id="proj-load"></div></div>
      </section>

      <!-- Articles (database) -->
      <section id="articles">
        <h2 class="h2"><span class="emo" aria-hidden="true">✍️</span><span id="l-articles"></span></h2>
        <div class="db-head">
          <div class="views" id="art-views"></div>
          <span class="db-count" id="art-count"></span>
        </div>
        <div class="db-toolbar" id="filters"></div>
        <div id="articles-list"><div class="load-note" id="art-load"></div></div>
      </section>

      <!-- Certificates -->
      <section id="certificates">
        <h2 class="h2"><span class="emo" aria-hidden="true">🏆</span><span id="l-certs"></span></h2>
        <div class="certs" id="certs-list"></div>
      </section>

      <!-- Contact -->
      <section id="contact">
        <h2 class="h2"><span class="emo" aria-hidden="true">✉️</span><span id="l-contact"></span></h2>
        <div class="callout accent"><span class="ce" aria-hidden="true">💬</span><div class="ct"><p id="contact-note"></p></div></div>
        <div class="contact-props" id="contact-info"></div>
        <form class="cf" id="cf" novalidate>
          <div class="hp" aria-hidden="true"><label>Leave this empty<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
          <label for="cf-name" id="lb-name"></label>
          <input type="text" name="name" id="cf-name" required autocomplete="name" />
          <label for="cf-email" id="lb-email"></label>
          <input type="email" name="email" id="cf-email" required autocomplete="email" />
          <label for="cf-msg" id="lb-msg"></label>
          <textarea name="message" id="cf-msg" required></textarea>
          <div class="submit"><button type="submit" class="btn primary" id="cf-send"></button></div>
          <p id="cf-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <!-- Footer -->
      <footer>
        <div class="foot-row">
          <a class="foot-brand" href="#top"><img id="foot-avatar" alt="" /><span id="foot-brand"></span></a>
          <div class="foot-row" id="foot-social" style="margin:0"></div>
        </div>
        <div class="foot-meta">
          <span id="foot-desc"></span>
          <a id="foot-icp" target="_blank" rel="noopener"></a>
        </div>
      </footer>
    </div>
  </main>

  <script>window.THEME_ID = "18-notion";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";
    let projView = "gallery", artView = "gallery";

    // Sidebar nav model: [sectionId, emoji, ui-key]
    const NAV = [
      ["top","🏠","nav_home"],
      ["about","👋","nav_about"],
      ["education","🎓","education_bg"],
      ["skills","🛠️","core_tech"],
      ["courses","📚","nav_courses"],
      ["experience","💼","nav_internship"],
      ["projects","🚀","nav_portfolio"],
      ["articles","✍️","nav_article"],
      ["certificates","🏆","nav_certificate"],
      ["contact","✉️","nav_contact"],
    ];

    // Normalize a possibly-bare cover path to a root-absolute URL.
    function coverSrc(raw){
      const s = (raw||"").trim();
      if(!s) return "/index_page/img/blogs/1.jpg";
      if(/^(https?:|data:|\/)/i.test(s)) return s;
      return "/" + s.replace(/^\.?\//,"");
    }

    function renderStatic(){
      document.title = "Cai Jiechao — Notion · " + t(P.name);

      // --- Workspace / sidebar chrome ---
      const av = P.avatar;
      ["ws-avatar","tb-avatar","foot-avatar"].forEach(id=>{ const el=document.getElementById(id); el.src=av; el.alt=t(P.name); });
      document.getElementById("ws-name").textContent = P.brand;
      document.getElementById("tb-brand").textContent = P.brand;
      document.getElementById("foot-brand").textContent = P.brand;
      document.getElementById("side-search-label").textContent = (CJCData.lang()==="zh"?"搜索":"Search");
      document.getElementById("nav-group-label").textContent = (CJCData.lang()==="zh"?"工作区":"Workspace");
      document.getElementById("side-admin-label").textContent = t(P.ui.admin_panel);

      // --- Sidebar nav items ---
      document.getElementById("nav-list").innerHTML = NAV.map(([id,emo,key])=>
        `<li class="nav-item" data-target="${id}" tabindex="0" role="link">
           <span class="emo" aria-hidden="true">${emo}</span><span>${esc(t(P.ui[key]))}</span></li>`).join("");
      document.querySelectorAll(".nav-item").forEach(el=>{
        const go=()=>{ const s=document.getElementById(el.dataset.target); if(s) s.scrollIntoView({behavior:"smooth"}); closeNav(); };
        el.addEventListener("click", go);
        el.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); }});
      });

      // --- Breadcrumb ---
      document.getElementById("crumbs").innerHTML =
        `<a href="#top">🏠 ${esc(t(P.ui.nav_home))}</a><span class="sep">/</span><span class="here">${esc(t(P.name))}</span>`;

      // --- Hero ---
      document.getElementById("greet").textContent = t(P.greeting);
      document.getElementById("name").textContent = t(P.name);
      document.getElementById("headline").textContent = t(P.headline);
      const zhH = CJCData.lang()==="zh";
      document.getElementById("hero-props").innerHTML = [
        ["💼", (zhH?"角色":"Role"), t(P.role)],
        ["🎯", (zhH?"简介":"Bio"), t(P.title)],
        ["📍", (zhH?"位置":"Location"), t(P.location)],
      ].map(([e,n,v])=>
        `<div class="prop"><span class="pe" aria-hidden="true">${e}</span><span class="pn">${esc(n)}</span><span class="pv">${esc(v)}</span></div>`).join("");
      document.getElementById("hero-cta").innerHTML =
        `<a class="btn primary" href="${esc(t(P.cv))}" download><span aria-hidden="true">⬇</span>${esc(t(P.ui.download_cv))}</a>
         <a class="btn" href="${esc(P.contact.github)}" target="_blank" rel="noopener"><span aria-hidden="true"><i class="fa fa-github"></i></span>GitHub</a>`;

      // --- Section labels ---
      document.getElementById("l-about").textContent = t(P.ui.about_me);
      document.getElementById("l-edu").textContent = t(P.ui.education_bg);
      document.getElementById("l-skills").textContent = t(P.ui.core_tech);
      document.getElementById("l-courses").textContent = t(P.ui.core_courses);
      document.getElementById("l-exp").textContent = t(P.ui.internship_exp);
      document.getElementById("l-projects").textContent = t(P.ui.latest_projects);
      document.getElementById("l-articles").textContent = t(P.ui.latest_articles);
      document.getElementById("l-certs").textContent = t(P.ui.certificates);
      document.getElementById("l-contact").textContent = t(P.ui.get_in_touch);

      // --- About ---
      document.getElementById("about-body").innerHTML =
        `<div class="callout"><span class="ce" aria-hidden="true">🧑‍💻</span><div class="ct"><p>${esc(t(P.bio[0]))}</p></div></div>
         <div class="about-media">
           <figure>
             <img src="${esc(P.avatar)}" alt="${esc(t(P.name))} — ${esc(t(P.role))}" />
             <figcaption>📍 ${esc(t(P.location))}</figcaption>
           </figure>
           <div class="about-copy"><p class="block">${esc(t(P.bio[1]))}</p></div>
         </div>`;

      // --- Education ---
      document.getElementById("edu-list").innerHTML = P.education.map(e=>
        `<div class="lrow">
           <div><div class="lt">🎓 ${esc(t(e.school))}</div>
             <div class="ls">${esc(t(e.degree))} · ${esc(t(e.note))}</div></div>
           <div class="when">${esc(e.period)}</div>
         </div>`).join("");

      // --- Skills ---
      document.getElementById("skills-list").innerHTML = P.skills.map(s=>`<li>${esc(s)}</li>`).join("");
      document.getElementById("skill-tags").innerHTML = P.skillTags.map((tag,i)=>
        `<span class="chip${i%3===0?" blue":""}">${esc(tag)}</span>`).join("");

      // --- Courses ---
      document.getElementById("courses-list").innerHTML = P.courses.map(c=>
        `<div class="course"><div class="ci"><i class="fa ${esc(c.icon)}" aria-hidden="true"></i></div>
           <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join("");

      // --- Experience ---
      document.getElementById("exp-list").innerHTML = P.experience.map(x=>
        `<div class="lrow" style="margin-bottom:6px">
           <div><div class="lt">${esc(t(x.role))} · ${esc(t(x.company))}</div></div>
           <div class="when">${esc(x.period)}</div>
         </div>
         <div class="callout"><span class="ce" aria-hidden="true">🏢</span><div class="ct"><p>${esc(t(x.summary))}</p></div></div>
         <ul class="nlist">${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join("")}</ul>`).join("");

      // --- Certificates ---
      document.getElementById("certs-list").innerHTML = P.certificates.map(c=>
        `<div class="cert">
           <img src="${esc(c.image)}" alt="${esc(t(c.title))}" loading="lazy" />
           <div class="cbody">
             <div class="cmeta"><span>🏆 ${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
             <h4>${esc(t(c.title))}</h4>
             <p>${esc(t(c.desc))}</p>
           </div>
         </div>`).join("");

      // --- Contact ---
      document.getElementById("contact-note").textContent = t(P.ui.inbox_open);
      document.getElementById("contact-info").innerHTML = [
        ["✉️","Email", P.contact.email, "mailto:"+P.contact.email],
        ["📞","Phone", P.contact.phone, P.contact.phoneHref],
        ["🐙","GitHub", "@"+P.contact.githubUser, P.contact.github],
        ["💬","WeChat", (CJCData.lang()==="zh"?"扫码添加":"Scan QR"), P.contact.wechatQrPage],
      ].map(([e,n,v,h])=>
        `<a href="${esc(h)}" target="_blank" rel="noopener">
           <span class="pe" aria-hidden="true">${e}</span><span class="pn">${esc(n)}</span><span class="pv">${esc(v)}</span></a>`).join("");
      document.getElementById("lb-name").textContent = t(P.ui.name_placeholder);
      document.getElementById("lb-email").textContent = t(P.ui.email_placeholder);
      document.getElementById("lb-msg").textContent = t(P.ui.msg_placeholder);
      document.getElementById("cf-name").placeholder = t(P.ui.name_placeholder);
      document.getElementById("cf-email").placeholder = t(P.ui.email_placeholder);
      document.getElementById("cf-msg").placeholder = t(P.ui.msg_placeholder);
      document.getElementById("cf-send").textContent = t(P.ui.send);

      // --- Footer ---
      document.getElementById("foot-social").innerHTML =
        `<a href="${esc(P.contact.github)}" target="_blank" rel="noopener">GitHub</a>
         <a href="mailto:${esc(P.contact.email)}">Email</a>
         <a href="${esc(P.contact.wechatQrPage)}" target="_blank" rel="noopener">WeChat</a>
         <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById("foot-desc").textContent = t(P.ui.footer_desc);
      const icp = document.getElementById("foot-icp"); icp.textContent = P.icp; icp.href = P.icpUrl;

      // --- Database view tabs ---
      renderViewTabs();

      // --- Article filters ---
      document.getElementById("filters").innerHTML = P.articleFilters.map(f=>
        `<button class="filter-btn ${f.key===filterKey?"active":""}" data-k="${esc(f.key)}">${esc(t(f.label))}</button>`).join("");
      document.querySelectorAll("#filters .filter-btn").forEach(b=>b.addEventListener("click",()=>{
        filterKey=b.dataset.k;
        document.querySelectorAll("#filters .filter-btn").forEach(x=>x.classList.toggle("active",x.dataset.k===filterKey));
        renderArticles();
      }));
    }

    function viewLabel(v){
      const zh = CJCData.lang()==="zh";
      return v==="gallery" ? (zh?"画廊":"Gallery") : (zh?"表格":"Table");
    }
    function renderViewTabs(){
      const tabs = (active)=>["gallery","table"].map(v=>
        `<button class="view-tab ${v===active?"active":""}" data-v="${v}">
           <span aria-hidden="true">${v==="gallery"?"🖼":"▦"}</span>${viewLabel(v)}</button>`).join("");
      const pv=document.getElementById("proj-views"); pv.innerHTML=tabs(projView);
      pv.querySelectorAll(".view-tab").forEach(b=>b.addEventListener("click",()=>{ projView=b.dataset.v; renderViewTabs(); renderProjects(); }));
      const av=document.getElementById("art-views"); av.innerHTML=tabs(artView);
      av.querySelectorAll(".view-tab").forEach(b=>b.addEventListener("click",()=>{ artView=b.dataset.v; renderViewTabs(); renderArticles(); }));
    }

    // ---------------- Projects ----------------
    function renderProjects(){
      const box = document.getElementById("projects-list");
      document.getElementById("proj-count").textContent = projects.length ? (projects.length+" "+(CJCData.lang()==="zh"?"项":"items")) : "";
      if(!projects.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      if(projView==="table"){
        const zh=CJCData.lang()==="zh";
        box.innerHTML =
          `<div class="table-wrap"><table class="db"><thead><tr>
             <th>${esc(t(P.ui.latest_projects))}</th><th>${esc(t(P.ui.tech_stack))}</th><th>${esc(zh?"日期":"Date")}</th>
           </tr></thead><tbody>` +
          projects.map(p=>
            `<tr><td class="name"><a href="${esc(p.href)}">🚀 ${esc(p.localTitle())}</a></td>
               <td>${esc(p.tech_stack||"—")}</td><td class="t-date">${esc(p.dateText())}</td></tr>`).join("") +
          `</tbody></table></div>`;
        return;
      }
      box.innerHTML = `<div class="gallery">` + projects.map(p=>
        `<a class="g-card" href="${esc(p.href)}">
           <div class="g-body">
             <div class="meta"><span>🚀 ${esc(t(P.ui.view_project))}</span><span>${esc(p.dateText())}</span></div>
             <h4>${esc(p.localTitle())}</h4>
             <p>${esc(p.localSummary()||"")}</p>
             ${p.tech_stack?`<div class="chips">${p.tech_stack.split(/[,，]/).slice(0,4).map(x=>`<span class="chip">${esc(x.trim())}</span>`).join("")}</div>`:""}
             <span class="g-more">${esc(t(P.ui.view_project))} →</span>
           </div></a>`).join("") + `</div>`;
    }

    // ---------------- Articles ----------------
    function renderArticles(){
      const box = document.getElementById("articles-list");
      const list = CJCData.filterArticles(articles, filterKey);
      document.getElementById("art-count").textContent = articles.length ? (list.length+" / "+articles.length) : "";
      if(!list.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      if(artView==="table"){
        const zh=CJCData.lang()==="zh";
        box.innerHTML =
          `<div class="table-wrap"><table class="db"><thead><tr>
             <th>${esc(t(P.ui.latest_articles))}</th><th>${esc(zh?"分类":"Category")}</th><th>${esc(zh?"日期":"Date")}</th>
           </tr></thead><tbody>` +
          list.map(a=>
            `<tr><td class="name"><a href="${esc(a.href)}">✍️ ${esc(a.localTitle())}</a></td>
               <td>${a.category?`<span class="chip blue">${esc(a.category)}</span>`:"—"}</td>
               <td class="t-date">${esc(a.dateText())}</td></tr>`).join("") +
          `</tbody></table></div>`;
        return;
      }
      box.innerHTML = `<div class="gallery">` + list.map(a=>
        `<a class="g-card" href="${esc(a.href)}">
           <div class="g-cover"><img src="${esc(coverSrc(a.cover_image))}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${esc(a.localTitle())}" loading="lazy"></div>
           <div class="g-body">
             <div class="meta"><span>${a.category?esc(a.category):""}</span><span>${esc(a.dateText())}</span></div>
             <h4>${esc(a.localTitle())}</h4>
             <p>${esc(a.localSummary()||"")}</p>
             <span class="g-more">${esc(t(P.ui.read_more))} →</span>
           </div></a>`).join("") + `</div>`;
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById("projects-list").innerHTML =
        `<div class="load-note">⚠ ${esc(CJCData.lang()==="zh"?"内容加载失败 / Failed to load":"Failed to load projects.")}</div>`; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById("articles-list").innerHTML =
        `<div class="load-note">⚠ ${esc(CJCData.lang()==="zh"?"内容加载失败 / Failed to load":"Failed to load articles.")}</div>`; }
    }

    // ---------------- Contact submit ----------------
    document.getElementById("cf").addEventListener("submit", async (e)=>{
      e.preventDefault();
      const f=e.target, s=document.getElementById("cf-status");
      const payload={ name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color="var(--text-2)"; s.textContent=t(P.ui.sending);
      try{ const r=await CJCData.sendContact(payload); s.style.color="#1a7f43"; s.textContent=r.message||(CJCData.lang()==="zh"?"已发送！":"Message sent!"); f.reset(); }
      catch(err){ s.style.color="#d4380d"; s.textContent=err.message; }
    });

    // ---------------- Mobile nav toggle ----------------
    const hamb=document.getElementById("hamb");
    function openNav(){ document.body.classList.add("nav-open"); hamb.setAttribute("aria-expanded","true"); }
    function closeNav(){ document.body.classList.remove("nav-open"); hamb.setAttribute("aria-expanded","false"); }
    hamb.addEventListener("click",()=> document.body.classList.contains("nav-open")?closeNav():openNav());
    document.getElementById("scrim").addEventListener("click", closeNav);
    document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeNav(); });

    // ---------------- Scrollspy (active nav highlight) ----------------
    function initScrollSpy(){
      const map={};
      document.querySelectorAll(".nav-item").forEach(el=> map[el.dataset.target]=el);
      const ids=["about","education","skills","courses","experience","projects","articles","certificates","contact"];
      const io=new IntersectionObserver(entries=>{
        entries.forEach(en=>{
          if(en.isIntersecting){
            document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
            const cur=map[en.target.id]; if(cur) cur.classList.add("active");
          }
        });
      },{rootMargin:"-45% 0px -50% 0px",threshold:0});
      ids.forEach(id=>{ const s=document.getElementById(id); if(s) io.observe(s); });
    }

    document.addEventListener("DOMContentLoaded", ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:"#2f6fed" });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
      initScrollSpy();
    });
  })();
  </script>
</body>
</html>

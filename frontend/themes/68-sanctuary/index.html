<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Cai Jiechao — a warm, cinematic digital sanctuary.">
  <title>Cai Jiechao — Sanctuary</title>
  <style>
    :root{--bone:#ebe4d7;--cream:#f8f3e9;--ink:#272820;--olive:#5b604b;--ochre:#c99b27;--clay:#9e6951;--muted:#767366;--line:rgba(39,40,32,.19);--serif:Georgia,'Times New Roman',serif;--sans:Arial,'Helvetica Neue',sans-serif;--mono:'Courier New',monospace}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bone);color:var(--ink);font:15px/1.65 var(--sans);overflow-x:hidden}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}button{cursor:pointer}img{display:block;max-width:100%}.skip{position:fixed;z-index:99999;top:-60px;left:12px;padding:10px 15px;background:var(--ink);color:#fff}.skip:focus{top:12px}.shell{width:min(1260px,calc(100% - 56px));margin:auto}.eyebrow{font:700 9px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase}.nav-wrap{position:absolute;z-index:20;left:0;right:0;top:0;color:#f6f1e8}.topbar{height:80px;border-bottom:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:space-between;gap:30px}.brand{font:italic 400 28px/1 var(--serif)}.nav{display:flex;gap:24px}.nav a{font:700 9px var(--mono);letter-spacing:.1em;text-transform:uppercase}.nav a:hover{color:#f2c94c}
    .hero{min-height:100vh;position:relative;display:flex;align-items:center;overflow:hidden;background:#5b5041;color:#fff}.hero-bg{position:absolute;inset:-18px;background:url('/wansi/images/page-2-6.jpg') center 43%/cover no-repeat;filter:blur(4px) saturate(.7) sepia(.25);transform:scale(1.04)}.hero:before{content:'';position:absolute;z-index:1;inset:0;background:radial-gradient(circle at 50% 58%,rgba(222,181,64,.13),transparent 24%),linear-gradient(90deg,rgba(22,21,17,.58),rgba(31,28,21,.04) 38%,rgba(22,21,17,.5)),linear-gradient(0deg,rgba(20,19,16,.58),transparent 42%,rgba(20,19,16,.22))}.hero:after{content:'';position:absolute;z-index:2;inset:0;box-shadow:inset 0 0 150px rgba(15,14,11,.65);pointer-events:none}.amber-seat{position:absolute;z-index:3;left:50%;bottom:14%;transform:translateX(-50%);width:clamp(150px,16vw,240px);height:clamp(160px,19vw,285px);border-radius:48% 48% 23% 23% / 18% 18% 14% 14%;background:linear-gradient(145deg,#e3b52f,#b98718);box-shadow:0 45px 60px rgba(18,14,7,.36),inset 18px 0 35px rgba(255,236,142,.18),inset -18px 0 35px rgba(88,54,5,.22);opacity:.9;filter:blur(.4px)}.amber-seat:before{content:'';position:absolute;left:14%;right:14%;top:13%;bottom:31%;border-radius:44% 44% 25% 25%;border:1px solid rgba(255,239,167,.32)}.amber-seat:after{content:'';position:absolute;left:6%;right:6%;bottom:-10%;height:30%;background:#9a7016;border-radius:18px 18px 9px 9px;box-shadow:0 20px 22px rgba(0,0,0,.25)}.hero-content{position:relative;z-index:5;text-align:center;padding:130px 0 72px}.hero-content .kicker{margin-bottom:24px}.hero h1{font:italic 400 clamp(70px,11.5vw,172px)/.72 var(--serif);letter-spacing:-.08em;margin:0;text-shadow:0 6px 35px rgba(0,0,0,.25)}.hero-line{max-width:660px;margin:30px auto 0;font:italic 400 clamp(23px,3.2vw,47px)/1.03 var(--serif);letter-spacing:-.035em;text-wrap:balance}.hero-meta{position:absolute;z-index:5;left:28px;right:28px;bottom:24px;display:flex;justify-content:space-between;gap:25px;color:rgba(255,255,255,.78)}.hero-actions{display:flex;justify-content:center;gap:9px;margin-top:32px}.btn{display:inline-flex;align-items:center;min-height:43px;padding:11px 17px;border:1px solid currentColor;background:transparent;font:700 9px var(--mono);letter-spacing:.1em;text-transform:uppercase}.hero .btn:first-child{background:rgba(245,238,225,.94);border-color:transparent;color:var(--ink)}.btn:hover{background:var(--ochre);border-color:var(--ochre);color:var(--ink)}
    section{padding:110px 0;border-bottom:1px solid var(--line)}.section-head{display:grid;grid-template-columns:145px 1fr;gap:30px;margin-bottom:52px}.section-head h2{font:italic 400 clamp(50px,7.2vw,105px)/.8 var(--serif);letter-spacing:-.065em;margin:0}.section-head p{max-width:480px;color:var(--muted);margin:18px 0 0}.chapter{color:var(--clay)}.about-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:7vw;align-items:center}.portrait{position:relative;aspect-ratio:4/5;margin:0;overflow:hidden;border-radius:50% 50% 16px 16px / 25% 25% 16px 16px;background:#cabfab}.portrait img{width:100%;height:100%;object-fit:cover;filter:saturate(.65) sepia(.12)}.portrait:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(74,55,35,.35),transparent 45%)}.portrait figcaption{position:absolute;z-index:1;left:22px;bottom:18px;color:#fff}.about-copy blockquote{font:italic 400 clamp(28px,3.5vw,49px)/1.08 var(--serif);letter-spacing:-.035em;margin:0}.about-copy blockquote span{color:var(--clay)}.about-copy p{max-width:610px;color:var(--muted);margin:25px 0 0}.education{background:var(--olive);color:#f4eee2}.education .section-head p{color:#c7c7b6}.edu-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.edu{min-height:245px;border:1px solid rgba(255,255,255,.28);padding:25px;display:flex;flex-direction:column;justify-content:space-between;background:rgba(255,255,255,.04);backdrop-filter:blur(6px)}.edu h3{font:italic 400 clamp(30px,3vw,43px)/.95 var(--serif);margin:0 0 13px}.edu p{margin:0;color:#d0d0c0}.edu time{color:#e0bb55}.practice-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px}.skills{display:flex;gap:8px;flex-wrap:wrap;align-content:start}.skills span{padding:9px 12px;border:1px solid var(--line);border-radius:100px;background:rgba(255,255,255,.24);font:700 9px var(--mono);letter-spacing:.07em;text-transform:uppercase}.courses{border-top:1px solid var(--line)}.course{display:grid;grid-template-columns:38px 1fr;gap:14px;padding:17px 0;border-bottom:1px solid var(--line)}.course h3{font:italic 400 25px/1 var(--serif);margin:0 0 7px}.course p{font-size:12px;color:var(--muted);margin:0}.course-num{color:var(--ochre)}.experience{background:#d7cbbc}.experience-card{position:relative;display:grid;grid-template-columns:145px 1fr;gap:30px;padding:30px;border:1px solid var(--line);background:rgba(248,243,233,.45);box-shadow:22px 22px 45px rgba(69,57,42,.08)}.experience-card h3{font:italic 400 clamp(40px,5vw,70px)/.86 var(--serif);letter-spacing:-.05em;margin:0 0 17px}.experience-card p{max-width:720px}.experience-card ul{columns:2;gap:34px;list-style:none;padding:0;margin:28px 0 0}.experience-card li{font-size:12px;padding:10px 0;border-top:1px solid var(--line)}.experience-card li:before{content:'—';color:var(--clay);margin-right:7px}
    .project-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.project{border-radius:150px 150px 10px 10px;overflow:hidden;background:var(--cream);border:1px solid var(--line);transition:.3s}.project:hover{transform:translateY(-7px);box-shadow:0 25px 45px rgba(54,45,31,.12)}.project-image{height:230px;margin:0;overflow:hidden}.project-image img{width:100%;height:100%;object-fit:cover;filter:saturate(.7) sepia(.08);transition:.5s}.project:hover img{transform:scale(1.04)}.project-copy{padding:22px 22px 25px}.project h3,.article h3{font:italic 400 29px/1 var(--serif);letter-spacing:-.035em;margin:13px 0 9px}.project p,.article p{font-size:12px;color:var(--muted);margin:0}.tags{margin-top:17px;color:var(--clay)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:-20px 0 30px}.filters button{padding:8px 12px;border:1px solid var(--line);border-radius:100px;background:transparent;color:var(--ink);font:700 9px var(--mono);text-transform:uppercase}.filters button.active,.filters button:hover{background:var(--olive);border-color:var(--olive);color:#fff}.article-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.article{padding:15px;background:rgba(248,243,233,.65);border:1px solid var(--line)}.article img{width:100%;height:180px;object-fit:cover;margin:13px 0 16px;filter:saturate(.72)}.more{display:inline-block;margin-top:16px;color:var(--clay);font:700 9px var(--mono);text-transform:uppercase;letter-spacing:.08em}.cert-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.certificate{display:grid;grid-template-columns:145px 1fr;gap:18px;padding:15px;border:1px solid var(--line);background:rgba(248,243,233,.62)}.certificate img{width:100%;height:135px;object-fit:cover}.certificate h3{font:italic 400 26px/1 var(--serif);margin:12px 0 7px}.certificate p{font-size:12px;color:var(--muted);margin:0}
    .contact{background:#303329;color:#f4eee2}.contact .section-head p{color:#b8baaa}.contact-grid{display:grid;grid-template-columns:.82fr 1.18fr;gap:9vw}.contact-quote{font:italic 400 clamp(35px,5vw,70px)/.94 var(--serif);letter-spacing:-.045em;margin:0}.contact-links{margin-top:32px;border-top:1px solid rgba(255,255,255,.25)}.contact-links a{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.25);font:700 9px var(--mono);letter-spacing:.08em;text-transform:uppercase}label{display:block;margin-bottom:6px;font:700 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#cbccbd}input,textarea{width:100%;padding:12px 13px;margin-bottom:15px;border:1px solid rgba(255,255,255,.32);border-radius:0;background:rgba(255,255,255,.04);color:#fff}textarea{min-height:130px;resize:vertical}input:focus,textarea:focus{outline:2px solid var(--ochre);outline-offset:2px}.contact .btn{color:#fff}#status{min-height:24px}.footer{padding:31px 0;background:#22231e;color:#eee8dc}.footer-row{display:flex;align-items:center;justify-content:space-between;gap:20px}.footer-links{display:flex;flex-wrap:wrap;gap:16px}.footer a,.footer small{font:700 9px var(--mono);letter-spacing:.08em;text-transform:uppercase}.loading,.failure{padding:24px 0;color:var(--muted)}.reveal{opacity:0;transform:translateY(18px);transition:.75s ease}.reveal.in{opacity:1;transform:none}:focus-visible{outline:2px solid var(--ochre);outline-offset:3px}
    @media(max-width:900px){.nav{display:none}.hero-meta{left:18px;right:18px}.about-grid,.practice-grid,.contact-grid{grid-template-columns:1fr}.project-grid,.article-grid{grid-template-columns:repeat(2,1fr)}.experience-card{grid-template-columns:1fr}.cert-grid{grid-template-columns:1fr}}
    @media(max-width:560px){.shell{width:calc(100% - 28px)}.topbar{height:64px}.hero-content{padding-top:100px}.hero h1{font-size:73px}.hero-line{font-size:25px}.hero-meta span:last-child{display:none}.amber-seat{bottom:16%;opacity:.73}.section-head{grid-template-columns:1fr;gap:10px}.section-head h2{font-size:58px}.edu-list,.project-grid,.article-grid{grid-template-columns:1fr}.experience-card ul{columns:1}.certificate{grid-template-columns:110px 1fr}.footer-row{align-items:flex-start;flex-direction:column}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
  </style>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="nav-wrap"><header class="shell topbar"><a class="brand" href="#top">Sanctuary</a><nav class="nav" id="nav" aria-label="Primary navigation"></nav><span class="eyebrow">CJC / 2026</span></header></div>
  <main id="content"></main>
  <footer class="footer"><div class="shell footer-row"><div><div class="brand">Sanctuary</div><small id="footer-note"></small></div><div class="footer-links" id="footer-links"></div></div></footer>
  <script>window.THEME_ID='68-sanctuary';</script>
  <script src="/shared/profile.js"></script><script src="/shared/site-data.js"></script>
  <script>
  (()=>{'use strict';
    const P=CJCData.profile,t=CJCData.t.bind(CJCData),e=CJCData.escapeHtml;let projects=[],articles=[],filter='all';
    const L={en:{nav:[['about','Portrait'],['education','Foundation'],['work','Objects'],['journal','Notes'],['contact','Visit']],hero:'Sanctuary',heroLine:'A quiet place for rigorous ideas, generous systems, and work made to last.',about:'A room of one’s own',aboutLead:'A portrait of the person behind the practice',education:'Foundations',educationLead:'Where curiosity found structure and discipline',practice:'The practice',practiceLead:'Tools and subjects gathered into a working room',courses:'Current reading',experience:'Residence',experienceLead:'A season of applied work and measurable change',projects:'Collected works',projectsLead:'Useful objects, built with care and real context',journal:'Notes from within',journalLead:'Observations on systems, technology, and craft',cert:'The cabinet',certLead:'Milestones kept as records, not decoration',contact:'Leave the door open',contactLead:'For collaborations, questions, and new conversations',view:'Enter project',read:'Read note',failed:'Content could not be loaded. Please return shortly.',send:'Send a note',sending:'Sending…',sent:'Your note has been sent.',name:'Your name',email:'Your email',message:'Your note',loc:'At home in',cv:'Curriculum vitae',github:'GitHub'},zh:{nav:[['about','人物'],['education','根基'],['work','作品'],['journal','札记'],['contact','来访']],hero:'栖居之所',heroLine:'让严谨的想法、慷慨的系统与经得住时间的作品，在这里安静发生。',about:'一间自己的房间',aboutLead:'关于实践者本人的一幅肖像',education:'根基',educationLead:'好奇心在这里获得结构与纪律',practice:'日常实践',practiceLead:'把工具与研究课题收进同一间工作室',courses:'近期研习',experience:'驻留',experienceLead:'一段以应用与可衡量变化为尺度的经历',projects:'作品收藏',projectsLead:'带着真实语境、被认真打造的实用作品',journal:'室内札记',journalLead:'关于系统、技术与手艺的观察',cert:'收藏柜',certLead:'把里程碑当作记录，而非装饰',contact:'把门留着',contactLead:'为了合作、问题，以及新的对话',view:'进入项目',read:'阅读札记',failed:'内容暂时无法加载，请稍后再来。',send:'寄出札记',sending:'发送中…',sent:'你的札记已寄出。',name:'你的姓名',email:'你的邮箱',message:'想说的话',loc:'栖居于',cv:'下载简历',github:'GitHub'}};
    const l=()=>L[CJCData.lang()];const head=(n,title,note)=>`<div class="section-head reveal"><div class="chapter eyebrow">Room ${String(n).padStart(2,'0')}</div><div><h2>${e(title)}</h2><p>${e(note)}</p></div></div>`;const link=(href,label)=>`<a href="${e(href)}">${e(label)}</a>`;
    function hero(){const x=l();return `<section class="hero" id="top"><div class="hero-bg" role="img" aria-label="A softly focused, warm architectural interior"></div><div class="amber-seat" aria-hidden="true"></div><div class="shell hero-content"><div class="kicker eyebrow">${e(t(P.greeting))} / ${e(t(P.role))}</div><h1>${e(x.hero)}</h1><p class="hero-line">${e(x.heroLine)}</p><div class="hero-actions"><a class="btn" href="${e(t(P.cv))}" download>${e(x.cv)}</a><a class="btn" href="${e(P.contact.github)}" target="_blank" rel="noopener">${e(x.github)}</a></div></div><div class="hero-meta eyebrow"><span>${e(t(P.location))}<br>31.23 N / 121.47 E</span><span>${e(t(P.name))}<br>${e(t(P.title))}</span></div></section>`}
    function about(){const x=l(),photo=P.photos&&P.photos.graduation||P.avatar;return `<section id="about"><div class="shell">${head(1,x.about,x.aboutLead)}<div class="about-grid"><figure class="portrait reveal"><img src="${e(photo)}" onerror="this.src='/index_page/img/avatar.jpg'" alt="${e(t(P.name))}"><figcaption class="eyebrow">${e(x.loc)} / ${e(t(P.location))}</figcaption></figure><div class="about-copy reveal"><blockquote>${e(t(P.bio[0]))} <span>${e(t(P.role))}.</span></blockquote><p>${e(t(P.bio[1]))}</p></div></div></div></section>`}
    function education(){const x=l();return `<section id="education" class="education"><div class="shell">${head(2,x.education,x.educationLead)}<div class="edu-list reveal">${P.education.map(s=>`<article class="edu"><time class="eyebrow">${e(s.period)}</time><div><h3>${e(t(s.school))}</h3><p>${e(t(s.degree))}<br>${e(t(s.note))}</p></div></article>`).join('')}</div></div></section>`}
    function practice(){const x=l();return `<section id="skills"><div class="shell">${head(3,x.practice,x.practiceLead)}<div class="practice-grid"><div class="skills reveal">${P.skillTags.map(s=>`<span>${e(s)}</span>`).join('')}</div><div><div class="eyebrow" style="margin-bottom:14px">${e(x.courses)}</div><div class="courses reveal">${P.courses.map((c,i)=>`<article class="course"><span class="course-num eyebrow">0${i+1}</span><div><h3>${e(t(c.title))}</h3><p>${e(t(c.desc))}</p></div></article>`).join('')}</div></div></div></div></section>`}
    function experience(){const x=l(),v=P.experience[0];return `<section id="experience" class="experience"><div class="shell">${head(4,x.experience,x.experienceLead)}<article class="experience-card reveal"><time class="eyebrow chapter">${e(v.period)}<br>${e(t(v.company))}</time><div><h3>${e(t(v.role))}</h3><p>${e(t(v.summary))}</p><ul>${v.bullets.map(b=>`<li>${e(t(b))}</li>`).join('')}</ul></div></article></div></section>`}
    function projectView(){const x=l(),body=projects.length?`<div class="project-grid reveal">${projects.map((p,i)=>`<a class="project" href="${e(p.detailHref)}"><figure class="project-image"><img loading="lazy" src="${e(p.cover_image||'/index_page/img/blogs/1.jpg')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(p.localTitle())}"></figure><div class="project-copy"><div class="eyebrow chapter">Object ${String(i+1).padStart(2,'0')} / ${e(x.view)}</div><h3>${e(p.localTitle())}</h3><p>${e(p.localSummary()||'')}</p><div class="tags eyebrow">${e(p.tech_stack||t(P.ui.tech_stack))}</div></div></a>`).join('')}</div>`:`<p class="loading">${e(t(P.ui.loading_projects))}</p>`;return `<section id="work"><div class="shell">${head(5,x.projects,x.projectsLead)}${body}</div></section>`}
    function articleView(){const x=l(),list=CJCData.filterArticles(articles,filter),body=!articles.length?`<p class="loading">${e(t(P.ui.loading_articles))}</p>`:!list.length?`<p class="loading">${e(t(P.ui.no_articles))}</p>`:`<div class="article-grid reveal">${list.map(a=>`<article class="article"><time class="eyebrow chapter">${e(a.category||'')} / ${e(a.dateText())}</time><img loading="lazy" src="${e(a.cover_image||'/index_page/img/blogs/1.jpg')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(a.localTitle())}"><h3>${e(a.localTitle())}</h3><p>${e(a.localSummary()||'')}</p><a class="more" href="${e(a.detailHref)}">${e(x.read)} →</a></article>`).join('')}</div>`;return `<section id="journal"><div class="shell">${head(6,x.journal,x.journalLead)}<div class="filters" aria-label="Article categories">${P.articleFilters.map(f=>`<button type="button" data-filter="${e(f.key)}" class="${filter===f.key?'active':''}">${e(t(f.label))}</button>`).join('')}</div>${body}</div></section>`}
    function certificates(){const x=l();return `<section id="certificates"><div class="shell">${head(7,x.cert,x.certLead)}<div class="cert-grid reveal">${P.certificates.map(c=>`<article class="certificate"><img loading="lazy" src="${e(c.image)}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(t(c.title))}"><div><div class="eyebrow chapter">${e(t(c.tag))} / ${e(t(c.date))}</div><h3>${e(t(c.title))}</h3><p>${e(t(c.desc))}</p></div></article>`).join('')}</div></div></section>`}
    function contact(){const x=l();return `<section id="contact" class="contact"><div class="shell">${head(8,x.contact,x.contactLead)}<div class="contact-grid"><div class="reveal"><p class="contact-quote">${e(t(P.ui.inbox_open))}</p><div class="contact-links"><a href="mailto:${e(P.contact.email)}"><span>Email</span><span>${e(P.contact.email)}</span></a><a href="${e(P.contact.phoneHref)}"><span>Phone</span><span>${e(P.contact.phone)}</span></a><a href="${e(P.contact.github)}" target="_blank" rel="noopener"><span>GitHub</span><span>@${e(P.contact.githubUser)}</span></a><a href="${e(P.contact.wechatQrPage)}"><span>WeChat</span><span>QR</span></a></div></div><form class="reveal" id="contact-form"><input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true"><label for="name">${e(x.name)}</label><input id="name" name="name" autocomplete="name" required><label for="email">${e(x.email)}</label><input id="email" type="email" name="email" autocomplete="email" required><label for="message">${e(x.message)}</label><textarea id="message" name="message" required></textarea><button class="btn" type="submit">${e(x.send)}</button><p id="status" role="status" aria-live="polite"></p></form></div></div></section>`}
    function render(){const x=l();document.documentElement.lang=CJCData.lang();document.title=`${t(P.name)} — ${x.hero}`;document.getElementById('nav').innerHTML=x.nav.map(v=>`<a href="#${e(v[0])}">${e(v[1])}</a>`).join('');document.getElementById('content').innerHTML=hero()+about()+education()+practice()+experience()+projectView()+articleView()+certificates()+contact();document.getElementById('footer-note').textContent=t(P.ui.footer_desc);document.getElementById('footer-links').innerHTML=link(P.contact.github,'GitHub')+link('mailto:'+P.contact.email,'Email')+link(P.contact.wechatQrPage,'WeChat')+link('/admin.html',t(P.ui.admin_panel))+link(P.icpUrl,P.icp);wire();observe()}
    function wire(){document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;render()}));const f=document.getElementById('contact-form');if(f)f.addEventListener('submit',async ev=>{ev.preventDefault();const s=document.getElementById('status'),x=l(),btn=f.querySelector('button');btn.disabled=true;s.textContent=x.sending;try{const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});s.textContent=r.message||x.sent;f.reset()}catch(err){s.textContent=err.message||x.failed}finally{btn.disabled=false}})}
    let observer;function observe(){if(matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('.reveal').forEach(n=>n.classList.add('in'));return}if(observer)observer.disconnect();observer=new IntersectionObserver(es=>es.forEach(v=>{if(v.isIntersecting){v.target.classList.add('in');observer.unobserve(v.target)}}),{threshold:.08});document.querySelectorAll('.reveal').forEach(n=>observer.observe(n))}
    document.addEventListener('DOMContentLoaded',async()=>{CJCData.setTheme(window.THEME_ID);render();CJCData.mountSwitcher({accent:'#c99b27'});CJCData.onLang(render);try{[projects,articles]=await Promise.all([CJCData.fetchProjects(),CJCData.fetchArticles()]);render()}catch(err){document.querySelectorAll('.loading').forEach(n=>{n.className='failure';n.textContent=l().failed})}});
  })();
  </script>
</body>
</html>

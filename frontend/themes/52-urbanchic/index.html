<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Urban Chic</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{
      --blush:#faf3ef; --blush2:#f3e6e2; --card:#fffaf7;
      --rose:#c98a7a; --rose-d:#b06e5e; --gold:#c9a98c; --nude:#e7d3ca;
      --ink:#33292b; --muted:#8a7a75; --hair:rgba(201,138,122,.32);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;color:var(--ink);line-height:1.7;overflow-x:hidden;
      font-family:'Jost',system-ui,Segoe UI,Arial,sans-serif;font-weight:300;
      background:linear-gradient(160deg,var(--blush),var(--blush2));
      background-attachment:fixed;-webkit-font-smoothing:antialiased;
    }
    a{color:inherit}
    img{max-width:100%;display:block}
    .serif{font-family:'Cormorant',Georgia,serif}
    h1,h2,h3,h4{font-family:'Cormorant',Georgia,serif;font-weight:500;line-height:1.05;margin:0}
    .wrap{max-width:1160px;margin:0 auto;padding:0 26px}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

    /* eyebrow / section framing */
    .eyebrow{font-family:'Jost',sans-serif;font-weight:500;font-size:11.5px;letter-spacing:.42em;
      text-transform:uppercase;color:var(--rose);display:flex;align-items:center;gap:14px;margin:0 0 12px}
    .eyebrow::before{content:"";width:34px;height:1px;background:var(--gold)}
    .num{font-family:'Cormorant',serif;font-style:italic;color:var(--gold);font-size:15px}
    section{padding:88px 0;position:relative}
    .sec-title{font-size:clamp(34px,5.4vw,60px);letter-spacing:-.01em}
    .sec-title em{font-style:italic;color:var(--rose)}
    .lead{color:var(--muted);max-width:60ch;font-size:16px;margin:14px 0 0}
    .hairline{border:0;border-top:1px solid var(--hair);margin:0}

    /* top bar */
    .topbar{position:sticky;top:0;z-index:800;
      background:rgba(250,243,239,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      border-bottom:1px solid var(--hair)}
    .topbar .in{display:flex;align-items:center;justify-content:space-between;height:66px;gap:20px}
    .brand{font-family:'Cormorant',serif;font-weight:600;font-size:24px;letter-spacing:.02em;
      text-decoration:none;color:var(--ink)}
    .brand .amp{color:var(--rose);font-style:italic}
    .nav{display:flex;gap:26px}
    .nav a{font-size:12px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;
      text-decoration:none;color:var(--muted)}
    .nav a:hover{color:var(--rose)}
    @media(min-width:881px){.topbar .in{padding-right:250px}}
    @media(max-width:880px){.nav{display:none}}
    @media(max-width:560px){.topbar .brand{font-size:19px}}

    /* hero / masthead */
    .hero{padding:64px 0 0;position:relative}
    .issue{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;
      font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);
      border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:12px 0;margin-bottom:44px}
    .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:center}
    .hero .greet{font-style:italic;font-family:'Cormorant',serif;font-size:24px;color:var(--rose);margin:0}
    .hero h1{font-size:clamp(56px,11vw,128px);letter-spacing:-.02em;margin:6px 0 0}
    .hero .role{font-family:'Jost',sans-serif;font-weight:400;letter-spacing:.28em;text-transform:uppercase;
      font-size:13px;color:var(--muted);margin:20px 0 0}
    .hero .head{font-family:'Cormorant',serif;font-size:clamp(20px,3vw,30px);font-style:italic;
      color:var(--ink);margin:16px 0 0;max-width:24ch;line-height:1.25}
    .cta-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
    .btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-family:'Jost',sans-serif;
      font-weight:400;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;padding:15px 30px;
      border-radius:999px;border:1px solid var(--rose);background:var(--rose);color:#fff;
      transition:background .2s,color .2s,box-shadow .2s;box-shadow:0 10px 26px rgba(201,138,122,.28)}
    .btn:hover{background:var(--rose-d);border-color:var(--rose-d)}
    .btn.ghost{background:transparent;color:var(--rose);box-shadow:none}
    .btn.ghost:hover{background:var(--rose);color:#fff}
    /* portrait arch frame */
    .muse{position:relative;justify-self:center;width:min(360px,82vw)}
    .muse .frame{position:relative;padding:14px;border:1px solid var(--gold);
      border-radius:200px 200px 22px 22px;background:var(--card)}
    .muse img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:190px 190px 14px 14px}
    .muse .tag{position:absolute;left:-14px;bottom:26px;background:var(--card);border:1px solid var(--gold);
      border-radius:999px;padding:9px 18px;font-family:'Cormorant',serif;font-style:italic;font-size:17px;
      color:var(--rose);box-shadow:0 12px 26px rgba(51,41,43,.10)}
    .muse .flourish{position:absolute;top:-22px;right:-10px;color:var(--rose);font-size:30px;opacity:.7}
    @media(max-width:880px){.hero-grid{grid-template-columns:1fr;gap:40px}.muse{order:-1}}

    /* skyline divider */
    .skyline{width:100%;height:82px;display:block;margin-top:56px;color:var(--gold)}
    .skyline svg{width:100%;height:100%}

    /* about / muse detail */
    .about{display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:start}
    .about p{font-size:16.5px;margin:0 0 18px;max-width:58ch}
    .about .dropcap::first-letter{font-family:'Cormorant',serif;font-size:64px;line-height:.7;float:left;
      padding:8px 12px 0 0;color:var(--rose);font-weight:600}
    .factcard{background:var(--card);border:1px solid var(--hair);border-radius:22px;padding:30px;
      box-shadow:0 20px 44px rgba(51,41,43,.07)}
    .factcard h4{font-size:26px;margin-bottom:14px}
    .factrow{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-top:1px solid var(--hair)}
    .factrow:first-of-type{border-top:0}
    .factrow .k{color:var(--muted);letter-spacing:.08em;font-size:13px;text-transform:uppercase}
    .factrow .v{font-family:'Cormorant',serif;font-size:19px;text-align:right}
    @media(max-width:820px){.about{grid-template-columns:1fr;gap:30px}}

    /* education / experience timeline */
    .tl{position:relative;margin-left:8px;padding-left:34px;border-left:1px solid var(--hair)}
    .tl .item{position:relative;padding:6px 0 34px}
    .tl .item::before{content:"";position:absolute;left:-42px;top:9px;width:11px;height:11px;border-radius:50%;
      background:var(--rose);box-shadow:0 0 0 5px var(--blush)}
    .tl .when{font-family:'Jost',sans-serif;letter-spacing:.14em;font-size:12px;text-transform:uppercase;color:var(--rose)}
    .tl h3{font-size:26px;margin:5px 0 3px}
    .tl .sub{color:var(--muted);font-size:15.5px}
    .tl ul{margin:14px 0 0;padding-left:18px;color:var(--ink);font-size:15px}
    .tl ul li{margin-bottom:6px}
    .tl ul li::marker{color:var(--rose)}

    /* skills */
    .edit{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center}
    .tagcloud{display:flex;flex-wrap:wrap;gap:11px}
    .tagcloud span{font-family:'Jost',sans-serif;font-weight:400;font-size:14px;letter-spacing:.04em;
      padding:9px 18px;border:1px solid var(--hair);border-radius:999px;background:var(--card);color:var(--ink)}
    .tagcloud span:hover{border-color:var(--rose);color:var(--rose)}
    .stacklist div{display:flex;gap:14px;align-items:baseline;padding:14px 0;border-top:1px solid var(--hair);
      font-size:16px}
    .stacklist div::before{content:"—";color:var(--rose)}
    @media(max-width:820px){.edit{grid-template-columns:1fr;gap:30px}}

    /* courses */
    .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
    .course{background:var(--card);border:1px solid var(--hair);border-radius:22px;padding:30px;
      box-shadow:0 18px 40px rgba(51,41,43,.06);transition:transform .2s,box-shadow .2s}
    .course:hover{transform:translateY(-5px);box-shadow:0 28px 54px rgba(51,41,43,.11)}
    .course .ci{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin-bottom:18px;
      border:1px solid var(--gold);color:var(--rose);font-size:20px;background:var(--blush)}
    .course h4{font-size:23px;margin-bottom:9px}
    .course p{margin:0;color:var(--muted);font-size:14.5px}
    @media(max-width:880px){.courses{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.courses{grid-template-columns:1fr}}

    /* cards projects/articles */
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
    .card{background:var(--card);border:1px solid var(--hair);border-radius:22px;overflow:hidden;
      text-decoration:none;color:inherit;display:flex;flex-direction:column;
      box-shadow:0 18px 40px rgba(51,41,43,.06);transition:transform .2s,box-shadow .2s}
    .card:hover{transform:translateY(-6px);box-shadow:0 30px 60px rgba(51,41,43,.12)}
    .card .cover{height:184px;background:var(--nude);overflow:hidden}
    .card .cover img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
    .card:hover .cover img{transform:scale(1.05)}
    .card .cbody{padding:22px;display:flex;flex-direction:column;gap:10px;flex:1}
    .card .ctag{display:flex;justify-content:space-between;font-family:'Jost',sans-serif;font-size:11px;
      letter-spacing:.16em;text-transform:uppercase;color:var(--rose)}
    .card h4{font-size:24px;line-height:1.12}
    .card p{margin:0;color:var(--muted);font-size:14.5px;flex:1}
    .card .tech{font-family:'Cormorant',serif;font-style:italic;color:var(--rose-d);font-size:16px}
    .card .more{font-family:'Jost',sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
    @media(max-width:880px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.cards{grid-template-columns:1fr}}

    .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:32px}
    .filters button{background:transparent;border:1px solid var(--hair);color:var(--muted);
      font-family:'Jost',sans-serif;font-weight:400;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
      padding:9px 18px;border-radius:999px;cursor:pointer;transition:.2s}
    .filters button.active,.filters button:hover{background:var(--rose);border-color:var(--rose);color:#fff}

    /* certificates */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:26px}
    .cert{display:grid;grid-template-columns:140px 1fr;background:var(--card);border:1px solid var(--hair);
      border-radius:22px;overflow:hidden;box-shadow:0 18px 40px rgba(51,41,43,.06)}
    .cert img{width:100%;height:100%;object-fit:cover}
    .cert .ct{padding:22px}
    .cert .ct .meta{display:flex;justify-content:space-between;font-family:'Jost',sans-serif;font-size:11px;
      letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}
    .cert .ct h4{font-size:22px;margin:9px 0 7px}
    .cert .ct p{margin:0;color:var(--muted);font-size:14px}
    @media(max-width:620px){.certs{grid-template-columns:1fr}.cert{grid-template-columns:104px 1fr}}

    /* contact */
    .contact{display:grid;grid-template-columns:1fr 1.1fr;gap:52px}
    .cinfo .motif{display:flex;gap:20px;color:var(--rose);font-size:26px;margin-bottom:26px;opacity:.85}
    .cinfo a{display:flex;justify-content:space-between;align-items:center;gap:14px;
      border-top:1px solid var(--hair);padding:17px 0;text-decoration:none}
    .cinfo a:last-child{border-bottom:1px solid var(--hair)}
    .cinfo a .k{color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-size:12px}
    .cinfo a .v{font-family:'Cormorant',serif;font-size:20px;color:var(--ink)}
    .cinfo a:hover .v{color:var(--rose)}
    form .field{margin-bottom:18px}
    form label{display:block;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.16em;
      text-transform:uppercase;color:var(--muted);margin-bottom:8px}
    form input,form textarea{width:100%;background:var(--card);border:1px solid var(--hair);border-radius:14px;
      font-family:'Jost',sans-serif;font-weight:300;font-size:15px;padding:14px 16px;color:var(--ink)}
    form textarea{min-height:130px;resize:vertical}
    form input:focus,form textarea:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 3px rgba(201,138,122,.16)}
    .send{cursor:pointer;width:auto}
    #cf-status{margin-top:14px;font-family:'Cormorant',serif;font-size:19px;font-style:italic}
    @media(max-width:820px){.contact{grid-template-columns:1fr;gap:32px}}

    /* footer */
    footer{border-top:1px solid var(--hair);padding:56px 0 44px;margin-top:20px}
    footer .frow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px;align-items:center}
    footer .flinks{display:flex;flex-wrap:wrap;gap:24px}
    footer a{text-decoration:none;color:var(--muted);font-size:13px;letter-spacing:.08em}
    footer a:hover{color:var(--rose)}
    .fmeta{margin-top:26px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;
      font-size:12.5px;color:var(--muted)}
    .load-note{grid-column:1/-1;color:var(--muted);font-family:'Cormorant',serif;font-style:italic;font-size:20px;
      padding:26px;border:1px solid var(--hair);border-radius:20px;text-align:center;background:var(--card)}

    @media (prefers-reduced-motion: reduce){
      *{scroll-behavior:auto;transition:none!important}
      .card:hover .cover img{transform:none}
    }
  </style>
</head>

  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";

    // magazine-style bilingual section framings (kept local to this theme)
    const K = {
      about:{en:"The Muse",zh:"缪斯"}, edu:{en:"The Education",zh:"求学札记"},
      skills:{en:"The Edit",zh:"精选技艺"}, courses:{en:"The Curriculum",zh:"研修课程"},
      exp:{en:"The Résumé",zh:"职场履历"}, proj:{en:"The Portfolio",zh:"作品集锦"},
      art:{en:"The Journal",zh:"专栏日志"}, certs:{en:"The Accolades",zh:"荣誉勋章"},
      contact:{en:"Correspondence",zh:"雅致通信"},
      issue:{en:"CaiJiechao Quarterly",zh:"蔡杰超 · 季刊"},
      volume:{en:"Vol. XXVI · The Portfolio Issue",zh:"第十六卷 · 作品集特辑"},
      muse:{en:"the muse",zh:"本期缪斯"},
    };

    function renderStatic(){
      const zh = CJCData.lang()==="zh";
      document.title = (zh ? "蔡杰超" : "Cai Jiechao") + " — Urban Chic";
      document.getElementById('brand-tail').textContent = zh ? "杰超" : "Jiechao";
      document.getElementById('nav').innerHTML = [
        ['about','nav_about'],['courses','nav_courses'],['projects','nav_portfolio'],
        ['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');

      // masthead / hero
      document.getElementById('iss-1').textContent = t(K.issue);
      document.getElementById('iss-2').textContent = t(K.volume);
      document.getElementById('iss-3').textContent = t(P.location);
      document.getElementById('greet').textContent = t(P.greeting);
      document.getElementById('name').textContent = t(P.name);
      document.getElementById('role').textContent = t(P.role);
      document.getElementById('headline').textContent = t(P.headline);
      document.getElementById('muse-tag').textContent = t(K.muse);
      const cv = document.getElementById('cvBtn'); cv.textContent = t(P.ui.download_cv); cv.href = t(P.cv);
      document.getElementById('ghBtn').href = P.contact.github;

      // eyebrows
      document.getElementById('ky-about').textContent = t(K.about);
      document.getElementById('ky-edu').textContent = t(K.edu);
      document.getElementById('ky-skills').textContent = t(K.skills);
      document.getElementById('ky-courses').textContent = t(K.courses);
      document.getElementById('ky-exp').textContent = t(K.exp);
      document.getElementById('ky-proj').textContent = t(K.proj);
      document.getElementById('ky-art').textContent = t(K.art);
      document.getElementById('ky-certs').textContent = t(K.certs);
      document.getElementById('ky-contact').textContent = t(K.contact);

      // titles (with an italic-accent flourish on the last word)
      const titled = (el, str)=>{ const w = String(str).split(' ');
        if(w.length>1){ el.innerHTML = esc(w.slice(0,-1).join(' '))+' <em>'+esc(w.slice(-1)[0])+'</em>'; }
        else el.textContent = str; };
      titled(document.getElementById('l-about'), t(P.ui.about_me));
      titled(document.getElementById('l-edu'), t(P.ui.education_bg));
      titled(document.getElementById('l-skills'), t(P.ui.core_tech));
      titled(document.getElementById('l-courses'), t(P.ui.core_courses));
      titled(document.getElementById('l-exp'), t(P.ui.internship_exp));
      titled(document.getElementById('l-projects'), t(P.ui.latest_projects));
      titled(document.getElementById('l-articles'), t(P.ui.latest_articles));
      titled(document.getElementById('l-certs'), t(P.ui.certificates));
      titled(document.getElementById('l-contact'), t(P.ui.get_in_touch));

      // about
      const pt = document.getElementById('portrait'); pt.src = P.avatar; pt.alt = t(P.name);
      document.getElementById('about-text').innerHTML =
        P.bio.map((b,i)=>`<p class="${i===0?'dropcap':''}">${esc(t(b))}</p>`).join('');
      document.getElementById('factcard').innerHTML =
        `<h4>${esc(t(P.name))}</h4>
         <div class="factrow"><span class="k">${zh?'角色':'Role'}</span><span class="v">${esc(t(P.role))}</span></div>
         <div class="factrow"><span class="k">${zh?'坐标':'Based in'}</span><span class="v">${esc(t(P.location))}</span></div>
         <div class="factrow"><span class="k">${zh?'专注':'Focus'}</span><span class="v">Agent · LLM · RAG</span></div>
         <div class="factrow"><span class="k">${zh?'语言':'Languages'}</span><span class="v">EN · 中文 · IELTS 6.5</span></div>`;

      // education timeline
      document.getElementById('edu-list').innerHTML = P.education.map(e=>`
        <div class="item"><div class="when">${esc(e.period)}</div>
        <h3>${esc(t(e.school))}</h3>
        <div class="sub">${esc(t(e.degree))} — ${esc(t(e.note))}</div></div>`).join('');

      // skills
      document.getElementById('skill-tags').innerHTML = P.skillTags.map(s=>`<span>${esc(s)}</span>`).join('');
      document.getElementById('skill-lines').innerHTML = P.skills.map(s=>`<div>${esc(s)}</div>`).join('');

      // courses
      document.getElementById('courses-list').innerHTML = P.courses.map(c=>`
        <div class="course"><div class="ci"><i class="fa ${esc(c.icon)}" aria-hidden="true"></i></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');

      // experience timeline
      document.getElementById('exp-list').innerHTML = P.experience.map(x=>`
        <div class="item"><div class="when">${esc(x.period)}</div>
        <h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3>
        <div class="sub">${esc(t(x.summary))}</div>
        <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div>`).join('');

      // certificates
      document.getElementById('certs-list').innerHTML = P.certificates.map(c=>`
        <div class="cert"><img src="${esc(c.image)}" alt="${esc(t(c.title))}"
          onerror="this.src='/index_page/img/blogs/1.jpg'">
        <div class="ct"><div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');

      // contact info
      document.getElementById('contact-info').innerHTML = [
        ['Email', P.contact.email, 'mailto:'+P.contact.email],
        ['Phone', P.contact.phone, P.contact.phoneHref],
        ['GitHub', '@'+P.contact.githubUser, P.contact.github],
        ['WeChat', 'QR →', P.contact.wechatQrPage],
      ].map(([k,v,h])=>`<a href="${esc(h)}"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></a>`).join('');
      document.getElementById('lb-name').textContent = t(P.ui.name_placeholder);
      document.getElementById('lb-email').textContent = t(P.ui.email_placeholder);
      document.getElementById('lb-msg').textContent = t(P.ui.msg_placeholder);
      document.getElementById('cf-name').placeholder = t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder = t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder = t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent = t(P.ui.send);

      // footer
      document.getElementById('foot-social').innerHTML =
        `<a href="${P.contact.github}" target="_blank" rel="noopener">GitHub</a>
         <a href="mailto:${P.contact.email}">Email</a>
         <a href="${P.contact.wechatQrPage}">WeChat</a>
         <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent = t(P.ui.footer_desc);
      const icp = document.getElementById('foot-icp'); icp.textContent = P.icp; icp.href = P.icpUrl;

      // filters
      document.getElementById('filters').innerHTML = P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box = document.getElementById('projects-list');
      if(!projects.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML = projects.map(p=>`
        <a class="card" href="${esc(p.href)}">
          <div class="cbody">
            <div class="ctag"><span>${esc(t(P.ui.tech_stack))}</span><span>${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <p class="tech">${esc(p.tech_stack||'')}</p>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div></a>`).join('');
    }

    function renderArticles(){
      const box = document.getElementById('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML = list.map(a=>`
        <a class="card" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
          <div class="cbody">
            <div class="ctag"><span>${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div></a>`).join('');
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML = `<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-list').innerHTML = `<div class="load-note">${CJCData.lang()==='zh'?'内容加载失败':'Failed to load articles.'}</div>`; }
    }

    document.getElementById('cf').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      const payload = { name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color='var(--muted)'; s.textContent = t(P.ui.sending);
      try{ const r = await CJCData.sendContact(payload); s.style.color='var(--rose-d)'; s.textContent = r.message||'Sent.'; f.reset(); }
      catch(err){ s.style.color='#b0392f'; s.textContent = err.message; }
    });

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:'#c98a7a' });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Mochi the Companion</title>
  <meta name="description" content="Meet Mochi, Cai Jiechao's little chibi companion. Pet it, feed it, and let it show you around." />
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{ --pink:#ff86b3; --pink2:#ffb3d1; --pink-d:#e05f8e; --sky:#7fcdff; --mint:#8ff0c8; --lav:#c9b6ff; --yellow:#ffd86b;
      --ink:#5a4a5c; --mut:#9d8ca0; --line:#ffd0e2; --paper:#fff; --stroke:#4a3b4d; }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;line-height:1.6;overflow-x:hidden;
      background:linear-gradient(180deg,#ffe3ef 0%,#ffeef6 22%,#eef4ff 55%,#e6fbf2 100%);background-attachment:fixed}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    h1,h2,h3,h4,.disp{font-family:'Baloo 2',cursive}
    ::selection{background:var(--pink);color:#fff}
    :focus-visible{outline:3px solid var(--pink);outline-offset:3px;border-radius:8px}
    .wrap{max-width:1060px;margin:0 auto;padding:0 22px;position:relative;z-index:2}

    /* floating sparkle field */
    .spk{position:fixed;z-index:1;pointer-events:none;animation:twinkle 2.8s ease-in-out infinite;filter:drop-shadow(0 2px 3px rgba(255,134,179,.3))}
    @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(12deg)}}

    .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.72);backdrop-filter:blur(9px);border-bottom:3px solid var(--line)}
    .topbar .row{display:flex;align-items:center;justify-content:space-between;height:60px}
    .brand{font-family:'Baloo 2';font-weight:800;font-size:22px;color:var(--pink)}
    .brand b{color:var(--sky)}
    .nav{display:flex;gap:14px}
    .nav a{font-weight:600;font-size:14px;color:var(--mut);padding:5px 8px;border-radius:999px;transition:.15s}
    .nav a:hover{color:#fff;background:var(--pink)}
    @media(max-width:960px){.nav{display:none}}
    @media(min-width:1041px){.topbar .row{padding-right:200px}}

    section{padding:52px 0}
    .card-box{background:var(--paper);border:3px solid var(--stroke);border-radius:30px;padding:28px;
      box-shadow:7px 7px 0 rgba(74,59,77,.13);position:relative}
    .card-box::before{content:"";position:absolute;top:-11px;left:34px;width:22px;height:22px;border-radius:50%;
      background:var(--pink2);border:3px solid var(--stroke)}
    .sec-head{display:flex;align-items:center;gap:13px;margin-bottom:22px}
    .sec-head .em{font-size:32px;filter:drop-shadow(0 2px 2px rgba(74,59,77,.2))}
    .sec-head h2{font-family:'Baloo 2';font-weight:800;font-size:clamp(24px,4.2vw,38px);margin:0;color:var(--pink)}
    .reveal{opacity:0;transform:translateY(26px) scale(.98);transition:opacity .5s ease,transform .5s cubic-bezier(.34,1.56,.64,1)}
    .reveal.in{opacity:1;transform:none}

    /* HERO */
    .hero{padding:46px 0 20px}
    .hero .grid{display:grid;grid-template-columns:1fr;gap:8px;max-width:760px}
    .bubble-in{display:inline-block;background:#fff;border:3px solid var(--stroke);border-radius:22px;padding:9px 18px;
      font-family:'Baloo 2';font-weight:700;color:var(--pink);position:relative;box-shadow:4px 4px 0 rgba(74,59,77,.12);margin-bottom:10px}
    .bubble-in::after{content:"";position:absolute;left:28px;bottom:-12px;width:16px;height:16px;background:#fff;
      border-right:3px solid var(--stroke);border-bottom:3px solid var(--stroke);transform:rotate(45deg)}
    .hero h1{font-family:'Baloo 2';font-weight:800;font-size:clamp(46px,12vw,110px);line-height:.95;margin:10px 0 6px;
      color:var(--pink);text-shadow:3px 3px 0 #fff,6px 6px 0 var(--pink2)}
    .hero .role{font-family:'Baloo 2';font-weight:700;font-size:clamp(18px,2.8vw,28px);color:var(--sky)}
    .hero .tag{color:var(--mut);max-width:46ch;margin:12px 0 22px;font-size:17px}
    .btns{display:flex;flex-wrap:wrap;gap:14px}
    .btn{display:inline-flex;align-items:center;gap:8px;font-family:'Baloo 2';font-weight:700;font-size:15px;
      padding:12px 24px;border-radius:999px;cursor:pointer;transition:transform .15s,box-shadow .15s;border:3px solid var(--stroke)}
    .btn.pri{background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pink-d)}
    .btn.pri:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--pink-d)}
    .btn.pri:active{transform:translateY(2px);box-shadow:0 2px 0 var(--pink-d)}
    .btn.gho{background:var(--yellow);color:#6a5626;box-shadow:0 5px 0 #d9b24a}
    .btn.gho:hover{transform:translateY(-3px);box-shadow:0 8px 0 #d9b24a}
    .heromeet{margin-top:22px;display:inline-flex;align-items:center;gap:10px;background:#fff;border:3px dashed var(--pink2);
      border-radius:20px;padding:10px 16px;font-weight:600;color:var(--mut);font-size:14px}
    .heromeet b{color:var(--pink)}

    /* about */
    .about{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:start}
    @media(max-width:740px){.about{grid-template-columns:1fr}}
    .about .pic{border:4px solid var(--stroke);border-radius:26px;overflow:hidden;box-shadow:6px 6px 0 var(--pink2);background:#fff}
    .about .pic img{width:100%;aspect-ratio:1;object-fit:cover}
    .about p{margin:0 0 12px;font-size:16.5px;max-width:60ch}
    .loc{display:inline-flex;gap:8px;align-items:center;background:var(--mint);color:#2a6b52;border:3px solid var(--stroke);
      border-radius:999px;padding:7px 15px;font-weight:700}

    .rows{display:flex;flex-direction:column;gap:16px}
    .rowi{border:3px solid var(--stroke);border-radius:22px;padding:16px 18px;background:#fff8fb;transition:transform .16s}
    .rowi:hover{transform:translateX(6px) rotate(-.5deg)}
    .rowi .p{color:var(--sky);font-weight:700}
    .rowi h3{font-family:'Baloo 2';margin:2px 0 4px;font-size:19px;color:var(--pink)}
    .rowi .s{color:var(--mut)}
    .rowi ul{margin:8px 0 0;padding-left:18px;line-height:1.7}

    .skills{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    @media(max-width:760px){.skills{grid-template-columns:1fr 1fr}}
    @media(max-width:460px){.skills{grid-template-columns:1fr}}
    .sk{border:3px solid var(--stroke);border-radius:22px;padding:16px;text-align:center;transition:transform .18s cubic-bezier(.34,1.56,.64,1);box-shadow:4px 4px 0 rgba(74,59,77,.1)}
    .sk:nth-child(3n+1){background:#fff0f6}.sk:nth-child(3n+2){background:#eef8ff}.sk:nth-child(3n){background:#eefcf5}
    .sk:hover{transform:translateY(-6px) rotate(-3deg) scale(1.03)}
    .sk .face{font-size:24px}
    .sk .v{margin-top:6px;font-weight:600;font-size:15px}
    .tags{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:18px}
    .tags span{font-weight:600;font-size:13px;padding:7px 15px;border-radius:999px;border:3px solid var(--stroke);background:#fff;color:var(--pink);transition:transform .15s}
    .tags span:hover{transform:translateY(-3px) rotate(3deg);background:var(--pink);color:#fff}

    .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    @media(max-width:820px){.courses{grid-template-columns:1fr 1fr}}
    @media(max-width:500px){.courses{grid-template-columns:1fr}}
    .course{border:3px solid var(--stroke);border-radius:24px;padding:20px;background:#fff;transition:transform .18s cubic-bezier(.34,1.56,.64,1);box-shadow:5px 5px 0 rgba(74,59,77,.12)}
    .course:hover{transform:translateY(-6px) rotate(1.5deg)}
    .course .ic{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;color:#fff;font-size:23px;border:3px solid var(--stroke)}
    .course:nth-child(3n+1) .ic{background:var(--pink)}.course:nth-child(3n+2) .ic{background:var(--sky)}.course:nth-child(3n) .ic{background:var(--lav)}
    .course h4{font-family:'Baloo 2';margin:12px 0 8px;font-size:17px;color:var(--pink)}
    .course p{margin:0;color:var(--mut);font-size:14.5px}

    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    @media(max-width:860px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.cards{grid-template-columns:1fr}}
    .card{border:3px solid var(--stroke);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;background:#fff;
      transition:transform .18s cubic-bezier(.34,1.56,.64,1);box-shadow:5px 5px 0 rgba(74,59,77,.12)}
    .card:hover{transform:translateY(-8px) rotate(-1.4deg)}
    .card .cover{height:154px;overflow:hidden;background:#ffe3ef}
    .card .cover img{width:100%;height:100%;object-fit:cover;transition:.4s}
    .card:hover .cover img{transform:scale(1.08)}
    .cbody{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
    .ctag{display:flex;justify-content:space-between;font-size:11px;color:var(--sky);letter-spacing:.04em;text-transform:uppercase;font-weight:700}
    .card h4{font-family:'Baloo 2';margin:0;font-size:17px;line-height:1.3;color:var(--pink)}
    .card p{margin:0;color:var(--mut);font-size:14px;flex:1}
    .tech{color:var(--lav);font-weight:700;font-size:12.5px}
    .more{color:var(--pink);font-weight:700;font-size:13px}

    .filters{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px}
    .filters button{font-family:'Fredoka';font-weight:600;font-size:13px;background:#fff;border:3px solid var(--stroke);
      color:var(--mut);padding:7px 16px;border-radius:999px;cursor:pointer;transition:.15s}
    .filters button.active,.filters button:hover{background:var(--pink);border-color:var(--stroke);color:#fff}

    .certs{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    @media(max-width:640px){.certs{grid-template-columns:1fr}}
    .cert{display:grid;grid-template-columns:120px 1fr;border:3px solid var(--stroke);border-radius:24px;overflow:hidden;background:#fff;box-shadow:5px 5px 0 rgba(74,59,77,.1)}
    .cert img{width:100%;height:100%;object-fit:cover;min-height:140px}
    .cert .ct{padding:16px}
    .cert .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--sky);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
    .cert h4{font-family:'Baloo 2';margin:8px 0 6px;font-size:16px;color:var(--pink)}
    .cert p{margin:0;color:var(--mut);font-size:13.5px}
    @media(max-width:400px){.cert{grid-template-columns:88px 1fr}}

    .contact{display:grid;grid-template-columns:1fr 1.2fr;gap:26px}
    @media(max-width:800px){.contact{grid-template-columns:1fr}}
    .cinfo a{display:flex;justify-content:space-between;padding:13px 0;border-bottom:2px dashed var(--line);font-weight:600}
    .cinfo a span:last-child{color:var(--pink)}
    .cform label{display:block;font-weight:600;color:var(--mut);font-size:13px;margin:0 0 5px}
    .cform input,.cform textarea{width:100%;background:#fff8fb;border:3px solid var(--stroke);border-radius:18px;
      color:var(--ink);font-family:inherit;font-size:15px;padding:13px 15px;margin-bottom:13px}
    .cform input:focus,.cform textarea:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,134,179,.2)}
    .cform textarea{min-height:118px;resize:vertical}
    .cform .btn.pri{width:auto}
    #cf-status{font-weight:700;margin:8px 0 0;font-size:14px;min-height:1.2em}

    footer{padding:40px 0 60px;text-align:center}
    .fsoc{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
    .fsoc a{color:var(--mut);font-weight:600;font-size:13px}
    .fsoc a:hover{color:var(--pink)}
    .muted{color:#b0a0b3;font-size:13px;margin-top:12px}
    .muted a{color:var(--pink)}
    .load-note{grid-column:1/-1;color:var(--mut);text-align:center;padding:18px;border:3px dashed var(--line);border-radius:16px}

    /* ================= COMPANION (fixed pet) ================= */
    .pet{position:fixed;left:18px;bottom:16px;z-index:70;width:210px;display:flex;flex-direction:column;align-items:center;pointer-events:none}
    .pet-bubble{pointer-events:auto;max-width:250px;background:#fff;border:3px solid var(--stroke);border-radius:20px;
      padding:11px 15px;font-family:'Baloo 2';font-weight:600;color:var(--ink);font-size:14px;line-height:1.4;
      box-shadow:5px 5px 0 rgba(74,59,77,.14);position:relative;margin-bottom:8px;transition:opacity .3s,transform .3s;min-height:20px}
    .pet-bubble .who{color:var(--pink);font-weight:800;display:block;font-size:12px;margin-bottom:2px}
    .pet-bubble::after{content:"";position:absolute;left:44px;bottom:-13px;width:17px;height:17px;background:#fff;
      border-right:3px solid var(--stroke);border-bottom:3px solid var(--stroke);transform:rotate(45deg)}
    .pet-bubble.hide{opacity:0;transform:translateY(8px);pointer-events:none}
    .pet-stage{position:relative;width:180px;height:190px}
    .pet-svg{position:absolute;inset:0;pointer-events:auto;cursor:pointer;width:100%;height:100%;
      filter:drop-shadow(0 8px 10px rgba(74,59,77,.22));animation:bob 3.4s ease-in-out infinite;transform-origin:50% 90%}
    .pet-svg:active{cursor:grabbing}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    .pet-svg.squish{animation:squish .34s ease}
    @keyframes squish{0%{transform:scale(1,1)}35%{transform:scale(1.14,.82) translateY(6px)}70%{transform:scale(.94,1.08)}100%{transform:scale(1,1)}}
    .pet-svg.dance{animation:dance .7s ease-in-out infinite}
    @keyframes dance{0%,100%{transform:rotate(-7deg) translateY(0)}25%{transform:rotate(6deg) translateY(-8px)}50%{transform:rotate(-5deg) translateY(0)}75%{transform:rotate(7deg) translateY(-8px)}}
    #peyes{transform-box:fill-box;transform-origin:center;transition:transform .09s ease}
    #peyes.blink{transform:scaleY(.12)}
    .pupil{transition:transform .12s ease}
    #petHead{transition:transform .18s ease}
    .burst{position:absolute;left:0;top:0;pointer-events:none;font-size:22px;will-change:transform,opacity;z-index:2}
    @keyframes floatup{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}

    .pet-hud{pointer-events:auto;margin-top:6px;background:#fff;border:3px solid var(--stroke);border-radius:16px;padding:6px 10px;
      display:flex;align-items:center;gap:8px;box-shadow:4px 4px 0 rgba(74,59,77,.12)}
    .pet-hud .pn{font-family:'Baloo 2';font-weight:800;color:var(--pink);font-size:13px}
    .pet-hud .meter{width:74px;height:11px;border-radius:999px;background:#ffe3ef;border:2px solid var(--stroke);overflow:hidden}
    .pet-hud .meter i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--pink),var(--pink2));transition:width .4s cubic-bezier(.34,1.56,.64,1)}
    .pet-hud .lv{font-size:11px;font-weight:700;color:var(--mut)}

    /* hidden treat */
    .treat{position:fixed;z-index:69;pointer-events:auto;cursor:pointer;font-size:22px;opacity:.55;transition:opacity .2s,transform .2s;
      animation:floaty 3.2s ease-in-out infinite;background:none;border:0;padding:6px;line-height:1}
    .treat:hover{opacity:1;transform:scale(1.25)}
    @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .treat.fly{transition:left .55s cubic-bezier(.5,0,.5,1),top .55s cubic-bezier(.5,0,.5,1),transform .55s,opacity .3s;z-index:75}

    @media(max-width:760px){
      .pet{width:150px;left:8px;bottom:8px}
      .pet-stage{width:120px;height:128px}
      .pet-bubble{max-width:60vw;font-size:13px;padding:9px 12px}
      .pet-hud{padding:4px 8px}.pet-hud .meter{width:52px}
    }
    @media(max-width:420px){ .pet{width:118px} }

    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      .spk,.pet-svg{animation:none}
      .reveal{opacity:1;transform:none;transition:none}
      .pet-svg.squish,.pet-svg.dance{animation:none}
    }
  </style>
</head>
<body>
  <div class="spk" style="top:15%;left:7%;font-size:22px">✨</div>
  <div class="spk" style="top:26%;right:9%;font-size:26px;animation-delay:.6s">⭐</div>
  <div class="spk" style="top:48%;left:4%;font-size:20px;animation-delay:1.1s">✨</div>
  <div class="spk" style="top:64%;right:6%;font-size:24px;animation-delay:1.6s">💖</div>
  <div class="spk" style="top:82%;left:10%;font-size:22px;animation-delay:.3s">⭐</div>
  <div class="spk" style="top:38%;left:48%;font-size:18px;animation-delay:.9s">✨</div>

  <div class="topbar"><div class="wrap row">
    <a class="brand" href="#top">Cai<b>Jiechao</b></a>
    <nav class="nav" id="nav"></nav>
  </div></div>

  <div id="top"></div>
  <header class="hero"><div class="wrap"><div class="grid">
    <span class="bubble-in" id="greet"></span>
    <h1 id="name"></h1>
    <div class="role" id="role"></div>
    <p class="tag" id="tag"></p>
    <div class="btns">
      <a class="btn pri" id="cvBtn" download><i class="fa fa-download"></i><span></span></a>
      <a class="btn gho" id="ghBtn" target="_blank" rel="noopener"><i class="fa fa-github"></i>GitHub</a>
    </div>
    <div class="heromeet" id="heromeet"></div>
  </div></div></header>

  <section id="about"><div class="wrap reveal"><div class="card-box">
    <div class="sec-head"><span class="em">🐱</span><h2 id="l-about"></h2></div>
    <div class="about">
      <div class="pic"><img id="portrait" alt="Cai Jiechao portrait" /></div>
      <div><div id="bio"></div><span class="loc" id="loc"></span></div>
    </div>
  </div></div></section>

  <section id="education"><div class="wrap reveal"><div class="card-box">
    <div class="sec-head"><span class="em">🎓</span><h2 id="l-edu"></h2></div>
    <div class="rows" id="edu"></div>
  </div></div></section>

  <section id="skills"><div class="wrap reveal"><div class="card-box">
    <div class="sec-head"><span class="em">🌈</span><h2 id="l-skills"></h2></div>
    <div class="skills" id="skills-box"></div>
    <div class="tags" id="tags"></div>
  </div></div></section>

  <section id="courses"><div class="wrap reveal"><div class="card-box">
    <div class="sec-head"><span class="em">📚</span><h2 id="l-courses"></h2></div>
    <div class="courses" id="courses-box"></div>
  </div></div></section>

  <section id="experience"><div class="wrap reveal"><div class="card-box">
    <div class="sec-head"><span class="em">💼</span><h2 id="l-exp"></h2></div>
    <div class="rows" id="exp"></div>
  </div></div></section>

  <section id="projects"><div class="wrap reveal"><div class="card-box">
    <div class="sec-head"><span class="em">🎁</span><h2 id="l-projects"></h2></div>
    <div class="cards" id="projects-box"><div class="load-note" id="proj-load"></div></div>
  </div></div></section>

  <section id="articles"><div class="wrap reveal"><div class="card-box">
    <div class="sec-head"><span class="em">✏️</span><h2 id="l-articles"></h2></div>
    <div class="filters" id="filters"></div>
    <div class="cards" id="articles-box"><div class="load-note" id="art-load"></div></div>
  </div></div></section>

  <section id="certificates"><div class="wrap reveal"><div class="card-box">
    <div class="sec-head"><span class="em">🏅</span><h2 id="l-certs"></h2></div>
    <div class="certs" id="certs"></div>
  </div></div></section>

  <section id="contact"><div class="wrap reveal"><div class="card-box">
    <div class="sec-head"><span class="em">💌</span><h2 id="l-contact"></h2></div>
    <div class="contact">
      <div class="cinfo" id="cinfo"></div>
      <form class="cform" id="cf" novalidate>
        <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
        <label for="cf-name" id="lb-name"></label>
        <input type="text" name="name" id="cf-name" required autocomplete="name">
        <label for="cf-email" id="lb-email"></label>
        <input type="email" name="email" id="cf-email" required autocomplete="email">
        <label for="cf-msg" id="lb-msg"></label>
        <textarea name="message" id="cf-msg" required></textarea>
        <button type="submit" class="btn pri" id="cf-send"></button>
        <p id="cf-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div></div></section>

  <footer><div class="wrap">
    <div class="fsoc" id="fsoc"></div>
    <div class="muted" id="foot-desc"></div>
    <a class="muted" id="foot-icp" target="_blank" rel="noopener" style="display:inline-block"></a>
  </div></footer>

  <!-- hidden treat easter egg -->
  <button class="treat" id="treat" aria-label="A hidden treat — click to feed the companion" title="a treat?">🍪</button>

  <!-- ================= COMPANION ================= -->
  <div class="pet" id="pet">
    <div class="pet-bubble" id="petBubble"><span class="who" id="petWho"></span><span id="petSay"></span></div>
    <div class="pet-stage">
      <div class="burst-layer" id="burst"></div>
      <button class="pet-svg" id="petSvg" aria-label="Pet the companion" style="background:none;border:0">
        <svg viewBox="0 0 180 190" role="img" aria-label="Chibi companion Mochi">
          <ellipse cx="90" cy="182" rx="46" ry="8" fill="rgba(74,59,77,.12)"/>
          <g id="petBody">
            <!-- body -->
            <path id="pbody" d="M58 150 q32 20 64 0 l-5 30 q-27 12 -54 0 Z" fill="#8fd3ff" stroke="#4a3b4d" stroke-width="4.5"/>
            <!-- arms -->
            <circle id="parmL" cx="50" cy="146" r="13" fill="#ffdcc4" stroke="#4a3b4d" stroke-width="4.5"/>
            <circle id="parmR" cx="130" cy="146" r="13" fill="#ffdcc4" stroke="#4a3b4d" stroke-width="4.5"/>
            <g id="petHead" transform="rotate(0 90 118)">
              <!-- cat ears -->
              <path id="pearL" d="M46 58 L36 20 L70 44 Z" fill="#ffe1cf" stroke="#4a3b4d" stroke-width="4.5" stroke-linejoin="round"/>
              <path id="pearR" d="M134 58 L144 20 L110 44 Z" fill="#ffe1cf" stroke="#4a3b4d" stroke-width="4.5" stroke-linejoin="round"/>
              <path d="M48 52 L42 30 L62 44 Z" fill="#ff9ec7"/>
              <path d="M132 52 L138 30 L118 44 Z" fill="#ff9ec7"/>
              <!-- head -->
              <circle id="phead" cx="90" cy="88" r="70" fill="#ffe1cf" stroke="#4a3b4d" stroke-width="5"/>
              <!-- hair -->
              <path d="M24 78 q6 -60 66 -62 q60 2 66 62 q-20 -26 -66 -26 q-46 0 -66 26 Z" fill="#5a4a5c" stroke="#4a3b4d" stroke-width="4.5"/>
              <path d="M90 18 q-8 15 -24 17 M90 18 q8 15 24 17" fill="none" stroke="#4a3b4d" stroke-width="3.5"/>
              <!-- cheeks -->
              <circle id="pcheekL" cx="56" cy="104" r="12" fill="#ff9ec7" opacity=".8"/>
              <circle id="pcheekR" cx="124" cy="104" r="12" fill="#ff9ec7" opacity=".8"/>
              <!-- eyes -->
              <g id="peyes">
                <ellipse id="peyeL" cx="66" cy="88" rx="13" ry="16" fill="#4a3b4d"/>
                <ellipse id="peyeR" cx="114" cy="88" rx="13" ry="16" fill="#4a3b4d"/>
                <circle class="pupil" id="ppupL" cx="66" cy="88" r="0" fill="#4a3b4d"/>
                <circle class="pupil" id="ppupR" cx="114" cy="88" r="0" fill="#4a3b4d"/>
                <circle id="pglL" cx="71" cy="82" r="4.5" fill="#fff"/><circle id="pglR" cx="119" cy="82" r="4.5" fill="#fff"/>
                <circle cx="61" cy="94" r="2.4" fill="#fff"/><circle cx="109" cy="94" r="2.4" fill="#fff"/>
              </g>
              <!-- mouth -->
              <path id="pmouth" d="M82 112 q8 9 16 0" fill="none" stroke="#4a3b4d" stroke-width="3.5" stroke-linecap="round"/>
              <g id="pacc"></g>
            </g>
          </g>
        </svg>
      </button>
    </div>
    <div class="pet-hud">
      <span class="pn" id="petName"></span>
      <div class="meter" aria-hidden="true"><i id="petMeter"></i></div>
      <span class="lv" id="petLv">Lv.1</span>
    </div>
  </div>

  <script>window.THEME_ID = "61-chibi";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    "use strict";
    const P=CJCData.profile,t=CJCData.t.bind(CJCData),esc=CJCData.escapeHtml;
    const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const $=id=>document.getElementById(id);
    let articles=[],projects=[],filterKey="all";
    const faces=['(・ω・)','(≧▽≦)','(๑˃ᴗ˂)','(◕ᴗ◕)','(*≧ω≦)','(ﾉ◕ヮ◕)'];
    const L=()=>CJCData.lang();
    const petName={en:'Mochi',zh:'麻糬'};
    const tr=o=>o[L()]||o.en;

    /* ================= CONTENT RENDER ================= */
    function renderStatic(){
      $('nav').innerHTML=[
        ['about','nav_about'],['skills','nav_courses'],['courses','core_courses'],['projects','nav_portfolio'],
        ['articles','nav_article'],['certificates','nav_certificate'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');
      $('greet').textContent=t(P.greeting)+' ✨';
      $('name').textContent=t(P.name);
      $('role').textContent=t(P.role)+' ♪';
      $('tag').textContent=t(P.title);
      const cv=$('cvBtn'); cv.href=t(P.cv); cv.querySelector('span').textContent=t(P.ui.download_cv);
      $('ghBtn').href=P.contact.github;
      $('portrait').src=P.avatar; $('portrait').onerror=function(){this.src=P.avatarAlt;};
      $('heromeet').innerHTML=L()==='zh'
        ? '👇 快看左下角，那是我的小伙伴 <b>麻糬</b>！点点它、喂喂它～'
        : '👇 See the corner? That\'s my buddy <b>Mochi</b>! Pet it &amp; feed it~';

      $('l-about').textContent=t(P.ui.about_me);
      $('l-edu').textContent=t(P.ui.education_bg);
      $('l-skills').textContent=t(P.ui.core_tech);
      $('l-courses').textContent=t(P.ui.core_courses);
      $('l-exp').textContent=t(P.ui.internship_exp);
      $('l-projects').textContent=t(P.ui.latest_projects);
      $('l-articles').textContent=t(P.ui.latest_articles);
      $('l-certs').textContent=t(P.ui.certificates);
      $('l-contact').textContent=t(P.ui.get_in_touch);

      $('bio').innerHTML=P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('');
      $('loc').innerHTML=`<i class="fa fa-map-marker"></i> ${esc(t(P.location))}`;

      $('edu').innerHTML=P.education.map(e=>`
        <div class="rowi"><div class="p">${esc(e.period)}</div>
        <h3>${esc(t(e.school))}</h3><div class="s">${esc(t(e.degree))} — ${esc(t(e.note))}</div></div>`).join('');

      $('skills-box').innerHTML=P.skills.map((s,i)=>`
        <div class="sk"><div class="face">${faces[i%faces.length]}</div><div class="v">${esc(s)}</div></div>`).join('');
      $('tags').innerHTML=P.skillTags.map(x=>`<span>${esc(x)}</span>`).join('');

      $('courses-box').innerHTML=P.courses.map(c=>`
        <div class="course"><div class="ic"><i class="fa ${esc(c.icon)}"></i></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');

      $('exp').innerHTML=P.experience.map(x=>`
        <div class="rowi"><div class="p">${esc(x.period)}</div>
        <h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3>
        <div class="s">${esc(t(x.summary))}</div>
        <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div>`).join('');

      $('certs').innerHTML=P.certificates.map(c=>`
        <div class="cert"><img src="${esc(c.image)}" alt="${esc(t(c.title))}" onerror="this.src='/index_page/img/blogs/1.jpg'">
        <div class="ct"><div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');

      $('cinfo').innerHTML=[
        ['Email',P.contact.email,'mailto:'+P.contact.email],
        ['Phone',P.contact.phone,P.contact.phoneHref],
        ['GitHub','@'+P.contact.githubUser,P.contact.github],
        ['WeChat','QR ↗',P.contact.wechatQrPage]
      ].map(([k,v,h])=>`<a href="${esc(h)}" target="_blank" rel="noopener"><span>${esc(k)}</span><span>${esc(v)}</span></a>`).join('');
      $('lb-name').textContent=t(P.ui.name_placeholder); $('lb-email').textContent=t(P.ui.email_placeholder); $('lb-msg').textContent=t(P.ui.msg_placeholder);
      $('cf-name').placeholder=t(P.ui.name_placeholder);
      $('cf-email').placeholder=t(P.ui.email_placeholder);
      $('cf-msg').placeholder=t(P.ui.msg_placeholder);
      $('cf-send').textContent=t(P.ui.send)+' 💕';

      $('fsoc').innerHTML=`
        <a href="${P.contact.github}" target="_blank" rel="noopener">GitHub</a>
        <a href="mailto:${P.contact.email}">Email</a>
        <a href="${P.contact.wechatQrPage}">WeChat</a>
        <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      $('foot-desc').textContent=t(P.ui.footer_desc)+' ♥';
      const icp=$('foot-icp'); icp.textContent=P.icp; icp.href=P.icpUrl;
      $('petName').textContent=tr(petName);

      $('filters').innerHTML=P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      $('filters').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box=$('projects-box');
      if(!projects.length){ box.innerHTML=`<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML=projects.map(p=>`
        <a class="card" href="${esc(p.href)}">
          <div class="cbody">
            <div class="ctag"><span>${esc(t(P.ui.tech_stack))}</span><span>${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <p class="tech">${esc(p.tech_stack||'')}</p>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div></a>`).join('');
    }
    function renderArticles(){
      const box=$('articles-box');
      const list=CJCData.filterArticles(articles,filterKey);
      if(!articles.length){ box.innerHTML=`<div class="load-note">${esc(t(P.ui.loading_articles))}</div>`; return; }
      if(!list.length){ box.innerHTML=`<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML=list.map(a=>`
        <a class="card" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
          <div class="cbody">
            <div class="ctag"><span>${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div></a>`).join('');
    }
    async function loadDynamic(){
      try{ projects=await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ $('projects-box').innerHTML=`<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles=await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ $('articles-box').innerHTML=`<div class="load-note">⚠ Failed to load / 加载失败</div>`; }
    }

    $('cf').addEventListener('submit',async(e)=>{
      e.preventDefault();
      const f=e.target,s=$('cf-status');
      s.style.color='var(--mut)'; s.textContent=t(P.ui.sending)+' (๑˃ᴗ˂)';
      try{ const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});
        s.style.color='#2a9d6a'; s.textContent=(r.message||'Sent!')+' ♥'; f.reset(); mochiSay(SAY.thanks); happy(10); }
      catch(err){ s.style.color='var(--pink)'; s.textContent=err.message; }
    });

    /* ================= COMPANION ================= */
    const svg=$('petSvg');
    let clicks=0, friend=34, level=1, outfit=0, danceTimer=null;
    const OUTFITS=[
      {body:'#8fd3ff', acc:''},
      {body:'#ffd86b', acc:'<path d="M62 30 L90 44 L118 30 L112 52 L90 58 L68 52 Z" fill="#ff4d8d" stroke="#4a3b4d" stroke-width="3"/><circle cx="90" cy="44" r="6" fill="#fff" stroke="#4a3b4d" stroke-width="2.5"/>'},
      {body:'#8ff0c8', acc:'<path d="M60 34 q30 -26 60 0 l-6 8 q-24 -18 -48 0 Z" fill="#7fcdff" stroke="#4a3b4d" stroke-width="3"/><rect x="84" y="20" width="12" height="14" rx="3" fill="#ff86b3" stroke="#4a3b4d" stroke-width="2.5"/>'},
      {body:'#c9b6ff', acc:'<circle cx="66" cy="30" r="6" fill="#ffd86b" stroke="#4a3b4d" stroke-width="2.5"/><circle cx="114" cy="30" r="6" fill="#ff86b3" stroke="#4a3b4d" stroke-width="2.5"/><circle cx="90" cy="22" r="6" fill="#7fcdff" stroke="#4a3b4d" stroke-width="2.5"/>'}
    ];

    /* -- speech lines -- */
    const SAY={
      hi:{en:"Hi hi~! I'm Mochi, {n}'s little buddy. Scroll and I'll show you around! (≧▽≦)",
          zh:"你好呀～我是麻糬，{n} 的小跟班！往下滑，我带你逛逛！(≧▽≦)"},
      pet:{en:"Ehehe~ that tickles! ♡ (๑˃ᴗ˂)",zh:"嘿嘿～好痒呀！♡ (๑˃ᴗ˂)"},
      pet2:{en:"More pets please! You're the best~",zh:"再摸摸嘛～你最好了！"},
      hungry:{en:"Psst... I'm a little hungry. Maybe find me a treat? 🍪",zh:"嘘…我有点饿饿。帮我找块小饼干好不好？🍪"},
      eat:{en:"Nom nom nom~ YUMMY!! Thank you!! ٩(◕‿◕)۶",zh:"呜姆呜姆～太好吃啦！！谢谢你！٩(◕‿◕)۶"},
      transform:{en:"WOAH! You found my secret outfit!! ✨ Ta-daa~",zh:"哇！你发现了我的隐藏装扮！！✨ 噔噔～"},
      thanks:{en:"Yay! Your letter zoomed off to {n}! ♥",zh:"耶！你的信已经飞去给 {n} 啦！♥"},
      about:{en:"This is {n}! Loves building neat, tidy little products. So cool~ (◕ᴗ◕)",zh:"这位就是 {n}！超爱做又实用又优雅的小产品，好厉害～(◕ᴗ◕)"},
      education:{en:"{n} studies at some really cool schools! 🎓 Smarty pants~",zh:"{n} 在超棒的学校读书哦！🎓 小学霸～"},
      skills:{en:"Look at ALL these powers {n} has! ✨ Pick one, it wiggles!",zh:"快看 {n} 会这么多本领！✨ 点一个，会抖抖哦！"},
      courses:{en:"These are the classes {n} totally aced! 📚 Amazing~",zh:"这些都是 {n} 学得超好的课！📚 好棒棒～"},
      experience:{en:"{n} did REAL grown-up work at Xnew! 💼 I'm so proud!",zh:"{n} 在 Xnew 做过真正的工作哦！💼 我好骄傲！"},
      projects:{en:"{n} built {c} awesome things! Tap a card to peek inside~ 🎁",zh:"{n} 造了 {c} 个超棒的作品！点点卡片瞧一瞧～🎁"},
      articles:{en:"{n} wrote {c} blog posts! Pick a topic and read along~ ✏️",zh:"{n} 写了 {c} 篇博客！挑个话题一起看～✏️"},
      certificates:{en:"Shiny shiny trophies!! 🏅 {n} earned every one!",zh:"闪闪发光的奖状！！🏅 每一张都是 {n} 努力得来的！"},
      contact:{en:"Wanna say hi to {n}? Write a little letter right here~ 💌",zh:"想跟 {n} 打招呼吗？在这儿写封小信吧～💌"}
    };
    function say(o){ return (o[L()]||o.en).replace('{n}',t(P.name)).replace('{c}', o===SAY.projects?projects.length:(o===SAY.articles?articles.length:'')); }
    let bubbleTimer=null;
    function mochiSay(o,sticky){
      $('petWho').textContent=tr(petName)+' :';
      $('petSay').textContent=say(o);
      const b=$('petBubble'); b.classList.remove('hide');
      clearTimeout(bubbleTimer);
      if(!sticky && window.innerWidth<=760){ bubbleTimer=setTimeout(()=>b.classList.add('hide'),5200); }
    }

    /* -- eyes/head follow cursor -- */
    let px=0,py=0,hasFollow=false;
    function petCenter(){ const r=svg.getBoundingClientRect(); return {x:r.left+r.width/2,y:r.top+r.height*0.42}; }
    if(!reduce){
      window.addEventListener('pointermove',e=>{ if(e.pointerType==='touch')return; px=e.clientX;py=e.clientY;hasFollow=true; },{passive:true});
      window.addEventListener('touchmove',()=>{ hasFollow=false; },{passive:true});
    }
    function followFrame(){
      if(hasFollow){
        const c=petCenter(); let dx=(px-c.x), dy=(py-c.y);
        const d=Math.max(1,Math.hypot(dx,dy)); const nx=dx/d, ny=dy/d;
        const pupd=Math.min(4.5, d/60);
        ['ppupL','ppupR'].forEach(id=>{ const el=$(id); el.setAttribute('transform',`translate(${(nx*pupd).toFixed(1)} ${(ny*pupd).toFixed(1)})`); el.setAttribute('r','4.2'); });
        $('pglL').setAttribute('transform',`translate(${(nx*pupd*0.6).toFixed(1)} ${(ny*pupd*0.6).toFixed(1)})`);
        $('pglR').setAttribute('transform',`translate(${(nx*pupd*0.6).toFixed(1)} ${(ny*pupd*0.6).toFixed(1)})`);
        const tilt=Math.max(-5,Math.min(5,dx/40));
        $('petHead').setAttribute('transform',`rotate(${tilt.toFixed(1)} 90 118)`);
      }
      requestAnimationFrame(followFrame);
    }

    /* -- blink -- */
    function blink(){ if(reduce)return; const e=$('peyes'); e.classList.add('blink'); setTimeout(()=>e.classList.remove('blink'),120);
      setTimeout(blink, 2600+Math.random()*3400); }

    /* -- mood -- */
    function mouth(state){
      const m=$('pmouth');
      if(state==='happy') m.setAttribute('d','M78 108 q12 16 24 0');
      else if(state==='eat') m.setAttribute('d','M84 110 q6 12 12 0 q-6 -4 -12 0 Z');
      else m.setAttribute('d','M82 112 q8 9 16 0');
    }
    function moodHappy(ms){ mouth('happy'); $('pcheekL').setAttribute('opacity','1'); $('pcheekR').setAttribute('opacity','1');
      clearTimeout(moodHappy._t); moodHappy._t=setTimeout(()=>{mouth('idle');$('pcheekL').setAttribute('opacity','.8');$('pcheekR').setAttribute('opacity','.8');}, ms||1400); }

    /* -- hearts burst -- */
    function burst(kind){
      if(reduce)return;
      const layer=$('burst'); const icons=kind==='star'?['✨','⭐','🌟','💫']:['💖','💕','💗','♡','🩷'];
      for(let i=0;i<8;i++){ const s=document.createElement('span'); s.className='burst';
        s.textContent=icons[(Math.random()*icons.length)|0];
        const ang=Math.random()*Math.PI - Math.PI, dist=40+Math.random()*60;
        s.style.left=(60+Math.random()*60)+'px'; s.style.top=(60+Math.random()*30)+'px';
        s.style.setProperty('--dx',(Math.cos(ang)*dist).toFixed(0)+'px');
        s.style.setProperty('--dy',(-40-Math.random()*70).toFixed(0)+'px');
        s.style.animation='floatup '+(0.8+Math.random()*0.6)+'s ease-out forwards';
        layer.appendChild(s); setTimeout(()=>s.remove(),1500);
      }
    }

    /* -- friendship meter -- */
    function happy(n){ friend=Math.min(100,friend+n); $('petMeter').style.width=friend+'%';
      const nl=friend>=90?3:friend>=60?2:1; if(nl!==level){ level=nl; $('petLv').textContent='Lv.'+level; burst('star'); }
    }
    function setMeter(){ $('petMeter').style.width=friend+'%'; }

    /* -- petting -- */
    let petLine=0;
    function petIt(){
      moodHappy(1300);
      if(!reduce){ svg.classList.remove('squish'); void svg.offsetWidth; svg.classList.add('squish'); }
      burst('heart'); happy(4);
      clicks++;
      mochiSay(clicks%2? SAY.pet:SAY.pet2, true);
      if(clicks===4 && !fed) setTimeout(()=>mochiSay(SAY.hungry,true),1200);
      if(clicks>=7){ clicks=0; transform(); }
    }
    svg.addEventListener('click',e=>{ e.preventDefault(); petIt(); });

    /* -- transform / dance (7-click easter egg) -- */
    function transform(){
      outfit=(outfit+1)%OUTFITS.length;
      $('pbody').setAttribute('fill',OUTFITS[outfit].body);
      $('pacc').innerHTML=OUTFITS[outfit].acc;
      burst('star'); happy(12); moodHappy(2600);
      mochiSay(SAY.transform,true);
      if(!reduce){ svg.classList.add('dance'); clearTimeout(danceTimer); danceTimer=setTimeout(()=>svg.classList.remove('dance'),2100); }
    }

    /* -- hidden treat feeding -- */
    let fed=false;
    const treat=$('treat');
    function placeTreat(){
      const spots=[[12,'left'],[80,'left'],[40,'right']];
      const s=spots[(Math.random()*spots.length)|0];
      treat.style.top=(14+Math.random()*46)+'%';
      if(s[1]==='left'){ treat.style.left=(6+Math.random()*10)+'%'; treat.style.right='auto'; }
      else { treat.style.right=(6+Math.random()*12)+'%'; treat.style.left='auto'; }
      treat.style.opacity=''; treat.style.transform=''; treat.classList.remove('fly');
      treat.style.display='block';
    }
    treat.addEventListener('click',()=>{
      fed=true;
      const c=petCenter();
      const tr0=treat.getBoundingClientRect();
      treat.style.left=tr0.left+'px'; treat.style.top=tr0.top+'px'; treat.style.right='auto';
      treat.classList.add('fly'); void treat.offsetWidth;
      treat.style.left=(c.x-14)+'px'; treat.style.top=(c.y-6)+'px'; treat.style.transform='scale(.4)';
      setTimeout(()=>{
        treat.style.opacity='0'; mouth('eat');
        if(!reduce){ svg.classList.remove('squish'); void svg.offsetWidth; svg.classList.add('squish'); }
        burst('heart'); happy(20); mochiSay(SAY.eat,true);
        setTimeout(()=>{ mouth('happy'); setTimeout(()=>mouth('idle'),1400); },400);
        setTimeout(()=>{ treat.style.display='none'; setTimeout(placeTreat, 9000+Math.random()*6000); }, 700);
      },560);
    });

    /* -- section narration (reacts to what you view) -- */
    const NAR={about:SAY.about,education:SAY.education,skills:SAY.skills,courses:SAY.courses,
      experience:SAY.experience,projects:SAY.projects,articles:SAY.articles,certificates:SAY.certificates,contact:SAY.contact};
    let curSection='';
    function initNarration(){
      const io=new IntersectionObserver(es=>{
        es.forEach(e=>{ if(e.target.classList.contains('reveal')||e.target.tagName==='SECTION'){} });
        // pick most visible section
        let best=null,bestR=0;
        document.querySelectorAll('section[id]').forEach(sec=>{
          const r=sec.getBoundingClientRect(); const vis=Math.min(r.bottom,innerHeight)-Math.max(r.top,0);
          if(vis>bestR){bestR=vis;best=sec.id;}
        });
        if(best && best!==curSection && NAR[best]){ curSection=best; mochiSay(NAR[best]); }
      },{threshold:[0,.25,.5,.75]});
      document.querySelectorAll('section[id]').forEach(s=>io.observe(s));
      // reveal
      const ro=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in');}),{threshold:0.12});
      document.querySelectorAll('.reveal').forEach(r=>ro.observe(r));
    }

    /* ================= INIT ================= */
    document.addEventListener('DOMContentLoaded',()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({accent:'#ff86b3'});
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); mochiSay(curSection&&NAR[curSection]?NAR[curSection]:SAY.hi); });
      setMeter(); mouth('idle');
      mochiSay(SAY.hi,true);
      if(reduce){ document.querySelectorAll('.reveal').forEach(r=>r.classList.add('in')); }
      else { requestAnimationFrame(followFrame); blink(); }
      initNarration();
      placeTreat();
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Chibi</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{ --pink:#ff86b3; --pink2:#ffb3d1; --sky:#8fd3ff; --mint:#8ff0c8; --lav:#c9b6ff; --yellow:#ffd86b;
      --ink:#5a4a5c; --mut:#9d8ca0; --line:#ffd0e2; --paper:#fff;
      --stroke:#4a3b4d; }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;line-height:1.6;overflow-x:hidden;
      background:linear-gradient(180deg,#ffe3ef 0%,#ffeef6 24%,#e8f4ff 60%,#e6fbf2 100%);background-attachment:fixed}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    h1,h2,h3,.disp{font-family:'Baloo 2',cursive}
    .wrap{max-width:1060px;margin:0 auto;padding:0 22px;position:relative;z-index:2}

    /* sparkle field */
    .spk{position:fixed;font-size:20px;z-index:1;pointer-events:none;animation:twinkle 2.6s ease-in-out infinite}
    @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}

    .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);
      border-bottom:3px solid var(--line)}
    .topbar .row{display:flex;align-items:center;justify-content:space-between;height:60px}
    .brand{font-family:'Baloo 2';font-weight:800;font-size:22px;color:var(--pink)}
    .brand b{color:var(--sky)}
    .nav{display:flex;gap:16px}
    .nav a{font-weight:600;font-size:14px;color:var(--mut)}
    .nav a:hover{color:var(--pink)}
    @media(max-width:880px){.nav{display:none}}

    section{padding:56px 0}
    .card-box{background:var(--paper);border:3px solid var(--stroke);border-radius:28px;padding:28px;
      box-shadow:6px 6px 0 rgba(74,59,77,.14)}
    .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:22px}
    .sec-head .em{font-size:30px}
    .sec-head h2{font-family:'Baloo 2';font-weight:800;font-size:clamp(24px,4.2vw,40px);margin:0;color:var(--pink)}

    /* HERO */
    .hero{padding:44px 0 24px}
    .hero .grid{display:grid;grid-template-columns:1fr 320px;gap:30px;align-items:center}
    @media(max-width:820px){.hero .grid{grid-template-columns:1fr;text-align:center}}
    .bubble{display:inline-block;background:#fff;border:3px solid var(--stroke);border-radius:22px;padding:8px 16px;
      font-weight:700;color:var(--pink);position:relative;box-shadow:4px 4px 0 rgba(74,59,77,.12);margin-bottom:8px}
    .bubble::after{content:"";position:absolute;left:26px;bottom:-12px;width:16px;height:16px;background:#fff;
      border-right:3px solid var(--stroke);border-bottom:3px solid var(--stroke);transform:rotate(45deg)}
    .hero h1{font-family:'Baloo 2';font-weight:800;font-size:clamp(46px,11vw,104px);line-height:.98;margin:12px 0 6px;
      color:var(--pink);text-shadow:3px 3px 0 #fff,5px 5px 0 var(--pink2)}
    .hero .role{font-weight:700;font-size:clamp(18px,2.6vw,26px);color:var(--sky)}
    .hero .tag{color:var(--mut);max-width:44ch;margin:12px auto 22px;font-size:17px}
    @media(min-width:821px){.hero .tag{margin-left:0}}
    .btns{display:flex;flex-wrap:wrap;gap:14px}
    @media(max-width:820px){.btns{justify-content:center}}
    .btn{display:inline-flex;align-items:center;gap:8px;font-family:'Baloo 2';font-weight:700;font-size:15px;
      padding:12px 24px;border-radius:999px;cursor:pointer;transition:transform .15s;border:3px solid var(--stroke)}
    .btn.pri{background:var(--pink);color:#fff;box-shadow:0 5px 0 #d95f8e}
    .btn.pri:hover{transform:translateY(-3px)}
    .btn.pri:active{transform:translateY(2px);box-shadow:0 2px 0 #d95f8e}
    .btn.gho{background:var(--yellow);color:#6a5626;box-shadow:0 5px 0 #d9b24a}
    .btn.gho:hover{transform:translateY(-3px)}

    /* mascot */
    .mascot{width:100%;max-width:300px;margin:0 auto;animation:bob 3s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

    /* about */
    .about{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:start}
    @media(max-width:740px){.about{grid-template-columns:1fr}}
    .about .pic{border:4px solid var(--stroke);border-radius:24px;overflow:hidden;box-shadow:6px 6px 0 var(--pink2);background:#fff}
    .about .pic img{width:100%;aspect-ratio:1;object-fit:cover}
    .about p{margin:0 0 12px;font-size:16.5px;max-width:60ch}
    .loc{display:inline-flex;gap:8px;align-items:center;background:var(--mint);color:#2a6b52;border:3px solid var(--stroke);
      border-radius:999px;padding:7px 15px;font-weight:700}

    /* rows */
    .rows{display:flex;flex-direction:column;gap:16px}
    .rowi{border:3px solid var(--stroke);border-radius:20px;padding:16px 18px;background:#fff8fb}
    .rowi .p{color:var(--sky);font-weight:700}
    .rowi h3{font-family:'Baloo 2';margin:2px 0 4px;font-size:19px;color:var(--pink)}
    .rowi .s{color:var(--mut)}
    .rowi ul{margin:8px 0 0;padding-left:18px;line-height:1.7}

    /* skills stickers */
    .skills{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    @media(max-width:760px){.skills{grid-template-columns:1fr 1fr}}
    @media(max-width:460px){.skills{grid-template-columns:1fr}}
    .sk{border:3px solid var(--stroke);border-radius:20px;padding:16px;text-align:center;transition:transform .16s;box-shadow:4px 4px 0 rgba(74,59,77,.1)}
    .sk:nth-child(3n+1){background:#fff0f6}.sk:nth-child(3n+2){background:#eef8ff}.sk:nth-child(3n){background:#eefcf5}
    .sk:hover{transform:translateY(-4px) rotate(-2deg)}
    .sk .face{font-size:22px}
    .sk .v{margin-top:6px;font-weight:600;font-size:15px}
    .tags{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:18px}
    .tags span{font-weight:600;font-size:13px;padding:7px 15px;border-radius:999px;border:3px solid var(--stroke);background:#fff;color:var(--pink)}

    /* courses */
    .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    @media(max-width:820px){.courses{grid-template-columns:1fr 1fr}}
    @media(max-width:500px){.courses{grid-template-columns:1fr}}
    .course{border:3px solid var(--stroke);border-radius:22px;padding:20px;background:#fff;transition:transform .16s;box-shadow:5px 5px 0 rgba(74,59,77,.12)}
    .course:hover{transform:translateY(-4px) rotate(1.5deg)}
    .course .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:22px;border:3px solid var(--stroke)}
    .course:nth-child(3n+1) .ic{background:var(--pink)}.course:nth-child(3n+2) .ic{background:var(--sky)}.course:nth-child(3n) .ic{background:var(--lav)}
    .course h4{font-family:'Baloo 2';margin:12px 0 8px;font-size:17px;color:var(--pink)}
    .course p{margin:0;color:var(--mut);font-size:14.5px}

    /* cards */
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    @media(max-width:860px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.cards{grid-template-columns:1fr}}
    .card{border:3px solid var(--stroke);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;background:#fff;
      transition:transform .16s;box-shadow:5px 5px 0 rgba(74,59,77,.12)}
    .card:hover{transform:translateY(-6px) rotate(-1deg)}
    .card .cover{height:154px;overflow:hidden;background:#ffe3ef}
    .card .cover img{width:100%;height:100%;object-fit:cover;transition:.4s}
    .card:hover .cover img{transform:scale(1.07)}
    .cbody{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
    .ctag{display:flex;justify-content:space-between;font-size:11px;color:var(--sky);letter-spacing:.04em;text-transform:uppercase;font-weight:700}
    .card h4{font-family:'Baloo 2';margin:0;font-size:17px;line-height:1.3;color:var(--pink)}
    .card p{margin:0;color:var(--mut);font-size:14px;flex:1}
    .tech{color:var(--lav);font-weight:700;font-size:12.5px}
    .more{color:var(--pink);font-weight:700;font-size:13px}

    .filters{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px}
    .filters button{font-family:'Fredoka';font-weight:600;font-size:13px;background:#fff;border:3px solid var(--stroke);
      color:var(--mut);padding:7px 16px;border-radius:999px;cursor:pointer;transition:.15s}
    .filters button.active,.filters button:hover{background:var(--pink);border-color:var(--stroke);color:#fff}

    /* certs */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    @media(max-width:640px){.certs{grid-template-columns:1fr}}
    .cert{display:grid;grid-template-columns:120px 1fr;border:3px solid var(--stroke);border-radius:22px;overflow:hidden;background:#fff;box-shadow:5px 5px 0 rgba(74,59,77,.1)}
    .cert img{width:100%;height:100%;object-fit:cover;min-height:140px}
    .cert .ct{padding:16px}
    .cert .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--sky);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
    .cert h4{font-family:'Baloo 2';margin:8px 0 6px;font-size:16px;color:var(--pink)}
    .cert p{margin:0;color:var(--mut);font-size:13.5px}
    @media(max-width:400px){.cert{grid-template-columns:88px 1fr}}

    /* contact */
    .contact{display:grid;grid-template-columns:1fr 1.2fr;gap:26px}
    @media(max-width:800px){.contact{grid-template-columns:1fr}}
    .cinfo a{display:flex;justify-content:space-between;padding:13px 0;border-bottom:2px dashed var(--line);font-weight:600}
    .cinfo a span:last-child{color:var(--pink)}
    form input,form textarea{width:100%;background:#fff8fb;border:3px solid var(--stroke);border-radius:16px;
      color:var(--ink);font-family:inherit;font-size:15px;padding:14px;margin-bottom:13px}
    form input:focus,form textarea:focus{outline:none;border-color:var(--pink)}
    form textarea{min-height:120px;resize:vertical}
    #cf-status{font-weight:700;margin-top:4px;font-size:14px}

    footer{padding:40px 0 60px;text-align:center}
    .fsoc{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
    .fsoc a{color:var(--mut);font-weight:600;font-size:13px}
    .fsoc a:hover{color:var(--pink)}
    .muted{color:#b0a0b3;font-size:13px;margin-top:12px}
    .load-note{grid-column:1/-1;color:var(--mut);text-align:center;padding:18px;border:3px dashed var(--line);border-radius:16px}

    @media(prefers-reduced-motion:reduce){ .spk,.mascot{animation:none} *{scroll-behavior:auto} }
  </style>
</head>
<body>
  <div class="spk" style="top:16%;left:8%">✨</div>
  <div class="spk" style="top:30%;right:10%;animation-delay:.6s">⭐</div>
  <div class="spk" style="top:52%;left:5%;animation-delay:1.1s">✨</div>
  <div class="spk" style="top:68%;right:7%;animation-delay:1.6s">💖</div>
  <div class="spk" style="top:84%;left:12%;animation-delay:.3s">⭐</div>

  <div class="topbar"><div class="wrap row">
    <a class="brand" href="#top">Cai<b>Jiechao</b></a>
    <nav class="nav" id="nav"></nav>
  </div></div>

  <div id="top"></div>
  <header class="hero"><div class="wrap"><div class="grid">
    <div>
      <span class="bubble" id="greet"></span>
      <h1 id="name"></h1>
      <div class="role" id="role"></div>
      <p class="tag" id="tag"></p>
      <div class="btns">
        <a class="btn pri" id="cvBtn" download><i class="fa fa-download"></i><span></span></a>
        <a class="btn gho" id="ghBtn" target="_blank" rel="noopener"><i class="fa fa-github"></i>GitHub</a>
      </div>
    </div>
    <div>
      <svg class="mascot" viewBox="0 0 240 260" role="img" aria-label="cute chibi mascot">
        <ellipse cx="120" cy="248" rx="60" ry="10" fill="rgba(74,59,77,.12)"/>
        <!-- body -->
        <path d="M78 200 q42 26 84 0 l-6 40 q-36 16 -72 0 Z" fill="#8fd3ff" stroke="#4a3b4d" stroke-width="5"/>
        <!-- arms -->
        <circle cx="66" cy="196" r="16" fill="#ffd0a8" stroke="#4a3b4d" stroke-width="5"/>
        <circle cx="174" cy="196" r="16" fill="#ffd0a8" stroke="#4a3b4d" stroke-width="5"/>
        <!-- big head -->
        <circle cx="120" cy="112" r="92" fill="#ffe1cf" stroke="#4a3b4d" stroke-width="6"/>
        <!-- hair -->
        <path d="M32 96 q10 -78 88 -80 q78 2 88 80 q-24 -34 -88 -34 q-64 0 -88 34 Z" fill="#5a4a5c" stroke="#4a3b4d" stroke-width="5"/>
        <path d="M120 30 q-10 20 -30 22 M120 30 q10 20 30 22" fill="none" stroke="#4a3b4d" stroke-width="4"/>
        <!-- cheeks -->
        <circle cx="76" cy="132" r="15" fill="#ff9ec7" opacity=".8"/>
        <circle cx="164" cy="132" r="15" fill="#ff9ec7" opacity=".8"/>
        <!-- eyes -->
        <ellipse cx="88" cy="112" rx="17" ry="21" fill="#4a3b4d"/>
        <ellipse cx="152" cy="112" rx="17" ry="21" fill="#4a3b4d"/>
        <circle cx="94" cy="105" r="6" fill="#fff"/><circle cx="158" cy="105" r="6" fill="#fff"/>
        <circle cx="84" cy="118" r="3" fill="#fff"/><circle cx="148" cy="118" r="3" fill="#fff"/>
        <!-- mouth -->
        <path d="M108 142 q12 14 24 0" fill="none" stroke="#4a3b4d" stroke-width="4" stroke-linecap="round"/>
        <!-- sparkle -->
        <text x="196" y="70" font-size="26">✨</text>
      </svg>
    </div>
  </div></div></header>

  <section id="about"><div class="wrap"><div class="card-box">
    <div class="sec-head"><span class="em">🐱</span><h2 id="l-about"></h2></div>
    <div class="about">
      <div class="pic"><img id="portrait" alt="Cai Jiechao portrait" /></div>
      <div><div id="bio"></div><span class="loc" id="loc"></span></div>
    </div>
  </div></div></section>

  <section id="education"><div class="wrap"><div class="card-box">
    <div class="sec-head"><span class="em">🎓</span><h2 id="l-edu"></h2></div>
    <div class="rows" id="edu"></div>
  </div></div></section>

  <section id="skills"><div class="wrap"><div class="card-box">
    <div class="sec-head"><span class="em">🌈</span><h2 id="l-skills"></h2></div>
    <div class="skills" id="skills-box"></div>
    <div class="tags" id="tags"></div>
  </div></div></section>

  <section id="courses"><div class="wrap"><div class="card-box">
    <div class="sec-head"><span class="em">📚</span><h2 id="l-courses"></h2></div>
    <div class="courses" id="courses-box"></div>
  </div></div></section>

  <section id="experience"><div class="wrap"><div class="card-box">
    <div class="sec-head"><span class="em">💼</span><h2 id="l-exp"></h2></div>
    <div class="rows" id="exp"></div>
  </div></div></section>

  <section id="projects"><div class="wrap"><div class="card-box">
    <div class="sec-head"><span class="em">🎁</span><h2 id="l-projects"></h2></div>
    <div class="cards" id="projects-box"><div class="load-note" id="proj-load"></div></div>
  </div></div></section>

  <section id="articles"><div class="wrap"><div class="card-box">
    <div class="sec-head"><span class="em">✏️</span><h2 id="l-articles"></h2></div>
    <div class="filters" id="filters"></div>
    <div class="cards" id="articles-box"><div class="load-note" id="art-load"></div></div>
  </div></div></section>

  <section id="certificates"><div class="wrap"><div class="card-box">
    <div class="sec-head"><span class="em">🏅</span><h2 id="l-certs"></h2></div>
    <div class="certs" id="certs"></div>
  </div></div></section>

  <section id="contact"><div class="wrap"><div class="card-box">
    <div class="sec-head"><span class="em">💌</span><h2 id="l-contact"></h2></div>
    <div class="contact">
      <div class="cinfo" id="cinfo"></div>
      <form id="cf">
        <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
        <input type="text" name="name" id="cf-name" required>
        <input type="email" name="email" id="cf-email" required>
        <textarea name="message" id="cf-msg" required></textarea>
        <button type="submit" class="btn pri" id="cf-send"></button>
        <p id="cf-status"></p>
      </form>
    </div>
  </div></div></section>

  <footer><div class="wrap">
    <div class="fsoc" id="fsoc"></div>
    <div class="muted" id="foot-desc"></div>
    <a class="muted" id="foot-icp" target="_blank" rel="noopener" style="display:inline-block"></a>
  </div></footer>

  <script>window.THEME_ID = "61-chibi";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P=CJCData.profile,t=CJCData.t.bind(CJCData),esc=CJCData.escapeHtml;
    let articles=[],projects=[],filterKey="all";
    const faces=['(・ω・)','(≧▽≦)','(๑˃ᴗ˂)','(◕ᴗ◕)','(*≧ω≦)','(ﾉ◕ヮ◕)'];

    function renderStatic(){
      document.getElementById('nav').innerHTML=[
        ['about','nav_about'],['skills','nav_courses'],['projects','nav_portfolio'],
        ['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');
      document.getElementById('greet').textContent=t(P.greeting)+' ✨';
      document.getElementById('name').textContent=t(P.name);
      document.getElementById('role').textContent=t(P.role)+' ♪';
      document.getElementById('tag').textContent=t(P.title);
      const cv=document.getElementById('cvBtn'); cv.href=t(P.cv); cv.querySelector('span').textContent=t(P.ui.download_cv);
      document.getElementById('ghBtn').href=P.contact.github;
      document.getElementById('portrait').src=P.avatar;

      document.getElementById('l-about').textContent=t(P.ui.about_me);
      document.getElementById('l-edu').textContent=t(P.ui.education_bg);
      document.getElementById('l-skills').textContent=t(P.ui.core_tech);
      document.getElementById('l-courses').textContent=t(P.ui.core_courses);
      document.getElementById('l-exp').textContent=t(P.ui.internship_exp);
      document.getElementById('l-projects').textContent=t(P.ui.latest_projects);
      document.getElementById('l-articles').textContent=t(P.ui.latest_articles);
      document.getElementById('l-certs').textContent=t(P.ui.certificates);
      document.getElementById('l-contact').textContent=t(P.ui.get_in_touch);

      document.getElementById('bio').innerHTML=P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('');
      document.getElementById('loc').innerHTML=`<i class="fa fa-map-marker"></i> ${esc(t(P.location))}`;

      document.getElementById('edu').innerHTML=P.education.map(e=>`
        <div class="rowi"><div class="p">${esc(e.period)}</div>
        <h3>${esc(t(e.school))}</h3><div class="s">${esc(t(e.degree))} — ${esc(t(e.note))}</div></div>`).join('');

      document.getElementById('skills-box').innerHTML=P.skills.map((s,i)=>`
        <div class="sk"><div class="face">${faces[i%faces.length]}</div><div class="v">${esc(s)}</div></div>`).join('');
      document.getElementById('tags').innerHTML=P.skillTags.map(x=>`<span>${esc(x)}</span>`).join('');

      document.getElementById('courses-box').innerHTML=P.courses.map(c=>`
        <div class="course"><div class="ic"><i class="fa ${esc(c.icon)}"></i></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');

      document.getElementById('exp').innerHTML=P.experience.map(x=>`
        <div class="rowi"><div class="p">${esc(x.period)}</div>
        <h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3>
        <div class="s">${esc(t(x.summary))}</div>
        <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div>`).join('');

      document.getElementById('certs').innerHTML=P.certificates.map(c=>`
        <div class="cert"><img src="${esc(c.image)}" alt="${esc(t(c.title))}" onerror="this.src='/index_page/img/blogs/1.jpg'">
        <div class="ct"><div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');

      document.getElementById('cinfo').innerHTML=[
        ['Email',P.contact.email,'mailto:'+P.contact.email],
        ['Phone',P.contact.phone,P.contact.phoneHref],
        ['GitHub','@'+P.contact.githubUser,P.contact.github],
        ['WeChat','QR ↗',P.contact.wechatQrPage]
      ].map(([k,v,h])=>`<a href="${esc(h)}"><span>${esc(k)}</span><span>${esc(v)}</span></a>`).join('');
      document.getElementById('cf-name').placeholder=t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder=t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder=t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent=t(P.ui.send)+' 💕';

      document.getElementById('fsoc').innerHTML=`
        <a href="${P.contact.github}" target="_blank" rel="noopener">GitHub</a>
        <a href="mailto:${P.contact.email}">Email</a>
        <a href="${P.contact.wechatQrPage}">WeChat</a>
        <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent=t(P.ui.footer_desc)+' ♥';
      const icp=document.getElementById('foot-icp'); icp.textContent=P.icp; icp.href=P.icpUrl;

      document.getElementById('filters').innerHTML=P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box=document.getElementById('projects-box');
      if(!projects.length){ box.innerHTML=`<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML=projects.map(p=>`
        <a class="card" href="${esc(p.href)}">
          <div class="cbody">
            <div class="ctag"><span>${esc(t(P.ui.tech_stack))}</span><span>${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <p class="tech">${esc(p.tech_stack||'')}</p>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div></a>`).join('');
    }
    function renderArticles(){
      const box=document.getElementById('articles-box');
      const list=CJCData.filterArticles(articles,filterKey);
      if(!list.length){ box.innerHTML=`<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML=list.map(a=>`
        <a class="card" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
          <div class="cbody">
            <div class="ctag"><span>${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div></a>`).join('');
    }
    async function loadDynamic(){
      try{ projects=await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-box').innerHTML=`<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles=await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-box').innerHTML=`<div class="load-note">⚠ Failed to load articles.</div>`; }
    }

    document.getElementById('cf').addEventListener('submit',async(e)=>{
      e.preventDefault();
      const f=e.target,s=document.getElementById('cf-status');
      s.style.color='var(--mut)'; s.textContent=t(P.ui.sending)+' (๑˃ᴗ˂)';
      try{ const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});
        s.style.color='#2a9d6a'; s.textContent=(r.message||'Sent!')+' ♥'; f.reset(); }
      catch(err){ s.style.color='var(--pink)'; s.textContent=err.message; }
    });

    document.addEventListener('DOMContentLoaded',()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({accent:'#ff86b3'});
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

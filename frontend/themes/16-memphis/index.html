<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Memphis</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{
      --cream:#fdf0d5; --ink:#1c1a2e; --coral:#ff4d6d; --cobalt:#3d5af1;
      --sun:#ffd23f; --teal:#17c3b2; --white:#fffdf7;
      --shadow:6px 6px 0 var(--ink);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;background:var(--cream);color:var(--ink);
      font-family:'Fredoka','Poppins',system-ui,sans-serif;font-size:18px;line-height:1.6;
      -webkit-font-smoothing:antialiased;overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    ::selection{background:var(--sun);color:var(--ink)}
    .wrap{max-width:1160px;margin:0 auto;padding:0 32px;position:relative}
    @media(max-width:600px){.wrap{padding:0 18px}}
    .poppins{font-family:'Poppins',sans-serif}

    /* decorative confetti layer */
    .deco{position:absolute;pointer-events:none;z-index:0}
    .d-dotgrid{width:90px;height:90px;
      background-image:radial-gradient(var(--cobalt) 3px,transparent 3.5px);
      background-size:18px 18px}
    .d-circle{border-radius:50%}
    .d-halfL{border-radius:100px 0 0 100px}
    .d-tri{width:0;height:0;border-style:solid}
    .d-ring{border-radius:50%;background:transparent}
    .d-squig{width:120px;height:34px}
    .d-zig{width:110px;height:24px}
    @media(prefers-reduced-motion:no-preference){
      .float{animation:float 7s ease-in-out infinite}
      .float.b{animation-duration:9s;animation-delay:-2s}
      .float.c{animation-duration:11s;animation-delay:-4s}
      .spin{animation:spin 18s linear infinite}
    }
    @keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-16px) rotate(var(--r,0deg))}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:700px){.deco.hide-sm{display:none}}

    /* topbar */
    .topbar{position:sticky;top:0;z-index:800;background:var(--cream);border-bottom:4px solid var(--ink)}
    .topbar .in{display:flex;align-items:center;justify-content:space-between;height:66px}
    .brand{font-family:'Poppins',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em}
    .brand b{color:var(--coral)}
    .nav{display:flex;gap:8px}
    .nav a{font-weight:600;font-size:13px;padding:6px 12px;border:2px solid transparent;border-radius:40px;transition:.18s}
    .nav a:hover{border-color:var(--ink);background:var(--sun)}
    @media(max-width:880px){.nav{display:none}}

    /* section */
    section{padding:84px 0;position:relative;z-index:1}
    .sec-head{margin-bottom:44px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .sec-badge{font-family:'Poppins',sans-serif;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em;
      color:var(--white);background:var(--ink);padding:8px 16px;border-radius:40px;transform:rotate(-2deg)}
    .sec-title{font-family:'Poppins',sans-serif;font-weight:800;font-size:clamp(30px,5vw,52px);margin:0;line-height:1;letter-spacing:-.03em}
    .sec-title .u{position:relative;display:inline-block}
    .sec-title .u::after{content:"";position:absolute;left:-2px;right:-2px;bottom:2px;height:12px;background:var(--sun);z-index:-1;transform:rotate(-1deg)}

    /* hero */
    .hero{padding:70px 0 60px;position:relative}
    .hero .greet{display:inline-block;font-weight:700;background:var(--teal);color:var(--white);
      padding:9px 20px;border:3px solid var(--ink);border-radius:40px;box-shadow:var(--shadow);transform:rotate(-2deg);margin-bottom:26px}
    .hero h1{font-family:'Poppins',sans-serif;font-weight:800;font-size:clamp(48px,11vw,120px);line-height:.92;letter-spacing:-.04em;margin:0}
    .hero h1 .p1{color:var(--coral)}.hero h1 .p2{color:var(--cobalt)}
    .hero .role{display:inline-block;font-weight:700;font-size:clamp(18px,3vw,26px);margin:22px 0 0;
      background:var(--sun);padding:6px 16px;border:3px solid var(--ink);border-radius:14px;transform:rotate(1deg)}
    .hero .lede{font-size:20px;max-width:44ch;margin:26px 0 34px;font-weight:500}
    .actions{display:flex;gap:16px;flex-wrap:wrap}
    .btn{font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;padding:15px 30px;border:3px solid var(--ink);
      border-radius:50px;box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s;display:inline-flex;align-items:center;gap:10px;cursor:pointer}
    .btn:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
    .btn.coral{background:var(--coral);color:var(--white)}
    .btn.white{background:var(--white)}

    /* about */
    .about{display:grid;grid-template-columns:340px 1fr;gap:56px;align-items:center}
    .portrait-box{position:relative}
    .portrait-box .pf{border:4px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:8px 8px 0 var(--cobalt);background:var(--sun)}
    .portrait-box .pf img{width:100%;display:block}
    .portrait-box .sticker{position:absolute;bottom:-18px;right:-14px;background:var(--coral);color:var(--white);
      font-family:'Poppins',sans-serif;font-weight:800;padding:12px 18px;border:3px solid var(--ink);border-radius:50%;
      box-shadow:var(--shadow);transform:rotate(-8deg);width:78px;height:78px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px}
    .about p{font-size:18px;margin:0 0 18px;font-weight:500}
    .about .loc{display:inline-flex;align-items:center;gap:8px;font-weight:700;background:var(--teal);color:var(--white);
      padding:8px 16px;border:3px solid var(--ink);border-radius:40px}
    @media(max-width:860px){.about{grid-template-columns:1fr;gap:44px}.portrait-box{max-width:320px}}

    /* ledger blocks */
    .ledger{display:grid;gap:22px}
    .lrow{background:var(--white);border:3px solid var(--ink);border-radius:20px;padding:26px 28px;box-shadow:var(--shadow);position:relative}
    .lrow:nth-child(2n){box-shadow:6px 6px 0 var(--cobalt)}
    .lrow:nth-child(3n){box-shadow:6px 6px 0 var(--teal)}
    .lrow .yr{display:inline-block;font-family:'Poppins',sans-serif;font-weight:800;font-size:13px;
      background:var(--sun);padding:4px 12px;border:2px solid var(--ink);border-radius:30px;margin-bottom:12px}
    .lrow h3{font-family:'Poppins',sans-serif;font-weight:700;font-size:22px;margin:0 0 6px}
    .lrow .sub{font-weight:500;color:#555}
    .lrow ul{margin:16px 0 0;padding:0;list-style:none}
    .lrow ul li{position:relative;padding-left:28px;margin-bottom:10px;font-weight:500}
    .lrow ul li::before{content:"";position:absolute;left:2px;top:7px;width:12px;height:12px;background:var(--coral);border:2px solid var(--ink);border-radius:3px;transform:rotate(45deg)}

    /* skills */
    .skills{display:flex;flex-wrap:wrap;gap:14px}
    .chip{font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;padding:11px 20px;border:3px solid var(--ink);
      border-radius:40px;background:var(--white);box-shadow:4px 4px 0 var(--ink);transition:transform .16s}
    .chip:hover{transform:translateY(-4px) rotate(-2deg)}
    .chip:nth-child(4n+1){background:var(--coral);color:var(--white)}
    .chip:nth-child(4n+2){background:var(--cobalt);color:var(--white)}
    .chip:nth-child(4n+3){background:var(--sun)}
    .chip:nth-child(4n+4){background:var(--teal);color:var(--white)}

    /* courses */
    .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
    .course{background:var(--white);border:3px solid var(--ink);border-radius:22px;padding:30px 26px;box-shadow:var(--shadow);transition:transform .18s}
    .course:hover{transform:translateY(-6px)}
    .course:nth-child(3n+1){box-shadow:6px 6px 0 var(--coral)}
    .course:nth-child(3n+2){box-shadow:6px 6px 0 var(--cobalt)}
    .course:nth-child(3n){box-shadow:6px 6px 0 var(--teal)}
    .course .ci{width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:24px;
      border:3px solid var(--ink);border-radius:16px;margin-bottom:18px;color:var(--ink)}
    .course:nth-child(3n+1) .ci{background:var(--sun)}
    .course:nth-child(3n+2) .ci{background:var(--teal);color:var(--white)}
    .course:nth-child(3n) .ci{background:var(--coral);color:var(--white)}
    .course h4{font-family:'Poppins',sans-serif;font-weight:700;font-size:19px;margin:0 0 10px}
    .course p{font-size:15px;color:#444;margin:0;font-weight:500}
    @media(max-width:860px){.courses{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.courses{grid-template-columns:1fr}}

    /* cards */
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
    @media(max-width:860px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.cards{grid-template-columns:1fr}}
    .card{background:var(--white);border:3px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);
      display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s}
    .card:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink)}
    .card:nth-child(3n+1):hover{box-shadow:9px 9px 0 var(--coral)}
    .card:nth-child(3n+2):hover{box-shadow:9px 9px 0 var(--cobalt)}
    .card:nth-child(3n):hover{box-shadow:9px 9px 0 var(--teal)}
    .card .cover{aspect-ratio:16/10;overflow:hidden;background:var(--sun);border-bottom:3px solid var(--ink)}
    .card .cover img{width:100%;height:100%;object-fit:cover}
    .card .body{padding:22px;display:flex;flex-direction:column;gap:10px;flex:1}
    .card .tag{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
    .card .tag .cat{background:var(--ink);color:var(--white);padding:3px 10px;border-radius:20px}
    .card .tag .dt{color:#888}
    .card h4{font-family:'Poppins',sans-serif;font-weight:700;font-size:19px;margin:0;line-height:1.2}
    .card .stack{font-weight:600;font-size:13px;color:var(--cobalt)}
    .card p{font-size:15px;color:#444;margin:0;flex:1;font-weight:500}
    .card .more{font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;color:var(--coral)}

    .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:36px}
    .filters button{font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;padding:9px 18px;border:3px solid var(--ink);
      border-radius:40px;background:var(--white);cursor:pointer;transition:.16s}
    .filters button:hover{background:var(--sun)}
    .filters button.active{background:var(--coral);color:var(--white)}

    /* certs */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:24px}
    .cert{display:grid;grid-template-columns:120px 1fr;background:var(--white);border:3px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
    .cert:nth-child(2n){box-shadow:6px 6px 0 var(--cobalt)}
    .cert img{height:100%;width:100%;object-fit:cover;border-right:3px solid var(--ink)}
    .cert .ct{padding:22px}
    .cert .meta{display:flex;gap:8px;flex-wrap:wrap;font-weight:700;font-size:11px;text-transform:uppercase;margin-bottom:8px}
    .cert .meta .tg{background:var(--teal);color:var(--white);padding:3px 10px;border-radius:20px}
    .cert .meta .dt{color:#888;align-self:center}
    .cert h4{font-family:'Poppins',sans-serif;font-weight:700;font-size:18px;margin:0 0 6px}
    .cert p{font-size:14px;color:#444;margin:0;font-weight:500}
    @media(max-width:640px){.certs{grid-template-columns:1fr}.cert{grid-template-columns:96px 1fr}}

    /* contact */
    .contact{display:grid;grid-template-columns:1fr 1fr;gap:48px}
    .cinfo .lede{font-size:19px;font-weight:600;margin:0 0 26px}
    .cinfo a.row{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;margin-bottom:14px;
      background:var(--white);border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);transition:transform .16s}
    .cinfo a.row:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
    .cinfo a.row .k{font-weight:700}
    .cinfo a.row .v{font-weight:600;color:var(--cobalt)}
    form{background:var(--white);border:3px solid var(--ink);border-radius:22px;padding:28px;box-shadow:6px 6px 0 var(--sun)}
    form input,form textarea{width:100%;background:var(--cream);border:3px solid var(--ink);border-radius:14px;
      font-family:inherit;font-size:16px;font-weight:500;padding:14px;margin-bottom:16px}
    form input::placeholder,form textarea::placeholder{color:#8a8578}
    form input:focus,form textarea:focus{outline:none;background:#fff;box-shadow:3px 3px 0 var(--cobalt)}
    form textarea{min-height:120px;resize:vertical}
    form button{width:100%;font-family:'Poppins',sans-serif;font-weight:800;font-size:16px;padding:16px;
      border:3px solid var(--ink);border-radius:50px;background:var(--coral);color:var(--white);cursor:pointer;
      box-shadow:5px 5px 0 var(--ink);transition:transform .16s,box-shadow .16s}
    form button:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
    #cf-status{margin:14px 0 0;font-weight:700;font-size:14px}
    @media(max-width:760px){.contact{grid-template-columns:1fr;gap:36px}}

    footer{border-top:4px solid var(--ink);padding:56px 0 48px;background:var(--ink);color:var(--cream)}
    footer .frow{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
    footer .brand{color:var(--cream)}footer .brand b{color:var(--sun)}
    footer .fsoc{display:flex;gap:10px;flex-wrap:wrap}
    footer .fsoc a{font-weight:700;font-size:13px;padding:8px 16px;border:2px solid var(--cream);border-radius:40px;transition:.16s}
    footer .fsoc a:hover{background:var(--sun);color:var(--ink);border-color:var(--sun)}
    footer .muted{opacity:.7;font-size:13px;margin-top:20px}
    footer .muted a{color:var(--sun)}
    .load-note{grid-column:1/-1;text-align:center;font-weight:600;padding:24px;color:#666}
  </style>
</head>
<body>
  <div class="topbar"><div class="wrap in">
    <a class="brand" href="#top">Cai<b>Jiechao</b></a>
    <nav class="nav" id="nav"></nav>
  </div></div>

  <div id="top"></div>
  <header class="hero"><div class="wrap">
    <!-- confetti -->
    <span class="deco d-dotgrid hide-sm" style="top:20px;right:40px" aria-hidden="true"></span>
    <span class="deco d-ring float b hide-sm" style="top:130px;right:180px;width:70px;height:70px;border:9px solid var(--coral)" aria-hidden="true"></span>
    <span class="deco d-tri spin hide-sm" style="top:280px;right:90px;border-width:0 34px 58px 34px;border-color:transparent transparent var(--teal) transparent;--r:0" aria-hidden="true"></span>
    <span class="deco d-circle float hide-sm" style="top:40px;right:300px;width:26px;height:26px;background:var(--sun);border:3px solid var(--ink)" aria-hidden="true"></span>
    <svg class="deco float c hide-sm" style="bottom:30px;right:240px" width="120" height="34" viewBox="0 0 120 34" fill="none" aria-hidden="true">
      <path d="M2 17 C 14 2, 26 32, 38 17 S 62 2, 74 17 S 98 32, 118 17" stroke="var(--cobalt)" stroke-width="6" stroke-linecap="round" fill="none"/>
    </svg>

    <div class="greet" id="greet"></div>
    <h1 id="name"></h1>
    <div class="role" id="role"></div>
    <p class="lede" id="lede"></p>
    <div class="actions">
      <a class="btn coral" id="cvBtn" href="#" download><i class="fa fa-download"></i><span></span></a>
      <a class="btn white" id="ghBtn" target="_blank" rel="noopener"><i class="fa fa-github"></i><span></span></a>
    </div>
  </div></header>

  <section id="about"><div class="wrap">
    <span class="deco d-halfL float hide-sm" style="top:0;right:0;width:60px;height:120px;background:var(--cobalt)" aria-hidden="true"></span>
    <div class="sec-head"><span class="sec-badge">01</span><h2 class="sec-title" id="l-about"><span class="u"></span></h2></div>
    <div class="about">
      <div class="portrait-box">
        <div class="pf"><img id="portrait" alt="Portrait of Cai Jiechao"></div>
        <div class="sticker" id="sticker"></div>
      </div>
      <div>
        <div id="about-text"></div>
        <div class="loc"><i class="fa fa-map-marker"></i><span id="loc"></span></div>
      </div>
    </div>
  </div></section>

  <section id="education" style="background:var(--white);border-top:4px solid var(--ink);border-bottom:4px solid var(--ink)"><div class="wrap">
    <span class="deco d-dotgrid hide-sm" style="top:30px;right:20px" aria-hidden="true"></span>
    <div class="sec-head"><span class="sec-badge">02</span><h2 class="sec-title" id="l-edu"><span class="u"></span></h2></div>
    <div class="ledger" id="edu-list"></div>
  </div></section>

  <section id="skills"><div class="wrap">
    <div class="sec-head"><span class="sec-badge">03</span><h2 class="sec-title" id="l-skills"><span class="u"></span></h2></div>
    <div class="skills" id="skills-list"></div>
  </div></section>

  <section id="courses" style="background:var(--white);border-top:4px solid var(--ink);border-bottom:4px solid var(--ink)"><div class="wrap">
    <span class="deco d-ring spin hide-sm" style="top:40px;right:30px;width:56px;height:56px;border:8px solid var(--sun)" aria-hidden="true"></span>
    <div class="sec-head"><span class="sec-badge">04</span><h2 class="sec-title" id="l-courses"><span class="u"></span></h2></div>
    <div class="courses" id="courses-list"></div>
  </div></section>

  <section id="experience"><div class="wrap">
    <div class="sec-head"><span class="sec-badge">05</span><h2 class="sec-title" id="l-exp"><span class="u"></span></h2></div>
    <div class="ledger" id="exp-list"></div>
  </div></section>

  <section id="projects" style="background:var(--white);border-top:4px solid var(--ink);border-bottom:4px solid var(--ink)"><div class="wrap">
    <div class="sec-head"><span class="sec-badge">06</span><h2 class="sec-title" id="l-proj"><span class="u"></span></h2></div>
    <div class="cards" id="projects-list"><div class="load-note" id="proj-load"></div></div>
  </div></section>

  <section id="articles"><div class="wrap">
    <span class="deco d-circle float hide-sm" style="top:30px;right:20px;width:34px;height:34px;background:var(--teal);border:3px solid var(--ink)" aria-hidden="true"></span>
    <div class="sec-head"><span class="sec-badge">07</span><h2 class="sec-title" id="l-art"><span class="u"></span></h2></div>
    <div class="filters" id="filters"></div>
    <div class="cards" id="articles-list"><div class="load-note" id="art-load"></div></div>
  </div></section>

  <section id="certificates" style="background:var(--white);border-top:4px solid var(--ink);border-bottom:4px solid var(--ink)"><div class="wrap">
    <div class="sec-head"><span class="sec-badge">08</span><h2 class="sec-title" id="l-certs"><span class="u"></span></h2></div>
    <div class="certs" id="certs-list"></div>
  </div></section>

  <section id="contact"><div class="wrap">
    <span class="deco d-tri spin hide-sm" style="top:20px;right:40px;border-width:0 28px 48px 28px;border-color:transparent transparent var(--coral) transparent" aria-hidden="true"></span>
    <div class="sec-head"><span class="sec-badge">09</span><h2 class="sec-title" id="l-contact"><span class="u"></span></h2></div>
    <div class="contact">
      <div class="cinfo">
        <p class="lede" id="contact-lede"></p>
        <div id="contact-info"></div>
      </div>
      <form id="cf">
        <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none">
        <input type="text" name="name" id="cf-name" required>
        <input type="email" name="email" id="cf-email" required>
        <textarea name="message" id="cf-msg" required></textarea>
        <button type="submit" id="cf-send"></button>
        <p id="cf-status"></p>
      </form>
    </div>
  </div></section>

  <footer><div class="wrap">
    <div class="frow">
      <a class="brand" href="#top" style="font-family:'Poppins',sans-serif;font-weight:800;font-size:20px">Cai<b>Jiechao</b></a>
      <div class="fsoc" id="foot-social"></div>
    </div>
    <div class="frow" style="margin-top:6px">
      <p class="muted" id="foot-desc"></p>
      <p class="muted"><a id="foot-icp" target="_blank"></a></p>
    </div>
  </div></footer>

  <script>window.THEME_ID = "16-memphis";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";
    const $ = id => document.getElementById(id);
    const setU = (id,txt) => { $(id).querySelector('.u').textContent = txt; };

    function renderStatic(){
      document.title = (CJCData.lang()==='zh' ? '蔡杰超' : 'Cai Jiechao') + ' — Memphis';
      $('nav').innerHTML = [['about','nav_about'],['courses','nav_courses'],['projects','nav_portfolio'],
        ['articles','nav_article'],['contact','nav_contact']]
        .map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');
      $('greet').textContent = t(P.greeting);
      const nm = t(P.name), parts = nm.split(' ');
      if(parts.length>1){ $('name').innerHTML = `<span class="p1">${esc(parts[0])}</span> <span class="p2">${esc(parts.slice(1).join(' '))}</span>`; }
      else{ $('name').innerHTML = `<span class="p1">${esc(nm)}</span>`; }
      $('role').textContent = t(P.role);
      $('lede').textContent = t(P.title);
      const cv=$('cvBtn'); cv.querySelector('span').textContent=t(P.ui.download_cv); cv.href=t(P.cv);
      const gh=$('ghBtn'); gh.querySelector('span').textContent='GitHub'; gh.href=P.contact.github;

      setU('l-about', t(P.ui.about_me));
      setU('l-edu', t(P.ui.education_bg));
      setU('l-skills', t(P.ui.core_tech));
      setU('l-courses', t(P.ui.core_courses));
      setU('l-exp', t(P.ui.internship_exp));
      setU('l-proj', t(P.ui.latest_projects));
      setU('l-art', t(P.ui.latest_articles));
      setU('l-certs', t(P.ui.certificates));
      setU('l-contact', t(P.ui.get_in_touch));

      $('portrait').src = P.avatar;
      $('sticker').textContent = CJCData.lang()==='zh' ? '你好!' : 'Hello!';
      $('about-text').innerHTML = P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('');
      $('loc').textContent = t(P.location);

      $('edu-list').innerHTML = P.education.map(e=>`
        <div class="lrow"><span class="yr">${esc(e.period)}</span>
        <h3>${esc(t(e.school))}</h3><div class="sub">${esc(t(e.degree))} — ${esc(t(e.note))}</div></div>`).join('');

      $('skills-list').innerHTML = P.skillTags.map(s=>`<span class="chip">${esc(s)}</span>`).join('');

      $('courses-list').innerHTML = P.courses.map(c=>`
        <div class="course"><div class="ci"><i class="fa ${esc(c.icon)}"></i></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');

      $('exp-list').innerHTML = P.experience.map(x=>`
        <div class="lrow"><span class="yr">${esc(x.period)}</span>
        <h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3>
        <div class="sub">${esc(t(x.summary))}</div>
        <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div>`).join('');

      $('certs-list').innerHTML = P.certificates.map(c=>`
        <div class="cert"><img src="${esc(c.image)}" alt="${esc(t(c.title))}">
        <div class="ct"><div class="meta"><span class="tg">${esc(t(c.tag))}</span><span class="dt">${esc(t(c.date))}</span></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');

      $('contact-lede').textContent = t(P.ui.inbox_open);
      $('contact-info').innerHTML = [
        ['Email',P.contact.email,'mailto:'+P.contact.email],
        ['Phone',P.contact.phone,P.contact.phoneHref],
        ['GitHub','@'+P.contact.githubUser,P.contact.github],
        ['WeChat','QR',P.contact.wechatQrPage],
      ].map(([k,v,h])=>`<a class="row" href="${esc(h)}"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></a>`).join('');
      $('cf-name').placeholder=t(P.ui.name_placeholder);
      $('cf-email').placeholder=t(P.ui.email_placeholder);
      $('cf-msg').placeholder=t(P.ui.msg_placeholder);
      $('cf-send').textContent=t(P.ui.send);

      $('foot-social').innerHTML =
        `<a href="${P.contact.github}" target="_blank">GitHub</a>
         <a href="mailto:${P.contact.email}">Email</a>
         <a href="${P.contact.wechatQrPage}">WeChat</a>
         <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      $('foot-desc').textContent = t(P.ui.footer_desc);
      const icp=$('foot-icp'); icp.textContent=P.icp; icp.href=P.icpUrl;

      $('filters').innerHTML = P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box=$('projects-list');
      if(!projects.length){box.innerHTML=`<div class="load-note">${esc(t(P.ui.no_projects))}</div>`;return;}
      box.innerHTML = projects.map(p=>`
        <a class="card" href="${esc(p.href)}">
          <div class="body">
            <div class="tag"><span class="cat">${esc(t(P.ui.tech_stack))}</span><span class="dt">${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <div class="stack">${esc(p.tech_stack||'')}</div>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div></a>`).join('');
    }

    function renderArticles(){
      const box=$('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){box.innerHTML=`<div class="load-note">${esc(t(P.ui.no_articles))}</div>`;return;}
      box.innerHTML = list.map(a=>`
        <a class="card" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
          <div class="body">
            <div class="tag"><span class="cat">${esc(a.category||'')}</span><span class="dt">${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div></a>`).join('');
    }

    async function loadDynamic(){
      try{ projects=await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ $('projects-list').innerHTML=`<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles=await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ $('articles-list').innerHTML=`<div class="load-note">⚠ 内容加载失败 / Failed to load</div>`; }
    }

    $('cf').addEventListener('submit', async e=>{
      e.preventDefault();
      const f=e.target, s=$('cf-status');
      s.style.color='#666'; s.textContent=t(P.ui.sending);
      try{ const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});
        s.style.color='var(--teal)'; s.textContent=r.message||'Sent.'; f.reset(); }
      catch(err){ s.style.color='var(--coral)'; s.textContent=err.message; }
    });

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:'#ff4d6d' });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

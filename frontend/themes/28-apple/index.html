<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Keynote</title>
  <meta name="description" content="A keynote-style, scroll-driven product launch. The product is Cai Jiechao." />
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{
      --bg:#fbfbfd; --bg2:#ffffff; --ink:#1d1d1f; --ink2:#6e6e73; --ink3:#86868b;
      --line:rgba(0,0,0,.10); --card:#ffffff; --card2:#f5f5f7;
      --accent:#0071e3; --accent2:#0077ed;
      --shadow:0 8px 34px rgba(0,0,0,.10); --shadow2:0 22px 60px rgba(0,0,0,.14);
      --font:-apple-system,BlinkMacSystemFont,'Inter','PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      --maxw:1180px;
    }
    body.dark{
      --bg:#000000; --bg2:#0b0b0f; --ink:#f5f5f7; --ink2:#a1a1a6; --ink3:#86868b;
      --line:rgba(255,255,255,.14); --card:#141416; --card2:#1c1c1f;
      --shadow:0 8px 34px rgba(0,0,0,.5); --shadow2:0 22px 60px rgba(0,0,0,.6);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
      line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;
      transition:background .5s ease,color .5s ease}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    button{font-family:inherit}
    .wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
    ::selection{background:var(--accent);color:#fff}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

    /* ---------- Hello intro ---------- */
    #hello{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--bg);
      transition:opacity .9s ease,visibility .9s;}
    #hello.gone{opacity:0;visibility:hidden;pointer-events:none}
    #hello svg{width:min(60vw,460px);height:auto;overflow:visible}
    #hello text{font-family:'Dancing Script',cursive;font-size:150px;fill:none;
      stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
      stroke-dasharray:1400;stroke-dashoffset:1400;
      animation:draw 2.1s ease forwards,fillin .8s ease 1.7s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes fillin{to{fill:var(--ink);stroke-width:0}}
    .hello-skip{position:absolute;bottom:38px;left:0;right:0;text-align:center;color:var(--ink3);
      font-size:12px;letter-spacing:.02em;opacity:0;animation:fadein .6s ease 1.9s forwards}
    @keyframes fadein{to{opacity:1}}

    /* ---------- Nav ---------- */
    header.nav{position:sticky;top:0;z-index:900;
      background:color-mix(in srgb,var(--bg) 72%,transparent);
      backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
      border-bottom:1px solid var(--line)}
    .nav-in{display:flex;align-items:center;gap:26px;height:48px;max-width:var(--maxw);margin:0 auto;padding:0 22px}
    .logo{width:19px;height:23px;cursor:pointer;color:var(--ink);flex:none;transition:transform .2s}
    .logo:hover{transform:scale(1.08)}
    .nav-links{display:flex;gap:24px;flex:1;overflow:hidden}
    @media(min-width:1041px){.nav-in{padding-right:210px}}
    .nav-links a{font-size:12.5px;color:var(--ink);opacity:.85;white-space:nowrap;transition:opacity .2s}
    .nav-links a:hover{opacity:1;color:var(--accent)}
    @media(max-width:900px){.nav-links{display:none}}

    /* ---------- Chapter / section base ---------- */
    section{position:relative}
    .chap{padding:120px 0;text-align:center}
    .eyebrow{font-size:19px;font-weight:600;color:var(--accent);letter-spacing:.004em;margin:0 0 10px}
    .h2{font-size:clamp(34px,5.4vw,60px);font-weight:700;line-height:1.06;letter-spacing:-.015em;margin:0}
    .lead{font-size:clamp(19px,2.4vw,26px);font-weight:500;color:var(--ink2);line-height:1.4;
      max-width:720px;margin:22px auto 0}
    .grad{background:linear-gradient(120deg,#0071e3,#42a5f5 40%,#ac6cff 75%,#ff5e8a);
      -webkit-background-clip:text;background-clip:text;color:transparent}

    /* word-reveal masking */
    .reveal-words span{display:inline-block;overflow:hidden;vertical-align:top}
    .reveal-words span i{display:inline-block;font-style:normal;transform:translateY(110%);opacity:0;
      transition:transform .8s cubic-bezier(.2,.7,.2,1),opacity .8s}
    .in .reveal-words span i,.reveal-words.in span i{transform:translateY(0);opacity:1}
    .reveal-words span:nth-child(2) i{transition-delay:.08s}
    .reveal-words span:nth-child(3) i{transition-delay:.16s}
    .reveal-words span:nth-child(4) i{transition-delay:.24s}
    .reveal-words span:nth-child(5) i{transition-delay:.32s}
    .reveal-words span:nth-child(6) i{transition-delay:.40s}

    /* generic fade-up on enter */
    .fu{opacity:0;transform:translateY(38px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
    .in .fu,.fu.in{opacity:1;transform:none}
    .fu.d1{transition-delay:.09s}.fu.d2{transition-delay:.18s}.fu.d3{transition-delay:.27s}.fu.d4{transition-delay:.36s}

    /* ---------- Hero / keynote ---------- */
    .hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;padding:90px 22px 60px;overflow:hidden}
    .hero .eyebrow{font-size:21px}
    .hero-name{font-size:clamp(58px,13vw,150px);font-weight:700;line-height:.96;letter-spacing:-.03em;margin:6px 0 0}
    .hero-role{font-size:clamp(20px,3vw,30px);font-weight:600;color:var(--ink2);margin:16px 0 0}
    .hero-title{font-size:clamp(16px,2.2vw,20px);color:var(--ink3);margin:12px auto 0;max-width:600px}
    .cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:34px}
    .btn{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:500;
      padding:11px 22px;border-radius:980px;border:1px solid transparent;cursor:pointer;transition:.2s;background:none;color:inherit}
    .btn-fill{background:var(--accent);color:#fff}
    .btn-fill:hover{background:var(--accent2);transform:scale(1.02)}
    .btn-ghost{color:var(--accent)}
    .btn-ghost:hover{text-decoration:underline}

    /* the "product" — portrait that scales/rotates in on scroll */
    .product{margin:52px auto 0;width:min(340px,74vw);position:relative;will-change:transform}
    .product .frame{position:relative;border-radius:36px;overflow:hidden;
      box-shadow:var(--shadow2);border:1px solid var(--line);background:var(--card2);aspect-ratio:4/5}
    .product .frame img{width:100%;height:100%;object-fit:cover}
    .product .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:96px;height:20px;
      background:#000;border-radius:0 0 14px 14px;z-index:2;opacity:.92}
    .scroll-cue{margin-top:46px;color:var(--ink3);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
      display:flex;flex-direction:column;align-items:center;gap:8px}
    .scroll-cue .m{width:22px;height:34px;border:2px solid var(--ink3);border-radius:12px;position:relative}
    .scroll-cue .m::after{content:"";position:absolute;left:50%;top:6px;width:3px;height:7px;border-radius:2px;
      background:var(--ink3);transform:translateX(-50%);animation:wheel 1.7s ease infinite}
    @keyframes wheel{0%{opacity:0;transform:translate(-50%,0)}30%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translate(-50%,10px)}}

    /* ---------- About statement ---------- */
    .statement{max-width:960px;margin:0 auto;font-size:clamp(26px,4.4vw,50px);font-weight:600;
      line-height:1.2;letter-spacing:-.015em;text-align:center}
    .about-p{max-width:720px;margin:34px auto 0;font-size:18px;color:var(--ink2);line-height:1.6}
    .loc{display:inline-flex;align-items:center;gap:8px;margin-top:26px;font-size:15px;color:var(--ink3);
      border:1px solid var(--line);border-radius:980px;padding:8px 16px}

    /* ---------- Chip / specs ---------- */
    .chip-stage{position:relative;margin:56px auto 0;width:min(360px,80vw);aspect-ratio:1;display:grid;place-items:center}
    .chip{width:52%;aspect-ratio:1;border-radius:26px;display:grid;place-items:center;position:relative;
      background:linear-gradient(135deg,#e9edf3,#c7d0dc);box-shadow:inset 0 2px 8px rgba(255,255,255,.7),var(--shadow2);
      border:1px solid var(--line)}
    body.dark .chip{background:linear-gradient(135deg,#2a2a30,#141418)}
    .chip::before{content:"";position:absolute;inset:12%;border-radius:14px;
      background:conic-gradient(from 0deg,#0071e3,#42a5f5,#ac6cff,#ff5e8a,#0071e3);opacity:.9;
      -webkit-mask:radial-gradient(transparent 52%,#000 53%);mask:radial-gradient(transparent 52%,#000 53%);
      animation:spin 14s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .chip b{position:relative;z-index:2;font-size:clamp(16px,3.4vw,24px);font-weight:800;letter-spacing:-.02em;color:var(--ink)}
    .chip .pins{position:absolute;inset:-9px;border-radius:34px;
      background:
        repeating-linear-gradient(90deg,transparent 0 14px,var(--ink3) 14px 16px) top/100% 6px no-repeat,
        repeating-linear-gradient(90deg,transparent 0 14px,var(--ink3) 14px 16px) bottom/100% 6px no-repeat,
        repeating-linear-gradient(0deg,transparent 0 14px,var(--ink3) 14px 16px) left/6px 100% no-repeat,
        repeating-linear-gradient(0deg,transparent 0 14px,var(--ink3) 14px 16px) right/6px 100% no-repeat;
      opacity:.32}
    .chip-orbit{position:absolute;inset:0;pointer-events:none}
    .chip-orbit .t{position:absolute;left:50%;top:50%;font-size:12px;font-weight:600;color:var(--ink2);
      background:var(--card);border:1px solid var(--line);border-radius:980px;padding:5px 11px;white-space:nowrap;
      box-shadow:var(--shadow);transform:translate(-50%,-50%) translate(var(--x),var(--y)) scale(.6);opacity:0;
      transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .7s}
    .in .chip-orbit .t{transform:translate(-50%,-50%) translate(var(--x),var(--y)) scale(1);opacity:1}
    .specs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;max-width:900px;margin:56px auto 0;
      background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}
    .specs .s{background:var(--bg);padding:24px 18px}
    .specs .s .big{font-size:clamp(20px,3vw,30px);font-weight:700;letter-spacing:-.02em}
    .specs .s .lbl{font-size:13px;color:var(--ink3);margin-top:6px}
    @media(max-width:640px){.specs{grid-template-columns:1fr 1fr}}

    /* ---------- Bento ---------- */
    .bento{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:1000px;margin:52px auto 0;text-align:left}
    .bento .b{background:var(--card2);border-radius:24px;padding:26px;min-height:170px;
      display:flex;flex-direction:column;transition:transform .35s,opacity .9s,box-shadow .35s;border:1px solid var(--line)}
    .bento .b:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
    .bento .b .ic{font-size:26px;color:var(--accent);margin-bottom:14px}
    .bento .b h4{margin:0 0 8px;font-size:18px;font-weight:600;letter-spacing:-.01em}
    .bento .b p{margin:0;font-size:14px;color:var(--ink2);line-height:1.55}
    .bento .b.wide{grid-column:span 2}
    @media(max-width:820px){.bento{grid-template-columns:repeat(2,1fr)}.bento .b.wide{grid-column:span 2}}
    @media(max-width:480px){.bento{grid-template-columns:1fr}.bento .b.wide{grid-column:span 1}}

    /* ---------- Feature cards (projects) ---------- */
    .features{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin:52px auto 0;text-align:left;max-width:1080px}
    .feat{background:var(--card);border-radius:22px;overflow:hidden;border:1px solid var(--line);
      box-shadow:var(--shadow);transition:transform .35s,box-shadow .35s,opacity .9s;display:flex;flex-direction:column}
    .feat:hover{transform:translateY(-6px);box-shadow:var(--shadow2)}
    .feat .cov{aspect-ratio:16/10;background:var(--card2);overflow:hidden}
    .feat .cov img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
    .feat:hover .cov img{transform:scale(1.05)}
    .feat .fb{padding:22px 22px 24px;display:flex;flex-direction:column;flex:1}
    .feat .fb .tech{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.02em}
    .feat .fb h4{margin:8px 0 8px;font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
    .feat .fb p{margin:0 0 16px;font-size:14.5px;color:var(--ink2);line-height:1.55;flex:1}
    .feat .fb .more{font-size:14px;color:var(--accent);font-weight:500}

    /* ---------- Articles ---------- */
    .filters{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:34px auto 0}
    .filters button{font-size:13.5px;font-weight:500;color:var(--ink);background:var(--card2);
      border:1px solid transparent;border-radius:980px;padding:8px 16px;cursor:pointer;transition:.2s}
    .filters button:hover{background:var(--line)}
    .filters button.active{background:var(--accent);color:#fff}
    .articles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin:36px auto 0;text-align:left;max-width:1080px}
    .art{background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--line);transition:transform .3s;display:flex;flex-direction:column}
    .art:hover{transform:translateY(-5px)}
    .art .cov{aspect-ratio:16/9;background:var(--card2);overflow:hidden}
    .art .cov img{width:100%;height:100%;object-fit:cover}
    .art .ab{padding:18px 18px 20px;display:flex;flex-direction:column;flex:1}
    .art .cat{font-size:11.5px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
    .art h4{margin:8px 0 8px;font-size:17px;font-weight:600;line-height:1.28;letter-spacing:-.01em}
    .art p{margin:0 0 14px;font-size:13.5px;color:var(--ink2);line-height:1.5;flex:1;
      display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .art .date{font-size:12px;color:var(--ink3)}
    .note{color:var(--ink3);text-align:center;padding:30px;font-size:15px;grid-column:1/-1}

    /* ---------- Certificates ---------- */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:920px;margin:52px auto 0;text-align:left}
    .cert{background:var(--card);border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column}
    .cert .ci{aspect-ratio:16/10;overflow:hidden;background:var(--card2)}
    .cert .ci img{width:100%;height:100%;object-fit:cover}
    .cert .cc{padding:22px}
    .cert .cc .tag{font-size:12px;color:var(--accent);font-weight:600}
    .cert .cc h4{margin:8px 0 8px;font-size:19px;font-weight:600;letter-spacing:-.01em}
    .cert .cc p{margin:0 0 6px;font-size:14px;color:var(--ink2);line-height:1.5}
    .cert .cc .date{font-size:12.5px;color:var(--ink3)}
    @media(max-width:680px){.certs{grid-template-columns:1fr}}

    /* ---------- Education ---------- */
    .edu{max-width:760px;margin:46px auto 0;text-align:left;display:grid;gap:16px}
    .edu .e{background:var(--card2);border-radius:20px;padding:24px 26px;border:1px solid var(--line)}
    .edu .e .p{font-size:13px;color:var(--accent);font-weight:600}
    .edu .e h4{margin:6px 0 4px;font-size:21px;font-weight:600;letter-spacing:-.01em}
    .edu .e .d{font-size:15px;color:var(--ink2)}
    .edu .e .n{font-size:14px;color:var(--ink3);margin-top:6px}

    /* ---------- Experience ---------- */
    .exp{max-width:820px;margin:46px auto 0;text-align:left;background:var(--card2);border-radius:26px;padding:38px;border:1px solid var(--line)}
    .exp .top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;align-items:baseline}
    .exp h4{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em}
    .exp h4 span{color:var(--accent)}
    .exp .per{font-size:15px;color:var(--ink3);font-weight:500}
    .exp .sum{margin:14px 0 20px;font-size:15.5px;color:var(--ink2);line-height:1.6}
    .exp ul{margin:0;padding:0;list-style:none;display:grid;gap:12px}
    .exp li{position:relative;padding-left:28px;font-size:15px;color:var(--ink);line-height:1.5}
    .exp li::before{content:"";position:absolute;left:2px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--accent)}

    /* ---------- Contact ---------- */
    .contact-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:34px;max-width:960px;margin:46px auto 0;text-align:left}
    @media(max-width:760px){.contact-grid{grid-template-columns:1fr}}
    .ci-list{display:grid;gap:12px;align-content:start}
    .ci-list a{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--card2);
      border-radius:16px;border:1px solid var(--line);transition:.2s}
    .ci-list a:hover{transform:translateX(4px);border-color:var(--accent)}
    .ci-list a i{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--card);color:var(--accent);font-size:17px;flex:none}
    .ci-list a .k{font-size:12px;color:var(--ink3)}
    .ci-list a .v{font-size:15px;color:var(--ink);font-weight:500;word-break:break-word}
    form{background:var(--card2);border-radius:24px;padding:30px;border:1px solid var(--line)}
    form label{display:block;font-size:13px;color:var(--ink3);margin:0 0 8px;font-weight:500}
    form input,form textarea{width:100%;background:var(--bg2);color:var(--ink);border:1px solid var(--line);
      border-radius:14px;font-family:inherit;font-size:15px;padding:13px 15px;margin-bottom:18px;transition:.2s}
    form input:focus,form textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(0,113,227,.15)}
    form textarea{min-height:120px;resize:vertical}
    form .btn-fill{width:100%;justify-content:center}
    #cf-status{margin:14px 0 0;font-size:14px;font-weight:500;min-height:1.2em;text-align:center}

    /* ---------- Footer ---------- */
    footer{border-top:1px solid var(--line);padding:44px 0 60px;background:var(--bg2);margin-top:60px}
    .foot{max-width:var(--maxw);margin:0 auto;padding:0 22px}
    .foot .think{font-size:15px;color:var(--ink2);font-style:italic;max-width:560px;line-height:1.5;margin:0 0 26px}
    .foot-links{display:flex;flex-wrap:wrap;gap:22px;margin-bottom:22px}
    .foot-links a{font-size:13px;color:var(--ink2);transition:.2s}
    .foot-links a:hover{color:var(--accent)}
    .foot-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;padding-top:22px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3)}
    .foot-bottom a{color:var(--ink3)}.foot-bottom a:hover{color:var(--ink)}

    /* happy mac easter egg */
    #happymac{position:fixed;right:18px;bottom:16px;z-index:850;width:34px;height:34px;cursor:pointer;
      color:var(--ink3);opacity:.5;transition:opacity .2s,transform .2s}
    #happymac:hover{opacity:1;transform:scale(1.12) rotate(-4deg)}
    @media(max-width:1040px){#happymac{bottom:auto;top:58px;right:14px}}

    /* think-different overlay */
    #think{position:fixed;inset:0;z-index:9998;background:#000;color:#fff;display:grid;place-items:center;
      text-align:center;padding:30px;opacity:0;visibility:hidden;transition:opacity .6s}
    #think.on{opacity:1;visibility:visible}
    #think p{font-size:clamp(20px,3.4vw,34px);font-weight:300;line-height:1.4;max-width:820px}
    #think small{display:block;margin-top:22px;color:#86868b;font-size:14px}
    #think .rainbow{width:44px;height:52px;margin:0 auto 30px}

    @media(max-width:600px){.chap{padding:84px 0}}

    @media (prefers-reduced-motion: reduce){
      html{scroll-behavior:auto}
      *{animation:none!important;transition:none!important}
      #hello{display:none}
      .fu,.reveal-words span i{opacity:1!important;transform:none!important}
      .chip-orbit .t{opacity:1!important;transform:translate(-50%,-50%) translate(var(--x),var(--y))!important}
      .product{transform:none!important}
      .scroll-cue{display:none}
    }
  </style>
</head>
<body>
  <!-- Hello intro -->
  <div id="hello" aria-hidden="true">
    <svg viewBox="0 0 600 220"><text x="20" y="150">hello</text></svg>
    <div class="hello-skip">click to continue</div>
  </div>

  <!-- Nav -->
  <header class="nav">
    <div class="nav-in">
      <span class="logo" id="logo" role="button" tabindex="0" aria-label="Logo — play startup chime"></span>
      <nav class="nav-links" id="nav"></nav>
    </div>
  </header>

  <main>
    <!-- HERO / keynote -->
    <section class="hero" id="top">

    function happyMacSVG(){ return '<svg viewBox="0 0 34 34" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="3" width="26" height="28" rx="3"/><rect x="7" y="6" width="20" height="15" rx="1.5"/><circle cx="13" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="21" cy="12" r="1.4" fill="currentColor" stroke="none"/><path d="M12 16 q5 3 10 0" stroke-linecap="round"/><line x1="10" y1="26" x2="24" y2="26"/></svg>'; }

    /* Easter egg: synthesized Mac startup chime */
    var audioCtx=null;
    function chime(){
      if(reduce) return;
      try{
        audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
        var ac=audioCtx, now=ac.currentTime;
        var freqs=[130.81,164.81,196.00,261.63,329.63];
        var master=ac.createGain(); master.connect(ac.destination);
        master.gain.setValueAtTime(0,now);
        master.gain.linearRampToValueAtTime(.26,now+.02);
        master.gain.exponentialRampToValueAtTime(.0008,now+3.2);
        freqs.forEach(function(f,i){
          var o=ac.createOscillator(),g=ac.createGain();
          o.type=i<2?'sine':'triangle'; o.frequency.value=f; o.detune.value=(i-2)*3;
          g.gain.value=1/(i+1.4); o.connect(g); g.connect(master); o.start(now); o.stop(now+3.3);
        });
      }catch(e){}
    }

          '<div class="cc"><div class="tag">'+esc(t(c.tag))+' · '+esc(t(c.date))+'</div><h4>'+esc(t(c.title))+'</h4><p>'+esc(t(c.desc))+'</p></div></div>';

    var io, secIO;
    function observeNew(scope){
      if(reduce||!io) return;
      (scope||document).querySelectorAll('.fu:not(.in)').forEach(function(el){ io.observe(el); });
    }
    function setupObservers(){
      if(reduce){ document.querySelectorAll('[data-anim],.fu').forEach(function(s){s.classList.add('in');}); return; }
      secIO=new IntersectionObserver(function(es){
        es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); secIO.unobserve(e.target); } });
      },{threshold:.16});
      document.querySelectorAll('[data-anim]').forEach(function(s){ secIO.observe(s); });
      io=new IntersectionObserver(function(es){
        es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
      },{threshold:.12});
      observeNew(document);
    }
    function heroScrub(){
      if(reduce) return;
      var prod=document.getElementById('product'), raf=false;
      function upd(){
        raf=false;
        var y=window.scrollY, vh=window.innerHeight;
        var p=Math.min(1, Math.max(0, y/(vh*0.9)));
        var scale=0.86+0.14*(1-p*0.6);
        prod.style.transform='perspective(1200px) translateY('+(p*40).toFixed(1)+'px) scale('+scale.toFixed(3)+') rotateX('+((1-Math.min(1,y/vh))*3).toFixed(2)+'deg)';
        prod.style.opacity=(1-p*0.7).toFixed(2);
      }
      window.addEventListener('scroll',function(){ if(!raf){ raf=true; requestAnimationFrame(upd); } },{passive:true});
      upd();
    }
    function revealHero(){ var r=document.querySelector('.hero .reveal-words'); if(r) r.classList.add('in'); }
    function setupHello(){
      var h=document.getElementById('hello');
      if(reduce){ h.classList.add('gone'); revealHero(); return; }
      var done=false;
      function go(){ if(done) return; done=true; h.classList.add('gone'); revealHero(); }
      h.addEventListener('click', go);
      setTimeout(go, 3400);
    }
    function setupEggs(){
      var logo=document.getElementById('logo');
      logo.addEventListener('click', function(){ chime(); logo.querySelector('path').setAttribute('fill','url(#rg)'); setTimeout(function(){ var p=logo.querySelector('path'); if(p) p.setAttribute('fill','currentColor'); }, 2400); });
      logo.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); logo.click(); } });
      var hm=document.getElementById('happymac');
      hm.addEventListener('click', function(){ toggleDark(); chime(); });
      hm.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); hm.click(); } });
      var buf='';
      window.addEventListener('keydown', function(e){
        if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
        if(e.key.length!==1) return;
        buf=(buf+e.key.toLowerCase()).slice(-8);
        if(buf.indexOf('dark')!==-1){ toggleDark(); buf=''; }
        if(buf.indexOf('think')!==-1){ showThink(); buf=''; }
      });
      var think=document.getElementById('think');
      think.addEventListener('click', function(){ think.classList.remove('on'); think.setAttribute('aria-hidden','true'); });
    }
    function showThink(){ if(reduce) return; var el=document.getElementById('think'); el.classList.add('on'); el.setAttribute('aria-hidden','false'); chime(); }

    function setupForm(){
      var f=document.getElementById('cf');
      f.addEventListener('submit', function(e){
        e.preventDefault();
        var s=document.getElementById('cf-status');
        s.style.color='var(--ink3)'; s.textContent=t(P.ui.sending);
        CJC.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value})
          .then(function(r){ s.style.color='var(--accent)'; s.textContent='✓ '+(r.message||'Sent.'); f.reset(); })
          .catch(function(err){ s.style.color='#e0403f'; s.textContent='✗ '+err.message; });
      });
    }

    document.addEventListener('DOMContentLoaded', function(){
      CJC.setTheme(window.THEME_ID);
      renderAll();
      CJC.mountSwitcher({ accent:'#0071e3' });
      setupObservers();

      setupHello();
      setupEggs();
      setupForm();
      CJC.onLang(function(){
        renderAll();
        renderProjects();
        renderArticles();
        if(reduce) document.querySelectorAll('.fu').forEach(function(el){el.classList.add('in');});
        else observeNew(document);

      CJC.fetchProjects().then(function(list){ projects=list; renderProjects(); observeNew(document); }).catch(function(){
        document.getElementById('features').innerHTML='<div class="note">'+esc(t(P.ui.no_projects))+'</div>';
      });
      CJC.fetchArticles().then(function(list){ articles=list; renderArticles(); observeNew(document); }).catch(function(){
        document.getElementById('articles-list').innerHTML='<div class="note">'+esc(t(P.ui.no_articles))+'</div>';
      });
    });
  })();
  </script>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Cai Jiechao — terminal portfolio"><title>visitor@caijiechao:~</title><link rel="icon" href="/index_page/img/favicon.ico"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/themes/04-terminal/style.css"><style>
/* React Bits inspired FadeContent: command output enters as one fast, interruptible terminal response. */
.screen.rb-output-enter{animation:rb-terminal-output .24s cubic-bezier(.2,.8,.2,1)}
@keyframes rb-terminal-output{from{opacity:.62;transform:translateY(6px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
@media(prefers-reduced-motion:reduce){.screen.rb-output-enter{animation:none}}
</style></head><body><a class="skip" href="#terminal">Skip to terminal</a><main class="shell" id="terminal"><header class="term-head"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span id="titlebar">visitor@caijiechao: ~ — zsh</span><button id="lang" type="button" aria-label="Switch language">中文</button></header><section class="screen" id="screen" aria-live="polite"></section><form class="prompt" id="command-form"><label for="command" id="prompt-label">visitor@caijiechao:~$</label><input id="command" name="command" autocomplete="off" spellcheck="false" aria-label="Terminal command"><button type="submit">↵</button></form><p class="hint" id="hint">Type <kbd>help</kbd> to see commands · <kbd>↑</kbd>/<kbd>↓</kbd> history · <kbd>Esc</kbd> back</p></main><script>window.THEME_ID="04-terminal";</script><script src="/shared/profile.js"></script><script src="/shared/site-data.js"></script><script src="/themes/04-terminal/theme.js" defer></script><script>
(()=>{'use strict';
  addEventListener('DOMContentLoaded',()=>{
    const submit=document.querySelector('#command-form button[type="submit"]');
    if(submit)submit.setAttribute('aria-label','Run command');
    if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const screen=document.getElementById('screen');if(!screen)return;
    let raf=0;
    new MutationObserver(()=>{if(raf)cancelAnimationFrame(raf);screen.classList.remove('rb-output-enter');raf=requestAnimationFrame(()=>{void screen.offsetWidth;screen.classList.add('rb-output-enter')})}).observe(screen,{childList:true,subtree:true});
    screen.addEventListener('animationend',()=>screen.classList.remove('rb-output-enter'));
  });
})();
</script></body></html>

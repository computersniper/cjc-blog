<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Terminal</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#070b07; --panel:#0d130d; --green:#33ff66; --green-dim:#1f9e43;
      --amber:#ffcc66; --blue:#5aa9ff; --text:#b9f5c9; --dim:#5c8a68; --line:rgba(51,255,102,.22);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);
      font-family:'JetBrains Mono','SF Mono',ui-monospace,monospace;line-height:1.6;font-size:15px;overflow:hidden}
    a{color:var(--green);text-decoration:none}
    a:hover{text-decoration:underline}
    img{max-width:100%;display:block}
    ::selection{background:var(--green);color:#04120a}

    .scan{position:fixed;inset:0;z-index:9997;pointer-events:none;
      background:repeating-linear-gradient(rgba(10,14,10,0) 0 2px, rgba(0,0,0,.26) 2px 4px)}
    .flick{position:fixed;inset:0;z-index:9996;pointer-events:none;
      background:radial-gradient(120% 120% at 50% 50%, transparent 62%, rgba(0,0,0,.5) 100%);
      animation:flick 6s infinite steps(1)}
    @keyframes flick{0%,100%{opacity:1}47%{opacity:.95}48%{opacity:1}70%{opacity:.98}71%{opacity:1}}

    .shell{max-width:1020px;margin:0 auto;height:100vh;padding:16px 14px;display:flex}
    .term{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:11px;
      display:flex;flex-direction:column;overflow:hidden;
      box-shadow:0 0 0 1px rgba(0,0,0,.5),0 24px 70px rgba(0,0,0,.6),0 0 70px rgba(51,255,102,.06)}
    .titlebar{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:#0b110b}
    .dot{width:12px;height:12px;border-radius:50%}
    .dot.r{background:#ff5f56}.dot.y{background:#ffbd2e}.dot.g{background:#27c93f}
    .titlebar .tt{margin-left:8px;color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .screen{flex:1 1 auto;min-height:0;overflow-y:auto;padding:20px 22px 14px;scrollbar-width:thin;scrollbar-color:var(--green-dim) transparent}
    .screen::-webkit-scrollbar{width:9px}
    .screen::-webkit-scrollbar-thumb{background:var(--green-dim);border-radius:5px}

    .msgline{flex:none;padding:6px 20px;min-height:0;color:var(--amber);font-size:13px;border-top:1px dashed var(--line)}
    .msgline:empty{display:none}
    .inbar{flex:none;display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:#0b110b}
    .prompt{color:var(--dim);flex:none;white-space:nowrap}
    .prompt .u{color:var(--green)}.prompt .p{color:var(--blue)}.prompt .d{color:var(--amber)}
    #in{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--green);
      font-family:inherit;font-size:15px;caret-color:var(--green);padding:0}

    /* screen content */
    .cmdhead{color:var(--dim);margin:0 0 14px;word-break:break-word}
    .cmdhead .c{color:#fff}
    .backhint{margin-top:22px;padding-top:12px;border-top:1px dashed var(--line);color:var(--dim);font-size:13px}
    .backhint b{color:var(--green)}
    .green{color:var(--green)}.amber{color:var(--amber)}.dim{color:var(--dim)}.white{color:#fff}
    .cursor{display:inline-block;width:9px;height:1.05em;background:var(--green);vertical-align:-2px;margin-left:1px;animation:blink 1.05s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}

    .ascii-wrap{overflow:hidden;margin:2px 0 12px}
    .ascii{color:var(--green);font-size:13px;line-height:1.05;margin:0;display:inline-block;white-space:pre;
      transform-origin:left top;text-shadow:0 0 8px rgba(51,255,102,.5)}
    .idl{margin:2px 0}.idl b{color:#fff}
    .lead{color:var(--text);max-width:78ch;margin:10px 0 2px}

    /* menu grid */
    .menu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 18px;margin:16px 0 4px;max-width:640px}
    .mi{cursor:pointer;color:var(--green);padding:5px 8px;border:1px solid transparent;border-radius:5px}
    .mi::before{content:"› ";color:var(--dim)}
    .mi:hover{border-color:var(--line);background:rgba(51,255,102,.07)}
    .mi .d{color:var(--dim);font-size:12px}
    .metarow{margin-top:12px;color:var(--dim);font-size:13px}
    .metarow span{color:var(--green);cursor:pointer;margin-right:6px}
    .metarow span:hover{text-decoration:underline}
    @media(max-width:620px){.menu{grid-template-columns:1fr 1fr}}
    @media(max-width:420px){.menu{grid-template-columns:1fr}}

    .about{display:grid;grid-template-columns:130px 1fr;gap:20px;align-items:start}
    .about img{width:130px;height:130px;object-fit:cover;border:1px solid var(--line);border-radius:6px}
    .about p{margin:0 0 12px;max-width:74ch}
    @media(max-width:560px){.about{grid-template-columns:1fr}}

    .kv{border-left:2px solid var(--green-dim);padding:2px 0 2px 16px;margin:0 0 18px}
    .kv .k{color:var(--amber)}
    .kv h3{margin:2px 0 4px;font-size:16px;color:#fff;font-weight:700}
    .kv .meta{color:var(--dim);font-size:13.5px}
    .kv ul{margin:10px 0 0;padding-left:0;list-style:none}
    .kv ul li{padding-left:16px;position:relative;margin-bottom:6px;font-size:14px}
    .kv ul li::before{content:"+";position:absolute;left:0;color:var(--green)}

    .skills{display:flex;flex-wrap:wrap;gap:8px 10px}
    .skills span{border:1px solid var(--line);border-radius:4px;padding:4px 10px;font-size:13px;color:var(--green)}
    .skills span::before{content:"#";color:var(--dim)}

    .courses{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .course{border:1px solid var(--line);border-radius:6px;padding:14px}
    .course h4{margin:0 0 6px;font-size:14.5px;color:var(--green)}
    .course h4 i{margin-right:8px;color:var(--amber)}
    .course p{margin:0;font-size:13px;color:var(--text)}
    @media(max-width:620px){.courses{grid-template-columns:1fr}}

    .lslist{margin:0}
    .lslist .total{color:var(--dim);font-size:13px;margin-bottom:10px}
    .lsrow{display:block;padding:9px 10px;border-radius:5px;border:1px solid transparent;color:var(--text);margin-bottom:6px;cursor:pointer;transition:.12s}
    .lsrow:hover{background:rgba(51,255,102,.07);border-color:var(--line);text-decoration:none}
    .lsrow .idx{color:var(--amber)}
    .lsrow .fname{color:var(--green);font-weight:700}
    .lsrow .ttl{color:#fff}
    .lsrow .summ{color:var(--dim);font-size:13px;margin-top:3px}
    .lsrow .tech{color:var(--amber);font-size:12.5px;margin-top:2px}

    .detail h2{color:#fff;margin:0 0 6px;font-size:20px}
    .detail .m{color:var(--dim);font-size:13px;margin-bottom:14px}
    .detail .m .tag{color:var(--amber)}
    .detail p{max-width:76ch}
    .openbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--green);color:var(--green);
      padding:9px 16px;border-radius:5px;font-size:13.5px;cursor:pointer;background:transparent;font-family:inherit;margin-top:8px}
    .openbtn:hover{background:var(--green);color:#04120a;text-decoration:none}

    .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
    .filters button{background:transparent;border:1px solid var(--line);color:var(--dim);font-family:inherit;font-size:12.5px;padding:5px 11px;border-radius:4px;cursor:pointer}
    .filters button::before{content:"--";opacity:.6}
    .filters button.active,.filters button:hover{border-color:var(--green);color:var(--green)}

    .certs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .cert{border:1px solid var(--line);border-radius:6px;overflow:hidden;display:grid;grid-template-columns:92px 1fr}
    .cert img{height:100%;object-fit:cover}
    .cert .ct{padding:12px}
    .cert .ct .m{color:var(--amber);font-size:12px;margin-bottom:4px}
    .cert .ct h4{margin:0 0 5px;font-size:14px;color:#fff}
    .cert .ct p{margin:0;font-size:12.5px;color:var(--text)}
    @media(max-width:620px){.certs{grid-template-columns:1fr}}

    .contact{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
    .cinfo a{display:block;padding:6px 0;color:var(--green)}
    .cinfo a .k{color:var(--amber);display:inline-block;min-width:80px}
    .cinfo a .k::after{content:":"}
    form label{display:block;color:var(--dim);font-size:13px;margin:10px 0 4px}
    form label::before{content:"› ";color:var(--green)}
    form input,form textarea{width:100%;background:#060a06;border:1px solid var(--line);border-radius:5px;
      font-family:inherit;font-size:14px;padding:10px 12px;color:var(--green);caret-color:var(--green)}
    form input:focus,form textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px rgba(51,255,102,.18)}
    form textarea{min-height:110px;resize:vertical}
    form .openbtn{margin-top:14px}
    #cf-status{margin-top:12px;font-size:13.5px;min-height:1em}
    @media(max-width:620px){.contact{grid-template-columns:1fr}}

    .section-h{color:var(--dim);margin:26px 0 12px;padding-top:14px;border-top:1px dashed var(--line)}
    .section-h:first-child{margin-top:0;border-top:0;padding-top:0}
    .section-h .c{color:#fff}

    a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:2px}
    @media(prefers-reduced-motion:reduce){ .flick{animation:none;opacity:1} .cursor{animation:none} *{transition:none!important} }
  </style>
</head>
<body>
  <div class="scan" aria-hidden="true"></div>
  <div class="flick" aria-hidden="true"></div>

  <div class="shell">
    <div class="term">
      <div class="titlebar">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span class="tt" id="tt">visitor@caijiechao: ~ — zsh</span>
      </div>
      <div class="screen" id="screen"></div>
      <div class="msgline" id="msg"></div>
      <div class="inbar">
        <span class="prompt" id="prompt"></span>
        <input id="in" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="terminal command input" />
      </div>
    </div>
  </div>

  <script>window.THEME_ID = "04-terminal";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const PROMPT = '<span class="u">visitor@caijiechao</span>:<span class="p">~</span><span class="d">$</span>';
    let articles = [], projects = [], filterKey = 'all';
    let stack = ['home'];
    let curList = [];   // list currently shown (projects or filtered articles) for number-open
    const screen = () => document.getElementById('screen');

    const L = () => CJCData.lang();
    const S = {
      hintHome: {en:"type a command or click an item · <b>help</b> for all commands · <b>all</b> dumps everything", zh:"输入命令或点击条目 · 输入 <b>help</b> 看全部命令 · 输入 <b>all</b> 一次显示全部"},
      hintBack: {en:"type <b>back</b> / press <b>ESC</b> to return · <b>home</b> for the menu", zh:"输入 <b>back</b> 或按 <b>ESC</b> 返回 · 输入 <b>home</b> 回主菜单"},
      hintList: {en:"type a <b>number</b> (or click) to open · <b>back</b> / ESC to return", zh:"输入<b>编号</b>（或点击）打开 · <b>back</b> / ESC 返回"},
      welcome: {en:"Welcome. This is an interactive shell — everything is a command.", zh:"欢迎。这是一个可交互终端 —— 一切皆命令。"},
      sections:{en:"sections", zh:"板块"},
      meta:{en:"more", zh:"更多"},
      openFull:{en:"open full ↗", zh:"打开全文 ↗"},
      openProj:{en:"open project ↗", zh:"打开项目 ↗"},
      total:{en:"total", zh:"共"},
    };
    const tr = (o)=> o[L()] || o.en;

    function slug(s){ var v=String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,26); return v||'item'; }

    // ---------- section body builders (return inner HTML) ----------
    const NAV = [
      ['about','nav_about','cat about.md'], ['skills','core_tech','ls ~/skills'],
      ['education','education_bg','cat education.log'], ['courses','nav_courses','cat courses.txt'],
      ['experience','nav_internship','cat experience.log'], ['projects','nav_portfolio','ls ~/projects'],
      ['articles','nav_article','ls ~/articles'], ['certs','nav_certificate','cat certs.txt'],
      ['contact','nav_contact','./contact.sh'],
    ];
    function bAbout(){
      return `<div class="about"><img src="${esc(P.avatar)}" alt="${esc(t(P.name))}">
        <div>${P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('')}
        <p class="green"># ${esc(t(P.role))} · ${esc(t(P.location))}</p></div></div>`;
    }
    function bSkills(){ return `<div class="skills">${(P.skillTags||[]).map(s=>`<span>${esc(s)}</span>`).join('')}</div>`; }
    function bEducation(){ return P.education.map(e=>`<div class="kv"><div class="k">[${esc(e.period)}]</div>
      <h3>${esc(t(e.school))}</h3><div class="meta">${esc(t(e.degree))} — ${esc(t(e.note))}</div></div>`).join(''); }
    function bCourses(){ return `<div class="courses">${P.courses.map(c=>`<div class="course">
      <h4><i class="fa ${esc(c.icon)}"></i>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('')}</div>`; }
    function bExperience(){ return P.experience.map(x=>`<div class="kv"><div class="k">[${esc(x.period)}]</div>
      <h3>${esc(t(x.role))} @ ${esc(t(x.company))}</h3><div class="meta">${esc(t(x.summary))}</div>
      <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div>`).join(''); }
    function bCerts(){ return `<div class="certs">${P.certificates.map(c=>`<div class="cert">
      <img src="${esc(c.image)}" alt="${esc(t(c.title))}"><div class="ct"><div class="m">[${esc(t(c.tag))}] ${esc(t(c.date))}</div>
      <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('')}</div>`; }
    function bContact(){
      return `<div class="contact"><div class="cinfo">${[
        ['email',P.contact.email,'mailto:'+P.contact.email],['phone',P.contact.phone,P.contact.phoneHref],
        ['github','@'+P.contact.githubUser,P.contact.github],['wechat','scan_qr ↗',P.contact.wechatQrPage]
      ].map(([k,v,h])=>`<a href="${esc(h)}" target="_blank" rel="noopener"><span class="k">${esc(k)}</span> ${esc(v)}</a>`).join('')}</div>
      <form id="cf"><input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none">
        <label>${esc(t(P.ui.name_placeholder))}</label><input name="name" id="cf-name" required>
        <label>${esc(t(P.ui.email_placeholder))}</label><input type="email" name="email" id="cf-email" required>
        <label>${esc(t(P.ui.msg_placeholder))}</label><textarea name="message" id="cf-msg" required></textarea>
        <button type="submit" class="openbtn">→ ${esc(t(P.ui.send))}</button><p id="cf-status"></p></form></div>`;
    }
    function bProjects(){
      curList = projects.slice();
      if(!projects.length) return `<div class="dim">loading… (backend)</div>`;
      return `<div class="lslist"><div class="total">${tr(S.total)} ${projects.length}</div>${projects.map((p,i)=>`
        <a class="lsrow" data-open="project:${i}"><span class="idx">[${i+1}]</span> <span class="fname">${esc(slug(p.title))}/</span> <span class="ttl"># ${esc(p.localTitle())}</span>
        ${p.tech_stack?`<div class="tech">${esc(p.tech_stack)}</div>`:''}<div class="summ">${esc(p.localSummary()||'')}</div></a>`).join('')}</div>`;
    }
    function curArticles(){ return CJCData.filterArticles(articles, filterKey); }
    function bArticles(){
      const list = curArticles(); curList = list.slice();
      const chips = `<div class="filters">${P.articleFilters.map(f=>`<button data-filter="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('')}</div>`;
      if(!articles.length) return chips + `<div class="dim">loading… (backend)</div>`;
      if(!list.length) return chips + `<div class="amber">${esc(t(P.ui.no_articles))}</div>`;
      return chips + `<div class="lslist"><div class="total">${tr(S.total)} ${list.length}</div>${list.map((a,i)=>`
        <a class="lsrow" data-open="article:${i}"><span class="idx">[${i+1}]</span> <span class="fname">${esc(slug(a.title))}.md</span> <span class="ttl"># ${esc(a.localTitle())}</span>
        <div class="tech">[${esc(a.category||'')}] ${esc(a.dateText())}</div><div class="summ">${esc(a.localSummary()||'')}</div></a>`).join('')}</div>`;
    }
    function bProjectDetail(i){
      const p = curList[i] || projects[i]; if(!p) return `<div class="amber">no such project</div>`;
      return `<div class="detail"><h2>${esc(p.localTitle())}</h2>
        <div class="m"><span class="tag">tech</span> ${esc(p.tech_stack||'—')} · ${esc(p.dateText())}</div>
        <p>${esc(p.localSummary()||'')}</p>
        <a class="openbtn" href="${esc(p.href)}">▸ ${esc(tr(S.openProj))}</a></div>`;
    }
    function bArticleDetail(i){
      const a = curList[i] || articles[i]; if(!a) return `<div class="amber">no such article</div>`;
      return `<div class="detail"><h2>${esc(a.localTitle())}</h2>
        <div class="m"><span class="tag">[${esc(a.category||'')}]</span> ${esc(a.dateText())}</div>
        <p>${esc(a.localSummary()||'')}</p>
        <a class="openbtn" href="${esc(a.href)}">▸ ${esc(tr(S.openFull))}</a></div>`;
    }

    // ---------- home ----------
    const ASCII = ' ██████╗  █████╗  ██╗           ██╗ ██╗ ███████╗  ██████╗ ██╗  ██╗  █████╗   ██████╗\n'+
                  '██╔════╝ ██╔══██╗ ██║           ██║ ██║ ██╔════╝ ██╔════╝ ██║  ██║ ██╔══██╗ ██╔═══██╗\n'+
                  '██║      ███████║ ██║           ██║ ██║ █████╗   ██║      ███████║ ███████║ ██║   ██║\n'+
                  '██║      ██╔══██║ ██║      ██   ██║ ██║ ██╔══╝   ██║      ██╔══██║ ██╔══██║ ██║   ██║\n'+
                  '╚██████╗ ██║  ██║ ██║      ╚█████╔╝ ██║ ███████╗ ╚██████╗ ██║  ██║ ██║  ██║ ╚██████╔╝\n'+
                  ' ╚═════╝ ╚═╝  ╚═╝ ╚═╝       ╚════╝  ╚═╝ ╚══════╝  ╚═════╝ ╚═╝  ╚═╝ ╚═╝  ╚═╝  ╚═════╝';
    function vHome(){
      const items = NAV.map(([id,k,cmd])=>`<div class="mi" data-cmd="${id}">${esc(t(P.ui[k]))} <span class="d"> ${esc(cmd)}</span></div>`).join('');
      return `<div class="ascii-wrap"><pre class="ascii" aria-label="${esc(t(P.name))}">${ASCII}</pre></div>
        <div class="idl"><span class="dim">&gt;</span> <b>${esc(t(P.name))}</b> <span class="dim">—</span> <span class="green">${esc(t(P.role))}</span> <span class="dim">@ ${esc(t(P.location))}</span></div>
        <p class="lead">${esc(t(P.bio[0]))}</p>
        <div class="dim" style="margin:18px 0 6px">// ${esc(tr(S.sections))} —</div>
        <div class="menu">${items}</div>
        <div class="metarow">${tr(S.meta)}: <span data-cmd="all">all</span> <span data-cmd="help">help</span> <span data-cmd="cv">cv</span> <span data-cmd="github">github</span> <span data-cmd="lang">lang</span> <span data-cmd="theme">theme</span></div>
        <div class="backhint">${tr(S.hintHome)}</div>`;
    }
    function vHelp(){
      const rows = [
        ['help','show all commands'],['ls / home','back to the menu'],['about · skills · education · courses','open a section'],
        ['experience · certs · contact','open a section'],['projects','list projects — then type a number'],
        ['articles','list articles — then type a number'],['all','print everything on one screen'],
        ['back / ESC','go back'],['cv · github','open CV / GitHub'],['lang [en|zh]','switch language'],
        ['theme','open the theme gallery'],['clear','reset to menu'],
      ];
      const zhRows = [
        ['help','显示全部命令'],['ls / home','回到菜单'],['about · skills · education · courses','打开某个板块'],
        ['experience · certs · contact','打开某个板块'],['projects','列出项目 —— 再输入编号打开'],
        ['articles','列出文章 —— 再输入编号打开'],['all','一屏显示全部内容'],
        ['back / ESC','返回'],['cv · github','打开简历 / GitHub'],['lang [en|zh]','切换语言'],
        ['theme','打开主题画廊'],['clear','重置到菜单'],
      ];
      const r = L()==='zh'?zhRows:rows;
      return `<div class="dim" style="margin-bottom:12px">${L()==='zh'?'可用命令：':'Available commands:'}</div>`+
        r.map(([c,d])=>`<div class="idl"><span class="green" style="display:inline-block;min-width:230px">${esc(c)}</span><span class="dim">${esc(d)}</span></div>`).join('')+
        `<div class="backhint">${tr(S.hintBack)}</div>`;
    }
    function vAll(){
      const blocks = [
        ['cat about.md', bAbout()], ['cat education.log', bEducation()], ['ls ~/skills', bSkills()],
        ['cat courses.txt', bCourses()], ['cat experience.log', bExperience()],
        ['ls ~/projects', bProjects()], ['ls ~/articles', bArticles()],
        ['cat certificates.txt', bCerts()], ['./contact.sh', bContact()],
      ];
      return blocks.map(([h,b])=>`<div class="section-h"><span class="dim">${PROMPT}</span> <span class="c">${esc(h)}</span></div>${b}`).join('')+
        `<div class="backhint">${tr(S.hintBack)}</div>`;
    }

    function frame(cmd, body, hint){
      return `<div class="cmdhead">${PROMPT} <span class="c">${esc(cmd)}</span></div>${body}<div class="backhint">${hint||tr(S.hintBack)}</div>`;
    }

    // ---------- render current view ----------
    function render(){
      const top = stack[stack.length-1];
      const [view, param] = top.split(':');
      let html;
      switch(view){
        case 'home': html = vHome(); break;
        case 'help': html = frame('man cjc', vHelp().replace(/<div class="backhint">[\s\S]*<\/div>$/,''), tr(S.hintBack)); break;
        case 'about': html = frame('cat about.md', bAbout()); break;
        case 'skills': html = frame('ls ~/skills/', bSkills()); break;
        case 'education': html = frame('cat education.log', bEducation()); break;
        case 'courses': html = frame('cat courses.txt', bCourses()); break;
        case 'experience': html = frame('cat experience.log', bExperience()); break;
        case 'certs': html = frame('cat certificates.txt', bCerts()); break;
        case 'contact': html = frame('./contact.sh --send', bContact()); break;
        case 'projects': html = frame('ls -la ~/projects/', bProjects(), tr(S.hintList)); break;
        case 'articles': html = frame('ls -la ~/articles/', bArticles(), tr(S.hintList)); break;
        case 'project': html = frame('cat projects/'+(projects[+param]?slug(projects[+param].title):'?')+'/README', bProjectDetail(+param)); break;
        case 'article': html = frame('cat articles/'+((curList[+param]||articles[+param])?slug((curList[+param]||articles[+param]).title):'?')+'.md', bArticleDetail(+param)); break;
        case 'all': html = vAll(); break;
        default: html = vHome();
      }
      const sc = screen(); sc.innerHTML = html; sc.scrollTop = 0;
      if(view==='home') fitAscii();
      wireScreen();
    }

    function fitAscii(){
      const wrap = screen().querySelector('.ascii-wrap'); const pre = screen().querySelector('.ascii');
      if(!wrap||!pre) return; pre.style.transform='none';
      const avail = wrap.clientWidth, natural = pre.scrollWidth || pre.offsetWidth;
      const scale = natural>0 ? Math.min(1, avail/natural) : 1;
      pre.style.transform = 'scale('+scale+')'; wrap.style.height = Math.ceil(pre.offsetHeight*scale)+'px';
    }

    function wireScreen(){
      screen().querySelectorAll('[data-cmd]').forEach(el=>el.addEventListener('click', ()=>runCommand(el.dataset.cmd)));
      screen().querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click', ()=>{ stack.push(el.dataset.open); msg(''); render(); }));
      screen().querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click', ()=>{ filterKey=b.dataset.filter; render(); }));
      const cf = screen().querySelector('#cf');
      if(cf) cf.addEventListener('submit', onContactSubmit);
    }

    async function onContactSubmit(e){
      e.preventDefault(); const f=e.target, s=f.querySelector('#cf-status');
      s.style.color='var(--amber)'; s.textContent='$ '+t(P.ui.sending);
      try{ const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});
        s.style.color='var(--green)'; s.textContent='✓ '+(r.message||'Sent.'); f.reset(); }
      catch(err){ s.style.color='#ff6b6b'; s.textContent='✗ '+err.message; }
    }

    // ---------- command router ----------
    function msg(html){ document.getElementById('msg').innerHTML = html || ''; }
    function go(v){ stack.push(v); msg(''); render(); }
    function home(){ stack=['home']; msg(''); render(); }
    function back(){ if(stack.length>1){ stack.pop(); } msg(''); render(); }

    function runCommand(raw){
      const line=(raw||'').trim(); if(!line){ return; }
      const parts=line.split(/\s+/); const cmd=parts[0].toLowerCase(); const arg=parts.slice(1).join(' ');
      const top = stack[stack.length-1].split(':')[0];
      if(/^\d+$/.test(cmd)){
        const n=parseInt(cmd,10)-1;
        if(top==='projects' && curList[n]) return go('project:'+projects.indexOf(curList[n]));
        if(top==='articles' && curList[n]) return go('article:'+n);
        return msg('<span class="amber">no item ['+ (n+1) +'] here</span>');
      }
      switch(cmd){
        case 'home': case 'menu': case 'clear': case 'cls': home(); break;
        case 'ls': (top==='home')?home():go('home'); break;
        case 'help': case '?': case 'man': go('help'); break;
        case 'about': case 'whoami': go('about'); break;
        case 'skills': go('skills'); break;
        case 'education': case 'edu': go('education'); break;
        case 'courses': go('courses'); break;
        case 'experience': case 'exp': case 'work': go('experience'); break;
        case 'projects': case 'proj': go('projects'); break;
        case 'articles': case 'blog': go('articles'); break;
        case 'certs': case 'certificates': go('certs'); break;
        case 'contact': go('contact'); break;
        case 'all': go('all'); break;
        case 'back': case 'return': case 'b': case '..': back(); break;
        case 'filter': filterKey = (P.articleFilters.find(f=>t(f.label).toLowerCase()===arg.toLowerCase()||f.key.toLowerCase()===arg.toLowerCase())||{}).key || 'all'; if(top!=='articles') go('articles'); else render(); break;
        case 'cv': case 'resume': window.open(t(P.cv),'_blank'); msg('<span class="green">opening CV…</span>'); break;
        case 'github': case 'git': window.open(P.contact.github,'_blank'); msg('<span class="green">opening GitHub…</span>'); break;
        case 'lang': { const nl=/zh|cn|中/.test(arg)?'zh':/en/.test(arg)?'en':(L()==='en'?'zh':'en'); CJCData.setLang(nl); break; }
        case 'theme': case 'themes': msg('<span class="green">opening gallery…</span>'); setTimeout(()=>location.href='/themes.html',250); break;
        case 'sudo': msg('<span class="amber">visitor is not in the sudoers file. This incident will be reported.</span>'); break;
        case 'rm': msg('<span class="amber">rm: read-only portfolio — nice try 😏</span>'); break;
        case 'exit': case 'logout': case 'quit': msg('<span class="dim">there is no escape from a good portfolio :)</span>'); break;
        default: msg('<span class="amber">command not found: '+esc(cmd)+"</span> <span class=\"dim\">— type </span><span class=\"green\">help</span>");
      }
    }

    // ---------- input + keys ----------
    const history=[]; let hi=-1;
    function initInput(){
      const inp=document.getElementById('in');
      document.getElementById('prompt').innerHTML=PROMPT;
      document.getElementById('tt').textContent='visitor@caijiechao: ~ — zsh — '+ t(P.name);
      inp.addEventListener('keydown', e=>{
        if(e.key==='Enter'){ const v=inp.value; if(v.trim()){history.push(v);hi=history.length;} inp.value=''; runCommand(v); }
        else if(e.key==='ArrowUp'){ if(history.length){hi=Math.max(0,hi-1);inp.value=history[hi]||'';e.preventDefault();} }
        else if(e.key==='ArrowDown'){ if(history.length){hi=Math.min(history.length,hi+1);inp.value=history[hi]||'';e.preventDefault();} }
      });
      // ESC anywhere = back
      document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ back(); inp.focus({preventScroll:true}); } });
      // clicking the terminal focuses input (unless selecting a link/button/field)
      document.querySelector('.term').addEventListener('click', e=>{
        const tag=e.target.tagName;
        if(['A','BUTTON','INPUT','TEXTAREA'].indexOf(tag)===-1 && !e.target.closest('a,button')) inp.focus({preventScroll:true});
      });
      inp.focus({preventScroll:true});
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); }catch(e){}
      try{ articles = await CJCData.fetchArticles(); }catch(e){}
      const top = stack[stack.length-1].split(':')[0];
      if(top==='projects'||top==='articles'||top==='all'||top==='home') render();
    }

    const fa=document.createElement('link'); fa.rel='stylesheet';
    fa.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css'; document.head.appendChild(fa);

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      initInput();
      render();
      CJCData.mountSwitcher({ accent:'#33ff66' });
      CJCData.onLang(()=>{ document.getElementById('prompt').innerHTML=PROMPT; render(); });
      loadDynamic();
      window.addEventListener('resize', ()=>{ if(stack[stack.length-1]==='home') fitAscii(); });
      if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(stack[stack.length-1]==='home') fitAscii(); });
    });
  })();
  </script>
</body>
</html>

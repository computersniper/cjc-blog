<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Vaporwave</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --pink:#ff71ce; --cyan:#01cdfe; --purple:#2b1055; --mid:#7597de; --peach:#ff9a8b;
      --ink:#f4e9ff; --dim:#c8b6ff; --panel:rgba(43,16,85,.42); --line:rgba(1,205,254,.35);
      --glowP:0 0 8px rgba(255,113,206,.9),0 0 22px rgba(255,113,206,.55);
      --glowC:0 0 8px rgba(1,205,254,.9),0 0 22px rgba(1,205,254,.5);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;color:var(--ink);
      font-family:'Rajdhani','Segoe UI',sans-serif;
      background:linear-gradient(180deg,#2b1055 0%,#3a1a6e 34%,#7597de 74%,#ff9a8b 100%);
      background-attachment:fixed;
      -webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden;position:relative;
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    .container{max-width:1160px;margin:0 auto;padding:0 24px;position:relative;z-index:2}

    /* ---- Fixed scenery: sun + neon grid + scanlines ---- */
    .scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    .sun{
      position:absolute;left:50%;top:20vh;transform:translateX(-50%);
      width:min(58vw,420px);height:min(58vw,420px);border-radius:50%;
      background:linear-gradient(180deg,#fff2b6 0%,#ffd76b 22%,#ff8ac5 55%,#ff5ea8 100%);
      box-shadow:0 0 90px rgba(255,140,200,.7),0 0 160px rgba(255,120,180,.45);
    }
    /* sun's horizontal cut-out bars */
    .sun::after{
      content:"";position:absolute;left:0;bottom:0;width:100%;height:52%;
      background:repeating-linear-gradient(180deg,transparent 0 10px,var(--purple) 10px 15px,transparent 15px 25px,var(--purple) 25px 31px,transparent 31px 44px,var(--purple) 44px 51px);
      opacity:.9;
    }
    .grid-floor{
      position:absolute;left:50%;bottom:-8vh;transform:translateX(-50%);
      width:260vw;height:62vh;
      background-image:
        linear-gradient(var(--cyan) 2px,transparent 2px),
        linear-gradient(90deg,var(--cyan) 2px,transparent 2px);
      background-size:56px 56px;
      -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 32%,#000 100%);
      mask-image:linear-gradient(180deg,transparent 0,#000 32%,#000 100%);
      transform:translateX(-50%) perspective(340px) rotateX(72deg);
      transform-origin:50% 100%;
      opacity:.55;
      animation:floor 6s linear infinite;
    }
    @keyframes floor{from{background-position:0 0}to{background-position:0 56px}}
    .scanlines{
      position:absolute;inset:0;
      background:repeating-linear-gradient(180deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);
      mix-blend-mode:overlay;opacity:.6;
    }

    /* ---- Switcher offset & top bar ---- */
    .topbar{position:sticky;top:0;z-index:800;backdrop-filter:blur(8px);
      background:linear-gradient(180deg,rgba(43,16,85,.72),rgba(43,16,85,.28));
      border-bottom:1px solid var(--line)}
    .topbar .inner{display:flex;align-items:center;justify-content:space-between;height:58px;gap:16px}
    .brand{font-family:'Monoton',cursive;font-size:22px;color:var(--pink);text-shadow:var(--glowP);white-space:nowrap}
    .navlinks{display:flex;gap:18px;flex-wrap:wrap}
    .navlinks a{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);opacity:.85}
    .navlinks a:hover{opacity:1;text-shadow:var(--glowC)}
    @media(max-width:860px){.navlinks{display:none}}

    section{padding:64px 0;position:relative;z-index:2}
    .sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:30px;flex-wrap:wrap}
    .sec-title{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(24px,4.4vw,40px);
      letter-spacing:.02em;margin:0;color:#fff;text-shadow:var(--glowP)}
    .kana{font-family:'Rajdhani',sans-serif;font-size:clamp(13px,2vw,16px);letter-spacing:.3em;color:var(--cyan);text-shadow:var(--glowC);opacity:.9}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;
      backdrop-filter:blur(9px);box-shadow:0 0 0 1px rgba(255,113,206,.12),0 18px 44px rgba(20,4,45,.5)}

    /* ---- Hero ---- */
    .hero{padding:96px 0 60px;text-align:center}
    .greet{font-family:'Orbitron',sans-serif;letter-spacing:.34em;text-transform:uppercase;font-size:13px;color:var(--cyan);text-shadow:var(--glowC)}
    .hero h1{font-family:'Monoton',cursive;font-weight:400;font-size:clamp(42px,11vw,120px);line-height:1.02;margin:16px 0 0;
      color:#fff;position:relative;letter-spacing:.02em}
    .hero h1 .chroma{position:relative;display:inline-block}
    .hero h1 .chroma::before,.hero h1 .chroma::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%}
    .hero h1 .chroma::before{color:#ff2fa4;transform:translate(-3px,0);mix-blend-mode:screen;opacity:.85}
    .hero h1 .chroma::after{color:#01cdfe;transform:translate(3px,0);mix-blend-mode:screen;opacity:.85}
    .hero .role{font-family:'Orbitron',sans-serif;margin-top:18px;font-size:clamp(15px,2.4vw,22px);color:var(--pink);text-shadow:var(--glowP);letter-spacing:.08em}
    .hero .head{font-size:clamp(16px,2.4vw,22px);color:var(--ink);margin:14px auto 0;max-width:34ch}
    .hero .meta{margin-top:14px;color:var(--dim);font-size:15px}
    .bust{font-size:clamp(40px,9vw,84px);margin-bottom:6px;filter:drop-shadow(0 0 16px rgba(1,205,254,.5))}
    .btns{margin-top:30px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
    .btn{font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
      padding:13px 24px;border-radius:999px;border:2px solid var(--pink);color:#fff;background:rgba(255,113,206,.14);
      box-shadow:var(--glowP);transition:transform .15s,background .15s}
    .btn.cy{border-color:var(--cyan);box-shadow:var(--glowC);background:rgba(1,205,254,.12)}
    .btn:hover{transform:translateY(-2px);background:rgba(255,113,206,.3)}
    .btn.cy:hover{background:rgba(1,205,254,.28)}

    /* ---- About ---- */
    .about{display:grid;grid-template-columns:280px 1fr;gap:28px;align-items:start}
    .portrait-wrap{padding:10px;border-radius:16px}
    .portrait{width:100%;border-radius:12px;border:1px solid var(--pink);
      filter:saturate(1.15) contrast(1.02);box-shadow:0 0 24px rgba(255,113,206,.4)}
    .about-text{padding:24px}
    .about-text p{font-size:16.5px;margin:0 0 14px;color:var(--ink)}
    .about-text .loc{color:var(--cyan);font-weight:700;text-shadow:var(--glowC)}
    @media(max-width:720px){.about{grid-template-columns:1fr}}

    /* ---- Rows (edu/exp) ---- */
    .rows{display:flex;flex-direction:column;gap:16px}
    .rowitem{padding:20px 22px;display:grid;grid-template-columns:160px 1fr;gap:16px}
    .rowitem .when{font-family:'Orbitron',sans-serif;color:var(--cyan);font-weight:700;font-size:14px;text-shadow:var(--glowC)}
    .rowitem h3{margin:0 0 6px;font-size:19px;font-weight:700;color:#fff}
    .rowitem .sub{color:var(--dim);font-size:15px}
    .rowitem ul{margin:12px 0 0;padding-left:18px;color:var(--ink)}
    .rowitem li{margin:6px 0}
    .rowitem li::marker{color:var(--pink)}
    @media(max-width:620px){.rowitem{grid-template-columns:1fr;gap:6px}}

    /* ---- Skills chips ---- */
    .chips{display:flex;flex-wrap:wrap;gap:12px}
    .chip{font-family:'Orbitron',sans-serif;font-size:13px;padding:10px 16px;border-radius:999px;
      border:1px solid var(--cyan);color:var(--cyan);background:rgba(1,205,254,.08);letter-spacing:.04em;transition:.15s}
    .chip:nth-child(even){border-color:var(--pink);color:var(--pink);background:rgba(255,113,206,.09)}
    .chip:hover{transform:translateY(-2px);box-shadow:var(--glowC)}
    .chip:nth-child(even):hover{box-shadow:var(--glowP)}

    /* ---- Courses ---- */
    .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .course{padding:22px}
    .course .ci{font-size:26px;color:var(--pink);text-shadow:var(--glowP);margin-bottom:12px}
    .course h4{margin:0 0 8px;font-size:17px;font-weight:700;color:#fff}
    .course p{margin:0;color:var(--dim);font-size:14.5px;line-height:1.55}
    @media(max-width:860px){.courses{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.courses{grid-template-columns:1fr}}

    /* ---- Cards (projects/articles) ---- */
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .card{display:flex;flex-direction:column;overflow:hidden;transition:transform .18s,box-shadow .18s}
    .card:hover{transform:translateY(-4px);box-shadow:0 0 0 1px var(--pink),0 22px 48px rgba(20,4,45,.6),var(--glowP)}
    .card .cover{height:160px;overflow:hidden;border-bottom:1px solid var(--line);background:rgba(1,205,254,.08)}
    .card .cover img{width:100%;height:100%;object-fit:cover;filter:saturate(1.2) hue-rotate(-6deg)}
    .card .cbody{padding:16px;display:flex;flex-direction:column;gap:9px;flex:1}
    .card .ctag{display:flex;justify-content:space-between;font-family:'Orbitron',sans-serif;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
    .card h4{margin:0;font-size:17px;font-weight:700;color:#fff}
    .card .tech{color:var(--pink);font-weight:600;font-size:13px}
    .card p{margin:0;color:var(--dim);font-size:14px;flex:1}
    .card .more{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--pink);text-shadow:var(--glowP)}
    @media(max-width:860px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.cards{grid-template-columns:1fr}}

    .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
    .filters button{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
      padding:9px 16px;border-radius:999px;cursor:pointer;color:var(--cyan);
      background:rgba(1,205,254,.06);border:1px solid var(--line);transition:.15s}
    .filters button.active,.filters button:hover{background:var(--pink);border-color:var(--pink);color:#2b1055;box-shadow:var(--glowP)}

    /* ---- Certificates ---- */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .cert{display:grid;grid-template-columns:120px 1fr;overflow:hidden}
    .cert img{height:100%;object-fit:cover;border-right:1px solid var(--line)}
    .cert .ct{padding:16px}
    .cert .ct .meta{display:flex;justify-content:space-between;font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--cyan)}
    .cert .ct h4{margin:8px 0 6px;font-size:16px;color:#fff}
    .cert .ct p{margin:0;color:var(--dim);font-size:13.5px}
    @media(max-width:620px){.certs{grid-template-columns:1fr}.cert{grid-template-columns:90px 1fr}}

    /* ---- Contact ---- */
    .contact{display:grid;grid-template-columns:5fr 7fr;gap:24px}
    .cinfo{padding:22px}
    .cinfo a{display:flex;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line);font-weight:600}
    .cinfo a:first-child{border-top:none}
    .cinfo a span:last-child{color:var(--pink);text-shadow:var(--glowP)}
    .cform{padding:22px}
    .cform input,.cform textarea{width:100%;padding:13px;margin-bottom:13px;border-radius:10px;
      background:rgba(43,16,85,.4);border:1px solid var(--line);color:#fff;font-family:inherit;font-size:15px}
    .cform input::placeholder,.cform textarea::placeholder{color:#9d86d6}
    .cform input:focus,.cform textarea:focus{outline:none;border-color:var(--pink);box-shadow:var(--glowP)}
    .cform textarea{min-height:130px;resize:vertical}
    .cform button{font-family:'Orbitron',sans-serif;text-transform:uppercase;letter-spacing:.1em;
      padding:13px 28px;border-radius:999px;cursor:pointer;color:#2b1055;background:var(--pink);border:none;box-shadow:var(--glowP);font-weight:700}
    .cform button:hover{background:var(--cyan);box-shadow:var(--glowC)}
    #cf-status{margin-top:10px;font-weight:600;font-size:14px}
    @media(max-width:760px){.contact{grid-template-columns:1fr}}

    footer{position:relative;z-index:2;border-top:1px solid var(--line);margin-top:40px;
      padding:36px 0 60px;background:linear-gradient(180deg,transparent,rgba(43,16,85,.55))}
    .frow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px}
    footer .social{display:flex;gap:18px;flex-wrap:wrap}
    footer a{color:var(--cyan);font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:.05em}
    footer a:hover{text-shadow:var(--glowC)}
    .muted{color:var(--dim);font-size:12.5px}
    .load-note{color:var(--dim);font-size:15px;grid-column:1/-1;padding:8px 0}

    @media (prefers-reduced-motion: reduce){
      .grid-floor{animation:none}
      html{scroll-behavior:auto}
      .hero h1 .chroma::before,.hero h1 .chroma::after{display:none}
      .scanlines{opacity:.3}
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="sun"></div>
    <div class="grid-floor"></div>
    <div class="scanlines"></div>
  </div>

  <div class="topbar"><div class="container inner">
    <a class="brand" href="#top">CJC</a>
    <nav class="navlinks" id="nav"></nav>
  </div></div>

  <div id="top"></div>
  <header class="hero"><div class="container">
    <div class="bust" aria-hidden="true">🗿</div>
    <div class="greet" id="greet"></div>
    <h1><span class="chroma" id="name" data-t=""></span></h1>
    <div class="role" id="role"></div>
    <div class="head" id="headline"></div>
    <div class="meta" id="meta"></div>
    <div class="btns">
      <a class="btn" id="cvBtn" href="#" download></a>
      <a class="btn cy" id="ghBtn" target="_blank" rel="noopener"></a>
    </div>
  </div></header>

  <section id="about"><div class="container">
    <div class="sec-head"><h2 class="sec-title" id="l-about"></h2><span class="kana">アバウト</span></div>
    <div class="about">
      <div class="panel portrait-wrap"><img class="portrait" id="portrait" alt="" /></div>
      <div class="panel about-text" id="about-text"></div>
    </div>
  </div></section>

  <section id="education"><div class="container">
    <div class="sec-head"><h2 class="sec-title" id="l-edu"></h2><span class="kana">エデュケーション</span></div>
    <div class="rows" id="edu-list"></div>
  </div></section>

  <section id="skills"><div class="container">
    <div class="sec-head"><h2 class="sec-title" id="l-skills"></h2><span class="kana">スキル</span></div>
    <div class="chips" id="skills-list"></div>
  </div></section>

  <section id="courses"><div class="container">
    <div class="sec-head"><h2 class="sec-title" id="l-courses"></h2><span class="kana">コース</span></div>
    <div class="courses" id="courses-list"></div>
  </div></section>

  <section id="experience"><div class="container">
    <div class="sec-head"><h2 class="sec-title" id="l-exp"></h2><span class="kana">キャリア</span></div>
    <div class="rows" id="exp-list"></div>
  </div></section>

  <section id="projects"><div class="container">
    <div class="sec-head"><h2 class="sec-title" id="l-projects"></h2><span class="kana">プロジェクト</span></div>
    <div class="cards" id="projects-list"><div class="load-note" id="proj-load"></div></div>
  </div></section>

  <section id="articles"><div class="container">
    <div class="sec-head"><h2 class="sec-title" id="l-articles"></h2><span class="kana">記事</span></div>
    <div class="filters" id="filters"></div>
    <div class="cards" id="articles-list"><div class="load-note" id="art-load"></div></div>
  </div></section>

  <section id="certificates"><div class="container">
    <div class="sec-head"><h2 class="sec-title" id="l-certs"></h2><span class="kana">サーティフィケート</span></div>
    <div class="certs" id="certs-list"></div>
  </div></section>

  <section id="contact"><div class="container">
    <div class="sec-head"><h2 class="sec-title" id="l-contact"></h2><span class="kana">コンタクト</span></div>
    <div class="contact">
      <div class="panel cinfo" id="contact-info"></div>
      <div class="panel cform">
        <form id="cf">
          <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none">
          <input type="text" name="name" id="cf-name" required>
          <input type="email" name="email" id="cf-email" required>
          <textarea name="message" id="cf-msg" required></textarea>
          <button type="submit" id="cf-send"></button>
          <p id="cf-status"></p>
        </form>
      </div>
    </div>
  </div></section>

  <footer><div class="container">
    <div class="frow">
      <a class="brand" href="#top" style="font-size:18px">CJC</a>
      <div class="social" id="foot-social"></div>
    </div>
    <div class="frow" style="margin-top:16px">
      <span class="muted" id="foot-desc"></span>
      <a class="muted" id="foot-icp" target="_blank" style="color:var(--dim)"></a>
    </div>
  </div></footer>

  <script>window.THEME_ID = "11-vaporwave";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";

    function renderStatic(){
      document.title = "Cai Jiechao — Vaporwave";
      document.getElementById('nav').innerHTML = [
        ['about','nav_about'],['courses','nav_courses'],['projects','nav_portfolio'],
        ['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');

      document.getElementById('greet').textContent = t(P.greeting);
      const nm = document.getElementById('name');
      nm.textContent = t(P.name); nm.setAttribute('data-t', t(P.name));
      document.getElementById('role').textContent = t(P.role);
      document.getElementById('headline').textContent = t(P.headline);
      document.getElementById('meta').innerHTML = `📍 ${esc(t(P.title))} · ${esc(t(P.location))}`;
      const cv = document.getElementById('cvBtn'); cv.textContent = '▸ '+t(P.ui.download_cv); cv.href = t(P.cv);
      const gh = document.getElementById('ghBtn'); gh.textContent = 'GitHub ↗'; gh.href = P.contact.github;

      document.getElementById('l-about').textContent = t(P.ui.about_me);
      document.getElementById('l-edu').textContent = t(P.ui.education_bg);
      document.getElementById('l-skills').textContent = t(P.ui.core_tech);
      document.getElementById('l-courses').textContent = t(P.ui.core_courses);
      document.getElementById('l-exp').textContent = t(P.ui.internship_exp);
      document.getElementById('l-projects').textContent = t(P.ui.latest_projects);
      document.getElementById('l-articles').textContent = t(P.ui.latest_articles);
      document.getElementById('l-certs').textContent = t(P.ui.certificates);
      document.getElementById('l-contact').textContent = t(P.ui.get_in_touch);

      const port = document.getElementById('portrait'); port.src = P.avatar; port.alt = t(P.name);
      document.getElementById('about-text').innerHTML =
        P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('') +
        `<p class="loc">📍 ${esc(t(P.location))}</p>`;

      document.getElementById('edu-list').innerHTML = P.education.map(e=>`
        <div class="panel rowitem"><div class="when">${esc(e.period)}</div>
        <div><h3>${esc(t(e.school))}</h3><div class="sub">${esc(t(e.degree))} — ${esc(t(e.note))}</div></div></div>`).join('');

      document.getElementById('skills-list').innerHTML = P.skillTags.map(s=>`<span class="chip">${esc(s)}</span>`).join('');

      document.getElementById('courses-list').innerHTML = P.courses.map(c=>`
        <div class="panel course"><div class="ci"><i class="fa ${esc(c.icon)}"></i></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');

      document.getElementById('exp-list').innerHTML = P.experience.map(x=>`
        <div class="panel rowitem"><div class="when">${esc(x.period)}</div>
        <div><h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3>
        <div class="sub">${esc(t(x.summary))}</div>
        <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div></div>`).join('');

      document.getElementById('certs-list').innerHTML = P.certificates.map(c=>`
        <div class="panel cert"><img src="${esc(c.image)}" alt="${esc(t(c.title))}">
        <div class="ct"><div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');

      document.getElementById('contact-info').innerHTML = [
        ['Email', P.contact.email, 'mailto:'+P.contact.email],
        ['Phone', P.contact.phone, P.contact.phoneHref],
        ['GitHub', '@'+P.contact.githubUser, P.contact.github],
        ['WeChat', 'QR ↗', P.contact.wechatQrPage],
      ].map(([k,v,h])=>`<a href="${esc(h)}"><span>${esc(k)}</span><span>${esc(v)}</span></a>`).join('');
      document.getElementById('cf-name').placeholder = t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder = t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder = t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent = t(P.ui.send);

      document.getElementById('foot-social').innerHTML =
        `<a href="${P.contact.github}" target="_blank">GitHub</a>
         <a href="mailto:${P.contact.email}">Email</a>
         <a href="${P.contact.wechatQrPage}">WeChat</a>
         <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent = t(P.ui.footer_desc);
      const icp = document.getElementById('foot-icp'); icp.textContent = P.icp; icp.href = P.icpUrl;

      document.getElementById('filters').innerHTML = P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box = document.getElementById('projects-list');
      if(!projects.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML = projects.map(p=>`
        <a class="panel card" href="${esc(p.href)}">
          <div class="cbody">
            <div class="ctag"><span>${esc(t(P.ui.tech_stack))}</span><span>${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <div class="tech">${esc(p.tech_stack||'')}</div>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div></a>`).join('');
    }

    function renderArticles(){
      const box = document.getElementById('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML = list.map(a=>`
        <a class="panel card" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
          <div class="cbody">
            <div class="ctag"><span>${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div></a>`).join('');
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML = `<div class="load-note">⚠ 内容加载失败 / Failed to load</div>`; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-list').innerHTML = `<div class="load-note">⚠ 内容加载失败 / Failed to load</div>`; }
    }

    document.getElementById('cf').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      const payload = { name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color='var(--cyan)'; s.textContent = t(P.ui.sending);
      try{ const r = await CJCData.sendContact(payload); s.style.color='#7bffb0'; s.textContent = r.message||'Sent.'; f.reset(); }
      catch(err){ s.style.color='#ff6b9d'; s.textContent = err.message; }
    });

    const fa = document.createElement('link');
    fa.rel='stylesheet'; fa.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css';
    document.head.appendChild(fa);

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:'#ff71ce' });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

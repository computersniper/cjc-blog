<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Retro 90s Web</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{
      --teal:#008080; --grey:#c0c0c0; --mag:#ff00ff; --yellow:#ffff00;
      --navy:#000080; --ink:#111; --link:#0000ee; --vlink:#551a8b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;color:var(--ink);font-family:Georgia,'Times New Roman',Times,serif;font-size:16px;line-height:1.5;
      background-color:#008080;
      background-image:
        repeating-linear-gradient(45deg, rgba(255,255,255,.04) 0 2px, transparent 2px 8px),
        repeating-linear-gradient(-45deg, rgba(0,0,0,.05) 0 2px, transparent 2px 8px);
    }
    a{color:var(--link)}
    a:visited{color:var(--vlink)}
    img{max-width:100%;display:block}
    .page{max-width:920px;margin:0 auto;padding:16px 12px 40px}
    .retro-font{font-family:'VT323','Courier New',monospace}

    /* ---- Beveled window (chiseled 3D outset) ---- */
    .win{
      background:var(--grey);margin:0 0 18px;
      border-top:2px solid #ffffff;border-left:2px solid #ffffff;
      border-right:2px solid #404040;border-bottom:2px solid #404040;
      box-shadow:inset -1px -1px 0 #808080, inset 1px 1px 0 #dfdfdf, 3px 3px 0 rgba(0,0,0,.35);
    }
    .win-title{
      display:flex;align-items:center;justify-content:space-between;gap:8px;
      background:linear-gradient(90deg,#000080,#1084d0);color:#fff;
      padding:4px 6px;font-family:'VT323',monospace;font-size:22px;letter-spacing:.02em;
    }
    .win-title .tt{display:flex;align-items:center;gap:8px;text-transform:uppercase}
    .win-title .tt i{color:var(--yellow)}
    .win-btns{display:flex;gap:3px}
    .win-btns span{
      width:18px;height:16px;background:var(--grey);color:#000;font-family:monospace;font-size:11px;font-weight:bold;
      display:flex;align-items:center;justify-content:center;line-height:1;
      border-top:1px solid #fff;border-left:1px solid #fff;border-right:1px solid #404040;border-bottom:1px solid #404040;
    }
    .win-body{padding:14px 16px}

    /* ---- Marquee ---- */
    .marquee{overflow:hidden;white-space:nowrap;background:#000;border:2px inset #808080;padding:5px 0}
    .marquee > span{display:inline-block;padding-left:100%;animation:scroll 22s linear infinite;
      font-family:'VT323',monospace;font-size:26px;color:var(--yellow)}
    .marquee .hi{color:var(--mag)}
    @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}

    /* ---- Hero ---- */
    .hero-wrap{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
    .hero h1{font-family:'VT323',monospace;font-size:clamp(46px,10vw,86px);line-height:.9;margin:0;color:var(--navy);
      text-shadow:2px 2px 0 var(--mag)}
    .hero .greet{font-family:'VT323',monospace;font-size:26px;color:#800080;margin:0}
    .hero .role{font-size:18px;font-weight:bold;margin:6px 0 2px}
    .hero .subtitle{font-size:15px;font-style:italic;color:#333;margin:0 0 12px}
    @media(max-width:640px){.hero-wrap{grid-template-columns:1fr}}

    /* ---- Visitor counter (odometer) ---- */
    .counter-box{background:var(--grey);padding:10px;border:2px inset #808080;text-align:center}
    .counter-box .cap{font-family:'VT323',monospace;font-size:18px;color:#000;margin-bottom:6px}
    .odometer{display:inline-flex;gap:2px;background:#000;padding:4px;border:2px solid #444}
    .odometer .d{background:#001a00;color:#2aff2a;font-family:'VT323',monospace;font-size:30px;line-height:1;
      width:22px;text-align:center;padding:2px 0;text-shadow:0 0 6px #17ff17}
    .counter-box .globe{margin-top:6px;font-size:13px;color:#333}

    /* ---- Retro buttons ---- */
    .rbtn{
      display:inline-flex;align-items:center;gap:6px;background:var(--grey);color:#000;
      font-family:'VT323',monospace;font-size:20px;text-decoration:none;cursor:pointer;
      padding:5px 14px;margin:4px 6px 4px 0;
      border-top:2px solid #fff;border-left:2px solid #fff;border-right:2px solid #404040;border-bottom:2px solid #404040;
    }
    .rbtn:visited{color:#000}
    .rbtn:active{border-top:2px solid #404040;border-left:2px solid #404040;border-right:2px solid #fff;border-bottom:2px solid #fff}
    .rbtn.mag{background:var(--mag);color:#fff}
    .rbtn.yel{background:var(--yellow);color:#000}

    /* ---- Tables (table-ish layout) ---- */
    table.retro{width:100%;border-collapse:collapse;background:#fff;font-size:15px}
    table.retro th,table.retro td{border:2px groove #dfdfdf;padding:8px 10px;text-align:left;vertical-align:top}
    table.retro th{background:var(--navy);color:var(--yellow);font-family:'VT323',monospace;font-size:20px;font-weight:normal}
    table.retro tr:nth-child(even) td{background:#f2f2f2}
    .rowlabel{font-family:'VT323',monospace;font-size:20px;color:#800080;width:130px;white-space:nowrap;background:#eae0ff!important}

    /* ---- Portrait framed ---- */
    .portrait{border:4px ridge var(--mag);background:#fff;padding:4px}
    .portrait img{width:150px;height:150px;object-fit:cover;display:block}

    /* ---- Bio ---- */
    .bio p{margin:0 0 12px}
    .location-tag{display:inline-block;background:var(--yellow);color:#000;font-family:'VT323',monospace;
      font-size:19px;padding:2px 10px;border:2px solid #000}

    /* ---- Chips / hr ---- */
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .chip{font-family:'VT323',monospace;font-size:18px;background:#fff;border:2px outset #dfdfdf;padding:1px 10px;color:#000080}
    hr.retro{border:none;height:0;border-top:2px groove #dfdfdf;margin:14px 0}

    /* ---- Courses grid ---- */
    .courses{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .course{background:#fff;border:2px ridge #dfdfdf;padding:10px}
    .course .ch{display:flex;align-items:center;gap:8px;font-family:'VT323',monospace;font-size:22px;color:var(--navy)}
    .course .ch i{color:var(--mag)}
    .course p{margin:6px 0 0;font-size:14px;color:#333;line-height:1.45}
    @media(max-width:640px){.courses{grid-template-columns:1fr}}

    /* ---- Item list (projects/articles) ---- */
    .item{display:flex;gap:12px;background:#fff;border:2px ridge #dfdfdf;padding:10px;margin:0 0 10px}
    .item .thumb{width:110px;height:80px;flex:none;overflow:hidden;border:2px inset #808080;background:#ccc}
    .item .thumb img{width:100%;height:100%;object-fit:cover}
    .item .it-body{flex:1;min-width:0}
    .item h4{margin:0 0 4px;font-size:17px}
    .item h4 a{color:var(--link)}
    .item .it-meta{font-family:'VT323',monospace;font-size:17px;color:#800080;margin-bottom:4px}
    .item p{margin:0;font-size:14px;color:#333;line-height:1.45}
    .item .it-tech{font-size:13px;color:#006400;font-weight:bold}
    @media(max-width:560px){.item{flex-direction:column}.item .thumb{width:100%;height:120px}}

    /* NEW! blinking badge */
    .newbadge{display:inline-block;background:var(--mag);color:var(--yellow);font-family:'VT323',monospace;
      font-size:16px;padding:0 6px;margin-left:6px;border:1px solid #000;animation:blink 1s steps(1) infinite;vertical-align:middle}
    @keyframes blink{50%{opacity:0}}

    /* Filters */
    .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
    .filters button{font-family:'VT323',monospace;font-size:19px;background:var(--grey);color:#000;cursor:pointer;padding:2px 12px;
      border-top:2px solid #fff;border-left:2px solid #fff;border-right:2px solid #404040;border-bottom:2px solid #404040}
    .filters button.active{background:var(--navy);color:var(--yellow);
      border-top:2px solid #404040;border-left:2px solid #404040;border-right:2px solid #fff;border-bottom:2px solid #fff}

    /* Certificates */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .cert{background:#fff;border:2px ridge #dfdfdf;padding:8px}
    .cert img{width:100%;height:150px;object-fit:cover;border:2px inset #808080}
    .cert .cm{font-family:'VT323',monospace;font-size:17px;color:#800080;margin-top:6px;display:flex;justify-content:space-between}
    .cert h4{margin:4px 0;font-size:16px}
    .cert p{margin:0;font-size:13px;color:#333}
    @media(max-width:640px){.certs{grid-template-columns:1fr}}

    /* Contact form */
    .cform-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .cform label{font-family:'VT323',monospace;font-size:20px;color:var(--navy);display:block;margin:0 0 3px}
    .cform input,.cform textarea{width:100%;font-family:Georgia,serif;font-size:15px;padding:8px;margin-bottom:10px;
      background:#fff;border:2px inset #808080;color:#000}
    .cform textarea{min-height:110px;resize:vertical}
    #cf-status{font-family:'VT323',monospace;font-size:19px;margin-top:6px}
    @media(max-width:640px){.cform-grid{grid-template-columns:1fr}}

    /* Footer / web ring */
    .footwin{text-align:center}
    .webring{font-family:'VT323',monospace;font-size:22px;color:#000;margin:0 0 10px}
    .webring a{color:var(--navy);text-decoration:none;margin:0 4px}
    .badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
    .badge88{width:88px;height:31px;display:flex;align-items:center;justify-content:center;text-align:center;
      font-family:'VT323',monospace;font-size:13px;line-height:1;border:1px outset #999;color:#fff}
    .b-net{background:linear-gradient(#3a3a8a,#000060)}
    .b-html{background:linear-gradient(#7a2f00,#a34a00);color:var(--yellow)}
    .b-made{background:linear-gradient(#004d00,#007000);color:var(--yellow)}
    .b-1024{background:linear-gradient(#5a005a,#8a008a);color:var(--yellow)}
    .foot-desc{font-size:14px;color:#333;margin:8px 0}
    .foot-links{font-family:'VT323',monospace;font-size:19px;margin:6px 0}
    .foot-links a{margin:0 6px}
    .icp{font-size:13px;color:#333}
    .icp a{color:var(--navy)}

    :focus-visible{outline:2px dashed var(--mag);outline-offset:2px}
    @media(prefers-reduced-motion:reduce){
      .marquee > span{animation:none;padding-left:0}
      .newbadge{animation:none}
    }
  </style>
</head>
<body>
  <div class="page" id="top">
    <!-- Marquee -->
    <div class="marquee" role="marquee"><span id="marquee-text"></span></div>

    <!-- Hero window -->
    <div class="win">
      <div class="win-title"><span class="tt"><i class="fa fa-star"></i> <span id="wt-hero"></span></span>
        <span class="win-btns"><span>_</span><span>□</span><span>×</span></span></div>
      <div class="win-body">
        <div class="hero-wrap">
          <div class="hero">
            <p class="greet" id="greet"></p>
            <h1 id="name"></h1>
            <p class="role" id="role"></p>
            <p class="subtitle" id="subtitle"></p>
            <div>
              <a class="rbtn mag" id="cvBtn" href="#" download><i class="fa fa-download"></i> <span></span></a>
              <a class="rbtn" id="ghBtn" href="#" target="_blank" rel="noopener"><i class="fa fa-github"></i> GitHub</a>
            </div>
          </div>
          <div class="counter-box">
            <div class="cap">~ VISITORS ~</div>
            <div class="odometer" id="odometer" aria-hidden="true"></div>
            <div class="globe" id="counter-cap"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- About -->
    <div class="win">
      <div class="win-title"><span class="tt"><i class="fa fa-user"></i> <span id="wt-about"></span></span>
        <span class="win-btns"><span>_</span><span>□</span><span>×</span></span></div>
      <div class="win-body">
        <table class="retro" style="margin-bottom:12px"><tr>
          <td style="width:170px;text-align:center;vertical-align:middle;background:#f2f2f2!important">
            <span class="portrait" style="display:inline-block"><img id="portrait" alt="Cai Jiechao"></span>
          </td>
          <td class="bio" id="bio"></td>
        </tr></table>
        <span class="location-tag" id="loc-tag"></span>
      </div>
    </div>

    <!-- Education -->
    <div class="win">
      <div class="win-title"><span class="tt"><i class="fa fa-graduation-cap"></i> <span id="wt-edu"></span></span>
        <span class="win-btns"><span>_</span><span>□</span><span>×</span></span></div>
      <div class="win-body"><table class="retro" id="edu-table"></table></div>
    </div>

    <!-- Skills -->
    <div class="win">
      <div class="win-title"><span class="tt"><i class="fa fa-wrench"></i> <span id="wt-skills"></span></span>
        <span class="win-btns"><span>_</span><span>□</span><span>×</span></span></div>
      <div class="win-body">
        <table class="retro" id="skills-table"></table>
        <hr class="retro"><div class="chips" id="chips"></div>
      </div>
    </div>

    <!-- Courses -->
    <div class="win">
      <div class="win-title"><span class="tt"><i class="fa fa-book"></i> <span id="wt-courses"></span></span>
        <span class="win-btns"><span>_</span><span>□</span><span>×</span></span></div>
      <div class="win-body"><div class="courses" id="courses"></div></div>
    </div>

    <!-- Experience -->
    <div class="win">
      <div class="win-title"><span class="tt"><i class="fa fa-briefcase"></i> <span id="wt-exp"></span></span>
        <span class="win-btns"><span>_</span><span>□</span><span>×</span></span></div>
      <div class="win-body" id="exp-body"></div>
    </div>

    <!-- Projects -->
    <div class="win">
      <div class="win-title"><span class="tt"><i class="fa fa-folder-open"></i> <span id="wt-projects"></span></span>
        <span class="win-btns"><span>_</span><span>□</span><span>×</span></span></div>
      <div class="win-body" id="projects-body"></div>
    </div>

    <!-- Articles -->
    <div class="win">
      <div class="win-title"><span class="tt"><i class="fa fa-file-text-o"></i> <span id="wt-articles"></span></span>
        <span class="win-btns"><span>_</span><span>□</span><span>×</span></span></div>
      <div class="win-body">
        <div class="filters" id="filters"></div>
        <div id="articles-body"></div>
      </div>
    </div>

    <!-- Certificates -->
    <div class="win">
      <div class="win-title"><span class="tt"><i class="fa fa-trophy"></i> <span id="wt-certs"></span></span>
        <span class="win-btns"><span>_</span><span>□</span><span>×</span></span></div>
      <div class="win-body"><div class="certs" id="certs"></div></div>
    </div>

    <!-- Contact -->
    <div class="win">
      <div class="win-title"><span class="tt"><i class="fa fa-envelope"></i> <span id="wt-contact"></span></span>
        <span class="win-btns"><span>_</span><span>□</span><span>×</span></span></div>
      <div class="win-body">
        <div class="cform-grid">
          <div>
            <p id="contact-blurb" style="margin:0 0 10px"></p>
            <table class="retro" id="contact-table"></table>
          </div>
          <form class="cform" id="cf">
            <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none">
            <label id="lb-name"></label><input type="text" name="name" id="cf-name" required>
            <label id="lb-email"></label><input type="email" name="email" id="cf-email" required>
            <label id="lb-msg"></label><textarea name="message" id="cf-msg" required></textarea>
            <button class="rbtn mag" type="submit" id="cf-send" style="font-size:22px"></button>
            <p id="cf-status"></p>
          </form>
        </div>
      </div>
    </div>

    <!-- Footer web ring -->
    <div class="win footwin">
      <div class="win-title"><span class="tt"><i class="fa fa-globe"></i> CaiJiechao's Web Ring</span>
        <span class="win-btns"><span>_</span><span>□</span><span>×</span></span></div>
      <div class="win-body">
        <p class="webring">« <a href="#top">Previous</a> | <a href="/themes.html">Random Site</a> | <a href="#top">Next</a> » </p>
        <div class="badges">
          <span class="badge88 b-net">Best viewed in Netscape</span>
          <span class="badge88 b-html">Made with HTML</span>
          <span class="badge88 b-made">Hand-Coded</span>
          <span class="badge88 b-1024">800x600</span>
        </div>
        <p class="foot-desc" id="foot-desc"></p>
        <p class="foot-links" id="foot-links"></p>
        <p class="icp"><a id="foot-icp" target="_blank" rel="noopener"></a></p>
      </div>
    </div>
  </div>

  <script>window.THEME_ID = "09-retro90s";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";

    // Stable pseudo-visitor number (looks like an odometer)
    function visitorCount(){
      const base = 1337042;
      const day = Math.floor(Date.now()/86400000);
      return (base + (day % 9999) * 7) % 100000000;
    }
    function renderOdometer(){
      const n = String(visitorCount()).padStart(8,'0');
      document.getElementById('odometer').innerHTML = n.split('').map(d=>`<span class="d">${d}</span>`).join('');
    }

    // Detect "recent" items (within ~120 days) → NEW! badge; always flag first item.
    function isNew(iso, idx){
      if(idx === 0) return true;
      if(!iso) return false;
      const days = (Date.now() - new Date(iso).getTime())/86400000;
      return days >= 0 && days <= 120;
    }
    const NEW = `<span class="newbadge">NEW!</span>`;

    function renderStatic(){
      document.title = "Cai Jiechao — Retro 90s Web";
      const L = CJCData.lang();
      // window titles
      document.getElementById('wt-hero').textContent = P.brand + ".html";
      document.getElementById('wt-about').textContent = t(P.ui.about_me);
      document.getElementById('wt-edu').textContent = t(P.ui.education_bg);
      document.getElementById('wt-skills').textContent = t(P.ui.core_tech);
      document.getElementById('wt-courses').textContent = t(P.ui.core_courses);
      document.getElementById('wt-exp').textContent = t(P.ui.internship_exp);
      document.getElementById('wt-projects').textContent = t(P.ui.latest_projects);
      document.getElementById('wt-articles').textContent = t(P.ui.latest_articles);
      document.getElementById('wt-certs').textContent = t(P.ui.certificates);
      document.getElementById('wt-contact').textContent = t(P.ui.get_in_touch);

      // marquee
      const star = "  <span class='hi'>★</span>  ";
      document.getElementById('marquee-text').innerHTML =
        star + esc(t(P.headline)).toUpperCase() + star + esc(t(P.role)).toUpperCase() +
        star + esc(t(P.title)).toUpperCase() + star + "WELCOME TO MY HOMEPAGE!" + star;

      // hero
      document.getElementById('greet').textContent = t(P.greeting);
      document.getElementById('name').textContent = t(P.name);
      document.getElementById('role').textContent = t(P.role);
      document.getElementById('subtitle').textContent = t(P.title);
      const cv = document.getElementById('cvBtn'); cv.querySelector('span').textContent = t(P.ui.download_cv); cv.href = t(P.cv);
      document.getElementById('ghBtn').href = P.contact.github;
      document.getElementById('counter-cap').textContent = (L==='zh'?'您是第':'You are visitor #')+' '+visitorCount().toLocaleString();
      renderOdometer();

      // about
      document.getElementById('portrait').src = P.avatar;
      document.getElementById('portrait').onerror = function(){ this.src = P.avatarAlt; };
      document.getElementById('bio').innerHTML = P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('');
      document.getElementById('loc-tag').innerHTML = '📍 '+esc(t(P.location));

      // education table
      document.getElementById('edu-table').innerHTML =
        `<tr><th>${esc(L==='zh'?'时间':'Period')}</th><th>${esc(L==='zh'?'学校 / 学位':'School / Degree')}</th></tr>` +
        P.education.map(e=>`<tr><td class="rowlabel">${esc(e.period)}</td>
          <td><b>${esc(t(e.school))}</b><br>${esc(t(e.degree))}<br><i style="color:#555">${esc(t(e.note))}</i></td></tr>`).join('');

      // skills table
      document.getElementById('skills-table').innerHTML =
        `<tr><th colspan="2">${esc(t(P.ui.core_tech))}</th></tr>` +
        P.skills.map((s,i)=>`<tr><td class="rowlabel">#${i+1}</td><td>${esc(s)}</td></tr>`).join('');
      document.getElementById('chips').innerHTML = P.skillTags.map(s=>`<span class="chip">${esc(s)}</span>`).join('');

      // courses
      document.getElementById('courses').innerHTML = P.courses.map(c=>`
        <div class="course"><div class="ch"><i class="fa ${esc(c.icon)}"></i> ${esc(t(c.title))}</div>
        <p>${esc(t(c.desc))}</p></div>`).join('');

      // experience
      document.getElementById('exp-body').innerHTML = P.experience.map(x=>`
        <table class="retro"><tr><th colspan="2">${esc(t(x.role))} @ ${esc(t(x.company))} &nbsp;[${esc(x.period)}]</th></tr>
        <tr><td colspan="2" style="font-style:italic;color:#555">${esc(t(x.summary))}</td></tr>
        ${x.bullets.map((b,i)=>`<tr><td class="rowlabel">&raquo; ${i+1}</td><td>${esc(t(b))}</td></tr>`).join('')}
        </table>`).join('');

      // certificates
      document.getElementById('certs').innerHTML = P.certificates.map(c=>`
        <div class="cert"><img src="${esc(c.image)}" alt="${esc(t(c.title))}">
        <div class="cm"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');

      // contact
      document.getElementById('contact-blurb').textContent = t(P.ui.inbox_open);
      document.getElementById('contact-table').innerHTML =
        `<tr><th colspan="2">${esc(L==='zh'?'联系方式':'Contact Info')}</th></tr>` +
        [['E-Mail', P.contact.email, 'mailto:'+P.contact.email],
         ['Phone', P.contact.phone, P.contact.phoneHref],
         ['GitHub', '@'+P.contact.githubUser, P.contact.github],
         ['WeChat', 'QR Code', P.contact.wechatQrPage]]
        .map(([k,v,h])=>`<tr><td class="rowlabel">${esc(k)}</td><td><a href="${esc(h)}">${esc(v)}</a></td></tr>`).join('');
      document.getElementById('lb-name').textContent = t(P.ui.name_placeholder)+':';
      document.getElementById('lb-email').textContent = t(P.ui.email_placeholder)+':';
      document.getElementById('lb-msg').textContent = t(P.ui.msg_placeholder)+':';
      document.getElementById('cf-name').placeholder = t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder = t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder = t(P.ui.msg_placeholder);
      document.getElementById('cf-send').innerHTML = '<i class="fa fa-paper-plane"></i> '+esc(t(P.ui.send));

      // footer
      document.getElementById('foot-desc').textContent = t(P.ui.footer_desc);
      document.getElementById('foot-links').innerHTML =
        `<a href="${esc(P.contact.github)}" target="_blank" rel="noopener">GitHub</a> |
         <a href="mailto:${esc(P.contact.email)}">Email</a> |
         <a href="${esc(P.contact.wechatQrPage)}">WeChat</a> |
         <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      const icp = document.getElementById('foot-icp'); icp.textContent = '⚖ '+P.icp; icp.href = P.icpUrl;

      // filters
      document.getElementById('filters').innerHTML = P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box = document.getElementById('projects-body');
      if(!projects.length){ box.innerHTML = `<p>${esc(t(P.ui.no_projects))}</p>`; return; }
      box.innerHTML = projects.map((p,i)=>`
        <div class="item">
          <div class="it-body">
            <h4><a href="${esc(p.href)}">${esc(p.localTitle())}</a>${isNew(p.created_at,i)?NEW:''}</h4>
            <div class="it-meta">${esc(p.dateText())} &nbsp;·&nbsp; <span class="it-tech">${esc(p.tech_stack||'')}</span></div>
            <p>${esc(p.localSummary()||'')}</p>
            <a class="rbtn yel" style="font-size:16px;margin-top:6px" href="${esc(p.href)}">${esc(t(P.ui.view_project))} &raquo;</a>
          </div>
        </div>`).join('');
    }

    function renderArticles(){
      const box = document.getElementById('articles-body');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML = `<p>${esc(t(P.ui.no_articles))}</p>`; return; }
      box.innerHTML = list.map((a,i)=>`
        <div class="item">
          <div class="thumb"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
          <div class="it-body">
            <h4><a href="${esc(a.href)}">${esc(a.localTitle())}</a>${isNew(a.created_at,i)?NEW:''}</h4>
            <div class="it-meta">[${esc(a.category||'')}] &nbsp;·&nbsp; ${esc(a.dateText())}</div>
            <p>${esc(a.localSummary()||'')}</p>
          </div>
        </div>`).join('');
    }

    document.getElementById('cf').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      s.style.color='#000080'; s.textContent = t(P.ui.sending);
      try{
        const r = await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});
        s.style.color='#006400'; s.textContent = '✓ '+(r.message||'Sent!'); f.reset();
      }catch(err){ s.style.color='#cc0000'; s.textContent = '✗ '+err.message; }
    });

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-body').innerHTML = `<p>⚠ ${esc(t(P.ui.no_projects))}</p>`; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-body').innerHTML = `<p>⚠ Failed to load articles.</p>`; }
    }

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:'#ff00ff' });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

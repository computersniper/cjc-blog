<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — F1 Telemetry</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    :root{
      --bg0:#0a0c0f; --bg1:#12161c; --bg2:#171b22; --panel:#12151b;
      --red:#e10600; --red2:#ff2b1f; --ink:#eef1f4; --mut:#8b93a1;
      --line:rgba(255,255,255,.09); --green:#00d68f; --amber:#ffb300; --cyan:#31e0ff; --purple:#b06bff;
      --carbon:
        repeating-linear-gradient(45deg,#0d1015 0 6px,#0f131a 6px 12px),
        repeating-linear-gradient(-45deg,rgba(255,255,255,.015) 0 6px,transparent 6px 12px);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg0);color:var(--ink);
      font-family:'Titillium Web',system-ui,sans-serif;line-height:1.5;overflow-x:hidden;
      background-image:var(--carbon);background-attachment:fixed}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    .wrap{max-width:1200px;margin:0 auto;padding:0 22px}
    h1,h2,h3,.disp{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.02em}
    .mono{font-family:'Titillium Web';font-variant-numeric:tabular-nums}

    /* ---- Start lights strip ---- */
    .lights{position:sticky;top:0;z-index:800;display:flex;gap:10px;justify-content:center;
      padding:9px 0;background:linear-gradient(#0c0f14,#0a0c0f);border-bottom:1px solid var(--line)}
    .lgt{width:26px;height:26px;border-radius:50%;background:#2a0806;border:2px solid #3a1210;
      box-shadow:inset 0 0 6px #000}
    .lgt.on{background:radial-gradient(circle at 40% 35%,#ff6b64,var(--red));
      border-color:#ff5a52;box-shadow:0 0 14px var(--red),inset 0 0 6px rgba(255,255,255,.4)}
    @media(max-width:520px){.lgt{width:20px;height:20px}}

    /* ---- Top bar / DRS ---- */
    .topbar{position:sticky;top:44px;z-index:700;background:rgba(10,12,15,.86);
      backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
    .topbar .row{display:flex;align-items:center;justify-content:space-between;height:52px;gap:14px}
    .brand{font-family:'Oswald';font-weight:700;font-size:20px;letter-spacing:.04em}
    .brand b{color:var(--red)}
    .brand .no{display:inline-block;background:var(--red);color:#fff;border-radius:5px;padding:0 7px;margin-right:8px;
      font-style:italic;transform:skewX(-8deg)}
    .nav{display:flex;gap:16px}
    .nav a{font-family:'Oswald';font-size:12px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
    .nav a:hover{color:var(--ink)}
    @media(max-width:880px){.nav{display:none}}

    section{padding:60px 0;position:relative}
    .sec-head{display:flex;align-items:center;gap:14px;margin-bottom:26px}
    .sec-head .n{font-family:'Oswald';color:var(--red);font-weight:700;font-size:14px;letter-spacing:.16em}
    .sec-head h2{margin:0;font-size:clamp(24px,4vw,40px);line-height:1}
    .sec-head .fill{flex:1;height:2px;background:
      repeating-linear-gradient(90deg,var(--line) 0 14px,transparent 14px 22px)}

    /* speed lines behind sections */
    .speed{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:.5}
    .speed span{position:absolute;height:2px;width:220px;left:-260px;
      background:linear-gradient(90deg,transparent,var(--red));border-radius:2px;
      animation:zoom 3.4s linear infinite}
    @keyframes zoom{to{transform:translateX(140vw)}}

    /* ---- HERO ---- */
    .hero{padding:44px 0 30px;position:relative}
    .hero .grid{display:grid;grid-template-columns:1.35fr .95fr;gap:26px;align-items:center}
    @media(max-width:900px){.hero .grid{grid-template-columns:1fr}}
    .greet{font-family:'Oswald';color:var(--red);letter-spacing:.3em;font-size:13px;text-transform:uppercase}
    .hero h1{font-size:clamp(48px,11vw,120px);line-height:.9;margin:8px 0 4px;font-weight:700;
      background:linear-gradient(180deg,#fff,#9fb0c4);-webkit-background-clip:text;background-clip:text;color:transparent}
    .hero .role{font-family:'Oswald';font-size:clamp(16px,2.4vw,24px);color:var(--red);letter-spacing:.06em}
    .hero .tag{color:var(--mut);max-width:40ch;margin:12px 0 20px;font-size:16px}
    .btns{display:flex;flex-wrap:wrap;gap:12px}
    .btn{display:inline-flex;align-items:center;gap:9px;font-family:'Oswald';text-transform:uppercase;
      letter-spacing:.08em;font-size:14px;padding:12px 20px;border-radius:6px;cursor:pointer;transition:.16s;border:2px solid transparent}
    .btn.pri{background:var(--red);color:#fff}
    .btn.pri:hover{background:#ff2b1f;transform:translateY(-2px)}
    .btn.gho{border-color:var(--line);color:var(--ink);background:rgba(255,255,255,.03)}
    .btn.gho:hover{border-color:var(--red);color:var(--red)}

    /* HUD panel */
    .hud{background:linear-gradient(180deg,rgba(20,24,31,.9),rgba(12,14,19,.9));
      border:1px solid var(--line);border-radius:12px;padding:16px;position:relative;overflow:hidden}
    .hud::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
    .hud .lbl{font-family:'Oswald';font-size:11px;letter-spacing:.2em;color:var(--mut);text-transform:uppercase}
    .hud .big{font-family:'Oswald';font-size:34px;line-height:1;margin:2px 0 10px}
    .hud .big small{font-size:14px;color:var(--mut)}
    .sectors{display:flex;gap:6px;margin-bottom:12px}
    .sectors b{flex:1;height:8px;border-radius:3px;background:#243040}
    .sectors b.g{background:var(--green)}.sectors b.p{background:var(--purple)}.sectors b.y{background:var(--amber)}
    .grph{height:46px;display:flex;align-items:flex-end;gap:3px}
    .grph i{flex:1;background:linear-gradient(180deg,var(--red),transparent);border-radius:2px 2px 0 0;min-height:4px}
    .indics{display:flex;gap:8px;margin-top:12px}
    .ind{flex:1;text-align:center;border:1px solid var(--line);border-radius:7px;padding:7px 4px}
    .ind .k{font-family:'Oswald';font-size:10px;letter-spacing:.12em;color:var(--mut)}
    .ind .v{font-family:'Oswald';font-weight:700;font-size:15px}
    .ind.drs .v{color:var(--green)}.ind.ers .v{color:var(--cyan)}.ind.tyre .v{color:var(--amber)}

    /* ---- About ---- */
    .about{display:grid;grid-template-columns:280px 1fr;gap:26px;align-items:start}
    @media(max-width:760px){.about{grid-template-columns:1fr}}
    .portrait{border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;background:var(--bg2)}
    .portrait::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 60px rgba(225,6,0,.18)}
    .portrait img{width:100%;height:340px;object-fit:cover}
    .about p{color:#c3ccd8;font-size:16px;margin:0 0 14px;max-width:62ch}
    .loc{display:inline-flex;gap:8px;align-items:center;font-family:'Oswald';color:var(--red);
      border:1px solid var(--red);border-radius:6px;padding:6px 12px;letter-spacing:.08em;font-size:13px}

    /* ---- Timing table (education/experience) ---- */
    .timing{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(15,18,24,.6)}
    .trow{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:18px 18px;border-top:1px solid var(--line)}
    .trow:first-child{border-top:none}
    .trow .p{font-family:'Oswald';color:var(--red);font-weight:600;letter-spacing:.04em}
    .trow h3{margin:0 0 4px;font-size:19px}
    .trow .s{color:var(--mut);font-size:14.5px}
    .trow ul{margin:10px 0 0;padding-left:18px;color:#c3ccd8;font-size:14.5px;line-height:1.7}
    @media(max-width:620px){.trow{grid-template-columns:1fr;gap:6px}}

    /* ---- Setup sheet (skills) ---- */
    .setup{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    @media(max-width:640px){.setup{grid-template-columns:minmax(0,1fr)}}
    .setrow{display:flex;align-items:center;gap:12px;background:rgba(18,22,28,.7);border:1px solid var(--line);
      border-radius:8px;padding:12px 14px;min-width:0}
    .setrow .k{font-family:'Oswald';font-size:12px;letter-spacing:.1em;color:var(--mut);width:78px;flex-shrink:0}
    .setrow .bar{flex:1;height:8px;border-radius:4px;background:#1c232d;overflow:hidden;min-width:24px}
    .setrow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--amber))}
    .setrow .v{font-family:'Oswald';font-size:13px;color:var(--ink);white-space:nowrap;max-width:52%;overflow:hidden;text-overflow:ellipsis;min-width:0}
    .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
    .tags span{font-family:'Oswald';font-size:12px;letter-spacing:.06em;padding:6px 11px;border-radius:5px;
      background:rgba(225,6,0,.12);border:1px solid rgba(225,6,0,.35);color:#ffb9b6}

    /* ---- Courses ---- */
    .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    @media(max-width:820px){.courses{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.courses{grid-template-columns:1fr}}
    .course{background:linear-gradient(180deg,rgba(20,24,31,.85),rgba(12,14,19,.85));border:1px solid var(--line);
      border-radius:10px;padding:18px;position:relative;overflow:hidden;transition:.18s}
    .course:hover{border-color:rgba(225,6,0,.5);transform:translateY(-3px)}
    .course::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--red)}
    .course i.fa{color:var(--red);font-size:22px}
    .course h4{margin:12px 0 8px;font-size:16px}
    .course p{margin:0;color:var(--mut);font-size:14px;line-height:1.55}

    /* ---- Cards (projects/articles) ---- */
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    @media(max-width:880px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.cards{grid-template-columns:1fr}}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
      display:flex;flex-direction:column;transition:.18s;position:relative}
    .card:hover{transform:translateY(-4px);border-color:rgba(225,6,0,.55);box-shadow:0 14px 34px rgba(0,0,0,.5)}
    .card .cover{height:158px;overflow:hidden;background:#0e1218;position:relative}
    .card .cover img{width:100%;height:100%;object-fit:cover;transition:.4s}
    .card:hover .cover img{transform:scale(1.06)}
    .pod{position:absolute;top:8px;left:8px;font-family:'Oswald';font-weight:700;font-size:12px;
      background:var(--red);color:#fff;border-radius:5px;padding:3px 9px;letter-spacing:.06em}
    .cbody{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
    .ctag{display:flex;justify-content:space-between;font-family:'Oswald';font-size:11px;letter-spacing:.1em;
      color:var(--red);text-transform:uppercase}
    .card h4{margin:0;font-size:16px;line-height:1.25;font-family:'Titillium Web';font-weight:700;text-transform:none}
    .card p{margin:0;color:var(--mut);font-size:13.5px;line-height:1.5;flex:1}
    .card .more{font-family:'Oswald';font-size:12px;letter-spacing:.1em;color:var(--ink)}
    .tech{color:var(--amber);font-size:12.5px;font-weight:600}

    .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
    .filters button{font-family:'Oswald';text-transform:uppercase;letter-spacing:.08em;font-size:12px;
      background:transparent;border:1px solid var(--line);color:var(--mut);padding:8px 14px;border-radius:6px;cursor:pointer;transition:.15s}
    .filters button.active,.filters button:hover{background:var(--red);border-color:var(--red);color:#fff}

    /* ---- Certificates ---- */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:640px){.certs{grid-template-columns:1fr}}
    .cert{display:grid;grid-template-columns:120px 1fr;background:var(--panel);border:1px solid var(--line);
      border-radius:10px;overflow:hidden}
    .cert img{width:100%;height:100%;object-fit:cover;min-height:130px}
    .cert .ct{padding:14px}
    .cert .meta{display:flex;justify-content:space-between;font-family:'Oswald';font-size:11px;letter-spacing:.08em;color:var(--red)}
    .cert h4{margin:8px 0 6px;font-size:16px;font-family:'Titillium Web';font-weight:700;text-transform:none}
    .cert p{margin:0;color:var(--mut);font-size:13px;line-height:1.5}
    @media(max-width:400px){.cert{grid-template-columns:88px 1fr}}

    /* ---- Contact ---- */
    .contact{display:grid;grid-template-columns:1fr 1.2fr;gap:24px}
    @media(max-width:800px){.contact{grid-template-columns:1fr}}
    .cinfo a{display:flex;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line);font-weight:600}
    .cinfo a:first-child{border-top:none}
    .cinfo a span:last-child{color:var(--red);font-family:'Oswald'}
    form input,form textarea{width:100%;background:rgba(10,12,16,.8);border:1px solid var(--line);border-radius:8px;
      color:var(--ink);font-family:inherit;font-size:15px;padding:13px;margin-bottom:12px}
    form input:focus,form textarea:focus{outline:none;border-color:var(--red)}
    form textarea{min-height:120px;resize:vertical}
    #cf-status{font-family:'Oswald';margin-top:6px;font-size:14px;letter-spacing:.04em}

    footer{border-top:1px solid var(--line);padding:34px 0 60px;background:linear-gradient(#0a0c0f,#0d1015)}
    .frow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:center}
    .fsoc{display:flex;gap:18px}
    .fsoc a{color:var(--mut);font-family:'Oswald';font-size:13px;letter-spacing:.06em}
    .fsoc a:hover{color:var(--red)}
    .muted{color:#5a6475;font-size:12.5px}
    .load-note{color:var(--mut);font-size:14px;grid-column:1/-1;padding:18px;border:1px dashed var(--line);border-radius:8px;text-align:center}

    @media(prefers-reduced-motion:reduce){
      .speed span{animation:none;display:none}
      *{scroll-behavior:auto}
    }
  </style>
</head>
<body>
  <div class="lights" id="lights" aria-hidden="true">
    <div class="lgt"></div><div class="lgt"></div><div class="lgt"></div><div class="lgt"></div><div class="lgt"></div>
  </div>

  <div class="topbar"><div class="wrap row">
    <a class="brand" href="#top"><span class="no">44</span>Cai<b>Jiechao</b></a>
    <nav class="nav" id="nav"></nav>
  </div></div>

  <div id="top"></div>
  <header class="hero"><div class="wrap">
    <div class="grid">
      <div>
        <div class="greet" id="greet"></div>
        <h1 id="name"></h1>
        <div class="role" id="role"></div>
        <p class="tag" id="tag"></p>
        <div class="btns">
          <a class="btn pri" id="cvBtn" download><i class="fa fa-download"></i><span></span></a>
          <a class="btn gho" id="ghBtn" target="_blank" rel="noopener"><i class="fa fa-github"></i><span>GitHub</span></a>
        </div>
      </div>
      <div class="hud">
        <div class="lbl">Fastest Lap · Sector Times</div>
        <div class="big mono">1:18<small>.204</small></div>
        <div class="sectors"><b class="g"></b><b class="p"></b><b class="y"></b></div>
        <div class="lbl">Speed Trace</div>
        <div class="grph" id="trace"></div>
        <div class="indics">
          <div class="ind drs"><div class="k">DRS</div><div class="v">OPEN</div></div>
          <div class="ind ers"><div class="k">ERS</div><div class="v">DEPLOY</div></div>
          <div class="ind tyre"><div class="k">TYRE</div><div class="v">SOFT</div></div>
        </div>
      </div>
    </div>
  </div></header>

  <section id="about"><div class="speed"><span style="top:20%;animation-delay:0s"></span><span style="top:60%;animation-delay:1.4s"></span></div><div class="wrap">
    <div class="sec-head"><span class="n">P01 /</span><h2 id="l-about"></h2><span class="fill"></span></div>
    <div class="about">
      <div class="portrait"><img id="portrait" alt="Cai Jiechao portrait" /></div>
      <div>
        <div id="bio"></div>
        <span class="loc" id="loc"></span>
      </div>
    </div>
  </div></section>

  <section id="education"><div class="wrap">
    <div class="sec-head"><span class="n">P02 /</span><h2 id="l-edu"></h2><span class="fill"></span></div>
    <div class="timing" id="edu"></div>
  </div></section>

  <section id="skills"><div class="speed"><span style="top:35%;animation-delay:.6s"></span></div><div class="wrap">
    <div class="sec-head"><span class="n">P03 /</span><h2 id="l-skills"></h2><span class="fill"></span></div>
    <div class="setup" id="setup"></div>
    <div class="tags" id="tags"></div>
  </div></section>

  <section id="courses"><div class="wrap">
    <div class="sec-head"><span class="n">P04 /</span><h2 id="l-courses"></h2><span class="fill"></span></div>
    <div class="courses" id="courses-box"></div>
  </div></section>

  <section id="experience"><div class="wrap">
    <div class="sec-head"><span class="n">P05 /</span><h2 id="l-exp"></h2><span class="fill"></span></div>
    <div class="timing" id="exp"></div>
  </div></section>

  <section id="projects"><div class="speed"><span style="top:15%;animation-delay:1s"></span><span style="top:75%;animation-delay:2.2s"></span></div><div class="wrap">
    <div class="sec-head"><span class="n">P06 /</span><h2 id="l-projects"></h2><span class="fill"></span></div>
    <div class="cards" id="projects-box"><div class="load-note" id="proj-load"></div></div>
  </div></section>

  <section id="articles"><div class="wrap">
    <div class="sec-head"><span class="n">P07 /</span><h2 id="l-articles"></h2><span class="fill"></span></div>
    <div class="filters" id="filters"></div>
    <div class="cards" id="articles-box"><div class="load-note" id="art-load"></div></div>
  </div></section>

  <section id="certificates"><div class="wrap">
    <div class="sec-head"><span class="n">P08 /</span><h2 id="l-certs"></h2><span class="fill"></span></div>
    <div class="certs" id="certs"></div>
  </div></section>

  <section id="contact"><div class="wrap">
    <div class="sec-head"><span class="n">P09 /</span><h2 id="l-contact"></h2><span class="fill"></span></div>
    <div class="contact">
      <div class="cinfo" id="cinfo"></div>
      <form id="cf">
        <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
        <input type="text" name="name" id="cf-name" required>
        <input type="email" name="email" id="cf-email" required>
        <textarea name="message" id="cf-msg" required></textarea>
        <button type="submit" class="btn pri" id="cf-send"></button>
        <p id="cf-status"></p>
      </form>
    </div>
  </div></section>

  <footer><div class="wrap">
    <div class="frow">
      <a class="brand" href="#top" style="font-size:17px"><span class="no">44</span>Cai<b>Jiechao</b></a>
      <div class="fsoc" id="fsoc"></div>
    </div>
    <div class="frow" style="margin-top:16px">
      <span class="muted" id="foot-desc"></span>
      <a class="muted" id="foot-icp" target="_blank" rel="noopener"></a>
    </div>
  </div></footer>

  <script>window.THEME_ID = "54-f1";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";
    const podium = ["🏆 WIN","🥈 P2","🥉 P3"];

    // speed trace bars
    (function(){ const el=document.getElementById('trace'); let h='';
      for(let i=0;i<28;i++){ h+=`<i style="height:${20+Math.round(60*Math.abs(Math.sin(i*.7)))}%"></i>`; }
      el.innerHTML=h; })();

    function renderStatic(){
      document.getElementById('nav').innerHTML = [
        ['about','nav_about'],['skills','nav_courses'],['projects','nav_portfolio'],
        ['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');
      document.getElementById('greet').textContent = t(P.greeting);
      document.getElementById('name').textContent = t(P.name);
      document.getElementById('role').textContent = t(P.role);
      document.getElementById('tag').textContent = t(P.title);
      const cv=document.getElementById('cvBtn'); cv.href=t(P.cv); cv.querySelector('span').textContent=t(P.ui.download_cv);
      document.getElementById('ghBtn').href=P.contact.github;

      document.getElementById('l-about').textContent=t(P.ui.about_me);
      document.getElementById('l-edu').textContent=t(P.ui.education_bg);
      document.getElementById('l-skills').textContent="Car Setup · "+t(P.ui.core_tech);
      document.getElementById('l-courses').textContent=t(P.ui.core_courses);
      document.getElementById('l-exp').textContent="Pit Wall · "+t(P.ui.internship_exp);
      document.getElementById('l-projects').textContent="Podiums · "+t(P.ui.latest_projects);
      document.getElementById('l-articles').textContent="Race Reports · "+t(P.ui.latest_articles);
      document.getElementById('l-certs').textContent=t(P.ui.certificates);
      document.getElementById('l-contact').textContent="Radio · "+t(P.ui.get_in_touch);

      document.getElementById('portrait').src=P.avatar;
      document.getElementById('bio').innerHTML=P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('');
      document.getElementById('loc').innerHTML=`<i class="fa fa-map-marker"></i> ${esc(t(P.location))}`;

      document.getElementById('edu').innerHTML=P.education.map(e=>`
        <div class="trow"><div class="p">${esc(e.period)}</div>
        <div><h3>${esc(t(e.school))}</h3><div class="s">${esc(t(e.degree))} — ${esc(t(e.note))}</div></div></div>`).join('');

      const setEl=document.getElementById('setup'), pct=[95,90,85,80,88,82];
      setEl.innerHTML=P.skills.map((s,i)=>`
        <div class="setrow"><div class="k">SET ${String(i+1).padStart(2,'0')}</div>
        <div class="bar"><i style="width:${pct[i%pct.length]}%"></i></div>
        <div class="v">${esc(s)}</div></div>`).join('');
      document.getElementById('tags').innerHTML=P.skillTags.map(x=>`<span>${esc(x)}</span>`).join('');

      document.getElementById('courses-box').innerHTML=P.courses.map(c=>`
        <div class="course"><i class="fa ${esc(c.icon)}"></i><h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');

      document.getElementById('exp').innerHTML=P.experience.map(x=>`
        <div class="trow"><div class="p">${esc(x.period)}</div>
        <div><h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3>
        <div class="s">${esc(t(x.summary))}</div>
        <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div></div>`).join('');

      document.getElementById('certs').innerHTML=P.certificates.map(c=>`
        <div class="cert"><img src="${esc(c.image)}" alt="${esc(t(c.title))}" onerror="this.src='/index_page/img/blogs/1.jpg'">
        <div class="ct"><div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');

      document.getElementById('cinfo').innerHTML=[
        ['Email',P.contact.email,'mailto:'+P.contact.email],
        ['Phone',P.contact.phone,P.contact.phoneHref],
        ['GitHub','@'+P.contact.githubUser,P.contact.github],
        ['WeChat','QR ↗',P.contact.wechatQrPage]
      ].map(([k,v,h])=>`<a href="${esc(h)}"><span>${esc(k)}</span><span>${esc(v)}</span></a>`).join('');
      document.getElementById('cf-name').placeholder=t(P.ui.name_placeholder);
      document.getElementById('cf-email').placeholder=t(P.ui.email_placeholder);
      document.getElementById('cf-msg').placeholder=t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent=t(P.ui.send);

      document.getElementById('fsoc').innerHTML=`
        <a href="${P.contact.github}" target="_blank" rel="noopener">GitHub</a>
        <a href="mailto:${P.contact.email}">Email</a>
        <a href="${P.contact.wechatQrPage}">WeChat</a>
        <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent=t(P.ui.footer_desc);
      const icp=document.getElementById('foot-icp'); icp.textContent=P.icp; icp.href=P.icpUrl;

      document.getElementById('filters').innerHTML=P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box=document.getElementById('projects-box');
      if(!projects.length){ box.innerHTML=`<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML=projects.map((p,i)=>`
        <a class="card" href="${esc(p.href)}">
          <div class="cbody">
            <span class="pod" style="position:static;align-self:flex-start;margin-bottom:2px">${podium[i]||('P'+(i+1))}</span>
            <div class="ctag"><span>${esc(t(P.ui.tech_stack))}</span><span>${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <p class="tech">${esc(p.tech_stack||'')}</p>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div></a>`).join('');
    }
    function renderArticles(){
      const box=document.getElementById('articles-box');
      const list=CJCData.filterArticles(articles,filterKey);
      if(!list.length){ box.innerHTML=`<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML=list.map(a=>`
        <a class="card" href="${esc(a.href)}">
          <div class="cover"><span class="pod">RACE REPORT</span><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
          <div class="cbody">
            <div class="ctag"><span>${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div></a>`).join('');
    }
    async function loadDynamic(){
      try{ projects=await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-box').innerHTML=`<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles=await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-box').innerHTML=`<div class="load-note">⚠ Failed to load articles.</div>`; }
    }

    document.getElementById('cf').addEventListener('submit',async(e)=>{
      e.preventDefault();
      const f=e.target,s=document.getElementById('cf-status');
      s.style.color='var(--mut)'; s.textContent=t(P.ui.sending);
      try{ const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});
        s.style.color='var(--green)'; s.textContent=r.message||'Sent. 10-4!'; f.reset(); }
      catch(err){ s.style.color='var(--red)'; s.textContent=err.message; }
    });

    // lights-out sequence (reduced-motion => static all on)
    function lightsOut(){
      const l=[...document.querySelectorAll('#lights .lgt')];
      const rm=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
      if(rm){ l.forEach(x=>x.classList.add('on')); return; }
      l.forEach(x=>x.classList.remove('on'));
      l.forEach((x,i)=>setTimeout(()=>x.classList.add('on'),i*450+300));
      setTimeout(()=>l.forEach(x=>x.classList.remove('on')),450*5+900); // lights out — GO!
    }

    document.addEventListener('DOMContentLoaded',()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({accent:'#e10600'});
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
      lightsOut();
    });
  })();
  </script>
</body>
</html>

<script>window.THEME_ID='72-paper-journal';</script><script src="/shared/profile.js"></script><script src="/shared/site-data.js"></script><script>
(()=>{'use strict';const P=CJCData.profile,t=CJCData.t.bind(CJCData),e=CJCData.escapeHtml;let projects=[],articles=[],filter='all';const L={en:{nav:[['about','about'],['studies','studies'],['projects','work'],['articles','notes'],['contact','write me']],idle:'idle',hero:'Tell me about the work you want to leave behind.',time:'Take your time.',start:'Start',cv:'download cv',about:'A page about me',aboutLead:'The person behind the tabs and terminal windows.',studies:'Things I keep learning',studiesLead:'Schools, tools and subjects pinned to the page.',exp:'A chapter called work',expLead:'Notes from a season building real systems.',projects:'Things I have made',projectsLead:'Projects from the live portfolio, pasted into the journal.',articles:'Notes from the margins',articlesLead:'Technical writing, experiments and lessons.',cert:'Small proofs, kept safe',certLead:'Certificates and milestones from the archive.',contact:'Leave a note',contactLead:'A question, collaboration, or hello is welcome here.',loc:'Written from',open:'open the project',read:'read the note',failed:'The page could not be loaded. Please try again soon.',send:'send this note',sending:'sending…',sent:'your note is on its way.',name:'your name',email:'your email',message:'what is on your mind?'},zh:{nav:[['about','关于我'],['studies','学习'],['projects','作品'],['articles','笔记'],['contact','给我写信']],idle:'空闲中',hero:'告诉我，你想留下些什么样的作品。',time:'慢慢来。',start:'开始',cv:'下载简历',about:'关于我的一页',aboutLead:'标签页与终端窗口背后的那个人。',studies:'我一直在学的事',studiesLead:'贴在纸上的学校、工具与学科。',exp:'名为工作的章节',expLead:'一段构建真实系统的工作手记。',projects:'我做过的东西',projectsLead:'从实时作品集贴进日记的项目。',articles:'页边的笔记',articlesLead:'技术写作、实验与教训。',cert:'妥善收好的小证明',certLead:'档案里的证书与里程碑。',contact:'留一张便条',contactLead:'欢迎问题、合作，或只是打个招呼。',loc:'写于',open:'打开项目',read:'阅读笔记',failed:'页面暂时无法加载，请稍后再试。',send:'寄出便条',sending:'寄送中…',sent:'你的便条已经在路上。',name:'你的名字',email:'你的邮箱',message:'你在想什么？'}};const l=()=>L[CJCData.lang()];const head=(k,n)=>`<div class="page-head reveal"><span class="page-no">${String(n).padStart(2,'0')} / 08</span><div><h2>${e(l()[k])}</h2><p>${e(l()[k+'Lead'])}</p></div></div>`;
function hero(){const x=l(),photo=P.photos&&P.photos.campus||P.avatar;return `<section class="hero" id="top"><figure class="portrait"><img src="${e(photo)}" alt="Portrait of ${e(t(P.name))}"></figure><div><h1>${e(t(P.name))}</h1><p class="prompt">“${e(x.hero)}”</p><p class="take-time">${e(x.time)}</p></div><div class="hero-actions"><a class="start" href="#about">${e(x.start)}</a><a class="small-link" href="${e(t(P.cv))}" download>${e(x.cv)}</a></div><nav class="symbol-grid" aria-label="Quick links"><a href="#about" aria-label="${e(x.about)}"><i class="fa fa-star-o" aria-hidden="true"></i></a><a href="#articles" aria-label="${e(x.articles)}"><i class="fa fa-comment-o" aria-hidden="true"></i></a><a href="mailto:${e(P.contact.email)}" aria-label="Email"><i class="fa fa-coffee" aria-hidden="true"></i></a><a href="#studies" aria-label="${e(x.studies)}"><i class="fa fa-leaf" aria-hidden="true"></i></a><a href="#projects" aria-label="${e(x.projects)}"><i class="fa fa-bicycle" aria-hidden="true"></i></a><a href="${e(P.contact.github)}" target="_blank" rel="noopener" aria-label="GitHub"><i class="fa fa-github-alt" aria-hidden="true"></i></a><a href="#contact" aria-label="${e(x.contact)}"><i class="fa fa-users" aria-hidden="true"></i></a><a href="#top" aria-label="Home"><i class="fa fa-home" aria-hidden="true"></i></a><a href="${e(P.contact.wechatQrPage)}" aria-label="WeChat"><i class="fa fa-paper-plane-o" aria-hidden="true"></i></a></nav></section>`}
function about(){const x=l(),photo=P.photos&&P.photos.city||P.avatarAlt||P.avatar;return `<section id="about">${head('about',1)}<div class="about reveal"><figure class="polaroid"><img src="${e(photo)}" alt="${e(t(P.name))} in ${e(t(P.location))}"><figcaption>${e(x.loc)} ${e(t(P.location))}</figcaption></figure><div class="bio"><p>${e(t(P.bio[0]))}</p><p>${e(t(P.bio[1]))}</p><span class="note">${e(t(P.role))} · ${e(t(P.location))}</span></div></div></section>`}
function studies(){const x=l();return `<section id="studies">${head('studies',2)}<div class="education reveal">${P.education.map(v=>`<article class="edu"><time>${e(v.period)}</time><h3>${e(t(v.school))}</h3><p>${e(t(v.degree))}<br>${e(t(v.note))}</p></article>`).join('')}</div><div class="skills reveal">${P.skillTags.map(v=>`<span>${e(v)}</span>`).join('')}</div><div class="courses reveal">${P.courses.map(v=>`<article class="course"><i class="fa ${e(v.icon)}" aria-hidden="true"></i><h3>${e(t(v.title))}</h3><p>${e(t(v.desc))}</p></article>`).join('')}</div></section>`}
function experience(){const v=P.experience[0];return `<section>${head('exp',3)}<div class="experience reveal"><time>${e(v.period)}<br>${e(t(v.company))}</time><div><h3>${e(t(v.role))}</h3><p>${e(t(v.summary))}</p><ul class="checklist">${v.bullets.map(b=>`<li>${e(t(b))}</li>`).join('')}</ul></div></div></section>`}
function projectSection(){const x=l(),body=projects.length?`<div class="projects reveal">${projects.map(p=>`<a class="project" href="${e(p.href)}"><img loading="lazy" src="${e(p.cover_image||'/index_page/img/blogs/1.jpg')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(p.localTitle())}"><div class="meta">${e(p.dateText())} · ${e(p.tech_stack||t(P.ui.tech_stack))}</div><h3>${e(p.localTitle())}</h3><p>${e(p.localSummary()||'')}</p><span class="go">${e(x.open)}</span></a>`).join('')}</div>`:`<p class="loading">${e(t(P.ui.loading_projects))}</p>`;return `<section id="projects">${head('projects',4)}${body}</section>`}
function articleSection(){const x=l(),list=CJCData.filterArticles(articles,filter),body=!articles.length?`<p class="loading">${e(t(P.ui.loading_articles))}</p>`:!list.length?`<p class="loading">${e(t(P.ui.no_articles))}</p>`:`<div class="articles reveal">${list.map(a=>`<article class="article"><img loading="lazy" src="${e(a.cover_image||'/index_page/img/blogs/1.jpg')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt="${e(a.localTitle())}"><div class="meta">${e(a.category||'')} · ${e(a.dateText())}</div><h3>${e(a.localTitle())}</h3><p>${e(a.localSummary()||'')}</p><a class="go" href="${e(a.href)}">${e(x.read)}</a></article>`).join('')}</div>`;return `<section id="articles">${head('articles',5)}<div class="filters">${P.articleFilters.map(f=>`<button type="button" data-filter="${e(f.key)}" class="${filter===f.key?'active':''}">${e(t(f.label))}</button>`).join('')}</div>${body}</section>`}
function certs(){return `<section>${head('cert',6)}<div class="certs reveal">${P.certificates.map(c=>`<article class="cert"><img loading="lazy" src="${e(c.image)}" alt="${e(t(c.title))}"><div><div class="page-no">${e(t(c.tag))} · ${e(t(c.date))}</div><h3>${e(t(c.title))}</h3><p>${e(t(c.desc))}</p></div></article>`).join('')}</div></section>`}
function contact(){const x=l();return `<section id="contact">${head('contact',7)}<div class="contact reveal"><div><h2>${e(x.contact)}</h2><div class="links"><a href="mailto:${e(P.contact.email)}"><span>Email</span><span>${e(P.contact.email)}</span></a><a href="${e(P.contact.phoneHref)}"><span>Phone</span><span>${e(P.contact.phone)}</span></a><a href="${e(P.contact.github)}" target="_blank" rel="noopener"><span>GitHub</span><span>@${e(P.contact.githubUser)}</span></a><a href="${e(P.contact.wechatQrPage)}"><span>WeChat</span><span>QR</span></a></div></div><form id="contact-form"><input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true"><label for="name">${e(x.name)}</label><input id="name" name="name" autocomplete="name" required><label for="email">${e(x.email)}</label><input id="email" type="email" name="email" autocomplete="email" required><label for="message">${e(x.message)}</label><textarea id="message" name="message" required></textarea><button class="send" type="submit">${e(x.send)}</button><p id="status" role="status" aria-live="polite"></p></form></div></section>`}
function render(){const x=l();document.title=`Scribe — ${t(P.name)}`;document.getElementById('nav').innerHTML=x.nav.map(v=>`<a href="#${e(v[0])}">${e(v[1])}</a>`).join('');document.getElementById('state').textContent=x.idle;document.getElementById('app').innerHTML=hero()+about()+studies()+experience()+projectSection()+articleSection()+certs()+contact();document.getElementById('footnote').textContent=t(P.ui.footer_desc);document.getElementById('footlinks').innerHTML=`<a href="${e(P.contact.github)}">GitHub</a><a href="mailto:${e(P.contact.email)}">Email</a><a href="/admin.html">${e(t(P.ui.admin_panel))}</a><a href="${e(P.icpUrl)}">${e(P.icp)}</a>`;wire();observe()}
function wire(){document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;render()}));const f=document.getElementById('contact-form');f&&f.addEventListener('submit',async ev=>{ev.preventDefault();const s=document.getElementById('status'),x=l(),btn=f.querySelector('button');btn.disabled=true;s.textContent=x.sending;try{const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});s.textContent=r.message||x.sent;f.reset()}catch(err){s.textContent=err.message||x.failed}finally{btn.disabled=false}})}let io;function observe(){if(matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('.reveal').forEach(n=>n.classList.add('in'));return}if(io)io.disconnect();io=new IntersectionObserver(es=>es.forEach(v=>{if(v.isIntersecting){v.target.classList.add('in');io.unobserve(v.target)}}),{threshold:.1});document.querySelectorAll('.reveal').forEach(n=>io.observe(n))}
document.addEventListener('DOMContentLoaded',async()=>{CJCData.setTheme(window.THEME_ID);render();CJCData.mountSwitcher({accent:'#282823'});CJCData.onLang(render);try{[projects,articles]=await Promise.all([CJCData.fetchProjects(),CJCData.fetchArticles()]);render()}catch(err){document.querySelectorAll('.loading').forEach(n=>{n.textContent=l().failed})}})})();
</script></body></html>

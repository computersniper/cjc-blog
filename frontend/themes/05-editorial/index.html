<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Editorial</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
  <style>
    :root{
      --paper:#f7f3ec; --paper-2:#f1ebe0; --ink:#1a1a1a; --accent:#b8433a;
      --grey:#6b6258; --hair:rgba(26,26,26,.18); --hair-2:rgba(26,26,26,.10);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;background:var(--paper);color:var(--ink);
      font-family:"Source Serif 4",Georgia,"Times New Roman",serif;
      -webkit-font-smoothing:antialiased;line-height:1.7;font-size:18px;
    }
    a{color:inherit}
    img{max-width:100%;display:block}
    .wrap{max-width:1160px;margin:0 auto;padding:0 32px}
    .narrow{max-width:820px;margin:0 auto;padding:0 32px}

    /* Typographic primitives */
    .kicker{font-family:"Source Serif 4",serif;text-transform:uppercase;letter-spacing:.26em;
      font-size:12px;font-weight:600;color:var(--accent)}
    .rule{border:0;border-top:1px solid var(--ink);margin:0}
    .hair{border:0;border-top:1px solid var(--hair);margin:0}
    .thin{border:0;border-top:1px solid var(--hair-2);margin:0}
    h1,h2,h3,h4{font-family:"Playfair Display",Georgia,serif;font-weight:700;letter-spacing:-.01em}

    /* Masthead */
    .mast{border-bottom:3px double var(--ink);position:sticky;top:0;z-index:800;
      background:var(--paper);backdrop-filter:blur(2px)}
    .mast .row{display:flex;align-items:center;justify-content:space-between;height:64px}
    .logo{font-family:"Playfair Display",serif;font-weight:900;font-size:24px;letter-spacing:.01em;
      text-decoration:none}
    .logo i{color:var(--accent);font-style:italic}
    .mast nav{display:flex;gap:26px}
    .mast nav a{font-family:"Source Serif 4",serif;text-transform:uppercase;letter-spacing:.16em;
      font-size:11.5px;font-weight:600;text-decoration:none;color:var(--grey);padding-bottom:2px;
      border-bottom:1px solid transparent;transition:.2s}
    .mast nav a:hover{color:var(--accent);border-color:var(--accent)}
    @media(max-width:860px){.mast nav{display:none}}

    /* Hero */
    .hero{padding:56px 0 40px}
    .issue-line{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;
      gap:10px;padding-bottom:20px;border-bottom:1px solid var(--hair)}
    .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;
      padding-top:40px}
    .hero-head h1{font-size:clamp(44px,7.4vw,92px);line-height:.98;margin:14px 0 0}
    .hero-head .deck{font-family:"Playfair Display",serif;font-style:italic;font-weight:400;
      font-size:clamp(21px,3vw,30px);color:var(--grey);margin:22px 0 0;line-height:1.35;max-width:24ch}
    .hero-head .role{margin-top:22px;font-size:16px;color:var(--grey)}
    .hero-head .role b{color:var(--ink);font-weight:600}
    .hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}
    .btn{display:inline-flex;align-items:center;gap:9px;font-family:"Source Serif 4",serif;
      text-decoration:none;font-weight:600;font-size:14px;letter-spacing:.04em;
      text-transform:uppercase;padding:13px 22px;border:1px solid var(--ink);transition:.2s}
    .btn.solid{background:var(--accent);color:var(--paper);border-color:var(--accent)}
    .btn.solid:hover{background:transparent;color:var(--accent)}
    .btn.ghost:hover{background:var(--ink);color:var(--paper)}
    figure.portrait{margin:0}
    figure.portrait img{width:100%;aspect-ratio:4/5;object-fit:cover;
      filter:sepia(.16) contrast(1.03);border:1px solid var(--hair)}
    figure.portrait figcaption{font-family:"Source Serif 4",serif;font-style:italic;font-size:13px;
      color:var(--grey);margin-top:10px;padding-left:14px;border-left:2px solid var(--accent)}
    @media(max-width:820px){.hero-grid{grid-template-columns:1fr;gap:30px}
      figure.portrait{order:-1;max-width:360px}}

    /* Section frame */
    section{padding:60px 0}
    .sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:30px;
      border-bottom:1px solid var(--ink);padding-bottom:12px}
    .sec-head .n{font-family:"Playfair Display",serif;font-style:italic;color:var(--accent);
      font-size:19px}
    .sec-head h2{font-size:clamp(26px,4vw,40px);margin:0;flex:1}
    .sec-head .kicker{margin-left:auto}

    /* About — multi column running text with drop cap */
    .columns{column-count:2;column-gap:44px;column-rule:1px solid var(--hair-2)}
    .columns p{margin:0 0 18px;text-align:justify;hyphens:auto}
    .dropcap::first-letter{font-family:"Playfair Display",serif;float:left;font-size:4.6em;
      line-height:.72;padding:6px 12px 0 0;color:var(--accent);font-weight:900}
    .about-meta{margin-top:24px;font-style:italic;color:var(--grey);font-family:"Playfair Display",serif}
    @media(max-width:700px){.columns{column-count:1}}

    .pullquote{font-family:"Playfair Display",serif;font-style:italic;font-weight:600;
      font-size:clamp(22px,3.2vw,32px);line-height:1.3;text-align:center;color:var(--ink);
      max-width:24ch;margin:44px auto;padding:26px 0;border-top:1px solid var(--ink);
      border-bottom:1px solid var(--ink)}
    .pullquote span{color:var(--accent)}

    /* Education / Experience ledger rows */
    .ledger{display:grid;gap:0}
    .lrow{display:grid;grid-template-columns:180px 1fr;gap:26px;padding:22px 0;
      border-top:1px solid var(--hair)}
    .lrow:first-child{border-top:0}
    .lrow .when{font-family:"Source Serif 4",serif;font-variant-numeric:tabular-nums;
      color:var(--accent);font-weight:600;font-size:15px;letter-spacing:.02em}
    .lrow h3{margin:0 0 5px;font-size:22px}
    .lrow .sub{color:var(--grey);font-size:16px;font-style:italic}
    .lrow .body{margin-top:10px;color:var(--ink)}
    .lrow ul{margin:10px 0 0;padding-left:20px;color:var(--grey);line-height:1.65}
    .lrow ul li{margin-bottom:5px}
    @media(max-width:640px){.lrow{grid-template-columns:1fr;gap:6px}}

    /* Skills — inline serif catalogue */
    .skills-cat{columns:2;column-gap:44px}
    .skills-cat .sk{break-inside:avoid;padding:12px 0;border-top:1px solid var(--hair-2);
      display:flex;gap:12px;align-items:baseline;font-size:17px}
    .skills-cat .sk .dot{color:var(--accent);font-family:"Playfair Display",serif;font-style:italic}
    .tagline{margin-top:26px;font-size:14px;color:var(--grey);line-height:2;
      display:flex;flex-wrap:wrap;align-items:baseline;max-width:100%}
    .tagline .tg{white-space:nowrap}
    .tagline .tg::after{content:"·";margin:0 10px;color:var(--accent)}
    .tagline .tg:last-child::after{content:""}
    @media(max-width:560px){.skills-cat{columns:1}}

    /* Courses — editorial feature grid */
    .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
    .course{padding:24px;border-right:1px solid var(--hair-2);border-top:1px solid var(--hair)}
    .course:nth-child(3n){border-right:0}
    .course .ci{color:var(--accent);font-size:22px;margin-bottom:14px}
    .course h4{margin:0 0 10px;font-size:20px;line-height:1.2}
    .course p{margin:0;color:var(--grey);font-size:15px;line-height:1.6}
    @media(max-width:860px){.courses{grid-template-columns:1fr 1fr}.course:nth-child(3n){border-right:1px solid var(--hair-2)}.course:nth-child(2n){border-right:0}}
    @media(max-width:560px){.courses{grid-template-columns:1fr}.course{border-right:0!important}}

    /* Experience uses columns for the summary */
    .exp-summary{column-count:2;column-gap:44px;margin:14px 0 0;color:var(--grey)}
    @media(max-width:700px){.exp-summary{column-count:1}}

    /* Cards — editorial */
    .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px}
    .filters button{background:transparent;border:1px solid var(--ink);color:var(--ink);
      font-family:"Source Serif 4",serif;font-size:12px;font-weight:600;letter-spacing:.1em;
      text-transform:uppercase;padding:8px 15px;cursor:pointer;transition:.2s;border-radius:999px}
    .filters button:hover,.filters button.active{background:var(--accent);border-color:var(--accent);color:var(--paper)}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:34px}
    .card{text-decoration:none;color:inherit;display:flex;flex-direction:column;
      border-top:2px solid var(--ink);padding-top:16px;transition:.2s}
    .card:hover{border-color:var(--accent)}
    .card:hover h4{color:var(--accent)}
    .card .cover{aspect-ratio:16/10;overflow:hidden;margin-bottom:14px;background:var(--paper-2);
      border:1px solid var(--hair)}
    .card .cover img{width:100%;height:100%;object-fit:cover;filter:sepia(.12) contrast(1.02);
      transition:transform .5s ease}
    .card:hover .cover img{transform:scale(1.04)}
    .card .ctag{display:flex;justify-content:space-between;font-family:"Source Serif 4",serif;
      font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);
      margin-bottom:8px}
    .card h4{margin:0 0 8px;font-size:21px;line-height:1.22;transition:color .2s}
    .card p{margin:0;color:var(--grey);font-size:15px;line-height:1.55;flex:1}
    .card .more{margin-top:12px;font-family:"Source Serif 4",serif;font-style:italic;
      font-size:14px;color:var(--ink)}
    .card .more::after{content:" →";color:var(--accent)}
    @media(max-width:860px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.cards{grid-template-columns:1fr}}

    /* Certificates */
    .certs{display:grid;grid-template-columns:1fr 1fr;gap:34px}
    .cert{display:grid;grid-template-columns:130px 1fr;gap:20px;border-top:1px solid var(--hair);
      padding-top:20px}
    .cert img{width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--hair);
      filter:sepia(.12)}
    .cert .meta{display:flex;justify-content:space-between;font-family:"Source Serif 4",serif;
      font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
    .cert h4{margin:8px 0 8px;font-size:20px;line-height:1.25}
    .cert p{margin:0;color:var(--grey);font-size:14.5px;line-height:1.55}
    @media(max-width:820px){.certs{grid-template-columns:1fr}}
    @media(max-width:420px){.cert{grid-template-columns:90px 1fr}}

    /* Contact */
    .contact-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:48px}
    .contact-info .lead{font-family:"Playfair Display",serif;font-style:italic;font-size:22px;
      line-height:1.4;margin:0 0 24px}
    .contact-info a{display:flex;justify-content:space-between;text-decoration:none;
      padding:14px 0;border-top:1px solid var(--hair)}
    .contact-info a span:first-child{font-family:"Source Serif 4",serif;text-transform:uppercase;
      letter-spacing:.14em;font-size:12px;font-weight:600;color:var(--grey)}
    .contact-info a span:last-child{color:var(--accent);font-weight:600}
    .contact-info a:hover span:last-child{text-decoration:underline}
    form label{display:block;font-family:"Source Serif 4",serif;text-transform:uppercase;
      letter-spacing:.14em;font-size:11px;font-weight:600;color:var(--grey);margin:0 0 6px}
    form input,form textarea{width:100%;background:transparent;border:0;border-bottom:1px solid var(--ink);
      font-family:"Source Serif 4",serif;font-size:17px;padding:10px 2px;margin-bottom:22px;
      color:var(--ink)}
    form input:focus,form textarea:focus{outline:none;border-color:var(--accent)}
    form textarea{min-height:110px;resize:vertical}
    form button{background:var(--ink);color:var(--paper);border:1px solid var(--ink);
      font-family:"Source Serif 4",serif;font-weight:600;text-transform:uppercase;letter-spacing:.1em;
      padding:14px 30px;cursor:pointer;transition:.2s;font-size:14px}
    form button:hover{background:var(--accent);border-color:var(--accent)}
    #cf-status{margin-top:14px;font-style:italic;font-size:15px}
    @media(max-width:760px){.contact-grid{grid-template-columns:1fr;gap:30px}}

    footer{border-top:3px double var(--ink);padding:40px 0 56px;margin-top:20px}
    footer .frow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:baseline}
    footer .flinks{display:flex;gap:22px;flex-wrap:wrap}
    footer a{text-decoration:none;color:var(--grey);font-family:"Source Serif 4",serif;
      font-size:13px;letter-spacing:.04em}
    footer a:hover{color:var(--accent)}
    .muted{color:var(--grey);font-size:13px;font-style:italic}
    .load-note{color:var(--grey);font-style:italic;grid-column:1/-1;padding:20px 0}

    :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <header class="mast">
    <div class="wrap row">
      <a class="logo" href="#top">Cai<i>Jiechao</i></a>
      <nav id="nav"></nav>
    </div>
  </header>

  <div id="top"></div>
  <div class="wrap">
    <section class="hero">
      <div class="issue-line">
        <span class="kicker" id="issue-left"></span>
        <span class="kicker" id="issue-right"></span>
      </div>
      <div class="hero-grid">
        <div class="hero-head">
          <span class="kicker" id="greet"></span>
          <h1 id="name"></h1>
          <p class="deck" id="headline"></p>
          <p class="role" id="role"></p>
          <div class="hero-actions">
            <a class="btn solid" id="cvBtn" href="#" download></a>
            <a class="btn ghost" id="ghBtn" target="_blank" rel="noopener"></a>
          </div>
        </div>
        <figure class="portrait">
          <img id="portrait" alt="" />
          <figcaption id="portrait-cap"></figcaption>
        </figure>
      </div>
    </section>
  </div>

  <div class="wrap">
    <section id="about">
      <div class="sec-head"><span class="n">I.</span><h2 id="l-about"></h2><span class="kicker" id="k-about"></span></div>
      <div class="columns" id="about-text"></div>
      <p class="about-meta" id="about-meta"></p>
      <blockquote class="pullquote" id="pullquote"></blockquote>
    </section>

    <section id="education">
      <div class="sec-head"><span class="n">II.</span><h2 id="l-edu"></h2></div>
      <div class="ledger" id="edu-list"></div>
    </section>

    <section id="skills">
      <div class="sec-head"><span class="n">III.</span><h2 id="l-skills"></h2></div>
      <div class="skills-cat" id="skills-list"></div>
      <div class="tagline" id="skill-tags"></div>
    </section>

    <section id="courses">
      <div class="sec-head"><span class="n">IV.</span><h2 id="l-courses"></h2></div>
      <div class="courses" id="courses-list"></div>
    </section>

    <section id="experience">
      <div class="sec-head"><span class="n">V.</span><h2 id="l-exp"></h2></div>
      <div class="ledger" id="exp-list"></div>
    </section>

    <section id="projects">
      <div class="sec-head"><span class="n">VI.</span><h2 id="l-projects"></h2></div>
      <div class="cards" id="projects-list"><div class="load-note" id="proj-load"></div></div>
    </section>

    <section id="articles">
      <div class="sec-head"><span class="n">VII.</span><h2 id="l-articles"></h2></div>
      <div class="filters" id="filters"></div>
      <div class="cards" id="articles-list"><div class="load-note" id="art-load"></div></div>
    </section>

    <section id="certificates">
      <div class="sec-head"><span class="n">VIII.</span><h2 id="l-certs"></h2></div>
      <div class="certs" id="certs-list"></div>
    </section>

    <section id="contact">
      <div class="sec-head"><span class="n">IX.</span><h2 id="l-contact"></h2></div>
      <div class="contact-grid">
        <div class="contact-info" id="contact-info"></div>
        <form id="cf">
          <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none">
          <label for="cf-name" id="lb-name"></label>
          <input type="text" name="name" id="cf-name" required>
          <label for="cf-email" id="lb-email"></label>
          <input type="email" name="email" id="cf-email" required>
          <label for="cf-msg" id="lb-msg"></label>
          <textarea name="message" id="cf-msg" required></textarea>
          <button type="submit" id="cf-send"></button>
          <p id="cf-status"></p>
        </form>
      </div>
    </section>
  </div>

  <footer>
    <div class="wrap">
      <div class="frow">
        <a class="logo" href="#top" style="font-size:20px">Cai<i>Jiechao</i></a>
        <div class="flinks" id="foot-social"></div>
      </div>
      <div class="frow" style="margin-top:20px">
        <span class="muted" id="foot-desc"></span>
        <a class="muted" id="foot-icp" target="_blank"></a>
      </div>
    </div>
  </footer>

  <script>window.THEME_ID = "05-editorial";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    const P = CJCData.profile, t = CJCData.t.bind(CJCData), esc = CJCData.escapeHtml;
    let articles = [], projects = [], filterKey = "all";

    function renderStatic(){
      const lang = CJCData.lang();
      document.title = (lang==="zh"?"蔡杰超":"Cai Jiechao") + " — Editorial";
      // nav
      document.getElementById('nav').innerHTML = [
        ['about','nav_about'],['courses','nav_courses'],['experience','nav_internship'],
        ['projects','nav_portfolio'],['articles','nav_article'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');
      // issue line — editorial masthead flavor
      document.getElementById('issue-left').textContent =
        (lang==="zh"?"人物专栏 · 第一期":"The Profile · Issue Nº 1");
      document.getElementById('issue-right').textContent =
        (lang==="zh"?"广州 · 2026":"Guangzhou · MMXXVI");
      // hero
      document.getElementById('greet').textContent = t(P.greeting);
      document.getElementById('name').textContent = t(P.name);
      document.getElementById('headline').textContent = "“" + t(P.headline) + "”";
      document.getElementById('role').innerHTML =
        `<b>${esc(t(P.role))}</b> — ${esc(t(P.title))}`;
      const cv = document.getElementById('cvBtn');
      cv.textContent = t(P.ui.download_cv); cv.href = t(P.cv);
      const gh = document.getElementById('ghBtn');
      gh.textContent = "GitHub ↗"; gh.href = P.contact.github;
      document.getElementById('portrait').src = P.avatar;
      document.getElementById('portrait').alt = t(P.name);
      document.getElementById('portrait-cap').textContent =
        (lang==="zh"?"蔡杰超，摄于工作室。":"Cai Jiechao, photographed in studio.");
      // labels
      document.getElementById('l-about').textContent = t(P.ui.about_me);
      document.getElementById('k-about').textContent = t(P.ui.about_desc);
      document.getElementById('l-edu').textContent = t(P.ui.education_bg);
      document.getElementById('l-skills').textContent = t(P.ui.core_tech);
      document.getElementById('l-courses').textContent = t(P.ui.core_courses);
      document.getElementById('l-exp').textContent = t(P.ui.internship_exp);
      document.getElementById('l-projects').textContent = t(P.ui.latest_projects);
      document.getElementById('l-articles').textContent = t(P.ui.latest_articles);
      document.getElementById('l-certs').textContent = t(P.ui.certificates);
      document.getElementById('l-contact').textContent = t(P.ui.get_in_touch);
      // about — multi-column with drop cap on first paragraph
      document.getElementById('about-text').innerHTML =
        P.bio.map((b,i)=>`<p${i===0?' class="dropcap"':''}>${esc(t(b))}</p>`).join('');
      document.getElementById('about-meta').textContent = "— " + t(P.location);
      // pull-quote drawn from headline
      document.getElementById('pullquote').innerHTML =
        (lang==="zh"
          ? `“探索大模型的<span>能力边界</span>，构建实用而优雅的产品。”`
          : `“Exploring the <span>boundaries</span> of large models, one elegant product at a time.”`);
      // education
      document.getElementById('edu-list').innerHTML = P.education.map(e=>`
        <div class="lrow"><div class="when">${esc(e.period)}</div>
          <div><h3>${esc(t(e.school))}</h3>
          <div class="sub">${esc(t(e.degree))}</div>
          <div class="body">${esc(t(e.note))}</div></div></div>`).join('');
      // skills
      document.getElementById('skills-list').innerHTML = P.skills.map(s=>
        `<div class="sk"><span class="dot">§</span><span>${esc(s)}</span></div>`).join('');
      document.getElementById('skill-tags').innerHTML =
        P.skillTags.map(tg=>`<span class="tg">${esc(tg)}</span>`).join('');
      // courses
      document.getElementById('courses-list').innerHTML = P.courses.map(c=>`
        <div class="course"><div class="ci"><i class="fa ${esc(c.icon)}"></i></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');
      // experience
      document.getElementById('exp-list').innerHTML = P.experience.map(x=>`
        <div class="lrow"><div class="when">${esc(x.period)}</div>
          <div><h3>${esc(t(x.role))}, ${esc(t(x.company))}</h3>
          <div class="exp-summary">${esc(t(x.summary))}</div>
          <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div></div>`).join('');
      // certificates
      document.getElementById('certs-list').innerHTML = P.certificates.map(c=>`
        <div class="cert"><img src="${esc(c.image)}" alt="${esc(t(c.title))}">
        <div><div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');
      // contact
      document.getElementById('contact-info').innerHTML =
        `<p class="lead">${esc(t(P.ui.msg_box_title))}</p>` +
        [['Email', P.contact.email, 'mailto:'+P.contact.email],
         ['Phone', P.contact.phone, P.contact.phoneHref],
         ['GitHub', '@'+P.contact.githubUser, P.contact.github],
         ['WeChat', 'QR ↗', P.contact.wechatQrPage]
        ].map(([k,v,h])=>`<a href="${esc(h)}"><span>${esc(k)}</span><span>${esc(v)}</span></a>`).join('');
      document.getElementById('lb-name').textContent = t(P.ui.name_placeholder);
      document.getElementById('lb-email').textContent = t(P.ui.email_placeholder);
      document.getElementById('lb-msg').textContent = t(P.ui.msg_placeholder);
      document.getElementById('cf-send').textContent = t(P.ui.send);
      // footer
      document.getElementById('foot-social').innerHTML =
        `<a href="${P.contact.github}" target="_blank" rel="noopener">GitHub</a>
         <a href="mailto:${P.contact.email}">Email</a>
         <a href="${P.contact.wechatQrPage}">WeChat</a>
         <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      document.getElementById('foot-desc').textContent = t(P.ui.footer_desc);
      const icp = document.getElementById('foot-icp'); icp.textContent = P.icp; icp.href = P.icpUrl;
      // filters
      document.getElementById('filters').innerHTML = P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box = document.getElementById('projects-list');
      if(!projects.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML = projects.map(p=>`
        <a class="card" href="${esc(p.href)}">
          <div class="ctag"><span>${esc(p.tech_stack||t(P.ui.tech_stack))}</span><span>${esc(p.dateText())}</span></div>
          <h4>${esc(p.localTitle())}</h4>
          <p>${esc(p.localSummary()||'')}</p>
          <span class="more">${esc(t(P.ui.view_project))}</span></a>`).join('');
    }

    function renderArticles(){
      const box = document.getElementById('articles-list');
      const list = CJCData.filterArticles(articles, filterKey);
      if(!list.length){ box.innerHTML = `<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML = list.map(a=>`
        <a class="card" href="${esc(a.href)}">
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
          <div class="ctag"><span>${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
          <h4>${esc(a.localTitle())}</h4>
          <p>${esc(a.localSummary()||'')}</p>
          <span class="more">${esc(t(P.ui.read_more))}</span></a>`).join('');
    }

    async function loadDynamic(){
      try{ projects = await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ document.getElementById('projects-list').innerHTML = `<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles = await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ document.getElementById('articles-list').innerHTML = `<div class="load-note">⚠ Failed to load articles.</div>`; }
    }

    document.getElementById('cf').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target, s = document.getElementById('cf-status');
      const payload = { name:f.name.value, email:f.email.value, message:f.message.value, website:f.website.value };
      s.style.color='var(--grey)'; s.textContent = t(P.ui.sending);
      try{ const r = await CJCData.sendContact(payload); s.style.color='#2f7d4f'; s.textContent = r.message||'Sent.'; f.reset(); }
      catch(err){ s.style.color='var(--accent)'; s.textContent = err.message; }
    });

    const fa = document.createElement('link');
    fa.rel='stylesheet'; fa.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css';
    document.head.appendChild(fa);

    document.addEventListener('DOMContentLoaded', ()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({ accent:'#b8433a' });
      CJCData.onLang(()=>{ renderStatic(); renderProjects(); renderArticles(); });
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

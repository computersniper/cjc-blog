<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Article - Cai Jiechao</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f5f1e6;--ink:#111;--yellow:#fde000;--cobalt:#2d5bff;--pink:#ff5da2;--white:#fff;--shadow:6px 6px 0 #000}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Space Mono',monospace;line-height:1.55;overflow-x:hidden}h1,h2,h3{font-family:'Archivo Black',sans-serif;font-weight:400}a{color:inherit}.wrap{max-width:1100px;margin:auto;padding:0 20px}
    .nav{position:sticky;top:0;z-index:20;background:var(--yellow);border-bottom:4px solid #000}.nav .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 0}.brand{font-family:'Archivo Black';font-size:22px;text-decoration:none;background:#000;color:var(--yellow);padding:6px 12px;border:3px solid #000;box-shadow:4px 4px 0 var(--pink)}.navlinks{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}.navlinks a,.lang{font:700 12px 'Space Mono';text-transform:uppercase;text-decoration:none;background:#fff;border:3px solid #000;padding:8px 10px;min-height:44px;display:inline-flex;align-items:center;box-shadow:3px 3px 0 #000;cursor:pointer}.navlinks a:hover,.lang:hover{background:var(--cobalt);color:#fff;transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
    main{padding:52px 0 84px}.crumb{display:inline-block;background:var(--pink);border:3px solid #000;padding:6px 10px;box-shadow:var(--shadow);font-weight:700;text-transform:uppercase}.cjc-d-loading,.cjc-d-error{padding:70px 0;font-weight:700}.cjc-d-meta{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 12px;font-size:12px;font-weight:700;text-transform:uppercase}.cjc-d-meta span{background:#fff;border:3px solid #000;padding:4px 8px}.cjc-d-meta .cjc-d-cat{background:var(--cobalt);color:#fff}.cjc-d-title{font-size:clamp(34px,8vw,78px);line-height:.96;text-transform:uppercase;max-width:17ch;margin:0 0 28px}.cjc-d-cover{border:4px solid #000;box-shadow:var(--shadow);margin-bottom:34px;overflow:hidden;background:var(--yellow)}.cjc-d-cover img{display:block;width:100%;max-height:470px;object-fit:cover;loading:lazy}.cjc-d-body{background:#fff;border:4px solid #000;box-shadow:var(--shadow);padding:32px 36px;font-size:16px;line-height:1.75;overflow-wrap:anywhere}.cjc-d-body img{max-width:100%;height:auto}.cjc-d-body pre{max-width:100%;overflow:auto;background:#111;color:#fff;padding:12px}.cjc-d-body a,.cjc-d-readfull{color:var(--cobalt)}.cjc-d-summary{font-size:19px;max-width:65ch;margin-bottom:24px}.cjc-d-readfull{display:inline-flex;align-items:center;min-height:44px;background:var(--pink);border:3px solid #000;color:#000;text-decoration:none;padding:10px 16px;font-weight:700;box-shadow:4px 4px 0 #000}.cjc-d-nav{margin-top:48px;padding-top:20px;border-top:4px solid #000}.cjc-d-back{display:inline-flex;align-items:center;min-height:44px;background:var(--yellow);border:3px solid #000;padding:8px 14px;font-weight:700;text-transform:uppercase;text-decoration:none;box-shadow:4px 4px 0 #000}.cjc-d-back:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
    footer{background:#111;color:var(--yellow);padding:30px 0}footer a{color:var(--yellow)}@media(max-width:760px){.navlinks{display:none}.cjc-d-body{padding:22px 18px}.cjc-d-title{font-size:clamp(34px,13vw,60px)}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
  </style>
</head>
<body>
  <div class="nav"><div class="wrap row"><a class="brand" href="./">CJC</a><nav class="navlinks" aria-label="Primary"><a href="./#about">About</a><a href="./#courses">Courses</a><a href="./#projects">Projects</a><a href="./#articles">Articles</a><a href="./#certificates">Certificates</a><a href="./#experience">Experience</a><a href="./#contact">Contact</a></nav><button class="lang" id="langBtn" type="button">中文</button></div></div>
  <main><div class="wrap"><span class="crumb">Article / Detail</span><div id="detail"></div></div></main>
  <footer><div class="wrap"><a href="./">Cai Jiechao</a> · <a href="/themes.html">Theme Gallery</a></div></footer>
  <script>window.THEME_ID='02-brutalist';</script><script src="/shared/profile.js"></script><script src="/shared/site-data.js"></script><script src="/shared/detail.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded',function(){CJCData.setTheme(window.THEME_ID);var b=document.getElementById('langBtn');b.textContent=CJCData.lang()==='en'?'中文':'EN';b.addEventListener('click',CJCData.toggleLang);CJCData.onLang(function(l){b.textContent=l==='en'?'中文':'EN'});CJCData.mountDetail({kind:'article',mount:'#detail',accent:'#fde000',backHref:'./#articles'});});
  </script>
</body>
</html>

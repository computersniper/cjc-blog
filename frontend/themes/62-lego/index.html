<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cai Jiechao — Brick Build</title>
  <meta name="description" content="A build-it LEGO world that assembles itself, brick by brick. Smash it and rebuild. Portfolio of Cai Jiechao." />
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <script>
    // enable build animation only when motion is allowed
    (function(){ try{ if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){ document.documentElement.className+=' anim'; } }catch(e){} })();
  </script>
  <style>
    :root{ --red:#e3000b; --yellow:#f5c518; --blue:#0a6fdc; --green:#2aa63c; --gold:#e6b422;
      --ink:#20242b; --mut:#5c6570; --plate:#d9dde2; --plate2:#c7ccd3; --line:rgba(0,0,0,.12); --white:#fff; }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;line-height:1.6;overflow-x:hidden;
      background-color:var(--plate);
      background-image:
        radial-gradient(circle at 15px 15px, rgba(255,255,255,.55) 0 6px, transparent 7px),
        radial-gradient(circle at 15px 15px, rgba(0,0,0,.06) 6px 9px, transparent 10px);
      background-size:42px 42px,42px 42px;background-attachment:fixed}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    h1,h2,h3,h4,.disp{font-family:'Poppins',sans-serif;font-weight:800}
    ::selection{background:var(--yellow);color:#4a3c00}
    :focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
    .wrap{max-width:1080px;margin:0 auto;padding:0 22px;position:relative;z-index:2}

    /* ---- build / assemble system ---- */
    .anim .build{opacity:0;transform:translateY(-52px) scale(.96)}
    .anim .build.set{opacity:1;transform:none;transition:transform .6s cubic-bezier(.34,1.7,.5,1),opacity .42s ease}
    .anim #name .bl{opacity:0;transform:translateY(-70px) rotate(-10deg)}
    .anim #name .bl.set{opacity:1;transform:none;transition:transform .5s cubic-bezier(.34,1.8,.5,1),opacity .3s ease}

    /* generic stud row on top of a brick surface */
    .studrow{position:absolute;left:16px;top:-13px;height:15px;width:calc(100% - 32px);pointer-events:none;
      background:
        radial-gradient(ellipse 9px 5px at 16px 3px,rgba(255,255,255,.55),transparent 70%),
        radial-gradient(circle at 16px 9px,var(--sc,#fff) 0 8px,transparent 9px);
      background-size:32px 15px,32px 15px;background-repeat:repeat-x}

    .topbar{position:sticky;top:0;z-index:30;background:var(--red);color:#fff;
      box-shadow:inset 0 -6px 0 rgba(0,0,0,.22),0 5px 0 rgba(0,0,0,.2)}
    .topbar .row{display:flex;align-items:center;justify-content:space-between;height:58px}
    .brand{font-family:'Poppins';font-weight:800;font-size:21px;color:#fff}
    .brand b{color:var(--yellow)}
    .nav{display:flex;gap:14px}
    .nav a{font-weight:600;font-size:14px;color:rgba(255,255,255,.85);padding:5px 8px;border-radius:5px}
    .nav a:hover{color:var(--red);background:var(--yellow)}
    @media(max-width:960px){.nav{display:none}}
    @media(min-width:1041px){.topbar .row{padding-right:200px}}

    section{padding:50px 0}
    .panel{background:var(--white);border-radius:12px;padding:28px;position:relative;--sc:#fff;
      box-shadow:inset 0 -9px 0 rgba(0,0,0,.07),0 9px 0 rgba(0,0,0,.13),0 18px 30px rgba(0,0,0,.15)}
    .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:22px}
    .chip{color:#fff;font-family:'Poppins';font-weight:800;font-size:13px;padding:7px 12px;border-radius:6px;background:var(--blue);
      box-shadow:inset 0 -4px 0 rgba(0,0,0,.22)}
    .sec-head h2{font-size:clamp(23px,4.2vw,38px);margin:0}

    /* hero */
    .hero{padding:40px 0 22px}
    .greet{display:inline-flex;align-items:center;gap:8px;background:var(--yellow);color:#5b4a00;font-weight:700;padding:7px 15px;border-radius:6px;
      box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);position:relative}
    #name{font-family:'Poppins';font-weight:800;font-size:clamp(34px,8.5vw,84px);line-height:1;margin:16px 0 10px;display:flex;flex-wrap:wrap;align-items:flex-end}
    #name .bl{display:inline-flex;align-items:center;justify-content:center;color:#fff;padding:.06em .16em .12em;margin:0 4px 8px 0;
      border-radius:9px;position:relative;line-height:1;
      box-shadow:inset 0 -9px 0 rgba(0,0,0,.22),inset 0 4px 0 rgba(255,255,255,.32),0 7px 0 rgba(0,0,0,.2),0 12px 18px rgba(0,0,0,.14)}
    #name .bl::before{content:"";position:absolute;left:50%;transform:translateX(-50%);top:-9px;width:60%;height:12px;border-radius:50%;
      background:radial-gradient(ellipse at 50% 60%,rgba(255,255,255,.45),transparent 70%),var(--bc,#e3000b);box-shadow:0 -2px 0 rgba(0,0,0,.12)}
    #name .sp{width:.32em}
    .hero .role{font-weight:700;font-size:clamp(18px,2.6vw,26px);color:var(--blue)}
    .hero .tag{color:var(--mut);max-width:46ch;margin:12px 0 22px;font-size:17px}
    .btns{display:flex;flex-wrap:wrap;gap:14px}
    .btn{display:inline-flex;align-items:center;gap:8px;font-family:'Poppins';font-weight:700;font-size:15px;
      padding:13px 22px;border-radius:9px;cursor:pointer;transition:transform .1s;color:#fff;border:none}
    .btn.pri{background:var(--green);box-shadow:inset 0 -6px 0 rgba(0,0,0,.24),0 5px 0 rgba(0,0,0,.2)}
    .btn.gho{background:var(--blue);box-shadow:inset 0 -6px 0 rgba(0,0,0,.24),0 5px 0 rgba(0,0,0,.2)}
    .btn.smash{background:var(--red);box-shadow:inset 0 -6px 0 rgba(0,0,0,.24),0 5px 0 rgba(0,0,0,.2)}
    .btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(4px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.24),0 1px 0 rgba(0,0,0,.2)}

    /* about */
    .about{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:start}
    @media(max-width:740px){.about{grid-template-columns:1fr}}
    .about .pic{border-radius:10px;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.14),0 16px 26px rgba(0,0,0,.16);border:7px solid var(--yellow)}
    .about .pic img{width:100%;aspect-ratio:1;object-fit:cover}
    .about p{margin:0 0 12px;font-size:16.5px;max-width:60ch}
    .loc{display:inline-flex;gap:8px;align-items:center;background:var(--green);color:#fff;border-radius:6px;padding:8px 15px;
      font-weight:700;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}

    .rows{display:flex;flex-direction:column;gap:20px}
    .rowi{padding:18px 20px;border-radius:9px;color:#fff;position:relative;transition:transform .14s}
    .rowi:hover{transform:translateY(-3px)}
    .rowi:nth-child(odd){background:var(--blue);--sc:var(--blue)}
    .rowi:nth-child(even){background:var(--green);--sc:var(--green)}
    .rowi{box-shadow:inset 0 -8px 0 rgba(0,0,0,.2),0 7px 0 rgba(0,0,0,.16)}
    .rowi .p{font-weight:700;color:var(--yellow)}
    .rowi h3{font-family:'Poppins';margin:2px 0 4px;font-size:19px}
    .rowi .s{color:rgba(255,255,255,.92)}
    .rowi ul{margin:8px 0 0;padding-left:18px;color:rgba(255,255,255,.94);line-height:1.7}

    .skills{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    @media(max-width:760px){.skills{grid-template-columns:1fr 1fr}}
    @media(max-width:460px){.skills{grid-template-columns:1fr}}
    .sk{padding:16px;border-radius:9px;color:#fff;font-weight:600;transition:transform .14s;position:relative}
    .sk:hover{transform:translateY(-5px) rotate(-1deg)}
    .sk .n{font-family:'Poppins';font-weight:800;font-size:12px;opacity:.9;letter-spacing:.04em}
    .sk .v{margin-top:4px;font-size:15px}
    .tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
    .tags span{font-weight:600;font-size:13px;padding:8px 14px;border-radius:6px;background:#fff;color:var(--ink);transition:transform .12s;
      box-shadow:inset 0 -4px 0 rgba(0,0,0,.1),0 3px 0 rgba(0,0,0,.12)}
    .tags span:hover{transform:translateY(-3px)}

    .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    @media(max-width:820px){.courses{grid-template-columns:1fr 1fr}}
    @media(max-width:500px){.courses{grid-template-columns:1fr}}
    .course{padding:20px;border-radius:11px;background:#fff;transition:transform .14s;position:relative;--sc:#fff;
      box-shadow:inset 0 -8px 0 rgba(0,0,0,.06),0 9px 0 rgba(0,0,0,.1),0 16px 24px rgba(0,0,0,.12)}
    .course:hover{transform:translateY(-6px)}
    .course .ic{width:52px;height:52px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:23px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.22)}
    .course:nth-child(4n+1) .ic{background:var(--red)}.course:nth-child(4n+2) .ic{background:var(--blue)}
    .course:nth-child(4n+3) .ic{background:var(--yellow);color:#5b4a00}.course:nth-child(4n) .ic{background:var(--green)}
    .course h4{font-family:'Poppins';margin:12px 0 8px;font-size:16px}
    .course p{margin:0;color:var(--mut);font-size:14.5px}

    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    @media(max-width:860px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.cards{grid-template-columns:1fr}}
    .card{border-radius:11px;overflow:hidden;display:flex;flex-direction:column;background:#fff;transition:transform .14s,box-shadow .14s;position:relative;
      box-shadow:inset 0 -8px 0 rgba(0,0,0,.06),0 9px 0 rgba(0,0,0,.13),0 16px 26px rgba(0,0,0,.14)}
    .card:hover{transform:translateY(-8px)}
    .card:hover{box-shadow:inset 0 -8px 0 rgba(0,0,0,.06),0 15px 0 rgba(0,0,0,.13),0 22px 30px rgba(0,0,0,.18)}
    .card .cbar{height:9px}
    .card:nth-child(4n+1) .cbar{background:var(--red)}.card:nth-child(4n+2) .cbar{background:var(--blue)}
    .card:nth-child(4n+3) .cbar{background:var(--yellow)}.card:nth-child(4n) .cbar{background:var(--green)}
    .card .cover{height:150px;overflow:hidden;background:#e6e9ee}
    .card .cover img{width:100%;height:100%;object-fit:cover;transition:.4s}
    .card:hover .cover img{transform:scale(1.07)}
    .cbody{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
    .ctag{display:flex;justify-content:space-between;font-size:11px;color:var(--blue);letter-spacing:.04em;text-transform:uppercase;font-weight:700}
    .card h4{font-family:'Poppins';margin:0;font-size:16px;line-height:1.3;color:var(--ink)}
    .card p{margin:0;color:var(--mut);font-size:14px;flex:1}
    .tech{color:var(--green);font-weight:700;font-size:12.5px}
    .more{color:var(--red);font-weight:700;font-size:13px}

    .filters{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px}
    .filters button{font-family:'Fredoka';font-weight:600;font-size:13px;background:#fff;border:none;color:var(--mut);
      padding:8px 15px;border-radius:6px;cursor:pointer;transition:.14s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.1),0 3px 0 rgba(0,0,0,.12)}
    .filters button.active,.filters button:hover{background:var(--red);color:#fff}

    .certs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    @media(max-width:640px){.certs{grid-template-columns:1fr}}
    .cert{display:grid;grid-template-columns:120px 1fr;border-radius:11px;overflow:hidden;background:#fff;position:relative;
      box-shadow:inset 0 -8px 0 rgba(0,0,0,.06),0 9px 0 rgba(0,0,0,.1)}
    .cert img{width:100%;height:100%;object-fit:cover;min-height:140px}
    .cert .ct{padding:16px}
    .cert .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--blue);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
    .cert h4{font-family:'Poppins';margin:8px 0 6px;font-size:16px}
    .cert p{margin:0;color:var(--mut);font-size:13.5px}
    @media(max-width:400px){.cert{grid-template-columns:88px 1fr}}

    .contact{display:grid;grid-template-columns:1fr 1.2fr;gap:26px}
    @media(max-width:800px){.contact{grid-template-columns:1fr}}
    .cinfo a{display:flex;justify-content:space-between;padding:13px 0;border-bottom:2px solid var(--line);font-weight:600}
    .cinfo a span:last-child{color:var(--red)}
    .cform label{display:block;font-weight:600;color:var(--mut);font-size:13px;margin:0 0 5px}
    .cform input,.cform textarea{width:100%;background:#f1f3f6;border:2px solid transparent;border-radius:9px;color:var(--ink);
      font-family:inherit;font-size:15px;padding:13px 15px;margin-bottom:13px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.06)}
    .cform input:focus,.cform textarea:focus{outline:none;border-color:var(--blue)}
    .cform textarea{min-height:118px;resize:vertical}
    #cf-status{font-weight:700;margin:8px 0 0;font-size:14px;min-height:1.2em}

    footer{padding:36px 0 90px;text-align:center;position:relative}
    .fsoc{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
    .fsoc a{color:var(--mut);font-weight:600;font-size:13px}
    .fsoc a:hover{color:var(--red)}
    .muted{color:#7c8590;font-size:13px;margin-top:12px}
    .muted a{color:var(--red)}
    .load-note{grid-column:1/-1;color:var(--mut);text-align:center;padding:18px;border:2px dashed var(--line);border-radius:10px}

    /* ---- hidden golden brick ---- */
    .goldbrick{position:fixed;right:16px;bottom:14px;z-index:60;width:44px;height:26px;border:none;cursor:pointer;border-radius:5px;
      background:linear-gradient(180deg,#ffe9a8,var(--gold));opacity:.5;transition:opacity .2s,transform .2s;
      box-shadow:inset 0 -5px 0 rgba(120,80,0,.4),inset 0 3px 0 rgba(255,255,255,.5),0 4px 0 rgba(0,0,0,.25)}
    .goldbrick::before{content:"";position:absolute;left:8px;top:-7px;width:10px;height:8px;border-radius:50%;
      background:linear-gradient(180deg,#fff3c8,var(--gold));box-shadow:16px 0 0 #f0c94a}
    .goldbrick:hover{opacity:1;transform:translateY(-3px)}
    @media(max-width:760px){.goldbrick{bottom:10px;right:10px}}

    /* ---- minifig companion (walker) ---- */
    .fig{position:fixed;left:16px;bottom:8px;z-index:65;width:112px;pointer-events:none;transition:left .25s linear}
    .fig .figspeech{pointer-events:auto;position:absolute;bottom:118px;left:6px;min-width:150px;max-width:230px;background:#fff;
      border-radius:10px;padding:10px 13px;font-family:'Fredoka';font-weight:600;color:var(--ink);font-size:13px;line-height:1.4;
      box-shadow:inset 0 -6px 0 rgba(0,0,0,.07),0 6px 0 rgba(0,0,0,.13),0 12px 22px rgba(0,0,0,.16);transition:opacity .3s,transform .3s}
    .fig .figspeech .who{display:block;color:var(--red);font-family:'Poppins';font-weight:800;font-size:11px;margin-bottom:2px}
    .fig .figspeech::after{content:"";position:absolute;left:26px;bottom:-9px;width:16px;height:16px;background:#fff;transform:rotate(45deg);
      box-shadow:4px 4px 6px rgba(0,0,0,.08)}
    .fig .figspeech.hide{opacity:0;transform:translateY(6px);pointer-events:none}
    .figsvg{pointer-events:auto;cursor:pointer;width:112px;display:block;filter:drop-shadow(0 8px 8px rgba(0,0,0,.22))}
    .anim .figsvg{animation:hop 2.8s ease-in-out infinite}
    @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    .figsvg.jump{animation:jump .55s cubic-bezier(.3,1.6,.5,1)}
    @keyframes jump{0%{transform:translateY(0)}40%{transform:translateY(-34px) rotate(-6deg)}100%{transform:translateY(0)}}
    #figArmR{transform-box:fill-box;transform-origin:top center}
    .figsvg.wave #figArmR{animation:wave .5s ease-in-out 3}
    @keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-46deg)}}
    .walking #figLegL{animation:legf .34s linear infinite}
    .walking #figLegR{animation:legb .34s linear infinite}
    @keyframes legf{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
    @keyframes legb{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
    #figLegL,#figLegR{transform-box:fill-box;transform-origin:top center}
    @media(max-width:760px){.fig{width:84px;left:8px}.figsvg{width:84px}.fig .figspeech{bottom:92px;max-width:56vw;font-size:12px}}

    /* achievement toast */
    .toast{position:fixed;left:50%;top:74px;transform:translate(-50%,-16px);z-index:80;background:#fff;border-radius:12px;padding:12px 18px;
      display:flex;align-items:center;gap:12px;opacity:0;pointer-events:none;transition:.3s;
      box-shadow:inset 0 -7px 0 rgba(0,0,0,.08),0 8px 0 rgba(0,0,0,.14),0 16px 30px rgba(0,0,0,.2)}
    .toast.on{opacity:1;transform:translate(-50%,0)}
    .toast .em{font-size:26px}
    .toast .tt{font-family:'Poppins';font-weight:800;color:var(--red);font-size:14px}
    .toast .ts{color:var(--mut);font-size:12px}

    /* confetti bricks layer */
    #confetti{position:fixed;inset:0;z-index:79;pointer-events:none;overflow:hidden}
    .cbk{position:absolute;width:20px;height:12px;border-radius:3px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.4);will-change:transform,opacity}

    /* gold minifig reveal */
    .goldfig{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.4);z-index:82;opacity:0;transition:.4s cubic-bezier(.34,1.7,.5,1);pointer-events:none;width:180px;text-align:center}
    .goldfig.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
    .goldfig .gcap{margin-top:8px;font-family:'Poppins';font-weight:800;color:var(--gold);background:#20242b;display:inline-block;padding:6px 14px;border-radius:8px}

    @media(prefers-reduced-motion:reduce){ html{scroll-behavior:auto} .build{opacity:1!important;transform:none!important} }
  </style>
</head>
<body>
  <div class="topbar"><div class="wrap row">
    <a class="brand" href="#top">Cai<b>Jiechao</b></a>
    <nav class="nav" id="nav"></nav>
  </div></div>

  <div id="top"></div>
  <header class="hero"><div class="wrap">
    <div class="build" data-b>
      <span class="greet" id="greet"></span>
      <h1 id="name" aria-label=""></h1>
      <div class="role" id="role"></div>
      <p class="tag" id="tag"></p>
      <div class="btns">
        <a class="btn pri" id="cvBtn" download><i class="fa fa-download"></i><span></span></a>
        <a class="btn gho" id="ghBtn" target="_blank" rel="noopener"><i class="fa fa-github"></i>GitHub</a>
        <button class="btn smash" id="smashBtn" type="button"><i class="fa fa-bomb"></i><span id="smash-lbl"></span></button>
      </div>
    </div>
  </div></header>

  <section id="about"><div class="wrap"><div class="panel build" data-b><div class="studrow"></div>
    <div class="sec-head"><span class="chip">01</span><h2 id="l-about"></h2></div>
    <div class="about"><div class="pic"><img id="portrait" alt="Cai Jiechao portrait" /></div>
      <div><div id="bio"></div><span class="loc" id="loc"></span></div></div>
  </div></div></section>

  <section id="education"><div class="wrap"><div class="panel build" data-b><div class="studrow"></div>
    <div class="sec-head"><span class="chip">02</span><h2 id="l-edu"></h2></div>
    <div class="rows" id="edu"></div>
  </div></div></section>

  <section id="skills"><div class="wrap"><div class="panel build" data-b><div class="studrow"></div>
    <div class="sec-head"><span class="chip">03</span><h2 id="l-skills"></h2></div>
    <div class="skills" id="skills-box"></div>
    <div class="tags" id="tags"></div>
  </div></div></section>

  <section id="courses"><div class="wrap"><div class="panel build" data-b><div class="studrow"></div>
    <div class="sec-head"><span class="chip">04</span><h2 id="l-courses"></h2></div>
    <div class="courses" id="courses-box"></div>
  </div></div></section>

  <section id="experience"><div class="wrap"><div class="panel build" data-b><div class="studrow"></div>
    <div class="sec-head"><span class="chip">05</span><h2 id="l-exp"></h2></div>
    <div class="rows" id="exp"></div>
  </div></div></section>

  <section id="projects"><div class="wrap"><div class="panel build" data-b><div class="studrow"></div>
    <div class="sec-head"><span class="chip">06</span><h2 id="l-projects"></h2></div>
    <div class="cards" id="projects-box"><div class="load-note" id="proj-load"></div></div>
  </div></div></section>

  <section id="articles"><div class="wrap"><div class="panel build" data-b><div class="studrow"></div>
    <div class="sec-head"><span class="chip">07</span><h2 id="l-articles"></h2></div>
    <div class="filters" id="filters"></div>
    <div class="cards" id="articles-box"><div class="load-note" id="art-load"></div></div>
  </div></div></section>

  <section id="certificates"><div class="wrap"><div class="panel build" data-b><div class="studrow"></div>
    <div class="sec-head"><span class="chip">08</span><h2 id="l-certs"></h2></div>
    <div class="certs" id="certs"></div>
  </div></div></section>

  <section id="contact"><div class="wrap"><div class="panel build" data-b><div class="studrow"></div>
    <div class="sec-head"><span class="chip">09</span><h2 id="l-contact"></h2></div>
    <div class="contact">
      <div class="cinfo" id="cinfo"></div>
      <form class="cform" id="cf" novalidate>
        <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
        <label for="cf-name" id="lb-name"></label>
        <input type="text" name="name" id="cf-name" required autocomplete="name">
        <label for="cf-email" id="lb-email"></label>
        <input type="email" name="email" id="cf-email" required autocomplete="email">
        <label for="cf-msg" id="lb-msg"></label>
        <textarea name="message" id="cf-msg" required></textarea>
        <button type="submit" class="btn pri" id="cf-send"></button>
        <p id="cf-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div></div></section>

  <footer><div class="wrap build" data-b>
    <div class="fsoc" id="fsoc"></div>
    <div class="muted" id="foot-desc"></div>
    <a class="muted" id="foot-icp" target="_blank" rel="noopener" style="display:inline-block"></a>
  </div></footer>

  <!-- hidden golden brick easter egg -->
  <button class="goldbrick" id="goldbrick" aria-label="A hidden golden brick"></button>

  <!-- confetti + gold reveal + toast -->
  <div id="confetti" aria-hidden="true"></div>
  <div class="goldfig" id="goldfig" aria-hidden="true"></div>
  <div class="toast" id="toast"><span class="em" id="toast-em">🧱</span><div><div class="tt" id="toast-tt"></div><div class="ts" id="toast-ts"></div></div></div>

  <!-- minifig companion -->
  <div class="fig" id="fig">
    <div class="figspeech hide" id="figSpeechBox"><span class="who" id="figWho"></span><span id="figSpeech"></span></div>
    <button class="figsvg" id="figSvg" aria-label="Wave to the builder minifig" style="background:none;border:0;padding:0">
      <svg viewBox="0 0 120 150" role="img" aria-label="LEGO builder minifigure">
        <ellipse cx="60" cy="146" rx="34" ry="5" fill="rgba(0,0,0,.16)"/>
        <g id="figLegL"><rect x="40" y="112" width="18" height="32" rx="3" fill="#0a6fdc"/><rect x="40" y="136" width="18" height="8" rx="2" fill="#083f7d"/></g>
        <g id="figLegR"><rect x="62" y="112" width="18" height="32" rx="3" fill="#0a6fdc"/><rect x="62" y="136" width="18" height="8" rx="2" fill="#083f7d"/></g>
        <path d="M38 72 h44 a7 7 0 0 1 7 7 v30 a5 5 0 0 1 -5 5 H36 a5 5 0 0 1 -5 -5 v-30 a7 7 0 0 1 7 -7 Z" fill="#e3000b"/>
        <rect x="46" y="80" width="28" height="4" rx="2" fill="#f5c518" opacity=".85"/>
        <g id="figArmL"><path d="M31 80 q-11 4 -13 27 l11 3 q3 -18 9 -24 Z" fill="#e3000b"/><circle cx="27" cy="112" r="6.5" fill="#f5c518"/></g>
        <g id="figArmR"><path d="M89 80 q11 4 13 27 l-11 3 q-3 -18 -9 -24 Z" fill="#e3000b"/><circle cx="93" cy="112" r="6.5" fill="#f5c518"/></g>
        <rect x="51" y="64" width="18" height="11" fill="#c8000a"/>
        <circle cx="60" cy="44" r="23" fill="#f5c518"/>
        <ellipse id="figStud" cx="60" cy="20" rx="9" ry="4.5" fill="#f5c518" stroke="#d9ad10" stroke-width="2"/>
        <circle cx="52" cy="43" r="3" fill="#20242b"/><circle cx="68" cy="43" r="3" fill="#20242b"/>
        <path id="figMouth" d="M51 52 q9 8 18 0" fill="none" stroke="#20242b" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <script>window.THEME_ID = "62-lego";</script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script>
  (function(){
    "use strict";
    const P=CJCData.profile,t=CJCData.t.bind(CJCData),esc=CJCData.escapeHtml;
    const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const $=id=>document.getElementById(id);
    let articles=[],projects=[],filterKey="all";
    const L=()=>CJCData.lang();
    const tr=o=>o[L()]||o.en;
    const BC=['#e3000b','#0a6fdc','#f5c518','#2aa63c']; // brick colors
    const BT=['#fff','#fff','#5b4a00','#fff'];
    const brickColors=['var(--red)','var(--blue)','var(--yellow)','var(--green)'];
    const brickText=['#fff','#fff','#5b4a00','#fff'];
    const figName={en:'Bricky',zh:'砖砖'};

    /* ---- brick-letter name ---- */
    function buildName(){
      const nm=t(P.name); const box=$('name'); box.setAttribute('aria-label',nm);
      let html='',k=0;
      for(const ch of nm){
        if(ch===' '){ html+='<span class="sp"></span>'; continue; }
        const c=BC[k%4], tc=BT[k%4];
        html+=`<span class="bl" style="background:${c};color:${tc};--bc:${c}">${esc(ch)}</span>`; k++;
      }
      box.innerHTML=html;
    }

    /* ================= CONTENT RENDER ================= */
    function renderStatic(){
      $('nav').innerHTML=[
        ['about','nav_about'],['skills','nav_courses'],['courses','core_courses'],['projects','nav_portfolio'],
        ['articles','nav_article'],['certificates','nav_certificate'],['contact','nav_contact']
      ].map(([id,k])=>`<a href="#${id}">${esc(t(P.ui[k]))}</a>`).join('');
      $('greet').innerHTML='<i class="fa fa-magic"></i> '+esc(t(P.greeting));
      buildName();
      $('role').textContent=t(P.role);
      $('tag').textContent=t(P.title);
      const cv=$('cvBtn'); cv.href=t(P.cv); cv.querySelector('span').textContent=t(P.ui.download_cv);
      $('ghBtn').href=P.contact.github;
      $('portrait').src=P.avatar; $('portrait').onerror=function(){this.src=P.avatarAlt;};
      $('smash-lbl').textContent=L()==='zh'?'砸碎重建':'SMASH!';

      $('l-about').textContent=t(P.ui.about_me);
      $('l-edu').textContent=t(P.ui.education_bg);
      $('l-skills').textContent=t(P.ui.core_tech);
      $('l-courses').textContent=t(P.ui.core_courses);
      $('l-exp').textContent=t(P.ui.internship_exp);
      $('l-projects').textContent=t(P.ui.latest_projects);
      $('l-articles').textContent=t(P.ui.latest_articles);
      $('l-certs').textContent=t(P.ui.certificates);
      $('l-contact').textContent=t(P.ui.get_in_touch);

      $('bio').innerHTML=P.bio.map(b=>`<p>${esc(t(b))}</p>`).join('');
      $('loc').innerHTML=`<i class="fa fa-map-marker"></i> ${esc(t(P.location))}`;

      $('edu').innerHTML=P.education.map(e=>`
        <div class="rowi"><div class="studrow"></div><div class="p">${esc(e.period)}</div>
        <h3>${esc(t(e.school))}</h3><div class="s">${esc(t(e.degree))} — ${esc(t(e.note))}</div></div>`).join('');

      $('skills-box').innerHTML=P.skills.map((s,i)=>{
        const c=brickColors[i%4], tc=brickText[i%4];
        return `<div class="sk" style="background:${c};color:${tc};--sc:${c}"><div class="studrow"></div>
          <div class="n">BRICK ${String(i+1).padStart(2,'0')}</div><div class="v">${esc(s)}</div></div>`;
      }).join('');
      $('tags').innerHTML=P.skillTags.map(x=>`<span>${esc(x)}</span>`).join('');

      $('courses-box').innerHTML=P.courses.map(c=>`
        <div class="course"><div class="studrow"></div><div class="ic"><i class="fa ${esc(c.icon)}"></i></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div>`).join('');

      $('exp').innerHTML=P.experience.map(x=>`
        <div class="rowi"><div class="studrow"></div><div class="p">${esc(x.period)}</div>
        <h3>${esc(t(x.role))} · ${esc(t(x.company))}</h3>
        <div class="s">${esc(t(x.summary))}</div>
        <ul>${x.bullets.map(b=>`<li>${esc(t(b))}</li>`).join('')}</ul></div>`).join('');

      $('certs').innerHTML=P.certificates.map(c=>`
        <div class="cert"><div class="studrow"></div><img src="${esc(c.image)}" alt="${esc(t(c.title))}" onerror="this.src='/index_page/img/blogs/1.jpg'">
        <div class="ct"><div class="meta"><span>${esc(t(c.tag))}</span><span>${esc(t(c.date))}</span></div>
        <h4>${esc(t(c.title))}</h4><p>${esc(t(c.desc))}</p></div></div>`).join('');

      $('cinfo').innerHTML=[
        ['Email',P.contact.email,'mailto:'+P.contact.email],
        ['Phone',P.contact.phone,P.contact.phoneHref],
        ['GitHub','@'+P.contact.githubUser,P.contact.github],
        ['WeChat','QR ↗',P.contact.wechatQrPage]
      ].map(([k,v,h])=>`<a href="${esc(h)}" target="_blank" rel="noopener"><span>${esc(k)}</span><span>${esc(v)}</span></a>`).join('');
      $('lb-name').textContent=t(P.ui.name_placeholder); $('lb-email').textContent=t(P.ui.email_placeholder); $('lb-msg').textContent=t(P.ui.msg_placeholder);
      $('cf-name').placeholder=t(P.ui.name_placeholder);
      $('cf-email').placeholder=t(P.ui.email_placeholder);
      $('cf-msg').placeholder=t(P.ui.msg_placeholder);
      $('cf-send').textContent=t(P.ui.send);

      $('fsoc').innerHTML=`
        <a href="${P.contact.github}" target="_blank" rel="noopener">GitHub</a>
        <a href="mailto:${P.contact.email}">Email</a>
        <a href="${P.contact.wechatQrPage}">WeChat</a>
        <a href="/admin.html">${esc(t(P.ui.admin_panel))}</a>`;
      $('foot-desc').textContent=t(P.ui.footer_desc);
      const icp=$('foot-icp'); icp.textContent=P.icp; icp.href=P.icpUrl;

      $('filters').innerHTML=P.articleFilters.map(f=>
        `<button data-k="${esc(f.key)}" class="${f.key===filterKey?'active':''}">${esc(t(f.label))}</button>`).join('');
      $('filters').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
        filterKey=b.dataset.k; renderStatic(); renderArticles();
      }));
    }

    function renderProjects(){
      const box=$('projects-box');
      if(!projects.length){ box.innerHTML=`<div class="load-note">${esc(t(P.ui.no_projects))}</div>`; return; }
      box.innerHTML=projects.map(p=>`
        <a class="card" href="${esc(p.href)}"><div class="cbar"></div>
          <div class="cbody">
            <div class="ctag"><span>${esc(t(P.ui.tech_stack))}</span><span>${esc(p.dateText())}</span></div>
            <h4>${esc(p.localTitle())}</h4>
            <p class="tech">${esc(p.tech_stack||'')}</p>
            <p>${esc(p.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.view_project))} →</span>
          </div></a>`).join('');
    }
    function renderArticles(){
      const box=$('articles-box');
      const list=CJCData.filterArticles(articles,filterKey);
      if(!articles.length){ box.innerHTML=`<div class="load-note">${esc(t(P.ui.loading_articles))}</div>`; return; }
      if(!list.length){ box.innerHTML=`<div class="load-note">${esc(t(P.ui.no_articles))}</div>`; return; }
      box.innerHTML=list.map(a=>`
        <a class="card" href="${esc(a.href)}"><div class="cbar"></div>
          <div class="cover"><img src="${esc(a.cover_image||'')}" onerror="this.src='/index_page/img/blogs/1.jpg'" alt=""></div>
          <div class="cbody">
            <div class="ctag"><span>${esc(a.category||'')}</span><span>${esc(a.dateText())}</span></div>
            <h4>${esc(a.localTitle())}</h4>
            <p>${esc(a.localSummary()||'')}</p>
            <span class="more">${esc(t(P.ui.read_more))} →</span>
          </div></a>`).join('');
    }
    async function loadDynamic(){
      try{ projects=await CJCData.fetchProjects(); renderProjects(); }
      catch(e){ $('projects-box').innerHTML=`<div class="load-note">⚠ ${esc(t(P.ui.no_projects))}</div>`; }
      try{ articles=await CJCData.fetchArticles(); renderArticles(); }
      catch(e){ $('articles-box').innerHTML=`<div class="load-note">⚠ Failed to load / 加载失败</div>`; }
    }

    $('cf').addEventListener('submit',async(e)=>{
      e.preventDefault();
      const f=e.target,s=$('cf-status');
      s.style.color='var(--mut)'; s.textContent=t(P.ui.sending);
      try{ const r=await CJCData.sendContact({name:f.name.value,email:f.email.value,message:f.message.value,website:f.website.value});
        s.style.color='var(--green)'; s.textContent=(r.message||'Sent!'); f.reset(); brickySay(SAY.thanks); }
      catch(err){ s.style.color='var(--red)'; s.textContent=err.message; }
    });

    /* ================= ASSEMBLE / BUILD ================= */
    const builds=Array.from(document.querySelectorAll('.build'));
    function assembleInitial(){
      if(reduce){ builds.forEach(b=>b.classList.add('set')); revealLetters(true); return; }
      // hero + name build immediately, panels via observer
      const hero=document.querySelector('.hero .build');
      setTimeout(()=>{ if(hero) hero.classList.add('set'); revealLetters(false); }, 120);
      const io=new IntersectionObserver((es)=>{
        es.forEach(e=>{ if(e.isIntersecting){ const el=e.target; io.unobserve(el);
          setTimeout(()=>el.classList.add('set'), 60); } });
      },{threshold:0.12,rootMargin:'0px 0px -8% 0px'});
      builds.forEach(b=>{ if(b!==hero) io.observe(b); });
    }
    function revealLetters(instant){
      const ls=$('name').querySelectorAll('.bl');
      ls.forEach((l,i)=>{ if(instant){ l.classList.add('set'); } else { setTimeout(()=>l.classList.add('set'), 180+i*70); } });
    }

    /* ================= SMASH + REBUILD ================= */
    let smashing=false;
    function smash(){
      brickySay(SAY.smash);
      if(reduce){ toast(T.rebuilt); return; }
      if(smashing) return; smashing=true;
      clack(9);
      builds.forEach(el=>{
        const rx=(Math.random()*2-1)*window.innerWidth*0.5;
        const ry=(Math.random()*2-1)*260 + 120;
        const rr=(Math.random()*2-1)*220;
        el.style.transition='transform .55s cubic-bezier(.5,.1,.75,.3),opacity .5s ease';
        el.style.transform=`translate(${rx.toFixed(0)}px,${ry.toFixed(0)}px) rotate(${rr.toFixed(0)}deg) scale(.6)`;
        el.style.opacity='.1';
        el.classList.remove('set');
      });
      $('name').querySelectorAll('.bl').forEach(l=>l.classList.remove('set'));
      figJump();
      setTimeout(()=>{
        clack(6);
        builds.forEach((el,i)=>{ setTimeout(()=>{
          el.style.transition='transform .6s cubic-bezier(.34,1.7,.5,1),opacity .4s ease';
          el.style.transform='none'; el.style.opacity='1';
        }, i*55); });
        revealLetters(false);
        toast(T.rebuilt);
        setTimeout(()=>{ builds.forEach(el=>{el.style.transition='';el.style.transform='';el.style.opacity='';el.classList.add('set');}); smashing=false; }, 900);
      }, 640);
    }
    $('smashBtn').addEventListener('click',smash);

    /* ---- click clatter sound ---- */
    let AC=null;
    function clack(n){
      if(reduce) return;
      try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
        for(let i=0;i<n;i++){ const o=AC.createOscillator(),g=AC.createGain(); const ts=AC.currentTime+i*0.05+Math.random()*0.03;
          o.type='square'; o.frequency.value=180+Math.random()*260; o.connect(g); g.connect(AC.destination);
          g.gain.setValueAtTime(0.0001,ts); g.gain.exponentialRampToValueAtTime(0.05,ts+0.005); g.gain.exponentialRampToValueAtTime(0.0001,ts+0.06);
          o.start(ts); o.stop(ts+0.07); }
      }catch(e){}
    }

    /* ================= GOLDEN BRICK easter egg ================= */
    let goldFound=false;
    $('goldbrick').addEventListener('click',()=>{
      confettiBurst();
      brickySay(SAY.gold);
      const gf=$('goldfig');
      gf.innerHTML='<svg viewBox="0 0 120 150" width="180" role="img" aria-label="Golden secret minifigure">'
        +'<ellipse cx="60" cy="146" rx="34" ry="5" fill="rgba(0,0,0,.2)"/>'
        +'<rect x="40" y="112" width="18" height="32" rx="3" fill="#b8860b"/><rect x="62" y="112" width="18" height="32" rx="3" fill="#b8860b"/>'
        +'<path d="M38 72 h44 a7 7 0 0 1 7 7 v30 a5 5 0 0 1 -5 5 H36 a5 5 0 0 1 -5 -5 v-30 a7 7 0 0 1 7 -7 Z" fill="#e6b422"/>'
        +'<path d="M31 80 q-11 4 -13 27 l11 3 q3 -18 9 -24 Z" fill="#e6b422"/><path d="M89 80 q11 4 13 27 l-11 3 q-3 -18 -9 -24 Z" fill="#e6b422"/>'
        +'<circle cx="27" cy="112" r="6.5" fill="#ffe9a8"/><circle cx="93" cy="112" r="6.5" fill="#ffe9a8"/>'
        +'<rect x="51" y="64" width="18" height="11" fill="#c69100"/>'
        +'<circle cx="60" cy="44" r="23" fill="#ffd94a"/>'
        +'<ellipse cx="60" cy="20" rx="9" ry="4.5" fill="#ffd94a" stroke="#c69100" stroke-width="2"/>'
        +'<circle cx="52" cy="43" r="3" fill="#4a3c00"/><circle cx="68" cy="43" r="3" fill="#4a3c00"/>'
        +'<path d="M50 51 q10 10 20 0" fill="none" stroke="#4a3c00" stroke-width="3" stroke-linecap="round"/>'
        +'<text x="96" y="30" font-size="16">✨</text></svg>'
        +'<div class="gcap">'+esc(tr(T.goldCap))+'</div>';
      gf.classList.add('on'); gf.setAttribute('aria-hidden','false');
      if(!goldFound){ goldFound=true; toast(T.goldToast); }
      clearTimeout($('goldfig')._t); $('goldfig')._t=setTimeout(()=>{ gf.classList.remove('on'); }, 3200);
    });
    function confettiBurst(){
      if(reduce) return;
      const layer=$('confetti'); const cols=['#e3000b','#0a6fdc','#f5c518','#2aa63c','#e6b422'];
      for(let i=0;i<40;i++){ const b=document.createElement('div'); b.className='cbk';
        b.style.background=cols[(Math.random()*cols.length)|0];
        const x=50+(Math.random()*2-1)*10, y=50+(Math.random()*2-1)*8;
        b.style.left=x+'%'; b.style.top=y+'%';
        b.style.transition='transform '+(0.9+Math.random()*0.7)+'s cubic-bezier(.2,.6,.4,1),opacity .3s ease '+(0.7+Math.random()*0.5)+'s';
        layer.appendChild(b);
        requestAnimationFrame(()=>{ b.style.transform=`translate(${(Math.random()*2-1)*70}vw,${(Math.random()*70+20)}vh) rotate(${(Math.random()*720-360)}deg)`; b.style.opacity='0'; });
        setTimeout(()=>b.remove(),1700);
      }
    }

    /* ================= TOAST ================= */
    const T={
      rebuilt:{tt:{en:'REBUILT!',zh:'重建完成！'},ts:{en:'The world snapped back together.',zh:'整个世界又拼回来啦。'},em:'🧱'},
      goldToast:{tt:{en:'GOLD BRICK!',zh:'黄金砖块！'},ts:{en:'You found the secret golden minifig.',zh:'你发现了隐藏的黄金小人。'},em:'🏆'},
      goldCap:{en:'SECRET!',zh:'隐藏彩蛋！'}
    };
    let toastTimer=null;
    function toast(o){ $('toast-em').textContent=o.em; $('toast-tt').textContent=tr(o.tt); $('toast-ts').textContent=tr(o.ts);
      $('toast').classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('toast').classList.remove('on'),2600); }

    /* ================= MINIFIG COMPANION ================= */
    const SAY={
      hi:{en:"Hi! I'm Bricky, {n}'s builder. Scroll to snap this world together, or hit SMASH! 🧱",
          zh:"嗨！我是砖砖，{n} 的建造工。往下滑把世界拼起来，或者按「砸碎重建」！🧱"},
      smash:{en:"KABOOM! Watch it all come apart... and rebuild! 💥",zh:"轰！看它散开……然后重新拼好！💥"},
      gold:{en:"Whoa! A GOLDEN brick! You found the secret! ✨",zh:"哇！一块黄金砖！你找到隐藏彩蛋啦！✨"},
      thanks:{en:"Message built and shipped to {n}! 📮",zh:"留言已拼好，寄给 {n} 啦！📮"},
      about:{en:"Brick 01: this is {n} — builds clean, tidy little products! ",zh:"第 01 块：这位是 {n}——专造整洁优雅的小产品！"},
      education:{en:"Brick 02: {n} studies at some top schools! 🎓",zh:"第 02 块：{n} 在顶尖学校读书！🎓"},
      skills:{en:"Brick 03: stack up all of {n}'s tech bricks! 🧱",zh:"第 03 块：把 {n} 的技术砖都叠起来！🧱"},
      courses:{en:"Brick 04: the courses {n} mastered — all snapped in! 📚",zh:"第 04 块：{n} 学透的课程，全都拼好啦！📚"},
      experience:{en:"Brick 05: {n} built real stuff at Xnew! 💼",zh:"第 05 块：{n} 在 Xnew 造过真东西！💼"},
      projects:{en:"Brick 06: {n} built {c} sets — tap one to open! 🎁",zh:"第 06 块：{n} 造了 {c} 套作品——点开看看！🎁"},
      articles:{en:"Brick 07: {n} wrote {c} instruction manuals (blogs)! ✏️",zh:"第 07 块：{n} 写了 {c} 本说明书（博客）！✏️"},
      certificates:{en:"Brick 08: shiny trophy bricks {n} earned! 🏅",zh:"第 08 块：{n} 赢得的奖杯砖块，闪闪的！🏅"},
      contact:{en:"Brick 09: snap a message together for {n}! 💬",zh:"第 09 块：给 {n} 拼一条留言吧！💬"}
    };
    function say(o){ return (o[L()]||o.en).replace('{n}',t(P.name)).replace('{c}', o===SAY.projects?projects.length:(o===SAY.articles?articles.length:'')); }
    const figSvg=$('figSvg');
    let figBubbleTimer=null;
    function brickySay(o,sticky){
      $('figWho').textContent=tr(figName)+' :';
      $('figSpeech').textContent=say(o);
      const b=$('figSpeechBox'); b.classList.remove('hide');
      clearTimeout(figBubbleTimer);
      if(!sticky && window.innerWidth<=760){ figBubbleTimer=setTimeout(()=>b.classList.add('hide'),5200); }
      wave();
    }
    function wave(){ if(reduce)return; figSvg.classList.remove('wave'); void figSvg.offsetWidth; figSvg.classList.add('wave'); }
    function figJump(){ if(reduce)return; figSvg.classList.remove('jump'); void figSvg.offsetWidth; figSvg.classList.add('jump'); }
    figSvg.addEventListener('click',e=>{ e.preventDefault(); figJump(); wave(); happyMouth(); });
    function happyMouth(){ $('figMouth').setAttribute('d','M50 50 q10 12 20 0'); setTimeout(()=>$('figMouth').setAttribute('d','M51 52 q9 8 18 0'),1200); }

    // walk along the baseplate as you scroll + speech
    let walkTimer=null, curSec='';
    function onScroll(){
      if(!reduce){
        const max=Math.max(1,document.documentElement.scrollHeight-window.innerHeight);
        const fr=Math.max(0,Math.min(1,window.scrollY/max));
        const range=Math.min(window.innerWidth*0.42, 360);
        $('fig').style.left=(14+fr*range)+'px';
        const fs=$('figSvg'); fs.classList.add('walking');
        clearTimeout(walkTimer); walkTimer=setTimeout(()=>fs.classList.remove('walking'),260);
      }
      // section narration
      let best=null,bestR=0;
      document.querySelectorAll('section[id]').forEach(sec=>{
        const r=sec.getBoundingClientRect(); const vis=Math.min(r.bottom,innerHeight)-Math.max(r.top,0);
        if(vis>bestR){bestR=vis;best=sec.id;}
      });
      if(best && best!==curSec && SAY[best]){ curSec=best; brickySay(SAY[best]); }
    }
    window.addEventListener('scroll',onScroll,{passive:true});

    /* ================= INIT ================= */
    document.addEventListener('DOMContentLoaded',()=>{
      CJCData.setTheme(window.THEME_ID);
      renderStatic();
      CJCData.mountSwitcher({accent:'#e3000b'});
      CJCData.onLang(()=>{ renderStatic(); revealLetters(true); renderProjects(); renderArticles();
        brickySay(curSec&&SAY[curSec]?SAY[curSec]:SAY.hi,true); });
      assembleInitial();
      brickySay(SAY.hi,true);
      loadDynamic();
    });
  })();
  </script>
</body>
</html>

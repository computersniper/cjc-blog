<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CJC Blog Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Toast UI Editor CSS -->
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        .admin-container { max-width: 1000px; margin: auto; display: none; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; }
        .toastui-editor-defaultUI { background: white; }
        #login-container { max-width: 400px; margin: 100px auto; }
        #login-container .card { padding: 30px; }
    </style>
</head>
<body>
    <!-- Login -->
    <div id="login-container">
        <div class="card">
            <h4 class="text-center mb-3">Admin Login</h4>
            <div id="loginError" class="alert alert-danger d-none"></div>
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" id="loginUsername" autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="loginPassword" autocomplete="current-password">
            </div>
            <button class="btn btn-primary w-100" id="loginBtn">Login</button>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div class="admin-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">Admin Dashboard</h2>
            <button class="btn btn-outline-danger btn-sm" id="logoutBtn">Logout</button>
        </div>
        
        <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="articles-tab" data-bs-toggle="tab" data-bs-target="#articles" type="button" role="tab">Articles</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="projects-tab" data-bs-toggle="tab" data-bs-target="#projects" type="button" role="tab">Projects</button>
            </li>
        </ul>

        <div class="tab-content" id="myTabContent">
            <!-- Articles Tab -->
            <div class="tab-pane fade show active" id="articles" role="tabpanel">
                <div class="card p-4 mb-4">
                    <h4>Create / Edit Article</h4>
                    <form id="articleForm">
                        <input type="hidden" id="articleId">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Title</label>
                                <input type="text" class="form-control" id="a_title" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Category</label>
                                <input type="text" class="form-control" id="a_category" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Summary</label>
                            <textarea class="form-control" id="a_summary" rows="2" required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Cover Image URL</label>
                                <input type="text" class="form-control" id="a_cover" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Read URL (Optional, overrides content)</label>
                                <input type="text" class="form-control" id="a_url">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Article Content</label>
                            <div id="article-editor"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Article</button>
                        <button type="button" class="btn btn-secondary" onclick="clearArticleForm()">Clear</button>
                    </form>
                </div>
                <div class="card p-4">
                    <h4>Articles List</h4>
                    <table class="table">
                        <thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Actions</th></tr></thead>
                        <tbody id="articlesTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- Projects Tab -->
            <div class="tab-pane fade" id="projects" role="tabpanel">
                <div class="card p-4 mb-4">
                    <h4>Create / Edit Project</h4>
                    <form id="projectForm">
                        <input type="hidden" id="projectId">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Title</label>
                                <input type="text" class="form-control" id="p_title" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Category</label>
                                <input type="text" class="form-control" id="p_category" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tech Stack</label>
                            <input type="text" class="form-control" id="p_tech" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Summary</label>
                            <textarea class="form-control" id="p_summary" rows="2" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Cover Image URL</label>
                            <input type="text" class="form-control" id="p_cover" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Project Content</label>
                            <div id="project-editor"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Project</button>
                        <button type="button" class="btn btn-secondary" onclick="clearProjectForm()">Clear</button>
                    </form>
                </div>
                <div class="card p-4">
                    <h4>Projects List</h4>
                    <table class="table">
                        <thead><tr><th>ID</th><th>Title</th><th>Tech Stack</th><th>Actions</th></tr></thead>
                        <tbody id="projectsTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <script>
        const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:')
            ? 'http://127.0.0.1:8000'
            : `${window.location.origin}/api`;

        const loginContainer = document.getElementById('login-container');
        const adminContainer = document.querySelector('.admin-container');
        const loginError = document.getElementById('loginError');

        function getToken() { return localStorage.getItem('admin_token'); }
        function setToken(t) { localStorage.setItem('admin_token', t); }
        function clearToken() { localStorage.removeItem('admin_token'); }

        function authHeaders() {
            const token = getToken();
            return token ? { 'Authorization': `Bearer ${token}` } : {};
        }

        async function apiFetch(url, options = {}) {
            options.headers = { ...(options.headers || {}), ...authHeaders() };
            const res = await fetch(url, options);
            if (res.status === 401) { logout(); throw new Error('Unauthorized'); }
            return res;
        }

        async function verifyAuth() {
            const token = getToken();
            if (!token) return false;
            try {
                const res = await fetch(`${API_URL}/auth/verify`, { headers: { 'Authorization': `Bearer ${token}` } });
                return res.ok;
            } catch { return false; }
        }

        function showLogin() {
            adminContainer.style.display = 'none';
            loginContainer.style.display = '';
            clearToken();
        }

        function showAdmin() {
            loginContainer.style.display = 'none';
            adminContainer.style.display = '';
            loadArticles();
            loadProjects();
        }

        async function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            loginError.classList.add('d-none');
            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (!res.ok) {
                    loginError.textContent = 'Invalid username or password';
                    loginError.classList.remove('d-none');
                    return;
                }
                const data = await res.json();
                setToken(data.access_token);
                showAdmin();
            } catch (e) {
                loginError.textContent = 'Login failed: ' + e.message;
                loginError.classList.remove('d-none');
            }
        }

        function logout() { showLogin(); }

        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
        document.getElementById('logoutBtn').addEventListener('click', logout);

        // Initialize Toast UI Editors
        const Editor = toastui.Editor;
        const articleEditor = new Editor({
            el: document.querySelector('#article-editor'),
            height: '400px',
            initialEditType: 'wysiwyg',
            previewStyle: 'vertical'
        });
        const projectEditor = new Editor({
            el: document.querySelector('#project-editor'),
            height: '400px',
            initialEditType: 'wysiwyg',
            previewStyle: 'vertical'
        });

        // --- Articles Logic ---
        async function loadArticles() {
            const res = await apiFetch(`${API_URL}/articles/`);
            const data = await res.json();
            const tbody = document.getElementById('articlesTable');
            tbody.innerHTML = '';
            data.forEach(a => {
                tbody.innerHTML += `<tr>
                    <td>${a.id}</td><td>${a.title}</td><td>${a.category}</td>
                    <td>
                        <button class="btn btn-sm btn-info" onclick="editA(${a.id})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="delA(${a.id})">Del</button>
                    </td></tr>`;
            });
        }

        async function editA(id) {
            const res = await apiFetch(`${API_URL}/articles/${id}`);
            const a = await res.json();
            document.getElementById('articleId').value = a.id;
            document.getElementById('a_title').value = a.title;
            document.getElementById('a_category').value = a.category;
            document.getElementById('a_summary').value = a.summary;
            document.getElementById('a_cover').value = a.cover_image;
            document.getElementById('a_url').value = a.read_url || '';
            articleEditor.setHTML(a.content || '');
            window.scrollTo(0, 0);
        }

        async function delA(id) {
            if(confirm("Delete article?")) {
                await apiFetch(`${API_URL}/articles/${id}`, { method: 'DELETE' });
                loadArticles();
            }
        }

        function clearArticleForm() {
            document.getElementById('articleForm').reset();
            document.getElementById('articleId').value = '';
            articleEditor.setHTML('');
        }

        document.getElementById('articleForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('articleId').value;
            const payload = {
                title: document.getElementById('a_title').value,
                category: document.getElementById('a_category').value,
                summary: document.getElementById('a_summary').value,
                cover_image: document.getElementById('a_cover').value,
                read_url: document.getElementById('a_url').value,
                content: articleEditor.getHTML()
            };
            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/articles/${id}` : `${API_URL}/articles/`;
            await apiFetch(url, { method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
            clearArticleForm();
            loadArticles();
        };

        // --- Projects Logic ---
        function clearProjectForm() {
            document.getElementById('projectForm').reset();
            document.getElementById('projectId').value = '';
            projectEditor.setHTML('');
        }

        async function loadProjects() {
            const res = await apiFetch(`${API_URL}/projects/`);
            const data = await res.json();
            const tbody = document.getElementById('projectsTable');
            tbody.innerHTML = '';
            data.forEach(p => {
                tbody.innerHTML += `<tr>
                    <td>${p.id}</td><td>${p.title}</td><td>${p.tech_stack}</td>
                    <td>
                        <button class="btn btn-sm btn-info" onclick="editP(${p.id})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="delP(${p.id})">Del</button>
                    </td></tr>`;
            });
        }

        async function editP(id) {
            const res = await apiFetch(`${API_URL}/projects/${id}`);
            const p = await res.json();
            document.getElementById('projectId').value = p.id;
            document.getElementById('p_title').value = p.title;
            document.getElementById('p_category').value = p.category;
            document.getElementById('p_tech').value = p.tech_stack;
            document.getElementById('p_summary').value = p.summary;
            document.getElementById('p_cover').value = p.cover_image;
            
            projectEditor.setHTML(p.content || '');
            
            window.scrollTo(0, 0);
        }

        async function delP(id) {
            if(confirm("Delete project?")) {
                await apiFetch(`${API_URL}/projects/${id}`, { method: 'DELETE' });
                loadProjects();
            }
        }

        document.getElementById('projectForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('projectId').value;
            
            const payload = {
                title: document.getElementById('p_title').value,
                category: document.getElementById('p_category').value,
                tech_stack: document.getElementById('p_tech').value,
                summary: document.getElementById('p_summary').value,
                cover_image: document.getElementById('p_cover').value,
                content: projectEditor.getHTML()
            };
            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/projects/${id}` : `${API_URL}/projects/`;
            await apiFetch(url, { method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
            clearProjectForm();
            loadProjects();
        };

        // Init - check auth first
        (async () => {
            const ok = await verifyAuth();
            if (ok) { showAdmin(); } else { showLogin(); }
        })();
    </script>
</body>
</html>

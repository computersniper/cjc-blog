<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Theme Gallery · Cai Jiechao</title>
  <link rel="icon" href="/index_page/img/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#0b0d12; --panel:#151922; --panel2:#1c2230; --line:rgba(255,255,255,.08);
      --text:#eef1f6; --muted:#9aa4b6; --accent:#7c8cff;
    }
    @media (prefers-color-scheme: light){
      :root{ --bg:#f6f7fb; --panel:#ffffff; --panel2:#f0f2f7; --line:rgba(10,14,25,.09);
             --text:#141821; --muted:#5b6472; --accent:#4b5cff; }
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:var(--bg); color:var(--text);
      font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased; min-height:100vh;
    }
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1240px;margin:0 auto;padding:28px 22px 80px}
    header.top{
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      flex-wrap:wrap;margin-bottom:10px;
    }
    .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;letter-spacing:.02em}
    .brand span{color:var(--accent)}
    .top-actions{display:flex;gap:10px}
    .btn{
      cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);
      border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;font-family:inherit;
      transition:transform .15s,border-color .15s,background .15s;
    }
    .btn:hover{transform:translateY(-1px);border-color:var(--accent)}
    .btn.primary{background:var(--accent);color:#fff;border-color:transparent}
    .hero{padding:22px 0 30px;border-bottom:1px solid var(--line);margin-bottom:30px}
    .hero h1{
      font-family:'Space Grotesk',sans-serif;font-weight:700;line-height:1.05;
      font-size:clamp(30px,6vw,54px);margin:0 0 12px;letter-spacing:-.01em;
    }
    .hero h1 em{font-style:normal;color:var(--accent)}
    .hero p{color:var(--muted);max-width:640px;font-size:clamp(14px,2.4vw,17px);line-height:1.6;margin:0}
    .count{color:var(--muted);font-size:13px;margin-top:14px}
    .grid{
      display:grid;gap:20px;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    }
    .card{
      background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;
      display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s,border-color .18s;
      position:relative;
    }
    .card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.28);border-color:var(--accent)}
    .preview{
      height:150px;position:relative;display:flex;align-items:center;justify-content:center;
      overflow:hidden;border-bottom:1px solid var(--line);
    }
    .preview .pv-name{
      font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;
      text-align:center;padding:0 16px;line-height:1.15;
    }
    .preview .pv-dot{position:absolute;bottom:12px;right:14px;width:26px;height:26px;border-radius:50%;
      box-shadow:0 2px 8px rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.6)}
    .badge{
      position:absolute;top:12px;left:12px;background:rgba(0,0,0,.55);color:#fff;
      font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
      padding:5px 9px;border-radius:999px;backdrop-filter:blur(6px);
    }
    .body{padding:16px 17px 18px;display:flex;flex-direction:column;gap:9px;flex:1}
    .row1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
    .t-name{font-weight:700;font-size:17px}
    .t-idx{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
    .t-blurb{color:var(--muted);font-size:13.5px;line-height:1.55;flex:1}
    .t-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
    .chip{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:4px 9px;border-radius:999px}
    .use{font-size:12.5px;font-weight:700;color:var(--accent);display:inline-flex;align-items:center;gap:5px}
    .card.active{border-color:var(--accent)}
    .card.active .badge{background:var(--accent)}
    footer.foot{margin-top:44px;color:var(--muted);font-size:12.5px;text-align:center;line-height:1.8}
    footer.foot a{color:var(--muted);border-bottom:1px dotted var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="#" id="brandLink">Cai<span>Jiechao</span></a>
      <div class="top-actions">
        <button class="btn" id="langBtn">中文</button>
        <a class="btn primary" id="backBtn" href="/">← Home</a>
      </div>
    </header>

    <section class="hero">
      <h1 id="galleryTitle">Choose your <em>homepage</em>.</h1>
      <p id="gallerySub">Twenty independently designed homepages — one shared source of truth. Your content stays identical; only the world around it changes. Pick one and it becomes your default.</p>
      <div class="count" id="countLine"></div>
    </section>

    <main class="grid" id="grid"></main>

    <footer class="foot" id="foot"></footer>
  </div>

  <script src="/shared/profile.js"></script>
  <script src="/shared/site-data.js"></script>
  <script src="/themes/registry.js"></script>
  <script>
    const I18N = {
      title:   { en: ['Choose your ', 'homepage', '.'], zh: ['选择你的', '主页', '。'] },
      sub:     { en: 'Twenty independently designed homepages — one shared source of truth. Your content stays identical; only the world around it changes. Pick one and it becomes your default.',
                 zh: '二十个各自独立设计的主页，共享同一份数据源。你的内容始终一致，只有它周围的世界在变。选中一个，它就成为你的默认主页。' },
      count:   { en: n => `${n} styles · your current pick is highlighted`, zh: n => `共 ${n} 种风格 · 高亮的是你当前的选择` },
      use:     { en: 'Use this →', zh: '使用此风格 →' },
      current: { en: 'Current', zh: '当前' },
      home:    { en: '← Home', zh: '← 返回主页' },
      foot:    { en: 'One profile, many worlds · edit /shared/profile.js to update every theme at once.',
                 zh: '同一份资料，多种世界 · 编辑 /shared/profile.js 即可一次更新所有主题。' },
    };

    function T(field){ return CJCData.t(field); }

    function galleryThemes(){
      const themes = [...window.CJC_THEMES];
      const generativeIndex = themes.findIndex((theme) => theme.id === '71-generative-lab');
      const glassIndex = themes.findIndex((theme) => theme.id === '03-glass');
      if (generativeIndex >= 0 && glassIndex >= 0) {
        [themes[generativeIndex], themes[glassIndex]] = [themes[glassIndex], themes[generativeIndex]];
      }

      const afterEditorial = [
        '67-orange-editorial',
        '68-sanctuary',
        '69-violet-os',
        '70-warm-editorial',
        '72-paper-journal',
      ];
      const finalThemes = [
        '09-retro90s',
        '12-neumorphism',
        '10-aero',
        '17-organic',
        '21-liquidglass',
      ];
      const relocated = new Set([...afterEditorial, ...finalThemes]);
      const ordered = themes.filter((theme) => !relocated.has(theme.id));
      const byId = new Map(themes.map((theme) => [theme.id, theme]));
      const editorialIndex = ordered.findIndex((theme) => theme.id === '05-editorial');
      ordered.splice(editorialIndex + 1, 0, ...afterEditorial.map((id) => byId.get(id)).filter(Boolean));
      ordered.push(...finalThemes.map((id) => byId.get(id)).filter(Boolean));
      return ordered;
    }

    function render(){
      const lang = CJCData.lang();
      const active = CJCData.getTheme();
      const themes = galleryThemes();

      // header text
      const [a,b,c] = I18N.title[lang];
      document.getElementById('galleryTitle').innerHTML =
        `${CJCData.escapeHtml(a)}<em>${CJCData.escapeHtml(b)}</em>${CJCData.escapeHtml(c)}`;
      document.getElementById('gallerySub').textContent = I18N.sub[lang];
      document.getElementById('countLine').textContent = I18N.count[lang](themes.length);
      document.getElementById('langBtn').textContent = lang === 'en' ? '中文' : 'EN';
      document.getElementById('backBtn').textContent = I18N.home[lang];
      document.getElementById('backBtn').href = CJCData.themeUrl(active);
      document.getElementById('foot').textContent = I18N.foot[lang];
      document.getElementById('brandLink').href = CJCData.themeUrl(active);

      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      themes.forEach((th, i) => {
        const isActive = th.id === active;
        const card = document.createElement('a');
        card.className = 'card' + (isActive ? ' active' : '');
        card.href = CJCData.themeUrl(th.id);
        card.addEventListener('click', () => { CJCData.setTheme(th.id); });
        card.innerHTML = `
          <div class="preview" style="background:${th.bg}">
            ${isActive ? `<span class="badge">${CJCData.escapeHtml(I18N.current[lang])}</span>` : ''}
            <div class="pv-name" style="color:${th.fg}">${CJCData.escapeHtml(CJCData.t(th.name))}</div>
            <span class="pv-dot" style="background:${th.accent}"></span>
          </div>
          <div class="body">
            <div class="row1">
              <span class="t-name">${CJCData.escapeHtml(CJCData.t(th.name))}</span>
              <span class="t-idx">${String(i).padStart(2,'0')}</span>
            </div>
            <div class="t-blurb">${CJCData.escapeHtml(CJCData.t(th.blurb))}</div>
            <div class="t-foot">
              <span class="chip">${CJCData.escapeHtml(th.font)}</span>
              <span class="use">${CJCData.escapeHtml(I18N.use[lang])}</span>
            </div>
          </div>`;
        grid.appendChild(card);
      });
    }

    document.getElementById('langBtn').addEventListener('click', () => { CJCData.toggleLang(); render(); });
    document.addEventListener('DOMContentLoaded', render);
    render();
  </script>
</body>
</html>

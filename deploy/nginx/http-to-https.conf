# Use this as the port 80 server block for caijiechao.com.
# The HTTPS server block should keep serving the site and include
# deploy/nginx/security-headers.conf.

server {
    listen 80;
    listen [::]:80;
    server_name www.caijiechao.com caijiechao.com;

    return 301 https://$host$request_uri;
}

# Include this file inside the www.caijiechao.com server block.
# If a location block has its own add_header directives, include this file in
# that location too because nginx does not inherit add_header from its parent.

set $cjc_content_security_policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://code.jquery.com https://unpkg.com https://cdn.jsdelivr.net https://uicdn.toast.com https://common.cnblogs.com https://cdn.bootcdn.net https://cdn.bootcss.com https://tenor.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://stackpath.bootstrapcdn.com https://fonts.googleapis.com https://cdn.jsdelivr.net https://uicdn.toast.com https://unpkg.com https://use.fontawesome.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com https://stackpath.bootstrapcdn.com https://use.fontawesome.com; connect-src 'self' https://assets4.lottiefiles.com; media-src 'self' data: blob: https:; frame-src 'self' https://tenor.com https://*.tenor.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

add_header Content-Security-Policy "$cjc_content_security_policy" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-XSS-Protection "1; mode=block" always;
